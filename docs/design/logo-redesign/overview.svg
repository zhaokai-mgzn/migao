  <text x="600" y="420" text-anchor="middle" font-size="13" fill="#595959">一眼认出布艺行业</text>

  <!-- ══════════ 面板 C ══════════ -->
  <rect x="850" y="90" width="300" height="440" rx="20" fill="#FAFAFA"/>
  <g transform="translate(947.2 130) scale(2.2)">
    <rect x="2" y="2" width="44" height="44" rx="13.5" fill="url(#oc)"/>
    <circle cx="24" cy="8.4" r="6.4" fill="#FFC53D" fill-opacity="0.22"/>
    <path d="M11.5 34.7V16.9Q11.5 14.7 13.7 14.7H18.4L22.9 25.9L24 14.7L25.1 25.9L29.6 14.7H34.3Q36.5 14.7 36.5 16.9V34.7" stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M24 4.4C24.9 6.9 26.2 7.9 28.4 8.4C26.2 8.9 24.9 9.9 24 12.4C23.1 9.9 21.8 8.9 19.6 8.4C21.8 7.9 23.1 6.9 24 4.4Z" fill="#FFC53D"/>
