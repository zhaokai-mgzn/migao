  <line x1="890" y1="332" x2="1110" y2="332" stroke="#E8E8E8"/>
  <text x="1000" y="366" text-anchor="middle" font-size="17" font-weight="700" fill="#141414">方向 C · AI 星 M</text>
  <text x="1000" y="396" text-anchor="middle" font-size="13" fill="#595959">拱形 M 托起金色星芒</text>
  <text x="1000" y="420" text-anchor="middle" font-size="13" fill="#595959">星在峰上，寓意「高」与 AI</text>

  <defs>
    <linearGradient id="oa" x1="2" y1="2" x2="46" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6E8CFF"/>
      <stop offset="1" stop-color="#2F54EB"/>
    </linearGradient>
    <linearGradient id="ob" x1="2" y1="2" x2="46" y2="46" gradientUnits="userSpaceOnUse">
