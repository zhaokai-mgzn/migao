  <text x="600" y="304" text-anchor="middle" font-size="10" font-weight="600" letter-spacing="5" fill="#8C8C8C" font-family="'Helvetica Neue',Arial,sans-serif">MIGAO</text>
  <line x1="490" y1="332" x2="710" y2="332" stroke="#E8E8E8"/>
