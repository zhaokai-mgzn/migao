  <text x="200" y="280" text-anchor="middle" font-size="26" font-weight="700" fill="#262626">米高</text>
  <text x="200" y="304" text-anchor="middle" font-size="10" font-weight="600" letter-spacing="5" fill="#8C8C8C" font-family="'Helvetica Neue',Arial,sans-serif">MIGAO</text>
  <line x1="90" y1="332" x2="310" y2="332" stroke="#E8E8E8"/>
