name: Xiaobu Acceptance (小布 C 端验收)
permissions:
  contents: read
  issues: write

on:
  workflow_dispatch:
    inputs:
      shards:
        description: '分片数（每片一个 job + 一套 docker 栈）：1=不分片；normal 档建议 3'
        required: false
        default: '1'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
      tier:
        description: '评测档位：smoke（5 条，快）| normal（40 条 C 端全量，约 30-40min）'
        required: false
        default: smoke
        type: choice
        options:
          - smoke
          - normal
  # 2026-09-06 暂停定时调度（issue #2957）：连续 5+ 日 daily failure 且自动开 issue 制造噪音，
  # 待失败根因排查 + 本地验证提速落地后再恢复；期间保留 workflow_dispatch 手动触发。
  # schedule:
  #   # 每天 02:00 CST（UTC+8）= UTC 18:00，低峰期跑小布真实 LLM 能力回归
  #   - cron: '0 18 * * *'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # 分片矩阵（issue #3361 评测提速）：把用例集切成 N 份、每份一个 job（各自一套
  # docker 栈 → 天然隔离，评测语义不变）。为什么不用进程内并发：用例共享同一 DB
  # （同一批 fixture、同一个 debug 顾客），并发会让"谁先写订单/改商品价"变得不确定，
  # 而评测工具的可信度建立在可复现上。分片只减墙钟，不改语义。
  # 实测 C 端 normal：18 条 19m39s（单条失败的用例各重跑一次占 87%）→ 3 片约 1/3 墙钟。
  shards:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        env:
          SHARDS: ${{ github.event.inputs.shards || '1' }}
        run: |
          # 生成 [0, 1, ..., N-1]（按输入 shards 数）；非法值回落 1（不静默多跑）
          case "$SHARDS" in
            1|2|3|4|5|6) N="$SHARDS" ;;
            *) echo "::warning:: shards=$SHARDS 非法，回落 1"; N=1 ;;
          esac
          parts=""
          i=0
          while [ "$i" -lt "$N" ]; do
            parts="${parts:+$parts,}$i"
            i=$((i + 1))
          done
          echo "matrix={"shard":[${parts}],"total":[${N}]}" >> "$GITHUB_OUTPUT"
          echo "分片: ${N} 份"

  xiaobu-acceptance:
    needs: shards
    name: Xiaobu Acceptance (DEBUG 本地栈 + 真实 LLM)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.shards.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/ai-agent-service/requirements.txt

      - name: "Export dev RS256 keys for stack (issue #3270)"
        # admin-api 镜像内没有 rsa/private.pem（被 .gitignore 刻意排除），
        # 故用仓库已入库的**测试**密钥对，以 PEM 内容注入（多行值走 GITHUB_ENV 传递）。
        run: |
          KEY_DIR=backend/admin-api/src/test/resources/rsa
          test -f "$KEY_DIR/private.pem" || { echo "::error::缺少测试密钥 $KEY_DIR/private.pem"; exit 1; }
          test -f "$KEY_DIR/public.pem"  || { echo "::error::缺少测试密钥 $KEY_DIR/public.pem"; exit 1; }
          {
            echo "JWT_PRIVATE_KEY_PEM<<__PEM_EOF__"
            cat "$KEY_DIR/private.pem"
            echo "__PEM_EOF__"
            echo "JWT_PUBLIC_KEY_PEM<<__PEM_EOF__"
            cat "$KEY_DIR/public.pem"
            echo "__PEM_EOF__"
          } >> "$GITHUB_ENV"
          # ai-agent 用 JWT_PUBLIC_KEY 校验 admin-api 签发的 RS256 token；
          # 它在 config.py 里是必填项（非 DEBUG 校验），且 compose 里默认空串 →
          # 不注入会报「生产环境必须设置以下环境变量：JWT_PUBLIC_KEY」。
          # 这里给同一测试密钥对的公钥内容（单行 PEM → 用 tr 压成一行写入 env）。
          PUB_ONELINE=$(tr -d '\n' < "$KEY_DIR/public.pem")
          echo "JWT_PUBLIC_KEY=$PUB_ONELINE" >> "$GITHUB_ENV"
          echo "✅ 已导出 dev RS256 密钥（PEM 内容 + 公钥）"

      - name: "Start local stack (docker-compose: PG + Redis + admin-api + ai-agent DEBUG)"
        id: stack
        env:
          # ⚠️ deploy/docker-compose.yml 里 DEV_SERVICE_TOKEN 是 required 无默认值
          # （``${DEV_SERVICE_TOKEN:?...}``）——缺它 compose 直接插值失败，栈根本起不来。
          DEV_SERVICE_TOKEN: ${{ secrets.SMOKE_SERVICE_TOKEN || 'ci-service-token-placeholder' }}
          # ── RS256 密钥注入（issue #3270）──
          # 生产私钥不入库（.gitignore:79 **/rsa/private.pem），CI clone 后镜像内无该文件
          # → JwtTokenProvider.init() fail-fast → admin-api 起不来。
          # 用仓库**已入库的测试密钥对**（src/test/resources/rsa/*.pem，.gitignore:81 白名单），
          # 由下方 step 读入 PEM 内容后注入（JwtTokenProvider 支持 PEM 内容优先于文件路径）。
          # 不引入新 secret：密钥本就是测试用途、已公开在仓库中，无保密价值。
          PRIMARY_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || 'ci-dummy' }}
          PRIMARY_MODEL: deepseek-flash
          DASHVECTOR_API_KEY: ci-dummy
          DASHVECTOR_ENDPOINT: https://ci-dummy.dashvector.cn-hangzhou.aliyuncs.com
          DASHVECTOR_COLLECTION: ci
          DEBUG: 'true'
        run: |
          # ── 确定性数据库（issue #3270）──
          # 本 workflow 的 postgres 用**命名卷**（postgres_data）持久化 —— 历史运行
          # 产生的旧 schema 与迁移链不匹配（实测：platform_admins 不存在 / V28 JSON
          # 语法错），导致迁移失败、会话创建 500。验收评测要求**全新库**：
          # 每次先 down -v 清卷，再 up（schema.sql + 迁移链从零确定性重建）。
          # 本地 `docker compose up` 不受影响（不经过本 workflow）。
          docker compose -f deploy/docker-compose.yml down -v 2>&1 | tail -3 || true
          echo "── 已清空旧卷（fresh DB）──"
          # ⚠️ set -o pipefail 是必须的：此前本步骤是
          #     `docker compose ... up --wait ... 2>&1 | tail -20`
          #   而 bash 默认返回**管道最后一个命令**（tail）的退出码 —— tail 永远成功 →
          #   compose 失败（postgres exited 3）被吞成 **step success** →
          #   ① 后续「Diagnose」步骤的 if: failure() 永不触发，拿不到日志；
          #   ② workflow 只看得到「评测连不上」的表象，看不到「栈没起来」的真因；
          #   ③ 失败长期被静默（2026-09-11 实证：step4 success 但 postgres Error）。
          set -o pipefail
          # 本地栈需 DEBUG=true 供 X-Debug-Role 路由（小布身份注入），fail-closed 保护不受影响
          docker compose -f deploy/docker-compose.yml up -d --build --wait \
            --wait-timeout 300 postgres redis admin-api ai-agent-service 2>&1 | tail -20

      - name: "Seed C 端评测业务数据（issue #3270）"
        # 全新 bootstrap 空库下，agent 搜不到商品 → 反复重试 product_search →
        # 从不进入 product_detail（PR-003 等依赖数据的用例必然失败，且行为本身合理）。
        # 注入最小业务数据：商品/颜色/SKU/加工项/加工项关联（幂等，可重复执行）。
        env:
          DEV_SERVICE_TOKEN: diagnostics-only-placeholder
        run: |
          docker compose -f deploy/docker-compose.yml exec -T postgres \
            psql -v ON_ERROR_STOP=1 -U app_user -d ai_customer_service \
            < tests/agent_eval/fixtures/xiaobu_eval_seed.sql
          echo "── 数据核对 ──"
          docker compose -f deploy/docker-compose.yml exec -T postgres \
            psql -U app_user -d ai_customer_service -tAc \
            "SELECT 'products='||count(*) FROM products WHERE tenant_id=1"

      - name: Install eval runner deps
        # ⚠️ 依赖分两类（issue #3270 实测逐层暴露）：
        # 1) eval runner（local_runner.py）只需 httpx + pytest 系
        #    （`--timeout`/`--reruns` 分别要 pytest-timeout / pytest-rerunfailures）
        # 2) real E2E 跑的是 **ai-agent 自己的测试套件**（backend/ai-agent-service/tests），
        #    其 tests/conftest.py 依赖 jwt(PyJWT)/fastapi 等 → 必须装 ai-agent requirements，
        #    否则 `ModuleNotFoundError: No module named 'jwt'`（与 ai-agent-tests.yml 同款做法）
        run: |
          pip install -q httpx pytest pytest-timeout pytest-rerunfailures
          pip install -q -r backend/ai-agent-service/requirements.txt

      - name: Run xiaobu local_runner (C 端身份，真实 LLM)
        env:
          AI_API_URL: http://localhost:8001
          ADMIN_API_URL: http://localhost:8080
          SERVICE_TOKEN: ${{ secrets.SMOKE_SERVICE_TOKEN || 'ci-service-token-placeholder' }}
          PERSONA: xiaobu
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
          # 全量逐轮轨迹：**通过**的写用例也要看工具结果 —— 「工具被调用」≠「落库成功」
          # （DB 审计实证：17/17 全绿但 orders 无新增，order_create 被门禁拦/API 拒）。
          # 默认只打失败用例，写用例的成败藏在通过的用例里看不见。
          AGENT_EVAL_TRACE_ALL: "1"
          # 固定节流等待调到最小（评测墙钟时间几乎全在真实 LLM 往返上：实测 C 端 normal
          # 19m39s 里 ~63s 是纯 sleep、B 端 47 条约 3min；保留少量节流防 API 限流）
          EVAL_ROUND_SLEEP: "0.2"
          EVAL_CASE_SLEEP: "0.3"
          # 本片运行汇总（机器可读）：分片后审计必须知道"本片是否真的跑了写用例"，
          # 否则没有写用例的片会因 orders<=2 被误报假绿（分片基建，issue #3361）
          AGENT_EVAL_SUMMARY_JSON: /tmp/eval-summary-shard${{ matrix.shard }}.json
        run: |
          # 小布 C 端用例（数据隔离/下单/售后），expectation 自动映射 customer_order_query
          # tier 由 workflow_dispatch 输入控制：smoke=门禁级 5 条；normal=C 端全量 ~35 条
          # （用于取「C 端能力缺陷分布」，issue #3270 第 2 步）
          TIER="${{ github.event.inputs.tier || 'smoke' }}"
          echo "── 评测档位: $TIER ──"
          # --shard：本 job 只跑自己那一份用例；--max-retries：失败多的跑不再把分钟数
          # 全花在重试上（超限的失败仍记为失败，只是标签 no-retry-budget，不掩盖红灯）
          python tests/agent_eval/local_runner.py "$TIER" --cases .github/cases \
            --shard "${{ matrix.shard }}/${{ matrix.total }}" \
            --max-retries 3

      - name: Run xiaobu real E2E (pytest，含数据隔离断言)
        # 只在 0 号片跑：E2E 与用例分片无关（同一套栈/同一批断言），跑 N 份纯浪费墙钟。
        # ⚠️ `always()` 必需（issue #3364）：实测评测步骤失败时本步被 skip →
        # 而 E2E 自己的红灯比评测更早存在（main run 34684474262 评测 17/17、E2E 已 failure）
        # —— 只要评测红，E2E 红就永远看不见，两个缺陷互相掩盖。
        if: always() && matrix.shard == 0
        working-directory: backend/ai-agent-service
        env:
          CI: 'true'
          E2E_REAL_ENABLED: 'true'
          AI_AGENT_URL: http://localhost:8001
          ADMIN_API_BASE_URL: http://localhost:8080
          SERVICE_TOKEN: ${{ secrets.SMOKE_SERVICE_TOKEN || 'ci-service-token-placeholder' }}
          PRIMARY_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || 'ci-dummy' }}
          PRIMARY_MODEL: deepseek-flash
        run: |
          python -m pytest tests/e2e/real/test_xiaobu_acceptance.py \
            -v --tb=long -q --timeout=120 --no-cov --reruns 1 --reruns-delay 5

      - name: "Dump C 端逐轮路由轨迹（issue #3270 归因层）"
        # 为什么需要：runner 的 round_trace 能给「每轮调了哪些工具」，但**回答不了
        # 「为什么走这个 Skill」**——「退货被路由到 order/general」与「Skill 工具没给」
        # 在报告里同形，修复方向却相反（改路由 vs 加工具）。
        # 意图分类与路由决策只写在 ai-agent 日志里（intent_router / route_by_intent），
        # 故此处把路由行 dump 到 CI 日志：与 round_trace 按轮次对齐即可完成五层归因。
        # `if: always()`：成功也要留痕（基线与改进都要能对比），不只失败时才有。
        if: always()
        env:
          DEV_SERVICE_TOKEN: diagnostics-only-placeholder
        run: |
          echo "── ai-agent 意图分类 + 路由决策（按时间序）──"
          docker compose -f deploy/docker-compose.yml logs --no-color --timestamps \
            ai-agent-service 2>/dev/null \
            | grep -E "route_by_intent|Routing to|Session continuity|Escape hatch|intent_router|classified|last_confirm_value|card-confirm 诊断|确认卡 confirmValue" \
            | tail -200 \
            || echo "（无路由日志：容器未起或该步骤前已失败）"
          # ── 写工具失败原因（issue #3361）──
          # 为什么必须 dump：round_trace 只说「order_create!tool_execution_failed」，
          # 而工具对外文案是**故意泛化**的（不泄漏内部细节），真正的异常只在服务端日志里。
          # 实测 run 34686905546：三个下单用例的 order_create 分别失败于
          # tool_execution_failed / confirmation_required / tool_not_found，但日志只留
          # 容器 tail，根因无从查证 → 归因卡在「工具层」下不去。
          # 这里把写工具异常、门禁拦截、工具缺失三类行 dump 出来：
          #   [order-create] Failed      → 工具内异常（含异常类型与消息）
          #   [tool-registry] Failed     → 注册表执行异常
          #   Tool not found             → skill 工具集缺失（tool_not_found）
          #   拦截未确认的写操作 / card-confirm 诊断 → 确认门禁判定链
          echo "── 写工具失败原因（工具层归因：异常/门禁/工具缺失）──"
          docker compose -f deploy/docker-compose.yml logs --no-color --timestamps \
            ai-agent-service 2>/dev/null \
            | grep -E "\[order-create\] Failed|\[tool-registry\] Failed|Tool not found|拦截未确认的写操作|card-confirm 诊断|拦截在办流程|self-correct" \
            | tail -120 \
            || echo "（无写工具失败日志：本跑无写工具异常）"

      - name: "Eval 产物 DB 审计（issue #3270 §2.2 自动化）"
        # 为什么必须有：round_trace 证明「工具被调用了」，但不证明「数据真的落库了」。
        # acceptance-protocol §2.2 要求**复核 AI 留下的会话/工单/订单**（2026-09-08
        # 翻车的直接原因：报告说"创建成功"，库里没有，或相反）。
        # 这里把评测期间 agent 在 DB 里**实际创建**的会话/订单/售后工单 dump 出来，
        # 与报告的 tool_calls 对得上才算闭环 —— 证据链从「工具调用」延伸到「落库事实」。
        # `if: always()`：失败轮次更要看（失败 ≠ 没创建；成功 ≠ 真创建）。
        if: always()
        env:
          DEV_SERVICE_TOKEN: diagnostics-only-placeholder
        run: |
          PSQL() { docker compose -f deploy/docker-compose.yml exec -T postgres \
            psql -U app_user -d ai_customer_service -tAc "$1" 2>/dev/null; }
          echo "── Eval 期间 agent 实际落库的产物（§2.2 审计）──"
          # ⚠️ 会话表别搞混（issue #3357 根因）：C 端评测会话在 ai-agent 的 `sessions`
          # （每用例一个）；`agent_sessions` 是**人工会话**表，只有 human_handoff 会写。
          # 旧审计用 agent_sessions 当"每用例一个"是错的 —— 同一个混淆也让 runner 的
          # 会话清理打到 admin-api 的 agent_sessions（恒 404 静默），评测会话从未关闭。
          echo "· ai-agent 会话（每用例一个，含跨会话用例的多个）: $(PSQL 'SELECT count(*) FROM sessions;')"
          echo "· 其中未关闭残留（应为 0~个位数；大量残留 = 清理失效）: $(PSQL "SELECT count(*) FROM sessions WHERE status='active';")"
          echo "· 人工会话（仅转人工用例产生）: $(PSQL 'SELECT count(*) FROM agent_sessions;')"
          echo "· 订单（含 fixture 2 笔；**带金额**——金额是 C 端最硬的正确性证据）:"
          # 为什么要带 total_amount（issue #3361 归因需要）：只有金额才能回答
          # 「下单真的成了，且钱算对了吗」。实测 OR-014 在**没有查商品详情**的情况下
          # 发出的确认卡写着「遮光窗帘3米+打孔加工，合计¥95.4」，而该商品真实单价 ¥168/米
          # —— 无金额审计时这种"钱算错了但工具调用成功"的报告看着一切正常。
          PSQL "SELECT order_no || ' / ' || status || ' / ¥' || coalesce(total_amount, 0) || ' / 用户 ' || coalesce(user_id,'-') FROM orders ORDER BY created_at DESC LIMIT 12;"
          echo "· 售后工单:"
          PSQL "SELECT ticket_no || ' / ' || ticket_type || ' / ' || status FROM after_sales_tickets ORDER BY created_at DESC LIMIT 12;"
          echo "· 转人工工单（应能对上 CH-008/013/015 的 human_handoff）:"
          PSQL "SELECT count(*) FROM after_sales_tickets WHERE ticket_type='complaint';"
          echo "· 长期记忆（C 端画像落库验证；CH-024 跨会话用例的落库证据）:"
          PSQL "SELECT key || ' = ' || left(value, 40) || ' (importance ' || importance || ')' FROM user_memories WHERE agent_type='xiaobu' ORDER BY updated_at DESC LIMIT 10;"
          # ── 假绿告警：写用例通过但 DB 无对应产物（调了 ≠ 成了）──
          # run 34678939564 实证：17/17 全绿但 orders 无新增 —— order_create 被拦/被拒，
          # 用例却因「工具被调用」判通过。这里把「通过 vs 落库」对不上显式标出来。
          ORDERS=$(PSQL "SELECT count(*) FROM orders WHERE deleted=0 AND tenant_id=1;")
          TICKETS=$(PSQL "SELECT count(*) FROM after_sales_tickets WHERE deleted=0;")
          MEMORIES=$(PSQL "SELECT count(*) FROM user_memories WHERE agent_type='xiaobu';")
          # 本片是否跑了下单写用例：读 runner 汇总（分片后"全局应有"不再成立）
          SUMMARY="/tmp/eval-summary-shard${{ matrix.shard }}.json"
          WRITE_CASES=0
          if [ -f "$SUMMARY" ] && command -v jq >/dev/null 2>&1; then
            WRITE_CASES=$(jq -r '.order_write_cases // 0' "$SUMMARY" 2>/dev/null || echo 0)
          fi
          echo "· 落库对账（本片 shard=${{ matrix.shard }}/${{ matrix.total }}；fixture 订单=2）:"
          echo "  orders=$ORDERS tickets=$TICKETS memories=$MEMORIES write_cases=$WRITE_CASES"
          if [ "$ORDERS" -le 2 ] && [ "$WRITE_CASES" -gt 0 ]; then
            echo "⚠️ 假绿风险：本片有 $WRITE_CASES 条下单写用例，但订单未落库（<=2 仅 fixture）—— 调了 ≠ 成了，需查门禁/API"
          fi
          if [ "$TICKETS" -eq 0 ]; then
            echo "⚠️ 假绿风险：无任何售后工单落库（CH-012/转人工用例的写操作未成功）"
          fi
          if [ "$MEMORIES" -eq 0 ]; then
            echo "⚠️ 假绿风险：CH-024（C 端长期记忆）通过但 user_memories 无记录 —— 记忆链断在抽取/关闭 flush，用例的 post_session 断言若也过则是断言失效"
          fi

      - name: "Diagnose on failure (issue #3270): containers + DB probe"
        # 自 2026-08-31 起本 workflow 9/9 全 failure：postgres 容器 `exited (3)` 后
        # `--wait` 只报 "dependency failed to start"，把真正的启动错误吞掉了，导致
        # 长期无法定位。此步骤在失败时 dump 各容器状态与日志，直接暴露根因。
        #
        # ⚠️ 必须给 DEV_SERVICE_TOKEN 一个值：deploy/docker-compose.yml 把它声明为
        #    required（``${DEV_SERVICE_TOKEN:?...}``），缺它连 `docker compose ps/logs`
        #    都会插值失败、拿不到任何容器信息（2026-09-11 实测踩到）。
        #    此处**故意用固定占位串而非真实 secret** —— 诊断只读容器日志，不需要
        #    有效令牌，用非敏感值既满足插值又不扩大 secrets 暴露面。
        if: failure()
        env:
          DEV_SERVICE_TOKEN: diagnostics-only-placeholder
        run: |
          echo "── 容器状态 ──"
          docker compose -f deploy/docker-compose.yml ps -a || true
          for c in postgres redis admin-api ai-agent-service; do
            echo ""
            echo "════════ container logs: $c ════════"
            docker compose -f deploy/docker-compose.yml logs --no-color --tail=100 "$c" || true
          done
          echo ""
          echo "── 直接 docker logs（compose logs 为空时兜底）──"
          for n in aikf-postgres aikf-redis aikf-admin-api aikf-ai-agent; do
            echo "── $n ──"
            docker logs --tail=60 "$n" 2>&1 || true
          done
          echo ""
          echo "── postgres 数据卷内容 / init 脚本 ──"
          for v in migao_postgres_data deploy_postgres_data; do
            echo "-- volume: $v --"
            docker run --rm -v "$v":/v alpine:3 sh -c 'ls -la /v | head -20' 2>&1 || true
          done
          ls -la docs/sql/schema.sql 2>&1 || true
          echo ""
          echo "── compose 配置解析（确认变量插值成功）──"
          docker compose -f deploy/docker-compose.yml config --services 2>&1 | head -10 || true
          echo ""
          echo "── DB 关键状态探针（tenant 种子 / schema_migrations）──"
          docker compose -f deploy/docker-compose.yml exec -T postgres \
            psql -U app_user -d ai_customer_service -c "SELECT id,name FROM tenants;" 2>&1 || true
          docker compose -f deploy/docker-compose.yml exec -T postgres \
            psql -U app_user -d ai_customer_service -c "SELECT version FROM schema_migrations ORDER BY version DESC LIMIT 8;" 2>&1 || true

      - name: Upload artifacts (failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xiaobu-acceptance-artifacts-shard${{ matrix.shard }}
          path: |
            backend/ai-agent-service/.pytest_cache/
            tests/test-results/

      - name: Create Issue on failure (dedup guard)
        # 只在 0 号片建 issue：同一次评测失败会同时命中 N 片，去重靠标题但并发下有竞态，
        # 结果是一次失败开 N 个 issue（噪音）。0 号片的报告已含全局判定。
        if: failure() && matrix.shard == 0
        uses: actions/github-script@v9
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const title = `[Xiaobu] 小布 C 端验收失败 — ${new Date().toISOString().slice(0, 10)}`
            // 去重守卫（issue #2746）：同日同标题 open issue 已存在 → 仅评论追加，不重复建
            const q = `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`
            const { data: search } = await github.rest.search.issuesAndPullRequests({ q })
            if (search.total_count > 0) {
              const existing = search.items[0]
              console.log(`⏭️ 已存在同标题 open issue #${existing.number}，仅追加评论`)
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `同日同标题再次失败（新增 run）：${runUrl}`,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: `小布（C 端）验收失败（DEBUG 本地栈 + 真实 LLM）。\n\n查看详情：${runUrl}`,
                labels: ['bug', 'role/qa'],
              })
            }
