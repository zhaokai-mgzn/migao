name: Xiaobu Acceptance (小布 C 端验收)
permissions:
  contents: read
  issues: write

on:
  workflow_dispatch:
    inputs:
      tier:
        description: '评测档位：smoke（5 条，快）| normal（40 条 C 端全量，约 30-40min）'
        required: false
        default: smoke
        type: choice
        options:
          - smoke
          - normal
  # 2026-09-06 暂停定时调度（issue #2957）：连续 5+ 日 daily failure 且自动开 issue 制造噪音，
  # 待失败根因排查 + 本地验证提速落地后再恢复；期间保留 workflow_dispatch 手动触发。
  # schedule:
  #   # 每天 02:00 CST（UTC+8）= UTC 18:00，低峰期跑小布真实 LLM 能力回归
  #   - cron: '0 18 * * *'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  xiaobu-acceptance:
    name: Xiaobu Acceptance (DEBUG 本地栈 + 真实 LLM)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/ai-agent-service/requirements.txt

      - name: "Export dev RS256 keys for stack (issue #3270)"
        # admin-api 镜像内没有 rsa/private.pem（被 .gitignore 刻意排除），
        # 故用仓库已入库的**测试**密钥对，以 PEM 内容注入（多行值走 GITHUB_ENV 传递）。
        run: |
          KEY_DIR=backend/admin-api/src/test/resources/rsa
          test -f "$KEY_DIR/private.pem" || { echo "::error::缺少测试密钥 $KEY_DIR/private.pem"; exit 1; }
          test -f "$KEY_DIR/public.pem"  || { echo "::error::缺少测试密钥 $KEY_DIR/public.pem"; exit 1; }
          {
            echo "JWT_PRIVATE_KEY_PEM<<__PEM_EOF__"
            cat "$KEY_DIR/private.pem"
            echo "__PEM_EOF__"
            echo "JWT_PUBLIC_KEY_PEM<<__PEM_EOF__"
            cat "$KEY_DIR/public.pem"
            echo "__PEM_EOF__"
          } >> "$GITHUB_ENV"
          # ai-agent 用 JWT_PUBLIC_KEY 校验 admin-api 签发的 RS256 token；
          # 它在 config.py 里是必填项（非 DEBUG 校验），且 compose 里默认空串 →
          # 不注入会报「生产环境必须设置以下环境变量：JWT_PUBLIC_KEY」。
          # 这里给同一测试密钥对的公钥内容（单行 PEM → 用 tr 压成一行写入 env）。
          PUB_ONELINE=$(tr -d '\n' < "$KEY_DIR/public.pem")
          echo "JWT_PUBLIC_KEY=$PUB_ONELINE" >> "$GITHUB_ENV"
          echo "✅ 已导出 dev RS256 密钥（PEM 内容 + 公钥）"

      - name: "Start local stack (docker-compose: PG + Redis + admin-api + ai-agent DEBUG)"
        id: stack
        env:
          # ⚠️ deploy/docker-compose.yml 里 DEV_SERVICE_TOKEN 是 required 无默认值
          # （``${DEV_SERVICE_TOKEN:?...}``）——缺它 compose 直接插值失败，栈根本起不来。
          DEV_SERVICE_TOKEN: ${{ secrets.SMOKE_SERVICE_TOKEN || 'ci-service-token-placeholder' }}
          # ── RS256 密钥注入（issue #3270）──
          # 生产私钥不入库（.gitignore:79 **/rsa/private.pem），CI clone 后镜像内无该文件
          # → JwtTokenProvider.init() fail-fast → admin-api 起不来。
          # 用仓库**已入库的测试密钥对**（src/test/resources/rsa/*.pem，.gitignore:81 白名单），
          # 由下方 step 读入 PEM 内容后注入（JwtTokenProvider 支持 PEM 内容优先于文件路径）。
          # 不引入新 secret：密钥本就是测试用途、已公开在仓库中，无保密价值。
          PRIMARY_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || 'ci-dummy' }}
          PRIMARY_MODEL: deepseek-v4-flash
          DASHVECTOR_API_KEY: ci-dummy
          DASHVECTOR_ENDPOINT: https://ci-dummy.dashvector.cn-hangzhou.aliyuncs.com
          DASHVECTOR_COLLECTION: ci
          DEBUG: 'true'
        run: |
          # ── 确定性数据库（issue #3270）──
          # 本 workflow 的 postgres 用**命名卷**（postgres_data）持久化 —— 历史运行
          # 产生的旧 schema 与迁移链不匹配（实测：platform_admins 不存在 / V28 JSON
          # 语法错），导致迁移失败、会话创建 500。验收评测要求**全新库**：
          # 每次先 down -v 清卷，再 up（schema.sql + 迁移链从零确定性重建）。
          # 本地 `docker compose up` 不受影响（不经过本 workflow）。
          docker compose -f deploy/docker-compose.yml down -v 2>&1 | tail -3 || true
          echo "── 已清空旧卷（fresh DB）──"
          # ⚠️ set -o pipefail 是必须的：此前本步骤是
          #     `docker compose ... up --wait ... 2>&1 | tail -20`
          #   而 bash 默认返回**管道最后一个命令**（tail）的退出码 —— tail 永远成功 →
          #   compose 失败（postgres exited 3）被吞成 **step success** →
          #   ① 后续「Diagnose」步骤的 if: failure() 永不触发，拿不到日志；
          #   ② workflow 只看得到「评测连不上」的表象，看不到「栈没起来」的真因；
          #   ③ 失败长期被静默（2026-09-11 实证：step4 success 但 postgres Error）。
          set -o pipefail
          # 本地栈需 DEBUG=true 供 X-Debug-Role 路由（小布身份注入），fail-closed 保护不受影响
          docker compose -f deploy/docker-compose.yml up -d --build --wait \
            --wait-timeout 300 postgres redis admin-api ai-agent-service 2>&1 | tail -20

      - name: "Seed C 端评测业务数据（issue #3270）"
        # 全新 bootstrap 空库下，agent 搜不到商品 → 反复重试 product_search →
        # 从不进入 product_detail（PR-003 等依赖数据的用例必然失败，且行为本身合理）。
        # 注入最小业务数据：商品/颜色/SKU/加工项/加工项关联（幂等，可重复执行）。
        env:
          DEV_SERVICE_TOKEN: diagnostics-only-placeholder
        run: |
          docker compose -f deploy/docker-compose.yml exec -T postgres \
            psql -v ON_ERROR_STOP=1 -U app_user -d ai_customer_service \
            < tests/agent_eval/fixtures/xiaobu_eval_seed.sql
          echo "── 数据核对 ──"
          docker compose -f deploy/docker-compose.yml exec -T postgres \
            psql -U app_user -d ai_customer_service -tAc \
            "SELECT 'products='||count(*) FROM products WHERE tenant_id=1"

      - name: Install eval runner deps
        # ⚠️ 必须连 pytest 一起装（issue #3270）：后面的 real E2E 步骤用
        # `python -m pytest ... --timeout=120 --reruns 1`，而此前只装了 httpx →
        # 步骤报 `No module named pytest` 直接 exit 1（C 端评测步骤其实已绿）。
        # --timeout / --reruns 分别需要 pytest-timeout / pytest-rerunfailures。
        run: pip install -q httpx pytest pytest-timeout pytest-rerunfailures

      - name: Run xiaobu local_runner (C 端身份，真实 LLM)
        env:
          AI_API_URL: http://localhost:8001
          ADMIN_API_URL: http://localhost:8080
          SERVICE_TOKEN: ${{ secrets.SMOKE_SERVICE_TOKEN || 'ci-service-token-placeholder' }}
          PERSONA: xiaobu
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: |
          # 小布 C 端用例（数据隔离/下单/售后），expectation 自动映射 customer_order_query
          # tier 由 workflow_dispatch 输入控制：smoke=门禁级 5 条；normal=C 端全量 ~35 条
          # （用于取「C 端能力缺陷分布」，issue #3270 第 2 步）
          TIER="${{ github.event.inputs.tier || 'smoke' }}"
          echo "── 评测档位: $TIER ──"
          python tests/agent_eval/local_runner.py "$TIER" --cases .github/cases

      - name: Run xiaobu real E2E (pytest，含数据隔离断言)
        working-directory: backend/ai-agent-service
        env:
          CI: 'true'
          E2E_REAL_ENABLED: 'true'
          AI_AGENT_URL: http://localhost:8001
          ADMIN_API_BASE_URL: http://localhost:8080
          SERVICE_TOKEN: ${{ secrets.SMOKE_SERVICE_TOKEN || 'ci-service-token-placeholder' }}
          PRIMARY_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || 'ci-dummy' }}
          PRIMARY_MODEL: deepseek-v4-flash
        run: |
          python -m pytest tests/e2e/real/test_xiaobu_acceptance.py \
            -v --tb=long -q --timeout=120 --no-cov --reruns 1 --reruns-delay 5

      - name: "Diagnose on failure (issue #3270): containers + DB probe"
        # 自 2026-08-31 起本 workflow 9/9 全 failure：postgres 容器 `exited (3)` 后
        # `--wait` 只报 "dependency failed to start"，把真正的启动错误吞掉了，导致
        # 长期无法定位。此步骤在失败时 dump 各容器状态与日志，直接暴露根因。
        #
        # ⚠️ 必须给 DEV_SERVICE_TOKEN 一个值：deploy/docker-compose.yml 把它声明为
        #    required（``${DEV_SERVICE_TOKEN:?...}``），缺它连 `docker compose ps/logs`
        #    都会插值失败、拿不到任何容器信息（2026-09-11 实测踩到）。
        #    此处**故意用固定占位串而非真实 secret** —— 诊断只读容器日志，不需要
        #    有效令牌，用非敏感值既满足插值又不扩大 secrets 暴露面。
        if: failure()
        env:
          DEV_SERVICE_TOKEN: diagnostics-only-placeholder
        run: |
          echo "── 容器状态 ──"
          docker compose -f deploy/docker-compose.yml ps -a || true
          for c in postgres redis admin-api ai-agent-service; do
            echo ""
            echo "════════ container logs: $c ════════"
            docker compose -f deploy/docker-compose.yml logs --no-color --tail=100 "$c" || true
          done
          echo ""
          echo "── 直接 docker logs（compose logs 为空时兜底）──"
          for n in aikf-postgres aikf-redis aikf-admin-api aikf-ai-agent; do
            echo "── $n ──"
            docker logs --tail=60 "$n" 2>&1 || true
          done
          echo ""
          echo "── postgres 数据卷内容 / init 脚本 ──"
          for v in migao_postgres_data deploy_postgres_data; do
            echo "-- volume: $v --"
            docker run --rm -v "$v":/v alpine:3 sh -c 'ls -la /v | head -20' 2>&1 || true
          done
          ls -la docs/sql/schema.sql 2>&1 || true
          echo ""
          echo "── compose 配置解析（确认变量插值成功）──"
          docker compose -f deploy/docker-compose.yml config --services 2>&1 | head -10 || true
          echo ""
          echo "── DB 关键状态探针（tenant 种子 / schema_migrations）──"
          docker compose -f deploy/docker-compose.yml exec -T postgres \
            psql -U app_user -d ai_customer_service -c "SELECT id,name FROM tenants;" 2>&1 || true
          docker compose -f deploy/docker-compose.yml exec -T postgres \
            psql -U app_user -d ai_customer_service -c "SELECT version FROM schema_migrations ORDER BY version DESC LIMIT 8;" 2>&1 || true

      - name: Upload artifacts (failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xiaobu-acceptance-artifacts
          path: |
            backend/ai-agent-service/.pytest_cache/
            tests/test-results/

      - name: Create Issue on failure (dedup guard)
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const title = `[Xiaobu] 小布 C 端验收失败 — ${new Date().toISOString().slice(0, 10)}`
            // 去重守卫（issue #2746）：同日同标题 open issue 已存在 → 仅评论追加，不重复建
            const q = `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`
            const { data: search } = await github.rest.search.issuesAndPullRequests({ q })
            if (search.total_count > 0) {
              const existing = search.items[0]
              console.log(`⏭️ 已存在同标题 open issue #${existing.number}，仅追加评论`)
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `同日同标题再次失败（新增 run）：${runUrl}`,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: `小布（C 端）验收失败（DEBUG 本地栈 + 真实 LLM）。\n\n查看详情：${runUrl}`,
                labels: ['bug', 'role/qa'],
              })
            }
