# 「跳过部署」的运行面自证（issue #6294）—— **可复用 workflow**（三条部署腿共用一份）。
#
# ## 为什么是 `workflow_call` 而不是在三条腿里各写一条 step
#
# ① **同源修**（铁律 8）：判定本体在 `deploy/scripts/swas_deploy_running_tag.sh`（库），
#    调用面也只有**一份**（本文件）—— 三条腿只各加 7 行 `uses:`，没有「三份复制」。
# ② **零新增 secrets 引用**：本文件是**新增**文件，`danger_scan.py` 对新增 workflow 只做
#    「维护者添加 ⇒ WARN」（`_workflow_new_secrets()` 只扫 `M`/`R` 状态）⇒ 不会因
#    「新增 secrets 引用」把整条 PR 判 BLOCK；而三条腿的改动里**一个 `secrets.` 都不出现**。
#    （本单第一版把 step 内联进三条腿 ⇒ 每腿新增 2 处非内置 secrets 引用 ⇒ danger-scan
#     3 处 blocker 阻塞合并。这是那个形态的实测教训。）
#
# ## 病（现取读数，不是推断）
#
# `deploy-*.yml` 的 `Skip if already built (schedule reconcile)` 判「已部署」**只看 run 结论**
# （镜像已在 ACR / 同 sha 的部署 run 结论 = `success`）⇒ 「跳过」那条路径上
# `Deploy to SWAS` / `Assert server-side build` / `Post-Deploy Smoke Test` **整段 skipped**，
# 而 **run 结论 = success**（issue #6294 现场：`admin-web` 近 40 次 run 里两条 `success`
# ——run `37156277078` / `37131394391`——都是这种形态）。对账侧（`deploy-reconcile.yml`）的断路器
# 把 `success` 放进**允许名单** ⇒ 判定「该 commit 已部署」⇒ 不再补部署 ⇒
# **环境停摆 40 小时而台账全绿**（SWAS 上在跑 `admin-web:sha-877ac15`，main HEAD 是 `9d82e2e60`）。
#
# ## 判据（issue #6294 判据 1 的「部署后机械判据：运行 tag == 目标 tag」）
#
# 退出码三态（由 `deploy/scripts/swas_deploy_running_tag.sh` 给出）：
#   0 = 在跑 tag == 目标 tag（skip 成立，放行）· 1 = 不一致（**具名判红**）· 3 = 探不到（fail-closed）。
# 本 job 直接把该退出码当自己的结论 ⇒ 不一致 / 探不到都会让**这条部署腿的 run 判红**，
# 而不是「skip 成功 ⇒ run 全绿」。
#
# ⚠️ 调用方必须在**部署 job 之后**用 `needs.<job>.outputs.deployed == 'true'` 门控
#    （`deployed` = `steps.sync.outputs.skip` ⇒ `'true'` 即「本轮跳过部署」）。
# ⚠️ 本 job **不写盘**（只读探测：不 build / 不 pull / 不 up），也不取远端 flock。
name: Probe running tag (skip must not claim deployed)

on:
  workflow_call:
    inputs:
      instance_id:
        description: 'SWAS 实例 ID'
        required: true
        type: string
      region:
        description: 'SWAS 地域（如 cn-hangzhou）'
        required: true
        type: string
      image_tag:
        description: '目标镜像 tag（= 该腿 steps.tag.outputs.IMAGE_TAG）'
        required: true
        type: string
      service:
        description: '服务键（admin-api / ai-agent / admin-web）'
        required: true
        type: string
    secrets:
      ALIYUN_ACCESS_KEY_ID:
        required: true
      ALIYUN_ACCESS_KEY_SECRET:
        required: true

jobs:
  probe:
    name: Assert running tag == target
    runs-on: ubuntu-latest
    # 探测走同一条 SWAS RunCommand 通道 + 一次远端只读取数 ⇒ 5min 足够
    #（对比部署腿的 90min：那是**冷构建 1782s** 的预算，探测不构建）。
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # 判据本体 = deploy/scripts/swas_deploy_running_tag.sh（唯一一份实现）；
      # 本步只做三件事：传参、显式打印判据口径、失败时**具名**。
      - name: "Assert running tag == target (skip 不得冒充已部署，issue #6294)"
        env:
          AK: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          SK: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
        run: |
          set -euo pipefail
          echo "判据：本轮的「跳过部署」只有在**远端确实在跑 ${{ inputs.image_tag }}** 时才成立。"
          echo "  服务=${{ inputs.service }} 期望 tag=${{ inputs.image_tag }} 实例=${{ inputs.instance_id }}"
          bash deploy/scripts/swas_deploy_running_tag.sh \
            "${{ inputs.instance_id }}" "${{ inputs.region }}" "$AK" "$SK" \
            "${{ inputs.image_tag }}" "${{ inputs.service }}"
