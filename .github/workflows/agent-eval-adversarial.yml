name: Agent Eval Adversarial (米宝对抗评测)
permissions:
  contents: read
  # ⚠️ 失败建 issue 必需（#3834 同类扫描查出）：本 workflow 每周六定时跑，缺此权限时
  # 失败钩子（issues.create / search.issuesAndPullRequests）静默崩溃 —— 实证
  # `[Agent Eval] 米宝对抗评测失败` 的 issue 停在 2026-08-29，而其定时 run
  # 34650006175(09-11) / 33920423644(09-04) 均 failure **零留痕**（#3270/#3497 同款）。
  # 守卫：tests/unit_ci_workflows/test_workflow_issue_permissions.py
  issues: write

on:
  # ★ 触发口径（2026-09-17 裁定 2′/4′ 承载 #4034；2026-09-18 #4262 用户裁定收紧）：
  #   本 workflow 的每周六对抗档**定时已删除** —— 全仓自动真实 LLM 触发由 3 条收敛为
  #   **1 条**（只留 `post-deploy-eval.yml` 每周一 normal 全量）。用户原话：
  #   「不要自动进行验证，都是重复的验证，白白消耗成本」+「兜底定时改成每周自动跑一次」。
  #   ⇒ 本 workflow 改为**仅手动**：需要对抗覆盖时 `workflow_dispatch` 派发，覆盖未消失、
  #   只是不再由 cron 自动付费。
  #   真实 LLM 的**判定用途**唯一入口 = `post-deploy-eval.yml`（档位矩阵见该文件头部）；
  #   本 workflow 是**手动专项工具**（只追踪不阻塞）。
  #   防回退：`tests/unit_ci_workflows/test_behavior_eval_pr_thin.py` 的白名单锁死
  #   "自动 LLM 触发集合"（**只留 1 条**，其余必须为空），新增任何自动触发都会直接红。
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  agent-eval-adversarial:
    name: Mibao Agent Eval (adversarial)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install httpx

      - name: Run adversarial eval (真实 LLM，弱 LLM 可能挂 — 只追踪不阻塞)
        env:
          AI_API_URL: https://ai-api.migaozn.com
          ADMIN_API_URL: https://api.migaozn.com
          SERVICE_TOKEN: ${{ secrets.SMOKE_SERVICE_TOKEN }}
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: python tests/agent_eval/local_runner.py adversarial --cases .github/cases

      - name: Create Issue on failure (dedup guard)
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const title = `[Agent Eval] 米宝对抗评测失败 — ${new Date().toISOString().slice(0, 10)}`
            // 去重守卫（issue #2746）：同日同标题 open issue 已存在 → 仅评论追加，不重复建
            const q = `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`
            const { data: search } = await github.rest.search.issuesAndPullRequests({ q })
            if (search.total_count > 0) {
              const existing = search.items[0]
              console.log(`⏭️ 已存在同标题 open issue #${existing.number}，仅追加评论`)
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `同日同标题再次失败（新增 run）：${runUrl}`,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: `米宝对抗评测（adversarial tier）失败，仅追踪不阻塞合并。\n\n查看详情：${runUrl}`,
                labels: ['bug', 'role/qa'],
              })
            }
