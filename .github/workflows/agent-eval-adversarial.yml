name: Agent Eval Adversarial (米宝对抗评测)
permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    # 每周六 03:00 CST（UTC+8）= 周五 19:00 UTC，低峰期跑对抗 tier
    - cron: '0 19 * * 5'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  agent-eval-adversarial:
    name: Mibao Agent Eval (adversarial)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install httpx

      - name: Run adversarial eval (真实 LLM，弱 LLM 可能挂 — 只追踪不阻塞)
        env:
          AI_API_URL: https://ai-api.migaozn.com
          ADMIN_API_URL: https://api.migaozn.com
          SERVICE_TOKEN: ${{ secrets.SMOKE_SERVICE_TOKEN }}
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: python tests/agent_eval/local_runner.py adversarial --cases .github/cases

      - name: Create Issue on failure (dedup guard)
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const title = `[Agent Eval] 米宝对抗评测失败 — ${new Date().toISOString().slice(0, 10)}`
            // 去重守卫（issue #2746）：同日同标题 open issue 已存在 → 仅评论追加，不重复建
            const q = `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`
            const { data: search } = await github.rest.search.issues({ q })
            if (search.total_count > 0) {
              const existing = search.items[0]
              console.log(`⏭️ 已存在同标题 open issue #${existing.number}，仅追加评论`)
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `同日同标题再次失败（新增 run）：${runUrl}`,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: `米宝对抗评测（adversarial tier）失败，仅追踪不阻塞合并。\n\n查看详情：${runUrl}`,
                labels: ['bug', 'role/qa'],
              })
            }
