name: Agent Eval (米宝能力评测)
permissions:
  contents: read
  issues: write  # 失败建 issue 必需（#3497，修复 #3270 同款次生 bug：缺此权限失败通知静默）

on:
  # 2026-08-29：取消每日 normal 定时评测（成本高、信号为 LLM 波动为主，按需手动触发即可）。
  # ★ 触发口径（2026-09-17 用户裁定 2′/4′，承载 issue #4034）：**before == after，本次未改**
  #   （本 workflow 早已是**手动专用**：唯一触发 = workflow_dispatch，无任何自动触发）。
  #   注意历史注释里的两处**已失效**表述，别照抄：
  #     ① 「PR 门禁由 pr-check 的 agent-eval-smoke 承担」——该 job 已按 #3653 移除；
  #     ② 「对抗评测由 agent-eval-adversarial.yml 每周跑」——仍成立（定时档保留）。
  #   判定用途的唯一入口 = `post-deploy-eval.yml`（档位矩阵见该文件头部）。
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  agent-eval:
    name: Mibao Agent Eval (normal, manual)
    runs-on: ubuntu-latest
    # normal tier（真实 LLM 多轮；条数随用例库增长 —— 2026-09-20 实测 70 条，
    # 旧注释写的「约 47 条」已漂移），smoke 由 PR gate 承担、adversarial 由每周任务承担
    #
    # ── 超时预算（issue #4800，2026-09-20）────────────────────────────────────
    # 读数（`gh api .../actions/runs/<run>/jobs` 的 job 墙钟 = completed_at - started_at，
    # 当前配置的全部 3 次 run 都采到）：34800764957=2891s · 34287690363=2735s ·
    # 34244577084=2895s（48.2m）⇒ 旧上限 60m(3600s) 只剩 ~705s 余量（1.24×）。
    # 本 job 跑**真实 LLM**，被自身 job 超时杀掉 = 真红 + 白烧一次全量 LLM 成本
    # （与 #4262「不要白白消耗成本」裁定相悖）。
    # 为什么不先「降耗时」（#4800 要求先核清能不能降）：
    #   · 耗时构成 = **100% 真实 LLM 用例串行执行** —— 2881s 里 2881s 是 70 条用例首尾
    #     相接（中位 25s / 最长单条 214s），无空转等待、无 502 重试等待 ⇒ 没有"无谓等待"可省；
    #   · 唯一显著杠杆 = 用例级并发（`EVAL_CONCURRENCY`）：按本 run 逐条耗时做 LPT 模拟，
    #     并发 6 的墙钟下界 ≈482s（省 ~83%）。但本 workflow 打的是**共享环境**，并发写同一套
    #     共享数据正是下方分片注释排除的形态；且本单不许派发评测 ⇒ 无法验证调度变更不引入
    #     假红（"没测"≠"没问题"）⇒ 登记为后续单（前置 = 每次跑完即销毁的隔离栈），本单不改；
    #   · 节流等待（`EVAL_ROUND_SLEEP`/`EVAL_CASE_SLEEP` 默认 0.5/1.0）合计 ~146s（5%），
    #     **低于 run 间波动**（2735~2895s，跨度 160s）⇒ 不可测量的纸面优化，不改。
    # 故取 #4800 候选①：抬上限 60m → 90m（与 post-deploy-eval 的 90m 一致，对最大读数 1.87×）。
    #
    # ── #4821 核实结论（2026-09-21，**结论 = 本 workflow 不改环境语义**）──────────
    # #4800 登记的那个"后续单"（前置 = 隔离栈）就是 issue #4821。它核清后**不做**改造，理由：
    #   ① 上面那句「并发 6 下界 ≈482s（省 ~83%）」**已被证伪**：该估算没把**隔离串行**算进去。
    #      用本 workflow 既有 run `34800764957` 的逐条 `⏱ <ID> start=` 耗时代入
    #      `tests/agent_eval/local_runner.py` 的 `serialize_seconds`（含隔离语义），可比子集
    #      的下界是 **2873s → 1215s（≈58%）**，且下界由**独占串行道**顶着（声明了命名空间撞车 /
    #      `id_reuse`/`update`/`full_lifecycle` / `pre_clean` 的用例必须互不重叠，其耗时合计
    #      ≈42% 墙钟 ⇒ **与并发度无关**）。并发 >8 之后再加无用。**未真跑**（#4262 未派发评测）。
    #   ② **本 workflow 的耗时不是可白省的钱，而是一层覆盖面的价格**：本文件的 `AI_API_URL` /
    #      `ADMIN_API_URL` 指向**已部署**的云测试环境（`ai-api.migaozn.com` / `api.migaozn.com`），
    #      而同族另两个评测入口（`post-deploy-eval.yml` / `xiaobu-acceptance.yml`）跑的
    #      **都是本地临时栈**（`http://localhost:8001` + `Start local stack`）。
    #      ⇒ 「**部署出去的那一份**」的 normal 全量，**只有本入口在跑**。
    #      把它改成隔离栈 = 既丢掉这一层、又变成 post-deploy-eval mibao 腿的同构副本
    #      （净减覆盖 + 重复付费）⇒ 维护者裁定**不改**（覆盖面变更需业务裁定，见 #4824）。
    #   ③ 但**共享环境不可安全并发**（normal 档含建品/下单/改客户等写用例，并发写同一套共享
    #      dev 库既互相污染又加速污染；假失败会经下方失败步骤落进 issue 台账，且
    #      `flaky-triage.yml` 的 `workflow_run` 白名单**不含**本 workflow ⇒ 不会被自动重跑兜住）
    #      ⇒ 本入口**保持严格串行**，`EVAL_CONCURRENCY` 有意**不设**（runner 缺省 1）。
    #   ④ 由此登记（**本单不实现**）的下一步假设：降本的正解可能是「**换时机**」而非「换环境」——
    #      #4262 逐字裁定「不要自动进行验证……手动集中跑一次即可」与本入口「按需/集中触发」同向，
    #      且**不缩减"跑什么、判什么"，只改"何时跑"**。触发面**本单不动**，留给裁定。
    # 口径全文与守卫锚点：`docs/testing/eval-environments.md` §3.9；L0 锁
    # `tests/unit_ci_workflows/test_agent_eval_deployed_env_lock.py`。
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install httpx

      # ⚠️ 不能像 C 端那样分片（issue #3361）：本 workflow 打的是**共享环境**
      # （ai-api.migaozn.com / api.migaozn.com），而 normal 档含建品/下单/改客户等
      # 写用例 —— N 片并发 = N 个 job 同时写同一套共享数据，既互相污染（用例假失败）
      # 又加速污染 dev 库。要分片必须先有**每次跑完即销毁的隔离栈**（C 端那样
      # docker-compose 起 PG/admin-api/ai-agent），属基建改造，不在本提交内做。
      - name: Run normal eval (真实 LLM 回归，按需)
        env:
          AI_API_URL: https://ai-api.migaozn.com
          ADMIN_API_URL: https://api.migaozn.com
          SERVICE_TOKEN: ${{ secrets.SMOKE_SERVICE_TOKEN }}
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
          # 波动台账（#3505 汇聚）：flake ledger 落盘 + artifact 上传，供高波动用例
          # 治理（§14.3）跨 run 汇总；否则台账随 runner 销毁、只能翻日志。
          AGENT_EVAL_FLAKE_LOG: agent-eval-flakes.json
        run: python tests/agent_eval/local_runner.py normal --cases .github/cases

      - name: Upload flake ledger（波动台账汇聚，#3505）
        if: always() && hashFiles('agent-eval-flakes.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: agent-eval-flake-ledger
          path: agent-eval-flakes.json
          retention-days: 30

      - name: Create Issue on failure (dedup guard)
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const title = `[Agent Eval] 米宝冒烟评测失败 — ${new Date().toISOString().slice(0, 10)}`
            // 去重守卫（issue #2746）：同日同标题 open issue 已存在 → 仅评论追加，不重复建
            const q = `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`
            const { data: search } = await github.rest.search.issuesAndPullRequests({ q })
            if (search.total_count > 0) {
              const existing = search.items[0]
              console.log(`⏭️ 已存在同标题 open issue #${existing.number}，仅追加评论`)
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `同日同标题再次失败（新增 run）：${runUrl}`,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: `米宝能力冒烟评测失败（真实 LLM + 多轮业务流）。\n\n查看详情：${runUrl}`,
                labels: ['bug', 'role/qa'],
              })
            }
