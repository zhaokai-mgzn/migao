name: Issue CONTRACT_JSON Check

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  check-contract:
    name: Check CONTRACT_JSON
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # 仅在 issue 事件下运行，防止 push 事件误触发时 github.event.issue 未定义导致 crash
    if: |
      github.event_name == 'issues' &&
      !contains(github.event.issue.title, '[E2E Web]') &&
      !contains(github.event.issue.title, '[coverage]') &&
      !contains(github.event.issue.title, '[coverage-tracking]') &&
      github.event.issue.user.type != 'Bot'

    steps:
      - uses: actions/checkout@v4

      - name: Check and remind
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';

            // ai-draft 标签：用户手动 draft，质量门禁完全不可见，直接跳过
            if (context.payload.issue.labels.some(l => l.name === 'ai-draft')) {
              console.log('⏭️  ai-draft 标签 — 质量门禁跳过');
              return;
            }

            const hasContract = /<!--\s*CONTRACT_JSON/.test(body);
            const hasTruths = /"business_truths"\s*:\s*\[[^\]]*[a-zA-Z一-鿿]/.test(body) ||
              /##\s*业务真值/.test(body) ||
              /##\s*验收标准\s*\n\s*[-*]\s*\S/.test(body) ||
              // 问题描述必须跟具体内容才算真值，避免空标题误入
              /##\s*问题描述\s*\n\s*[-*\d]/.test(body) ||
              /condition.*→.*expected/.test(body);

            if (hasContract || hasTruths) {
              // 有业务真值 → 自动加入质量门禁体系
              const needsLabel = !context.payload.issue.labels.some(l => l.name === 'needs-verification');
              if (needsLabel) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  labels: ['needs-verification'],
                });
                // B8 fix: 同时移除 needs-truths (修复前两个标签可能并存，导致状态不一致)
                const hasTruthsLabel = context.payload.issue.labels.some(l => l.name === 'needs-truths');
                if (hasTruthsLabel) {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: context.issue.number,
                    name: 'needs-truths',
                  });
                }
                console.log('✅ 已添加 needs-verification → 进入质量门禁体系');
              } else {
                console.log('✅ 已有 needs-verification');
              }
              return;
            }

            const msg = `## ⚠️ 缺少业务真值

            本 issue 缺少 \`CONTRACT_JSON\` 或业务真值描述。

            ### 为什么需要
            质量门禁验收体系依赖**业务真值**来生成测试 case（DRAFT_JSON）。
            缺少真值 → 自动评审无法反推 case → 验收 agent 无法验证 → 质量无法兜底。

            ### 请补充
            在 issue body 末尾添加：

            \`\`\`html
            <!-- CONTRACT_JSON
            {
            "business_truths": [
            "条件A → 结果B",
            "用户执行X → 系统返回Y",
            "API POST /xxx 返回 201 且 data.id 非空"
            ]
            }
            -->
            \`\`\`

            或至少用自然语言描述：

            \`\`\`markdown
            ## 验收标准
            - API POST /xxx 返回 200 且 data.id 非空
            - 不同租户数据互不可见
            - 无效输入返回明确错误
            \`\`\`

            > 🤖 真值齐全后自动评审会自动反推 case 草稿，研发 review 后即可开工。

            Co-Authored-By: Claude <noreply@anthropic.com>`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: msg,
            });

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['needs-truths'],
            });
            console.log('✅ 已提醒补充 CONTRACT_JSON');

      - name: Validate cases references (case-contract)
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          # CONTRACT_JSON 声明了 cases → 每个 ID 必须在用例库中存在（否则 issue 级校验红）
          CASES=$(python3 -c "
          import os, re
          body = os.environ.get('ISSUE_BODY', '')
          m = re.search(r'\"cases\"\s*:\s*\[([^\]]*)\]', body)
          ids = [t.strip().strip(chr(34) + chr(39)) for t in m.group(1).split(',') if t.strip()] if m else []
          print(' '.join(ids))
          ")
          if [ -z "$CASES" ]; then
            echo "ℹ️ 未声明 cases，跳过用例引用校验"
            exit 0
          fi
          # issue 创建时用例库可能还不含「本 PR 新登记的 case」（新 case 与修复同批落地），
          # 因此 issue 级只做告警、不做硬失败；case 是否存在由 PR 级的 case-truth-check
          # 与 QA Growth Gate(G5) 在合并前兜底校验。
          MISSING=0
          for id in $CASES; do
            if ! python3 .github/truths.py case "$id" --cases .github/cases; then
              echo "⚠️ 用例 $id 未在 main 用例库中找到（可能是本 PR 新登记的 case）"
              MISSING=1
            fi
          done
          if [ "$MISSING" = "1" ]; then
            echo "::warning:: 部分用例 ID 尚未在 main 用例库中。若为新增 case，请确保同一 PR 已在 .github/cases/ 登记；合并前由 case-truth-check + QA Growth Gate(G5) 兜底校验。"
          else
            echo "✅ cases 引用全部有效"
          fi
