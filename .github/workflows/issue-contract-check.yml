name: Issue CONTRACT_JSON Check

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  check-contract:
    name: Check CONTRACT_JSON
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # 仅在 issue 事件下运行，防止 push 事件误触发时 github.event.issue 未定义导致 crash
    if: |
      github.event_name == 'issues' &&
      !contains(github.event.issue.title, '[E2E Web]') &&
      !contains(github.event.issue.title, '[coverage]') &&
      !contains(github.event.issue.title, '[coverage-tracking]') &&
      github.event.issue.user.type != 'Bot'

    steps:
      - uses: actions/checkout@v4

      - name: Check and remind
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';

            // ai-draft 标签：用户手动 draft，二郎神完全不可见，直接跳过
            if (context.payload.issue.labels.some(l => l.name === 'ai-draft')) {
              console.log('⏭️  ai-draft 标签 — 二郎神跳过');
              return;
            }

            const hasContract = /<!--\s*CONTRACT_JSON/.test(body);
            const hasTruths = /"business_truths"\s*:\s*\[[^\]]*[a-zA-Z一-鿿]/.test(body) ||
              /##\s*业务真值/.test(body) ||
              /##\s*验收标准\s*\n\s*[-*]\s*\S/.test(body) ||
              // 问题描述必须跟具体内容才算真值，避免空标题误入
              /##\s*问题描述\s*\n\s*[-*\d]/.test(body) ||
              /condition.*→.*expected/.test(body);

            if (hasContract || hasTruths) {
              // 有业务真值 → 自动加入二郎神体系
              const needsLabel = !context.payload.issue.labels.some(l => l.name === 'needs-verification');
              if (needsLabel) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  labels: ['needs-verification'],
                });
                // B8 fix: 同时移除 needs-truths (修复前两个标签可能并存，导致状态不一致)
                const hasTruthsLabel = context.payload.issue.labels.some(l => l.name === 'needs-truths');
                if (hasTruthsLabel) {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: context.issue.number,
                    name: 'needs-truths',
                  });
                }
                console.log('✅ 已添加 needs-verification → 进入二郎神体系');
              } else {
                console.log('✅ 已有 needs-verification');
              }
              return;
            }

            const msg = `## ⚠️ 缺少业务真值

            本 issue 缺少 \`CONTRACT_JSON\` 或业务真值描述。

            ### 为什么需要
            二郎神验收体系依赖**业务真值**来生成测试 case（DRAFT_JSON）。
            缺少真值 → 军师无法反推 case → 验收 agent 无法验证 → 质量无法兜底。

            ### 请补充
            在 issue body 末尾添加：

            \`\`\`html
            <!-- CONTRACT_JSON
            {
            "business_truths": [
            "条件A → 结果B",
            "用户执行X → 系统返回Y",
            "API POST /xxx 返回 201 且 data.id 非空"
            ]
            }
            -->
            \`\`\`

            或至少用自然语言描述：

            \`\`\`markdown
            ## 验收标准
            - API POST /xxx 返回 200 且 data.id 非空
            - 不同租户数据互不可见
            - 无效输入返回明确错误
            \`\`\`

            > 🤖 真值齐全后军师会自动反推 case 草稿，研发 review 后即可开工。

            Co-Authored-By: Claude <noreply@anthropic.com>`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: msg,
            });

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['needs-truths'],
            });
            console.log('✅ 已提醒补充 CONTRACT_JSON');

      - name: Validate cases references (case-contract)
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          # CONTRACT_JSON 声明了 cases → 每个 ID 必须在用例库中存在（否则 issue 级校验红）
          CASES=$(python3 -c "
          import os, re
          body = os.environ.get('ISSUE_BODY', '')
          m = re.search(r'\"cases\"\s*:\s*\[([^\]]*)\]', body)
          ids = [t.strip().strip(chr(34) + chr(39)) for t in m.group(1).split(',') if t.strip()] if m else []
          print(' '.join(ids))
          ")
          if [ -z "$CASES" ]; then
            echo "ℹ️ 未声明 cases，跳过用例引用校验"
            exit 0
          fi
          FAILED=0
          for id in $CASES; do
            if ! python3 .github/truths.py case "$id" --cases .github/cases; then
              FAILED=1
            fi
          done
          if [ "$FAILED" = "1" ]; then
            echo "::error:: CONTRACT_JSON 声明了不存在的用例 ID，请从 .github/cases/ 选择或修正"
            exit 1
          fi
          echo "✅ cases 引用全部有效"

      - name: Validate page_cases references (visual)
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          PCASES=$(python3 -c "
          import os, re
          body = os.environ.get('ISSUE_BODY', '')
          m = re.search(r'\"page_cases\"\s*:\s*\[([^\]]*)\]', body)
          ids = [t.strip().strip(chr(34) + chr(39)) for t in m.group(1).split(',') if t.strip()] if m else []
          print(' '.join(ids))
          ")
          if [ -z "$PCASES" ]; then
            echo "ℹ️ 未声明 page_cases，跳过页面用例引用校验"
            exit 0
          fi
          FAILED=0
          for id in $PCASES; do
            if ! python3 .github/truths.py page-case "$id" --cases .github/cases; then
              FAILED=1
            fi
          done
          if [ "$FAILED" = "1" ]; then
            echo "::error:: CONTRACT_JSON 声明了不存在的页面用例 ID，请从 .github/cases/ 的 page_cases 选择或修正"
            exit 1
          fi
          echo "✅ page_cases 引用全部有效"

      - name: Validate truths_ref references
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          # CONTRACT_JSON 声明 truths_ref → 每个真值 ID 必须在模板库存在（agent 用 truth_query 按 ID 查）
          REFS=$(python3 -c "
          import os, re
          body = os.environ.get('ISSUE_BODY', '')
          m = re.search(r'\"truths_ref\"\s*:\s*\[([^\]]*)\]', body, re.S)
          ids = [t.strip().strip(chr(34) + chr(39)) for t in m.group(1).split(',') if t.strip()] if m else []
          print(' '.join(ids))
          ")
          if [ -z "$REFS" ]; then
            echo "ℹ️ 未声明 truths_ref，跳过真值引用校验"
            exit 0
          fi
          FAILED=0
          for id in $REFS; do
            if ! python3 .github/truths.py query "$id" --templates .github/templates; then
              FAILED=1
            fi
          done
          if [ "$FAILED" = "1" ]; then
            echo "::error:: CONTRACT_JSON 声明了不存在的真值 ID，请从 .github/templates/ 选择（真值 ID 见 docs/truths.html）"
            exit 1
          fi
          echo "✅ truths_ref 引用全部有效"

      - name: Validate truth count (task granularity)
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          # 任务粒度标准（design/21）：1 ≤ truths ≤ 5；>5 → needs-split 提示拆解
          COUNT=$(python3 -c "
          import os, re
          body = os.environ.get('ISSUE_BODY', '')
          m = re.search(r'\"business_truths\"\s*:\s*\[([^\]]*)\]', body, re.S)
          if not m:
              print(0)
          else:
              # 按引号包裹的字符串计数（真值条目）
              print(len(re.findall(r'\"[^\"]*[一-鿿a-zA-Z][^\"]*\"', m.group(1))))
          ")
          if [ "${COUNT:-0}" -gt 5 ]; then
            echo "::warning:: CONTRACT_JSON 声明 ${COUNT} 条真值，超过任务粒度上界 5（design/21）"
            echo "NEEDS_SPLIT=1" >> "$GITHUB_ENV"
          fi

      - name: Label needs-split and remind (over-granular)
        if: env.NEEDS_SPLIT == '1'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, labels: ['needs-split'],
            })
            const body = `## ✂️ 任务粒度超界，建议拆解

            本 issue 的 CONTRACT_JSON 声明了超过 5 条业务真值，超过二郎神任务粒度上界（design/21）。

            ### 为什么
            大任务在闭环里会卡死：单会话预算 30min + verify 逐条判真值 + Review 单次判定，
            真值越多越难一次性 accept，最终 DRAFT↔Review 死循环。

            ### 请拆解
            按「依赖序 / 领域 / 验收」拆成子任务（父 issue 保留追踪，子任务各走闭环）：
            - 基础层（token/配置/契约）→ 组件层 → 页面层
            - 每条子任务 1~5 条真值，单领域单目标，每条真值一条机器断言

            > 规范详见 design/21-task-granularity.md | 🤖二郎神`
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body,
            })
