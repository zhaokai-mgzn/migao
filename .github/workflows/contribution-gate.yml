name: Contribution Gate (authorship + sensitive paths)

# ── 判定面凭据（issue #8847，2026-11-09 owner 裁定①「加凭据」）─────────────────
# 本 workflow 是 `pull_request_target` 且**只检出 base**（`ref: main`，
# `persist-credentials: false`）⇒ 被执行的判定代码是**受信的 base 实现**，可以安全地拿高配额凭据。
# 写法同 `pr-check.yml`：`AUTOMERGE_PAT || GITHUB_TOKEN`（fork / 未配置 secret ⇒ 自动回落）。
# 判据 = tests/unit_ci_workflows/test_guard_credential_quota.py。
# issue #8395：**不可伪造**的那条 required —— workflow 定义在 base 分支、只检出 base、
# 不执行任何 PR 代码，判定只走 REST API。
#
# 为什么需要它：16 条 required 全部来自 `pull_request` 型 workflow ⇒ fork PR 审批放行后，
# 攻击者可以再推一个 commit 改 `.github/workflows/pr-check.yml`，把检查**伪造为绿**
# （名字可自造、一条不跑）；而 `External Authorship Guard` 自己也住在 `pr-check.yml` 里、
# 且不在 required 集合 ⇒ 「先改 workflow 再伪造」这条路它拦不住。
#
# 本闸门两道全过才算绿：
#   ① 外部作者 / fork 来源 —— 复用 base 里的 `scripts/external_authorship_guard.py`（issue #8386
#      的唯一实现，白名单 = `.github/external-authorship-allow.json`；`--no-remediate` 只判不改，
#      解除 auto-merge / 打标签仍由 pr-check 那份负责）；
#   ② 敏感路径 —— `.github/workflows/**`、`.github/scripts/**`、`deploy/**`、`.githooks` 等
#      （实现 = `.github/scripts/sensitive_path_guard.py`，豁免 = `guard/allow-sensitive-paths` 标签 /
#       bot 作者 / 仓库 owner，均具名打印）。
#
# ⚠️ required 前置（migao-dev-flow §2.2）：**不得**带 `paths:` 过滤、job 级**不得**有 `if:` / `needs:`
#   —— 否则不命中该面的 PR 上该检查永不上报 ⇒ PR 永久 BLOCKED 且没有红信号。
#
# 🔴 「判不了 ≠ 违规」（2026-11-03，issue #8395 裁定）：两道判定都靠 `gh api`，安装令牌限流时
#   会按 fail-closed 返回 exit 2/3 ⇒ job 判红；若本腿是 required，每次限流窗口都会锁死所有合并
#   （2026-11-02 实测 4 次假红，其中 run 41483003592 = `API rate limit exceeded for installation`）。
#   ⇒ 每道判定都经 `.github/scripts/contribution_gate.py retry`：**可证明是限流** ⇒ 有界重试 3 次；
#   重试后仍限流 ⇒ **不判红**（`::warning::` 具名「本次未判定」，重跑该腿即可）；
#   **真实命中仍 exit 1**；**非限流读不到仍按原口径判红**（fail-closed 不变）。
on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  # 同一 PR 的重复事件串行（不 cancel）：让「最后一次判定」稳定落在这个 head sha 上。
  group: contribution-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  gate:
    name: Contribution Gate (authorship + sensitive paths)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1
      # ⚠️ 每道判定都**必须**经 `.github/scripts/contribution_gate.py retry` 包一层（判据：
      # tests/unit_ci_workflows/test_contribution_gate.py 的静态不变式「未包 ⇒ 红」）。
      # 它把「可证明是 API 限流」与「判红」分开：限流 ⇒ 有界重试；重试后仍限流 ⇒ **不判红**
      # （`::warning::` 具名「本次未判定」）；**真实命中仍 exit 1**（issue #8395 裁定）。
      - name: 外部作者 / fork 来源（base 里的唯一实现）
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/contribution_gate.py retry \
            --label "外部作者 / fork 来源" \
            -- python3 scripts/external_authorship_guard.py \
                 --repo "$GITHUB_REPOSITORY" \
                 --pr "${{ github.event.pull_request.number }}" \
                 --allow-file .github/external-authorship-allow.json \
                 --no-remediate
      - name: 敏感路径（CI / 部署 / 密钥扫描面）
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/contribution_gate.py retry \
            --label "敏感路径" \
            -- python3 .github/scripts/sensitive_path_guard.py \
                 --repo "$GITHUB_REPOSITORY" \
                 --pr "${{ github.event.pull_request.number }}" \
                 --author "${{ github.event.pull_request.user.login }}" \
                 --author-type "${{ github.event.pull_request.user.type }}" \
                 --owner "${{ github.repository_owner }}"
