name: Drift Audit (真相源契约)

# ── 这是什么（issue #3843 的 A~H 护栏统一入口）─────────────────────────────────
# 「反复修、反复测、还有问题」的主机制不是断言写法，而是两件**静默**的事：
#   ① **陈旧快照**（读的副本 ≠ 被测对象的当前状态）⇒ 修的目标是错的；
#   ② **移动靶**（用名字/序号/位置定位被测对象）⇒ 测的目标是错的。
# 两者都不报错。本 workflow 是这两件事的**统一判定入口**（一条命令、一个报告）：
#   scripts/drift_audit.py —— 契约与判据定义见 `docs/wiki/truth-source-contract.md`。
#
# ── 两条腿（缺一层就等于没有）────────────────────────────────────────────────
#  · PR：`--check` —— **新增**漂移 ⇒ exit 1（fail-closed）；存量漂移打印放行（基线 burn-down）。
#  · 每日：`--check --strict-stale --fail-on-unknown` —— 债务盘点：基线里"已不再漂移"的条目
#    要红（否则豁免表会僵化），网络不可达也要红（否则"心跳未知"会变成假绿）。
#
# ── 为什么失败时打 `block/merge`（这才是真 fail-closed）────────────────────────
# 本仓库用 GitHub **native auto-merge**：非 bot/draft/无 `block/merge` 的 PR 在 required
# 检查全绿后**秒级自动合并**。新增一个非 required 的检查**不会**拦住合并 ——
# 所以本 job 在审计失败时给 PR 打 `block/merge`（auto-merge 会跳过带该标签的 PR），
# 并在恢复后摘掉。这样"红"才真的会**停下合并**，而不只是"多一行日志"。
#
# ── 边界（照实登记，勿当成"已覆盖"）────────────────────────────────────────
#  · 运行期护栏（结论绑定 (sha, cases_fingerprint, policy_version, 环境指纹) + 用例前置
#    自断言 fail-closed）**不在本 workflow**：实装点在 `tests/agent_eval/local_runner.py`，
#    由另一任务包落地。本审计已产出前三项指纹供那层引用。
#  · 未实装的判据见 `python3 scripts/drift_audit.py --list-checks` 的 `unimplemented`
#    （语义级引用命中 / 写死条数 / 章节指向 / 运行期 fencing / namespace 覆盖率 /
#    同步副本的兑现或撤回）—— **不用恒真判断凑数**。
#
# ── 面外漂移的拦截点（#5074 登记：**别把它读成"已拦"**）──────────────────────
#  · **面外**（新增漂移所属的文件不在本 PR 的改动集里）在 **PR 腿恒绿**：判定面就是「本 PR 的
#    改动集」，把并行包刚合并的漂移判红是「假红」（报错指向错误的对象）。而 `heartbeat` 判据的
#    条目 key 是**裸文件名**（如 `deploy-frontend.yml` 的 `stale` 条目），脚本拿它与**仓库相对
#    全路径**比对 ⇒ 心跳类漂移**结构上永远是面外** ⇒ 没有任何 PR 会因它变红。
#  · ⇒ 面外漂移的拦截点只有两条，且**都是人**：
#    ① **PR 腿**：**面内**新增漂移 ⇒ 给该 PR 打 `block/merge`（`automerge.yml` 的 `if:` 会跳过
#       带该标签的 PR）⇒ **未 arm** 的 PR 被拦；⚠️ **已 arm** 的 PR 标签拦不住（`#4248`：那个
#       `if:` 只在 arm 时生效，停已 arm 的 PR 要 `gh pr merge --disable-auto`）。本 job **不在**
#       分支保护的 required 集合里 —— 该清单**会漂移**，要用
#       `gh api repos/<owner>/<repo>/branches/main/protection` **现查**，不许凭名字/印象写死；
#       故它的拦截力来自 `block/merge`，不是 required。
#    ② **本文件的定时腿 + P1 值班 issue**：定时腿失败 ⇒ 开/更 issue 并打 `priority/P1`
#       （值班口径；issue 正文登记「谁被拦」与清零判据）。
#  · **有意不做**：定时腿失败时给 PR 打 `block/merge`。定时腿**没有 PR**（标签无处施加），而
#    以面外漂移给「相关 PR」打标会把**修这条漂移的那个 PR 自己**拦死 —— 修复要等合并之后才生效
#    ⇒ 标签永远摘不掉 = `#5075` 同款自锁。宁可如实登记「只告警 + 值班」，也不装成「已拦」。
#  · 边界（照实登记）：心跳阈值 = 3 × 声明的 cron 周期，而 GitHub 对本仓的分钟级 cron
#    **实测节流到 2~5.5 小时** ⇒ 声明 `*/N` 的调度会**结构性**判成 `stale`；这条要清零得动
#    调度声明或判据本体（`scripts/drift_audit.py` 的 heartbeat），**不在本 workflow 的判定面内**。

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    # 每日 05:17 CST（UTC+8）= UTC 21:17，避开整点 CI 高峰
    - cron: '17 21 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  # 失败时给 PR 打 `block/merge` + 评论修复指引；恢复后摘标签
  issues: write
  pull-requests: write

concurrency:
  group: drift-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Drift Audit (真相源契约)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # 需要 `origin/main...HEAD` 的三点 diff（判定"本 PR 新增了什么引用/漂移"）
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: pip install pyyaml

      - name: 基准分支与新鲜度自证
        run: |
          git fetch origin main
          echo "HEAD          = $(git rev-parse HEAD)"
          echo "origin/main   = $(git rev-parse origin/main)"
          echo "落后 origin/main 的提交数 = $(git rev-list --count HEAD..origin/main)"

      - name: 漂移审计
        id: audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MODE_ARGS="--check"
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # 债务盘点腿：陈旧基线条目也红；网络不可达（心跳未知）也红
            MODE_ARGS="--check --strict-stale --fail-on-unknown"
          fi
          echo "mode: $MODE_ARGS"
          set +e
          # 不用管道：把输出落盘再 cat（管道会吞掉退出码，是本仓库已踩过的坑）
          python3 scripts/drift_audit.py $MODE_ARGS \
            --base origin/main \
            --json drift-audit-report.json > /tmp/drift-audit.txt 2>&1
          RC=$?
          set -e
          cat /tmp/drift-audit.txt
          echo "exit_code=$RC" >> "$GITHUB_OUTPUT"
          {
            echo "## 漂移审计（真相源契约）"
            echo ''
            echo '```'
            cat /tmp/drift-audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # 面外漂移的**通道登记**（#5074）：PR 腿对面外漂移恒绿（判定面 = 本 PR 的改动集），
          # 这里显式报出条数 + 承接物 —— 免得「面外」被读成「没问题」（那正是本单的缺陷形态）。
          # 存活读数（issue #5326 判据 1）：计数类读数（面外新增漂移条数），**非挂钟时长**。
          # 发射器是**报告者**：它不可用（harness / 浅检出取不到文件）**绝不**得让机制本身失败。
          if [ -f .github/scripts/mechanism_liveness.sh ]; then
            source .github/scripts/mechanism_liveness.sh
            mechanism_liveness_declare --seen "${OUT_SCOPE}" \
              --why "漂移审计完成：面外新增漂移 ${OUT_SCOPE} 条 · 退出码 ${RC}" || true

          fi
          OUT_SCOPE=$(python3 -c "import json;print(json.load(open('drift-audit-report.json'))['summary']['new_drift_out_of_scope'])" 2>/dev/null || echo '?')
          if [ "${OUT_SCOPE}" != "0" ] && [ "${OUT_SCOPE}" != "?" ]; then
            echo "::warning::面外新增漂移 ${OUT_SCOPE} 条（所属文件不在本 PR 改动集 ⇒ **本 PR 不阻塞**）：由定时腿的 P1 值班 issue 承接（标题含「真相源契约审计未通过（定时腿）」）；只有**面内**新增漂移才会卡本 PR。通道语义见本文件头部「面外漂移的拦截点」。"
          fi
          exit $RC

      - name: Upload 机器可读报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: drift-audit-report
          path: drift-audit-report.json
          retention-days: 14
          if-no-files-found: warn

      # ── fail-closed 的执行闸：auto-merge 会跳过带 `block/merge` 的 PR ──────────
      - name: 审计失败 ⇒ 打 block/merge + 贴修复指引
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set +e
          BODY=$(mktemp)
          {
            echo "❌ **Drift Audit 未通过 —— 本 PR 引入了新的「陈旧快照 / 移动靶」漂移。**"
            echo ''
            echo '```'
            cat /tmp/drift-audit.txt 2>/dev/null || echo "(报告缺失)"
            echo '```'
            echo ''
            echo "**怎么改**：上面的『怎么改（按判据逐条）』已按判据给出处置；"
            echo "若确认是**应接受的存量**（不是新增回归）："
            echo '```'
            echo "python3 scripts/drift_audit.py --regen-baseline --reason '<你在 PR 里写的理由>'"
            echo '```'
            echo "契约（判定方式 + 违反后的处置）：\`docs/wiki/truth-source-contract.md\`；"
            echo "判据集合：\`python3 scripts/drift_audit.py --list-checks\`。"
            echo ''
            echo "（已自动打上 \`block/merge\` 以阻止 auto-merge；修复后本 workflow 会自动摘掉。）"
          } > "$BODY"
          gh pr comment "$PR" --body-file "$BODY" || true
          gh pr edit "$PR" --add-label block/merge || true
          exit 0

      - name: 审计通过 ⇒ 摘 block/merge
        if: success() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set +e
          LABELS=$(gh pr view "$PR" --json labels --jq '.labels[].name')
          echo "$LABELS" | grep -qx 'block/merge' && gh pr edit "$PR" --remove-label block/merge || true
          exit 0

      - name: 定时腿失败 ⇒ 开/更 P1 issue（**值班口径**：本通道不拦合并，见文件头登记）
        if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          TITLE="[drift] 真相源契约审计未通过（定时腿）"
          EXIST=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          BODY=$(mktemp)
          {
            echo "定时腿（\`--strict-stale --fail-on-unknown\`）未通过。run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ''
            echo '```'
            cat /tmp/drift-audit.txt 2>/dev/null || echo "(报告缺失)"
            echo '```'
            echo ''
            echo "### 谁被拦（本通道的语义 —— 别当成\"已覆盖\"，见 \`.github/workflows/drift-audit.yml\` 头部）"
            echo ''
            echo "- **本定时腿不拦合并**：定时腿没有 PR ⇒ \`block/merge\` 无处施加；而以面外漂移给"
            echo "  「相关 PR」打标会把**修这条漂移的那个 PR 自己**拦死（修复要等合并后才生效 ⇒ 标签"
            echo "  永远摘不掉）= \`#5075\` 同款自锁。"
            echo "- **替代拦截点**：① **PR 腿**：**面内**新增漂移 ⇒ 给该 PR 打 \`block/merge\`"
            echo "  （\`automerge.yml\` 跳过带该标签的 PR ⇒ 未 arm 的 PR 被拦；已 arm 的要"
            echo "  \`gh pr merge --disable-auto\`，见 \`#4248\`）；② 本 issue（**P1 值班**）承接**面外**漂移。"
            echo "- **清零判据**：\`python3 scripts/drift_audit.py --check --strict-stale --fail-on-unknown --base origin/main\` 退出 0 ⇒ 本 issue 可关。"
            echo "- **本 issue 的处置归属**：面外条目按所属文件分流（如 \`deploy-*\` 归部署包、"
            echo "  \`flaky-ledger-reconcile.yml\` 归台账兜底包）；心跳型条目见文件头登记的边界。"
          } > "$BODY"
          if [ -n "$EXIST" ]; then
            gh issue comment "$EXIST" --body-file "$BODY" || true
            gh issue edit "$EXIST" --add-label priority/P1 || true
          else
            gh issue create --title "$TITLE" --body-file "$BODY" --label priority/P1 || true
          fi
          exit 0

      # ── 存活读数（issue #5326 判据 1 / 4）────────────────────────────────────────
      # 「我没做事」与「我没跑」必须长得不一样：本步 `if: always()` 且是 job 的**最后一步**
      # ⇒ 每轮必出一行 `::notice::MECHANISM-LIVENESS mech=<id> ...`（零动作 ⇒ `acted=0` + `why`）。
      # 机制**停摆**（本步不再执行）⇒ **根本没有这一行**。看门人（`mechanism-liveness.yml` 的
      # 定时腿）断言「main 上最近一次**已完成** run 的注解里存在**绑定该 run id** 的读数」，
      # 缺失 / 绑定旧 run / **读数与 run 结论矛盾** ⇒ 判红（判据 2）。
      # ⚠️ 判定只用 run 归属与结论，**不用挂钟时长**（判据 4：时长受 runner 负载污染）。
      - name: 存活读数（本轮做了什么 / 为什么零动作）
        if: always()
        env:
          OUTCOME: ${ job.status }
        run: bash .github/scripts/mechanism_liveness.sh emit drift-audit --outcome "$OUTCOME"
