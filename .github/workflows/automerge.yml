name: Auto Merge

# 合并治理（2026-09-05 新增）：
# 背景：retrospective 阶段 6——「owner 不能 approve 自己的 PR，必须等人」+ CI 全绿后仍要人工点合并。
# 分支保护 required_approving_review_count=0（无需 review），因此 CI 全绿即可自动合并，
# 消除「等待人工点合并」环节。本工作流对满足条件的 PR 开启原生 auto-merge，
# 由 GitHub 在 required checks 全绿后自动 squash 合并 + 删分支（仓库已开 delete_branch_on_merge）。
#
# 安全护栏（两条路径共用同一组护栏）：
# - 仅同仓库 PR 生效（fork PR 除外，防 token 滥用）
# - draft PR 跳过；带 block/merge 标签的 PR 跳过（人工闸）
# - 目标分支仅 main
#
# ── 2026-09-22 新增 bot 安全路径（关联 #5077，移除 `migao-dev-flow` §7.1 的「⏸ 保留」人工环节）──
# 原 `if:` 逐字含 `user.type != 'Bot'`（注释自陈「bot PR 跳过 —— 依赖升级仍需人工按 SOP 分类」）
# ⇒ **每一条 dependabot PR 都跳过 auto-merge**。实测（2026-09-21/22，issue #5077）：16 条
# dependabot PR 全部停在「没人合」；其中 #4470 / #4475 改 `.github/workflows/**`，**连人工
# `gh pr merge` 都合不了**（本机 token 无 `workflow` scope，GraphQL 拒）⇒ 属技能 §7.1 的
# 「⏸ 保留 | 保持 open，留给有权限者」—— 这一行正是要移除的人工环节。
#
# 现为 **bot PR** 增加一条**受限的**自动 arm 路径（job `enable-auto-merge-bot-safe`）：
# **只有**落在下面两个安全类里才 arm，其余一律 fail-closed 留人工（理由写进 step summary）。
#   安全类 1（#4470 / #4475 的真实形态）：改动文件**全部**在 `.github/workflows/**`，且 diff 的
#     每一处改动**都是** `uses:` 行上的版本 tag（action 名不变、只 tag 变）；不得新增/删除/改名
#     文件、不得新增任何 secrets 引用、不得改触发条件/权限。
#   安全类 2：改动文件**全部**不在 `.github/workflows/**`，且标题声明的版本变更是 **patch 或
#     minor（同 major）**，且该版本字面量确实出现在 diff 的增删行里（不信标题）。**major 升级
#     仍然留人工** —— 这是仓库原本跳过 bot PR 的真实理由（半套升级 / 大版本破坏要人工关）。
# 两类都要求 required 检查未判红、且无 `block/merge` 标签。
# **非 bot（人类 PR）路径的行为逐字不变** —— 既有 job 的 `if:` 与 steps 一个字未改（本文件
# 从 `on:` 起的所有原文原样保留，新增内容只在文件头注释与文件末尾的新 job）。
# 守卫：tests/unit_ci_workflows/test_automerge_bot_safe_path.py（11 条判据各带注入式红证）。
#
# ── 2026-09-24：secrets 判据改为**同源**复用 danger_scan 的剥注释尺子（issue #5286）──────
# 病灶：本 job 里的 `SECRETS_RE.search(原始行)`（子串口径、吃**含注释的整行**）与 `#5268`
# 已修好的 `.github/danger_scan.py` 是**两把不同源的尺子** —— 一句说明性注释（如「全文
# secrets.* 引用仍只有既有那一处」）即判 `SECRETS_ADDED` ⇒ bot PR 拿不到自动 arm。
# 方向是 fail-closed（偏严、**不卡合并**），但与 #5077「移除 dependabot 全人工环节」的目标相抵：
# 这类 PR 会**静默**停在「没人合」。
# 修法（**不抄第三份判定**）：`load_strip_comment()` 经 `importlib` 从仓库加载
# `.github/danger_scan.py` 的 `strip_comment()`（#5268 的纯函数），判据一律建立在**剥掉注释后**
# 的代码文本上。**剥注释实现全仓只剩一份**（判据：`grep -rn --include="*.py" "def strip_comment" .github/`
# ⇒ 恰好 1 行，即 `.github/danger_scan.py`；本文件里只有对它的**调用**，没有第二份实现）。
# 为什么不是第三把尺子：① 实现只有一份，本文件只**调用**、不复制；② 加载的是
# `.github/danger_scan.py`，而 `pull_request_target` 下 checkout 取 **base** ref ⇒ 尺子与定义
# 本 job 的 workflow 属**同一信任域**，被评审的 PR 替换不了它；③ 取不到尺子 ⇒
# `SECRETS_YARDSTICK_UNAVAILABLE` ⇒ **不 arm**（绝不把「量不出来」读成「没问题」）。
# 判据强度**未放宽**：diff 里真新增 secrets 引用 ⇒ 照旧 `SECRETS_ADDED`、照旧不 arm。
# 未改：两个安全类的口径、其余安全闸、非 bot 路径（逐字不变）。
#
# ── 2026-09-23 新增（issue #5235「PR 悬空但零信号」的两族）────────────────────────
# 族 A（**arm 腿自己失败**）：PR 停在「required 全绿但永不合并」，不红、不通知。真因是
#   **GitHub 侧瞬时错误**，不是权限缺口 —— 两个失败 run（`35872446921` 的 PR #5234、
#   `35871475072` 的 PR #5232）的逐字输出：
#       GraphQL: Something went wrong while executing your query on 2026-09-23T14:12:31Z.
#       Please include `4829:3FD750:2EC91:9A0B5:6AB3DE4E` when reporting this issue.
#   而**同一个 run** 的权限面逐字是 `Contents: write / PullRequests: write`
#   ⇒ `permissions:` 不是病因（`gh run list --workflow=automerge.yml` 的 success/failure 混合
#   就是这个瞬时性的读数：近 40 次 19 success / 2 failure / 19 skipped）。
#   ⇒ ① **arm 命令有界重试**（3 次、退避 5/10 秒）；② 判据仍是**回读**的 `autoMergeRequest`
#      （命令成功 ≠ 真的 arm 上了，issue #4829 的既有口径不变）：
#      · 重试后回读 `armed` ⇒ 绿；
#      · 重试后仍失败 **且**回读 `null` ⇒ **红**（`::error::` + step summary）——
#        「真失败吞成 warning」这条老路被明确堵死（守卫见 test_mechanism_jobs_alerting.py
#        的 `TestAutomergeArmRetry`）。
#   ⚠️ **有意不改** bot 安全路径（`enable-auto-merge-bot-safe`）：它的「未 arm」是**设计如此**的
#      fail-closed 结局（留人工），且已把拒绝码写进 step summary；它 `exit 0` 的形态被
#      `test_guard_script_is_fail_closed_by_default` 钉住 ⇒ 不在本单半径内。
# 族 A 的**可见性面**（本文件新增 job `detect-dangling-prs`，判据落在
#   `scripts/dangling_pr_scan.py`）：判据 = **「一个 open PR 在 N 分钟内既没变红、也没合入，
#   且其 required checks 未达可合状态」⇒ 必须产生可见信号**（issue #5235 的裁定口径）。
#   **宿主选择**：挂在本文件（同域 —— 本 workflow 就是「PR 该自动合并却没合」的责任方；
#   arm 腿的修复与它的可见性放在**同一个文件**里 ⇒ 一个评审单元、一个回滚单元）。
#   否决项：`flaky-ledger-reconcile.yml`（其全部注释与测试都定义它是**台账**兜底，
#   且它是 `contents: read` 的只读最小面）、`deploy-reconcile.yml`（部署域）、
#   `close-linked-issues.yml`（合并**之后**的 issue 生命周期，方向相反）、
#   `stale.yml`（第三方 `actions/stale` + 每天 03:17 的日级节奏，装不下 60 分钟级信号）、
#   新建 workflow 文件（本仓裁定：优先挂既有宿主）。
#   ⚠️ 定时档只为这个 job 存在：悬空 PR **不产生任何事件**（这正是它"零信号"的原因）
#   ⇒ 必须有定时入口。GitHub 对 schedule 有节流（本仓实测 2~5.5h），故它是兜底不是实时。

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  schedule:
    # `detect-dangling-prs` 的入口（其余两个 job 在 schedule 上被各自的 `if:` 跳过）：
    # 悬空＝没有事件，只能靠定时扫；实测被节流到 2~5.5h（同 flaky-ledger-reconcile）。
    - cron: '*/20 * * * *'
  workflow_dispatch:   # 手动重扫入口（与对账族一致；不派发任何评测）

permissions:
  pull-requests: write
  contents: write

jobs:
  enable-auto-merge:
    name: Enable auto-merge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: |
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.type != 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !contains(github.event.pull_request.labels.*.name, 'block/merge')

    steps:
      # 2026-09-05 修复（issue #2929）：runner 无 git 上下文时新版 gh CLI 无法解析仓库
      # （`failed to run git: not a git repository`），必须先 checkout 才能执行 gh pr merge --auto
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 告警面（issue #5076 ① 类：机制/簿记 job 自身失败不得静默）：
      #   改前 `gh pr merge … || echo "⚠️ …非错误"` 把**任何**非零返回吞成同一个 warning
      #   ⇒ 真失败（权限/鉴权/GraphQL 报错）与「幂等正常」**同形**，且本仓有过 auto-merge
      #   **静默没 arm** 的事故（issue #4829）。改后按「预期内 vs 真失败」分流：
      #     · 预期内（`already in merge queue` 等幂等情形）→ 非阻塞 + 明确文案；
      #     · 真失败 → `::error::` + step summary + 非零退出（PR 检查列表里真的红）。
      #   命令成功也**不足以**证明 arm 上了 ⇒ 后置条件查 PR 的实际 autoMergeRequest（三态）：
      #     `armed` = 绿；`null` + `mergeable=MERGEABLE` = 红（真静默失效，仍要被抓到）；
      #     `null` + `mergeable=UNKNOWN` = **unknown**（可合并性尚在计算 ⇒ 无从判定，**非红**，见 #5113）。
      # 注：`GITHUB_STEP_SUMMARY` 由 runner 预置为环境变量，无需（也不该）在 env: 里重声明。
      - name: Enable native auto-merge (squash)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 双保险：即使 git 上下文异常，gh 也能凭 GH_REPO 解析目标仓库
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail

          merge_out="$(mktemp)"
          # ⚠️ trap 里的变量名必须与主流程的 `rc` **不同名**：trap 是 EXIT 时执行的，
          #    用 `rc=$?` 会覆盖主流程已判定的退出码（本脚本初版就这么错过一次）。
          trap 'trc=$?; rm -f "${merge_out:-}"; exit $trc' EXIT

          # ---------- ① arm（**有界重试**：#5235 族 A）----------
          # 真因（2026-09-23 两个失败 run `35872446921`(#5234) / `35871475072`(#5232) 的逐字输出）：
          #     GraphQL: Something went wrong while executing your query on 2026-09-23T14:12:31Z.
          #     Please include `4829:3FD750:2EC91:9A0B5:6AB3DE4E` when reporting this issue.
          #   ⇒ **GitHub 侧瞬时错误**（带 request-id 的服务端报错）；同一 run 的权限面逐字是
          #   `Contents: write / PullRequests: write` ⇒ **不是权限缺口、不是静态缺陷**。
          # ⇒ 修法 = **重试**（不是补权限）。退避：最多 3 次、等待 5/10 秒（累计 15 秒）——
          #   远小于本 job 的 `timeout-minutes: 5`，也给下面的回读（最多 20 秒）留足余量。
          # ⚠️ **重试不许把真失败吞成 warning**：最终判据只有一条 —— 回读的 `autoMergeRequest`
          #    是否真的 `armed`（重试仍失败且仍未 arm ⇒ 判红，见下方 `none)` 分支）。
          MERGE_ATTEMPTS=3
          m_attempt=0
          rc=0
          while [ "$m_attempt" -lt "$MERGE_ATTEMPTS" ]; do
            m_attempt=$((m_attempt + 1))
            rc=0
            gh pr merge "$PR_NUMBER" --auto --squash --delete-branch >"$merge_out" 2>&1 || rc=$?
            if [ "$rc" -eq 0 ]; then
              break
            fi
            # 预期内（幂等/暂不可合并）：**只收窄**——必须逐字命中这些标记才算预期内，
            # 其余一律按真失败处理（fail-closed：宁可多报一次，也不静默放过）。
            if grep -qiE 'already (in|queued|enabled|merged)|already been merged' "$merge_out"; then
              echo "ℹ️  预期内（幂等）返回 ${rc}：$(tr '\n' ' ' < "$merge_out")"
              echo "    PR #$PR_NUMBER 的 auto-merge 已处于目标状态，非失败。"
              exit 0
            fi
            if [ "$m_attempt" -lt "$MERGE_ATTEMPTS" ]; then
              delay=$((m_attempt * 5))
              echo "::warning::gh pr merge --auto 第 ${m_attempt}/${MERGE_ATTEMPTS} 次失败（rc=${rc}）⇒ ${delay} 秒后重试（#5235：实测该失败是 GitHub 侧瞬时 GraphQL 错误，退避即可越过）"
              sed 's/^/    /' "$merge_out"
              sleep "$delay"
            fi
          done

          # ---------- 后置条件：命令成功 ≠ 真的 arm 上了（issue #4829 的「静默没 arm」）----------
          # 三态口径（issue #5113）：`armed` ⇒ 绿；`none` + `mergeable=MERGEABLE`（GitHub 已算完
          # 可合并性却仍没 arm）⇒ **红**（真静默失效，对 #4829 的捕获力不得丢）；
          # `none` + `mergeable=UNKNOWN`（**尚在计算**）⇒ **unknown**，不得渲染成红 —— 那是误报：
          # 不是"没 arm"，是"还没算完"。实测（PR #5106 的 run 35677848752）：`gh pr merge --auto`
          # 零输出、rc=0，同一时刻 `gh pr view --json mergeable` = `UNKNOWN` ⇒ 旧实现报「未 arm
          # （静默失效）」，害得要用两次额外事件才 arm 上。
          # 先**退避重试**（覆盖 arm 的传播延迟），重试仍 `none` 再按 `mergeable` 分流。
          # 退避参数：最多 5 次回读、等待 2/4/6/8 秒（累计 20 秒上限）—— arm 的传播与可合并性
          # 计算都是秒级，20 秒足够越过窗口，又远小于本 job 的 `timeout-minutes: 5`。
          attempt=0
          state=""
          while [ "$attempt" -lt 5 ]; do
            attempt=$((attempt + 1))
            state="$(gh pr view "$PR_NUMBER" \
              --json autoMergeRequest \
              --jq 'if .autoMergeRequest == null then "none" else "armed" end' 2>/dev/null || true)"
            [ "$state" = "armed" ] && break
            if [ "$attempt" -lt 5 ]; then sleep $((attempt * 2)); fi
          done
          if [ -z "$state" ]; then
            echo "::error::auto-merge 后置状态查询失败（PR #${PR_NUMBER}：gh 限流/网络/无权限，已重试 ${attempt} 次；arm 命令 rc=${rc}、尝试 ${m_attempt} 次）—— 无法判定是否已 arm，不得当成功"
            {
              echo "### Enable auto-merge — 后置状态无法判定"
              echo ""
              echo "- PR：#$PR_NUMBER"
              echo "- \`gh pr merge --auto\` 退出码 ${rc}（尝试 ${m_attempt} 次），且 \`gh pr view --json autoMergeRequest\` 查询失败（已重试 ${attempt} 次）。"
              echo "- ⇒ 三态判定为 **unknown**，不得当「已 arm」读。"
            } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 1
          fi
          case "$state" in
            armed)
              if [ "$rc" -ne 0 ]; then
                # 动作失败 ∧ 回读已 arm ⇒ 目标状态**已达成**（读数与动作自洽，同
                # flaky-ledger-reconcile.yml §⑤-B 的口径）：非致命，但**不静默**。
                echo "::warning::gh pr merge --auto 重试 ${m_attempt} 次后仍返回 ${rc}，但回读 autoMergeRequest=armed ⇒ 目标状态已达成（读数与动作自洽）⇒ 非致命；required 全绿后 GitHub 会自行合并"
                {
                  echo "### Enable auto-merge — 动作失败但回读已 arm（非致命，不静默）"
                  echo ""
                  echo "- PR：#$PR_NUMBER"
                  echo "- \`gh pr merge --auto\` 重试 ${m_attempt} 次后仍返回 ${rc}（见上方输出）"
                  echo "- 但**动作之后回读** \`autoMergeRequest\` = armed ⇒ 已由其它路径 arm。"
                  echo "- ⇒ 读数与动作自洽：**目标状态已达成** ⇒ 非致命；本 job 判绿（这条注解就是它的可见性，不静默）。"
                } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
              else
                echo "✅ auto-merge 已 arm（PR #${PR_NUMBER}，squash + delete-branch）"
              fi
              ;;
            none)
              if [ "$rc" -ne 0 ]; then
                # 🔴 #5235 族 A 的判据本体：**arm 失败（已重试）且回读仍未 arm** ⇒ 判红。
                #    「真失败吞成 warning」这条老路在这里被明确堵死（见文件头的族 A 段）。
                echo "::error::auto-merge 未 arm：arm 命令重试 ${m_attempt} 次后仍失败（rc=${rc}）且回读 autoMergeRequest=null ⇒ PR #$PR_NUMBER 会停在「required 全绿但永不合并」（#5235 族 A）。可行动：重跑本 job（push/打标签等事件会重新触发 arm），或人工 \`gh pr merge $PR_NUMBER --auto --squash\`"
                {
                  echo "### Enable auto-merge — arm 失败且仍未 arm（#5235 族 A）"
                  echo ""
                  echo "- PR：#$PR_NUMBER"
                  echo "- \`gh pr merge --auto\` 重试 ${m_attempt} 次后仍返回 ${rc}，且回读 \`autoMergeRequest\` 为 null ⇒ **未 arm 是确证**（不是「还没算完」）。"
                  echo "- ⇒ 本 job 判红即为真问题：CI 一绿**不会**自动合并，PR 会静默停在「全绿但不合」。"
                } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
                exit 1
              fi
              # 只有**逐字 `UNKNOWN`** 才分流到 unknown（读不到可合并性时仍 fail-closed 判红：
              # 宁可多报一次，也不静默放过 —— 与本 job 既有口径一致）。
              mergeable="$(gh pr view "$PR_NUMBER" \
                --json mergeable --jq '.mergeable' 2>/dev/null || true)"
              if [ "$mergeable" = "UNKNOWN" ]; then
                echo "::warning::auto-merge 无从判定（非红）：gh 返回 0，但 PR #${PR_NUMBER} 的 autoMergeRequest 仍为 null 且 mergeable=UNKNOWN（GitHub 尚在计算可合并性）—— 三态判 unknown，不得当红也不得当绿"
                {
                  echo "### Enable auto-merge — 无从判定（unknown，非红）"
                  echo ""
                  echo "- PR：#$PR_NUMBER"
                  echo "- 已重试 ${attempt} 次回读（退避 2/4/6/8 秒），\`autoMergeRequest\` 始终为 null。"
                  echo "- 但 \`mergeable=UNKNOWN\` ⇒ **可合并性尚在计算**（arm 后立刻回读会撞上这个窗口，"
                  echo "  实测 PR #5106 的 run 35677848752）⇒ **无从判定是否已 arm**。"
                  echo "- ⇒ 三态判定为 **unknown**：不得当红（那是误报），也不得当绿（未证实已 arm）。"
                  echo "- 处置：无需人工干预；若 arm 已生效，required 检查全绿后 GitHub 会自行合并。"
                } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
                exit 0
              fi
              echo "::error::auto-merge 未 arm：gh 返回 0 但 PR #$PR_NUMBER 的 autoMergeRequest 仍为 null 且 mergeable=${mergeable}（issue #4829 的静默没 arm 形态）"
              {
                echo "### Enable auto-merge — 未 arm（静默失效）"
                echo ""
                echo "- PR：#$PR_NUMBER"
                echo "- 已重试 ${attempt} 次回读（退避 2/4/6/8 秒），\`autoMergeRequest\` 始终为 null。"
                echo "- \`mergeable=${mergeable}\` ⇒ 可合并性**已算完**却仍没 arm。"
                echo "- ⇒ 命令成功不代表 arm 成功（#4829）：CI 一绿**不会**自动合并。"
              } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
              exit 1
              ;;
            *)
              echo "::error::auto-merge 后置状态不可解析（PR #${PR_NUMBER}）：state='$state'"
              exit 1
              ;;
          esac
  # ── bot 安全路径（2026-09-22 新增，关联 #5077）────────────────────────────────
  # 与既有 job 同一组护栏，只把作者类型换成 bot（两条路径互斥 ⇒ 任一 PR 只可能走一条）。
  enable-auto-merge-bot-safe:
    name: Enable auto-merge (bot, safe classes only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.type == 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !contains(github.event.pull_request.labels.*.name, 'block/merge')

    steps:
      # 同既有 job：gh CLI 需要 git 上下文才能解析仓库。`pull_request_target` 下
      # `actions/checkout` 默认取 **base** ref，且这里**不传 `ref`** ⇒ 绝不在特权上下文
      # 执行 PR 代码（判据见守卫的 test_bot_job_does_not_checkout_pr_head）。
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify bot PR (fail-closed) and arm only if safe
        env:
          # 用 `github.token`（= 内置 GITHUB_TOKEN，同一凭据）而**不是**再写一处 secrets 引用
          # 引用：本 PR 的硬约束禁止新增 secrets 引用（Danger Scan 会 BLOCK），两者取值完全相同。
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          python3 - <<'PY'
          """bot PR 安全分类 + 受限 arm（fail-closed）。

          判定口径见本 workflow 头部注释；守卫见 tests/unit_ci_workflows/test_automerge_bot_safe_path.py。
          任何一步「不确定」⇒ 不 arm（fail-closed），并把可行动的理由写进 step summary。
          """
          import importlib.util
          import json
          import os
          import re
          import subprocess

          GH = os.environ.get("AUTOMERGE_GH_BIN", "gh")
          REPO = os.environ.get("GH_REPO", "")
          PR = os.environ.get("PR_NUMBER", "")
          TITLE = os.environ.get("PR_TITLE", "")
          LABELS = [x.strip() for x in os.environ.get("PR_LABELS", "").split(",") if x.strip()]
          SUMMARY = os.environ.get("GITHUB_STEP_SUMMARY", "")

          WORKFLOW_DIR = ".github/workflows/"
          # workflow 里 uses 是**列表项**（`- uses: a@v1`），且 pin 形态常带尾注释（`@<sha> # v4`）
          USES_RE = re.compile(r"^\s*(?:-\s+)?uses:\s*([^\s@]+)@(\S+?)\s*(?:#.*)?$")
          BUMP_RE = re.compile(
              r"^\s*(?:chore|build)\(deps(?:-dev)?\):\s*(?:bump|update)\s+.+?\s+"
              r"(?:requirement\s+)?from\s+(\S+)\s+to\s+(\S+)")
          SECRETS_RE = re.compile(r"secrets\.")
          SEMVER_RE = re.compile(r"(\d+)(?:\.(\d+))?(?:\.(\d+))?")

          ACTION = {
              "BLOCK_LABEL": "人工闸生效：移除 block/merge 标签后，labeled/unlabeled 事件会让本 job 重跑",
              "GH_API_FAILED": "读不到 PR 文件清单（token/网络）⇒ 保持人工，勿凭猜测 arm",
              "NO_FILES": "PR 改动文件清单为空 ⇒ 无法判定安全类，保持人工",
              "FILE_ADDED_OR_REMOVED": "新增/删除/改名文件不在任何安全类内（workflow 可携带 secrets 执行）⇒ 人工审查",
              "SECRETS_ADDED": "diff 新增了 secrets 引用 ⇒ 人工安全审查",
              "SECRETS_YARDSTICK_UNAVAILABLE": "取不到 .github/danger_scan.py 的 strip_comment（#5268 的剥注释尺子）⇒ 无法判定候选行是否真引用 ⇒ 保持人工（fail-closed）",
              "PATCH_UNAVAILABLE": "拿不到 patch（二进制/超大 diff）⇒ 无法逐行校验 ⇒ 人工",
              "NOT_USES_ONLY": "workflow 改动不止 uses 版本 tag（触发条件/权限/结构）⇒ 人工审查",
              "ACTION_NAME_CHANGED": "action 名变了（不只是 tag）⇒ 人工审查",
              "NO_TAG_CHANGE": "uses tag 无实际变化 ⇒ 没有可自动合并的升级",
              "MIXED_SURFACE": "同时改了 workflow 与非 workflow 文件 ⇒ 不在两个安全类内 ⇒ 人工",
              "TITLE_UNPARSEABLE": "标题不是「单包 from A to B」形态（多包/无版本）⇒ 半套升级风险 ⇒ 人工",
              "NO_VERSION_CHANGE": "版本未变化 ⇒ 无需自动合并",
              "VERSION_DOWNGRADE": "版本回退 ⇒ 人工确认",
              "VERSION_MAJOR": "major 升级 ⇒ 人工（半套升级/大版本破坏）",
              "TITLE_PATCH_MISMATCH": "标题声明的版本字面量未出现在 diff 增删行里 ⇒ 标题不可信 ⇒ 人工",
              "CHECKS_UNREADABLE": "读不到检查状态 ⇒ fail-closed（「看不了」不当「没问题」）",
              "CHECKS_FAILED": "存在判红检查（required 判红时 GitHub 报 BLOCKED）⇒ 先修红；修好后 push 会重跑本 job",
              "MERGE_CMD_FAILED": "gh pr merge --auto 返回非 0 ⇒ 见日志（已 arm 过 / 暂不可合并非错误）",
              "ARMED": "已开启 native auto-merge：required 检查全绿后由 GitHub squash 合并 + 删分支",
          }


          def gh(*args):
              return subprocess.run([GH, *args], capture_output=True, text=True)


          def note(fields):
              lines = ["%s=%s" % (k, v) for k, v in fields.items()]
              lines.append("处置=%s" % ACTION.get(fields.get("CODE", ""), "（未登记处置）"))
              print("\n".join(lines))
              if SUMMARY:
                  with open(SUMMARY, "a", encoding="utf-8") as fh:
                      fh.write("\n".join(lines) + "\n")


          def ver(text):
              m = SEMVER_RE.search(text)
              return None if m is None else tuple(int(g) if g else 0 for g in m.groups())


          def added_removed(patch):
              added, removed = [], []
              for line in patch.splitlines():
                  if line.startswith("+++") or line.startswith("---"):
                      continue
                  if line.startswith("+"):
                      added.append(line[1:])
                  elif line.startswith("-"):
                      removed.append(line[1:])
              return added, removed


          def check_uses_only(wf_files):
              """安全类 1：全部改动都是 uses: 行上的版本 tag（action 名不变、只 tag 变）。"""
              for f in wf_files:
                  name = f.get("filename", "?")
                  patch = f.get("patch")
                  if not patch:
                      return False, "PATCH_UNAVAILABLE", "%s 拿不到 patch" % name
                  added, removed = added_removed(patch)
                  if not added or len(added) != len(removed):
                      return False, "NOT_USES_ONLY", "%s 增删行数不等或为空（+%d/-%d）" % (name, len(added), len(removed))
                  a_uses = [USES_RE.match(x) for x in added]
                  r_uses = [USES_RE.match(x) for x in removed]
                  for line, m in list(zip(added, a_uses)) + list(zip(removed, r_uses)):
                      if m is None:
                          return False, "NOT_USES_ONLY", "%s 存在非 uses: 行改动：%s" % (name, line.strip()[:120])
                  if sorted(m.group(1) for m in a_uses) != sorted(m.group(1) for m in r_uses):
                      return False, "ACTION_NAME_CHANGED", "%s 改动了 action 名（不只是 tag）" % name
                  if [m.group(2) for m in a_uses] == [m.group(2) for m in r_uses]:
                      return False, "NO_TAG_CHANGE", "%s 的 uses tag 没有实际变化" % name
              return True, "WORKFLOW_USES_TAG_ONLY", "全部改动都是 uses: 行上的版本 tag"


          def check_version_bump(dep_files):
              """安全类 2：非 workflow 文件 + 标题声明的 patch/minor 升级，且 diff 与标题一致。"""
              m = BUMP_RE.match(TITLE)
              if m is None:
                  return False, "TITLE_UNPARSEABLE", "标题不是可解析的单包升级形态：%r" % TITLE
              old_raw, new_raw = m.group(1), m.group(2)
              old, new = ver(old_raw), ver(new_raw)
              if old is None or new is None:
                  return False, "TITLE_UNPARSEABLE", "版本号无法解析：%r → %r" % (old_raw, new_raw)
              if new == old:
                  return False, "NO_VERSION_CHANGE", "版本未变化（%s → %s）" % (old_raw, new_raw)
              if new < old:
                  return False, "VERSION_DOWNGRADE", "版本回退（%s → %s）" % (old_raw, new_raw)
              if new[0] != old[0]:
                  return False, "VERSION_MAJOR", "major 升级（%s → %s）仍需人工" % (old_raw, new_raw)
              for f in dep_files:
                  name = f.get("filename", "?")
                  patch = f.get("patch")
                  if not patch:
                      return False, "PATCH_UNAVAILABLE", "%s 拿不到 patch" % name
                  added, removed = added_removed(patch)
                  if not any(new_raw in x for x in added) or not any(old_raw in x for x in removed):
                      return False, "TITLE_PATCH_MISMATCH", "%s 的 diff 里找不到标题声明的 %r→%r" % (name, old_raw, new_raw)
              return True, "DEP_PATCH_OR_MINOR", "patch/minor 升级（%s → %s）且 diff 与标题一致" % (old_raw, new_raw)


          def load_strip_comment():
              """从仓库加载 `.github/danger_scan.py` 的 `strip_comment`（#5268 的纯函数）。

              **同源**（issue #5286）：剥注释实现全仓只有那**一份**，本文件只调用、不复制
              ⇒ 不会长出第三把尺子。路径取 checkout 根（`GITHUB_WORKSPACE`，Actions 预置；
              本机复跑退化为 cwd）；`pull_request_target` 下 checkout 取 **base** ref ⇒ 尺子与
              定义本 job 的 workflow 属**同一信任域**，被评审的 PR 替换不了它。
              该模块只依赖标准库、且 `main()` 在 `if __name__ == "__main__"` 之后 ⇒ import 无副作用。
              加载失败 / 没有这个函数 ⇒ 返回 None ⇒ 调用方 fail-closed（不 arm）。
              """
              root = os.environ.get("GITHUB_WORKSPACE") or os.getcwd()
              path = os.path.join(root, ".github", "danger_scan.py")
              try:
                  spec = importlib.util.spec_from_file_location("migao_danger_scan", path)
                  if spec is None or spec.loader is None:
                      return None
                  module = importlib.util.module_from_spec(spec)
                  spec.loader.exec_module(module)
              except Exception:  # 安全门禁：任何加载失败都不得被读成「没有风险」
                  return None
              fn = getattr(module, "strip_comment", None)
              return fn if callable(fn) else None


          def classify():
              if "block/merge" in LABELS:
                  return False, "BLOCK_LABEL", "PR 带 block/merge 标签（人工闸）"
              proc = gh("api", "repos/%s/pulls/%s/files" % (REPO, PR), "--paginate", "--jq", ".[]")
              if proc.returncode != 0:
                  return False, "GH_API_FAILED", "gh api 返回 %d：%s" % (proc.returncode, proc.stderr.strip()[:200])
              files = []
              try:
                  for line in proc.stdout.splitlines():
                      if line.strip():
                          files.append(json.loads(line))
              except json.JSONDecodeError as exc:
                  return False, "GH_API_FAILED", "gh api 输出不是 JSON：%s" % exc
              if not files:
                  return False, "NO_FILES", "PR 改动文件清单为空"
              for f in files:
                  if f.get("status") != "modified":
                      return False, "FILE_ADDED_OR_REMOVED", "%s 状态=%s" % (f.get("filename", "?"), f.get("status"))
              # #5286：判定必须建立在**剥掉注释后**的代码文本上（与 .github/danger_scan.py 同源）。
              # 两段式：① 候选 = **超集**（含 `secrets.` 的新增行，注释里的也算候选）；
              #         ② 判定才向仓库里的尺子要 —— 与 secrets 无关的 PR 不依赖那把尺子。
              strip = None
              for f in files:
                  for line in (f.get("patch") or "").splitlines():
                      if not line.startswith("+") or line.startswith("+++"):
                          continue
                      text = line[1:]  # diff 前缀 `+` 不是代码内容
                      if not SECRETS_RE.search(text):
                          continue
                      if strip is None:
                          strip = load_strip_comment()
                      if strip is None:
                          return False, "SECRETS_YARDSTICK_UNAVAILABLE", "%s：候选行 %s" % (f.get("filename", "?"), line.strip()[:120])
                      if SECRETS_RE.search(strip(text)):
                          return False, "SECRETS_ADDED", "%s：%s" % (f.get("filename", "?"), line.strip()[:120])
              wf_files = [f for f in files if f.get("filename", "").startswith(WORKFLOW_DIR)]
              dep_files = [f for f in files if not f.get("filename", "").startswith(WORKFLOW_DIR)]
              if wf_files and dep_files:
                  return False, "MIXED_SURFACE", "同时改了 workflow 与非 workflow 文件"
              if wf_files:
                  return check_uses_only(wf_files)
              return check_version_bump(dep_files)


          def checks_verdict():
              """required 检查是否未判红 —— 用 GitHub 自己的判定，不自己拼 required 清单。

              CI 里读不到分支保护的 required 集合（GET /branches/main/protection 需 admin，GITHUB_TOKEN
              不是 admin），gh pr view --json statusCheckRollup 的 isRequired 也恒为 null（该字段是需带参的
              GraphQL 字段）⇒ 唯一权威信号是 mergeStateStatus：UNSTABLE = required 未判红、只是非 required
              项在红；required 真红时 GitHub 报 BLOCKED。实测（#5077 ③）：dependabot PR 上恒有一条非 required
              的陈旧红 Reconcile and dispatch missing deploys ⇒ 若按「一条不红才算绿」实现，#4475/#4471/#4469
              依然不 arm，本路径等于零生效。
              """
              proc = gh("pr", "checks", PR, "--json", "name,state,bucket")
              if proc.returncode not in (0, 1, 8):
                  return False, "CHECKS_UNREADABLE", "gh pr checks 返回 %d：%s" % (proc.returncode, proc.stderr.strip()[:200])
              try:
                  rows = json.loads(proc.stdout or "[]")
              except json.JSONDecodeError as exc:
                  return False, "CHECKS_UNREADABLE", "gh pr checks 输出不是 JSON：%s" % exc
              if not rows and proc.returncode != 0:
                  return False, "CHECKS_UNREADABLE", "gh pr checks 无输出且退出码非 0"
              failing = [r.get("name") for r in rows if r.get("bucket") in ("fail", "cancel")]
              if not failing:
                  return True, "CHECKS_GREEN", "无判红检查"
              view = gh("pr", "view", PR, "--json", "mergeStateStatus", "--jq", ".mergeStateStatus")
              state = view.stdout.strip() if view.returncode == 0 else ""
              if state == "UNSTABLE":
                  return True, "CHECKS_UNSTABLE_NONREQUIRED", "mergeStateStatus=UNSTABLE（required 未判红）；非 required 判红：%s" % failing
              return False, "CHECKS_FAILED", "mergeStateStatus=%s；判红检查：%s" % (state or "<读不到>", failing)


          def main():
              ok, code, detail = classify()
              klass = code if ok else ""
              if ok:
                  ok, code, detail = checks_verdict()
              if not ok:
                  note({"CODE": code, "REASON": detail})
                  print("未 arm（fail-closed）—— 该 PR 保持人工处置")
                  return
              merge = gh("pr", "merge", PR, "--auto", "--squash", "--delete-branch")
              if merge.returncode != 0:
                  note({"CODE": "MERGE_CMD_FAILED",
                        "REASON": "gh pr merge --auto 返回 %d：%s" % (merge.returncode, merge.stderr.strip()[:200])})
                  return
              note({"CODE": "ARMED", "CLASS": klass, "CHECKS": code, "REASON": detail})
              print("已 arm native auto-merge（required 检查全绿后 GitHub 自动 squash 合并 + 删分支）")


          if __name__ == "__main__":
              main()

          PY

  # ── 可见性面（2026-09-23 新增，issue #5235：「悬空 PR 零信号」的通用检测器）────────
  # 判据（issue 裁定口径，逐字落码在 scripts/dangling_pr_scan.py）：
  #   **一个 open PR 在 N 分钟内既没变红、也没合入，且其 required checks 未达可合状态
  #   ⇒ 必须产生一条可见信号**（本 job 判红 + `::error::` + step summary 落笔）。
  # 两条实测实例：#5139（族 B：`GITHUB_TOKEN` 推的提交 ⇒ workflow 不触发 ⇒ 0 条 check、
  # required 永远 pending、auto-merge 已 armed 却永不合）与族 A 的 arm 失败（#5232/#5234）。
  # 与 `flaky-ledger-reconcile.yml` §⑤-C 的关系：那条只覆盖**台账 PR**（三条件 fail-closed），
  # 本 job 是同一口径的**通用面**（全部 `base=main` 的 open PR）⇒ 两台检测器对台账 PR 会同时红，
  # 那不是矛盾（同一个真问题、两条独立证据链），而台账之外的人类 PR 只有这一台。
  # ⚠️ **本 job 只在 `schedule` / `workflow_dispatch` 上跑**：它的红说的是「主线上有悬空 PR」，
  #    与任何单个 PR 无关 ⇒ 绝不许挂上 `pull_request_target`（否则每个 PR 都会多出一条与它无关的红）。
  detect-dangling-prs:
    name: Detect dangling PRs (open >N min, no red, required not met)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # 只读（**窄于** workflow 顶层的写权限）：本 job 只扫、不改任何东西。
    permissions:
      contents: read
      pull-requests: read
      actions: read
    env:
      # 与既有 job 同一内置凭据（本文件全文的凭据引用仍只有既有那一处；
      # 这句注释本身曾因含 `secrets` + 通配点被 Danger Scan 的前置子串筛选误判为「新增 1 处非内置凭据引用」⇒ 已立 issue #5268，本单按最小改法改写措辞解绑，**未**改任何门禁逻辑、**未**碰豁免通道）
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # 「悬空」的年龄阈值：60 分钟 —— 远大于本仓 CI 的常规时长（常见十几~几十分钟），
      # 且另有「有 pending check / 有在跑的 run ⇒ 不报」这条异步窗口护栏（双保险，防假红）。
      DANGLING_MINUTES: '60'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: "Scan open PRs (悬空 ⇒ ::error:: + 非零退出)"
        # `if: always()`：本步是 job 的**最后一步**，它同时承担**存活读数**（issue #5326 判据 1 / 4）
        # —— 于是「悬空 ⇒ 判红」与「每轮必出声」由同一步保证，且**不新加一步**（既有红证
        # `tests/unit_ci_workflows/test_dangling_pr_scan.py` 的 `test_host_workflow_wiring_guard_is_not_vacuous`
        # 以「最后一步 = 跑判据脚本的那一步」为前提，加一步会把它变成空断言）。
        if: always()
        run: |
          # 判据与动作都在 scripts/dangling_pr_scan.py（单一实现，本机可复跑）。
          # 退出码三态：0 = 无悬空；1 = **有**悬空（本行让 job 判红）；3 = 无法判定（不得当 0 读）。
          set +e
          python3 scripts/dangling_pr_scan.py \
            --repo "$GITHUB_REPOSITORY" --minutes "$DANGLING_MINUTES"
          RC=$?
          set -e
          # 存活读数（issue #5326 判据 1 / 4）：`rc≠0` 也必须出声（「我有事要说」≠「我没跑」）。
          # 发射器可能不在检出里（固定 ref / 浅检出）⇒ 降级为 warning，**绝不**让读数把机制判红。
          if [ -f .github/scripts/mechanism_liveness.sh ]; then
            bash .github/scripts/mechanism_liveness.sh emit automerge --rc "$RC" \
              --why "悬空 PR 扫描：退出码 ${RC}（0=无悬空 / 1=有悬空 / 3=无法判定）"
          else
            echo "::warning::机制存活读数**本轮无声**（mech=automerge）：发射器不在检出里（检出固定 ref / 浅检出）⇒ 本轮读数缺失（**不是**「零动作」）"
          fi
          exit $RC
