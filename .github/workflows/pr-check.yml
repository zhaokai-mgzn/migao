name: PR Check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# CI 队列治理（v1.3，2026-09-04）：同 PR 新 push 自动取消旧 run，防多 PR/多 commit 并发打满队列
concurrency:
  group: ci-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  # 读 PR 评论（danger-scan 的「删除 workflow」确认通道，#4295/#4301：ack 步骤调
  # `gh api .../issues/{n}/comments`）。显式声明而不是依赖「pull-requests: write 是否
  # 隐含覆盖 issue 评论读」的推断 —— 该通道的失效形态是 fail-closed（永远不放行），
  # 推断错了就是静默失效（§18.6「环境静默即缺陷」）。
  issues: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ============ 安全门禁：拦截 .env 文件 ============
  block-env-files:
    name: Block .env files (except .env.example)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check for forbidden .env files
        run: |
          # ⚠️ `--diff-filter=ACMR`（issue #5083）：`git diff --name-only` **会列出被删除的文件**
          # ⇒ 不带 filter 时，`git rm --cached <某>.env.production` 之后那两个路径必然进 diff
          # ⇒ 判 forbidden ⇒ 本 required 检查恒红 ⇒ **「把违规 .env 下架」这个正确动作被门禁
          # 本身永久禁止**（自相矛盾的门禁）。只放宽「删除」这一维：新增/复制/修改/重命名
          # （ACMR）仍然拦得住 ⇒ 门禁语义不变。
          FORBIDDEN=$(git diff --diff-filter=ACMR --name-only origin/main...HEAD | grep -E '\.env$|\.env\.' | grep -v '\.env\.example' || true)
          if [ -n "$FORBIDDEN" ]; then
            echo "❌ PR contains forbidden .env files:"
            echo "$FORBIDDEN"
            echo "Use .env.example template instead. Real values go to deployment platform env vars."
            exit 1
          fi
          echo "✅ No forbidden .env files"

  # ============ admin-api 单测全量 ============
  admin-api-test:
    name: admin-api unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ── 路径门控（issue #3507 ①，2026-09-26）────────────────────────────────
      # 口径 = 本仓既有「**job 内 diff 门控**」范式（`docs/wiki/CI-CD.md`「变更门控」；
      # 同 `ai-agent-tests` / `mini-app` / `bmini-app` / 本文件 `admin-web-test`）：
      # **job 保持运行**（required check 永不悬空），只让实际执行的 step 跳过。
      # ⛔ 不许改成 workflow 级 `paths:` —— 那会让不碰该路径的 PR **永远拿不到这条
      # required check**（GitHub 报 "Expected — waiting for status to be reported"，
      # 而**没有任何东西会变红**）。常驻判据 = tests/unit_ci_workflows/test_required_check_no_paths_filter.py。
      - name: Detect admin-api changes
        id: detect_api
        run: |
          # 仅 PR 事件用 diff 门控；push main / workflow_dispatch 全量跑（origin/main 与 HEAD 相同，diff 无意义）
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
            echo "✅ 非 PR 事件，全量执行 admin-api 单测"
            exit 0
          fi
          git fetch origin main --quiet
          CHANGED=$(git diff --name-only origin/main...HEAD)
          # 触发面 = 本 job 断言**真读**的对象面 ∪ 本 job 自身。
          # ① `backend/admin-api/**` 全覆盖：单测在 `backend/admin-api` 里跑（`./mvnw test`），
          #    且 `src/test/**` 里按仓根拼出的仓内路径（`Path.of("backend/…")` 一类）经复算
          #    **全部**落在 `backend/admin-api/` 下 —— 复算：
          #      grep -rhoE '"(backend|frontend|scripts|tests|docs|\.github)/[^"]*"' \
          #        backend/admin-api/src/test --include=*.java | sort -u
          #    该模块**没有**仓内 Maven 父/兄弟模块（`backend/admin-api/pom.xml` 的 parent 是
          #    `spring-boot-starter-parent`，仓根无 `pom.xml` / `.mvn`）⇒ 不存在「改了别的模块
          #    而本模块单测该跑」的形态。
          # ② `\.github/workflows/pr-check\.yml$` = 本 job 自己的定义：改这条腿的 PR 必须能
          #    验证它自己（否则「把 mvn 命令改坏」这类改动会静默跳过本腿 ⇒ 没跑长得像通过）。
          # 登记册（谓词逐字 + must_cover 覆盖 + 未登记即红）=
          #   tests/unit_ci_workflows/declaration_gate_registry.json
          HITS=$(echo "$CHANGED" | grep -E '^(backend/admin-api/|\.github/workflows/pr-check\.yml$)' || true)
          if [ -n "$HITS" ]; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
            echo "✅ 检测到 admin-api 相关变更，执行单测"
          else
            echo "run_tests=false" >> "$GITHUB_OUTPUT"
            echo "⏭️ 无 admin-api 相关变更 —— 单测**未跑**（「没跑」不是「通过」）"
          fi

      - name: Set up JDK 21
        if: steps.detect_api.outputs.run_tests == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # ── 为什么这两步不能省（issue #5192）─────────────────────────────────────
      # 本 job **没有 `services:`**、也不装 PG：真库判据（`*RealDbTest` 等 14 个类）各自跑
      # 一次性 `initdb` + `pg_ctl` 集群，需要的是**二进制**而不是服务 —— 而二进制是
      # `ubuntu-latest`（24.04）镜像**恰好自带**的（`/usr/lib/postgresql/16/bin`，
      # `PgCluster.BIN_DIRS` 那几条 Debian 绝对路径命中，非显式安装）。
      # ⇒ 镜像换代 / 换 runner / 自建 runner 时命中失败，若无人拦，`Assumptions.abort`
      #   会让「缺 PG」与「通过」在结果列上**长得一样（都绿）**：全体真库判据**静默腐烂**，
      #   且**没有任何东西会变红**（本仓点名的形态）。
      # ⇒ 两道锁：① 下面这道**前置断言**（找不到二进制即红，并打印它找到的路径，
      #   便于事后判断是「镜像换代」还是「搜索路径变了」）；② `Run unit tests` 注入
      #   `MIGAO_REQUIRE_REALDB=1`，`PgCluster.startOrAbort()` 据此把「缺 PG」判成 **FAIL**
      #   而不是 skip。两道锁的防回退守卫 = tests/unit_ci_workflows/test_realdb_failclosed.py。
      - name: Assert PostgreSQL binaries exist (fail-closed 前置，issue #5192)
        if: steps.detect_api.outputs.run_tests == 'true'
        run: |
          # 判据源与 `PgCluster.BIN_DIRS` 同源：PATH + Debian 的 /usr/lib/postgresql/{14,15,16}/bin
          initdb="$(command -v initdb || true)"
          pg_ctl="$(command -v pg_ctl || true)"
          for d in /usr/lib/postgresql/16/bin /usr/lib/postgresql/15/bin /usr/lib/postgresql/14/bin; do
            [ -n "$initdb" ] || [ ! -x "$d/initdb" ] || initdb="$d/initdb"
            [ -n "$pg_ctl" ] || [ ! -x "$d/pg_ctl" ] || pg_ctl="$d/pg_ctl"
          done
          echo "runner 镜像 = ${ImageOS:-?} / ${ImageVersion:-?}"
          echo "initdb = ${initdb:-<缺失>}"
          echo "pg_ctl = ${pg_ctl:-<缺失>}"
          if [ ! -x "${initdb:-/nonexistent}" ] || [ ! -x "${pg_ctl:-/nonexistent}" ]; then
            echo "::error::找不到 PG 二进制（initdb/pg_ctl）⇒ 真库判据无法执行。"
            echo "本 job 不装 PG，二进制靠 runner 镜像自带（理由见本 job 上方注释，issue #5192）。"
            echo "镜像换代请在此处补装 PostgreSQL —— **不要**删掉本前置断言，"
            echo "否则「缺 PG」会退回成静默 skip（绿）而无人发现。"
            exit 1
          fi
          echo "✅ PG 二进制存在 —— 真库判据能真跑"

      - name: Run unit tests
        if: steps.detect_api.outputs.run_tests == 'true'
        working-directory: backend/admin-api
        env:
          # 缺 PG ⇒ `PgCluster.startOrAbort()` 判 **FAIL**（不是 skip）：CI 上「没跑」绝不能是绿。
          MIGAO_REQUIRE_REALDB: "1"
        run: ./mvnw test -q

  # ============ CI workflow 辅助工具单测（CI workflow 逻辑，曾长期无人运行）============
  ci-workflow-tests:
    name: ci workflow helper unit tests
    runs-on: ubuntu-latest
    # ── 超时上限（当前 20 分钟）：口径 = **追认合法**，判据 = 本段，裁定载体 = issue #5365 ──
    # 沿革（历史事实，不改写）：3 → 8（#4793，2026-09-20）→ 12（#5203，2026-09-23）
    #   → **20**（#5534，2026-09-25。依据：该类 job 近 7 次 success = 7:59 / 8:19 / 11:02 /
    #   11:07 / 11:11 / 11:33 / 11:54（逐条取自 `gh api …/runs/<id>/jobs`），而 #5534 那一次
    #   **12:15 撞 12 分钟上限被 cancelled** —— 无任何断言失败，却卡住 required 合并）。
    # ⚠️ **口径归并（2026-09-26，issue #5365 追认①）** —— 本段此前留下两处**互相矛盾**的读法，
    #   现合并成下面这一条，后来者**不必再自行推导**：
    #   ① 「**不要**用调大 `timeout-minutes` 交差」（#5203 段的既有口径 + #5365 判据 2）
    #      ⇒ 指的是 **不得把"抬上限"当作成本已治理的交付**（治症状）。#5365 判据 1
    #      （套件 ≤360s）**仍未达标**，本 job 的成本问题**照旧开着**。
    #   ② 「12 → 20」**不**违反 ①：它**不是**成本结论，而是**拆掉一个确定的假红**
    #      （#5534 把 post-merge 腿的解释器修对之后，该 job **合法地**变长 ⇒ 撞上限 =
    #      job 被自己取消，外观与"断言失败"一模一样，会把排查引向错误的归因对象）。
    #   ⇒ **追认 12 → 20 合法**（attribution 齐全：近 45 次 run 的 success 时长实测区间 +
    #      #5534 的撞顶 incident；读数与复算命令见 #5365 的裁定评论）。
    #      ⛔ **追认只覆盖这一次**：上限是**值班判据**，不是成本成绩单。
    # 🔺 **值班判据（逼近上限时怎么做，不留白）**：该 job 逼近 20 分钟 ⇒ **先查"新增"开销**
    #   （新判据文件 / 真库族 `initdb` 次数 / 语料真解析次数 —— 钉与负载无关的计数，
    #   **禁**拿挂钟时长当判据），**不要**继续抬 timeout。确有必要再抬 ⇒ 必须同时具备
    #   ①**新**的 attribution（现取的时长分布 + 撞顶 incident）②在活载体（#5365）上显式
    #   **追认**一次，让这次推迟在 PR diff 与 issue 上都可见（否则就是"静默续期"）。
    # 📌 **本 job 六项结构成本逐条处置（#5365 判据 5：不许留白）**：① `case_trust_gate` 16 次
    #   子进程 ②真库族 ③AST 扫描族 ④SWAS 超时等待 ⑤双 loader ⑥每测试 pickle 指纹
    #   = **接受现状 + 登记**（① 缓存即"供出过期结论"；②~⑥ 削的正是断言对象本身：
    #   扫描面 / 等待 / 双 loader 对照 / 真快照）。逐条理由、余量读数与分片路线的残余风险
    #   （required 上下文组成会变 ⇒ 漏登记 = 静默少跑）全部登记在 #5365 的裁定评论里。
    #   ⛔ 本文件**不写**判据面文件数 / 用例数等**易变现值**（现值必腐，复算命令见该评论）。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # ── 为什么这两步不能省（issue #5203）─────────────────────────────────────
      # 本 job 也**不装 PG 服务**：13 个真库判据模块各自起一次性 `initdb` + `pg_ctl` 集群，
      # 要的是**二进制**而不是服务 —— 二进制是 `ubuntu-latest`（24.04）镜像**恰好自带**的
      # （`/usr/lib/postgresql/16/bin`，与 tests/unit_ci_workflows/pg_cluster.py 的 BIN_DIRS 同源）。
      # 改前 Python 侧探测**只认 PATH**（`shutil.which`）⇒ 该目录不在 PATH ⇒ 83 条真库判据
      # 每次 CI 都 `pytest.skip` 成**绿**（实测：CI 87 skip；「只藏 PG 三个二进制」精确复现 83 条）。
      # ⇒ 两道锁：① 下面这道**前置断言**（找不到二进制即红，并打印实际解析到的路径，便于区分
      #   「镜像换代」与「搜索路径变了」）；② pytest 那步注入 `MIGAO_REQUIRE_REALDB=1`，
      #   `pg_cluster.require_pg()` 据此把「缺 PG」判成 **FAIL** 而不是 skip。
      # 两道锁的防回退守卫 = tests/unit_ci_workflows/test_realdb_failclosed.py（判据⑤~⑧）。
      - name: Assert PostgreSQL binaries exist (fail-closed 前置，issue #5203)
        run: |
          # 判据源与 tests/unit_ci_workflows/pg_cluster.py 的 BIN_DIRS 同源：
          # PATH + Debian 的 /usr/lib/postgresql/{14,15,16}/bin
          initdb="$(command -v initdb || true)"
          pg_ctl="$(command -v pg_ctl || true)"
          psql="$(command -v psql || true)"
          for d in /usr/lib/postgresql/16/bin /usr/lib/postgresql/15/bin /usr/lib/postgresql/14/bin; do
            [ -n "$initdb" ] || [ ! -x "$d/initdb" ] || initdb="$d/initdb"
            [ -n "$pg_ctl" ] || [ ! -x "$d/pg_ctl" ] || pg_ctl="$d/pg_ctl"
            [ -n "$psql" ] || [ ! -x "$d/psql" ] || psql="$d/psql"
          done
          echo "runner 镜像 = ${ImageOS:-?} / ${ImageVersion:-?}"
          echo "initdb = ${initdb:-<缺失>}"
          echo "pg_ctl = ${pg_ctl:-<缺失>}"
          echo "psql   = ${psql:-<缺失>}"
          if [ ! -x "${initdb:-/nonexistent}" ] || [ ! -x "${pg_ctl:-/nonexistent}" ] || [ ! -x "${psql:-/nonexistent}" ]; then
            echo "::error::找不到 PG 二进制（initdb/pg_ctl/psql）⇒ Python 侧真库判据无法执行。"
            echo "本 job 不装 PG 服务，二进制靠 runner 镜像自带（理由见本 job 上方注释，issue #5203）。"
            echo "镜像换代请在此处补装 PostgreSQL —— 不要删掉本前置断言，"
            echo "否则「缺 PG」会退回成静默 skip（绿）而无人发现（这正是 issue #5203 的病灶）。"
            exit 1
          fi
          echo "✅ PG 二进制存在 —— Python 侧真库判据能真跑"

      - name: Run ci workflow helper tests
        env:
          # 缺 PG ⇒ `pg_cluster.require_pg()` 判 **FAIL**（不是 skip）：CI 上「没跑」绝不能是绿。
          MIGAO_REQUIRE_REALDB: "1"
        run: |
          pip install -q pytest pyyaml
          python -m pytest tests/unit_ci_workflows -q --tb=short -p no:cacheprovider


  admin-web-test:
    name: admin-web typecheck + unit tests
    runs-on: ubuntu-latest
    # 2026-09-04 提升：runner 高峰慢时 10 分钟不够（实测 10m16s 被取消），改为 15 分钟
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # 路径门控（下面 Detect admin-web changes）要 diff origin/main...HEAD，浅克隆拿不到 merge-base
          fetch-depth: 0

      # ── 路径门控（issue #3507 ①，2026-09-26）────────────────────────────────
      # 本步原先**只**门控 `next build`（#4412），其余步骤（`npm ci` / `tsc` / `eslint` /
      # `vitest`）在**每个** PR 上都跑 —— 实测该 job 在纯文档 / 其他模块 PR 上仍耗
      # **251.5s 中位**（n=8，复算见 tests/unit_ci_workflows/ci_cost_ledger.json）。
      # 现改成门控**整条腿**：口径与 `mini-app` / `bmini-app` / `ai-agent-tests` 逐字同款
      # （`docs/wiki/CI-CD.md`「变更门控」）。
      # ⛔ 不许改成 workflow 级 `paths:`（required check 会卡 "Waiting" 永不报告，且**不会变红**）。
      # 常驻判据 = tests/unit_ci_workflows/test_required_check_no_paths_filter.py。
      # 另：`next build` 的防回退锁 = tests/unit_ci_workflows/test_admin_web_next_build_gate.py（本步改名/删条件即红）。
      - name: Detect admin-web changes
        id: detect_aw
        run: |
          # 仅 PR 事件用 diff 门控；push main / workflow_dispatch 全量跑
          # （origin/main 与 HEAD 相同，diff 无意义）—— 同 ai-agent-tests.yml 既有写法
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "run_web=true" >> "$GITHUB_OUTPUT"
            echo "✅ 非 PR 事件，执行 admin-web 全量（deps/tsc/eslint/next build/vitest）"
            exit 0
          fi
          git fetch origin main --quiet
          CHANGED=$(git diff --name-only origin/main...HEAD)
          # 触发面 = 本 job 断言**真读**的对象面 ∪ 本 job 自身。
          # ① `frontend/admin-web/**`：本腿的 `npm ci` / `tsc --noEmit` / `eslint` /
          #    `next build` / `vitest` **全部**以 `frontend/admin-web` 为根（vitest root=该目录、
          #    `setupFiles: ./tests/setup.ts` 也在其内；包依赖全是 npm 公共包，无仓内 workspace 依赖）
          #    ⇒ 不存在「改了仓内别处而本腿该跑」的形态。
          # ② `\.github/workflows/pr-check\.yml$` = 本 job 自己的定义（改这条腿的 PR 必须能验证它自己）。
          # 登记册（谓词逐字 + must_cover 覆盖 + 未登记即红）=
          #   tests/unit_ci_workflows/declaration_gate_registry.json
          HITS=$(echo "$CHANGED" | grep -E '^(frontend/admin-web/|\.github/workflows/pr-check\.yml$)' || true)
          if [ -n "$HITS" ]; then
            echo "run_web=true" >> "$GITHUB_OUTPUT"
            echo "✅ 检测到 admin-web 变更，执行 typecheck / lint / build / 单测"
          else
            echo "run_web=false" >> "$GITHUB_OUTPUT"
            echo "⏭️ 无 admin-web 变更 —— typecheck/lint/build/单测**未跑**（「没跑」不是「通过」）"
          fi

      - name: Set up Node.js 20
        if: steps.detect_aw.outputs.run_web == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/admin-web/package-lock.json

      - name: Install dependencies
        if: steps.detect_aw.outputs.run_web == 'true'
        working-directory: frontend/admin-web
        run: npm ci

      - name: TypeScript type check
        if: steps.detect_aw.outputs.run_web == 'true'
        working-directory: frontend/admin-web
        run: npx tsc --noEmit

      - name: ESLint
        if: steps.detect_aw.outputs.run_web == 'true'
        working-directory: frontend/admin-web
        run: npm run lint

      # ── 为什么必须有这一步（issue #4412）────────────────────────────────────────
      # Next 的 route 文件（page/layout/template/route）**只允许导出框架认识的字段**，
      # 且**预渲染期**的错误（模块顶层碰浏览器 API、SSG 取数崩）—— 这两类 `tsc --noEmit`
      # **结构上就看不见**，只有 `next build` 会判。Next 14 又没有 `next typegen`（15+ 才有）。
      # 实证：2026-09-18 `export function describeRoutingGuard(...)` 写在 page.tsx 里
      # ⇒ `tsc` 绿、`deploy-frontend` 的 Docker `next build` 红，**前端腿连断 4 次 / 11.5 小时**，
      # 期间 #4323/#4383/#4386/#4401 等一批「已合入 main」的前端在测试环境上 404（不可达）。
      # 判据 = 变更后 `next build` 通过（真值 frontend-fix.next-build）；防回退锁见
      # tests/unit_ci_workflows/test_admin_web_next_build_gate.py
      - name: Production build (Next-only checks)
        if: steps.detect_aw.outputs.run_web == 'true'
        working-directory: frontend/admin-web
        run: npm run build

      - name: Run unit tests
        if: steps.detect_aw.outputs.run_web == 'true'
        working-directory: frontend/admin-web
        run: npx vitest run

      - name: Security audit (deps)
        if: steps.detect_aw.outputs.run_web == 'true'
        working-directory: frontend/admin-web
        run: npm audit --production --audit-level=high
        continue-on-error: true

  # ============ E2E 质量门禁 — fixture 模式，不依赖后端 ============
  # 数据质量校验 + 核心页面冒烟（dashboard）。
  # 业务流程测试和真实后端验证由 post-deploy smoke 负责。
  e2e-quality-gate:
    name: E2E quality gate
    runs-on: ubuntu-latest
    # 2026-09-04 提升：GitHub 托管 runner 高峰慢时 6 分钟跑不完（多次 exceed 6m 超时），
    # 改为 15 分钟吸收慢 runner 波动（issue #2786 环境问题）
    timeout-minutes: 15
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          # 路径门控（下面 Detect e2e changes）要 diff origin/main...HEAD，浅克隆拿不到 merge-base
          fetch-depth: 0

      # ── 路径门控（issue #3507 ①，2026-09-26）────────────────────────────────
      # 本 job 在**每个** PR 上都装两份 node_modules 并跑 Playwright（实测中位 **114.5s**，n=8）
      # —— 而它读的对象面只有 `tests/**`（spec / fixture / playwright 配置）与
      # `frontend/admin-web/**`（`webServer` 要真构建 admin-web）。
      # 口径 = 本仓既有「job 内 diff 门控」范式（`docs/wiki/CI-CD.md`「变更门控」）。
      # ⛔ **本 job 不是 required check**（不在分支保护 required 集合里）⇒ 本可整层 `paths:`，
      #   但**仍不用**：一是保持与其余腿同款读法（判据按步骤名定位，见 §23.5），
      #   二是将来若把它翻成 required，**不需要**再改回 job 内门控（那条顺序不可换）。
      - name: Detect e2e changes
        id: detect_e2e
        run: |
          # 仅 PR 事件用 diff 门控；push main / workflow_dispatch 全量跑
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
            echo "✅ 非 PR 事件，全量执行 E2E 质量门禁"
            exit 0
          fi
          git fetch origin main --quiet
          CHANGED=$(git diff --name-only origin/main...HEAD)
          # 触发面 = 本 job 断言**真读**的对象面 ∪ 本 job 自身：
          # ① `tests/**`（`npx playwright test e2e/specs/…` 的 spec 与 fixture、`tests/package-lock.json`）；
          # ② `frontend/admin-web/**`（Playwright `webServer` 真构建/启动 admin-web）；
          # ③ 本 job 自己的定义（改这条腿的 PR 必须能验证它自己）。
          # 登记册 = tests/unit_ci_workflows/declaration_gate_registry.json（未登记即红）
          HITS=$(echo "$CHANGED" | grep -E '^(tests/|frontend/admin-web/|\.github/workflows/pr-check\.yml$)' || true)
          if [ -n "$HITS" ]; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
            echo "✅ 检测到 e2e 相关变更，执行质量门禁"
          else
            echo "run_tests=false" >> "$GITHUB_OUTPUT"
            echo "⏭️ 无 e2e 相关变更 —— 质量门禁**未跑**（「没跑」不是「通过」）"
          fi

      - name: Setup Node.js
        if: steps.detect_e2e.outputs.run_tests == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install test deps
        if: steps.detect_e2e.outputs.run_tests == 'true'
        working-directory: tests
        run: npm ci

      - name: Install admin-web deps (for Playwright webServer)
        if: steps.detect_e2e.outputs.run_tests == 'true'
        working-directory: frontend/admin-web
        run: npm ci

      - name: Run quality specs (fixture-only)
        if: steps.detect_e2e.outputs.run_tests == 'true'
        working-directory: tests
        env:
          E2E_MOCK_AUTH: 'true'
        run: |
          # search-alignment 选择器已改为 [data-testid="search-area"]（2026-08-29 修复 border-gray 失配）
          npx playwright test --reporter=list --retries=1 --project=web \
            e2e/specs/quality/api-contract.spec.ts \
            e2e/specs/quality/anti-placeholder.spec.ts \
            e2e/specs/quality/cross-page-consistency.spec.ts \
            e2e/specs/quality/business-judge.spec.ts \
            e2e/specs/quality/search-alignment.spec.ts \
            e2e/specs/dashboard/dashboard.spec.ts

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::E2E 质量门禁失败 — 数据校验或 dashboard 冒烟不通过"
          echo "::error::API 契约变更? cd tests && npx tsx e2e/scripts/record-fixtures.ts"

  # ============ UI 回退检测 — 防「工作区旧 UI 覆盖验收版」复发（#2579 教训）============
  ui-regression-check:
    name: UI Regression Check
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check UI token regression vs origin/main
        run: |
          git fetch origin main --quiet
          chmod +x check-ui-regression.sh
          ./check-ui-regression.sh --head
        shell: bash

  # ============ 用例覆盖体检门禁 — 纯静态 YAML 分析，零 LLM，秒级（issue #3555）============
  # 为什么单独成 job（而不是塞进 qa-growth-gate）：qa-growth-gate 判的是"改了代码有没有
  # 对应测试"，本 job 判的是"评测用例库**覆盖到了哪些能力**"—— 两者失败时的可操作清单不同
  # （前者=补测试，后者=补 case），分开成 job 才能各自给出可操作输出、各自可观测。
  # 判据全部在 scripts/case_coverage.py（与 verify-all.sh 同一脚本、同一参数 → 不会本地绿 CI 红）：
  #   结构性缺失（阻塞）：工具 0 用例 / 只有拒绝式断言而**没有任何正向用例** / 用例挂错端 /
  #                        断言了两端都没有的工具 / 端用例集为空；
  #   厚度不足（只报告不阻塞）：某工具仅 1 条用例 —— 缺口数是随迭代收敛的活指标，
  #                        不做硬编码阈值门禁（verify-all.sh:66-68 的既有设计意图）。
  # 确定性层（无 LLM 方差）→ 可安全作为 required 候选。
  case-coverage-gate:
    name: Case Coverage Gate
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # 两个体检共用同一份判据模块（scripts/case_coverage.py），只有 persona 不同。
      # 输出写临时文件（step summary 与失败打印复用），自然语言报告只打一遍。
      - name: Case coverage check (xiaobu + mibao)
        env:
          PERSONAS: "xiaobu mibao"
        run: |
          set -uo pipefail
          rc=0
          for persona in $PERSONAS; do
            out="$RUNNER_TEMP/coverage-$persona.txt"
            {
              echo "===== $persona 覆盖体检 ====="
              python3 "scripts/${persona}_coverage.py" --check || rc=1
            } > "$out" 2>&1
            cat "$out"
            {
              echo "### $persona 覆盖体检"
              echo ''
              echo '```'
              cat "$out"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done
          exit $rc

      - name: Print actionable list on failure
        if: failure()
        run: |
          set -uo pipefail
          echo "::error::覆盖体检未通过 —— 下面是可操作清单（缺用例的工具 / 端点错配）"
          cat "$RUNNER_TEMP/coverage-xiaobu.txt" "$RUNNER_TEMP/coverage-mibao.txt"

      # 阻塞检查：失败时打标签，与 qa-growth-gate 同一处置（提示补用例，而不是改判据）
      - name: Label PR on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "❌ Case Coverage Gate 未通过：评测用例库存在能力覆盖缺口（缺正向用例 / 零覆盖 / 用例挂错端）。"
          echo "补用例见 migao-dev-flow §14.5；判据实现见 scripts/case_coverage.py。"
          gh pr edit "$PR_NUMBER" --add-label "review/needs-changes" 2>/dev/null || true

  # ============ QA Growth Gate — 事前测试覆盖门禁（block 模式）============
  qa-growth-gate:
    name: QA Growth Gate
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check test coverage in diff (data-driven)
        id: check
        run: |
          # G1: 单一规则源 tech-stack.yml modules，替代硬编码 case 矩阵
          git fetch origin main
          CHANGED_FILES=$(git diff --name-only origin/main...HEAD)
          # ⚠️ 空变更集**不另开旁路**（issue #5292）：旧实现在这里直接 `echo BLOCKERS=0` + exit 0
          # —— 那条路**不产出 growth-gate-result.json**，于是「job 判红/判绿」与「评论正文」各有
          # 一个数据来源（双源）。现在 `--files` 为空时由 growth_gate.py 自己按同一 base 取变更集
          # （同一份 git diff）⇒ 结果文件与 step 输出同源，评论渲染永远有数据可渲染。
          # growth_gate.py 读 .github/tech-stack.yml + .github/qa-exemptions.yml
          # 输出 markdown 到 $GITHUB_STEP_SUMMARY + JSON 到 growth-gate-result.json
          # 崩溃 → 非零退出 → set -e 让本 step 失败（fail-closed）；成功 → 退出 0，blocker 由 JSON 判定
          python3 .github/growth_gate.py \
            --files $CHANGED_FILES \
            --tech-stack .github/tech-stack.yml \
            --exemptions .github/qa-exemptions.yml \
            --check-cases .github/cases \
            --json --json-file growth-gate-result.json
          BLOCKERS=$(python3 -c "import json;print(json.load(open('growth-gate-result.json')).get('blocker_count',0))")
          WARNINGS=$(python3 -c "import json;print(json.load(open('growth-gate-result.json')).get('warning_count',0))")
          echo "BLOCKERS=$BLOCKERS" >> "$GITHUB_OUTPUT"
          echo "WARNINGS=$WARNINGS" >> "$GITHUB_OUTPUT"

      # 弱断言检测：新增测试文件不得用凑数断言（is not None / assert True / 空 pass）
      # 只扫「新增」测试文件，存量测试的弱断言不阻塞（历史遗留，避免误伤）
      # ⚠️ 选取集**只有一份实现**：`.github/growth_gate.py::select_weak_scan_files`（**全路径**
      #    含 test|spec + 扩展名）。本 step 与本地 `verify-all.sh gate` 都调它、都打印**同一份
      #    清单**（`--select-weak-files` / `--new-tests-only` 共用同一个打印函数，issue #5477）。
      #    此前本 step 内联 `grep -iE 'test|spec'`（全路径）、而本地走 `_is_test_file`（**只看
      #    文件名**）⇒ 同一批改动在两侧得到**不同的判据集合**（本地绿 / CI 红；实证
      #    `backend/ai-agent-service/tests/contract_snapshot_registry.py` 只有 CI 扫，
      #    见 issue #5477 的差集清单）。**禁止**在本文件里再写一套 grep / 禁止改用
      #    `_is_test_file` 那套只看文件名的口径 —— 改口径请改 `select_weak_scan_files`。
      # 与本地 `verify-all.sh gate` 的**唯一差别是候选源**（判定是同一份实现）：
      # 本 step 只能看到已提交 diff（`--diff-filter=A origin/main...HEAD`，PR 的改动必然已提交；
      # 真值在 `growth_gate.get_added_files`，git diff 失败 ⇒ 非零退出 = fail-closed）；
      # 本地还要并入**工作区**未提交的新增文件（否则「提交前跑」对该文件是空跑，issue #3724）。
      - name: Check weak asserts in new tests
        run: |
          NEW_TESTS=$(python3 .github/growth_gate.py --select-weak-files --base origin/main)
          if [ -z "$NEW_TESTS" ]; then
            echo "✅ 无新增测试文件，跳过弱断言检查"
            exit 0
          fi
          echo "🔍 扫描新增测试文件的弱断言"
          python3 .github/growth_gate.py --check-weak --new-tests-only --files $NEW_TESTS

      # 阻塞检查：有 blocking 项时打标签 + fail job
      - name: Fail on blocking violations
        if: steps.check.outputs.BLOCKERS != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "❌ QA Growth Gate 发现 ${{ steps.check.outputs.BLOCKERS }} 处缺测，阻塞合并。"
          echo "请按下方 PR 评论里的清单（逐条 file + 缺测文件）补齐测试；"
          echo "仅当确有正当理由时才走豁免（.github/qa-exemptions.yml），且豁免面只许缩短。"
          echo "详见 docs/wiki/Testing.md"
          gh pr edit "$PR_NUMBER" --add-label "review/needs-changes" 2>/dev/null || true
          exit 1

      # 评论正文渲染：**唯一数据源 = 上一步写出的 growth-gate-result.json**（issue #5292）。
      # 此前 `Post PR comment` 读的是**它自己那一步**的 `$GITHUB_STEP_SUMMARY` —— 该变量是
      # **逐步**文件（每步一个 uuid），而 markdown 是 check step 里写进**那一步**的 summary
      # ⇒ 评论 step 读到空串，正文只剩标题 +「Blockers: 6」+「或加豁免」（实测 PR #5285：
      # **看不到是哪 6 条，却被引向加豁免**）。渲染失败（结果文件缺失/自相矛盾）⇒ 本 step
      # 非零（fail-closed），但**仍写出可发布的正文** —— 绝不静默发一条空评论。
      - name: Render PR comment from growth-gate-result.json
        if: always()
        run: |
          python3 .github/growth_gate.py \
            --render-pr-comment growth-gate-result.json \
            > growth-gate-pr-comment.md

      # PR comment — 始终发布/更新（pass/fail/warn 都更新）
      - name: Post PR comment
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            // 正文**只能**来自上一步渲染出的正文文件（其数据源 = growth-gate-result.json），
            // 本步只负责发布/更新（issue #5292）。两件**禁止**的事：
            // ① 读 `$GITHUB_STEP_SUMMARY` —— 逐步文件，这里读到的必然是空串（本 issue 的病根）；
            // ② 在本步按 blocker 计数自建正文 —— 第二数据源，必然与结果 JSON 漂移。
            let body = '';
            try {
              body = fs.readFileSync('growth-gate-pr-comment.md', 'utf8');
            } catch (e) {
              body = '';
            }
            // 「渲染不出正文」绝不允许退化成「发一条空评论」—— 那正是本 issue 的现网形态。
            if (!body.trim()) {
              body = '## ❌ QA Growth Gate — 无法生成评论正文\n\n> 结果文件缺失/不可读或渲染失败（fail-closed）；详见本 job 日志。';
            }

            // 查找已有 QA Gate 评论 → 更新；否则创建
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const prevComment = comments.find(c => c.body.includes('QA Growth Gate'));
            if (prevComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: prevComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # ============ Case Contract — 用例↔真值引用校验（fail-closed）============
  case-truth-check:
    name: Case Contract (truths_ref)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - name: Verify case truths_ref resolve
        run: |
          # 用例库引用真值 ID 校验：引用不存在的真值 → 阻塞合并（fail-closed）
          # 文件随质量门禁体系部署：templates/ + cases/ + truths.py（本仓库在 .github/ 下）
          if [ -f .github/truths.py ] && [ -d .github/templates ] && [ -d .github/cases ]; then
            python3 .github/truths.py check --templates .github/templates --cases .github/cases
          elif [ -d .github/cases ]; then
            echo "::error:: 存在用例库（cases/）但缺 templates/truths.py — 请同步质量门禁体系 seed"
            exit 1
          else
            echo "ℹ️ 无用例库（cases/），跳过 case-contract 校验"
          fi

      - name: Verify generated artifacts fresh (render + diff)
        run: |
          # 生成物（eval_cases.py / mibao-verification-cases.md）必须与 cases/ 单一源同步：
          # 重新渲染后 diff 非空 → 阻塞合并（防止「改了 cases 忘重渲染」导致分叉）
          if [ -f .github/render_cases.py ] && [ -d .github/cases ]; then
            python3 .github/render_cases.py \
              --cases .github/cases \
              --out-eval tests/agent_eval/eval_cases.py \
              --out-md docs/testing/mibao-verification-cases.md >/dev/null
            if ! git diff --exit-code -- tests/agent_eval/eval_cases.py docs/testing/mibao-verification-cases.md; then
              echo "::error:: 生成物与 cases/ 单一源不同步 — 请运行 .github/render_cases.py 并提交生成物"
              exit 1
            fi
            echo "✅ 生成物与 cases/ 单一源同步"
          else
            echo "ℹ️ 无 render_cases.py 或 cases/，跳过生成物新鲜度校验"
          fi

  # ============ 断言可信度门禁（假红/假绿结构性护栏 A 层，#3483 T1 扩展格）============
  #
  # 为什么需要这一层：原有用例侧门禁只有 `Case Contract (truths_ref)`（引用可解析 +
  # 生成物新鲜）、`Case Coverage Gate`（覆盖映射）、`QA Growth Gate`（改代码要有测试）
  # —— **没有任何一条校验断言本身是否可信**。于是「写了断言」与「断言真能判红」之间
  # 没有任何结构性约束，以下缺陷全部被门禁放行进来（均有实证）：
  #   · CU-003 让 agent 挂种子目录里**不存在**的标签 ⇒ 用例物理不可满足（#3832）；
  #   · PG-013 首跑功能正确，却因 `forbidden_text`（**全程**语义、无轮次作用域）
  #     命中 R1 良性措辞而判红；且写类用例无自清理 ⇒ 重试前置不等价（#3833 / #3800）；
  #   · `data_checks` 里「sku_update 成功（价格落库）」**没有 `success=true`** ⇒
  #     该项**不计分** = 假绿（#3559 / PR-021）；
  #   · 31 条写用例无效果层断言（「调用了 ≠ 成了」，#3778）；
  #   · 准备型 `pre_clean` 的「未复位/失败」路径未纳入折叠判据（#3797）。
  #
  # 判据的**单一源** = `.github/assertion_taxonomy.py`（纯函数、零依赖）—— 静态门禁与
  # 后续 runner 侧动态分类器共用一处口径，禁止两处各写一份（会漂移）。
  #
  # 判定范围 = **只判被本次改动/新增的用例条目**（存量在基线清单
  # `.github/case-trust-baseline.json` 里放行）⇒ 不会「一次红全库」，也不阻塞存量。
  # 基线只许缩短：本次 diff 命中且原违规码已不再命中的项，必须从清单移除（防债务僵化）。
  # 「已不再违规 ⇒ 必须移除」**只对本次 diff 命中的用例生效** —— 否则别人修好一条存量
  # 用例（#3832/#3833 正在修 CU-003/PG-013），本门禁就会自己判红并挡住他们的 PR。
  #
  # fail-closed：种子真值取不到 / 基线缺失 / 判据加载失败 ⇒ 直接红（不静默跳过）。
  # 未实装项如实登记在 `.github/case-trust-unimplemented.json`（**不写恒真规则凑数**）。
  case-trust-gate:
    name: Case Trust Gate (断言可信度)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Judge changed case entries (fail-closed)
        run: |
          # 只判 `origin/main...HEAD` 命中的用例条目；存量违规按基线放行。
          # 纯静态、零第三方依赖、零 LLM（不烧 token、不占评测槽位）。
          python3 .github/case_trust_gate.py --base origin/main

      - name: L0 degenerate guards (判据不得是空壳)
        run: |
          # 判据自身的红证与退化守卫：写工具集合/效果层集合非空、判据不恒真/恒假、
          # 机器计分口径与 local_runner 同源、基线不得包含「已不再命中」的项。
          pip install -q pytest
          python3 -m pytest tests/unit_ci_workflows/test_case_trust_gate.py -q \
            --tb=short -p no:cacheprovider

  # ============ LLM 红例 → 确定性下沉台账（纯静态、零 LLM、零网络）============
  # 为什么需要它（用户裁定 4′，承载 issue #4034 ← #4009）：
  #   PR 层的真实 LLM 已停跑（裁定 2′）⇒ LLM **只负责发现**（低频、非自动），
  #   **拦截全部交给确定性层**。于是"发现→下沉"这条链必须自己有账本 + 机械检查，
  #   否则它就是**散文**：红例被修在 LLM 波形里、没人把它固化成确定性断言，
  #   下一次同一缺陷照样溜过 PR（`migao-acceptance`「空断言 / 假绿」同族）。
  #
  # 判据（**本 job 只跑离线档**，因为 PR token 的网络/权限不可靠）：
  #   · `--selftest`：台账 schema + **每条 sunk 的断言非空壳**（用例存在、声明的效果层
  #     字段至少一个非空、`has_effect_assertion` 为真、`merge_log` 回填 `#<issue>`）
  #     + **每条 unsunk 显式登记**（reason + follow_up 必填）。非零退出 = 红。
  #   · L0 退化守卫：判据不得是空壳（效果层字段集合与 `.github/assertion_taxonomy.py`
  #     **同一对象**、注入式变异样本必须被判红）。
  #   ⚠️ **未实装/边界**（如实登记，不写成恒真判据）：新红例的**自动入账**没做（建 issue
  #   时不会自动写台账占位）；GitHub issue 侧的回填核验需要 `gh` + 网络 ⇒ 只在本地/agent
  #   跑 `--issue N --check-backfill` / `--all`，**核不了就返回 3（无法判定）而不是通过**。
  #   完整登记见 `.github/llm-finding-ledger.json` 的 `unimplemented` 与脚本头部。
  llm-sink-ledger:
    name: LLM Sink Ledger (红例→确定性下沉)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Ledger selftest (fail-closed, offline)
        run: |
          # 零第三方依赖（用例库走 render_cases 的 yaml_light）、零 LLM、零网络。
          # 只判**台账自洽**：任何"声称已下沉但断言是空壳 / 未登记的红例"都直接红。
          python3 .github/llm_sink_check.py --selftest

      - name: L0 degenerate guards (判据不得是空壳)
        run: |
          # 判据自身的红证：注入"断言空壳 / 用例不存在 / 回填缺失 / unsunk 缺 reason"
          # 的变异样本必须被判红；效果层字段集合必须与 assertion_taxonomy 同源。
          pip install -q pytest pyyaml
          python3 -m pytest tests/unit_ci_workflows/test_llm_finding_sink.py -q \
            --tb=short -p no:cacheprovider

  # ============ Secret 扫描（gitleaks）— 防密钥/凭据提交 ============
  # ⚠️ 「B 端 smoke 打云测试环境」层已移除（issue #3653，2026-09-15）—— 原 agent-eval-smoke
  # job 每次 AI 相关 PR 都对 https://ai-api.migaozn.com（**已部署 main**，非 PR 分支）跑
  # smoke 档真实 LLM。移除理由：
  #   ① 云环境不含 PR 分支代码 → 评测结果与本 PR 改动**无因果**（与 behavior-eval
  #      dogfooding 的 CH-010 无因果红同一形态，AD §6.1 事实 1 的第四层）；
  #   ② B 端行为信号曾由 agent-behavior-eval 的**映射用例**承担（app/** 命中即跑，
  #      规则桶或兜底网）—— ⚠️ 该 workflow 已于 #4275（2026-09-21 用户裁定）整体删除
  #      ⇒ PR 层不再有任何自动行为信号（映射改由本机按 §13.2 调 behavior_mapping.py）；
  #      完整 B 端覆盖由 post-deploy-eval（双 persona 全量，手动派发）承担；
  #   ③ AD §6.3：PR 层默认不跑 smoke/云冒烟；本层是四层冗余里成本最大的单层
  #      （实测 2.5h 内 smoke 85 次 ≈ 43% 的总评测次数）。
  gitleaks-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run gitleaks secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============ Danger Scan — PR 破坏性变更检测（workflow/批量删除/部署文件）============
  danger-scan:
    name: Danger Scan (破坏性变更检测)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ── 删除 workflow 的人工确认通道（#4295）───────────────────────────────────
      # 为什么需要：danger-scan 对「删除 workflow」是 BLOCK，文案写「需人工确认」，
      #   但补本条之前**没有任何记录确认的地方** ⇒ 在 enforce_admins=true 的仓库里
      #   「删除任何 workflow」在机制上都不可能合并（#4288 实测：`gh pr merge --admin`
      #   被 GraphQL 拒、UI 不提供绕过入口）。本步骤把「人工确认」落成可留痕的动作。
      #
      # 为什么用**评论**而不是 label（#4288 实测）：label 变更不在本 workflow 的
      #   pull_request.types 里，且 `gh run rerun` **复用原始事件载荷**（标签快照是旧的）
      #   ⇒ label 方案在重跑下不生效。评论在**运行期**读 API，故 rerun 也能拿到最新确认。
      #
      # fail-closed：无删除 / API 失败 / 非 owner / 无 marker ⇒ DANGER_ACK_DELETE 为空
      #   ⇒ danger_scan.py 仍按 BLOCK 处理（无确认时的行为与补通道前逐字相同）。
      #
      # ⚠️ 判定逻辑**不在本 YAML 里**（首版把它写成字符串匹配，红证实测"不红" = 空断言）：
      #   过滤/解析全在 `danger_scan.py` 的 `parse_delete_acks()` 纯函数（有行为级单测），
      #   本步骤只负责「取评论 → 喂给它 → 写 GITHUB_ENV」。要改逻辑请改那个函数。
      - name: Resolve workflow-deletion acks (owner 显式确认 → DANGER_ACK_DELETE)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # 与 DANGER_TRUSTED_ACTOR 同源（本仓库 owner）；非 owner 的评论一律不算确认
          DANGER_OWNER: zhaokai-mgzn
        run: |
          set -uo pipefail
          git fetch origin main --quiet || true
          # ① 取评论（**每个 PR 都跑**，即使本次没有删除）：本通道的静默失效形态是
          #    「token 读不到评论 ⇒ 永远不放行」—— fail-closed 的反面是红得无声无息，
          #    直到有人要删 workflow 才发现。故心跳必须恒可见（§18.6「环境静默即缺陷」）：
          #    下面的 --resolve-acks 每次都会打一行「owner 评论数=N」。
          if ! gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
                 --paginate --slurp > /tmp/pr-comments.json 2>/dev/null; then
            echo "⛔ 评论 API 读取失败 ⇒ fail-closed（本次不放行任何删除）——"
            echo "   若这是 token 权限问题，本确认通道将**永久失效**（需给本 job 补 issues: read）"
            exit 0
          fi
          DELETED=$(git diff --diff-filter=D --name-only origin/main...HEAD -- .github/workflows \
            | grep -E '\.(yml|yaml)$' | paste -sd, - || true)
          echo "── 待确认删除：${DELETED:-（无）} ──"
          # ② 解析 owner 的确认 —— 过滤/解析全在 danger_scan.py 的纯函数里（有行为级单测）
          DANGER_COMMENTS_JSON=/tmp/pr-comments.json \
          DANGER_DELETED_WORKFLOWS="$DELETED" \
            python3 .github/danger_scan.py --resolve-acks >> "$GITHUB_ENV"

      - name: Run danger scan
        env:
          DANGER_BASE: origin/main
          # 受信任维护者（owner）新增 workflow（如发布流程）→ 降为 WARN；fork 贡献者 → BLOCK
          DANGER_TRUSTED_ACTOR: ${{ github.actor == 'zhaokai-mgzn' && '1' || '0' }}
          # DANGER_ACK_DELETE / DANGER_ACK_BY / DANGER_ACK_URL 由上一步骤经 $GITHUB_ENV 注入
        run: |
          git fetch origin main --quiet
          python3 .github/danger_scan.py

      - name: Post danger-scan comment
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            let body = '⚠️ danger-scan 报告异常';
            try {
              const r = JSON.parse(fs.readFileSync('danger-scan-result.json', 'utf8'));
              const lines = [];
              for (const b of r.blockers || []) lines.push('- ❌ ' + b);
              for (const w of r.warnings || []) lines.push('- ⚠️ ' + w);
              body = (r.blocker_count > 0 ? '## 🔒 Danger Scan — BLOCKED' : '## ✅ Danger Scan — PASSED') + '\n\n' + (lines.join('\n') || '无');
            } catch (e) { body = '⚠️ danger-scan 输出解析失败'; }
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
            });
            const prev = comments.find(c => c.body.includes('Danger Scan'));
            if (prev) { await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: prev.id, body }); }
            else { await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body }); }

  # ============ 任何 CI 失败都打 needs-changes（独立 job，覆盖全部检查）============
  # G3 fix: 原打标在 qa-growth-gate job 内，无法捕获 admin-api-test/admin-web-test/e2e 失败
  label-needs-changes:
    name: Label needs-changes on any CI failure
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: failure() && github.event_name == 'pull_request'
    needs:
      - block-env-files
      - admin-api-test
      - admin-web-test
      - ci-workflow-tests
      - e2e-quality-gate
      - qa-growth-gate
      - case-truth-check
      - gitleaks-scan
      - danger-scan
    steps:
      - name: Add review/needs-changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name' 2>/dev/null | grep -qx "review/needs-changes"; then
            echo "ℹ️ needs-changes 标签已存在，跳过"
          else
            gh pr edit "$PR_NUMBER" --add-label "review/needs-changes" 2>/dev/null || true
            echo "🔧 自动标记 needs-changes — agent-poll 将修复"
          fi

  # ============ 全绿时自动清除僵尸标签 ============
  # 依赖所有前置 job：任一失败 → 此 job 跳过；全部成功 → 移除 needs-changes
  clear-needs-changes:
    name: Clear stale needs-changes label
    runs-on: ubuntu-latest
    timeout-minutes: 1
    if: github.event_name == 'pull_request'
    needs:
      - block-env-files
      - admin-api-test
      - admin-web-test
      - ci-workflow-tests
      - e2e-quality-gate
      - qa-growth-gate
      - case-truth-check
      - gitleaks-scan
      - danger-scan
    steps:
      - name: Remove review/needs-changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          HAS_LABEL=$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name' 2>/dev/null | grep -c 'review/needs-changes' || echo "0")
          if [ "$HAS_LABEL" -gt 0 ]; then
            gh pr edit "$PR_NUMBER" --remove-label "review/needs-changes" 2>/dev/null || true
            echo "🧹 已清除 review/needs-changes（全部 job 通过）"
          else
            echo "✅ 无需清除（标签不存在）"
          fi
