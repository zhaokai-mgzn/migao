name: Mini-App CI

# ── 为什么这份 workflow 还在（issue #9233，2026-11-26 用户裁定）─────────────────
# ⚠️ `name: Mini-App CI` 与 job 名都**逐字不变**：deploy-reconcile.yml 的 `workflow_run` 上游按
#    workflow **name** 匹配（改名 = 兜底面静默脱钩，`publish_leg_fallback_ledger.json` 会判红）。
# 用户逐字：「frontend/mini-app 这个可以彻底删除了，以后不需要用到 c 端小程序。」
# ⇒ C 端顾客小程序工程 `frontend/mini-app/**` 已**整目录删除**：typecheck / 单测 / build:h5 /
#   H5 视觉回归**都没有对象可跑**。
# 但分支保护的 required 集合里**有** `mini-app typecheck + unit tests`：
#   直接删掉本 workflow ⇒ 该 context **永远不会被上报** ⇒ **所有 PR 永久 `BLOCKED`**，
#   而且**没有任何检查会变红**（「全绿却合不了」）。同族实证：#3507 / #4786 / #5101。
#   类级锁 = tests/unit_ci_workflows/test_required_check_no_paths_filter.py（判据 1/2/5/6）。
# 本机 / agent token **无 `workflow` scope** ⇒ 不能走 `gh api` 改分支保护（不是「懒得改」）。
# ⇒ 处置 = **保留 workflow 与 job 名（逐字不变）**，内容改成**显式 no-op success**：
#   只打印一行说明并成功退出，让 required check 继续有上报面（止血），等有 scope 的人收口。
#
# ── 重启条件（要恢复真腿，先逐条满足，缺一条就保持 no-op）─────────────────────
#   ① 分支保护 required 集合里**移除** `mini-app typecheck + unit tests`
#      （需要网页操作或带 `workflow` scope 的凭据；本仓 agent 默认没有）；
#   ② 仓里**重新出现** C 端小程序工程（`frontend/mini-app/package.json` 存在）；
#   ③ 该工程重新有 owner 与真实判据（`npm test` + `tsc --noEmit`），不是「先占个名」。
# ⛔ 不许用「把 job 改成 skip / 加 job 级 `if`」来图省事：被跳过的 job **不上报** context
#    ⇒ 等于把 required 悬空（这正是本文件存在的理由）。

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main

# CI 队列治理（v1.3）：同 PR 新 push 自动取消旧 run（保留原口径，no-op 也一视同仁）
concurrency:
  group: ci-miniapp-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ⛔ `name:` 逐字 = 分支保护 required 的那一条，改一个字 = 所有 PR 永久 BLOCKED。
  # ⛔ 不许加 job 级 `needs:` / 非恒真 `if:`（判据 5/6：同样让 required context 永不到来）。
  typecheck-and-test:
    name: mini-app typecheck + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: C 端小程序已下线（显式 no-op success）
        run: |
          echo "ℹ️ C 端顾客小程序 frontend/mini-app 已于 2026-11-26 整目录删除（issue #9233，用户裁定）。"
          echo "   本 job 保留**同名 required check** 为止血：删掉它 ⇒ 所有 PR 永久 BLOCKED 且无红信号。"
          echo "   重启条件见本文件头注释（须先移除 required 名 + 工程真回来 + 有真实判据）。"
          echo "✅ no-op success —— 没有 typecheck / 单测 / build:h5 / 视觉回归可跑"
