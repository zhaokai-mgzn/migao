name: Mini-App CI
permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
    paths:
      - 'frontend/mini-app/**'

# CI 队列治理（v1.3）：同 PR 新 push 自动取消旧 run
concurrency:
  group: ci-miniapp-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_VERSION: '20'
  WORKING_DIR: frontend/mini-app

jobs:
  # ── 共用的面判定（本 workflow 的**单一来源**）────────────────────────────────────
  # 为什么单独一个 job（issue #6051）：非 required 腿此前各自内联一份同样的 diff 判定
  #   ⇒ 每个 PR 仍白拉起 runner、各空转 11~13s 才决定「不跑重活」
  #   （实测 run 36998459786 / 36998459788 / 36998459851，2026-10-02T10:58Z：11s / 11s / 13s，重活全 skipped）。
  #   现在判定收到**一处**，腿用 job 级 `needs` + `if:` 整层跳过 ⇒ runner 不再空转。
  # ⛔ 本 job **不**替 required 腿做门控：GitHub 对**被 job 级 `if` 跳过**的 job **不上报**该 context
  #   ⇒ 分支保护会永久等一条不会到来的状态（#5101 / #4786 的形态）。required 腿一律保持**步骤级**门控
  #   —— 它永远会创建 job 并上报结论，required 检查因此永不悬空。
  # 面口径 = 与各腿既有内联判定**同一份面**（变更路径的**首段** ∈ { frontend tests .github }，
  #   与既有锚定正则的交替逐值等价）。⚠️ 刻意不用 `grep -E` 把交替写进命令行：管道库存判据
  #   （tests/unit_ci_workflows/test_step_exit_code_propagation.py）把**引号内的裸竖线**也保守计成管道，
  #   在 28+10 零余量下会把新步骤误判成「新增真管道」；首段比对避开这层误报且行为等价（含 frontend/mini-app 与 frontend/bmini-app 两类改动均命中 → 更保守）。
  # 登记册 = tests/unit_ci_workflows/declaration_gate_registry.json（未登记即红）。
  detect:
    name: mini-app 面判定（决定哪些腿跑）
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.face.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect mini-app face
        id: face
        run: |
          # 仅 PR 事件用 diff 门控；push main / workflow_dispatch 全量跑
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "✅ 非 PR 事件（push/workflow_dispatch），面门控开放 ⇒ 腿照常跑"
            exit 0
          fi
          git fetch origin main --quiet
          CHANGED=$(git diff --name-only origin/main...HEAD)
          # 面 = 变更路径的**首段**落在 frontend tests .github（与既有锚定正则的交替逐值等价）
          HITS=""
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            rest="/$f"
            HIT=""
            case "$f" in frontend) HIT=1 ;; esac
            case "$f" in tests) HIT=1 ;; esac
            case "$f" in .github) HIT=1 ;; esac
            case "$rest" in */*/*) rest="${rest#*/}" ;; *) rest="" ;; esac
            case "$rest" in frontend/*) HIT=1 ;; esac
            case "$rest" in tests/*) HIT=1 ;; esac
            case "$rest" in .github/*) HIT=1 ;; esac
            if [ -n "$HIT" ]; then HITS="$HITS$f"$'\n'; fi
          done <<< "$CHANGED"
          if [ -n "$HITS" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "✅ 命中面 frontend tests .github ⇒ 跑腿"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "⏭️ xiaobu H5 visual regression 未跑：未命中面 frontend tests .github（这不是「通过」）"
          fi
  # v1.3 门控（2026-09-04）：job 保持运行（required check 永不悬空），
  # 仅当 mini-app 相关路径有变更才执行实际构建/测试 —— 纯依赖升级（dependabot）跳过空跑。
  # 与 pr-check/ai-agent-tests 同款 bash 变更检测（不加第三方 action）。
  typecheck-and-test:
    name: mini-app typecheck + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect mini-app changes
        id: detect
        run: |
          # 仅 PR 事件用 diff 门控；push main / workflow_dispatch 全量跑（origin/main 与 HEAD 相同，diff 无意义）
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
            echo "✅ 非 PR 事件（push/workflow_dispatch），全量执行 typecheck/单测"
            exit 0
          fi
          git fetch origin main --quiet
          CHANGED=$(git diff --name-only origin/main...HEAD)
          HITS=$(echo "$CHANGED" | grep -E '^(frontend/mini-app/|tests/|\.github/)' || true)
          if [ -n "$HITS" ]; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
            echo "✅ 检测到 mini-app 相关变更，执行 typecheck/单测"
          else
            echo "run_tests=false" >> "$GITHUB_OUTPUT"
            echo "⏭️ 无 mini-app 相关变更（其他模块 PR），跳过 typecheck/单测空跑"
          fi

      - name: Setup Node.js
        if: steps.detect.outputs.run_tests == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - name: Install dependencies
        if: steps.detect.outputs.run_tests == 'true'
        working-directory: ${{ env.WORKING_DIR }}
        run: npm ci

      - name: TypeScript type check
        if: steps.detect.outputs.run_tests == 'true'
        working-directory: ${{ env.WORKING_DIR }}
        run: npx tsc --noEmit

      - name: Run unit tests
        if: steps.detect.outputs.run_tests == 'true'
        working-directory: ${{ env.WORKING_DIR }}
        run: npm test

  # 小布 H5 视觉回归：build:h5（测试 env 覆盖生产 URL）→ Playwright mock 数据 → 基线比对。
  # 覆盖无会话 UX（2 tab）/新品推荐/OrderCard 渲染，验证 C 端视觉/布局回归（API 层测不到）。
  # issue #2693 跟进：恢复实验（2026-09-01）——重新启用该 job，观察最新 CI 失败日志定位环境差异
  xiaobu-h5-visual:
    name: xiaobu H5 visual regression
    # 面门控（issue #6051）：非 required 腿 ⇒ 整层跳过（runner 不再空转）。
    needs: detect
    if: needs.detect.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect mini-app changes
        id: detect
        run: |
          # 仅 PR 事件用 diff 门控；push main / workflow_dispatch 全量跑（origin/main 与 HEAD 相同，diff 无意义）
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
            echo "✅ 非 PR 事件（push/workflow_dispatch），全量执行视觉回归"
            exit 0
          fi
          git fetch origin main --quiet
          CHANGED=$(git diff --name-only origin/main...HEAD)
          HITS=$(echo "$CHANGED" | grep -E '^(frontend/mini-app/|tests/|\.github/)' || true)
          if [ -n "$HITS" ]; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
            echo "✅ 检测到 mini-app 相关变更，执行视觉回归"
          else
            echo "run_tests=false" >> "$GITHUB_OUTPUT"
            echo "⏭️ 无 mini-app 相关变更（其他模块 PR），跳过视觉回归空跑"
          fi

      - name: Setup Node.js
        if: steps.detect.outputs.run_tests == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - name: Install mini-app deps
        if: steps.detect.outputs.run_tests == 'true'
        working-directory: ${{ env.WORKING_DIR }}
        run: npm ci

      - name: Install Playwright deps
        if: steps.detect.outputs.run_tests == 'true'
        working-directory: tests
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Build H5 (test env overrides prod URL)
        if: steps.detect.outputs.run_tests == 'true'
        working-directory: ${{ env.WORKING_DIR }}
        env:
          TARO_APP_API_URL: http://localhost:8080
          TARO_APP_AI_API_URL: http://localhost:8001
        run: npm run build:h5

      - name: Run visual regression
        if: steps.detect.outputs.run_tests == 'true'
        working-directory: tests
        env:
          CI: 'true'
        run: npx playwright test specs/xiaobu/xiaobu-h5.spec.ts --config=playwright.xiaobu.config.ts

      - name: Upload visual diff artifacts (failure)
        if: failure() && steps.detect.outputs.run_tests == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: xiaobu-visual-diffs
          path: tests/test-results/xiaobu/
