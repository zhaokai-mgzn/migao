name: Build and Deploy frontend (admin-web)
permissions:
  contents: read
  # 🔴 跳过 / 终态判据的**凭据**（issue #5941）：`Skip if already built` 步要跑 `gh run list`
  # 读同 sha 的 run 结论。workflow 级 `permissions` 一旦显式声明，**未列出的作用域一律为
  # `none`** ⇒ 缺这一行时即使注入了 token 也读不到 runs。最小权限 = 只读。
  actions: read

on:
  push:
    branches: [main]
    tags:
      - 'v*'
    paths:
      - 'frontend/admin-web/**'
  # 部署对账（issue #2947）：连续快速合并时 GitHub 可能吞掉 push 触发
  # （2026-09-05 实测 #2927 合并后 frontend/admin-api 未生成任何 deploy run——镜像从未构建，#2936 只覆盖 ai-agent）。
  # 定时兜底：检查 main HEAD 对应的 sha-xxx 镜像是否已存在，缺失则补一次构建部署。
  # ⚠️ **错峰**（issue #5078 ③）：本 workflow 与 deploy-reconcile / deploy-frontend /
  # deploy-ai-agent-service / flaky-ledger-reconcile **原来全是 `*/20 * * * *`** ⇒
  # :00/:20/:40 同刻起跑 5 个重活（同时抢 runner + 同时抢各自的并发锁），而
  # `deploy-reconcile` 的职责正是 dispatch 这 3 条 deploy ⇒ 队列自踩。
  # 现排在 reconcile（:00/:20/:40）**之后** N 分钟：reconcile 先判定并 dispatch，
  # 本腿随后独立复核（镜像已在 ⇒ 秒退，见 `Skip if already built`），不再同刻挤在一起。
  # 周期仍是 20min ⇒ #2947/#2935 的分钟级兜底窗口不变。
  schedule:
    - cron: '12,32,52 * * * *'
  workflow_dispatch:
    inputs:
      image_tag:
        description: '部署指定镜像 tag（回滚/指定版本用，如 sha-xxxxxxx 或 v1.2.3）。留空 = 构建当前代码并部署'
        required: false
        default: ''

env:
  # 部署目标：SWAS 轻量应用服务器（2026-08-14 起替代 SAE）—— 当前为测试环境
  SWAS_INSTANCE_ID: b23c69e599524b1da719734f72e6a0e3
  SWAS_REGION: cn-hangzhou
  # CI 构建镜像推送 ACR → SWAS 服务器 docker compose pull 预构建镜像（见 deploy/swas/deploy.sh）
  ACR_REGISTRY: crpi-qdcgkzwx9p9zckga.cn-hangzhou.personal.cr.aliyuncs.com
  ACR_NAMESPACE: ai-customer-service
  IMAGE_NAME: admin-web

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # 硬超时兜底（issue #4767 ①）：脚本被卡死时由 GitHub 终止 run ⇒ run 进**终态** ⇒
    # `deploy-frontend` 的 concurrency 组释放。事故里挂住的 run 占锁 20+ 分钟 ⇒ 后续 main 的部署全被挡住。
    # 90min 的来历（issue #5814 C′ + #5896）：构建已搬到**服务器侧**，其墙钟算在「发起+轮询」预算之内
    # （`swas-deploy-ci.sh` 的 SWAS_DEPLOY_TIMEOUT_SECONDS，C′ 下默认 4500s = 75min
    #   = **远端锁等待上限 1800s** + **冷构建上界 2400s** + 余量 300s）⇒ job 上界必须**大于**它，
    # 否则 run 会先被 GitHub 打死，而打死报的是 `cancelled`（**不是** failure）⇒ 断路器不跳闸
    # ⇒ cron 自放大（本单要消灭的形态）。
    # 实测：冷构建 1782s（29.7min）、并发部署排队 ~28min ⇒ 90min 给足余量，
    # 且仍能兜住真正卡住的 run（lock 一定会释放）。
    timeout-minutes: 90
    # 部署对账输出（issue #2947）：schedule 触发时若镜像已存在则 skip=true（本轮未部署）
    outputs:
      deployed: ${{ steps.sync.outputs.skip }}

    concurrency:
      group: deploy-frontend
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      # 镜像 tag：git SHA 前 7 位（不可变、可追溯）；回滚/指定版本时用输入值
      - name: Resolve image tag
        id: tag
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "IMAGE_TAG=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
            echo "MODE=rollback" >> "$GITHUB_OUTPUT"
          else
            echo "IMAGE_TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "MODE=build" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker login ACR
        if: steps.tag.outputs.MODE == 'build'
        run: echo "${{ secrets.ACR_PASSWORD }}" | docker login ${{ env.ACR_REGISTRY }} -u ${{ secrets.ACR_USERNAME }} --password-stdin

      # ── 部署对账（仅 schedule 触发时生效，issue #2947）──
      # 连续快速合并时 GitHub 可能吞掉 push 触发（实测 #2927 合入 main 后 frontend
      # 未生成任何 deploy run——镜像从未构建）。定时兜底：main HEAD 对应的
      # sha-<head7> 镜像已存在 → 该 commit 构建过，跳过本轮构建部署；
      # 缺失 → push 触发被吞，执行完整构建部署。
      - name: Skip if already built (schedule reconcile)
        id: sync
        # ⚠️ **改前只有 `github.event_name == 'schedule'`** ⇒ `workflow_dispatch` 这条路径
        # **整步不跑** ⇒ 重复 dispatch 的 run 照常构建 + 部署 ⇒ 占住 `deploy-<svc>` 并发锁。
        # #5078 的级联就是这么形成的（实测：run 35627484674 的 job **排队 42min** 才起跑，
        # 拿到锁时早已越过 45min 上界 ⇒ 被 `timeout-minutes` 打死；同形还有 35628449279 /
        # 35620917459 / 35627829895）。重复 dispatch 的来源是 `deploy-reconcile.yml`
        # （cron `*/20`，main HEAD 的镜像缺失就再 dispatch 一次）—— 挂住的 run 不产出镜像
        # ⇒ 每 20min 再补一次 ⇒ 队列里永远压着一个「注定被超时打死」的 run。
        # 修法（**不降门禁**）：把同一条「镜像已在 ⇒ 不必重做」的判据**扩到 workflow_dispatch**
        # ⇒ 排队的 run 拿到锁后**秒退**（打印理由），而不是白占 45min。`timeout-minutes` 兜底保留。
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          # 用 env 而不是在 run 里内联 `${{ … }}`：内联表达式在 shell 里是 `${{` 形态，
          # 本仓的执行式守卫测试要逐字渲染这段正文（见 tests/unit_ci_workflows/
          # test_deploy_churn_and_env_gate.py）⇒ 走环境变量既更安全也更好测。
          EVENT_NAME: ${{ github.event_name }}
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
          # 🔴 凭据（issue #5941）：`gh` 在 Actions 环境**不读**任何配置文件（runner 上没有
          # `gh auth login` 写下的 hosts.yml），**只认** `GH_TOKEN` ⇒ 缺它 ⇒ 本步的
          # `gh run list` 恒失败（本机复现：exit=4 + `To get started with GitHub CLI,
          # please run: gh auth login`）⇒ 跳过判据恒不可用，而 `2>/dev/null` 把失败吞成
          # 空结果 ⇒ 每次 cron 都全量重建重部署。配套 workflow 级 `permissions: actions: read`。
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          EXPECTED_TAG="sha-${GITHUB_SHA::7}"
          IMAGE="${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_NAME }}:${EXPECTED_TAG}"
          # ⚠️ **先去重、后判定镜像**的顺序很重要：`image_tag` 非空 = 人工回滚（MODE=rollback），
          # 回滚目标镜像**必然已存在** ⇒ 若先判镜像存在就 `exit 0`，会把 #4852 的显式回滚接口
          # **整条砍掉**（守卫挡死它自己的逃生口）。故回滚路径**根本不进**镜像判定。
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -z "$INPUT_IMAGE_TAG" ] \
             && docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "✅ 镜像 ${IMAGE} 已存在——main 当前 commit 已构建过"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            # workflow_dispatch + 无 image_tag + 镜像已在 ⇒ **重复 dispatch**（对账每 20min
            # 补一次，或前一个 run 已构建完）⇒ 当场退出，把并发锁让给真正要做事的 run（#5078）。
            echo "⏭️ 跳过原因（显式，非静默）：本次是 workflow_dispatch 且未指定 image_tag，"
            echo "   而 sha-${GITHUB_SHA::7} 的镜像已存在 ⇒ 该 commit 已构建过 ⇒ 判定为**重复 dispatch**"
            echo "   （来源多为 deploy-reconcile.yml 的 cron 兜底）。不再构建/部署，直接退出以释放并发锁。"
            echo "   需要**强制重新部署同一 commit**：走显式回滚接口 \`gh workflow run <deploy>.yml -f image_tag=sha-<7>\`"
            exit 0
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_IMAGE_TAG" ]; then
            echo "ℹ️ MODE=rollback（显式指定 image_tag=${INPUT_IMAGE_TAG}）⇒ 跳过「镜像已存在」去重判定，"
            echo "   照常构建/部署（#4852 的显式回滚接口必须永远可用）"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "✅ 镜像 ${IMAGE} 已存在——main 当前 commit 已构建过，跳过构建部署"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            # ── 不可恢复终态闸门（issue #5814 B/C）────────────────────────────────
            # 镜像缺失**不等于**「该补一次构建」：这个 commit 最近一次部署如果是**不可恢复的
            # 终态**（failure / cancelled / timed_out / startup_failure / action_required /
            # stale），再补一次只会**再挂一次**。
            # 事故读数（run 36582359732 的 job 109453551643，2026-09-28）：构建 1~2min 跑完，
            # 随后挂在「推 ACR」约 40min ⇒ 被 `timeout-minutes: 45` 打死 ⇒
            # conclusion=**cancelled**（**不是** failure）⇒ 旧断路器（只认 failure）不跳闸 ⇒
            # 本腿自己的 cron（20min 一轮）与 `deploy-reconcile.yml` 的 cron 各自再 dispatch
            # 一次 ⇒ 同一 commit 无限重试，每轮白占 `deploy-<svc>` 并发锁 45min
            # （`cancel-in-progress: false`）⇒ 实测 job 排队 30~42min（正常 0.1min）。
            # 判据形态 = **允许名单**（fail-closed）：只有
            #   success / skipped / neutral / 空（查不到同 sha 记录）才继续补部署，
            # **其余一切结论**（含 GitHub 将来新增的）都跳闸。为什么不用黑名单：黑名单在
            # GitHub 新增一种结论时**静默退回 fail-open** = 本 bug 原样复发（#5814 的教训）。
            #
            # ⚠️ **边界（与人工出口）**：本判据只挡「自动补部署」这一条路。**复跑**同一个 commit
            #   走 `gh workflow run <本腿>.yml --ref main` 或在 run 页面 Re-run（手动面，永远放行）；
            #   显式回滚（`-f image_tag=<tag>`）在**更早**的分支就已放行，根本不进这里（#4852 的逃生口）。
            # ⚠️ **fail-open 保留**：`gh` 查询失败 / 无记录 ⇒ is_recoverable 保持 "true" ⇒ 照旧补部署
            #   —— 本检查自己出错**绝不**停掉部署（与 deploy-reconcile 同口径）。
            # ── 跳过判据的**自证**（issue #5941）────────────────────────────────────
            # 病（实测，2026-10-02）：本查询在 runner 上**没有凭据**（workflow 级只有
            # `contents: read`、step 里也没有 `GH_TOKEN`）⇒ `gh` 未认证（本机复现：exit=4 +
            # `To get started with GitHub CLI, please run: gh auth login`），而
            # `2>/dev/null || echo "[]"` 把这层失败**整层吞掉**（实测 stderr 为空、stdout=`[]`）
            # ⇒ LAST_STATUS/LAST_CONCLUSION 恒空 ⇒ **C′ 跳过臂从未生效**：实测 run 36939400575
            # （2026-10-01T23:11:07Z，sha=3fa84ab）走的是 else 全量构建部署，而同一 sha 在
            # 19:04:47Z **已完整部署成功过一次**（该 run 的 env 块里逐字没有 GH_TOKEN，输出逐字是
            # 「最近一次同 sha 的 run 结论 = 无记录」）。
            # 修法三条，缺一不可（本段即判据的自证面，由
            # tests/unit_ci_workflows/test_deploy_skip_credential.py 逐字消费）：
            #   ① 凭据：workflow 级 `permissions: actions: read` + 本步 `env: GH_TOKEN`；
            #   ② 出声：凭据自检 + 查询 exit code + 返回条数 + **stderr 原文**一律打印；
            #   ③ fail-open 具名：查不到 ⇒ 照旧全量部署（本检查自己出错**绝不**停掉部署），
            #      但日志 + step summary 必须**具名**写出「跳过判据不可用」。
            AUTH_RC=0; AUTH_OUT=$(gh auth status 2>&1) || AUTH_RC=$?
            echo "── 跳过判据自证（issue #5941）──"
            echo "gh auth status exit=${AUTH_RC}：${AUTH_OUT%%$'\n'*}"
            QR_ERR_FILE=$(mktemp)
            QR_RC=0
            last_runs=$(gh run list --workflow "${GITHUB_WORKFLOW:-}" --branch main --limit 30 \
                          --json databaseId,headSha,conclusion,status 2>"$QR_ERR_FILE") || QR_RC=$?
            QR_ERR=$(cat "$QR_ERR_FILE"); rm -f "$QR_ERR_FILE"
            # ⚠️ `${last_runs:-[]}` 而不是 `$last_runs`：jq 对**空输入**是「零次执行 + exit 0」
            # ⇒ `|| echo 0` 兜不住 ⇒ 计数会打成空串（本机实测）。补上默认 `[]` 才是真兜底。
            RAW_ROWS=$(printf '%s' "${last_runs:-[]}" | jq -r 'if type == "array" then length else 0 end' 2>/dev/null || echo 0)
            # 排除**本轮 run 自己**：`gh run list` 把当前 in_progress 的 run 排在 `[0]`（本机
            # 现取 2026-10-02）⇒ 不排除时「取同 sha 的最新一条」永远取到**自己** ⇒ C′ 的
            # 「completed + success」恒不成立（会被下面那条「尚未跑完」闸门接住，理由却是错的）。
            # 排除后 `[0]` = 同 sha 上一条**别的** run。
            # ⚠️ 注释里**不要**写美元符号开头的变量名：本仓的 `set -u` 未定义变量守卫
            # （tests/unit_ci_workflows/test_deploy_leg_run_undefined_vars.py）连注释一起扫，
            # 而它只剥离单引号区（jq 程序）⇒ 注释里的变量引用会被判成未定义变量（本包踩过）。
            last_runs=$(printf '%s' "$last_runs" | jq -c --arg rid "${GITHUB_RUN_ID:-}" \
                          'if type == "array" then [.[] | select((.databaseId // 0 | tostring) != $rid)] else . end' \
                          2>/dev/null || printf '%s' "$last_runs")
            ROWS=$(printf '%s' "${last_runs:-[]}" | jq -r 'if type == "array" then length else 0 end' 2>/dev/null || echo 0)
            echo "gh run list exit=${QR_RC} · 原始 ${RAW_ROWS} 条 · 排除本轮 run（${GITHUB_RUN_ID:-?}）后 ${ROWS} 条"
            if [ -n "$QR_ERR" ]; then
              echo "::warning::gh run list 的 stderr（issue #5941：不再被 2>/dev/null 吞掉）：${QR_ERR}"
            fi
            # 「判据可用」= 查询成功 **且** 真的拿到了记录（0 条 / jq 缺失 / 查询失败都算不可用）。
            QUERY_OK="true"
            if [ "$QR_RC" != "0" ] || [ "$ROWS" = "0" ]; then QUERY_OK="false"; fi
            last_pair=$(printf '%s' "$last_runs" | jq -r --arg s "$GITHUB_SHA" \
                          '[.[] | select(.headSha == $s)][0] | "\(.conclusion // "")|\(.status // "")"' 2>/dev/null || echo "")
            LAST_CONCLUSION=""; LAST_STATUS=""
            # ⚠️ 只有拿到**两个字段都解析出来**的形态（含 `|` 分隔符）才认这次查询 ——
            # `jq` 缺失 / 解析报错 / 输出为空 ⇒ 一律当作「查不到」⇒ 保持 fail-open（见上）。
            # 少了这道自证，`gh`/`jq` 不可用时 `LAST_STATUS` 会被 `##*|` 赋成整串 ⇒ 分支判反。
            if [[ "$last_pair" == *"|"* ]]; then
              LAST_CONCLUSION="${last_pair%%|*}"
              LAST_STATUS="${last_pair##*|}"
            fi
            is_recoverable="true"
            if [ -n "$LAST_STATUS" ] && [ "$LAST_STATUS" != "completed" ]; then
              # 同 sha 的 run 还在 queued / in_progress / waiting / requested / pending ⇒
              # 重复 dispatch 是纯 churn（concurrency 锁会让它白等）⇒ 交给在跑的那个。
              is_recoverable="false"
              LAST_CONCLUSION="status=${LAST_STATUS}（尚未跑完）"
            elif [ -n "$LAST_CONCLUSION" ]; then
              case "$LAST_CONCLUSION" in
                success | skipped | neutral) is_recoverable="true" ;;
                *) is_recoverable="false" ;;
              esac
            fi
            LAST7=$(printf '%s' "$GITHUB_SHA" | cut -c1-7)
            # ── 🔴 C′ 判据（issue #5814）：同 sha 的部署**已成功** ⇒ 该 commit 已构建部署过 ⇒ 跳过 ──
            # 病（实测 + 机器可判）：C′ 之后 CI **不再推 ACR** ⇒ 上面那条 `docker manifest inspect`
            # **恒不命中**（那一臂**保留**：将来若恢复推 ACR，判据自动复活）⇒ 若不补本臂，
            # `skip` 恒为 false ⇒ **每次 cron 都完整构建 + 完整部署** = 3 条腿 × 3 次/小时
            # = **9 次全量重部署/小时**（蓝绿预验证 + 换容器 + nginx reload + 迁移），
            # **与代码有没有改动无关**。这正是 #2935/#5078 建的「已构建 ⇒ 秒退」被悄悄取消的形态，
            # 而**没有任何东西会变红**（承重判据只桩了「结论分支」，不桩「镜像到底在不在」）。
            # 判据来源 = **同 sha 的部署 run 结论**（与下面 #5816 断路器**同一份** `gh run list`
            # ⇒ 零新增机制 / 零新增 secret）；语义正好等于改前 ACR 判据想近似的「该 commit 已部署过」。
            # ⚠️ 位置在「仍在跑」检查**之后**（未跑完的 run 由下面那条 churn 闸门挡，不归本臂）。
            # ⚠️ 本臂**生效的两个前置**（issue #5941）：① 查询有凭据（workflow 级
            #   `actions: read` + 本步 `GH_TOKEN`）② 查询结果已排除「本轮 run 自己」（见上）。
            #   缺任一条 ⇒ 这里取不到那条 success ⇒ 本臂**形同不存在**（没有任何东西会变红）。
            if [ "$LAST_STATUS" = "completed" ] && [ "$LAST_CONCLUSION" = "success" ]; then
              echo "✅ ${LAST7} 的部署**已成功**——该 commit 已构建部署过，跳过本轮构建部署"
              echo "   判据来源（issue #5814 C′）：C′ 不推 ACR ⇒ 镜像必然不在 ACR，故改看「同 sha 的 run 结论」"
              echo "   需要**强制重新部署**同一 commit：gh workflow run <本腿>.yml -f image_tag=sha-${LAST7}"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              {
                echo "## ✅ 部署腿跳过（C′ 已部署判据，issue #5814）"
                echo ""
                echo "- 服务：\`${GITHUB_WORKFLOW:-}\` · commit：\`${LAST7}\`"
                echo "- 判据：同 sha 的部署 run 结论 = \`success\`（且 status=\`completed\`）⇒ 该 commit **已构建部署过**"
                echo "- 为什么不是「镜像在 ACR」：C′ = 服务器侧构建 ⇒ **不推 ACR** ⇒ 该判据恒不成立"
                echo "- 强制重新部署：\`gh workflow run <本腿>.yml -f image_tag=sha-${LAST7}\`"
              } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
              exit 0
            fi
            if [ "$is_recoverable" != "true" ]; then
              echo "⛔ 镜像 ${IMAGE} 缺失，但 ${LAST7} 最近一次部署是**不可恢复的终态**（结论=${LAST_CONCLUSION}）——跳过本轮构建部署。"
              echo "   理由（issue #5814）：自动重试同一个坏 commit 只会**再挂一次**（挂点 = 推送到 ACR，"
              echo "   会占住 deploy-<svc> 并发锁直到 45min 超时），并让本腿的 cron 与 deploy-reconcile"
              echo "   的 cron 互相放大成无限循环。人工确认（看该 run 的日志）后复跑："
              echo "   gh workflow run <本腿>.yml --ref main"
              echo "   · 该 commit 的代码有问题 ⇒ 先修或回滚；只是镜像推送抖动 ⇒ 用上面的命令复跑"
              echo "   · 在 run 页面点 Re-run 同样放行（本判据只看「最近一次 run 的结论」）"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              {
                echo "## ⛔ 部署腿跳过（issue #5814 不可恢复终态闸门）"
                echo ""
                echo "- 服务：\`${GITHUB_WORKFLOW:-}\` · commit：\`${LAST7}\`"
                echo "- 最近一次 run 的结论：\`${LAST_CONCLUSION}\`（不在允许名单 [success, skipped, neutral, 空] 内）"
                echo "- 动作：**不补构建/部署**（自动重试坏 commit 只会再挂一次并占锁 45min）"
                echo "- 人工出口：\`gh workflow run <本腿>.yml --ref main\`（或在该 run 页面 Re-run）"
              } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            else
              echo "⚠️ 镜像 ${IMAGE} 缺失——该 commit 的部署触发可能被吞（连续快速合并），执行完整构建部署"
              echo "   （最近一次同 sha 的 run 结论 = \`${LAST_CONCLUSION:-无记录}\` ⇒ 在允许名单内，可安全重试）"
              if [ "$QUERY_OK" != "true" ]; then
                # 🔴 fail-open 的**具名**出口（issue #5941 判据 3）：查不到 ⇒ 照旧全量部署，
                # 但要说清「是判据不可用，不是判据说该部署」——静默正是本单的病。
                echo "::warning::跳过判据**不可用**（gh run list exit=${QR_RC}，返回 ${ROWS} 条，stderr 见上）⇒ **本轮全量部署**（fail-open：本检查自己出错绝不停掉部署）"
                {
                  echo "## ⚠️ 部署腿未跳过（跳过判据不可用 ⇒ fail-open，issue #5941）"
                  echo ""
                  echo "- 服务：\`${GITHUB_WORKFLOW:-}\` · commit：\`${GITHUB_SHA::7}\`"
                  echo "- \`gh auth status\` exit=\`${AUTH_RC}\`；\`gh run list\` exit=\`${QR_RC}\`；返回 \`${ROWS}\` 条"
                  echo "- 语义：**跳过判据不可用 ≠ 判据说该部署** —— 按现状口径（fail-open）本轮照旧全量构建部署"
                  echo "- 排查入口：\`gh run list --workflow ${GITHUB_WORKFLOW:-} --branch main --limit 5\`"
                } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
              fi
              echo "skip=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      # Node ≥22.22.2（同 pr-check.yml 的 admin-web 腿）：本腿的 `Unit tests`（`npx vitest run`）
      # 用 jsdom 30（`engines.node = ^22.22.2 || ^24.15.0 || >=26.0.0`），其 undici 8.11.0 在 Node 20 上
      # 于模块装载期崩（`node:worker_threads.markAsUncloneable` 不存在）⇒ 单测整段跑不起来。
      # 生产镜像仍是 node:20-alpine（jsdom 只被 vitest 加载，`next build` 不碰它）。
      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        if: steps.tag.outputs.MODE == 'build' && steps.sync.outputs.skip != 'true'
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/admin-web/package-lock.json

      - name: npm ci
        if: steps.tag.outputs.MODE == 'build' && steps.sync.outputs.skip != 'true'
        working-directory: frontend/admin-web
        run: npm ci

      - name: Type check
        if: steps.tag.outputs.MODE == 'build' && steps.sync.outputs.skip != 'true'
        working-directory: frontend/admin-web
        run: npx tsc --noEmit

      - name: Unit tests
        if: steps.tag.outputs.MODE == 'build' && steps.sync.outputs.skip != 'true'
        working-directory: frontend/admin-web
        run: npx vitest run

      # ── C′ 服务器侧构建（issue #5814）：CI **不再构建、不再推 ACR** ──────────────
      # 用户 2026-09-30 裁定 C′（服务器侧构建），推翻旧铁律「构建跑在 CI，服务器只拉预构建产物」。
      # 根因：从境外 GitHub 托管 runner 跨境推大镜像到阿里云 ACR 会**无上界地挂住**
      # （实测 `Build and push` 步 32 样本双峰：2~4min 健康 vs 11.7~43.4min 病态，中位 37.6~40.2min，
      #  被 `timeout-minutes` 打死 ⇒ `cancelled`；失败率随体积单调上升）。
      # 现在：CI 只把源码（经既有 codeload 通道）与驱动参数送到服务器，由 **deploy.sh 在它自己的
      # flock 之内**就地 `docker build` + `docker compose up` ⇒ **根本不推 ACR** ⇒ 该根因结构性消失。
      # 实测：冷构建 1782s／**只改源码 2s**（层全 CACHED）／内存峰值 1792MB／磁盘每次净增约 1GB。
      # ⚠️ 本步**保留**一个显式自证：确认确实没有走推送路径（防将来有人把推送悄悄加回来）。
      - name: Assert server-side build (no ACR push)
        if: steps.tag.outputs.MODE == 'build' && steps.sync.outputs.skip != 'true'
        # ⚠️ 必须走 env 而不是在 run 正文里内联 `${{ … }}`：本仓的执行式守卫测试会**逐字渲染** run 正文
        # （内联表达式渲染后是未展开的 `${{` 形态 ⇒ 既不可读也不好测）。
        # 🔴 2026-09-30 修：原实现直接在正文里写 `${IMAGE_TAG}`，而该变量**只**在 `steps.tag.outputs` 里、
        # **不是** env ⇒ 配上 `set -euo pipefail` 当场 `unbound variable` ⇒ **三条腿的部署全部被这一步挡住**
        # （实测 run 36696120883 的 `Assert server-side build (no ACR push)` 红；判据只查文本、没人真跑过这步）。
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.IMAGE_TAG }}
        run: |
          set -euo pipefail
          echo "构建位置 = **SWAS 服务器侧**（issue #5814 C′）；CI 不构建、不推 ACR。"
          echo "镜像由 deploy/swas/deploy.sh 在服务器 flock 之内产出，tag=${IMAGE_TAG}。"

      # 自动部署目标 = 测试环境（当前 SWAS）；生产发布走 deploy-prod（未来）
      - name: Deploy to SWAS (测试环境)
        if: steps.sync.outputs.skip != 'true'
        env:
          AK: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          SK: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
          ACR_U: ${{ secrets.ACR_USERNAME }}
          ACR_P: ${{ secrets.ACR_PASSWORD }}
          IMAGE_TAG: ${{ steps.tag.outputs.IMAGE_TAG }}
          # 显式降级许可（issue #4852 ②）：`workflow_dispatch -f image_tag=<tag>`（MODE=rollback）
          # 是**人工回滚接口** ⇒ 只有这条路径给 1，其余（push / schedule 构建部署）恒 0
          # ⇒ 远端闸门「target 是当前在跑 tag 的祖先就跳过该服务」对普通部署生效、对显式回滚放行。
          ALLOW_DOWNGRADE: ${{ steps.tag.outputs.MODE == 'rollback' && '1' || '0' }}
        run: |
          bash deploy/scripts/swas-deploy-ci.sh \
            ${{ env.SWAS_INSTANCE_ID }} ${{ env.SWAS_REGION }} "$AK" "$SK" "$ACR_U" "$ACR_P" "$IMAGE_TAG" \
            admin-web

  # 部署后探测：前端域名 HTTP 200（防构建期 baked NEXT_PUBLIC_* 配错无信号）
  post-deploy-probe:
    name: Post-Deploy Frontend Probe
    needs: build-and-deploy
    # schedule 对账跳过构建部署时（本轮未部署）不再跑探测；push/rollback 正常跑
    if: github.event_name != 'schedule' || needs.build-and-deploy.outputs.deployed == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe merchant domain
        run: |
          # 注意：admin-web 公网域名是 merchant.migaozn.com（nginx server_name，
          # 见 deploy/swas/nginx.conf）；admin.migaozn.com 未解析，曾导致探测误报失败
          for i in $(seq 1 6); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 15 https://merchant.migaozn.com/ || echo 000)
            echo "merchant.migaozn.com -> $CODE (attempt $i)"
            if [ "$CODE" = "200" ] || [ "$CODE" = "307" ]; then echo "✅ 前端部署后探测通过"; exit 0; fi
            sleep 10
          done
          echo "❌ 前端部署后探测失败（6 次均非 200）"
          exit 1
