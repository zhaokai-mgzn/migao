name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/admin-web/**'
  workflow_dispatch:

env:
  # 部署目标：SWAS 轻量应用服务器（2026-08-14 起替代 SAE）
  SWAS_INSTANCE_ID: b23c69e599524b1da719734f72e6a0e3
  SWAS_REGION: cn-hangzhou
  # ACR/GHCR 镜像推送为历史遗留（SWAS 服务器自己源码构建，线上不消费镜像）
  ACR_REGISTRY: crpi-qdcgkzwx9p9zckga.cn-hangzhou.personal.cr.aliyuncs.com
  ACR_NAMESPACE: ai-customer-service
  IMAGE_NAME: admin-web

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set tag
        id: tag
        run: echo "tag=v$(date +%Y%m%d%H%M%S)" >> $GITHUB_OUTPUT

      - name: Docker login ACR
        run: echo "${{ secrets.ACR_PASSWORD }}" | docker login ${{ env.ACR_REGISTRY }} -u ${{ secrets.ACR_USERNAME }} --password-stdin

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/admin-web/package-lock.json

      - name: npm ci
        working-directory: frontend/admin-web
        run: npm ci

      - name: Type check
        working-directory: frontend/admin-web
        run: npx tsc --noEmit

      - name: Unit tests
        working-directory: frontend/admin-web
        run: npx vitest run

      - name: Build and push
        working-directory: frontend/admin-web
        run: |
          TAG=${{ steps.tag.outputs.tag }}
          IMG=${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_NAME }}
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker build \
            --build-arg NEXT_PUBLIC_API_BASE_URL=${{ secrets.NEXT_PUBLIC_API_BASE_URL || 'https://api.migaozn.com' }} \
            --build-arg NEXT_PUBLIC_AI_API_BASE_URL=${{ secrets.NEXT_PUBLIC_AI_API_BASE_URL || 'https://ai-api.migaozn.com' }} \
            --build-arg NEXT_PUBLIC_COOKIE_DOMAIN=${{ secrets.NEXT_PUBLIC_COOKIE_DOMAIN || '.migaozn.com' }} \
            -t ghcr.io/zhaokai-mgzn/migao/admin-web:$TAG \
            -t ghcr.io/zhaokai-mgzn/migao/admin-web:latest \
            -t $IMG:$TAG \
            -t $IMG:latest \
            .
          docker push ghcr.io/zhaokai-mgzn/migao/admin-web:$TAG
          docker push ghcr.io/zhaokai-mgzn/migao/admin-web:latest
          docker push $IMG:$TAG
          docker push $IMG:latest

      - name: Deploy to SWAS
        env:
          AK: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          SK: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
        run: |
          curl -fsSL https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz -o /tmp/aliyun.tgz
          tar xzf /tmp/aliyun.tgz -C /tmp
          sudo mv /tmp/aliyun /usr/local/bin/
          aliyun configure set --access-key-id "$AK" --access-key-secret "$SK" --region cn-hangzhou
          # 触发 SWAS 云助手执行 deploy.sh(拉源码 -> 构建 -> compose 启动 -> 健康检查)
          aliyun plugin install --names aliyun-cli-swas-open >/dev/null 2>&1 || true
          INVOKE=$(aliyun swas-open RunCommand \
            --InstanceId b23c69e599524b1da719734f72e6a0e3 \
            --Name migao-ci-deploy \
            --Type RunShellScript \
            --Timeout 1800 \
            --RegionId cn-hangzhou \
            --CommandContent "bash /opt/migao-deploy/deploy.sh" 2>&1)
          INVOKE_ID=$(echo "$INVOKE" | python3 -c "import sys,json;print(json.load(sys.stdin).get('InvokeId',''))")
          echo "deploy invokeId=$INVOKE_ID"
          if [ -z "$INVOKE_ID" ]; then echo "FAILED: no InvokeId"; echo "$INVOKE"; exit 1; fi
          for i in $(seq 1 90); do
            RES=$(aliyun swas-open DescribeInvocationResult \
              --InstanceId b23c69e599524b1da719734f72e6a0e3 \
              --InvokeId "$INVOKE_ID" \
              --RegionId cn-hangzhou)
            STATUS=$(echo "$RES" | python3 -c "import sys,json;d=json.load(sys.stdin);v=d.get('InvocationResult') or d;print(v.get('InvocationStatus') or v.get('Status') or '')")
            echo "  deploy status: $STATUS"
            if [ "$STATUS" = "Success" ]; then echo "SWAS 部署成功"; break; fi
            if [ "$STATUS" = "Failed" ]; then echo "FAILED: SWAS 部署失败"; echo "$RES" | head -c 1500; exit 1; fi
            sleep 20
          done
