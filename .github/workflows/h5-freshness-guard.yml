name: H5 Freshness Guard（C 端产物新鲜度）

# 病灶与判据：scripts/h5_freshness_guard.py（issue #4184 判据 2）
#   线上 app.migaozn.com/js/app.js 的 Last-Modified = 08-30，而 frontend/mini-app 最近改动 = 09-28 前
#   ⇒ 线上落后 ~28 天，**没有任何东西会因此变红**（「C 端已部署」的说法一直被当真）。
#
# 🔴 口径已按用户裁定 **B** 从 `::warning::` **翻成判红（gate）**（2026-09-27）：
#   「通路建好并自证（含新鲜度判据从 warning 翻成 gate），但首次发布由人手动触发」。
#   翻红的理由：本腿原先只告警的**唯一**理由是「C 端 H5 暂无发布通路」（#4184 主体待裁定）——
#   而通路已随 `.github/workflows/c-end-h5-publish.yml` 建好 ⇒ 那个前提不成立。
#   ⚠️ **后果如实登记**：**首次发布尚未发生之前，这条腿在 main 上会红**（线上仍 08-30），
#   直到有人手动发布一次：`gh workflow run c-end-h5-publish.yml --ref main -f publish=true`。
#   这是**真实且可操作的**红；**不许**用「先 warning 一段时间」把它藏起来（= 用户否掉的那个选项）。
#   一次性诊断要看「不判红的读数」⇒ dispatch 时把 `no_gate` 勾上（或本地加 `--no-gate`）。
#
# 触发面：产物发布腿完成时（workflow_run：Mini-App CI / 两个已完成腿 / 本单新增的 C 端发布腿）
#   + main 有新合并 + 手动；⛔ **无 cron**（用户 2026-09-21 裁定，未被推翻）。
on:
  # ── #5814 触发面降频：上游收窄到**发布腿**（去掉 PR 面的 `Mini-App CI`）──────────
  # 本腿的判定对象是「**线上产物** vs `origin/main` 上 `frontend/mini-app/**` 的最近改动」，
  # 与上游 CI 的**结论**无关 ⇒ `Mini-App CI`（PR 面腿，每个 PR 至少跑一次）的每一次完成都
  # 白跑一次本腿（实测 09-27~09-29：210 次里绝大多数是这一半；下游读数同源、零信息增量）。
  # 保留面 = 两条**发布腿**（发布完成 ⇒ 立刻重判新鲜度，这才是「落后了马上知道」的入口）
  #   + `push: main`（main 有新合并 ⇒ 源码改动时间前进 ⇒ 可能变陈旧）
  #   + `workflow_dispatch`（一次性诊断 / `no_gate`）。
  # 🔴 代价（如实登记，见 PR body「接受的缺口」）：上游收窄后，**PR 阶段**的产物陈旧不再被
  #    提前发现 —— 从「每个 PR 一次」退回「push to main / 发布完成 / 每日定时（若有）」。
  workflow_run:
    workflows:
      - "Publish worker-h5 (app.migaozn.com/w/)"
      # 本单新增的 C 端发布腿：它发布完成后立刻重判新鲜度（否则要等下一次 push 才知道好了）
      - "Publish C-end H5 (app.migaozn.com 根)"
    types: [completed]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      no_gate:
        description: "只 ::warning:: 不判红（**仅**一次性诊断用；默认判红 = gate）"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write   # 显式声明（将来「判红自己开单」的出口要用；未列出的 scope 会被清零 —— #3834 的教训）

concurrency:
  group: h5-freshness-guard
  cancel-in-progress: false

jobs:
  h5-freshness:
    name: h5-freshness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # 判据要 `git log -1 -- frontend/mini-app` ⇒ 需要真实历史（浅检出会让它取不到 ⇒ 判「无法判定」）
          fetch-depth: 0

      - name: 判据（线上 Last-Modified vs 源码最近改动）+ 计数声明
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          source .github/scripts/mechanism_liveness.sh

          # 默认判红（gate，用户 2026-09-27 裁定 B）；只有显式勾 no_gate 才退回报告型。
          GATE_FLAG=""
          if [ "${{ github.event.inputs.no_gate }}" = "true" ]; then
            GATE_FLAG="--no-gate"
          fi

          OUT="$(python3 scripts/h5_freshness_guard.py ${GATE_FLAG})"
          RC=$?
          printf '%s\n' "${OUT}"
          SEEN="$(printf '%s\n' "${OUT}" | sed -n 's/^MIGAO-H5FRESH-SUMMARY seen=\([0-9]*\).*/\1/p' | tail -1)"
          ACTED="$(printf '%s\n' "${OUT}" | sed -n 's/^MIGAO-H5FRESH-SUMMARY .*acted=\([0-9]*\).*/\1/p' | tail -1)"
          WHY="$(printf '%s\n' "${OUT}" | sed -n 's/^MIGAO-H5FRESH-SUMMARY .*why=//p' | tail -1)"
          mechanism_liveness_declare --seen "${SEEN:-unknown}" --acted "${ACTED:-unknown}" \
            --why "${WHY:-no-declaration}"
          exit ${RC}

      # ── 存活读数（issue #5326 判据 1 / 4）──────────────────────────────────────
      # 本步 `if: always()` 且是 job 的**最后一步**：机制停摆 ⇒ 根本没有这一行（看门人判红）。
      # 判据：tests/unit_ci_workflows/test_mechanism_liveness.py
      #   ::test_reading_step_binds_outcome_to_the_github_expression
      #   ::test_every_emitter_reading_step_fails_open_when_the_emitter_is_absent
      - name: 存活读数（本轮做了什么 / 为什么零动作）
        if: always()
        env:
          OUTCOME: ${{ job.status }}
        run: |
          if [ -f .github/scripts/mechanism_liveness.sh ]; then
            bash .github/scripts/mechanism_liveness.sh emit h5-freshness-guard --outcome "$OUTCOME"
          else
            echo "::warning::机制存活读数**本轮无声**（mech=h5-freshness-guard）：发射器不在检出里（检出固定 ref / 浅检出）⇒ 本轮读数缺失（**不是**「零动作」）"
          fi