name: Fixture Re-record
permissions:
  contents: write
  pull-requests: write
  # ⚠️ 失败建 issue 必需（#3834 同类扫描查出）：本 workflow 每月 1 日定时跑，缺此权限时
  # 失败钩子（issues.create / search.issuesAndPullRequests）静默崩溃 —— 实证
  # run 33562358650（2026-09-01 schedule）failure，而 `[Fixture] 重录失败` 的 issue
  # **历史 0 条**（#3270/#3497 同款）。守卫：tests/unit_ci_workflows/
  # test_workflow_issue_permissions.py
  issues: write

on:
  workflow_dispatch:
  schedule:
    # 每月 1 日 03:00 CST（UTC+8）= UTC 19:00，重录 API fixtures 防过期失真
    - cron: '0 19 1 * *'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  re-record:
    name: Re-record API fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install test deps
        working-directory: tests
        run: npm ci

      - name: Re-record fixtures from dev API
        working-directory: tests
        env:
          BASE_URL: ${{ secrets.E2E_ADMIN_API_URL || 'https://api.migaozn.com' }}
          E2E_MOCK_AUTH: 'false'
          E2E_ADMIN_PHONE: ${{ secrets.E2E_ADMIN_PHONE || '13800138000' }}
          E2E_SMS_CODE: ${{ secrets.E2E_SMS_CODE || '123456' }}
        run: |
          npx tsx e2e/scripts/record-fixtures.ts

      - name: Open PR if fixtures changed
        if: success()
        run: |
          # 发射器是**报告者**：它不可用（harness / 浅检出取不到文件）**绝不**得让机制本身失败。
          if [ -f .github/scripts/mechanism_liveness.sh ]; then
            source .github/scripts/mechanism_liveness.sh
          if [ -z "$(git status --porcelain -- tests/e2e/fixtures/)" ]; then
            echo "✅ fixtures 无变化，无需更新"
            # 零动作**也必须出声**（issue #5326 判据 1）：本步原先是整个 job 里最静默的一条路径
            # （月度跑一次、多数月份零动作）⇒ 现在它明确说「我看了、没变化、所以没动」。
              if [ -f .github/scripts/mechanism_liveness.sh ]; then
              source .github/scripts/mechanism_liveness.sh
              mechanism_liveness_declare --seen 1 --acted 0 --why "fixtures 无变化（零动作，不是没跑）" || true
            fi
          else
          fi
          if [ -z "$(git status --porcelain -- tests/e2e/fixtures/)" ]; then
            echo "✅ fixtures 无变化，无需更新"
          else
            git config user.name "migao-fixture-bot"
            git config user.email "fixture-bot@users.noreply.github.com"
            BRANCH="chore/fixture-rerecord-$(date +%Y%m%d)"
            git checkout -b "$BRANCH"
            git add tests/e2e/fixtures/
            git commit -m "chore(e2e): 重录 API fixtures（月度自动，含脱敏）"
            git push origin "$BRANCH"
            gh pr create --title "chore(e2e): 重录 API fixtures（月度自动）" \
              --body "月度 fixture 重录，保持 quality 测试数据新鲜。录制即脱敏（手机号确定性掩码）。" \
              --base main
          fi

      - name: Notify on failure (dedup guard)
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const title = `[Fixture] 重录失败 — ${new Date().toISOString().slice(0, 10)}`
            // 去重守卫（issue #2746）：同日同标题 open issue 已存在 → 仅评论追加，不重复建
            const q = `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`
            const { data: search } = await github.rest.search.issuesAndPullRequests({ q })
            if (search.total_count > 0) {
              const existing = search.items[0]
              console.log(`⏭️ 已存在同标题 open issue #${existing.number}，仅追加评论`)
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `同日同标题再次失败（新增 run）：${runUrl}`,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: `fixture 重录失败（录制脚本或登录异常）。\n\n查看详情：${runUrl}`,
                labels: ['bug', 'role/qa'],
              })
            }

      # ── 存活读数（issue #5326 判据 1 / 4）────────────────────────────────────────
      # 「我没做事」与「我没跑」必须长得不一样：本步 `if: always()` 且是 job 的**最后一步**
      # ⇒ 每轮必出一行 `::notice::MECHANISM-LIVENESS mech=<id> ...`（零动作 ⇒ `acted=0` + `why`）。
      # 机制**停摆**（本步不再执行）⇒ **根本没有这一行**。看门人（`mechanism-liveness.yml` 的
      # 定时腿）断言「main 上最近一次**已完成** run 的注解里存在**绑定该 run id** 的读数」，
      # 缺失 / 绑定旧 run / **读数与 run 结论矛盾** ⇒ 判红（判据 2）。
      # ⚠️ 判定只用 run 归属与结论，**不用挂钟时长**（判据 4：时长受 runner 负载污染）。
      - name: 存活读数（本轮做了什么 / 为什么零动作）
        if: always()
        env:
          OUTCOME: ${ job.status }
        run: bash .github/scripts/mechanism_liveness.sh emit fixture-record --outcome "$OUTCOME"
