name: Bmini-App CI

# ── 执行环境（issue #5814，2026-09-30）────────────────────────────────────────────
# 本 workflow 的 job 跑在**自托管 runner**（`runs-on: [self-hosted, migao-mac]`，
# 注册名 `migao-mac-m1` / 标签 `self-hosted, macOS, ARM64, migao-mac`）。
# 迁移面登记表 = `tests/unit_ci_workflows/runner_plane_ledger.json`，
# 判据 = `tests/unit_ci_workflows/test_runner_plane_ledger.py`（未登记 / 漂移即红）。
# 环境可复现脚本 = `scripts/setup-self-hosted-runner.sh`（幂等、不打印任何密钥）。
# 🔴 本机睡眠 / 关机 / 重启期间这条腿**不会有人来报状态** ⇒ PR 会卡在 `BLOCKED`
#   （"Expected — waiting for status to be reported"）。回退与重启条件见 PR body。
permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
    paths:
      - 'frontend/bmini-app/**'

# CI 队列治理（v1.3）：同 PR 新 push 自动取消旧 run
concurrency:
  group: ci-bminiapp-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_VERSION: '20'
  WORKING_DIR: frontend/bmini-app

jobs:
  # v1.3 门控：job 保持运行（required check 永不悬空），仅当 bmini-app 相关路径有变更才执行。
  typecheck-and-test:
    name: bmini-app typecheck + unit tests
    runs-on: [self-hosted, migao-mac]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect bmini-app changes
        id: detect
        run: |
          # 仅 PR 事件用 diff 门控；push main / workflow_dispatch 全量跑
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
            echo "✅ 非 PR 事件（push/workflow_dispatch），全量执行 typecheck/单测"
            exit 0
          fi
          git fetch origin main --quiet
          CHANGED=$(git diff --name-only origin/main...HEAD)
          HITS=$(echo "$CHANGED" | grep -E '^(frontend/bmini-app/|tests/|\.github/)' || true)
          if [ -n "$HITS" ]; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
            echo "✅ 检测到 bmini-app 相关变更，执行 typecheck/单测"
          else
            echo "run_tests=false" >> "$GITHUB_OUTPUT"
            echo "⏭️ 无 bmini-app 相关变更（其他模块 PR），跳过 typecheck/单测空跑"
          fi

      - name: Setup Node.js
        if: steps.detect.outputs.run_tests == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - name: Install dependencies
        if: steps.detect.outputs.run_tests == 'true'
        working-directory: ${{ env.WORKING_DIR }}
        run: npm ci

      - name: TypeScript type check
        if: steps.detect.outputs.run_tests == 'true'
        working-directory: ${{ env.WORKING_DIR }}
        run: npx tsc --noEmit

      - name: Run unit tests
        if: steps.detect.outputs.run_tests == 'true'
        working-directory: ${{ env.WORKING_DIR }}
        run: npm test

  # ── 构建腿（issue #5650）──────────────────────────────────────────────────────────
  # 为什么必须有：用户 2026-09-26 裁定「暂时只做 H5 浏览器访问，小程序链路先搁置」
  #   ⇒ **h5 编译产物 = 唯一用户可达形态**，而本 workflow 此前**两端都不构建**
  #   （全仓唯一 `build:h5` 在 `frontend/mini-app`，与本端无关）⇒ 编译坏了没有任何东西会红。
  # 为什么两端都构建：h5 的平台分支改动会同时压到 weapp 侧（本次改的就是 `utils/platform.ts` 的判别），
  #   只构建 h5 会让「h5 绿、weapp 编译坏了」这种形态溜过去。
  # 为什么合成**一个** job 而不是两条：`npm ci`（bmini-app 依赖树重）的成本远大于一次 `taro build`，
  #   拆两条 = 两次冷装；失败归因靠 step 名（`Build H5` / `Build weapp`），不需要两个 check 名。
  # ⚠️ 本单**只加构建腿**，不动 required 集合（翻 required 有两条前置，见 `migao-dev-flow` §2.2）。
  build:
    name: bmini-app build (h5 + weapp)
    runs-on: [self-hosted, migao-mac]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect bmini-app changes
        id: detect
        run: |
          # 与 `typecheck-and-test` 同一门控口径：仅 PR 事件用 diff 门控；push main 全量跑。
          # job 本身**保持运行**（required check 永不悬空），只是把重活跳掉。
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "run_build=true" >> "$GITHUB_OUTPUT"
            echo "✅ 非 PR 事件（push/workflow_dispatch），全量构建两端"
            exit 0
          fi
          git fetch origin main --quiet
          CHANGED=$(git diff --name-only origin/main...HEAD)
          HITS=$(echo "$CHANGED" | grep -E '^(frontend/bmini-app/|tests/|\.github/)' || true)
          if [ -n "$HITS" ]; then
            echo "run_build=true" >> "$GITHUB_OUTPUT"
            echo "✅ 检测到 bmini-app 相关变更，构建两端"
          else
            echo "run_build=false" >> "$GITHUB_OUTPUT"
            echo "⏭️ 无 bmini-app 相关变更（其他模块 PR），跳过构建空跑"
          fi

      - name: Setup Node.js
        if: steps.detect.outputs.run_build == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - name: Install dependencies
        if: steps.detect.outputs.run_build == 'true'
        working-directory: ${{ env.WORKING_DIR }}
        run: npm ci

      # 先 h5：它是唯一的用户可达形态（构建坏了就没人能访问）⇒ 失败时先报这一条
      - name: Build H5
        if: steps.detect.outputs.run_build == 'true'
        working-directory: ${{ env.WORKING_DIR }}
        run: npm run build:h5

      - name: Build weapp
        if: steps.detect.outputs.run_build == 'true'
        working-directory: ${{ env.WORKING_DIR }}
        run: npm run build:weapp

  # ── 底部 tabBar 的**几何 / 结构** e2e 腿（issue #5759）──────────────────────────
  # 为什么要有：C 端早有 `xiaobu-h5-visual`（`mini-app.yml`），而 B 端**零 e2e** ⇒
  #   #5754 的「底栏是否真的居中」只能人眼 + 手工量（那次连着两条 tabbar 病灶 + 一次构建陷阱）。
  # 与 C 端那条腿的**有意差别**：本腿判几何数字（留白对称 / 每格居中 / 条贴底 / 四张图标两两不同），
  #   **不做像素基线** —— 截图的 darwin/linux 双平台基线本机生成不齐全，几何判据跨平台确定性更好。
  # ⚠️ 只加腿、**不动 required 集合**（翻 required 有两条前置，见 `migao-dev-flow` §2.2）。
  tabbar-geometry:
    name: bmini H5 tabBar geometry (e2e)
    runs-on: [self-hosted, migao-mac]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect bmini-app changes
        id: detect
        run: |
          # 与另两条腿同一门控口径：仅 PR 事件用 diff 门控；push main / workflow_dispatch 全量跑。
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
            echo "✅ 非 PR 事件（push/workflow_dispatch），全量执行几何腿"
            exit 0
          fi
          git fetch origin main --quiet
          CHANGED=$(git diff --name-only origin/main...HEAD)
          HITS=$(echo "$CHANGED" | grep -E '^(frontend/bmini-app/|tests/|\.github/)' || true)
          if [ -n "$HITS" ]; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
            echo "✅ 检测到 bmini-app 相关变更，执行几何腿"
          else
            echo "run_tests=false" >> "$GITHUB_OUTPUT"
            echo "⏭️ 无 bmini-app 相关变更（其他模块 PR），跳过几何腿空跑"
          fi

      - name: Setup Node.js
        if: steps.detect.outputs.run_tests == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - name: Install bmini-app deps
        if: steps.detect.outputs.run_tests == 'true'
        working-directory: ${{ env.WORKING_DIR }}
        run: npm ci

      - name: Install Playwright deps
        if: steps.detect.outputs.run_tests == 'true'
        working-directory: tests
        run: |
          npm ci
          npx playwright install chromium --with-deps

      # 🔴 这里**没有**单独的 Build H5 步骤：本腿的配置在加载期用 `tests/xiaobu_dist_freshness.py ensure`
      #   自己构建 + 落指纹（构建失败 fail-closed）。两条理由：
      #   ① 与 C 端那条腿的 `check` 档不同 —— 那条把构建交给 workflow 步骤，是因为它「无权改 .github/**」；
      #      本腿的作者拥有该 workflow ⇒ 让**腿自己**对「产物是不是当前源码的」负责，比"祈祷上一步跑过"更硬；
      #   ② 同一 worktree 里再出现一次 `npm run build:h5` 会让 `test_local_gate_matrix` 的**同序**判据失效
      #      （它按首次出现取位置）⇒ 同源契约要求每个命令在 CI 腿里只出现一次。
      - name: Run tabBar geometry e2e
        if: steps.detect.outputs.run_tests == 'true'
        working-directory: tests
        env:
          CI: 'true'
        run: npx playwright test specs/bmini/bmini-tabbar.spec.ts --config=playwright.bmini.config.ts

      - name: Upload e2e artifacts (failure)
        if: failure() && steps.detect.outputs.run_tests == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: bmini-e2e-artifacts
          path: tests/test-results/bmini/