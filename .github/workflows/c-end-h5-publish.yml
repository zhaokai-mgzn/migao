name: Publish C-end H5 (app.migaozn.com 根)

# ── 为什么需要这条腿（issue #4184）─────────────────────────────────────────────
# `frontend/mini-app`（C 端元元）的 h5 产物此前**没有任何部署通路**：
#   · `grep -rln '/opt/migao-deploy' .github/workflows/` = 0 命中；
#   · `mini-app.yml` 的两个 job（typecheck+单测 / 视觉回归）都只 `npm run build:h5`，**不发布**；
#   · 而它的产物是 `app.migaozn.com` 的**静态根本身**（nginx `root` = `/opt/migao-deploy/h5`）——
#     历史遗留的落地面，谁也没有清单说明它由谁托管。
# 实测后果（2026-09-27）：线上 `/js/app.js` 的 `Last-Modified` = **08-30**，比源码最近改动早 **28 天**
# ⇒ 「C 端已部署」这个说法一直被当真，而**没有任何东西会因此变红**（`h5-freshness-guard.yml` 此前
# 只能 `::warning::`，理由正是「C 端 H5 暂无发布通路，#4184 主体待裁定」）。本 workflow 把通路建起来；
# 判据同批翻成 gate（`scripts/h5_freshness_guard.py` 的默认口径）。
#
# ── 🔴 触发面只有 `push: main`（paths 只有 `frontend/mini-app/**`）与 `workflow_dispatch` ──
#   · **没有 `pull_request`**：这条腿写的是**线上静态根**，PR 分流内容不该有机会落上去
#     （与 `worker-h5-publish.yml` / `bmini-h5-publish.yml` 同口径）；
#   · **paths 只有被测产物本身**（不登记发布链路自身）：改 `deploy/**` 或本 workflow
#     **不会**触发它 ⇒ 合并建通路的那个 PR 本身**不会**发布一次（#4184 用户裁定 B：首次发布由人手动触发）；
#   · 但 `push` 面本身**也不发布**：发布步骤带 `if: … inputs.publish == 'true' && event_name == 'workflow_dispatch'`
#     ⇒ 合并之后的每一次 C 端改动都只是**跑一遍并显式告知「没有发布」**，直到有人手动确认为止。
#     （为什么连 push 面也不自动发：首次发布还没发生，线上根上仍是**无人认领**的旧产物 ——
#       远端脚本的 `TAKEOVER_REQUIRED` 闸会拒绝接管 ⇒ 自动发布只会得到一条红，不如显式不发布。）
#
# ── 首次发布由人触发（用户 2026-09-27 裁定 B）──
#   `gh workflow run c-end-h5-publish.yml --ref main -f publish=true`
#   然后看 `Publish C-end h5 …` 那一步的输出自证读数（见 PR body 的发布清单）。

on:
  push:
    branches: [main]
    paths:
      # 被测发布物本身（改了 C 端不发布 ⇒ 线上落后，正是本单要治的形态；但**首发前不自动发**，见上）
      - 'frontend/mini-app/**'
  # 兜底面（`FM-E17` 收口口径，issue #5707 裁定 A）：`push` 在本仓**会被吞**（auto-merge 用
  # `GITHUB_TOKEN` 合并 ⇒ push run 不触发 workflow）⇒ 只靠 push 的腿等于**不会跑且无红**。
  # 🔴 本腿的 cron **只报告、绝不发布**（发布步骤的 `if` 要求 `workflow_dispatch` + `publish=true`）
  #    —— 它替这条腿回答「线上是否落后本仓库」，落后就 **判红并给出可复制的手动发布命令**。
  # 每日 18:53 UTC = 02:53 +08（错开 worker-h5 的 18:23 / bmini 的 18:43，避免三条腿抢同一批 CI 分钟）。
  schedule:
    - cron: '53 18 * * *'
  # 人工入口：默认**只报告不发布**（`publish=false`），要发布必须显式 `-f publish=true`
  workflow_dispatch:
    inputs:
      publish:
        description: "真的发布（把本次构建发到 app.migaozn.com 的静态根）。默认 false = 只报告不发布"
        type: boolean
        default: false

# 🔴 为什么需要 `contents: write`（issue #6095 第三层）：CI 构建出来的 `frontend/mini-app/dist/`
#   **不在 git 里**（`git ls-tree -r origin/main --name-only frontend/mini-app/dist` = 0 个文件，
#   `.gitignore` 里有 `dist/`）⇒ 而远端那条通道只认 git（按不可变 sha 从 codeload 取 tarball）
#   ⇒ 「CI 构建的产物」与「远端能取到的东西」之间**没有通路**（run 37078030820 的
#   `❌ 发布源里没有 index.html` 正是这个形态）。本腿现在把产物推成一个**孤儿单提交**（无父提交
#   ⇒ 不胀历史）到专用分支 `h5-dist`，远端按**该提交的 sha** 取回 ⇒ 仍是不可变 sha、仍是单一源。
#   ⚠️ 该推送**不会触发任何其它 workflow**：现取全部带 `push` 的 workflow，`on.push.branches`
#   一律是 `['main']`（由 `tests/unit_ci_workflows/test_c_end_h5_hosting.py` 从真 YAML 现取钉住）。
permissions:
  contents: write

# 与 deploy-* 同口径：不取消进行中的发布（两个并发发布会让「谁最后落地」不可判定）
concurrency:
  group: c-end-h5-publish
  cancel-in-progress: false

env:
  # 与 deploy-frontend.yml / worker-h5-publish.yml 同一台 SWAS 实例（测试环境）
  SWAS_INSTANCE_ID: b23c69e599524b1da719734f72e6a0e3
  SWAS_REGION: cn-hangzhou
  # 静态根（= `deploy/swas/nginx.conf` 里 `app.migaozn.com` 的 `root`）——**本腿的目标就是它本身**
  H5_STATIC_ROOT: /opt/migao-deploy/h5
  # 托管物台账（远端脚本写回；它的 `managed_top_level` 就是下一次发布的删除范围）
  H5_MANIFEST: .migao-c-end-h5-manifest.json
  # 保留前缀：`w/` 工人端（#4837，线上有工人在用）与 `b/` 商家端（#5668）**一个字节都不许动**
  H5_RESERVED_PREFIXES: "w b"

jobs:
  publish:
    name: publish c-end h5 → 静态根 + identity/protected assertions
    runs-on: ubuntu-latest
    # npm ci（Taro 依赖树重）+ build:h5 + 云调用 + 发布后落地面断言
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # 模式判定（**三种触发各自的出口**，见文件头「三种形态」）：
      #   · `push` / `schedule` / 不带 `publish=true` 的 dispatch ⇒ `notify`：**只报告，不发布**
      #   · `workflow_dispatch` + `publish=true` ⇒ `publish`：人在签字后真发布
      # 🔴 关键：`notify` 模式**不判红**（判红改由下面的 notify 步按**事实**判）——
      #    因为兜底面的 cron 必然每轮跑一次，若它无条件判红，就会变成一个「每天必红一次」的噪音腿，
      #    把「线上确实落后」这个**真实信号**淹掉。真正该红的是「**线上落后**」，不是「有 cron 在跑」。
      # 判据：tests/unit_ci_workflows/test_c_end_h5_hosting.py::TestNotifyAndPublishModes
      - name: Resolve mode（publish vs notify）
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.publish }}" = "true" ]; then
            echo "mode=publish" >> "$GITHUB_OUTPUT"
            echo "✅ 手动发布已授权（workflow_dispatch + publish=true）⇒ mode=publish"
          else
            echo "mode=notify" >> "$GITHUB_OUTPUT"
            echo "ℹ️ 本次**没有发布任何东西**（event=${{ github.event_name }} · publish=${{ inputs.publish }}）。"
            echo "   本腿只在手动授权时发布（issue #4184 用户裁定 B：首次发布由人手动触发）。"
            echo "   要发布（人手动）：gh workflow run c-end-h5-publish.yml --ref main -f publish=true"
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/mini-app/package-lock.json

      - name: Install dependencies
        if: steps.mode.outputs.mode == 'publish'
        working-directory: frontend/mini-app
        run: npm ci

      # 🔴 API 面必须**同源**（照 #5721 / #5668 实测的教训）：`app.migaozn.com` 的 nginx 已把
      # `/api/` 代理到 admin-api、`/api/chat/` 代理到 ai-agent ⇒ 同源**完全不经过 CORS**。
      # 漏了这两个变量 ⇒ `frontend/mini-app/src/utils/constants.ts` 的兜底
      # （`process.env.TARO_APP_API_URL || 'http://localhost:8080'`）会被 baked 进产物 ⇒
      # 真机上所有请求打到 localhost（浏览器侧 ERR_FAILED，服务端日志一条都没有）。
      # ⚠️ 本腿**刻意不注入** `TARO_APP_H5_PUBLIC_PATH`：C 端 `config/index.ts` 的 `h5.publicPath`
      #    是 `'/'`（它就是根），禁止靠改 `deploy/**` 去动别人的构建配置。
      - name: Build H5 (publicPath='/'，API 同源)
        if: steps.mode.outputs.mode == 'publish'
        working-directory: frontend/mini-app
        env:
          TARO_APP_API_URL: https://app.migaozn.com
          TARO_APP_AI_API_URL: https://app.migaozn.com
        run: npm run build:h5

      # 🔴 **把 CI 构建的那份 dist 变成远端能取到的东西**（issue #6095 第三层）：
      # `build:h5` 的产物 `frontend/mini-app/dist/**` 是**构建产物、不在 git 里**，而远端唯一的
      # 取回通道是「按不可变 sha 从 codeload 取 tarball」⇒ 在此之前远端**必然**
      # `❌ 发布源里没有 index.html`（run 37078030820）。本步造一个**孤儿单提交**（`git commit-tree`
      # 不给 `-p` ⇒ 无父 ⇒ 不胀历史）force-push 到专用分支 `h5-dist`，并把**该提交的 sha**
      # （= 不可变引用）经 step output 交给发布步 ⇒ 远端取回的 tarball 里就有
      # `frontend/mini-app/dist/index.html`。
      # ⚠️ 脚本用**临时 index**（`GIT_INDEX_FILE`）+ `git add -f`（`dist/` 在 `.gitignore` 里）
      #    ⇒ 不碰工作区 / 不碰主索引 / 不动 `HEAD`；commit message 带 `[skip ci]`。
      # ⚠️ 本步与「写盘」**同档**（都只在 publish 模式跑）⇒ 对账 / push 触发下不会推分支出门。
      - name: Prepare dist ref (孤儿单提交 → h5-dist；发布腿按不可变 sha 取回)
        id: dist
        if: steps.mode.outputs.mode == 'publish'
        env:
          H5_DIST_DIR: frontend/mini-app/dist
        run: |
          set -o pipefail
          bash deploy/scripts/c-end-h5-dist-push.sh | tee /tmp/h5-dist-push.log
          SHA=$(sed -n 's/^H5_DIST_SHA=//p' /tmp/h5-dist-push.log | head -1)
          case "$SHA" in
            *[!0-9a-f]*) echo "::error::dist 推送步给出的 sha 不是十六进制：'$SHA'"; exit 1 ;;
          esac
          [ "${#SHA}" -eq 40 ] || { echo "::error::dist 推送步没有给出 40 位 sha（实际 '${SHA}'）—— 发布腿按它会取不到产物"; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "✅ dist 已推到 h5-dist：$SHA（**不可变 sha**；发布腿按它取回，不是按分支名）"

      - name: Install Aliyun CLI
        if: steps.mode.outputs.mode == 'publish'
        run: |
          curl -fsSL --retry 3 --retry-delay 3 https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz -o /tmp/aliyun.tgz
          file /tmp/aliyun.tgz | grep -q "gzip compressed data"
          tar xzf /tmp/aliyun.tgz -C /tmp
          sudo mv /tmp/aliyun /usr/local/bin/
          aliyun plugin install --names aliyun-cli-swas-open >/dev/null 2>&1 || true
          aliyun version

      - name: Publish c-end h5 to SWAS (静态根本身；保留 w/ 与 b/)
        # 🔴 纵深防线（第二道）：**写盘的那一步自己**必须逐字要求手动授权 ——
        #    即使有人挪走 / 删掉上面的 Manual gate，这一步也不会在 push 或对账 dispatch 下发布。
        if: steps.mode.outputs.mode == 'publish'
        env:
          AK: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          SK: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
          # 🔴 第 5 个参数 = **产物 ref**（`h5-dist` 上那个孤儿单提交的 sha，来自上一步的 step output）
          #    —— **不是** `$GITHUB_SHA`（源码 commit 所指向的 tarball 里**没有** `dist/`，
          #    那正是 run 37078030820 的失败形态）。这条替换是第三层修复的接线点。
          #    格式断言在本地脚本里（必须 40 位十六进制 ⇒ 分支 / 标签 / `refs/heads/*` 过不去）。
          #
          # 🔴🔴 **`H5_PUBLISHED_COMMIT` 现在是「执行体 ref」，不只是溯源字段**（issue #6095 第五层）：
          #    引导**按它**从 codeload 取回 `deploy/swas/c-end-h5-publish-remote.sh` 并执行；
          #    而第 5 个参数（产物 ref）只用来让**远端** `stage_product()` 取产物。
          #    ⇒ 两者**必须是两个不同的 ref**：产物 ref 的 tarball 里只有 dist 文件、**没有脚本**
          #      （run 37084280991 的 `bash: …/c-end-h5-publish-remote.sh: No such file or directory`）。
          #    ⚠️ 别把远端脚本塞进 dist 孤儿提交（会破坏「只含产物」的可审计性质），也别退回内联（16 KB 墙）。
          H5_PUBLISHED_COMMIT: ${{ github.sha }}
        run: |
          bash deploy/scripts/c-end-h5-publish-ci.sh \
            "${{ env.SWAS_INSTANCE_ID }}" "${{ env.SWAS_REGION }}" "$AK" "$SK" "${{ steps.dist.outputs.sha }}"

      # 落地面断言（**不是**「/ 返回 200 就算过」—— 修复前 `/` 一直是 200 的旧产物）
      - name: Assert served identity (线上 = 本次构建；不串端；/w/ 与 /b/ 仍在且未被覆盖)
        # 同上一道闸：没有发布就不该有「落地面是新产物」的断言（否则它会在非手动触发下假绿/假红）
        if: steps.mode.outputs.mode == 'publish'
        run: bash deploy/scripts/c-end-h5-verify-served.sh https://app.migaozn.com frontend/mini-app/dist

      # ── notify 模式（push / schedule / 不带 publish=true 的 dispatch）────────────────
      # 🔴 **只判一件事**：线上产物是否落后于 `frontend/mini-app` 的最近改动 —— 判据本体 =
      #    `scripts/h5_freshness_guard.py`（**单一实现**，与 `h5-freshness-guard.yml` 跑的是同一份；
      #    本腿**不**再写第二份口径）。落后 ⇒ 判红 + 给出可复制的手动发布命令（这就是兜底面的意义）。
      # ⚠️ 为什么**不**比 `frontend/mini-app/dist/index.html`：`dist/` 在 `.gitignore` 里
      #    （`.gitignore:42`）⇒ CI 检出里根本没有它，那样写出来的判定会**恒走「没跑」分支** = 空转的兜底面。
      # 判据：`tests/unit_ci_workflows/test_c_end_h5_hosting.py::TestNotifyAndPublishModes`
      - name: Notify（线上产物是否落后本仓库；**只报告不发布**）
        if: steps.mode.outputs.mode != 'publish'
        run: |
          set +e
          python3 scripts/h5_freshness_guard.py --url https://app.migaozn.com/js/app.js --ref origin/main
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "✅ 线上产物不落后于 frontend/mini-app 的最近改动（判据本体 = scripts/h5_freshness_guard.py）"
            exit 0
          fi
          echo "::error::线上产物落后 / 无法判定（判据本体 rc=$rc；rc=2 陈旧、rc=3 无法判定、rc=1 参数错）。"
          echo "   本腿**不会**自动发布（用户 2026-09-27 裁定 B：首次发布由人手动触发）。要发布（人手动）："
          echo "     gh workflow run c-end-h5-publish.yml --ref main -f publish=true"
          exit "$rc"
