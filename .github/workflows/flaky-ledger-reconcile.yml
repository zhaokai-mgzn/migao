name: Flaky Ledger Reconcile (台账落仓对账兜底)

# ─────────────────────────────────────────────────────────────────────────────
# issue #4825 —— **独立兜底**：让「台账落 main」不再取决于 `flaky-triage.yml` 那一环还活着。
#
# 前提核实（本单实测，2026-09-20；读数见 PR body）：
#   #4804 的修法（`flaky_ledger.py approve` 批准被 `GITHUB_TOKEN` 抑制的台账 PR run）
#   **是 `flaky-triage.yml` 的一个步骤** ⇒ 该 workflow 一停（被禁用 / 语法坏 / `actions: write`
#   丢失），台账就**静默**停在 `chore/flaky-ledger` 分支上：本文件不参与 required 集合，
#   台账停在分支上**不会让任何 PR 变红**，也没有任何告警 —— 「没人会因为这件事变红」。
#   ⚠️ 实测还发现**更近的一层**（已在本单修掉，见 `flaky-triage.yml` 步骤⑤ 注释）：
#   即使 workflow 活着，`approve` 也在生产上**从未成功过一次**（步骤④ 把工作区切到台账分支
#   ⇒ 跑的是分支的旧脚本 ⇒ `invalid choice: 'approve'`）⇒ 改前读数：分支 6 条 / main **0 条**、
#   台账 PR #4775 OPEN、auto-merge **armed**、**0 个 check**，而 flaky-triage 状态 = `active`。
#
# 本 workflow 的形态**照抄 `deploy-reconcile.yml`**（本仓既有的「独立对账」先例）：
#   · 判据是**状态级**的（台账分支是否领先 main），**不是**事件级 ⇒ 与 flaky-triage.yml 的
#     `workflow_run` 触发面**不相交** ⇒ 一个停摆，另一个照常对账（不引入同一个单点）；
#   · 触发面 = `pull_request [opened, reopened]`（实测可靠的近实时入口，仓库迭代不停）
#     + `schedule '*/20'`（随机兜底：实测被 GitHub 节流到 2~5.5h，不可依赖但有比没有好）
#     + `workflow_dispatch`（手动）；
#   · **与既有路径不重复不打架（幂等）**：
#     ① `approve` 只作用于 `conclusion=action_required` 的 run（批准后 `run_attempt`+1、
#        `conclusion` 变 null ⇒ **天然不再命中**），且与 flaky-triage.yml 步骤⑤ **同一实现**
#        （同脚本同参数 —— 判据只有一处，不复制规则）；
#     ② `gh pr merge --auto` 是幂等 arm（已 arm 再 arm 无副作用）；
#     ③ 无漂移 ⇒ **零动作**（不碰 PR、不 approve、不 push）。
#   · **绝不削弱既有护栏**：本 workflow **只读**台账（`contents: read`：不写台账、不 push 分支、
#     **不创建 PR** —— 建 PR 是 flaky-triage.yml 的职责，两个作者会打架）；
#     `arm auto-merge` **≠ 放行** —— 台账 PR 仍要真的跑完 **required** 检查才可能合并
#     （「只标注不自动放行」的语义一字未动）；不新增 secret、不放宽任何门禁。
#   · **绝不静默降级**（本单的全部价值）：判据「无法判定」⇒ 步骤红（`exit 3`）；
#     有漂移却**没有 open PR** ⇒ `::error::` + `exit 1`；兜底发出后仍 0 check、已无待批准 run、
#     且分支 HEAD 已陈旧 ⇒ `::error::` + `exit 1`；main 有分支没有的条目（分叉）⇒ `::error::`。
#   · **两种病因必须是两条判据**（#5075 ①）：`mergeable_state=dirty`（分支**真冲突**）与
#     「check 被抑制」看起来都是「台账落不到 main」，但**病因不同、出路不同**：
#     冲突时 GitHub **不为冲突 PR 运行 `pull_request` workflow** ⇒ check 数**结构性恒为 0**，
#     approve / arm 这两条动作**结构上不可能生效**（实测 6 个失败 run 全部同形，只有分支 HEAD
#     陈旧时长单调递增 16 → 241 分钟）；混成同一条红时**真因读不出来**，运维只能反复重跑。
#     故：冲突 ⇒ 报出 `dirty` + **可行动出口（rebase 路径）**；被抑制 ⇒ 报出 0 check + 陈旧时长。
#   · **读数与动作必须自洽**（#5075 ④）：`enablePullRequestAutoMerge` 被 integration 权限拒绝时
#     **不再**被 `|| echo 非致命` 吞成「已 arm」—— 报出 arm 退出码 + **动作之后回读**的真实
#     `autoMerge`；不自洽（动作失败 ∧ 回读未 arm）⇒ 红；自洽（失败 ∧ 回读已 arm，已由别处 arm）
#     ⇒ 显式 `::warning::`（非致命但**不静默**）。
#   · **有意不做自动 rebase**：台账分支的写者只有 `flaky-triage.yml` 一个（见上「绝不削弱既有
#     护栏」）；兜底再加一个写者会与它打架 ⇒ 冲突走「报出 dirty + 给出 rebase 路径」的可行动
#     出口，由人 / 由 flaky-triage.yml 执行（台账语义是**只追加** ⇒ rebase 不丢条目）。
#     ⚠️ **根因（#5075 实测）**：台账 PR 走 **squash 合并** ⇒ 分支历史**永远不含** main 上那个
#     squash 提交 ⇒ 只追加的分支**每一轮都会再冲突**（实测：`#4881` 落仓后分支又 `diverged`
#     ahead 34 / behind 16、PR `DIRTY`、`check 数=0`、陈旧 448 分钟）。⇒ **一次性 rebase 只是
#     解阻，不是根治**：根治要由那个唯一写者**在追加前先 rebase**（本兜底不做，只在冲突时报出）。
# ─────────────────────────────────────────────────────────────────────────────

on:
  pull_request:
    types: [opened, reopened]
    branches: [main]
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  actions: write        # approve 被抑制的 run（与 flaky-triage.yml 同一权限面；**不新增 secret**）
  contents: write       # ⚠️ **临时对照实验**（#5235，读完即 revert）：验证 enablePullRequestAutoMerge
                        # 是否真的需要 contents: write（本仓 automerge.yml / flaky-triage.yml 有 write 且能 arm，
                        # 本文件 read 且恒失败）。**这不是要保留的改动** —— 它会红在 test_flaky_ledger_reconcile.py
                        # 的「contents 必须 read」判据上，那是判据在正常工作。
  pull-requests: write  # 读台账 PR / arm auto-merge（不 approve 评审、不改标签）

# 与 flaky-triage.yml 的 `flaky-triage-ledger` **不同组**：两者都只做幂等动作，不该互相排队/取消。
concurrency:
  group: flaky-ledger-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    name: Flaky Ledger Reconcile (台账领先 main ⇒ 补 approve + 补 arm)
    # fork PR 的 `pull_request` token 是只读 ⇒ 对账必然失败（假红）；定时档仍覆盖全部情况。
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LEDGER_BRANCH: chore/flaky-ledger
      # 「陈旧」阈值：台账已推上分支、却这么久还落不到 main ⇒ 兜底真没生效（不是异步窗口）。
      STALE_MINUTES: '15'
    steps:
      - name: Checkout（对账基线 = main；判据读 main 上的台账副本）
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: 台账自检（fail-closed：台账不合规就不参与对账）
        run: python3 .github/scripts/flaky_ledger.py selftest

      - name: 引导期检查（main 上还没有判据子命令 ⇒ 本轮显式跳过，**不是**通过）
        id: preflight
        run: |
          set -uo pipefail
          # 判据与动作都取 **main** 的 `.github/scripts/flaky_ledger.py`（对账语义要求判据与主路径同源），
          # 而本兜底是**随 PR 落地**的：PR 尚未合并时 main 上还没有 `ledger-drift`
          # ⇒ 本轮无法对账。该形态**必须长得像「没跑」**（下游步骤显式跳过 + `::warning::`），
          # 不许装成「已同步」（2026-09-20 实测：本 workflow 首次运行正落在这个窗口里）。
          # ⚠️ 「将来有人删掉 `ledger-drift`」这条风险由 **required** 的
          # `tests/unit_ci_workflows/test_flaky_ledger_reconcile.py` 钉住（删掉即红）——
          # 故这里的「跳过」不会变成一个长期静默的失效形态。
          if python3 .github/scripts/flaky_ledger.py ledger-drift --help >/dev/null 2>&1; then
            echo "ready=1" >> "$GITHUB_OUTPUT"
          else
            echo "ready=0" >> "$GITHUB_OUTPUT"
            echo "::warning::main 的 flaky_ledger.py 还没有 \`ledger-drift\` 子命令（引导期：本兜底随 PR 落地，main 尚未包含它）⇒ 本轮**跳过**（跳过 ≠ 通过）"
          fi

      - name: 对账判定（纯函数；**状态级** —— 台账分支是否领先 main）
        id: drift
        if: steps.preflight.outputs.ready == '1'
        run: |
          # ⚠️ `set -o pipefail` **必需**：本行接了 `tee`（写 job summary）。没有它时管道退出码
          #    取 `tee` 的 0 ⇒ 判据失败（含 `exit 3` 无法判定）被吞掉 ⇒ `drift` 输出为空
          #    ⇒ 所有 `if:` 全假 ⇒ **静默 no-op**（"兜底没生效"装成"没有漂移"）= 本单要治的形态。
          set -o pipefail
          python3 .github/scripts/flaky_ledger.py ledger-drift \
            --branch "$LEDGER_BRANCH" --gh-output "$GITHUB_OUTPUT" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 无漂移 ⇒ 零动作收工（幂等：不碰 PR、不 approve、不 push）
        if: steps.preflight.outputs.ready == '1' && steps.drift.outputs.drift != '1'
        run: echo "::notice::✅ 台账已与 main 同步（$LEDGER_BRANCH 不领先）—— 兜底零动作（#4825）"

      - name: 分叉告警（main 有分支没有的条目 ⇒ 台账「只追加」语义被破坏）
        if: steps.preflight.outputs.ready == '1' && steps.drift.outcome == 'success' && steps.drift.outputs.behind != '0'
        run: |
          echo "::error::台账分叉：main 上有 ${{ steps.drift.outputs.behind }} 条条目不在 $LEDGER_BRANCH 上 —— 台账语义是**只追加**（main 恒为分支的子集），正常不可能；查是否有人改写/回退过该分支"
          exit 1

      - name: 有漂移 ⇒ 补 approve（复用 #4804 的实现）+ 补 arm auto-merge
        if: steps.preflight.outputs.ready == '1' && steps.drift.outputs.drift == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          AHEAD="${{ steps.drift.outputs.ahead }}"
          AGE="${{ steps.drift.outputs.age_minutes }}"
          # ① 补 approve —— 与 flaky-triage.yml 步骤⑤ **同一实现**（同脚本同参数，不复制规则）。
          #    本 job 的工作区是 **main**（本 workflow 从不 checkout 台账分支）⇒ 跑的就是 main 的副本，
          #    故不会踩 flaky-triage.yml 步骤④ 那个「切树后跑到分支旧副本」的坑。
          python3 .github/scripts/flaky_ledger.py approve \
            --repo "$GITHUB_REPOSITORY" --head-branch "$LEDGER_BRANCH" \
            --json-out /tmp/pending.json || {
            echo "::error::兜底 approve 失败 ⇒ 台账 PR 仍无 check、main 不增长（fail-closed，不静默）"; exit 1; }
          PENDING=$(python3 -c "import json;print(len(json.load(open('/tmp/pending.json'))))") || {
            echo "::error::读不到 approve 结果 ⇒ 无法判定兜底是否生效（fail-closed，不静默）"; exit 1; }
          # ② 找台账 PR：**绝不新建**（建 PR 是 flaky-triage.yml 的职责 —— 两个作者会打架，
          #    且 title/body 规则只应有一处）。分支领先 main 却**没有 open PR** ⇒ 没有任何路径
          #    把它推上 main ⇒ 必须红（这正是「台账静默停在分支上」的确切形态）。
          PR=$(gh pr list --head "$LEDGER_BRANCH" --state open --json number \
                 --jq '.[0].number // empty' --repo "$GITHUB_REPOSITORY")
          if [ -z "$PR" ]; then
            echo "::error::台账分支领先 main（${AHEAD} 条未落仓）却**没有 open PR** ⇒ 无任何路径把它推上 main（台账停在分支上）。可行动：重跑 flaky-triage.yml（由它补建台账 PR）"
            exit 1
          fi
          # ③ 补 arm auto-merge（幂等）。**不是放行**：台账 PR 仍要真的跑完 required 检查才可能合并。
          #    ⚠️ 失败**不许**被吞成「已 arm」（#5075 ④）：退出码与**回读**的真实状态一起报出。
          ARM_RC=0
          ARM_OUT=$(gh pr merge "$PR" --auto --squash --repo "$GITHUB_REPOSITORY" 2>&1) || ARM_RC=$?
          if [ -n "$ARM_OUT" ]; then echo "$ARM_OUT"; fi
          # ④ 可见读数（写 job summary；**不是**门禁 —— 运行与合并都是异步的）。
          #    全部在**动作之后回读**：这样「读数」反映的是真实状态，不是「我以为 arm 了」。
          PR_STATE=$(gh pr view "$PR" --json state --jq '.state' --repo "$GITHUB_REPOSITORY" 2>/dev/null || echo UNKNOWN)
          MERGE_STATE=$(gh pr view "$PR" --json mergeStateStatus --jq '.mergeStateStatus' --repo "$GITHUB_REPOSITORY" 2>/dev/null || echo UNKNOWN)
          MERGEABLE=$(gh pr view "$PR" --json mergeable --jq '.mergeable' --repo "$GITHUB_REPOSITORY" 2>/dev/null || echo UNKNOWN)
          AUTO_MERGE=$(gh pr view "$PR" --json autoMergeRequest --jq 'if .autoMergeRequest then "armed" else "none" end' --repo "$GITHUB_REPOSITORY" 2>/dev/null || echo unknown)
          CHECKS=$(gh pr checks "$PR" --json name --jq 'length' --repo "$GITHUB_REPOSITORY" 2>/dev/null || echo 0)
          STATE="state=${PR_STATE} mergeStateStatus=${MERGE_STATE} mergeable=${MERGEABLE} autoMerge=${AUTO_MERGE}"
          {
            echo "### 📒 flaky 台账落仓对账（#4825 兜底）"
            echo ""
            echo "- 台账分支领先 main：**${AHEAD}** 条（分支 HEAD ${AGE:-?} 分钟前）"
            echo "- 台账 PR：#${PR} ${STATE}"
            echo "- 可见 check 数：${CHECKS}（0 = 仍被抑制 ⇒ 台账落不到 main）"
            echo "- 本轮 approve 的 run 数：${PENDING}"
            echo "- 补 arm 的退出码：${ARM_RC}（非 0 时**以回读的 autoMerge 为准** —— 读数与动作必须自洽）"
            echo ""
            echo "兜底只补 **approve + arm**（**不放行**：required 检查仍是唯一闸）；无漂移时本 job 零动作。"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::📒 台账对账：PR #$PR $STATE / check 数=$CHECKS / 本轮 approve=$PENDING / arm rc=$ARM_RC"
          # ⑤-A **分支真冲突** ⇒ 红（#5075 ①：与「check 被抑制」**分成两条判据**）。
          #      GitHub 对冲突 PR **不运行 `pull_request` workflow** ⇒ 冲突必然伴随 check=0；
          #      若与 0-check 混成同一条红，就永远读不出「真因是冲突」（实测 6 个失败 run 同形）。
          #      冲突是**可行动**的：报出 dirty + rebase 路径，而不是让兜底每 20 分钟空转一次。
          if [ "$MERGE_STATE" = "DIRTY" ] || [ "$MERGEABLE" = "CONFLICTING" ]; then
            echo "::error::台账 PR #$PR 与 main **真冲突**（mergeable_state=${MERGE_STATE} mergeable=${MERGEABLE}）⇒ GitHub 不为冲突 PR 运行 pull_request workflow ⇒ check 数**结构性恒为 0**，approve / arm 这两条动作**结构上不可能生效**（这才是真因，不是「异步窗口」也不是 token 被抑制）。**根因**：台账 PR 走 **squash 合并** ⇒ 分支历史**永远不含** main 上那个 squash 提交 ⇒ 只追加的台账分支**每一轮都会再冲突** —— 故一次性 rebase 只是解阻，根治要由**唯一写者**（flaky-triage.yml）在**追加前先 rebase**。可行动出口（本次解阻）：rebase 台账分支（台账语义是**只追加**、main 恒为分支的子集 ⇒ rebase 不丢条目）：git fetch origin main && git rebase origin/main && git push --force-with-lease origin HEAD:$LEDGER_BRANCH —— 或重跑 flaky-triage.yml 由它重建分支。（本兜底**不自动 rebase**：该分支的写者只有 flaky-triage.yml 一个，见文件头。）"
            exit 1
          fi
          # ⑤-B **arm 失败不得被吞成「已 arm」**（#5075 ④）：动作（rc）与读数（回读的 autoMerge）
          #      自洽才放行；不自洽（失败 ∧ 未 arm）⇒ 红。
          if [ "$ARM_RC" != "0" ] && [ "$AUTO_MERGE" != "armed" ]; then
            echo "::error::补 arm auto-merge 失败（rc=${ARM_RC}）且回读 autoMerge=${AUTO_MERGE} ⇒ 台账 PR **不会**被自动合并（读数与动作自洽：动作失败 + 状态未 arm）。输出：${ARM_OUT}"
            exit 1
          fi
          if [ "$ARM_RC" != "0" ]; then
            echo "::warning::补 arm 返回非零（rc=${ARM_RC}）但回读 autoMerge=armed（已由其它路径 arm）⇒ 非致命，且读数与动作自洽。输出：${ARM_OUT}"
          fi
          # ⑤-C **check 被抑制**（与冲突无关的另一种病因）⇒ 红（否则「台账停在分支上」又变回静默）。
          #    三个条件缺一不可：0 个 check ∧ 已无待批准 run ∧ 分支 HEAD 已陈旧 ——
          #    少了前两条就会在「approve 刚发出、check 还在产出」的异步窗口里**假红**。
          if [ "$CHECKS" = "0" ] && [ "$PENDING" = "0" ] && [ "${AGE:-0}" -ge "$STALE_MINUTES" ]; then
            echo "::error::兜底已发出但台账 PR 仍 **0 个 check**、已无待批准 run、且分支 HEAD 已 ${AGE} 分钟（≥${STALE_MINUTES}）⇒ 台账仍落不到 main（不再静默）"
            exit 1
          fi
