# 部署补偿对账（issue #3113 v3）：auto-merge 合并后的部署触发链路排查结论——
# 自 2026-09-05 启用原生 auto-merge 起（9/5 08:01Z 为最后一条 push 事件 run，
# verify-trigger closed 验证 08:41Z 后 0 run），push 与 pull_request closed 事件
# 不再触发任何 Actions workflow；schedule 随机节流（同 '*/20' 配置，close-linked-issues
# 09:59Z 触发而 deploy-frontend 06:36Z 后零触发）；仅 pull_request opened/synchronize、
# issues、issue_comment、workflow_dispatch 可靠。
#
# v3 触发源（可靠事件组合，任一路径都会对账）：
#   1. pull_request opened/reopened（新 PR 打开必触发——PR Check 依赖它，已被证明可靠；
#      仓库迭代不停，每次新 PR 都会对账一次 main HEAD，接近实时）
#   2. schedule '*/20'（随机兜底，不可靠但有比没有好）
#   3. workflow_dispatch（手动）
# 对账逻辑不变：checkout main（PR 事件时 GITHUB_SHA 是 PR head，必须切到 main 取 HEAD）
# → 三服务 sha-<main-head7> 镜像缺失 → gh workflow run dispatch 对应 deploy。
#
# 与原 deploy 工作流关系：本补偿是兜底；deploy-*.yml 的 push+paths 主触发（已失效）
# 与 schedule 对账保留不动。
name: Deploy Reconcile (PR 对账补偿)

on:
  pull_request:
    types: [opened, reopened]
    branches: [main]
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write  # 需要 GITHUB_TOKEN 触发 workflow_dispatch

jobs:
  reconcile:
    name: Reconcile and dispatch missing deploys
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACR_REGISTRY: crpi-qdcgkzwx9p9zckga.cn-hangzhou.personal.cr.aliyuncs.com
      ACR_NAMESPACE: ai-customer-service
    steps:
      # 对账基于 main HEAD（PR opened/reopened 事件的 GITHUB_SHA 是 PR head，需切 main）
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Docker login ACR
        run: echo "${{ secrets.ACR_PASSWORD }}" | docker login ${{ env.ACR_REGISTRY }} -u ${{ secrets.ACR_USERNAME }} --password-stdin

      # 三个服务：路径（仅用于日志提示）+ 镜像名
      # GH_TOKEN 必须显式注入：gh CLI 在 Actions 环境检测到 GITHUB_ACTIONS 时强制要求
      # 显式 GH_TOKEN（否则报 "To use GitHub CLI in a GitHub Actions workflow..." 并退出）
      - name: PR path filter (docs/tests/cases 不触发部署)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          PR_NUMBER="${{ github.event.pull_request.number }}"
          FILES=$(gh pr view "$PR_NUMBER" --json files --jq '.files[].path' 2>/dev/null || echo "")
          echo "📂 PR #$PR_NUMBER 改动文件:"
          echo "$FILES" | head -30
          CODE_PATHS=("backend/admin-api" "backend/ai-agent-service" "frontend" "apps" "packages")
          CODE_CHANGED=0
          for f in $FILES; do
            for cp in "${CODE_PATHS[@]}"; do
              if [[ "$f" == "$cp/"* ]]; then
                CODE_CHANGED=1
                break
              fi
            done
          done
          if [ "$CODE_CHANGED" -eq 0 ]; then
            echo "✅ 纯文档/测试/case 改动——跳过部署对账（防 502 窗口，Round 60 根治）"
            # 写 marker 供下一步跳过
            echo "SKIP_RECONCILE=1" >> "$GITHUB_ENV"
          else
            echo "✅ 含代码改动，继续对账"
            echo "SKIP_RECONCILE=0" >> "$GITHUB_ENV"
          fi

      - name: Schedule code-change check (schedule/dispatch 兜底也做 path 过滤)
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          # 检查 main HEAD 最近 10 个提交是否含代码路径改动——纯 docs/tests/cases
          # 提交不触发部署（防 502 窗口，Round 64 补全 schedule 兜底）
          CODE_CHANGED=0
          if git log --oneline -10 --name-only origin/main 2>/dev/null | grep -qE "^(backend/admin-api|backend/ai-agent-service|frontend|apps|packages)/"; then
            CODE_CHANGED=1
          fi
          echo "🔍 schedule 检查：最近提交含代码改动=$CODE_CHANGED"
          if [ "$CODE_CHANGED" -eq 0 ]; then
            echo "✅ 最近提交无代码改动——跳过部署对账（防 502 窗口）"
            echo "SKIP_RECONCILE=1" >> "$GITHUB_ENV"
          fi

      - name: Reconcile deploys
        if: env.SKIP_RECONCILE != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          HEAD7="${GITHUB_SHA::7}"
          MISSING=0
          # 镜像名 → deploy workflow 文件名（镜像名与 workflow 名不对应，如 admin-web → deploy-frontend）
          declare -A SVC_WF=( [admin-api]=admin-api [ai-agent-service]=ai-agent-service [admin-web]=frontend )
          for svc in admin-api ai-agent-service admin-web; do
            IMAGE="${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${svc}:sha-${HEAD7}"
            if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
              echo "✅ ${svc} 镜像 ${IMAGE} 已存在——HEAD ${HEAD7} 已构建，跳过"
            else
              echo "⚠️ ${svc} 镜像 ${IMAGE} 缺失——该 commit 的部署触发被吞（快速合并/schedule 未跑），dispatch 补部署"
              gh workflow run "deploy-${SVC_WF[$svc]}.yml" --ref main --repo "$GITHUB_REPOSITORY"
              MISSING=$((MISSING + 1))
            fi
          done
          if [ "$MISSING" -gt 0 ]; then
            echo "🎯 补部署 dispatch 完成：${MISSING} 个服务（对应 deploy-*.yml 将构建并部署 sha-${HEAD7}）"
          else
            echo "✅ 全部服务镜像已存在，无补部署"
          fi
