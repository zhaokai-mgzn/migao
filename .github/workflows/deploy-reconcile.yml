# 部署补偿对账（issue #3113 v2）：GitHub Actions schedule 触发不可靠 + push 事件
# 自 2026-09-05 启用 native auto-merge 后对 main 的合并全面失效（9/5 08:01Z 之后
# 0 个 push 事件 run——9/9 当天 24 次合并 0 次 push run 实证），push+paths 主触发已死。
#
# 本工作流改用「PR merged」事件做对账触发源（pull_request 事件一直可靠——
# auto-merge 关闭 PR 时必触发）：
#   - on: pull_request types:[closed]，if merged && base==main
#   - 对账基于合并后的 main HEAD：检查 admin-api/ai-agent-service/admin-web 三服务
#     sha-<head7> 镜像是否在 ACR 存在
#   - 缺失 → gh workflow run dispatch 对应 deploy-*.yml（workflow_dispatch 100% 触发）
#   - 已存在 → 跳过（零浪费；中间 commit 漏部署不影响——最终 HEAD 已部署即达成目标）
#
# 与原 deploy 工作流关系：本补偿是兜底；deploy-*.yml 的 push+paths 主触发（已失效）
# 与 schedule 对账保留不动（schedule 虽不可靠但有比没有好）。
name: Deploy Reconcile (PR merged 对账补偿)

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read
  actions: write  # 需要 GITHUB_TOKEN 触发 workflow_dispatch

jobs:
  reconcile:
    name: Reconcile and dispatch missing deploys
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACR_REGISTRY: crpi-qdcgkzwx9p9zckga.cn-hangzhou.personal.cr.aliyuncs.com
      ACR_NAMESPACE: ai-customer-service
    steps:
      # merged PR 的 GITHUB_SHA = 合并后 main HEAD，直接用于对账
      - uses: actions/checkout@v7

      - name: Docker login ACR
        run: echo "${{ secrets.ACR_PASSWORD }}" | docker login ${{ env.ACR_REGISTRY }} -u ${{ secrets.ACR_USERNAME }} --password-stdin

      # 三个服务：路径（仅用于日志提示）+ 镜像名
      - name: Reconcile deploys
        shell: bash
        run: |
          set -euo pipefail
          HEAD7="${GITHUB_SHA::7}"
          MISSING=0
          # 镜像名 → deploy workflow 文件名（镜像名与 workflow 名不对应，如 admin-web → deploy-frontend）
          declare -A SVC_WF=( [admin-api]=deploy-admin-api [ai-agent-service]=deploy-ai-agent-service [admin-web]=deploy-frontend )
          for svc in admin-api ai-agent-service admin-web; do
            IMAGE="${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${svc}:sha-${HEAD7}"
            if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
              echo "✅ ${svc} 镜像 ${IMAGE} 已存在——HEAD ${HEAD7} 已构建，跳过"
            else
              echo "⚠️ ${svc} 镜像 ${IMAGE} 缺失——该 commit 的部署触发被吞（快速合并/schedule 未跑），dispatch 补部署"
              gh workflow run "deploy-${SVC_WF[$svc]}.yml" --ref main --repo "$GITHUB_REPOSITORY"
              MISSING=$((MISSING + 1))
            fi
          done
          if [ "$MISSING" -gt 0 ]; then
            echo "🎯 补部署 dispatch 完成：${MISSING} 个服务（对应 deploy-*.yml 将构建并部署 sha-${HEAD7}）"
          else
            echo "✅ 全部服务镜像已存在，无补部署"
          fi
