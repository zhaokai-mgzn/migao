# 部署补偿对账（issue #3113 v3 / #2947 / #4767 / #4827）
#
# 触发源（可靠事件组合，任一路径都会对账）：
#   1. pull_request opened/reopened（新 PR 打开必触发——PR Check 依赖它，已被证明可靠）
#   2. schedule '*/20'（随机兜底，不可靠但有比没有好）
#   3. workflow_dispatch（手动）
# 对账逻辑：checkout main（PR 事件时 GITHUB_SHA 是 PR head，必须切到 main 取 HEAD）
# → 逐服务判定「main HEAD 的代码状态是否已部署」→ 未部署则 gh workflow run dispatch 对应 deploy。
# 实测提醒（2026-09-20）：近 15 次 deploy-*.yml run **全是 workflow_dispatch**（零 push、零
# schedule）⇒ 部署腿的主触发实际已失效，本对账是唯一兜底。
#
# ── v5（issue #4827：「兜底静默失效」根治）─────────────────────────────────────
# 事故：run 35497126164（2026-09-20 07:32:04，`workflow_dispatch`，main HEAD 593504de9）
# 报 **success 且零 dispatch**，而 3 个提交之前、5 分钟前的 634b53f90（fix(api) #4641）
# 的镜像一个都没构建（部署触发被吞）。
# **真因不是「HEAD 恰好是 docs 提交」，而是结构性永远跳过**：旧 step
# `Schedule code-change check` 的判据是
#   `if git log --oneline -10 --name-only origin/main | grep -qE "…"; then CODE_CHANGED=1; fi`
# 而 GitHub 的 `shell: bash` 是 `bash --noprofile --norc -e -o pipefail`（该 step 另有
# `set -euo pipefail`）⇒ `grep -q` 首个命中即退出并关闭管道 ⇒ `git log` 死于
# **SIGPIPE(141)** ⇒ **pipefail 把整条管道的状态取为 141** ⇒ `if` 取**假**分支 ⇒
# 「最近提交含代码改动」**恒为 0** ⇒ 写下那个跳过标记 ⇒ `Reconcile deploys` 被
# `if: env.SKIP 那个标记 != '1'` **整步跳过** ⇒ 每次 schedule/dispatch 对账都是
# success + 零动作（本地逐字复现：40/40 全 0）。
# 修法（**不再有任何「短路」概念**）：
#   ① **删掉两条 path 预过滤**（PR 文件表过滤 + 上面的 git-log 过滤）。PR 自己的文件表
#      与 main HEAD 的部署状态本就无关；而它们正是静默失效的载体。
#      `Reconcile deploys` 不再带 `if:` ⇒ 结构上不存在「跳过对账」这条路。
#   ② 判定基准回到 **main HEAD**（`sha-<head7>`）：dispatch 出去后 deploy 构建的 tag 就是
#      `sha-${GITHUB_SHA::7}` = main HEAD（见各 deploy workflow 的 `Resolve image tag`）
#      ⇒ 能让「按镜像判缺失」**收敛**的基准只有 main HEAD。若改用「最后一个改代码的
#      commit」，那个 tag 永远建不出来 ⇒ 每个后续 docs 提交都会重复 dispatch
#      （3 服务全量重建重部署 = #3235 的 502 窗口 + #4767 ③ 的覆盖回滚风险）。
#   ③ 「有没有东西要部署」改用**漂移判据**（这才是 #3235 防 502 窗口的本意；原文案
#      「最近 10 个提交」只是它的粗糙近似）：自该服务**上次成功部署的 commit** 起，
#      该服务的代码路径（真值源 = 各 deploy workflow 的 `on.push.paths`）有无改动。
#      无改动 ⇒ HEAD 的代码状态与线上已部署的一致 ⇒ 不补 ⇒ docs/ci/case 提交不会空转。
#   ④ 每个分支的**判定依据**都 echo + 落 `$GITHUB_STEP_SUMMARY`，末尾给结论行 +
#      `::notice::`/`::warning::` ⇒ 不再出现「success 但看不出它为什么没动」。
# 断路器（issue #4767 ③；**判定形态由 #5814 B 扩充**）：同一 `headSha == main HEAD` 的**最新一条**
# run，只有结论落在**允许名单**（`success` / `skipped` / `neutral` / 空）才继续补部署；
# **其余一切结论**（`failure` / `cancelled` / `timed_out` / `startup_failure` / `action_required` /
# `stale` / GitHub 将来新增的任何一种）**一律跳闸**。**另**：同 sha 的 run **还没跑完**
# （`status != completed`）⇒ 也跳过（重复 dispatch 是纯 churn）。
# 🔴 **为什么从「只认 failure」改成允许名单（#5814 的实测）**：被 `timeout-minutes: 45` 打死的
# run 报的是 **cancelled**（**不是** failure）⇒ 旧断路器不跳闸 ⇒ 本对账每 20min 对同一个挂死的
# commit 再补一次 ⇒ 又一个 run 挂 40min ⇒ **无限循环**（三条部署腿各自的 `on.schedule` 也在
# 独立重试同一个 commit）。黑名单形态（把 `cancelled` 加进去）在 GitHub 新增一种结论时会
# **静默退回 fail-open** = 本 bug 原样复发；允许名单让新结论**默认跳闸**（fail-closed）。
# **fail-open 保留**（#4767 的承重语义，一字未动）：查询失败 / 无同 sha 记录 ⇒ 不在任何跳闸
# 分支里 ⇒ **照旧补部署** —— 本检查自己出错绝不停掉对账。
# 人工出口：跳闸时**显式**打印 `gh workflow run <wf> --ref main`（stdout + `$GITHUB_STEP_SUMMARY`）。
# 已知 residual（如实登记，不粉饰）：若 C 的部署**已 failure**、其后又有 docs 提交 H，
# 断路器按 `headSha == H` 查不到记录 ⇒ 会把含 C 的 HEAD 再部署一次。
# ⚠️ 本单（#5814）**不扩**这一条：「回滚点被覆盖」的风险另由 #4808 治。
#
# ── v6（issue #5929：「合并了但没上线」没有值守面）───────────────────────────────
# 病（现取读数，不是推断）：本对账判出「没部署」之后只做两件事 —— ① 补一次 dispatch
# ② 在 step summary 里写一行 ⇒ **没有人会被叫醒**。实测 2026-10-01：
# `deploy-frontend.yml` 的 push 触发在 10:18 之后再没跑过，22:41 线上仍停在 `bef78e7`，
# 而 main HEAD 已是 `1fbdfb0`（中间 `871db0c7f` 改了 `frontend/admin-web/**` 却没上线）
# —— 全仓只有本腿的 `::notice::` 说了一句。
# 🔴 **有意不照字面判据实现**（issue 正文写作「`sha-<head7>` 镜像仍不存在 ⇒ 判红」）：
#    `#5814` 的 C′ 把构建搬到**服务器侧** ⇒ CI **不再推 ACR**（见 `deploy-frontend.yml` 的
#    `Assert server-side build (no ACR push)` 步 + `deploy/scripts/swas-deploy-ci.sh` 的服务器侧
#    `docker build`）⇒ 那条判据**恒为真**，照字面实现就是**每个 tick 都报警**
#    （噪声判据是缺陷 —— 正是 issue 验收判据 2 要防的）。
# ⇒ 「已部署」取**三条信号**（与三条部署腿自己的 C′ 判据**同一份**，判定本体只在对账步里）：
#    ① 镜像存在（保留：将来若恢复推 ACR 自动复活）② 同 sha 的部署 run 结论 = success
#    ③ 自上次成功部署起该服务代码路径无改动（漂移判据 = 该 commit 的代码状态已在线上）。
# ⇒ 判定 = **距 main HEAD 合入超过 N 秒**，且该腿在**本轮对账开始时**既没有上述「已部署」信号、
#    也没有**在途 run**（queued / in_progress）⇒ 判红（`::error::` + 非零退出 + step summary）
#    **并自己开/更 P1 值班 issue**；部署成功后同一逻辑**自动关闭**它（清零不靠人记得）。
#    ⚠️ 「本轮才补 dispatch」也**计入**告警面：它是「对账开始时确实没上线」的读数 ——
#    正常节奏下够不着（合并后 ≤20min 就有一次对账，而 N=45min），够得着就说明补出去的
#    部署一直没落地（#4827 的同族形态）。
#    ⚠️ 判不了（状态文件缺失 / 目标 workflow 不在 main 上）⇒ **fail-closed 判红**（退出码 3）。
# N 的出处（可复算，读数**现取**自 `deploy/scripts/swas-deploy-ci.sh` 的那句预算）：
#    冷构建上界 **2400s** + 余量 **300s** = **2700s**（45min）。
#    原文（该脚本里那句「默认抬到 4500s（= 远端锁等待上限 1800s + 冷构建上界 2400s + 余量 300s）」）
#    的**远端锁等待上限 1800s 有意不计入**：那一项是「排队等另一条部署腿的远端 flock」，
#    而排队中的 run 由对账步的 `inflight` 判据覆盖（在途 ⇒ 不报警）⇒ 把它加进 N 只会让
#    「合并了但没上线」被推迟 30min 才被人看见。
#    判据会**现取这两个读数**并断言 `N ≥ 2400 + 300`（改小 N / 删掉读数锚 ⇒ 红）。
# ⚠️ **不新增 schedule**（铁律 10）：沿用既有 `*/20` 对账与既有事件（值守面与对账同一个 job）；
#    `pull_request` 事件不判定（PR 面没有 main HEAD 的部署对象，main 侧有 schedule 兜）。
# ⚠️ 本腿**不翻 required**（§2.2 的两条前置）：报告型 + 判红开值班单，不拦任何 PR。
#
# 与原 deploy 工作流关系：本补偿是兜底；deploy-*.yml 的 push+paths 主触发（已失效）
# 与 schedule 对账保留不动。
name: Deploy Reconcile (PR 对账补偿)

on:
  pull_request:
    types: [opened, reopened]
    branches: [main]
  schedule:
    - cron: '*/20 * * * *'
  # 判据 4（issue #5935）：**部署成功这个事件本身**要能触发清零/对账 —— 实测 19:00Z 之后 ~12h
  # 没有任何 reconcile run（GitHub 把 `*/20` 节流）⇒ 靠「下一轮 tick」关单在实测里没成立。
  # ⚠️ 用途**限定**为「部署完成事件驱动的对账/清零」，**不是**检测加速；判据 1 的既有断路器与
  # 「同 sha 有在途 run 就不重复派」一字未动（防自激：判据 test_deploy_watchdog.py 的执行式对照）。
  # ⚠️ 新增触发面经用户 2026-10-02 逐字裁定允许（改写 MC-055 里「不做 ②」的登记，同 PR）。
  # ⚠️ `workflows:` 要写各腿 workflow 的 **`name:`**（不是文件名）—— 写文件名/拼错 ⇒ 该兜底面
  # **静默脱钩**（本 workflow 永不触发），而本地一切守卫都不会因此变红（既有守卫
  # `test_publish_leg_fallback_surface.py` 会具名报出，本 PR 已按它改正）。
  workflow_run:
    workflows: ["Build and Deploy admin-api", "Build and Deploy ai-agent-service",
                "Build and Deploy frontend (admin-web)", "Publish worker-h5 (app.migaozn.com/w/)",
                "Publish bmini h5 (app.migaozn.com/b/)", "Publish C-end H5 (app.migaozn.com 根)"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write  # 需要 GITHUB_TOKEN 触发 workflow_dispatch
  # 值守面出口（issue #5929）：判红时开/更 P1 值班 issue、部署成功后**自动关闭**它。
  # 显式声明而不是靠推断（缺它 = 钩子自己崩溃、红而不留痕，issue #3834 的教训）。
  issues: write

jobs:
  reconcile:
    name: Reconcile and dispatch missing deploys
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # ── dependabot 触发 ⇒ **显式跳过**（issue #5077）──────────────────────────
    # dependabot 触发的 workflow **拿不到仓库 secrets**（GitHub 对 bot 触发的
    # `pull_request` 事件不下发 secrets）⇒ 下面 `Docker login ACR` 必报
    #   `Error: Cannot perform an interactive login from a non TTY device`
    # ⇒ 本 job 在 **6 个 dependabot PR** 上恒红。它**不是 required**（不拦合并），
    # 但视觉上与真红无异 ⇒ 恰好掩埋了真正被破坏的升级（#5077 的 16 条积压）。
    # 缺 secrets 时本 job **什么也做不了**（镜像判定 + dispatch 都依赖 ACR 凭据）
    # ⇒ 跳过是唯一正确处置；**且必须是显式的**：本注释即跳过理由，check 列表里
    # 该 job 显示为 `skipped`（不是 `fail`），不再出现「必然失败的必红项」。
    # 处置路径：依赖 PR 的最终判定走**其它 required 检查**（它们不依赖 secrets）；
    # 合并后 main 上的 push/schedule 触发会照常对账（下面那条 `||` 保证）。
    # ⚠️ 只按 actor 判定，**不加任何 secrets 引用**（Danger Scan 会 BLOCK 新增引用）。
    if: github.event_name != 'pull_request' || github.actor != 'dependabot[bot]'
    env:
      ACR_REGISTRY: crpi-qdcgkzwx9p9zckga.cn-hangzhou.personal.cr.aliyuncs.com
      ACR_NAMESPACE: ai-customer-service
    steps:
      # 对账基于 main HEAD（PR opened/reopened 事件的 GITHUB_SHA 是 PR head，需切 main）
      # ⚠️ `fetch-depth: 0` **必须**（issue #4827）：漂移判据要问「自上次成功部署起该服务
      # 代码有无改动」= `git log <P>..HEAD -- <paths>`；depth=1 浅克隆里 P 不可达 ⇒ git 报错
      # ⇒ 判据退化成「每次都判有改动」⇒ 每个 docs 提交都空转 dispatch。
      # 代价：拉全历史（本仓 pack ≈226MiB，实测约 +30s）。**不要**把它改回 1 —— 改了等于
      # 把这个坑原样复现（唯一替代是改用 GitHub compare API，但那有 300 文件截断的假阴性面）。
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Docker login ACR
        run: echo "${{ secrets.ACR_PASSWORD }}" | docker login ${{ env.ACR_REGISTRY }} -u ${{ secrets.ACR_USERNAME }} --password-stdin

      # ⚠️ 本 step **没有** `if:`，也不再有任何 path 预过滤（issue #4827）：改前它带
      # `if: env.<跳过标记> != '1'`，而那个标记由两个 path 过滤写入（PR 文件表 /
      # `git log | grep -q` 的 SIGPIPE 陷阱）⇒ docs/ci 提交的 HEAD 会把**整个对账**跳过
      # （含「更早的代码提交镜像缺失」）⇒ run 报 success 但零 dispatch。
      # ⚠️ 本 step 内**禁止**「`git … | grep -q` 当 `if` 条件」这类写法：本 workflow 的 shell
      # 带 `-o pipefail`，而 `grep -q` 早退会把生产者的 SIGPIPE(141) 变成整条管道的退出码
      # ⇒ `if` 恒取假分支（这就是 #4827 的真根因；`tests/unit_ci_workflows/` 有持久守卫）。
      # ⚠️ 也**不要**用 bash4 关联数组（`declare -A`）：macOS 自带 bash 3.2 跑不起来 ⇒
      # 执行式守护测试会退化成 CI-only。故逐服务参数走**函数参数**。
      - name: Reconcile deploys
        env:
          GH_TOKEN: ${{ github.token }}   # gh CLI 在 Actions 环境强制要求显式 GH_TOKEN
        shell: bash
        run: |
          set -euo pipefail
          # 对账基准 = **checkout 出来的 main HEAD**（issue #4767）：
          # `GITHUB_SHA` 在 `pull_request` 事件下是 PR 的 **merge commit**（**不是** main HEAD）⇒
          # 拿它算 `sha-<7>` 时镜像**永远不存在** ⇒ 每个 PR opened 都重新 dispatch 三条部署 ——
          # 这正是事故里「对账补偿反复重新触发部署 ⇒ 覆盖手工回滚（实测 2 次）」的机制。
          # checkout 步骤已经是 `ref: main` ⇒ 直接取 HEAD。
          HEAD_SHA=$(git rev-parse HEAD)
          HEAD7="${HEAD_SHA::7}"
          SUMMARY="${GITHUB_STEP_SUMMARY:-/dev/null}"
          MISSING=0; NODRIFT=0; SKIPPED=0; UNKNOWN=0; NOTARGET=0
          # 值守面状态机（种子 + 恰好一行/腿）**外置**（issue #5935）：本步正文已顶到 13.3K 的硬约束
          # （>13,250 ⇒ 整份 workflow invalid ⇒ 该腿完全不跑，阈值/守卫 = test_deploy_watchdog.py 的
          # `RUN_BODY_LIMIT`）⇒ 出口是外置，不是「再加一点点应该没事」。
          source scripts/deploy_reconcile_state.sh
          # 单服务对账。$1=服务名 $2=deploy workflow $3=该服务的代码路径
          # $4=额外 pathspec（空格分隔）：`:(exclude)X` = 排除项，其余 = **附加包含项**（可空）
          reconcile_one() {
            local svc="$1" wf="$2" svc_path="$3" extra="$4"
            local image="${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${svc}:sha-${HEAD7}"
            local runs last_conclusion last_status p drift reason
            local -a pathspec
            # ── 判据 ③（前置，最先判）：目标 workflow 必须**已在 default branch 上** ──
            # 为什么需要（**实测**，issue #5668 的 PR 首轮）：**新增一条腿的那个 PR 里**，被对账的
            # workflow 还没合并到 main ⇒ `gh workflow run <wf> --ref main` 返回
            # 「HTTP 404: workflow … not found on the default branch」⇒ `set -euo pipefail` 下
            # **整个对账 step 非零退出**，把同轮其它四条腿的结果一起染红（而它们本来是对的）。
            # 这不是「要补的部署」，而是「还轮不到它」⇒ 显式 warn + 落 summary + **不** dispatch
            # （fail-open 的另一面：本检查自己出错绝不停掉对账，也绝不 dispatch 一个 main 上不存在的 workflow）。
            # 判据本体 = `on_main`（`scripts/deploy_reconcile_state.sh`；**三态**：0 在 / 1 不在 / 3 取不到 HEAD；
            # ⚠️ 判别 `$?` 要用 `_g=$?` 先存下来 —— `$?` 在 `||` 的右侧会被前面的命令吃掉）。
            # ⚠️ 改前它是 `gh workflow view "$wf" --ref main` —— **100% 失败** ⇒ 六条腿全被误记成「不在 main 上」
            # （issue #5935 的现场根因、run 36911070357；完整经过见那个脚本的函数注释）。
            on_main "$wf" || { _g=$?; if [ "$_g" = 1 ]; then NOTARGET=$((NOTARGET + 1)); on_main_absent "$svc" "$wf"; fi; return 0; }
            # 取「同 sha 的最新一条 run」——B 的两条判据都用它；`[0]` = 最新（`gh run list` 倒序）。
            # **fail-open**：查询失败 / 无记录 ⇒ 两变量为空 ⇒ 不落进任何跳闸分支 ⇒ 照旧补部署。
            runs=$(gh run list --workflow "$wf" --branch main --limit 30 \
                     --json headSha,conclusion,status 2>/dev/null || echo "[]")
            last_pair=$(printf '%s' "$runs" | jq -r --arg s "$HEAD_SHA" \
                     '[.[] | select(.headSha == $s)][0] | "\(.conclusion // "")|\(.status // "")"' 2>/dev/null || echo "")
            last_conclusion="${last_pair%%|*}"
            last_status="${last_pair##*|}"
            # ── 同 commit 的 run 还没跑完 ⇒ 跳过（纯 churn，issue #5814 B）──────────────
            # 重复 dispatch 只会排在 concurrency 组里白等（`cancel-in-progress: false`）⇒
            # 它是**纯 churn**：事故里 job 排队 30~42min（正常 0.1min）。
            # `status != completed` 覆盖 queued / in_progress / waiting / requested / pending。
            # 取 `[0]`（= 列表中**最新**的一条，`gh run list` 是倒序）而不是第一条匹配 —— 否则
            # 一个**还在跑**的新 run 会被一条更老的终态记录遮住，本判据就永远不生效。
            if [ -n "$last_status" ] && [ "$last_status" != "completed" ]; then
              echo "⏸️ ${svc}：${HEAD7} 已有同 commit 的 run 在跑/排队（status=${last_status}）——本轮不补部署。"
              echo "   理由：重复 dispatch 是纯 churn（`concurrency: cancel-in-progress: false` 会让它白等），"
              echo "   且会与本腿的 cron 互相放大（issue #5814）。等那个 run 出终态后下一轮会自然复核。"
              echo "| ${svc} | ⏸️ 同 commit 的 run 仍在跑/排队（\`status=${last_status}\`） | **不补部署**（避免重复 dispatch churn） |" >> "$SUMMARY"
              watchdog_note "$svc" inflight "同 commit 的 run 未跑完（status=${last_status}）"
              SKIPPED=$((SKIPPED + 1))
              return 0
            fi
            # ── 断路器（issue #4767 ③，本单按 #5814 B 把判定扩成「允许名单」）──────────────
            # 这个 commit 的部署只要落进了**不可恢复的终态**，就不再自动补部署。
            # 反复重试同一个坏 commit 不仅无用，还会把「已回滚到上一个可用镜像」的环境**再打挂一次**。
            # 🔴 **为什么是允许名单（而不是把 cancelled 加进黑名单）**：事故里被
            # `timeout-minutes: 45` 打死报的是 **cancelled**（不是 failure）⇒ 只认 failure 的
            # 旧断路器不跳闸 ⇒ 本对账每 20min 再补一次 ⇒ 又一个 run 挂 40min ⇒ **无限循环**
            # （三条腿各自的 cron 也在独立重试同一个挂死的 commit）。黑名单形态在 GitHub
            # **将来新增一种结论**时会**静默退回 fail-open** = 本 bug 原样复发；允许名单让
            # 新结论**默认跳闸**（fail-closed）。
            # **保留 fail-open**：查询失败（`runs=[]`）/ 无同 sha 记录（`last_conclusion` 为空）
            # ⇒ 不在任何跳闸分支里 ⇒ 照旧补部署 —— 本检查自己出错**绝不**停掉对账。
            is_recoverable="true"
            if [ -n "$last_conclusion" ]; then
              case "$last_conclusion" in
                success | skipped | neutral) is_recoverable="true" ;;
                *) is_recoverable="false" ;;
              esac
            fi
            if [ "$is_recoverable" != "true" ]; then
              echo "⛔ ${svc}：main HEAD ${HEAD7} 的部署落在**不可恢复的终态**（conclusion=${last_conclusion}）——跳过自动补部署。"
              echo "   理由：自动重试同一个坏 commit 会覆盖手工回滚（issue #4767 ③），并让本对账与"
              echo "   部署腿自己的 cron 互相放大成无限循环（issue #5814：超时打死报的是 cancelled，"
              echo "   旧断路器只认 failure ⇒ 每 20min 再补一次 ⇒ 又一个 run 挂 40min）。"
              echo "   人工确认（看该 run 的日志）后复跑：gh workflow run ${wf} --ref main"
              echo "| ${svc} | ⛔ 断路器：\`${HEAD7}\` 的部署落在不可恢复终态（\`conclusion=${last_conclusion}\`） | **不补部署**（人工确认后 \`gh workflow run ${wf} --ref main\`） |" >> "$SUMMARY"
              watchdog_note "$svc" terminal "部署落在不可恢复终态（conclusion=${last_conclusion}）"
              SKIPPED=$((SKIPPED + 1))
              return 0
            fi
            # ── 判据 ①：HEAD 的镜像已存在 ⇒ HEAD 这个 commit 已构建过（无漂移）
            # ⚠️ **C′（issue #5814）下本判据对 ACR 恒不成立**（CI 改为服务器侧构建 ⇒ **不推 ACR**）
            #    ⇒ 它成了**死判据**。**有效的漂移判据是下面的判据 ②**（「自上次成功部署起该服务的
            #    代码路径有无改动」—— 它对 C′ 同样成立、且不依赖 ACR）。
            #    ⇒ 本判据**保留不删**（将来若因转 private 恢复推 ACR，它会自动复活），
            #      行为**一字不动**，只把 summary 说准（免读者以为「① 不成立 ⇒ 一定有漂移」）。
            if docker manifest inspect "$image" >/dev/null 2>&1; then
              echo "✅ ${svc} 镜像 ${image} 已存在——main HEAD ${HEAD7} 已构建，无漂移"
              echo "| ${svc} | ✅ 镜像已存在：\`${image}\` | **不补部署** |" >> "$SUMMARY"
              watchdog_note "$svc" deployed "镜像已存在：${image}"
              NODRIFT=$((NODRIFT + 1))
              return 0
            fi
            # ── 判据 ②（issue #4827，承接 #3235 防 502 窗口的本意）：自**上次成功部署**的
            # commit 起，该服务的代码路径有无改动；无改动 ⇒ HEAD 的代码状态与线上已部署的
            # 一致 ⇒ 不补。取不到基准 / git 判不了 ⇒ **fail-open**（按兜底补部署 + warning）。
            p=$(printf '%s' "$runs" | jq -r '[.[] | select(.conclusion == "success")][0].headSha // ""' 2>/dev/null || echo "")
            drift="?no-baseline"
            if [ -n "$p" ]; then
              pathspec=( "$svc_path" )
              if [ -n "$extra" ]; then pathspec+=( "$extra" ); fi
              drift=$(git log --oneline -1 "${p}..HEAD" -- "${pathspec[@]}" 2>/dev/null) || drift="?git-failed"
            fi
            if [ -n "$p" ] && [ -z "$drift" ]; then
              echo "✅ ${svc}：自上次成功部署 ${p:0:7} 起 ${svc_path} 无代码改动 ⇒ 无漂移（HEAD 的代码已在线上）"
              # （issue #5814 C′）判据 ① 在 C′ 下恒不成立（不推 ACR）⇒ 本条判据 ② 才是有效判据，
              # 故在 summary 里点明，免读者把「① 不成立」误读成「一定有漂移」（改措辞、不动行为）。
              # ⚠️ 表格的「判定依据」列**逐字保持原样**（`无漂移：自` 是既有判据的锚点，
              #    见 tests/unit_ci_workflows/test_reconcile_no_silent_skip.py 的 `summary.count("无漂移：自")`）；
              #    C′ 的说明只加在**「动作」列**里 ⇒ 既有判据一字不动，summary 仍自解释。
              echo "| ${svc} | ✅ 无漂移：自 \`${p:0:7}\`（上次成功部署）起 \`${svc_path}\` 无代码改动 | **不补部署**（issue #5814 C′：判据 ① 对 ACR 恒不成立，判据 ② 为有效判据） |" >> "$SUMMARY"
              NODRIFT=$((NODRIFT + 1))
              watchdog_note "$svc" deployed "无漂移：自 ${p:0:7}（上次成功部署）起 ${svc_path} 无代码改动"
              return 0
            fi
            # ── 兜底 dispatch：HEAD 无镜像，且自基准起该服务有代码改动（或判据不可用）
            if [ "$drift" = "?no-baseline" ]; then
              reason="取不到该服务的成功部署记录（fail-open：按兜底处理）"
              UNKNOWN=$((UNKNOWN + 1))
              echo "::warning::${svc}：${reason}"
            elif [ "$drift" = "?git-failed" ]; then
              reason="git 无法判定 ${p:0:7}..${HEAD7} 的改动（fail-open：按兜底处理）"
              UNKNOWN=$((UNKNOWN + 1))
              echo "::warning::${svc}：${reason}"
            else
              reason="自 ${p:0:7}（上次成功部署）起 ${svc_path} 有代码改动（${drift%% *}）"
              # 判定所用的 pathspec **逐项点名**（#5001 同族：读数与事实必须一致）：加了附加包含项
              # 之后 `$svc_path` 只是**其中一个**来源 ⇒ 只看它会把「只改了 deploy/swas/nginx.conf」
              # 误读成「服务代码改了」，排查方向当场跑偏。
              reason="${reason} · 判定 pathspec：${pathspec[*]}"
            fi
            echo "⚠️ ${svc} 镜像 ${image} 缺失且 HEAD 的代码状态未部署——${reason} ⇒ dispatch 补部署"
            gh workflow run "$wf" --ref main --repo "$GITHUB_REPOSITORY"
            echo "| ${svc} | ⚠️ 镜像缺失 + ${reason} | **已 dispatch 补部署**（\`${wf}\`） |" >> "$SUMMARY"
            watchdog_note "$svc" dispatched "本轮才补 dispatch（对账开始时该 commit 尚无可用部署）"
            MISSING=$((MISSING + 1))
            return 0
          }

          # 逐服务（代码路径 = 各自 workflow 的 `on.push.paths` 真值源；有动态对齐守卫）
          # admin-api 的第 4 个参数是**附加包含项**（不只是排除项）：`deploy/swas` 是「与镜像同源」
          # 的配置面，`deploy-admin-api.yml` 的 `on.push.paths` 里也有它 —— 只改配置的提交一旦
          # push 触发被吞（auto-merge 的 GITHUB_TOKEN 抑制 / 连续快合并）就**静默不生效**
          # （#5668 的 `/b/`、#5676 的 `/i/` 都靠人工 dispatch 才生效）⇒ 触发面与对账面必须同批。
          # 判据（两处不许脱钩、且不许窄化成不覆盖 nginx.conf 的形态）：
          # `tests/unit_ci_workflows/test_config_change_triggers_deploy.py`
          reconcile_one admin-api deploy-admin-api.yml backend/admin-api "deploy/swas"
          reconcile_one ai-agent-service deploy-ai-agent-service.yml backend/ai-agent-service ":(exclude)backend/ai-agent-service/tests"
          reconcile_one admin-web deploy-frontend.yml frontend/admin-web ""
          # worker-h5（issue #5001）—— **静态落地面腿**：发布到 `app.migaozn.com` 静态根的 `w/`，
          # **没有镜像** ⇒ 判据 ①（镜像已存在）对它恒不成立，判定来自漂移判据 ②（自
          # `worker-h5-publish.yml` 上次**成功**发布起 `frontend/worker-h5/**` 有无改动）。
          # 为什么必须有这条腿：该 workflow 的触发面只有 `push: main` + `workflow_dispatch`，而
          # auto-merge 用 `GITHUB_TOKEN` 合并 ⇒ 它触发的 `push` **不会**再触发 workflow
          # （#3113 已登记的同族抑制）⇒ 改了 `frontend/worker-h5/**` 的 PR 合并后工人端
          # **静默不发布**（实测：#4973 合并后线上 `frontend/worker-h5/src/render.mjs` 仍 0 命中
          # 「开工」，无红无告警）。本对账由 `schedule` 触发 ⇒ 不受该抑制影响，正是免疫的兜底腿。
          # 代码路径 = `worker-h5-publish.yml` 的 `on.push.paths` 正向项（有动态对齐守卫）。
          reconcile_one worker-h5 worker-h5-publish.yml frontend/worker-h5 ""
          # bmini-h5-hosting（issue #5668）—— **第二条静态落地面腿**：把 `frontend/bmini-app/**`
          # 的 h5 产物发布到 `app.migaozn.com` 静态根下的 `b/`。与 worker-h5 同形（无镜像 ⇒
          # 判据 ① 对它恒不成立，判定来自漂移判据 ② = 自 `bmini-h5-publish.yml` 上次**成功**发布起
          # `frontend/bmini-app/**` 有无改动）。
          # 为什么必须有这条腿：#5001 的同族抑制 —— 该 workflow 的自动触发面只有 `push: main`，
          # 而 auto-merge 用 `GITHUB_TOKEN` 合并 ⇒ 那个 `push` **不再触发 workflow** ⇒ 改了 B 端 h5
          # 合并后 `/b/` 会**静默停在旧产物**（无红无告警，正是本单要治的「功能做完浏览器里打不开」
          # 的近亲）。本对账由 `schedule` 触发 ⇒ 不受该抑制影响。
          # ⚠️ 腿名**有意**不叫 `bmini-h5`：发布腿的传输镜像正好叫 `<ACR>/<NS>/bmini-h5:sha-<build>`
          #    ⇒ 若同名，判据 ①（`docker manifest inspect`）会在**发布失败**（镜像已推、`b/` 未更新）
          #    时命中并返回「已构建 ⇒ 无漂移」⇒ **静默不补发布**。腿名与传输镜像名不同 ⇒
          #    判据 ① 恒不成立，判定只能来自漂移判据 ②（这条就是「对账不能凭空相信中间产物」的落点）。
          reconcile_one bmini-h5-hosting bmini-h5-publish.yml frontend/bmini-app ""
          # c-end-h5（issue #4184）—— **第三条静态落地面腿**：把 `frontend/mini-app/**` 的 h5 产物发布到
          # `app.migaozn.com` 的**静态根本身**（此前这条腿**不存在** ⇒ 线上 `/js/app.js` 的
          # `Last-Modified`=08-30，落后源码 **28 天**而无人知道）。与 worker-h5 / bmini 同形：
          # 全程无镜像 ⇒ 判据 ①（镜像已存在）对它恒不成立，判定来自漂移判据 ②（自
          # `c-end-h5-publish.yml` 上次**成功**发布起 `frontend/mini-app/**` 有无改动）。
          # 🔴 **本腿的方向是安全的（#4184 用户裁定 B：首次发布由人手动触发）**：`c-end-h5-publish.yml`
          #    的**发布步骤**只在 `workflow_dispatch` **且** `inputs.publish == 'true'` 时执行 ⇒
          #    本对账 dispatch 出去的 run 会走「Manual gate」判红并说明「没有发布任何东西」，
          #    **不会发布**。也就是说：对账面**只报告、不发布**（这一条是本单唯一允许的「dispatch 了但
          #    什么都不会发生」形态，已在 PR body 显式论证）。
          # ⚠️ 第 4 个参数**显式纳入发布链路自身的两个文件**（而不像 worker-h5 / bmini 那样登记为缺口）：
          #    本腿是**手动发布**腿 —— 对账面 dispatch 出去的 run 只会在「Manual gate」判红并说明
          #    「没有发布任何东西」，**不会**误发布；反过来，把这两个文件登记成缺口等于承认
          #    「改了发布链路而 push 被吞 ⇒ 静默」—— 而本单的判据要求是**触发面 ≡ 对账面**（未登记即红）。
          #    代价（如实登记）：改这两个文件时对账会 dispatch 一次「必然判红说明」的 run —— 这是**可归因**
          #    的红（文案直接给出「要发布请手动 -f publish=true」），不是静默。
          # ⚠️ 第 4 个参数**有意为空**（与 worker-h5 / bmini 两条腿同形）：本腿的触发面只允许
          #    `frontend/mini-app/**` ⇒ 发布链路自身的两个文件**永远不进触发面**，也就**不能**写进
          #    本腿的 pathspec（写了会被判「对账腿判了触发面里没有的路径」）。它们按同一口径逐条登记在
          #    `tests/unit_ci_workflows/reconcile_trigger_paths_ledger.json`（且标 `never_in_trigger`）。
          # ⚠️ 必须**单行**：`test_swas_deploy_ci_hardening.py::parse_reconcile_calls` 按行解析。
          reconcile_one c-end-h5 c-end-h5-publish.yml frontend/mini-app ""

          if [ "$SKIPPED" -gt 0 ]; then
            echo "⛔ ${SKIPPED} 个服务被断路器跳过（该 commit 的部署已失败）—— 不自动重试坏 commit"
          fi
          if [ "$MISSING" -gt 0 ]; then
            echo "🎯 补部署 dispatch 完成：${MISSING} 个服务（对应 deploy-*.yml 将构建并部署 sha-${HEAD7}）"
          fi
          {
            echo ""
            echo "**结论**：dispatch=${MISSING} · 无漂移=${NODRIFT} · 断路器跳过=${SKIPPED} · 判定失败=${UNKNOWN} · 不在 main=${NOTARGET}"
            echo ""
            echo "> 没有任何 dispatch 时，上表逐服务给出**判定依据**（镜像名 / 上次成功部署的 commit /"
            echo "> 断路器结论）——不再出现「run 报 success 但看不出它为什么没动」（issue #4827）。"
          } >> "$SUMMARY"
          echo "🧭 结论：dispatch=${MISSING} · 无漂移=${NODRIFT} · 断路器跳过=${SKIPPED} · 判定失败=${UNKNOWN}"
          # 存活读数（issue #5326 判据 1）：计数类读数（补 dispatch / 无漂移 / 断路器 / 判定失败），
          # **非挂钟时长**。零动作（NODRIFT=4、MISSING=0）走的是同一条读数，`acted=0` + `why` 说明原因。
          # `--seen` = 本轮的**对账腿数**，由状态机脚本从 `reconcile_one` 调用**现取**（`$SEEN`）——
          # 不许写死（#5264 的形态：读数与事实相反；新加一条腿时写死的那个数不会自己跟上）。
          # 发射器是**报告者**：它不可用（harness / 浅检出取不到文件）**绝不**得让机制本身失败。
          watchdog_missing   # 判据 1 / 2：具名清单现取（下面进存活读数，末道闸再判红）
          if [ -f .github/scripts/mechanism_liveness.sh ]; then
            source .github/scripts/mechanism_liveness.sh
            mechanism_liveness_declare --seen "${SEEN:-0}" --acted "${MISSING}" \
              --why "dispatch=${MISSING} · 无漂移=${NODRIFT} · 断路器跳过=${SKIPPED} · 判定失败=${UNKNOWN} · 不在main=${NOTARGET} · 未落状态=${MISS:-0}${MISS:+ 具名:$MISS}（基准 main HEAD=${HEAD7}）"

          fi
          if [ "$UNKNOWN" -gt 0 ]; then
            echo "::warning::Deploy Reconcile：${UNKNOWN} 个服务判据不可用——已按 fail-open 兜底补部署，请人工确认"
          elif [ "$NOTARGET" -gt 0 ]; then
            echo "::notice::Deploy Reconcile 判定完成：dispatch=${MISSING} · 无漂移=${NODRIFT} · 断路器跳过=${SKIPPED} · 不在 main=${NOTARGET}（基准 main HEAD=${HEAD7}；「不在 main」= 新增腿的那个 PR，合并后自然接上）"
          else
            echo "::notice::Deploy Reconcile 判定完成：dispatch=${MISSING} · 无漂移=${NODRIFT} · 断路器跳过=${SKIPPED}（基准 main HEAD=${HEAD7}）"
          fi
          watchdog_missing_gate || exit $?   # 判据 1：任一腿未落状态 ⇒ 本步自己判红并具名（不甩给下游兜）

      # ── 值守面（issue #5929：合并了但没上线 ⇒ 判红 + 自己开单）────────────────────
      # 判定本体（哪条腿算「已部署」）在**上一步**（对账步落的 `.deploy-watchdog-state.tsv`）；
      # 本步只做「合并进 main 超过 N 秒仍未部署」这一件事 —— 判定只此一份，**不重算**镜像/漂移。
      # 读不到 / 判不了 ⇒ **fail-closed 判红**（退出码 3），绝不静默 success（「没跑」≠「通过」）。
      # 告警面三件齐全（`tests/unit_ci_workflows/test_mechanism_jobs_alerting.py` 的既有口径）：
      # `::error::` 注解 + `$GITHUB_STEP_SUMMARY` 落笔 + **非零退出**；出口 = 开/更 P1 值班 issue。
      # 幂等：同一 main HEAD 反复判红**不重复刷屏**（20min 一轮的评论风暴本身就是缺陷），
      # 但单子保持开着、标签在位；HEAD 变了 ⇒ 追加一条新证据。
      # 清零：部署成功（`deployed`）或每轮判定为「已部署 / 在途」⇒ **自动关闭**该单（不靠人记得）。
      - name: 值守面（超时未部署 ⇒ 判红 + 开/清值守 issue）
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          # N = 2700s（45min）= 冷构建上界 2400s + 余量 300s（读数现取自
          # `deploy/scripts/swas-deploy-ci.sh` 那句「默认抬到 4500s（= 远端锁等待上限 1800s +
          # 冷构建上界 2400s + 余量 300s）」）。**远端锁等待上限 1800s 有意不计入**：那是
          # 「排队等另一条部署腿的远端 flock」，而排队中的 run 由 `inflight` 判据覆盖。
          # 判据 tests/unit_ci_workflows/test_deploy_watchdog.py 会**现取**这两个读数并断言
          # `N ≥ 2400 + 300`（改小 N / 删掉读数锚 ⇒ 红）。
          WATCHDOG_GRACE_SECONDS: "2700"
        run: |
          set -uo pipefail
          # ⚠️ 刻意**不用** `set -e`：本步要**自己**决定退出码（0 = 已部署/在途 / 1 = 超时未部署 /
          #    3 = 判不了），**任一非 0 都判红**；中途任何失败都不许被吞成 success（fail-closed）。
          # ⚠️ 变量一律 `${X:-}` 兜底：本仓有过「`set -u` + 未定义变量 ⇒ 整条部署腿被挡」的事故
          #    （`Assert server-side build` 步），不许在这里复现。
          STATE="${WATCHDOG_STATE:-.deploy-watchdog-state.tsv}"
          N="${WATCHDOG_GRACE_SECONDS:-2700}"
          SUMMARY="${GITHUB_STEP_SUMMARY:-/dev/null}"
          # 参与值守的腿 ⇄ 具名豁免腿。**双向登记**（三处必须逐项相等）=
          # `reconcile_one` 调用 / 本行两个列表 / tests/unit_ci_workflows/deploy_watchdog_ledger.json
          # —— 新加一条 deploy 腿却忘了接值守 ⇒ 判据当场红（铁律 8 的类级元守卫）。
          WATCHED_LEGS="admin-api ai-agent-service admin-web worker-h5 bmini-h5-hosting"
          EXEMPT_LEGS="c-end-h5"

          if [ "${EVENT_NAME:-}" = "pull_request" ]; then
            echo "ℹ️ 值守面不适用：事件=${EVENT_NAME}（PR 面没有 main HEAD 的部署对象；main 侧由 schedule 兜）"
            echo "| — | ℹ️ 事件 \`${EVENT_NAME}\` | **不判定**（PR 面无 main HEAD 的部署对象） |" >> "$SUMMARY"
            exit 0
          fi
          # `schedule` 与 `workflow_run` 走**同一套**判定（判据 4：部署完成事件驱动的清零）——
          # 判定本体只此一份，事件只决定「什么时候跑」，不决定「怎么判」。

          HEAD_SHA="$(git rev-parse HEAD 2>/dev/null || true)"
          HEAD7="${HEAD_SHA:0:7}"
          HEAD_TS="$(git log -1 --format=%ct HEAD 2>/dev/null || true)"
          NOW="$(date -u +%s)"
          case "${HEAD_TS:-}" in
            '' | *[!0-9]*) AGE="" ;;
            *) AGE=$(( NOW - HEAD_TS )) ;;
          esac
          echo "🧭 值守面判定：main HEAD=${HEAD7:-未知} · 合并至今=${AGE:-未知}s · N=${N}s · 豁免腿=${EXEMPT_LEGS}"
          {
            echo ""
            echo "## 值守面（issue #5929：合并了但没上线）\n\n> 判定桶：\`deployed\`/\`inflight\` ⇒ 不报 · \`terminal\`/\`dispatched\` ⇒ 业务告警 · \`notarget\` ⇒ 尚未轮到 · \`unrecorded\`/缺失 ⇒ **机制故障**"
            echo ""
            echo "- 判定基准：main HEAD \`${HEAD7:-未知}\` · 合并至今 \`${AGE:-未知}\`s · 宽限期 \`N=${N}\`s"
            echo "- 豁免腿（发布由人手动 —— 用户裁定 B；本对账的 dispatch 不会发布）：\`${EXEMPT_LEGS}\`"
            echo ""
            echo "| 腿 | 对账状态（现取） | 值守面判定 |"
            echo "|---|---|---|"
          } >> "$SUMMARY"

          OVERDUE=""; JUDGED=0; SUSPECT=0; NA=0; PLANNED=0
          for svc in $WATCHED_LEGS; do
            # 状态**现取**自对账步落的状态文件：判定本体只此一份（不在这里重算镜像/漂移/断路器）
            state="$(awk -F'\t' -v s="$svc" '$1 == s { print $2; exit }' "$STATE" 2>/dev/null || true)"
            why="$(awk -F'\t' -v s="$svc" '$1 == s { print $3; exit }' "$STATE" 2>/dev/null || true)"
            case "${state:-}" in
              deployed | inflight)
                JUDGED=$((JUDGED + 1))
                echo "✅ ${svc}：${state}（${why:-无依据}）"
                echo "| ${svc} | \`${state}\` | ✅ 不报（已部署 / 部署在途） |" >> "$SUMMARY"
                ;;
              terminal | dispatched)
                # `terminal` = 断路器：该 commit 不会再自动重试；`dispatched` = 对账开始时确实
                # 没有任何可用部署（本轮才补出去）⇒ 两者都计入告警面（超期即报）。
                SUSPECT=$((SUSPECT + 1))
                OVERDUE="${OVERDUE} ${svc}"
                echo "🔴 ${svc}：${state}（${why:-无依据}）—— 本轮对账开始时该 commit 尚无可用的部署"
                echo "| ${svc} | \`${state}\` | 🔴 计入告警面（${why:-无依据}） |" >> "$SUMMARY"
                ;;
              notarget)
                # 目标 workflow 还没在 main 上（**新增腿的那个 PR** 的形态）——「还轮不到它」，**不是**故障；
                # 与前两类一样**不得**混进同一个桶（判据 3：读不到状态 / 确认未部署 / 还没轮到，三态三分）。
                PLANNED=$((PLANNED + 1))
                echo "⏳ ${svc}：不在 main 上（${why:-无依据}）——尚未轮到这个腿，不报警"
                echo "| ${svc} | \`notarget\` | ⏳ 尚未轮到这个腿（不报警） |" >> "$SUMMARY"
                ;;
              unrecorded | "")
                # **机制故障**：对账步**没为这条腿落状态**（`unrecorded` = 种子位没被替换 / `""` = 状态文件
                # 缺失或写不进去）。**它与「确认未部署」必须是两种东西**（判据 3）——
                # 这一类**不开** `[deploy-watchdog]` 业务单，改开**机制故障**单（不同标题 + `type/bug`）。
                NA=$((NA + 1)); MECH="${MECH:-} ${svc}"
                echo "::error::值守面机制故障 ${svc}：对账状态=${state:-缺失}（fail-closed 判红，不许静默 success）"
                echo "| ${svc} | \`${state:-缺失}\` | 🔴 **机制故障**（fail-closed） |" >> "$SUMMARY"
                ;;
              *)
                NA=$((NA + 1)); MECH="${MECH:-} ${svc}"
                echo "::error::值守面机制故障 ${svc}：对账状态未登记（${state:-缺失}）——状态机没覆盖这个值"
                echo "| ${svc} | \`${state:-缺失}\` | 🔴 **机制故障**（未登记的状态值） |" >> "$SUMMARY"
                ;;
            esac
          done

          RC=0; VERDICT=""
          if [ "$NA" -gt 0 ]; then
            RC=3; VERDICT="机制故障（${NA} 条腿读不到对账状态：对账步没为它落状态）"
          elif [ -z "$AGE" ]; then
            RC=3; VERDICT="判定不可用（取不到 main HEAD 的提交时间）"
          elif [ "$AGE" -le "$N" ]; then
            VERDICT="宽限期内（合并 ${AGE}s ≤ N=${N}s）"
          elif [ -n "$OVERDUE" ]; then
            RC=1; VERDICT="超时未部署（合并 ${AGE}s > N=${N}s）"
          else
            VERDICT="全部腿已部署或部署在途"
          fi
          echo "🧭 值守面结论：${VERDICT} · 已判定=${JUDGED} · 计入告警=${SUSPECT} · 机制故障=${NA} · 尚未轮到=${PLANNED} · RC=${RC}"
          {
            echo ""
            echo "**结论**：${VERDICT} · 已判定=${JUDGED} · 计入告警=${SUSPECT} · 机制故障=${NA} · 尚未轮到=${PLANNED} · RC=${RC}"
            echo ""
            echo "> N=${N}s 的出处（现取复算）：冷构建上界 **2400s** + 余量 **300s** = 2700s（45min），"
            echo "> 原文 = \`deploy/scripts/swas-deploy-ci.sh\` 的「默认抬到 4500s（= 远端锁等待上限 1800s"
            echo "> + 冷构建上界 2400s + 余量 300s）」；**远端锁等待 1800s 有意不计入**（排队中的 run 由"
            echo "> \`inflight\` 判据覆盖，在途不报警）。"
            echo "> 复算：\`grep -n '冷构建上界' deploy/scripts/swas-deploy-ci.sh\`。"
          } >> "$SUMMARY"

          TITLE="[deploy-watchdog] main HEAD 超时未部署（合并后仍未上线）"
          MECH_TITLE="[deploy-watchdog] 机制故障：对账步没为某条腿落状态"
          case "$VERDICT" in 机制故障*) SPECIFIC="$MECH_TITLE" ;; *) SPECIFIC="$TITLE" ;; esac
          EXIST="$(gh issue list --state open --search "${SPECIFIC} in:title" --json number --jq '.[0].number // empty' 2>/dev/null || true)"
          if [ "$RC" != "0" ]; then
            echo "::error::值守面判红：${VERDICT} · main HEAD=${HEAD7:-未知} · 腿=${OVERDUE:-无}（明细见本 run 的 step summary）"
            BODY="$(mktemp)"
            {
              echo "值守面判红（issue #5929 的 ① 值守面：**合并了但没上线**）。"
              echo ""
              echo "run: ${GITHUB_SERVER_URL:-https://github.com}/${GITHUB_REPOSITORY:-}/actions/runs/${GITHUB_RUN_ID:-}"
              echo ""
              echo "- 判定基准：main HEAD \`${HEAD7:-未知}\`（合并至今 \`${AGE:-未知}\`s，宽限期 N=\`${N}\`s）"
              echo "- 结论：**${VERDICT}**"
              echo "- 计入告警面的腿：\`${OVERDUE:-无}\` · 机制故障的腿：\`${MECH:-无}\`"
              echo ""
              echo "### 这一类是什么（别读成「某个 PR 没写好」）"
              echo ""
              echo "- 它判的是**状态**：main 上最新的那个 commit 该上线却没上线（超过 N 分钟），而"
              echo "  \`deploy-reconcile.yml\` 的自动补部署**没能收敛**（该 commit 的部署落在不可恢复"
              echo "  终态 / 补出去的 run 一直没落地 / 目标 workflow 不在 main 上）。"
              echo "- 判据本体 = 对账步落的每条腿状态：\`deployed\`（镜像在 / 同 sha 结论 success / 无漂移）"
              echo "  与 \`inflight\`（同 sha 的 run 还没跑完）**不报**；\`terminal\` / \`dispatched\` 超期即报；"
              echo "  读不到 ⇒ fail-closed 判红。"
              echo "- ⚠️ 「镜像不在 ACR」**不是**判据：\`#5814\` 的 C′ 之后 CI 不推 ACR（服务器侧构建）"
              echo "  ⇒ 那条判据恒为真，照它实现就是每轮都报警（噪声判据是缺陷）。"
              echo ""
              echo "### 清零判据（怎么算好，**不用人记得关**）"
              echo ""
              echo "- 该 commit 的部署成功（同 sha 的 run 结论 = success，或代码状态已上线、无漂移）"
              echo "  ⇒ 下一轮 \`*/20\` 对账的值守面**自动关闭本单**并在单上留一条清零说明。"
              echo "- 本机复算：\`gh run list --workflow deploy-frontend.yml --branch main -L 5\` 看同 sha 的结论；"
              echo "  \`git log --oneline -1 <上次成功部署的 sha>..origin/main -- frontend/admin-web\` 看有没有漂移。"
              echo "- 人工出口（**不会**自动重试坏 commit）：\`gh workflow run <deploy-*.yml> --ref main\`，"
              echo "  或在该 run 页面 Re-run；确属代码问题 ⇒ 先修或回滚。"
              echo ""
              echo "### 本轮每条腿的状态"
              echo ""
              echo '```'
              sed -n '/^## 值守面/,$p' "$SUMMARY" 2>/dev/null || echo "(见本 run 的 step summary)"
              echo '```'
            } > "$BODY"
            case "$SPECIFIC" in "$MECH_TITLE") L="type/bug" ;; *) L="priority/P1" ;; esac
            if [ -n "$EXIST" ]; then
              PREV="$(gh issue view "$EXIST" --json body --jq '.body' 2>/dev/null || true)"
              case "${PREV:-}" in
                *"${HEAD7:-__none__}"*)
                  echo "ℹ️ 值守单 #${EXIST} 已含 ${HEAD7:-未知} 的证据 ⇒ 本轮不重复评论（防 20min 一轮刷屏）；单子仍开着"
                  ;;
                *)
                  gh issue comment "$EXIST" --body-file "$BODY" || echo "::warning::无法在值守单 #${EXIST} 追加本轮证据（限流/权限）"
                  ;;
              esac
              gh issue edit "$EXIST" --add-label "$L" || echo "::warning::无法给值守单 #${EXIST} 打标签（限流/权限）"
            elif [ -z "${MECH:-}" ]; then
              gh issue create --title "$TITLE" --body-file "$BODY" --label "$L" \
                || echo "::warning::无法创建 P1 值守 issue（限流/权限）——请人工按本 run 的 step summary 建单"
            else
              # 机制故障**不得**混进业务单（判据 3）：业务单在开着也照开机制单（去向不同、处置不同）。
              gh issue create --title "$MECH_TITLE" --body-file "$BODY" --label "$L" \
                || echo "::warning::无法创建「机制故障」issue（限流/权限）——请人工按本 run 的 step summary 建单"
            fi
            rm -f "$BODY"
          elif [ -n "$EXIST" ]; then
            # 清零判据：部署成功后**自动**关闭告警单（不依赖人记得 —— issue #5929 的验收判据 4）
            gh issue comment "$EXIST" --body "值守面清零：${VERDICT}（main HEAD=${HEAD7:-未知}）。**清零条件已满足**（本轮对账判定该 commit 的部署已到位 / 无漂移）——事件驱动（部署完成触发本工作流）与下一轮 \`*/20\` 任一到达即关；本单由 deploy-reconcile.yml 的值守面自动关闭。" \
              || echo "::warning::无法在值守单 #${EXIST} 追加清零说明（限流/权限）"
            gh issue close "$EXIST" --reason completed || echo "::warning::无法关闭值守单 #${EXIST}（限流/权限）"
          fi
          exit "$RC"

      # ── 存活读数（issue #5326 判据 1 / 4）────────────────────────────────────────
      # 「我没做事」与「我没跑」必须长得不一样：本步 `if: always()` 且是 job 的**最后一步**
      # ⇒ 每轮必出一行 `::notice::MECHANISM-LIVENESS mech=<id> ...`（零动作 ⇒ `acted=0` + `why`）。
      # 机制**停摆**（本步不再执行）⇒ **根本没有这一行**。看门人（`mechanism-liveness.yml` 的
      # 定时腿）断言「main 上最近一次**已完成** run 的注解里存在**绑定该 run id** 的读数」，
      # 缺失 / 绑定旧 run / **读数与 run 结论矛盾** ⇒ 判红（判据 2）。
      # ⚠️ 判定只用 run 归属与结论，**不用挂钟时长**（判据 4：时长受 runner 负载污染）。
      - name: 存活读数（本轮做了什么 / 为什么零动作）
        if: always()
        env:
          OUTCOME: ${{ job.status }}
        run: |
          # 发射器**可能不在检出里**（本 job 若检出固定 `ref: main`，而发射器是本 PR 新增 ⇒ 合并前取不到；
          # 浅检出同理）⇒ **降级为 warning 标注，绝不让读数步把机制判红**（报告者不改变机制结论）。
          # 「本轮无声」由看门人（定时腿）承接 —— 判「静默」的地方是它，不是这里。
          if [ -f .github/scripts/mechanism_liveness.sh ]; then
            bash .github/scripts/mechanism_liveness.sh emit deploy-reconcile --outcome "$OUTCOME"
          else
            echo "::warning::机制存活读数**本轮无声**（mech=deploy-reconcile）：发射器不在检出里（检出固定 ref / 浅检出）⇒ 本轮读数缺失（**不是**「零动作」）"
          fi
