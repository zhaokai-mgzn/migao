name: Flaky Triage (失败重跑分流)

# ─────────────────────────────────────────────────────────────────────────────
# issue #4717 —— CI 层两项：① failed job **重跑分流 + 记账**；② **flaky 台账**。
# （测试层的机械守卫「时间相关用例必须冻结时钟」= (C) 项，由另一单承担，不在本文件。）
#
# 背景（本会话真实发生两次）：#4713（`new Date()` 造期望值 vs 消息时间戳 ⇒ 跨分钟边界必红，
# ~10~15% 随机红，且落在 **required** 的 `mini-app typecheck + unit tests` 里 ⇒ 随机卡任何 PR）、
# #4717（`task-card-qr`「等 A 后同步断言 B」的 commit 竞态）。同形 = 随机红 ⇒ 告警疲劳 ⇒ 归因层失效。
#
# 为什么是**独立 workflow + `workflow_run` 触发**（而不是「在被测 workflow 内重跑」）：
#   GitHub Actions **没有** per-job 原生 retry；能拿到「第二次真实结果」的唯一机制是
#   `gh run rerun <id> --failed`，而它只能由**已结束的 run 之外**的主体发起 ⇒
#   `workflow_run: types:[completed]` 是唯一可行触发面（同一个 run 内自举不可能）。
#   ⚠️ 本文件**不参与 required 集合**，且**不改任何被测 workflow**：它的失效形态是
#   「分流不生效」（可观测：台账不增长 / 日志有 `::notice::`），**不是**「别人的 CI 变红」。
#
# 三条红线（判据本体全在 `.github/scripts/flaky_ledger.py`，本文件只「取事实 → 执行动作」）：
#   ① **绝不静默放行** —— 第二次绿 ⇒ 打 `flaky/rerun-green` + `block/merge` + PR 评论
#      **并卸下 auto-merge**（`gh pr merge --disable-auto`）⇒「第二次绿」≠「通过」。
#      （#4248 实证：`block/merge` 标签**拦不住已 arm** 的 auto-merge，只有 `--disable-auto` 能停住。）
#   ② **绝不无限重跑** —— `MAX_ATTEMPTS = 2`（首次 + 最多 1 次重跑）；第二次仍红 ⇒ **照常失败**。
#   ③ **绝不误判 infra** —— cancelled / timed_out / startup_failure / 从未跑起来的 job（无 steps）/
#      只在「取代码 · 装依赖」步骤失败的 job ⇒ **不算 flaky、也不重跑**（仅登记 infra_suspect）。
#
# ── #4804：台账那一半**永远落不到 main** 的修复（实测，别再重新猜）────────────────
# 病根：本 workflow 用 `GITHUB_TOKEN` 建台账 PR ⇒ GitHub **抑制**由 `GITHUB_TOKEN` 事件
#   引发的 workflow（防递归的既有机制）⇒ 台账 PR 的 `pull_request` run 全部停在
#   `conclusion=action_required`（**run 被创建、却零 job、check-runs 为空**）
#   ⇒ `gh pr checks` 报「no checks reported」⇒ required 集合永不满足 ⇒ `--auto` **永不触发**
#   ⇒ 台账只停在分支上（main 上那份永远是初始空壳）。
#   ⚠️ 与「条件没满足」的区别（**实测读数**）：条件没满足时 run 会**真的跑**并给出结论；
#      这里是**零 job**（`/jobs ⇒ total_count=0`、`/commits/<sha>/check-runs ⇒ 0`）。
# 修法取舍（**逐条实测**，不是推测）：
#   ① **台账直推 main（contents API）** ⇒ ✗ **被分支保护拒绝**，实测：
#      `409 Could not create file: Changes must be made through a pull request.
#       12 of 12 required status checks are expected.`（探测未落任何提交，main tip 不变）
#      ⇒ **行不通**，且**不许**为此放宽分支保护 / required 集合（硬约束）。
#   ② **`workflow_run` 两段式** ⇒ ✗ 第一段仍由 `GITHUB_TOKEN` 触发 ⇒ 同样被抑制，**没有第二段**。
#   ③ **自己 approve 被抑制的 run** ⇒ ✓ **可行且实测有效**：`POST /actions/runs/{id}/approve`
#      需要 `actions: write`（本 workflow 已声明）。**实证**：批准 run 35493666161 后
#      `gh pr checks 4775` 由「no checks reported」变成 **13 条 check**（required 逐条 pass）。
#   ④ 换落点 / 换 secret（PAT、GitHub App）⇒ ✗ 硬约束禁新 secret；换落点 = 台账离开 main。
#   ⇒ **首选 ③**，因为它**不绕过任何门禁**：台账 PR 仍然要**真的跑完 required 检查**才允许
#      auto-merge 落地（= 「只标注不自动放行」的语义**一字未动**，见 ② 步）。
#      **为什么不会再被同一条限制掐死**：限制是「GITHUB_TOKEN 事件被抑制」，而 ③ 作用于
#      **已被抑制的结果**（`action_required` run），用的是与「创建 PR」不同的权限面
#      （`actions: write`）；批准**不**依赖任何新 secret、**不**触碰分支保护。
#      ⚠️ **唯一残余风险（照实登记，不粉饰）**：approve 本身是本 workflow 的一步 ⇒
#      若本 workflow 整体停摆，台账仍会停在分支上。该形态**可见**（job 红 + job summary
#      打印 `mergeStateStatus` / check-runs），不是静默失效；如需更强兜底，另开单做
#      「独立定时对账」。
#
# ── #5100：台账**追加路径不自愈**的根治（实测，别再重新猜）────────────────────────
# 病根：旧实现在**分支自己的 HEAD**（旧基线）上追加（`git checkout -B "$BRANCH" FETCH_HEAD`），
#   而台账 PR 走 **squash 合并** ⇒ 分支历史**永不含** main 上那个 squash 提交 ⇒ 一个**只追加**
#   的分支 **behind_by 永远 > 0** ⇒ **每轮都会再冲突**（实测 `compare/main...chore/flaky-ledger`
#   = `diverged, ahead_by 34, behind_by 16`；兜底判据 ~72 次/天红 ⇒ 告警疲劳，且掩盖真实失效）。
#   ⇒ **一次性 rebase 只是止血**，下一次追加原样复发（内容其实是「只追加超集」，零信息损失）。
# 修法（**单一写者设计不变**：仍只有本文件写这条分支；reconcile 只 approve/arm，不写内容）：
#   步骤④ **推送前先与 main 对齐** —— 取 main 侧台账 → 按幂等键 `workflow|run_id|job` **并集**
#   （复用 `append_entries`：幂等且不丢条目）→ 在**最新 main 之上**提交 → `--force-with-lease`
#   推送（lease 失败 = 别人刚推 ⇒ **重取重算，绝不强推**）。
#   判据：`tests/unit_ci_workflows/test_flaky_ledger_append_selfheal.py`（六条，均带注入式红证）。
#
# 守卫（本文件的结构不许被静默改坏）：`tests/unit_ci_workflows/test_flaky_triage.py`，
# 跑在 **required** 的 `ci workflow helper unit tests` 里（每条判据都带注入式红证）。
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_run:
    # 白名单口径 = 「PR 上跑测试 且 重跑无副作用」。故意不收：
    #   · Drift Audit / Agent Behavior Eval / Demo Evidence Gate —— 报告型，不阻塞；
    #   · Deploy Reconcile / deploy-* —— **重跑有副作用**（会真的部署）；
    #   · Post-Deploy Eval 等真实 LLM workflow —— 重跑 = 重复烧 token（#4262 用户裁定）。
    workflows:
      - PR Check
      - Mini-App CI
      - AI Agent Service Unit Tests
      - Bmini-App CI
    types: [completed]

# 台账 push 是「读-改-写」⇒ 串行化，防并发 run 互相覆盖（幂等键仍在脚本侧，双保险）
concurrency:
  group: flaky-triage-ledger
  cancel-in-progress: false

permissions:
  actions: write        # gh run rerun（重跑失败 job）+ **approve 被抑制的台账 PR run**（#4804）
  contents: write       # 推台账分支 chore/flaky-ledger
  pull-requests: write  # PR 评论 / 标签 / 卸 auto-merge / 台账 PR arm auto-merge
  issues: write         # gh label create --force（标签是 issue 元数据）

jobs:
  triage:
    name: Flaky Triage (重跑分流 + 记账)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 只分流 PR 运行（部署/定时/手动不参与）。第二道闸在脚本里（同一判据，双重）
    if: github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Checkout（台账基线 = main；`workflow_run` 默认取默认分支，显式声明）
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: 台账自检（fail-closed：台账不合规就不参与分流）
        run: python3 .github/scripts/flaky_ledger.py selftest

      - name: 取本次 run + job 事实（只读）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          python3 .github/scripts/flaky_ledger.py fetch \
            --repo "$GITHUB_REPOSITORY" --run-id "$RUN_ID" --out /tmp/flaky-bundle.json

      - name: 分流判定（纯函数；不判定 = 不改任何状态）
        id: decide
        run: |
          # ⚠️ `set -o pipefail` **必需**：本行接了 `tee`（写 job summary）。没有它时管道退出码
          #    取 `tee` 的 0 ⇒ 判据失败会被吞掉 ⇒ `action` 为空 ⇒ 所有 `if:` 全假 ⇒
          #    **静默 no-op**（"分流没生效"装成"没有 flaky"）。守卫：audit_workflow 的 pipefail 判据。
          set -o pipefail
          python3 .github/scripts/flaky_ledger.py decide \
            --bundle /tmp/flaky-bundle.json \
            --entries-out /tmp/flaky-entries.json \
            --comment-out /tmp/flaky-comment.md \
            --gh-output "$GITHUB_OUTPUT" | tee -a "$GITHUB_STEP_SUMMARY"

      # ── ① 首次失败 ⇒ 重跑失败 job（**上限 1 次**）────────────────────────────
      - name: ① 首次失败 ⇒ 自动重跑失败 job（最多 1 次）
        if: steps.decide.outputs.action == 'rerun'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          # fail-closed：重跑没发出去就**红**（不静默）—— 否则「分流没生效」会装成「没有 flaky」
          if ! gh run rerun "$RUN_ID" --failed --repo "$GITHUB_REPOSITORY"; then
            echo "::error::触发失败 job 重跑失败（配额/权限/run 状态？）⇒ fail-closed，不静默"
            exit 1
          fi
          echo "::notice::🔁 已触发失败 job 重跑（上限 1 次）——第二次结果由下一次 workflow_run 判定"

      # ── ② 第二次绿 ⇒ 标 flaky + **卸下 auto-merge**（绝不静默放行）──────────
      - name: ② 第二次绿 ⇒ 标 flaky + 卸 auto-merge（第二次绿 ≠ 通过）
        if: steps.decide.outputs.action == 'mark_flaky'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.decide.outputs.pr }}
        run: |
          set -uo pipefail
          # ②a **先真的停住**（「不自动放行」的实体动作）—— `block/merge` 防「再次 arm」；
          #     `--disable-auto` 停住**已 arm** 的 auto-merge
          #     （#4248 实证：光靠 `block/merge` 标签拦不住已 arm 的 auto-merge，只有它停得住）
          gh pr merge "$PR_NUMBER" --disable-auto --repo "$GITHUB_REPOSITORY" 2>&1 \
            || echo "ℹ️ --disable-auto 无操作（未 arm 或已卸下）—— 非错误"
          # ②b 可见标注（--force = 已存在则更新，不因已存在而失败）
          gh label create "flaky/rerun-green" --force --color FBCA04 \
            --description "重跑才绿（flaky）：第二次绿 ≠ 通过，需显式放行" \
            --repo "$GITHUB_REPOSITORY"
          gh label create "block/merge" --force --color B60205 \
            --description "人工闸：禁止 auto-merge" \
            --repo "$GITHUB_REPOSITORY"
          gh pr edit "$PR_NUMBER" --add-label "flaky/rerun-green" --repo "$GITHUB_REPOSITORY"
          gh pr edit "$PR_NUMBER" --add-label "block/merge" --repo "$GITHUB_REPOSITORY"
          # ②c **复核 + fail-closed**：标注/阻断必须**真的落地**，否则本 job 红。
          #     理由：标不上却继续 ⇒ 就是「静默放行」（本仓库最贵的形态：绿了但没跑）。
          LABELS=$(gh pr view "$PR_NUMBER" --json labels --jq '[.labels[].name]|join(",")' \
            --repo "$GITHUB_REPOSITORY")
          AUTO=$(gh pr view "$PR_NUMBER" --json autoMergeRequest \
            --jq '.autoMergeRequest // "none"' --repo "$GITHUB_REPOSITORY")
          echo "复核：labels=[$LABELS] autoMergeRequest=$AUTO"
          case ",$LABELS," in *",flaky/rerun-green,"*) ;; *)
            echo "::error::可见标注未落地：flaky/rerun-green 不在 [$LABELS] ⇒ fail-closed"; exit 1;; esac
          case ",$LABELS," in *",block/merge,"*) ;; *)
            echo "::error::可见标注未落地：block/merge 不在 [$LABELS] ⇒ fail-closed"; exit 1;; esac
          [ "$AUTO" = "none" ] || {
            echo "::error::auto-merge 仍在 arm（$AUTO）⇒ **自动放行未被阻止** ⇒ fail-closed"; exit 1; }
          echo "::notice::🎈 flaky 已标注（flaky/rerun-green + block/merge + 已卸 auto-merge）—— 第二次绿 ≠ 通过"

      # ── ③ 可见评论（幂等：同 marker 已存在则**更新**，不重复堆积 ⇒ 不再造噪音）──
      - name: ③ PR 评论（幂等：同 marker 更新而非重复创建）
        if: steps.decide.outputs.entry_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.decide.outputs.pr }}
        run: |
          set -uo pipefail
          EXISTING_ID=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --paginate --slurp \
            --jq '[.[][] | select(.body | startswith("<!-- flaky-triage:"))] | .[0].id // empty' \
            2>/dev/null || true)
          if [ -n "${EXISTING_ID:-}" ]; then
            # fail-closed：评论没贴上就**红**（可见标注不许静默失效）
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$EXISTING_ID" \
              -F body=@/tmp/flaky-comment.md >/dev/null \
              || { echo "::error::更新 triage 评论失败 ⇒ fail-closed，不静默"; exit 1; }
            echo "♻️ 已更新既有 triage 评论 #$EXISTING_ID（幂等，不重复堆积）"
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              -F body=@/tmp/flaky-comment.md >/dev/null \
              || { echo "::error::贴 triage 评论失败 ⇒ fail-closed，不静默"; exit 1; }
            echo "💬 已贴 triage 评论"
          fi

      # ── ④ 记账：**推前先与 main 对齐** + 只追加 + 幂等，落仓 `.github/flaky-ledger.json` ──
      # ⚠️ 台账**直推 main 被分支保护拒绝**（实测 409「Changes must be made through a
      #    pull request. 12 of 12 required status checks are expected.」）⇒ 只能走 PR。
      # ⚠️ **#5100 根治（实测根因）**：台账 PR 走 **squash 合并** ⇒ 分支历史**永不含** main 上
      #    那个 squash 提交 ⇒ 旧实现「在**分支自己的 HEAD**（旧基线）上追加」⇒ 只追加的分支
      #    **behind_by 永远 > 0** ⇒ 每轮再冲突（一次性 rebase 只是止血）。修法 = 推前先与 main 对齐。
      - name: ④ 台账追加（**推前先与 main 对齐**：并集 + 最新 main 之上重放 + lease 推送）
        id: ledger
        if: steps.decide.outputs.entry_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -uo pipefail
          BRANCH="chore/flaky-ledger"
          # `--align-main`（#5100）= ① 取 `origin/main` 侧台账（**权威态**）② 取远端分支侧台账
          #   （并记下它的 HEAD 当 lease 期望值）③ 按幂等键 `workflow|run_id|job` **并集**
          #   （复用 `append_entries`：幂等、不丢条目）④ `git checkout -B "$BRANCH" origin/main`
          #   并把并集写回台账文件 ⇒ 本步骤之后的 `git diff` 基线是 **main**（不再是旧分支），
          #   提交落在**最新 main 之上**。
          # ⚠️ 任一步取不到事实 ⇒ 脚本**抛错退出**（fail-closed）：绝不许把「取不到 main 台账」
          #    当「main 没有条目」继续 —— 那会**丢 main 的条目**（并集的全部意义）。
          # ⚠️ 用**工作区**脚本 = main 的副本（checkout 的 `ref:` 就是 main，本步骤之前没人切过树）。
          #    勿改成「切树之后跑工作区脚本」—— 那时它是**台账分支的旧副本**（#4825 实测
          #    `invalid choice: 'approve'`）。④b 另取 /tmp 副本给步骤⑤ 用。
          align_and_append() {
            python3 .github/scripts/flaky_ledger.py append \
              --align-main --branch "$BRANCH" --ledger .github/flaky-ledger.json \
              --entries /tmp/flaky-entries.json --gh-output "$GITHUB_OUTPUT" || {
              echo "::error::推前对齐失败（取 main/分支台账或重放失败）⇒ 拒绝在旧基线上追加（fail-closed）"; exit 1; }
            # lease = 对齐那一刻**远端**分支 HEAD（空 = 分支尚不存在）⇒ 推送前用它防并发覆盖
            EXPECTED=$(sed -n 's/^lease=//p' "$GITHUB_OUTPUT" | tail -1)
            LEASE=""
            [ -n "$EXPECTED" ] && LEASE="--force-with-lease=$EXPECTED"
            return 0
          }
          align_and_append
          # 幂等判据（机械）：同 (workflow, run_id, job) 已登记 ⇒ append 是空操作 ⇒ 无 diff
          if git diff --quiet -- .github/flaky-ledger.json; then
            echo "::notice::⏭️ 台账无新增（幂等：同一 (workflow, run_id, job) 已登记）"
          else
            PUSHED=""
            for attempt in 1 2 3; do
              git config user.name "migao-flaky-bot"
              git config user.email "flaky-bot@users.noreply.github.com"
              git add .github/flaky-ledger.json
              git commit -q -m "chore(ci): flaky 台账追加（run ${RUN_ID}）"
              if git push --quiet $LEASE origin "$BRANCH"; then PUSHED="1"; break; fi
              # lease 失败 = 别人刚推过 ⇒ **不强推**，重取重算（并集幂等 ⇒ 重复调用无副作用）
              echo "::warning::台账 push 的 lease 失败（远端已被别人推过）⇒ **不强推**，重取重算（第 ${attempt} 次）"
              align_and_append
            done
            [ -n "$PUSHED" ] || {
              echo "::error::台账 push 连续 lease 失败 ⇒ 记账**未落仓**（fail-closed，不静默）"; exit 1; }
            # 落仓复核：**远端 ref** 必须就是本次提交（判据是远端，不是本地 git log）
            git fetch --quiet origin "$BRANCH"
            [ "$(git rev-parse FETCH_HEAD)" = "$(git rev-parse HEAD)" ] || {
              echo "::error::台账未落到远端分支 ${BRANCH}（落仓复核失败）"; exit 1; }
          fi
          PR=$(gh pr list --head "$BRANCH" --state open --json number \
                 --jq '.[0].number // empty' --repo "$GITHUB_REPOSITORY")
          if [ -z "$PR" ]; then
            # ⚠️ body 里**不得**出现 issue 关闭关键词 + 号（本仓库 close-linked-issues 是朴素正则，
            #    任何「关键词 + #号」形态都会被误判为关闭意图，包括反引号里的样例）。
            gh pr create --base main --head "$BRANCH" --repo "$GITHUB_REPOSITORY" \
              --title "chore(ci): flaky 台账滚动追加" \
              --body "由 \`.github/workflows/flaky-triage.yml\` 自动追加（关联 issue 4717，**不关闭**它）。

              只改 \`.github/flaky-ledger.json\`：**只追加**、幂等（键 = \`(workflow, run_id, job)\`）、可审计。

              消费方式：**条数现取**（本台账不写任何计数）；同一 \`job\` 反复出现 \`kind=flaky\` ⇒ 按 \`migao-acceptance\`「随机红 = 归因层失效」开单修根因，而不是继续重跑。" \
              || { echo "::error::台账 PR 创建失败 ⇒ 台账停在分支上、main 不增长（fail-closed）"; exit 1; }
            PR=$(gh pr list --head "$BRANCH" --state open --json number \
                   --jq '.[0].number // empty' --repo "$GITHUB_REPOSITORY")
            [ -n "$PR" ] || { echo "::error::台账 PR 创建后取不到 PR 号 ⇒ fail-closed"; exit 1; }
          fi
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          echo "::notice::📒 flaky 台账已追加并推送 ${BRANCH}（远端 ref 复核通过）—— PR #$PR 待批准后走 required 检查"

      # ── ④b 取 **main** 上的判据脚本副本（#4825 实测根因：工作区已被步骤④ 切到台账分支）──
      # ⚠️ **勿删、勿改回工作区那份**：步骤④ `git checkout -B "$BRANCH" FETCH_HEAD` 已把工作区
      #    切到**台账分支** ⇒ 直接跑工作区里的 `.github/scripts/flaky_ledger.py`，执行的是
      #    **台账分支的旧副本**（该分支 fork 自 #4804 之前的 main ⇒ **没有 `approve` 子命令**）
      #    ⇒ 实测报 `error: argument cmd: invalid choice: 'approve'`。
      #    后果 = **死锁**：要 approve 才能把台账落 main，而 approve 只存在于 main 的脚本里，
      #    台账分支永远拿不到它 ⇒ 步骤⑤ 自上线起**从未成功过一次**（main 侧台账恒为 0 条）。
      #    故本步骤显式从 `origin/main` 取副本；步骤⑤ 只允许用这个副本。
      - name: ④b 取 main 上的判据脚本副本（#4825：工作区此时是台账分支，不是 main）
        if: steps.decide.outputs.entry_count != '0'
        run: |
          set -uo pipefail
          git show origin/main:.github/scripts/flaky_ledger.py > /tmp/flaky_ledger.py || {
            echo "::error::取 origin/main 上的 flaky_ledger.py 失败 ⇒ 后续步骤无法执行（fail-closed，不静默）"; exit 1; }
          [ -s /tmp/flaky_ledger.py ] || {
            echo "::error::main 上的 flaky_ledger.py 是空文件 ⇒ 不许当「脚本没问题」继续（fail-closed）"; exit 1; }

      # ── ⑤ **#4804 关键一步**：批准被 GITHUB_TOKEN 抑制的台账 PR run ────────────
      # 不批准 ⇒ 那批 run 永远停在 `action_required`（零 job ⇒ 零 check-run）
      # ⇒ `gh pr checks` 报「no checks reported」⇒ required 永不满足 ⇒ `--auto` 永不触发
      # ⇒ 台账停在分支上（= 本单要修的病）。
      # 批准**不绕过门禁**：run 照样要真的跑完 required 检查才允许 auto-merge（语义一字未动）。
      - name: ⑤ 批准台账 PR 被抑制的 run（#4804：不批准则永远没有 check）
        if: steps.decide.outputs.entry_count != '0' && steps.ledger.outputs.pr != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.ledger.outputs.pr }}
        run: |
          set -uo pipefail
          BRANCH="chore/flaky-ledger"
          # ⚠️ 用步骤④b 取的 **main 副本**：工作区此刻是台账分支（步骤④ 已切树）⇒ 若跑
          #    工作区里的脚本，执行的是台账分支的旧副本（**没有 approve 子命令**，实测
          #    `invalid choice: 'approve'`）⇒ 台账永远落不到 main（#4825 的实测根因）。
          # fail-closed：批准发不出去 ⇒ 红（否则「台账没 check」会装成「已经放行」）
          python3 /tmp/flaky_ledger.py approve \
            --repo "$GITHUB_REPOSITORY" --head-branch "$BRANCH" || {
            echo "::error::approve 台账 PR 的 action_required run 失败 ⇒ 台账 PR 仍无 check、main 不增长（fail-closed）"; exit 1; }
          # 批准是异步的（run_attempt 会 +1）；短窗复核，拿不到只打 notice（**不**把异步当失败）
          # ⚠️ 分支过滤参数是 **`branch=`**；`head_branch=` 会被 API **静默忽略**（实测会返回
          #    全仓 11867 个 run 而不是本分支的 13 个）⇒ 读数会指向无关 run。
          for i in $(seq 1 10); do
            ATTEMPT=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=pull_request&branch=$BRANCH&per_page=1" \
                        --jq '.workflow_runs[0].run_attempt // 0' 2>/dev/null || echo 0)
            [ "${ATTEMPT:-0}" -ge 2 ] && break
            sleep 3
          done
          echo "::notice::🔓 approve 已发出；台账 PR 最新 run_attempt=${ATTEMPT:-?}（≥2 = 批准已生效、check 正在产出）"

      # ── ⑥ arm auto-merge（**在 approve 之后**；台账 PR 仍需真的跑完 required 检查）──
      - name: ⑥ 台账 PR arm auto-merge（检查齐了才可能落地；CI 红则**不**合并）
        if: steps.decide.outputs.entry_count != '0' && steps.ledger.outputs.pr != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ steps.ledger.outputs.pr }}
        run: |
          set -uo pipefail
          # ⚠️ 不设 `--auto` 之外的动作：**不放行、不 approve PR 评审、不绕 required**
          gh pr merge "$PR" --auto --squash --repo "$GITHUB_REPOSITORY" 2>&1 \
            || echo "ℹ️ auto-merge arm 返回非零（可能已 arm / 或分支保护拒绝 arm）—— 非致命"
          # 可审计读数（**不是**门禁；合并是异步的，本 run 结束前不会落地）
          STATE=$(gh pr view "$PR" --json state,mergeStateStatus,autoMergeRequest \
                    --jq '"state=\(.state) mergeStateStatus=\(.mergeStateStatus) autoMerge=\(if .autoMergeRequest then "armed" else "none" end)"' \
                    --repo "$GITHUB_REPOSITORY" 2>&1)
          CHECKS=$(gh pr checks "$PR" --json name --jq 'length' --repo "$GITHUB_REPOSITORY" 2>/dev/null || echo 0)
          {
            echo "### 📒 flaky 台账落仓状态（#4804）"
            echo ""
            echo "- 台账 PR：#${PR}"
            echo "- ${STATE}"
            echo "- 可见 check 数：${CHECKS}（0 = **仍被抑制** ⇒ 台账落不到 main）"
            echo ""
            echo "合并是**异步**的：本 job 结束前不会落地；由 required 检查 + auto-merge 收口。"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::📒 台账 PR #$PR —— $STATE / check 数=$CHECKS"
