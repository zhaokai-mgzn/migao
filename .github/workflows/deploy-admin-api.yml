name: Build and Deploy admin-api
permissions:
  contents: read
  # 🔴 跳过 / 终态判据的**凭据**（issue #5941）：`Skip if already built` 步要跑 `gh run list`
  # 读同 sha 的 run 结论。workflow 级 `permissions` 一旦显式声明，**未列出的作用域一律为
  # `none`** ⇒ 缺这一行时即使注入了 token 也读不到 runs。最小权限 = 只读。
  actions: read

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'backend/admin-api/**'
      # ── 只改配置也必须触发一次部署（关联 #5001；实测两次的病）──────────────────────
      # **为什么配置改动要走部署腿**：配置（compose/nginx）与镜像**同源** ——
      # `deploy/swas/deploy.sh` 只取「镜像 tag 那个 commit」的配置（`CONFIG_REF_RESOLVED`，
      # 见该脚本第 0/1 段与 issue #5083），把它们 `cp` 到 `nginx/` 与 compose 根，并无条件
      # `docker compose up -d --no-deps nginx` + `nginx -s reload`（`nginx` 是 `UP_SERVICES`
      # 的初值，那段在逐服务循环**之外**）⇒ **配置的应用面只在这条部署腿里**。
      # 而改 `deploy/swas/**` 原先**一条部署腿都不触发**：`bmini-h5-publish.yml` 的 paths 里
      # 虽有 `deploy/swas/nginx.conf`，但那条腿只往静态根发文件（全程没有 cp / reload、
      # 不跑 deploy.sh）⇒ 配置**不被应用**，该文件的改动**静默不生效**，只能靠人工
      # `workflow_dispatch`（实测：#5668 的 `/b/`、#5676 的 `/i/`）。
      # 覆盖面（`ls deploy/swas/`）：nginx.conf · docker-compose.yml ·
      # docker-compose.bluegreen.yml · deploy.sh · h5-publish-remote.sh ·
      # bmini-h5-publish-remote.sh —— 全是「与镜像同源」那一面，改了就得由一次部署应用/自证。
      # ⚠️ 这一行与 `deploy-reconcile.yml` 里 admin-api 腿的第 4 个参数是**同一事实的两处投影**
      #    （触发面 / 对账面）⇒ 必须同批改；只改一处、或写成不覆盖 `nginx.conf` 的形态
      #    （如 `deploy/swas/*.sh`）⇒ 判红：
      #    `tests/unit_ci_workflows/test_config_change_triggers_deploy.py`
      - 'deploy/swas/**'
  # 部署对账（issue #2947）：连续快速合并时 GitHub 可能吞掉 push 触发
  # （2026-09-05 实测 #2927 合并后 admin-api 部署未自动触发——镜像从未构建，#2936 只覆盖 ai-agent）。
  # 定时兜底：检查 main HEAD 对应的 sha-xxx 镜像是否已存在，缺失则补一次构建部署。
  # ⚠️ **错峰**（issue #5078 ③）：本 workflow 与 deploy-reconcile / deploy-frontend /
  # deploy-ai-agent-service / flaky-ledger-reconcile **原来全是 `*/20 * * * *`** ⇒
  # :00/:20/:40 同刻起跑 5 个重活（同时抢 runner + 同时抢各自的并发锁），而
  # `deploy-reconcile` 的职责正是 dispatch 这 3 条 deploy ⇒ 队列自踩。
  # 现排在 reconcile（:00/:20/:40）**之后** N 分钟：reconcile 先判定并 dispatch，
  # 本腿随后独立复核（镜像已在 ⇒ 秒退，见 `Skip if already built`），不再同刻挤在一起。
  # 周期仍是 20min ⇒ #2947/#2935 的分钟级兜底窗口不变。
  schedule:
    - cron: '4,24,44 * * * *'
  workflow_dispatch:
    inputs:
      image_tag:
        description: '部署指定镜像 tag（回滚/指定版本用，如 sha-xxxxxxx 或 v1.2.3）。留空 = 构建当前代码并部署'
        required: false
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # 部署目标：SWAS 轻量应用服务器（2026-08-14 起替代 SAE）—— 当前为测试环境
  SWAS_INSTANCE_ID: b23c69e599524b1da719734f72e6a0e3
  SWAS_REGION: cn-hangzhou
  # 快速部署：CI 构建镜像 → ACR → 服务器 pull（不再源码构建）
  ACR_REGISTRY: crpi-qdcgkzwx9p9zckga.cn-hangzhou.personal.cr.aliyuncs.com
  ACR_NAMESPACE: ai-customer-service
  IMAGE_NAME: admin-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # AK/SK **只在这一处声明**（issue #6294）：Deploy step 与「跳过部署自证」step 共用 ——
    # Danger Scan 的 secrets 判据把「旧位置删除 + 新位置新增」认作**移动**（非新增）⇒ 零 blocker。
    env:
      AK: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
      SK: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
    # 硬超时兜底（issue #4767 ①）：脚本被卡死时由 GitHub 终止 run ⇒ run 进**终态** ⇒
    # `deploy-admin-api` 的 concurrency 组释放。事故里挂住的 run 占锁 20+ 分钟 ⇒ 后续 main 的部署全被挡住。
    # 90min 的来历（issue #5814 C′ + #5896）：构建已搬到**服务器侧**，其墙钟算在「发起+轮询」预算之内
    # （`swas-deploy-ci.sh` 的 SWAS_DEPLOY_TIMEOUT_SECONDS，C′ 下默认 4500s = 75min
    #   = **远端锁等待上限 1800s** + **冷构建上界 2400s** + 余量 300s）⇒ job 上界必须**大于**它，
    # 否则 run 会先被 GitHub 打死，而打死报的是 `cancelled`（**不是** failure）⇒ 断路器不跳闸
    # ⇒ cron 自放大（本单要消灭的形态）。
    # 实测：冷构建 1782s（29.7min）、并发部署排队 ~28min ⇒ 90min 给足余量，
    # 且仍能兜住真正卡住的 run（lock 一定会释放）。
    timeout-minutes: 90
    # 部署对账输出（issue #2947）：schedule 触发时若镜像已存在则 skip=true（本轮未部署）
    outputs:
      deployed: ${{ steps.sync.outputs.skip != 'true' }}

    concurrency:
      group: deploy-admin-api
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # 镜像 tag：git SHA 前 7 位（不可变、可追溯）；回滚/指定版本时用输入值
      - name: Resolve image tag
        id: tag
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "IMAGE_TAG=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
            echo "MODE=rollback" >> "$GITHUB_OUTPUT"
          else
            echo "IMAGE_TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "MODE=build" >> "$GITHUB_OUTPUT"
          fi

      # 登录实现**唯一一份** = `scripts/acr_login.sh`（issue #6526 A）：重试 3 次 / 每次有
      # `timeout` 上界 / 退避 5s·10s / 密码走 `--password-stdin`（一个字节都不进 docker 的 argv）。
      # 🔴 本调用点**不承重**（无 `--fatal`）：C′（issue #5814）之后 CI 不构建、不推 ACR
      #    （自证步见本文件上面的 `Assert server-side build (no ACR push)`）⇒ 登录失败只出
      #    具名 `::warning::`、**不判红**。让一个不承重的步骤否决整条腿正是 issue #6526 要治的病。
      #    重启条件（写在这里，别只写在脚本里）：**若将来恢复 CI 侧推 ACR ⇒ 加上 `--fatal`**。
      # 判据 = tests/unit_ci_workflows/test_acr_login_not_load_bearing.py（裸 `docker login` ⇒ 红；
      #        该带 `--fatal` 的腿没带 / 不该带的腿带了 ⇒ 红，两侧都是双向判据）。
      - name: Docker login ACR (retry, non-fatal)
        if: steps.tag.outputs.MODE == 'build'
        run: bash scripts/acr_login.sh ${{ env.ACR_REGISTRY }} "${{ secrets.ACR_USERNAME }}" "${{ secrets.ACR_PASSWORD }}"

      # ── 部署对账（仅 schedule 触发时生效，issue #2947）──
      # 连续快速合并时 GitHub 可能吞掉 push 触发（2026-09-05 实测 #2927 合并后
      # admin-api 未自动部署——镜像从未构建）。定时兜底：main HEAD 对应的
      # sha-<head7> 镜像已存在 → 该 commit 构建过，跳过本轮构建部署；
      # 缺失 → push 触发被吞，执行完整构建部署。
      - name: Skip if already built (schedule reconcile)
        id: sync
        # ⚠️ **改前只有 `github.event_name == 'schedule'`** ⇒ `workflow_dispatch` 这条路径
        # **整步不跑** ⇒ 重复 dispatch 的 run 照常构建 + 部署 ⇒ 占住 `deploy-<svc>` 并发锁。
        # #5078 的级联就是这么形成的（实测：run 35627484674 的 job **排队 42min** 才起跑，
        # 拿到锁时早已越过 45min 上界 ⇒ 被 `timeout-minutes` 打死；同形还有 35628449279 /
        # 35620917459 / 35627829895）。重复 dispatch 的来源是 `deploy-reconcile.yml`
        # （cron `*/20`，main HEAD 的镜像缺失就再 dispatch 一次）—— 挂住的 run 不产出镜像
        # ⇒ 每 20min 再补一次 ⇒ 队列里永远压着一个「注定被超时打死」的 run。
        # 修法（**不降门禁**）：把同一条「镜像已在 ⇒ 不必重做」的判据**扩到 workflow_dispatch**
        # ⇒ 排队的 run 拿到锁后**秒退**（打印理由），而不是白占 45min。`timeout-minutes` 兜底保留。
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          # 用 env 而不是在 run 里内联 `${{ … }}`：内联表达式在 shell 里是 `${{` 形态，
          # 本仓的执行式守卫测试要逐字渲染这段正文（见 tests/unit_ci_workflows/
          # test_deploy_churn_and_env_gate.py）⇒ 走环境变量既更安全也更好测。
          EVENT_NAME: ${{ github.event_name }}
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
          # 🔴 凭据（issue #5941）：`gh` 在 Actions 环境**不读**任何配置文件（runner 上没有
          # `gh auth login` 写下的 hosts.yml），**只认** `GH_TOKEN` ⇒ 缺它 ⇒ 本步的
          # `gh run list` 恒失败（本机复现：exit=4 + `To get started with GitHub CLI,
          # please run: gh auth login`）⇒ 跳过判据恒不可用，而 `2>/dev/null` 把失败吞成
          # 空结果 ⇒ 每次 cron 都全量重建重部署。配套 workflow 级 `permissions: actions: read`。
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          EXPECTED_TAG="sha-${GITHUB_SHA::7}"
          IMAGE="${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_NAME }}:${EXPECTED_TAG}"
          # ⚠️ **先去重、后判定镜像**的顺序很重要：`image_tag` 非空 = 人工回滚（MODE=rollback），
          # 回滚目标镜像**必然已存在** ⇒ 若先判镜像存在就 `exit 0`，会把 #4852 的显式回滚接口
          # **整条砍掉**（守卫挡死它自己的逃生口）。故回滚路径**根本不进**镜像判定。
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -z "$INPUT_IMAGE_TAG" ] \
             && docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "✅ 镜像 ${IMAGE} 已存在——main 当前 commit 已构建过"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            # workflow_dispatch + 无 image_tag + 镜像已在 ⇒ **重复 dispatch**（对账每 20min
            # 补一次，或前一个 run 已构建完）⇒ 当场退出，把并发锁让给真正要做事的 run（#5078）。
            echo "⏭️ 跳过原因（显式，非静默）：本次是 workflow_dispatch 且未指定 image_tag，"
            echo "   而 sha-${GITHUB_SHA::7} 的镜像已存在 ⇒ 该 commit 已构建过 ⇒ 判定为**重复 dispatch**"
            echo "   （来源多为 deploy-reconcile.yml 的 cron 兜底）。不再构建/部署，直接退出以释放并发锁。"
            echo "   需要**强制重新部署同一 commit**：走显式回滚接口 \`gh workflow run <deploy>.yml -f image_tag=sha-<7>\`"
            exit 0
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_IMAGE_TAG" ]; then
            echo "ℹ️ MODE=rollback（显式指定 image_tag=${INPUT_IMAGE_TAG}）⇒ 跳过「镜像已存在」去重判定，"
            echo "   照常构建/部署（#4852 的显式回滚接口必须永远可用）"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "✅ 镜像 ${IMAGE} 已存在——main 当前 commit 已构建过，跳过构建部署"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            # ── 不可恢复终态闸门（issue #5814 B/C）────────────────────────────────
            # 镜像缺失**不等于**「该补一次构建」：这个 commit 最近一次部署如果是**不可恢复的
            # 终态**（failure / cancelled / timed_out / startup_failure / action_required /
            # stale），再补一次只会**再挂一次**。
            # 事故读数（run 36582359732 的 job 109453551643，2026-09-28）：构建 1~2min 跑完，
            # 随后挂在「推 ACR」约 40min ⇒ 被 `timeout-minutes: 45` 打死 ⇒
            # conclusion=**cancelled**（**不是** failure）⇒ 旧断路器（只认 failure）不跳闸 ⇒
            # 本腿自己的 cron（20min 一轮）与 `deploy-reconcile.yml` 的 cron 各自再 dispatch
            # 一次 ⇒ 同一 commit 无限重试，每轮白占 `deploy-<svc>` 并发锁 45min
            # （`cancel-in-progress: false`）⇒ 实测 job 排队 30~42min（正常 0.1min）。
            # 判据形态 = **允许名单**（fail-closed）：只有
            #   success / skipped / neutral / 空（查不到同 sha 记录）才继续补部署，
            # **其余一切结论**（含 GitHub 将来新增的）都跳闸。为什么不用黑名单：黑名单在
            # GitHub 新增一种结论时**静默退回 fail-open** = 本 bug 原样复发（#5814 的教训）。
            #
            # ⚠️ **边界（与人工出口）**：本判据只挡「自动补部署」这一条路。**复跑**同一个 commit
            #   走 `gh workflow run <本腿>.yml --ref main` 或在 run 页面 Re-run（手动面，永远放行）；
            #   显式回滚（`-f image_tag=<tag>`）在**更早**的分支就已放行，根本不进这里（#4852 的逃生口）。
            # ⚠️ **fail-open 保留**：`gh` 查询失败 / 无记录 ⇒ is_recoverable 保持 "true" ⇒ 照旧补部署
            #   —— 本检查自己出错**绝不**停掉部署（与 deploy-reconcile 同口径）。
            # ── 跳过判据的**自证**（issue #5941）────────────────────────────────────
            # 病（实测，2026-10-02）：本查询在 runner 上**没有凭据**（workflow 级只有
            # `contents: read`、step 里也没有 `GH_TOKEN`）⇒ `gh` 未认证（本机复现：exit=4 +
            # `To get started with GitHub CLI, please run: gh auth login`），而
            # `2>/dev/null || echo "[]"` 把这层失败**整层吞掉**（实测 stderr 为空、stdout=`[]`）
            # ⇒ LAST_STATUS/LAST_CONCLUSION 恒空 ⇒ **C′ 跳过臂从未生效**：实测 run 36939400575
            # （2026-10-01T23:11:07Z，sha=3fa84ab）走的是 else 全量构建部署，而同一 sha 在
            # 19:04:47Z **已完整部署成功过一次**（该 run 的 env 块里逐字没有 GH_TOKEN，输出逐字是
            # 「最近一次同 sha 的 run 结论 = 无记录」）。
            # 修法三条，缺一不可（本段即判据的自证面，由
            # tests/unit_ci_workflows/test_deploy_skip_credential.py 逐字消费）：
            #   ① 凭据：workflow 级 `permissions: actions: read` + 本步 `env: GH_TOKEN`；
            #   ② 出声：凭据自检 + 查询 exit code + 返回条数 + **stderr 原文**一律打印；
            #   ③ fail-open 具名：查不到 ⇒ 照旧全量部署（本检查自己出错**绝不**停掉部署），
            #      但日志 + step summary 必须**具名**写出「跳过判据不可用」。
            AUTH_RC=0; AUTH_OUT=$(gh auth status 2>&1) || AUTH_RC=$?
            echo "── 跳过判据自证（issue #5941）──"
            echo "gh auth status exit=${AUTH_RC}：${AUTH_OUT%%$'\n'*}"
            QR_ERR_FILE=$(mktemp)
            QR_RC=0
            last_runs=$(gh run list --workflow "${GITHUB_WORKFLOW:-}" --branch main --limit 30 \
                          --json databaseId,headSha,conclusion,status 2>"$QR_ERR_FILE") || QR_RC=$?
            QR_ERR=$(cat "$QR_ERR_FILE"); rm -f "$QR_ERR_FILE"
            # ⚠️ `${last_runs:-[]}` 而不是 `$last_runs`：jq 对**空输入**是「零次执行 + exit 0」
            # ⇒ `|| echo 0` 兜不住 ⇒ 计数会打成空串（本机实测）。补上默认 `[]` 才是真兜底。
            RAW_ROWS=$(printf '%s' "${last_runs:-[]}" | jq -r 'if type == "array" then length else 0 end' 2>/dev/null || echo 0)
            # 排除**本轮 run 自己**：`gh run list` 把当前 in_progress 的 run 排在 `[0]`（本机
            # 现取 2026-10-02）⇒ 不排除时「取同 sha 的最新一条」永远取到**自己** ⇒ C′ 的
            # 「completed + success」恒不成立（会被下面那条「尚未跑完」闸门接住，理由却是错的）。
            # 排除后 `[0]` = 同 sha 上一条**别的** run。
            # ⚠️ 本段的**执行行**会过本仓的 `set -u` 未定义变量守卫
            # （tests/unit_ci_workflows/test_deploy_leg_run_undefined_vars.py）⇒ 不要裸引用未定义变量；
            # 注释面自 issue #5944 / PR #5947 起已 comment-aware（剥 shell 注释），注释里提到变量写法不再假红。
            last_runs=$(printf '%s' "$last_runs" | jq -c --arg rid "${GITHUB_RUN_ID:-}" \
                          'if type == "array" then [.[] | select((.databaseId // 0 | tostring) != $rid)] else . end' \
                          2>/dev/null || printf '%s' "$last_runs")
            ROWS=$(printf '%s' "${last_runs:-[]}" | jq -r 'if type == "array" then length else 0 end' 2>/dev/null || echo 0)
            echo "gh run list exit=${QR_RC} · 原始 ${RAW_ROWS} 条 · 排除本轮 run（${GITHUB_RUN_ID:-?}）后 ${ROWS} 条"
            if [ -n "$QR_ERR" ]; then
              echo "::warning::gh run list 的 stderr（issue #5941：不再被 2>/dev/null 吞掉）：${QR_ERR}"
            fi
            # 「判据可用」= 查询成功 **且** 真的拿到了记录（0 条 / jq 缺失 / 查询失败都算不可用）。
            QUERY_OK="true"
            if [ "$QR_RC" != "0" ] || [ "$ROWS" = "0" ]; then QUERY_OK="false"; fi
            last_pair=$(printf '%s' "$last_runs" | jq -r --arg s "$GITHUB_SHA" \
                          '[.[] | select(.headSha == $s)][0] | "\(.conclusion // "")|\(.status // "")"' 2>/dev/null || echo "")
            LAST_CONCLUSION=""; LAST_STATUS=""
            # ⚠️ 只有拿到**两个字段都解析出来**的形态（含 `|` 分隔符）才认这次查询 ——
            # `jq` 缺失 / 解析报错 / 输出为空 ⇒ 一律当作「查不到」⇒ 保持 fail-open（见上）。
            # 少了这道自证，`gh`/`jq` 不可用时 `LAST_STATUS` 会被 `##*|` 赋成整串 ⇒ 分支判反。
            if [[ "$last_pair" == *"|"* ]]; then
              LAST_CONCLUSION="${last_pair%%|*}"
              LAST_STATUS="${last_pair##*|}"
            fi
            is_recoverable="true"
            if [ -n "$LAST_STATUS" ] && [ "$LAST_STATUS" != "completed" ]; then
              # 同 sha 的 run 还在 queued / in_progress / waiting / requested / pending ⇒
              # 重复 dispatch 是纯 churn（concurrency 锁会让它白等）⇒ 交给在跑的那个。
              is_recoverable="false"
              LAST_CONCLUSION="status=${LAST_STATUS}（尚未跑完）"
            elif [ -n "$LAST_CONCLUSION" ]; then
              case "$LAST_CONCLUSION" in
                success | skipped | neutral) is_recoverable="true" ;;
                *) is_recoverable="false" ;;
              esac
            fi
            LAST7=$(printf '%s' "$GITHUB_SHA" | cut -c1-7)
            # ── 🔴 C′ 判据（issue #5814）：同 sha 的部署**已成功** ⇒ 该 commit 已构建部署过 ⇒ 跳过 ──
            # 病（实测 + 机器可判）：C′ 之后 CI **不再推 ACR** ⇒ 上面那条 `docker manifest inspect`
            # **恒不命中**（那一臂**保留**：将来若恢复推 ACR，判据自动复活）⇒ 若不补本臂，
            # `skip` 恒为 false ⇒ **每次 cron 都完整构建 + 完整部署** = 3 条腿 × 3 次/小时
            # = **9 次全量重部署/小时**（蓝绿预验证 + 换容器 + nginx reload + 迁移），
            # **与代码有没有改动无关**。这正是 #2935/#5078 建的「已构建 ⇒ 秒退」被悄悄取消的形态，
            # 而**没有任何东西会变红**（承重判据只桩了「结论分支」，不桩「镜像到底在不在」）。
            # 判据来源 = **同 sha 的部署 run 结论**（与下面 #5816 断路器**同一份** `gh run list`
            # ⇒ 零新增机制 / 零新增 secret）；语义正好等于改前 ACR 判据想近似的「该 commit 已部署过」。
            # ⚠️ 位置在「仍在跑」检查**之后**（未跑完的 run 由下面那条 churn 闸门挡，不归本臂）。
            # ⚠️ 本臂**生效的两个前置**（issue #5941）：① 查询有凭据（workflow 级
            #   `actions: read` + 本步 `GH_TOKEN`）② 查询结果已排除「本轮 run 自己」（见上）。
            #   缺任一条 ⇒ 这里取不到那条 success ⇒ 本臂**形同不存在**（没有任何东西会变红）。
            if [ "$LAST_STATUS" = "completed" ] && [ "$LAST_CONCLUSION" = "success" ]; then
              echo "✅ ${LAST7} 的部署**已成功**——该 commit 已构建部署过，跳过本轮构建部署"
              echo "   判据来源（issue #5814 C′）：C′ 不推 ACR ⇒ 镜像必然不在 ACR，故改看「同 sha 的 run 结论」"
              echo "   需要**强制重新部署**同一 commit：gh workflow run <本腿>.yml -f image_tag=sha-${LAST7}"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              {
                echo "## ✅ 部署腿跳过（C′ 已部署判据，issue #5814）"
                echo ""
                echo "- 服务：\`${GITHUB_WORKFLOW:-}\` · commit：\`${LAST7}\`"
                echo "- 判据：同 sha 的部署 run 结论 = \`success\`（且 status=\`completed\`）⇒ 该 commit **已构建部署过**"
                echo "- 为什么不是「镜像在 ACR」：C′ = 服务器侧构建 ⇒ **不推 ACR** ⇒ 该判据恒不成立"
                echo "- 强制重新部署：\`gh workflow run <本腿>.yml -f image_tag=sha-${LAST7}\`"
              } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
              exit 0
            fi
            if [ "$is_recoverable" != "true" ]; then
              echo "⛔ 镜像 ${IMAGE} 缺失，但 ${LAST7} 最近一次部署是**不可恢复的终态**（结论=${LAST_CONCLUSION}）——跳过本轮构建部署。"
              echo "   理由（issue #5814）：自动重试同一个坏 commit 只会**再挂一次**（挂点 = 推送到 ACR，"
              echo "   会占住 deploy-<svc> 并发锁直到 45min 超时），并让本腿的 cron 与 deploy-reconcile"
              echo "   的 cron 互相放大成无限循环。人工确认（看该 run 的日志）后复跑："
              echo "   gh workflow run <本腿>.yml --ref main"
              echo "   · 该 commit 的代码有问题 ⇒ 先修或回滚；只是镜像推送抖动 ⇒ 用上面的命令复跑"
              echo "   · 在 run 页面点 Re-run 同样放行（本判据只看「最近一次 run 的结论」）"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              {
                echo "## ⛔ 部署腿跳过（issue #5814 不可恢复终态闸门）"
                echo ""
                echo "- 服务：\`${GITHUB_WORKFLOW:-}\` · commit：\`${LAST7}\`"
                echo "- 最近一次 run 的结论：\`${LAST_CONCLUSION}\`（不在允许名单 [success, skipped, neutral, 空] 内）"
                echo "- 动作：**不补构建/部署**（自动重试坏 commit 只会再挂一次并占锁 45min）"
                echo "- 人工出口：\`gh workflow run <本腿>.yml --ref main\`（或在该 run 页面 Re-run）"
              } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            else
              echo "⚠️ 镜像 ${IMAGE} 缺失——该 commit 的部署触发可能被吞（连续快速合并），执行完整构建部署"
              echo "   （最近一次同 sha 的 run 结论 = \`${LAST_CONCLUSION:-无记录}\` ⇒ 在允许名单内，可安全重试）"
              if [ "$QUERY_OK" != "true" ]; then
                # 🔴 fail-open 的**具名**出口（issue #5941 判据 3）：查不到 ⇒ 照旧全量部署，
                # 但要说清「是判据不可用，不是判据说该部署」——静默正是本单的病。
                echo "::warning::跳过判据**不可用**（gh run list exit=${QR_RC}，返回 ${ROWS} 条，stderr 见上）⇒ **本轮全量部署**（fail-open：本检查自己出错绝不停掉部署）"
                {
                  echo "## ⚠️ 部署腿未跳过（跳过判据不可用 ⇒ fail-open，issue #5941）"
                  echo ""
                  echo "- 服务：\`${GITHUB_WORKFLOW:-}\` · commit：\`${GITHUB_SHA::7}\`"
                  echo "- \`gh auth status\` exit=\`${AUTH_RC}\`；\`gh run list\` exit=\`${QR_RC}\`；返回 \`${ROWS}\` 条"
                  echo "- 语义：**跳过判据不可用 ≠ 判据说该部署** —— 按现状口径（fail-open）本轮照旧全量构建部署"
                  echo "- 排查入口：\`gh run list --workflow ${GITHUB_WORKFLOW:-} --branch main --limit 5\`"
                } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
              fi
              echo "skip=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Set up JDK 21
        if: steps.tag.outputs.MODE == 'build' && steps.sync.outputs.skip != 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run unit tests
        if: steps.tag.outputs.MODE == 'build' && steps.sync.outputs.skip != 'true'
        working-directory: backend/admin-api
        run: ./mvnw test -q

      # ── C′ 服务器侧构建（issue #5814）：CI **不再构建、不再推 ACR** ──────────────
      # 用户 2026-09-30 裁定 C′（服务器侧构建），推翻旧铁律「构建跑在 CI，服务器只拉预构建产物」。
      # 根因：从境外 GitHub 托管 runner 跨境推大镜像到阿里云 ACR 会**无上界地挂住**
      # （实测 `Build and push` 步 32 样本双峰：2~4min 健康 vs 11.7~43.4min 病态，中位 37.6~40.2min，
      #  被 `timeout-minutes` 打死 ⇒ `cancelled`；失败率随体积单调上升）。
      # 现在：CI 只把源码（经既有 codeload 通道）与驱动参数送到服务器，由 **deploy.sh 在它自己的
      # flock 之内**就地 `docker build` + `docker compose up` ⇒ **根本不推 ACR** ⇒ 该根因结构性消失。
      # 实测：冷构建 1782s／**只改源码 2s**（层全 CACHED）／内存峰值 1792MB／磁盘每次净增约 1GB。
      # ⚠️ 本步**保留**一个显式自证：确认确实没有走推送路径（防将来有人把推送悄悄加回来）。
      - name: Assert server-side build (no ACR push)
        if: steps.tag.outputs.MODE == 'build' && steps.sync.outputs.skip != 'true'
        # ⚠️ 必须走 env 而不是在 run 正文里内联 `${{ … }}`：本仓的执行式守卫测试会**逐字渲染** run 正文
        # （内联表达式渲染后是未展开的 `${{` 形态 ⇒ 既不可读也不好测）。
        # 🔴 2026-09-30 修：原实现直接在正文里写 `${IMAGE_TAG}`，而该变量**只**在 `steps.tag.outputs` 里、
        # **不是** env ⇒ 配上 `set -euo pipefail` 当场 `unbound variable` ⇒ **三条腿的部署全部被这一步挡住**
        # （实测 run 36696120883 的 `Assert server-side build (no ACR push)` 红；判据只查文本、没人真跑过这步）。
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.IMAGE_TAG }}
        run: |
          set -euo pipefail
          echo "构建位置 = **SWAS 服务器侧**（issue #5814 C′）；CI 不构建、不推 ACR。"
          echo "镜像由 deploy/swas/deploy.sh 在服务器 flock 之内产出，tag=${IMAGE_TAG}。"

      # ── 构建身份的解算（issue #6951）──────────────────────────────────────────────
      # 「线上跑的是哪个 build」必须可判读 ⇒ 需要三个**部署期真值**交给服务器侧构建
      # （`deploy/swas/deploy.sh` 的 `_build_args` ⇒ `backend/admin-api/Dockerfile` 的
      #  `MIGAO_BUILD_SHA` 等 ARG ⇒ `/api/version`）。这里只**解算**，不部署、不联网。
      # 🔴 真值来源（都不是运行时现算）：`git rev-parse HEAD` = **本 run 检出的那个 commit**
      #    （回滚腿 `--ref refs/tags/<tag>` 时它也正好是回滚目标的 commit —— 比 `GITHUB_SHA` 正确：
      #     后者在 tag ref 下是**该 tag 指向的提交**，而在某些 dispatch 形态下会是 main 的 HEAD）；
      #    `BUILT_AT` = **runner 时钟**（本步 `date -u` 现算 —— 部署期时钟；容器里没有 `.git` 也就没法现算）。
      #    🔴 **两代错法都实测踩过**（issue #7015 → #7029），别再"猜名字"：
      #    ① 改前写 `${GITHUB_RUN_STARTED_AT:-}` —— 它**不是** GitHub 注入的环境变量；
      #    ② #7016 改成 context `${{ github.run_started_at }}` —— 该属性**也不存在**
      #       （官方 `github` 上下文属性表 40 个里没有它）⇒ 两次都静默解成**空串**。
      #    ⇒ 现行取值源 = **runner 时钟**；本步**没有** step 级 `env:`（见下面的取值源注释）。
      #    ⇒ shell 展开**恒为空串** ⇒ 真机读数逐字 `{"app":"admin-api","sha":"b5d9315e…","builtAt":""}`
      #    （`sha` 那半边已兑现、`builtAt` 这半边恒空）。未定义的取值源**没有任何东西会红**，所以它活了很久。
      # ⚠️ 输出只在**真的要部署**时给（`skip != 'true'`）⇒ 跳过档不会因为「解算失败」被误判红。
      - name: "Resolve build identity (issue #6951)"
        id: build_id
        if: steps.sync.outputs.skip != 'true'
        # 🔴 **别再"猜名字"**（两条都实测踩过，issue #7015 → #7029）：改前读 `${GITHUB_RUN_STARTED_AT:-}`
        # —— 它**不是** GitHub 注入的环境变量；#7016 改成 context `${{ github.run_started_at }}`
        # —— 它**也不存在**（官方 `github` 上下文属性表 40 个里没有 `run_started_at`）⇒ 取值仍是空串。
        # ⇒ 本步的取值源 = **runner 时钟**（`date -u`，在 run 正文里现算，不经过任何变量名）。
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          case "$SHA" in
            *[!0-9a-f]*|"") echo "::error::git rev-parse HEAD 解不出 hex sha（'$SHA'）⇒ 拒绝在身份不明时构建"; exit 1 ;;
          esac
          # 取值源 = **runner 时钟**（issue #7029）：不走任何变量名，所以本步**没有** step 级 `env:`。
          # 🔴 自检必须**点名当前来源**并校验形态：空 / 形态不符 ⇒ 具名判红，
          # 不许静默写下空串（那是 issue #7015 的形态：全链路没有一物会红）。
          BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          if [ -z "$BUILT_AT" ]; then
            echo "::error::BUILT_AT 为空 ⇒ 取值源未接（issue #7015 / #7029）：当前取值源 = runner 时钟 [date -u +%Y-%m-%dT%H:%M:%SZ]；不许用未定义的环境变量名，也不许用猜的 context 属性名"
            exit 1
          fi
          case "$BUILT_AT" in
            [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]T[0-9][0-9]:[0-9][0-9]:[0-9][0-9]Z) : ;;
            *) echo "::error::BUILT_AT 不是 ISO8601 形态（实测 '$BUILT_AT'）⇒ 取值源 = runner 时钟 [date -u +%Y-%m-%dT%H:%M:%SZ]；消费方（Dockerfile 烘焙 + served 探针）按 ISO8601 判读"
               exit 1 ;;
          esac
          echo "BUILD_SHA=$SHA" >> "$GITHUB_OUTPUT"
          echo "BUILT_AT=${BUILT_AT}" >> "$GITHUB_OUTPUT"
          echo "构建身份：sha=${SHA} · tag=${{ steps.tag.outputs.IMAGE_TAG }} · builtAt=${BUILT_AT}"
          {
            echo "## 构建身份（issue #6951）"
            echo ""
            echo "- \`sha\` = \`${SHA}\`（\`git rev-parse HEAD\` = 本 run 检出的 commit）"
            echo "- \`tag\` = \`${{ steps.tag.outputs.IMAGE_TAG }}\`"
            echo "- \`builtAt\` = \`${BUILT_AT}\`（取值源 = runner 时钟 \`date -u\`，issue #7029）"
            echo "- 消费面：\`GET https://api.migaozn.com/api/version\`（部署后由下面的 served-version 断言比对）"
          } >> "$GITHUB_STEP_SUMMARY"

      # 自动部署目标 = 测试环境（当前 SWAS）；生产发布走 deploy-prod（未来）
      - name: Deploy to SWAS (测试环境)
        if: steps.sync.outputs.skip != 'true'
        env:
          ACR_U: ${{ secrets.ACR_USERNAME }}
          ACR_P: ${{ secrets.ACR_PASSWORD }}
          IMAGE_TAG: ${{ steps.tag.outputs.IMAGE_TAG }}
          # 构建身份（issue #6951）⇒ `deploy/swas/deploy.sh` 把它转成 `--build-arg` 烘焙进镜像。
          # 🔴 **第 5 跳（本单的病根）**：这三个值必须**过 `swas-deploy-ci.sh` 的参数面**到远端
          # —— 构建发生在**服务器上**（见上面的 `Assert server-side build (no ACR push)`），
          # 这里的 `env:` 只在 runner 上生效；驱动脚本若不转发 ⇒ 远端 `deploy.sh` 读到空串
          # ⇒ 真机读数逐字为 `{"app":"admin-api","sha":"","tag":"sha-bab9538","builtAt":""}`
          # （其中 `tag` 有值 = 远端 `MIGAO_BUILD_TAG` 回落 `${TAG}` 所赐，**不是**这三个 env 送达的）。
          # 故**逐个位置参数**显式传（`$9`/`$10`）—— 接线在调用点可见，且判据能把它钉住。
          BUILD_SHA: ${{ steps.build_id.outputs.BUILD_SHA }}
          BUILD_TAG: ${{ steps.tag.outputs.IMAGE_TAG }}
          BUILT_AT: ${{ steps.build_id.outputs.BUILT_AT }}
          # 显式降级许可（issue #4852 ②）：`workflow_dispatch -f image_tag=<tag>`（MODE=rollback）
          # 是**人工回滚接口** ⇒ 只有这条路径给 1，其余（push / schedule 构建部署）恒 0
          # ⇒ 远端闸门「target 是当前在跑 tag 的祖先就跳过该服务」对普通部署生效、对显式回滚放行。
          ALLOW_DOWNGRADE: ${{ steps.tag.outputs.MODE == 'rollback' && '1' || '0' }}
        run: |
          bash deploy/scripts/swas-deploy-ci.sh \
            ${{ env.SWAS_INSTANCE_ID }} ${{ env.SWAS_REGION }} "$AK" "$SK" "$ACR_U" "$ACR_P" "$IMAGE_TAG" \
            admin-api "$BUILD_SHA" "$BUILT_AT"

      # ── 「跳过部署」的运行面自证（issue #6294，判据 1）────────────────────────────
      # 病：上面 `Skip if already built` 判「已部署」**只看 run 结论**（镜像在 ACR / 同 sha 结论 success）
      # ⇒ 「跳过」那条路径上 `Deploy to SWAS` 整段 skipped，而 **run 结论 = success**；
      # 对账侧（`deploy-reconcile.yml`）的断路器把 `success` 放进允许名单 ⇒ 不再补部署 ⇒
      # 环境停摆而台账全绿（现场：SWAS 在跑 `admin-web:sha-877ac15`，main HEAD `9d82e2e60`）。
      # 出口 = 在**跳过**时读一次**运行面**（远端在跑 tag），与目标 tag 比较：不一致 ⇒ 具名判红。
      # ⚠️ 判红**不**顺手补部署：那是断路器（#4767 ③ / #5814 B）要防的 churn；本步只把事实变成可归因的红。
      # 判据 = tests/unit_ci_workflows/test_deploy_skip_is_not_success.py（含类级元守卫：
      # 任何带 `Skip if already built` 的腿漏接本步 ⇒ 未接线即红）。
      - name: "Assert running tag == target (skip 不得冒充已部署，issue #6294)"
        if: always() && steps.sync.outputs.skip == 'true'
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.IMAGE_TAG }}
        run: |
          set -euo pipefail
          bash deploy/scripts/swas_deploy_running_tag.sh \
            ${{ env.SWAS_INSTANCE_ID }} ${{ env.SWAS_REGION }} "$AK" "$SK" "$IMAGE_TAG" admin-api

      # ══════════════════════════════════════════════════════════════════════════
      # 判据换芯（issue #6951）：**线上探到的 sha == 本次部署的 sha**
      #
      # 病（现取）：本腿此前亮的是「**产物存在**」—— `Skip if already built` 只看
      # 「镜像在不在 ACR / 同 sha 的 run 结论是不是 success」；#6746 实测「只跑 22 秒也报 success」，
      # #6554 实测「断言说在跑 tag 046298d，而线上前端实际停在 03b1132」。⇒「推了」不等于「线上是它」。
      #
      # 判据形态（照抄同族 `deploy/scripts/worker-h5-verify-served.sh` 的判别力口径）：
      # 部署后探**线上真正响应的** `GET /api/version`（nginx 已放行的 `/api/` 前缀，**不新增放行面**），
      # 把它的 `sha` 与本次目标 sha 逐字符比前 7 位 —— 不一致 ⇒ **具名判红**（探到什么 / 期望什么 /
      # 可复制复算命令，三件都在脚本输出里）；取不到 ⇒ 退 **3**（fail-closed，**不当绿**）。
      # 实现体只有一份 = `deploy/scripts/served-version-verify.sh`（三条腿将来共用同一份，不复制）。
      #
      # 两条路径都要走：
      #  · `skip != 'true'`（push / rollback / schedule 真部署）⇒ 这是**本轮部署后**的最终判据；
      #  · `skip == 'true'`（schedule / 重复 dispatch 的兜底档）⇒ 本轮**没部署**，但探针仍要跑：
      #    它把「**本轮未部署**（线上已验证 == 目标）」与「**部署了但没验证**」在读数上分开 ——
      #    改前这两者都表现为 `success + skipped`（issue #6951 第 2 条判据逐字要求分开）。
      #    ⚠️ 与上面 #6294 那条不重复：那条读的是**容器在跑的 tag**（SWAS 控制面），
      #    本条读的是**服务端真正响应的内容**（HTTP 面）—— 两者都可以对而线上仍是旧代码
      #    （#6554 的形态：green 残留容器 / 镜像 tag 与进程真身脱钩）。
      #
      # ⚠️ 期望 sha 取 `${GITHUB_SHA}`：这就是本次部署的 commit
      #    （镜像 tag `sha-${GITHUB_SHA::7}` 也由它派生，两侧同源）。
      # 判据 = tests/unit_ci_workflows/test_served_version_verify.py
      # ══════════════════════════════════════════════════════════════════════════
      - name: "Assert served sha == deployed sha (线上就是本次构建，issue #6951)"
        if: always()
        env:
          EXPECTED_SHA: ${{ github.sha }}
          SKIPPED: ${{ steps.sync.outputs.skip }}
          # 构建身份是**三个字段**（#6951）：只判 `sha` 会让 `builtAt` 退化成恒真的空断言
          # （issue #7015 实测：`sha` 对、`builtAt` 恒空，而全链路无一物变红）⇒ 显式要求判它。
          SERVED_VERSION_REQUIRE_BUILT_AT: '1'
        run: |
          set -uo pipefail
          if [ "${SKIPPED:-}" = "true" ]; then
            echo "ℹ️ 本轮**未部署**（\`Skip if already built\` 判 skip=true）⇒ 下面的探针是**只读自证**："
            echo "   它证「线上现在跑的就是 ${GITHUB_SHA::7}」（= 另一次已成功的部署留下的），"
            echo "   **不是**「本轮做了什么」。两者在读数上从此分得开（issue #6951 判据 2）。"
          else
            echo "本轮**已部署** ${GITHUB_SHA::7} ⇒ 下面这条断言就是本腿的最终判据（线上 sha == 本次 sha）。"
          fi
          set +e
          bash deploy/scripts/served-version-verify.sh \
            'https://api.migaozn.com' "${EXPECTED_SHA:-}"
          rc=$?
          set -e
          # 三态原样透传（0 一致 / 1 不一致 或 `builtAt` 为空 / 3 探不到 fail-closed）—— 不做任何"归一化"，
          # 否则 3 会被悄悄读成绿（那正是 issue #6951 要治的假绿形态）。
          if [ "$rc" -ne 0 ]; then
            echo "::error::线上版本自证未通过（exit=${rc}）⇒ 本腿判红：这次部署的「产物存在 / run 结论 success」**不等于**「线上是它」"
            exit "$rc"
          fi

      # ══════════════════════════════════════════════════════════════════════════
      # 线上**安全响应头**判据（issue #8197 P1-08 / P1-09）
      #
      # 为什么挂在**这一条**腿（而不是新开 schedule）：
      #   · 本腿的 `on.push.paths` 同时覆盖 `backend/admin-api/**`（= P1-08 的
      #     `server.forward-headers-strategy`）**与** `deploy/swas/**`（= P1-09 的 nginx.conf）
      #     —— 见该 workflow 头部「只改配置也必须触发一次部署」那一段；而**应用配置的只有部署腿**
      #     （`deploy.sh` 的 `cp nginx.conf` + reload）。⇒ 「改了哪一面就有哪一面的判据」对得上。
      #   · 它是**部署后**探针（与本 job 上面那条 served-sha 断言同位置）⇒ 不会出现
      #     「合并了就判红、而部署还没跑完」的假红。⛔ 不新增 schedule（铁律 10）。
      #
      # 判据本体只有一份 = `deploy/scripts/prod-security-headers.sh`（**只读**，0/1/3 三态）。
      # 红证（改前线上读数，2026-10-31）：7 个面**全部**缺头（api 缺 STS；/w/ /b/ 连 nosniff 与 CSP
      # 都没有）⇒ rc=1。绿 = 同一命令 rc=0（见该脚本输出的 `PROD-HEADERS-SUMMARY rc=0`）。
      # 判据 / 接线守卫 = tests/unit_ci_workflows/test_prod_security_headers.py
      # ══════════════════════════════════════════════════════════════════════════
      - name: "Assert production security headers (HSTS / nosniff / CSP，issue #8197 P1-08/P1-09)"
        if: always()
        run: |
          set -uo pipefail
          if [ ! -f deploy/scripts/prod-security-headers.sh ]; then
            echo "::error::判据本体 deploy/scripts/prod-security-headers.sh 不在检出里（安全头判据被拆掉）⇒ 视为无法判定，判红"
            exit 1
          fi
          set +e
          bash deploy/scripts/prod-security-headers.sh
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::线上安全响应头未达标（exit=${rc}）—— 1=确定缺头 / 3=无法判定（3 不得当 0 读）；复算：bash deploy/scripts/prod-security-headers.sh"
            exit "$rc"
          fi

      # schedule 兜底档的「没跑冒烟」必须**出声**（issue #6951 第 2 条判据）：
      # 冒烟 job 的新条件是 `github.event_name != 'schedule' || deployed == 'true'`（见下方 smoke-test）
      # ⇒ **schedule + 未发生实际同步**时，`Post-Deploy Smoke Test` 整段 skipped，
      # 而本 run 仍然是 `success` ⇒ 读 run 列表的人会把它读成「已验证」（改前形态）。
      # ⚠️ 本步**不改**冒烟的条件（铁律：不削弱任何既有门禁；这里也不新增成本）；
      #    它只把「本轮没跑冒烟」变成 run 日志/注解里**可见**的一行 + 具名出口。
      - name: "Declare smoke verification state (schedule 兜底档，issue #6951)"
        if: always()
        env:
          SKIPPED: ${{ steps.sync.outputs.skip }}
        run: |
          set -uo pipefail
          if [ "${SKIPPED:-}" = "true" ]; then
            echo "::notice::本轮**未部署**（schedule / 重复 dispatch 兜底档）⇒ **未跑 Post-Deploy Smoke Test**；"
            echo "          本 run 的线上验证**只有**上一步的只读版本自证（served sha == ${GITHUB_SHA::7}）。"
            echo "          语义区分：『本轮未部署、且线上已验证 == 目标』≠『本轮部署了但没验证』。"
            echo "          要跑冒烟：\`gh workflow run deploy-admin-api.yml --ref main\`（或在该 run 页面 Re-run）。"
            {
              echo "## ⚠️ 本轮未部署 ⇒ 未跑冒烟（issue #6951）"
              echo ""
              echo "- 判据：\`Skip if already built (schedule reconcile)\` = \`skip=true\`（该 commit 已构建部署过）"
              echo "- 因此 \`Post-Deploy Smoke Test\` **整段 skipped**，本 run 的 \`success\` **不含**冒烟验证"
              echo "- 本 run 实际做过的验证 = 上一步的**只读**版本自证（\`served sha == ${GITHUB_SHA::7}\`）"
              echo "- 要跑冒烟：\`gh workflow run deploy-admin-api.yml --ref main\`"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "本轮**已部署** ⇒ \`Post-Deploy Smoke Test\` 按既有条件正常跑（不在本步射程内）。"
          fi
  smoke-test:
    name: Post-Deploy Smoke Test
    needs: build-and-deploy
    # 语义（issue #6951 订正）：`deployed` 此前逐字写成 `steps.sync.outputs.skip` ——
    # **名字与含义相反**：条件是 `deployed == 'false'`，而它实际表达的是「**没跳过** ⇒ 本轮真的部署了」。
    # 现在把 output 订正为 `skip != 'true'`（真的部署了 ⇒ true；本轮未部署 ⇒ false），条件随之改成 `== 'true'`。
    # 行为不变（两处同时翻转 ⇒ 同一条判定），但**读数不再自相矛盾**：`deployed=false` 现在真的意味着
    # 「本轮没部署」（schedule 兜底档）⇒ 与上面那条「未部署必须出声」的声明步语义一致。
    # ⚠️ 未固化项：`deploy-frontend.yml` / `deploy-ai-agent-service.yml` 两腿**仍是旧写法**
    #（同形、同错），本单只改了 admin-api 这条腿 —— 见 PR body 的「未固化项」。
    # 本轮**未部署** ⇒ 不跑冒烟（不新增成本）；跑了什么/没跑什么由上面的声明步**显式**打出来。
    if: github.event_name != 'schedule' || needs.build-and-deploy.outputs.deployed == 'true'
    uses: ./.github/workflows/smoke-test.yml
    with:
      admin_api_url: 'https://api.migaozn.com'
      ai_agent_url: 'https://ai-api.migaozn.com'
    secrets:
      SMOKE_ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}
      SMOKE_SERVICE_TOKEN: ${{ secrets.SMOKE_SERVICE_TOKEN }}
