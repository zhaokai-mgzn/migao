name: Build and Deploy admin-api

on:
  push:
    branches:
      - main
    paths:
      - 'backend/admin-api/**'
  workflow_dispatch:  # 支持手动触发

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # 部署目标：SWAS 轻量应用服务器（2026-08-14 起替代 SAE）
  SWAS_INSTANCE_ID: b23c69e599524b1da719734f72e6a0e3
  SWAS_REGION: cn-hangzhou

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    concurrency:
      group: deploy-admin-api
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run unit tests
        working-directory: backend/admin-api
        run: ./mvnw test -q

      - name: Build admin-api with Maven
        working-directory: backend/admin-api
        run: |
          ./mvnw clean package -DskipTests
          # 定位产物 JAR（兼容版本号变更）
          JAR_FILE=$(ls target/admin-api-*.jar | grep -v sources | grep -v javadoc | head -n 1)
          if [ -z "$JAR_FILE" ]; then
            echo "❌ 未找到构建产物 JAR"
            ls -la target/
            exit 1
          fi
          echo "✅ 构建成功：$JAR_FILE"
          echo "JAR_FILE=backend/admin-api/$JAR_FILE" >> $GITHUB_ENV

      - name: Deploy to SWAS
        env:
          AK: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          SK: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
        run: |
          curl -fsSL https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz -o /tmp/aliyun.tgz
          tar xzf /tmp/aliyun.tgz -C /tmp
          sudo mv /tmp/aliyun /usr/local/bin/
          aliyun configure set --access-key-id "$AK" --access-key-secret "$SK" --region ${{ env.SWAS_REGION }}
          # 触发 SWAS 云助手执行 deploy.sh(拉源码 -> 构建 -> compose 启动 -> 健康检查)
          aliyun plugin install --names aliyun-cli-swas-open >/dev/null 2>&1 || true
          INVOKE=$(aliyun swas-open RunCommand \
            --InstanceId ${{ env.SWAS_INSTANCE_ID }} \
            --Name migao-ci-deploy \
            --Type RunShellScript \
            --Timeout 1800 \
            --RegionId ${{ env.SWAS_REGION }} \
            --CommandContent "bash /opt/migao-deploy/deploy.sh" 2>&1)
          INVOKE_ID=$(echo "$INVOKE" | python3 -c "import sys,json;print(json.load(sys.stdin).get('InvokeId',''))")
          echo "deploy invokeId=$INVOKE_ID"
          if [ -z "$INVOKE_ID" ]; then echo "FAILED: no InvokeId"; echo "$INVOKE"; exit 1; fi
          for i in $(seq 1 90); do
            RES=$(aliyun swas-open DescribeInvocationResult \
              --InstanceId ${{ env.SWAS_INSTANCE_ID }} \
              --InvokeId "$INVOKE_ID" \
              --RegionId ${{ env.SWAS_REGION }})
            STATUS=$(echo "$RES" | python3 -c "import sys,json;d=json.load(sys.stdin);v=d.get('InvocationResult') or d;print(v.get('InvocationStatus') or v.get('Status') or '')")
            echo "  deploy status: $STATUS"
            if [ "$STATUS" = "Success" ]; then echo "SWAS 部署成功"; break; fi
            if [ "$STATUS" = "Failed" ]; then echo "FAILED: SWAS 部署失败"; echo "$RES" | head -c 1500; exit 1; fi
            sleep 20
          done
  smoke-test:
    name: Post-Deploy Smoke Test
    needs: build-and-deploy
    uses: ./.github/workflows/smoke-test.yml
    with:
      admin_api_url: 'https://api.migaozn.com'
      ai_agent_url: 'https://ai-api.migaozn.com'
    secrets:
      SMOKE_ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}
      SMOKE_SERVICE_TOKEN: ${{ secrets.SMOKE_SERVICE_TOKEN }}
