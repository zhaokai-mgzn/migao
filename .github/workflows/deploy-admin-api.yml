name: Build and Deploy admin-api

on:
  push:
    branches:
      - main
    paths:
      - 'backend/admin-api/**'
  workflow_dispatch:  # 支持手动触发

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # 部署目标：SWAS 轻量应用服务器（2026-08-14 起替代 SAE）
  SWAS_INSTANCE_ID: b23c69e599524b1da719734f72e6a0e3
  SWAS_REGION: cn-hangzhou
  # 快速部署：CI 构建镜像 → ACR → 服务器 pull（不再源码构建）
  ACR_REGISTRY: crpi-qdcgkzwx9p9zckga.cn-hangzhou.personal.cr.aliyuncs.com
  ACR_NAMESPACE: ai-customer-service
  IMAGE_NAME: admin-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    concurrency:
      group: deploy-admin-api
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: echo "IMAGE_TAG=v$(date +%Y%m%d%H%M%S)" >> $GITHUB_OUTPUT

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run unit tests
        working-directory: backend/admin-api
        run: ./mvnw test -q

      - name: Build and push Docker image
        working-directory: backend/admin-api
        run: |
          IMG=${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_NAME }}
          echo "${{ secrets.ACR_PASSWORD }}" | docker login ${{ env.ACR_REGISTRY }} -u ${{ secrets.ACR_USERNAME }} --password-stdin
          docker build \
            -t $IMG:${{ steps.tag.outputs.IMAGE_TAG }} \
            -t $IMG:latest \
            .
          docker push $IMG:${{ steps.tag.outputs.IMAGE_TAG }}
          docker push $IMG:latest

      - name: Deploy to SWAS
        env:
          AK: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          SK: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
          ACR_U: ${{ secrets.ACR_USERNAME }}
          ACR_P: ${{ secrets.ACR_PASSWORD }}
        run: |
          bash deploy/scripts/swas-deploy-ci.sh \
            ${{ env.SWAS_INSTANCE_ID }} ${{ env.SWAS_REGION }} "$AK" "$SK" "$ACR_U" "$ACR_P"
  smoke-test:
    name: Post-Deploy Smoke Test
    needs: build-and-deploy
    uses: ./.github/workflows/smoke-test.yml
    with:
      admin_api_url: 'https://api.migaozn.com'
      ai_agent_url: 'https://ai-api.migaozn.com'
    secrets:
      SMOKE_ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}
      SMOKE_SERVICE_TOKEN: ${{ secrets.SMOKE_SERVICE_TOKEN }}
