name: Publish bmini h5 (app.migaozn.com/b/)

# ── 为什么需要这条腿（issue #5668）─────────────────────────────────────────────
# `frontend/bmini-app` 的 h5 产物（用户 2026-09-26 裁定「暂时只做 H5 浏览器访问」⇒
# **h5 就是唯一用户可达形态**）此前**没有任何部署通路**：
#   · `grep -rln bmini .github/workflows/ deploy/` 只命中 CI（typecheck + 单测 + 构建，**不发布**）；
#   · `grep -n bmini deploy/swas/nginx.conf` = **0 命中**。
# ⇒ 功能全做完，浏览器里也打不开。本 workflow 把它真正发布到 `app.migaozn.com/b/`，
#   并在发布后做**身份 + 不串端**断言（`deploy/scripts/bmini-h5-verify-served.sh`）。
#
# ── 为什么不复用工人端那条腿（#4837 的 `worker-h5-publish.yml`）──
# 形状不同：工人端是**零依赖零构建**的纯 ESM 目录（发布 = 逐字拷贝源码），
# 而 bmini 是 **Taro 构建产物**，且必须按 `/b/` 前缀构建（`h5.publicPath`）——
# 否则产物引用根级 `/js/app.js`，那是 **C 端的包**（实测两端资源同名同路径）。
# ⚠️ 那条腿**线上在跑**（`/w/` 报工面），本单**新增**一条，绝不改它的语义。
#
# ── 产物怎么从 CI 到实例（`deploy/bmini-h5/Dockerfile` 里有完整理由）──
# 实例上没有 node 工具链 ⇒ 产物必须在 CI 构建；CI → 实例的既有通道只有 RunCommand（命令体 64KB，
# 装不下 ~1.3MB 产物）与 **ACR 镜像**（实例已在用）⇒ 用一个只装 `/dist` 的**传输镜像**搬运，
# 远端 `docker cp` 取出来 ⇒ **线上字节 == CI 构建字节**（身份断言才成立）。
#
# ⚠️ 触发面只有 `push: main` 与 `workflow_dispatch` —— **刻意不加 `pull_request`**：
#    这条腿写的是**线上静态根**，PR 分流内容不该有机会落上去（与工人端那条腿同口径）。
#    也因此不产生 required check「Waiting」问题，且**不属于** `declaration_gate_registry.json`
#    的登记面（那里登记的是"会被路径门控的 PR 门禁"）。
on:
  push:
    branches: [main]
    paths:
      # 被测发布物本身（改了 h5 不发布 ⇒ 线上落后，正是本单要治的形态）
      - 'frontend/bmini-app/**'
      # 发布链路自身：改了任何一环都要重跑，否则「改坏了没有证据」
      - 'deploy/bmini-h5/**'
      - 'deploy/swas/bmini-h5-publish-remote.sh'
      # nginx 配置：`/b/` 的 fallback 就在这份文件里（改了它必须重新自证「不串端」）
      - 'deploy/swas/nginx.conf'
      - 'deploy/scripts/bmini-h5-publish-ci.sh'
      - 'deploy/scripts/bmini-h5-verify-served.sh'
      - '.github/workflows/bmini-h5-publish.yml'
  # 人工补发/排障入口（合并后 main 上的版本才可 dispatch）
  workflow_dispatch:
  # ── 兜底触发面（issue #5707 的 FM-E17 收口；用户裁定 = 方案 A）────────────────
  # 为什么必须补：本仓的 `push` **是被吞的** —— auto-merge 用 `GITHUB_TOKEN` 合并 ⇒ push run
  # 不再触发 workflow（现取 2026-09-27：`gh run list --branch main --event push --limit 200`
  # 去重 43 个 sha，而最近 40 个 main commit 里只有 1 个在其中 ⇒ **39/40 零 push run**）。
  # 而这条腿写的是**线上静态根**（`/b/`）⇒ 合并后会**静默停在旧产物**（无红无告警；
  # 实测两次都靠人工 `workflow_dispatch` 才补上）。`workflow_dispatch` 是**手动面、不算兜底**。
  # 为什么是**每日**而不是高频：现取实测 cron 节流 —— `*/20`（名义 72 次/日）实得 6.3 次/日
  # （8.4%，相邻间隔中位 244 / 最大 357 分钟），而**每日**档（`37 20 * * *` / `17 19 * * *`）
  # 的中位间隔都是 ≈24.0h ⇒ 每日档未被节流。18:23 / 18:43 UTC = 02:23 / 02:43 +08，
  # 错开本仓 19:00~21:00 UTC 的每日守护簇，且两条腿相隔 20 分钟以免抢同一批 CI 分钟。
  # 幂等与内容正确性（照实说明，不是承诺）：`actions/checkout` 无 `ref` ⇒ schedule 取**默认分支
  # HEAD**（= main HEAD，正是线上应有的状态）；远端发布脚本先建 stage 再整份覆盖、
  # **不对静态根做清空** ⇒ 重复发布同一份产物只是同样的字节再覆盖一次。
  # 判据 = tests/unit_ci_workflows/test_publish_leg_fallback_surface.py + 登记表
  # `tests/unit_ci_workflows/publish_leg_fallback_ledger.json`（删掉这个面 / 换成手动面 ⇒ 红）。
  schedule:
    - cron: '43 18 * * *'

permissions:
  contents: read

# 与 deploy-* 同口径：不取消进行中的发布（两个并发发布会让「谁最后落地」不可判定）
concurrency:
  group: bmini-h5-publish
  cancel-in-progress: false

env:
  # 与 deploy-frontend.yml / deploy-admin-api.yml 同一台 SWAS 实例（测试环境）
  SWAS_INSTANCE_ID: b23c69e599524b1da719734f72e6a0e3
  SWAS_REGION: cn-hangzhou
  # 静态根（= deploy/swas/nginx.conf 里 app.migaozn.com 的 root）；**只收敛其 b/ 子树**
  H5_STATIC_ROOT: /opt/migao-deploy/h5
  H5_SUBDIR: b
  # 传输镜像的仓库（与 deploy-frontend.yml 同域同命名空间 ⇒ 不新增任何 secret）
  ACR_REGISTRY: crpi-qdcgkzwx9p9zckga.cn-hangzhou.personal.cr.aliyuncs.com
  ACR_NAMESPACE: ai-customer-service
  IMAGE_NAME: bmini-h5
  # 构建期变量（见 frontend/bmini-app/config/index.ts）：落在 /b/ ⇒ 资源前缀必须也是 /b/
  TARO_APP_H5_PUBLIC_PATH: /b/
  # 🔴 API 面必须与**落地面同源**（issue #5721，实测踩过）：
  #    app.migaozn.com 的 nginx 已把 `/api/` 代理到 admin-api、`/api/chat/` 代理到 ai-agent
  #    （deploy/swas/nginx.conf），工人端 `/w/` 正是靠这个同源面工作 —— 同源 ⇒ **完全不经过 CORS**。
  #    反面教材：这里曾注入跨域 `https://api.migaozn.com`，而 admin-api 的 CORS 白名单
  #    （backend/admin-api/src/main/java/com/migao/admin/security/SecurityConfig.java）不含
  #    `https://app.migaozn.com`、也不含前端发的 `X-Client-Type` 头 ⇒ 预检 403 `Invalid CORS request`
  #    ⇒ 浏览器侧所有请求 net::ERR_FAILED，登录页只显示 `Load failed`（Safari）/`Failed to fetch`（Chrome）
  #    —— 服务端日志里**一条记录都没有**（请求根本没发出去），极易被误判成"后端挂了"。
  #    判据 = tests/unit_ci_workflows/test_bmini_h5_delivery_contract.py（改成跨域即红）。
  TARO_APP_API_URL: https://app.migaozn.com
  # AI 面同理：chat 走 `/api/chat/*`（nginx 里前缀比 `/api/` 长 ⇒ 命中 ai-agent），
  # 而未配置时产物里 baked 的是 `http://localhost:8001`（真机上必然失败 + 混合内容）。
  TARO_APP_AI_API_URL: https://app.migaozn.com

jobs:
  publish:
    name: publish bmini h5 → /b/ + identity assertions
    runs-on: ubuntu-latest
    # npm ci（Taro 依赖树重）+ 构建 + 镜像搬运 + 发布 + 断言；另含 verify 里**有上界**的
    # 「等 nginx 配置随 deploy 生效」窗口（默认 900s，见 verify 脚本 §为什么会有等待）
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/bmini-app/package-lock.json

      - name: Install dependencies
        working-directory: frontend/bmini-app
        run: npm ci

      # `TARO_APP_H5_PUBLIC_PATH=/b/` 由 workflow 级 env 注入；漏了它 ⇒ 下面的发布脚本
      # 会在**发起任何云调用之前**判红（本地产物命名空间断言），不会把串端产物发上线。
      - name: Build H5 (publicPath=/b/)
        working-directory: frontend/bmini-app
        run: npm run build:h5

      # 登录实现**唯一一份** = `scripts/acr_login.sh`（issue #6526 A）。
      # 🔴 本调用点**承重**（带 `--fatal`）：本腿把 `/dist` 装进**传输镜像推到 ACR**，
      #    登录是它的**必要步骤** ⇒ 重试 3 次仍失败必须**判红**（不许降成 warning）。
      #    ⚠️ 与三条部署腿 + 对账腿（不承重）的**态是反的** —— 这正是 issue #6526 两态接口的由来。
      # 判据 = tests/unit_ci_workflows/test_acr_login_not_load_bearing.py（**双向**：该带 `--fatal`
      #        的腿没带 ⇒ 红；不该带的腿带了 ⇒ 也红）。
      # ⚠️ `hashFiles` 弃权：取不到 helper 时**不执行登录**而不是报「找不到文件」（本腿的触发面
      #    是 `push: main` / `schedule` / `workflow_dispatch`，正常都有 helper）。
      # ⚠️ 本步**承重** ⇒ 非零退出语义必须保留（不许改成 `|| true`）。
      - name: Docker login ACR (retry, fatal)
        if: ${{ hashFiles('scripts/acr_login.sh') != '' }}
        run: bash scripts/acr_login.sh ${{ env.ACR_REGISTRY }} "${{ secrets.ACR_USERNAME }}" "${{ secrets.ACR_PASSWORD }}" --fatal

      # 传输载体：上下文**只给 dist/**（给 frontend/bmini-app 会把 700MB+ 的 node_modules 灌进上下文）
      - name: Pack product into transport image and push
        # ── 显式推送上界（issue #5814：补齐 PR #5816 唯一漏掉的一处）────────────────
        # 病（实测，见 issue #5814）：`docker push` 大镜像到 ACR（cn-hangzhou）会**无上界地挂住**
        # （日志停在 `pushing layers`，鉴权已完成，之后约 40min 零输出）；挂住只能等 job 的
        # `timeout-minutes: 30` 把 run 打死，而打死报的是 `cancelled` ⇒ 断路器不跳闸 ⇒ cron 自放大。
        # 三条 deploy 腿已由 PR #5816 加上界（单次 `PUSH_TIMEOUT_SECS=720` + 重试 1 次），
        # 本处是当时留下的**唯一**未加固点 ⇒ 同批补上，避免再开一轮 CI。
        # ⚠️ 既有语义一字不变：镜像名 / tag、`docker manifest inspect` 复验（fail-closed）
        #    与 step summary 全保留 —— 本判据**只加一个上界前缀**。
        env:
          PUSH_TIMEOUT_SECS: '720'
        run: |
          set -euo pipefail
          IMG="${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_NAME }}"
          TAG="sha-${GITHUB_SHA::7}"
          docker build -f deploy/bmini-h5/Dockerfile -t "$IMG:$TAG" frontend/bmini-app/dist
          # 单次推送的显式墙钟上界（coreutils `timeout`，ubuntu-latest 自带）：
          # rc=124 = 超时 ⇒ 显式点名「推送到 ACR 挂住」，不静默、不无限等。
          if timeout "${PUSH_TIMEOUT_SECS}" docker push "$IMG:$TAG"; then
            echo "✅ 传输镜像已推送（单次上界 ${PUSH_TIMEOUT_SECS}s）"
          else
            rc=$?
            if [ "$rc" = "124" ]; then
              echo "::error::**推送到 ACR 挂住**（rc=124，超过上界 ${PUSH_TIMEOUT_SECS}s）—— 镜像 $IMG:$TAG 未推送成功；"
              echo "::error::这一步就是 issue #5814 的挂点（日志通常停在 pushing layers / 图层上传，鉴权已完成）。"
            else
              echo "::error::传输镜像推送失败（rc=${rc}，上界 ${PUSH_TIMEOUT_SECS}s）—— 镜像 $IMG:$TAG 未推送成功。"
            fi
            exit "$rc"
          fi
          # 推完立刻复验：推失败/推了一半 ⇒ 这里就红（在远端 pull 之前 fail-closed）
          docker manifest inspect "$IMG:$TAG" >/dev/null
          echo "传输镜像：\`$IMG:$TAG\`（内容 = 本次 CI 构建的 dist/）" >> "$GITHUB_STEP_SUMMARY"

      - name: Install Aliyun CLI
        run: |
          curl -fsSL --retry 3 --retry-delay 3 https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz -o /tmp/aliyun.tgz
          file /tmp/aliyun.tgz | grep -q "gzip compressed data"
          tar xzf /tmp/aliyun.tgz -C /tmp
          sudo mv /tmp/aliyun /usr/local/bin/
          aliyun plugin install --names aliyun-cli-swas-open >/dev/null 2>&1 || true
          aliyun version

      - name: Publish bmini h5 to SWAS (静态根下的 b/ 子树)
        env:
          AK: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          SK: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
          # 🔴 **执行体 ref**（issue #6124）：引导**按它**从 codeload 取回
          #    `deploy/swas/bmini-h5-publish-remote.sh` 并执行；发布逻辑**不进** SWAS 命令内容
          #    （命令内容只留极小引导 ⇒ 与远端脚本大小解耦，不再逼近 16 KB 墙；病根见 issue #6095）。
          #    = 本 workflow 跑的那个 commit ⇒ 它的 tarball 必定含远端执行体；**不是** main 的最新
          #    （取最新会让「远端执行的那份」与「本次 CI 审过的 commit」漂移）。
          #    ⚠️ 与第 5 参数（**产物** ref = ACR 镜像 tag）是两件事：镜像是产物、git ref 只有这一个。
          H5_PUBLISHED_COMMIT: ${{ github.sha }}
        run: |
          bash deploy/scripts/bmini-h5-publish-ci.sh \
            "${{ env.SWAS_INSTANCE_ID }}" "${{ env.SWAS_REGION }}" "$AK" "$SK" "sha-${GITHUB_SHA::7}"

      # 发布后身份断言（**不是**「200 就算过」—— 修复前 `/b/` 就是 200 的 C 端页面）
      - name: Assert served identity (/b/ 是本仓库产物、子路由不串端、根仍是 C 端、worker-h5 零回归)
        run: bash deploy/scripts/bmini-h5-verify-served.sh https://app.migaozn.com frontend/bmini-app/dist
