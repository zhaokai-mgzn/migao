name: E2E Real (AI Agent 能力测试)
permissions:
  contents: read
  issues: write

on:
  workflow_dispatch:
  schedule:
    # 每天 00:00 CST（UTC+8）= UTC 16:00，低峰期跑真实 LLM 能力回归
    - cron: '0 16 * * *'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  e2e-real:
    name: E2E Real (AI Agent 能力测试)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/ai-agent-service/requirements.txt

      - name: Install dependencies
        working-directory: backend/ai-agent-service
        run: pip install -r requirements.txt -q

      - name: Run real E2E tests (pytest — 零 Mock，真实 LLM 调用)
        working-directory: backend/ai-agent-service
        env:
          CI: 'true'
          E2E_REAL_ENABLED: 'true'
          ADMIN_API_BASE_URL: ${{ secrets.E2E_ADMIN_API_URL || 'https://api.migaozn.com' }}
          AI_AGENT_URL: ${{ secrets.AI_AGENT_SERVICE_URL }}
          SERVICE_TOKEN: ${{ secrets.SMOKE_SERVICE_TOKEN }}
          # 以下 env 供 integration 标记的 4 个真实环境测试使用（2026-08-28 接入每日调度，
          # 修复「135 个 integration 测试从未执行」问题；原 -m "not integration" 在 PR CI 排除，
          # 本 job 显式运行它们，失败自动建 issue 而非静默不跑）
          PRIMARY_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || 'ci-dummy' }}
          PRIMARY_BASE_URL: https://api.deepseek.com
          PRIMARY_MODEL: deepseek-v4-flash
          VISION_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || 'ci-dummy' }}
          VISION_MODEL: deepseek-v4-flash-vision-exp
          DASHVECTOR_API_KEY: ${{ secrets.DASHVECTOR_API_KEY || 'ci-dummy' }}
          DASHVECTOR_ENDPOINT: ${{ secrets.DASHVECTOR_ENDPOINT || 'https://ci-dummy.dashvector.cn-hangzhou.aliyuncs.com' }}
          DASHVECTOR_COLLECTION: ${{ secrets.DASHVECTOR_COLLECTION || 'ci' }}
          DATABASE_URL: postgresql+asyncpg://${{ secrets.RDS_USER }}:${{ secrets.RDS_PASSWORD }}@${{ secrets.RDS_HOST }}:${{ secrets.RDS_PORT }}/${{ secrets.RDS_DB }}
          JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY || 'ci-dummy' }}
        run: |
          # 真实 LLM 零 Mock E2E：失败用例自动重试 1 次，容错 LLM 工具选择的非确定性波动
          # （order_create 偶发未调、工具选择歧义等，与 Agent Eval local_runner 重试同源）。
          # 重试不掩盖确定性 bug：重试仍失败 → run 仍 failure → 自动开 role/qa issue。
          python -m pytest tests/e2e/real/ \
            tests/test_business_verification.py \
            tests/test_cross_service_tenant.py \
            tests/test_e2e_full_chain.py \
            tests/test_performance_isolation.py \
            -v --tb=long -q \
            --timeout=120 \
            --no-cov \
            --maxfail=10 \
            --reruns 1 --reruns-delay 5

      - name: Upload test artifacts (failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-real-artifacts
          path: |
            backend/ai-agent-service/.pytest_cache/
            backend/ai-agent-service/tests/e2e/real/__pycache__/

      - name: Create Issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[E2E Real] AI Agent 能力测试失败 — ${new Date().toISOString().slice(0, 10)}`,
              body: `E2E Real 测试失败（零 Mock，真实 LLM 调用）。\n\n查看详情：${runUrl}`,
              labels: ['bug', 'role/qa'],
            })
