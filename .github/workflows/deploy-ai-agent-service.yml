name: Build and Deploy ai-agent-service
permissions:
  contents: read

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'backend/ai-agent-service/**'
      - '!backend/ai-agent-service/tests/**'
  # 部署对账（issue #2935）：连续快速合并时 GitHub 可能吞掉 push 触发
  # （2026-09-05 实测 #2926 合入 main 后未生成任何 deploy run——镜像从未构建）。
  # 定时兜底：检查 main HEAD 对应的 sha-xxx 镜像是否已存在，缺失则补一次构建部署。
  # ⚠️ **错峰**（issue #5078 ③）：本 workflow 与 deploy-reconcile / deploy-frontend /
  # deploy-ai-agent-service / flaky-ledger-reconcile **原来全是 `*/20 * * * *`** ⇒
  # :00/:20/:40 同刻起跑 5 个重活（同时抢 runner + 同时抢各自的并发锁），而
  # `deploy-reconcile` 的职责正是 dispatch 这 3 条 deploy ⇒ 队列自踩。
  # 现排在 reconcile（:00/:20/:40）**之后** N 分钟：reconcile 先判定并 dispatch，
  # 本腿随后独立复核（镜像已在 ⇒ 秒退，见 `Skip if already built`），不再同刻挤在一起。
  # 周期仍是 20min ⇒ #2947/#2935 的分钟级兜底窗口不变。
  schedule:
    - cron: '8,28,48 * * * *'
  workflow_dispatch:
    inputs:
      image_tag:
        description: '部署指定镜像 tag（回滚/指定版本用，如 sha-xxxxxxx 或 v1.2.3）。留空 = 构建当前代码并部署'
        required: false
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # 部署目标：SWAS 轻量应用服务器（2026-08-14 起替代 SAE）—— 当前为测试环境
  SWAS_INSTANCE_ID: b23c69e599524b1da719734f72e6a0e3
  SWAS_REGION: cn-hangzhou
  # CI 构建镜像推送 ACR → SWAS 服务器 docker compose pull 预构建镜像（见 deploy/swas/deploy.sh）
  ACR_REGISTRY: crpi-qdcgkzwx9p9zckga.cn-hangzhou.personal.cr.aliyuncs.com
  ACR_NAMESPACE: ai-customer-service
  IMAGE_NAME: ai-agent-service

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # 硬超时兜底（issue #4767 ①）：脚本被卡死时由 GitHub 终止 run ⇒ run 进**终态** ⇒
    # `deploy-ai-agent-service` 的 concurrency 组释放。事故里挂住的 run 占锁 20+ 分钟 ⇒ 后续 main 的部署全被挡住。
    # 45min 远高于实测正常 job（≈5-11min）⇒ 不误杀正常构建；真正的部署阶段上界在脚本里（15min/次尝试）。
    timeout-minutes: 45
    # 部署对账输出（issue #2935）：schedule 触发时若镜像已存在则 skip=true（本轮未部署）
    outputs:
      deployed: ${{ steps.sync.outputs.skip }}

    concurrency:
      group: deploy-ai-agent-service
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # 镜像 tag：git SHA 前 7 位（不可变、可追溯）；回滚/指定版本时用输入值
      - name: Resolve image tag
        id: tag
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "IMAGE_TAG=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
            echo "MODE=rollback" >> "$GITHUB_OUTPUT"
          else
            echo "IMAGE_TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "MODE=build" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to Alibaba Cloud ACR
        if: steps.tag.outputs.MODE == 'build'
        run: |
          docker login ${{ env.ACR_REGISTRY }} \
            --username ${{ secrets.ACR_USERNAME }} \
            --password ${{ secrets.ACR_PASSWORD }}

      # ── 部署对账（仅 schedule 触发时生效，issue #2935）──
      # 连续快速合并时 GitHub 可能吞掉 push 触发（2026-09-05 实测 #2926 合入 main
      # 后未生成任何 deploy run——镜像从未构建）。定时兜底：main HEAD 对应的
      # sha-<head7> 镜像已存在 → 该 commit 构建过，跳过本轮构建部署；
      # 缺失 → push 触发被吞，执行完整构建部署。
      - name: Skip if already built (schedule reconcile)
        id: sync
        # ⚠️ **改前只有 `github.event_name == 'schedule'`** ⇒ `workflow_dispatch` 这条路径
        # **整步不跑** ⇒ 重复 dispatch 的 run 照常构建 + 部署 ⇒ 占住 `deploy-<svc>` 并发锁。
        # #5078 的级联就是这么形成的（实测：run 35627484674 的 job **排队 42min** 才起跑，
        # 拿到锁时早已越过 45min 上界 ⇒ 被 `timeout-minutes` 打死；同形还有 35628449279 /
        # 35620917459 / 35627829895）。重复 dispatch 的来源是 `deploy-reconcile.yml`
        # （cron `*/20`，main HEAD 的镜像缺失就再 dispatch 一次）—— 挂住的 run 不产出镜像
        # ⇒ 每 20min 再补一次 ⇒ 队列里永远压着一个「注定被超时打死」的 run。
        # 修法（**不降门禁**）：把同一条「镜像已在 ⇒ 不必重做」的判据**扩到 workflow_dispatch**
        # ⇒ 排队的 run 拿到锁后**秒退**（打印理由），而不是白占 45min。`timeout-minutes` 兜底保留。
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          # 用 env 而不是在 run 里内联 `${{ … }}`：内联表达式在 shell 里是 `${{` 形态，
          # 本仓的执行式守卫测试要逐字渲染这段正文（见 tests/unit_ci_workflows/
          # test_deploy_churn_and_env_gate.py）⇒ 走环境变量既更安全也更好测。
          EVENT_NAME: ${{ github.event_name }}
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          EXPECTED_TAG="sha-${GITHUB_SHA::7}"
          IMAGE="${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_NAME }}:${EXPECTED_TAG}"
          # ⚠️ **先去重、后判定镜像**的顺序很重要：`image_tag` 非空 = 人工回滚（MODE=rollback），
          # 回滚目标镜像**必然已存在** ⇒ 若先判镜像存在就 `exit 0`，会把 #4852 的显式回滚接口
          # **整条砍掉**（守卫挡死它自己的逃生口）。故回滚路径**根本不进**镜像判定。
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -z "$INPUT_IMAGE_TAG" ] \
             && docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "✅ 镜像 ${IMAGE} 已存在——main 当前 commit 已构建过"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            # workflow_dispatch + 无 image_tag + 镜像已在 ⇒ **重复 dispatch**（对账每 20min
            # 补一次，或前一个 run 已构建完）⇒ 当场退出，把并发锁让给真正要做事的 run（#5078）。
            echo "⏭️ 跳过原因（显式，非静默）：本次是 workflow_dispatch 且未指定 image_tag，"
            echo "   而 sha-${GITHUB_SHA::7} 的镜像已存在 ⇒ 该 commit 已构建过 ⇒ 判定为**重复 dispatch**"
            echo "   （来源多为 deploy-reconcile.yml 的 cron 兜底）。不再构建/部署，直接退出以释放并发锁。"
            echo "   需要**强制重新部署同一 commit**：走显式回滚接口 \`gh workflow run <deploy>.yml -f image_tag=sha-<7>\`"
            exit 0
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_IMAGE_TAG" ]; then
            echo "ℹ️ MODE=rollback（显式指定 image_tag=${INPUT_IMAGE_TAG}）⇒ 跳过「镜像已存在」去重判定，"
            echo "   照常构建/部署（#4852 的显式回滚接口必须永远可用）"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "✅ 镜像 ${IMAGE} 已存在——main 当前 commit 已构建过，跳过构建部署"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ 镜像 ${IMAGE} 缺失——该 commit 的部署触发可能被吞（连续快速合并），执行完整构建部署"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python 3.11
        if: steps.tag.outputs.MODE == 'build' && steps.sync.outputs.skip != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Run unit tests
        if: steps.tag.outputs.MODE == 'build' && steps.sync.outputs.skip != 'true'
        working-directory: backend/ai-agent-service
        env:
          PRIMARY_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || 'ci-dummy' }}
          PRIMARY_BASE_URL: https://api.deepseek.com
          PRIMARY_MODEL: deepseek-flash
          PRIMARY_FAST_MODEL: deepseek-flash
          ASR_API_KEY: ${{ secrets.ASR_API_KEY || 'ci-dummy' }}
          ASR_MODEL: paraformer-realtime-8k-v2
          VISION_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || 'ci-dummy' }}
          VISION_BASE_URL: https://api.deepseek.com/v1
          VISION_MODEL: deepseek-flash
          DASHVECTOR_API_KEY: ci-dummy
          DASHVECTOR_ENDPOINT: https://ci-dummy.dashvector.cn-hangzhou.aliyuncs.com
          DASHVECTOR_COLLECTION: ci
          ADMIN_API_BASE_URL: http://localhost:8080
          SERVICE_TOKEN: ci-dummy
          JWT_PUBLIC_KEY: ci-dummy
          LOGISTICS_API_URL: https://ci-dummy
          LOGISTICS_APPCODE: ci-dummy
          SSE_TIMEOUT: '300'
          SSE_PING_INTERVAL: '30'
          CORS_ALLOWED_ORIGINS: http://localhost:3000
          DATABASE_URL: postgresql+asyncpg://${{ secrets.RDS_USER }}:${{ secrets.RDS_PASSWORD }}@${{ secrets.RDS_HOST }}:${{ secrets.RDS_PORT }}/${{ secrets.RDS_DB }}
        run: |
          pip install -r requirements.txt -q
          python -m pytest tests/ -v --tb=short -q -m "not integration"

      - name: Set up Docker Buildx
        if: steps.tag.outputs.MODE == 'build' && steps.sync.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        if: steps.tag.outputs.MODE == 'build' && steps.sync.outputs.skip != 'true'
        working-directory: backend/ai-agent-service
        run: |
          IMG=${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_NAME }}
          IMAGE_FULL=$IMG:${{ steps.tag.outputs.IMAGE_TAG }}
          docker buildx build \
            --provenance=false \
            --build-arg PIP_INDEX_URL=https://pypi.org/simple/ \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            -t $IMAGE_FULL \
            -t $IMG:latest \
            --push .
          echo "IMAGE_FULL=$IMAGE_FULL" >> $GITHUB_ENV

      # 自动部署目标 = 测试环境（当前 SWAS）；生产发布走 deploy-prod（未来）
      - name: Deploy to SWAS (测试环境)
        if: steps.sync.outputs.skip != 'true'
        env:
          AK: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          SK: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
          ACR_U: ${{ secrets.ACR_USERNAME }}
          ACR_P: ${{ secrets.ACR_PASSWORD }}
          IMAGE_TAG: ${{ steps.tag.outputs.IMAGE_TAG }}
          # 显式降级许可（issue #4852 ②）：`workflow_dispatch -f image_tag=<tag>`（MODE=rollback）
          # 是**人工回滚接口** ⇒ 只有这条路径给 1，其余（push / schedule 构建部署）恒 0
          # ⇒ 远端闸门「target 是当前在跑 tag 的祖先就跳过该服务」对普通部署生效、对显式回滚放行。
          ALLOW_DOWNGRADE: ${{ steps.tag.outputs.MODE == 'rollback' && '1' || '0' }}
        run: |
          bash deploy/scripts/swas-deploy-ci.sh \
            ${{ env.SWAS_INSTANCE_ID }} ${{ env.SWAS_REGION }} "$AK" "$SK" "$ACR_U" "$ACR_P" "$IMAGE_TAG"
  smoke-test:
    name: Post-Deploy Smoke Test
    needs: build-and-deploy
    # schedule 对账跳过构建部署时（本轮未部署）不再跑冒烟；push/rollback 正常跑
    if: github.event_name != 'schedule' || needs.build-and-deploy.outputs.deployed == 'false'
    uses: ./.github/workflows/smoke-test.yml
    with:
      admin_api_url: 'https://api.migaozn.com'
      ai_agent_url: 'https://ai-api.migaozn.com'
    secrets:
      SMOKE_ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}
      SMOKE_SERVICE_TOKEN: ${{ secrets.SMOKE_SERVICE_TOKEN }}
