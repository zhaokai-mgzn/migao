name: Build and Deploy ai-agent-service

on:
  push:
    branches:
      - main
    paths:
      - 'backend/ai-agent-service/**'
      - '!backend/ai-agent-service/tests/**'
  workflow_dispatch:  # 支持手动触发

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # 部署目标：SWAS 轻量应用服务器（2026-08-14 起替代 SAE）
  SWAS_INSTANCE_ID: b23c69e599524b1da719734f72e6a0e3
  SWAS_REGION: cn-hangzhou
  # ACR 镜像构建为历史遗留（SWAS 服务器自己源码构建，线上不消费该镜像）
  ACR_REGISTRY: crpi-qdcgkzwx9p9zckga.cn-hangzhou.personal.cr.aliyuncs.com
  ACR_NAMESPACE: ai-customer-service
  IMAGE_NAME: ai-agent-service

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    concurrency:
      group: deploy-ai-agent-service
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: echo "IMAGE_TAG=v$(date +%Y%m%d%H%M%S)" >> $GITHUB_OUTPUT

      - name: Login to Alibaba Cloud ACR
        run: |
          docker login ${{ env.ACR_REGISTRY }} \
            --username ${{ secrets.ACR_USERNAME }} \
            --password ${{ secrets.ACR_PASSWORD }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ⚡ Fast Gate — Critical Tests
        working-directory: backend/ai-agent-service
        run: |
          pip install -r requirements.txt -q
          python -m pytest \
            tests/test_intent_router.py \
            tests/test_preference_tracker.py \
            tests/test_tools_base.py \
            -v --tb=short -q \
            -m "not integration"

      - name: Run unit tests
        working-directory: backend/ai-agent-service
        env:
          PRIMARY_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || 'ci-dummy' }}
          PRIMARY_BASE_URL: https://api.deepseek.com
          PRIMARY_MODEL: deepseek-v4-pro
          PRIMARY_FAST_MODEL: deepseek-v4-flash
          ASR_API_KEY: ${{ secrets.ASR_API_KEY || 'ci-dummy' }}
          ASR_MODEL: paraformer-realtime-8k-v2
          VISION_API_KEY: ${{ secrets.MINIMAX_API_KEY || 'ci-dummy' }}
          VISION_BASE_URL: https://api.minimaxi.com/v1
          VISION_MODEL: MiniMax-M3
          DASHVECTOR_API_KEY: ci-dummy
          DASHVECTOR_ENDPOINT: https://ci-dummy.dashvector.cn-hangzhou.aliyuncs.com
          DASHVECTOR_COLLECTION: ci
          ADMIN_API_BASE_URL: http://localhost:8080
          SERVICE_TOKEN: ci-dummy
          JWT_PUBLIC_KEY: ci-dummy
          LOGISTICS_API_URL: https://ci-dummy
          LOGISTICS_APPCODE: ci-dummy
          SSE_TIMEOUT: '300'
          SSE_PING_INTERVAL: '30'
          CORS_ALLOWED_ORIGINS: http://localhost:3000
          DATABASE_URL: postgresql+asyncpg://${{ secrets.RDS_USER }}:${{ secrets.RDS_PASSWORD }}@${{ secrets.RDS_HOST }}:${{ secrets.RDS_PORT }}/${{ secrets.RDS_DB }}
        run: |
          pip install -r requirements.txt -q
          python -m pytest tests/ -v --tb=short -q \
            --ignore=tests/test_post_deploy_verify.py \
            --ignore=tests/manual_test_pe_flow.py \
            -m "not integration"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        working-directory: backend/ai-agent-service
        run: |
          IMAGE_FULL=${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.IMAGE_TAG }}
          docker buildx build \
            --provenance=false \
            --build-arg PIP_INDEX_URL=https://pypi.org/simple/ \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            -t $IMAGE_FULL --push .
          echo "IMAGE_FULL=$IMAGE_FULL" >> $GITHUB_ENV

      - name: Deploy to SWAS
        env:
          AK: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          SK: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
        run: |
          bash deploy/scripts/swas-deploy-ci.sh \
            ${{ env.SWAS_INSTANCE_ID }} ${{ env.SWAS_REGION }} "$AK" "$SK"
  smoke-test:
    name: Post-Deploy Smoke Test
    needs: build-and-deploy
    uses: ./.github/workflows/smoke-test.yml
    with:
      admin_api_url: 'https://api.migaozn.com'
      ai_agent_url: 'https://ai-api.migaozn.com'
    secrets:
      SMOKE_ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}
      SMOKE_SERVICE_TOKEN: ${{ secrets.SMOKE_SERVICE_TOKEN }}
