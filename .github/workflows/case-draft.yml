name: case-draft

# 机械操作:
# 1. needs-verification issue → 打 needs-draft 标签
# 2. needs-truths issue 补了 CONTRACT_JSON → 转 needs-verification
# 3. process-improvement issue 缺 ai-draft → 自动补 ai-draft 标签 (issue #729)

on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: read
  issues: write

jobs:
  trigger:
    # ⚠️ **本闸门刻意不看事件载荷里的标签**（issue #5481 ③ 的根因就在这）：
    # 本 workflow 与 `issue-contract-check.yml` **同为 `issues: opened` 触发**，而 `needs-truths`
    # 是**另一个 run** 写上去的 ⇒ 事件载荷里根本看不到它 ⇒ 先跑完的「看不到标签、不转换」，
    # 后跑的「只写标签、不转换」⇒ **真值齐全的 issue 永远不转档、且没有任何东西会变红**
    # （实证 #3814：body 里本有 `## 验收标准` + 4 条编号判据，却一直挂 `needs-truths` 到一次无关编辑）。
    # ⇒ 闸门只保留事件层面的粗判，真正的判定一律用下面「现取标签」步拿到的**实时**标签。
    if: github.event.issue.number != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # ── 现取标签（消除 `opened` 竞态；issue #5481 ③）─────────────────────────────
      # 一律用 API 读**当前**标签，不读 `github.event.issue.labels`：后者是同刻快照，
      # 另一个 workflow 在别的 run 里加的标签**永远看不到**。
      - name: 现取标签（不读事件载荷 —— 消除 opened 竞态）
        id: labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          L=$(gh issue view "$ISSUE_NUMBER" --json labels --jq '[.labels[].name]|join(",")')
          echo "names=$L" >> "$GITHUB_OUTPUT"
          echo "现取标签 = $L"

      - name: 处理 needs-truths → needs-verification 转换
        if: contains(steps.labels.outputs.names, 'needs-truths')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          BODY=$(gh issue view "$ISSUE_NUMBER" --json body --jq '.body')
          # 判据词表 —— **必须与 issue-contract-check.yml 里的 TRUTH_VOCAB 逐字一致**
          # （守卫 = tests/unit_ci_workflows/test_label_guard.py::TestTruthVocabularySingleSource）
          # 原先只认 4 个词，与仓库实际写法（验收判据 / 判据 / 三、判据…）脱节 ⇒ issue #5481。
          TRUTH_VOCAB='验收判据|验收标准|验收清单|验收口径|完成判据|判定标准|判据'
          HAS_TRUTH=$(echo "$BODY" | grep -cP "CONTRACT_JSON|business_truths|业务真值|$TRUTH_VOCAB" || echo "0")
          if [ "$HAS_TRUTH" -gt 0 ]; then
            gh issue edit "$ISSUE_NUMBER" --add-label "needs-verification" --remove-label "needs-truths" 2>/dev/null || true
            echo "✅ 已补业务真值 → needs-verification，进入质量门禁体系"
          fi

      - name: 打 needs-draft 标签（仅当 needs-verification 且无有效 DRAFT）
        if: contains(steps.labels.outputs.names, 'needs-verification')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          VALID=$(gh issue view "$ISSUE_NUMBER" --comments --json comments \
            --jq '[.comments[] | select(.body | contains("<!-- DRAFT_JSON") and (contains("OUTDATED") | not))] | length' 2>/dev/null || echo "0")
          if [ "$VALID" -gt 0 ]; then
            echo "✅ 已有有效 DRAFT_JSON，跳过"
            exit 0
          fi
          gh issue edit "$ISSUE_NUMBER" --add-label "needs-draft" 2>/dev/null || true
          echo "✅ needs-draft — 等 agent-poll 生成 case"

      - name: 校验 DRAFT 是否引用 issue 声明的用例（case-contract）
        if: contains(steps.labels.outputs.names, 'needs-verification')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          BODY=$(gh issue view "$ISSUE_NUMBER" --json body --jq '.body')
          ISSUE_CASES=$(echo "$BODY" | python3 -c "
          import sys, re
          m = re.search(r'\"cases\"\s*:\s*\[([^\]]*)\]', sys.stdin.read())
          print(m.group(1).strip() if m else '')
          ")
          if [ -z "$ISSUE_CASES" ]; then
            echo "ℹ️ issue 未声明 cases，跳过"
            exit 0
          fi
          DRAFT=$(gh issue view "$ISSUE_NUMBER" --comments --json comments \
            --jq '[.comments[] | select(.body | contains("<!-- DRAFT_JSON") and (contains("OUTDATED") | not))] | .[0].body' 2>/dev/null || echo "")
          if [ -z "$DRAFT" ]; then
            echo "⏳ 尚无有效 DRAFT，needs-draft 流程会处理"
            exit 0
          fi
          if echo "$DRAFT" | grep -q '"cases"'; then
            echo "✅ DRAFT 已引用 cases"
          else
            gh issue comment "$ISSUE_NUMBER" --body "⚠️ 本 issue 声明了验收用例 \`$ISSUE_CASES\`，但 DRAFT_JSON 未引用 cases。请自动评审在 DRAFT 验收方案中加入逐用例执行计划（case-contract：verify-agent 逐用例打分）。" 2>/dev/null || true
            echo "⚠️ 已提醒：DRAFT 未引用 issue 声明的用例"
          fi

      - name: 补 ai-draft 标签（process-improvement 缺标 guard）
        if: |
          contains(steps.labels.outputs.names, 'process-improvement') &&
          !contains(steps.labels.outputs.names, 'ai-draft')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --add-label "ai-draft" 2>/dev/null || true
          echo "✅ ai-draft guard: process-improvement issue 已自动补 ai-draft 标签"
