    data_checks:
      - "工艺路线实例化：布帘·韩褶 11 道（精裁-布→…→外帘发货）；定型=否移除 定型-布/复烫-布；特殊选项插条件工序（拼2次→拼2次-布）"
      - "应做数量=算料引擎输出（韩褶-布=折数 48、米工序=用料 12.3、套工序=1）—— 报工只确认不心算"
      - "计件 = Σ(合格数量 × 单价 × **当时快照的**系数)（issue #4604 用户裁定 B：**不追溯**）—— 历史实例带着快照 `factor`（如「一分为二」1.7）⇒ 历史金额仍按 1.7×（**一字不变**）；#4589 起新实例**不带 `factor` 键** ⇒ 缺省 1 ⇒ **新报工不乘**（「计件工资 = 数量 × 计件单价」只对新报工成立）；返工/报废不计件；单工序一人制（无计件人数分摊）"
      - "完工判定：必完工序（外帘装袋，打包前置）合格量满应做数量 → 订单自动生产完成"
    skip_reason: "[backend-contract] 生产确定性核心是纯函数（app/production/），由单元测试全量覆盖（tests/test_production/），非 LLM 行为，不进入 agent-eval 冒烟（同 CH-036/037/038 惯例）"
    merge_log: "2026-09-17 新增（issue #3993）：M4-G-1 生产模块确定性核心覆盖登记，单测覆盖 ｜ 2026-09-20（issue #4604，用户裁定 B **不追溯**）：`compute_piecework` 恢复「× **当时快照的**系数」（逐笔 + 总额两处）—— 历史实例（快照 1.7）仍 1.7×、新实例（无 `factor` 键）缺省 1 ⇒ 新报工不乘。红证：`test_compute_piecework_applies_historical_snapshot_factor` 改前实测 `19.20`（期望 `32.64`，正好差 1.7 倍）⇒ 逐值红；反向护栏 `test_compute_piecework_new_instance_without_factor_key_is_one` 改前改后都绿（防「系数又被加回新单」）。⚠️ #4589 的「读时不算系数」效果恰恰是**回溯**（历史金额从 1.7× 掉到 1×）——「落库不动」≠「历史不回溯」。"
