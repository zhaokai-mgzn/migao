# cases/processing.yml — 加工项域用例（并源转换）
# 来源：eval P004~P006 + verification 2.13/2.14 → 4 条

schema: "case-contract/1.0"
domain: processing

cases:
  - id: PP-002
    legacy_id: "2.14"
    title: "加工项分类列表"
    domains:
      - processing
    tier: normal
    tags:
      - processing_item
      - category
    truths_ref:
      - processing-manage.category-sort
      - processing-manage.crud
    user_inputs:
      - "基础加工分类下有哪些"
    expectations:
      # 用户问「分类下有哪些」是想看分类下的加工项，正确工具是 processing_item_query
      # （processing_item_manage 的 description 明确「仅查看加工项列表用 processing_item_query」，
      # list_categories 是查分类树 CRUD）。agent 合理路径 = list_categories（分类树）+
      # processing_item_query（加工项），任一命中即可（Round 73 探针实证两者都会调）。
      - tool: processing_item_query or processing_item_manage
    data_checks:
      - "返回分类列表"
    skip_reason: ""
    merge_log: "verification 2.14 独有；2026-09-09 校准：期望工具 processing_item_manage(list_categories) 与工具 description 矛盾（查询加工项应走 processing_item_query），改为 processing_item_query"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_tools_processing_item_manage.py"
      ci:
        - agent-eval.yml
      verifies: []

  - id: PP-006
    legacy_id: ""
    title: "新增加工项只需名称+加工分类（不再有单价/计价方式），且必须真的调工具建出来"
    domains:
      - processing
    tier: normal
    tags:
      - processing_item
      - crud
    truths_ref:
      - processing-manage.crud
      - product-sku-stock.create-flow
    user_inputs:
      - "查询打孔加工"
      # #4882（用户裁定）：加工项目录不再有单价与计价方式 ⇒ 行为面由「计价方式枚举」改为
      # 「新增只需名称 + 分类」。分类 ID 仍直接给（#3544 / #3658 的教训保留：分类名→ID 解析
      # 不是本用例的行为面，直接给 `pcat_eval_curtain` 让 create 首轮成功）。
      - "新增加工项，名称叫测试加工，分类选窗帘加工（分类 ID：pcat_eval_curtain）"
      - "确认"
    expectations:
      - tool: processing_item_query
        args:
          keyword: "打孔"
      - tool: processing_item_manage
        args:
          action: create_processing_item
    # ── 「调了 ≠ 成了」（#3544）：expectations 里出现工具名只证明「模型想建」──
    # ① must_succeed = canonical 写成功断言（fail-closed：一次都没成功 → 判红）；
    # ② output_verify = 产出侧值核对（must_succeed 只说"成了"，说不出"建的是哪一项"）。
    must_succeed:
      - tool: processing_item_manage
        action: create_processing_item
    output_verify:
      - tool: processing_item_manage
        # ⚠️ 多 action 工具**必须**声明 action（L0 不变式锁死）：本工具还有 list_categories
        # 等同名 action，不限定就会核对到**另一个 action** 的 payload（实测 run 34809483940
        # 取到 R2 list_categories 的 {'categories': [...]} → 假红；字段名撞上则假绿）。
        action: create_processing_item
        expect:
          # 真建出用户点名的那一项（而不是误建别的项）
          name: "测试加工"
    forbidden_text:
      # #4882 的正面要求（断言只增不减）：目录已无单价/计价方式 ⇒ agent 不得反过来向用户
      # 索要这两个**已退场**的字段；也不得宣称「新增加工项」不在功能范围（PP-006 实拍教训）。
      - "请提供计价方式"
      - "请选择计价方式"
      - "请输入单价"
      - "请提供单价"
      - "暂不支持"
      - "功能不存在"
      - "没有这个功能"
    data_checks:
      # ── 前置自断言（issue #4537 的 burn-down 缴费）──
      # R1 的加工项查询与下面 `output_verify` 的接地对象 = 种子里的「打孔」+ 分类「窗帘加工」。
      # 口径：`assertion_taxonomy` 的 `declares_precondition` 认「`data_checks` 里含前置关键词
      # **且**是机器计分型」，故本条带 `success=true`（= 计分标记，不新增断言强度）。
      - "前置（precondition）：评测栈种子里加工项「打孔」（`pi_eval_punch`）存在（status=active）、加工分类「窗帘加工」（`pcat_eval_curtain`）存在 —— 它们是 R1 的加工项查询与下面 `output_verify` 的接地对象（success=true）；前置不成立时 agent 只能如实回「找不到该加工项或分类」，判红会伪装成「agent 不会建加工项」"
      - "加工项目录**不再有单价与计价方式**（issue #4882，用户裁定；V101 迁移删列）：`POST/PUT /api/admin/processing-items` 的请求体只认 `name` + `categoryId`（+ 可选 `craftHint` / `description`），`pricingMethod` / `unitPrice` 两键已随 DTO 一并退场 —— 新增加工项不得要求用户补「计价方式」或「单价」"
      - "processing_item_query 响应条目无 pricing_method / unit_price / per_meter_quantity（计价方式与单价已退场；每米数量更早已回滚，issue #3005）"
      - "商品详情 processingItems 无 custom_per_meter_quantity / perMeterQuantity（商品级密度覆盖已回滚）"
    skip_reason: ""
    merge_log: "2026-09-07 改写（issue #3005，回滚 #2986）：行业加工费按米计价、辅料（罗马圈/四爪钩等）含在按米加工费中——per_piece 与「每米数量」密度不符合实际（数量对不上车间工艺、B 端无法对账），已回滚移除；PP-006 由密度配置用例改为计价方式回归断言。2026-09-14 校准（#3544，REPORT §2.3）：① 假绿升级——补 must_succeed（canonical 写成功断言，fail-closed）+ output_verify（name/pricingMethod 产出核对），此前只断言「调用过」，工具三次真执行全失败仍判 ✅（真缺口见 #3543）；② 输入「分类选打孔加工」改为种子里真实存在的「分类选窗帘加工」。2026-09-14 收口（#3544，run 34809483940 实测）：`output_verify` 补 `action: create_processing_item` —— 原实现按**工具名**取首个成功 payload，而本工具是多 action（R2 的 list_categories 也成功）→ 核对到 `{'categories': [...]}` 造成**假红**；同时给 runner 加 action 过滤 + L0 不变式「多 action 工具的 output_verify 必须声明 action」。2026-09-14 再校准（#3658，run 34820346966 首次真重放）：改为输入直接给分类 ID（pcat_eval_curtain，种子里确定存在），create 首轮成功、不再触发恢复轮。2026-09-19（issue #4537 的 burn-down 缴费 —— 本用例命中的**唯一**一条存量违规是 CASE-TRUST-NO-PRECONDITION-ASSERTION，metric=entries ⇒ 必须**整条销账**）：补**机器计分型**前置自断言。2026-09-19（issue #4542 菜单改名）：侧边栏菜单名 =「加工项管理」（页面仍是两个 tab，功能一条没减）—— 仅登记口径变更。**2026-09-21 改写（issue #4882，用户裁定「彻底删除加工项单价与计价方式」）**：加工项目录不再承载价与计价方式（V101 删列 + `ProcessingItemCreateRequest/UpdateRequest` 去字段 + `POST /processing-items/calculate` 端点退场）⇒ 本用例原行为面（计价方式枚举 per_meter/per_set/fixed/per_area、per_piece 被拒绝）**整体失去对象**。按「用例 ID 不复用给别的行为、也不删号留洞」的惯例，同一 ID 改写为**新世界等价强度的可执行行为面**：新增加工项只需「名称 + 加工分类」，agent **必须真的调 `create_processing_item`**（原防呆内核逐字保留），且**不得反向索要已退场的「计价方式」/「单价」**（新增 forbidden_text，断言只增不减）；分类 ID 仍按种子给（#3658 教训保留）。"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_tools_processing_item_query.py"
        - "backend/ai-agent-service/tests/test_tools_processing_item_manage.py"
        - "backend/admin-api/src/test/java/com/migao/admin/service/ProcessingItemServiceTest.java"
      ci:
        - agent-eval.yml
        - pr-check.yml
      verifies: []
  # ==========================================================================
  # LLM 行为正向用例（issue #3568）：补 processing_item_manage 的**改 / 停用**路径
  # 缺口。加工项契约修复包（#3591）收口时如实标注：`.github/cases/**` 里零
  # `update_item` / `toggle_item_status` 用例，它的 CI 重放只能证「工具健康度与
  # create 路径无回归」，**不能真实覆盖改/停用路径**。
  # #4882 后「改价」载体不存在 ⇒ 本用例改为「改描述」，题眼（部分更新不得清空其它字段）不变。
  # ==========================================================================
  - id: PP-007
    legacy_id: ""
    title: "米宝加工项 LLM 行为：只改描述不清空其它字段（部分更新语义）"
    domains:
      - processing
      - chat
    tier: normal
    tags:
      - processing_item
      - llm_behavior
      - tool_call
      - update
    truths_ref: []
    user_inputs:
      # 自包含/残留免疫（照 PG-015/PG-016 先例）：**点名种子/目录里真实存在的加工项**。
      # `打孔` 是种子里真实存在的加工项（`pi_eval_punch`，status=active、craft_hint=打孔），
      # 不是假设存在的对象。
      # #4882：单价与计价方式已退场 ⇒ 「部分更新」的题眼改挂在一个**可选且非 @NotBlank** 的
      # 字段上（`description`），断言强度不变（仍是「GET→merge→PUT 后其它字段不得被清空」）。
      - "把加工项打孔的描述改成顶部打孔工艺"
      - repeat_until:
          tool_called: processing_item_manage
          max: 3
        fallback: "确认"
      # 回读轮：`update_item` 的返回是 `{item_id, **PUT 回显的完整加工项}`——**是合并后的
      # 对象**（`_put_item_full` GET 详情 → 覆盖传入字段 → PUT 全量后回显）。回读轮保留
      # （二次证据面）。
      - "再看下加工项打孔的描述"
      - repeat_until:
          tool_called: processing_item_query
          max: 3
        fallback: "确认"
    expectations:
      - tool: processing_item_manage
        args:
          action: update_item
      - tool: processing_item_query
    must_succeed:
      - tool: processing_item_manage
        action: update_item
    required_args:
      - tool: processing_item_manage
        fields:
          - item_id
          - description
    output_verify:
      # ⚠️ `action` 必写（本工具多 action：create_processing_item / update_item /
      # delete_item / toggle_item_status / …）—— 不限定会取**首个成功调用**的 payload
      # （假绿/假红）。
      - tool: processing_item_manage
        action: update_item
        expect:
          # 本次真改到的字段（回显报文里的键名 = admin-api 的 `description`）
          description: "顶部打孔工艺"
          # 本用例的题眼是「**只改描述不清空其它字段**」：`_put_item_full` 是
          # 「GET 详情 → 覆盖传入字段 → PUT 全量」，PUT 回显即**合并后的对象**，
          # 故「没被清空」能且必须在这份 payload 上机器核到（字段被清 → 键缺失/为空 → 红）。
          # `craftHint` 是 V78 给加工项加的**路线键「工艺」维受控来源**
          # （`ProcessingItem.craftHint`）—— 它是最不能丢的一个可选字段
          # （丢了 → 路线派生少一维 ⇒ 工序/工资错配），且它是**非 @NotBlank 的可选字段**，
          # 正是「只发改动字段」写法会清掉的那一类。
          name: 打孔
          craftHint: 打孔
          status: active      # 种子 pi_eval_punch status='active'
    forbidden_text:
      - "暂不支持"
      - "功能不存在"
      - "没有这个功能"
      - "修改失败"
      - "更新失败"
      - "无法修改"
    data_checks:
      # ── 前置自断言（issue #4525 的 burn-down 缴费）──
      # 本用例按**名字**点名种子里的加工项 `打孔`（`pi_eval_punch`，status=active、
      # craft_hint=打孔）：`must_succeed(update_item)` 与 `output_verify`
      # （description=顶部打孔工艺 且 name/craftHint/status 未被清空）**全部以「该名字在
      # 评测栈里存在且形态为 active + craft_hint=打孔」为前提**。前置不成立（种子改名 /
      # 换字段形态）时，agent 只能如实回「找不到该加工项」⇒ 判红会伪装成「agent 不会改」。
      # 口径：`assertion_taxonomy` 的 `declares_precondition` 认「`data_checks` 里含前置
      # 关键词**且**是机器计分型」，故本条带 `success=true`（= 计分标记，不新增断言强度）。
      - "前置（precondition）：评测栈种子里「打孔」（`pi_eval_punch`）存在且 `status=active`、`craft_hint=打孔` —— 它是下面 `update_item` 回读断言的接地对象（success=true）；前置不成立时 agent 只能如实回「找不到该加工项」，判红会伪装成「agent 不会改」"
      # 本类用例的**核心断言**（对照 #3591 修的「GET→merge→PUT 全量」语义）：
      # 只改描述不得把 name / craftHint / status 清空。该语义已**机器可判**
      # （output_verify 的 name/craftHint/status 三个键）；本 prose 仅留作判读说明。
      - "回读结果中 name 仍为「打孔」、craftHint 仍为「打孔」、status 仍为 active（未被清空）——只改 description 不得清空其它字段"
    skip_reason: ""
    merge_log: "2026-09-14 新增（issue #3568）：`processing_item_manage(action=update_item)` 此前**零用例覆盖**（#3591 收口时如实标注的覆盖边界：只有 create 路径被重放）。断言机器可判：must_succeed(action=update_item) + required_args[item_id,price] + output_verify(unitPrice=9.5 + name/pricingMethod/status 未被清空，显式 action) + forbidden_text。2026-09-15 校准（结论档 run 34841029062 实证）：原 output_verify 写 `price: 9.5` = 用**入参名**核**回显字段名**（回显是 unitPrice）→ 恒红假红；同时更正「update_item 返回只含下发字段」的错误注释（PUT 回显是合并后全量对象，故「不清空」可从 payload 机器核到）。2026-09-19（issue #4525 的 burn-down 缴费）：补**机器计分型**前置自断言（种子 `pi_eval_punch`「打孔」存在 + craft_hint=打孔）。**2026-09-21 改写（issue #4882，用户裁定「彻底删除加工项单价与计价方式」）**：单价与计价方式两个字段整体退场 ⇒ 原题眼「只改**单价**不清空其它字段」的载体消失。按「断言只增不减」原则：① 题眼载体迁到**可选且非 @NotBlank** 的 `description`；② 「不得被清空」的锚点由 `pricingMethod` 换成 **`craftHint`**（V78 的路线键「工艺」维受控来源，丢了会让路线派生少一维 ⇒ 工序/工资错配 ⇒ 锚点比原来更硬）；③ `required_args` 的 `price` → `description`；④ forbidden_text / 回读轮 / `action` 限定语义**一字未改**。"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_tools_processing_item_manage.py"
        - "backend/admin-api/src/test/java/com/migao/admin/service/ProcessingItemServiceTest.java"
      ci:
        - agent-eval.yml
      verifies: []
  - id: PP-008
    legacy_id: ""
    title: "米宝加工项 LLM 行为：停用加工项（toggle_item_status → inactive）"
    domains:
      - processing
      - chat
    tier: normal
    tags:
      - processing_item
      - llm_behavior
      - tool_call
      - toggle
    truths_ref: []
    user_inputs:
      - "把加工项打孔停用"
      - repeat_until:
          tool_called: processing_item_manage
          max: 3
        fallback: "确认"
    expectations:
      - tool: processing_item_manage
        args:
          action: toggle_item_status
    must_succeed:
      - tool: processing_item_manage
        action: toggle_item_status
    required_args:
      - tool: processing_item_manage
        fields:
          - item_id
          - status
    output_verify:
      # ⚠️ 显式 `action`（多 action 工具，理由同 PP-007）
      - tool: processing_item_manage
        action: toggle_item_status
        expect:
          status: inactive    # 工具返回 {item_id, status}，目标状态即停用
    forbidden_text:
      - "暂不支持"
      - "功能不存在"
      - "没有这个功能"
      - "停用失败"
      - "无法停用"
    data_checks:
      # ── 前置自断言（issue #4542 的 burn-down 缴费 —— 本用例命中的唯一一条存量违规是
      #    CASE-TRUST-NO-PRECONDITION-ASSERTION，metric=entries ⇒ 必须**整条销账**）──
      # 本用例按**名字**点名种子里的加工项 `pi_eval_punch`「打孔」：R1 的停用指令
      # 与下面的 `must_succeed` / `output_verify`（status=inactive）**全部以「该名字在评测栈里
      # 存在且形态为 active」为前提**。前置不成立（种子改名 / 已停用 / 删项）时，agent 只能
      # 如实回「找不到该加工项」⇒ 判红会伪装成「agent 不会停用加工项」，归因错人
      # （与 PP-007 / DF-011 / CH-007 同一形态、同一修法）。
      # ⇒ 把这条**真正依赖且只读**的前置写成**可判定**自断言。口径：`assertion_taxonomy` 的
      # `declares_precondition` 认「`data_checks` 里含前置关键词**且**是机器计分型」，
      # 故本条带 `success=true`（= 计分标记，不新增断言强度）。
      # **断言面（user_inputs / expectations / must_succeed / required_args / output_verify /
      # forbidden_text）一字未动、无放宽。**
      - "前置（precondition）：评测栈种子里加工项「打孔」（`pi_eval_punch`）存在且 `status=active`、`craft_hint=打孔`（`xiaobu_eval_seed.sql`；**#4882 后加工项目录已无 `pricingMethod` / `unitPrice`**，前置判据随之改锚 `status` / `craft_hint`）—— 它是 R1 停用指令与 `output_verify`（status=inactive）的接地对象（success=true）；前置不成立时 agent 只能如实回「找不到该加工项」，判红会伪装成「agent 不会停用加工项」"
      - "status 目标值为 inactive（工具返回 `{item_id, status}` 可直接核对）；重复执行幂等（再停用一次仍是 inactive）"
    # ── 前置自断言（issue #4527 的 burn-down 缴费）────────────────────────────────
    # 本用例命中的唯一一条存量违规是 `CASE-TRUST-NO-PRECONDITION-ASSERTION`（metric=entries
    # ⇒ 必须**整条销账**）。它的**真前置**是「种子加工项 `pi_eval_punch`（名字「打孔」）
    # 存在且只有一件」—— 不在 ⇒ 红的表现是 `unmatched expectation`（看起来像「agent 不会停用
    # 加工项」，归因全错，同 PG-013 / CU-003 的形态）；有同名副本 ⇒ 停用的可能不是种子那一件。
    # 口径：`expect: 1`（种子唯一名，真值确实恒为 1，同 OR-014/OR-025 的「按名唯一」）；
    # **不按 status 计**（本用例的写动作就是改状态，把 status 计入口径会把正常行为判成漂移）。
    # 类型 `processing_item_count_for_keyword` 由本 PR 加到 runner 的 `_PRECONDITION_TYPES`
    # （计数口径与 `product_count_for_keyword` 同构；`GET /api/admin/processing-items?keyword=`）。
    # **断言面（user_inputs / expectations / must_succeed / required_args / output_verify /
    # forbidden_text / data_checks）一字未动、无放宽。**
    precondition:
