# cases/processing.yml — 加工项域用例（并源转换）
# 来源：eval P004~P006 + verification 2.13/2.14 → 4 条

schema: "case-contract/1.0"
domain: processing

cases:
  - id: PP-001
    legacy_id: P004
    title: "加工项选择 - 分页翻页"
    domains:
      - processing
    tier: normal
    tags:
      - processing_item
      - pagination
    truths_ref:
      - processing-manage.crud
      - processing-manage.category-sort
    user_inputs:
      - "给遮光窗帘（100元的那件）添加加工项"
      - "选打孔加工和韩式折边"
      - "确认"
    expectations:
      - tool: product_processing_item_manage
        args:
          action: add
      - tool: processing_item_query
    data_checks:
      - "data.pageMeta != null"
    skip_reason: ""
    merge_log: "eval P004 + verification 2.13（查询部分同义）+ 2.14 的查询段"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_tools_processing_item_query.py"
      ci:
        - agent-eval.yml
      verifies: []

  - id: PP-002
    legacy_id: "2.14"
    title: "加工项分类列表"
    domains:
      - processing
    tier: normal
    tags:
      - processing_item
      - category
    truths_ref:
      - processing-manage.category-sort
      - processing-manage.crud
    user_inputs:
      - "基础加工分类下有哪些"
    expectations:
      # 用户问「分类下有哪些」是想看分类下的加工项，正确工具是 processing_item_query
      # （processing_item_manage 的 description 明确「仅查看加工项列表用 processing_item_query」，
      # list_categories 是查分类树 CRUD）。原断言误写 processing_item_manage(list_categories)。
      - tool: processing_item_query
    data_checks:
      - "返回分类列表"
    skip_reason: ""
    merge_log: "verification 2.14 独有；2026-09-09 校准：期望工具 processing_item_manage(list_categories) 与工具 description 矛盾（查询加工项应走 processing_item_query），改为 processing_item_query"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_tools_processing_item_manage.py"
      ci:
        - agent-eval.yml
      verifies: []

  - id: PP-003
    legacy_id: P005
    title: "加工项 - 传名称自动解析 UUID"
    domains:
      - processing
    tier: adversarial
    tags:
      - id_resolve
      - adversarial
      - confirm
    truths_ref:
      - id-resolve.name
      - id-resolve.no-fabricate
    user_inputs:
      - "给遮光窗帘添加打孔"
      - "确认添加"
    expectations:
      - tool: interact
        args:
          component: confirm
      - tool: product_processing_item_manage
        args:
          action: add
          item_ids:
            - 打孔
    data_checks:
      - "success=true"
      - "确认卡先于写操作（GB/T 47746-2026 确认闸，与 OR-010/PR-010 模式一致）"
    skip_reason: ""
    merge_log: "eval P005 独有（名称 ID 解析）；2026-09-05 #2854 适配 #2785 确认闸：改多轮确认流（轮1 interact(confirm)，轮2 确认后 add）"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_tools_processing_item_manage.py"
        - "backend/ai-agent-service/tests/test_id_resolver.py"
      ci:
        - agent-eval.yml
      verifies: []

  - id: PP-005
    legacy_id: ""
    title: "加工项查询 - 按适用商品分类筛选并透传关联数据"
    domains:
      - processing
    tier: normal
    tags:
      - processing_item
      - category
      - product_category
    truths_ref:
      - processing-manage.crud
      - product-sku-stock.create-flow
    user_inputs:
      - "给窗帘分类筛选可用的加工项"
    expectations:
      - tool: processing_item_query
    required_args:
      - tool: processing_item_query
        fields:
          - applicable_category_id
    data_checks:
      - "processing_item_query 携带 applicable_category_id 时，admin-api 请求参数含 applicableProductCategoryId（按适用商品分类过滤加工项）"
      - "响应条目透传 applicable_product_categories（加工项配置的适用商品分类 ID 列表），供 LLM 按分类推荐加工项"
      - "applicable_product_categories 为空 = 适用所有商品分类（兼容历史数据，不参与过滤变化）"
    skip_reason: ""
    merge_log: "2026-09-06 新增（issue #2964）：加工项「适用商品分类」关联此前无任何消费方，本 case 固化加工项查询按适用分类筛选 + 响应透传"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_tools_processing_item_query.py"
        - "backend/admin-api/src/test/java/com/migao/admin/service/ProcessingItemServiceTest.java"
      ci:
        - agent-eval.yml
        - pr-check.yml
      verifies: []

  - id: PP-004
    legacy_id: P006
    title: "加工项 - 传序号自动解析 UUID"
    domains:
      - processing
    tier: adversarial
    tags:
      - id_resolve
      - adversarial
      - sequence
      - confirm
    truths_ref:
      - id-resolve.index
    user_inputs:
      - "给遮光窗帘添加第1、3、5个加工项"
      - "确认添加"
    expectations:
      - tool: interact
        args:
          component: confirm
      - tool: product_processing_item_manage
        args:
          action: add
    data_checks:
      - "success=true"
      - "确认卡先于写操作（GB/T 47746-2026 确认闸，与 OR-010/PR-010 模式一致）"
      - "item_ids 解析自序号 1/3/5 对应加工项（LLM 可传名称或序号，resolver 兜底；序号解析单测见 test_id_resolver.py）"
    skip_reason: ""
    merge_log: "eval P006 独有（序号 ID 解析）；2026-09-05 #2854 适配 #2785 确认闸：改多轮确认流（轮1 interact(confirm)，轮2 确认后 add）；action 强校验 + success=true 落评分（#2854 P0-3），item_ids 不写死数字——实测 LLM 会把序号翻译为名称传参（业务等价），序号→UUID 解析真值由 test_id_resolver.py 单测覆盖"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_tools_processing_item_manage.py"
        - "backend/ai-agent-service/tests/test_id_resolver.py"
      ci:
        - agent-eval.yml
      verifies: []

  - id: PP-006
    legacy_id: ""
    title: "加工项计价方式 - 按米/按套/一口价/按面积，无 per_piece 与每米数量"
    domains:
      - processing
    tier: normal
    tags:
      - processing_item
      - pricing
    truths_ref:
      - processing-manage.crud
      - product-sku-stock.create-flow
    user_inputs:
      - "查询打孔加工的计价方式"
      - "新增加工项，计价方式选按个"
      - "名称叫测试加工，分类选打孔加工"
      - "确认"
    expectations:
      - tool: processing_item_query
        args:
          keyword: "打孔"
      - tool: processing_item_manage
        args:
          action: create_processing_item
    data_checks:
      - "processing_item_query 响应条目无 per_meter_quantity（每米数量已回滚移除，issue #3005）"
      - "加工项计价方式仅 per_meter / per_set / fixed / per_area——per_piece 创建被拒绝（行业加工费按米计价、辅料含在加工费中）"
      - "商品详情 processingItems 无 custom_per_meter_quantity / perMeterQuantity（商品级密度覆盖已回滚）"
    skip_reason: ""
    merge_log: "2026-09-07 改写（issue #3005，回滚 #2986）：行业加工费按米计价、辅料（罗马圈/四爪钩等）含在按米加工费中——per_piece 与「每米数量」密度不符合实际（数量对不上车间工艺、B 端无法对账），已回滚移除；PP-006 由密度配置用例改为计价方式回归断言"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_tools_processing_item_query.py"
        - "backend/ai-agent-service/tests/test_tools_processing_item_manage.py"
        - "backend/admin-api/src/test/java/com/migao/admin/service/ProcessingItemServiceTest.java"
      ci:
        - agent-eval.yml
        - pr-check.yml
      verifies: []

