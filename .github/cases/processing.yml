  - id: PP-013
    legacy_id: ""
    title: "特殊选项全登记 - 19 项无第四类未登记（条件工序/计件系数/不计件 三分类门禁）"
    domains:
      - processing
    tier: normal
    persona: ""
    tags:
      - processing
      - production
      - piecework
      - special_options
    truths_ref:
      - processing-manage.crud
    # ── 覆盖说明（issue #4230 v1a-PY）──
    # 病灶：真值源 docs/curtain-production-rules.md §1【默】列了 19 项「特殊选项」（下单勾选，
    # 影响用料/工序/计件系数），而 routing.py 的 SPECIAL_OPTION_ROUTINGS 只映射了 9 项
    # ⇒ 其余 10 项**既不加工序、也不加系数、也没有任何登记**：「忘了映射」与「本来就不计件」
    # 在数据上长得一模一样（都是 `.get(opt)` → None 的静默黑洞）。
    #
    # 本用例钉的是**结构判据**（与 PP-010 的分工）：PP-010 是生产确定性核心的**宽覆盖**
    # （build_routing 基准路线 + 条件工序 + 应做数量 + 计件）；PP-013 专钉「19 项每一项都必须
    # 落在 加工序 / 加系数 / 不计件 三类之一，**不允许第四类未登记**」这条门禁。
    # 另有：5 道新工序入库且字段齐全、三条复用映射的**锚点位置**（前后相邻工序）、
    # 系数结构（一分二 ×1.7 / `operation_name` 限定档可用 / 无选项恒 1.0）、
    # `余料带回(布)` 路线不变且 factor 仍 1.0、无选项时不回归（逐值）。
    #
    # 红证（实现前逐条红，已在 PR 报告留痕）：10 个未登记选项 ⇒ 门禁点名；
