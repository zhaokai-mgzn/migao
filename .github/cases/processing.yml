dmin-web/tests/unit/pages/production-routings.test.tsx`（㉖-① ~ ㉖-⑧）+ `frontend/admin-web/tests/unit/components/OperationsProvenance.test.tsx`。⑥ **写面旧形态工序名 ⇒ 422 拒（拒绝，不归一）**（issue #4642，2026-09-20；本条 ④ 的「不加阻断式校验」随之改判为「**前端**不加、**后端**拒」）：`POST /api/admin/production/operations` 的 `name` 走 `rejectVariantOperationName` —— 判据两条：① 归一后**不等于自身**（该名**是**归一表里的已登记旧形态，如 `布三边` / `布帘车被` / `精裁-布`；判据直接来自**既有** `normalizeOperationName`，不新造第二份表）；② 以 `-布` / `-纱` / `-帘` 结尾（**未登记**的「名字 + 部位后缀」写法，如 `定制-布` —— 部位词表是**闭**的 ⇒ 形态可判定，对已登记 / 未登记**一视同仁**）。命中 ⇒ **422 + 可行动 `error.details`** 且**不落库**；**为什么是拒绝而不是归一**：`布三边` 归一成 `三边` 会与**既有** `三边` 行撞唯一索引 `uk_production_operations_tenant_name`（⇒ 500 或建出重复/半成品）。病根（改前形态）：同一个请求里 `name` 原样落库、而 `attachPositions` 用归一后的逻辑名建矩阵行 ⇒ **同一道工序在库里两名并存**（库里 `布三边` + 矩阵行 `三边`），且 `name` 会经目录 / 孤儿接入弹窗上屏。**反向护栏**：合法逻辑名（`精裁` / `三边`）与不含部位后缀的自定义名（`测试22` / `罗马帘穿杆`）一律放行（**不得误伤**）；文案**不得**说「是旧形态」（判据 ② 命中的名字不在归一表里 ⇒ 说它「是旧形态」是事实错误，见 #4647 / D2）。证据：ProductionControllerTest「#4642 POST /operations 命中旧形态工序名（布三边）⇒ **422 + error.details 逐条**，不落库」+ ProductionOperationCommandServiceTest 的部位后缀边界三态（`-布`/`-纱`/`-帘` 一律拒 · 文案不得说「旧形态」 · 合法自定义名放行）。⑦ **读面：catalog / routing-gaps 的 `name` = 逻辑名，库口径原名另走显式新键 `library_name`**（issue #4642，同一条泄漏路径的读面半边）：`GET /operations-catalog` 的 `operationView` 与 `GET /routings` 缺口清单的 `routingGaps` **两处**，`name` 一律改为**读时归一后的逻辑名**（`精裁-布` ⇒ `精裁`、`布三边` ⇒ `三边`，走**同一份** `normalizeOperationName`，**没有第二份实现**）；库口径原名另走**显式新键 `library_name`**，并在 `operationView` 的 javadoc 明写「**web 界面不得渲染该键**（工人端快照名口径）」—— 机械判据 = `tests/unit_ci_workflows/test_op_name_registry_guard.py` 的「FE 不得在 JSX 渲染位置取 `library_name`」。**`production_operations.name` 列一字未动**（纯读时派生，**无数据迁移**）。**反向护栏**：归一**只**动 `name`（同行 `unit` / `unit_price` / `group` / `scope` 一字不变）、**幂等**（逻辑名再归一不变；自定义名 `测试22` 归一后等于自身 ⇒ 原样返回）、除新增 `library_name` 外键集不变。证据：ProductionControllerTest「operationsCatalogNormalizesLegacyVariantNamesOnRead」「routingGapsNormalizesLegacyVariantNamesOnRead」+ ProductionOperationQueryServiceTest「catalogGroupsOperationsByGroup」（**改判**：`name` 归一 + 新增 `library_name` 逐行断言，顺序与条数一字不变）。"
