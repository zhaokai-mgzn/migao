  - id: PP-013
    legacy_id: ""
    title: "特殊选项全登记 - 19 项无第四类未登记（条件工序/计件系数/不计件 三分类门禁）"
    domains:
      - processing
    tier: normal
    persona: ""
    tags:
      - processing
      - production
      - piecework
      - special_options
    truths_ref:
