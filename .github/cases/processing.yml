  - id: PP-006
    legacy_id: ""
    title: "加工项计价方式 - 按米/按套/一口价/按面积，无 per_piece 与每米数量"
    domains:
      - processing
    tier: normal
    tags:
      - processing_item
      - pricing
    truths_ref:
      - processing-manage.crud
      - product-sku-stock.create-flow
    user_inputs:
      - "查询打孔加工的计价方式"
      - "新增加工项，计价方式选按个"
      # 分类名归一（#3544 / REPORT §2.3 建议 3）：独立栈种子里加工分类只有
      # pcat_eval_curtain「窗帘加工」（xiaobu_eval_seed.sql:24），原输入「分类选打孔加工」
      # 是**加工项名（纳米圈打孔）/ 分类名混淆** —— 实测 run 34807151893 R3：agent 如实回
      # 「加工分类里没有『打孔加工』，目前只有一个…」并降级到「窗帘加工」，白耗一轮。
      # 本用例的真值内核是**计价方式枚举**（per_meter/per_set/fixed/per_area，无 per_piece），
      # 不是分类名，故改用种子里真实存在的分类名。
      - "名称叫测试加工，分类选窗帘加工"
      - "计价方式按米，单价 8 元"
      - "确认"
    expectations:
      - tool: processing_item_query
        args:
          keyword: "打孔"
      - tool: processing_item_manage
        args:
          action: create_processing_item
    # ── 假绿升级（#3544 / REPORT §2.3 建议 2：「调了 ≠ 成了」）──
    # `expectations` 里出现工具名只证明「模型想建」：三个独立 run（34805827043 /
    # 34806789461 / 34807151893）里 create_processing_item **每次都失败**
    # （`failed=processing_item_manage!参数校验失败`；根因=请求缺 pricingMethod/unitPrice，
    # 由 #3543 在工具/契约层修复），用例却因只断言「调用过」而判 ✅（假绿）。
    # ① must_succeed = canonical 写成功断言（issue #3544 首选形态，fail-closed：
    #    一次都没成功 → 判红；被 confirm 门禁拦下的尝试不算违规，只要最终成功）；
    # ② output_verify = 产出侧值核对（must_succeed 只说"成了"，说不出"建的是哪一项、
    #    什么计价方式"）—— 两者互补，不是替代（同 OR-016 的 expectations + amount_verify 形态）。
    must_succeed:
      - tool: processing_item_manage
        action: create_processing_item
    output_verify:
      - tool: processing_item_manage
        expect:
          # 真建出用户点名的那一项（而不是误建别的项）
          name: "测试加工"
          # 真值内核（计价方式枚举）：按米 → per_meter，取自 admin-api
          # ProcessingItemResponse 的落库回读值（#3543 修复后 _create_item 显式下发 pricingMethod）
          pricingMethod: "per_meter"
    data_checks:
      - "processing_item_query 响应条目无 per_meter_quantity（每米数量已回滚移除，issue #3005）"
      - "加工项计价方式仅 per_meter / per_set / fixed / per_area——per_piece 创建被拒绝（行业加工费按米计价、辅料含在加工费中）"
      - "商品详情 processingItems 无 custom_per_meter_quantity / perMeterQuantity（商品级密度覆盖已回滚）"
    skip_reason: ""
    merge_log: "2026-09-07 改写（issue #3005，回滚 #2986）：行业加工费按米计价、辅料（罗马圈/四爪钩等）含在按米加工费中——per_piece 与「每米数量」密度不符合实际（数量对不上车间工艺、B 端无法对账），已回滚移除；PP-006 由密度配置用例改为计价方式回归断言。2026-09-14 校准（#3544，REPORT §2.3）：① 假绿升级——补 must_succeed（canonical 写成功断言，fail-closed）+ output_verify（name/pricingMethod 产出核对），此前只断言「调用过」，工具三次真执行全失败仍判 ✅（真缺口见 #3543）；② 输入「分类选打孔加工」改为种子里真实存在的「分类选窗帘加工」（原写法是加工项名/分类名混淆，agent 只能如实说没有该分类，白耗一轮）"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_tools_processing_item_query.py"
        - "backend/ai-agent-service/tests/test_tools_processing_item_manage.py"
        - "backend/admin-api/src/test/java/com/migao/admin/service/ProcessingItemServiceTest.java"
      ci:
        - agent-eval.yml
        - pr-check.yml
      verifies: []


  # ==========================================================================
  # LLM 行为正向用例（issue #3568）：补 processing_item_manage 的**改价 / 停用**路径
  # 缺口。加工项契约修复包（#3591）收口时如实标注：`.github/cases/**` 里零
  # `update_item` / `toggle_item_status` 用例，它的 CI 重放只能证「工具健康度与
  # create 路径无回归」，**不能真实覆盖改价/停用路径**（PP 域重演 PG 域那个零覆盖缺口）。
  # ==========================================================================

  - id: PP-007
    legacy_id: ""
    title: "米宝加工项 LLM 行为：只改单价不清空其它字段（部分更新语义）"
    domains:
      - processing
      - chat
    tier: normal
    tags:
      - processing_item
      - llm_behavior
      - tool_call
      - update
    truths_ref: []
    user_inputs:
      # 自包含/残留免疫（照 PG-015/PG-016 先例）：**点名种子/目录里真实存在的加工项**。
      # `纳米圈打孔` 是 xiaobu_eval_seed.sql 的种子加工项（pi_eval_punch，¥8.00/米，
      # pricing_method=per_meter），不是假设存在的对象。
      - "把加工项纳米圈打孔的单价改成 9.5 元一米"
      - repeat_until:
          tool_called: processing_item_manage
          max: 3
        fallback: "确认"
      # 回读轮：`update_item` 的返回是 `{item_id, price}`（**只含本次下发的字段**，
      # 不是合并后的全量对象），所以「其它字段有没有被清空」只能靠**回读**判定。
      - "再看下加工项纳米圈打孔的单价和计价方式"
      - repeat_until:
          tool_called: processing_item_query
          max: 3
        fallback: "确认"
    expectations:
      - tool: processing_item_manage
        args:
          action: update_item
      - tool: processing_item_query
    must_succeed:
      - tool: processing_item_manage
        action: update_item
    required_args:
      - tool: processing_item_manage
        fields:
          - item_id
          - price
    output_verify:
      # ⚠️ `action` 必写（本工具多 action：create_processing_item / update_item /
      # delete_item / toggle_item_status / …）—— 不限定会取**首个成功调用**的 payload，
      # 可能核到别的 action 上（假绿/假红）。
      - tool: processing_item_manage
        action: update_item
        expect:
          price: 9.5          # 下发的就是新单价（真值来自用户输入原文）
    forbidden_text:
      - "暂不支持"
      - "功能不存在"
      - "没有这个功能"
      - "修改失败"
      - "更新失败"
      - "无法修改"
    data_checks:
      # 本类用例的**核心断言**（对照 #3591 修的「GET→merge→PUT 全量」语义）：
      # 只改单价不得把 name / pricingMethod / categoryId 清空。回读轮是本判定的
      # 证据面（`update_item` 的返回不含未下发字段，工具层无从自证）。
      - "回读结果中 name 仍为「纳米圈打孔」、pricingMethod 仍为 per_meter（未被清空）——只改 price 不得清空其它字段"
    skip_reason: ""
    merge_log: "2026-09-14 新增（issue #3568）：`processing_item_manage(action=update_item)` 此前**零用例覆盖**（#3591 收口时如实标注的覆盖边界：只有 create 路径被重放）。断言机器可判：must_succeed(action=update_item) + required_args[item_id,price] + output_verify(price=9.5，显式 action) + forbidden_text。回读轮覆盖「部分更新不得清空其它字段」（#3591 的 GET→merge→PUT 语义），工具层无法自证故由回读判定。"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_tools_processing_item_manage.py"
        - "backend/admin-api/src/test/java/com/migao/admin/service/ProcessingItemServiceTest.java"
      ci:
        - agent-eval.yml
      verifies: []

  - id: PP-008
    legacy_id: ""
    title: "米宝加工项 LLM 行为：停用加工项（toggle_item_status → inactive）"
    domains:
      - processing
      - chat
    tier: normal
    tags:
      - processing_item
      - llm_behavior
      - tool_call
      - toggle
    truths_ref: []
    user_inputs:
      - "把加工项纳米圈打孔停用"
      - repeat_until:
          tool_called: processing_item_manage
          max: 3
        fallback: "确认"
    expectations:
      - tool: processing_item_manage
        args:
          action: toggle_item_status
    must_succeed:
      - tool: processing_item_manage
        action: toggle_item_status
    required_args:
      - tool: processing_item_manage
        fields:
          - item_id
          - status
    output_verify:
      # ⚠️ 显式 `action`（多 action 工具，理由同 PP-007）
      - tool: processing_item_manage
        action: toggle_item_status
        expect:
          status: inactive    # 工具返回 {item_id, status}，目标状态即停用
    forbidden_text:
      - "暂不支持"
      - "功能不存在"
      - "没有这个功能"
      - "停用失败"
      - "无法停用"
    data_checks:
      - "status 目标值为 inactive（工具返回 `{item_id, status}` 可直接核对）；重复执行幂等（再停用一次仍是 inactive）"
    skip_reason: ""
    merge_log: "2026-09-14 新增（issue #3568）：`processing_item_manage(action=toggle_item_status)` 此前**零用例覆盖**（同 PP-007 的覆盖边界）。断言机器可判：must_succeed(action=toggle_item_status) + required_args[item_id,status] + output_verify(status=inactive，显式 action) + forbidden_text。⚠️ 数据副作用：停用种子加工项 `pi_eval_punch` 会影响依赖它的用例（OR-016/OR-024 等加工项流程）—— 评测栈每次重建，同栈内请让本条**后跑**（或由 pre_clean 复位）；本包未新增 runner 侧 pre_clean 类型，故在此显式标注。"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_tools_processing_item_manage.py"
      ci:
        - agent-eval.yml
      verifies: []
