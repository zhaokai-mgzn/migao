    # ── 覆盖说明（issue #4230 v1a-PY）──
    # 病灶：真值源 docs/curtain-production-rules.md §1【默】列了 19 项「特殊选项」（下单勾选，
    # 影响用料/工序/计件系数），而 routing.py 的 SPECIAL_OPTION_ROUTINGS 只映射了 9 项
    # ⇒ 其余 10 项**既不加工序、也不加系数、也没有任何登记**：「忘了映射」与「本来就不计件」
    # 在数据上长得一模一样（都是 `.get(opt)` → None 的静默黑洞）。
    #
    # 本用例钉的是**结构判据**（与 PP-010 的分工）：PP-010 是生产确定性核心的**宽覆盖**
    # （build_routing 基准路线 + 条件工序 + 应做数量 + 计件）；PP-013 专钉「19 项每一项都必须
    # 落在 加工序 / 加系数 / 不计件 三类之一，**不允许第四类未登记**」这条门禁。
    # 另有：5 道新工序入库且字段齐全、三条复用映射的**锚点位置**（前后相邻工序）、
    # 系数结构（#4589 起**下单流程**零消费 —— `routing.py` 不再给实例写 `factor` 键；
    # ⚠️ #4604 起 `compute_piecework` 对**带 `factor` 的历史实例**仍乘 ⇒ 「零消费」只针对下单流程）、
    # `余料带回-布` 路线与实例逐值不变、无选项时不回归（逐值）。
    #
    # 红证（实现前逐条红，已在 PR 报告留痕）：10 个未登记选项 ⇒ 门禁点名；
    # 5 道新工序不在 OPERATION_CATALOG ⇒ KeyError；三条映射未落 ⇒ 路线里没有该工序；
    # `OPTION_FACTOR_SCOPES` 未定义 ⇒ import 即红（Collection Error）。
    # #4589 追加红证：改前「一分为二 ⇒ 每道 factor = 1.7」「计件合计 = 不带 × 1.7」
    # ⇒ 改判后的「实例无 factor 键」「合计相等」两条**逐条红**（正好差 1.7 倍）。
    # #4604 再改判红证：历史半边（当时快照 1.7）改前实测合计 = 不带选项（1.0 倍）⇒ 期望 1.7 倍 **红**；
    # 新半边（无 `factor` 键 ⇒ 缺省 1）改前改后都绿 = **反向护栏**（防系数被加回新单）。
    # ⚠️ 双端（persona 空）：确定性逻辑由单测全量覆盖（tests/test_production/），不进 agent-eval 冒烟。
    user_inputs:
      - "这个加工单有哪些特殊选项，分别怎么算工序和计件"
    expectations:
      - tool: direct_reply
    data_checks:
      - "19 项真值源特殊选项**每一项**都落在三类之一（加工序=SPECIAL_OPTION_ROUTINGS / 加系数=OPTION_FACTOR_SCOPES / 不计件=NON_PIECEWORK_OPTIONS），不允许第四类「未登记」"
      - "A′ 类 5 道新工序（绑带-纱/logo条-布/立边-布/扣环-布/防翘扣-布）在 OPERATION_CATALOG 中存在且分组/单位/单价齐全，且有映射指向它们"
      - "三条复用映射的锚点位置正确：布绑带→绑带-布 在 布帘车被 之后、余料做帘头→帘头制作 在 布三边 之后、抱枕→抱枕 在 外帘打卷 之后（断言前后相邻工序）"
      - "系数口径两半（issue #4604 改判，用户裁定 B 不追溯）：**下单流程**零消费 —— 真值源表 `OPTION_FACTOR_SCOPES` **保留**（它是 V59/V72 已发布迁移种子与 schema.sql 终态的真值源镜像，三源收敛守卫按它比对），「一分为二」命中该档位时工序实例**逐值不变**、且**没有 `factor` 键**（往表里注入逐工序/逐部位限定档后实例仍逐值不变）；**计件读取**半边 —— 新实例（无 `factor` 键）系数缺省 1 ⇒ 合计 = 不带选项，**历史实例（当时快照 1.7）仍按 1.7 倍**（历史金额一字不变）"
      - "不计件显式：余料带回-布/-纱 ⇒ 路线与工序实例**逐值不变**（**没有 `factor` 键**），且它们是**被登记**为不计件而不是「查不到映射」"
    skip_reason: "[backend-contract] 生产确定性核心是纯函数（app/production/），由单元测试全量覆盖（tests/test_production/test_special_options.py），非 LLM 行为，不进入 agent-eval 冒烟（同 PP-010 惯例）"
    merge_log: "2026-09-18 新增（issue #4230 v1a-PY）：真值源 19 项特殊选项的「三类全登记」结构门禁 + 5 道新工序 + 条件工序锚点 + 计件系数结构；与 PP-010 的分工 = PP-010 宽覆盖生产确定性核心，PP-013 专钉「19 项无第四类未登记」 ｜ 2026-09-19（issue #4589）：**系数从算法退场**（用户裁定「计件工资 = 数量 × 计件单价，不需要考虑系数」）⇒ 本用例的系数两条按新口径改判：真值源表 `OPTION_FACTOR_SCOPES` 保留（已发布迁移种子的镜像，三源收敛守卫依赖它）但**零消费**；判据从「一分为二 ⇒ factor=1.7」改成「实例**无 factor 键**、逐值不变」，红证同源（改前正好差 1.7 倍） ｜ 2026-09-20（issue #4604 再改判，用户裁定 B **不追溯**）：#4589 的「零消费」只对**下单流程**成立（`routing.py` 仍不写 `factor` 键）；`compute_piecework` 对**带 `factor` 的历史实例**必须继续乘。本用例的「进了钱」判据拆成两半（`test_erp_name_money_halves_are_split_by_snapshot`）：新实例（无 `factor` 键）⇒ 合计 = 不带选项；**历史实例（快照 1.7）⇒ 合计 = 不带选项 × 1.7**。红证：改前历史半边实测 1.0 倍而期望 1.7 倍 ⇒ 红。"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_production/test_special_options.py"
      ci:
        - pr-check.yml
      verifies: []

