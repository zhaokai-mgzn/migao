    data_checks:
      - "判据 1·**行加工费 = 组合价(元/米) × 加工费米数 + Σ 选中特殊选项(单价(元/套) × 套数)**，套数恒 1（R8「1 套 = 1 个订单行」），逐分可核对：组合 ¥8.00/米 × 12.30 米 = 98.40，选项「加铅块」¥6.00/套 +「接高」¥2.50/套 = 8.50 ⇒ 行金额 106.90（**只算组合那半 ⇒ 98.40 ⇒ 红**）。证据：ProcessingFeeCalculatorTest「specialOptionsAddPerSetFeeOnTopOfCombinationHalf」（+ FeePreviewControllerTest「passesSpecialOptionsThroughWithLineAmount」钉 HTTP 面 139.00）。**回归不变量**：没选任何特殊选项 ⇒ `special_options` 为空数组且 `special_options_total = 0`，行金额与 #4406 口径逐分相同（`matchedCombinationUsesCombinationPriceTimesProcessingMeters`）。"
      - "判据 3·**选项未定价（`customer_unit_price IS NULL`）⇒ `special_options[].priced=false` + 单价 null + 计 0 + 可行动 hint**（指向 `/production/processing-fees`），且 `fee_source` 仍 `matched`（组合那半有效）；**静默按 0 收（priced=true / hint=null）⇒ 红**。证据：ProcessingFeeCalculatorTest「unpricedOptionIsExplicitlyVisibleAndNotSilentlyZero」。匹配必须**精确相等**（名字差一个字 ⇒ 视为未定价，不误收）：「specialOptionMatchingIsExact」。"
      - "判据 2′·**组合未定价 ⇒ 只把「组合那半」记 0；已定价的特殊选项照常计入行金额**（用户裁定 2026-09-19 / issue #4594：「选择A的同时，告警仍然要有，而且要告知具体组合明细」）。三种 unpriced 形态（组合无价 / 无加工项 / 缺米数）一律：`amount`=0、`fee_source=unpriced`、**不回落** Σ 加工项，但 `lineAmount()` = 0 + Σ 已定价选项价。**选项是按套的独立一笔账**，与组合是否定价、米数是否齐全无关；选项**未定价**时仍是 `priced:false` + 计 0（不许静默按 0 收）。证据：ProcessingFeeCalculatorTest「unmatchedCombinationStillChargesPricedSpecialOptions」（**红证**：改前 `lineAmount` 0 vs 期望 6.00）「unmatchedCombinationWithUnpricedOptionStaysZeroAndVisible」「missingMetersStillChargesPricedSpecialOptions」「emptyCompositionStillChargesPricedSpecialOptions」+ OrderServiceTest「createOrder_unpricedCombinationStillChargesPricedSpecialOptions」（**红证**：改前总额 599.00 vs 期望 605.00）「readPathsReturnStoredOptionFeeForUnpricedRow」。**影响面（显式登记）**：组合没配价时订单金额会**变大**（开始收已定价的选项价）—— 这是用户要的口径。"
      - "🔴 **合成价一律不得参与取价 + 选项初始价按租户初始化**（issue #4525 复核的 P1 钱风险；② 于 2026-09-19 按用户裁定**改判**）：`MigrationRunner` 在 **admin-api 启动时**执行迁移 ⇒ **生产一样会跑**，而取价侧只过滤 `status='active'`（**不按 `source` 过滤**）⇒ ① 92 行组合价**全部** `status='disabled'`（有任一行 active ⇒ 生产 tenant 1 的真实订单按随机价收费）；② 特殊选项价（V82；用户裁定「特殊选项缺乏单价，通常按套收费」「随便初始化一份价格数据，单价是元/套」）**按租户初始化恰好 16 项**（元/套）、**只在 `customer_unit_price IS NULL` 时写**（不覆盖商家改过的价）、**非 option 行保持 NULL**；该列**无 status 可门控** ⇒ 这 16 个占位值**会真的参与对客取价**（商家改价即覆盖 —— 已知代价，用户已接受）。证据：test_option_fee_seed.py「test_synthetic_combination_rows_are_all_disabled」「test_v82_prices_exactly_the_option_rows」（均带注入式自证）。"
      - "判据 9·**测试数据带 `source='synthetic'` 且两次生成逐值相同**：V77 的组合价目（92 行 = 91 组合 + 缎带）与选项价（16 条）逐值等于固定种子生成器 `tests/unit_ci_workflows/synthetic_processing_fee_data.py` 的重算结果；e2e fixture 重建为 L2 特征词典（旧的 13 条编造数据一条不剩）。证据：tests/unit_ci_workflows/test_option_fee_seed.py「test_seed_rows_match_the_deterministic_generator」「test_seed_is_deterministic_across_two_runs」「test_seed_carries_synthetic_provenance」「test_e2e_fixture_is_the_rebuilt_feature_dictionary」。"
      - "判据 10·**计件路径零读取 `customer_unit_price`**（两套账不互读）：全 `main` 源码里该标识符只允许出现在**取价层**（ProcessingFeeCalculator）、**实体字段声明**、以及**配置面**（读面 ProductionRoutingReadService + 其端点 ProductionController —— issue #4567 用户裁定「特殊选项要有定价」⇒ 商家必须能看见并修改这个价，两处都只**原样透出/写入**、不参与任何计件计算）；同表 `factor`（计件系数）改了 ⇒ 对客加工费一字不变。证据：test_option_fee_seed.py「test_piecework_paths_never_read_customer_unit_price」（含注入式自证 test_piecework_read_guard_detects_injected_read）+ ProcessingFeeCalculatorTest「customerFeeNeverReadsPieceworkFactor」。"
      - "判据 11·**历史订单一字不变**（R13 快照冻结）：读面仍读落库的 `processingFeeDetail`（`storedFee`），**不重算**；落库明细里的选项价原样读出。证据：test_option_fee_seed.py「test_read_paths_still_read_the_persisted_detail」+ ProcessingFeeCalculatorTest「storedFeeReadsPersistedSpecialOptions」。"
      - "迁移面·V77 **幂等**且带 `COMMENT ON COLUMN`（写明「对客售价账」+「计件路径绝不读本列」+「NULL = 未定价」）；bootstrap `docs/sql/schema.sql` 同步终态（该路径不跑迁移链）。证据：test_option_fee_seed.py「test_v77_adds_customer_unit_price_column」「test_v77_migration_is_idempotent」「test_schema_sql_carries_the_new_column」。"
      - "**边界登记**：① 91 个组合名是按 12 个特征**确定性枚举的合成集**（`31 + 31 + 29`），**不等于 ERP 图里那 91 项真实名字**（ERP 点名而本枚举没有的例：`打孔+拼接+倒幅+定型`、`韩折+超高+接高+定型`、`韩折+超高+超宽+定型`）⇒ 真实名单待客户导出后**只换数据、不动结构**；② 特殊选项初始价 = **V82 的 16 项占位值**（用户裁定 2026-09-19 **推翻** V77 的「不落库」口径：`customer_unit_price` 无 status 可门控 ⇒ 会参与取价，商家改价即覆盖；生成器仍保留 16 条合成价作测试资产）。"
      - "**与设计文档的冲突（以代码事实为准，已显式登记）**：设计 §7 写「19 项特殊选项价」，但 §4.1 冻结「非 `option` 行一律 `NULL`」；19 项里只有 **16 项**在 `production_route_rules` 里是 `trigger_kind='option'` 行（`余料带回-布`/`余料带回-纱` 不计件、`一分为二` 只有计件系数档）⇒ 只给这 16 条定价，另 3 项**不造规则行**（造了就违反 §4.1 与 R11 边界）。逐条点名判据：test_priced_option_rows_are_exactly_the_option_rules。**D5 豁免**：`routing.py::ROUTE_RULES` 不带本列（agent 侧豁免）⇒ test_production_catalog_seed.py 显式登记为**债务类**豁免，待 agent 统一重构时销账。"
