# cases/processing.yml — 加工项域用例（并源转换）
# 来源：eval P004~P006 + verification 2.13/2.14 → 4 条

schema: "case-contract/1.0"
domain: processing

cases:
  - id: PP-001
    legacy_id: P004
    title: "加工项选择 - 分页翻页"
    domains:
      - processing
    tier: normal
    tags:
      - processing_item
      - pagination
    truths_ref:
      - processing-manage.crud
      - processing-manage.category-sort
    user_inputs:
      # 去价格点名（#3538，同 PR-005/PR-007/PR-021 #3518 先例）：独立栈种子只有
      # ¥168 的「遮光窗帘」，点名「100元的那件」→ agent 合理澄清「没有 ¥100 的款式」白耗一轮。
      - "给遮光窗帘添加加工项"
      - "选打孔加工和韩式折边"
      - "确认"
    expectations:
      - tool: product_processing_item_manage
        args:
          action: add
      - tool: processing_item_query
    # ── 效果层断言（issue #4230 的 burn-down 缴费；修 CASE-TRUST-NO-EFFECT-ASSERTION）──
    # 病根（`assertion_taxonomy` 规则 a / #3778「调用了 ≠ 成了」）：本用例此前**只有工具名期望**
    # + 散文 `data_checks`（"data.pageMeta != null"）⇒ `product_processing_item_manage` 返回
    # `success=false`（如 `processing_item_not_found` / 权限拒绝）也照样判 ✅。
    # 修法 = **行为层**（非纸面）：加 `must_succeed` 断「至少一次真的 add 成功」，
    # 且按 `action: add` 过滤（同工具别的 action 成功不能顶替，见 `local_runner.check_must_succeed`
    # 的 issue #3681 语义）。这是**运行期**判据 —— 该用例非 skip（`skip_reason: ""`）⇒ 真会跑。
    # 确定性证据（覆盖该行为的测试方法）：`test_tools_product_processing_item_manage.py::TestExecute::test_add_items_success`
    #   —— 断言 `result.success is True` 且 `client.patch.assert_awaited_once()`。
    must_succeed:
      - tool: product_processing_item_manage
        action: add
    data_checks:
      - "data.pageMeta != null"
    pre_clean:
      # 去重只按关键词（#3538）：原先的 price 过滤条件（限 100 元）在独立栈
      # （种子遮光窗帘 ¥168 款）恒不匹配 → 等于没去重；同名「遮光窗帘」有副本时
      # agent 会发「哪一件」选择卡。按关键词去重保留最早创建的
      # （= 种子商品，加工项最全），删掉其余副本。
      - type: product_dedupe
        product_keyword: "遮光窗帘"
    # ── 前置自断言（issue #3835 / `migao-dev-flow` §18.4）────────────────────────
    # 本用例的**全部语义**都建立在「按名搜「遮光窗帘」只命中 1 件」之上：有 2 件时 agent
    # **正确地**要求澄清（原文：「搜到两个同名「遮光窗帘」，需要先确认是哪一个」）⇒
    # `product_processing_item_manage` 永不执行 ⇒ 判红，而红的表现长得像「**agent 不干活**」
    # （指纹 `no_success(product_processing_item_manage)`）—— 归因全错。
    # 实证：判定跑 run 34908262839 首跑 `product_search(products=2 total=2)`，
    # 同一 run 重试 `products=1` 即通过。故把前置**声明出来**，由 runner 在运行期观测：
    # `expect: 1` 判"基线本就不成立"（上一跑残留），`max_growth` 默认 0 判"被并行用例中途改写"。
    # 前置不成立时折成 `precondition_not_applied(declared:product_count_for_keyword)`，
    # 与行为失败分属不同根因原子 —— 不再伪装成 agent 表现不好。
    precondition:
      - type: product_count_for_keyword
        source: "遮光窗帘"
        expect: 1
    skip_reason: ""
    merge_log: "eval P004 + verification 2.13（查询部分同义）+ 2.14 的查询段；2026-09-14 校准（#3538）：① 输入去「100元的那件」价格点名（独立栈种子只有 ¥168 款，点名不存在的价 → agent 澄清查无此价 → 流程不前进），自包含化同 AS-003（#3511）/CR-001/PR-005/PR-007/PR-021（#3518）先例；② pre_clean 去 price 过滤（关键词去重，原 price 过滤限 100 元、在种子 ¥168 的栈上恒不匹配）；2026-09-18 burn-down 缴费（issue #4230）：补 `must_succeed[product_processing_item_manage(action=add)]` 修 CASE-TRUST-NO-EFFECT-ASSERTION（此前只有工具名期望 + 散文 data_checks ⇒ 写工具返回 success=false 也判 ✅）；**这是行为层修复、不是纸面修复**（该用例 `skip_reason: \"\"` ⇒ 真会跑，断言由 runner 运行期判定）；确定性证据 = test_tools_product_processing_item_manage.py::TestExecute::test_add_items_success（断言 result.success is True + client.patch.assert_awaited_once）；断言只增不减：未改 expectations / data_checks / pre_clean / precondition 任何一条"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_tools_processing_item_query.py"
        - "backend/ai-agent-service/tests/test_tools_product_processing_item_manage.py"
      ci:
        - agent-eval.yml
      verifies: []

