# cases/customer.yml — 客户域用例（并源转换）
# 来源：eval M011 + verification 4.1~4.4 → 5 条

schema: "case-contract/1.0"
domain: customer

cases:
  - id: CU-001
    legacy_id: "4.1"
    title: "客户列表"
    domains:
      - customer
    tier: smoke
    tags:
      - query
      - smoke
    truths_ref:
      - customer-list.search-fields
      - customer-list.sort-page
    user_inputs:
      - "查客户列表"
    expectations:
      - tool: customer_manage
        args:
          action: list
    data_checks:
      - "返回客户列表（手机号脱敏：前3位+****+后4位）"
    skip_reason: ""
    merge_log: "verification 4.1 独有（M011 的客户查询只是旅程一环，不合并）"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_tools_base.py"
      ci:
        - agent-eval.yml
      verifies: []

  - id: CU-002
    legacy_id: "4.2"
    title: "客户详情 - 档案统计"
    domains:
      - customer
    tier: normal
    tags:
      - query
      - detail
    truths_ref:
      - customer-list.detail-shape
      - customer-list.detail-joins
    user_inputs:
      - "看张三的客户档案"
    expectations:
      - tool: customer_manage
        args:
          action: detail
    data_checks:
      - "profile.totalOrders / totalConsumption 为数值"
      - "orders.length <= 10 AND sessions.length <= 10"
    skip_reason: ""
    merge_log: "verification 4.2 独有"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_tools_base.py"
      ci:
        - agent-eval.yml
      verifies: []

  - id: CU-003
    legacy_id: "4.3"
    title: "查客户标签（只读；原「打标签」随 #5247 写能力下线改判）"
    domains:
      - customer
    tier: normal
    tags:
      - tag
      - write
    truths_ref:
      - customer-list.tag-todo
    user_inputs:
      # 2026-09-15 修三处用例真值错误（issue #3832，判定跑 34908262839 的 KEY_JOURNEY 红）：
      # ① 原输入「给张三加VIP2活跃标签」里的「VIP2活跃」**不是**种子标签目录里的标签
      #    （`fixtures/mibao_eval_seed.sql` 逐字只有 `VIP2` / `活跃` 两条，见 #3794）⇒ 改成
      #    目录里真有的 `VIP2`。注意**不能**改成让 agent 建标签：admin-api
      #    `CustomerService.addTagToCustomer` 对目录外 tagId 直接 notFound、
      #    `customer_manage._add_tag` 要求 `tag_id`（建标签是另一个 action `create_tag`）
      #    ⇒「目录外标签由 agent 创建」不是产品行为。
      # ② 原输入只给姓名「张三」——而 normal 档同栈里 `OR-010`（order.yml）建单时 admin-api
      #    会按手机号**自动 upsert 客户档案**（`CustomerService` 的 `sourceChannel("order")`
      #    分支）⇒ 库里多出一个**同名张三**（实测 run 34908262839：07:40:11 落库
      #    `phone=13812345678`）⇒ 两次尝试的 R1 都是 `customers=2 total=2` ⇒ agent 合理地
      #    发重名澄清卡、`add_tag` 永不发生。按 #3568 对 CU-004 的同一改法用**手机号唯一指代**
      #    （`customer_manage.list` keyword 支持手机号；种子客户 `cust_eval_zhangsan` 即
      #    13800138000，唯一命中）⇒ 对同名残留免疫，用例意图（打标签真落库）不变。
      - "张三（手机号 13800138000）都有哪些标签？"
      # ── 2026-09-24（issue #5247，B 端只读化）：原输入「给张三（手机号 13800138000）加VIP2标签」
      # 随写能力下线改判为**只读查询**（`customer_manage` 的 `add_tag` 已从源码删除，工具收窄为
      # 只读 {list, detail, list_tags}）；**确认轮（下方 auto_respond）随之删除** —— 答卡轮只服务
      # 写操作，只读查询无卡可答。以下注释保留为该轮的历史理由（#3518/#3568 口径）。
      # 收尾「答卡轮」（#3518/#3568 口径，同 CU-004/PR-005/PR-016）：agent 在收尾轮只发
      # confirm 卡、**裸文本「确认」不放行写操作**（文字 ≠ 点卡）→ 有卡答卡
      # （confirm→回 confirmValue），无卡才发 fallback 原文。原写法是裸文本「确认」——
      # 实测本 run 的重试尝试正是死在这一格：agent 在末轮才发 confirm 卡
      # （`confirm|…操作=添加标签、标签=VIP2、活跃|…`）而没有第 4 轮答卡。
      # ── 2026-09-24（issue #5247）：`- auto_respond: {fallback: 确认}` 这一轮**随写能力下线删除**
      # （只读查询没有确认卡可答；历史理由见上面的注释块）。
    expectations:
      # ── 2026-09-24（issue #5247，B 端只读化）：写 action `add_tag` 已从源码删除 ⇒ 改判到存活的
      # 只读路径 `action: list_tags`（写 action 不得残留：悬空声明永不满足，会阻塞 CI 的
      # action 绑定判据）。本用例改判为只读（`skip_reason` 保持为空 = 仍在 agent-eval 里跑）。
      - tool: customer_manage
        args:
          action: list_tags
    data_checks:
      - "标签清单逐条来自服务端（customer_manage list_tags），不得编造；只读，不得声称已加标签（原「add_tag 真实落库（customer_profiles.tags JSONB 写入），重复标签幂等跳过」是写路径断言，已随 #5247 写能力下线改判）"
    pre_clean:
      # `customer_keyword` 用**手机号**而不是姓名（#3568 口径）：admin-api 客户列表按
      # `created_at DESC` 排序（`CustomerService.getCustomerPage`）⇒ 重名时按**列表位置**
      # 定位会命中**最新建的那个张三**（OR-010 造的），不是种子客户 —— 清理会打在错的人身上。
      # 🔴 **2026-09-21 改判（issue #4962 的 case-trust burn-down 缴费）**：`customer_index: 0`
      #   **删除** —— 手机号 `13800138000` 本身已是**唯一且不可变**的定位键（种子客户
      #   `cust_eval_zhangsan`）；再叠一个**序号选择器**只会在「别人中途造一条同序记录」时
      #   把清理打到别的对象上（`CASE-TRUST-VOLATILE-LOCATOR` 的取证形态正是本条：
      #   `customer_index: 0` + `created_at DESC`）。**不是放宽**：定位键从「位置」换成
      #   「不可变标识」，判据强度只升不降。
      # `tag_name` 必须是种子标签目录里真有的名字，否则本清理**结构性空转**（#3794）。
      - type: customer_tag_remove
        customer_keyword: "13800138000"
        tag_name: "VIP2"
    # ── 前置自断言 + 效果层（#4962 轮次的 case-trust burn-down 缴费，metric=entries ⇒ 整条销账）──
    # 本用例命中的三条存量违规：
    #   ① CASE-TRUST-NO-PRECONDITION-ASSERTION  ② CASE-TRUST-NO-EFFECT-ASSERTION
    #   ③ CASE-TRUST-VOLATILE-LOCATOR（已由上面对 `pre_clean` 的改判销账）
    # 【真前置】本用例用**手机号唯一指代**（13800138000）定位靶子客户 —— 靶子不存在时红的表现是
    #   `unmatched expectation`（看起来像「agent 不会打标签」，归因全错）。取数走既有
    #   `_probe_phone_order_count` → `GET /api/admin/orders?receiver=<手机号>`（与 CU-004 / AS-003 /
    #   OR-012 / OR-006 **同一部手机号、同一份「怎么数订单」的口径** —— 不另立第二份定义，§18）。
    #   **刻意不声明 `expect: <N>`**：该基线随栈组成而变（同栈并行建单用例）⇒ 只用 runner 的
    #   **结构下界** `min: 1`。类型 `order_count_for_phone` 是**既有已登记**类型 ⇒ 不新增 type、不改探针。
    #   ⚠️ 它与本用例的写动作**不冲突**：探针按 `orders.receiver`（订单收件手机号）计数，而本用例写的是
    #   **客户档案的 tags** ⇒ 靶子存在性在写完之后**依然成立**（同 CU-004 的论证）。
    # 【效果层 = `must_succeed`】「调用了 ≠ 成了」（#3778）：`expectations` 只证明
    #   `customer_manage(action=add_tag)` 被调用过且 args 对；工具返回 `success=false`
    #   （tagId 解析不到 / 并发冲突）时照样计分通过。
    # 【自清理 = `namespaces` + `pre_clean`】两者**本用例原本就有**（不在本次销账的三条里）——
    #   `namespaces` 是**弱证据**（并行互斥），如实登记；`pre_clean[customer_tag_remove]` 是夹具层
    #   的**真复位**（把该客户的 `profiles.tags` 里的 `VIP2` 摘掉）。⇒ 无需再补，也不冒充强修复。
    # 【断言面一字未放宽】`user_inputs` / `expectations` / `data_checks` / `skip_reason` **全部未动**，
    #   只加下面两格 + 按上面改判 `pre_clean` 的定位键。
    precondition:
      - type: order_count_for_phone
        source: "13800138000"
    # ── 2026-09-24（issue #5247，B 端只读化）：`must_succeed[customer_manage]` **整格移除**
    # （写声明同步移除）—— `add_tag` 已从源码删除 ⇒ 该断言在新事实下**永不满足**（悬空声明）。
    # 全局命名空间声明（issue #3781）：与同样争用该客户身份的用例自动互斥
    # （`customer_phone:13800138000` 被 OR-008/OR-009/OR-016/AS-003/CR-001/CH-010 等声明，
    # 构成真实争用组）—— 本用例写该客户的 `profiles.tags`，CU-004 改该客户的 phone，
    # 同窗口并行会互相改掉对方的前置。
    namespaces:
      - "customer_phone:13800138000"
    skip_reason: ""
    merge_log: "verification 4.3 独有；2026-09-09 校准：① truth「tag-todo 空实现」已过时（真实落库）；② 标签名「VIP」生产不存在（实际「VIP2活跃」），改真实标签名；③ 补「选第一个」+「确认」轮（重名澄清 + 标签确认，probe 实证需多轮）。2026-09-10 再校准：agent 重名澄清升级为 choice 交互卡（card 内容 LLM 动态生成），「第一个」文本指代不稳定 → 改 auto_select 自动回第一个选项（runner #3160 支持）。2026-09-15（issue #3832）修正三处真值错误：① 标签名改种子目录真有的「VIP2」（原「VIP2活跃」不在目录里 ⇒ pre_clean 结构性空转，见 #3794）；② 姓名改手机号唯一指代（OR-010 建单自动 upsert 出同名张三 ⇒ 重名澄清轮不可控、「张三」落点不确定），删掉 auto_select 轮；③ 收尾轮裸文本「确认」→ auto_respond 答卡轮（裸文本不放行写操作）；④ 补 namespaces 进串行道。断言（customer_manage(action=add_tag)）**未改** ｜ 2026-09-21（issue #4962 的 case-trust burn-down 缴费，metric=entries ⇒ **整条销账**）：本用例从豁免清单**整条移除**（9→8）。① `CASE-TRUST-VOLATILE-LOCATOR` 销账 —— `pre_clean[].customer_index: 0` **删除**（手机号是不变标识；序号选择器是这条规则的取证形态本身），定位键**换强不换弱**；② `CASE-TRUST-NO-PRECONDITION-ASSERTION` 销账 —— 补 `precondition[order_count_for_phone: 13800138000]`（既有已登记 type，靶子存在性，结构下界 `min:1`，与 CU-004 同源同口径）；③ `CASE-TRUST-NO-EFFECT-ASSERTION` 销账 —— 补 `must_succeed[customer_manage]`（效果层）。`user_inputs` / `expectations` / `data_checks` / `skip_reason` / `namespaces` **一字未动**、判据一格不放宽 ｜ 2026-09-24（issue #5247，用户裁定 2026-09-23 B 端只读化）：`customer_manage` 收窄为只读（写 action `add_tag` 已删除）⇒ 本用例按新机制改判：`expectations` 由 `customer_manage(action=add_tag)` → `customer_manage(action=list_tags)`，`must_succeed[customer_manage]` 整格移除，`title` / `user_inputs` / `data_checks` 随新语义改判，确认轮（`auto_respond`）随写能力下线删除（**不是放宽**：标签清单的**来源**仍逐条受服务端断言约束（list_tags），并新增「不得声称已加标签」的正向约束；原「打标签」意图在本用例上已不可达 —— 该写 action 已从源码删除）。"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_tools_base.py"
      ci:
        - agent-eval.yml
      verifies: []

  - id: CU-004
    legacy_id: "4.4"
    title: "更新客户资料（部分更新）"
    domains:
      - customer
    tier: normal
    tags:
      - update
    truths_ref:
      - customer-list.partial-update
    user_inputs:
      # 2026-09-14 消除顺序依赖（issue #3568）：原第 1 轮只给姓名「张三」，第 2 轮发**裸文本
      # 「第一个」**——落点完全由「重名客户列表返回顺序」决定（生产有 3 位张三；独立栈种子
      # 只有 1 位时该轮又对不上任何卡片）。注意这里**不能**用 `auto_select`：那条路在
      # 「没有卡片」时仍会发字面量「第一个」（runner resolve_auto_select_turn 的 ③ 档），
      # 在干净栈上等于对空气说话。
      # 改用客户列表支持的**手机号关键词**（customer_manage.list keyword 支持手机号）
      # 做唯一指代 —— 种子客户 `cust_eval_zhangsan` 的手机号即 13800138000，唯一命中，
      # 无需重名澄清轮。用例意图（部分更新：只改 phone，其余字段不动）不变。
      - "张三（手机号 13800138000）的手机号改成 13900001111"
      # 收尾「答卡轮」（#3518/#3568 口径，同 PR-005/PR-016）：agent 在收尾轮只发 confirm 卡、
      # **裸文本「确认」不放行写操作**（文字 ≠ 点卡）→ 有卡答卡（confirm→回 confirmValue），
      # 无卡才发 fallback 原文。
      - auto_respond:
          fallback: "确认"
    expectations:
      # ── 2026-09-24（issue #5247，B 端只读化）：写 action `update` 已从源码删除（工具收窄为只读
      # `{list, detail, list_tags}`）⇒ 机器可判字段改判到**存活的只读路径** `action: detail`。
      - tool: customer_manage
        args:
          action: detail
    data_checks:
      - "仅 phone 被更新，未传字段保持原值"
    # ── 前置自断言 + 自清理 + 效果层（#4960 / #4961 轮次的 case-trust burn-down 缴费，metric=entries ⇒ 整条销账）──
    # 本用例命中的三条存量违规：
    #   ① CASE-TRUST-NO-PRECONDITION-ASSERTION  ② CASE-TRUST-NO-SELF-CLEAN  ③ CASE-TRUST-NO-EFFECT-ASSERTION
    # 【真前置】本用例用**手机号唯一指代**（13800138000）定位靶子客户 —— 靶子不存在时红的表现是
    #   `unmatched expectation`（看起来像「agent 不会改客户资料」，归因全错，同 `order_count_for_phone` 族的理由）。
    #   取数走既有 `_probe_phone_order_count` → `GET /api/admin/orders?receiver=<手机号>`（与 AS-003 / OR-012 /
    #   OR-006 同一部手机号、同一份「怎么数订单」的口径 —— **不另立第二份定义**，§18）。**刻意不声明
    #   `expect: <N>`**：该基线随栈组成而变（同栈并行建单用例），写死常量 = 依赖栈的恒红判据（反模式 CH-034）
    #   ⇒ 只用 runner 的**结构下界** `min: 1`。类型 `order_count_for_phone` 是**既有已登记**类型 ⇒ 不新增 type、不改探针。
    #   ⚠️ 它与本用例的写动作**不冲突**：探针按 `orders.receiver`（订单收件手机号）计数，而本用例改的是
    #   **客户档案**的手机号 ⇒ 靶子存在性在写完之后**依然成立**（不是「跑一遍就把自己的前置改没了」）。
    # 【效果层 = `must_succeed`】「调用了 ≠ 成了」（#3778）：`expectations` 只证明 `customer_manage(action=update)`
    #   被调用过且 args 对；工具返回 `success=false`（字段校验拒绝 / 并发改名冲突）时照样计分通过。
    # 【自清理 = `customer_profile_restore`（**真复位**，issue #4992）】本用例把客户档案手机号
    #   13800138000 → 13900001111 ⇒ 重跑前置不再等价（第二轮按 `13800138000` 定位不到客户）。
    #   #4992 前夹具层**没有**「把客户档案改回来」的类型（已落地的五个：product_remove /
    #   product_dedupe / employee_reactivate / aftersales_ticket_prepare / customer_tag_remove），
    #   只能登记 `namespaces`（taxonomy 明列的**弱证据**档）。现补上 `customer_profile_restore`
    #   （`tests/agent_eval/local_runner.py` 的复位族第二批）：
    #     · `pre_clean` 的定位键 = **种子手机号**（13800138000）⇒ 首跑/重试都从种子态起跑；
    #     · `post_clean` 的定位键 = **本用例写出去的值**（13900001111）⇒ 把它复位回种子号，
    #       世界归零（后续读该客户档案的用例看到的是种子态）。
    #   ⚠️ 弱证据 `namespaces` 随之**撤掉**：并行互斥的诉求已被"用例结束后世界即归零"覆盖
    #   （同窗口并行改同一客户的用例读到的不再是对方的脏值）。
    # 【断言面一字未放宽】`user_inputs` / `expectations` / `data_checks` / `skip_reason` **全部未动**，
    #   只加上面两格复位声明 + 撤掉 `namespaces`。
    pre_clean:
      - type: customer_profile_restore
        customer_keyword: "13800138000"
        phone: "13800138000"
    post_clean:
      - type: customer_profile_restore
        customer_keyword: "13900001111"
        phone: "13800138000"
    precondition:
      - type: order_count_for_phone
        source: "13800138000"
    # ── 2026-09-24（issue #5247，B 端只读化）：`must_succeed[customer_manage]` **整格移除**
    # （写声明同步移除）—— `update` 已从源码删除 ⇒ 该断言在新事实下**永不满足**（悬空声明）。
    skip_reason: "[backend-contract] #5247 B 端只读化（用户裁定 2026-09-23：B 端米宝只做数据查询与分析，创建/更新能力与对应 tools 全部从 B 端移除）⇒ 本用例断言的「更新客户资料」（customer_manage / action=update）已从 B 端下线、工具已收窄为只读。用例条目与退役理由保留（不删除）；断言面改判为存活的只读路径 customer_manage(action=detail)（只读查询客户详情）。本条的正确判定层 = 工具层单测与 B 端绑定判据（traces.tests 已钉住）⇒ 按 [backend-contract] 分类：判定不在 LLM 层。"
