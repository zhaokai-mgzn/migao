# cases/customer.yml — 客户域用例（并源转换）
# 来源：eval M011 + verification 4.1~4.4 → 5 条

schema: "case-contract/1.0"
domain: customer

cases:
  - id: CU-001
    legacy_id: "4.1"
    title: "客户列表"
    domains:
      - customer
    tier: smoke
    tags:
      - query
      - smoke
    truths_ref:
      - customer-list.search-fields
      - customer-list.sort-page
    user_inputs:
      - "查客户列表"
    expectations:
      - tool: customer_manage
        args:
          action: list
    data_checks:
      - "返回客户列表（手机号脱敏：前3位+****+后4位）"
    skip_reason: ""
    merge_log: "verification 4.1 独有（M011 的客户查询只是旅程一环，不合并）"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_tools_base.py"
      ci:
        - agent-eval.yml
      verifies: []

  - id: CU-002
    legacy_id: "4.2"
    title: "客户详情 - 档案统计"
    domains:
      - customer
    tier: normal
    tags:
      - query
      - detail
    truths_ref:
      - customer-list.detail-shape
      - customer-list.detail-joins
    user_inputs:
      - "看张三的客户档案"
    expectations:
      - tool: customer_manage
        args:
          action: detail
    data_checks:
      - "profile.totalOrders / totalConsumption 为数值"
      - "orders.length <= 10 AND sessions.length <= 10"
    skip_reason: ""
    merge_log: "verification 4.2 独有"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_tools_base.py"
      ci:
        - agent-eval.yml
      verifies: []

  - id: CU-003
    legacy_id: "4.3"
    title: "给客户打标签"
    domains:
      - customer
    tier: normal
    tags:
      - tag
      - write
    truths_ref:
      - customer-list.tag-todo
    user_inputs:
      - "给张三加VIP2活跃标签"
      - auto_select: true
      - "确认"
    expectations:
      - tool: customer_manage
        args:
          action: add_tag
    data_checks:
      - "add_tag 真实落库（customer_profiles.tags JSONB 写入），重复标签幂等跳过"
    pre_clean:
      - type: customer_tag_remove
        customer_keyword: "张三"
        customer_index: 0
        tag_name: "VIP2活跃"
    skip_reason: ""
    merge_log: "verification 4.3 独有；2026-09-09 校准：① truth「tag-todo 空实现」已过时（真实落库）；② 标签名「VIP」生产不存在（实际「VIP2活跃」），改真实标签名；③ 补「选第一个」+「确认」轮（重名澄清 + 标签确认，probe 实证需多轮）。2026-09-10 再校准：agent 重名澄清升级为 choice 交互卡（card 内容 LLM 动态生成），「第一个」文本指代不稳定 → 改 auto_select 自动回第一个选项（runner #3160 支持）"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_tools_base.py"
      ci:
        - agent-eval.yml
      verifies: []

  - id: CU-004
    legacy_id: "4.4"
    title: "更新客户资料（部分更新）"
    domains:
      - customer
    tier: normal
    tags:
      - update
    truths_ref:
      - customer-list.partial-update
    user_inputs:
      - "张三手机号改成 13900001111"
      - "第一个"
      - "确认"
    expectations:
      - tool: customer_manage
        args:
          action: update
    data_checks:
      - "仅 phone 被更新，未传字段保持原值"
    skip_reason: ""
    merge_log: "verification 4.4 独有；2026-09-09 校准：补「选第一个」+「确认」两轮——「张三」生产有 3 位重名，agent 正确发 choice 卡澄清（#3142 修 validate_input 空转后不再幻觉「不支持」），需用户点选+确认后 update；probe 实证完整流程走通（重名澄清→选第一个→确认→update 成功）"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_tools_base.py"
      ci:
        - agent-eval.yml
      verifies: []

  - id: CU-005
    legacy_id: M011
    title: "对抗性 - 模糊名称渐进澄清（老王→王建国→订单→发货）"
    domains:
      - customer
      - order
    tier: adversarial
    tags:
      - fuzzy_input
      - progressive_clarification
      - adversarial
    truths_ref:
      - id-resolve.name
      - customer-list.search-fields
      - order.states
    user_inputs:
      - "帮我处理下老王的订单"
      - "就是王建国"
      - "他那个窗帘订单"
      - "对，发货吧"
    expectations:
      - tool: customer_manage
        args:
          action: query
      - tool: order_query
      - tool: order_manage
        args:
          action: update_logistics
    data_checks:
      - "customer_id 从 customer_manage 查询获得"
      - "order_id 从 order_query 获得"
      - "发货操作使用正确的 order_id"
    skip_reason: ""
    merge_log: "eval M011 独有（模糊澄清 + 客户搜索真值）"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_mibao_multiturn_intelligence.py"
      ci:
        - agent-eval.yml
      verifies: []

  - id: CU-006
    legacy_id: ""
    title: "C 端租户域名路由 - 微信用户经企业域名自动关联租户并落 CRM 客户档案（#3011）"
    domains:
      - customer
      - auth
    tier: normal
    tags:
      - c-end
      - tenant
      - domain
      - customer_profile
    truths_ref:
      - customer-list.profile-creation
      - auth.mini-program-login
    user_inputs:
      - "C 端微信用户从企业小程序登录后，客户列表里能看到他吗？租户是怎么挂上的？"
    expectations:
      - tool: customer_manage
        args:
          action: list
    data_checks:
      - "POST /api/auth/mini/login：X-Tenant-Id（nginx 按 <tenantId>.app.migaozn.com 注入）/ Host 子域解析为租户权威来源；body tenantId 仅兼容期兜底；均无 → 400"
      - "登录（新 openid 自动建号 / 已有 openid）后调用 CustomerService.createFromSession(tenantId, openid, nickname, wechat_mini) 幂等上写 customer_profiles"
      - "客户列表（CRM）可见 C 端消费者；员工管理列表仍排除 role=customer（#3007 语义不变）"
    skip_reason: "域名解析/建档为 Java 单测验证（TenantDomainResolverTest/AuthServiceTest/AuthIntegrationTest），非 LLM 工具行为差异，不进入 agent-eval 冒烟"
    merge_log: "2026-09-07 新增：C 端租户域名路由改造（issue #3011）"
    traces:
      tests:
        - "backend/admin-api/src/test/java/com/migao/admin/config/TenantDomainResolverTest.java"
        - "backend/admin-api/src/test/java/com/migao/admin/service/AuthServiceTest.java"
        - "backend/admin-api/src/test/java/com/migao/admin/controller/AuthIntegrationTest.java"
      ci:
        - pr-check.yml
      verifies: []
