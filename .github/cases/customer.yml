    #   期望 customer_manage(action=detail)（detail ∈ 工具 read_only_actions，不受确认门禁拦截）。
    #   原版是**写类**（期望 action=update），但输入场景是「查询」口径 → agent 不会调 update
    #   ⇒ run 35233821582 `unmatched expectation: customer_manage(action=update)`
    #   （reproducible）。写路径本身是**确定性契约**（字段名/落库），由单测覆盖：
    #   backend/ai-agent-service/tests/test_tool_field_name_contract.py（其 case_ids 含 CU-008）
    #   + 后端 V47 迁移列 —— 不靠 LLM 行为面重复验。
    #   读类用例不得被要求效果层断言（assertion_taxonomy：is_write_expectation 按
