# cases/cross.yml — 跨 Skill 上下文共享用例（并源转换）
# 来源：eval C001/C003/M007 → 3 条

schema: "case-contract/1.0"
domain: cross

cases:
  - id: CR-001
    legacy_id: C001
    title: "查商品 → 下单（跨 Skill 复用 UUID）"
    domains:
      - product
      - order
    persona: mibao
    tier: normal
    tags:
      - cross_skill
      - context_share
    truths_ref:
      - id-resolve.no-fabricate
      - ai-chat.context-memory
    user_inputs:
      - "查一下遮光窗帘"
      # 自包含化（#3518，同 AS-003 先例 #3511）：原输入点名「遮光窗帘（100元的那件）」，
      # 而评测栈种子只有 ¥168 的那一款（prod_eval_blackout）→ 独立栈实测 agent 回
      # 「系统里「遮光窗帘」只有这 1 款，售价是 ¥168/米，没有 ¥100 的款式」
      # （run 34805827043 R2）→ 下单草稿不启动、后续轮次空转（order_create 从未调用）。
      # 改为不点名价格的问法 —— 用例意图（查商品→下单→跨 Skill 复用 UUID）不变。
      - "用遮光窗帘给张三创建订单，2件，手机13800138000"
      - auto_select: true
      - "不需要加工项"
      - "确认下单"
      # 收尾答卡轮（#3544 §2 同款先例；2026-09-15 结论档 run 34841029062 实测）：
      # B 端写操作受 confirm 门禁约束——文字「确认下单」≠ 点卡，agent 收到后只**发**
      # 确认卡（R5 实测 tools 含 validate_input + interact(confirm:确认创建订单)），
      # 轮次用尽即停在待点卡态 → `order_create` 在预算内**不可能**被调用
      # （失败原文 2 条：`❌ order_create` + `required_args: 未调用 order_create(action=None)`）。
      # 留 2 轮余量（有卡答卡 / 无卡发原文）；同形：OR-015（#3544 已修）/ OR-008 / AS-003。
      - auto_respond:
          fallback: "确认下单"
      - auto_respond:
          fallback: "确认"
    # 全局命名空间声明（issue #3781）：与同样争用该全局资源的用例自动互斥，
    # 消除「同栈并行用例互相写同一命名空间」造成的非确定性（真实 run 34856561459）。
    namespaces:
      - "customer_phone:13800138000"
      - "product_name:遮光窗帘"

    expectations:
      - tool: product_detail
      # ⚠️ 2026-09-24（issue #5247，用户裁定 2026-09-23 B 端只读化）：原 `- tool: order_create`
      # 已移除 —— 下单写工具已从 B 端全部 skill 解绑（工具类与 C 端绑定未动）⇒ 保留 = 永不满足的
      # 悬空声明（静态判据还会把本用例判成「只能跑小布却未标注 persona」）；断言面按 A 类模板
      # 改判为存活的只读路径 product_detail（「跨 skill 复用 UUID」的意图见下方 data_checks）。
    # 效果层断言（burn-down 缴费，2026-09-21；先例 = OR-008 / OR-009 / OR-016 的
    # `must_succeed[order_create]`）：裸工具名期望只证明「调用过」—— 工具返回
    # `success=false` 也照样通过（#3778「调用了 ≠ 成了」）。
    # ⚠️ 2026-09-24（issue #5247，用户裁定 2026-09-23 B 端只读化）：
    # `must_succeed[order_create]` 已随能力下线**整条移除** —— 该效果层断言在解绑后永不满足
    # （不是放宽：用例已退役，见 skip_reason）。
    # 前置自断言（同一次 burn-down 缴费）：本用例按**名字**选品（「查一下遮光窗帘」），
    # 且 `pre_clean` 已按同一关键词 `product_dedupe` ⇒ 「该名字在种子栈里唯一」是它真正依赖、
    # **只读**的前置。类型用**已实现**的 `product_count_for_keyword`（口径与 product_remove /
    # product_dedupe 同一份实现），与 OR-015 逐字同形（`expect: 1`）。
    # ⚠️ 有意**不**声明 `order_count_for_phone: 13800138000`：本用例自己就会给该号码建单
    # ⇒ 那是一条注定红的护栏（同 order.yml 里「不声明 order_count_for_phone」的先例判断）。
    precondition:
      - type: product_count_for_keyword
        source: "遮光窗帘"
        expect: 1
    # ⚠️ 2026-09-24（issue #5247，用户裁定 2026-09-23 B 端只读化）：`required_args[order_create]`
    # （下单必填字段）已随能力下线**整条移除** —— 保留 = 永不满足的悬空声明（用例已退役，见 skip_reason）。
    data_checks:
      - "order_create items 包含遮光窗帘的 UUID（复用上轮，不重查）"
      - "Context 注入包含 product_ids"
    pre_clean:
      # 去重只按关键词（#3518）：用例已不再点名价格，`price: 100` 在独立栈（种子 ¥168 款）恒不匹配
      # → 等于没去重；同名「遮光窗帘」有副本时 agent 会发「哪一件」选择卡。按关键词去重保留
      # 最早创建的（= 种子商品），删掉其余副本。
      - type: product_dedupe
        product_keyword: "遮光窗帘"
    skip_reason: "[backend-contract] [#5247] B 端只读化（用户裁定 2026-09-23：B 端米宝只做数据查询与分析，创建/更新能力与对应 tools 全部从 B 端移除）⇒ 本用例断言的「下单（跨 Skill 复用 UUID）」（order_create）已从 B 端下线、不再绑定任何 B 端 skill。用例条目与退役理由保留（不删除）；断言面改判为「查商品详情（product_detail）+ 如实说明米宝不做下单、引导去后台订单页面」。"
    merge_log: "eval C001 独有；2026-09-14 校准（#3518）：① 下单轮去「100元的那件」价格点名（独立栈种子只有 ¥168 款，点名不存在的价 → agent 合理查无此价 → 流程不前进），自包含化同 AS-003 先例（#3511）；② pre_clean 去 price 过滤（关键词去重，原 price: 100 在种子 ¥168 的栈上恒不匹配）。2026-09-15 校准（结论档 run 34841029062 实证）：③ 补 2 轮收尾答卡轮——5 轮预算里末轮恰好是 agent **发**确认卡那一轮，没有轮次去点卡 → order_create 必不执行（断言本身合理，不得放宽），照 OR-015（#3544 §2）先例。2026-09-21（burn-down 缴费，随 #4865 的用例面改动）：补效果层断言 `must_succeed[order_create]`（裸工具名期望只证「调用过」）+ 前置自断言 `precondition[product_count_for_keyword: 遮光窗帘, expect: 1]`（按名选品 + 同关键词 pre_clean ⇒ 唯一性是可判定前置；同 OR-015/OR-014/OR-029 先例）⇒ 整条销账（`CASE-TRUST-NO-EFFECT-ASSERTION` + `CASE-TRUST-NO-PRECONDITION-ASSERTION`）。user_inputs / expectations / required_args / data_checks / pre_clean / namespaces 一字未动（断言只增不减）。 ｜ 2026-09-24（issue #5247，用户裁定 2026-09-23 B 端只读化）：order_create 从 B 端解绑 ⇒ 本用例退役（理由写在 skip_reason，条目不删除）；expectations 由 [product_detail, order_create] 改判为 [product_detail]，must_succeed / required_args 里的 order_create 同步移除（否则成为永不满足的悬空声明；required_args 整条退场，无残留字段）；user_inputs / namespaces / pre_clean / precondition / data_checks 原样未动（下单剧本与「复用 UUID」的散文判据保留为历史记录、不再进运行期）。"
    traces:
      tests:
        - "backend/ai-agent-service/tests/manual/mibao_scenarios.py"
      ci:
        - agent-eval.yml
      verifies: []

  - id: CR-002
    legacy_id: C003
    title: "对抗性 - 3 个 Skill 连续切换"
    domains:
      - product
      - customer
      - order
    tier: adversarial
    tags:
      - cross_skill
      - multi_round
      - adversarial
    truths_ref:
      - ai-chat.context-memory
      - id-resolve.no-fabricate
    user_inputs:
      - "搜遮光窗帘"
      - "查张三这个客户"
      - "给张三下个遮光窗帘的订单"
    # 前置自断言 + 命名空间（burn-down；**先例 = OR-012 / CH-019**，同款治法，不另立口径）。
    # R3「给张三下个遮光窗帘的订单」按**商品名**定位下单对象，且断言「order_create 复用前两轮的
    # product_id」⇒ 「该名字在栈里唯一」是本用例真正依赖、且**只读**的前置。并行建品用例一旦造出
    # 同名副本，R1 搜到的候选就有两个、R3 可能落到另一个 id 上；那时红的表现是
    # `unmatched expectation`，看起来像「agent 不会跨 skill 切换」（归因全错，同 AS-003/PG-013/CU-003 形态）。
    # ⚠️ 刻意**不**声明 `order_count_for_phone: 13800138000` —— 本用例 R3 自己就会给该号码建单，
    # `after - before = +1 > max_growth(0)` ⇒ 漂移判据必然判红（那是「硬写一条注定红的守卫」）。
    # `namespaces` 护住该前置的基线/漂移两格，并与同手机号的建单用例互斥（自清理的弱证据形态）。
    namespaces:
      - "product_name:遮光窗帘"
      - "customer_phone:13800138000"
    precondition:
      - type: product_count_for_keyword
        source: "遮光窗帘"
        expect: 1
    expectations:
      # ⚠️ 2026-09-24（issue #5247，用户裁定 2026-09-23 B 端只读化）：原 `- tool: order_create`
      # 已移除 —— 下单写工具已从 B 端全部 skill 解绑 ⇒ 保留 = 永不满足的悬空声明；存活面 =
      # 只读查询，且 customer_manage 显式声明 `action: list`（该工具已收窄为只读、写 action 已删除）。
      - tool: product_search
      - tool: customer_manage
        args:
          action: list
    data_checks:
      - "order_create 复用前两轮的 product_id 和 customer_id"
      - "success=true"
    skip_reason: "[backend-contract] [#5247] B 端只读化（用户裁定 2026-09-23：B 端米宝只做数据查询与分析，创建/更新能力与对应 tools 全部从 B 端移除）⇒ 本用例断言的「给张三下单（3 个 Skill 连续切换的末段写面）」（order_create）已从 B 端下线、不再绑定任何 B 端 skill。用例条目与退役理由保留（不删除）；断言面改判为「搜商品 + 查客户（product_search / customer_manage action=list）+ 如实说明米宝不做下单、引导去后台订单页面」。"
    merge_log: "eval C003 独有；2026-09-18 补前置自断言 + namespaces（burn-down：改用例文件的 PR 须净缩 ≥1 条存量违规，本用例命中的两条是 CASE-TRUST-NO-PRECONDITION-ASSERTION + CASE-TRUST-NO-SELF-CLEAN）：`precondition[product_count_for_keyword: 遮光窗帘, expect: 1]`（R3 按名下单 ⇒ 名字唯一是它真正依赖且只读的前置，先例 = OR-014/CH-019；**不选 order_count_for_phone**，因本用例自己会建单、漂移判据必然判红）+ `namespaces[product_name:遮光窗帘, customer_phone:13800138000]`（护住该前置两格 + 与同手机号建单用例互斥）。**断言（user_inputs / expectations / data_checks）原样未动，无放宽、无删减。** ｜ 2026-09-24（issue #5247，用户裁定 2026-09-23 B 端只读化）：order_create 从 B 端解绑 ⇒ 本用例退役（理由写在 skip_reason，条目不删除）；expectations 由 [product_search, customer_manage, order_create] 改判为 [product_search, customer_manage(action=list)]，order_create 同步移除（否则成为永不满足的悬空声明）；must_succeed / required_args / repeat_until 本就没有 order_create 声明（无需改动）；user_inputs / data_checks / namespaces / precondition / pre_clean 原样未动。"
    traces:
      tests:
        - "backend/ai-agent-service/tests/manual/mibao_scenarios.py"
      ci:
        - agent-eval.yml
      verifies: []

  - id: CR-003
    legacy_id: M007
    title: "真实场景全旅程 - 咨询→查商品→下单→查物流"
    domains:
      - product
      - order
      - chat
    tier: normal
    tags:
      - multi_turn
      - real_scenario
      - cross_skill
      - full_journey
    truths_ref:
      - ai-chat.context-memory
      - ai-chat.intent-domains
      - order.states
      - order.logistics
      - id-resolve.index
    # 用例级表单载荷（issue #3804）：客户信息原先只声明在 R7/R8，而 R9 仍是可作答轮
    # ⇒ agent 把客户信息表单发晚一轮（R9）时载荷送不出、`order_create` 永不发生，
    # 用例必红却写成"agent 没做"。声明在用例级 = 载荷脱离轮次位置。
    auto_fill:
      customer_name: "张三"
      customer_phone: "13800138000"
      customer_address: "浙江省杭州市西湖区文三路 1 号 1 幢 101 室"
    user_inputs:
      - "你好，我想买窗帘"
      - "有什么遮光好的推荐吗"
      # 2026-09-14 消除顺序依赖（issue #3568）：原「看看第一个的详情」——「推荐」类问法的
      # 返回顺序由 product_search/推荐位排序决定（种子/目录里遮挡类命中遮光窗帘/北欧风窗帘
      # 等），后续 R4「就这个」又把不确定对象带进下单（OR-024 #3408 同族）。改为点名
      # 真实种子商品（遮光窗帘 = prod_eval_blackout），用例意图（跨 skill 上下文复用
      # product_id → 下单 → 查物流）不变。
      - "看看遮光窗帘的详情"
      - "就这个，帮我下单，客户张三 13800138000，2件"
      # 颜色必须落在种子 SKU 上：prod_eval_blackout 的色号是「米白/浅灰」（无「白色」）——
      # 原「白色的」在干净栈上会把一轮耗在颜色澄清（同 #3518 修 CH-010 色号的口径）。
      - "米白，散剪，2.8米门幅"
      - "不需要加工项"
      - auto_respond:
          fallback: "确认下单"
          form_values:
            customer_name: "张三"
            customer_phone: "13800138000"
            customer_address: "浙江省杭州市西湖区文三路 1 号 1 幢 101 室"
      # 尾部留余量轮（同 CH-010/OR-021 口径）：写操作受 confirm 门禁约束，**裸文本「确认」
      # 不等于点卡** → 用答卡轮（有卡答卡，无卡才发 fallback 原文）。
      - auto_respond:
          fallback: "确认"
          form_values:
            customer_name: "张三"
            customer_phone: "13800138000"
            customer_address: "浙江省杭州市西湖区文三路 1 号 1 幢 101 室"
      - auto_respond:
          fallback: "确认"
      - "订单怎么样了，发货了吗"
      - "好的谢谢"
    pre_clean:
      # 同 PR-005/#3518 口径：保证「遮光窗帘」在栈里只有一件（否则「就这个」/改价落到
      # 不确定的那一件上）。保留最早创建的（= 种子）。
      - type: product_dedupe
        product_keyword: "遮光窗帘"
    # 前置自断言（§18.4，同 OR-014/OR-015 先例；issue #4046 的 OR-* 优先档 burn-down）：
    # 本用例按名定位下单对象（遮光窗帘），「该名字唯一」是它依赖的可判定前置 ——
    # `product_dedupe` 先于 capture 执行 ⇒ 捕获时恰为 1；出副本时折成
    # `PRECONDITION_NOT_APPLIED`，不再伪装成「agent 不下单」。
    precondition:
      - type: product_count_for_keyword
        source: "遮光窗帘"
        expect: 1
    # 全局命名空间声明（issue #3781）：与同样争用该全局资源的用例自动互斥，
    # 消除「同栈并行用例互相写同一命名空间」造成的非确定性（真实 run 34856561459）。
    namespaces:
      - "customer_phone:13800138000"
      - "product_name:遮光窗帘"

    expectations:
      # ⚠️ 2026-09-24（issue #5247，用户裁定 2026-09-23 B 端只读化）：原 `- tool: order_create`
      # 已移除 —— 下单写工具已从 B 端全部 skill 解绑 ⇒ 保留 = 永不满足的悬空声明；断言面按
      # A 类模板改判为存活的只读路径（全旅程的「咨询→查商品→查订单/物流」三段仍在）。
      - tool: product_search
      - tool: product_detail
      - tool: order_query
    # ⚠️ 2026-09-24（issue #5247）：`must_succeed[order_create]` 已随能力下线整条移除
    # （该效果层断言在解绑后永不满足；用例已退役，见 skip_reason）。
    data_checks:
      - "第4步 product_id 来自第2-3步上下文"
      - "订单创建成功并包含 SKU 信息"
      - "第7步自动找到刚创建的订单"
    skip_reason: "[backend-contract] [#5247] B 端只读化（用户裁定 2026-09-23：B 端米宝只做数据查询与分析，创建/更新能力与对应 tools 全部从 B 端移除）⇒ 本用例断言的「全旅程下单」（order_create）已从 B 端下线、不再绑定任何 B 端 skill。用例条目与退役理由保留（不删除）；断言面改判为「咨询 + 搜商品 + 查商品详情 + 查订单/物流（product_search / product_detail / order_query）+ 如实说明米宝不做下单、引导去后台订单页面」。"
    merge_log: "eval M007 独有（物流查询是旅程一环，独立用例见 OR-005）。2026-09-14 消除顺序依赖（issue #3568）：① 「看看第一个的详情」→ 点名「遮光窗帘」（推荐列表返回顺序依赖，同 OR-024 #3408）；② 色号「白色」→ 种子真实色号「米白」；③ 收尾裸文本「确认下单/确认」→ 答卡轮（#3518 口径）；④ 补 pre_clean product_dedupe + must_succeed[order_create]；2026-09-18 补前置自断言 precondition[product_count_for_keyword 遮光窗帘 expect=1]（issue #4046 的 OR-* 优先档 burn-down） ｜ 2026-09-24（issue #5247，用户裁定 2026-09-23 B 端只读化）：order_create 从 B 端解绑 ⇒ 本用例退役（理由写在 skip_reason，条目不删除）；expectations 由 [product_search, product_detail, order_create, order_query] 改判为 [product_search, product_detail, order_query]，must_succeed 里的 order_create 同步移除（否则成为永不满足的悬空声明）；user_inputs / auto_fill / pre_clean / precondition / namespaces / data_checks 原样未动（下单剧本保留为历史记录、不再进运行期）。"
    traces:
      tests:
        - "backend/ai-agent-service/tests/manual/mibao_scenarios.py"
      ci:
        - agent-eval.yml
      verifies: []
