# cases/onboarding.yml — 商家入驻 AI 自动甄别域用例
# 来源：2026-08-30 AI 自动入驻改造（人工审批页废弃，AI 自动甄别秒级开通）
# 均为单元/集成测试契约（规则层+大模型层决策、防重复/防攻击、fail-closed 降级），
# 不进入 agent-eval 冒烟（skip_reason 显式标注，LLM 行为由 ai-agent 单测 mock 验证）。

schema: "case-contract/1.0"
domain: onboarding

cases:
  - id: OB-001
    legacy_id: ""
    title: "商家入驻 - AI 自动甄别通过 → 秒级开通租户+管理员"
    domains:
      - onboarding
      - customer
    tier: normal
    tags:
      - onboarding
      - ai_review
      - auto_approve
    truths_ref:
      - registration-approval.submit
      - registration-approval.ai-approve
      - registration-approval.review-meta
      - registration-approval.status-enums
    user_inputs:
      - "商家提交合规入驻申请（POST /api/auth/register），AI 自动甄别"
    expectations:
      - tool: direct_reply
    data_checks:
      - "响应 status=approved 且 applicationId 非空，同步自动创建租户(active)+企业管理员(admin)+默认角色权限"
      - "tenant_applications 落 review_source=ai / risk_flags / review_summary / reviewed_by=ai"
      - "ai-agent 内部端点 POST /api/internal/registration/review 规则层无违规 + LLM approve → approve；LLM 不可用且规则层通过 → review_source=system 放行"
    skip_reason: "由 admin-api 单测（RegistrationServiceTest/ControllerTest/ReviewClientTest）+ ai-agent 单测（test_registration_review.py）+ 前端单测（register.test.tsx）验证，非 LLM 冒烟"
    merge_log: "2026-08-30 新增：AI 自动入驻改造（人工审批页废弃）"
    traces:
      tests:
        - "backend/admin-api/src/test/java/com/migao/admin/service/RegistrationServiceTest.java"
        - "backend/admin-api/src/test/java/com/migao/admin/controller/RegistrationControllerTest.java"
        - "backend/admin-api/src/test/java/com/migao/admin/service/RegistrationReviewClientTest.java"
        - "backend/ai-agent-service/tests/test_registration_review.py"
        - "frontend/admin-web/tests/unit/pages/register.test.tsx"
      ci:
        - deploy-admin-api.yml
        - ai-agent-tests.yml
        - pr-check.yml
      verifies: []

  - id: OB-002
    legacy_id: ""
    title: "商家入驻 - AI 自动驳回（敏感内容 / 法律风险）"
    domains:
      - onboarding
      - defense
    tier: normal
    tags:
      - onboarding
      - ai_review
      - auto_reject
      - compliance
    truths_ref:
      - registration-approval.ai-reject
      - registration-approval.status-enums
    user_inputs:
      - "商家提交含敏感/违法内容或法律风险的入驻申请"
    expectations:
      - tool: direct_reply
    data_checks:
      - "规则层命中敏感词/注入/格式违规 → 直接驳回（review_source=rule，不调用 LLM 防刷成本）"
      - "LLM 识别法律风险（decision=reject 或 high 风险）→ 驳回（review_source=ai），响应 rejectReason 非空"
      - "驳回不创建租户/管理员，申请置 rejected"
    skip_reason: "由 admin-api + ai-agent 单测验证（规则层/LLM 层/决策合成），非 LLM 冒烟"
    merge_log: "2026-08-30 新增：AI 自动入驻改造"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_registration_review.py"
        - "backend/admin-api/src/test/java/com/migao/admin/service/RegistrationServiceTest.java"
        - "backend/admin-api/src/test/java/com/migao/admin/controller/RegistrationControllerTest.java"
      ci:
        - ai-agent-tests.yml
        - deploy-admin-api.yml
      verifies: []

  - id: OB-003
    legacy_id: ""
    title: "商家入驻 - 防重复/防攻击（手机号/企业名/IP 频率/蜜罐/冷却/fail-closed）"
    domains:
      - onboarding
      - defense
    tier: normal
    tags:
      - onboarding
      - anti_abuse
      - rate_limit
      - honeypot
      - dedup
    truths_ref:
      - registration-approval.dup-guard
      - registration-approval.ai-degrade
    user_inputs:
      - "同一家公司/手机号/IP 反复提交入驻申请，或自动化脚本提交"
    expectations:
      - tool: direct_reply
    data_checks:
      - "同手机号 pending/approved → 422；同企业规范化名称（去空格/括号/后缀）pending/approved → 422"
      - "AI 驳回 24h 冷却（review_source=system 的系统繁忙驳回不冷却，可立即重试）"
      - "每手机号每日提交上限 3、每 IP 每小时上限 5（Redis 计数）→ 超限 422"
      - "蜜罐字段 website 被填充 → 不落库不调 AI，静默返回 pending 占位"
      - "AI 甄别服务不可达 → fail-closed 系统繁忙驳回（review_source=system），绝不放行"
    skip_reason: "由 RegistrationServiceTest + register.test.tsx（蜜罐隐藏字段）+ ai-agent 单测验证，非 LLM 冒烟"
    merge_log: "2026-08-30 新增：AI 自动入驻改造"
    traces:
      tests:
        - "backend/admin-api/src/test/java/com/migao/admin/service/RegistrationServiceTest.java"
        - "frontend/admin-web/tests/unit/pages/register.test.tsx"
      ci:
        - deploy-admin-api.yml
        - pr-check.yml
      verifies: []

  - id: OB-004
    legacy_id: ""
    title: "商家入驻 - 人工审批页废弃，仅保留超管 API 兜底"
    domains:
      - onboarding
      - ui
    tier: normal
    tags:
      - onboarding
      - ops_page_removed
      - super_admin_api
    truths_ref:
      - registration-approval.super-admin-prefix
    user_inputs:
      - "平台不再提供人工审核新商家页面，商家入驻全部由 AI 自动甄别"
    expectations:
      - tool: direct_reply
    data_checks:
      - "ops.migaozn.com 域名分支/入驻审批菜单/审批页面/中间件前缀已移除（前端无 /registrations 页面）"
      - "超管兜底接口保留：GET/PUT /api/super-admin/registrations* 仅 API 应急，无前端入口"
      - "主页与入驻页文案改为 AI 秒审（不再出现 1-3 个工作日人工审核）"
    skip_reason: "由前端单测验证（corporate-home/app-routes/components-other/register），非 LLM 冒烟"
    merge_log: "2026-08-30 新增：AI 自动入驻改造（人工审批页废弃）"
    traces:
      tests:
        - "frontend/admin-web/tests/unit/pages/corporate-home.test.tsx"
        - "frontend/admin-web/tests/unit/pages/app-routes.test.tsx"
        - "frontend/admin-web/tests/unit/components/components-other.test.tsx"
        - "frontend/admin-web/tests/unit/pages/register.test.tsx"
      ci:
        - pr-check.yml
      verifies: []
