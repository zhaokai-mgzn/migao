      ci:
        - agent-eval.yml
      verifies: []

  - id: HR-002
    legacy_id: "5.2"
    title: "创建员工 - 开账号"
    domains:
      - hr
    tier: normal
    tags:
      - create
    truths_ref:
      - employee-role.write-require-admin
    user_inputs:
      - "新客服王五 13812345678，密码 Abc123456，开账号"
      - "确认"
    expectations:
      - tool: employee_manage
        args:
          action: create
    # 效果层断言（门禁 a2 条，#3778「调用了 ≠ 成了」）：`expectations` 只证明"调了"，
    # 本字段证明**至少一次 create 真的 success=true**。本条原先只有自然语义 data_check
    # （"收集确认后创建成功"**不计分**，见 acceptance-protocol §1.3 铁律）⇒ 写用例只有
    # "调用了"级断言 = 已知假绿形态（`CASE-TRUST-NO-EFFECT-ASSERTION`）。
    must_succeed:
      - tool: employee_manage
        action: create
    data_checks:
      - "收集确认后创建成功 —— 机器断言见 must_succeed[employee_manage(action=create)]（工具真的返回 success）"
    # 全局命名空间声明（issue #3781）：本用例**写**员工姓名/手机号命名空间 ——
    # 每跑一次就往栈里放一个「王五/13812345678」。任何同样依赖「王五」的用例
    # （HR-003 是 KEY_JOURNEY）都会因**重名**而目标不唯一 ⇒ 必须与本用例互斥。
    namespaces:
      - "employee_name:王五"
      - "employee_phone:13812345678"
    # 清理自己的产物（幂等；每次尝试前跑，见 local_runner._run_pre_clean）：
    # 「谁造的谁清」是本病灶的**根治**——只改 HR-003 的 pre_clean 消不掉重名，
    # 因为重名是 HR-002 造的。清理**不依赖** HR-003 的顺序，故 HR-002 可独立重跑。
    pre_clean:
      - type: employee_remove
        employee_name: "王五"
        employee_phone: "13812345678"
    # 前置自断言（门禁 f 条；issue #4189 的 burn-down 缴费 —— 改用例文件的 PR 必须净缩
    # ≥1 条存量违规，先清 OR-*；本用例命中的唯一一条是 CASE-TRUST-NO-PRECONDITION-ASSERTION）：
    # 创建的前提 = `13812345678` 名下**没有**既有员工（残留会撞手机号唯一校验 ⇒ agent
    # 合理澄清 ⇒ 恒红且归因全错）。`employee_count_for_phone` 读 admin-api users 列表，
    # 定位口径与 `pre_clean[employee_remove]` **同一份**（`_norm_phone` 数字归一，§18 单一
    # 真相源）：`expect: 0` ⇒ 基线有残留即判前置不成立（红/绿不可归因）；
    # `max_growth: 1` ⇒ 容忍本用例自己造的那一个（创建后计数 0→1），并行用例再造同名
    # （0→2）⇒ 漂移判红（同 chat.yml #4099 先例：自建目标的用例必须给 max_growth）。
    precondition:
      - type: employee_count_for_phone
        source: "13812345678"
        expect: 0
        max_growth: 1
    skip_reason: ""
    merge_log: "verification 5.2 独有；2026-09-09 校准：① 补「确认」点确认卡轮（agent 第一轮先查角色→validate→发确认卡，需确认后才 create）；② R1 补密码（execute._create_user 要求 password 必填，原 user_inputs 无密码，agent 确认后才发现缺密码反复追问——契约已修，case 同步补密码）。2026-09-15（issue #3781）：补 `namespaces` 声明 + `pre_clean[employee_remove]` —— 本用例造出的第二个「王五」是 HR-003（KEY_JOURNEY）**恒红**的根因（真实 run 34856561459，两次独立审计共同确认的用例资产缺陷）；2026-09-18（issue #4150 的 burn-down 缴费 —— 本 PR 改了 cases/*.yml ⇒ 每 PR 至少净缩 1 条存量违规）：补 `must_succeed[employee_manage(action=create)]` 效果层断言（门禁 a2 条 / #3778「调用了 ≠ 成了」），原 `data_checks` 的「收集确认后创建成功」是**不计分**的自然语义（acceptance-protocol §1.3）⇒ 该用例此前只有「调用了」级断言。断言只增不减。2026-09-19（issue #4189 的 burn-down 缴费 —— 本用例命中的唯一一条存量违规是 CASE-TRUST-NO-PRECONDITION-ASSERTION）：补 `precondition[employee_count_for_phone: 13812345678, expect: 0, max_growth: 1]` —— 创建前提 = 该号码名下无既有员工（残留撞唯一校验 ⇒ 恒红且归因全错）；`expect: 0` 判基线、`max_growth: 1` 容忍本用例自己造的那一个（自建目标先例：chat.yml #4099）；定位口径与 `pre_clean[employee_remove]` 同一份（`_norm_phone`）。断言（user_inputs / expectations / must_succeed / pre_clean / namespaces）原样未动、无放宽。"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_tools_employee_manage.py"
      ci:
        - agent-eval.yml
      verifies: []

  - id: HR-003
    legacy_id: "5.3"
    title: "禁用员工账号"
    domains:
      - hr
    tier: normal
    tags:
      - status
      - destructive
    truths_ref:
      - employee-role.write-require-admin
    user_inputs:
      # 显式指代（#3568 范式，同 HR-008）：**以种子号码为主指代**，姓名只作补充。
      # 种子里 HR-003 点名的员工是 `debug_employee_wangwu / 13700137000`
      # （`fixtures/mibao_eval_seed.sql:113-120`）；而 HR-002 会创建**另一个同名
      # 「王五」（13812345678）** ⇒ 只按姓名指代时目标不唯一，agent 给出**正确**的
      # 安全行为（「系统里有两个「王五」…我需要知道停用哪一个才能安全执行」），
      # 用例却因此恒红（真实 run 34856561459 的两次独立审计共同确认的用例资产缺陷）。
      - "手机号 13700137000 的那位员工（王五）离职了，停用账号"
      - "确认停用"
    # 全局命名空间声明（issue #3781）：与 HR-002（写 employee_name:王五）**自动互斥**，
    # 两条不再同窗口并跑 —— 这是"重名"这一污染源的结构性隔离。
    namespaces:
      - "employee_name:王五"
      - "employee_phone:13700137000"
    pre_clean:
      # ⚠️ 唯一性保证有两层（缺一层即可能将来复发）：
      #   ① `employee_phone` 让定位**精确到种子那一条**（不再是"第一条同名"）；
      #   ② 命中的条目**全部**恢复为 active（幂等）—— 即便将来又有别人造了同名员工，
      #      本用例的靶子也仍是"种子里那个号码对应的账号"，且列表里的同名项状态确定。
      # 每次尝试前都跑（#3751），故必须幂等：`employee_reactivate` 已是幂等无副作用动作。
      - type: employee_reactivate
        employee_name: "王五"
        employee_phone: "13700137000"
    expectations:
      - tool: employee_manage
        args:
          action: toggle_status
          status: disabled
    data_checks:
      - "二次确认后停用"
      - "目标是手机号 13700137000 的种子员工（debug_employee_wangwu），不是任何同名账号"
    skip_reason: ""
    merge_log: "verification 5.3 独有；2026-09-15（issue #3781）根治假红：① `user_inputs` 改为**手机号显式指代**（#3568 范式，同 HR-008）；② `namespaces` 声明 employee_name:王五 / employee_phone:13700137000（与 HR-002 自动串行）；③ `pre_clean.employee_reactivate` 补 `employee_phone` 精确定位（旧实现只按姓名 `next(...)` 取第一条 ⇒ 命中 HR-002 的同名产物）并改为命中多条时全恢复 —— 病灶铁证：真实 run 34856561459 里 HR-003 的 `employee_manage(list)` 返回 `users=2 total=2`"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_tools_employee_manage.py"
      ci:
        - agent-eval.yml
      verifies: []

