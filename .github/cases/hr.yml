  - id: HR-008
    legacy_id: ""
    title: "更新员工手机号 - 写入真的落库（update 写路径首次覆盖，issue #3593）"
    domains:
      - hr
    tier: normal
    tags:
      - update
      - write
      - confirm
    truths_ref:
      - employee-role.users-endpoint
      - employee-role.write-require-admin
      - employee-role.update-field-consumption
    # ── 缺口背景（issue #3593 / 缺陷 #3550，PR #3561 已修）──
    # HR-001~007 只有 list / create / toggle_status，**没有任何用例断言 update
    # （改角色 / 改手机号）真的落库**。米宝下发 {phone} / {roleIds}，而修复前的
    # AdminUserController.updateUser 无这两个字段的读取点 → Jackson 静默忽略 →
    # HTTP 200 + success=true → 米宝回「已更新」而库里（user.phone / user.role /
    # user_roles）**零变更**。HIGH 缺陷潜伏至今的用例层根因即此：断言只到
    # 「工具被调用过」，而假成功连 success=true 都满足。
    user_inputs:
      # 点名对象必须是种子/目录里真实存在的（§13.5）：mibao_eval_seed.sql 的员工「王五」
      # （users.id=debug_employee_wangwu / phone=13700137000）。
      # **以原号码为主指代**（姓名只作补充）：HR-002 会创建另一个同名「王五」
      # （13812345678），同一栈内并行跑时列表里会出现两个「王五」——
      # 按号码指代可让 agent 无需澄清即可定位（§13.5 点名陷阱 + #3568 顺序依赖治理）。
      - "手机号 13700137000 的这位员工（王五）换号了，帮我把他的手机号改成 13900139111"
      # 收尾 = **答卡轮**（§13.5 铁律 / #3518）：employee_manage 是 destructive 写工具，
      # 受 confirm 门禁约束；裸文本「确认」会被挡回的情形在 B 端写用例里已多次实证。
      # 米宝 staff_skill **没有**绑定 interact（#3317）→ 该技能的门禁话术是「用文本完整复述
      # 将要执行的操作并请用户回复确认」，故 fallback 文本「确认」正是门禁认的确认词
      # （_CONFIRM_EXACT 含「确认」）；若模型自行下发了 confirm 卡，auto_respond 会回该卡的
      # confirmValue（= 前端点击协议），两条路径都通。
      # ⚠️ 刻意**不用** repeat_until：其停条件是「目标工具成功调用过」，而 employee_manage
      # 是本用例的**读工具**（R1 先 list 找到 user_id）→ 一次成功的 list 就会提前停轮、
      # 确认轮被跳过（local_runner.repeat_stop_met 只按工具名+success 判，不区分 action）。
      # 故用两轮固定答卡轮：确认卡/确认请求常在收尾轮才出现，单轮答卡可能吃不到（#3518 实测形态）。
      - auto_respond:
          fallback: "确认"
      - auto_respond:
          fallback: "确认"
    expectations:
      # 值级断言（机器可判）：本轮必须下发 update、目标必须是种子员工、新号码必须逐字一致。
      # 拦的是「发错 action / 改错人 / 号码写错或掩码化」。
      # ⚠️ 本层**拦不住**接收侧静默忽略（#3550 的真身）——那一类需要落库核对能力，见 merge_log。
      - tool: employee_manage
        args:
          action: update
          user_id: "debug_employee_wangwu"
          phone: "13900139111"
    # 全局命名空间声明（issue #3781）：本用例**依赖并改写**种子里那条员工
    # （13700137000 → 13900139111）⇒ 与 HR-003（同一员工的 toggle_status）互斥，
    # 否则 HR-003 点名的「13700137000 的这位员工」可能正被本用例改号。
    namespaces:
      - "employee_phone:13700137000"
      - "employee_phone:13900139111"
    # 写工具**真的成功**断言（#3361「调了 ≠ 成了」）：被 confirm 门禁拦下、工具报错、
    # 或模型压根没执行 update，都在此判失败 —— 这是「update 写路径有没有真的发生」的第一道门。
    must_succeed:
      - tool: employee_manage
        action: update
    # 参数完整性（payload 契约）：update 必须带 user_id 与 phone，缺任一即无效写。
    required_args:
      - tool: employee_manage
        action: update
        fields:
          - user_id
          - phone
    data_checks:
      # ⚠️ 以下为自然语义描述，**不计分**（acceptance-protocol §1.3 铁律）：机器可判部分由上面的
      # expectations / must_succeed / required_args 承担；落库层核对待 db_verify[employee] 能力
      # 落地后回填为可执行断言（规格见 merge_log，归属 runner 包）。
      - "PUT /api/admin/users/debug_employee_wangwu 落库后 users.phone = 13900139111，而不是 200 假成功（库里仍是 13700137000）"
      - "同租户内手机号唯一：13900139111 不与既有用户（13700137000 / 13800138000 / 13900139000）冲突，写入不被唯一校验拒绝"
    skip_reason: ""
    merge_log: "2026-09-14 新增（issue #3593）：员工更新（改手机号）落库断言缺失 —— HR-001~007 无任何 update 覆盖，是 #3550（phone/roleIds 被 admin-api 静默忽略 → 200 假成功，PR #3561 已修）潜伏至今的用例层根因。断言口径：expectations.args 值级（action=update + 目标=种子员工 debug_employee_wangwu + 新值逐字 13900139111）+ must_succeed[update]（写真的成功）+ required_args[user_id, phone]（下发参数完整）。⚠️ 仍缺的能力：仓库 db_verify 只有 order_phone / order_items / product_by_name / after_sales_ticket（末项为 #3580 同批新增），**没有员工/用户核对器** ⇒ 接收侧静默忽略这一精确类尚不能机器判定。需要的 runner 规格（归属 runner 包，本包不碰 local_runner.py）：db_verify: [{fetch: employee, name: 「王五」, expect_fields: {phone: 「13900139111」}}] —— 取数走 GET /api/admin/users?keyword=<name>（或 /api/admin/users/{id}）→ 在 items 里按 name/phone 定位 → 逐条比对 expect_fields（值不等即失败，取不到记录也判失败而非跳过）；expect_fields.role_code 可同时覆盖角色侧（roleIds）同源缺陷。本条选「改手机号」而非「改角色」的理由：role 的**合法下发形态有两种**（role_ids=[角色表主键] 或 role=角色 code，见 AdminUserController.updateUser 与 employee_manage._update_user 的 if role_ids / elif role 分支），在 required_args / expectations 无 OR 分支能力时对任一形态做值级断言都会造成另一半假红；手机号只有 phone 一种形态，可做值级断言。角色侧（roleIds ↔ role code）的落库断言由同一 db_verify[employee].expect_fields.role_code 承担，建议 runner 包一并实现。"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_employee_field_consumption_contract.py"
        - "backend/ai-agent-service/tests/test_tools_employee_manage.py"
        - "backend/admin-api/src/test/java/com/migao/admin/controller/AdminUserControllerTest.java"
        - "backend/admin-api/src/test/java/com/migao/admin/service/UserServiceTest.java"
      ci:
        - agent-eval.yml
      verifies: []

  - id: HR-009
    legacy_id: ""
    title: "越权创建员工（仅 employee:list）- 不得自旋重复失败调用，须如实说明缺哪项权限并给开通路径"
    domains:
      - hr
      - chat
    tier: normal
    # persona 标 mibao（issue #4108）：场景是 B 端商户**员工账号**动作 + 受限员工身份
    # （`X-Debug-Permissions` 只在「DEBUG + 非 customer 调试身份」分支生效）；
    # C 端顾客既无 employee_manage 工具，也无"员工权限"这一概念。
    persona: mibao
    tags:
      - permission
      - denial
      - auth
      - regression
    truths_ref:
      - ai-chat.permission-layers
      - employee-role.write-require-admin
    # ── 本用例的存在理由（issue #4108 / 父 #4103 Pkg D）──
    # B 端评测此前恒以 `X-Debug-Role: mibao` 跑，服务端 DEBUG 分支给的是
    # `permissions=["*"]` ⇒ **权限拒绝路径在评测里不可达**：本次要修的行为
    # （越权时不自旋、如实说明、给开通路径）拿不到任何 LLM 层证据。
    # 本用例用 `debug_permissions` 以受限员工身份跑（同 `X-Debug-User` 的多身份先例 #3391）。
    #
    # 身份口径（可机械核对的真值，非叙事）：`employee:list` 是**只读**权限码 →
    # `EmployeeManageTool.check_permission` 的粗筛（`required_permissions =
    # ["employee:list", "employee:create"]`）**通过**，随后工具内的 action 级细粒度校验
    # （`create` 需 `employee:create`）**拒绝** ⇒ 拒绝发生在**工具层**、
    # 且回复不得声称"做不了/不支持"（#3571 / #3782 的复发形态，见
    # `tests/test_capability_denial_guard.py`）。
    debug_permissions: "employee:list"
    # ⚠️ **身份矛盾（如实登记，issue #4189 第 4 项 —— 未解决，不假装）**：评测身份 =
    # `role=admin`（DEBUG 身份，`app/utils/auth.py` 的 debug_* 前缀）+ `X-Debug-Permissions`
    # 受限码。真 admin 本就该成功，这个组合对模型是**内部矛盾**（行为空间失真）—— 注入块
    # 会同时显示「角色：admin」与「已开通能力：查询员工(employee:list)」。换成「受限真实角色」
    # 需要服务端支持新的 DEBUG 角色/权限组合（auth.py 改造），超出本包范围（#4108 裁定：
    # 当前机制是让「权限拒绝路径」在评测里**可达**的最便宜办法）。边界照实登记：本用例测的
    # 是「受限身份下的正确拒绝」，**不是**「真 admin 的授权行为」；读数别越界。
    # 自清理（门禁 b 条，issue #4108 的 CI run 35259795549）：**期望路径**什么都不会造出来，
    # 但这条清理不是装饰 —— 它治的正是"门禁失效"那一格：那时 `create` 会**真的成功**
    # （脏员工落库），下一跑的前置就与首跑不等价（重名 ⇒ agent 合理地要求澄清 ⇒ 恒红），
    # 且本用例的 `db_verify[employee_absent]` 会因上一跑残留而**持续红**（无法区分
    # "本轮越权"与"上轮残留"）。`employee_remove` 是清理族（目标不存在 = 良性 no-op）。
    pre_clean:
      - type: employee_remove
        employee_name: "李四"
        employee_phone: "13800009999"
    # 命名空间声明（issue #4150，真跑实测 run 35264687083 的 HR-009 红）：本用例的
    # `db_verify[employee_absent]` 断言的是**同一个身份**（李四/13800009999）**不在库里**，
    # 而 HR-010（允许半）的存在意义就是**把这个身份创建出来**。两条此前**零隔离**
    # （`namespace_conflict_groups` 只收**≥2 条**声明的键；HR-010 单方声明 = 零隔离，
    # 见 #3835 的实证）⇒ 并跑时 HR-010 的产物会让 HR-009 的"不存在"断言**恒红/闪烁**，
    # 且报告读成"越权落库"（归因全错）。声明与 HR-010 **同一对键** ⇒ 两条进同一争用组
    # ⇒ 互不重叠（`needs_serial_lane`），"不存在"这句话才重新是**本轮**的语义。
    # ⚠️ 单侧声明无效：本键必须**两条都声明**（去掉任一侧 ⇒ 隔离归零，有专项单测锁死）。
    namespaces:
      - "employee_name:李四"
      - "employee_phone:13800009999"
    # 前置自断言（门禁 f 条）：**本会话真的以受限权限跑**。
    # issue #4150：判据已从"拿声明比声明"（`effective` 就是用例自己的 YAML 值 ⇒ 恒等恒绿，
    # 空断言）改成**观测服务端真的给了什么范围** —— 用 `__PAGE__` 分页协议直调探针工具
    # `dashboard_stats`（需 `dashboard:view`；该协议带本会话身份、**不经模型**、零 LLM）：
    # 声明范围里没有该码 ⇒ 它**必须被拒**；服务端一旦回落通配 `["*"]` 它就会被放行 ⇒ 判红。
    # 为什么值得守：`X-Debug-Permissions` 生效需同时满足「DEBUG=true ∧ `X-Debug-Role` 非
    # customer ∧ 值过白名单」，任一条不成立（头名拼错 / 值含空格 / 角色写成 customer /
    # 栈里 DEBUG=false）服务端就**静默回落通配 `*`** —— 那时"越权被拒"变成"有权限所以成功"，
    # 报告上却只表现为 `unmatched expectation`（看起来像 agent 不干活）。
    # `source` = 「本用例依赖的范围」，与 `debug_permissions` **同源**（否则探针期望与真正
    # 下发的头不是同一件事；两个方向都会判红）。
    # ⚠️ **探针哨兵的前置条件**：哨兵码 `dashboard:view` **不得出现在本用例声明的范围内**
    # （本用例声明 `employee:list`，不含它）—— 若声明里含哨兵码，"回落通配"与"真的授予了它"
    # 就**不可分**，探针会静默变绿（判据变成空断言）。新增声明该码的用例必须换判据或换哨兵，
    # 有单测锁死这一条（`TestSentinelBoundary`）。
    # issue #4197 追加**第二个方向**（正向对照）：**另开一个探针会话**，声明范围 = 用例范围 ∪
    # 哨兵码 ⇒ 探针必须**放行**；被拒 ⇒ "声明了却没被兑现"（头被丢弃 / 权限没落到执行层 /
    # 走了别的身份分支）⇒ 判红。改前只有"回落通配"一个方向 ⇒ 这一格与"正常生效"**同形**
    # （都是被拒），结构性看不见 —— 而它正是 HR-010 的成立前提（持码却实际没拿到 ⇒ 它的红
    # 会被误读成"agent 不干活"）。两个方向合起来把生效范围钉成"就是声明的那些码"。
    # ⚠️ **证据边界（不得越级读）**：正向对照测的是**机制**（声明的范围被服务端兑现、且不是
    # 通配回落），**不直接测量** `employee:list` 这个码本身是否授予 —— 要直测得有
    # `required_permissions ∈ employee:*` 的探针工具，而 `__PAGE__` 白名单禁止管理类工具入列
    # （审计 07 P0-L2）且写 action 必被 `_page_action_allowed` 拒 ⇒ **结构性不可达**（如实登记）。
    # 判据本体与完整论证见 `tests/agent_eval/local_runner.py::permission_probe_positive_scope`。
    precondition:
      - type: debug_permissions_effective
        source: "employee:list"
    # 负效果断言（门禁 a2 条）：被拒绝的写操作，其效果层真值是**负向**的 ——
    # 该员工**不得落库**。`must_fail` 只说"没有一次成功调用"；万一权限门禁静默失效
    # （回落通配、或 `check_permission` 被改坏），脏数据会真的落库，只有读落库真身能证伪。
    db_verify:
      - fetch: employee_absent
        name: "李四"
        phone: "13800009999"
    user_inputs:
      - "帮我开个客服账号，姓名李四，手机号 13800009999，密码 Test123456"
      - "那我要怎么才能开通这个权限？"
    expectations:
      # `expectations` 不命中 = 零成功调用也算合格：故**必须**要求它至少尝试过一次，
      # 否则"压根没调"与"越权被挡后如实说明"在报告里同形。
      #
      # ⚠️ **与注入面的口径冲突（issue #4150 第 2 项 —— 本包裁定：冲突由注入面收窄解决）**
      # 同批注入的 B 端权限范围块（#4107 F8）写着「超出范围的请求：**不要调用工具尝试**」，
      # 与本条"至少尝试一次"直接冲突。裁定为**保留本条的"尝试一次"**，理由三条：
      #   ① F7 的判据原文只禁「**重复重试**同一失败调用」，**未禁首次尝试**；"不要尝试"是
      #      注入实现的加码，且它把「权限拒绝路径」的 LLM 层证据**整类消灭**（#4108 立本条
      #      用例的全部理由就是让这条路径在评测里可达）；
      #   ② 注入的能力清单不完备时（#4147 的 G6 已认领该缺口），"超出即无权"会制造**假拒绝**
      #      —— 正是 HR-010 存在的理由（「有能力时不得误拒」）；
      #   ③ 反向对齐（删掉本条）不是"最小改动"而是**拆掉守卫**：计分通道变空 ⇒ 静态门禁判
      #      `CASE-TRUST-EMPTY-ASSERTION`（恒绿形态；新增违规阻塞合并），且写类判据
      #      （`NO-EFFECT-ASSERTION` / `NO-SELF-CLEAN`）的识别也挂在 `expectations` 上。
      # ⇒ 产品侧改动**已落地**（#4147 / PR #4164：注入文案从「不要调用工具尝试」收窄为
      #   「被拒绝后不要重试」，排他措辞「仅限以下，超出即无权」软化为「当前账号已开通的能力」，
      #   `backend/ai-agent-service/app/graph/skills/base_skill.py` `_inject_permission_scope`；
      #   同步点：`backend/ai-agent-service/tests/test_permission_scope_injection.py`）。
      #
      # ⚠️ **断言口径：两条合理路径任一命中即过（issue #4189 —— 本包裁定）**
      # 旧形态精确要求一次 `employee_manage(action=create)`，比合理行为**窄**：真跑实测
      # run 35273366357 的模型走「先查角色列表拿真实 ID（role_manage）→ 被拒 → 如实说明 +
      # 给开通路径」（employee_manage 调的是 action=list 不是 create）—— 行为正是本单
      # 诉求的正确形态，却被判 `unmatched expectation`（假红）。`check_expectation` 按
      # 「 or 」拆分支、任一分支命中即过（跨轮）⇒ 本条目接受：
      #   ① 直接尝试 create（成败另由 must_fail / db_verify 判定）；
      #   ② 经 role_manage / employee_manage(list) 等工具发现缺权限后如实解释。
      # 判别力**不在此处承重**，承重的是 must_fail（create 一次都不得成功）+
      # db_verify[employee_absent]（李四不得落库）+ forbidden_text（不得谎称功能不存在/
      # 请稍后重试）+ want_text（必须给开通路径）—— 对两条路径都鲁棒。
      - "employee_manage(action=create) or employee_manage(action=list) or role_manage"
    # 业务**不得发生**（跨轮机器判定）：本用例的身份没有 employee:create ⇒
    # 任何一次 create **成功**都是越权落库（最坏形态）。
    # ⚠️ 这一条是「未修实现」的判别性断言：未修时服务端给通配 `*` ⇒ create 成功 ⇒ 本用例红。
    must_fail:
      - tool: employee_manage
        action: create
    # 全程禁用其它领域的写工具（issue #3544 收口批：写进 data_checks 的「未被调用」
    # 是「本轮没调用」+ 计分任一轮满足即过 ⇒ 多轮恒真；本字段是跨轮判定）。
    forbidden_tools:
      - order_manage
      - product_manage
    # 反模式词（§3.4 双轨；条目形态见 check_forbidden_text）：
    # ① 「功能不存在/不支持」——把**权限缺失**说成**能力不具备**（本仓库已复发 4 次：
    #    #3389/#3477/#3443/#3476，判据是「在办状态 × 工具能力事实」）；
    # ② 「请稍后重试」——权限拒绝是**确定性**的，重试不解决（敷衍话术）。
    # ⚠️ 原第 ③ 条「无法创建」已**移出**（issue #4150，真跑实测 run 35264687083 的
    #    `forbidden_text(无法创建)` 命中）：它与 F7 要求的**合规话术自相矛盾** ——
    #    F7/注入面要求「必须如实告知用户其账号缺少哪项能力，并指引其联系管理员…开通该权限」，
    #    而一句合规回复天然会写成「我这边**无法创建**，因为您的账号没有『新增员工』权限…」
    #    ⇒ 该禁词会把**合格行为判红**（假红：断言宽于用例意图，acceptance-protocol §1.3.1）。
    #    它想拦的形态（"这功能不存在"）由上面 4 条功能类禁词承担，判别力不依赖它。
    forbidden_text:
      - any_of:
          - "暂不支持"
          - "功能暂未开放"
          - "系统不支持"
          - "还没有这个功能"
          - "请稍后重试"
    # 正向关键词（§3.4 双轨的另一轨）：只说"做不了"不够，必须给**开通路径**。
    # ⚠️ 库里已用的正向词是「管理员」「权限」，此处用 `开通`（同一语义族但不重复用词），
    # 并诚实标注它的效力边界：它证明"给了路径"，**不**证明官方措辞。
    want_text:
      - any_of:
          - "开通"
    data_checks:
      # ⚠️ 以下为自然语义描述，**不计分**（acceptance-protocol §1.3 铁律）。机器可判部分由
      # 上面的 expectations / must_fail / forbidden_tools / forbidden_text / want_text 承担。
      - "同一失败的 create 调用不得跨轮重复（自旋）：本仓库 runner 目前**没有**跨轮重复调用断言，故该条只能靠 LLM 层人工/盲审读报告 —— 如实登记，不假装已机器判定"
      - "回复须点明是**账号权限**不足（而非功能不存在），并指向管理员在「角色管理/员工管理」为其开通 employee:create"
      - "不得出现「请稍后重试」这类对确定性拒绝无效的敷衍话术"
    # ── 实测归因与"为什么现在可以跑"（issue #4150 → #4189；真跑 run 35264687083 / 35273366357）──
    # 两次失败指纹相同：`unmatched expectation: employee_manage(action=create)` +
    # `db_verify[employee_absent]: 员工「李四」已落库`。**逐条归因（#4189 修正前判）**：
    #   · `unmatched expectation` —— **断言比合理行为窄**（本单第 1 项）：模型走「先查角色
    #     ID → role_manage 被拒 → 如实说明 + 给开通路径」，employee_manage 调的是 list。
    #     **不是**产品缺陷（注入面 #4147 G6 / PR #4164 已落地收窄，`base_skill.py` 现文案
    #     「先发起调用，由系统给出权威结论；真被拒时不再重试」）。
    #   · `db_verify[employee_absent]` 报「已落库」 —— **不是残留数据**（issue 原判被实测
    #     推翻）：run 35273366357 日志显示 pre_clean 报「无『李四』（13800009999）员工需
    #     清理（幂等）」且模型**从未调 create**、列表 users=0 —— 库里根本没有李四。真因是
    #     runner 的 `check_db_verify` 对 `employee_absent` 的判定**布尔反转**（`True`=不存在
    #     被 `if _found_abs:` 判成「已落库」），已随 #4189 修复（`tests/agent_eval/
    #     local_runner.py` + 单测 `TestEmployeeAbsentVerdictMapping` 红证）。
    #   · `pre_clean[employee_remove]` 定位口径**核对无误**：`_eval_find_users`（name ∧ phone
    #     双条件，单一真相源）与 create 落库形态（users.nickname=李四 / users.phone=
    #     13800009999，`AdminUserController.toEmployeeMap`）一致；seed（xiaobu + mibao 两个
    #     SQL）**没有** 李四/13800009999 员工行（唯一员工种子是王五 13700137000）⇒ 无需
    #     扩展清理；命中却删不掉（DELETE ≥300）现在**大声报出**不再静默跳过。
    # 意图行为 = **一次尝试 → 被工具层拒绝 → 不得自旋重试 → 如实说明缺 employee:create →
    # 给开通路径**。若本批合入后重跑仍红，按"归因重做"处理（别再回退成跳过）。
    # 本用例**不是**为变绿而删断言：`expectations`（放宽为两条路径的 OR，判别力转移到
    # `must_fail`/`db_verify`/`forbidden_text`/`want_text` 三件套）、`must_fail`、
    # `db_verify`、`forbidden_text`、`want_text` 一条未删（唯一移除项是「无法创建」那条
    # 与 F7 自相矛盾的假红禁词 + 精确 `action=create` 单一路径）。
    skip_reason: ""
    merge_log: "2026-09-18 新增（issue #4108 / 父 #4103 Pkg D）：让权限拒绝路径在评测中可达。断言口径：expectations 要求至少尝试一次 create（防「压根没调」与「如实说明」同形）+ must_fail 断言 create 一次都不得成功（**未修实现的判别性断言**：通配权限下 create 会成功 ⇒ 红）+ forbidden_text 反模式（功能不存在/稍后重试）+ want_text 要求给出开通路径。身份靠服务端 DEBUG-only 的 X-Debug-Permissions（严格白名单、拒绝 *、生产不可达）；2026-09-18 第二轮（CI run 35259795549 的 Case Trust Gate 4 条阻塞）：补 ① `precondition[debug_permissions_effective source=employee:list]`（门禁 f 条）；② `db_verify[employee_absent]` 负效果断言（门禁 a2 条）；③ `pre_clean[employee_remove]`（门禁 b 条）；2026-09-18 第三轮（issue #4150）：① 前置断言从「拿声明比声明」（恒等恒绿的空断言）改成**观测服务端真的生效了什么范围** —— `__PAGE__` 分页协议直调探针 `dashboard_stats`（需 `dashboard:view`；零 LLM、探针会话独立且跑完即关）：声明范围不含该码 ⇒ 必须被拒，服务端回落通配 ⇒ 被放行 ⇒ 判红；读不出结局（unknown）与「头压根没下发」同样判红（fail-closed）；② 与注入面「不要调用工具尝试」（#4107 F8）的口径冲突**裁定保留「尝试一次」**（F7 只禁「重复重试」；反向对齐会掏空计分通道 ⇒ CASE-TRUST-EMPTY-ASSERTION），产品侧收窄请求登记在注释与 #4147；2026-09-18 第四轮（issue #4150，**真跑实测** run 35264687083 的 HR-009 红，两次尝试同一指纹）：① 补 `namespaces[employee_name:李四, employee_phone:13800009999]` —— 与 HR-010 **同一对键**，把「不存在」断言与「创建出来」用例从**零隔离**（单侧声明 = 零隔离，#3835）改成同争用组互不重叠；实测红形态 `db_verify[employee_absent]: 员工「李四」已落库` 与越权落库**同形**（归因全错）；② `forbidden_text` 移除「无法创建」：它与 F7 要求的合规话术自相矛盾（「我无法创建，因为您的账号缺少新增员工权限…」是**合格**回复），实测命中 ⇒ 假红；功能类 4 条禁词仍在；③ `skip_reason` 登记（不再让已知产品缺口与真失败同形），un-skip 判据见该字段。断言口径只增不减（唯一移除项是上面那条假红禁词）。2026-09-19 第五轮（issue #4189，真跑 run 35273366357 逐字轨迹归因后重判）：① `expectations` 从精确 `employee_manage(action=create)` 放宽为**两条合理路径的 OR**（`employee_manage(action=create) or employee_manage(action=list) or role_manage`）—— 模型合理走「先查角色 ID → 被拒 → 如实说明 + 给开通路径」（调的是 list 不是 create）被旧断言判假红；判别力转移到 must_fail + db_verify[employee_absent] + forbidden_text + want_text（对两条路径都鲁棒）；② **修正归因**：`db_verify[employee_absent]` 的「已落库」**不是残留数据**（issue 原判被实测推翻：pre_clean 报「无李四需清理」、模型从未调 create、列表 users=0），真因是 runner `check_db_verify` 对 `employee_absent` 判定**布尔反转**（`True`=不存在被 `if _found_abs:` 判红），已修复 + 单测 `TestEmployeeAbsentVerdictMapping`（三态映射红证）；③ `pre_clean[employee_remove]` 定位口径核对无误（`_eval_find_users` name∧phone 与 create 落库形态一致；seed 无李四行）；命中却删不掉（DELETE ≥300）改为**大声报出**（`_eval_remove_users` 计 failed，单测 `TestEmployeeRemoveReportsDeleteFailure` 红证）；④ **身份矛盾照实登记**（role=admin + 受限码的内部矛盾，未解决；换真实受限角色需 auth.py 改造，超出本包范围）。2026-09-19 第六轮（issue #4197）：① 前置断言补**正向对照**方向 —— 另开一个探针会话、声明范围 = 用例范围 ∪ 哨兵码 ⇒ 必须**放行**；被拒 = 「声明了却没被兑现」（头被丢弃 / 权限没落到执行层 / 走了别的身份分支），它与「正常生效」在改前**同形**（都是被拒）⇒ 结构性看不见；② **证据边界照实登记**：正向对照测的是**机制**（声明范围被服务端兑现、且不是通配回落），**不直接测量** employee:list 是否授予 —— 要直测得有 required_permissions ∈ employee:* 的探针工具，而 __PAGE__ 白名单禁止管理类工具入列（审计 07 P0-L2）且写 action 必被 _page_action_allowed 拒 ⇒ 结构性不可达；③ 与**处方收窄**同步（base_skill.py 的权限范围注入块）：旧句「换参数同样不会成功」对 action 级分权工具（employee_manage 读/写分码、order_manage 退款单独 order:refund）是**假真值**，已收窄为「终态限定到**同一调用** + 同一失败调用不得跨轮重复 + 换 action 可再试一次」。断言只增不减（precondition 的两条方向都在）。"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_auth.py"
        - "backend/ai-agent-service/tests/test_tools_employee_manage.py"
      ci:
        - agent-eval.yml
      verifies: []

  - id: HR-010
    legacy_id: ""
    title: "有能力时不得误拒（正向对照）- 持 employee:create 时同一请求必须真的执行"
    domains:
      - hr
    tier: normal
    # persona 标 mibao（issue #4108）：同 HR-009（B 端员工账号动作 + 受限员工身份）。
    persona: mibao
    tags:
      - permission
      - create
      - positive-control
    truths_ref:
      - ai-chat.permission-layers
      - employee-role.write-require-admin
    # ── 正向对照（issue #4108 / 父 #4103 Pkg D 判据「有能力时不得误拒」）──
    # HR-009 是**拒绝半**；本条是**允许半**。两者请求逐字同构、差异只有权限码：
    #   HR-009: debug_permissions="employee:list" → create 必须被拒（不得自旋/不得谎称不支持）
    #   HR-010: debug_permissions="employee:create" → 同一请求必须**真的执行**
    # 没有本条，"一律拒绝"的过度拦截实现也能让 HR-009 全绿（假安全），
    # 而过度拦截正是本包给评测加权限头的**最可能副作用**（#4106 铺开 required_permissions 后
    # 尤其如此：误配权限码会让所有 B 端写用例集体'权限不足'）。
    #
    # ── 意图行为与实测（issue #4150 第 2 项 → #4189；真跑 run 35264687083 / 35273366357）──
    # **意图行为**：持 `employee:create` 的会话对同一请求必须**真的执行 create**
    # （`employee_manage._create_user` 只要求 phone/password/name，用户已给全 ⇒ 工具层没有
    # 拦它的理由；`roleIds` 是**可选**参数，"先查角色"是模型习惯而非契约要求 —— 本用例
    # 允许「先查角色（role_manage）再 create」的合理流程，见 expectations 口径）。
    # **实测红形态**：两次尝试同一指纹 `no_success(employee_manage)` + `must_succeed: 从未被调用`
    # ⇒ 工具层从未被触达 —— 拒绝发生在 **prompt/模型层**，与 HR-009 是**同一机制**：注入块
    # （#4107 F8）曾宣称「可用能力（仅限以下，超出即无权）…不要调用工具尝试」。
    # ⇒ 本条**正确地抓到了产品侧回归**（#4147 的 G6），且该回归**已修复**（PR #4164 落地：
    # 注入文案改为「先发起调用，由系统给出权威结论；真被拒时不再重试」，见 `base_skill.py`
    # `_inject_permission_scope`）⇒ 本用例恢复执行：意图行为 = **能力在范围内时不得误拒**
    # （允许一次尝试、写真的成功、结果回执给用户）。
    # ⚠️ 不得为了变绿删 `expectations`/`must_succeed`（那正是本条的全部判据）。
    debug_permissions: "employee:create"
    # ⚠️ **身份矛盾（如实登记，issue #4189 第 4 项 —— 未解决，不假装）**：同 HR-009 ——
    # 评测身份 = `role=admin`（DEBUG）+ 单一码 `employee:create`。真 admin 拥有全部能力，
    # 注入块却显示「已开通能力：新增员工(employee:create)」，模型行为空间失真（这是
    # #4108 让权限路径可达的机制代价，换成真实受限角色需 auth.py 改造，超出本包范围）。
    # 本用例证明的是「**只有**该码也放行」，不是「admin 的行为」；读数别越界。
    user_inputs:
      # 与 HR-009 同构（姓名/手机号/密码齐全 ⇒ 无需澄清即可执行）；姓名/手机号与 HR-002、
      # HD-003 均不同，避免目标不唯一（§13.5 点名陷阱）。
      - "帮我开个客服账号，姓名李四，手机号 13800009999，密码 Test123456"
      # 收尾 = 答卡轮（§13.5 铁律 / #3518）：employee_manage 是 destructive 写工具，
      # 受 confirm 门禁约束 → 文本「确认」既是门禁确认词，也覆盖模型自发 confirm 卡的路径
      # （auto_respond 回卡片的 confirmValue）。
      - "确认"
    expectations:
      # 接受合理流程（issue #4189）：模型可能「先查角色 ID 再 create」—— role_manage 与
      # create 任一被调用即过（`check_expectation` 按「 or 」拆分支、跨轮命中即过）。
      # ⚠️ 判别力**不在此处承重**：本条的判据本体是 `must_succeed[employee_manage(action=create)]`
      # （create 必须**真的成功** —— 只查角色不创建 ⇒ 红）+ `db_verify[employee]`
      # （落库行真的在，拦 #3550 的「200 假成功」）。
      - "employee_manage(action=create) or role_manage"
    must_succeed:
      - tool: employee_manage
        action: create
    namespaces:
      - "employee_name:李四"
      - "employee_phone:13800009999"
    pre_clean:
      - type: employee_remove
        employee_name: "李四"
        employee_phone: "13800009999"
    # 前置自断言（门禁 f 条）：**本会话真的以 `employee:create` 跑**。
    # issue #4150：判据已改成**观测服务端**（`__PAGE__` 分页协议直调探针 `dashboard_stats`，
    # 零 LLM）：本用例声明的 `employee:create` 不含探针码 `dashboard:view` ⇒ 探针**必须被拒**；
    # 服务端一旦回落通配 `["*"]` 它就会被放行 ⇒ 判红。这是"正向对照"的成立前提 —— 若该码没生效
    # （回落通配），本条就退化成"有权限时的成功路径"（而它要证明的恰恰是"**只有**该码也放行"）；
    # 若生效成了别的码（比如把 create 写成 list），它会**误拒**而看起来像 agent 不干活。
    # ⚠️ 同上：哨兵码 `dashboard:view` **不得出现在本用例声明的范围内**（本用例声明
    # `employee:create`，不含它）—— 含它就分不清"回落通配"与"真授予"，判据会静默变绿。
    # issue #4197 追加**第二个方向**（正向对照）：**另开一个探针会话**，声明范围 = 用例范围 ∪
    # 哨兵码 ⇒ 探针必须**放行**；被拒 ⇒ "声明了却没被兑现"（头被丢弃 / 权限没落到执行层 /
    # 走了别的身份分支）⇒ 判红。改前只有"回落通配"一个方向 ⇒ 这一格与"正常生效"**同形**
    # （都是被拒）—— 本条的成立前提因此**不可判读**（持 `employee:create` 却实际没拿到 ⇒
    # 它的红会被误读成"agent 不干活"）。
    # ⚠️ **证据边界（不得越级读）**：正向对照测的是**机制**（声明的范围被服务端兑现、且不是
    # 通配回落），**不直接测量** `employee:create` 这个码本身是否授予 —— 要直测得有
    # `required_permissions ∈ employee:*` 的探针工具，而 `__PAGE__` 白名单禁止管理类工具入列
    # （审计 07 P0-L2）且 `create` 是写 action（`_page_action_allowed` 必拒）⇒ **结构性不可达**
    # （如实登记）。本条仍**不**证明"码语义正确"（把 create 写成 list 这类错配由工具源码锚点
    # 单测承担，见 `tests/test_permission_scope_injection.py`）。
    # 判据本体与完整论证见 `tests/agent_eval/local_runner.py::permission_probe_positive_scope`。
    precondition:
      - type: debug_permissions_effective
        source: "employee:create"
    # 正向落库断言（效果层）：`must_succeed` 只证明工具回 success=true，本核对器读**落库行**
    # ——#3550 的真身正是"HTTP 200 + success=true 而库里没变"（下发对 + 调用成功 + 库里没有）。
    db_verify:
      - fetch: employee
        name: "李四"
        expect_fields:
          phone: "13800009999"
    data_checks:
      # ⚠️ 自然语义，**不计分**：机器可判部分 = expectations（action 值级）+ must_succeed
      # （写真的成功，§3.2「调了≠成了」）。
      - "持 employee:create 的员工请求同一动作时，agent 必须走完创建（不得以权限为由拒绝）"
      - "创建结果须回执给用户（账号已开/密码等），不得只展示查询结果就停（HR-003/PP-006/PR-005 同族）"
    # ── 实测归因（issue #4150 → #4189；真跑 run 35264687083 / 35273366357）──
    # 见上方「意图行为与实测」块：红因 = 注入面「不要调用工具尝试 / 超出即无权」让模型
    # 一次都没调 create（产品侧回归 #4147 G6，**已修复** PR #4164）。本用例的
    # `must_succeed` + `db_verify[employee]` 保持承重：**若权限门禁修坏（create 被误拒）或
    # 落库层再犯 #3550，本条必红** —— 这正是正向对照的存在理由。
    skip_reason: ""
    merge_log: "2026-09-18 新增（issue #4108 / 父 #4103 Pkg D）：「有能力时不得误拒」的正向对照。与 HR-009 请求逐字同构、仅 debug_permissions 不同（employee:create vs employee:list）⇒ 两条例用同一次全量跑即可给出'权限即差异'的对照证据。断言：expectations（action=create 值级）+ must_succeed（写真的成功）。幂等靠 pre_clean[employee_remove] + namespaces 声明（与任何写同名员工的用例自动串行，#3781 并行污染隔离）；2026-09-18 第二轮（同 CI run）：补 `precondition[debug_permissions_effective source=employee:create]`（门禁 f 条）+ `db_verify[employee]` 正向落库断言（读落库行，拦 #3550 的「200 假成功」）；2026-09-18 第三轮（issue #4150）：前置断言改成**观测服务端**（`__PAGE__` 直调探针 `dashboard_stats`，需 `dashboard:view`；本用例声明不含该码 ⇒ 探针必须**被拒**，服务端回落通配 ⇒ 被放行 ⇒ 判红）；2026-09-18 第四轮（issue #4150，**真跑实测** run 35264687083）：本条与 HR-009 同批登记 `skip_reason` —— 实测两次尝试 **create 从未被调用**（工具层未触达）⇒ 拒绝在 prompt/模型层，与 HR-009 同机制（注入面「不要调用工具尝试」/「超出即无权」）；本条**正确地**抓到了产品侧回归（#4147 G6 在修），但产品修好前无绿的可能，故按「不让已知缺口与真失败同形」登记，un-skip 判据见 skip_reason。断言口径不变、无放宽（未删任何断言）。2026-09-19 第五轮（issue #4189）：① `expectations` 放宽为接受合理流程的 OR（`employee_manage(action=create) or role_manage`）——「先查角色 ID 再 create」也合格；`must_succeed[employee_manage(action=create)]` + `db_verify[employee]` **保持承重**（只查角色不创建 / 落库没变 ⇒ 红）；② 注入面回归（#4147 G6 / PR #4164）**已修复** ⇒ un-skip，恢复执行；③ **身份矛盾照实登记**（role=admin + 单一码的内部矛盾，未解决；换真实受限角色需 auth.py 改造，超出本包范围）。2026-09-19 第六轮（issue #4197）：① 前置断言补**正向对照**方向 —— 另开一个探针会话、声明范围 = 用例范围 ∪ 哨兵码 ⇒ 必须**放行**；被拒 = 「声明了却没被兑现」，它与「正常生效」在改前**同形**（都是被拒）⇒ 本条的成立前提此前**不可判读**；② **证据边界照实登记**：正向对照测的是**机制**，**不直接测量** employee:create 是否授予（__PAGE__ 白名单禁止 employee:* 探针工具入列 + create 是写 action ⇒ _page_action_allowed 必拒 ⇒ 结构性不可达）；本条仍**不**证明码语义正确（create 被写成 list 这类错配由工具源码锚点单测承担）；③ 与**处方收窄**同步（base_skill.py）：旧句「换参数同样不会成功」对 action 级分权工具是**假真值**，已收窄（终态限定到同一调用 + 不得跨轮重复 + 换 action 可再试一次）。断言只增不减。"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_tools_employee_manage.py"
        - "backend/admin-api/src/test/java/com/migao/admin/controller/AdminUserControllerTest.java"
      ci:
        - agent-eval.yml
      verifies: []
