# cases/agents.yml — AI 客服双 Agent 核心类用例（agents-customer_service_agent 覆盖率分组，issue #2429）
# 来源：issue #2429 coverage-gap 反推，6 条（customer_service_agent.py 的 12 条 L2 真值）。
# 均为单元测试契约（dataclass / 纯函数 / 依赖注入 mock 的 async 方法），不进入 agent-eval 冒烟（skip_reason 显式标注）。

schema: "case-contract/1.0"
domain: agents

cases:
  - id: AG-001
    legacy_id: ""
    title: "AgentResponse/AgentContext 数据结构 + _extract_msg_content think 剥离"
    domains:
      - agents
      - chat
    tier: normal
    tags:
      - agents
      - data_contract
      - message_extraction
    truths_ref:
      - ai-chat.agent-response
      - ai-chat.extract-msg-content
      - ai-chat.agent-context
    user_inputs:
      - "ai-agent-service 构造 AgentResponse / AgentContext 并从 AIMessage 提取文本"
    expectations:
      - tool: direct_reply
    data_checks:
      - "AgentResponse 默认 type=text、tool_calls=None、metadata=None；type 枚举 text/tool_call/tool_result/suggestions/error"
      - "_extract_msg_content 移除 <think>...</think>（含多行），content 为 list 时仅拼接 type==text 的 text 块"
      - "AgentContext.to_dict 返回 6 字段；to_tool_context 透传 tenant_id/user_id/session_id/role"
    skip_reason: "dataclass/纯函数由 pytest 单测验证（tests/test_customer_service_agent.py），非 LLM 行为，不进入 agent-eval 冒烟"
    merge_log: "2026-08-25 新增：ai-agent-service agents-customer_service_agent 覆盖率补全（issue #2429）"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_customer_service_agent.py"
      ci:
        - ai-agent-tests.yml
      verifies: []

  - id: AG-002
    legacy_id: ""
    title: "BaseAgent 组装与对话历史转换（__init__ 双分支 + 多模态 history）"
    domains:
      - agents
      - chat
    tier: normal
    tags:
      - agents
      - history
      - multimodal
    truths_ref:
      - ai-chat.base-agent-init
      - ai-chat.convert-history
    user_inputs:
      - "ai-agent-service 初始化 BaseAgent 并转换多模态对话历史"
    expectations:
      - tool: direct_reply
    data_checks:
      - "__init__ 调 get_agent_config+build_agent_graph；tool_registry=None→create_default_registry()，非 None→用传入实例"
      - "_convert_history user 普通→HumanMessage；mixed+images→多模态 content list；assistant→AIMessage；其他 role 忽略"
    skip_reason: "组装/纯函数由 pytest 单测验证（tests/test_customer_service_agent.py），非 LLM 行为，不进入 agent-eval 冒烟"
    merge_log: "2026-08-25 新增：ai-agent-service agents-customer_service_agent 覆盖率补全（issue #2429）"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_customer_service_agent.py"
      ci:
        - ai-agent-tests.yml
      verifies: []

  - id: AG-003
    legacy_id: ""
    title: "_build_initial_state plan 优先 + 18 键 state 透传"
    domains:
      - agents
      - chat
    tier: normal
    tags:
      - agents
      - state
      - plan_routing
    truths_ref:
      - ai-chat.initial-state-plan
      - ai-chat.initial-state-18keys
    user_inputs:
      - "ai-agent-service 构建 LangGraph 初始 state（含 plan state 恢复）"
    expectations:
      - tool: direct_reply
    data_checks:
      - "plan state 存在 skill_name 非空→pending_interact_skill=skill_name；否则读 get_pending_skill"
      - "SessionMemory 异常→warning 且 pending_interact_skill=''，不向上抛"
      - "返回完整 18 键 state dict（messages/agent_type/tenant_id/user_id/user_name/session_id/role/.../pending_interact_skill）"
    skip_reason: "异步状态构造由 pytest 单测验证（tests/test_customer_service_agent.py），非 LLM 行为，不进入 agent-eval 冒烟"
    merge_log: "2026-08-25 新增：ai-agent-service agents-customer_service_agent 覆盖率补全（issue #2429）"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_customer_service_agent.py"
      ci:
        - ai-agent-tests.yml
      verifies: []

  - id: AG-004
    legacy_id: ""
    title: "achat 非流式对话 - final_answer 返回 + 异常友好兜底"
    domains:
      - agents
      - chat
    tier: normal
    tags:
      - agents
      - chat
      - error_fallback
    truths_ref:
      - ai-chat.achat
    user_inputs:
      - "ai-agent-service 非流式对话（graph.ainvoke 返回 final_answer / 抛异常）"
    expectations:
      - tool: direct_reply
    data_checks:
      - "graph.ainvoke 返回 final_answer→AgentResponse(type=text, content=final_answer)"
      - "抛异常→AgentResponse(type=error, content 含'稍后重试')"
    skip_reason: "异步对话由 pytest 单测验证（tests/test_customer_service_agent.py），非 LLM 行为，不进入 agent-eval 冒烟"
    merge_log: "2026-08-25 新增：ai-agent-service agents-customer_service_agent 覆盖率补全（issue #2429）"
    traces:
