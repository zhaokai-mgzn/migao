      verifies: []

  - id: AG-006
    legacy_id: ""
    title: "get_greeting/get_agent 单例/reset_agent/兼容别名"
    domains:
      - agents
      - chat
    tier: normal
    tags:
      - agents
      - factory
      - alias
    truths_ref:
      - ai-chat.agent-factory
    user_inputs:
      - "ai-agent-service 获取欢迎语 / 单例 Agent / 重置 / 兼容别名"
    expectations:
      - tool: direct_reply
    data_checks:
      - "get_greeting 优先 get_direct_reply('greeting') 回退 config.greeting"
      - "get_agent 同 agent_type 二次调用返回同一实例，不同 agent_type 返回不同实例；reset_agent 后重建并调 reset_agent_intents_cache"
      - "CustomerServiceAgent→xiaobu / WorkAssistantAgent→mibao 别名映射"
    skip_reason: "工厂/单例/别名由 pytest 单测验证（tests/test_customer_service_agent.py），非 LLM 行为，不进入 agent-eval 冒烟"
