# cases/agents.yml — AI 客服双 Agent 核心类用例（agents-customer_service_agent 覆盖率分组，issue #2429）
# 来源：issue #2429 coverage-gap 反推，6 条（customer_service_agent.py 的 12 条 L2 真值）。
# 2026-10-02（issue #5951）：补 AG-007 —— `test_bugfix_multimodal_directreply.py` 被本单改动
#   （去掉一个已退役的 `suggestions` 桩键）⇒ Growth Gate 要求「修改的测试须声明 case_ids」；
#   该文件此前**没有任何** case_ids、也没有任何用例把它当 traces ⇒ 补一条**如实描述其断言行为**的用例。
# 均为单元测试契约（dataclass / 纯函数 / 依赖注入 mock 的 async 方法），不进入 agent-eval 冒烟（skip_reason 显式标注）。

schema: "case-contract/1.0"
domain: agents

cases:
  - id: AG-001
    legacy_id: ""
    title: "AgentResponse/AgentContext 数据结构 + _extract_msg_content think 剥离"
    domains:
      - agents
      - chat
    tier: normal
    tags:
      - agents
      - data_contract
      - message_extraction
    truths_ref:
      - ai-chat.agent-response
      - ai-chat.extract-msg-content
      - ai-chat.agent-context
    user_inputs:
      - "ai-agent-service 构造 AgentResponse / AgentContext 并从 AIMessage 提取文本"
    expectations:
      - tool: direct_reply
    data_checks:
      - "AgentResponse 默认 type=text、tool_calls=None、metadata=None；type 枚举 text/tool_call/tool_result/error"
      - "_extract_msg_content 移除 <think>...</think>（含多行），content 为 list 时仅拼接 type==text 的 text 块"
      - "AgentContext.to_dict 返回 6 字段；to_tool_context 透传 tenant_id/user_id/session_id/role"
    skip_reason: "[backend-contract] dataclass/纯函数由 pytest 单测验证（tests/test_customer_service_agent.py），非 LLM 行为，不进入 agent-eval 冒烟"
    merge_log: "2026-08-25 新增：ai-agent-service agents-customer_service_agent 覆盖率补全（issue #2429）"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_customer_service_agent.py"
      ci:
        - ai-agent-tests.yml
      verifies: []

