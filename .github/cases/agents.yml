      verifies: []

  - id: AG-005
    legacy_id: ""
    title: "astream_chat 流式事件序列 - tool_call/tool_result/text/suggestions/error"
    domains:
      - agents
      - chat
    tier: normal
    tags:
      - agents
      - streaming
      - tool_result
    truths_ref:
      - ai-chat.astream-tool-calls
      - ai-chat.astream-tool-result
      - ai-chat.astream-text-suggestion
    user_inputs:
      - "ai-agent-service 流式对话（graph.astream 节点级更新）"
    expectations:
      - tool: direct_reply
    data_checks:
      - "AIMessage.tool_calls 先 yield tool_calls 前文本，再逐条 yield type=tool_call"
      - "ToolMessage 经 json.loads 解析（失败降级 {data: str(content)}），图执行完统一 yield type=tool_result"
      - "final_answer 有新内容→yield type=text；suggestions 非空→yield type=suggestions；异常→yield type=error（含异常类名）"
    skip_reason: "异步流式对话由 pytest 单测验证（tests/test_customer_service_agent.py），非 LLM 行为，不进入 agent-eval 冒烟"
