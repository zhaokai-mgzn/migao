  - id: AU-006
    legacy_id: ""
    title: "首登强制改密：未改密访问业务 API → 403；改密后放行"
    domains:
      - auth
      - defense
    tier: normal
    tags:
      - auth
      - must_change_password
      - defense
    truths_ref:
      - auth.must-change-password
    user_inputs:
      - "管理员给员工设了初始密码 → 员工用初始密码首登 → 除改密/登出/读自己信息外一律 403（PASSWORD_CHANGE_REQUIRED）→ 改密成功后正常使用"
    expectations:
      - tool: direct_reply
    data_checks:
      - "签发侧按**数据库当前值**算 claim，且**登录与刷新两条路径都算**：未改密时刷新一次拿到的新 access token **仍带** pwd_change_required（只在登录时算 ⇒ 本判据必红）。红证：backend/admin-api/src/test/java/com/migao/admin/service/ForcePasswordChangeServiceTest.java + backend/admin-api/src/test/java/com/migao/admin/security/PasswordChangeEnforcementTest.java（真实 RSA 签发 + 真实过滤链串联）。"
      - "拦截侧**默认拒绝**：带该 claim 的会话访问 /api/admin/** 一律 403 + 错误码 PASSWORD_CHANGE_REQUIRED，且请求**到不了业务链**；白名单只有 POST /api/auth/password/change、POST /api/auth/logout、GET /api/auth/me、POST /api/auth/refresh。"
      - "改密即换发：POST /api/auth/password/change（需认证、校验旧密码、策略 ≥8 位且含字母与数字否则 422）成功后清 must_change_password，并**直接**在响应里给一份不带标记的新 access token ⇒ 用「改密响应里的那个 token」访问同一业务 API **放行**（200）。红证：PasswordChangeEnforcementTest 第 ④⑤ 步；若改回「只清标记不发新 token」⇒ 该步必然拿不到可放行的 token 而红。"
      - "旧 token 仍被拦（拦截侧只看 claim、不看库）：客户端必须用改密响应里的新 token —— 这一性质被显式钉住（第 ⑥ 步），以免「改密后旧 token 自动放行」被当成实现细节悄悄改变。"
      - "平台超管调本端点 ⇒ 明确业务错误（不是 NPE/404）：platform_admins 没有 users 行。"
    skip_reason: "[backend-contract] 纯后端单测契约（签发侧 + 过滤链全链路），非 LLM 行为，不进入 agent-eval 冒烟"
    merge_log: "2026-09-25 新增（issue #5485）：首登强制改密（不变式 I4）—— 含最容易漏的「刷新后仍 403」与「改密即换发」两条"
    traces:
      tests:
        - "backend/admin-api/src/test/java/com/migao/admin/security/PasswordChangeEnforcementTest.java"
        - "backend/admin-api/src/test/java/com/migao/admin/service/ForcePasswordChangeServiceTest.java"
      ci:
        - pr-check.yml
      verifies: []

  - id: AU-007
    legacy_id: ""
    title: "管理员设 用户名+初始密码 → 员工可登录；租户内重名 → 拒绝"
    domains:
      - auth
      - hr
    tier: normal
    tags:
      - auth
      - employee_manage
      - username
    truths_ref:
      - auth.username-uniqueness
      - auth.employee-login
    user_inputs:
      - "管理员在员工管理里给员工设「用户名 + 初始密码」→ 员工可用该凭据登录；同一企业内用户名重复 → 明确拒绝并提示换一个"
    expectations:
      - tool: direct_reply
    data_checks:
      - "写面规整与校验：POST /api/admin/users / PUT /api/admin/users/{id} 的 username 统一转小写、按 ^[a-z0-9][a-z0-9._-]{2,31}$ 校验（违规 422 + 明确文案，不写库）。红证：backend/admin-api/src/test/java/com/migao/admin/service/AdminUserUsernameTest.java。"
      - "租户内重复 ⇒ 422（不是数据库异常裸抛 500）且提示「请换一个」；并发下由唯一索引兜底（DuplicateKeyException 转 422）。红证：同上两条用例（应用层查重命中 / insert 抛 DuplicateKeyException）。"
      - "创建带初始密码、PUT 带 password、PUT /{id}/reset-password ⇒ must_change_password=true（**仅当确实设了密码**：没密码的账号被标强制改密会永久锁死 —— 改密要校验旧密码而旧密码是 null）。"
      - "响应字段别漏：员工详情/列表里新列以 `employeeUsername` 下发（`username` 这个键历史上等于手机号，**不动它**以免打碎存量消费者），并附 `mustChangePassword`。"
    skip_reason: "[backend-contract] 纯后端单测契约（UserService 的员工用户名写面），非 LLM 行为，不进入 agent-eval 冒烟"
    merge_log: "2026-09-25 新增（issue #5485）：员工账号的「用户名 + 初始密码」由管理员设置"
    traces:
      tests:
        - "backend/admin-api/src/test/java/com/migao/admin/service/AdminUserUsernameTest.java"
      ci:
        - pr-check.yml
      verifies: []

  - id: AU-008
    legacy_id: ""
    title: "不同租户可用相同用户名"
    domains:
      - auth
      - defense
    tier: normal
    tags:
      - auth
      - tenant_isolation
      - username
    truths_ref:
      - auth.tenant-local-identity
      - auth.username-uniqueness
    user_inputs:
      - "A 企业已有员工 zhangsan；在 B 企业再建一个用户名 zhangsan 的员工 → 允许（两家互不影响）"
    expectations:
      - tool: direct_reply
    data_checks:
      - "应用层查重**必须带 tenant_id**：把租户条件删掉就退化成「全球唯一」，本用例必红（判据捕获 wrapper 的 SQL 片段并断言含 username 与 tenant_id）。证据：backend/admin-api/src/test/java/com/migao/admin/service/AdminUserUsernameTest.java"
      - "数据库侧唯一索引只到租户内：`uk_users_tenant_username ON users (tenant_id, username) WHERE username IS NOT NULL AND deleted = 0` —— 改成 `ON users (username)`（全球唯一）或丢掉部分索引谓词（存量 NULL 行互相冲突 / 软删行占位）⇒ 必红。判据：tests/unit_ci_workflows/test_tenant_scoped_user_queries.py 同时校验**迁移 V128 与建库脚本**两份真相。"
      - "改自己的用户名时查重**排除自己**（否则管理员改不动任何已有用户名的员工）；不传 username（null）表示不修改，不误清空。"
    skip_reason: "[backend-contract] 纯后端单测契约 + 静态数据面守卫，非 LLM 行为，不进入 agent-eval 冒烟"
    merge_log: "2026-09-25 新增（issue #5485）：用户名唯一性只到租户内（不变式 I3）"
    traces:
      tests:
        - "backend/admin-api/src/test/java/com/migao/admin/service/AdminUserUsernameTest.java"
        - "tests/unit_ci_workflows/test_tenant_scoped_user_queries.py"
      ci:
        - pr-check.yml
      verifies: []

  - id: AU-009
    legacy_id: ""
    title: "企业编码设置：格式 / 唯一性 / 保留字校验"
    domains:
      - auth
      - settings
    tier: normal
    tags:
      - auth
      - tenant_code
      - settings
    truths_ref:
      - auth.tenant-code-rule
    user_inputs:
      - "管理员在「企业基础信息」里设置企业编码：格式不合规 / 已被别的企业占用 / 是保留字 → 明确拒绝并说明原因"
    expectations:
      - tool: direct_reply
    data_checks:
      - "三类拒绝都是 422 + 明确文案：格式（含大写/空格/@/超长/单字符）、保留字（admin/api/www/app/platform/support/system/root/login/auth）、已被占用（大小写不敏感、排除自己）。红证：backend/admin-api/src/test/java/com/migao/admin/controller/TenantCodeSettingsTest.java，任一类放宽成「静默接受」即红。"
      - "设置入口**复用**既有 PUT /api/admin/settings 的 code 字段（GET /api/admin/settings 本就下发 code；权限码沿用 system:manage）—— 不新造端点、不新造权限码；响应里带出新编码。"
      - "存量兼容不变式 ①：编码**未变更即跳过校验**（管理员打开企业基础信息**原样保存**不能被自己的新校验拒掉，否则那页的 name/logo/通知开关一起废掉）；② 字符集**含下划线**（dev 库现存 tenant_7478359537 / tenant_5321056468 两个租户，只允许连字符会让它们的员工永远登不进来且管理员无自救路径）。"
      - "新租户默认编码符合该格式且可读：`<企业名 slug>-<4 位随机>`（纯中文企业名退化为 `shop`），淘汰 `tenant_%06d%04d`（含下划线、不可读）；唯一性靠查重 + 重试，最终兜底是数据库 UNIQUE(tenants.code)（并发撞车 ⇒ 注册失败而非静默撞号）。"
    skip_reason: "[backend-contract] 纯后端单测契约（SettingsController 的企业编码校验），非 LLM 行为，不进入 agent-eval 冒烟"
    merge_log: "2026-09-25 新增（issue #5485）：企业编码由管理员设置（格式 / 全局唯一 / 保留字），并兼容存量下划线形态"
    traces:
      tests:
        - "backend/admin-api/src/test/java/com/migao/admin/controller/TenantCodeSettingsTest.java"
      ci:
        - pr-check.yml
      verifies: []

  - id: AU-010
    legacy_id: ""
    title: "存量员工（无用户名）无法用员工登录"
    domains:
      - auth
    tier: normal
    tags:
      - auth
      - legacy
      - no_migration
