      - "企业管理员照旧：role=admin 命中 ⇒ 签发（identityType='sms'），并携带 mustChangePassword 字段（默认 false）。"
      - "真值订正留档：模板 auth-sms.login-order 原文「不限 admin 角色」已被本单推翻（本次改判逐字写在模板里）。"
    skip_reason: "[backend-contract] 纯后端单测契约（AuthService.loginBySms 的管理员路径），非 LLM 行为，不进入 agent-eval 冒烟"
