# cases/auth.yml — 登录 / 认证域用例（issue #5485 登录重构：员工「用户名@企业编码 + 密码」）
# 来源：issue #5485 的 10 条业务真值（AU-001~AU-010）。均为 admin-api 后端单测契约
# （跳过 agent-eval 的决定与理由见每条 skip_reason；机器判红通道 = traces.tests）。
# 三个前端包（admin-web / bmini-app）消费同一批真值，但它们的页面行为用例由各自包补。

schema: "case-contract/1.0"
domain: auth

cases:
  - id: AU-001
    legacy_id: ""
    title: "员工登录 用户名@企业编码 + 密码 → 成功签发 JWT"
    domains:
      - auth
    tier: smoke
    tags:
      - auth
      - login
      - employee
    truths_ref:
      - auth.employee-login
      - auth.tenant-local-identity
    user_inputs:
      - "员工在登录页填 用户名@企业编码（如 zhangsan@acme）+ 密码 → POST /api/auth/employee/login → 成功，进入该企业"
    expectations:
      - tool: direct_reply
    data_checks:
      - "端点形状：body = {identifier, password}；成功 200 + success=true + data.accessToken 非空 + data.user.identityType='employee' + data.user.tenantId = 企业编码解析出的租户（refresh token 只经 HttpOnly cookie，不进响应体）。红证：backend/admin-api/src/test/java/com/migao/admin/controller/EmployeeLoginControllerTest.java 断言响应字段与 cookie 口径，删掉 mustChangePassword 字段即红。"
      - "租户上下文：登录成功后 TenantContext = 解析出的 tenant_id（后续 roles/permissions/租户名查询都按它走）。红证：EmployeeLoginServiceTest 断言 TenantContext.getTenantId()==1L 且 userMapper.selectActiveByTenantAndUsername(1L,'zhangsan') 被以该租户调用。"
      - "标识切分按**最后一个** @：`a@b@acme` 的 username 段是 `a@b`（会被用户名格式校验拒绝，但切分本身不歧义）；两侧任一为空 ⇒ 401（不是 500、不是放行）。"
      - "存量带下划线的企业编码（tenant_7478359537 形态）**必须能登录** —— 编码字符集含 `_`；改成只允许连字符 ⇒ 该用例必红。证据：backend/admin-api/src/test/java/com/migao/admin/service/EmployeeLoginServiceTest.java"
    skip_reason: "[backend-contract] 纯后端单测契约（AuthService.loginByEmployee / AuthController 端点），非 LLM 行为，不进入 agent-eval 冒烟"
    merge_log: "2026-09-25 新增（issue #5485）：登录重构为「管理员手机号+短信 / 员工用户名@企业编码+密码」"
    traces:
      tests:
        - "backend/admin-api/src/test/java/com/migao/admin/service/EmployeeLoginServiceTest.java"
        - "backend/admin-api/src/test/java/com/migao/admin/controller/EmployeeLoginControllerTest.java"
      ci:
        - pr-check.yml
      verifies: []

  - id: AU-002
    legacy_id: ""
    title: "跨租户隔离：同名员工分属 A/B，凭据只解析到自己企业"
    domains:
      - auth
      - defense
    tier: normal
    tags:
      - auth
      - tenant_isolation
      - defense
    truths_ref:
      - auth.tenant-local-identity
      - auth.employee-login
    user_inputs:
      - "企业 A 与企业 B 都有员工 zhangsan：用 zhangsan@A的企业编码 登录 → 只进 A；用 zhangsan@B的企业编码 登录 → 只进 B"
    expectations:
      - tool: direct_reply
    data_checks:
      - "查询**本身**带租户条件（不变式 I1）：`UserMapper.selectActiveByTenantAndUsername` 的 SQL 逐字含 `tenant_id = #{tenantId}` 与 `username = #{username}`。红证：backend/admin-api/src/test/java/com/migao/admin/service/EmployeeLoginServiceTest.java 反射读 @Select 的 SQL 文本，删掉租户谓词即红。"
      - "绝不跨租户兜底：解析到 A 时**一次都不**用 B 的 tenantId 查用户（`verify(never())`）。红证：同上，把 tenant_id 换成「先按 username 全局查、再取第一条」即红。"
      - "类级元守卫（让同类进不来）：任意 `@InterceptorIgnore(tenantLine=\"true\")` 且查 `users`、SQL 里却没有 `tenant_id` 谓词的方法**必须登记豁免台账**，否则判红；台账条数只许缩短。判据：tests/unit_ci_workflows/test_tenant_scoped_user_queries.py（含注入式自证：临时加一个无租户谓词的同形方法 ⇒ 必红）。"
    skip_reason: "[backend-contract] 纯后端单测契约 + 静态类级守卫，非 LLM 行为，不进入 agent-eval 冒烟"
    merge_log: "2026-09-25 新增（issue #5485）：跨租户同名不得串号（不变式 I1/I3）"
    traces:
      tests:
        - "backend/admin-api/src/test/java/com/migao/admin/service/EmployeeLoginServiceTest.java"
        - "tests/unit_ci_workflows/test_tenant_scoped_user_queries.py"
      ci:
        - pr-check.yml
      verifies: []

  - id: AU-003
    legacy_id: ""
    title: "反枚举：企业编码不存在 / 用户不存在 / 密码错 → 统一 401 文案"
    domains:
      - auth
      - defense
    tier: normal
    tags:
      - auth
      - anti_enumeration
      - defense
    truths_ref:
      - auth.employee-login
    user_inputs:
      - "分别用「不存在的企业编码」「该企业下不存在的用户名」「错误密码」「已禁用账号」「格式非法的标识」尝试员工登录"
    expectations:
      - tool: direct_reply
    data_checks:
      - "五种失败走**同一出口**：HTTP 401 + 错误码 AUTH_FAILED + message 逐字相同（`账号或密码错误`；该错误码由后端契约测试断言，本用例属 [backend-contract] 不进 agent-eval 计分），不泄露是哪一项错。红证：backend/admin-api/src/test/java/com/migao/admin/service/EmployeeLoginServiceTest.java 把五种病因聚合成一个断言（`containsOnly`），任一分支换成别的文案/状态码即红；端点层同判据见 backend/admin-api/src/test/java/com/migao/admin/controller/EmployeeLoginControllerTest.java。"
      - "失败不许产生副作用：不下发 access/refresh cookie、不建用户、不改任何行。"
      - "文案的**唯一来源**是 LoginIdentifiers.AUTH_FAILED_MESSAGE（三处各写一份字符串 ⇒ 口径必然漂移，属禁止形态）。"
    skip_reason: "[backend-contract] 纯后端单测契约（AuthService.loginByEmployee 的反枚举出口），非 LLM 行为，不进入 agent-eval 冒烟"
    merge_log: "2026-09-25 新增（issue #5485）：员工登录失败不区分「哪个字段错」"
    traces:
      tests:
        - "backend/admin-api/src/test/java/com/migao/admin/service/EmployeeLoginServiceTest.java"
        - "backend/admin-api/src/test/java/com/migao/admin/controller/EmployeeLoginControllerTest.java"
      ci:
        - pr-check.yml
      verifies: []

  - id: AU-004
    legacy_id: ""
    title: "短信登录角色门禁：非 admin 员工走短信 → 拒绝"
    domains:
      - auth
      - defense
    tier: normal
    tags:
      - auth
      - sms
      - role_gate
    truths_ref:
      - auth.sms-admin-only
    user_inputs:
      - "普通员工（role=operator / employee）与 C 端顾客（role=customer）用「手机号 + 短信验证码」登录 → 被拒绝，并提示改用账号密码登录"
    expectations:
      - tool: direct_reply
    data_checks:
      - "门禁在**签发之前**：非管理员命中 ⇒ 401 + 文案含「非管理员」「员工登录入口」；一个 token 都不许签发（verify(never()) generateAccessToken/generateRefreshToken）。红证：backend/admin-api/src/test/java/com/migao/admin/service/SmsLoginRoleGateTest.java，把门禁删掉或放宽成「有账号即可」⇒ 三条拒绝用例当场变绿/不抛，测试即红。"
      - "评测种子同形数据同样被拒：role=employee（debug_employee_wangwu 形态）与 role=customer（debug_customer_1 形态，手机号 13800138000）都不得通过短信登录。"
      - "多租户歧义口径**不回退**（审计 07 P1-2）：同手机号命中多个租户且未指定租户 ⇒ 拒绝，禁止静默 LIMIT 1 落错租户。"
    skip_reason: "[backend-contract] 纯后端单测契约（AuthService.loginBySms 的角色门禁），非 LLM 行为，不进入 agent-eval 冒烟"
    merge_log: "2026-09-25 新增（issue #5485）：短信登录新增角色门禁（不变式 I2）—— 改前普通员工手机号对得上即可短信登录"
    traces:
      tests:
        - "backend/admin-api/src/test/java/com/migao/admin/service/SmsLoginRoleGateTest.java"
      ci:
        - pr-check.yml
      verifies: []

  - id: AU-005
    legacy_id: ""
    title: "管理员短信登录（企业管理员 + 平台超管）仍可用"
    domains:
