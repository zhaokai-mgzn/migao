# cases/aftersales.yml — 售后域用例（并源转换）
# 来源：eval C002/M008 + verification 3.1~3.4 → 5 条
#
# ★ 双通道注意（aftersales-flow.yml 真值已记录）：
#   管理端用例走 Agent 工具 after_sales_manage / aftersale_create；
#   模板 reviewer_asserts 走 admin-api 表单接口。ticketType 枚举跨层不一致
#   （Agent 工具无 return），expectations 必须标注通道。

schema: "case-contract/1.0"
domain: aftersales

cases:
  - id: AS-001
    legacy_id: "3.1"
    title: "售后工单列表"
    domains:
      - aftersales
    tier: smoke
    tags:
      - query
      - smoke
    truths_ref:
      - aftersales-flow.status-enums
      - aftersales-flow.list-filter
    user_inputs:
      - "看看售后工单"
    expectations:
      - tool: after_sales_manage
        args:
          action: list
    data_checks:
      - "工单列表含 ticketNo/状态"
    skip_reason: ""
    merge_log: "verification 3.1 独有"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_tools_after_sales_basic.py"
      ci:
        - agent-eval.yml
      verifies: []

  - id: AS-002
    legacy_id: "3.2"
    title: "售后工单详情"
    domains:
      - aftersales
    tier: normal
    tags:
      - query
      - detail
    truths_ref:
      - aftersales-flow.detail-history
    user_inputs:
      # 2026-09-14 自包含化（issue #3568）：原为 `AS-20260701-0001` —— 评测环境**不存在**
      # 的工单号（与 AS-006 的 skip_reason「依赖生产不存在的固定测试工单」同源，只是本条
      # 没被标 skip）→ 干净库上 agent 如实回「工单不存在」（行为合理）→ 用例恒红。
      # 换成 mibao_eval_seed.sql Phase 3 的 seed 工单（含 created 时间线，「首条
      # status=pending」的断言有据可依）。
      - "看一下 AS-20260914-9001 工单详情"
    expectations:
      - tool: after_sales_manage
        args:
          action: detail
    data_checks:
      - "statusHistory 按时间正序，首条 status=pending"
    skip_reason: ""
    merge_log: "verification 3.2 独有。2026-09-14 自包含化（issue #3568）：AS-20260701-0001 评测环境不存在（同 AS-006 形态）→ 换 seed 工单 AS-20260914-9001"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_tools_after_sales_basic.py"
      ci:
        - agent-eval.yml
      verifies: []

  - id: AS-003
    legacy_id: C002
    title: "查订单 → 创建退款工单（跨域复用 order_id）"
    domains:
      - aftersales
      - order
    tier: normal
    tags:
      - cross_skill
      - context_share
      - create
    truths_ref:
      - aftersales-flow.create-order-required
      - aftersales-flow.dup-guard
      - aftersales-flow.ticket-format
    user_inputs:
      # 2026-09-14 校准（#3511）：原输入硬编码订单号「20260910619250007」——那是**云测试环境
      # 的存量数据**，独立栈（干净库）必然查不到 → B 端首跑假失败（agent 行为合理：
      # 订单不存在）。改为自包含问法：先查最近订单，再对该单挂退货工单。
      # 同款先例见差距分析 OR-006「case 假设固定订单存在，无 seed 机制」。
      # 2026-09-14 再校准（issue #3568，B 端基线实测归因）：原 R2 是「**这个订单**客户要退货」
      # —— **单数相对指代**且用例没有任何澄清应答轮 → agent 合理地回「您说的『这个订单』我
      # 没法确定具体是哪一笔，麻烦确认下订单号」→ R2 起零工具、4 轮 score 67%。
      # 同栈数据残留会放大该缺陷：B 端基线实测 R1「最近的订单」返回 `orders=5 total=5`，
      # 而种子只有 2~3 单 —— 其余是**同栈并行用例（OR-016/CR-001/CH-010）建单的残留**
      # ⇒ 任何用「最近/第一」这种相对指代的用例，语义都会随同栈其它用例漂移。
      # 修法（照 AS-005 的手法，**对残留免疫**）：R1 用客户手机号**显式指代**（order_query.list
      # 的 keyword/receiver 都支持手机号），R2 也带上手机号 —— 即使 agent 重新 order_query
      # 也必然命中同一客户，而不是依赖「列表第一条」。
      - "查一下客户手机号 13800138000 最近的订单"
      - "就刚才那笔订单，客户手机号 13800138000，要退货，创建售后工单"
      - "确认创建"
      - "确认"
    expectations:
      - tool: order_query
      - tool: after_sales_manage or aftersale_create
        args:
          order_id: "复用上轮 UUID"
    data_checks:
      - "success=true"
      - "工单号匹配 ^AS-\\d{8}-\\d{4}$"
    skip_reason: ""
    merge_log: "eval C002 + verification 3.3（同义，取 eval 的跨域版）"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_tools_aftersale_create.py"
      ci:
        - agent-eval.yml
      verifies: []

  - id: AS-004
    legacy_id: "3.4"
    title: "更新工单状态 - 关闭"
    domains:
      - aftersales
    tier: normal
    tags:
      - update
      - status
    truths_ref:
      - aftersales-flow.flow
      - aftersales-flow.update-guard
    user_inputs:
      - "查看最近的售后工单"
      # 2026-09-14 消除顺序依赖（issue #3568）：原为「把**第一张**未处理的工单关闭」——
      # 落点由工单**列表返回顺序**决定：同一份代码在「只有 1 张 pending」（独立栈）与
      # 「多张 pending」（生产/跑过几轮后残留）两种栈上关闭的是**不同工单**，断言
      # `success=true` 仍会绿 → 结论不可比。改为点名 seed 工单号（mibao_eval_seed.sql
      # Phase 3 的 `AS-20260914-9001`，pending/return），`pre_clean` 保证该形态存在。
      - "把工单 AS-20260914-9001 关闭"
      - "确认"
    pre_clean:
      - type: aftersales_ticket_prepare
    expectations:
      - tool: after_sales_manage
        args:
          action: update_status
          status: closed
    data_checks:
      - "success=true"
      - "closedAt/closeReason 写入"
    skip_reason: ""
    merge_log: "verification 3.4 独有。2026-09-14 消除顺序依赖（issue #3568）：「第一张未处理的工单」→ 点名 seed 工单号 AS-20260914-9001（列表顺序依赖：多张 pending 时关闭对象不确定）"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_tools_after_sales_basic.py"
      ci:
        - agent-eval.yml
      verifies: []

  - id: AS-005
    legacy_id: M008
    title: "售后处理全流程 - 查单→确认问题→建工单→跟踪"
    domains:
      - aftersales
      - order
    tier: normal
    tags:
      - multi_turn
      - cross_skill
      - real_scenario
    truths_ref:
      - aftersales-flow.status-enums
      - aftersales-flow.timeline
      - aftersales-flow.create-order-required
    user_inputs:
      - "客户张三说窗帘颜色不对，帮我查下他的订单"
      # 2026-09-14 自包含化（issue #3568）：原第 2 轮把「最近一个订单」与硬编码单号
      # `ORD-20260701-0001` 写在一起——该单号**评测环境根本不存在**（order.yml OR-006/
      # OR-010 的 skip 说明已实测 `found: 0`）→ 独立栈/干净库上该轮必然查不到 → agent
      # 无从建单（行为合理）→ 用例假红（§13.5「依赖云环境存量数据」）。
      # 改为环境无关的**唯一指代**：客户手机号（order_query.list 的 keyword/receiver 都支持
      # 手机号），种子/生产两种栈上都能定位到「张三的最近订单」。同 AS-003（#3511）先例。
      - "最近那个订单，客户手机号 13800138000"
      - "客户要退货，创建售后工单"
      - "原因：颜色与图片不符，退款"
      - "这工单现在什么状态了"
    expectations:
      - tool: order_query
      - tool: after_sales_manage or aftersale_create
      - tool: after_sales_manage or aftersale_query
    data_checks:
      - "aftersale_create 的 order_id 来自第2步查询结果"
      - "售后工单包含正确的退款原因"
    skip_reason: ""
    merge_log: "eval M008 独有（售后全旅程）。2026-09-14 自包含化（issue #3568）：第 2 轮硬编码单号 ORD-20260701-0001（评测环境不存在，OR-006/OR-010 已实测 found:0）→ 换手机号唯一指代，同 AS-003（#3511）先例"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_mibao_advanced_multiturn.py"
      ci:
        - agent-eval.yml
      verifies: []

  - id: AS-006
    legacy_id: ""
    title: "售后工单退款/退货完结 - 按商品「退货回补库存」开关决定是否回补库存"
    domains:
      - aftersales
      - product
    tier: normal
    tags:
      - update
      - status
      - cross_skill
    truths_ref:
      - aftersales-flow.return-restock-switch
    user_inputs:
      - "AS-20260701-0002 退款工单已处理完，完成"
    expectations:
      - tool: after_sales_manage
        args:
          action: update_status
          status: resolved
    data_checks:
      - "refund/return 工单 resolved 时：订单全部商品 allow_return_restock=true 才恢复 SKU 库存；任一商品为 false 则整单不回补（窗帘定制退货不可再售）"
      - "allow_return_restock 默认 false；米宝不得在售后完成后默认引导恢复库存/重新上架"
    skip_reason: "依赖生产不存在的固定测试工单 AS-20260701-0002（评测数据脱节）——回补库存逻辑已由 admin-api 单测覆盖（AfterSalesTicketServiceTest），LLM 行为待重构为自包含（先建工单再完结）"
    merge_log: "issue #2991 新增：售后完结库存联动按商品开关收敛，窗帘行业定制退货不可再售"
    traces:
      tests:
        - "backend/admin-api/src/test/java/com/migao/admin/service/AfterSalesTicketServiceTest.java"
      ci:
        - agent-eval.yml
      verifies: []

  - id: AS-007
    legacy_id: ""
    title: "换货选目标商品后必须确认加工项（before 生成换货工单确认卡）"
    domains:
      - aftersales
      - order
    tier: normal
    tags:
      - exchange
      - processing_item
      - guided_flow
    truths_ref:
      - aftersales-flow.agent-create
      - aftersales-flow.flow
    user_inputs:
      # 2026-09-14 自包含化（issue #3568）：原为**单轮**输入 —— 而换货在业务上必须先有
      # 订单（after_sales_manage.create 要求 order_id）。用户没给订单号时 agent 正确地
      # 先要订单号 → 后续轮次不存在 → 用例恒不可达，被 skip_reason 挂着"待重构"，本条
      # 因此**从未被执行**（存量覆盖缺口）。补齐「先定位订单」轮，用例意图不变。
      # 只碰种子/目录里**真实存在**的对象（tests/agent_eval/fixtures/mibao_eval_seed.sql
      # 的 prod_eval_2699 及其关联加工项），不点名不存在对象（§13.5 种子守卫）。
      - "面料有瑕疵，帮我换货"
      # 订单定位轮给**姓名 + 手机号**（order_query.list 的 keyword/receiver 都支持手机号）：
      # 「最近那个订单」单独用时依赖列表排序，而两个字段一起给 = 唯一指代（同 AS-005 口径）。
      - "就是最近那个订单，客户张三，手机号 13800138000"
      - "换成2699系列雪尼尔窗帘面料"
      # 答卡轮（§13.5）：加工项卡由 LLM 动态生成（choice/multiSelect，选项名预知不了）
      # → repeat_until 按「有卡答卡：confirm 点确认 / choice 回首项 / form 按声明回填 /
      # 无卡发 fallback」作答，直到写工具成功；停条件用**成功**避免重复落库。
      # 先例 OR-021/CH-033/PR-016。
      # max=5：R1 报瑕疵 / R2 定位订单 / R3 点目标商品 / R4 加工项询问 / R5 答加工项卡 /
      #   R6 答 confirm 卡 / R7 建单（停在成功后的余量轮）。
      # 原 max=4（6 轮）会**在 confirm 卡刚发出来时轮数耗尽**——正是 OR-021 实测过的
      # "卡死在最后一步"形态（issue #3430），故留足余量。
      - repeat_until:
          tool_called: after_sales_manage
          max: 5
        fallback: "需要打孔加工"
    pre_clean:
      - type: product_dedupe
        product_keyword: "2699系列雪尼尔窗帘面料"
        price: 23.8
    expectations:
      - tool: order_query
      - tool: product_detail
      - tool: after_sales_manage
        args:
          action: create
          ticket_type: exchange
    order_before:
      # 自包含化的**核心新增断言**：换货方案（选目标商品）必须在 order_query 定位到
      # 订单之后 —— 旧单轮形态正是死在这里（无订单可挂）。
      - "order_query before product_detail"
      - "order_query before after_sales_manage"
      # 加工项询问必须早于写工单（原断言，保留）。
      - "processing_ask before after_sales_manage"
      - "processing_ask before interact[confirm]"
    data_checks:
      # 「调了 ≠ 成了」（issue #3361 口径）：单轮形态没有工具成功断言，写工单失败也会判 100%。
      # 这里用**机器可判的 data_checks**（`success=true` 计入评分，见 local_runner
      # `scoring_checks` 的 success=true / error.code= 规则）而不是 `must_succeed`：
      # 本条是 **B 端专属工具**（after_sales_manage 不在小布工具集），而
      # `tests/unit_ci_workflows/test_xiaobu_case_set.py::test_must_succeed_tools_are_customer_capabilities`
      # 对**全库** must_succeed 声明做「必须在 C 端工具集内」校验（未按 persona 收窄）→
      # 声明 must_succeed[after_sales_manage] 会直接打红该守卫。两者等价强度，
      # 故取不越界的写法（守卫收窄另行治理，不在本包范围）。
      - "success=true"
      - "换货目标商品 product_detail 返回 processing_items 非空时，confirm 卡之前必须主动询问加工项（interact(choice, multiSelect=true)，透传 pageMeta 支持翻页；文本询问亦可，语义由 order_before 保证）"
      - "用户选择加工项后，所选名称与计价写入换货方案汇总与工单 description；用户说『不需要加工项』才跳过"
      - "processing_items 为空时如实告知『该商品无可用加工项』后继续，不强求"
      - "换货工单 order_id 来自本轮 order_query 定位结果（不得编造订单号）"
    skip_reason: ""
    merge_log: "2026-09-08 新增（issue #3033 复盘 sess_50ff3e3c824c4a70）：换货选 2699 面料（绑 5 加工项）全程未提加工项；aftersales.md 补换货加工项确认规则 + EXAMPLES 例 4。2026-09-14 自包含化（issue #3568）：原单轮输入缺「先定位订单」轮 → 用例恒不可达被 skip（**从未执行**）→ 补 order_query 定位轮 + 答卡轮（repeat_until max=5，共 8 轮），断言加两条 order_query 时序 + success=true，解 skip"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_prompt_snapshots.py"
      ci:
        - agent-eval.yml
      verifies: []

  - id: AS-008
    legacy_id: ""
    title: "C 端售后进度查询 - 仅限本人工单 + 拒绝跨用户/快递单号式越权查询"
    domains:
      - aftersales
      - order
      - defense
    tier: normal
    # tier 由 smoke 提为 normal（issue #3367 覆盖审计）：本条是 **C 端该能力的唯一用例** ——
    # `售后进度查询`（物流查询）在 normal 档零覆盖；而 CI 从不跑 C 端 smoke
    # （xiaobu-acceptance 派发的是 normal），smoke 档 = **谁都不跑** → 该能力连同
    # "拒绝快递单号直查"这类越权防护在每日回归里完全无观测。用例本身是单轮查询（便宜），
    # 提档成本极低。
    persona: xiaobu
    tags:
      - query
      - aftersale
      - data_safety
      - xiaobu
    truths_ref:
      - aftersales-flow.status-enums
      - aftersales-flow.flow
    user_inputs:
      - "我上次申请的售后处理得怎么样了"
    expectations:
      - tool: aftersale_query
    forbidden_args:
      - tool: aftersale_query
        fields:
          - user_id
          - customer_id
          - customer_phone
    data_checks:
      - "aftersale_query 无用户/租户参数，后端强制按当前登录顾客过滤（/api/admin/agent/after-sales/mine 同构）——顾客无法通过任何参数读取他人工单"
      - "list 返回当前顾客工单（含 status 标签与 timeline）；无工单时如实告知『暂无售后记录』，不编造工单号/状态"
      - "status 可筛选（pending/processing/resolved/rejected/closed），非法值不静默当成全部"
      - "与 B 端 after_sales_manage 物理隔离：小布无 after_sales_manage 工具，不得出现管理端动作（改状态/退款/回补库存）"
    skip_reason: ""
    merge_log: "2026-09-11 新增（issue #3266 C 端评测覆盖体检）：aftersale_query 是唯一无任何 C 端用例覆盖的真实能力缺口——AS-005 的 `after_sales_manage or aftersale_query` 因 after_sales_manage 属 B 端工具被 C 端用例集排除后，C 端售后查询能力归零；本条补 C 端专属进度查询 + 数据隔离断言"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_tools_aftersale_query.py"
      ci:
        - xiaobu-acceptance.yml
      verifies: []

  - id: AS-009
    legacy_id: ""
    title: "C 端售后进度正向查询 - 工具可达 + 能力不否定（权限类禁词）"
    domains:
      - aftersales
      - chat
    tier: normal
    persona: xiaobu
    tags:
      - query
      - aftersale
    truths_ref:
      - aftersales-flow.status-enums
    user_inputs:
      - "我上次申请的那个换货单现在处理到哪一步了"
    expectations:
      - tool: aftersale_query
    forbidden_text:
      - "没有权限"
      - "无权限"
    data_checks:
      - "正向可达性：aftersale_query 被调用（expectation 机器断言）；回复不得出现『没有权限/无权限』（forbidden_text 机器断言，防 #3477 类能力自我否定在售后域的对应）"
      - "状态 grounded 到本人真实工单，无工单时如实说明（不禁『暂无』——诚实正确行为）"
    skip_reason: ""
    merge_log: "2026-09-14 新增（#3494 覆盖审计）：AS-008 的正向展示断言为自然语义 data_checks（不计分）；本条补专属正向旅程——工具可达 + 权限否定禁词双防线，机器可执行；不依赖工单数据状态（诚实『暂无』回复不误伤）"
    traces:
      ci:
        - xiaobu-acceptance.yml
      verifies: []
