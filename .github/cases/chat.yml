  - id: CH-036
    legacy_id: ""
    title: "窗帘算料引擎确定性逻辑 - 折数法/工艺档位/红线/按货号汇总（单测覆盖，非 LLM 行为）"
    domains:
      - chat
      - customer
    tier: normal
    persona: xiaobu
    tags:
      - xiaobu
      - quote
      - curtain-calc
    truths_ref:
      - ai-chat.intent-tool-map
    # ── 覆盖说明（issue #3982，M2-C）──
    # 算料是确定性引擎（curtain_calc），不依赖 LLM 行为，由单测全量覆盖；
    # 本用例登记「算料能力」在 C 端能力面的覆盖（换算唯一性/红线/档位/汇总），
    # 按既有惯例 skip（引擎确定性逻辑不进 agent-eval 冒烟，同 UI 类用例）。
    # 核心实证数字（真值源 docs/curtain-fabric-quote-rules.md §8~§11）：
    #   6.6m 韩褶双开 48 折 → 0.25×48+0.3 = 12.3 米（与行业加工单一致）
    #   倍数 < 1.5 拒绝；33 折双开自动调整为 34 折并告警
    #   2698-11 跨 4 部位汇总 = 28.0 米（手写量尺单实证）
    user_inputs:
      - "我客厅 4.64 米宽，帮我算一下韩褶窗帘要多少布"
    expectations:
      - tool: direct_reply
    data_checks:
      - "韩褶折数法算料：用料 = 0.25×折数 + 余量（单开 0.2 / 对开四开 0.3）—— 换算唯一性由单测保证"
      - "倍数 < 1.5 拒绝报价（行业美学下限红线）"
      - "开数不可整除自动取最近可行折数并告警（33 折双开 → 34 折）"
      - "按货号-色号汇总用料（2698-11 跨部位合计 28.0 米）—— 采购/套裁视图"
    skip_reason: "[backend-contract] 算料引擎是确定性纯计算（curtain_calc），由单元测试全量覆盖（test_curtain_calc.py），非 LLM 行为，不进入 agent-eval 冒烟（同 UI 类用例惯例）"
    merge_log: "2026-09-17 新增（issue #3982）：M2-C 算料引擎折数法/档位/红线/汇总的覆盖登记，单测覆盖"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_curtain_calc.py"
      ci:
        - pr-check.yml
      verifies: []

