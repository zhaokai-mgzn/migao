# cases/chat.yml — 边界/多轮行为用例（并源转换）
# 来源：verification 8.1~8.5 + eval E001/E002/M004/M009/M010/M012 → 7 条
#
# ★ 两处用例预期与代码校准（本文件已按代码真值改写）：
#   - 8.2 escape hatch：原用例写「输入长度>10 触发」，代码（graph/nodes.py）明确不用字符数判断，
#     实际为「非当前域显式触发词」→ CH-002 按 ai-chat.escape-hatch 真值改写
#   - 8.5 来源标注「[工具返回]」：代码与 prompt 中均未找到 → CH-004 truths_ref 置空标缺口

schema: "case-contract/1.0"
domain: chat

cases:
  - id: CH-001
    legacy_id: E001
    title: "空结果 + suggestion 引导修复"
    domains:
      - chat
      - product
    tier: adversarial
    # persona 标 mibao（issue #3367 C 端对抗面审计）：断言为 B 端机制形状（suggestion 必须含 product_search、期望 product_detail 成功）；C 端原生版本见 DF-022。
    # 标为 B 端后它不再进入 C 端可选集 —— 不是回避失败，而是断言与 Agent 不匹配：
    # 同一安全意图已由 C 端原生用例承接（见索引），C 端对抗面不因此缩小。
    persona: mibao
    tags:
      - error
      - suggestion
      - adversarial
    truths_ref:
      - ai-chat.suggestion-on-fail
      - id-resolve.name
    user_inputs:
      - "查看不存在的商品详情"
    expectations:
      - tool: product_detail
      - tool: product_search
    # ── 「不存在的商品不得查出结果」的机器判据（issue #4099）：工具级「零成功调用」──
    # 为什么**不是**原先那条 `error.code` 断言（恒不可满足 ⇒ 永久红，把本用例 score 上限钉在 2/3）：
    #   ① 取值路径对不上：runner 的 error-code 断言只读**轮级** SSE error
    #      （`check_expectation` 取 `result.get("error")`），而该字段**只在** `event: error`
    #      （异常路径）被赋值（`send_message` 的 SSE 解析分支）；工具失败走 `event: tool_result`
    #      ⇒ 真值恒为 None。真跑实证：adversarial run 34650006175（main @7f2665ab）逐字
    #      「expected error not_found but got None」；
    #   ② 取值面即便扩到工具级也取不到该值：`product_detail` 的 NOT_FOUND 分支返回的 error
    #      文本是「商品不存在」（`app/tools/product_detail.py`），不含 NOT_FOUND 字样。
    # 替代判据可判红：`product_detail` 一旦**成功**（= 不存在的商品被查出来了 / 工具坏了）即判红、
    # score 归零；而「工具正常返回但 data 为空」在 product_detail 里走 success=false 分支
    # ⇒ 不会把合法行为判红（R2）。
    # 判别力边界（照实登记，不当成已覆盖）：本断言是**工具级全程**口径 —— 若 agent 走完引导链后
    #   改用**另一个真实商品 id** 取详情来展示候选，那条调用确实成功，也会判红。取舍：本用例要守的
    #   真值是「空结果不得被吞掉」，而 runner 的 `must_fail` **无轮次作用域**、`expectation` 也无
    #   取值级否定形态 ⇒ 只能取工具级。值级口径（`args: {product_id: …}`）要求用例先用罐头输入
    #   钉死那个不存在的 id（会改用例输入），且 agent 换个 id 就静默不匹配（另一个方向的假绿面）
    #   —— 两者都超出本包触点（#4099 只修「这条不可满足的计分项」）。
    must_fail:
      - tool: product_detail
    data_checks:
      # 散文、**不计分**（runner 只把含机器计分标记的 data_checks 计入评分 —— 本文件刻意**不写**
      # 那些标记：写进去会让散文被当成机器计分项，同族假绿面见 PR-008 的 `data_checks`）。
      - "（散文、**不计分**）suggestion 需非空且含 product_search：真实链路 product_detail 的 NOT_FOUND 分支返回「该商品 ID 在库中不存在，请改用 product_search 按商品名搜索，并把候选结果给用户确认」，确实含 product_search；但 runner **没有**「核 suggestion 内容」的能力（`check_expectation` 的 suggestion 分支只判「本轮有 error」，等于没核）⇒ 只作语义记录，**不冒充**已被断言。"
      # ⚠️ 上一句里的 `suggestion` 一词**同时**是 `_last_round_error_verdict` 的「用例显式预期错误」
      #    标记（expectations/data_checks 含 error 码或 suggestion 时，最后轮 SSE error 不判失败）
      #    —— 保留是**有意**的：本用例前提就是「查不到」，删掉它会新增一个与 #4099 无关的判红面。
    skip_reason: ""
    merge_log: "eval E001 + verification 8.1（同义）；2026-09-18 #4099：删掉恒不可满足的 `error.code` 断言（只读轮级 SSE error，工具失败走 tool_result，真值恒 None）+ 原 suggestion 条目改为「散文、不计分」，真值改由 must_fail[product_detail] 承载（可判红：查出来即红）"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_tools_product_detail.py"
      ci:
        - agent-eval.yml
      verifies: []

  - id: CH-002
    legacy_id: M004
    title: "创建中途取消（escape hatch - 域关键词触发）"
    domains:
      - chat
      - product
    tier: adversarial
    tags:
      - multi_turn
      - cancel
      - user_abort
    truths_ref:
      - ai-chat.escape-hatch
    user_inputs:
      - "创建商品，名称测试，价格 100"
      - "算了，不创建了，帮我查查今天的订单都怎么样"
    expectations:
      - tool: product_manage
      # 第二句含「订单」触发词 → 允许切换出 pending 创建流程
      - tool: order_query
    # 用户中途说「算了，不创建了」→ **全程**不得发创建写调用（#3544 收口批）：
    # 原先写在 data_checks 的「product_manage(action=create) 未被调用」是假绿 ——
    # 「未被调用」的计分语义是**本轮**没调用 + 计分循环「任一轮满足即过」⇒ 2 轮用例恒真
    # （R1 的 confirm 轮天然没调用就把它满足了）。forbidden_tools 是跨轮判定，调用即违规。
    forbidden_tools:
      - tool: product_manage
        action: create
    data_checks:
      - "切换由『订单』域触发词命中，而非字符数"
    skip_reason: ""
    merge_log: "eval M004 + verification 8.2（原用例「长度>10」与代码不符，已按 ai-chat.escape-hatch 校准）。2026-09-14 校准（#3544 收口批）：data_checks 里恒真的「product_manage(action=create) 未被调用」升级为 forbidden_tools（action 限定，跨轮全程禁用）"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_mibao_multiturn_advanced.py"
      ci:
        - agent-eval.yml
      verifies: []

  - id: CH-003
    legacy_id: "8.4"
    title: "模糊意图引导 - 不猜测，澄清卡或文本列选项（低学历点选友好）"
    domains:
      - chat
    tier: normal
    tags:
      - clarification
    truths_ref:
      - ai-chat.route-actions
    user_inputs:
      - "帮我看看"
    expectations:
      # 不猜测执行任何业务工具；澄清 = interact(choice) 候选卡 或 文本引导（话术需具体，如「请说'创建商品'」）
      - tool: direct_reply or interact
    data_checks:
      - "无猜测性业务 tool 调用（product_search/order_query 等不得在澄清轮误触发）"
      - "澄清卡选项 2-4 个、可点选；文本引导须给具体话术示例"
    skip_reason: ""
    merge_log: "verification 8.4 独有；2026-09-03 Phase 2 (#2789)：general 澄清承载升级为 choice 卡或文本，期望放宽为 direct_reply or interact"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_intent_router.py"
      ci:
        - agent-eval.yml
      verifies: []

  - id: CH-004
    legacy_id: "8.5"
    title: "数据来源标注 [工具返回]"
    domains:
      - chat
      - data
    tier: normal
    tags:
      - annotation
    truths_ref:
      - ai-chat.source-annotation
    user_inputs:
      - "今天数据怎么样"
    expectations:
      - tool: dashboard_stats
        args:
          action: overview
    data_checks:
      - "当前实现无标注机制：SSE text 事件仅含 content 字段，回复不含 [工具返回] 标注（若未来实现标注，需同步更新本用例）"
    skip_reason: ""
    merge_log: "verification 8.5 独有；标注规则在实现中不存在 → 缺口，待 truth-miner 确认"
    traces:
