      - xiaobu
      - long_term
      - personalization
      - cross_session
    persona: xiaobu
    truths_ref:
      - ai-chat.context-memory
    user_inputs:
      - "我家里是奶油风的装修，我个人特别喜欢奶油风，以后都按这个风格来"
      - new_session: true
