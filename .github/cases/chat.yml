  - id: CH-008
    legacy_id: ""
    title: "转人工创建人工会话 - 客服工作台可见并可回复"
    domains:
      - chat
      - settings
    tier: normal
    persona: xiaobu
    tags:
      - handoff
      - agent_session
    truths_ref:
      - ai-chat.intent-tool-map
      - settings-manage.ai-config
    user_inputs:
      - "我要转人工"
      - "客服在吗"
    expectations:
      - tool: human_handoff
    # 写操作成功断言（issue #3367 覆盖审计）：`human_handoff` 是**写工具** ——
    # 「调了」≠「人工会话真的建出来了」。本条用例的业务价值（工作台可见/可回复、
    # 上下文透传）全部建立在会话真的落库之上；只断言工具名的话，返回
    # success=false（甚至 tool_not_found）也照样判绿（issue #3361 已在 order_create
    # 上实证过这种假绿）。实测本用例链路返回 id/ticketNo/status=pending，断言成立。
    must_succeed:
      - tool: human_handoff
    # 投递侧断言（issue #3553 / #3558 覆盖缺口）：`must_succeed` 只证明「人工会话/工单建出来了」，
    # **证明不了「管理员真的收到了转人工提醒」** —— 后者才是本用例标题里的业务价值，
    # 也是 2026-09-14 另一 worker 收口时实拍的「评测覆盖幻觉」：
    #   · 评测栈（C 端 job 只叠 xiaobu_eval_seed.sql）里**只有 role='customer' 账号**；
    #   · `POST /api/admin/notifications` 按收件人落库、**无广播语义**（收件人由
    #     `GET /api/admin/users?status=active` 解析，默认排除 customer）；
    #   ⇒ 投递分支在任何 C 端栈**不可达** → 工具走 success=True +
    #     error=admin_notification_skipped_no_recipient + data.adminNotified=false 的降级分支，
    #     而旧断言（只有 must_succeed）照样绿 = 只有一半覆盖。
    # 修法：① 种子注入 B 端管理员（xiaobu_eval_seed.sql 6.1c，带 fail-closed 核对）；
    #      ② 这里断言**投递事实** —— `data.adminNotified` 仅在「至少一位收件人真的收到
    #         站内信」时为 true（human_handoff.execute: data["adminNotified"] = notify["delivered"] > 0）。
    output_verify:
      - tool: human_handoff
        expect:
          adminNotified: true
    data_checks:
      - "createSessionForHandoff 创建 waiting 会话 + system 消息"
      - "sendMessage(agent) 后会话状态变 active"
      - "getSessionByAiSessionId 返回含客服消息的会话"
      - "createSessionForHandoff 持久化 ai_context_summary/ai_context_messages（快照字段可空）"
      - "getSessionDetail(admin) 返回 aiContext；跨租户读取拒绝"
      - "getSessionByAiSessionId(customer) 不含 aiContext 且过滤 isInternal 消息"
      - "转人工站内信真的投递到 B 端账号（收件人经 GET /api/admin/users?status=active 解析）—— 由 output_verify.adminNotified 机器判定，不得停在「工具调用成功」"
    skip_reason: ""
    merge_log: "POC 人工客服工作台新增；2026 扩展：AI 上下文同步断言（GB/T 47746-2026）；2026-09-11 修正 user_inputs —— 原为断言描述文字（非顾客对话），agent 无法响应导致必然 0 分（issue #3270 断言层归因）"
    traces:
      tests:
        - "backend/admin-api/src/test/java/com/migao/admin/service/AgentSessionServiceTest.java"
        - "backend/admin-api/src/test/java/com/migao/admin/controller/AgentSessionControllerTest.java"
        - "backend/admin-api/src/test/java/com/migao/admin/controller/CustomerAgentSessionControllerTest.java"
        - "backend/ai-agent-service/tests/test_tools_human_handoff.py"
      ci:
        - admin-api-tests.yml
      verifies: []

