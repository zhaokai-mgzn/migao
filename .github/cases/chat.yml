      - tool: product_search
    # ── 覆盖加厚（issue #3558 覆盖体检）：只断言「调了 product_search」会放过整条推荐链路全失败 ──
    # 2026-09-14 实测：本用例一次真实跑分 score=100%，同一份日志里
    # `product_search` **失败 4/4（工具失败率 100%）** —— 「个性化推荐」四个字完全没被校验。
    # must_succeed 读 tool_result.success，required_args 守住「检索必须有据（关键词非空）」。
    must_succeed:
      - tool: product_search
    required_args:
      - tool: product_search
        fields:
          - keyword
    want_text:
      - "奶油"
    post_session:
      - fetch: user_memories
        agent_type: xiaobu
        checks:
          - "count>=1"
          - "has_key:curtain_style"
          - "value_contains:奶油风"
    data_checks:
      - "第 1 轮用户表达风格偏好 → 每轮 fire-and-forget 抽取候选到 session_states.state.memory_candidates（受控词表 CEND_MEMORY_KEYS + PII 过滤）"
      - "会话关闭（PUT /api/chat/sessions/{id}/close → SessionMemory.close_session）时 flush 候选落库 user_memories（issue #2815 会话末聚合）"
      - "新会话注入：仅 xiaobu 会话注入用户长期记忆（format_for_prompt 输出经 XML 转义/截断消毒后拼入 system prompt）；记忆来自 user_memories 且 agent_type='xiaobu'、importance>=0.5、LIMIT 20"
      - "第 2 轮用户**未再提**风格词，回复出现「奶油」只能来自记忆注入（跨会话回忆可判定；同会话内看不到——候选要等会话关闭才落库）"
      - "mibao（B端）会话不注入用户记忆（agent_type 分流）"
      - "关闭与抽取的时序：关闭请求紧跟最后一轮时，关闭路径先 drain 在途抽取任务再 flush，否则候选为空、偏好静默丢失（issue #3357）"
      - "⚠️ 诚实标注（issue #3558 覆盖体检）：`want_text` 是**全程** final_text 断言（check_want_text 扫所有轮）—— 第 1 轮回复回显「奶油风」即已满足，**因此它不能单独证明「第 2 轮跨会话注入生效」**（旧注释的『只能来自记忆注入』不成立，已实证 R1 回复含该词）。跨会话的机器隔离需要 round-scoped want_text（runner 能力清单见 PR）；本用例真正咬住注入链的是 post_session（落库）+ must_succeed/required_args（推荐链路真跑通），跨会话行为面另由 CH-035 独立用例承接。"
    skip_reason: ""
    merge_log: "issue #2815：C 端长期记忆系统 — 注入接线；2026-09-12（issue #3357）升级为可执行端到端用例：原 skip_reason『agent-eval 无稳定记忆数据』正是覆盖缺口——新增 new_session 跨会话轮协议 + post_session 落库断言（GET /api/chat/memories），把注入链从「只有单测」变成端到端可判定"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_user_memory.py"
        - "backend/ai-agent-service/tests/test_memory_injection.py"
        - "backend/ai-agent-service/tests/test_memory_extraction_tasks.py"
        - "backend/ai-agent-service/tests/test_acceptance_case_checks.py"
      ci:
        - ai-agent-tests.yml
        - xiaobu-acceptance.yml
      verifies: []

  - id: CH-025
    legacy_id: ""
    title: "下单地址自动填充 - 最近订单收货信息预填（可修改）"
    domains:
      - chat
      - order
    tier: normal
    persona: xiaobu
    tags:
      - memory
      - xiaobu
      - address_prefill
      - order_create
    truths_ref:
      - ai-chat.context-memory
    # ── 解 skip（issue #3360）：原 skip_reason 写的是「agent-eval 无稳定订单数据」，
    # 而 fixture 早已注入归属 debug_customer_1 的 2 笔订单（张三 / 13800138000 /
    # 文三路1号1幢101室）—— 理由过期后没人回头解 skip，这条能力长期**零可执行覆盖**。
    #
    # 与 OR-023 的分工（避免重复覆盖）：OR-023 守「历史地址被带出且落到订单」；
    # 本用例守**标题里的「可修改」** —— 预填只是手段，顾客改完还能不能生效才是结果：
    # 若 agent 只回显历史地址、把顾客的修改吞掉，订单会寄到旧地址（顾客收不到货）。
    user_inputs:
      - "我想买遮光窗帘，米白 3 米，要纳米圈打孔加工"
      # 明确的"修改预填值"动作（本用例的核心断言来源）
      - "收货地址帮我改成浙江省杭州市西湖区文三路2号5幢202室"
      # ── 协作型顾客的"统一一轮"（issue #3430）──
      # 旧写法把「答卡 ×2 + 验证码 ×2 + 确认」写成固定轮次表，但实际卡片序列随模型而变
      # （实测首跑是 `form(R2) → choice(R3)`），错位时验证码就落到了加工项卡上。
      # 改成：有卡答卡（form 回填**修改后**的地址）→ 被问验证码供码 → 否则说确认，
      # 直到 `order_create` 成功。
      - repeat_until:
          tool_called: order_create
          max: 8
        code: "123456"
        fallback: "确认下单"
        form_values:
          customer_name: "张三"
          customer_phone: "13800138000"
          customer_address: "浙江省杭州市西湖区文三路2号5幢202室"
          color: "米白"
          colorName: "米白"
    expectations:
      - tool: customer_address_query
      # 不写 `args: component: form`（issue #3404 复盘）：顾客在意的是订单上的值对不对，
      # 把用例绑死在"必须发 form 卡"这一**机制**上会造出假红（实测 run 34755272379：
      # agent 用 confirm 卡承载同样的字段，行为合法却被判失败）。
      - tool: interact
      - tool: order_create
    must_succeed:
      - tool: order_create
    order_before:
      - "customer_address_query before order_create"
      - "interact[confirm] before order_create"
    db_verify:
      - fetch: order_items
        source: order_create
        expect_products: ["遮光窗帘"]
      - fetch: order_phone
        source: order_create
        # 历史值沿用（未修改的字段不该被改写）
        expect_phone: "13800138000"
        expect_customer_name: "张三"
        # 「可修改」的产出侧断言：改后的门牌必须落到订单。
        # 注意它同时是**判别式**：历史地址是"文三路1号1幢101室"，若修改被吞，
        # 地址里不会有"2号5幢" → 判红（不会因"地址非空"而假绿）。
        expect_address_contains: "2号5幢"
    data_checks:
      - "老客户（有历史订单）下单时先调 customer_address_query 取最近订单收货信息（order_before 已可执行）"
      - "预填收货信息可被顾客修改，且修改后的地址落到订单（db_verify.expect_address_contains 已可执行）"
      - "未修改的收货人/手机号沿用历史值（张三 / 13800138000），掩码值不得回流建单（db_verify 已可执行）"
      - "新客户（无历史订单）customer_address_query 返回空 → 维持原表单询问流程（OR-021/OR-022 覆盖）"
      - "customer_address_query 仅查当前用户本人订单（强制 user_id 过滤，只读）—— 由 pytest test_customer_address_query.py 保证"
    merge_log: "issue #2815：C 端长期记忆系统 — 下单自动填充收货信息场景；issue #3360：解 skip + 补可执行断言（原 skip 理由已过期）"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_tools_customer_address_query.py"
      ci:
        - ai-agent-tests.yml
      verifies: []

