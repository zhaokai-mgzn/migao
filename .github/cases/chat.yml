# cases/chat.yml — 边界/多轮行为用例（并源转换）
# 来源：verification 8.1~8.5 + eval E001/E002/M004/M009/M010/M012 → 7 条
#
# ★ 两处用例预期与代码校准（本文件已按代码真值改写）：
#   - 8.2 escape hatch：原用例写「输入长度>10 触发」，代码（graph/nodes.py）明确不用字符数判断，
#     实际为「非当前域显式触发词」→ CH-002 按 ai-chat.escape-hatch 真值改写
#   - 8.5 来源标注「[工具返回]」：代码与 prompt 中均未找到 → CH-004 truths_ref 置空标缺口

schema: "case-contract/1.0"
domain: chat

cases:
  - id: CH-001
    legacy_id: E001
    title: "空结果 + suggestion 引导修复"
    domains:
      - chat
      - product
    tier: adversarial
    # persona 标 mibao（issue #3367 C 端对抗面审计）：断言为 B 端机制形状（suggestion 必须含 product_search、期望 product_detail 成功）；C 端原生版本见 DF-022。
    # 标为 B 端后它不再进入 C 端可选集 —— 不是回避失败，而是断言与 Agent 不匹配：
    # 同一安全意图已由 C 端原生用例承接（见索引），C 端对抗面不因此缩小。
    persona: mibao
    tags:
      - error
      - suggestion
      - adversarial
    truths_ref:
      - ai-chat.suggestion-on-fail
      - id-resolve.name
    user_inputs:
      - "查看不存在的商品详情"
    expectations:
      - tool: product_detail
      - tool: product_search
    data_checks:
      - "error.code=NOT_FOUND"
      - "suggestion 非空且包含 product_search"
    skip_reason: ""
    merge_log: "eval E001 + verification 8.1（同义）"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_tools_product_detail.py"
      ci:
        - agent-eval.yml
      verifies: []

  - id: CH-002
    legacy_id: M004
    title: "创建中途取消（escape hatch - 域关键词触发）"
    domains:
      - chat
      - product
    tier: adversarial
    tags:
      - multi_turn
      - cancel
      - user_abort
    truths_ref:
      - ai-chat.escape-hatch
    user_inputs:
      - "创建商品，名称测试，价格 100"
      - "算了，不创建了，帮我查查今天的订单都怎么样"
    expectations:
      - tool: product_manage
      # 第二句含「订单」触发词 → 允许切换出 pending 创建流程
      - tool: order_query
    # 用户中途说「算了，不创建了」→ **全程**不得发创建写调用（#3544 收口批）：
    # 原先写在 data_checks 的「product_manage(action=create) 未被调用」是假绿 ——
    # 「未被调用」的计分语义是**本轮**没调用 + 计分循环「任一轮满足即过」⇒ 2 轮用例恒真
    # （R1 的 confirm 轮天然没调用就把它满足了）。forbidden_tools 是跨轮判定，调用即违规。
    forbidden_tools:
      - tool: product_manage
        action: create
    data_checks:
      - "切换由『订单』域触发词命中，而非字符数"
    skip_reason: ""
    merge_log: "eval M004 + verification 8.2（原用例「长度>10」与代码不符，已按 ai-chat.escape-hatch 校准）。2026-09-14 校准（#3544 收口批）：data_checks 里恒真的「product_manage(action=create) 未被调用」升级为 forbidden_tools（action 限定，跨轮全程禁用）"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_mibao_advanced_multiturn.py"
      ci:
        - agent-eval.yml
      verifies: []

