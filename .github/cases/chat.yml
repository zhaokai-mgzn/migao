  - id: CH-033
    legacy_id: ""
    title: "「算了」在无在办流程时不得冒充取消（假状态变更 + 吞掉新诉求）"
    domains:
      - chat
      - order
      - product
    tier: normal
    persona: xiaobu
    tags:
      - regression
      - cancel
      - false_state
      - xiaobu
    truths_ref:
      - ai-chat.confirm-required
    # ── 验收发现沉淀（issue #3367 / acceptance-protocol §5）──
    # 验收剧本 C-A2 实测（acceptance/ci-34730957920/.../C-A2.transcript.md）：
    #   R1 用户「帮我查一下我的订单」→ 正常列单（customer_order_query）
    #   R2 用户「算了，先看看你们有什么窗帘」
    #      AI：「好的，**已取消**。有什么其他需要帮您的吗？」且**零工具调用**
    # 两处危害：
    #   ① 假状态变更：什么都没在办却告诉顾客"已取消"（顾客可能以为订单/流程被撤了）；
    #   ② 吞掉真实诉求：「看看有什么窗帘」被整句丢弃（没有 product_search）。
    # 根因：`_is_cancel_message` 把「算了」当无条件强取消，短路分支不检查"是否有在办流程"。
    # 修复：只在 pending 流程 / 未完结交互卡存在时才短路（见 base_skill 的 _inflight 判据）。
    #
    # 有效性验证（协议 §5-3）：
    #   · 旧失败会话（上面的 transcript）重放本 case → 必 fail（R2 无 product_search + 出现「已取消」）；
    #   · 修复后重放 → 必 pass（CI 实跑记录见 PR）。
    user_inputs:
      - "帮我查一下我的订单"
      - "算了，先看看你们有什么窗帘"
    expectations:
      - tool: customer_order_query
      - tool: product_search
    forbidden_text:
      - "已取消"
    data_checks:
      - "无在办流程时，「算了」只是顾客改主意，不得回复『已取消』（假状态变更）"
      - "同一句里的新诉求（看看有什么窗帘）必须被正常处理，不得整句丢弃"
    skip_reason: ""
    merge_log: "2026-09-13 新增（issue #3367）：验收剧本 C-A2 沉淀（假取消 + 吞诉求）"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_graph_skills.py"
      ci:
        - xiaobu-acceptance.yml
      verifies: []

  - id: CH-034
    legacy_id: ""
    title: "图片内容驱动业务动作 - 发图后小布看懂画面并据此检索（vision 正向能力）"
    domains:
      - chat
      - product
    tier: normal
    persona: xiaobu
    tags:
      - multimodal
      - image
      - vision
      - xiaobu
      - capability
    truths_ref:
      - ai-chat.route-actions
    # ── 覆盖缺口（issue #3558 覆盖体检：图片/vision 链路 C 端只有 1 条）──
    # 既有两条都答不了「图片内容**被看懂并驱动了业务动作**」：
    #   · CH-026 = 防御型（澄清卡后发图**不崩溃**）；
    #   · CH-021 = skip + expectation 是 `interact or product_search or direct_reply`
    #     的全 OR 恒真式（等于没断言）；CH-023 亦 skip。
    # 本用例补正向面，三条机器断言各管一件事、互相补位：
    #   ① want_text「渐变」= **真的看懂了图**（因果闭环）：顾客文本里**没有任何花色/颜色词**，
    #      回复出现「渐变」只能来自图片本身。为什么断言「渐变」而不是某个颜色词：
    #      · 图片是**多色渐变**面料特写（本地像素分析：平均 RGB(116,113,170)，量化调色板
    #        同时含蓝(58,62,172)/青绿(58,197,172)/紫(175,78,169) → 色相连续过渡，
    #        不是单一颜色）；
    #      · 三次真实跑分里视觉模型分别描述为「彩色渐变拼接（蓝紫→青绿）」「多色渐变/彩虹渐变」
    #        「蓝紫到青绿过渡」—— **颜色词每次都在变**（蓝紫 / 彩虹 / 暖色），而「渐变」
    #        三次全中 → 它才是这张图的稳定语义（拿颜色词当断言 = 造 flake）。
    #      ⚠️ 它防的是「没看懂却装懂」；反之「看懂了却推说看不了」由 ③ 防。
    #   ② must_succeed + required_args = 接地检索真的跑通、关键词非空（不是空转调用）。
    #   ③ forbidden_text = 不得以「图片分析失败/看不清」推诿（与 CH-026 的「不崩溃」互补）。
    user_inputs:
      # ⚠️ 措辞约束：**不得**让「窗帘/面料」紧跟在 2-10 个中文字符之后 ——
      #   `test_schema_integrity.py::test_named_products_exist_in_fixture` 会把该形态
      #   提取成「点名商品」（实测原措辞被提成 '这个面料' / '店里有没有差不多的窗帘'），
      #   要求它必须存在于 fixture。本用例只做视觉检索引导，不点名任何商品 →
      #   用句号断开，让「窗帘」前不构成候选（也不进 GENERIC：这不是泛指商品，
      #   而是**故意不点名**）。
      - text: "帮我看看这张图的颜色和花色。窗帘的话，店里有接近的款式吗？"
        images:
          - "https://ai-customer-service-admin-dev.oss-cn-hangzhou.aliyuncs.com/vision-acceptance/curtain-fabric-1.png"
    expectations:
      - tool: product_search
    must_succeed:
      - tool: product_search
    required_args:
      - tool: product_search
        fields:
          - keyword
    want_text:
      - "渐变"
    forbidden_text:
      - "图片分析失败"
      - "无法识别图片"
      - "图片无法处理"
      - "看不清图片"
      - "图片解析失败"
    data_checks:
      - "图片消息经 vision 链路理解（颜色/花色），并用图片特征接地检索商品（VISION_CLARIFY_GUIDE 的 grounded 引导）"
      - "检索无命中也要如实说明（不得凭空编造商品名/价格）；命中则引用真实商品 —— 本用例不要求必有命中（评测栈商品目录有限）"
      - "图片资产用云 dev OSS：picsum.photos 在 vision 供应商侧抓取失败会误报『图片分析暂时无法完成』（CH-026 实证）"
    skip_reason: ""
    merge_log: "2026-09-14 新增（issue #3558 覆盖体检）：C 端 vision 只覆盖过「不崩溃」（CH-026），补「图片内容被理解并驱动业务动作」的正向能力用例"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_vision_integration.py"
        - "backend/ai-agent-service/tests/test_clarify_grounded.py"
        - "backend/ai-agent-service/tests/test_acceptance_case_checks.py"
      ci:
        - xiaobu-acceptance.yml
      verifies: []

  - id: CH-035
    legacy_id: ""
    title: "C 端长期记忆跨会话生效 - 新会话用回上次偏好驱动推荐（不止落库）"
    domains:
      - chat
      - customer
    tier: normal
    persona: xiaobu
    tags:
      - memory
      - xiaobu
      - long_term
      - personalization
      - cross_session
    truths_ref:
      - ai-chat.context-memory
    # ── 覆盖缺口（issue #3558 覆盖体检：C 端长期记忆只有 CH-024 一条）──
    # CH-024 的 want_text 是**全程**断言（R1 回显偏好词即满足）→ 证明不了「跨会话生效」；
    # 且其推荐链路全失败时仍判 100%（2026-09-14 实测 score=100% / product_search 失败 4/4）。
    # 本用例把「跨会话」拆成三条**独立可判**的断言，并明确标注各自的证明边界：
    #   ① post_session（落库）：会话关闭后 user_memories 必须有 key=curtain_style /
    #      value 含「奶油风」（GET /api/chat/memories）—— 记忆真的存下来了；
    #   ② forbidden_text（注入失效的**行为指纹**）：R2 顾客没重述风格，若注入失效，
    #      小布只能反问顾客偏好（「您喜欢什么风格」类话术）→ 命中即红；
    #   ③ must_succeed + required_args（推荐真的可用）：R2 必须发出**有据**的检索
    #      （keyword 非空）且调用成功 —— 防「记忆注入了但检索全失败」这种半绿。
    #   ⚠️ 边界（诚实标注）：`want_text` 是全程断言，R1 回显即满足 → 不能单独证明 R2
    #   跨会话；真正的 round-scoped 隔离需要 runner 新能力（见 PR 的「需要的 runner 能力」）。
    user_inputs:
      - "记住一下：我家装修是奶油风，我特别喜欢奶油风这个风格，以后推荐都按这个来"
      - new_session: true
        text: "按我上次说的风格帮我推荐几款窗帘"
      # ③ 协作收尾轮（§13.5：真实 agent 的轮次形状会变 —— 实测首跑 R2 先复述记忆、
      #    请顾客确认偏好后才检索，固定两轮会把「先确认再检索」判成假失败）。
      #    有卡答卡 / 无卡发原文，直到真的发生 product_search（已发生则立即停轮）。
      - repeat_until:
          tool_called: product_search
          max: 3
        fallback: "对，就按这个风格，帮我把店里的款式搜出来看看"
    expectations:
      - tool: product_search
    must_succeed:
      - tool: product_search
    required_args:
      - tool: product_search
        fields:
          - keyword
    want_text:
      - "奶油风"
    forbidden_text:
      - "请问您喜欢什么风格"
      - "您喜欢什么风格"
      - "您偏好什么风格"
      - "还不了解您的喜好"
      - "没有您之前的偏好记录"
    post_session:
      - fetch: user_memories
        agent_type: xiaobu
        checks:
          - "count>=1"
          - "has_key:curtain_style"
          - "value_contains:奶油风"
    data_checks:
      - "会话关闭时 flush 候选落库 user_memories（key=curtain_style / importance>=0.5）—— post_session 机器核对"
      - "新会话（new_session 轮）注入该记忆：R2 顾客**未再提**风格词，仍按奶油风检索/推荐（注入失效的典型表现 = 反问顾客想要什么风格 → forbidden_text 拦截）"
      - "共享环境注意：user_memories 是**用户级**长期数据，上一轮评测的残留也可能满足 post_session —— 故落库断言在独立栈（全新库）上才具备完整证明力；跑在云测试环境时只能作为辅助证据（这一点已在 PR body 标注）"
    skip_reason: ""
    merge_log: "2026-09-14 新增（issue #3558 覆盖体检）：C 端长期记忆覆盖仅 1 条（CH-024 且其跨会话结论不可判定），补跨会话生效的独立用例"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_memory_injection.py"
        - "backend/ai-agent-service/tests/test_user_memory.py"
        - "backend/ai-agent-service/tests/test_acceptance_case_checks.py"
      ci:
        - xiaobu-acceptance.yml
      verifies: []

  - id: CH-037
    legacy_id: ""
    title: "窗帘下单澄清清单引擎（必填/默认三层/矛盾拦截/轮次上限，单测覆盖）"
    domains:
      - chat
      - customer
    tier: normal
    persona: xiaobu
    tags:
      - xiaobu
      - clarification
      - curtain
    truths_ref:
      - ai-chat.intent-domains
    # ── 覆盖说明（issue #3986，M3-E）──
    # 现实订单大量信息靠默认约定兜底（2026-09 客户强调）。澄清做成确定性清单驱动：
    # 必填（尺寸）追问、默认三层（行业标/商家默/客户记忆 craft_profile）、缺省即报、
    # 矛盾拦截（4.6m 单开→建议双开/折数整除/工艺互斥/倍数红线）、轮次上限转复尺。
    # 纯函数零 IO，由单测全量覆盖（同 CH-036 惯例不进 agent-eval 冒烟）。
    user_inputs:
      - "帮我家客厅做窗帘，大概要多少钱"
    expectations:
      - tool: direct_reply
    data_checks:
      - "尺寸（宽/高）缺失必须追问（必填检测）——不阻塞，缺省即报"
      - "默认三层合成：客户记忆 > 商家配置 > 行业标准（布帘默认定型/纱帘默认不定型、≤2.2m 单开/>2.2m 双开）"
      - "矛盾拦截：4.6m 单开→建议双开、折数不可整除自动调整、倍数<1.5 拒绝、打孔不按折数"
      - "每轮追问 ≤3 项；超过 3 轮转复尺/人工"
    skip_reason: "[backend-contract] 澄清清单引擎是确定性纯函数（app/clarification/curtain_checklist.py），由单元测试全量覆盖（backend/ai-agent-service/tests/test_clarification/test_curtain_checklist.py，18 项），非 LLM 行为，不进入 agent-eval 冒烟（同 CH-036 惯例）"
    merge_log: "2026-09-17 新增（issue #3986）：M3-E 窗帘下单澄清清单引擎覆盖登记，单测覆盖。2026-09-18（issue #4120）**证据链修复**：原 traces.tests 指向不存在的 tests/test_curtain_checklist.py，且测试文件名为 curtain_checklist.py（不匹配 python_files = test_*.py）⇒ **永不被 pytest 收集**、18 个 def test_ 一个都没跑过 ⇒ 本条用例的机器证据为**零**而没有任何东西会变红。修法：文件改名 test_curtain_checklist.py（pytest tests/ -q 实测 18 passed）+ traces.tests 指向真实路径；并新增 L0 守卫 tests/unit_ci_workflows/test_eval_evidence_chain.py 锁死「traces 引用必须存在」与「以单测覆盖为由 skip 的文件必须真被收集」（同批修掉存量 11 条幽灵 traces.tests + 7 条幽灵 traces.ci）；断言未动"
    traces:
      tests:
