      ci:
        - agent-eval.yml
      verifies: []

  - id: CH-005
    legacy_id: M009
    title: "对抗性 - 打岔后回到原任务"
    domains:
      - chat
      - product
    tier: adversarial
    tags:
      - multi_turn
      - interruption
      - context_persistence
      - adversarial
    truths_ref:
      - ai-chat.context-memory
      - ai-chat.escape-hatch
    user_inputs:
      - "我要创建一个窗帘商品，名称星夜，价格 299"
      - "哦对了，顺便帮我查一下最近有什么订单"
      - "好，回到刚才，继续创建星夜窗帘"
      - "分类选窗帘，颜色深蓝"
      - "确认创建"
    expectations:
      - tool: order_query
      - tool: product_manage
        args:
          action: create
    # 效果层断言（#3778「调用了 ≠ 成了」/ CASE-TRUST-NO-EFFECT-ASSERTION burn-down）：
    # 本条 data_checks 断言的是「创建的 name=星夜, price=299」——那是**效果**，
    # 而 `expectations[product_manage]` 只证明**被调用**。故显式要求 create 成功。
    must_succeed:
      - tool: product_manage
        args:
          action: create
    data_checks:
      - "创建的 name=星夜, price=299"
      - "打岔前后上下文未丢失"
    # 自清理（#3800 / CASE-TRUST-NO-SELF-CLEAN burn-down）：本用例**自建**商品「星夜」
    # （全库仅本条使用），重试时若不复位 ⇒ 前置与首跑不等价（同名重创/重名澄清）。
    # `namespaces` 是"自有名"的声明（清理族按它豁免种子可解析性，#3835），
    # 与 `pre_clean` 配对使用；判据见 .github/assertion_taxonomy.py。
    namespaces:
      - "product_name:星夜"
    pre_clean:
      - type: product_remove
        product_keyword: "星夜"
    # 前置自断言（CASE-TRUST-NO-PRECONDITION-ASSERTION burn-down，口径同 PR-008）：
    # `pre_clean` 复位「星夜」之后、agent 跑之前**取基线并核对**（runner 侧 pre_clean 在
    # 调度器里先于 attempt 内的基线快照执行）⇒ 首跑前置真的是「不存在」；上一跑残留 /
    # 并行同名副本会让它**显式红**，而不是污染本次红绿的归因（#3835）。
    # `max_growth: 1`（issue #4200）：本用例自己就会创建「星夜」⇒ 不给容差则正常行为下
    # `0 → 1 > 0` **恒判漂移**（同族实例 PR-008/PR-016 已实测 score=0.0 而逐条计分断言全 passed）；
    # 只容忍自建的那一个，并行用例再造同名（`0 → 2`）仍判漂移。
    precondition:
      - type: product_count_for_keyword
        source: "星夜"
        expect: 0
        max_growth: 1
    skip_reason: ""
    merge_log: "eval M009 独有；2026-09-18（skip 豁免收紧跟随）：补 namespaces[product_name:星夜] + pre_clean[product_remove 自有名] 声明自清理，并补 must_succeed[product_manage(action=create)]（效果层 —— 原 data_checks『创建的 name=星夜, price=299』**不计分**）+ precondition[product_count_for_keyword 星夜 expect=0]（前置自断言）；三条一起把 CASE-TRUST-NO-SELF-CLEAN / NO-EFFECT-ASSERTION / NO-PRECONDITION-ASSERTION 清零（整条销账，burn-down）；expectations / user_inputs / data_checks 原样未动；2026-09-18（issue #4200 的潜伏恒红修复）：`precondition` 补 `max_growth: 1` —— 本用例自己就要创建「星夜」⇒ 容差缺省 0 时正常行为下 `0 → 1 > 0` **恒判运行期漂移**、score 归零（同族实例 PR-008 / PR-016 已实测：逐条计分断言全 passed 而 `score=0.0`）⇒ 容忍自建的那一个；并行用例再造同名（`0 → 2`）仍判漂移。`expect` 与全部断言原样未动、无放宽。"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_mibao_multiturn_intelligence.py"
      ci:
        - agent-eval.yml
      verifies: []

  - id: CH-006
    legacy_id: M010
    title: "对抗性 - 10 轮密集对话后精确操作"
    domains:
      - chat
      - product
    tier: adversarial
    tags:
      - multi_turn
      - long_context
      - memory
      - adversarial
    truths_ref:
      - ai-chat.context-memory
      - ai-chat.compression
      - ai-chat.escape-hatch
      - id-resolve.index
    user_inputs:
      # ── 自包含化（issue #3599：同一缺陷类已在 aftersales.yml 实证两次）──
      # 原台词用「第1个/第一个/第3个」序号指代：序号由**搜索排序**与**该商品真实拥有的
      # 加工项个数**决定，是栈相关量（product_search 默认 ORDER BY created_at DESC；
      # 独立栈叠加 B 端种子后排序还会变）→ 同一个"第 3 个加工项"在不同栈指向不同东西，
      # 甚至根本不存在（该商品只有 2 个加工项时）→ 假失败/白耗澄清轮。
      # 改法：多轮长上下文与精确操作仍是本用例的核心（10 轮、跨域穿插、改价后回查是否生效），
      # 但**指代对象点名种子内真实存在的实体**（遮光窗帘 + 加工项目录里的「纳米圈打孔」，
      # 见 tests/agent_eval/fixtures/xiaobu_eval_seed.sql），不再依赖排序/个数。
      - "搜遮光窗帘"
      - "看看遮光窗帘的详情，就第一款"
      - "搜订单"
      - "查最近一笔订单"
      - "搜客户"
      - "查张三"
      - "再搜遮光窗帘"
      # ⚠️ 跨域回切必须带**显式触发词**（真值 ai-chat.escape-hatch：非当前域需显式触发词
      # 才允许切换，词表含「商品管理」）。实测（云测试环境）：R8 只说「把…价格改成 168」
      # 时，agent 仍停在「客户」域并**正确地**拒绝执行 —— 它甚至回了「你直接对我说一句
      # 『修改商品价格』」。这不是能力缺陷，是**用例没说协议语言**（§13.5 同类）。
      # ⚠️ 目标价必须**不同于** fixture 价（种子 prod_eval_blackout = ¥168）：实测云环境
      # R8 说「改成 168」时 agent 正确识别为**同值操作**并拒绝执行（"已经是 ¥168，无需变更"）
      # → product_manage 永不发生。改成一个真正的变更值（199）。
      - "商品管理：把第一款遮光窗帘的价格改成 199"
      # 答卡轮（§13.5：写操作卡下发后**必须有点卡轮**，裸文本「确认」≠ 点卡）——
      # 实测：R8/R9 两轮都只发了 interact(confirm) 卡，没有轮次去点它 →
      # product_manage 永不执行（用例以"改价没生效"红）。
      - auto_respond:
          fallback: "确认"
      # ⚠️ 2026-09-19（#4371 解耦）：原 R9「商品管理：给这款商品添加加工项 纳米圈打孔」+ 其
      # 答卡轮**已删除** —— 它驱动 `product_processing_item_manage`（给**商品**挂加工项），
      # 该工具随「商品不再持有加工项」退场。用例核心（10 轮长上下文 + 跨域回切 + 改价后回查）
      # 由剩余轮次完整保留。
      - "确认下刚才改的价格生效了（现在是 199 吗）"
    expectations:
      - tool: product_manage
        args:
          action: update
      - tool: product_detail
    data_checks:
      - "第8轮 product_id 来自第1-2轮上下文（同一商品，不重新问顾客）"
      - "全程无重复 product_search 查同一商品"
    skip_reason: ""
    merge_log: "eval M010 独有；2026-09-14 自包含化（issue #3599）：序号指代 → 点名种子内真实对象（依赖排序/加工项个数的指代在别的栈上会指向别的东西或不存在）。2026-09-19（#4371 商品↔加工项解耦）：删除「给这款商品添加加工项 纳米圈打孔」一轮 + 其答卡轮 + `expectations[product_processing_item_manage]` + `data_checks[第9轮加工项按名称解析…]` —— 商品不再持有加工项，该工具退场；长上下文/跨域回切/改价回查意图与其余断言原样未动。"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_mibao_multiturn_intelligence.py"
      ci:
        - agent-eval.yml
      verifies: []

  - id: CH-007
    legacy_id: M012
    title: "闲聊穿插 - 不污染业务上下文"
    domains:
      - chat
      - product
    tier: normal
    tags:
      - multi_turn
      - casual_chat
      - context_isolation
    truths_ref:
      - ai-chat.intent-domains
      - ai-chat.context-memory
    user_inputs:
      - "你好"
      - "你能干什么"
      - "搜一下遮光窗帘"
      - "今天天气不错"
      # 自包含化（issue #3599）：原为「看看第一个的详情」—— 序号由搜索排序决定
      # （`ORDER BY created_at DESC`，栈相关；独立栈叠加 B 端种子后排序还会变）→
      # 「第一个」在不同栈指向不同商品。改为**点名商品 + 就地消歧**（"就第一款"）：
      # 同名商品 >1 时 agent 会**正确**反问要哪一件（云环境实测 5 件同名 → 固定轮次表
      # 会把它误判成"没调 product_detail"），点明序号后在任何栈都可达。
      - "看看遮光窗帘的详情，就第一款"
      - "好的谢谢"
    expectations:
      - tool: product_search
      - tool: product_detail
    data_checks:
      - "闲聊回复不调用 tool"
      - "product_detail 正确使用 product_search 返回的 ID（按商品名解析到同一件，不重新问顾客）"
    skip_reason: ""
    merge_log: "eval M012 独有；2026-09-14 自包含化（issue #3599）：序号指代 → 点名种子内真实商品"
    traces:
      tests:
        - "backend/ai-agent-service/tests/manual/mibao_scenarios.py"
      ci:
        - agent-eval.yml
      verifies: []

  - id: CH-008
    legacy_id: ""
    title: "顾客要求转人工 → 系统无人工转接通道，AI 如实告知并自行受理（不得假承诺转接）"
    domains:
      - chat
      - settings
    tier: normal
    persona: xiaobu
    tags:
      - handoff
      - agent_session
    truths_ref:
      - ai-chat.intent-tool-map
      - settings-manage.ai-config
    user_inputs:
      - "我要转人工"
      - "客服在吗"
    expectations:
      # `direct_reply` = 本仓库「期望一段文本回答（无工具调用）」的标准标记（103 条 skip 用例同款）；
      # 本条已 unrunnable ⇒ 该期望是**形态留档**，不是活断言（真实覆盖见下方 data_checks 指向）
      - tool: direct_reply
    # ── 2026-09-19 退场登记（用户裁定）────────────────────────────────────────
    # 裁定原文：「不应该存在 human_handoff 这种东西，以后全是 AI 来判断」。
    # 本条原为「转人工创建人工会话（客服工作台可见/可回复 + AI 上下文透传 + 通知投递）」
    # 的端到端写用例（expectations / must_succeed / output_verify 全部锚 human_handoff）。
    # 工具退场后该链路在 agent 层**不存在了** ⇒ 端到端不可跑，按
    # `migao-acceptance`「不能改的如实降级/登记」处置：
    #   · 标 `unrunnable`（skip_reason 非空 ⇒ 不进 agent-eval，不会伪装成"跑过了"）；
    #   · 业务价值（会话/工单/上下文落库、工作台可见可回复、通知投递）**能力未删除**
    #     （阶段一范围），全部由确定性层覆盖：traces 保留 admin-api 单测 + 工具直测单测；
    #   · 「顾客要求转人工时 AI 怎么答」这一半由 **CH-015**（live）承载（如实告知 +
    #     禁止假承诺），不在本条重复；
    #   · 「不得再绑定/再提示该工具」由结构性判据锁定：
    #     tests/unit_ci_workflows/test_human_handoff_retired.py（回退绑定/回退 prompt 均红）。
    # ⚠️ 阶段二彻底删除工具与后端端点时，本条连同确定性层单测一起下线（见汇报）。
    precondition: "转人工工具（human_handoff）与后端人工会话端点仍在（阶段一保留），但**模型不可达**（不在默认注册表/任何 skill 工具集）⇒ 本用例无法经 agent 链路复现；会话/工单/上下文/投递语义由 traces 里的工具单测 + admin-api 单测覆盖"
    skip_reason: "[backend-contract] 转人工工具已按用户裁定退场（模型不可达）：agent 不会（也不能）再触发人工会话创建，端到端写断言永久不可满足。能力未删除 ⇒ 由 backend/ai-agent-service/tests/test_tools_human_handoff.py（会话/工单/通知/上下文载荷）与 admin-api AgentSession* 单测（落库/可见性/跨租户拒绝）覆盖；退场后的对话行为（如实告知 + 禁止假承诺）由 CH-015 承载，不在 agent-eval 层重复"
    data_checks:
      - "（确定性层）createSessionForHandoff 创建 waiting 会话 + system 消息；sendMessage(agent) 后状态变 active"
      - "（确定性层）getSessionByAiSessionId 返回含客服消息的会话；getSessionDetail(admin) 返回 aiContext，跨租户读取拒绝"
      - "（确定性层）createSessionForHandoff 持久化 ai_context_summary/ai_context_messages（快照字段可空）"
      - "（确定性层）转人工站内信真的投递到 B 端账号（output_verify.adminNotified 的机器判定改由工具单测覆盖）"
    merge_log: "POC 人工客服工作台新增；2026 扩展：AI 上下文同步断言（GB/T 47746-2026）；2026-09-11 修正 user_inputs —— 原为断言描述文字（非顾客对话），agent 无法响应导致必然 0 分（issue #3270 断言层归因）；2026-09-19 **退场登记**（用户裁定「不应该存在 human_handoff 这种东西，以后全是 AI 来判断」）：端到端工具断言整体移除（不可满足）、标 unrunnable、断言口径改指确定性层单测；对话侧改由 CH-015 承载"
    traces:
      tests:
        - "backend/admin-api/src/test/java/com/migao/admin/service/AgentSessionServiceTest.java"
        - "backend/admin-api/src/test/java/com/migao/admin/controller/AgentSessionControllerTest.java"
        - "backend/admin-api/src/test/java/com/migao/admin/controller/CustomerAgentSessionControllerTest.java"
        - "backend/ai-agent-service/tests/test_tools_human_handoff.py"
        - "tests/unit_ci_workflows/test_human_handoff_retired.py"
      ci:
        - pr-check.yml
      verifies: []

