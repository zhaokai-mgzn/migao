      - "工具消息逐条点名**非 `wired`** 的能力（规则名）并给出**各自**的措辞：`not_wired` ⇒ 「尚未接入」（不可行动）；`not_enabled` ⇒ 「你还没开启<能力>」+ 开启引导（**可行动**，与「尚未接入」**分开说、不合并**）；`incomplete` ⇒ 本次数据不完整 + 原因；当天 0 条命中时也不得出现「今日无异常 / 无异常 / 一切正常 / 未发现异常」这类表述（消息是模型的唯一输入源，消息里没有的兜底模型编不出来）"
      - "逐规则状态进 data（`proactive_status`），调用方自己可分**四态**：`wired`（已接入**且本次完整**但当天无命中）/ `incomplete`（已接入但**本次不完整**）/ `not_enabled`（系统**有**、**该租户没开**，可行动）/ `not_wired`（系统**未实现**，不可行动）；全部 `wired` 时**不得**出现未接线措辞（披露不能因为总是出现而失去信息量）"
      - "本次**不完整**（行数被上限截断 / 分组维度缺值）时同样如实说明（「本次数据不完整，空命中不代表没有问题」+ 点名规则 + 原因），与未接线披露并列；注入式红证：抹掉截断标志 ⇒ 该判据必红"
      - "注入式红证：从消息里抹掉某条未接线能力的名字、或往消息里塞「今日无异常」⇒ 同一判据必须变红"
    skip_reason: "[backend-contract] 未接线话术由 ai-agent 单测验证（tests/test_tools_briefing_query.py 的 TestNotWiredDisclosure），非 LLM 行为，不进入 agent-eval 冒烟"
    merge_log: "2026-09-24 新增（issue #5358）：族 3 跨域视图内核包 1 — 未接线如实说明；2026-09-24 文本刷新（issue #5387，容器核查发现的**第三处**同类陈旧口径）：披露面由「未接线」一态扩为**三态各有各的说法**（`not_wired` 不可行动 / `not_enabled` 可行动且与前者分开说 / `incomplete` 本次不完整），枚举句由三态改判为**四态** —— 旧口径「调用方自己可分『未接线 / 本次不完整 / 已接入且完整但无命中』」整条退场"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_tools_briefing_query.py"
      ci:
        - pr-check.yml
      verifies: []
