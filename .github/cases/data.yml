  # ══════════════════════════════════════════════════════════════════════════
  # DA-019 / DA-020（issue #3592 销账，2026-09-26）—— #5247「B 端米宝只读化」新接入的
  # 两个 B 端只读工具此前**零 LLM 行为面覆盖**：
  #   · `briefing_query`（经营日报）缺口登记 = `.github/eval-coverage-baseline.yml` 的
  #     `briefing_query` / `uncovered`；
  #   · `session_manage` 是**薄覆盖**（库里只有 DA-004 一条 monitor），登记 = 同文件的 `thin_positive`。
  #   两条登记与这两条用例**同 PR** 增删（补用例与删条目必须同 PR，否则陈旧登记即红）。
  #
  # ⚠️ 为什么现在能写（**推翻**旧登记写的理由「评测栈简报开关可能关闭 ⇒ 场景待定」）——
  #   读源复核 backend/admin-api/src/main/java/com/migao/admin/controller/BriefingController.java：
  #   `GET /api/admin/briefing/today` **不看** `tenants.briefing_enabled` 开关 —— 未生成简报时返回
  #   `generated=false` + `content=null` 且 HTTP 200；工具侧同形返回 `success=True` + 空态消息
  #   （backend/ai-agent-service/app/tools/briefing_query.py）。⇒ 开关只影响**内容**，
  #   不影响本用例的计分面（「模型有没有调对工具 + 调用是否成功」）；`/snapshot` 更是零 LLM。
  #
  # 断言形态（**机器计分**，不靠散文）：
  #   ① `expectations` 的工具名/入参（runner 按 `tool(k=v)` 做**值级**比对，见 DA-020 的 action）；
  #   ② `must_succeed`（「调用了 ≠ 成了」，#3778）；
  #   ③ `data_checks` 首条 `success=true`（runner 的机器计分关键词，判据源 =
  #      `.github/assertion_taxonomy.py` 的 `MACHINE_DATA_CHECK_MARKERS`）。
  #   其余 data_checks 逐条标注「散文、不计分」—— **不冒充**机器判据（#3559 / PR-021 的教训）。
  # ══════════════════════════════════════════════════════════════════════════
