  - id: DA-017
    legacy_id: ""
    title: "跨域视图内核：逐规则接线状态 ——「没数据」与「没问题」在数据层可分（issue #5358）"
    domains:
      - data
    tier: normal
    tags:
      - proactive
      - briefing
      - wiring
    truths_ref:
      - dashboard-jump.proactive-wiring-status
    user_inputs:
      - "主动发现接线状态自检"
    expectations: []
    data_checks:
      - "接线状态**逐规则**输出（rule_id → status + 原因 + 缺哪个数组/字段），且**四态可分**：`wired`（已接入**且本次完整** —— 只有它能被判成「这方面没问题」）/ `incomplete`（已接入但**本次不完整**：行数被上限截断、分组维度缺值、有行未判定）/ `not_enabled`（系统**有**该能力、**该租户没开**，**可行动**：引导开启）/ `not_wired`（系统**未实现**，**不可行动**）—— 🔴 `not_enabled` 与 `not_wired` **并列、不可合并**（一个是「去开就能用」、一个是「现在没有」），**不是**一个整体布尔"
      - "六条规则逐条可判（rule_id 现取）：`unshipped_overdue` / `low_stock` / `repeat_returns` 装配行级数组后 `wired`（本次被上限截断或维度缺值 ⇒ `incomplete`）；`below_cost_price` 的状态**随租户三态** —— 做成本核算且行级完整 ⇒ `wired`、**有行成本未知**（该行 `cost_amount` 为 NULL）⇒ `incomplete`（+ `gaps` 点名该行**未判定**，不得读成「没命中」）、**不做**成本核算（该租户无 `avg_cost IS NOT NULL` 的 SKU）⇒ `not_enabled`（可行动：引导开启成本核算）；`price_change_over`（**数据源 = 两条腿、一个数组**，issue #5388 审计腿 + #5411 批量腿：审计腿 = `audit_logs` 的 `resource_type='agent_tool'` + `tool_name ∈ {product_update, sku_update}`，幅度取 `action_details.priceChange` **真值**；批量腿 = `agent_batches`（`batch_type='product_price'` 且**已执行**）× `agent_batch_items` 的 `old_value` / `new_value` —— 批量执行时参数只有 `batch_id`，审计行里没有价格可落；两腿合并进**同一个** `price_changes` 数组、键名同形）**同样随租户三态** —— 审计在跑且行级完整 ⇒ `wired`、**有行读不出改价真值**（#5303 之前的记录没有 before_price）⇒ `incomplete`（+ `gaps` 点名未判定）、**窗口内连一条写工具审计行都没有**（审计没在跑 ⇒ 无法区分「从没改过价」与「审计丢行」）⇒ `not_enabled`（可行动：让米宝执行一次写操作以产生审计留痕）；🔴 该租户级前置 `audit_tool_logging` **只管审计腿** —— 它 false 时批量腿不受影响，该租户仍可能因批量改价而命中（那种情形下「本次未判定」只对审计腿成立）；`discount_over`（**数据源 = `orders.discount_amount`**，经营洞察）⇒ 数组已接入且完整即 `wired`（它是主库列、非 fail-open 旁路 ⇒ 空命中可信），行级金额缺失（`discount_amount` 默认 0 / `total_amount` 未知）⇒ `incomplete`（分母未知的**不判定**，不是 100% 让利）—— 部分接线场景有断言，不是整体一个布尔"
      - "**不同性质的「没有」可分**：六条规则当天一条都没命中时，`not_wired`（系统没做）/ `not_enabled`（该租户没开）/ `incomplete`（本次不完整）与「`wired` 但当天无命中」在输出上必须不同 —— 前三种都带原因、只有 `wired` 不带 —— 注入式红证：抹掉 status 字段（或给已接线补原因）⇒ 判别断言必须变红；🔴 **「租户从没改过价」与「审计根本没在跑」也必须不同**（两者都表现为「没有改价记录」：前者正常的空 ⇒ `wired`、后者故障的空 ⇒ `not_enabled`，判据 = 租户级事实 `audit_tool_logging`）"
      - "装配层自描述优先（声明里没给的字段就是没有，不靠某一行碰巧带上）；老快照没有 row_fields 时按实际行的字段并集兜底（滚动升级期不把已接线读成未接线）"
      - "🔴 **有界不许变成静默少报**：行数组被行数上限截断 ⇒ 该规则落 `incomplete`（带原因：上限多少行 / 本次给出多少行）；分组维度在部分行缺值（如退货行没有商品）同样落 `incomplete` —— 注入式红证：抹掉截断标志 ⇒ 截断判据必红；把缺值补齐 ⇒ 维度判据必红"
      - "不变式（一套口径）：`reason is None` ⟺ `status == wired`（= 已接入**且本次完整**）—— 只有 `wired` 才允许把空命中读成「这方面没问题」；日报条数被 max_findings 截断时，工具消息必须点出**真实条数**（日报只列前 N 项，当天共 M 项）"
    skip_reason: "[backend-contract] 逐规则接线状态由 ai-agent 单测验证（tests/test_briefing_proactive.py 的 TestWiringStatusIsPerRule），非 LLM 行为，不进入 agent-eval 冒烟"
    merge_log: "2026-09-24 新增（issue #5358）：族 3 跨域视图内核包 1 — 逐规则接线状态（治 #5348 的语义空转）；2026-09-24 文本刷新（issue #5387）：新增第四态 `not_enabled`（`below_cost_price` 的状态**随租户三态**，不再是 `not_wired`）；2026-09-24 文本刷新（issue #5388）：`price_change_over` 改数据源（审计日志）后**同样随租户三态**（含新增的「审计没在跑 ⇒ not_enabled」区分）、新增 `discount_over`（订单源，两态）⇒ 旧口径「唯一结构性不可达 = price_change_over」整条退场；2026-09-25 文本刷新（issue #5445）：`price_change_over` 的数据源由「审计日志」单腿改判为**两条腿、一个数组**（#5388 审计腿 + #5411 批量腿）⇒ 旧口径「数据源 = 审计日志」整条退场，并补上「审计腿的租户级前置（`audit_tool_logging`）只管审计腿」这条边界"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_briefing_proactive.py"
        - "backend/ai-agent-service/tests/test_briefing_proactive_price_and_discount.py"
      ci:
        - pr-check.yml
      verifies: []

