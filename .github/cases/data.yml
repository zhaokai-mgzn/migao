# cases/data.yml — 看板/数据域用例（并源转换）
# 来源：verification 7.1~7.4 → 4 条（7.4 属坐席会话监控，domains 标注）

schema: "case-contract/1.0"
domain: data

cases:
  - id: DA-001
    legacy_id: "7.1"
    title: "经营概览"
    domains:
      - data
    tier: normal
    tags:
      - dashboard
      - query
    truths_ref:
      - dashboard-jump.overview
    user_inputs:
      - "今天生意怎么样"
    expectations:
      - tool: dashboard_stats
        args:
          action: overview
    data_checks:
      - "订单数/销售额来自真实数据"
    skip_reason: ""
    merge_log: "verification 7.1 独有"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_tools_base.py"
      ci:
        - agent-eval.yml
      verifies: []

