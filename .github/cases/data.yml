  - id: DA-005
    legacy_id: ""
    title: "经营看板织物质感改版（样板页）"
    domains:
      - data
    tier: normal
    tags:
      - dashboard
      - ui-redesign
      - visual
    truths_ref:
      - dashboard-ui.tokens
      - dashboard-ui.insight-bar
      - dashboard-ui.no-truncate
      - dashboard-ui.axis-sampling
      - dashboard-ui.status-chips
      - dashboard-ui.no-overflow
    user_inputs:
      - "经营看板页面按织物质感方向重设计"
    expectations:
      - page: /dashboard
        required_texts:
          - 数据看板
          - 今日经营速览
          - 较昨日
          - 客单价
          - 库存偏低
    data_checks:
      - "token：主色靛蓝/点缀陶土/米白底，无默认蓝"
      - "商品销量排行表头「日涨」在 1440/1280 两视口无截断"
      - "订单趋势 x 轴刻度在 1280 宽度下降采样不重叠"
      - "订单/售后状态语义色 chips；空态「暂无数据」无 '-' 占位"
      - "销售额趋势/迷你图使用真实 amount 数据，无 23.8 假乘数"
      - "经营数据 4 卡自洽：客单价 = 今日销售额 ÷ 今日订单数"
      - "涨跌语义色：上涨=绿色（好事）、下跌=红色（需关注）"
    skip_reason: "UI 页面改版：由 vitest 单测 + Playwright 多视口 E2E + 页面验收（page_accept）验证，不进入 agent-eval 冒烟"
    merge_log: "2026-08-25 新增：#2532 经营看板织物质感改版（样板页）；2026-08-31 更新：PD 精简改版（洞察条一句话解读 + 客单价卡 + 绿涨红跌 + 修复 23.8 假数据）"
    traces:
      tests:
        - "frontend/admin-web/tests/unit/pages/dashboard.test.tsx"
        - "frontend/admin-web/tests/unit/lib/status-chip.test.ts"
        - "frontend/admin-web/tests/unit/lib/axis-sampling.test.ts"
        - "tests/e2e/specs/dashboard/dashboard.spec.ts"
      ci:
        - pr-check.yml
      verifies: []

  - id: DA-006
    legacy_id: ""
    title: "商品销量排行 - 米宝答「哪个商品卖得最好」（dashboard_stats product_ranking）"
    domains:
      - data
      - chat
    tier: normal
    tags:
      - dashboard
      - ranking
      - product
    truths_ref:
      - ai-chat.permission-layers
    user_inputs:
      - "这个月哪个商品卖得最好？"
      - "最近一周卖得最多的是什么窗帘？"
    expectations:
      - tool: dashboard_stats
        args:
          action: product_ranking
          period: month
    data_checks:
      - "dashboard_stats 支持 action=product_ranking：转发 admin-api GET /api/admin/dashboard/product-ranking（params period=day|month + limit）"
      - "返回按 productId 聚合的销量排行（rank/productName/salesQty/salesAmount），ToolResult.data 为 dict 契约（list 响应包裹为 items）"
      - "摘要含榜首商品名（如「本月销量排行: N个商品，榜首「星空全遮光窗帘」」）"
      - "权限：admin/agent/tenant_admin/operator 可查；customer 拒绝（不越权）"
    skip_reason: "非 LLM 行为：转发实现与权限由 ai-agent 单测验证（test_tools_dashboard_stats.py），不进入 agent-eval 冒烟"
    merge_log: "2026-09-02 新增：POC 演示审查 E 项 — 米宝问数「哪个花色卖得最好」无工具支撑（dashboard_stats 无 TopN）；按订单数据实际粒度实现商品维度排行（order_items 无颜色字段，花色排行需 schema 变更后置）"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_tools_dashboard_stats.py"
      ci:
        - ai-agent-tests.yml
      verifies: []
