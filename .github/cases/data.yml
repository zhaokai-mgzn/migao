  - id: DA-021
    legacy_id: ""
    title: "日报卡片面「proactive 四态」可视化：让「今天为什么没有提示」逐规则可见（issue #5955）"
    domains:
      - data
    tier: normal
    tags:
      - proactive
      - briefing
      - card
      - ui
    truths_ref:
      - dashboard-jump.proactive-status-card
      - dashboard-jump.proactive-wiring-status
    user_inputs:
      - "经营日报卡片面自检（主动检查面板）"
    expectations: []
    data_checks:
      - "卡片面**逐规则一行**显示状态 + **原因**，四态各有各的说法：`wired` = 「已检查、无命中」；`not_wired` = 「系统尚未接入」（**不可行动**）；`not_enabled` = 「你还没开启」+ 开启引导（**可行动**，与「尚未接入」**分开说、不合并**）；`incomplete` = 「本次数据不完整」。**互斥红**：某规则未接线的快照 ⇒ 具名报出该规则 + 原因（**不是**「今天没问题」）；规则齐全且无命中的快照 ⇒ 「已检查、无命中」且**不出现**任何未接线/没开启/不完整的措辞；把状态注入摘掉（或把面板渲染摘掉）⇒ 两条判据分别变红"
      - "`wired` 的规则其 `caveats`（数据源固有边界，如审计 fail-open）**也必须在场**（不许因为「绿」就不显示边界）；`proactive_status` 为 NULL / 缺失（本列面世前的存量行）⇒ **不渲染**该面板（未知 ≠ 没问题，也不许用空壳冒充「已检查」）"
      - "🔴 **状态字段不来自 LLM 出口**：`sanitize_briefing` 是**白名单**（只返回 summary/review/todo/risks/suggestions）⇒ 把 `proactive_status` 塞进 LLM 输出**被丢弃是预期**（断言对象），而**挂载点之后**的注入必须成功；挂上去的值 = 引擎 `proactive_status(snapshot)` 的**原样**（零重算、零改写、不改快照），且 admin-api 侧**数值回填校验层不得把它对账掉**（它不是数字、也不许混进 content）"
      - "跨端契约：键名 `proactive_status`、规则 id（`below_cost_price`/`unshipped_overdue`/`low_stock`/`repeat_returns`/`price_change_over`/`discount_over`）与四个枚举值（`wired`/`not_wired`/`not_enabled`/`incomplete`）三端一致；卡片面**只读** —— 面板内无任何按钮/链接（不给「一键处置」入口）"
    skip_reason: "[backend-contract] 卡片面渲染与挂载点由三端确定性单测验证（ai-agent：tests/test_briefing_proactive_status_visibility.py；admin-api：DailyBriefingServiceTest 的 ProactiveStatusPassThrough / BriefingControllerTest 的 GetToday；admin-web：tests/unit/components/ProactiveStatusPanel.test.tsx + tests/unit/components/BriefingProactiveStatus.test.tsx），非 LLM 行为，不进入 agent-eval 冒烟"
    merge_log: "2026-10-02 新增（issue #5955）：日报卡片面 proactive 四态可视化（对话面此前已具备、卡片面零渲染）。取号 DA-021：现取 .github/cases/ 最大号 = DA-020（main ∪ 全部在飞 ref，逐 ref 核过，见 PR body）。**未覆盖面（如实登记）**：Playwright 页面多模态验收（真实登录 + 截图 + AI 读图）由集成方收口，本包不跑；面板在真实浏览器下的排版/对比度不在本单确定性判据面内。"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_briefing_proactive_status_visibility.py"
        - "backend/admin-api/src/test/java/com/migao/admin/service/DailyBriefingServiceTest.java"
        - "backend/admin-api/src/test/java/com/migao/admin/controller/BriefingControllerTest.java"
        - "frontend/admin-web/tests/unit/components/ProactiveStatusPanel.test.tsx"
        - "frontend/admin-web/tests/unit/components/BriefingProactiveStatus.test.tsx"
      ci:
        - pr-check.yml
      verifies: []

  - id: DA-023
    legacy_id: ""
    title: "商品健康度的「空」必须归因到商品状态：有 SKU 却被「在售」口径过滤（issue #6347 Part B）"
    domains:
      - data
      - product
    tier: normal
    tags:
      - briefing
      - product_health
      - attribution
      - snapshot
    truths_ref:
      - dashboard-jump.proactive-wiring-status
      - dashboard-jump.proactive-unwired-disclosure
    user_inputs:
      - "商品健康度里是不是没有建 SKU？"
    expectations:
      - tool: briefing_query
        args:
          view: product_health
    # forbidden-text-intent: 本用例的被测行为**就是**「归因错误」这条禁令 —— #6347 的用户真实遭遇是米宝
    # 拿空数组回答「SKU 记录数 = 0 / SKU 层是空的 / 建议先确认商品规格是否已录入」，把用户引向**徒劳返工**
    # （重录规格），而真因（商品状态不在 on_sale）一字未提。禁令与原因/出路断言成对，缺任一半都不算覆盖。
    forbidden_text:
      - "SKU 记录数 = 0"
      - "SKU 记录数为 0"
      - "SKU 层是空的"
      - "SKU 层为空"
      - "建议检查商品规格"
      - "建议先确认商品规格"
      - "没有 SKU"
      - "没有任何 SKU"
    data_checks:
      - "🔴 快照侧的**过滤事实**必须透出（`row_meta.skus`）：`rows_before_filter` = 过滤前本数组查询命中的行数、`filtered_out` = 被排除的行数、`filtered_by_status` = 被排除商品的状态 × SKU 数、`filtered_product_ids` = 被排除的商品 id（有界）。**没有它，空数组在引擎侧与「表里真的没有 SKU」不可分** —— 这正是本单的成因（判据：删掉这些键 ⇒ 引擎断言必红）"
      - "🔴 引擎侧**两种「空」可分**：过滤前 > 0 且过滤后 = 0 ⇒ 所有 `skus` 来源字段（`sales_count`/`stock`/`gross_margin`）落 **`not_on_sale`**（与 `not_wired`/`incomplete` **并列、不可合并**，`reason` 非 None）；真正未接线（无 `skus` 行数组）仍落 `not_wired`；退货率（另一对行数组）不受影响 ⇒ 逐字段可分"
      - "原因与出路逐字落地：说清「有 N 个 SKU（M 个商品）**因未上架未纳入**」+ 被排除商品的**状态分布**；状态在状态机内（`off_sale`/`draft`）⇒「上架即可」；状态不在状态机内（如 `active`/`on_shelf`）⇒ 点出**上架动作会被拒**、需先改回 `off_sale`/`draft` 再上架（Part A 已让这条恢复边可走）；装配层读不到商品行（`unknown`）⇒ **不猜**出路，只说先核实"
      - "🔴 **消息是模型的唯一输入源**：工具消息（`briefing_query` 的 `view=product_health`）必须含上述原因与出路，且**不得**出现任何 `forbidden_text` 表述；对照读数：没有过滤事实的空快照 ⇒ 退回旧口径（`not_wired`），**不得**改写成「被过滤」"
    skip_reason: "[backend-contract] 快照装配由 admin-api 单测验证（DailyBriefingServiceTest 的 SnapshotRows 两条新判据：过滤事实透出 / 未过滤时不挂空集合）；引擎与工具披露由 ai-agent 单测验证（tests/test_briefing_product_health.py 的 TestFilteredSkusAreNotMisattributed、tests/test_tools_briefing_query.py 的两条），非 LLM 行为，不进入 agent-eval 冒烟"
    merge_log: "2026-10-05 新增（issue #6347 **Part B**，与 Part A「商品 status 枚举准入」同单不同包）：租户 25 有 12 行 product_skus 而「商品健康度视图」返回 0 行 —— 那 10 行 SKU 属 8 个状态为 active 的商品，被快照的 onSaleProductNames 静默过滤；米宝据此答「SKU 记录数 = 0 / SKU 层是空的 / 建议先确认商品规格是否已录入」= **归因错误**，用户被引向徒劳返工。取号 DA-023：现取 .github/cases/ 最大号 = DA-021（main ∪ 全部在飞 ref，逐 ref 核过，见 PR body；DA-022 已被在飞 PR 占用）。**未覆盖面（如实登记）**：真实 LLM 行为面（米宝用这条消息怎么措辞）**不进 agent-eval 计分**（本条 `skip_reason` = `[backend-contract]`，`forbidden_text` 因此**不会被执行**）—— 本单钉的是**载荷**（引擎 + 工具消息）与**快照读数**。⚠️ 为什么不做成可跑用例：评测栈租户 = 1，种下的商品（**逐文件现取**：`tests/agent_eval/fixtures/mibao_eval_seed.sql` **1 个** `prod_eval_2699` + `tests/agent_eval/fixtures/xiaobu_eval_seed.sql` **3 个** `prod_eval_blackout` / `prod_eval_dark_green` / `prod_eval_summer`，合计 4 个；两文件里商品 `status` 字面量实测 `'on_sale'` × 4，无其它取值）全是 `on_sale` 且 SKU 非空 ⇒ **复现不出**「过滤前 > 0、过滤后 = 0」；要复现就得把那批商品的 SKU 全推到非法状态，而 `product.yml` / `data.yml` 的存量用例正在用它们（改前须先跑全量断言确认不误伤）⇒ 本包取**人工复算配方**（写在 PR body「LLM 侧人工复算配方」段：前置状态 + 命令 + 期望读数），真要跑时由人手动集中跑一次（用户裁定：不自动派发评测）。"
    traces:
      tests:
        - "backend/admin-api/src/test/java/com/migao/admin/service/DailyBriefingServiceTest.java"
        - "backend/ai-agent-service/tests/test_briefing_product_health.py"
        - "backend/ai-agent-service/tests/test_tools_briefing_query.py"
  - id: DA-022
    legacy_id: ""
    title: "缺料风险视图：material_shortage（商品级需求 vs SKU 权威库存）的缺口分层与「未知≠0」披露（issue #6280）"
    domains:
      - data
      - product
      - order
    tier: normal
    tags:
      - query
      - tool
      - cross-domain
      - material-shortage
      - disclosure
    persona: mibao
    truths_ref: []
    user_inputs:
      - "哪些商品会被未完成订单吃空"
      - "缺料风险 / 缺口多少米"
    expectations:
      - tool: inventory_manage
        args:
          action: material_shortage
    data_checks:
      - "只读且不回归：material_shortage 在 VALID_ACTIONS 与 read_only_actions 里；**不传 action 时仍是旧的 query 行为**（默认值不许被新 action 改掉）；未知 action ⇒ 无效操作类型（不猜）"
      - "取数面 = 只读端点 GET /api/admin/materials/shortage（权限码 product:list）：需求 = SUM(order_items.quantity) WHERE orders.status ∈ statuses **且 products.unit = '米'**（单位真值在**商品档案**，不在 order_items.selling_method）；供给 = **SUM(product_skus.stock) GROUP BY product_id** —— 🔴 **不读** products.stock（派生冗余列，实测与 SKU 合计差 3.3%）；租户闸两侧都在、软删逐表过滤"
      - "🔴「未知 ≠ 0」：单位不可比的商品 ⇒ demand_qty = **null** + risk_band = unknown（**不是 0**）；真 0 需求（有订单行、可比、合计 0）⇒ 照实 0 且与前者**可分**；non_comparable.lines / products 必须披露。红证：把「不可比」填成 0 ⇒ 必红"
      - "🔴「交期未知 ≠ 今天到期」：days_to_deadline = null ⇒ **不得回填 0**；「缺口确定、紧迫性未知」落 short **单列**，**不得并进 critical**。红证：把 null 填成 0 天 ⇒ 分层与同一断言必红（实测 dev 库未完成订单交期填充率 = 0，今天这一档会占满 —— 那是**正确**输出）"
      - "六档分层 blocked / critical / soon / short / safe / unknown（阈值 3 / 7 天进 basis 可复算）；输出行序 = 分层降序 → gap 降序 → product_id 升序 ⇒ 同一快照**逐字相同**；聚合用**全量行**（band_counts / non_comparable 不随 limit 变）；limit 非法值显式 400，truncated ⇒ 每个有真值字段落 incomplete + 可归因读数"
      - "逐字段三态：status ∈ wired / not_wired / incomplete，不变式 **reason is None ⟺ status == wired**。v1 的 rate_per_week / exhaust_date 一律 not_wired + 具名理由（真值存在于台账但装配层未接线：真实周桶深度 2 周 < 要求 8 周）；history_depth.sufficient = false 时**禁止硬算、禁止回填 0**"
      - "披露纪律（工具面）：工具**必须用人话说出**「预测层未启用：历史深度 N 周 < 8 周」与单位不可比计数，**不得**静默省略、**不得**把 null 说成 0；端点失败 ⇒ fail-closed + 点名 product:list + 可行动建议，**不得**用空列表冒充「没有缺料」（「没查」与「没问题」必须可分）"
