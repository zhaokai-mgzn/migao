  - id: PR-016
    legacy_id: ""
    title: "建品流程 - 分类确认后按适用商品分类过滤/优先推荐加工项"
    domains:
      - product
    tier: normal
    tags:
      - processing_item
      - product_category
      - guided_flow
      - recommendation
    truths_ref:
      - product-sku-stock.create-flow
      - processing-manage.crud
    user_inputs:
      - "录入这个商品，名称E2E建品流程样品帘，价格 100"
      - "分类选窗帘"
      - auto_select: true
      - auto_fill:
          colors: "米白色"
          selling_methods: "散剪"
          sku_code: "TEST-002"
      - "已选加工项：高温定型"
      - "颜色米白色，货号 TEST-002"
      # 收尾 = 「答卡轮」（#3518）：B 端写工具受 confirm 门禁约束 —— **发文字「确认」≠ 点确认卡**，
      # 收尾发裸文本时 agent 会停在卡上（回「请核对上方确认卡片…点确认我就执行」）→ product_manage 不执行。
      # `auto_respond`：有卡答卡（confirm→回卡片 confirmValue，= 前端点击协议；choice→首项；
      # form→按声明值回填），无卡才发原文「确认」（同 CU-003 / OR-014 先例）。
      # ⚠️ 不用 `auto_select`：它**不支持 fallback 字段**（run_case 只把 results + case_form_values
      # 传进 resolve_auto_select_turn，见 local_runner.py）。两者都能答 confirm/choice 卡，
      # 但 auto_select 在没有待答卡时会发字面量「第一个」（对不上任何卡片），
      # 而收尾轮需要保留原文「确认」的兜底语义 → 用 auto_respond 才能两者兼得。
      - auto_respond:
          fallback: "确认"
    # 全局命名空间声明（issue #3781）：本用例**往全局商品命名空间里写**该名称。
    # ⚠️ 隔离的判据是「**≥2 条用例声明同一键**才进串行道」
    # （`local_runner.namespace_conflict_groups` 只收这样的键）⇒ **单一声明者 = 零隔离**。
    # 旧值 `product_name:遮光窗帘` 之所以"看起来有隔离"，只是因为 PR-005/PR-007/CR-001/
    # CR-003/OR-015 恰好也声明了它 —— 而**真正按名读它的 PP-001/PR-017/OR-014/OR-016/
    # OR-017/OR-018… 都没声明**，于是它们与 PR-016 真并行（这就是 issue #3835 的病灶）。
    namespaces:
      - "product_name:E2E建品流程样品帘"
    # ── 商品名必须**用例自有**（issue #3835 的跨用例污染根治）─────────────────────
    # 旧输入是「录入这个商品，名称遮光窗帘，价格 100」，而**种子商品 `prod_eval_blackout`
    # 就叫「遮光窗帘」**（`tests/agent_eval/fixtures/xiaobu_eval_seed.sql`）⇒ 本用例在运行期
    # 往共享命名空间里造出**第二件同名商品**。库级铁证（判定跑 run 34908262839 的 admin-api
    # 日志）：`23:37:45.569 创建商品成功: id=d7d3dd98… name=遮光窗帘` →
    # `23:40:46.327 删除商品成功`；而 PR-016 自己的窗口是 `23:35:40 → 23:37:49`
    # ⇒ **副本在写方结束后还活了 ≈3 分钟**。该窗口内起跑的 PR-004 / PR-021 / CH-007 /
    # OR-010 / OR-011 / OR-028 全部 `product_search(products=2)`，首跑失败指纹 `PP-001` /
    # `PR-017` / `OR-014` 都是「见 2 件同名 → agent **正确地**要求澄清 → 写工具永不执行」。
    # ⇒ **串行化与 product_dedupe 都修不好这一类**（前者只防重叠、防不住写方结束后的残留；
    # 后者只在自己起跑前去重、管不了运行中途别人造出来的副本）。只有"写方不去写共享名"能根治。
    #
    # 自清理（issue #3800 + #3835）：用例自建对象必须能把前置复位成「**不存在**」。
    # 旧值 `product_dedupe{遮光窗帘}` 是"保留最早创建（= 种子）"—— 那是**共享名**下唯一安全的
    # 选择，但代价是它永远留下 1 件、且运行期全程对外可见。自有名之后语义才干净：
    # `product_remove{自有名}` 在**每次尝试前**把本用例的产物删净 ⇒ 首跑与重试的前置
    # **都是「不存在」**（`_PRECONDITION_NOT_APPLIED` 对清理型是良性 no-op，
    # 见 `_PRECLEAN_CLEANUP_TYPES`）。
    # ⚠️ `product_remove` 是**子串**匹配 ⇒ 自有名必须保证"没有任何其它用例的商品名包含它"
    # （已由 `tests/unit_ci_workflows/test_eval_product_name_pollution.py` 的静态不变式锁定）。
    pre_clean:
      - type: product_remove
        product_keyword: "E2E建品流程样品帘"

    expectations:
      - tool: category_manage
      - tool: processing_item_query
      - tool: interact
        args:
          component: choice
          multiSelect: true
      - tool: validate_input
      - tool: product_manage
        args:
          action: create
    required_args:
      - tool: processing_item_query
        fields:
          - applicable_category_id
    # ── 效果层下沉（issue #4042，LLM 红例 run 35243351675 / 35071344830 首跑指纹
    # `no_success(product_manage)`）──
    # 改前本用例**零效果层断言**：`data_checks` 四条全是自然语义散文（不计分），
    # 其中「最终创建成功且关联加工项数量正确」在 runner 里**没有任何一条机器判据** ——
    # 建品失败（工具从未成功）时用例照旧能满分。
    must_succeed:
      - tool: product_manage
        action: create
    # ⚠️ 落库层（关联加工项数量）**未在此声明**：`db_verify[product_by_name]` 现只支持
    # `processingItemConfigs.<名>.<字段><op><值>` 谓词，且「关联了哪几项」取决于 agent
    # 当轮选择 —— 直接断言会引入新的行为口径（本轮只做"建成功"这一条无争议的效果层下沉）。
    # 该能力缺口如实登记，不假装覆盖。
    precondition:
      - type: product_count_for_keyword
        source: "E2E建品流程样品帘"
        expect: 0
    data_checks:
      - "分类确认后加工项选择器按「适用商品分类」过滤展示（processing_item_query 携带 applicable_category_id，= 已选商品分类 ID）"
      - "适用分类为空（applicable_product_categories 为空）的加工项仍展示（= 适用所有分类），不因过滤而丢失"
      - "当前分类无匹配加工项时以文字提示可跳过，不空转强制选择"
      - "最终创建成功：机器断言见 must_succeed[product_manage(action=create)]（写成功）；「关联加工项数量正确」本轮**仍无机器判据**（db_verify 只支持 processingItemConfigs 谓词），已在 merge_log 登记为能力缺口"
    skip_reason: ""
    merge_log: "2026-09-06 新增（issue #2964）：加工项「适用商品分类」配置此前无消费方，建品流程按已选分类过滤/推荐加工项（设计意图见 docs/design/admin-dashboard-design.md §6.1.1 适用商品分类+AI推荐）。2026-09-14 校准（#3518）：收尾裸文本「确认」改答卡轮（B 端 confirm 门禁：文字≠点卡）；2026-09-15 补自清理（issue #3800，判定跑 run 34865780382 实证）：本用例建的同名商品与种子 `prod_eval_blackout`（遮光窗帘）撞名，而 `namespaces` 只保证并行互斥、不解决重试前置等价性（#3751 的复位按 pre_clean opt-in）⇒ 首跑建出的那件留到重试 ⇒ agent 正确拒绝建重复 ⇒ 指纹漂移误判 unstable（首跑指纹无 `no_success(product_manage)`、重试指纹有，即铁证）⇒ 补 `product_dedupe{遮光窗帘}`（保留最早创建 = 种子）；**不能用 product_remove**（子串删全部 ⇒ 会连种子一起删，而它是 PR-005/PR-007/CR-001/CR-003/OR-015 的共享前置）；expectations/required_args/data_checks 原样未动；2026-09-17（issue #3835）输入商品名改为**用例自有**（`E2E建品流程样品帘`）+ `pre_clean[product_remove 自有名]`（根治跨用例同名污染）；2026-09-18 下沉（issue #4042）：补 must_succeed[product_manage(action=create)] + precondition[product_count_for_keyword expect=0]（清掉 CASE-TRUST-NO-EFFECT-ASSERTION / CASE-TRUST-NO-PRECONDITION-ASSERTION 两条存量违规）；「关联加工项数量正确」仍无机器判据（db_verify 只支持 processingItemConfigs 谓词），如实登记为能力缺口"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_tools_processing_item_query.py"
      ci:
        - agent-eval.yml
      verifies: []

  - id: PR-017
    legacy_id: ""
    title: "商品创建/更新/详情透传「退货回补库存」开关（allow_return_restock）"
    domains:
      - product
      - aftersales
    tier: normal
    tags:
      - inventory
      - write
      - cross_skill
    truths_ref:
      - product-sku-stock.aggregate
      - product-sku-stock.realtime
      - aftersales-flow.return-restock-switch
    user_inputs:
      # 2026-09-14 消除顺序依赖 / stale 点名归一（issue #3568，同 PR-010/PR-005 #3518 口径）：
      # 原输入点名「遮光窗帘（**100元**的那件）」—— 评测栈种子（xiaobu_eval_seed.sql）的
      # 遮光窗帘是 **¥168**（prod_eval_blackout），没有 100 元那件 → agent 合理地澄清
      # 「只搜到一件遮光窗帘，价格是 168 元，不是 100 元」（run 34805827043 实测）
      # → 白耗一轮且写工具可能到不了。去掉价格限定（点唯一商品名），用例意图不变。
      - "把遮光窗帘设置成退货后可以回补库存"
      # 收尾「答卡轮」（#3518 口径，同 PR-005/PR-016）：**裸文本「确认」不放行写操作**
      # （文字 ≠ 点卡）→ 有卡答卡（confirm→回 confirmValue；choice→首项），无卡才发原文。
      # 原 `auto_select: true` 在没有 choice 卡时会退化成发字面量「第一个」（对不上卡片）。
      - auto_respond:
          fallback: "确认"
    pre_clean:
      # 去重只按关键词（同 #3538/#3518）：原 `price` 限定在种子 ¥168 的栈上恒不匹配
      # （`matched<=1` → 直接返回「无需去重」= **没去重**）；同名副本存在时 agent 会发
      # 「哪一件」选择卡，写操作落到不确定的那一件上。
      - type: product_dedupe
        product_keyword: "遮光窗帘"
    # ── 前置自断言（issue #3835 / `migao-dev-flow` §18.4）────────────────────────
    # 本用例靠**商品名**定位唯一的写对象：有 2 件同名时 agent **正确地**澄清（判定跑
    # run 34908262839 首跑原文：「搜索到 **2 个**同名「遮光窗帘」，需要您确认改哪一个」）⇒
    # `product_update` 永不执行 ⇒ 判红成 `no_success(product_update)`，读起来像
    # 「agent 不改商品」（同 run 重试 `products=1` 即通过）。
    # `pre_clean` 只在**自己起跑前**去重，挡不住运行中途由别的用例造出来的副本 ⇒
    # 必须由 runner 在运行期观测：`expect: 1` 判基线（上一跑残留），`max_growth` 默认 0
    # 判"被并行用例中途改写"。前置不成立时折成
    # `precondition_not_applied(declared:product_count_for_keyword)`，与行为失败分属不同根因原子。
    precondition:
      - type: product_count_for_keyword
        source: "遮光窗帘"
        expect: 1
    expectations:
      - tool: product_update or product_manage
        args:
          allow_return_restock: true
    data_checks:
      - "商品详情/列表返回 allowReturnRestock（默认 false，开启后为 true）"
      - "售后工单 refund/return 完结时按商品开关决定是否回补 SKU 库存"
    skip_reason: ""
    merge_log: "issue #2991 新增：窗帘行业定制退货不可再售，商品级开关控制售后完结是否回补库存。2026-09-14 归一（issue #3568）：① 输入去「（100元的那件）」stale 价格点名（种子遮光窗帘 ¥168，实测 agent 合理澄清白耗一轮，同 #3538/#3518）；② 收尾 `auto_select: true` → `auto_respond` 答卡轮（无卡时 auto_select 会发对不上卡片的字面量「第一个」）；③ 补 pre_clean product_dedupe（只按关键词，不带 price 限定）"
    traces:
      tests:
        - "backend/admin-api/src/test/java/com/migao/admin/service/ProductServiceTest.java"
        - "backend/admin-api/src/test/java/com/migao/admin/service/AfterSalesTicketServiceTest.java"
      ci:
        - agent-eval.yml
      verifies: []

  - id: PR-018
    legacy_id: ""
    title: "B端米宝 product_list 卡片引用对齐 — 只渲染回复文本中实际引用的商品"
