# cases/product.yml — 商品/库存/创建流程用例（并源转换）
#
# 标准：外部契约标准 16-case-contract（schema v1.0）
# 来源：eval P001~P007 + M001/M002/M003 + verification 2.1~2.9
# 并源结果：18 个源用例 → 12 条（1:1 合并 3 对，M 系列并入创建流程组）
# 校验：python3 .github/truths.py check --templates .github/templates --cases .github/cases

schema: "case-contract/1.0"
domain: product

cases:
  - id: PR-001
    legacy_id: P001
    title: "商品搜索 - 关键词模糊匹配"
    domains:
      - product
    tier: smoke
    tags:
      - search
      - smoke
    truths_ref:
      - product-sku-stock.status-flow
    user_inputs:
      - "搜索遮光窗帘"
    expectations:
      - tool: product_search
        args:
          keyword: 遮光窗帘
    # ── 产出侧下沉（issue #4025 F16，承接 #4042 的 OR-001/OR-002 同族修法）──
    # 原 `data_checks: - "data.products.length > 0"` 是**装饰性断言**：
    #   ① 不含机器计分关键词（`success=true` / `error.code=` / `未被调用` / `not called`）
    #      ⇒ 纯散文**不计分**；② runner 也无从判定 `data` 指哪一次调用的 payload。
    # ⇒ 「搜索被调用过」就等于满分，「到底搜出东西没有」不可见。语义等价地升级成**可失败**的
    # 机器断言：搜索结果必须非空（空列表 / 从未成功调用 ⇒ 判红）。
    # 可满足性（两条腿都核过）：种子恒有 `prod_eval_blackout`（遮光窗帘，在售）；
    # 唯一会改它在售状态的是 PR-007/PR-025（**mibao 腿专属**，且均已在下架后复位），
    # xiaobu 腿不跑它们 ⇒ 两腿都恒可搜到。
    output_verify:
      - tool: product_search
        expect:
          products: __nonempty__
    data_checks:
      - "搜索必须真的返回商品（机器断言见 output_verify：products 非空）—— 原 `data.products.length > 0` 不计分，已弃用"
    skip_reason: ""
    merge_log: "eval P001 + verification 2.1（同义，取 eval 版）；2026-09-18 下沉（issue #4025 F16）：纯散文 `data.products.length > 0` 不计分（无机器计分关键词）⇒ output_verify(product_search 的 products 非空)"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_tools_product_search.py"
      ci:
        - agent-eval.yml
      verifies: []

  - id: PR-002
    legacy_id: "2.2"
    title: "商品搜索 - 按库存状态筛选"
    domains:
      - product
    tier: normal
    tags:
      - search
      - filter
    truths_ref:
      - product-sku-stock.low-stock
    user_inputs:
      - "有哪些缺货的商品"
    expectations:
      - tool: product_search
        args:
          stock_status: out_of_stock
    # ── 产出侧下沉（issue #4025 F16）──
    # 原 `data_checks: - "data.products.length >= 0"` 是 OR-002 的同族形态：**恒真 + 不计分**
    # ⇒ 结构上不可能红。本用例的产物侧真值**是"空"**（种子 4 件商品 stock 全 > 0：
    # 遮光窗帘 1000 / 北欧风窗帘 800 / 夏日清风窗帘 600 / 2699系列 1000），
    # 故不能照抄 `__nonempty__`（那会造一条**恒红**）。改为断言**过滤器真的生效**：
    # `total` 必须为 0 —— 过滤条件被忽略（如只按关键词检索、下发 stockBelow 失败、
    # 后端口径漂移）⇒ total > 0 ⇒ 判红。这是 arg 级 `expectations` **看不见**的产出侧事实。
    output_verify:
      - tool: product_search
        expect:
          total: 0
    data_checks:
      - "「缺货商品」查询必须真的按库存过滤（机器断言见 output_verify：total == 0，= 种子无库存≤0 商品的可判定事实；过滤被忽略 ⇒ total>0 ⇒ 判红）—— 原 `data.products.length >= 0` 恒真且不计分，已弃用"
    skip_reason: ""
    merge_log: "verification 2.2 独有；2026-09-18 下沉（issue #4025 F16）：原 `data.products.length >= 0` 恒真且不计分（OR-002 同族）⇒ 升级为 output_verify(total == 0)——本用例产物侧真值本就是「空」，故断言的是**过滤器生效**而非「非空」（避免把恒真换成恒红）"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_tools_product_search.py"
      ci:
        - agent-eval.yml
      verifies: []

  - id: PR-003
    legacy_id: P002
    title: "商品详情 - 通过名称查询（ID 解析）"
    domains:
      - product
    tier: smoke
    tags:
      - detail
      - id_resolve
      - smoke
    truths_ref:
      - id-resolve.name
      - id-resolve.no-fabricate
      - product-sku-stock.aggregate
    user_inputs:
      - "查看遮光窗帘的详细信息"
    expectations:
      - tool: product_detail
        args:
          product_id: 遮光窗帘
    data_checks:
      - "data.name.length > 0"
      - "data.skus.length > 0"
    skip_reason: ""
    merge_log: "eval P002 + verification 2.3（同义）"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_tools_product_detail.py"
        - "backend/ai-agent-service/tests/test_id_resolver.py"
      ci:
        - agent-eval.yml
      verifies: []

  - id: PR-004
    legacy_id: "2.4"
    title: "查库存"
    domains:
      - product
    tier: normal
    tags:
      - inventory
      - query
    truths_ref:
      - product-sku-stock.aggregate
      - product-sku-stock.realtime
    user_inputs:
      - "遮光窗帘还有多少库存"
    expectations:
      - tool: inventory_manage
        args:
          action: query
    data_checks:
      - "库存数量 = SUM(SKU 库存)"
    skip_reason: ""
    merge_log: "verification 2.4 独有"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_tools_inventory_manage.py"
      ci:
        - agent-eval.yml
      verifies: []

  - id: PR-005
    legacy_id: "2.5"
    title: "调整库存 - 出库"
    domains:
      - product
    tier: normal
    tags:
      - inventory
      - write
    truths_ref:
      - product-sku-stock.realtime
    user_inputs:
      # 自包含化（#3518）：原输入点名「遮光窗帘（100元的那件）」，独立栈种子只有 ¥168 那一款
      # （prod_eval_blackout）→ 实测 agent 回「只搜到一件「遮光窗帘」，价格是 168 元，不是 100 元」
      # （run 34805827043），把一轮消耗在澄清价格上、`inventory_manage(adjust)` 从未调用。
      - "调整遮光窗帘的库存，出库10件，备注样品寄出"
      # 收尾「答卡轮」（#3518，同 PR-016）：本 run 里 agent 在收尾轮只发 confirm 卡、文本「确认」
      # 没有放行写操作 → 有卡答卡（confirm→回 confirmValue），无卡才发原文「确认」。
      - auto_respond:
          fallback: "确认"
    # 全局命名空间声明（issue #3781）：与同样争用该全局资源的用例自动互斥，
    # 消除「同栈并行用例互相写同一命名空间」造成的非确定性（真实 run 34856561459）。
    namespaces:
      - "product_name:遮光窗帘"

    expectations:
      - tool: inventory_manage
        args:
          action: adjust
    data_checks:
      - "返回新库存数量"
    pre_clean:
      # 去重只按关键词（#3518）：用例已不再点名价格，`price: 100` 过滤器在独立栈（种子 ¥168）
      # 恒不匹配、等于没去重 → 同名「遮光窗帘」重复时 agent 会发「哪一件」选择卡。
      # 按关键词去重保留最早创建的（= 种子），删掉其余副本。
      - type: product_dedupe
        product_keyword: "遮光窗帘"
    skip_reason: ""
    merge_log: "verification 2.5 独有（adjust 详细真值未确认，见映射表 5.1）。2026-09-14 校准（#3518）：① 输入去「100元的那件」价格点名（独立栈种子 ¥168）；② 收尾改答卡轮；③ pre_clean 去 price 过滤（关键词去重）"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_tools_inventory_manage.py"
      ci:
        - agent-eval.yml
      verifies: []

  - id: PR-006
    legacy_id: "2.6"
    title: "低库存预警"
    domains:
      - product
    tier: normal
    tags:
      - inventory
      - alert
    truths_ref:
      - product-sku-stock.low-stock
    user_inputs:
      - "看看哪些商品库存不足"
    # ── 等价路径（issue #3781；真实 run 34856561459 的 PR-006 假红）──
    # 病灶：原用例只认 `inventory_manage(action=low_stock_alert)` **一条实现路径**，
    # 而"低库存"在产品里有**两条都被文档认可**的工具路径：
    #   · `product_search(stock_status=low_stock)` = **库存≤100**
    #     （`app/tools/stock_semantics.py` 的 `LOW_STOCK_THRESHOLD`；工具参数文档
    #      「low_stock=库存≤100（与后台低库存口径一致）」）
    #   · `inventory_manage(action=low_stock_alert)` 的 `threshold` —— 历史 schema/文档写
    #     「默认 10」、`_low_stock_alert` 形参却默认 100（曾三处口径不一致）
    # ⚠️ 上述**产品级语义冲突已由 issue #3783 收敛**（不属评测范围，已在评测侧消除）：
    #    两工具共用单点来源 `app/tools/stock_semantics.py`（权威口径 100、上界含），
    #    `inventory_manage` 的 schema 描述与 `default` 均由该来源生成（不再有第二处数字）。
    # 本 run 实测：agent 走 `product_search`，工具返回 `products=4 total=4`，原文
    # 「📦 库存偏低（≤100 件）的商品共 4 件」—— 被产品文档认可的等价路径，却被判 0%
    # （`inventory_manage(action=low_stock_alert) → unmatched expectation`）。
    #
    # 修法（**零阈值放宽、零断言删除**）：**一条 OR 声明** = 「用其中任一工具按各自的
    # 口径字段查出低库存」。`_check_expectation` 原生支持 `A or B`（AS-003 的
    # `after_sales_manage or aftersale_create` 即同形）；`_arg_mismatch_reason` 的
    # 判据是"OR 任一分支持有该键**且值相等**"⇒ `stock_status=low_stock` 只对
    # `product_search` 分支生效、`action=low_stock_alert` 只对 `inventory_manage` 分支生效。
    #
    # ⚠️ **不能**写成两条独立声明：runner **逐条**计分（`score = 通过条数/声明条数`，
    # 见 `run_case` 的 `passed_expectations/total_exp`），一次运行只可能走一条路径
    # ⇒ 两条独立声明的用例**恒为 50%**（本包实测复现）。
    # ⚠️ **不能**用 `must_succeed` 给两条路径各写一条：它也是**合取**（每条都必须成功、
    # 无 OR 语义）⇒ 同样的恒红（本包第一版踩过，负向夹具照出）。
    # ⇒ 一次运行"只用一条路径"这件事由**语义**保证（agent 回答一个问题不会两条都调）；
    #   若将来要**机器强制**，需要 runner 支持"OR 断言组"或"args 级 OR"，属 runner 包范围，
    #   已登记在 #3781（不能为了这条用一个恰好能跑通的近似写法冒充强制）。
    # ⚠️ **已知的等价路径不完整（如实登记，未掩盖）**：`must_succeed` 声明的是
    #   `product_search`（本 run 实测走通的那条），故若某次运行改为走
    #   `inventory_manage(low_stock_alert)`，`expectations` 会过（OR 分支）而
    #   `must_succeed` 会红 —— 该次红**不是** agent 做错，而是**断言层尚不支持
    #   "任一路径真成功"（OR 成功组）**。本包**无法离线判定**下次 run 走哪条
    #   （需真实 LLM），故不猜：如实写在这里 + PR body 的「存疑项」+ #3781 登记。
    #   若下次全量 run 显示 agent 稳定走 `product_search`（= 本声明正确），无需改动；
    #   若它改走 `inventory_manage`，正解是补 runner 的 OR 成功组能力（runner 包），
    #   **不是**把这条 `must_succeed` 删掉（删掉即回到"调了≠成了"的假绿）。
    # ⚠️ **每条 OR 分支必须带自己的 args**（写成一条 `tool+args` 会变成"两个键都要"：
    # `_arg_mismatch_reason` 按**单一** args 字典逐键校验，`product_search` 没有 `action`
    # 字段 ⇒ `missing arg 'action'` ⇒ 两条路径全红）。故此处用 runner 的
    # `tool(k=v)` 文本形态，每条分支各自的键集（与 AS-003 的
    # `after_sales_manage or aftersale_create(order_id=复用上轮 UUID)` 同形）。
    expectations:
      - "inventory_manage(action=low_stock_alert) or product_search(stock_status=low_stock)"
    # 「调了」≠「成了」（#3361 同族）：`check_expectation` **不读 `success`** ——
    # 实测把「工具返回 500」喂进去，`product_search` 分支仍判 True。故独立补一层
    # "真有**一次成功**"的断言（`must_succeed` 只按工具名过滤、不读 args，正好与 OR
    # 声明互补：OR 声明承担"哪条路径 + 关键值"，它承担"路径真的成功了"）。
    # 声明两条会因合取语义导致恒红，故取一条；**该条必须与用 args.action 的 OR 分支解耦**：
    # `product_search` 无 `action` 字段，若声明 `action=low_stock_alert` 则永远匹配不到它。
    must_succeed:
      - tool: product_search
    # ⚠️ **此处刻意不声明 `required_args[product_search.stock_status]`**：`required_args`
    # 同样是**合取**（每条都必须满足），而 `inventory_manage` 分支**没有** `stock_status`
    # 字段 ⇒ 加了它，走 `inventory_manage` 的那次运行会因"未调用 product_search"判红 ——
    # 正是本用例要消除的"过度指定"，只是换了个字段（本包实测照出）。
    # ⇒ payload 层的键**在场**由 OR 声明的分支键集承担（`stock_status`/`action` 各自必须在
    #   **对应分支**的调用里在场且值相等，见 `_arg_mismatch_reason`）；"值真的传对了"由
    #   负向夹具照红（见 PR body 红证表：改错口径值 / 漏带键 / 工具失败 三种都判红）。
    # ── 数值有据的来源（为什么这里没有额外的机器断言）──
    data_checks:
      - "报告的低库存商品数 = 该路径工具返回的条数（product_search: data.products/total；inventory_manage: data.count）—— 数值必须有据，不得凭空给数（本 run 实测 4=4）"
      - "阈值口径必须与所用工具一致：product_search 分支 = ≤100（库存≤100，与后台低库存口径一致）；inventory_manage 分支 = threshold（默认 100 —— 与 product_search 同一单点来源 app/tools/stock_semantics.py，见 #3783）"
      - "给出的数字必须能指回该工具返回的明细（不得只给个总数而不列商品）"
    skip_reason: ""
    merge_log: "verification 2.6 独有。2026-09-15（issue #3781）等价路径校准：原断言 `expectations=['inventory_manage(action=low_stock_alert)']` **过度指定实现路径** —— 真实 run 34856561459 里 agent 走的是 `product_search(stock_status=low_stock)`（产品文档认可：库存≤100，与后台低库存口径一致），回答「库存偏低（≤100 件）的商品共 4 件」且工具返回 `products=4 total=4`（数值有据），却判 0% reproducible。改为接受两条等价路径（**未放宽任何阈值、未删任何断言**：断言内核仍是「低库存这件事被真的查出来了 + 报出的数有据」）。⚠️ 产品级语义冲突「同一个『低库存』在两条工具里是 ≤100 vs ≤10」另开 issue 跟踪（产品问题，非评测问题）：`product_search.py:26 LOW_STOCK_THRESHOLD=100` vs `inventory_manage.py:66` 参数文档「默认 10」+ schema `default: 10`，而 `_low_stock_alert` 形参默认却是 **100**（inventory_manage.py:359）——三处口径不一致，详见该 issue ｜ 2026-09-15 跟进（#3783 收敛后）：两工具改用单点来源 `app/tools/stock_semantics.py`（权威口径 100、上界含），schema 描述/default 同源生成，上文所述三处口径已消除；本日志中 `product_search.py:26` / `inventory_manage.py:66` / `:359` 是**当时的行号**，现行锚点为 `stock_semantics.py::LOW_STOCK_THRESHOLD` 与 `low_stock_alert_threshold_schema()`"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_tools_inventory_manage.py"
      ci:
        - agent-eval.yml
      verifies: []

  - id: PR-007
    legacy_id: "2.7"
    title: "商品上架（状态流转）"
    domains:
      - product
    tier: normal
    tags:
      - status
      - write
    truths_ref:
      - product-sku-stock.status-flow
    user_inputs:
      # 自包含化（#3518）：原输入点名「遮光窗帘（100元的那件）」→ 实测 agent 回「没找到 100 元的那件」
      # （run 34805827043 R1）→ 一轮消耗在澄清、`product_manage(toggle_status)` 从未发生。
      - "把遮光窗帘下架"
      # 收尾「答卡轮」（#3518）：本 run 两处裸文本「确认」都被 agent 挡回（「您没有在确认卡片上点确认」）
      # → 有卡答卡（confirm→回 confirmValue），无卡才发原文「确认」。
      - auto_respond:
          fallback: "确认"
      - "再把它上架"
      # 「上架」段用同一形态 + 一轮余量：确认卡常在收尾轮才下发（同 PR-020 的实测形态），
      # 单轮答卡吃不到那张卡。
      - auto_respond:
          fallback: "确认"
      - auto_respond:
          fallback: "确认"
    # 全局命名空间声明（issue #3781）：与同样争用该全局资源的用例自动互斥，
    # 消除「同栈并行用例互相写同一命名空间」造成的非确定性（真实 run 34856561459）。
    namespaces:
      - "product_name:遮光窗帘"

    expectations:
      - tool: product_manage
        args:
          action: toggle_status
          status: on_sale
    # ── 假绿升级（#3557 / 归因报告 §2.6 A5）──
    # 「期望里出现过工具名」只证明模型**想**下架/上架，判不出"卡答了但没执行"
    # （run 34808115143：R2 起零工具调用，仍判 50%）。`success=true` 属计分白名单，
    # 但对**哪个 action 成功**无判别力 → 升 must_succeed（canonical 写成功，fail-closed）
    # + required_args（调用必须带全 product_id/status，防"空调用"顶过）。
    must_succeed:
      - tool: product_manage
        action: toggle_status
    required_args:
      - tool: product_manage
        action: toggle_status
        fields:
          - product_id
          - status
    data_checks:
      - "success=true"
    pre_clean:
      # 去重只按关键词（#3518）：用例已不再点名价格（独立栈种子 ¥168），`price: 100` 恒不匹配。
