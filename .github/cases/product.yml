  - id: PR-016
    legacy_id: ""
    title: "建品流程 - 分类确认后按适用商品分类过滤/优先推荐加工项"
    domains:
      - product
    tier: normal
    tags:
      - processing_item
      - product_category
      - guided_flow
      - recommendation
    truths_ref:
      - product-sku-stock.create-flow
      - processing-manage.crud
    user_inputs:
      - "录入这个商品，名称遮光窗帘，价格 100"
      - "分类选窗帘"
      - auto_select: true
      - auto_fill:
          colors: "米白色"
          selling_methods: "散剪"
          sku_code: "TEST-002"
      - "已选加工项：高温定型"
      - "颜色米白色，货号 TEST-002"
      # 收尾 = 「答卡轮」（#3518）：B 端写工具受 confirm 门禁约束 —— **发文字「确认」≠ 点确认卡**，
      # 收尾发裸文本时 agent 会停在卡上（回「请核对上方确认卡片…点确认我就执行」）→ product_manage 不执行。
      # `auto_respond`：有卡答卡（confirm→回卡片 confirmValue，= 前端点击协议；choice→首项；
      # form→按声明值回填），无卡才发原文「确认」（同 CU-003 / OR-014 先例）。
      # ⚠️ 不用 `auto_select`：它**不支持 fallback 字段**（run_case 只把 results + case_form_values
      # 传进 resolve_auto_select_turn，见 local_runner.py）。两者都能答 confirm/choice 卡，
      # 但 auto_select 在没有待答卡时会发字面量「第一个」（对不上任何卡片），
      # 而收尾轮需要保留原文「确认」的兜底语义 → 用 auto_respond 才能两者兼得。
      - auto_respond:
          fallback: "确认"
    # 全局命名空间声明（issue #3781）：本用例**往全局商品命名空间里写**该名称，
    # 与同名商品的建/删用例自动互斥（否则会出现"同名多件"→ agent 发选择卡 → 目标工具不执行）。
    namespaces:
      - "product_name:遮光窗帘"
    # 自清理（issue #3800）：本用例**建一件与种子同名**的商品（种子 `prod_eval_blackout`
    # 也叫「遮光窗帘」，见 fixtures 的 seed），而 `namespaces` 只保证**并行互斥**、
    # **不解决重试前置等价性** —— #3751 的重试复位按 `pre_clean` **opt-in**，没有它
    # 就不复位 ⇒ 首跑建出的那件留到重试 ⇒ agent **正确地**拒绝建重复商品
    # （重试轮 trace 原文：「系统里已经有一款完全一致的「遮光窗帘」了，再建一条会变成重复商品」）
    # ⇒ 两次尝试前置不同（首跑 1 件 → 重试 2 件）⇒ 指纹漂移 ⇒ 误判 `unstable`。
    # 判据（run 34865780382 的 flake 台账）：首跑指纹里**没有** `no_success(product_manage)`
    # （= 首跑真的建出来了）而重试指纹有 ⇒ 两次成因不同，根因就是这一格。
    # ⚠️ 只能用 `product_dedupe`（**保留最早创建 = 种子**、删掉用例自造的那件）：
    # `product_remove` 按子串删**全部**命中项 ⇒ 会连种子一起删，而「遮光窗帘」是
    # PR-005/PR-007/CR-001/CR-003/OR-015 的共享前置（改名空间声明可见）。
    pre_clean:
      - type: product_dedupe
        product_keyword: "遮光窗帘"

    expectations:
      - tool: category_manage
      - tool: processing_item_query
      - tool: interact
        args:
          component: choice
          multiSelect: true
      - tool: validate_input
      - tool: product_manage
        args:
          action: create
    required_args:
      - tool: processing_item_query
        fields:
          - applicable_category_id
    data_checks:
      - "分类确认后加工项选择器按「适用商品分类」过滤展示（processing_item_query 携带 applicable_category_id，= 已选商品分类 ID）"
      - "适用分类为空（applicable_product_categories 为空）的加工项仍展示（= 适用所有分类），不因过滤而丢失"
      - "当前分类无匹配加工项时以文字提示可跳过，不空转强制选择"
      - "最终创建成功且关联加工项数量正确"
    skip_reason: ""
    merge_log: "2026-09-06 新增（issue #2964）：加工项「适用商品分类」配置此前无消费方，建品流程按已选分类过滤/推荐加工项（设计意图见 docs/design/admin-dashboard-design.md §6.1.1 适用商品分类+AI推荐）。2026-09-14 校准（#3518）：收尾裸文本「确认」改答卡轮（B 端 confirm 门禁：文字≠点卡）；2026-09-15 补自清理（issue #3800，判定跑 run 34865780382 实证）：本用例建的同名商品与种子 `prod_eval_blackout`（遮光窗帘）撞名，而 `namespaces` 只保证并行互斥、不解决重试前置等价性（#3751 的复位按 pre_clean opt-in）⇒ 首跑建出的那件留到重试 ⇒ agent 正确拒绝建重复 ⇒ 指纹漂移误判 unstable（首跑指纹无 `no_success(product_manage)`、重试指纹有，即铁证）⇒ 补 `product_dedupe{遮光窗帘}`（保留最早创建 = 种子）；**不能用 product_remove**（子串删全部 ⇒ 会连种子一起删，而它是 PR-005/PR-007/CR-001/CR-003/OR-015 的共享前置）；expectations/required_args/data_checks 原样未动"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_tools_processing_item_query.py"
      ci:
        - agent-eval.yml
      verifies: []

  - id: PR-017
