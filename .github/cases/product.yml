  - id: PR-019
    legacy_id: ""
    title: "建品规格与加工项价格落库 — 推理属性经 specifications 落库、加工项经 processing_item_configs 携带价格"
    domains:
      - product
      - chat
    tier: normal
    tags:
      - product_create
      - specifications
      - processing_item
      - regression
    truths_ref:
      - product-sku-stock.low-stock
    # 用例级表单载荷（issue #3804）：色卡识别结果的 6 个 canonical 字段原先只声明在 R2
    # 一轮（结构化回填窗口 W=1），而 R4 的 repeat_until 轮也是可作答轮 —— agent 把
    # 「色卡识别结果」form 卡发晚一轮时，结构化路径整场失效（只剩自包含文本兜底）。
    # 声明在用例级 = 载荷脱离轮次位置（全场任意轮可用）；R2 轮级声明保留（优先级更高）。
    auto_fill:
      name: "2699系列雪尼尔窗帘面料"
      price: "23.8"
      colors: "2699-01 米白"
      door_widths: "2.8米"
      selling_methods: "散剪"
      sku_code: "XNE2699"
    user_inputs:
      - text: "根据这张图片录入商品（色卡图，可识别材质/克重）"
        images:
          - "https://ai-customer-service-admin-dev.oss-cn-hangzhou.aliyuncs.com/images/2026/09/04/e5a68d1a02f844c6a45846784765a737.jpg"
      # ── 2026-09-14 资产重写（#3518，run 34805827043 逐轮归因）──
      # ② 色卡识别结果轮：待答的是 **form 卡**（title「新建商品 — 常青藤色卡识别结果（请确认/修改）」
      #    formFields=6）。原为 `auto_select: true` → 无 choice 卡时发字面量「第一个」→ 实测 agent
      #    回「上一轮的表单我没收到提交内容」，识别到的名称/单价从未进草稿（后续轮次全部空转）。
      #    改为按 formFields 的**真实 key** 回填（canonical 字段：name/price/colors/selling_methods/
      #    door_widths/sku_code —— 见 app/graph/skills/product_skill.py「Vision 预填」与
      #    references/EXAMPLES-product.md 示例 2）；若这一轮待答的不是 form 卡、或字段 key 对不上，
      #    则退回自包含文本。原 R3 文本里的「颜色…门幅…」是**未替换的占位符**（实测 agent 回
      #    「您消息里的『颜色…门幅…』被截断了」）→ 这里补真实字段值。
      - auto_respond:
          fallback: "商品名称: 2699系列雪尼尔窗帘面料\n单价(元/米): 23.8\n颜色: 2699-01 米白\n门幅: 2.8米\n售卖方式: 散剪\n货号: XNE2699"
          form_values:
            name: "2699系列雪尼尔窗帘面料"
            price: "23.8"
            colors: "2699-01 米白"
            door_widths: "2.8米"
            selling_methods: "散剪"
            sku_code: "XNE2699"
      # ③ 加工项轮：有 choice 卡就点首项，否则说明已选。加工项必须是**目录里真实存在的**
      #    （独立栈种子目录：刺绣工艺 ¥30/平方米、高温定型 ¥10/米、纳米圈打孔 ¥8/米、韩式波浪折边 ¥12/米）——
      #    原文本的「波浪定型 ¥8/米」目录中不存在（实测 agent 回「加工项目录里没有完全同名的项」）。
      - auto_respond:
          fallback: "已选加工项：刺绣工艺 ¥30/平方米、韩式波浪折边 ¥12/米"
      # ④ 收尾协作轮：有卡答卡（confirm→回 confirmValue，= 前端点击协议），无卡发原文；
      #    `product_manage` 一旦成功即停轮（被门禁挡回不算成功 → 不会提前停；同 OR-021/CH-033 先例）。
      #    fallback 做成**自包含**：若模型仍以文本追问缺项，这一轮能把规格+加工项+确认一次补齐。
      - repeat_until:
          tool_called: product_manage
          max: 3
        fallback: "商品名称: 2699系列雪尼尔窗帘面料；单价(元/米): 23.8；颜色: 2699-01 米白；门幅: 2.8米；售卖方式: 散剪；货号: XNE2699；已选加工项：刺绣工艺 ¥30/平方米、韩式波浪折边 ¥12/米；确认创建"
    expectations:
      - tool: product_manage
        args:
          action: create
    # ── §14.1 回填（2026-09-15，issue #3683）：写工具「调了 ≠ 成了」──
    # expectations 的参数级匹配 + required_args 只能证明「**发**了 create 且参数齐全」，
    # **create 失败 / 被 confirm 门禁拦下时本用例仍会判通过**（调用名照样出现在 tool_calls 里）。
    # 建品用例的核心产出就是这个 create，故回填 canonical 写成功断言（fail-closed）：
    # 一次都没成功 → 判红。**不放宽**任何既有断言（required_args / forbidden_text 原样）。
    # ⚠️ 为什么**不**同时回填 db_verify[product_by_name]（§14.1 点名的另一半）：
    #   本用例建的商品名 `2699系列雪尼尔窗帘面料` 与评测**种子商品同名同价**
    #   （`tests/agent_eval/fixtures/mibao_eval_seed.sql` 的 `prod_eval_2699`，¥23.80），
    #   而 `_fetch_product_configs`（`local_runner.py:1905-1916`）按 keyword 取**首条** → 区分不了
    #   「本次新建的」与「种子」；种子恒在 ⇒ 该断言**不管本次 create 成没成功都会绿**（比不加更糟：
    #   看起来有覆盖）。PR-020 能加是因为它的商品名在库里唯一。**待补 runner 能力**：db_verify
    #   支持按「本次成功 create 返回的 product_id」回读（见 issue #3683）。
    must_succeed:
      - tool: product_manage
        action: create
    data_checks:
      - "create 参数含 specifications（材质/克重/工艺等推理属性，随 specs 落库到 product_attributes，非仅展示）"
      - "create 参数含 processing_item_configs（含 customPrice=加工项默认单价 unit_price、unit=真实单位），禁止只传 processing_item_ids 名称列表"
      - "商品详情接口 processingItemConfigs 回填 unitPrice/finalPrice（customPrice 空时 finalPrice=unitPrice），前端展示非 ¥0.00 且单位正确"
    forbidden_text:
      - "尚未真正创建"
      - "未创建成功"
    required_args:
      - tool: product_manage
        action: create
        fields:
          - "specifications"
          - "processing_item_configs.customPrice"
    pre_clean:
      - type: product_dedupe
        product_keyword: "2699系列雪尼尔窗帘面料"
        price: 23.8
    skip_reason: ""
    merge_log: "2026-09-08 新增（issue #3027）：sess_c1fce183dae24f22 复盘 — AI 预填表单展示了推理属性但 create 未落库（product_attributes 0 行）；加工项只传名称列表 → custom_price 全 NULL → 详情页 ¥0.00/米（单位硬编码）。三端修复：prompt 强制 specifications+processing_item_configs、admin-api finalPrice 回退、admin-web 渲染回退；2026-09-09 校准：补真实色卡图（原纯文本「根据这张图片」无 images，agent 要图走不下去）。2026-09-14 资产重写（#3518）：② 色卡识别结果轮由 `auto_select`（对 form 卡发「第一个」→ 表单从未提交）改为按 formFields 真实 key 回填的 `auto_respond`；③ 原文本占位符「颜色…门幅…」补真实值、加工项「波浪定型」换目录中真实存在的「韩式波浪折边」；④ 收尾改协作答卡轮。2026-09-15 §14.1 回填（issue #3683）：补 `must_succeed:[product_manage(action=create)]`（原仅有 expectations 参数级匹配 + required_args，create 失败仍判过）；db_verify 未加——商品名与种子 `prod_eval_2699` 同名同价、`_fetch_product_configs` 取 keyword 首条无法区分本次新建与种子（见用例内注释）"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_prompt_snapshots.py"
        - "backend/ai-agent-service/tests/test_tools_validate_input.py"
        - "backend/admin-api/src/test/java/com/migao/admin/service/ProductServiceTest.java"
        - "frontend/admin-web/tests/unit/pages/product-detail.test.tsx"
      ci:
        - agent-eval.yml
        - ai-agent-tests.yml
        - admin-api-tests.yml
      verifies: []

  - id: PR-020
    legacy_id: ""
    title: "建品加工项价格落库盯防 — 自定义价须等于用户确认价（BFF 合并回归）"
    domains:
      - product
      - chat
    tier: normal
    tags:
      - product_create
      - processing_item
      - price
      - regression
    truths_ref:
      - product-sku-stock.create-flow
      - ai-chat.validate-input
    user_inputs:
      - "创建一个窗帘商品，名称：盯防加工项价格0908，单价：88元/米，分类：窗帘布艺，颜色：浅灰"
      - "商品名称: 盯防加工项价格0908\n单价(元/米): 88\n分类: 窗帘布艺\n颜色: 浅灰\n售卖方式: 散剪\n门幅: 2.8米\n货号: DF-0908"
      # 加工项换目录中真实存在的一项（#3518）：原「波浪定型」在独立栈种子目录里不存在
      # （目录：刺绣工艺 ¥30/平方米、高温定型 ¥10/米、纳米圈打孔 ¥8/米、韩式波浪折边 ¥12/米），
      # 实测 agent 回「您说的「波浪定型」在加工项目录里没有完全同名的项」→ 白耗一轮。
      # 自定义价仍挂在「刺绣工艺 ¥45/平方米」上（db_verify 断言的就是它）。
      - "已选加工项：刺绣工艺（价格自定义为45元/平方米）、韩式波浪折边"
      # 收尾 = 「协作轮」（#3518）：裸文本「确认创建」过不了 B 端 confirm 门禁（文字 ≠ 点确认卡）；
      # 且实测确认卡是在**收尾轮才下发**的（run 34805827043 R4：agent 收到「确认创建」后才
      # interact(confirm)，confirmValue=确认：分类=窗帘布艺；加工项①=刺绣工艺 ¥45/平方米…），
      # 单发一轮答卡仍会剩一张没人答的卡 → 给余量：有卡答卡（confirm→回 confirmValue），
      # 无卡发原文；product_manage 一旦成功调用立即停轮（被门禁挡回不算成功，
      # 故不会提前停；同 OR-021 / CH-033 的 repeat_until 先例）。
      - repeat_until:
          tool_called: product_manage
          max: 3
        fallback: "确认创建"
    expectations:
      - tool: product_manage
        args:
          action: create
    data_checks:
      - "create 参数 processing_item_configs 含 customPrice=用户确认价（刺绣工艺 45）"
      - "创建后商品详情 processingItemConfigs 的 finalPrice = 用户确认价（非默认价回退）——issue #3056 回归防线"
    db_verify:
      - fetch: product_by_name
        name: "盯防加工项价格0908"
        checks:
          - "processingItemConfigs.all.finalPrice>0"
          - "processingItemConfigs.刺绣工艺.finalPrice==45"
    # ── §14.1 回填（2026-09-15，issue #3683）：补「本次 create 真的成功了」──
    # 本用例的 db_verify 按**名字**回读落库值（名字唯一，故可作为产物侧断言），但它回答的是
    # 「库里有没有这么一件」——**同一栈上前几轮评测残留的同名商品也能满足它** ⇒「本次 create
    # 没成功」仍可能判绿（数据库层断言不绑定「本次调用」）。must_succeed 读的是**本场**
    # tool_result.success（按 action=create 过滤），与 db_verify 互补，缺一不可。
    must_succeed:
      - tool: product_manage
        action: create
    skip_reason: ""
    merge_log: "2026-09-08 新增（issue #3056 复盘）：建品自定义加工价曾被 BFF create 的 ids 分支静默丢弃（45→30，读回退掩盖后复发）。required_args 只查 create args 层，本 case 用 db_verify 查落库层（finalPrice=确认价），args+落库双保险。2026-09-14 校准（#3518）：① 收尾裸文本「确认创建」改协作答卡轮（confirm 门禁：文字≠点卡；确认卡常在收尾轮才下发，需余量轮）；② 加工项「波浪定型」换目录中真实存在的「韩式波浪折边」。2026-09-15 §14.1 回填（issue #3683）：补 `must_succeed:[product_manage(action=create)]` —— db_verify 的落库断言可能被残留同名商品满足，「本次写真的成功了」此前无断言"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_acceptance_case_checks.py"
        - "backend/admin-api/src/test/java/com/migao/admin/service/AgentProductServiceTest.java"
      ci:
        - agent-eval.yml
      verifies: []

  - id: PR-021
    legacy_id: ""
    title: "单独 SKU 调价 - 修改某规格价格"
    domains:
      - product
    tier: normal
    tags:
      - sku
      - write
      - pricing
    truths_ref:
      - product-sku-stock.realtime
    user_inputs:
      # 自包含化（#3518）：原输入点名「遮光窗帘（100元的那件）」，独立栈种子只有 ¥168 款
      # （run 34805827043 R1 agent 主动纠偏「¥168，不是 100 元」，一轮被消耗在澄清价格上）。
      - "把遮光窗帘的米白色散剪规格改成 150 元"
      - auto_select: true
      - "确认"
    expectations:
      - tool: sku_update
    # ── 假绿升级（#3544 / REPORT §2.2；同 PP-006 形态）──
    # 期望里出现工具名只证明「模型想改价」：同 run（34805827043）里两次 sku_update
    # **都失败**（`sku_update!SKU不存在`，真缺口见 #3539：中文标签 vs 枚举字面匹配），
    # 用例却判 ✅ 100% —— 原 `data_checks: "sku_update 成功（价格落库）"` 是自然语义、不计分。
    # ① must_succeed = canonical 写成功断言（fail-closed：一次都没成功 → 判红）；
    # ② output_verify = 产出侧值核对（成功返回的 new_price 必须 = 用户确认价 150）。
    # 落库层（DB 真实价格==150）当前 runner 的 db_verify 无 SKU 价格 fetch，属能力缺口（见 PR 说明）。
    must_succeed:
      - tool: sku_update
    output_verify:
      - tool: sku_update
        expect:
          new_price: 150
    data_checks:
      - "sku_update 真成功且价格为 150 元（= 用户确认价）：机器断言见 must_succeed（写成功）+ output_verify（new_price==150）；裸断言「调用过」不算覆盖（#3544 假绿升级）"
    skip_reason: ""
    merge_log: "Round 72 评测覆盖审计：sku_update（SKU 级调价）注册于 product_skill 但无 case 覆盖（盲区）→ 补 SKU 调价场景。2026-09-14 校准（#3518）：输入去「100元的那件」价格点名（独立栈种子 ¥168）。2026-09-14 校准（#3544，REPORT §2.2）：假绿升级——`data_checks` 的自然语义「sku_update 成功（价格落库）」不计分（同 run 两次 sku_update 全失败仍判 ✅）→ 补 must_succeed（canonical 写成功断言）+ output_verify（new_price==150），缺陷未修前本用例由假绿转真红（#3539 修复后转绿）。⚠️ 遗留：本 run 该例真实失败点是 `sku_update!SKU不存在`——根因已由 #3539 定位为**中文标签 vs 枚举字面匹配**（非种子缺口），非本 PR 的用例层问题"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_tools_sku_update.py"
      ci:
        - agent-eval.yml
      verifies: []
  - id: PR-024
    legacy_id: ""
    title: "小布算料上限 - 定宽布买高 + 对花损耗（窗高超定高上限，必须走定宽分支并告警）"
    domains:
      - product
      - quote
    tier: normal
    persona: xiaobu
    tags:
      - quote
      - fabric_calc
      - ceiling
      - xiaobu
    truths_ref:
      - fabric-calc.fixed-width
      - fabric-calc.pattern-loss
      - fabric-calc.quote-total
    # ── 能力上限用例（issue #3367）──
    # 现有 PR-013 只覆盖**定高布**（M=(W+0.3)×N，一行乘法）。真实业务里更常见的是
    # **窗高超定高上限 → 必须改走定宽布（买高）** 的分支，且大花型面料要给**对花损耗**。
    # 期望值**独立由业务真值推导**（不是抄实现）：
    #   幅数 P = ceil((3+0.3)×2 / 2.8) = ceil(2.357) = 3      [fabric-calc.fixed-width]
    #   用布 M = P × (2.7 + 0.3) = 3 × 3.0 = 9.0
    #   对花 M = P × (2.7 + 0.3 + 0.4) = 3 × 3.4 = **10.2**    [fabric-calc.pattern-loss]
    # 断言用本轮新增的 output_verify（产出侧）：此前只能断言"调了 curtain_calc"，
    # **算出来的数对不对在评测里完全不可见** —— 算料报价的价值恰恰全在那个数上。
    user_inputs:
      - "帮我算一下：窗宽 3 米、窗高 2.7 米，2 倍褶皱，门幅 2.8 米，需要对花（花距 40 厘米），用 98 元一米的布，要多少布、多少钱？"
    expectations:
      - tool: curtain_calc
        args:
          window_width: 3
          window_height: 2.7
    output_verify:
      - tool: curtain_calc
        expect:
          fabric_meters: 10.2          # 定宽买高 + 对花（每幅 +0.4m 花距）
          formula_used: fixed_width    # 窗高 2.7+0.3 > 门幅 2.8 → 必须走定宽分支
          warning: __nonempty__        # 超定高上限必须告警（真值明确要求）
          fullness: 2
    data_checks:
      - "窗高 2.7m + 卷边 0.3m > 门幅 2.8m → 必须走定宽布（买高）分支，不得套定高公式"
      - "对花损耗按每幅 +1 个花距：3 幅 × 0.4m = 1.2m，用布 10.2m（非 9.0m）"
      - "报价总额 = 面料费 + 加工费 + 辅料费 + 安装费（fabric-calc.quote-total），不得凭记忆报价"
    skip_reason: ""
    merge_log: "2026-09-13 新增（issue #3367）：算料报价能力上限（定宽分支 + 对花损耗 + 产出侧断言）"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_curtain_calc.py"
        - "backend/ai-agent-service/tests/test_acceptance_case_checks.py"
      ci:
        - xiaobu-acceptance.yml
      verifies: []
