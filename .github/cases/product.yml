      - "判据 3·**加库存带各自的号**：`product_skus.latest_batch_no` 由每行各自的 `receiveStock` 写入（N 行 ⇒ 调 N 次、批次号两两不同）——整单共用号会让「最近批次」在多行同 SKU 时静默丢掉区分度。"
