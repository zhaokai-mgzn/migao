  - id: PR-007
    legacy_id: "2.7"
    title: "商品上架（状态流转）"
    domains:
      - product
    tier: normal
    tags:
      - status
      - write
    truths_ref:
      - product-sku-stock.status-flow
    user_inputs:
      # 自包含化（#3518）：原输入点名「遮光窗帘（100元的那件）」→ 实测 agent 回「没找到 100 元的那件」
      # （run 34805827043 R1）→ 一轮消耗在澄清、`product_manage(toggle_status)` 从未发生。
      - "把遮光窗帘下架"
      # 收尾「答卡轮」（#3518）：本 run 两处裸文本「确认」都被 agent 挡回（「您没有在确认卡片上点确认」）
      # → 有卡答卡（confirm→回 confirmValue），无卡才发原文「确认」。
      - auto_respond:
          fallback: "确认"
      - "再把它上架"
      # 「上架」段用同一形态 + 一轮余量：确认卡常在收尾轮才下发（同 PR-020 的实测形态），
      # 单轮答卡吃不到那张卡。
      - auto_respond:
          fallback: "确认"
      - auto_respond:
          fallback: "确认"
    expectations:
      - tool: product_manage
        args:
          action: toggle_status
          status: on_sale
    data_checks:
      - "success=true"
    pre_clean:
      # 去重只按关键词（#3518）：用例已不再点名价格（独立栈种子 ¥168），`price: 100` 恒不匹配。
      - type: product_dedupe
        product_keyword: "遮光窗帘"
    skip_reason: ""
    merge_log: "verification 2.7 独有；2026-09-10 校准：评测商品均已 on_sale，「上架」无操作对象 → 改自包含状态流转（下架→上架），验证完整流转且每次从 on_sale 起跑。2026-09-14 校准（#3518）：① 输入去「100元的那件」价格点名（独立栈种子 ¥168）；② 两处裸文本「确认」改答卡轮（+1 余量轮）；③ pre_clean 去 price 过滤"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_tools_product_search.py"
      ci:
        - agent-eval.yml
      verifies: []

