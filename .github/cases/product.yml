      - "当前分类无匹配加工项时以文字提示可跳过，不空转强制选择"
      - "最终创建成功且关联加工项数量正确"
    skip_reason: ""
    merge_log: "2026-09-06 新增（issue #2964）：加工项「适用商品分类」配置此前无消费方，建品流程按已选分类过滤/推荐加工项（设计意图见 docs/design/admin-dashboard-design.md §6.1.1 适用商品分类+AI推荐）。2026-09-14 校准（#3518）：收尾裸文本「确认」改答卡轮（B 端 confirm 门禁：文字≠点卡）"
    traces:
