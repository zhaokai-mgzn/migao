  - id: PR-021
    legacy_id: ""
    title: "单独 SKU 调价 - 修改某规格价格"
    domains:
      - product
    tier: normal
    tags:
      - sku
      - write
      - pricing
    truths_ref:
      - product-sku-stock.realtime
    user_inputs:
      # 自包含化（#3518）：原输入点名「遮光窗帘（100元的那件）」，独立栈种子只有 ¥168 款
      # （run 34805827043 R1 agent 主动纠偏「¥168，不是 100 元」，一轮被消耗在澄清价格上）。
      - "把遮光窗帘的米白色散剪规格改成 150 元"
      - auto_select: true
      - "确认"
    expectations:
      - tool: sku_update
    # ── 假绿升级（#3544 / REPORT §2.2；同 PP-006 形态）──
    # 期望里出现工具名只证明「模型想改价」：同 run（34805827043）里两次 sku_update
    # **都失败**（`sku_update!SKU不存在`，真缺口见 #3539：中文标签 vs 枚举字面匹配），
    # 用例却判 ✅ 100% —— 原 `data_checks: "sku_update 成功（价格落库）"` 是自然语义、不计分。
    # 改为产出侧断言（fail-closed）：找不到该工具的**成功**调用 → 判红，
    # 且核对产出价格 = 用户确认价 150（sku_update 成功返回 data.new_price）。
    # ⚠️ 未用 `must_succeed`（issue 首选形态）的原因同 PP-006：C 端用例集不变式
    # `test_must_succeed_tools_are_customer_capabilities` 不按 persona 过滤（潜在 bug），
    # 会把 B 端工具 sku_update 判为「非 C 端工具」→ CI 红。
    # 落库层（DB 真实价格==150）当前 runner 的 db_verify 无 SKU 价格 fetch，属能力缺口（见 PR 说明）。
    output_verify:
      - tool: sku_update
        expect:
          new_price: 150
    data_checks:
      - "sku_update 真成功且价格为 150 元（= 用户确认价）：机器断言见上方 output_verify（成功调用 fail-closed + new_price==150）；裸断言「调用过」不算覆盖（#3544 假绿升级）"
