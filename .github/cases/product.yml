  - id: PR-008
    legacy_id: P003
    title: "创建商品 - 完整流程"
    domains:
      - product
    tier: normal
    tags:
      - create
      - full_flow
    truths_ref:
      - product-sku-stock.create-flow
      - product-sku-stock.create-confirm
    user_inputs:
      - "创建一个窗帘，名称测试窗帘A，价格168，分类选窗帘"
      - "窗帘布艺"
      - "颜色选白色和灰色"
      - "货号用 TEST-CURTAIN-A"
      # ── 收尾两轮改**答卡轮**（issue #4042，run 35243351675 @67db87ae 归因）──
      # 实测轨迹：R1 → agent 发 choice 卡（选分类）；R2「窗帘布艺」被认成分类 ✓，agent 随即发
      # **加工项多选卡**；R3「颜色选白色和灰色」/ R4「货号用 TEST-CURTAIN-A」/ R5「确认创建」
      # 三轮都是**文本**、答不上那张卡 ⇒ agent 只能反复重申「加工项还没确认，这一步不能省」；
      # R6 才发出 confirm 卡（「确认创建商品（加工项为空，将不关联任何加工项）」）而**轮次已尽**
      # ⇒ 卡无人点、`product_manage(action=create)` 永不执行（首跑指纹 `no_success(product_manage)`）。
      # 静态文本对不上 LLM 动态生成的卡片列表 —— 与 OR-014/CH-010 同款（#3518 已记同一坑：
      # 「发文字『确认』≠ 点确认卡」）。改成 `repeat_until` 协作轮（既有范式，issue #3430）：
      # 有卡答卡（choice→首项 / 多选→「已选加工项：<首项>」= 前端点击协议、confirm→confirmValue），
      # 目标工具已成功即跳过余轮；无卡才发 fallback（保留原「确认创建测试窗帘A」= agent 生成的
      # confirmValue 文本兜底）。断言（expectations / must_succeed / output_verify）不受影响。
      - repeat_until:
          tool_called: product_manage
          max: 3
        fallback: "确认创建测试窗帘A"
    # 全局命名空间声明（issue #3781）：本用例**往全局商品命名空间里写**该名称，
    # 与同名商品的建/删用例自动互斥（否则会出现"同名多件"→ agent 发选择卡 → 目标工具不执行）。
    namespaces:
      - "product_name:测试窗帘A"

    expectations:
      - tool: product_manage
        args:
          action: create
      - tool: validate_input
      - tool: interact
        args:
          component: choice
    # ── 效果层下沉（issue #4042，LLM 红例 run 35243351675 首跑指纹
    # `no_success(product_manage)`）──
    # 改前本用例**零效果层断言**：唯一的产出侧痕迹是
    # `data_checks: - "data.product_id.length > 0"` —— 它既不含机器计分关键词
    # （`success=true` / `error.code=` / `未被调用` / `not called`）⇒ **不计分**，
    # 又是散文（`data.product_id` 是哪次调用的 payload 无从判定）⇒ 「工具被调用过」就等于满分，
    # 「商品真的建出来了没有」在评测里不可见（`unfailable_green` 形态）。
    must_succeed:
      - tool: product_manage
        action: create
    # 产出侧：成功调用的 payload 必须带非空 product_id（= 服务端真的建出了对象）。
    # ⚠️ 落库层（名字/价格回读）当前 runner 的 `db_verify` 只支持
    # `processingItemConfigs` 谓词（PR-019/PR-020 那两条），商品名/价格无 fetch ——
    # 属能力缺口，如实登记，不假装覆盖。
    output_verify:
      - tool: product_manage
        action: create
        expect:
          product_id: __nonempty__
    # 自清理 + 前置自断言（#3800 / §18.4）：本用例**往全局商品命名空间里写**，
    # 首跑残留会让重试的前置与首跑不等价（agent 正确地拒建重复 ⇒ 指纹漂移误判）。
    # 自建名（`测试窗帘A` 全库仅本用例使用）⇒ `product_remove` 子串删除安全。
    pre_clean:
      - type: product_remove
        product_keyword: "测试窗帘A"
    precondition:
      - type: product_count_for_keyword
        source: "测试窗帘A"
        expect: 0
    data_checks:
      - "商品真的被创建（机器断言见 must_succeed[product_manage(action=create)] + output_verify 的 product_id 非空）；原 `data.product_id.length > 0` 不计分（无 success=true/error.code=/未被调用 关键词）⇒ 已弃用"
    skip_reason: ""
    merge_log: "eval P003 + verification 2.9（同义，取 eval 版）；2026-09-09 校准：补「窗帘布艺」点分类卡轮 + 末轮回传 confirmValue「确认创建测试窗帘A」（agent 实际生成，含商品名上下文；原脚本末轮『确认创建』被 agent 理解成『发确认卡』而非『点确认卡回传』，product_manage 永不执行）；2026-09-18 下沉（issue #4042）：补 must_succeed[product_manage(action=create)] + output_verify(product_id 非空)，并把不计分的散文 `data.product_id.length > 0` 弃用；补 pre_clean[product_remove 自有名] + precondition[product_count_for_keyword expect=0]（前置自断言，清掉 CASE-TRUST-NO-EFFECT-ASSERTION / CASE-TRUST-NO-PRECONDITION-ASSERTION 两条存量违规）；2026-09-18 **轮次形状修正**（issue #4042 归因）：末两轮静态文本（「确认创建」/「确认创建测试窗帘A」）答不上 agent 动态生成的**加工项多选卡**，R5/R6 全被该卡吃掉 ⇒ confirm 卡在最后一轮才发出、无人点击 ⇒ 建品永不执行（`no_success(product_manage)`，与 OR-014/CH-010 同款 #3518 坑）⇒ 末两轮改为 `repeat_until(tool_called=product_manage, max=3)` 协作轮（有卡答卡 / 无卡发原 confirmValue 文本），断言原样未动"
    traces:
      tests:
        - "backend/ai-agent-service/tests/manual/mibao_scenarios.py"
      ci:
        - agent-eval.yml
      verifies: []

