    # ── 假绿升级（#3544 / REPORT §2.2；同 PP-006 形态）──
    # 期望里出现工具名只证明「模型想改价」：同 run（34805827043）里两次 sku_update
    # **都失败**（`sku_update!SKU不存在`，真缺口见 #3539：中文标签 vs 枚举字面匹配），
    # 用例却判 ✅ 100% —— 原 `data_checks: "sku_update 成功（价格落库）"` 是自然语义、不计分。
    # ① must_succeed = canonical 写成功断言（fail-closed：一次都没成功 → 判红）；
    # ② output_verify = 产出侧值核对（成功返回的 new_price 必须 = 用户确认价 150）。
