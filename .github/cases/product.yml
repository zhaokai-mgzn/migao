      - "**一单一加工单的约束不变**：池化派单产出 N 张**各自独立**的加工单（`insert` 两次），`apply` 也按单各调一次（各带本单那一笔）；每张单的快照**只有本单自己的行**被盖上 `batchNo`/`plannedMeters`（不是池级合计、也不是别单的行）。"
      - "判据 4·**预览不说谎**：`preview` 的「预计节省」= `formulaMeters − pooledPlannedMeters`，与实际交给台账的 `Σ(formula − planned)` **逐值相等**（3 == 3）；同时 `perOrderPlannedMeters`（对照读数，逐单派口径）与 `poolingGainMeters`（池化**新增**收益）分开报 —— 不把 #5158 已有的单订单内并排算成池化的功劳。红证：把 `savedMeters` 改用逐单派口径 ⇒ 预览给 0、实际落账是 3 ⇒ 判据红。预览本身**只读**（不 `insert`、不 `apply`）。"
      - "判据 3·**不倒退**（不可成组 ⇒ 与逐单派逐值相同）：`commit` 对「池化开了没有」无感，扣减行由调用方按 `orderItemId` 切分 ⇒ 不可成组时逐单派与池级派落的行**逐值相同**（真库读数见 PR-071）。"
