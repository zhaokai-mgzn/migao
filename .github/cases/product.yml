      - "判据 5·**单行过账逐值不变**：仍是 `PC-yyyyMMdd-NNNN`、仍恰好 1 条批次行 / 1 条 `reason='inbound'` 台账 / `ref_no` = 入库单号；均价与台账成本快照口径不变。"
