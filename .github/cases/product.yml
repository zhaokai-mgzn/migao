    user_inputs:
      # 2026-09-14 消除顺序依赖（issue #3568）：原为泛化「搜索窗帘」+「看看第一个的详情」——
      # 「窗帘」在种子/目录里命中多款（遮光窗帘/北欧风窗帘/夏日清风窗帘/2699 面料…），
      # 「第一个」由 **product_search 返回顺序**决定 → 后续所有轮（改价/加加工项/复核）
      # 都挂在这个不确定对象上：同一份代码在排序不同的栈上会操作不同商品（OR-024 先例
      # #3408/#3409 的同族缺陷）。改为**点名真实存在的种子商品**（遮光窗帘 =
      # prod_eval_blackout，见 xiaobu_eval_seed.sql），用例意图（多轮 UUID 复用 /
      # 不重查 / 写操作确认闸）完全不变。
      - "搜索遮光窗帘"
      - "看看遮光窗帘的详情"
      - "把价格改成 198"
      - "确认"
      # ⚠️ 2026-09-19（#4371 解耦）：原 R5/R6「给它加上韩折」+「确认」两轮
      # **已删除** —— 它们驱动的是 `product_processing_item_manage`（给**商品**挂加工项），
      # 而商品不再持有加工项（加工项是店铺级目录），该工具随解耦退场。
      # 用例意图（多轮 UUID 复用 / 不重查 / 写操作确认闸）由「改价 → 确认 → 复核」完整保留。
      - "再看看这个商品的详情确认一下"
    pre_clean:
      # 同 PR-005/#3518 口径：按关键词去重，保证「遮光窗帘」在栈里只有一件（否则
      # agent 发「哪一件」选择卡，且改价会落到不确定的那一件上）。保留最早创建的（= 种子）。
      - type: product_dedupe
        product_keyword: "遮光窗帘"
    # 前置自断言（issue #4621 的 case-trust burn-down 缴费，形态与 PR-005/#4590 逐字同款）：
    # 本用例按**名字**点名被测对象（「搜索遮光窗帘」…「把价格改成 198」）⇒「该名字唯一」
    # 是它真正依赖、且**只读**的前置（种子 + 上面 `pre_clean[product_dedupe]` 后恰为 1 件）。
    # 前置不成立时红的表现是 `unmatched expectation`（看起来像「agent 不会改价」，归因全错）。
    precondition:
      - type: product_count_for_keyword
        source: "遮光窗帘"
        expect: 1
    expectations:
      - tool: product_search
      - tool: product_detail
        args:
          product_id: 复用上轮 UUID
      - tool: product_update
        args:
          price: "198"
      - tool: product_detail
    # 效果层断言（issue #4621 的 case-trust burn-down 缴费）：「调用了 ≠ 调成了」——
    # 改价真的成功（`success=true`）才算过；只有 expectation 时工具失败也照样满分。
    must_succeed:
      - tool: product_update
    data_checks:
      - "第3轮 product_id 来自第2轮结果"
      - "第4轮 product_id 来自第2轮结果"
