  - id: PR-024
    legacy_id: ""
    title: "小布算料上限 - 定宽布买高 + 对花损耗（窗高超定高上限，必须走定宽分支并告警）"
    domains:
      - product
      - quote
    tier: normal
    persona: xiaobu
    tags:
      - quote
      - fabric_calc
      - ceiling
      - xiaobu
    truths_ref:
      - fabric-calc.fixed-width
      - fabric-calc.pattern-loss
      - fabric-calc.quote-total
    # ── 能力上限用例（issue #3367）──
    # 现有 PR-013 只覆盖**定高布**（M = W × N，一行乘法；issue #5030 起宽方向不再加余量）。真实业务里更常见的是
    # **窗高超定高上限 → 必须改走定宽布（买高）** 的分支，且大花型面料要给**对花损耗**。
    # 期望值**独立由业务真值推导**（不是抄实现）：
    #   幅数 P = ceil(3×2 / 2.8) = ceil(2.143) = 3      [fabric-calc.fixed-width]（issue #5030：宽方向
    #   不再加余量；本例幅数仍为 3 ⇒ 下面的期望值 9.0 / 10.2 **一字不变**）
    #   用布 M = P × (2.7 + 0.3) = 3 × 3.0 = 9.0
    #   对花 M = P × (2.7 + 0.3 + 0.4) = 3 × 3.4 = **10.2**    [fabric-calc.pattern-loss]
    # 断言用本轮新增的 output_verify（产出侧）：此前只能断言"调了 curtain_calc"，
    # **算出来的数对不对在评测里完全不可见** —— 算料报价的价值恰恰全在那个数上。
    user_inputs:
      - "帮我算一下：窗宽 3 米、窗高 2.7 米，2 倍褶皱，门幅 2.8 米，需要对花（花距 40 厘米），用 98 元一米的布，要多少布、多少钱？"
    expectations:
      - tool: curtain_calc
        args:
          window_width: 3
          window_height: 2.7
    output_verify:
      - tool: curtain_calc
        expect:
          fabric_meters: 10.2          # 定宽买高 + 对花（每幅 +0.4m 花距）
          formula_used: fixed_width    # 窗高 2.7+0.3 > 门幅 2.8 → 必须走定宽分支
          warning: __nonempty__        # 超定高上限必须告警（真值明确要求）
          fullness: 2
    data_checks:
      - "窗高 2.7m + 卷边 0.3m > 门幅 2.8m → 必须走定宽布（买高）分支，不得套定高公式"
      - "对花损耗按每幅 +1 个花距：3 幅 × 0.4m = 1.2m，用布 10.2m（非 9.0m）"
      - "报价总额 = 面料费 + 加工费 + 辅料费 + 安装费（fabric-calc.quote-total），不得凭记忆报价"
    skip_reason: ""
    merge_log: "2026-09-13 新增（issue #3367）：算料报价能力上限（定宽分支 + 对花损耗 + 产出侧断言）"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_curtain_calc.py"
        - "backend/ai-agent-service/tests/test_acceptance_case_checks.py"
      ci:
        - xiaobu-acceptance.yml
      verifies: []

  - id: PR-025
    legacy_id: ""
    title: "B端写操作必须先出确认卡再执行（缺卡不发写）"
    domains:
      - product
    tier: normal
    tags:
      - write
      - confirm
    truths_ref:
      - product-sku-stock.status-flow
    # 形态来源（sess_f26fda5046f34992 复盘，#3886）：B 端写操作（下架/删加工项）被确认门禁
    # 拦截后，agent 只在文本声称「确认卡已发出」而未调 interact ⇒ 客户无卡可点、写操作卡死。
    # 行为修复已合并（#3882：base_skill.py 兜底补发确认卡 + tests/test_b_end_confirm_card_fallback.py）。
    # 本条为行为评测用例（LLM 真跑验证），核心断言 = order_before：确认卡（interact[confirm]）
    # 必须先于写操作（product_manage）出现——缺卡即红、写先于卡即红。
    user_inputs:
      - "把遮光窗帘下架"
      # 答卡轮（同 PR-007 套路）：有卡回 confirmValue、无卡才发原文「确认」。
      - auto_respond:
          fallback: "确认"
      # ── 复位轮（issue #4075 的**用例侧**修法，同 PR-007「下架→上架」先例）──
      # 本用例改的是**共享夹具**（种子商品 `prod_eval_blackout` 的在售状态），且它是
      # **mibao 腿专属**（`eval_case_filter.case_persona` 判定），而 mibao 腿同一栈里还跑
      # PR-001 / PR-002 / OR-014 / PR-026 等**按名检索该商品**的用例 —— 不复位就等于把
      # 「下架」留给它们：C 端 `product_search` 会强制下发 `status=on_sale`（issue #3932），
      # 商品被下架时直接搜不到 ⇒ 假红，且归因写成「agent 不会搜/不干活」。
      # 下架后**必须重新上架**，让本用例对世界的影响归零（R1：修机制不修事故点）。
      - "把它重新上架"
      - auto_respond:
          fallback: "确认"
      - auto_respond:
          fallback: "确认"
    # 全局命名空间声明（issue #3781）：与 PR-007 同用「遮光窗帘」+ product_dedupe，
    # 声明同一命名空间自动互斥，消除同栈并行用例互相写同一命名空间造成的非确定性。
    namespaces:
      - "product_name:遮光窗帘"
    expectations:
      - tool: product_manage
        args:
          action: toggle_status
          status: off_sale
    # 关键断言（本用例形态，runner check_order_before）：
    # 全程未调 interact[confirm] ⇒ 缺卡即红；product_manage 早于 interact[confirm] ⇒ 写先于卡即红。
    order_before:
      - "interact[confirm] before product_manage"
    data_checks:
      - "success=true"
    pre_clean:
      - type: product_dedupe
        product_keyword: "遮光窗帘"
    # 前置自断言（§18.4；清掉 CASE-TRUST-NO-PRECONDITION-ASSERTION —— issue #4046 的存量未登记项）：
    # 本用例按名定位**共享夹具**商品，故「该名字唯一」是它依赖的前置（`product_dedupe` 先于
    # capture 执行 ⇒ 捕获时恰为 1）。前置不成立时折成 `PRECONDITION_NOT_APPLIED`，
    # 不再伪装成「agent 不干活」。
    precondition:
      - type: product_count_for_keyword
        source: "遮光窗帘"
        expect: 1
    # ── 复位共享夹具（issue #4075 的**机制半边**：`post_clean`）──
    # 上面那两轮「重新上架」是**用例侧**（有条件复位：流程走完才回到 on_sale，agent 中途
    # 失败/只说不做时就留在 off_sale）。本声明是**机制侧**：无条件检查并把状态写回种子值，
    # 与 PR-007 同形 —— 两侧都要有（用例侧治"正常情况下"，机制侧治"异常路径下"）。
    post_clean:
      - type: product_status_restore
        product_keyword: "遮光窗帘"
    skip_reason: ""
    merge_log: "2026-09-15 新增（#3882 复盘，#3886）：sess_f26fda5046f34992 复盘——B 端写操作（下架/删加工项）被确认门禁拦截后 agent 只在文本声称「确认卡已发出」而未调 interact，客户无卡可点；行为修复已合并（#3882：base_skill.py 兜底补发确认卡 + tests/test_b_end_confirm_card_fallback.py），本条为行为评测用例（LLM 真跑验证），核心断言 order_before[interact[confirm] before product_manage]：缺卡/写先于卡即红。以 PR-007 为模板（答卡轮 auto_respond fallback=确认 + pre_clean product_dedupe 遮光窗帘 + truths_ref product-sku-stock.status-flow + 命名空间互斥）。2026-09-18 补复位轮 + 前置自断言（issue #4075 用例侧 / #4046）：下架后新增「重新上架」答卡轮（同 PR-007），让共享夹具在用例结束时归零（此前残留 off_sale 会污染同栈按名检索的用例）；并补 precondition[product_count_for_keyword expect=1]。2026-09-18 补 `post_clean[product_status_restore]`（issue #4075 机制半边）：用例侧复位是**有条件**的（流程走完才复位），本声明补无条件那半。**断言（expectations / order_before / data_checks）原样未动**"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_b_end_confirm_card_fallback.py"
      ci:
        - agent-eval.yml
      verifies: []

  - id: PR-026
    legacy_id: ""
    title: "设置商品主图 - product_manage(action=update, images) 成功路径"
    domains:
      - product
    tier: normal
    tags:
      - image
      - write
    truths_ref:
      - product-sku-stock.status-flow
    # ── 设主图成功路径（issue #3930/#3931 实证 sess_2efa2071bb1747d8，2026-09-15）──
    # 生产实证：用户「先把这张色卡图设为主图」，agent 错误路由到 product_update(images=[色卡URL])
    # （该工具无 images 参数）→ 静默丢弃 → 「没有要修改的字段」→ 误宣「该入口不支持图片」；
    # 19:49 改用 product_manage(action=update, images=[2 个 URL]) + 确认卡后成功。
    # 本用例锁定**正确路径**：路由到 product_manage(action=update) 且携带 images。
    # ⚠️ 商品名点名「遮光窗帘」（prod_eval_blackout，mibao 栈种子）——会话从零开始，
    # 必须点名才有写对象；images 用现成色卡图 URL（PR-019 同款，真实可达的静态资源）。
    user_inputs:
      - text: "把遮光窗帘的主图设成这张色卡图"
        images:
          - "https://ai-customer-service-admin-dev.oss-cn-hangzhou.aliyuncs.com/images/2026/09/04/e5a68d1a02f844c6a45846784765a737.jpg"
      # 收尾「答卡轮」（#3518 口径，同 PR-005/PR-017）：B 端写工具受 confirm 门禁约束，
      # 裸文本「确认」不放行写操作 → 有卡答卡（confirm→回 confirmValue），无卡才发原文。
      #
      # ⚠️ 2026-09-18 修正（issue #4042，LLM 红例 run 35243351675 @67db87ae 首跑指纹
      # `no_success(product_manage)`）：**单张答卡轮不够**。实测流程是
      # R1「设成这张色卡图」→ agent 先发 **choice 卡**（「要设成哪种图？」：主图/详情图/…）
      # → R2 的 `auto_respond` 被**这张 choice 卡**吃掉 → agent 在同轮发出 **confirm 卡**
      # → 轮次表已用尽 ⇒ 确认卡**无人作答** ⇒ `product_manage(action=update)` 永不执行。
      # 用例结构上不可满足（与 #4015「罐头输入与夹具事实矛盾」同族，只是这次的矛盾在
      # **轮次预算**而不是数据真值）：合格 agent 走对路径也必红，且归因写成"agent 不执行写操作"。
      # 修法按既有 `repeat_until` 范式（issue #3430，同 OR-016/OR-021/OR-029）：
      # 目标工具已成功 ⇒ 余下轮次直接跳过；否则**有卡答卡**（choice→首项 / confirm→confirmValue），
      # 无卡才发 fallback「确认」—— 覆盖"agent 先问哪种图"与"agent 直接发确认卡"两种路径。
      - repeat_until:
          tool_called: product_manage
          max: 3
        fallback: "确认"
    namespaces:
      - "product_name:遮光窗帘"
    expectations:
      - tool: product_manage
        args:
          action: update
    # 调用必须带全 product_id + images（防"空调用"顶过；images 在场 = 「非空」的机器形态）
    required_args:
      - tool: product_manage
        action: update
        fields:
          - product_id
          - images
    # canonical 写成功断言（fail-closed：一次都没成功 → 判红，防「调了 ≠ 成了」）
    must_succeed:
      - tool: product_manage
        action: update
    data_checks:
      - "product_manage(action=update) 携带 images（色卡图 URL）且执行成功 —— 商品主图已更新（images 落库）；db_verify[product_by_name] 当前只支持 processingItemConfigs 谓词（local_runner.py），商品 images 字段落库无 fetch，属 runner 能力缺口（如实登记，未掩盖）"
    pre_clean:
      - type: product_dedupe
        product_keyword: "遮光窗帘"
    # 前置自断言（§18.4 / CASE-TRUST-NO-PRECONDITION-ASSERTION）：本用例的写对象是**共享夹具**
    # `prod_eval_blackout`（按名定位），所以「该名字唯一」就是它依赖的前置 —— 出现第二件同名商品时
    # agent 可能改到**别的对象**上，而红的表现会是 `unmatched expectation`（看起来像「agent 不干活」）。
    # `product_dedupe`（pre_clean，先于 capture 执行）保证捕获时恰为 1（保留最早创建 = 种子），
    # 故 `expect: 1` 可满足；漂移判据（默认 `max_growth: 0`）让「运行期被别人造出副本」显式化。
    precondition:
      - type: product_count_for_keyword
        source: "遮光窗帘"
        expect: 1
    skip_reason: ""
    merge_log: "2026-09-15 新增（issue #3930/#3931 实证 sess_2efa2071bb1747d8）：设主图成功路径——同回合 agent 先错误路由 product_update(images=…)（无该参数）被静默丢弃 → 「没有要修改的字段」→ 误宣「不支持图片」；19:49 改用 product_manage(action=update, images) 成功。本用例锁定正确路径（expectations/required_args/must_succeed 三层）；db_verify 对商品 images 无 fetch（只支持 processingItemConfigs），效果层由 must_succeed 兜底，落库层缺口已登记；2026-09-18 轮次预算修正（issue #4042）：收尾单张 `auto_respond` 轮被 R1 后的 **choice 卡**（「要设成哪种图？」）吃掉 ⇒ 同轮发出的 confirm 卡无人作答 ⇒ 用例**结构上不可满足**（合格 agent 也必红，首跑指纹 `no_success(product_manage)`）⇒ 改为 `repeat_until(tool_called=product_manage, max=3)` 协作轮（有卡答卡：choice→首项 / confirm→confirmValue；目标工具成功即跳过余轮）。断言（expectations / required_args / must_succeed）原样未动"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_sanitize_write_tool_guidance.py"
        - "backend/ai-agent-service/tests/test_product_image_denial_guard.py"
      ci:
        - agent-eval.yml
      verifies: []

  - id: PR-027
    legacy_id: ""
    title: "设主图能力不误宣 - 回复不得出现「不包含图片上传/拿不到地址」类能力否定"
    domains:
