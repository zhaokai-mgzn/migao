        product_keyword: "遮光窗帘"
    # 前置自断言（§18.4；清掉 CASE-TRUST-NO-PRECONDITION-ASSERTION —— issue #4046 的存量未登记项）：
    # 本用例按名定位**共享夹具**商品（写它的主图），「该名字唯一」是它依赖的前置
    # （`product_dedupe` 先于 capture ⇒ 捕获时恰为 1）；漂移时折成 `PRECONDITION_NOT_APPLIED`，
    # 不再伪装成「agent 能力误宣」。
    precondition:
      - type: product_count_for_keyword
        source: "遮光窗帘"
        expect: 1
    skip_reason: ""
    merge_log: "2026-09-15 新增（issue #3931，实证 sess_2efa2071bb1747d8 19:46:32 拒绝文本）：「不包含图片上传」「拿不到可写入的地址」必须被守卫命中并纠正——product_manage 有 images/detail_images 参数、能力真实可达；forbidden_text 逐词机器断言（可判定形式），守卫判据与话术见 base_skill.py 的 _PRODUCT_IMAGE_ACTION_WORDS / _product_image_denial_hit / _TEXT_DENIAL_CORRECTIVE_PRODUCT_IMAGE。2026-09-18 补前置自断言（issue #4046）：precondition[product_count_for_keyword expect=1]（断言原样未动）"
    traces:
