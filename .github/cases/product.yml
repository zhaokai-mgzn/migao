  - id: PR-017
    legacy_id: ""
    title: "商品创建/更新/详情透传「退货回补库存」开关（allow_return_restock）"
    domains:
      - product
      - aftersales
    tier: normal
    tags:
      - inventory
      - write
      - cross_skill
    truths_ref:
      - product-sku-stock.aggregate
      - product-sku-stock.realtime
      - aftersales-flow.return-restock-switch
    user_inputs:
      # 2026-09-14 消除顺序依赖 / stale 点名归一（issue #3568，同 PR-010/PR-005 #3518 口径）：
      # 原输入点名「遮光窗帘（**100元**的那件）」—— 评测栈种子（xiaobu_eval_seed.sql）的
      # 遮光窗帘是 **¥168**（prod_eval_blackout），没有 100 元那件 → agent 合理地澄清
      # 「只搜到一件遮光窗帘，价格是 168 元，不是 100 元」（run 34805827043 实测）
      # → 白耗一轮且写工具可能到不了。去掉价格限定（点唯一商品名），用例意图不变。
      - "把遮光窗帘设置成退货后可以回补库存"
      # 收尾「答卡轮」（#3518 口径，同 PR-005/PR-016）：**裸文本「确认」不放行写操作**
      # （文字 ≠ 点卡）→ 有卡答卡（confirm→回 confirmValue；choice→首项），无卡才发原文。
      # 原 `auto_select: true` 在没有 choice 卡时会退化成发字面量「第一个」（对不上卡片）。
      - auto_respond:
          fallback: "确认"
    pre_clean:
      # 去重只按关键词（同 #3538/#3518）：原 `price` 限定在种子 ¥168 的栈上恒不匹配
      # （`matched<=1` → 直接返回「无需去重」= **没去重**）；同名副本存在时 agent 会发
      # 「哪一件」选择卡，写操作落到不确定的那一件上。
      - type: product_dedupe
        product_keyword: "遮光窗帘"
    # ── 前置自断言（issue #3835 / `migao-dev-flow` §18.4）────────────────────────
    # 本用例靠**商品名**定位唯一的写对象：有 2 件同名时 agent **正确地**澄清（判定跑
    # run 34908262839 首跑原文：「搜索到 **2 个**同名「遮光窗帘」，需要您确认改哪一个」）⇒
    # `product_update` 永不执行 ⇒ 判红成 `no_success(product_update)`，读起来像
    # 「agent 不改商品」（同 run 重试 `products=1` 即通过）。
    # `pre_clean` 只在**自己起跑前**去重，挡不住运行中途由别的用例造出来的副本 ⇒
    # 必须由 runner 在运行期观测：`expect: 1` 判基线（上一跑残留），`max_growth` 默认 0
    # 判"被并行用例中途改写"。前置不成立时折成
    # `precondition_not_applied(declared:product_count_for_keyword)`，与行为失败分属不同根因原子。
    precondition:
      - type: product_count_for_keyword
        source: "遮光窗帘"
        expect: 1
    expectations:
      - tool: product_update or product_manage
        args:
          allow_return_restock: true
    data_checks:
      - "商品详情/列表返回 allowReturnRestock（默认 false，开启后为 true）"
      - "售后工单 refund/return 完结时按商品开关决定是否回补 SKU 库存"
    skip_reason: ""
    merge_log: "issue #2991 新增：窗帘行业定制退货不可再售，商品级开关控制售后完结是否回补库存。2026-09-14 归一（issue #3568）：① 输入去「（100元的那件）」stale 价格点名（种子遮光窗帘 ¥168，实测 agent 合理澄清白耗一轮，同 #3538/#3518）；② 收尾 `auto_select: true` → `auto_respond` 答卡轮（无卡时 auto_select 会发对不上卡片的字面量「第一个」）；③ 补 pre_clean product_dedupe（只按关键词，不带 price 限定）"
    traces:
      tests:
        - "backend/admin-api/src/test/java/com/migao/admin/service/ProductServiceTest.java"
        - "backend/admin-api/src/test/java/com/migao/admin/service/AfterSalesTicketServiceTest.java"
      ci:
        - agent-eval.yml
      verifies: []

  - id: PR-018
    legacy_id: ""
    title: "B端米宝 product_list 卡片引用对齐 — 只渲染回复文本中实际引用的商品"
    domains:
      - product
    tier: normal
    # ── persona（issue #4093 的 PR-018 条目 → 跟踪单 #4110）──
    # 本条断言的正是 **B 端米宝**的卡片行为，四处独立证据都指向 B 端：
    #   · 本用例 `title`「B端米宝 product_list 卡片引用对齐」+ `tags: [mibao]`；
    #   · 实现注释逐字点名 —— `app/api/chat.py::_filter_products_by_reference`
    #     「背景（issue #3009 / **case PR-018**）：**B 端米宝**「低库存清单」等分析型查询里…」；
    #   · 「低库存」是**商家后台口径**（`LOW_STOCK_THRESHOLD = 100`，
    #     `product_search` 以 `stockBelow` 下发）—— C 端顾客查不到也不该查这个视角；
    #   · 同域对位用例 PR-006（低库存预警）也是 B 端口径。
    # 缺标注的后果（首跑指纹实证）：工具集 ⊆ `XIAOBU_TOOLS` ⇒ 被静态判为单端且**被 C 端腿选中**，
    # 而小布拒绝这种后台查询是**正确行为** ⇒ 用例恒红（`no_success(product_search)`），
    # 红的是**用例挂错了腿**，不是 agent 能力缺口。
    persona: mibao
    tags:
      - card
      - reference_alignment
      - mibao
    truths_ref:
      - product-sku-stock.low-stock
    user_inputs:
      - "查一下低库存商品的具体清单"
    expectations:
      - tool: product_search
        args:
          stock_status: low_stock
    # ── 效果层断言（issue #4093 的 PR-018 条目 → 跟踪单 #4110）──
    # 读场景用 `must_succeed` 证明这次查询**真的成功返回**（「调用了 ≠ 成了」：#3361 实测
    # `check_expectation` 不读 `success`，工具返回 500 也照样通过）—— 同工具同款声明先例 =
    # 本文件 PR-006（`must_succeed: [product_search]`，同样是低库存查询）。
    # ⚠️ **刻意不要求非空**（可满足性按 seed 真值核过，不是"恒红空判据"）：
    #   评测栈种子里**没有一件低库存商品** —— 阈值 `LOW_STOCK_THRESHOLD = 100`
    #   （`app/tools/stock_semantics.py`，SKU 级 `stock ≤ 100`），而两份 seed 里
    #   商品级 stock = 1000/1000/800/600、SKU 级 stock 一律 **500**
    #   （读数 @8e03e5b3：两份 fixture 的 `INSERT INTO products` / `INSERT INTO product_skus`
    #   语句 —— `xiaobu_eval_seed.sql` 第 54/58/62/87 行、`mibao_eval_seed.sql` 第 32/49 行；
    #   行号仅供定位，判据以「值 > 100」为准）
    #   ⇒ 两处都 > 100。空结果时工具仍返回 `success=True`
    #   （`product_search.py` 的 `if not products:` 分支，data={"products": [], "total": 0}）
    #   ⇒ 本断言在种子态下可满足。
    #   反过来"要求非空"会变成**世界状态依赖**的假绿/恒红：PR-006 实测那次 `products=4`
    #   来自**运行期**别的用例建品的产物（`ProductService` 建 SKU 未指定库存时 `stock=100`，
    #   恰在阈值上）—— 不是可依赖的种子真值。
    must_succeed:
      - tool: product_search
    data_checks:
      - "米宝（agent_type=mibao）回复中：product_list 卡片仅包含文本实际引用的商品（按商品名/ID 匹配），未被引用的商品不渲染"
      - "文本未引用任何商品时不下发 product_list 卡片（宁可无卡，不误导）"
      - "小布（agent_type=xiaobu）保持现状：product_search 结果全量渲染卡片（货架浏览体验不回退）"
    skip_reason: ""
    merge_log: "2026-09-07 新增（issue #3009）：sess_66c12e3cf3a14ee0 低库存清单场景，LLM 文本正确筛出 5 件低库存商品，但下方渲染了 2 页×10 张原始返回商品卡，文本与卡片两层皮。方案 B：mibao 延迟到文本生成后按引用过滤再发卡；2026-09-18 下沉补齐（issue #4093 的 PR-018 条目 → 跟踪单 #4110，首跑指纹 `no_success(product_search)`）：本单只补**单端标注** `persona: mibao`（title/tags/实现注释三处均写 B 端米宝，见 `app/api/chat.py::_filter_products_by_reference` 的「背景（issue #3009 / case PR-018）」；缺标注 ⇒ 被 C 端腿选中，而小布拒绝商家后台口径的「低库存」是**正确行为** ⇒ 恒红）+ **效果层断言** `must_succeed[product_search]`（读场景证明查询真成功；种子里无低库存商品 ⇒ 按 seed 真值**不要求非空**，空结果仍 success=true）；title/expectations/data_checks **原样未动**"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_card_reference_alignment.py"
      ci:
        - agent-eval.yml
      verifies: []

  - id: PR-019
    legacy_id: ""
    title: "建品规格落库 — 推理属性经 specifications 落库（加工项部分已随 #4371 解耦删除）"
    domains:
      - product
      - chat
    tier: normal
    tags:
      - product_create
      - specifications
      - regression
    truths_ref:
      - product-sku-stock.low-stock
    # 用例级表单载荷（issue #3804）：色卡识别结果的 6 个 canonical 字段原先只声明在 R2
    # 一轮（结构化回填窗口 W=1），而 R4 的 repeat_until 轮也是可作答轮 —— agent 把
    # 「色卡识别结果」form 卡发晚一轮时，结构化路径整场失效（只剩自包含文本兜底）。
    # 声明在用例级 = 载荷脱离轮次位置（全场任意轮可用）；R2 轮级声明保留（优先级更高）。
    auto_fill:
      name: "E2E色卡建品样品面料"
      price: "23.8"
      colors: "2699-01 米白"
      door_widths: "2.8米"
      selling_methods: "散剪"
      sku_code: "XNE2699"
    user_inputs:
      - text: "根据这张图片录入商品（色卡图，可识别材质/克重）"
        images:
          - "https://ai-customer-service-admin-dev.oss-cn-hangzhou.aliyuncs.com/images/2026/09/04/e5a68d1a02f844c6a45846784765a737.jpg"
      # ── 2026-09-14 资产重写（#3518，run 34805827043 逐轮归因）──
      # ② 色卡识别结果轮：待答的是 **form 卡**（title「新建商品 — 常青藤色卡识别结果（请确认/修改）」
      #    formFields=6）。原为 `auto_select: true` → 无 choice 卡时发字面量「第一个」→ 实测 agent
      #    回「上一轮的表单我没收到提交内容」，识别到的名称/单价从未进草稿（后续轮次全部空转）。
      #    改为按 formFields 的**真实 key** 回填（canonical 字段：name/price/colors/selling_methods/
      #    door_widths/sku_code —— 见 app/graph/skills/product_skill.py「Vision 预填」与
      #    references/EXAMPLES-product.md 示例 2）；若这一轮待答的不是 form 卡、或字段 key 对不上，
      #    则退回自包含文本。原 R3 文本里的「颜色…门幅…」是**未替换的占位符**（实测 agent 回
      #    「您消息里的『颜色…门幅…』被截断了」）→ 这里补真实字段值。
      - auto_respond:
          fallback: "商品名称: E2E色卡建品样品面料\n单价(元/米): 23.8\n颜色: 2699-01 米白\n门幅: 2.8米\n售卖方式: 散剪\n货号: XNE2699"
          form_values:
            name: "E2E色卡建品样品面料"
            price: "23.8"
            colors: "2699-01 米白"
            door_widths: "2.8米"
            selling_methods: "散剪"
            sku_code: "XNE2699"
      # ③ 加工项轮（**已随 #4371 解耦删除**）：原为「有 choice 卡就点首项，否则说明已选」
      #    驱动建品时的加工项多选卡。商品不再持有加工项（加工项是店铺级目录，
      #    下单时独立选），建品流程不再下发该卡 ⇒ 该轮无对象。
      # ④ 收尾协作轮：有卡答卡（confirm→回 confirmValue，= 前端点击协议），无卡发原文；
      #    `product_manage` 一旦成功即停轮（被门禁挡回不算成功 → 不会提前停；同 OR-021/CH-033 先例）。
      #    fallback 做成**自包含**：若模型仍以文本追问缺项，这一轮能把规格+确认一次补齐。
      - repeat_until:
          tool_called: product_manage
          max: 3
        fallback: "商品名称: E2E色卡建品样品面料；单价(元/米): 23.8；颜色: 2699-01 米白；门幅: 2.8米；售卖方式: 散剪；货号: XNE2699；确认创建"
    expectations:
      - tool: product_manage
        args:
          action: create
    # ── §14.1 回填（2026-09-15，issue #3683）：写工具「调了 ≠ 成了」──
    # expectations 的参数级匹配 + required_args 只能证明「**发**了 create 且参数齐全」，
    # **create 失败 / 被 confirm 门禁拦下时本用例仍会判通过**（调用名照样出现在 tool_calls 里）。
    # 建品用例的核心产出就是这个 create，故回填 canonical 写成功断言（fail-closed）：
    # 一次都没成功 → 判红。**不放宽**任何既有断言（required_args / forbidden_text 原样）。
    # ⚠️ 为什么**不**同时回填 db_verify[product_by_name]（§14.1 点名的另一半）：
    #   本用例建的商品名 `E2E色卡建品样品面料` 与评测**种子商品同名同价**
    #   （`tests/agent_eval/fixtures/mibao_eval_seed.sql` 的 `prod_eval_2699`，¥23.80），
    #   而 `_fetch_product_configs`（`local_runner.py:1905-1916`）按 keyword 取**首条** → 区分不了
    #   「本次新建的」与「种子」；种子恒在 ⇒ 该断言**不管本次 create 成没成功都会绿**（比不加更糟：
    #   看起来有覆盖）。PR-020 能加是因为它的商品名在库里唯一。**待补 runner 能力**：db_verify
    #   支持按「本次成功 create 返回的 product_id」回读（见 issue #3683）。
    must_succeed:
      - tool: product_manage
        action: create
    data_checks:
      - "create 参数含 specifications（材质/克重/工艺等推理属性，随 specs 落库到 product_attributes，非仅展示）"
    forbidden_text:
      - "尚未真正创建"
      - "未创建成功"
    required_args:
      - tool: product_manage
        action: create
        fields:
          - "specifications"
    # 全局命名空间声明（issue #3781）：本用例**往全局商品命名空间里写**该名称；
    # 声明的是**本用例独占**的名字（issue #3835）—— 单一声明者不产生争用组，但
    # 「我写哪个全局资源」必须如实登记（`test_eval_product_name_pollution.py` 按它判所有权）。
    namespaces:
      - "product_name:E2E色卡建品样品面料"
    # ── 商品名必须**用例自有**（issue #3835，同 PR-016/PR-011 口径）─────────────────
    # 旧值 `E2E色卡建品样品面料` 与**评测种子商品同名同价**（mibao seed 的 `prod_eval_2699`，¥23.80）——
    # 本用例的 merge_log 早就记过这一格带来的实测危害：「商品名与种子同名同价、
    # `_fetch_product_configs` 取 keyword 首条**无法区分本次新建与种子**」。
    # 同一个「同名」还让**按名读它**的用例在运行期看到 2 件 ⇒ `product_search` 返回
    # products=2（判定跑 run 34908262839 的 PR-019 自身 trace：
    # `product_manage(product_id=… name=E2E色卡建品样品面料);product_search(products=2 total=2 …)`）。
    # 换成用例自有名后：① 种子保持唯一；② 本次新建可被关键字**唯一**定位（顺带解掉
    # merge_log 记的 db_verify 歧义）；③ 读者不受影响（没有任何用例搜这个名字）。
    #
    # 自清理：自有名之后 `product_remove{自有名}` 能把前置复位成「**不存在**」
    # （`product_dedupe` 只会留下 1 件 —— 那是共享名下的无奈选择，见 PR-016 的注解）。
    pre_clean:
      - type: product_remove
        product_keyword: "E2E色卡建品样品面料"
    # ── 前置自断言（issue #4305 的 burn-down 缴费；形态同 #4189 给 HR-002 / #3835 给 OR-014）──
    # 本用例是**建品**用例：目标名 `E2E色卡建品样品面料` 必须**尚不存在**（否则 create 撞名、或
    # 走成更新 ⇒ 本用例的建品路径根本没有对象），且运行期只允许**本用例自己造的那一件**
    # （并行用例再造同名 ⇒ 判红，归因不再落到 agent 头上）。
    # 该名字是不可变键：`pre_clean[product_remove]` / `namespaces` 用的是**同一份**名字口径。
    precondition:
      - type: product_count_for_keyword
        source: "E2E色卡建品样品面料"
        expect: 0
        max_growth: 1
    skip_reason: ""
    merge_log: "2026-09-08 新增（issue #3027）：sess_c1fce183dae24f22 复盘 — AI 预填表单展示了推理属性但 create 未落库（product_attributes 0 行）；加工项只传名称列表 → custom_price 全 NULL → 详情页 ¥0.00/米（单位硬编码）。三端修复：prompt 强制 specifications+processing_item_configs、admin-api finalPrice 回退、admin-web 渲染回退；2026-09-09 校准：补真实色卡图（原纯文本「根据这张图片」无 images，agent 要图走不下去）。2026-09-14 资产重写（#3518）：② 色卡识别结果轮由 `auto_select`（对 form 卡发「第一个」→ 表单从未提交）改为按 formFields 真实 key 回填的 `auto_respond`；③ 原文本占位符「颜色…门幅…」补真实值、加工项「波浪定型」换目录中真实存在的「韩褶」；④ 收尾改协作答卡轮。2026-09-15 §14.1 回填（issue #3683）：补 `must_succeed:[product_manage(action=create)]`（原仅有 expectations 参数级匹配 + required_args，create 失败仍判过）；db_verify 未加——商品名与种子 `prod_eval_2699` 同名同价、`_fetch_product_configs` 取 keyword 首条无法区分本次新建与种子（见用例内注释）；2026-09-15（issue #3835）**改名去种子撞名**：`E2E色卡建品样品面料` → `E2E色卡建品样品面料`（种子 `prod_eval_2699` 就叫前者 ⇒ 运行期造同名副本，读者按名搜会得到 products=2；改名后本次新建可被关键字唯一定位，上述 db_verify 歧义随之解除）、`pre_clean: product_dedupe{E2E色卡建品样品面料, price: 23.8}` → `product_remove{自有名}`、补 `namespaces: product_name:E2E色卡建品样品面料`；断言（expectations/must_succeed/required_args/data_checks/forbidden_text）原样未动。2026-09-18（issue #4305 的 burn-down 缴费）：补 `precondition[product_count_for_keyword: E2E色卡建品样品面料, expect=0, max_growth=1]` —— 建品用例的真前置 =「目标名尚不存在且运行期只新增自己那一件」；判据清零 `CASE-TRUST-NO-PRECONDITION-ASSERTION`（整条销账）。断言面一字未动。2026-09-19（#4371 商品↔加工项解耦）：本用例的**加工项半边退场** —— 删除 ③ 加工项轮（`auto_respond 已选加工项：…`）、`data_checks` 的两条 processing_item_configs/processingItemConfigs 断言、`required_args` 的 `processing_item_configs.customPrice` 字段、收尾 fallback 里的「已选加工项：…」；标题去掉「与加工项价格落库」。**保留**：specifications 落库断言（本用例的另一半，与解耦无关）、must_succeed / forbidden_text / pre_clean / precondition / namespaces 原样未动。"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_prompt_snapshots.py"
        - "backend/ai-agent-service/tests/test_tools_validate_input.py"
        - "backend/admin-api/src/test/java/com/migao/admin/service/ProductServiceTest.java"
        - "frontend/admin-web/tests/unit/pages/product-detail.test.tsx"
      ci:
        - agent-eval.yml
        - ai-agent-tests.yml
        - pr-check.yml
      verifies: []

  - id: PR-021
    legacy_id: ""
    title: "单独 SKU 调价 - 修改某规格价格"
    domains:
      - product
    tier: normal
    tags:
      - sku
      - write
      - pricing
    truths_ref:
      - product-sku-stock.realtime
    user_inputs:
      # 自包含化（#3518）：原输入点名「遮光窗帘（100元的那件）」，独立栈种子只有 ¥168 款
      # （run 34805827043 R1 agent 主动纠偏「¥168，不是 100 元」，一轮被消耗在澄清价格上）。
      - "把遮光窗帘的米白色散剪规格改成 150 元"
      - auto_select: true
      - "确认"
    expectations:
      - tool: sku_update
    # ── 假绿升级（#3544 / REPORT §2.2；同 PP-006 形态）──
    # 期望里出现工具名只证明「模型想改价」：同 run（34805827043）里两次 sku_update
    # **都失败**（`sku_update!SKU不存在`，真缺口见 #3539：中文标签 vs 枚举字面匹配），
    # 用例却判 ✅ 100% —— 原 `data_checks: "sku_update 成功（价格落库）"` 是自然语义、不计分。
    # ① must_succeed = canonical 写成功断言（fail-closed：一次都没成功 → 判红）；
    # ② output_verify = 产出侧值核对（成功返回的 new_price 必须 = 用户确认价 150）。
    # 落库层（DB 真实价格==150）当前 runner 的 db_verify 无 SKU 价格 fetch，属能力缺口（见 PR 说明）。
    must_succeed:
      - tool: sku_update
    output_verify:
      - tool: sku_update
        expect:
          new_price: 150
    data_checks:
      - "sku_update 真成功且价格为 150 元（= 用户确认价）：机器断言见 must_succeed（写成功）+ output_verify（new_price==150）；裸断言「调用过」不算覆盖（#3544 假绿升级）"
    # ── 前置自断言（§18.4；同 PR-007/PR-025 的先例）──────────────────────────────
    # 本用例**按名**定位共享夹具（"遮光窗帘"），且 `post_clean` 的复位也按名定位 ⇒
    # 「该名字唯一」是它依赖的前置：有 2 件同名时 agent 会（正确地）要求澄清、
    # `sku_update` 从不执行，判红成 `no_success(sku_update)`，读起来像「agent 不改价」。
    # 前置不成立时折成 `precondition_not_applied(declared:product_count_for_keyword)`，
    # 与行为失败分属不同根因原子（不再伪装成能力缺陷）。
    precondition:
      - type: product_count_for_keyword
        source: "遮光窗帘"
        expect: 1
    # ── 自清理（写类用例的前置等价性；同 PR-005/PR-007/PR-017 口径）──────────────
    # 本用例是**共享夹具写方**：跑一次就把种子价改掉，而它自己靠**名字**定位
    # （`precondition` 与 `post_clean` 都按名）。缺 `pre_clean` 时「重试前置 ≠ 首跑前置」
    # （#3751/#3800 家族）；同名**副本**只能靠 `product_dedupe` 归并（保留最早创建 = 种子），
    # 无副本时是良性 no-op（`_PRECLEAN_CLEANUP_TYPES` 口径）。
    pre_clean:
      - type: product_dedupe
        product_keyword: "遮光窗帘"
    skip_reason: ""
    # ── 复位共享夹具（issue #4075 的**机制半边**：`post_clean`）──
    # 本用例改的是**共享夹具** `prod_eval_blackout`（种子「遮光窗帘」）的
    # 「米白/散剪/门幅 2.8」SKU 价：168 → 150，且此前**没有任何复位动作**。
    # 后果（run 35243351675 @67db87ae 实证）：同栈的 OR-014 首跑 R1 规格卡就写着
    # 「米白｜散剪｜门幅 2.8米｜¥150/米」，按 150 落单，而它的接地真值取商品级价（168）
    # ⇒ mibao 腿判红、xiaobu 腿（不跑本用例）判绿 —— **差异在夹具不在 agent**。
    # 读方止血（#4078：断言真值改成 SKU 感知）只治了"读到什么算对"；写方把世界改掉
    # 那一半必须由声明式复位补齐，否则下一条读该商品的用例照样看到 150。
    # 幂等 + 失败可见（`post_clean` 失败走 `PRECONDITION_NOT_RESTORED` → 结论阻塞）：
    # 目标值 = 种子原值 168（`tests/agent_eval/fixtures/xiaobu_eval_seed.sql`：
    # `product_skus.price = p.base_price`，base_price = 168.00；色名取种子列
    # `product_colors.color_name` 的「米白」——**不是**输入话术里的「米白色」，
    # 复位按种子真值写、不按话术写）。
    post_clean:
      - type: sku_price_restore
        product_keyword: "遮光窗帘"
        color_name: "米白"
        selling_method: "bulk_cut"
        door_width: "2.8"
        price: 168
    merge_log: "Round 72 评测覆盖审计：sku_update（SKU 级调价）注册于 product_skill 但无 case 覆盖（盲区）→ 补 SKU 调价场景。2026-09-14 校准（#3518）：输入去「100元的那件」价格点名（独立栈种子 ¥168）。2026-09-14 校准（#3544，REPORT §2.2）：假绿升级——`data_checks` 的自然语义「sku_update 成功（价格落库）」不计分（同 run 两次 sku_update 全失败仍判 ✅）→ 补 must_succeed（canonical 写成功断言）+ output_verify（new_price==150），缺陷未修前本用例由假绿转真红（#3539 修复后转绿）。⚠️ 遗留：本 run 该例真实失败点是 `sku_update!SKU不存在`——根因已由 #3539 定位为**中文标签 vs 枚举字面匹配**（非种子缺口），非本 PR 的用例层问题。2026-09-18 补 `post_clean[sku_price_restore]`（issue #4075 机制半边：runner 新增 post_clean 支持）：写共享夹具必须声明复位，断言（expectations/must_succeed/output_verify/data_checks）**原样未动**"
