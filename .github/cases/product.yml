  - id: PR-013
    legacy_id: ""
    title: "窗帘算料报价 - 褶皱倍数与用布量计算"
    domains:
      - product
    tier: normal
    # 归位（issue #3367 覆盖盘点）：本条断言 `curtain_calc` —— 算料报价是**小布专属**
    # 能力（米宝工具集里没有该工具），却被写成不带 persona 的 B 端档位并 `skip_reason`
    # 挂起 → **C 端这个核心能力在评测里 0 覆盖**（只有单测覆盖公式，没有真实 LLM 链路证据）。
    # 故补 persona: xiaobu 让它进 C 端可执行集，并撤掉 skip_reason。
    persona: xiaobu
    tags:
      - quote
      - fabric_calc
      - xiaobu
    truths_ref:
      - fabric-calc.fullness-default
      - fabric-calc.fixed-height
      - fabric-calc.fixed-width
    user_inputs:
      - "3米宽 2.5米高 2倍褶皱 打孔帘 用98元一米的遮光布 帮我算多少钱"
    expectations:
      - tool: curtain_calc
        args:
          window_width: 3
          window_height: 2.5
    data_checks:
      - "data.fabric_meters > 0"
      - "data.total > 0"
    # 原 skip_reason（"B 端无 curtain_calc 工具"）已失效：本用例改挂 C 端（persona: xiaobu），
    # C 端 customer_quote skill 正是提供 curtain_calc 的地方。
    merge_log: "POC 小布增强新增（算料报价 skill）"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_curtain_calc.py"
      ci:
        - ai-agent-tests.yml
      verifies: []

