  - id: STK-001
    legacy_id: ""
    title: "盘点单：账面快照 + 差异必经审批 + 调整只改数量（issue #7373 段 2）"
    domains:
      - misc
      - backend
    tier: normal
    tags: [backend-contract, realdb, inventory, stocktake, approval, red-proof]
    truths_ref: []
    user_inputs:
      - "用户（2026-10-21，逐字）：「继续主动推进，不要一直让我点头」—— 主动推进 P1-1 段 2（盘点单），承接 issue #7373 判据「盘点差异调整前后库存恒等式」与 issue #7374 的 `stocktake_diff` 闸门。"
    expectations: []
    data_checks:
      - "**判据 1（账面快照）**：出任务时把该仓**当前有货**批次的量快照成 `book_qty`（NOT NULL）。不留快照，事后 `stock_batches.quantity` 早变了，差异就无法复算、也解释不了「当时为什么判它少了 3 米」。判据 = `StocktakeServiceTest#openSnapshotsBookQty` + `StocktakeMapperTest#bookQtyIsNotNull`。"
      - "**判据 2（逐批次差异）**：`差异 = 实盘 − 账面`；**未录实盘 ⇒ 差异 null（不是 0）**。判据 = `StocktakePolicyTest#diffPerLine` + `#uncountedIsNullNotZero`。"
      - "**判据 3（🔴 差异必经审批）**：完成盘点时有差异 ⇒ 必须有**已通过且未用掉**的 `stocktake_diff` 审批（对象 = 盘点单号，金额 = |差异| 合计），否则**写面直接拒**并给出申请路径；命中则当场消费（一笔一批）。判据 = `StocktakeServiceTest#completeRejectsDiffWithoutApproval`（红证：无审批即拒）。"
      - "**判据 4（无差异不逼审批）**：账实相符 ⇒ 直接完成（把「盘点过、一样」也逼去审批，只会让人绕过盘点）。判据 = `#completeWithoutDiffNeedsNoApproval`。"
      - "**判据 5（🔴 调整只改数量）**：差异调整只改 `stock_batches.quantity`，**不动 `unit_cost`**（盘点是账实对齐，不是成本重估；顺手改成本会让毛利凭空变化）。判据 = `#completeAppliesDiffAndKeepsCost` + 真库 `StocktakeRealDbTest#fullFlowWithoutDiff`（断言 cost 一字不动）。"
      - "**判据 6（恒等式与准入）**：`Σ(实盘−账面) == Σ存储差异`（抓「改了实盘没同步差异」的脏数据）；有一条没录实盘就不能完成；调整后数量不得为负。判据 = `StocktakePolicyTest#storedColumnsAgree` + `#allCountedRequired` + `#adjustmentNeverNegative`。"
      - "**判据 7（同仓唯一进行中）**：同一仓库同时只能有一个 `counting` 盘点 —— **部分唯一索引**兜住（不是服务层查一遍），并发发起时映射成可读冲突。判据 = `StocktakeMapperTest#oneOpenStocktakePerWarehouseIsAConstraint` + `StocktakeServiceTest#openRejectsSecondOpenStocktake`。"
      - "**判据 8（并发与端点契约）**：完成走 CAS（`status='counting'` 条件更新，落空 ⇒ 可读 409）；路由逐字、读 `inbound:view` / 写 `inbound:create`（零授权 delta）；**完成面只收盘点单 id**（差异/调整量由服务端算，客户端递进来就等于绕过审批）。判据 = `#completeLosesCas` + `StocktakeControllerTest`。"
      - "**边界（照实登记）**：① **周期盘点计划**（定时生成任务）未做；② **库位级盘点**（issue 明列非目标）未做；③ **盘点差异的成本重估**未做（成本随行不动）；④ 盘点页面未做（接口已就位）；⑤ 差异审批的**申请人入口**复用既有 `/api/admin/approvals`（无独立页面）。"
    precondition: "本用例 [backend-contract] + 真库：前置 = `stocktakes`/`stocktake_items`（V184）+ `approvals`（V181）+ 真实 PG 集群（CI 注入 `MIGAO_REQUIRE_REALDB`）。零网络、零 LLM。"
    skip_reason: "[backend-contract] 盘点恒等式 / 差异审批闸门 / 真库列一致性，由 Java 单测与真库判据验证，非 LLM 行为，不进 agent-eval 冒烟"
    merge_log: "2026-10-21 新增（issue #7373 段 2）。落码 = `Stocktake`/`StocktakeItem` + 两个 Mapper + `StocktakePolicy`（恒等式与准入）+ `StocktakeService`（出任务/录实盘/完成/作废，差异接 `ApprovalService.consume`）+ `StocktakeController` + V184 + 真库判据。"
    traces:
      tests:
        - "backend/admin-api/src/test/java/com/migao/admin/service/StocktakePolicyTest.java"
        - "backend/admin-api/src/test/java/com/migao/admin/service/StocktakeServiceTest.java"
        - "backend/admin-api/src/test/java/com/migao/admin/service/StocktakeRealDbTest.java"
        - "backend/admin-api/src/test/java/com/migao/admin/controller/StocktakeControllerTest.java"
        - "backend/admin-api/src/test/java/com/migao/admin/mapper/StocktakeMapperTest.java"
      ci:
