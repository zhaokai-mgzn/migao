      - "**判据 1（实例判据，行为面：真 fixture + 真 git，issue #6243 的验收口径）**：造 `$LOCK_DIR` + 至少一把 `*.lock`（失效锁）⇒ `./scripts/dev-worktree.sh list` 必须 **exit 0**，且该锁按名列出。判据 = tests/unit_ci_workflows/test_dev_worktree_list_exit_code.py::test_list_exits_zero_with_stale_session_lock_present。"
      - "**判据 2（修前红，注入式，§28.1 出口①）**：把末行还原成旧形态 ⇒ 同 fixture 必须 exit **1**（`rc=1` 就是红证；注入后另做 `bash -n` 自证，防「注入坏成语法错」冒充红证）。判据 = 同文件::test_injected_old_tail_makes_list_exit_nonzero。"
      - "**判据 3（负向对照，防「一律 return 0」吞错）**：① 不存在的子命令 ⇒ 仍**非零**；② `git worktree list` **真失败**（注入式 `git` 垫片只让这一个子命令 rc=128，垫片生效另作断言）⇒ 仍**非零**。判据 = 同文件::test_negative_controls_stay_nonzero。"
      - "**判据 4（类级元守卫）**：`scripts/*.sh` 里**任何函数体**的最后一条可执行命令都不得是 `[ … ] && …` 这种「退出码会被当成返回值」的复合形态（脚本级尾行同判）—— **未登记即红**；豁免台账 tests/unit_ci_workflows/scripts_locked_tail_ledger.json **只许缩短**（条数冻结上界 `LEDGER_MAX = 1` 写死在判据里 ⇒ 台账自己改不大）、**登记必须兑现**（该位置现在真是该形态）、**陈旧登记即红**（现取 1 条具名豁免，见下）。判据 = 同文件::test_no_unregistered_exit_code_tail_in_scripts。"
      - "**判据 4 的具名豁免（现取 = 1 条，why 逐字）**：`dev-worktree.sh::lock_alive` —— 它是**谓词**（`[ -f \"$f\" ] || return 1` 之后 `[ -n \"$pid\" ] && kill -0 \"$pid\"`），调用点全是 `if lock_alive …; then` / `lock_alive … 2>/dev/null` 这类条件位置 ⇒ 非零正是「锁失效」这个语义本身（`add` 靠它拒绝重复建工作区、`rm` 靠它决定是否释放锁）；改成 `return 0` 会把「锁失效」判成「锁活跃」、正好把护栏改坏。`lock_list` 这一处**不在**台账里（本单已改成显式 `if … fi` + `return 0`）。"
      - "**判据 5（判别力自证 + 射程钉住）**：扫描器在内存造的坏形态上判红（函数末命令 / 脚本级尾行各一），在对照形态上**不红**（`&&` 出现在函数中部 ⇒ 退出码由最后一条决定、无害；`if …; then …; fi` 结尾 ⇒ 退出码来自块尾，**故意**不误报）；射程内解析出的函数总数有下界（0 个函数 = 假绿），且 `dev-worktree.sh::lock_list` 必须在射程内、其末命令逐字是 `return 0`。判据 = 同文件::test_guard_has_teeth_and_a_nonempty_scope。"
      - "🔴 **覆盖边界（照实登记，§19.1）**：① **只治退出码，不治锁的生命周期** —— `add` 把 `$$`（`add` 自己的 PID）写进锁文件，`add` 一结束该 PID 就退出 ⇒ 正常流程产出的锁**立刻失效**、且只在 `rm` 时才释放（失效锁长期累积，正是本单 `list` 长期 exit 1 的成因）；那是**另一个问题**，不在本判据射程内（本 PR body「边界 / 顺带发现」节登记）。② 类级守卫只扫 `scripts/*.sh`；③ 只看「函数体最后一条可执行命令」这一个位置（`&&` 在函数中部无害 ⇒ 有意不报）；④ **块结构尾部**（`fi`/`done`/`esac`/`}` 结尾）不在射程（退出码来自块内最后一条命令，静态行扫描判不了，需 AST）—— 对照读数：现扫 `scripts/*.sh` 共 3 处行尾命中，其中 `machine-heavy-lock.sh::_ledger_surface` 是 `if …; then …; fi`（退出码来自块尾，**不是**本缺陷）⇒ 按起始行 `if` 排除、**不登记**；⑤ 只跑定点判据，不跑 `verify-all.sh gate` / 全量 pytest（重活串行，`migao-dev-flow` §27）。"
    precondition: "本用例是 [backend-contract] 纯离线判据：前置 = `scripts/*.sh` 在场且可解析；行为面判据在 `tmp_path` 里真 `git init` + 真 `add` 造真 worktree 与真会话锁（零网络、零其库、不碰任何真实工作区）。前置由判据自身持有：文件缺失 / 夹具造不出来 ⇒ 当场红（不表现成「agent 不干活」）；agent-eval 栈不跑它"
    skip_reason: "[backend-contract] 纯静态尾命令扫描 + 真 fixture 行为守卫（只读仓内脚本；真 git 仓库 / 真 worktree / 真会话锁一律造在 tmp_path，**不碰任何真实工作区**；零网络、零时钟、不起真库）由 tests/unit_ci_workflows/test_dev_worktree_list_exit_code.py 验证，非 LLM 行为，不进入 agent-eval 冒烟"
