      - "**判据 7（每个节点至少一条可命中的说法）**：`MENU_TREE` 的每个节点都必须至少有一条登记说法**逐字出现在该菜单名里** ⇒ 缺了它，那个页面用户永远问不到。注入式红证：加一个没有任何说法的节点 ⇒ 具名报出该节点。执行点 = tests/unit_ci_workflows/test_menu_navigator.py 的 `test_judgement_7_every_node_has_a_hit_alias` / `test_judgement_7_red_on_node_without_alias`"
      - "**判据 8（没有空登记 = 死条目）**：每条登记说法都必须**能解出它自己的功能** —— 判法与 `resolve_feature` 的最长命中口径同源：被**别的功能**更长说法遮蔽的说法（如登记 `发货单` 的 `出库`，而别家登记了 `出库管理`）永远解不出自己 ⇒ 红并具名报出「哪条说法 / 解到了谁 / 被谁遮蔽」。执行点 = 同文件的 `test_judgement_8_no_shadowed_alias` / `test_judgement_8_red_on_shadowed_alias`"
      - "**判据 9（说法 ⇄ config/menu.ts 双向同步）**：① `menu.ts` 的每个导航节点都要有登记项以它为主节点；② 每个登记项的主节点都要在 `menu.ts` 里，且**至少一条说法逐字等于**该节点 `name`（改名不同批改登记表 ⇒ 静默漂移）。执行点 = 同文件的 `test_judgement_9_feature_map_syncs_with_menu_ts` / `test_judgement_9_red_on_mirror_drift`"
