  - id: QC-001
    legacy_id: ""
    title: "质量成本：返工工时 / 报废料 / 赔付三项分列，未知不折成 0（issue #7377 段 1）"
    domains:
      - misc
      - backend
    tier: normal
    tags: [backend-contract, report, quality, red-proof]
    truths_ref: []
    user_inputs:
      - "用户（2026-10-22，逐字）：「继续做」—— 自主推进 P1-5，先把「质量成本到底多少」变成可看的数。"
    expectations: []
    data_checks:
      - "**判据 1（三项分列）**：质量成本 = 返工工时 / 报废料 / 赔付三项**分别给出**（合并成一个数会让读者无法判断「高在哪」—— 三种成因对应三种处置）。判据 = `QualityCostPolicyTest` + `QualityCostReportTest#reworkUsesUnitPriceSnapshot`。"
      - "**判据 2（返工工时口径）**：`production_work_logs.work_type='rework'` × **单价快照**（`unit_price`）；不读实例当前价（改价不能改历史）。判据 = `#reworkUsesUnitPriceSnapshot`。"
      - "**判据 3（🔴 未定价 ≠ 0 元工时）**：`price_state='unpriced'`（或 `unit_price` 为空）的返工行**不计金额**，该项标未知并给出未定价行数；只算有价行然后当真 = 成本偏低。判据 = `QualityCostPolicyTest#reworkCostHonoursUnpricedRows` + `QualityCostReportTest#unpricedReworkIsNotZeroCost`。"
      - "**判据 4（🔴 报废料恒未知）**：本仓**没有**质检记录→批次的关联（质检只到成品帘级）⇒ 该项未采集、金额为 null、说明里写明「不填 0」（填 0 会被读成「本月没有报废损失」）。判据 = `#scrapIsAlwaysUnknown` + `QualityCostReportTest#scrapIsUnknownNotZero`。"
      - "**判据 5（🔴 未发生 ≠ 已核实为零）**：窗口内没有退款流水 ⇒ 赔付未知；有流水 ⇒ 按订单退款口径汇总（本仓无售后单→流水关联，口径差异写在 note 里）。判据 = `#compensationWithoutRefundsIsUnknown` + `QualityCostReportTest#noRefundsMeansUnknownCompensation` + `#refundsCountIntoTotal`。"
      - "**判据 6（合计只加已知项 + 完整性自述）**：`total = Σ已知项`；任一未知 ⇒ `complete=false` 且 `unknownComponents` 列出 code；全未知 ⇒ total 为 null（不是 0）。判据 = `QualityCostPolicyTest#totalOnlySumsKnownComponents` + `#allUnknownGivesNullTotal`。"
      - "**边界（照实登记）**：① **售后单 → 返工单的关联与回写未做**（issue 目标 1：需要新单据实体与状态机，段 2）；② **客户 / 商品 / 工序三维汇总未做**（段 2，要 join 加工单与订单）；③ **缺陷原因字典**未做（段 2，与 #7197 同源）；④ 报废料成本**仍未采集**（要先补「质检 → 批次」的关联）；⑤ 报表页面未做。"
    precondition: "本用例是 [backend-contract]：前置 = `production_work_logs`（V61 单价快照 / V90 定价三态）+ `finance_transactions`。零网络、零 LLM、无迁移（纯只读面）。"
    skip_reason: "[backend-contract] 质量成本构成与未知传播，由 Java 单测验证，非 LLM 行为，不进 agent-eval 冒烟"
    merge_log: "2026-10-22 新增（issue #7377 段 1）。落码 = `QualityCostPolicy`（三项分列 + 未知传播 + 合计恒等式）+ `ReportService.qualityCost` + `QualityCostView` + `GET /api/admin/reports/quality-cost`。**自查剔除了初版的 `orderCount`**（它把加工单 id 与订单 id 混在一个集合里数）。"
    traces:
      tests:
        - "backend/admin-api/src/test/java/com/migao/admin/service/QualityCostPolicyTest.java"
        - "backend/admin-api/src/test/java/com/migao/admin/service/QualityCostReportTest.java"
        - "backend/admin-api/src/test/java/com/migao/admin/controller/ReportControllerTest.java"
      ci:
        - pr-check.yml
      verifies: []

  - id: QC-002
    legacy_id: ""
    title: "返工单：售后 → 返工 → 回写，闭环唯一（不得「已闭环但返工单还在做」）（issue #7377 段 2）"
    domains:
      - misc
      - backend
    tier: normal
    tags: [backend-contract, quality, state-machine, red-proof]
    truths_ref: []
    user_inputs:
      - "用户（2026-10-22，逐字）：「继续做」—— 继续推进 P1-5 段 2，补上这条链唯一缺的实体（返工单）。"
    expectations: []
    data_checks:
      - "**判据 1（四态状态机）**：`draft → in_progress → done | cancelled`；只有 draft 能开工、只有 in_progress 能完成（未开工就完成 = 跳过返工）、未完结才能取消。判据 = `ReworkStateTest#transitionsAreStrict` + `ReworkOrderServiceTest#cannotCompleteDraft`。"
      - "**判据 2（🔴 闭环唯一——issue 判据原文）**：已闭环/已驳回的售后单**不能再开返工**（否则就是「闭环了单子还在做」）；同一售后单**同时只能有一个未完结返工单**（部分唯一索引 `uk_rework_orders_open_per_ticket` 兜住，不是服务层查一遍）。判据 = `ReworkStateTest#closedTicketsCannotOpenRework` + `ReworkOrderServiceTest#closedTicketCannotOpen` + `#secondOpenReworkIsRejected` + `ReworkOrderMapperTest#oneOpenPerTicketIsAConstraint`。"
      - "**判据 3（🔴 回写只从 processing 推进）**：完成时售后单是 `processing` ⇒ 推进 `resolved`；`pending`/`closed`/`rejected` **一律不动**（覆盖它们等于替客服下结论）；回写本身也是 CAS（别人先改过就不覆盖）。判据 = `ReworkStateTest#writeBackOnlyFromProcessing` + `ReworkOrderServiceTest#completeWritesBackFromProcessing` + `#completeDoesNotOverridePending`。"
      - "**判据 4（取消不回退售后）**：返工取消 ≠ 售后已解决 ⇒ 不改售后状态。判据 = `#cancelDoesNotTouchTicket`。"
      - "**判据 5（并发 CAS）**：start / complete / cancel 都以「当前状态」为条件更新，落空 ⇒ 可读 409（不静默覆盖）。判据 = `#casLosesOnStatusChange`。"
      - "**判据 6（🔴 权限码零 delta）**：读面复用 `after_sales:view`；写面复用 `order:refund`（售后处理既有写码）。**不得新造 `after_sales:create`** —— 全仓权限目录只有 `after_sales:view`，新造码会让端点对所有人不可达（#4203 同族，采购单段 4-B 踩过）。判据 = `ReworkOrderControllerTest#permissionCodesReuseExisting`。"
      - "**判据 7（真外键）**：`after_sales_ticket_id` 是真外键 ⇒ 返工单不能挂在不存在的售后单上。判据 = `ReworkOrderMapperTest#ticketReferenceIsForeignKey`。"
      - "**边界（照实登记）**：① **返工成本归集到单据**未做（段 3：需 join 报工与批次成本）；② 客户/商品/工序**三维汇总**未做；③ **缺陷原因字典**未做（与 #7197 同源）；④ 返工页面未做（接口已就位）；⑤ 返工**工序明细**不新建表（沿用报工的 `work_type='rework'`）。"
    precondition: "本用例是 [backend-contract]：前置 = `rework_orders`（V185）+ `after_sales_tickets`。零网络、零 LLM。"
    skip_reason: "[backend-contract] 返工状态机与闭环一致性，由 Java 单测验证，非 LLM 行为，不进 agent-eval 冒烟"
    merge_log: "2026-10-22 新增（issue #7377 段 2）。落码 = `ReworkState`（四态 + 闭环一致性纯函数）+ `ReworkOrder`/`ReworkOrderMapper` + `ReworkOrderService`（开单/开工/完成回写/取消，全走 CAS）+ `ReworkOrderController` + V185（含 part 唯一索引）。"
    traces:
      tests:
        - "backend/admin-api/src/test/java/com/migao/admin/service/ReworkStateTest.java"
        - "backend/admin-api/src/test/java/com/migao/admin/service/ReworkOrderServiceTest.java"
        - "backend/admin-api/src/test/java/com/migao/admin/controller/ReworkOrderControllerTest.java"
        - "backend/admin-api/src/test/java/com/migao/admin/mapper/ReworkOrderMapperTest.java"
      ci:
        - pr-check.yml
      verifies: []

