    expectations:
      - tool: direct_reply
    data_checks:
      - "**未登记即红（牙齿）**：现取 `.github/workflows/*.yml` 里任何带 `on.schedule` 的 workflow（**结构性**取 `on.schedule[].cron`，注释里的 `# - cron:` 不算），既不在 `tests/unit_ci_workflows/schedule_scope_ledger.json` 的 `baseline`、也不是 `exceptions` 的具名实例 ⇒ 判红并给出可行动出口（登记 `exceptions` + 在仓库根 `AGENTS.md` 铁律 10 具名）"
      - "**存量只许缩短（三处冻结）**：台账 `baseline` ⇄ 判据里 `BASELINE_FILES_FROZEN` 必须逐项相等（无多无少无重复）；条数 ≤ `BASELINE_COUNT_MAX` 且台账 `baseline_frozen` 与之相等 ⇒ 把新周期面塞进 `baseline` 必须同时改三处且数字变大（diff 里看得见）"
      - "**陈旧登记即红**：登记的 workflow 现取没有 `on.schedule`（或文件已删）⇒ 红（台账只许缩短；`ghost-leg.yml` 这类死登记不许留着）"
      - "**例外类封闭枚举**：`kind` ∈ {`republish`, `readonly_heartbeat`} ⇒ 自创第三类（如 `cleanup`）判红"
      - "**三个证据锚可解析 + 非破坏性锚唯一**：`non_destructive_anchor` / `idempotency_anchor` / `self_proof_anchor` 都写成 `<仓库相对路径>::<符号或文本片段>`，路径必须存在且片段必须真在该文件里出现（**删光即红**）；`non_destructive_anchor` 不许被两条实例复用（一个锚给所有东西盖章）"
      - "**具名双向（台账 ⇄ 铁律正文）**：`exceptions[].pr` 集合与 `AGENTS.md` 铁律 10 里「📌 已批准具名实例」那行的 `#N` 集合**双向相等** ⇒ 登记了却没具名 / 具名了却没登记，都判红（现取 = PR #5731）"
      - "🔴 **规则本体不许被删（收窄 ≠ 取消）**：铁律 10 正文里必须**逐字**还有禁令（`⛔ 不新增 schedule/cron` + `无人值守`）与两个裁定日期（`2026-09-21` 原裁定 / `2026-09-27` 收窄裁定）；正文块取不到 ⇒ fail-closed 红"
      - "**声明 ⇄ 现取（双向）**：登记的 `cron` 必须逐字出现在该 workflow 的 `on.schedule` 里，且该 workflow 的**每一条** cron 都被登记覆盖 ⇒ 台账不许给不存在的周期面盖章、也不许漏一条"
      - "🔴 红证全部**内存构造**（真文件当基线 → `copy.deepcopy` 改内存对象 → 直接喂纯函数 `ledger_problems`；本仓已实测「改磁盘 → 跑 pytest」的变异**可能不被读到** ⇒ 判据恒绿 = 空断言）：删光 exceptions / 新造一条未登记的周期面 / 死登记 / 把新 schedule 塞进 baseline / 单改 `baseline_frozen` / 自创第三类 / 锚被删光 / 锚复用 / cron 与现取脱钩 / 删禁令本体 / 删裁定日期 / 删具名行 / 具名成别的 PR / 取不到正文块 / 在飞实例已落地却仍留在 pending / 在飞实例缺升格动作 / 在飞实例的 PR 没在铁律正文里具名，**17 条各自判红并点名命中分支**；**只改注释 ⇒ 不红**（对照读数）；另有「坏形态读数 ≠ 基线读数」自证（防变异没生效 ⇒ 空断言）"
