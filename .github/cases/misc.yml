_deploy_ci_bootstrap.py` 全绿）。**判据 6 升级为「五跳同源」**（`test_build_identity_wiring_is_same_source_across_five_hops`）：`python3 -m pytest tests/unit_ci_workflows/test_served_version_verify.py -q` = **20 passed**（改前 19 passed / 同名旧判据）。**红证（注入式，实跑读数）**：① 从 BOOTSTRAP 的 `export` 串摘掉 `BUILD_SHA=__BUILD_SHA__` ⇒ 判据 6 判红，逐字 `AssertionError: BOOTSTRAP 没有把 BUILD_SHA 送往远端（export …; 串里没有占位符 __BUILD_SHA__）`（1 failed / 19 deselected）；② 同一注入下**只跑执行式探针**（绕开全部文本断言）⇒ 捕获的命令内容里 `BUILD_SHA=<sha>` 缺席（逐字 `BUILD_SHA=6f3aec2b…` → `False`，命令长度 1072 → 1021 字节）；③ 把渲染点改成空转（`out=${out//__BUILD_SHA__/…}` 摘掉）⇒ 判据红在「没有在 render_bootstrap 里被显式渲染」；④ 把 `BUILD_TAG` 也送下去（第二条会漂的口径）⇒ 判据红在 `__BUILD_TAG__` 反向上；复位后 20 passed。**端到端终判（本包的兑现条件，需一次真实部署）**：`bash deploy/scripts/served-version-verify.sh https://api.migaozn.com $(git rev-parse origin/main)` ⇒ **rc=0 + `SERVED_VERSION=match`**。未固化项不变：`deploy-frontend.yml` / `deploy-ai-agent-service.yml` 两条腿仍未接线。"
