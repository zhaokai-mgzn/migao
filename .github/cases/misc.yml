    merge_log: "2026-10-20 新增（issue #7359，用户要求把「如何规避传统 ERP 的臃肿」落成规范与判据）。落码 = ① docs/wiki/Domain-Modeling.md（六条纪律 + 新增实体正判据 + 三指标复算命令 + 两处具名漂移）；② tests/unit_ci_workflows/test_schema_health_guards.py（3 条真语料判据 + 4 条注入式红证 + 1 条负控）；③ 台账 tests/unit_ci_workflows/schema_health_ledger.json（列预算例外 1 条 / 孤儿列基线 0 / JSONB 登记 48 条）；④ docs/wiki/INDEX.md 增入口；⑤ product/capability-gap-midsize.md（中型企业能力差距评估，issue #7360）。⚠️ **未做（照实登记）**：不收敛 customer_profiles(42) 与 order_items(28) —— 收敛是迁移级改动，另开单；本单只让「再长一列」需要显式登记。⚠️ **不入 CHANGELOG**（铁律 7 豁免：docs + 纯测试/研发工具面，对用户无可观察影响）。取号 = 现取 origin/main 的 MC 最大 118 ⇒ MC-119。"
