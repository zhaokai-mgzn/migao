  - id: MC-085
    legacy_id: ""
    title: "订单详情打印入口收口守卫：打印不跟订单状态挂钩（无「状态 × 单据」矩阵）+ 全页只有一个打印入口且不在状态分支里 + 单据名不手写 + 打印层选择器接线齐全 + 作业单区块无第二入口（issue #6434 → #7544 改判）"
    domains:
