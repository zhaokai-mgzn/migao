      - "**判据 1（列预算）**：`tests/unit_ci_workflows/test_schema_health_guards.py::test_no_table_exceeds_the_column_budget` —— 单表列数 > `column_ceiling`（30）且未登记 ⇒ 具名判红；台账宽度与现取不符（增宽 / 已收窄却仍留条目）⇒ 也红（台账只许缩短）。红证：拆掉台账里的 `customer_profiles` 例外 ⇒ 判红（`test_unregistered_wide_table_goes_red`）；把该表切到 20 列而台账不动 ⇒ 判「例外条目必须删除」（`test_wide_table_shrinking_forces_ledger_shrink`）。"
      - "**判据 2（孤儿列零增长）**：同文件::`test_orphan_columns_do_not_grow` —— 生产代码语料（`CORPUS_ROOTS`，不含 tests/docs）里 `snake_case` 与 `camelCase` 都零引用的列出现即红；台账里的死列已被引用却没缩短也红。红证：给 `narrow` 表加 `nobody_reads_me` ⇒ 具名判红。"
      - "**判据 3（JSONB 双向登记）**：同文件::`test_every_jsonb_column_is_registered` —— 新增 JSONB 未进台账 ⇒ 判红（强制一次显式决策：能排序/聚合/约束的应该是一列）；台账留了已删除的 JSONB ⇒ 也红。红证：`narrow.bag` / `gone.removed` 两向注入。"
      - "**判据 4（判别力自证）**：同文件::`test_toy_world_is_green` 是负控 —— 合成世界与**真语料**都必须绿，否则上面四条红证是空跑。"
      - "**边界（照实登记，§19.1）**：① 判不了设计判断（这张表该不该有、这个字段该不该拆）—— 那是评审与 `docs/wiki/Domain-Modeling.md` 的准入判据；② 孤儿列语料是**冻结清单**（新增服务目录须同 PR 加进语料，否则假红；这是有意的 fail-closed 方向）；③ 不新增 required check，跑在既有 `ci workflow helper unit tests` 腿里；④ 不改任何 schema —— 本单只加判据与台账，收敛 `customer_profiles` / `order_items` 属后续单（issue #7359 的承接项）。"
    precondition: "本用例是 [backend-contract] 纯静态判据：前置 = `backend/admin-api/src/main/resources/db/init/schema.sql` 与 `tests/unit_ci_workflows/schema_health_ledger.json` 在场且可解析；生产代码语料只读（不小于 500 个文件，语料口径坏了判据当场红）。零网络、零时钟、不起真库。"
