    merge_log: "2026-09-27 新增（issue #5687；用户逐字裁定 A = 给「重跑通过」加限制）：窗口型确定性缺陷被重跑掩盖 ⇒ 缺陷留在 main、明天同时段再红（可无限循环）。落码 = 时间桶判据（实例）+ 强制跟踪（机械落单）+ 类级 meta-guard（消红路径未登记即红 + 台账只许缩短 + 覆盖面显式登记）+ workflow 第三种动作 `mark_suspect` + 七条注入式红证（每条注明命中分支，含「只改注释」对照）。取号 MC-024：main 上 MC-001~MC-023 已占用（MC-022 = 同族时区窗口的实例修复、MC-023 = 部署触发面）。"
