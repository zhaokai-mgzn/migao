    merge_log: "2026-10-01 新增（issue #5853：用户就「优化 API 用量」三条通用建议（合并调用 / 精简 prompt / 按复杂度选模型）问「能否应用到米高研发模式」，并选定**技能分层**）：研发模式的加载成本集中在 migao-dev-flow —— 加载它 = 把整份 SKILL.md 放进上下文，而正文 `## 版本沿革` 节 = 1122 条目行 / 96,269 字符，沿革是纯历史记录、执行流程时零需要。本次把 dev-flow 与 migao-acceptance 两个技能的沿革**逐字**外置到同目录 CHANGELOG.md（SKILL.md 只留指针），**加载面** 328,954 → 231,203 字符（**-29.7%**）、acceptance 26,306 → 21,065（-19.9%）；三处「沿革写进正文」的口径副本同批改；类级守卫 = tests/unit_ci_workflows/test_skill_load_surface.py（回流即红 / 外置≠删除 / 指针在位 / 旧落点口径 / 内存红证 + 加载面定义对照）。⚠️ 判据在真实语料上当场抓到 1 条存量散落沿革（v1.91.0 写在 §27 尾部），同批并入。⚠️ **独立验收 agent 又抓到第 4 处副本**（description 里「已迁至正文」——换了动词故漏网，且在加载面内）⇒ 同 PR 修复 + 判据升级为扫「真加载面」并新增判据 6。⚠️ 未实装：不设体积上限（设了会挡住正常的纪律新增）、正文里支撑纪律的实证叙述不动、判不了「沿革内容是否完整」、判据 6 仍是字面形态判据（不重叠措辞在射程外）。取号 MC-052（现取 main + 全部在飞分支的 `- id:` 差集：main 最大 = MC-051）。"
