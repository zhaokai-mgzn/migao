    merge_log: "2026-09-27 新增（用户 2026-09-27 逐字裁定 = 方案 A：给两条发布腿补兜底触发面（周期重建重发布），静态形状判据才变成真绊线、可一并落判据收口；Refs #5707）：交付形态 = ① 两条腿各自补 `on.schedule`（每日档，cron 节流现取读数决定不取高频）② 判据 `tests/unit_ci_workflows/test_publish_leg_fallback_surface.py`（判据 1~8 + 判别力自证 + 真语料双向自证）③ 登记表 `tests/unit_ci_workflows/publish_leg_fallback_ledger.json`（只许缩短 + 覆盖边界八条）④ 台账 `FM-E17` 由 gap 翻 guarded 并新增 `PD-8`（`GAPS_FROZEN` 公开 2 → 1，`FM-E10` 仍留 gap）⑤ 本页 `docs/wiki/CI-CD.md` 的 FM-E17 节与计数器同批。⛔ **本单不动的**：两条腿的发布脚本与产物路径（只动触发面）· `deploy-reconcile.yml` · `FM-E10` · 那两条腿的路径缺口台账。⚠️ **与铁律 10 的关系（照实说明）**：铁律 10 写「不新增 schedule/cron」，其理由逐字是「无人值守**删除**不安全」⇒ 本单这条 schedule 走的是**重发布**路径，而远端发布脚本**明确不对静态根做清空 / delete**（先建 stage 再整份覆盖）⇒ 该理由不适用；且本单是**人类在本次会话显式裁定**的方案 A（「代价 = 占 CI 分钟」已被接受）。取号 MC-039：现取 main 最大 = MC-038，且现取全部在飞远端分支与在飞 PR 的 diff 都无 MC-039 及以上（`.github/cases/misc.yml` 的 id 逐个确认）⇒ 顺延取 MC-039（不动已合并的号）。"
