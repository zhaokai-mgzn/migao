      - "🔴 **远端执行体不进 SWAS 命令内容**（#6095；病 = run 37075737625 / sha f3e49752f 的 `400 CmdContent.ExceedLimit`）：命令内容只做「按**不可变 sha** 从 codeload 取回执行体并执行」，组装后**本机**前置断言字节数 < 上限（出处 = SWAS Open RunCommand 官方文档的 base64 综合 ≤ 16 KB；与 ECS 侧 64 KB 口径及本仓实测 43.8~50.7 KB 的冲突在脚本注释里照实登记，取最保守值）⇒ 超限在**本机**具名判红 + 给出「命令内容 N 字节 / 上限 M 字节」。红证 = ① 注入式：把上限压到 200 字节 ⇒ 判红并给读数 ② 把 20 KB 的远端脚本换进夹具 ⇒ 命令内容读数**不变**（解耦成立）③ 取不到执行体（坏 sha，真 404）⇒ 非零退出 + 「未做任何发布动作」具名原因（**实测教训**：`curl … | tar xz` 的管道会吞掉 curl 失败 ⇒ 引导必须用 `curl -o` + `-f` + 显式 `||` 判红）④ 把内联远端脚本的旧写法放回可执行行 ⇒ 结构判据判红（注释里**提及**不算 ⇒ 判据走 `_live_lines` 注释感知扫描）。取回通路与远端脚本自己取源码**同一条**（codeload；raw 在杭州机房超时）"
      - "🔴 **CI 构建的 dist 必须真的到得了服务器**（#6095 第三层；病 = run 37078030820 / sha `d4babbf17`：远端报 `❌ 发布源里没有 index.html` —— `frontend/mini-app/dist/**` 是构建产物（`git ls-tree -r origin/main --name-only frontend/mini-app/dist` = **0 个文件**，`.gitignore` 有 `dist/`），而远端唯一的取回通道是「按不可变 sha 从 codeload 取 tarball」⇒ 源码 tarball 里永远没有 dist）：治法 = CI 用**孤儿单提交**（`git commit-tree` **不给 `-p`** ⇒ 无父 ⇒ 不胀历史；临时 `GIT_INDEX_FILE` ⇒ 不碰工作区/索引/HEAD）把 `dist/**` 推成专用分支 `h5-dist`，远端按**该提交的 sha** 取回（`H5_SRC_SUBPATH=frontend/mini-app/dist`）⇒ 改动面最小（远端 `stage_product()` 一行不改）。判据 = ① 链路存在且**被接线**（workflow 里 `build:h5` 之后有 1 个 step 真跑 `deploy/scripts/c-end-h5-dist-push.sh`，发布步逐字消费 `steps.dist.outputs.sha`，且**不许**出现 `${{ github.sha }}`）② 取回 ref **是不可变 sha**（发布腿只接受 40 位十六进制 ⇒ `refs/heads/main` / `h5-dist` 连格式都过不去）③ **注入式红证**：摘掉推送步 / 把 ref 改成 `refs/heads/main` / 把孤儿提交改成普通提交（`-p`）⇒ 各自必红 ④ identity 断言（`[ \"$REMOTE_INDEX_SHA\" = \"$LOCAL_SHA\" ]`）仍在 ⑤ 命令内容**仍 < 16 KB**（dist 是 MB 级 ⇒ 绝不塞进命令内容）。**端到端桩演练**（本地假 origin + 真 `git commit-tree`/`push`/`archive`）证明「推上去 → 按 sha 取回 → 真有 dist/index.html」这条链在对象层是通的"
      - "🔴 **推送步骤不许继承运行环境**（#6095 第四层；病 = run **37081920188** / sha `aedc51ffb`：第三步（我新加的「Prepare dist ref」）在真 CI 上挂 —— `git commit-tree` 需要作者/提交者身份，而 CI runner 上没有身份源、系统 GECOS 为空 ⇒ `fatal: empty ident name (for <runner@…>) not allowed`（exit 128）；而**开发机会用 GECOS 自动兜一个非空身份** ⇒ 同一脚本**本机 rc=0 / runner rc=128**，即旧版桩演练「继承了环境」⇒ **证明不了 CI 会过**。同族：#6113（剔除继承来的 `MIGAO_HEAVY_L*`）。修法 = 造孤儿提交时**显式给身份**（`GIT_AUTHOR_NAME/EMAIL` + `GIT_COMMITTER_NAME/EMAIL` 四个**环境变量前缀** —— 取环境变量而不是 `-c user.name`，因为**环境变量优先于 config**：调用方环境里一个**空**的 `GIT_AUTHOR_NAME` 会把 `-c` 盖掉、仍然 `empty ident name`（实测）；身份 = `github-actions[bot]`（ID 41898282）⇒ 提交**可追溯**，承载的源码 commit 写在提交信息与托管清单的 `published_commit` 里）+ 清掉「我在哪个仓」的环境（`unset GIT_DIR GIT_WORK_TREE GIT_COMMON_DIR` ⇒ 否则 `GIT_DIR` 指向另一个仓时「往哪推」由环境决定）。判据 = `TestDistPushIdentityIndependence`（4 条）+ **桩演练改为在「无 ambient 身份」下跑**：空 `HOME` + `GIT_CONFIG_GLOBAL/SYSTEM=/dev/null` + `GIT_AUTHOR_NAME`/`GIT_COMMITTER_NAME` **显式置空**（把开发机的自动兜底也堵掉）；注入式红证 = ① 摘掉显式身份 ⇒ 复现 CI 那条 `empty ident name` ② 摘掉 `unset` 行 + 敌意 `GIT_DIR` ⇒ 具名判红（`dist 目录不在检出内`）"
      - "**新加的注入值必须过同一道白名单**（#6095 第四层同批扫出的**同类继承面**）：`H5_PUBLISHED_COMMIT`（本包新加、会被**拼进 SWAS 命令内容**）此前**没有**字符集校验，而该文件对 `SHA` / `STATIC_ROOT` / `MANIFEST` / `RESERVED_PREFIXES` 每个注入值都有白名单 ⇒ 新值不豁免同一道闸：只接受**空**（人工排障）或 **40 位十六进制**。判据 = `TestCiSideInjectedValuesAndMessages::test_published_commit_must_be_a_commit_sha_or_empty`（真跑组装段：坏值 / 短值判红，空值放行）"
      - "🔴🔴 **两个 ref 各司其职：引导取执行体 ≠ 远端取产物**（#6095 第五层；run **37084280991** / sha `c22514360`）：第三层把命令内容第 5 参数换成**产物 ref**（`h5-dist` 上只含 17 个 dist 文件的孤儿单提交）之后，**引导也按它取 codeload tarball** ⇒ 取回的执行体目录里**没有** `deploy/swas/c-end-h5-publish-remote.sh` ⇒ 远端 `bash: /tmp/tmp.XXXX/deploy/swas/c-end-h5-publish-remote.sh: No such file or directory`（`InvocationStatus=Failed`，线上产物照旧陈旧）。**为什么前四层都放它过去了**：第三层的桩演练把「远端执行」**打桩**了（从不真取回并执行执行体），第二层的桩演练当时还没有「产物 ref ≠ 源码 commit」这个形态 ⇒ **两侧各自的假设都成立、组合不成立**（与第三/四层同族：每块判据都绿，拼起来错）。修法 = `DIST_SHA`（产物 ref，第 5 参数 / `H5_DIST_SHA`，**不再回落到 `$GITHUB_SHA`**）与 `SCRIPT_SHA`（执行体 ref = `H5_PUBLISHED_COMMIT` / `GITHUB_SHA`）分离：命令内容里 `export H5_PUBLISH_SHA=$SHA`（远端 `stage_product()` 按它取产物）、引导 URL 用 `$SCRIPT_SHA`；CLI 侧对执行体 ref 同等做白名单 + 40 位断言。判据 = `TestTwoRefsCombination`（**组合层**：真造两个提交 —— 一个含脚本、一个由**真** `c-end-h5-dist-push.sh` 产出只含 dist；真跑组装段；真 `git archive` 取回两棵 tarball；真执行取回的执行体 + 取回的产物 ⇒ rc=0 且清单里两个字段各就各位）4 条 + 静态接线判据两条（`BOOT_SCRIPT_REF_FORM` 必须在、`BOOT_PRODUCT_REF_FORM` 必须不在）+ `TestRedProofs` 两条混用形态变异；注入式红证 = ① 引导改回按产物 ref 取（**用合并后 main 上那份脚本喂进同一夹具 ⇒ 真复现 `No such file or directory` rc=127**）② 远端产物 ref 漂成执行体 ref（源码 tarball 里没有 dist）。审计面同族修：远端清单原先写 `published_commit or sha`（`sha` = 产物 ref）⇒ 没给源码 commit 时会把**产物 ref** 标成「源码 commit」，已改为 `published_commit or \"\"`（判据 = `test_audit_fields_never_conflate_the_two_refs`）"
