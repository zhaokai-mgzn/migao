      - "**新鲜度判据翻成 gate**（同批，用户裁定 B）：陈旧 ⇒ 默认 `::error::` + exit 2（`--no-gate` 仅人工诊断），且 **⛔ 无 cron** 不变、`workflow_run` 清单新增本腿；三态分离保持（取不到读数 = exit **3**，不得当新鲜、也不得与「确实陈旧」的 2 混在一起）"
      - "**对账面同批接线**（FM-E3）：`deploy-reconcile.yml` 新增 `c-end-h5` 腿（走漂移判据 ②）+ 进 `SVC_TO_DEPLOY_WORKFLOW` 登记册 + 存活读数 `--seen` 随腿数改 6；触发面 ≠ 对账面那两条发布链路文件逐条登记进 `reconcile_trigger_paths_ledger.json` 并标 `never_in_trigger`（明文禁止「加进触发面消账」这条出路）"
      - "**类级元守卫**：`h5_freshness_guard.py` 的默认口径与 workflow 的输入语义、三态、无 cron 由常驻判据钉住（改回 warning / 加 cron / 把反向开关改回 `gate` ⇒ 红）"
