      - "🔴 **判据 6（禁止编步骤，结构 + 文本 + 上游三层）**：① **结构** —— `ToolResult.data` 的键**白名单**（`registered`/`featureId`/`label`/`pages`/`deniedMenuNames`/`citation`）与页面项键白名单（`menuGroup`/`menuName`/`path`/`requiredPermission`）⇒ `steps` 这类字段**结构上进不来**；② **文本** —— **真跑** `NavGuideTool.execute`（直连接线：把工具模块里的 `build_navigation_answer` 换成被测函数）得到的 `message`/`suggestion`/`data` 里不得出现受控步骤词表（`第一步`/`点击`/`按钮`/…），且每条回复都必须含「我没有步骤级指引」的如实告知；③ **上游** —— `app/tools/nav_guide.py` 源码（含**注入模型**的 `description`）里不得出现步骤词"
      - "**判据 6b（别名不得退化成同义词词典）**：每条 `aliases` 必须与它所属节点的菜单名有**包含关系**（导入期自检 + 判据双闸）；「换一个新叫法」的唯一正确做法是先改菜单名，不是在别名表里偷偷扩同义词"
      - "**类级元守卫（工具面）**：`nav_guide` 注册进 `create_default_registry()` + 从 `app/tools` 门面导出 + `read_only=True` + **不声明权限码**（纯本地、零 admin-api 调用点，登记在 `LOCAL_ONLY_TOOLS`，与 `interact`/`image_recognize` 同口径）+ 绑 B 端 `general` 兜底 skill（不绑 = 能力谎报）+ B 端专属只读见证集 25 ⇒ **26** 把（`test_readonly_cross_domain_sharing.py`，C 端零改动由此量化）"
      - "🔴 **注入式红证（11 条，实测读数见 PR body）**：① 假菜单路径 ⇒ `problems_paths_exist` 报出；①b 删节点 ⇒ **模块导入期自检**抛 `MenuNavigatorError: orders：引用了 MENU_TREE 里不存在的节点 ('trade-center', '销售订单')`；①c 换序 / 内存桩缺节点 ⇒ `problems_coverage` 具名报出；② 假权限码 `ghost:code` ⇒ `problems_codes_real` 报出；③ 未命中改成「猜第一条」⇒ `problems_default_deny` 报出；④ 去掉裁剪 ⇒ 无权角色拿到 `pages`；④b 给 `build_navigation_answer` 加 `role` 形参 ⇒ 签名判据报出；⑤ citation 摘掉两段模板字面量 ⇒ `problems_citation` 报出；⑥a 往 `data` 加 `steps` ⇒ 键白名单报出；⑥b 在**工具源码**文本面塞祈使步骤 ⇒ `problems_no_step_wording` 报出；⑥c 自由同义词 ⇒ 导入期自检抛 `MenuNavigatorError`（同条判据的内存桩臂另证判别力）。**对照读数**：只改一行注释 ⇒ 八条判据**全绿**"
      - "🔴 **本文件跑在没装 ai-agent 依赖的解释器里**（CI 的 `ci workflow helper unit tests` job 只装 `pytest pyyaml`）：因此**一律不 import `app.*`**（`app.tools.*` 会拉 `pydantic` / `langchain_core` ⇒ 本地绿、CI 红，实测 6 failed）。本文件只做**静态**判据（AST / 源码文本）+ 运行**零依赖**的纯函数（`app/context/menu_navigator.py` 只依赖标准库）；**需要真 import 的行为面**（工具真跑一遍的返回形状、`visible_nodes` 的裁剪、回复里也无步骤词）在 `backend/ai-agent-service/tests/test_nav_guide.py`（那里有依赖）——两处不重复同一断言。**复算方式（两侧都要跑）**：`PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 PYTHONPATH=<毒化 pydantic/langchain_core/app 的目录> python3 -m pytest tests/unit_ci_workflows/test_menu_navigator.py -q` ⇒ 31 passed（在**装不了**这些包的环境里也全绿）"
    skip_reason: "[backend-contract] 真值源与菜单单一源的结构对账（源码静态事实 + 内存注入 + 真跑工具形状），零 LLM、秒级、不连网不连库；承载体 = tests/unit_ci_workflows/test_menu_navigator.py，非 LLM 行为，不进入 agent-eval 冒烟"
    merge_log: "2026-10-02 新增（issue #5989，P1；用户 2026-10-02 逐字裁定：真值源 = **C 混合**、**第一批只做导航类**、问「怎么做」⇒ 给导航 + **如实说没有步骤级指引**、**禁止 LLM 编步骤**；#5989 余下的 **P2 主动新手引导不在本包**，本包只预留接口）。落码 = ① 真值源 `backend/ai-agent-service/app/context/menu_navigator.py`（结构层 = `config/menu.ts` 的 22 节点镜像 + 语义层 = 22 条**显式登记**的「意图 → 功能」，路径与权限码**派生**不手抄；导入期自检 fail-closed；`visible_nodes`/`nodes_for_feature` = **P2 预留接口**）② 工具 `backend/ai-agent-service/app/tools/nav_guide.py`（纯本地只读、零 admin-api 调用点、**不声明权限码**、`data` 键白名单结构上不含 steps、注册 + 门面导出 + 绑 `general` 兜底）③ 提示词口径（`general_agent.py` 三条硬纪律：不得扩写成步骤 / 未命中就说未命中 / 权限按工具裁剪口径说）④ 判据 tests/unit_ci_workflows/test_menu_navigator.py（八条判据 + 11 条注入式红证 + 接线面直连 + 内存桩判别力）⑤ 登记面四处同步（`test_agent_permission_parity.py` 的 `LOCAL_ONLY_TOOLS`、`test_readonly_cross_domain_sharing.py` 见证集 26、`test_graph_skills.py` 的 `GENERAL_TOOLS` 等值集、本用例）。⚠️ **未覆盖（照实登记）**：P2 的推送面（触发条件 / 频率上限 / 未登记页面不推）**不在本包**；LLM 是否**真的**引用了 citation / 真的没编步骤属行为面（本判据只证「可追溯、不可编」的**必要条件**）；别名只能取菜单名的子串 ⇒ 用户口语与菜单名差异大时以「未登记」如实回复（**有意选择**：宁可说不知道，也不做近似匹配）。取号 **MC-065**（**合并态连续撞号后顺延，记实**）：起草时现取 `origin/main` 最大 = **MC-061**（此刻 0 个 open PR 改 `.github/cases/misc.yml`）⇒ 按「当前最大号 + 1」取 MC-062；**推送后合并态实测**：main 的 `975b97ac1`（#6001）已占 **MC-062**、#5983 那条列表页写按钮元守卫已占 **MC-063**，而在飞 PR #5994 占 **MC-064** ⇒ **连续撞三次**，按「后合入者让号」顺延为 **MC-065**（沿用 MC-054/055/056 先例）。⚠️ **教训（本仓第 N 次实证）**：取号判据只看**已合并 + 在飞**状态，拦不住「合并后才进 main 的同号包」与「同时开写的并行包」；**改共用用例源必须 rebase 到最新 main 后再取号 + 重渲染生成物**（新鲜度判据跑在 `head + main` 的合并态）。"
