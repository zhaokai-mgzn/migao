  # ==========================================================================
  # MC-020（issue #5242，P1）：红证机具的「判别力」判决必须先区分「跑起来了没有」。
  # 病：`saving-metrics-red-proof-backend.py` 用 `proc.returncode != 0` 判「判据有判别力」，
  # 而**编译失败 / 环境事故同样 `rc != 0`**（Maven 在编译期就退出 ⇒ 测试一行没跑）
  # ⇒ 事故被读成「变异被抓到了」。与 #5216（读**陈旧报告**）同族，只是载体换成「不用报告、只看退出码」。
  # 病根同一个：**把环境事故误读成判据有效**（错误归因比没有红证更危险）。
  # ==========================================================================
  - id: MC-020
    legacy_id: ""
    title: "红证机具判别力判决的证据闸——先区分「跑起来了没有」再谈判别力（不许把编译失败读成「判据有判别力」）"
    domains:
      - misc
      - ci
    tier: normal
    tags:
      - ci
      - red-proof
      - mutation_testing
      - fail-closed
    truths_ref: []
    # ⚠️ 真值暂缺：红证机具的判决语义（非 LLM/业务真值），由 tests/unit_ci_workflows/test_redproof_harness_gate.py 验证。
    user_inputs:
      - "红证机具所守卫的源码被改坏、或构建环境出事故（编译失败 / 测试收集失败）之后，机具给出的「判据有判别力」结论必须仍然可信 —— 拿不到「测试真的跑起来了」的证据时，结论只能是「无法判定」"
    expectations:
      - tool: direct_reply
    data_checks:
      - "适用面（由 **AST** 决定，注释 / docstring 喂不动）：「用退出码判判别力」= 源码里有 `.returncode` 属性访问 **且** 渲染「判据有判别力」这个判决（非 docstring 字符串常量）⇒ 恰为 `saving-metrics-red-proof-backend.py` 与 `saving-metrics-red-proof-web.py` 两台；该集合本身被断言钉住（不得静默放宽，也不得在空集上恒真）"
      - "证据闸（路线 B，stdout 面）：机具必须提供模块级 `run_evidence(out)`，输出里出现「测试真的跑起来了」的证据（`BUILD SUCCESS` / `Tests run: N` / vitest 带计数的 `Tests` 汇总行）才算跑过；判据把该函数**抽出来喂三组夹具真跑** —— 负向夹具（编译失败 / 变换·收集失败）必须得 None，正向夹具（判据真的被执行并失败）必须得证据"
      - "位置性事实：证据闸（`if run_evidence(...) is None:`）的行号必须**小于**判决点行号（「先区分跑起来了没有，**再**谈判别力」的那个「先」）；闸里必须有三态出口 `sys.exit(UNKNOWN)`（= 3 = 无法判定），**不得**回落到「有判别力」；恢复后的复跑同样受这道闸约束（否则编译失败会被读成「恢复不干净」）"
      - "红证（四条注入**各能单独变红**）：① 删掉证据闸 ② 三态出口削成 `sys.exit(1)` ③ `run_evidence()` 换成「永远说有证据」（= 退回只看退出码的语义；结构一字未动 ⇒ 红只能来自行为判据）④ 把闸写到判决**之后** ⇒ 同名判据逐条变红"
      - "路线 A（#5216 报告面）的机具**不重复施加**本判据（同一口径只放一处，两处必然漂移）：`auto-batch-red-proof.py` / `auto-batch-due-scan-red-proof.py` / `pool-board-red-proof.py` 读 surefire 报告且已有「跑前 unlink + 缺失即 raise」⇒ 由同文件的 `_hygiene_problems()` 判；排除是**条件性**的 —— 那台机具的报告卫生一旦被拆掉，它立刻落回本判据管"
      - "现状读数（**已复核，真跑贴原始输出**）：干净树上注入语法错误造一次编译失败 ⇒ **改前**机具对 5 条变异**全部**打印「✅ 红（判据有判别力）」、末行还打印「恢复后 rc=1（仍有红 ⇒ 恢复不干净）」（**两处错误归因**）；**改后**同一次注入 ⇒ 首条即「❓ 无法判定（编译失败 / 环境事故 ⇒ 测试一行都没跑）」+ 退出码 **3**。对照组 = 真变异 + 正常编译 ⇒ 判决行与改前**逐字一致**"
    skip_reason: "[backend-contract] 红证机具的判决语义由 pytest 静态判据 + 注入式红证（含真跑 run_evidence 夹具）验证（tests/unit_ci_workflows/test_redproof_harness_gate.py），非 LLM 行为，不进入 agent-eval 冒烟"
    merge_log: "2026-09-23 新增（issue #5242，P1，与 #5216 同族的另一半）：机具用裸退出码判「判据有判别力」⇒ 编译失败 / 环境事故被读成「变异被抓到了」。修法 = 证据闸（stdout 面，`-q` 会吞掉证据故一并去掉）+ 三态出口（exit 3 = 无法判定），并把「不许只用裸 returncode 判判别力」做成机械判据（四条注入式红证 + 对 run_evidence 喂夹具真跑）。同批修 web（npm/vitest）那半。取号 MC-020：main 上 MC-001~MC-019 已占用，MC-020 在 main 与全部在飞分支上均未占用。"
    traces:
      tests:
        - "tests/unit_ci_workflows/test_redproof_harness_gate.py"
      ci:
        - pr-check.yml
      verifies: []

