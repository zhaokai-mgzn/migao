    truths_ref: []
    # ⚠️ 真值暂缺：本判据是**纯静态**的文本 ⇄ 清单对账（只读仓内三个文件；零真库、零网络、零 LLM、
    # 不 import ai-agent 依赖），由 tests/unit_ci_workflows/test_rbac_role_list_doc_consistency.py 验证，
    # 非 LLM 行为，不进入 agent-eval 冒烟。
    user_inputs:
      - "当有人在 `rbac/manifest.json` 里增删一个种子岗位码而不同步 `docs/wiki/RBAC.md` 的清单声明行、或反过来只改文档、或把 V137 正式化的岗位码改掉而不同步它的声明行、或把声明行写到解析不出来的形态时，必须有判据**具名**报出（报出少/多了哪几个码）；而只改与清单无关的散文时不得报红"
    expectations:
      - tool: direct_reply
    data_checks:
      - "**病（验收报告 §四·F7，issue #5984）**：`docs/wiki/RBAC.md` 写「新租户注册初始化**五岗**种子（管理员/客服/运营/销售/财务）」，而实测新租户是 **7 岗**（多出 `product_manager` / `knowledge_editor`，由 `V137__formalize_legacy_roles.sql` 正式定义）。#5992 改了字面但**没有留任何判据**把它钉住 ⇒ 清单再变时文档会静默漂移，而「文档 vs 实测」的差只能靠人工验收再发现一次。"
      - "**判据 1（主判据：文档清单 ⇄ 真值源逐值相等）**：`docs/wiki/RBAC.md` 的清单声明行（以 `> 新租户注册初始化` 起头的那一行 + 它的**一行**续行）里的岗位码集合，必须与 `rbac/manifest.json` 的 `roles.seed` 键集合**逐值相等**；行内的 `**<中文数字>岗**` 必须等于真值源条数。执行点 = tests/unit_ci_workflows/test_rbac_role_list_doc_consistency.py 的 `test_doc_seed_role_list_matches_manifest`。"
      - "**判据 2（正向钉死集合，不是数量相等）**：文档清单排序后必须逐值等于 `roles.seed`，且行内中文数字 == 条数。执行点 = 同文件 `test_doc_seed_roles_are_the_manifest_seed_exactly`。"
