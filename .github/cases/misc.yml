  # MC-058（issue #5941）：部署腿「跳过 / 终态」判据的**凭据 + 自证** —— 缺一即形同不存在；未接即红。
  - id: MC-058
    legacy_id: ''
    title: '部署腿的「已构建就跳过」判据必须**真的能生效**：同一份 `gh run list` 查询要有凭据（`permissions: actions: read` + step 级 `GH_TOKEN`）、失败要出声、fail-open 要具名；未接即红'
    domains:
      - misc
      - ci
    tier: normal
    tags:
      - ci
      - deploy
      - credential
      - red-proof
      - ledger
    truths_ref: []
    user_inputs:
      - 同一 commit 在两轮 schedule 里被**完整**部署两次（sha=3fa84ab，19:04:47Z 与 23:11:07Z，各 6–8min）⇒「已构建就跳过」这道闸必须**真的生效**：同 sha 的部署 run 已 success 的 tick 必须走 `skip=true` 并在 step summary 写明理由；判据不可用时**可以**照旧全量部署，但必须**具名出声**（不许静默）
    expectations:
      - tool: direct_reply
    data_checks:
      - '**病（实测）**：三条 deploy 腿的 `Skip if already built (schedule reconcile)` 步用**同一次** `gh run list --workflow … --branch main --limit 30 --json …` 判定 C′「同 sha 已 success ⇒ 跳过」与「不可恢复终态 / 仍在跑 ⇒ 不重复派」，而三条 workflow 都**没有**给该步注入凭据（workflow 级只有 `contents: read`、step 里没有 `GH_TOKEN`）⇒ `gh` 未认证 ⇒ 查询恒失败，而 `2>/dev/null || echo "[]"` 把失败**整层吞掉**（本机实测：未认证 `gh run list` = exit 4 + `To get started with GitHub CLI, please run: gh auth login`；套上工作流那一行后 = exit 0、**stderr 为空**、stdout `[]`）⇒ `LAST_STATUS/LAST_CONCLUSION` 恒空 ⇒ 跳过臂**从未生效**。实测 run `36939400575`（2026-10-01T23:11:07Z，sha=3fa84ab，event=schedule）：step env 块里逐字没有 `GH_TOKEN`、输出逐字「最近一次同 sha 的 run 结论 = `无记录`」⇒ 跑完整 `npm ci → Type check → Unit tests → Deploy to SWAS`；而同一 sha 在 19:04:47Z 已完整部署成功过一次。'
      - '**修法（三条，缺一不可）**：① 凭据 = workflow 级 `permissions: actions: read` + step 级 `env: GH_TOKEN: ${{ github.token }}`（最小权限）② 出声 = 凭据自检 `gh auth status` 的 exit code、查询 exit code、返回条数、**stderr 原文**一律打印（`2>/dev/null` 那层静默拿掉）③ fail-open 具名 = 查不到时**照旧全量部署**（现状口径：本检查自己出错绝不停掉部署），但日志 + step summary 必须写明「跳过判据不可用 ⇒ 本轮全量部署」。外加**二阶缺陷**：`gh run list` 把当前 in_progress 的 run 排在 `[0]`（本机现取 2026-10-02）⇒ `[.[] | select(.headSha == $s)][0]` 永远取到「自己」⇒ 即使注入凭据，C′ 的 `completed + success` 也恒不成立（改前实测：落到「不可恢复的终态」那一臂、**理由错**（把 `status=in_progress` 打成终态）、**step summary 为空**）⇒ 查询结果必须先排除本轮 run 自己（`databaseId` vs `GITHUB_RUN_ID`）。'
      - '**判据**：`tests/unit_ci_workflows/test_deploy_skip_credential.py`（现取 22 passed）① 类级自动发现面 = `.github/workflows/deploy-*.yml` 里**每一步**跑 `gh run list` 的 step 都必须有凭据（step 级 token env + workflow 级 `actions: read|write`）② 跳过腿（写 `skip=`）还必须带自证面（逐字锚点 = 凭据自检 / 查询 exit code / 返回条数 / `::warning::` / `跳过判据**不可用**` / `GITHUB_STEP_SUMMARY` / 自排除表达式），且 `gh run list` 的**整条语句**（含续行）不得再挂 `2>/dev/null` ③ 双向登记进台账 `tests/unit_ci_workflows/deploy_skip_credential_ledger.json`（未登记即红；豁免上界冻结在判据里 `EXEMPTIONS_FROZEN = 0`，**只许缩短**）④ 执行式行为面（桩 `gh`/`docker`，零网络）：a) 无凭据 ⇒ 出声 + 具名 fail-open + `skip=false`（**不许**改成停部署）b) 同 sha 已 success 且本轮自己在跑 ⇒ `skip=true` + step summary 写明 C′ 理由 c) 同 sha 另一条在跑 ⇒ `skip=true`（不重复派）⑤ 注入式红证 8 条（拿掉凭据注入 / `actions: read` / 任一条自证 / 自排除表达式 ⇒ 各自具名红；只加注释 ⇒ 不红）。**修前红读数**（把 origin/main 三份正文喂进同一套判据函数）：凭据判据 **6** 条、自证判据 **21** 条。'
    skip_reason: '[backend-contract] CI / workflow 结构判据（零 LLM、秒级、只读仓内 YAML + 桩 gh/docker）由 tests/unit_ci_workflows/test_deploy_skip_credential.py 验证，非 LLM 行为，不进入 agent-eval 冒烟'
    merge_log: '2026-10-02 新增（issue #5941：同一 sha 6h 内被完整部署两次 —— 「已构建就跳过」的机制从未生效，三条 deploy 腿的同一份查询无凭据 ⇒ fail-open 恒走全量部署）。⚠️ **先诊断后修**：issue 把成因写成「集成侧推出」的最可能假设（未直接观测到 `gh` 的报错，因为它被 `2>/dev/null` 吞了）⇒ 本包先取三次直接读数再动手：① 本机复现未认证 `gh run list` = exit 4 + 逐字 stderr；② 套上工作流那一行 = exit 0 / stderr **空** / stdout `[]`（= 静默成立）③ 真实 run `36939400575` 的日志里 step env 块逐字没有 `GH_TOKEN`、输出逐字「无记录」⇒ **假设被证实**（并额外现取到二阶缺陷：`gh run list` 把本轮 run 自己排在 `[0]`）。落地 = `.github/workflows/deploy-{admin-api,ai-agent-service,frontend}.yml` 三腿同批（`permissions: actions: read` + step 级 `GH_TOKEN` + 自证段 + fail-open 具名 + 自排除）+ 判据 + 台账 + 8 条注入式红证。取号 **MC-058**：`python3 scripts/next_case_id.py MC` 给的是**历史空档 MC-049**（该号写在**已 CLOSED 的 PR #5818 分支** `ci/5814-migrate-pr-legs` 里 ⇒ 空档号 ≠ 可用号，沿用 MC-055/056 的先例）⇒ 按「当前最大号 + 1」取；现取 main 最大 = MC-056、在飞 PR #5940（issue #5935）占 MC-057 ⇒ **MC-058**。⚠️ 未固化：`gh` 的真实凭据语义（public 仓读 runs 是否需要 `actions: read`）只能由合并后第一个 schedule tick 的读数确认，桩面判不了。'
    traces:
      ci:
        - pr-check.yml
      tests:
        - tests/unit_ci_workflows/test_deploy_skip_credential.py
      verifies: []

  # MC-059（issue #5944）：deploy 腿的 `set -u` 未定义变量 lint **把 shell 注释一起扫** ⇒
  # 注释里写 `$foo` 假红（实测把 PR #5943 挡了两次，作者只能把注释改写成不含 `$` 的措辞）。
  - id: MC-059
    legacy_id: ""
    title: "deploy 腿 `set -u` 未定义变量 lint 必须 **comment-aware**（issue #5944）：注释里的 `$foo`/`$bar` 不判红，同一句搬到可执行行照旧**具名**红；剥注释复用仓内唯一实现（`.github/danger_scan.py::strip_comment`）且**不得误截断** `${VAR#prefix}` / `${VAR##pattern}` / 引号内的 `#`"
    domains:
      - misc
      - ci
    tier: normal
    tags:
      - ci
      - workflow
      - lint
      - comment-aware
      - red-proof
    truths_ref: []
    # 由 tests/unit_ci_workflows/test_deploy_leg_run_undefined_vars.py 验证，非 LLM 行为，不进入 agent-eval 冒烟。
    user_inputs:
      - "（研发工具 / 判据级，无 C 端行为）「注释里的 `$foo`」不得被判成未定义变量：注释**不参与执行** ⇒ 它既不是未定义引用、也不可能产生 `set -u` 的 unbound variable；而把**同一句**搬到可执行行必须照样具名判红 —— 本单治的是**假红**，**不放宽射程**"
    expectations: []
    data_checks:
      - "**病（现取读数，2026-10-02）**：在某条 deploy 腿的 `run` 正文里写一句**只是注释**的说明，只要含 `$foo` 就判红。内存复算（直接调 `tests/unit_ci_workflows/test_deploy_leg_run_undefined_vars.py` 的 `_lint`，喂合成语料）= `['x.yml::demo::foo']`（假红）。根因 = 清洗只有 `SINGLE_QUOTED.sub` + `EXPR.sub`，**没有剥注释**。影响（为什么值得单独立案）：作者唯一的过关办法是**把注释改写成不含 `$` 的措辞** —— 这正是本仓最忌的「判红逼人把东西写得更差」（本次实测：同一 PR **被挡两次**，两次都是改写注释）。"
      - "**修法（复用优先，不另造尺子）**：`_lint` 的清洗链前面加一环 `_without_comments(body)`（逐行调 `.github/danger_scan.py::strip_comment`，仓内**唯一**一份剥注释实现，issue #5268）—— **不新增第二份**（判据 4d 按 `is` 判同源）。⚠️ **顺序不许反**：剥注释必须在 `EXPR` / `SINGLE_QUOTED` **之前**，否则注释里的一个撇号（`# don't do this`）会跟后文任意一个 `'` 配对、把两者之间的**真代码整段抹掉** ⇒ 真未定义变量**漏检**（实测改前读数 `[]`、改后 `['x.yml::demo::REAL_UNDEFINED']`）—— 那是比假红更坏的**反向缺陷**，由负例锚 `test_comment_apostrophe_does_not_hide_a_real_ref` 钉住。"
      - "**射程不放宽的现取证据（全仓 41 个 workflow 文件，改前 ⇄ 改后走同一入口）**：判红条数 **13 → 11**；**新增 0 条**（没有任何真判据被这次修复吃掉）；消失的 2 条**逐条都是注释形态**（`.github/workflows/deploy-reconcile.yml` 的 step `值守面（超时未部署 ⇒ 判红 + 开/清值守 issue）` 里那句注释 `变量一律 ${X:-} 兜底`；`.github/workflows/verify-trigger.yml` 里那句注释 `index($n)`）。三条 deploy 腿改前 = 改后 = `[]`。"
      - "**判据 4~5（全部在 `tests/unit_ci_workflows/test_deploy_leg_run_undefined_vars.py`）**：① `test_comment_only_refs_are_not_flagged`（注释含 `$foo`/`$bar` ⇒ `[]`）② `test_executable_line_ref_is_flagged_by_name`（同一句搬到可执行行 ⇒ `['x.yml::demo::bar', 'x.yml::demo::foo']`；先断言「语料变异真的生效」）③ `test_comment_stripping_does_not_misfire`（**4 条负例锚**：`${VAR#prefix}` / `${VAR##pattern}` / 单引号 / 双引号内含 `#`；每条**尾部再挂一个真未定义引用** ⇒ 若被误当注释截断，尾部真判据会连带消失、断言当场红 —— 不是「恰好绿」）④ `test_comment_awareness_has_discriminating_power`（**注入式双向**：把尺子换成恒等函数 = 改前形态 ⇒ 注释语料**必须变红**、可执行行照旧红、撤掉注入回到 `[]`）⑤ `test_strip_comment_has_a_single_implementation`（同源 = 同一对象 + 本文件没有第二份实现）。另有 `test_shared_yardstick_is_shell_safe` 直接打在尺子本体上（4 条负例 + 1 条反向对照）。"
      - "**修前红（§28.1 出口①：临时反转 / 注入）**：把 `_lint` 的清洗那一环临时退回改前形态（`_without_comments(body)` → `body`；逐字节恢复已用 `cmp` 自证）⇒ 本文件判据 **3 failed / 12 passed**，失败三条 = `test_comment_only_refs_are_not_flagged` / `test_comment_apostrophe_does_not_hide_a_real_ref` / `test_comment_awareness_has_discriminating_power`。复算 = `python3 -m pytest tests/unit_ci_workflows/test_deploy_leg_run_undefined_vars.py -q`。"
      - "**接线声明（§28.2.1）**：本判据显式声明 `WIRING_UNDER_TEST = .github/danger_scan.py::strip_comment` 并登记进 `tests/unit_ci_workflows/wiring_claims_ledger.json` ⇒ 该锚被删 / 改名时 `tests/unit_ci_workflows/test_wiring_claims_registry.py` 的判据 3 具名判红（**摘掉接线 ⇒ 红**）。"
