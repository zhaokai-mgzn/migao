  # 而归因**指向那个无辜的 PR**（判据读到的对象与它声称的不是同一个）。
  # ==========================================================================
  - id: MC-025
    legacy_id: ""
    title: "生成物的人读摘要必须由现取推导：casebook 的「用例总数 / tier 分布」两行与源逐值相等，且摘要声称的条数 = 文档里真实出现的块数"
    domains:
