  - id: MC-087
    legacy_id: ""
    title: "部署链路的「磁盘水位 × 回收」联动 + 被前置闸门挡住时的收口归因（issue #6508 / #6505 / #6512）：恢复出口按水位选窗口（固定 168h 在真机是 `Total: 0B` 的空操作）；构建缓存读数不许是 `?`；`-af` 只许落在恢复出口；闸门中止打机读标记 `ABORT_REASON=`，CI 收口按标记分支（未开始部署 ≠ 环境可能坏）；构建后「回收量为 0」的告警由水位守卫（水位充裕 ⇒ 只打信息行「属预期」）+ 回收量口径 = 缓存占用差"
    domains:
      - misc
      - ci
    tier: normal
    tags: [backend-contract, deploy, swas, disk, cache, observability, fail-closed, red-proof]
    truths_ref: []
    user_inputs:
      - "有一次是磁盘把三条部署腿全挡住了，脚本给的恢复出口在本机跑出来是空的（Total: 0B），我是自己又算了一层才解开的"
      - "同一次 run 里远端说「构建前磁盘可用 4045MB < 门槛 4096MB ⇒ 中止构建（旧容器保持不动）」，CI 收口却说「且自动回滚也失败 ⇒ 环境可能处于坏状态，请立即人工介入」——实际构建根本没开始"
    expectations: []
    data_checks:
      - "**病 1（issue #6508，真机实测 2026-10-07）**：`deploy/swas/deploy.sh` 给运维的恢复出口写死 `docker builder prune --filter until=168h`，而缓存条目全是 72h 内建的 ⇒ 匹配 **0 条**、`Total: 0B`（同一时刻 `until=48h` 解出 6.745GB）⇒ **照着提示敲解决不了问题**；且 Build Cache 12.44GB / 184 条 / 100% RECLAIMABLE **完全不在保留策略里**（只增不减），部署日志那一格逐字是 `构建缓存：?`。"
      - "**病 2（issue #6505）**：同一次 run 里，远端说「构建前磁盘可用：4045MB < 门槛 4096MB ⇒ 中止构建（旧容器保持不动、环境未受影响）」，CI 收口说「部署失败…且**自动回滚（tag=sha-e0e3bdf）也失败** ⇒ 环境可能处于坏状态，请立即人工介入」——实际**构建根本没开始、在跑的服务一动没动**；而回滚腿命中的是**同一道闸门**（4045MB / 4046MB 都 < 4096MB），不是第二次独立故障。"
