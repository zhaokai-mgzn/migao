    # 由 tests/unit_ci_workflows/test_menu_navigator.py 的三条类级判据 + 注入式红证，以及
    # backend/ai-agent-service/tests/test_nav_guide.py 的真跑工具判据验证，零 LLM、零网络、零 DB、秒级。
    precondition:
      - "员工管理页在 config/menu.ts 的导航节点里存在（key=employees / path=/employees / 码=employee:list）—— 本用例问的「员工账号开通」指向这一页；菜单被删或改名 ⇒ 本用例的前置不成立，应由登记面判据先红"
