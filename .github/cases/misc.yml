    data_checks:
      - "**判据 1（🔴 ref 与门槛必须按闸门口径）**：`price_change` ⇒ ref = **SKU id**；`stocktake_diff` ⇒ ref = **盘点单号**（不是 id）；`credit_override` ⇒ ref = **客户手机号**。写错 ref 的后果是「审批通过了却用不上」，而审批中心看起来完全正常。判据 = `approval-request.test.ts` 三条逐格（含「盘点差异用 stocktakeNo」的注释级红证）。"
      - "**判据 2（金额默认取门槛）**：盘点差异预填 = 差异合计**绝对值**（盘盈盘亏都要正数门槛）；改价不预填（前端拿不到成本价）但提示点名「要 ≥ 成本价」；差异合计未知（还没数完）⇒ 不预填并换提示。判据 = 同上 + `#还没数完` 用例。"
      - "**判据 3（金额留空不传 0）**：留空 ⇒ 请求里**没有** `amount` 字段（传 0 会让「金额 ≥ 门槛」恒不成立，等于白提）。判据 = `RequestApprovalModal.test.tsx#金额留空 ⇒ 请求里不带 amount`。"
      - "**判据 4（理由必填）**：不写理由当场拦、不发请求。判据 = `#理由必填`。"
      - "**判据 5（服务端原话上屏）**：同一对象已有待审申请等拒绝原话照实显示。判据 = `#服务端拒的原话上屏`。"
      - "**判据 6（🔴 就地预填 · 端到端）**：盘点单「完成」被拒（含「盘点差异」字样）⇒ 自动摆出申请弹窗，对象 = 该盘点单号、金额 = 差异合计；提交 payload 逐字正确。价格本保存被拒（含「改价」字样）⇒ 对象 = 当前 SKU id。判据 = `stocktakes.test.tsx#完成被拒 ⇒ 就地预填申请`（红证：把自动摆出的条件改恒 false ⇒ 该用例当场红，已注入并回滚）+ `price-books.test.tsx#低于成本被拒 ⇒ 就地开「改价」审批`。"
      - "**判据 7（超授信入口 · issue #7374 段 4）**：订单创建被「超出客户授信额度」拒 ⇒ 自动弹申请，ref = **客户手机号**、金额取原文里的「尚缺额」而**不是**订单总额（批多了白占额度）；千分位逗号要一起吃掉（`尚缺 ¥1,200.50` 若只认到 `1`，申请的额度小 1000 倍 ⇒ 批了还是过不了）；不是授信拒绝的文案 / 没有手机号 ⇒ **不冒入口**（返回 `null`）。判据 = `approval-credit-draft.test.ts`（5 例，含上述三种边界）。"
      - "**边界（照实登记）**：① 三个真正被闸门消费的类型（改价 / 盘点差异 / 超授信）都已有就地入口；② 退款 / 采购超量**没有闸门在消费**（`consume` 调用点只有三处）⇒ 不做假入口；③ 不做「谁会批」的展示（审批人由 `finance:create` 决定，用户 2026-10-23 裁定「暂时都默认管理员审批」）。"
    precondition: "本用例是 [frontend-contract]：前置 = 审批后端（#7374 段 1）+ 裁决面（段 2）。零网络、零 LLM。"
    skip_reason: "[frontend-contract] 审批申请的 ref/金额口径与就地预填，由前端单测验证，非 LLM 行为，不进 agent-eval 冒烟"
    merge_log: "2026-10-23 新增（issue #7374 段 3）。落码 = `lib/approval-request.ts`（三口径纯函数）+ `components/approvals/RequestApprovalModal.tsx` + `approvalApi.submit` + 盘点单页/价格本页接线。"
    traces:
