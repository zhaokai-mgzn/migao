    data_checks:
      - "**病（本单自己会踩的形态）**：给批次台账加第三个来源时，最省事的写法是在新服务里直接 `consumptionMapper.insert(...)`（写入点分叉 ⇒ 幂等闸 / 来源列形状 / 盘前盘后链全部绕过），或者让盘点行填上 `processing_order_no`（读面分不清「加工单扣料」与「盘点调整」= 假账）。两种写法**都不会让任何实例判据变红**：新路径自带测试、照样绿"
      - "**判据 1（写入点唯一，未登记即红）**：全仓 `backend/admin-api/src/main/java/**/*.java` 里「写批次台账」的文件必须正好等于冻结登记 `BATCH_LEDGER_WRITE_POINTS`（现取 = `StockBatchConsumptionService.java` 一处）；多出来的文件**点名报出**并给出出口（并回台账服务，或登记 + 在 PR 说明幂等闸/列形状/链怎么保证）。判据 = tests/unit_ci_workflows/test_batch_stocktake_write_point.py 的 `test_batch_ledger_has_exactly_one_write_point`"
