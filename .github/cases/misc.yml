      - "**兜底面必须在位且不是空转**（`FM-E17` 收口口径）：`push` 在本仓会被 `GITHUB_TOKEN` 合并吞掉 ⇒ 本腿必须有 `schedule`（cron 与 `tests/unit_ci_workflows/publish_leg_fallback_ledger.json` 的声明**逐字一致**），且 notify 步要真的会因「线上落后」判红（判据本体 = `scripts/h5_freshness_guard.py`，**不写第二份口径**）并给出可复制命令。红证 = 删 schedule / 改 cron / 把 notify 改成恒绿 / 把 notify 的 `::error::` 摘掉，各自必红。⚠️ **为什么 notify 不比 `dist/index.html`**：`dist/` 在 `.gitignore` 里 ⇒ CI 检出里没有它，那样写会**恒走「没跑」分支** = 空转的兜底面（本包初版踩过）"
      - "🔴 **红线：绝不删/覆盖静态根**：删除集 = 上一次发布写下的托管清单 ∩ 磁盘现值（首次发布无清单 ⇒ 空集）；根上有**无人认领**的条目时判 `TAKEOVER_REQUIRED`（exit 2）并打印将要替换的计划。沙箱红证 = 预置根内容 ⇒ 不接管、逐字节不变"
      - "🔴 **红线：不碰 `w/` 与 `b/`**：三层判据 —— ① 保留前缀（产物顶层/托管清单出现即 die）② 根 index.html 不许引用 `/<保留前缀>/…` ③ 发布前后逐子树的**规范化摘要**（路径+内容，不吃 mtime/顺序）与各自 `index.html` 哈希**逐字相等**（CI 侧四条读数缺一即判红）。沙箱红证 = 预置 `w/` `b/` ⇒ 发布后哈希不变；模拟器红证 = `/w/`（或 `/b/`）被覆盖成 C 端产物 ⇒ 落地面断言判红并指名"
