      - ci
    tier: normal
    tags:
      - ci
      - casebook
      - generated-artifact
      - summary-drift
      - red-proof
    truths_ref: []
    # ⚠️ 真值暂缺：本判据是 CI 生成物的**结构事实**（摘要行 ↔ 现取计数 ↔ 块数），
    # 由 tests/unit_ci_workflows/test_casebook_summary_is_derived.py 的离线判据验证，非 LLM 行为。
    user_inputs:
      - "改 .github/cases/** 后若忘了重渲染 casebook，或摘要行与源漂移，必须有东西变红（且红的信息指向摘要行，而不是指向下一个改别的文件的 PR）"
    expectations:
