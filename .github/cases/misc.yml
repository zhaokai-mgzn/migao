      - "**重活锁 `--wait`（issue #5863，2026-10-01）**：`machine-heavy-lock.sh acquire --wait <秒>` 是「排队等待」的合规入口（脚本内部轮询，间隔 **2~5 秒随机抖动**，到上限即止并**具名**拒绝）；`verify-all.sh` 用 `MIGAO_HEAVY_WAIT=<秒>` 显式开启，**未设置时拒绝语义一字不改**（拿不到锁仍立即出声拒绝）。判据 = `tests/unit_ci_workflows/test_machine_heavy_lock.py::TestWaitOption`（**真跑脚本**：空闲时不得变慢 / 被占则等到释放并出声「排队等待…后取得」/ 超时具名且不偷锁 / `--wait 0` 与不传等价 / 参数错误 rc=2 / 退避落在 [2,5] 且**非常数** / **变异红证**：把「可等待」那行拿掉 ⇒ 判据当场红）"
      - "**重活锁**的**射程**（issue #5863，2026-10-01 改判）：`verify-all.sh` 的 `heavy_lock_wanted` 覆盖**所有会跑全量测试的档**（`quick` / `full` / `frontend` / `backend` / `agent` / `redproof` / `gate`），**未知 / 空档位不拿**。病史 = 原判据断言「只有 `gate` 拿锁」（理由「其余档不是同一台机器上的重活」）**与事实不符** —— `full` 按脚本自己的档位说明就是三模块全量 ~10-15 分钟，`redproof` 机具实跑单机具 2~30 分钟；实测 `gate` 持锁期间 `load average` 16.71 / 28.71 / 20.14（8 核）而单份档最多打满 ~8 核 ⇒ 锁外确有重活。判据 = `tests/unit_ci_workflows/test_machine_heavy_lock.py::TestVerifyAllWiring::test_every_tier_that_runs_tests_takes_the_lock`（正向七档全 WANT + 反向空/未知档 NONE）"
      - "**双引号内的裸反引号 = bash 命令替换**（issue #6095 第四层同批扫出；判据 6）：报错文案里写行内代码标记（`die \"…（`refs/heads/*`、`main`）…\"`）⇒ bash 去**执行**它们 ⇒ 走到那个失败分支的人拿到 `refs/heads/*: No such file or directory` / `main: command not found`，**且原文案里的行内代码被吃掉** —— 而那句正是「参数传错时唯一可读的出口」。判据体 = `tests/unit_ci_workflows/test_scripts_bash32_var_brace.py` 判据 6（**全仓受控 `*.sh` 射程**，沿用同一 `GUARD_SCOPE`/`scanned_shell_files`）：只判「双引号内 + **未转义**」这一种形态 —— 已转义的 ``、单引号字面量、注释、**heredoc 正文**（本仓 `.sh` 里的内联 Python/JS 载荷）都不算（不做 heredoc 预处理时真语料上有 **35 处假红**）。红证 = 在真语料上注入同族形态 ⇒ 报出文件 + 行号；负例 = 上述四种形态必须不命中。行为面 = `test_c_end_h5_hosting.py::TestCiSideInjectedValuesAndMessages`：坏长度 `DIST_SHA` 必须**具名且文案干净**（不含 `command not found`），注入式红证 = 撤掉转义 ⇒ 噪音当场出现。⚠️ **这条类级判据在第五层真的抓到过一次**（本轮回放）：`deploy/scripts/c-end-h5-publish-ci.sh` 里那句『执行体 ref 为空：请给 `H5_PUBLISHED_COMMIT`』的文案中那对反引号忘了转义 ⇒ 空执行体 ref 时凭空多一行 `command not found`、文案被吃掉一块；**抓到它的是「全仓 `*.sh` 类级判据 6」，不是任何单点判据**（典型：窄跑看不见、全目录跑才红）⇒ 已修 + 补行为判据 `test_empty_executor_ref_dies_with_a_clean_named_message`，并按 `guard_scope_ledger.json` 的 exit ② 把本判据文件以 `kind=mentions` 入册（它只**点名**该语料、不扫描它）"
      - "**非 git 目录 / `git` 不可用 ⇒ `unknown` ⇒ 拒绝（fail-closed）**（issue #6084 的未固化项，本包固化）：`verify-all.sh` 的角色守卫必须**先于「禁空跑」判定**（否则非 git 目录里`origin/main` 也不存在 ⇒ 变更集为空 ⇒ 先 `exit 3` 早退，**永远走不到拒绝分支**），且角色取值必须把「退出码 / 空输出」收进**同一条**判据（两次独立 `git rev-parse` 失败都返回空串 ⇒ `[ \"\" = \"\" ]` 判真 ⇒ 非 git 目录被算成 `primary` = **放行**）。判据 = `tests/unit_ci_workflows/test_package_heavy_entry_ban.py::TestNonGitFailsClosed`（真脚本落在**非 git 目录**里跑 / `PATH` 桩驱动「`git` 不在 PATH」）+ `TestUnknownRoleInjectionIsCaught`（注入式红证：把 `unknown` 当 `primary` ⇒ 必红）"
    skip_reason: "[backend-contract] CI workflow 结构由 pytest 单测验证（tests/unit_ci_workflows/test_issue_dedup_guard.py），非 LLM 行为，不进入 agent-eval 冒烟"
    merge_log: "2026-09-02 新增：CI 自动失败报告去重守卫（issue #2746）。2026-10-01 追补（issue #5863）：本用例同时承载「机器级重活锁」的判据面 —— 新增 `TestWaitOption`（`--wait` 排队等待 + 抖动退避 + 变异红证）；背景 = 默认 `acquire` **不排队**，客户端各自自旋时用固定长间隔重试的一方被系统性饿死（实测：30s 间隔 × 56 次探测 / 约 34 分钟一次未中，而释放瞬间总被重试更勤的一方接走）。2026-10-03 追加（issue #6085 的后续）：① **沙箱夹具抽成共享 harness** —— `tests/unit_ci_workflows/heavy_entry_sandbox.py`（`test_package_heavy_entry_ban.py` 的自足临时仓夹具 + `test_batch_gate.py` 手搓的第二份 ⇒ 收成一份；血泪教训写在模块 docstring：**仓根那份 `verify-all.sh` 必须是桩**，否则每次 `batch-gate.sh` 都真跑一次 gate ⇒ 互等机器级锁 ⇒ 180s 超时）；② **补掉 #6084 body §8.2 登记的未固化项**：非 git 目录 / `git` 不可用 ⇒ `unknown` ⇒ 拒绝，原只有**纯函数面**判据（`cwd=/tmp` 实测 rc=5），本包补**行为面**（真脚本落在非 git 目录里跑 / `PATH` 桩）+ 注入式红证 —— 过程中**发现并修掉一个真实缺陷**：该形态实测是 rc=**3**（不是文档承诺的 rc=5），因为 ① 两次独立 `git rev-parse` 失败都返回空串 ⇒ `[ \"\" = \"\" ]` 判真 ⇒ 算成 `primary`（放行）；② 角色守卫排在「禁空跑」判定**之后** ⇒ 非 git 目录里变更集也为空 ⇒ 先 `exit 3` 早退 ⇒ 走不到拒绝分支。修法 = 取值口 `_git_rev_parse`（退出码/空输出同一判据）+ 守卫**前移**；③ **隔离集中化**：`hs.clean_env` 把锁 / 台账收口到 `tmp_path`（显式路径先过 `unscoped_tmp_root`）⇒ 「判据不碰真锁 / 真台账」成为结构保证，并由判据 21 钉读数（跑完真跑形态后真 `~/.migao-heavy.lock` 与真台账 mtime/size/inode 逐项未变）。2026-10-03 再收口（issue #6101 复核发现）：`unknown`（非 git 仓库 / `git` 不可用）原先**共用 `package` 的措辞与台账 why** ⇒ 行为对（rc=5）但**归因错**，而这条台账正是角色读数的仪表 ⇒ 两种角色的「为什么」与 `why` 各自独立（两条路径都保持三点齐全），`--allow-package-heavy` 对两种角色**都放行**；判据 = `TestRefusalAttributionIsSplit`（package 措辞不得出现在 unknown 场景、反之亦然；两条 `why` 各自钉住；注入式红证 = 把两者合并回一套措辞 ⇒ 必红）。"
    traces:
      tests:
        - "tests/unit_ci_workflows/test_issue_dedup_guard.py"
