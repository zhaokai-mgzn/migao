  - id: QC-004
    legacy_id: ""
    title: "质量成本按商品摊开：订单行小计占比分摊、逐分对得上、权重缺失不编（issue #7377 段 6）"
    domains:
      - misc
      - backend
      - frontend
      - quality
    tier: normal
    tags: [frontend-contract, quality-cost, breakdown, product, red-proof]
    truths_ref: []
    user_inputs:
      - "用户（2026-10-23，逐字）：「1.按比例」—— 裁定商品维度的分摊口径：一个订单多商品时按订单行金额比例摊。"
    expectations: []
    data_checks:
      - "**判据 1（按比例）**：一单两行小计 600/400、赔付 100 ⇒ 摊成 60/40（不是平均分、也不是只算单商品订单）。判据 = `QualityCostBreakdownTest#productDimensionSplitsCompensationByLineSubtotal`。"
      - "**判据 2（🔴 逐分对得上）**：100.01 摊两行 ⇒ Σ行 == 100.01（残差补给金额最大的一行）；否则「Σ行 + 未归属 = 合计」会破在分位上。判据 = `#productDimensionKeepsCentIdentity`。"
      - "**判据 3（返工也按行摊）**：报工经「加工单 → 订单 → 行」按同一比例摊。判据 = `#productDimensionAttributesReworkThroughOrderLines`。"
