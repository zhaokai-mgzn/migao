    merge_log: "2026-10-22 新增（issue #7376 段 3）。落码 = `ReportService.staffPerformance`（按制单人归集，复用 `ReportTotals`）+ `StaffPerformanceView` + `GET /api/admin/reports/staff-performance`。**自查剔除了初版里「退款恒为 0」的假字段**。"
