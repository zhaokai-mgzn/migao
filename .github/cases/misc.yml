    merge_log: "2026-10-16 新增（issue #6611 + #6746；同族范式 = #6951 的 admin-api 腿）。取号 = `python3 scripts/next_case_id.py MC` 现取 **MC-106**（main:001-105；`.github/cases/claims/` 现取最大 MC-103 在飞）。**修前红（与 issue 原文同形）**：`deploy/scripts/admin-web-version-probe.sh` **不存在**、`deploy-frontend.yml` 里 version/served-version/verify-served/buildId 逐字**零命中** ⇒ 本腿此前**没有任何**版本自证；同族静态腿的 `index.html` 字节哈希**跨版本相同**（实测 `b1f3a2ef2929ec66` 前后一致）；本机现取 `curl -sS -m 12 -o /dev/null -w '%{http_code} %{content_type}' https://merchant.migaozn.com/version.json` ⇒ 逐字 `404 text/html; charset=utf-8`。**修后绿**：`python3 -m pytest tests/unit_ci_workflows/test_admin_web_served_version.py -q -p no:randomly` = **23 passed**（含红证 + 11 条 fail-closed 参数化 + 结构/接线/类级判据 + 两条形态守卫）。**红证（注入式，实跑读数）**：① 注入错误期望 sha ⇒ **exit=1** + `SERVED_VERSION=mismatch`（三件齐备）；② 真一致 ⇒ **exit=0** + `SERVED_VERSION=match`；③ 200 + HTML（回落形态）⇒ **exit=3** + `SERVED_VERSION=unknown` 且具名「响应是 HTML」；④ 身份面自报 sha=unknown ⇒ **exit=3**；⑤ 结构注入（7 条，各为单点变异 + 自动写回原文）：改 BUILD_SHA 值 ⇒ 1 failed/43 passed；摘远程实参 ⇒ 2 failed/42 passed；改 BOOTSTRAP 占位符 / 摘渲染点 / 翻 `deployed` / 把 Dockerfile 默认值改成空串 / 换期望 sha 来源 ⇒ 各 1 failed/43 passed；复位后总检 rc=0/44 passed。**端到端终判（本包的兑现条件，需一次真实部署）**：由集成侧触发 `gh workflow run deploy-frontend.yml --ref main`，再跑 ① 里的复探命令。**第一轮 CI 暴露的 6 处判据面红（同一 PR 内修完，不降门禁）**：① 探针原名落进 `*-verify-served.sh`（**静态落地面腿**的命名空间）⇒ 被两条类级守卫（`.mjs` MIME / module 闭包，均按该 glob **现取**腿集合）判成「静态腿缺判据」⇒ **改名 `deploy/scripts/admin-web-version-probe.sh`**（与 admin-api 腿的 `served-version-verify.sh` 同族）；② 我的「只扫代码行」用了朴素 `#` 截断（本仓明令禁止的假绿形态，守卫 = `tests/unit_ci_workflows/test_guard_parsing_is_comment_aware.py`）⇒ 换成**可执行面**判据（回落守卫片段在场）；③ 本用例新增 1 条 `[backend-contract]` ⇒ **重锚** `tests/unit_ci_workflows/case_machine_fail_channel_baseline.json`（158 → 159）；④ claim 文件名双向绑定 ⇒ `7013-MC-106.json`；⑤ 🔴 **既有守卫的空跑形态（链内修的真题）**：`tests/unit_ci_workflows/test_frontend_bmini_entry_single_source.py` 的「新增未登记 secrets 引用」变异锚点是**逐字替换那一行独占的 admin-web** —— 该串只在服务键**独占一行**时命中；本 PR 把调用改成 `admin-web $BUILD_SHA $BUILT_AT` 后锚点失配 ⇒ 变异**静默变成空操作**，而测试只报「变异没有被判红」（把「锚点漂移」误报成「判据没牙」）⇒ 修法：锚改成**按行匹配** + **变异没生效即报错**；⑥ 改名时丢了脚本可执行位（形态守卫判红）⇒ 已恢复。"
