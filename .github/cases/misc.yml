  # MC-104（issue #6955）：加工单状态迁移写路径必须落到 SQL 谓词（CAS）—— 类级元守卫
  # ==========================================================================
  - id: MC-104
    legacy_id: ""
    title: "**加工单状态迁移写路径必须落到 SQL 谓词（CAS）**：未登记即红 / 无谓词写即红 / 台账只许缩短（issue #6955 的类级固化）"
    domains:
      - misc
      - backend
      - processing-order
    tier: normal
    tags:
      - concurrency
      - state-transition
      - cas
      - ledger
      - backend-contract
      - red-proof
    truths_ref: []
    user_inputs:
      - "同一份加工单状态迁移权上有**两个**写面（手工入口 `ProcessingOrderService#updateStatus` 与订单联动腿 `OrderService#cancelOrder`），凭什么相信「下一个写面不会漏」？"
    expectations: []
    data_checks:
      - "🔴 **判据 1·扫描器非空跑自证**：现取「写 `processing_orders.status` 的 mapper 手写 SQL」必须含 `markCompletedIfActive` / `markInProcessingIfFrom` / `markStatusIfFrom`；现取「**两条** service 里出现状态列写的方法」必须含 `ProcessingOrderService#updateStatus` 与 `OrderService#cancelOrder` —— **返回空集 = 判据失明，不是通过**。执行点 = backend/admin-api/src/test/java/com/migao/admin/service/ProcessingOrderStatusCasMetaGuardTest.java::scannersAreNotBlind"
      - "🔴 **判据 2·谓词完整性**：凡在 SET 侧写 `status` 的手写 `@Update` SQL，必须同时含 `tenant_id` 参数 + **WHERE 侧 status 谓词**（`status = #{fromStatus}` / `status = 'x'` / `status IN (…)`）+ `deleted = 0` 谓词（少任何一条 ⇒ 红）。执行点 = 同文件::everyStatusWriteCarriesTheFullPredicate"
      - "🔴 **判据 3·无谓词写即红（判据本体）**：现取的每个状态写路径的方法体里**不得**出现 `processingOrderMapper.updateById(` —— 状态迁移必须走条件更新 CAS。**实证过的隐蔽形态**：锚串留着（`if (false && …markStatusIfFrom(…)`）但真正落库换成 `updateById` ⇒ 仍判红并具名。执行点 = 同文件::noStatusWritePathUsesUnconditionalUpdateById"
      - "🔴 **判据 4·未登记即红 + 台账不许给不存在的对象盖章**：两条 service 的状态写路径必须逐条登记（backend/admin-api/src/test/resources/processing-order-status-cas-ledger.json 的 `service_write_paths`），且登记的 `call_anchor` 必须逐字出现在方法体里。执行点 = 同文件::serviceWritePathsAreRegisteredAndLedgerIsFaithful"
      - "🔴 **判据 5·登记未被兑现即红**：每条 `evidence` 锚 = `<仓库相对全路径>::<可检索文本>`，左侧文件存在、右侧逐字出现（摘掉 CAS 调用 / 方法改名 ⇒ 红）。执行点 = 同文件::everyEvidenceAnchorIsLive"
      - "🔴 **判据 6·豁免只许缩短 + 台账不许空转**：`unverified` 必须是冻结基线 `unverified_baseline`（现取 0）的子集；新增豁免 ⇒ 红；`entries` / `service_write_paths` 为空 ⇒ 红（「空」不等于「全部合规」）。执行点 = 同文件::serviceWritePathsAreRegisteredAndLedgerIsFaithful"
      - "🔴 **判据 7·判别力自证（合成语料）**：无谓词状态写 / 缺 `deleted=0` / 缺 tenant 谓词 / 缺 WHERE 侧 status 谓词 / 未登记写路径 / 锚留而落库无谓词 / 台账未兑现 七种坏形态各自判红，合规语料判绿，**只加注释不红**；另含**扫描器鲁棒性**两格（跨行签名必须仍被扫到；注释里的孤立 `{` 不得让深度错位）。执行点 = 同文件::guardHasDiscriminatingPower"
      - "**本包在 MC-104 上抓到的两个真问题（如实登记，不粉饰）**：① **扫描器深度下沉**：`ProcessingOrderService#updateStatus` 的签名跨行（收尾 `) {` 在续行上），只认「签名行含 `) {`」的写法把**整个方法**跳过、而它的闭合花括号照样减深度 ⇒ 深度从此下沉一级 ⇒ **后面所有方法全部扫不到**；初版读数因此少了 `updateStatus`（`service 写路径=[OrderService#cancelOrder]`）而判据 1 只检查另一个对象 ⇒ **照样绿**。② **注释里的孤立花括号**：真实文件第一处 javadoc 含 `{@code route = [` 这类被截断的代码片段 ⇒ 花括号计数器把它当真代码 ⇒ 从此整体错位。两处均已修（跨行签名走「待定签名状态机」；扫描前先剥注释 / 字符串字面量），并各自补了一条合成语料判据防回归（判据 7）。⚠️ **同款形态在 MC-100（`InboundOrderStatusCasMetaGuardTest`）里同样存在**（它只扫一个文件、且没剥注释）—— 按 #6955 的写面纪律**本包不动它**，归 #6956 独占处理。"
      - "**边界（照实登记）**：① 形态判据换措辞可绕过（真实防线仍是实例判据 `ProcessingOrderStatusCasRaceRealDbTest`）；② 射程只到 `ProcessingOrderMapper` + `ProcessingOrderService` + `OrderService` 三条文件；③ 判不了「拿 `updateById` 改非状态列」；④ 本守卫不跑被它引用的真库判据；⑤ **「写路径清单」由 `processingOrderMapper.` 前缀现取** ⇒ 别名形态（`baseMapper.updateById(` / `this.updateById(`）扫不到（未覆盖形态，重启条件写在台账 `coverage_boundary`）；⑥ 不改任何门禁的通过条件、不新增豁免。"
    skip_reason: "[backend-contract] 零 LLM 的确定性读数（词法扫 admin-api Java 源码文本 + 台账现取 + 合成语料判别力自证），JUnit 真跑、零网络、不进 agent-eval 冒烟"
    merge_log: "2026-10-15 新增（issue #6955 的类级固化，与 PG-076 同批）。取号 = `scripts/next_case_id.py MC` ⇒ **MC-104**（现取 main ∪ 在飞 PR 的 MC 号最大 = MC-100，且 MC-100 归 #6928 / PG-075 归 #6936，**本包一律不动**）。读数：修后 `mvnw test -Dtest=ProcessingOrderStatusCasMetaGuardTest` = **6 passed / 0 failed**，逐字 `写 status 的 mapper 方法=[markCompletedIfActive, markInProcessingIfFrom, markStatusIfFrom] service 写路径=[ProcessingOrderService#updateStatus, OrderService#cancelOrder] 未登记=[] 幽灵条目=[] mapper 条目=3 豁免=0(基线 0) 违规=[] 断链=[]`。**红证（注入式）**：把两处 CAS 退回修前无谓词 `updateById` ⇒ `noStatusWritePathUsesUnconditionalUpdateById` 判红并具名 `违规=[ProcessingOrderService#updateStatus, OrderService#cancelOrder]`（同批 `everyEvidenceAnchorIsLive` 也红 —— 台账锚不再兑现）。**顺带扫出的同族缺陷（链内修，本包一并落）**：`ProductionService#ensureQrToken` 用 `updateById(部分实体)` 补 `qr_token` ⇒ 换成新加的条件更新 `ProcessingOrderMapper#fillMissingQrToken`（`WHERE … AND qr_token IS NULL`，与相邻的 `fillMissingShortCode` 逐字同款），使该文件的现取集合里不再出现无谓词 `updateById`。"
    traces:
      tests:
        - "backend/admin-api/src/test/java/com/migao/admin/service/ProcessingOrderStatusCasMetaGuardTest.java"
      ci:
        - pr-check.yml
      verifies: []

  # MC-105（issue #6951；同族 #6611 / #6746 / #6554）：**「线上就是本次构建」必须可判读**
  # ==========================================================================
  - id: MC-105
    legacy_id: ""
    title: "**部署腿的判据从「产物存在」换成「线上探到的 sha == 本次部署的 sha」**：admin-api 加只读版本端点 `GET /api/version`（构建期注入 sha/tag/builtAt，nginx 已放行面，无鉴权）+ 部署后 served-sha 断言（不一致 ⇒ 具名判红、探不到 ⇒ fail-closed 退 3）+ schedule 兜底档「本轮未部署」显式出声（issue #6951 / #6746 / #6611 / #6554）"
    domains:
      - misc
      - backend
    tier: normal
    tags:
      - deploy
      - ci-cd
      - version-probe
      - fail-closed
      - backend-contract
      - red-proof
    truths_ref: []
    user_inputs:
      - "部署腿报 success、`Post-Deploy Smoke Test` 却是 skipped —— 这个「绿」到底证明了什么？线上跑的又是哪个 build？"
    expectations: []
    data_checks:
      - "🔴 **判据 1·红证（判据自身能因注入错误期望 sha 而红）**：`deploy/scripts/served-version-verify.sh <BASE_URL> <EXPECTED_SHA>` 在「线上读数 = 真 sha / 期望值 = 注入的错误 sha」时必须以 **退 1** 判红，且输出里同时具备三件：**探到什么**（实测 sha）、**期望什么**（期望 sha）、**可复制复算命令**（`curl` + 脚本名）。执行点 = tests/unit_ci_workflows/test_served_version_verify.py::test_served_sha_mismatch_is_red_and_names_both_sides"
      - "🔴 **判据 1 的对照臂（没有它 ⇒ 恒红也能过上面那条）**：同一场景只把期望 sha 换回真的 ⇒ **退 0** + `SERVED_VERSION=match`。执行点 = 同文件::test_served_sha_match_is_green_control_arm"
      - "🔴 **判据 2·探不到 ⇒ fail-closed（退 3，**绝不当绿**）**：sha 为空（**老镜像没有构建期注入面** —— 本判据最容易退化成空断言的路径）、body 不是 JSON、HTTP 404、HTTP 429、sha 非 hex、期望 sha 形态不合法、期望 sha < 7 位、`app` 不是目标服务、端点连不上（端口没人听）九态各自 ⇒ 退 3 + `SERVED_VERSION=unknown` 且**不得**出现 `match`。执行点 = 同文件::test_unverifiable_is_exit_3_never_green（8 条参数化）/ ::test_unreachable_endpoint_is_exit_3"
      - "🔴 **判据 3·结构判据：发布腿的命令里不再以「镜像/产物存在」作为通过条件**：`deploy-admin-api.yml` 必须**真的**调用共享判据本体（`deploy/scripts/served-version-verify.sh`）、期望值来自本次部署（`EXPECTED_SHA: ${{ github.sha }}`）、退出码**原样透传**（`exit \"$rc\"`，3 不许被归一化成 0）。执行点 = 同文件::test_deploy_leg_asserts_served_sha_not_artifact_existence"
      - "🔴 **判据 4·类级形态：断言步的生效条件不得绑在「产物/结论」面上**：served-sha 断言的 `if:` 里不许出现 `steps.sync.outputs.skip`，且必须是 `always()`（跳过档也要探一次 —— 否则「本轮未部署」就没有任何线上读数）。执行点 = 同文件::test_deploy_leg_never_keys_pass_on_artifact_existence"
      - "🔴 **判据 5·schedule 兜底档两态分开**：`skip=true`（本轮未部署）必须有**显式出声**的声明步（`::notice::` + 逐字「未跑 Post-Deploy Smoke Test」+ 落 run summary），且 `deployed` 的语义必须自洽（`skip != 'true'`，冒烟 job 条件随之 `== 'true'`）。执行点 = 同文件::test_schedule_skip_path_declares_that_no_smoke_ran"
      - "🔴 **判据 6·注入面五跳同源**（少一环 ⇒ 端点报的就不是这次构建、sha 恒为空）：workflow（`build_id` 步解算 `git rev-parse HEAD` + 三个 env）→ **workflow 的远程调用参数**（`swas-deploy-ci.sh` 第 9/10 位 `\"$BUILD_SHA\"` / `\"$BUILT_AT\"`）→ **驱动脚本的 BOOTSTRAP 渲染**（`export …;` 串里的 `__BUILD_SHA__` / `__BUILT_AT__` + 显式渲染 + 未渲染即 fail-closed）→ `deploy/swas/deploy.sh`（`BUILD_SHA`/`BUILD_TAG`/`BUILT_AT` → `--build-arg MIGAO_BUILD_*`）→ `backend/admin-api/Dockerfile`（`ARG` 在 builder/runtime **两个** stage 各一次 + `ENV`）→ `VersionController`（读同名环境变量）。**第 2/3 跳（issue #6951 的真机缺陷）** 另由**执行式**断言加钉：真跑 `render_bootstrap` + `deploy_attempt`（只桩 `run_cmd`/`nap`）捕获**实发远端的命令内容**，身份必须在里面（纯文本断言会被「模板里有占位符、渲染点却空转」骗过）；`BUILD_TAG` **有意**不过参数面 ⇒ 反向也判红。执行点 = 同文件::test_build_identity_wiring_is_same_source_across_five_hops"
      - "🔴 **判据 7·端点的泄露面白名单**：响应体**只许** 4 个非敏感键（`app`/`sha`/`tag`/`builtAt`），且只读（`@GetMapping`、无写映射）⇒ 有人加字段就判红（逼一次「它会不会泄露」的复核）。执行点 = 同文件::test_version_endpoint_field_whitelist_blocks_accidental_leaks"
      - "🔴 **判据 8·端点落在已放行面 + 设计前提仍在**：`@GetMapping(value = \"/api/version\"`（nginx 已放行的 `/api/` 前缀，**不新增放行面**）+ `SecurityConfig` 的 `permitAll` 含 `\"/api/version\"`；同时 `nginx.conf` 那条 actuator/swagger 屏蔽块必须**仍在**且仍是 `return 404`（「探活面 ≠ 探版本面」正是本单的前提）。执行点 = 同文件::test_version_endpoint_is_under_the_already_allowed_api_prefix"
      - "🔴 **判据 9·判别力自证（注入式红证，本包实跑）**：① 把脚本的比较改成恒真 ⇒ `test_served_sha_mismatch_is_red_and_names_both_sides` 红（1 failed / 19 passed）；② 摘掉 workflow 的 served-sha 断言步 ⇒ `test_deploy_leg_asserts_served_sha_not_artifact_existence` + `test_deploy_leg_never_keys_pass_on_artifact_existence` 双双红（2 failed / 18 passed）；③ 摘掉 Dockerfile 的 `ENV MIGAO_BUILD_SHA=…` ⇒ `test_build_identity_wiring_is_same_source_across_five_hops` 红（1 failed / 19 passed）；恢复后 20 passed。执行点 = 同文件（判据本体自带对照臂与负控）"
      - "🔴 **判据 10·脚本自身的两类静默坏形态**（本包实测踩过第一类）：`bash -n` 必须能解析 + **不许**出现「裸 `$VAR` 紧跟非 ASCII」（bash 会把中文全角字节并进变量名 ⇒ `set -u` 下报 `EXPECTED\\ufffd: unbound variable`，而报错行号与真实坏点相差数行；同族还能造成未闭合引号把整段吞掉）。执行点 = 同文件::test_shared_script_parses_and_has_no_unquoted_cjk_adjacent_expansion"
      - "🔴 **判据 11·端点主体的 Java 契约测试**（与 Node 侧判据**不重复实现**：这里判端点行为，那里判脚本/接线）：① `sha`/`tag`/`builtAt` **原样**出（它们就是判据比对的字符串，不许截断/加工）；② 字段面**恰好** 4 个（`app`/`sha`/`tag`/`builtAt`）⇒ 多一个键即泄露面变了；③ 未注入时 `sha` 是**空串**（不是 500 / 不是占位假值 —— 消费方据此判「探不到」exit 3）；③′ 注入值被 trim；④ `POST /api/version` ⇒ **405**（不给写面）；⑤ 注入「显眼标记」后断言响应里只出现白名单键名与注入值、不出现实例路径 / 环境变量形态。执行点 = backend/admin-api/src/test/java/com/migao/admin/controller/VersionControllerTest.java"
      - "**边界（照实登记，不粉饰）**：① 线上真机复探 = **issue #6951 的那条评论**（`#6989` 合入后主会话真机复探）：`curl -sS -m 15 https://api.migaozn.com/api/version` ⇒ 逐字读数 `{app:admin-api, sha:(空), tag:sha-bab9538, builtAt:(空)}`（`tag` 有值、`sha`/`builtAt` 恒空），部署 run `38835344964` 判红在 `Assert served sha == deployed sha`（exit 3 = 探不到）—— 根因 = 第 5 跳（CI→服务器）没接，**已在本 case 的判据 6 里补上并加执行式断言**；终判仍是真机复探：执行 `bash deploy/scripts/served-version-verify.sh https://api.migaozn.com $(git rev-parse origin/main)` 应 **rc=0 + `SERVED_VERSION=match`**（需一次真实部署触发，由集成侧 `gh workflow run deploy-admin-api.yml --ref main`）；② `deploy-frontend.yml` / `deploy-ai-agent-service.yml` 两条腿**未接线**（同形缺口；前端那半边还依赖 #6611 的构建期注入面）—— 重启条件 = #6611 落地后给前端产物加 build id 并接同一条判据；③ Java 侧只做**静态接线判据**，本包**未**跑 `mvn test`（worktree 无构建产物、属全量档）；④ 本文件**不联网**（`/api/version` 由进程内 HTTP 桩提供）⇒ 证的是「脚本在给定输入下会做什么」，不是「阿里云/线上真的会这么回」；⑤ 不改任何门禁的通过条件、不新增豁免、不新增 schedule。"
