    data_checks:
      - "**病（issue #6432 的形态）**：`workerApi.createWorker` 建号时能设 PIN，但建完**再也拿不到** —— PIN 落库是 BCrypt 哈希（不可逆）、列表与视图面还显式脱敏 ⇒ 工人忘记 PIN 时管理员无路可走（只能删号重建，而重建会把报工记到两个身份上）。同族的 `employeeApi` 早就有 `resetPassword` ⇒ 这是**一族**：「建号即设口令」的能力面必须有对应的**重置出口**，而当时没有任何判据看着它。"
      - "**判据 1（未配对即红，具名）**：某 client 暴露了 `create*` 且其入参类型含 `password` / `pin` 字段，却没有 `reset|change|update` + `Password|Pin` 方法，且不在豁免台账里 ⇒ 报出「未配对：<client> 暴露了 <方法>…」。判据 = tests/unit_ci_workflows/test_credential_rotation_pairing.py::test_discriminates_unpaired_client（内存语料 = 去掉工人侧重置面的改前形态）"
      - "**判据 2（台账只许缩短：陈旧即红 / 超预算即红）**：`frozen_max_entries` 现取为 0；给一个**其实已配对**的 client 盖章 ⇒ 「陈旧台账条目」；条目数超上限 ⇒ 「超预算」；条目缺 `reason` ⇒ 红。判据 = 同文件::test_discriminates_stale_ledger_entry / test_discriminates_ledger_budget / test_ledger_is_wellformed_and_shrink_only"
      - "**判据 3（零命中即红，fail-closed）**：扫描面一个「建号即设口令」的 client 都找不到（选择器漂了 / api.ts 结构变了）⇒ 判据自己失效 ⇒ 红，不许静默绿。判据 = 同文件::test_discriminates_empty_corpus"
      - "**判据 4（对照读数：真语料上确实看得见配对）**：真仓上 `workerApi.createWorker ↔ resetWorkerPin`、`employeeApi.createEmployee ↔ resetPassword` 两条都必须被扫出来（防「选择器漂了还能绿」）。判据 = 同文件::test_real_repo_actually_sees_the_pairing + test_real_repo_passes"
      - "🔴 **覆盖边界（照实登记）**：判据只认 frontend/admin-web/src/lib/api.ts 的**对象字面量 client**（`export const X = { … }` 顶格 `}` 收口）与 frontend/admin-web/src/types/index.ts 的**顶层 interface 字段**；经变量间接构造的请求体、行内 `{ pin }` 字面量、小程序 / H5 侧的 api 封装**不在射程内**；也判不了「重置口有没有接权限码 / 有没有接 UI」（那是 `@RequirePermission` 与页面判据的事）。本判据**不为存量条目的安全性背书**，只裁新增。"
    precondition: "本用例是 [backend-contract] 纯静态用例（零 LLM、零网络、零时钟）：前置 = frontend/admin-web/src/lib/api.ts 与 frontend/admin-web/src/types/index.ts 在场且可读、tests/unit_ci_workflows/credential_rotation_pairing_ledger.json 可被 json 解析。前置由判据自身持有：文件缺失 / 台账坏 ⇒ 当场红（不表现成「agent 不干活」）；agent-eval 栈不跑它"
    skip_reason: "[backend-contract] 纯静态元守卫（只读两份前端语料 + 一份台账）由 tests/unit_ci_workflows/test_credential_rotation_pairing.py 验证，非 LLM 行为，不进入 agent-eval 冒烟"
    merge_log: "2026-10-06 新增（issue #6432，用户实测报告「管理员查不到工人的 pin 码」）。落法（用户两问两答裁定）= 重置 PIN 并展示新值（BCrypt 不可逆 ⇒ 不做可逆存储的明文查看）、权限仅 `employee:create`；本用例只是**类级元守卫**那一半（实例判据在 UI-091：后端 `WorkerAdminService.resetPin` / 端点 / 前端弹窗）。取号 MC-086（`python3 scripts/next_case_id.py mc`；改号原因 = 本 PR 在飞期间 main 的 MC-085 已被 #6434「订单详情打印入口矩阵守卫」占用）。"
