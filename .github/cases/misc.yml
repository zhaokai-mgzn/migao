      - "当 main 上最新的那个 commit 该上线却没上线（超过 N 分钟）时，必须有人被叫醒 —— 不许只剩一行 `::notice::`（2026-10-01 实测：`deploy-frontend.yml` 的 push 触发 10:18 后再没跑过，22:41 线上仍停在 `bef78e7`，而 main HEAD 已是 `1fbdfb0`）"
    expectations:
      - "**值守面在**（`.github/workflows/deploy-reconcile.yml` 的 step `值守面（超时未部署 ⇒ 判红 + 开/清值守 issue）`，`if: always()`，夹在对账步与存活读数步之间）：main HEAD 合入超过 N 秒、且该腿在本轮对账开始时既没有「已部署」信号也没有**在途 run** ⇒ `::error::` + **非零退出** + step summary，**并自己开/更 P1 值班 issue**；部署成功（同 sha 的 run 结论 success / 镜像在 / 无漂移）⇒ **自动关闭**该单（清零不靠人记得）。"
      - "**N 的出处可复算**（不许是凭空数字）：N=2700s = 冷构建上界 2400s + 余量 300s（读数现取 `deploy/scripts/swas-deploy-ci.sh` 的 3000/4500s 预算那句）；**远端锁等待上限 1800s 有意不计入**（排队中的 run 由 `inflight` 判据覆盖）。判据现取这两个读数并断言 `N ≥ 2400 + 300`（改小 N / 删读数锚 ⇒ 红）。"
      - "**类级元守卫（未登记即红）**：`reconcile_one` 的**每一条腿**必须登记在 `tests/unit_ci_workflows/deploy_watchdog_ledger.json`（`watchdog` 或**具名豁免** + 理由 + 仓内锚），三处（对账调用 / 值守面 `WATCHED_LEGS`+`EXEMPT_LEGS` / 台账）**逐项相等**；豁免条数只许缩短。新加一条 deploy 腿却忘了接值守 ⇒ 当场红。"
    data_checks:
      - "**病（现取读数）**：对账判出「没部署」之后只做两件事 —— ① 补一次 dispatch ② summary 写一行 ⇒ **没有人会被叫醒**。实测 2026-10-01：`deploy-frontend.yml` 的 push 触发在 10:18 之后再没跑过，22:41 线上仍停在 `bef78e7`，而 main HEAD 已是 `1fbdfb0`（中间 `871db0c7f` 改了 `frontend/admin-web/**` 却没上线）—— 全仓只有 reconcile 的 `::notice::` 说了一句。"
      - "**有意不照 issue 正文的字面判据**（「`sha-<head7>` 镜像仍不存在 ⇒ 判红」）：`#5814` 的 C′ 把构建搬到服务器侧 ⇒ CI **不再推 ACR** ⇒ 那条判据**恒为真**，照字面实现 = 每个 tick 都报警（噪声判据是缺陷）。⇒ 判据 = 对账步落的**每条腿状态**（`deployed` / `inflight` 不报；`terminal` / `dispatched` 超期即报；读不到 ⇒ fail-closed 退出码 3）。"
      - "**执行式红证（16 条，桩 `gh`/`docker` + 真 git 仓库）**：超期未部署 ⇒ 红 + 具名（main HEAD + 哪条腿）+ 开单（含 `priority/P1`）；**反向对照**：镜像存在 ⇒ **不报警、不开单**（噪声判据是缺陷）；在途 run ⇒ 不报；宽限期内 ⇒ 不报；判不了 ⇒ 退出码 **3**（不得当 0 读）且照样开单；部署成功 ⇒ 自动 `gh issue close`；同一 HEAD 反复判红 ⇒ **不重复刷屏**（幂等）但单子仍开着。"
      - "**判别力自证 + 对照读数**：六种坏形态（腿没进两个列表 / 台账条目被删 / 台账与值守面口径相反 / 豁免没写理由 / 豁免锚在 workflow 里找不到 / 豁免条数上涨）在**内存语料**上各自判红；**只往正文加注释 ⇒ 不红**（守卫不许被自己的文案喂红）。**修前红**：把本判据文件拿到 `origin/main` 的 workflow 上跑 ⇒ **14 failed / 2 passed**（复算见 PR body）。"
    skip_reason: "[backend-contract] 部署值守面的静态/执行式结构判据（只读仓内文件 + 桩 gh/docker + 真 git 仓库；零网络、零真 ACR、不写共享 /tmp、不烧 token）由 tests/unit_ci_workflows/test_deploy_watchdog.py 验证，非 LLM 行为，不进入 agent-eval 冒烟"
    merge_log: "2026-10-01 新增（issue #5929，用户 2026-10-01 裁定只做 ① 值守面 —— 当时不做 ② 给 reconcile 加 `workflow_run` 触发、不做 ③ 兜底加密。🔴 **② 已于 2026-10-02 由用户逐字改判为「允许加 workflow_run：部署跑完就对账/清零」**，用途**限定**为**部署完成事件驱动的对账/清零**（不是检测加速）；落地见 **MC-057**（issue #5935），反自激判据同批。① 的判定骨架与 ③ 的不做，均维持原裁定）：病 = 「合并了但没上线」没有任何值守面，只有 reconcile 的一行 `::notice::`。落码 = ① `.github/workflows/deploy-reconcile.yml`：对账步逐腿落状态（`deployed`/`inflight`/`dispatched`/`terminal`/`notarget`，判定本体只此一份）+ 新增 step「值守面」做「合并后超过 N 秒仍未部署 ⇒ 判红 + 开/更 P1 值班 issue + 部署成功后自动关闭」+ `permissions: issues: write`（**不新增 schedule**，铁律 10；`pull_request` 事件不判定）；② 判据 tests/unit_ci_workflows/test_deploy_watchdog.py（16 条：静态面 + 执行式行为 + 判别力自证）；③ 类级台账 tests/unit_ci_workflows/deploy_watchdog_ledger.json（六条腿逐条登记，`c-end-h5` 具名豁免：发布由人手动，用户裁定 B）。⚠️ **未固化项如实登记**：workflow 级接线锚（YAML）不在 `wiring_claims_ledger.json` 射程内 ⇒ 接线面由执行式判据承担（作者的一次动作）；「dispatch 出去但 GitHub 从未生成 run（连 queued 都没有）⇒ 在途判据看不见」这一角由 `dispatched` 计入告警面 + 超期兜住，但「补 dispatch 自身失败」的形态仍靠对账步的 `set -e` 判红。取号 **MC-055**（**让号一次，记实**）：起草时 main 最大 = MC-053，脚本给的**空档 MC-049** 经核对是**在飞占用**（MC-050 的 `merge_log` 逐字记「在飞 ci/5814-migrate-pr-legs 占 MC-049」）⇒ 按「当前最大号 +1」取 MC-054；**推送后 CI 实测**：同批并行包 PR #5932 也占了 MC-054（`fix/5930-worktree-unlink`）⇒ 两个 PR 的 merge ref 里出现**重号** ⇒ `Case Contract (truths_ref)` 与 `ci workflow helper unit tests` **双双判红**（取号判据只看已合并状态，拦不住在飞撞号 —— 本仓第 N 次实证）⇒ 按「后合入者让号」顺延为 **MC-055**。"
    traces:
      tests:
        - "tests/unit_ci_workflows/test_deploy_watchdog.py"
      ci:
        - pr-check.yml
      verifies: []

  - id: MC-056
    legacy_id: ""
    title: "CI 面记号与台账必须**双向**绑定（`FM-E24`/`FM-E25` 同批）：文档里具名而台账未登记 ⇒ 红；「CI 迟迟不来先看 `mergeable`」的判别动作必须留在加载面（文本锚，删掉即红）"
    domains:
      - misc
      - ci
    tier: normal
    tags:
      - ci
      - workflow
      - ledger
      - red-proof
    truths_ref: []
    user_inputs:
      - "研发模式里写下的每一条 CI / 台账反复出错点都必须有承载体：① 文档里具名的 `FM-EN` 记号在台账 `ci_findings` 里**未登记**、或那条册外登记变陈旧；② 「CI 迟迟不来先跑 `gh pr view <N> --json mergeable`」这条判别动作从**加载面**（`migao-dev-flow` §2.2）里被删掉或改写 —— 两种形态都必须有东西变红"
    expectations:
      - tool: direct_reply
    data_checks:
      - "**坑 A（`FM-E24`）：单个 step 的 `run` 正文超长 ⇒ 整份 workflow 判 invalid，该腿静默永不跑**。实测阈值（11 个变体二分）= **≤13,303 字符有效 / ≥13,399 invalid**（GitHub 侧**未文档化**约束；与文件总大小、行数无关）。现象 = `push` 面只留一条 **0 个 job** 的 `push/failure` run（`name` 回落成文件路径、页面提示 workflow file issue），`pull_request` 面**根本不建 run**，而**本地 PyYAML 解析 + 仓库全部守卫全绿**（完全静默）。判据（PR #5931 已落码，本单只登记）= `tests/unit_ci_workflows/test_deploy_watchdog.py::test_run_body_stays_under_the_github_limit`（逐 workflow 逐 step 现取 `run` 正文长度，上限 `RUN_BODY_LIMIT = 13250` = 低于已知有效读数 13,303 留 53 字符差）+ 反空跑锚点 + 对照读数。**存量风险现取（2026-10-02，`origin/main` 3fa84ab89；复算 = `python3 -m pytest tests/unit_ci_workflows/test_deploy_watchdog.py -q -k run_body`）= 全仓 238 条 run 正文，最长 **13,125**（`.github/workflows/deploy-reconcile.yml` 的 step `Reconcile deploys`，距上限仅 **125 字符**）、次长 **10,975**（`.github/workflows/automerge.yml`）。订正一处转述：12,524 是 PR #5931 **合并前**的读数（#5931 自己把它抬到 13,125）⇒ 余量不是 ~2.3K。出口 = 把实现体外置成 `.github/scripts/*.sh` 再 `source`。"
      - "**坑 B（`FM-E25`）：「CI 迟迟不来」先看 PR 是否与 main 冲突**。`mergeable=CONFLICTING` ⇒ GitHub **建不出 merge ref** ⇒ **`pull_request` 类工作流根本不触发**，PR 页面上只剩 `pull_request_target` 的辅助腿（本仓现取 4 条：`Auto Merge` / `Close Linked Issues on Merge` / `Stale 清理` / `verify-trigger`，它们不需要 merge ref ⇒ 照跑）= 看着像在排队，**实际一个 required job 都不会来**（无红、无 pending、无任何东西会报）。实测出处 = 2026-10-01 PR #5922（开成 draft 后 **3 次 push 都没有 `PR Check` run**；`gh pr view 5922 --json mergeable` 读 `CONFLICTING`/`DIRTY`；`./scripts/sync-main.sh --rebase` 解冲突后 push ⇒ `PR Check` / `AI Agent Service Unit Tests` / `Mini-App CI` / `Bmini-App CI` **立即全部排队**）。顺带登记：draft 起手 + native auto-merge 的组合下 **`ready` 不是 `pull_request` 工作流的触发面**（`ready_for_review` 只在 `.github/workflows/automerge.yml` 的 `types` 里）⇒ 解冲突后要 **push**（`synchronize`）才会触发。复核边界（照实登记）：#5922 现已 MERGED ⇒ `mergeable` 现读 `UNKNOWN`（GitHub 只对 open PR 计算）⇒ 那条读数不能事后复算，可复算的是机制（触发面）与口诀本身。"
      - "**判据两条**：① `tests/unit_ci_workflows/test_dev_mode_failure_modes.py::unregistered_ci_marks_problems`（**判据 23**，CI 面**缺失的那一个方向**：文档具名而台账未登记 ⇒ 红；册外的走**只许缩短**的 `CI_MARKS_WITHOUT_ENTRY_FROZEN`（现取 1 条 = MC-028 那句「缺号」点名的那个号，由台账 `not_solidified` 的 `NS-1` 承接；冻结表陈旧同样红）② `::conflict_diagnosis_problems`（**判据 24**，**文本锚**：§2.2 的加载面必须逐字留着 `gh pr view` / `--json mergeable` / `CONFLICTING` / `FM-E25` —— 删掉即红）。两条各带注入式红证 + 对照读数（已登记与册外的记号都不红 · 只加无关注释不红）+ fail-closed（取不到记号 / 取不到节 ⇒ 红）。"
      - "**判据 24 为什么只是文本锚（照实登记边界）**：GitHub 侧的 merge-ref 可建性**不是仓内内容** ⇒ 没有可复算的机械判据（同 `FM-E15` 的 `CASE_ID_ALLOCATION_BOUNDARY` 形态：删掉即红）。它**只**证明「这条判别动作还在 agent 每次都看得到的那一面」，**不证明** GitHub 的行为。本包的修前红 = 两条判据先写出来、文档一行未加 ⇒ 判据 7 报 `FM-E24`/`FM-E25` 未具名，判据 23 报台账里的号在文档里找不到（具名读数见 PR body）。"
    skip_reason: "[backend-contract] CI / 研发模式的静态结构判据（零 LLM、秒级、只读仓内文件 + 真 workflow YAML）由 tests/unit_ci_workflows/test_dev_mode_failure_modes.py 的判据 23/24 验证，非 LLM 行为，不进入 agent-eval 冒烟"
    merge_log: "2026-10-02 新增（用户 2026-10-02 逐字裁定「写」：把两条**实测到的 CI 踩坑**写进研发模式）。取号 **MC-056**：`python3 scripts/next_case_id.py MC` 给的是**历史空档 MC-049**，经核对 —— 该号确实写在**已 CLOSED 的 PR #5818 分支** `ci/5814-migrate-pr-legs` 的 `.github/cases/misc.yml` 里（且该远端分支**仍然存在**、可取回）⇒ 沿用 MC-055 的「让号」先例，按**当前最大号 +1** 取 MC-056（main 现取 001-048、050-055；此刻 0 个 open PR）。同批：台账 `FM-E24`/`FM-E25` + CI-CD 两行 + 判据 23/24 + 技能 §2.2 判别动作 + §19 索引行 + 技能 1.100.0。"
    traces:
      ci:
        - pr-check.yml
      tests:
        - tests/unit_ci_workflows/test_dev_mode_failure_modes.py
      verifies: []
  - id: MC-057
    legacy_id: ""
    title: "部署对账的「落状态」本身必须有判据 + 三态三分 + 事件驱动清零（issue #5935）：`gh workflow view --ref` 那条前置判据 100% 失败 ⇒ 六条腿全被误记 `notarget`；未落状态的腿必须具名判红、`notarget` 与机制故障不得混桶、部署完成事件必须能触发清零且不得自激"
    domains:
      - misc
      - ci
    tier: normal
    tags:
      - ci
      - deploy
      - watchdog
      - ledger
      - red-proof
      - event-driven
    truths_ref: []
    # ⚠️ 真值暂缺：本判据是**静态结构 + 执行式行为**事实（只读仓内文件 + 在 tmp_path 自造真 git 仓库、
    # 桩 gh/docker，零网络、零真 ACR），由 tests/unit_ci_workflows/test_deploy_watchdog.py 与
    # tests/unit_ci_workflows/test_deploy_reconcile_state.py 验证，非 LLM 行为，不进入 agent-eval 冒烟。
    user_inputs:
      - "当对账步**没为某条腿落状态**、或落下的状态**是错的**（例如把「在 main 上」判成「不在 main 上」）、或把「读不到状态」与「确认未部署」压成同一种告警、或部署成功这个事件不能触发清零时，都必须有东西**具名**报出；而只改注释时不得报红"
    expectations:
      - tool: direct_reply
    data_checks:
      - "**病（现取读数，run `36911070357`，2026-10-01T19:00:20Z，main HEAD `3fa84ab`）**：六条腿**各落了一条**状态、但**六条全是 `notarget`** ⇒ 值守面报「5 条腿读不到对账状态」、`MECHANISM-LIVENESS seen=6 acted=0` 且三桶全 0 ⇒ **无法自我归因**。⚠️ issue 正文把它归因成「对账步失败，或目标 workflow 不在 main 上」——**两者都不成立**（对账步 rc=0、六份 workflow 都在 main 上）"
      - "**真根因（本机实测复现，铁律 11 的正面案例）**：那条前置判据写作 `gh workflow view \"$wf\" --ref main`，而 gh 要求 `--ref` **必须**搭 `--yaml` ⇒ 它 **100% 失败**（stderr `` `--yaml` required when specifying `--ref` ``、退出 1、耗时 **0.063s**；run 日志里六条腿各报一次、每条 **≈58ms**，同量级）⇒ **问错对象的判据比没有判据更糟**：6/6 命中同一条坏分支，形态学判据全都看不见。⇒ 换成 `on_main()`：本步 checkout 是 `ref: main` + `fetch-depth: 0` ⇒ `HEAD` 就是 main 的 HEAD，用 `git` 直接问那棵树"
      - "**判据 1（落状态本身有判据）**：腿清单的**唯一来源** = 本步自己的 `reconcile_one` 调用（现取，**不另立第二份清单**）；每条腿**先落 `unrecorded` 种子**、`watchdog_note` **整行替换**（⇒ 任何时刻**恰好一行/腿**）；**没落状态**的腿 ⇒ 对账步**自己**判红（退出码 3）并**具名到腿**，不许把「缺状态」甩给下游 fail-closed 兜。判据 = tests/unit_ci_workflows/test_deploy_watchdog.py 的 `test_every_leg_gets_exactly_one_state_row_with_a_seeded_placeholder` / `test_reconcile_step_is_red_and_named_when_a_leg_is_left_unrecorded`"
      - "**判据 2（零动作必须归因）**：`seen=N acted=0` 且原因桶全 0 ⇒ 存活读数的 `why` 必须带上**具名**的未落状态清单（`未落状态=N 具名:<腿>`）。判据 = 同文件 `test_liveness_why_accounts_for_every_leg_when_acted_is_zero`"
      - "**判据 3（三态三分）**：`deployed`/`inflight`（不报）· `terminal`/`dispatched`（**业务告警** ⇒ `priority/P1` 单）· `notarget`（尚未轮到，不报）· `unrecorded`/缺失（**机制故障** ⇒ 换标题 + `type/bug` 单，**不开**业务单）—— 四桶**各自可见**（`已判定=` / `计入告警=` / `机制故障=` / `尚未轮到=`）。判据 = 同文件 `test_mechanism_failure_gets_its_own_bucket_and_does_not_open_a_business_issue`（注入一条缺状态的腿 ⇒ 机制故障分支、**不**开 `[deploy-watchdog] main HEAD 超时未部署` 单）/ `test_leg_not_on_main_is_not_collapsed_into_mechanism_failure` / `test_deployed_legs_stay_out_of_both_alert_buckets`"
      - "**判据 4（清零不依赖下一轮 cron）**：`on.workflow_run`（`types: [completed]`、`branches: [main]`）监听**全部六条** deploy 腿 ⇒ 部署**完成这个事件**即触发对账/清零；`workflow_run` 与 `schedule` 走**同一套**判定（事件只决定「什么时候跑」，不决定「怎么判」）；清零时单上写明「**清零条件已满足**」。判据 = 同文件 `test_workflow_run_is_wired_as_the_deploy_completion_event` / `test_workflow_run_and_schedule_share_one_judgement_body`"
      - "**判据 4 的防自激（派单硬要求）**：部署**刚刚成功**（同 sha 结论 success）⇒ **不得**再 dispatch（否则事件自激成环）；部署落在**不可恢复终态**（failure/cancelled…）⇒ 断路器跳闸、**不得**再 dispatch（否则「失败完成 → 对账 → 再补 → 再失败」成无限环）。判据 = 同文件 `test_no_self_excitation_when_deploy_just_succeeded` / `test_terminal_state_does_not_redispatch`；既有断路器与「同 sha 有在途 run 就不重复派」两条判据**一字未动**"
