      - "**判据 2（🔴 无主订单不摊给任何人）**：没有制单人的订单（存量 / C 端自助单）**单独计数**（`unattributedOrders`），不计入任何人的业绩 —— 摊了就是凭空给人加分，而且不会有任何东西报错。判据 = `#unattributedOrdersAreNotBlamedOnAnyone`。"
      - "**判据 3（客单价不做 0 除）**：单数为 0 ⇒ `avgOrderValue` 为 null；金额为 null 的订单按 0 计入收入但单数照算（不让一行脏值吞掉整单）。判据 = `#nullAmountCountsAsZeroButOrderStillCounted`。"
      - "**判据 4（空数据 ≠ 0）**：没有命中订单 ⇒ 合计 null、`hasData=false`（与另两张报表同口径）。判据 = `#emptyReportHasNullTotals`。"
      - "**判据 5（数据范围同 P0-4）**：`self` 范围只统计本人创建的单（业绩报表里就是「只看自己的业绩」）；范围由服务端解析，端点入参只有日期区间。判据 = `#dataScopeRestrictsToOwnPerformance` + `ReportControllerTest#takesOnlyDateRange`。"
      - "**边界（照实登记）**：① **退款列本段不给** —— 退款真值在 `finance_transactions`（每单一次查询 = N+1），本段先只做「单数 + 收入 + 客单价」；宁可少一列，也不放一个恒为 0 的假字段（那会被读成「这人没退过款」）。② 明细上限 500 行且未分页 ⇒ 合计只覆盖命中的部分；③ 账龄报表化、CSV 导出、报表页面未做。"
    precondition: "本用例是 [backend-contract]：前置 = `orders.created_by` / `created_by_name` + P0-4 数据范围。零网络、零 LLM、无迁移（纯只读面）。"
