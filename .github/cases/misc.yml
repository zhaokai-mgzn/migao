    skip_reason: "[backend-contract] 图标归属裁决由纯函数判据 + 五条注入式红证验证（tests/unit_ci_workflows/test_menu_three_sources_are_isomorphic.py），非 LLM 行为，不进入 agent-eval 冒烟"
    merge_log: "2026-09-23 新增（issue #5217）：既有守卫只比名字/路径/顺序、不比图标 ⇒ 图标维度纸面同构、实测已漂移（production-piecework Calculator/Coins）。按实测证据选方案 2（服务端不下发图标 ⇒ 删字段），并把裁决做成机械判据 + 五条注入式红证；2026-09-23 追加（issue #5236）：「菜单三源同构」这个口号把覆盖面写死在**三**处 ⇒ `UserController` 私自持有的第四张菜单表（`generateMenus`）天然在判据之外、怎么腐烂都不会红。实测该表无消费方（端点 `GET /api/admin/user/info` 可达但前端零调用、无契约账本条目、无断言其 `menus` 内容的测试）⇒ 整段删除；裁决改挂到「不得再长出第四处独立菜单表」+「不得错做成删字段」，另加五条注入式红证（各能单独变红）+ 一条负控（判据读剥注释后的代码，不吃自己的说明文字）；2026-09-24 追加（PR #5273）：PR #5270 新增的 MC-012 守卫（`tests/unit_ci_workflows/test_agent_permission_parity.py`）把「四处菜单源」写进判据与登记表 ⇒ 删掉第四处后它必红（自然红证 = `parse_menus` 的「menu:user 解析出 0 个节点」，实测 2 failed）⇒ **同 PR 收口**：登记项改判 + `menu:user` 空表前提 + 判据 3 ④ 三面双向钉死 + 一条负控（注释提及必须绿）+ 两条新注入（④b 原名长回 / ④c 换名长回且接回响应），九条判据其余断言零改动"
