# cases/misc.yml — ai-agent-service misc-part2 覆盖率用例（issue #2424）
# 来源：issue #2424 coverage-gap 反推（extractor / intent_classifier / follow_up / config / llm.factory / main / rule_matcher 七个文件的 L2 真值）。
# 均为单元测试契约（纯函数 / 配置 / 依赖注入 mock 的 async 方法），不进入 agent-eval 冒烟（skip_reason 显式标注）。

schema: "case-contract/1.0"
domain: misc

cases:
  - id: MC-001
    legacy_id: ""
    title: "记忆提取解析 - 纯 JSON/内嵌数组/非法输入"
    domains:
      - misc
      - chat
    tier: normal
    tags:
      - memory
      - extractor
      - parse
    truths_ref:
      - misc.parse-extraction-result
      - misc.extract-short-turn
    user_inputs:
      - "ai-agent-service 从 LLM 响应解析记忆列表，并跳过问候/感谢等短对话"
    expectations:
      - tool: direct_reply
    data_checks:
      - "_parse_extraction_result 纯 JSON 数组直接 json.loads 返回；带说明文字时 re 提取 [...] 再解析；非 JSON/非 list → 返回 []"
      - "extract_memories_from_turn 在 user_message<4 且 assistant_reply<20 时直接返回 [] 且不调 LLM"
    skip_reason: "纯函数由 pytest 单测验证（tests/test_memory_extractor.py），非 LLM 行为，不进入 agent-eval 冒烟"
    merge_log: "2026-08-25 新增：ai-agent-service misc-part2 覆盖率补全（issue #2424）"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_memory_extractor.py"
      ci:
        - ai-agent-tests.yml
      verifies: []

