  - id: MC-074
    legacy_id: ""
    title: "凭据字面量不得进仓：明文 service token 一律走环境注入（不设 ⇒ 未就绪 / 不带该头），由仓内守卫按**现取**扫真源码判红（gitleaks 只扫新增行 ⇒ 存量明文它看不见）"
    domains:
      - misc
      - ci
    tier: normal
    tags:
      - security
      - credential
      - guard
      - red-proof
    truths_ref: []
    # ⚠️ 真值暂缺：这是**仓内静态守卫**（非 LLM/业务真值），由 tests/unit_ci_workflows/test_plaintext_credential_guard.py 验证。
    user_inputs:
      - "测试代码里再写明文 service token 必须**能红**（gitleaks 只扫新增行 ⇒ 存量明文永不报警）"
      - "不设环境变量时必须按**未就绪（skip）**处理，不许变成失败"
    expectations:
      - tool: direct_reply
    precondition: "本用例是 [backend-contract] 的**仓内静态守卫契约**（不进 agent-eval 冒烟）：两条 `user_inputs` 是对**同一个守卫**的两条断言（要能红 / 不设要 skip），**不是两次会话**。前置 = 守卫脚本 + 判据文件在位（`.github/plaintext_credential_guard.py` 与 `tests/unit_ci_workflows/test_plaintext_credential_guard.py`）—— 前置不成立（脚本被删 / 扫描面塌缩）时判据**当场红**，不会表现为「agent 不干活」。"
    data_checks:
      - "**病（issue #6172 现取读数）**：`grep -rn '<64位十六进制>' backend/ai-agent-service/tests/` 命中 2 处明文（`tests/contracts/conftest.py` 的 `SERVICE_TOKEN = …` 与 `tests/test_e2e_mibao_scenarios.py` 的 `X-Service-Token` 头）。`gitleaks` 只扫 **diff 新增行** ⇒ 存量明文**永不报警**（「能红的地方看不见它」）。该 token 是内部服务凭据（`:8001` 内部面）：实测它**足以**指定任意租户读数据 ⇒ 拿到它 = 能跨租户读（写面另被 403 拦）。"
      - '**修法（形态逐字照抄 issue #6170，不写第二套）**：`SERVICE_TOKEN = os.environ.get("MIGAO_SERVICE_TOKEN", "")` + `headers = {...} if SERVICE_TOKEN else {}`；不设 ⇒ **不带该头** / 按**未就绪**处理（skip），**不许**变成失败。两处落地：contracts 的 `_fetch`（无凭据 ⇒ 直接走缓存快照，CI 本来就这条路）+ e2e 场景的 `_is_service_available`（无凭据 ⇒ 未就绪）。'
      - "**判据（本单重点）** = `.github/plaintext_credential_guard.py`（**现取**扫真源码，不钉手抄清单）；三态 `0` 干净 / `1` 命中（逐条具名 `文件:行号` + 规则 + **该改用什么**）/ `3` 扫描面不存在（无法判定，不得当 0 读）。两条规则：**R1** 凭据命名的键 = 字面量取值且取值够像凭据；**R2** `X-Service-Token` 头的字面量取值。消费点 = `pr-check.yml` 的 `ci workflow helper unit tests` job 新步 + `tests/unit_ci_workflows/test_plaintext_credential_guard.py`（L0，随该 job 套件跑）。"
