  # ==========================================================================
  - id: MC-041
    legacy_id: ""
    title: "取下一个用例号是**一条只读命令**：候选 = main ∪ 全部 open PR 的分支 ∪ 本工作区，取**最小空闲号**并在同一次调用里断言「返回的号 ∉ 候选集」；看不到在飞面（gh 不可用 / 未登录 / 离线）⇒ 拒绝给号并非零退出；`scripts/**` 里取号只有一个实现点"
    domains:
