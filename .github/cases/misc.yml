    title: "发布腿的兜底触发面：自走触发面只剩 push 的腿必须有 schedule / workflow_run 兜底（workflow_dispatch 是手动面、不算），登记表只许缩短且未登记即红，声明与现取双向，workflow_run 上游名必须可解析"
