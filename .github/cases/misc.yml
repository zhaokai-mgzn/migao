      - "**判据 5（开单参数）**：带本单 id + 原因；加工单号留空则**不传空串**（服务端 `@RequestParam(required=false)` 收到空串会当成一个值）。开完刷新返工列表。判据 = `#填了原因就开单`。"
      - "**判据 6（🔴 附属读数不拖垮主业务）**：返工接口读不到 ⇒ 工单本身照常可看可操作，只在返工区块写一行失败提示。判据 = `#返工接口读不到 ⇒ 工单本身照常看`。"
      - "**边界（照实登记）**：① 本页只**发起**返工，推进（开工/完工/取消）仍在 `/rework-orders`；② 不录返工工时/成本；③ 不做「售后单 → 关联加工单」的自动推断（要人填）；④ 返工取消不回退售后状态（服务端口径）。"
    precondition: "本用例是 [frontend-contract]：前置 = 返工单后端（#7377 段 2）+ 返工单页（段 3）+ 售后详情页。零网络、零 LLM。"
    skip_reason: "[frontend-contract] 售后详情页的返工入口口径（已闭环不给、已有未完结不可点、附属读数不拖垮主业务），由前端单测验证，非 LLM 行为，不进 agent-eval 冒烟"
    merge_log: "2026-10-23 新增（issue #7377 段 4）。落码 = `AfterSalesDetail.tsx` 的 `reworkEntry()` 纯函数 + 返工区块 + 开单弹窗 + `loadRework()`（失败不阻塞）。"
    traces:
