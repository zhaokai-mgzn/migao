      - "**判据 1（形态）**：文件名 `<PR号>-<CASE_ID>.json`、字段最小集齐全、文件名里的 PR / 用例号与内容 `pr` / `id` 一致、`claimed_at` 是 `YYYY-MM-DD`；claim 目录里出现非 claim 文件（除 `.gitkeep` / `README.md`）也判红。执行点 = tests/unit_ci_workflows/test_case_id_claims.py 的 `test_red_proof_form_violations_are_named`。"
      - "**判据 2（两 claim 同 id ⇒ 红）**：**具名报出两个 PR 号** + 「后合入者让号」—— 这是把撞号在 CI 里具名抓住的主路径（`MC-064` 的三次撞号正是这个形状）。执行点 = 同文件 `test_red_proof_two_claims_with_the_same_id`。"
      - "**判据 3（本 PR 自己的 claim 与已用号相撞 ⇒ 红）**：**`claim.pr == 当前 PR`** 且该 `id` 已在用例库被占用 ⇒ 报出该号 + 让号出口（陷阱 3 的兜底）。执行点 = 同文件 `test_red_proof_claim_collides_with_a_used_id` / `test_red_proof_only_the_current_prs_claim_is_named`。"
      - "**判据 4（他人 claim 一律不报 = 累积台账）**：`claim.pr ≠ 当前 PR` 的 claim（**含已落地的历史 claim**）是「这个号已分配过」的登记 ⇒ **一条都不报**（落地 claim 保留在 main 上**是有意的**，不是垃圾）。执行点 = 同文件 `test_control_another_prs_landed_claim_is_a_ledger_record_not_an_error` / `test_merge_state_approximation_does_not_flag_another_prs_landed_claim`。"
      - "**判据 5（占位不得超额）**：每条 claim 的 `id` 必须在用例库里**有对应用例**（主防线）；同一 PR 的 claim 数 ≤ **现取上限**（= 用例库现取条数；变更集不可得时的兜底口径，**不拍魔法数**）。执行点 = 同文件 `test_red_proof_claim_without_a_case`。"
      - "**判据 6（负向对照）**：没有 claim ⇒ 一条都不报；另有一条对照读数（形态齐全 + 号在自己 PR 的用例里 ⇒ 不红）。执行点 = 同文件 `test_negative_control_no_claims_is_green` / `test_control_clean_claim_is_green` / `test_duplicate_is_full_volume_while_collision_is_own_pr_scoped`。"
      - "**纯静态自证**：本判据零 ai-agent 依赖（AST 取 import 名）+ 禁 `pytest.skip` —— CI 的 `ci workflow helper unit tests` 只装 `pytest` + `pyyaml`。执行点 = 同文件 `test_this_judgement_is_pure_static_and_never_skips`。"
      - "🔴 **覆盖边界（显式登记）**：① 看不到在飞分支（别人的 open PR 上的 claim 不在我的树里）⇒ 「两个在飞 PR 同时取到同一个号」只有在其中一个合入后才现形；② 「claim 了号、还没写用例、而 main 恰好已有同号用例」这一角判不了（合并态近似把本 PR 的号扣掉了）；③ 判据**不查 GitHub / 不联网**，也**刻意不读 `origin/main`**（CI 的 checkout 是 `fetch-depth: 1`）⇒ 「已进 main」以**合并态近似**表达，精确主线段读数由 `MIGAO_CASE_CLAIMS_MAIN_DIR` 注入；④ main 侧没有守护（`pr-check` 只在 `pull_request` 触发）⇒ **本 PR 自己**撞号（判据 3）只能在它自己那个 PR 的 CI 上现形；**别人的** claim（含已落地）**不再是**判红对象（判据 4）。⑤ 本判据**不改**任何门禁的通过条件、不新增豁免。"
    skip_reason: "[backend-contract] 纯静态扫描 + 内存 / tmp_path 注入式判别力自证（只读仓内 `.github/cases/**`；零真库、零网络、不烧 token、不 import ai-agent 依赖）由 tests/unit_ci_workflows/test_case_id_claims.py 验证，非 LLM 行为，不进入 agent-eval 冒烟"
    merge_log: "2026-10-02 新增（issue #6017，用户 2026-10-02 裁定方案 B）。落码 = ① 判据 tests/unit_ci_workflows/test_case_id_claims.py（六条 + 5 条注入式红证 + 负向对照 + 合并态近似的无注入红证 + 纯静态自证）② 规范面 docs/wiki/Change-Blast-Radius.md 新增「陷阱 3」（取号流程改为：查 `.github/cases/claims/` + 已用号 ⇒ 取号 ⇒ 同一 PR 加 claim ⇒ 合并后删 claim；「后合入者让号」保留为**兜底**）。取号 **MC-066**（**现行办法取得，让号一次，记实**）：现取 `origin/main` 最大 = MC-064；`scripts/next_case_id.py MC` 现取到在飞 PR #5996 已占 MC-065（工具同时给出历史空档 MC-049，按 MC-054~064 的「空档号 ≠ 可用号」先例不采用）⇒ 按「当前最大号 + 1 且跳过在飞占用」取 MC-066。⚠️ **本单自己的用例仍走现行取号办法**（claim 机制由本 PR 才引入，尚不在 main 上）⇒ 待 #6017 落地后本用例可迁到 claim 机制。⚠️ 本 PR **不带任何 claim 文件**：一是本用例按现行办法取号，二是 claim 一旦随合并进 main 就会按判据 4 变成陈旧项。 ｜ 2026-10-02 **语义收窄（issue #6037）**：旧判据 4「号已进用例库而 claim 还在 ⇒ 陈旧即红（台账不许只增不减）」+ 旧流程「合并后删 claim」在本单被**改判** —— 实证：`.github/cases/claims/6033-MC-067.json`（PR #6033 已合并、MC-067 已进用例库）落 main 之后，**下一个 PR 一律被判红**，阻塞所有并行开发。现行口径 = **取号台账是累积的分配登记**：落地 claim **保留在 main 是有意的**（记录「这个号已分配过」），不是垃圾、不需要清理；判据 3（与已用号相撞）作用域收窄到 `claim.pr == 当前 PR`，判据 4 改为「他人 claim（含已落地）一律不报」，判据 2（两个 claim 同 id）**保持全量判红**。同批：删掉 6033 的 claim 文件、`docs/wiki/Change-Blast-Radius.md` 陷阱 3 的第 3 步与判据行同步改判、判据文件新增 3 条作用域红证 / 对照。**修前/修后读数（同一场景：claim 仍在 + `MIGAO_CASE_CLAIMS_PR=6060`）** = 修前 `problems: 1`（「陈旧 claim —— MC-067 的用例已进用例库 … ⇒ 删除该 claim 文件」）/ 修后 `problems: []`。"
