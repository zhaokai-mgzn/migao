    user_inputs:
      - "「这几个打印按钮不要跟状态挂钩，允许任何状态都能进行打印这些单据，另外把按钮收拢到一个打印统一入口中？作业单区域也有两个按钮，应该都统一收口到打印中，点击打印后可以选择不同的单据预览再进行打印」（2026-10-23 用户逐字，附两张截图：状态卡右侧的「退款 | 打印报价单 | 打印加工单 | 打印销售单」+ 作业单区块右侧的「复制全部 | 打印」）—— 用户要的是「一个入口、与状态无关、进来再选单据」；旧形态（#6434 的状态 × 单据矩阵）把可用性绑在状态上，且四个按钮常驻占位。"
