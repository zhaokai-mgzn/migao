  - id: MC-012
    legacy_id: ""
    title: "CI 失败报告去重 - 同日同标题 open issue 存在时不重复建"
    domains:
      - misc
      - ci
    tier: normal
    tags:
      - ci
      - issue-dedup
      - nightly
    truths_ref: []
    # ⚠️ 真值暂缺：CI workflow 行为（非 LLM/业务真值），由 tests/unit_ci_workflows/ 单测验证，
    # 映射表 5.1 节跟踪，禁止装作无事发生。
    user_inputs:
      - "e2e-real/nightly/xiaobu/agent-eval/fixture 等 CI 失败时自动建 issue，同日同标题已存在 open issue 应复用而非重复创建"
    expectations:
      - tool: direct_reply
    data_checks:
      - "CI workflow 的 Create Issue step 必须先 search 同标题 open issue：已存在 → 仅评论追加 run 链接；不存在 → 才 issues.create"
      - "守卫与创建逻辑同属一个 github-script step，避免 failure 时重复 issue 堆积"
      - "**迁移指纹账本只追加**（issue #4235 判据 2；issue #5291 的 `V129__backfill_domain_read_permissions.sql` 是最近一次消费方）：新增迁移必须在 `tests/unit_ci_workflows/migration_fingerprints.json` **只追加一条**，**已登记条目的字节漂移一律判红**（判据本体 = `tests/unit_ci_workflows/test_migration_immutability.py`，**不新写第二份**；重生成入口 = 该脚本的 `--write-ledger`，它带前置断言：任何其它条目漂移即拒绝写出）"
      - "**生成物新鲜度（零 diff 自证）**：`.github/cases/*.yml` 或 `.github/templates/*.yml` 改后必须跑 `python3 .github/render_cases.py --cases .github/cases --out-eval tests/agent_eval/eval_cases.py --out-md docs/testing/mibao-verification-cases.md` 重渲染；**同参数再跑一次必须零 diff**（生成物是派生物，手改生成物一律判红）"
      - "**重活锁 `--wait`（issue #5863，2026-10-01）**：`machine-heavy-lock.sh acquire --wait <秒>` 是「排队等待」的合规入口（脚本内部轮询，间隔 **2~5 秒随机抖动**，到上限即止并**具名**拒绝）；`verify-all.sh` 用 `MIGAO_HEAVY_WAIT=<秒>` 显式开启，**未设置时拒绝语义一字不改**（拿不到锁仍立即出声拒绝）。判据 = `tests/unit_ci_workflows/test_machine_heavy_lock.py::TestWaitOption`（**真跑脚本**：空闲时不得变慢 / 被占则等到释放并出声「排队等待…后取得」/ 超时具名且不偷锁 / `--wait 0` 与不传等价 / 参数错误 rc=2 / 退避落在 [2,5] 且**非常数** / **变异红证**：把「可等待」那行拿掉 ⇒ 判据当场红）"
      - "**重活锁**的**射程**（issue #5863，2026-10-01 改判）：`verify-all.sh` 的 `heavy_lock_wanted` 覆盖**所有会跑全量测试的档**（`quick` / `full` / `frontend` / `backend` / `agent` / `redproof` / `gate`），**未知 / 空档位不拿**。病史 = 原判据断言「只有 `gate` 拿锁」（理由「其余档不是同一台机器上的重活」）**与事实不符** —— `full` 按脚本自己的档位说明就是三模块全量 ~10-15 分钟，`redproof` 机具实跑单机具 2~30 分钟；实测 `gate` 持锁期间 `load average` 16.71 / 28.71 / 20.14（8 核）而单份档最多打满 ~8 核 ⇒ 锁外确有重活。判据 = `tests/unit_ci_workflows/test_machine_heavy_lock.py::TestVerifyAllWiring::test_every_tier_that_runs_tests_takes_the_lock`（正向七档全 WANT + 反向空/未知档 NONE）"
    skip_reason: "[backend-contract] CI workflow 结构由 pytest 单测验证（tests/unit_ci_workflows/test_issue_dedup_guard.py），非 LLM 行为，不进入 agent-eval 冒烟"
    merge_log: "2026-09-02 新增：CI 自动失败报告去重守卫（issue #2746）。2026-10-01 追补（issue #5863）：本用例同时承载「机器级重活锁」的判据面 —— 新增 `TestWaitOption`（`--wait` 排队等待 + 抖动退避 + 变异红证）；背景 = 默认 `acquire` **不排队**，客户端各自自旋时用固定长间隔重试的一方被系统性饿死（实测：30s 间隔 × 56 次探测 / 约 34 分钟一次未中，而释放瞬间总被重试更勤的一方接走）。"
    traces:
      tests:
        - "tests/unit_ci_workflows/test_issue_dedup_guard.py"
      ci:
        - e2e-real.yml
        - nightly-verification.yml
        - xiaobu-acceptance.yml
        - agent-eval.yml
        - agent-eval-adversarial.yml
        - fixture-record.yml
      verifies: []

