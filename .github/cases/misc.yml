    skip_reason: "[backend-contract] 仓库约束与调拨守恒，由 Java 单测验证，非 LLM 行为，不进 agent-eval 冒烟"
    merge_log: "2026-10-21 新增（issue #7373 段 1）。落码 = `Warehouse`/`StockTransfer`/`StockTransferItem` + 三个 Mapper + `WarehouseService`（默认仓切换/编码冲突）+ `StockTransferPolicy`（守恒纯函数）+ `StockTransferService`（即时调拨，批次改仓、缸号随行）+ `WarehouseController` + V182。"
