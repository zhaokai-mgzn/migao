    merge_log: "2026-10-22 新增（issue #7376 段 1）。落码 = `ReportTotals`（纯函数：合计/复算/空数据判定）+ `ReportService`（复用 `OrderMarginService` 的同一份毛利计算，不重算口径）+ `OrderMarginReportView` + `GET /api/admin/reports/order-margins`（`dashboard:view`）。"
