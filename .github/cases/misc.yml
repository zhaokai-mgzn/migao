    expectations:
      - tool: direct_reply
    data_checks:
      - "**自走触发面**口径：顶层事件去掉手动面与被调面（`workflow_dispatch` / `workflow_call` —— 两者都不能让一条腿自己起跑）= 能自己跑起来的面；该面**只剩 push** ⇒ 必须有兜底面（`schedule` 或 `workflow_run` 之一）。手动面**不算兜底**（把它当兜底 = 手动面冒充自动面）"
      - "**登记表只许缩短 + 未登记即红 + 删光即红**：`tests/unit_ci_workflows/publish_leg_fallback_ledger.json` 的 `legs` 与判据里的冻结元组 `PUBLISH_LEG_FILES_FROZEN` 双向相等（删一条 / 加一条都必须同批改两处）；`frozen_max` 与判据里的 `LEGS_FROZEN` 两处不符 ⇒ 红；条数超上限 ⇒ 红；`legs` 为空 ⇒ 红（fail-closed：「没东西可判」不是通过）"
      - "**全仓形状扫描（未登记即红）**：`.github/workflows/*.yml` 里任何一个自走面只剩 push 的 workflow 若不在登记表里 ⇒ 红（抓「新造一条 push-only 腿」）。**有意不用宽泛正则一把梭**（那会把无关 workflow 卷进来 ⇒ 噪声判据）⇒ 代价如实登记在覆盖边界第 7 条"
      - "**登记表声明必须与现取双向对上**：声明的兜底事件必须在现取自走面里；声明 schedule 时其 cron 字面量必须逐字出现在该 workflow 的 `on:` 里 ⇒ 台账不许给不存在的保护盖章"
      - "**`workflow_run` 上游名可解析**（全仓面，不限于已登记腿）：每个上游名必须命中仓内某个 workflow 的 `name:` ⇒ 上游改名后该兜底面**静默脱钩**（永不触发）判红（现取 10/10 全部解析成功）"
      - "🔴 红证全部**内存构造**（真文件当基线 → `copy.deepcopy` 改内存对象 → 直接喂纯函数 `fallback_problems`）：删掉兜底面 / 换成 workflow_dispatch / 登记表删一条 / 登记表清空 / 登记的腿文件不存在 / 声明与现取脱钩 / workflow_run 上游名改错 / 新造一条未登记的 push-only 腿，各自判红；**只加一条注释 ⇒ 不红**（对照读数）；另有「坏形态读数 ≠ 基线读数」自证（防变异没生效 ⇒ 空断言）"
