  - id: MC-042
    legacy_id: ""
    title: "控制流管道必须显式表态（`set -o pipefail` 或登记豁免）：判的到底是「命令自身失败」还是「管道末端的结果」"
    domains:
      - misc
      - ci
      - workflow-shell
    tier: normal
    tags:
      - ci
      - shell
      - exit-code
      - red-proof
      - ledger
    truths_ref: []
    user_inputs:
      - "在 workflow 的 run 块里用 `if <命令> | grep …` 判红时，必须让「命令自身失败」与「没匹配」可区分：要么 `set -o pipefail`，要么登记豁免并写明「本条判的是管道末端的结果」；新出现一处未登记的这类管道、或删掉命令自身 rc 的判定、或让豁免登记变陈旧，都必须有东西变红"
    expectations:
      - tool: direct_reply
    data_checks:
      - "判定本体的唯一实现 = `if/elif/while` 行里出现「被判定命令（git/gh/npm/python3/bash/node） | grep|head|tail|wc|sort/uniq/sed/awk」，且该 `run` 块**没有** `-o pipefail` ⇒ 必须登记在 `PIPE_RC_EXEMPTIONS`（台账**只许缩短**）"
      - "现取基线 = **2 条刻意的管道末端判定**：`.github/workflows/flaky-ledger-reconcile.yml::reconcile`（问 help 里有没有 `--branch`）与 `.github/workflows/pr-check.yml::label-needs-changes`（问标签在不在）—— 两条都逐字写明「加 pipefail 会把结论读反」"
      - "判据四条：基线 / 注入红证（新增一处未登记管道 ⇒ 红）/ 对照（同一段加 `pipefail` ⇒ 不红）/ 对照（只在注释里提及 ⇒ 不红）/ 陈旧豁免（现取命中里找不到 ⇒ 删它，红）"
      - "现场（2026-09-28 同一天两个地方各咬一次）：① `pr-check` 门控步原先 `if git diff origin/main...HEAD | grep -qE '<路径>'` ⇒ `git diff` 真失败（rc≠0）时管道 rc 取 `grep` 的 0 ⇒ 落 else 并把原因写成「未命中受管用例面」= 归因写错 + 静默跳过（已修：先 fetch + 判 `git diff` 的 rc + fail-closed 出声）；② 侦察命令 `gh pr checks --watch | grep … | tail` 把**判红吞成退出 0** ⇒ 「两条 dependabot 都红」一度被读成「有一条绿」（当场更正）"
    skip_reason: "[backend-contract] CI shell 的结构判据（零 LLM、秒级）由 tests/unit_ci_workflows/test_dev_mode_failure_modes.py 的判据 22（pipe_rc_problems）验证，非 LLM 行为，不进入 agent-eval 冒烟"
    merge_log: "2026-09-28 新增（用户逐字「做完你的下一步建议的3点就收尾」；现场见 data_checks 第 4 条）：先把射程量出来（宽口径 32 块 / 47 行；窄口径 2 块，且两块都是刻意的管道末端判定）⇒ 判据取窄口径 + 豁免表只许缩短，避免把存量 32 块一次性拉成假红。"
    traces:
      ci:
        - pr-check.yml
      tests:
        - tests/unit_ci_workflows/test_dev_mode_failure_modes.py
      verifies: []

  - id: MC-050
    legacy_id: ""
    title: "本腿执行形态的登记与漂移守卫（issue #5814）：CI 与本地腿的并行度必须都等于台账声明的那一个值；跑整套时判据库存不得低于冻结基线、skip 读数不得偏离；只改其一或改台账不复算都必须有东西具名报出"
    domains:
      - misc
      - ci
    tier: normal
    tags:
      - ci
      - parallelism
      - xdist
      - execution-shape
      - red-proof
      - ledger
    truths_ref: []
    # ⚠️ 真值暂缺：本判据是**执行形态 + 收集面读数**这一静态/结构事实（纯函数 + 现取 YAML/脚本），
    # 由 tests/unit_ci_workflows/test_helper_leg_execution_shape.py 验证，非 LLM 行为，不进入 agent-eval 冒烟。
    user_inputs:
      - "当 CI 的 `-n` 或本地腿的 `-n` 被改（只改一边、或改了没同步台账 `helper_leg_shape_ledger.json`）、台账声明的消费点被删或改名、冻结库存被填成 0、跑整套时本轮收集数低于冻结基线、或 skip 读数偏离冻结值时，都必须有东西具名报出；而只改注释、或跑子集（`pytest tests/unit_ci_workflows/<某个文件>`）时不得报红"
    expectations:
      - tool: direct_reply
    data_checks:
      - "**判据 1（台账 ⇄ 两边声明三方一致）**：`.github/workflows/pr-check.yml` 的 `ci workflow helper unit tests` job 与 `verify-all.sh` 的 `ci_helper_leg()` 里那条 pytest argv 的 `-n` 取值，必须**都等于**台账 `shape.parallel_workers`（现取，不写死；只改一边 ⇒ 红）"
      - "**判据 2（消费点逐字存在）**：台账 `consumption_marker` == `tests/unit_ci_workflows/conftest.py::CONSUMPTION_MARKER`，且该函数可调用、红证孔 `MIGAO_FAIL_HELPER_LEG_SHAPE` 在 conftest 里真存在（删判定 / 台账变成没人读的表 ⇒ 红）"
      - "**判据 3（冻结库存是实值 + 两态 skip 读数自洽）**：`frozen_inventory.collected_total > 0`，`skipped_reading` 必须同时有 `MIGAO_REQUIRE_REALDB` 与 `default` 两态且都是非负整数，且更严形态（注入标记）的读数 ≤ 本地形态（放宽 / 只给一态 ⇒ 红）"
      - "**判据 4（运行期牙齿，唯一在单进程与 `-n` 下都传得到退出码的通道）**：跑**整套**时本轮 `request.session.testscollected` ≥ 冻结基线、skip 读数 == 该环境冻结读数；**子集运行不判**（否则研发日常的定位运行会假红）；一旦收集面少了一份判据文件就不早退（fail-closed）"
      - "**判据 5（分片三方一致，issue #6164）**：同一 job id（`ci-workflow-tests`）的 matrix 片名 == `verify-all.sh` 的 `ci_helper_leg()` 里 `MIGAO_CI_HELPER_SHARD=` 的取值 == 台账 `shape.shards.names`；且 env 名 / 盐 / 规则实现（`conftest.py::shard_of`）三方在位（只加一片 / 只删一片 / 改了盐没同步 / 台账没登记 ⇒ 红）"
      - "**判据 6（分片是全划分）**：按**现取语料**（`test_*.py`）用 `conftest.shard_of` 复算 ⇒ 每个判据文件**恰好**落进一片（并集 == 目录全集、两两不相交、无空片）；这是「文件不属于任何片 ⇒ 静默少跑」的唯一堵法"
      - "**判据 7（逐片冻结基线）**：`frozen_inventory.shards` 的键集合 == 片名集合且逐片 `collected_total > 0`；运行期**分片形态下缺本片基线 ⇒ fail-closed 判红**（区别于整套形态的「没填就早退」——前者是「台账建了却漏了这片」，正是拆腿最可能出的坏形态）"
      - "🔴 红证（分片，各自能单独变红）：CI matrix 少一片 / 本地腿少一片 / 台账漏登记一片 / 盐漂移 / 某片没有冻结基线 / 台账整个缺 `shards` 块 / 片名与规则值域对不上（一整半文件不属于任何片）⇒ 各能单独变红；对照读数：真语料零问题"
      - "⚠️ 分片最容易失效的一处（判据 4 的同族）：运行期的「本轮跑的是不是整套」若按「覆盖目录下**全部** `test_*.py`」写死，分片后**每条腿**都会被判成「子集运行」⇒ 早退 ⇒ 库存牙齿全掉（「变快」重新等于「少跑」）。⇒ 那条判定必须分片感知（`conftest.expected_test_files()` + 逐片基线）"
      - "**判据 8（逐条本地 argv 都逐字比，issue #6164 收尾）**：拆腿后本地腿里有**两行** pytest 命令，任何「只取第一条」的现取写法都会只钉住两片中的一片 —— 实测退化：只把第二片的 `-n 4` 改成 `-n 8` 时，MT-031（`test_ci_helper_leg.py`）与 MC-050 的并行度判据**都没有反应**。现取改成**逐条都比**（`_local_pytest_argv_all` / `pytest_argv_lines`），并各配一条**只动第二片**的注入式红证"
      - "**判据 9（分片要**平**，issue #6164 平衡臂）**：盐不是随便取的 —— 旧盐 74 的文件数几乎相等（172/170）却把**重判据**堆在片 1（安静机实测 388s vs 234s；CI 上片 1 恒慢 30~110s，四轮一致）⇒ 现用盐 130：重判据 **316/305**、用例数 **3241/3292**（差 51）、文件数 171/171。🔴 **读数是分片成员的函数**：改盐必须**同批重锚**逐片冻结基线 —— 实测过只改盐不同步 ⇒ 片 1 当场判红（`本轮收集 3057 < 冻结基线 3245`，fail-closed 生效）。选盐用的是**本机安静时段的代理读数**（CI 侧拿不到逐文件读数：canonical argv 不许加 `--durations`）⇒ 验收口径 = **CI 的两片读数**，且要连看几轮（同一片两轮之间实测差 40%）。"
      - "**判据 10（关键路径的现取口径，issue #6164 收口）**：关键路径 = **两片里较慢那片的 step 秒数**（不是平均 —— PR 反馈等的是最慢的那条）；🔴 **分档**（让出档/全量档不可混算）+ **单轮不足以定论**（同一片两轮之间差过 40% ⇒ 至少 5 轮取中位）。现取：**~500s（拆腿前，60 个 run 的 step 中位）→ ~316s（换盐后 N=3 中位，全量档 299~318s）≈ −37%**；**~250s 两片到不了**（下界 = 总 step/2），2026-10-03 用户裁定**停在两片**。复算命令与逐轮读数 = 台账 `shape.shards.ci_readings`（写命令不写死数）。"
      - "⚠️ **照实登记的缺口**：`skipped_reading` 是**整套**口径，运行期收口只判**逐片库存**、**不判 skip**；而「skip 逐值相等」这条不变式在分片下**结构上不可能同时成立**（冻结的整套 skip=1 只由片 2/2 里的文件产生）⇒ 要真接上必须先把读数改成「逐片 × 逐环境」的表（本包没做）"
      - "🔴 红证：并行度漂移（CI 侧 / 本地侧各一）/ 库存塌陷（含「塌 10 条」量级）/ skip 变多与变少两个方向 / 台账缺字段 / 消费点对不上 / 缺一态 ⇒ 各能单独变红；对照读数：真语料零问题、跑子集不报。另有一条**端到端**红证：`MIGAO_FAIL_HELPER_LEG_SHAPE=1 python3 -m pytest tests/unit_ci_workflows -q -p no:cacheprovider -n 4` ⇒ 非零退出（读数记在 PR body）"
    skip_reason: "[backend-contract] CI 执行形态的静态/结构判据（零网络、零时钟、不烧 token）由 tests/unit_ci_workflows/test_helper_leg_execution_shape.py 验证，非 LLM 行为，不进入 agent-eval 冒烟"
    merge_log: "2026-09-30 新增（issue #5814 的本包：把 PR 反馈时长从 ≈17 分钟压到 5–7 分钟 —— 手段是**削掉那条吃掉 97% 关键路径的 job**，**不降任何门禁**）：病 = required job `ci workflow helper unit tests` 是 PR 反馈的唯一关键路径（run 36689037058 该 job 997s，其中 Run ci workflow helper tests 一步 989s，而同 run 其余 14 条腿全部 < 60s、最长 41s），它此前**单进程**跑整套判据（纯 CPU / 子进程绑定：281 处 subprocess.*，无网络、无 DB 服务）。交付形态 = ① 形态变更（**唯一**允许的变化）：CI 与本地腿同批加 `-n 4`（pytest-xdist，托管 runner 4 vCPU）+ CI 侧补 `pip install pytest-xdist`；② 判据 tests/unit_ci_workflows/test_helper_leg_execution_shape.py + 台账 tests/unit_ci_workflows/helper_leg_shape_ledger.json（并行度三方一致 / 消费点在位 / 冻结库存与两态 skip 读数 / 运行期库存牙齿 + 注入式红证）；③ conftest 的运行期判定本体 collection_floor_problems（只在跑整套时判，子集不判）。取号 MC-050（现取 main + 全部在飞分支的 `- id:` 差集：main 最大 = MC-048，在飞 ci/5814-migrate-pr-legs 占 MC-049 ⇒ 取下一个空号）。⚠️ 判定渠道是**逐条实测选出来的**（三条更直觉的路都不成立：只设 session.exitstatus ⇒ pytest 仍退出 0；抛 pytest.exit.Exception ⇒ -n 下 worker 退出 1 而**控制器仍退出 0**；在 worker 里设 session.shouldfail ⇒ 快照已被 remote 钩子先发走）⇒ 最终落在**测试体内**的库存判据（测试失败是单进程与 xdist 下都必定传成非零的唯一通道）。 **2026-10-03 同案追加（issue #6164，拆腿）**：`-n` 之后三条更便宜的路都已实测到顶（CI 上 `-n 8` 反而 548s > 中位 500s；前 30 条慢判据只占 23% 工作量；`dev_only` 只作用于 13% 的让出档 PR ⇒ 加权上界 12s/PR）⇒ 改为把**同一条 job** 起 **matrix 两片**（同一个 job id，第一片的名字**逐字保留** 原 required 名 —— 改名会把在飞的 PR 卡在 `Expected — waiting for status to be reported` 且不会变红）。片号走**环境变量** `MIGAO_CI_HELPER_SHARD`（pytest 命令行一字不改 ⇒ 「CI ⇄ 本地 argv 逐字相同」与「全量命令只许出现一次」两条既有契约都不用动）；规则 = `conftest.shard_of`（哈希，成员关系稳定：新增判据文件不会把已有文件在两片间搬家）；本机实测两片 3252 / 3273 条（合计 == 整套 6525）。拆腿**最容易出的坏形态**是把「本轮跑的是不是整套」的判定留在分片之前的写法上 —— 那样**每条腿**都会被判成「子集运行」⇒ 早退 ⇒ 库存牙齿（`collected_total` 下界）全掉，「变快」重新等于「少跑」而无人能判；⇒ 该判定改为分片感知（`expected_test_files()` + 逐片基线 `frozen_inventory.shards`），且**分片形态下缺本片基线 = fail-closed 判红**（见判据 5~7）。"
