    data_checks:
      - "**病（现取读数，2026-10-01）**：加载一个技能 = 把整份 SKILL.md 正文放进上下文（加载器只取 frontmatter 的 name + description，调用时 content = parsed.body.trim()）；`migao-dev-flow` 的**加载面**（name/description 值 + 正文，**不含** YAML 注释）改动前 **328,954 字符**，其中沿革 **98,219 字符 ≈ 29.9%**，而沿革执行流程时零需要 ⇒ **每次加载都付一次历史账**；且「沿革该放哪」过去**没有任何判据**"
      - "**存量实证（判据写好后当场跑真实语料）**：命中 1 条 —— `- v1.91.0（…）` 整条沿革**散落在 §27 尾部**（沿革节里 v1.92.0 与 v1.90.0 之间缺的正是它）⇒ 该判据抓的不是假想形态；同 PR 已把它并入 CHANGELOG.md"
      - "**独立验收实证（第二个 agent，只读复算、不信转述）**：又抓到**第 4 处口径副本** —— SKILL.md 的 frontmatter `description` 里写着「变更沿革已**迁至**正文「版本沿革」节」，**换了动词**故逃过按字面替换的同步，而它**就在加载面里**（每次会话注入的技能目录文案，比正文更早、更贵）⇒ 判据 6 与「加载面」定义（load_surface_text，不含 YAML 注释）就是为这一族加的。教训 = **「判据绿」≠「口径已同步」**"
      - "**判据 1（语料非空，fail-closed）**：找不到任何 `skills/*/SKILL.md` ⇒ 红（「没东西可判」不是通过）"
      - "**判据 2（牙齿：回流即红）**：任何 SKILL.md 的**加载面**出现沿革**节标题**（`## 版本沿革（…`）或沿革**条目行**（`- vN.N.N（…`）⇒ 具名报出该文件与命中行，出口 = 写进同目录 CHANGELOG.md"
      - "**判据 3（外置 ≠ 删除）**：登记的技能缺同目录 `CHANGELOG.md`、或该文件不含任何 `- vN.N` 条目 ⇒ 红（沿革是「这条纪律为什么存在」的唯一出处）"
      - "**判据 4（指针在位）**：登记的技能 SKILL.md 里没有指向 CHANGELOG.md 的指针行 ⇒ 红（读者 / agent 会以为沿革不存在）"
      - "**判据 5（判别力自证，内存构造）**：含节标题 ⇒ 红；只含条目（半搬半留形态）⇒ 红；只含指针 ⇒ **不红**；正文提「沿革」二字（如 §19 的口径沿革）⇒ **不红**（对照）"
      - "**判据 6（换了措辞的「旧落点」口径同样红）**：加载面出现「沿革 …（写进 / 迁至 / 移至 / 放进 / 放入 / 放在）… 正文」⇒ 红。红证**在真实文件上**：把 description 改回「已迁至正文「版本沿革」节」⇒ **具名判红**（旧落点口径：沿革已迁至正文），还原后 9 passed"
      - "**「加载面」定义的对照（防假红 + 防假绿）**：同样的文字放在 YAML 注释里 ⇒ **不红**（注释不进上下文，刻意留着「此前写…」的历史说明）；放进 description ⇒ **必须红**"
