    data_checks:
      - "**只读（源码层，结构性）**：`scripts/next_case_id.py` 里**所有** `gh` / `git` 调用都必须经 `gh()` / `git()` 两个外壳，且外壳的 argv 白名单（`GH_READ_ONLY` / `GIT_READ_ONLY`）必须拒绝白名单外的子命令与 `gh api` 的写动词（`POST/PATCH/PUT/DELETE`）⇒ 源码里出现写文件 API（`write_text` / `open(...,'w')` / `os.remove` / `shutil`）或 `gh` 写子命令 ⇒ 红（判据把 argv 喂进外壳**实调**一次，断言抛错）"
      - "🔴 **三态：看不到在飞面 ⇒ 不许取号**：`NCI_GH_BIN` 指向「不可用 / 未登录 / 离线」的替身可执行文件 ⇒ 必须打印「无法判定 ⇒ 不许取号」且 **exit 3**，并且输出里**一个号都不许出现**（`→ 取 ` 零命中）；某个 PR 的内容读不到（`gh pr diff` 非零退出）⇒ 同样 exit 3 ⇒ 「乐观给号」这条路径在判据面内**不存在**"
      - "🔴 **「返回的号 ∉ 候选集」这条自证自身有断言**：`allocate()` 把该断言写在函数**内部**（不靠调用方记得核）；判据用内存构造把 `min_free` 换成「返回一个已被占用的号」⇒ 断言必须真的炸（`pytest.raises(AssertionError)`）⇒ 断言被删 / 被挪到调用方 ⇒ 红"
      - "🔴 **用内存构造的语料复现「今天」的现场（核心牙齿）**：main 占 039/040/043/044/045/047、在飞 A 占 046、在飞 B 占 048 ⇒ 必须返回 **041**；把在飞 A 改成 041 ⇒ 必须返回 **042**（后者证明它**真的看得到在飞** —— 只看 main 的实现会两次都答 041），坏形态读数必须 ≠ 基线读数（防变异没生效 ⇒ 空断言）"
      - "**最小空闲号 ≠ 最大号 + 1**：同一次调用里 `allocate()` 的答案必须**等于**该前缀占用集的补集最小值（内存构造 gap 语料逐值核对），且「取尾部 + 1」的实现在同一语料上会给出**不同的**读数 ⇒ 口径不是口号"
      - "**本工作区已先占的号必须计入**：内存构造一份「工作区来源占 041」的候选集 ⇒ 答案必须是 042（把自己刚占的号判成空闲 = 本地先占失效）"
      - "🔴 **类级：`scripts/**` 里取号只有一个实现点**（双向）：① 任何 `scripts/**` 模块里出现「用例号形态的正则字面量（真能匹配 `  - id: MC-041` / `MC-041`，且带数字类）」**且**带号空间的后继 / 极值运算 ⇒ 必须登记在判据里冻结的实现点元组里（未登记 ⇒ 红：「不许有第二个脚本各自算号」）；② 工具自己的 `ALLOCATION_SITE` 记号必须逐字等于它自己的仓库相对路径（删光 / 指到别处 ⇒ 红），且只有它一处声明"
      - "**技能面口径唯一（防旧配方回来）**：`migao-dev-flow` §26.3 的取号命令必须调用 `scripts/next_case_id.py`；且技能里**不得**再出现手工取号的旧配方（「取已合并最大号 + 1」那一串）⇒ 两者都判红（否则下一个人照旧配方做，工具等于白造）"
      - "🔴 **判定方式是确定的 + 红证全部内存构造**：判据本体**零 gh / 零网络 / 零时钟**（真语料只用于「解析口径 ⇄ 判据侧 `case_id_lines` 逐值对账」这一条离线等价检查，且 `origin/main` **刻意不读** —— CI 的 checkout 是 `fetch-depth: 1`）；红证逐条走内存构造（删三态分支 / 删自证 / 把答案换成已占号 / 只看 main / 只改注释 ⇒ 不红对照）"
    skip_reason: "[backend-contract] 取号工具的只读性（源码 / 外壳白名单）+ 纯函数分配语义 + 技能面口径唯一的静态判据（零网络、零时钟）由 tests/unit_ci_workflows/test_next_case_id_allocator.py 验证，非 LLM 行为，不进入 agent-eval 冒烟"
    merge_log: "2026-09-27 新增（来源 = 本单指令「把『取下一个用例号』这一步**机械化**」；病根逐字来自 `FM-E7` / `FM-E15` 与 MC-047 / MC-048 的 `merge_log` 现场）：交付形态 = ① 新增只读工具 `scripts/next_case_id.py`（候选 = main ∪ 全部 open PR 的分支 ∪ 本工作区；取**最小空闲号**；同一次调用里断言「返回的号 ∉ 候选集」；看不到在飞面 ⇒ 「无法判定 ⇒ 不许取号」+ exit 3）② 判据 `tests/unit_ci_workflows/test_next_case_id_allocator.py`（含内存构造复现今天现场的牙齿 + 类级单一实现 + 技能面口径唯一）③ 三处登记：技能 §26.3 取号命令 / §26.4 覆盖面登记 / 台账 `FM-E7` 的 `guards`。**取号用工具自己跑**（狗粮）：2026-09-27 22:14:44 +0800 现取 ⇒ main 的 MC 家族 = 001-040,043-045,047-048、在飞 PR #5733 占 046 ⇒ 返回 **MC-041**（历史空档）。⚠️ **本单复核出的派单不准之处，逐条记实**：① 派单写「在飞 #5734 = MC-048」，而 #5734 **已于 2026-09-27T14:04:44Z = 22:04:44 +08 合并**（工具跑之前 1 分钟），MC-048 已在 main 上 ⇒ 期望答案仍是 041，但**理由不同**（不是「048 在飞占着」，而是 main 自己占了 048）；② 派单把 main 的 MC 家族写成「039·040·043/044/045·047」，现取实为「001-040 + 043-045 + 047-048」（**漏了 048**，且 001-038 一直都在）；③ 派单说 #5736 是「在飞写面」之一，它**也已合并**（`MC-047` 那条，落 main）。⇒ 三条都属 `FM-R14` / 铁律 11(a) 的形态：**派单里的时点读数必须自己现取一遍再动手**。"
    traces:
      tests:
        - "tests/unit_ci_workflows/test_next_case_id_allocator.py"
