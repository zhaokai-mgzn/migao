    data_checks:
      - "摘要行的三个数必须**逐值等于现取**（len(cases) / 无 skip_reason 数 / 其余）+ tier 分布三数等于现取 Counter(tier) —— 红证 = 把 `用例总数` 或 `normal` 各 +1（语义变异）⇒ 各自必红"
      - "🔴 **独立于渲染器**的那条：摘要**声称的条数**必须等于文档里**真实出现的块数**（`^### <ID>. `）—— 两侧都在文档自身里 ⇒ 渲染器自己错了也拦得住（本形态最容易「两边一起漂」）"
      - "fail-closed 两条：语料解析出 0 条 ⇒ 报「语料为空」；摘要行缺失/改措辞 ⇒ 解析抛错（不许静默当「没有摘要」）"
      - "对照读数（证明判据在判语义而不是判「文件变了没有」）：只插一段不含摘要形态的注释文字 ⇒ 必须**不**红（与三条红证读数不同）"
      - "🔴 覆盖边界（显式登记）：只覆盖摘要两行 + 块数一致性；**不**覆盖 casebook 逐条块的逐字节新鲜度（由 verify-all.sh gate / pr-check 的生成物新鲜度校验读真文件比对）、**不**覆盖「某文件根本没被渲染器读到」（靠 test_render_cases_domain_map.py 的域覆盖）、**不**覆盖 main 侧（本判据是 pull_request 面腿 —— 本形态的起源正是「main 先漂移、下一个 PR 才红」）"
    skip_reason: "[backend-contract] 生成物摘要与源的一致性由 tests/unit_ci_workflows/test_casebook_summary_is_derived.py 的离线判据验证（零 LLM、秒级），非 LLM 行为，不进入 agent-eval 冒烟"
    merge_log: "2026-09-27 新增（Refs #5683；issue #5687 收尾时实测发现）：main 上 casebook 摘要比源少 1 条，而逐条块与 eval_cases.py 都一致 ⇒ 下一个 PR 的生成物新鲜度校验会对无辜 PR 判红。落码 = 重渲染那 2 行 + 常驻判据（摘要↔现取、tier↔现取、摘要声称条数↔文档真实块数、两条 fail-closed）+ 三条语义红证 + 一条「只改注释」对照。取号 MC-025：main 上 MC-001~MC-024 已占用（MC-024 = 同会话的 #5687 分流语义）。"
    traces:
      tests:
