    # ⚠️ 真值暂缺：本判据是**登记面 ⇄ 菜单单一源的结构对账**（静态事实 + 纯函数），非 LLM/业务真值 ——
    # 由 tests/unit_ci_workflows/test_menu_navigator.py 的三条类级判据 + 注入式红证，以及
