      - "**判据 2（余量口径唯一）**：`sumDeltaByBatchIds(` / `sumDeltaBySku(`（Σdelta 的读口 = 「这批还剩多少」的唯一派生入口）只许出现在 `StockBatchConsumptionService.java` 与 `StockBatchConsumptionMapper.java`；第三处 = 第二份余量口径 ⇒ 红。判据 = 同文件 `test_batch_remaining_is_derived_in_one_place`"
