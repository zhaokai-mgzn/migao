    data_checks:
      - "**病（现取读数）**：issue #6294 现场（2026-10-04）—— `admin-web` 近 40 次 run 里两条 `success`（run `37156277078` / `37131394391`）**都是**「`Skip if already built (schedule reconcile)` 成功 + `Deploy to SWAS` **skipped**」，而 SWAS 实例上在跑的容器是 `admin-web:sha-877ac15`（40 小时前）、`.last-good-tag` = `sha-6838a05`、main HEAD = `9d82e2e60` ⇒ **环境一次都没换过而台账全绿**。复算：`gh run view <id> --json jobs` / `gh run list --workflow=deploy-frontend.yml`。"
      - "**运行面读数（唯一一份实现）**：`deploy/scripts/swas_deploy_running_tag.sh`（**库**，被 `deploy/scripts/swas-deploy-ci.sh` 的 `--probe-running-tag` 分发段 source；`$@` 只在主脚本解包）经**同一条** SWAS `RunCommand` 通道**只读**取回在跑 tag（远端执行体 `deploy/swas/deploy.sh` 的 `--probe-running-tag` 分支，在远端 `flock` **之前** ⇒ 不被在跑的部署挡住；不 build / 不 pull / 不 up）。判据 = tests/unit_ci_workflows/test_deploy_skip_is_not_success.py::test_running_tag_probe_exists_and_is_a_single_shared_implementation / ::test_probe_runs_read_only_remote_command"
