    data_checks:
      - "**合并不发布**（用户 2026-09-27 裁定 B）：`on.push.paths` **恰好**只有 `frontend/mini-app/**`（不含 `deploy/**`、不含 workflow 自身）**且**「模式判定」步（唯一决定会不会发布的地方）逐字读 `github.event_name` 与 `inputs.publish`、双向写 `mode=publish|notify`；`publish` 输入默认 `false` ⇒ 对账面的兜底 dispatch（`workflow_dispatch` 不带 input）也**不会**发布。红证 = 加 `deploy/**` / 加 workflow 自身 / 把默认改成 true / 把模式判定改成恒 publish / 删掉模式判定步，各自必红"
