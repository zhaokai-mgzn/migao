      - "🔴 **判定方式是确定的**：只读仓内文件（`.github/workflows/*.yml` + 同目录登记表 JSON），**零 gh / 零网络 / 零时钟** ⇒ 同一份代码在任何时刻给出同一读数；运行期计数（gh run list）**刻意不进判据**，只作为「当时的读数 + 复算命令」写在登记表 `coverage_boundary` 与 `docs/wiki/CI-CD.md` 的 `FM-E17` 节"
      - "覆盖边界（显式登记在登记表 `coverage_boundary`，由 `test_coverage_boundary_is_registered` 逐条核 face + reason + recompute）：cron 被 GitHub 节流（现取实测：`*/20` 名义 72 次/日 → 实得 6.3 次/日 = 8.4%，相邻间隔中位 244 / 最大 357 分钟；而每日档两条的中位间隔都是 ≈24.0h ⇒ 未被节流）· cron 到点被 concurrency 顶掉 · 「腿跑了但发布内容不对」（由运行期身份断言承接）· workflow_run 的上游自己没跑 · push 被吞这一运行期事实 · 「兜底面在位」不等于「线上字节与 main HEAD 一致」· 已登记腿之外的新族 · deploy-reconcile 那层不重复判（其调用点与 pathspec 已由 MC-023 冻结）"
