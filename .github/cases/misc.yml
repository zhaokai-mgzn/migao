      - "**边界（照实登记）**：① **库存周转/滞销、员工业绩、应收账龄报表化**未做（段 2；账龄已有独立端点，报表化要新增分组读面）；② **CSV 导出**未做（issue 目标里写了，属段 2）；③ 明细上限 500 行（`LIMIT 500`），超出部分**未分页** —— 合计只覆盖命中的前 500 单，这一点必须在页面提示（否则合计会被误读成全量）；④ 报表页面未做（接口已就位）。"
