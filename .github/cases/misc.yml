  - id: AR-001
    legacy_id: ""
    title: "应收账龄：到期日当天归未到期 / 五档边界逐格 / 汇总恒等式（issue #7370 段 2）"
    domains:
      - misc
      - backend
    tier: normal
    tags: [backend-contract, receivable, aging, red-proof]
    truths_ref: []
    user_inputs:
      - "用户（2026-10-20，逐字）：「继续推进，直到目标任务都交付」—— 承接 issue #7370 的验收判据「账龄分档边界逐档有判据（到期日当天归未到期）」「余额恒等式」。"
    expectations: []
    data_checks:
      - "**判据 1（到期日当天不算逾期）**：逾期天数 = 今天 − 到期日，`<= 0` 即未到期 ⇒ 客户今天付款仍算及时；昨天下单的现结客户才是逾期 1 天。判据 = `ReceivableAgingTest#dueDateItselfIsNotOverdue`。红证方向：把 `<= 0` 改 `< 0` ⇒ 当场红。"
      - "**判据 2（五档边界逐格）**：0/负数→未到期 · 1→1-30 · 30→1-30 · **31 跳档** · 60 · **61 跳档** · 90 · **91 跳档**；枚举顺序 = 上屏顺序。判据 = `#bucketBoundaries`。"
      - "**判据 3（账期口径）**：到期日 = 下单日 + 账期；账期 `null`/0 ⇒ **现结（到期日 = 下单日）**，不是「永不到期」（后者会让这类客户的应收永不出现在逾期面上）。判据 = `#dueDateFollowsTerms` + `#dueDateItselfIsNotOverdue`。"
      - "**判据 4（应收口径 = 未收款订单）**：以 `paid_at IS NULL` 定性（与授信闸门 `selectOutstandingTotal` 同一真值源），应收 = 货值 − Σ退款。**不**用 `actual_amount IS NULL ⇒ 已收满` 的旧兜底 —— 那会把「没登记的收款」读成「已付清」，欠款静默消失。判据 = `ReceivableAgingRow` javadoc + `#remainingIsNetReceivable`。"
      - "**判据 5（汇总恒等式）**：`totalOutstanding == Σ五档 == Σ客户行`，且逐档笔数正确；已对平/多收的单不进账龄面。判据 = `#summaryKeepsTheIdentity`。"
      - "**判据 6（缺字段不丢钱）**：没留电话的散客单归到具名分组，不因缺字段从应收面消失。判据 = `#rowsWithoutPhoneAreKept`。"
      - "**判据 7（端点契约）**：路由 `GET /api/admin/customers/receivable-aging` 逐字；权限码复用既有 `customer:view`（零授权 delta）；不带 id 不标归属认定。判据 = `ReceivableAgingControllerTest`。"
      - "**边界（照实登记）**：部分收款（一笔钱冲多张单）随段 3「逐笔核销」上线；账龄页面/报表（段 4）与导出未做；黄金策暂无账龄工具（先用页面读面）。"
    precondition: "本用例是 [backend-contract]：前置 = `orders.paid_at`(V160) + `customer_profiles.credit_limit/payment_terms_days`(授信段) + `finance_transactions`。零网络、零 LLM。"
    skip_reason: "[backend-contract] 账龄分档与汇总恒等式，由 Java 单测验证，非 LLM 行为，不进 agent-eval 冒烟"
    merge_log: "2026-10-20 新增（issue #7370 段 2）。落码 = 纯函数 `ReceivableAging`（到期日/逾期天数/五档/余额/汇总）+ `OrderMapper.selectReceivableRows`（未收款单调，上限 2000）+ `CustomerService.receivableAging` + `GET /api/admin/customers/receivable-aging`（customer:view）。"
    traces:
      tests:
        - "backend/admin-api/src/test/java/com/migao/admin/service/ReceivableAgingTest.java"
        - "backend/admin-api/src/test/java/com/migao/admin/controller/ReceivableAgingControllerTest.java"
      ci:
        - pr-check.yml
      verifies: []

  - id: AR-002
    legacy_id: ""
    title: "客户收款核销：一笔收款冲多张订单 / 收款侧与订单侧双上限 / 同批逐行余量（issue #7370 段 3）"
    domains:
      - misc
      - backend
    tier: normal
    tags: [backend-contract, receivable, allocation, red-proof]
    truths_ref: []
    user_inputs:
      - "用户（2026-10-20，逐字）：「继续推进，不要停止」—— 承接 issue #7370 的验收判据「收款核销：收款流水可指定订单」。"
    expectations: []
    data_checks:
      - "**判据 1（收款侧上限）**：同一流水的 Σ核销 ≤ 流水金额；已核销 900 / 流水 1000 ⇒ 最多再冲 100，101 拒且报出「超出 1」。判据 = `ReceiptAllocationPolicyTest#receiptSideCapWinsWhenReceiptIsSmaller`。"
      - "**判据 2（订单侧上限）**：某单的 Σ核销 ≤ 货值 − 退款；货值 600 / 退 100 / 已核销 400 ⇒ 最多再冲 100（流水的 10000 不作数）。判据 = `#orderSideCapWinsWhenOrderIsSmaller`。红证方向：只取收款侧剩余 ⇒ 当场红。"
      - "**判据 3（取小 + 归零）**：可核销 = min(两侧剩余)；两侧任一为负（存量脏数据）一律归 0，不让页面 500。判据 = `#negativeCapacityIsClampedToZero` + `#fullyRefundedOrderHasNothingToAllocate`。"
      - "**判据 4（0/负数/空值一律拒）**：不产生「冲了一点点」的空行；但「申请 0」时仍要如实给出可核销上限（前端要能显示「这单还能冲多少」）。判据 = `#zeroAndNegativeAreRejected`。"
      - "**判据 5（批量逐行余量）**：一次提交多行时，第二行必须在「含第一行」的余量上判；两行各 600 对流水 1000 ⇒ 第二行拒。判据 = `ReceiptAllocationServiceTest#batchLinesShareTheReceiptCapacity`。"
      - "**判据 6（只有收入且成功的流水能核销）**：退款/失败流水一律拒（现金真值源是 finance_transactions，核销只是去向）。判据 = `#onlySuccessfulIncomeReceiptsCanBeAllocated`。"
      - "**判据 7（同客户 / 取消单 / 同批重复）**：冲到别人单上拒；已取消订单拒；同一张单在同一批出现两次直接拒（否则合计绕过单张单上限）。判据 = `#cannotAllocateToAnotherCustomersOrder` / `#cancelledOrderCannotBeAllocated` / `#duplicateOrderInOneBatchIsRejected`。"
      - "**判据 8（金额准入与落库精度）**：超两位小数直接拒（issue #6221）；落库金额一律两位小数（列 NUMERIC(16,4)，值不许带第三位）。判据 = `#overPrecisionAmountIsRejected` / `#writesAmountThroughSingleSetter` + `MoneyEntryPrecisionMetaGuardTest` 的台账条目。"
      - "**判据 9（端点契约）**：写 `POST /api/admin/finance/receipts/{id}/allocations` 用既有 `finance:create`，读面继承类级 `finance:view`；写端点标归属认定 `receiptTransaction`（注册在 TenantResourceOwnership）。判据 = `ReceiptAllocationControllerTest` + `TenantOwnedWriteEndpointGuardTest`。"
      - "**判据 10（账龄口径升级）**：应收余额改为 `货值 − 退款 − Σ核销`（段 2 的 `ReceivableAgingRow` javadoc 已写明这是段 3 的收口点）。判据 = `ReceivableAgingTest` 全绿 + `OrderMapper.selectReceivableRows` 的 SQL 子查询。"
      - "**边界（照实登记）**：核销的**撤回**（软删明细）尚无端点；账期利息/多币种/发票不在范围；账龄页面与报表中心（P1-4）未做；黄金策暂无核销工具。"
    precondition: "本用例是 [backend-contract]：前置 = `finance_transactions`（现金真值）+ `receipt_allocations`（V176）。零网络、零 LLM。"
    skip_reason: "[backend-contract] 核销上限算法与服务接线，由 Java 单测验证，非 LLM 行为，不进 agent-eval 冒烟"
    merge_log: "2026-10-20 新增（issue #7370 段 3）。落码 = 纯函数 `ReceiptAllocationPolicy` + `ReceiptAllocationService`（批量逐行余量）+ `ReceiptAllocation`/`ReceiptAllocationMapper` + `POST|GET /api/admin/finance/receipts/{id}/allocations` + V176 + 账龄 SQL 减核销。"
    traces:
      tests:
        - "backend/admin-api/src/test/java/com/migao/admin/service/ReceiptAllocationPolicyTest.java"
        - "backend/admin-api/src/test/java/com/migao/admin/service/ReceiptAllocationServiceTest.java"
        - "backend/admin-api/src/test/java/com/migao/admin/controller/ReceiptAllocationControllerTest.java"
        - "backend/admin-api/src/test/java/com/migao/admin/mapper/ReceiptAllocationMapperTest.java"
      ci:
        - pr-check.yml
      verifies: []

  - id: AR-003
    legacy_id: ""
    title: "订单毛利：收入−退款−面料−加工，且**成本未知绝不当 0**（issue #7371 段 1+2）"
    domains:
      - misc
      - backend
    tier: normal
    tags: [backend-contract, margin, cost, red-proof]
    truths_ref: []
    user_inputs:
      - "用户（2026-10-20，逐字）：「继续推进，不要停止」—— 承接 issue #7371 的验收判据「成本未知 ⇒ 显示「成本未知」，绝不填 0（负向对照：缺进价时毛利不得显示为收入全额）」。"
    expectations: []
    data_checks:
      - "**判据 1（未知 ≠ 0）**：有扣料行缺批次进价（`stock_batches.unit_cost IS NULL`）⇒ `fabricCost`/`grossMargin`/`marginRate` **全部 null**、`costKnown=false`；负向对照 = 绝不出现「毛利 = 收入全额」。判据 = `OrderMarginTest#unknownCostIsNeverZero` + `OrderMarginServiceTest#unknownCostIsNullNotZero`。红证方向：把未知当 0 ⇒ 当场红。"
      - "**判据 2（真 0 是已知）**：没有任何扣料行（还没领料）⇒ 面料成本 **真 0**、毛利 = 收入 − 退款（不是「未知」）。两者不许混。判据 = `#zeroCostIsKnown` + `#noConsumptionIsRealZero`。"
      - "**判据 3（算式）**：毛利 = 收入 − 已退款 − 面料成本；毛利率 = 毛利 ÷ **净收入**（收入 − 退款），四位小数。判据 = `#plainMargin`。"
      - "**判据 4（亏本单不截断）**：成本 > 净收入 ⇒ 毛利为负、毛利率为负（不许截断成 0）。判据 = `#negativeMarginIsKept`。"
      - "**判据 5（净收入 ≤ 0）**：退满/退超 ⇒ 毛利率 null（不做 0 除、不给负无穷），毛利照实给。判据 = `#rateIsNullWhenNetRevenueIsNotPositive`。"
      - "**判据 6（脏值不 500）**：收入/退款 null、SQL 返回 null 一律当 0 处理，不 NPE。判据 = `#nullsAreTolerated` + `OrderMarginServiceTest#nullRowIsTreatedAsNoConsumption`。"
      - "**判据 7（口径自述）**：`scope = revenue_minus_refund_minus_fabric_minus_labor` —— 段 2 起含**加工成本**；运费**系统未采集** ⇒ `freightCaptured=false`（数据缺口，不是 0 运费），不许被读成完全成本毛利。判据 = `#scopeIsSelfDescribing` + `OrderMarginServiceTest#knownCostProducesMargin`。"
      - "**判据 7b（加工成本复用单一聚合）**：加工成本 = `ProductionService.piecework(...)` 的 `total` —— 与计件工资/期间报表**同一份聚合**（不新造第二套口径）。判据 = `OrderMarginServiceTest#knownCostProducesMargin`（150 计入）。"
      - "**判据 7c（未定价报工 ⇒ 加工未知）**：有未定价报工（issue #4696 口径：未定价不进金额但必须能被数出来）⇒ `laborCost` 与 `grossMargin` 都 null、`unpricedLaborLines > 0`。判据 = `OrderMarginTest#unpricedLaborMakesCostUnknown` + `OrderMarginServiceTest#unpricedLaborMakesMarginUnknown`。"
      - "**判据 8（取数口径）**：面料成本取自 `stock_batch_consumptions`（`reason='processing_order' ∧ deleted=0`，按 `order_no` 归属）× 该行 `unit_cost`（V119 起的**当时**快照）；退款取 `finance_transactions`（`refund ∧ success`）。判据 = `OrderMapper.selectFabricCost` 的 SQL + 上述用例。"
      - "**判据 9（端点契约）**：`GET /api/admin/finance/orders/{orderId}/margin` 逐字，继承类级 `finance:view`；只有订单 id 一个入参（毛利算出来的，不接受客户端传金额）。判据 = `OrderMarginControllerTest`。"
      - "**边界（照实登记）**：**运费未采集**（系统没有运费字段 —— 是数据缺口，不是 0）；退货的成本侧冲减（退回来的货回库）未做；批次级成本、标准成本/移动加权不在范围；订单/商品/客户三视图与报表中心（P1-4）未做；黄金策暂无毛利工具。"
    precondition: "本用例是 [backend-contract]：前置 = `stock_batches.unit_cost` + `stock_batch_consumptions.unit_cost`（V119 快照）+ `finance_transactions`。零网络、零 LLM、无迁移（纯读面）。"
    skip_reason: "[backend-contract] 毛利算式与「未知当 0」禁令，由 Java 单测验证，非 LLM 行为，不进 agent-eval 冒烟"
    merge_log: "2026-10-21 新增（issue #7371 段 1），同日段 2 扩写（加工成本 + 运费未采集标记）。落码 = 纯函数 `OrderMargin` + `OrderMarginService`（复用 `ProductionService.piecework` 的计件聚合）+ `OrderMapper.selectFabricCost` + `GET /api/admin/finance/orders/{id}/margin`。"
    traces:
      tests:
        - "backend/admin-api/src/test/java/com/migao/admin/service/OrderMarginTest.java"
        - "backend/admin-api/src/test/java/com/migao/admin/service/OrderMarginServiceTest.java"
        - "backend/admin-api/src/test/java/com/migao/admin/controller/OrderMarginControllerTest.java"
      ci:
        - pr-check.yml
      verifies: []

  - id: AR-004
    legacy_id: ""
    title: "数据范围 data scope：角色两态（tenant/self）+ 多角色取宽 + 越权=不存在（issue #7372 段 1）"
    domains:
      - misc
      - backend
    tier: normal
    tags: [backend-contract, rbac, data-scope, red-proof]
    truths_ref: []
    user_inputs:
      - "用户（2026-10-20，逐字）：「继续推进，不要停止」—— 承接 issue #7372 的验收判据「越权对象返回空集而非 403（不泄露存在性）」「判据必须覆盖新增一个查询面时默认继承范围（元守卫）」。"
    expectations: []
    data_checks:
      - "**判据 1（两态 + 默认零回归）**：`roles.data_scope` ∈ {`tenant`（默认，全租户）, `self`（只看本人创建）}；存量角色都是默认值 ⇒ 行为与改前逐字一致。判据 = `DataScopeTest#scopeCodesAreStable` + V177 的 `ck_roles_data_scope`。"
      - "**判据 2（多角色取宽）**：权限取并集 ⇒ 数据范围也取**最宽**：只要有一个 `tenant`，该用户就是 `tenant`；只有全部 `self` 才收窄。反向陷阱：多给一个只读角色**不许**缩小可见面。判据 = `#anyTenantRoleWins`。红证方向：改成取窄 ⇒ 当场红。"
      - "**判据 3（配置缺失/拼错的分界）**：`null`（没写进来）⇒ 按默认 `tenant`；**拼错的取值**（如 `department`）⇒ 按最窄 `self`（fail-closed：宁可少给数据，不可因拼写错误放开全公司）。判据 = `#missingConfigFallsBackToTenant` + `#unknownValueNarrowsToSelf`。"
      - "**判据 4（越权 = 不存在）**：`self` 范围下详情读面返回与「不存在」**同一个 404**，绝不 403 —— 403 等于告诉调用方「这个 id 存在」。判据 = `#outOfScopeIsIndistinguishableFromMissing` + `OrderService.getOrderById(id, owner)` 的同一条 notFound。"
      - "**判据 5（列表与详情同一口径）**：列表按 `created_by = 当前用户` 收窄（`DataScope.ownerFilter` 产出过滤值），详情按同一条判定放行；控制器**不自己比较** `created_by`（单一出口）。判据 = `OrderDataScopeGuardTest`。"
      - "**判据 6（元守卫：新查询面默认继承）**：订单域「按 id 读单张」的方法必须存在带 `dataScopeOwnerId` 的重载；列表方法的**最后一个参数**必须是范围 owner —— 新增读面若绕开范围就红。判据 = `OrderDataScopeGuardTest#detailHasScopedOverload` + `#listTakesScopeOwnerAsLastParameter`。"
      - "**判据 7（客户域：负责人字段 + 未指派兜底）**：`customer_profiles.owner_user_id`（V178）是客户域归属真值载体；`self` 范围可见 = 自己是负责人，**或**未指派且自己有该客户（按 `phone` 关联）的单。判据 = `CustomerDataScopeTest`。"
      - "**判据 8（指派优先于兜底）**：已指派给别人 ⇒ 不可见，**哪怕我出过单**（指派是明确业务决定，不能被「出过单」覆盖，否则客户永远抢不回来），且不再白查订单。判据 = `#assignedToOtherWinsOverMyOrders`。"
      - "**判据 8b（负责人有唯一写入点）**：`PUT /api/admin/customers/{id}/owner`（`customer:create`）是指派/撤回的唯一写点；不传/传空 = 撤回（回到未指派，重新走兜底）。没有写点时 `owner_user_id` 恒 NULL ⇒「把客户分给某人」在系统里不存在。判据 = `CustomerProfileFieldTruthGateTest`（声明↔源码写入点↔遮蔽清单三方一致）。"
      - "**判据 9（客户域越权=不存在 + 键名对账）**：详情范围外返回与「不存在」同一个 404；新增字段必须进 `CustomerProfileFieldTruth`（键名对账类级判据，`#5459`）否则当场红。判据 = `CustomerDataScopeTest` + `CustomerProfileWireKeyParityTest`。"
      - "**边界（照实登记）**：**门店 / 部门 / 指定人员**三个维度本段不做（门店与部门在仓里没有实体 = 另一张需要人裁定的组织模型；指定人员是第三态需要关联表）⇒ 后续段；**导出面**、**黄金策工具查询**尚未接入（agent 走服务令牌、无最终用户身份 ⇒ 需要身份透传设计，属需裁定项）；客户「负责人」的指派 UI 未做（列已就位，指派人靠接口/后续段）。"
    precondition: "本用例是 [backend-contract]：前置 = `roles.data_scope`（V177）+ 订单表的 `created_by`（V142）。零网络、零 LLM。"
    skip_reason: "[backend-contract] 数据范围解析与越权语义，由 Java 单测验证，非 LLM 行为，不进 agent-eval 冒烟"
    merge_log: "2026-10-21 新增（issue #7372 段 1）。落码 = 纯函数 `DataScope` + `RoleService.resolveDataScope`（复用 getUserRoles）+ `Role.dataScope` + `OrderService.getOrderPage/getOrderById` 接范围 + `OrderController` 两处读面接线 + V177 + 元守卫。"
    traces:
      tests:
        - "backend/admin-api/src/test/java/com/migao/admin/security/DataScopeTest.java"
        - "backend/admin-api/src/test/java/com/migao/admin/controller/OrderDataScopeGuardTest.java"
      ci:
        - pr-check.yml
      verifies: []

  - id: PRC-001
    legacy_id: ""
    title: "价格解析：协议价 > 等级价 > 阶梯价 > 标准价，且**未定价绝不给 0**（issue #7375 段 1）"
    domains:
      - misc
      - backend
    tier: normal
    tags: [backend-contract, pricing, red-proof]
    truths_ref: []
    user_inputs:
      - "用户（2026-10-21，选定优先推进 P1-3）：承接 issue #7375 的验收判据「同一 SKU 对三个客户等级分别命中正确价格」「价格缺失时不得静默取 0（未定价 ≠ ¥0.00）」。"
    expectations: []
    data_checks:
      - "**判据 1（优先级）**：同一 SKU 同时存在协议价 / 等级价 / 阶梯价 / 标准价时，按 **协议 > 等级 > 阶梯 > 标准** 命中。判据 = `PriceResolutionTest#protocolBeatsEverything` + `#fallsBackThroughLayersInOrder`。红证方向：改成标准价优先 ⇒ 当场红。"
      - "**判据 2（逐格）**：三个客户等级（vip1/vip2/vip3）各自命中自己的等级价；没有该等级专属价 ⇒ 落到阶梯/标准价。判据 = `PriceServiceTest#vipLevelPriceUsedWhenNoProtocol`（按 `customer_profiles.vip_level` 取数，不按客户 id）。"
      - "**判据 3（阶梯闭区间）**：区间 `[min, max]` 闭区间；`max IS NULL` = 无上限；多档重叠取**门槛更高**的那档（高价优先拦住「按便宜的档收」）。判据 = `#tierBoundariesAreInclusive`。"
      - "**判据 4（🔴 未定价 ≠ 0）**：四层都没有价 ⇒ `source = unpriced`、`price = null`；SKU 标准价 `DEFAULT 0` **不算有价**（0 元 = 白送）。判据 = `#unpricedIsNeverZero` + `#zeroStandardPriceIsNotAPrice` + `PriceServiceTest#zeroStandardPriceIsUnpriced`。"
      - "**判据 5（脏配置不崩）**：协议价/等级价/阶梯价为负或 0 一律跳过；数量为 null ⇒ 阶梯不参与（区间无法判定）。判据 = `#dirtyConfigFallsThrough`。"
      - "**判据 6（端点契约）**：`GET /api/admin/pricing/quote?customerId=&skuId=&quantity=`；只读码 = 类级 `order:list`（既有读码，不新造码）；入参**只有**客户 + SKU + 数量 —— 价格不接受客户端传值（段 2「服务端为准」的前提）。判据 = `PricingControllerTest`。⚠️ **2026-10-22 归正**：原文写「沿用既有 `order:view`」是错的 —— 权限目录里**没有** `order:view`（两处种子目录都没有）⇒ 报价/价格本端点对所有人恒 403；类级尺度兜底见 `test_admin_role_read_surface_guard.py` 判据 4b。"
      - "**判据 7（金额与自述）**：`amount = 单价 × 数量`（两位小数）；单价或数量缺失 ⇒ `amount = null`（不是 0）；`source` 自述命中层级（改价争议的第一份证据）。判据 = `PricingController.quote` + `PriceQuoteView` 契约。"
      - "**边界（照实登记）**：**下单侧「服务端为准 + 客户端传价差异留痕」尚未接线**（段 2）；改价审批（P1-2）未接；促销/优惠券/满减/客户分组价/币种不在范围；价格本**管理端点**（录入协议价/等级价/阶梯价）未做（表与解析已就位）。"
    precondition: "本用例是 [backend-contract]：前置 = 三张价格本（V179）+ `product_skus.price` + `customer_profiles.vip_level`。零网络、零 LLM。"
    skip_reason: "[backend-contract] 价格解析优先级与「未定价≠0」，由 Java 单测验证，非 LLM 行为，不进 agent-eval 冒烟"
