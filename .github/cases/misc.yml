    merge_log: "2026-10-16 新增（issue #7029；同族 MC-107 / #7015、MC-105 / #6951、#6746 / #6611、#6750）。取号 = `python3 scripts/next_case_id.py MC` 现取 **MC-108**；claim = `.github/cases/claims/7031-MC-108.json`。**为什么单独立 case**：MC-107 固化的是「**环境变量**命名空间里编造的名字必须判红」，而 #7016 用「**同样不存在**的 context 属性」从旁边走进来了 ⇒ 那是**另一个命名空间**，两条判据互不替代。**真机读数（2026-10-16 13:55 +08，本仓，非推断）**：`deploy-admin-api` run `38856179423`（workflow_dispatch，head `250db08` = #7016 合并提交）build-and-deploy **failure**，逐字 `RUN_STARTED_AT:`（env 值为**空**）、渲染正文 `… 它必须来自 context` 后跟反引号对只剩一个裸反引号、`/home/runner/work/_temp/<uuid>.sh: line 9: unexpected EOF while looking for matching` ⇒ `Process completed with exit code 2`。**两个独立缺陷**：① `github.run_started_at` **不是**合法属性（官方表 40 个里没有；复算：`curl -s https://raw.githubusercontent.com/github/docs/main/content/actions/reference/workflows-and-actions/contexts.md | sed -n '/##  github context/,/^## /p'`）⇒ 解出空串（不报错、不告警）⇒ 即使语法修好、CI 全绿、部署成功，`builtAt` **仍然会是空串**（典型「看上去修好了」）；② 判据的面被**自己的报错文案**毁掉（裸反引号 ⇒ parse 阶段 exit 2）⇒ 那次红**不是**判据在说「取值源没接」，归因会被指向错的对象。**修法**：① 两条腿（`deploy-admin-api.yml` + `deploy-frontend.yml`，同形同因）取值源换成 **runner 时钟** `BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)`（本仓 `close-linked-issues.yml` / `verify-trigger.yml` 已有同款用法），**删掉 step 级 `env:`**，报错文案去掉裸反引号与 `${{ }}`，并补 **ISO8601 形态**自检（`admin-web` 的 Dockerfile 逐字写着「调用方在 workflow 里已 fail-closed 校验过形态」，当时**并没有**校验）；② 新增本 case 的两条类级判据（替换后必须是合法 bash + 属性名白名单）+ 各自注入式自证。**判别力实测（现取，全仓 20 个 workflow / 150 个表达式）**：空替换臂在**改前树**命中 **2** 处（正是两条腿的解算步），修后 **0**；哨兵臂 **0/0**；白名单臂在改前树命中 `github.run_started_at` **2** 处，修后 **0**。**修后绿**：`python3 -m pytest tests/unit_ci_workflows/test_workflow_run_body_is_valid_bash_after_substitution.py -q -p no:randomly` = **6 passed**；两条腿的三个替换臂 `bash -n` 全 rc=0。**红证（注入式）**：见本 case 的判据 A/B 两条自证 + 取值源注入（改回 `env: RUN_STARTED_AT: ${{ github.run_started_at }}` 或 `BUILT_AT=${GITHUB_RUN_STARTED_AT:-}` ⇒ 既有判据族判红，复位后绿）。**阻塞面**：`Skip if already built` 判「main HEAD 的镜像在不在」⇒ 镜像不存在就会一直重进解算步 ⇒ **修好之前没有任何新部署能成功**（永久死锁，不会自愈）；修复**合入 main 后下一轮 schedule（:04/:24/:44）即自动解开**（解算步读的就是 main 里的 workflow 本体）。**端到端终判**：合入后 `curl -s https://api.migaozn.com/api/version` 的 `builtAt` 必须**非空原文**（本条由主会话/人类在一次真实部署后复探）。"
