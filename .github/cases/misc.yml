      - "🔴 **注入式红证（两条单变量，实测逐字节还原）**：① 只从 `label-needs-changes` 段删掉 `ui-regression-check` ⇒ **2 failed**（判据 A + 自证）；② 两段都删掉 `case-trust-gate` ⇒ **2 failed**。还原后 **2 passed**，`git diff --stat` 只剩预期的 +18 行。"
      - "📌 **真机读数（改前）**：两个收尾 job 的 `needs` 各 **9** 条，而它们所在的 `pr-check.yml` 里承接 required 检查的 job 有 **11** 个 ⇒ 缺 **4** 个：`case-coverage-gate` / `case-trust-gate` / `llm-sink-ledger` / `ui-regression-check`。改后各 **13** 条（9 + 4）。"
      - "📌 **本单共三条独立成因，本条 = 第二条**：① `grep -c` 配 `|| echo \"0\"` 捕获成两行；**② 本条的 `needs:` 缺口**；③ 该 job **没有 checkout** ⇒ `gh` 连仓库都推断不出来（`GH_REPO`）—— **少修一条都治不好**这个症状。**为什么本条与 `grep -c` 那条是独立成因**：`grep -c` 那条让「摘标签的判据崩了」（永不摘）；本条的 `needs:` 缺口让「摘/打标签的**依赖面**少一半」（该挂的挂不住、该摘的照摘）。**只修一条治不好症状** ⇒ 同单一起收。该缺口**早已登记**在 `docs/wiki/gate-exemption-ledger.md` §1 第 6 行（当时那单禁止改 workflows ⇒ 只登记未修）。"
      - "📌 **安全性前提（改前已核）**：这两个 job **不在**分支保护的 required 名单里（16 项 required 里无它们）⇒ 扩 `needs:` **不会**新增死锁；且那 4 个目标 job 的 `if` 都是无路径过滤的 `github.event_name == 'pull_request'` ⇒ 能形成 `needs` 汇合。另：`needs:` 只影响「等不等」，**不**影响「上游红了下游还跑不跑」（那是 `if: always()` 的职责，两个 job 都已正确带 `always()`，由 `test_gate_coverage_and_same_source.py` 的另一条判据把守）。"
    skip_reason: "[backend-contract] 纯 CI 判据面（读 branch protection + 解析 workflow YAML），零 LLM、不碰真实云，不进 agent-eval 冒烟"
    merge_log: "2026-10-16 新增（issue #7022）。**发现路径**：修本单第一条成因（`grep -c` 配 `|| echo \"0\"`）时，顺着 `docs/wiki/gate-exemption-ledger.md` §1 第 6 行读到**同一症状的第二条独立成因**已登记（当时那单禁止改 workflows ⇒ 只登记未修），当场核实：两个收尾 job 的 `needs` 各 9 条、缺 4 个 required 门禁。归因确认后**同单一起收**（只修一条治不好症状）。取号 `MC-110`（复核 `origin/main` 空闲、当期零 open PR）。守卫**不硬编码那 4 个 job 名**，而是**现取** branch protection 的 required 名单比对 ⇒ 以后新增 required 门禁而忘了加进 `needs:` 时，本判据照样会红。"
    traces:
      tests:
        - "tests/unit_ci_workflows/test_needs_changes_tail_job_coverage.py"
      ci:
        - pr-check.yml
      verifies: []
  - id: MC-111
    legacy_id: ""
    title: "取号工具对**未知前缀**必须出声（不得静默新建号段）：请求的前缀在候选集里 0 次出现 ⇒ 明说「这是**全新号段**」 + 点名**最接近的已知前缀**；已知前缀不得误报（issue #7052）"
    domains:
      - misc
      - ci
    tier: normal
    tags:
      - ci
      - case-id
      - allocator
      - usability
      - fail-loud
      - red-proof
    truths_ref: []
    precondition: "前置 = 两样都在仓里可读且**可判定**：① 工具本体 `scripts/next_case_id.py`（含 `warn_unknown_prefix` 纯函数与 `UNKNOWN_PREFIX_MARKER` 措辞锚）；② 判据本体 `tests/unit_ci_workflows/test_next_case_id_allocator.py`（含 `NCI_GH_BIN` 🔴 替身与 `NCI_MAIN_REF=HEAD` —— **刻意不读 `origin/main`**，因 CI 的 checkout 是 `fetch-depth: 1`）。**前置不成立时不许读成通过**：`gh` 替身不可用 ⇒ 工具按既有三态语义 `exit 3`（判据 3 把守）；告警被删 ⇒ 判据 8 判红。"
    user_inputs:
      - "我把语料文件名当初前缀敲进去了，工具却给了我一个号 —— 我怎么会知道敲错了？"
    expectations:
      - tool: direct_reply
    data_checks:
      - "🔴 **判据 8（实例面，会红）**：请求的前缀**一次都没出现**在候选集里（main ∪ 全部 open PR ∪ 本工作区）⇒ 输出必须**明说**「本工具将把它当作**全新号段**」**并点名最接近的已知前缀**（`difflib`）。执行点 = tests/unit_ci_workflows/test_next_case_id_allocator.py::test_unknown_prefix_is_never_silent。**红证（实跑）**：把 `warn_unknown_prefix` 的提前返回改成**恒返回空** ⇒ 该条当场红（1 failed / 19 passed），已逐字节还原。"
      - "🔴 **反面对照臂**：**已知**前缀（`MC`）不得被误报成「全新号段」⇒ 否则判据在乱咬。执行点 = 同文件 `test_unknown_prefix_is_never_silent` 的后半。"
      - "🔴 **判别力自证（纯函数）**：`unknown_prefix_warnings()` 在「已知 / 未知且有近似 / 未知且无近似」三态上分别给「空 / 出声+近似 / 出声+不编造近似」。执行点 = 同文件::test_unknown_prefix_criterion_has_discriminating_power。"
      - "📌 **真实误用现场（逐字，2026-10-16）**：我敲的是 `python3 scripts/next_case_id.py misc`，而该位置参数是**前缀**、不是**语料文件名**（`misc.yml` 里的前缀是 `MC`）⇒ 工具按前缀口径把 `misc` 大写成 `MISC`，**静默**给出 `MISC-001`（零警告）—— 看起来像个成功答案。⇒ issue #7052 的**原始归因\"工具把人引向错号段\"不成立，已在该单评论里更正**；残留的真实缺陷是「未知前缀静默新建号段」。"
      - "📌 **为什么只出声、不拦**（照实登记的边界）：① 新前缀**合法** —— 既有用例 `test_cli_consults_the_inflight_face` 正是靠「全新前缀 `QX` 仍能被分配」来证明在飞面被读进去，拦它会破该用例；② 「文件名 vs 前缀」**不可判定** —— `API` / `HR` / `UI` 三个串**同时**是语料文件名与真实前缀（现取 26 个 stem ∩ 27 个前缀 = 3）⇒ 拦会误伤。⇒ 出声 + 给近似候选，让打错的人**当场自查**。"
      - "📌 **近似候选的有效性（现取复算）**：26 个语料 stem 里 21 个形态不合法（≥5 字符，已被 `PREFIX_RE` 挡），余 5 个中 `API`/`HR`/`UI` 本就是真前缀，只有 `AUTH`/`CHAT`/`DATA`/`MISC` 四个会走到本告警，且四个都有近似项（`AUTH→UT`、`CHAT→CT`、`DATA→DA`、`MISC→MC`）。"
      - "📌 **`known` 必须取合并集（实现要点，写错就会误报）**：告警要在**过滤 `occupied` 之前**算 —— 只看 main 会把「某个在飞 PR / 本工作区刚引进的新前缀」误报成「一次都没出现」。"
    skip_reason: "[backend-contract] 纯只读取号工具的静态判据（源码只读性 + 纯函数分配语义 + 未知前缀告警），零网络、零时钟、非 LLM 行为，不进入 agent-eval 冒烟"
    merge_log: "2026-10-16 新增（issue #7052）。**发现路径** = PR #7037（issue #7022）取号时我**误把语料文件名当成了前缀参数**（`next_case_id.py misc`），观察到工具静默给出 `MISC-001`。归因时先写错了一次（以为工具\"把人引向错号段\"），**已在该单评论里逐字更正**：用对参数时工具是对的（`MC → MC-111`），残留的真实缺陷是「未知前缀静默新建号段」。取号 = `NCI_MAIN_REF=HEAD python3 scripts/next_case_id.py MC` ⇒ `MC → main:001-110 → 取 MC-111`，并已在飞面复核（当期 open PR 无人含 `MC-111`）。本判据**不拦**新前缀（只出声），理由与边界见 data_checks 第 5 条。"
    traces:
      tests:
        - "tests/unit_ci_workflows/test_next_case_id_allocator.py"
      ci:
        - pr-check.yml
      verifies: []
  - id: MC-112
    legacy_id: ""
    title: "**「job 里调用 `gh` 却没有 git 上下文」的类级判据**：凡 `run:` 里调用 `gh` 的 job 必须有 `actions/checkout` 或 `GH_REPO`（同一形态已咬三次：#2929 automerge → #7022 两个收尾 job）；注释里的 `gh` 不算调用"
    domains:
      - misc
      - ci
    tier: normal
    tags:
      - ci
      - workflow
      - gh-context
      - checkout
      - fail-loud
      - red-proof
    truths_ref: []
    precondition: "前置 = 两样都在仓里可读：① `.github/workflows/**`（现取 41 个文件，语料下限 ≥20）；② 判据本体 tests/unit_ci_workflows/test_workflow_gh_needs_git_context.py。**前置不成立时不许读成通过**：目录不存在 / 文件数低于下限 ⇒ `scan_workflows` **抛**（fail-closed）；某文件没有 `jobs` 键 ⇒ 同样抛；`gh` 命中面低于下限（≥10）⇒ test_guard_is_not_vacuous 判红。"
    user_inputs:
      - "为什么有的 job 里 gh 命令明明写了、却什么都没干？"
    expectations:
      - tool: direct_reply
    data_checks:
      - "🔴 **复用共享尺子、不造第二把（本单自己的返工，照实登记）**：本判据需要「剥注释后匹配」，而仓里有**三条**判据盯着「别再造一把剥注释的尺子」—— `test_guard_parsing_is_comment_aware.py`（未登记的朴素 `#` 截断 ⇒ 红；台账**只许缩短**、不许靠加条目吸收新债）、`test_automerge_bot_safe_path.py::test_only_one_strip_comment_implementation_in_the_repo`（整仓同符号只有一处）、以及它的**前缀族对照臂**。**我第一版自造了一个复数版剥注释函数 + 朴素 `#` 截断，这三条当场把我判红** ⇒ 改为 `from danger_scan import strip_comment`（`.github/danger_scan.py` 是**全仓唯一实现**，按 YAML/shell 真实规则跳过引号内的 `#`），并以「逐行涂白」保持行结构。**教训 = 先理解再爬梯：仓里已有那把尺子，造第二把只会让两条判定漂移。**"
      - "🔴 **判据 A（实例面，会红）**：全仓（41 个 workflow）凡 `run:` 里**调用 `gh`**（`gh` 作为命令词：行首 / 管道后 / `;`/`&&` / `$(` 之后）的 job，必须有 `actions/checkout` step，**或**该 job / 该 step 的 `env` 有 `GH_REPO`。现取命中 **17 个** job。执行点 = tests/unit_ci_workflows/test_workflow_gh_needs_git_context.py::test_every_gh_calling_job_has_git_context。"
      - "🔴 **红证①（#2929 原现场，实跑）**：摘掉 `.github/workflows/automerge.yml::enable-auto-merge` 的 `Checkout` **并**摘掉该 step 的 `GH_REPO` ⇒ 判据当场红（1 failed / 2 passed），已逐字节还原。**⚠️ 只摘 `Checkout` 不会红** —— 该 step 自带 `GH_REPO`（#2929 当时的双保险）⇒ 这正是判据「二者其一即可」的口径，**不是漏检**。"
      - "🔴 **红证②（#7022 原现场，实跑）**：摘掉 `.github/workflows/pr-check.yml::clear-needs-changes` 的 `GH_REPO`（该 job 无 checkout）⇒ 判据当场红，已逐字节还原。"
      - "🔴 **反空跑 + fail-closed**：workflow 语料下限（≥20，现取 41）+ `gh` 命中面下限（≥10，现取 17）+ 目录不存在 ⇒ `scan_workflows` **抛**（不许把「没东西可判」读成绿）。执行点 = test_guard_is_not_vacuous。"
      - "🔴 **判别力自证（纯函数）**：缺上下文 ⇒ 报出；`checkout` 一侧合法 / `GH_REPO` 一侧合法 ⇒ 都不报；**注释里的 `gh` 不算调用**（本会话反复踩到的假阳性形态）；`github`/`gherkin` 不是 `gh`；`$(gh …)` / `true | gh …` / `a && gh …` 三种真调用形态都要捉到。执行点 = test_criterion_has_discriminating_power。"
      - "🔴 **必须先剥注释再匹配**：不剥的话本判据自己的说明注释里写一句 `gh pr view …` 就会被当成真调用 ⇒ 假红。定式（#7007 / #7022 同族）：**凡是「扫描源码找形状」的工具，先剥注释再匹配 —— 注释里的例子不是代码。**"
      - "📌 **为什么必须静态拦（#7022 的实证）**：`clear-needs-changes` 原来写 `gh pr view … 2>/dev/null | grep -c … || echo \"0\"` ⇒ `|| echo` 把非零退出码**吞掉** ⇒ 步报 **success**、标签**从不脱落**，而错误被 `2>/dev/null` 藏了 ⇒ **「绿着但没干活」**。⇒ **这个缺陷自己不会变红，它只是让某件事静默不生效**，只能靠静态判据拦。"
      - "📌 **触发时机**：本单（#7051）由 issue #7022 的收尾如实登记为**未固化项**后开单 —— #7022 修掉了那两处，但**没有**把这一类做成判据（当时判断：静态断言「凡 run 里有 gh 的 job 必须有 checkout 或 GH_REPO」是牵动全仓 workflow 的类级规则，不在那个 PR 射程）。本用例即该规则。"
      - "📌 **边界（照实登记，不写成恒真判据）**：① 只证「有 git 上下文」，**不证能访问到目标数据** —— 权限面不在射程（例：`branches/main/protection` 即便有 `GH_REPO` 也可能因内置 token **非 admin** 而失败，#7022 的 `needs:` 判据因此改成冻结快照）；② `GH_REPO` 只认**字面键**，以**变量拼接**方式给出的写法看不见（现取 0 处）；③ 不判「该 job 该不该用 `gh`」（那是设计问题）；④ 本判据**不改**任何门禁的通过条件、**不新增豁免**。"
    skip_reason: "[backend-contract] 全仓 workflow 的静态判据（YAML 解析 + 剥注释后匹配 gh 命令词），零网络、零时钟、非 LLM 行为，不进入 agent-eval 冒烟"
    merge_log: "2026-10-16 新增（issue #7051）。**发现路径** = PR #7037（issue #7022）收尾时如实登记的**未固化项**：该 PR 修掉了「job 没有 checkout ⇒ `gh` 推断不出仓库」的两处现场（automerge.yml 早在 #2929 就修过，pr-check.yml 两个收尾 job 是本单修的），但**没有**把这一类做成判据。取号 = `NCI_MAIN_REF=HEAD python3 scripts/next_case_id.py MC` ⇒ `MC-112`，并已在飞面复核无人取。**红证均在真实语料上实跑**：摘 `automerge.yml` 的 Checkout + 其 step 的 `GH_REPO` ⇒ 红；摘 `pr-check.yml::clear-needs-changes` 的 `GH_REPO` ⇒ 红；两次都逐字节还原。**一处纠错照实登记**：我第一版红证只摘了 `Checkout`、判据**不红**，一度以为漏检 —— 实查该 step 自带 `GH_REPO`（#2929 的双保险）⇒ 判据口径是「二者其一即可」，**判据是对的、我的注入是错的**。"
    traces:
      tests:
        - "tests/unit_ci_workflows/test_workflow_gh_needs_git_context.py"
      ci:
        - pr-check.yml
      verifies: []
  - id: MC-113
    legacy_id: ""
    title: "**「跑需要真实历史的脚本 ⇒ checkout 必须 `fetch-depth: 0`」的类级判据**：凡 workflow 的 job 里跑 `scripts/h5_freshness_guard.py`（登记在 `h5_script_checkout_depth_ledger.json::canonical_scripts`）的，该 job 的 checkout 必须 `fetch-depth: 0`，否则必须在豁免台账里逐字登记（现取 0 条 ⇒ 只许缩短）；未登记 ⇒ 判红并具名 workflow + job"
    domains:
      - misc
      - ci
    tier: normal
    tags:
      - ci
      - workflow
      - fetch-depth
      - shallow-clone
      - false-red
      - red-proof
    truths_ref: []
    precondition: "前置 = 三样都在仓里可读：① `.github/workflows/*.yml`（真文件，用 `yaml.safe_load` 解析后**看结构**，不是 grep 文本 —— 本 workflow 的提示文本里就写着 `h5_freshness_guard.py`，同族 `FM-A11`）；② 台账 tests/unit_ci_workflows/h5_script_checkout_depth_ledger.json（缺 `_` 自述 / 缺顶层键 / `exemptions` 非对象 ⇒ 抛红）；③ 判据本体 tests/unit_ci_workflows/test_h5_freshness_needs_full_history.py。判据**零网络、零 git**（AST 自证只 import json/yaml/ast/copy/pathlib）—— CI 的 `ci workflow helper unit tests` job 本身是 `fetch-depth: 1`，绑 `origin/main` 会因错的原因变绿。"
    user_inputs:
      - "为什么 C 端 H5 那条腿每天都红一次，可线上明明是新的？"
    expectations:
      - tool: direct_reply
    data_checks:
      - "🔴 **判据 A（实例面，会红）**：`.github/workflows/c-end-h5-publish.yml` 的 `publish` job（notify 步跑 `scripts/h5_freshness_guard.py`）的 checkout 必须 `fetch-depth: 0`。红证（实跑）= 摘掉该 `with.fetch-depth` ⇒ 判据红并具名「c-end-h5-publish.yml / publish / 现取 None」。执行点 = tests/unit_ci_workflows/test_h5_freshness_needs_full_history.py::test_c_end_h5_publish_checkout_has_full_history。"
      - "🔴 **判据 B（类级面，让同类进不来）**：全仓 workflow 逐 job 扫「是否跑登记脚本」⇒ 跑而没有 `fetch-depth: 0` 且未登记豁免 ⇒ 判红（红证②：在另一条腿加一个跑该判据的 job 而不给 depth ⇒ 红并具名 `a-new-leg`）。执行点 = test_all_workflows_running_the_guard_have_full_history。"
      - "🔴 **判据 C（台账只许缩短 + fail-closed）**：`exemptions` 现取 **0 条**（`EXEMPTION_CAP_FROZEN = 0`）⇒ 加一条豁免即红（报出条数与上限）；空转的豁免（那条腿不跑该判据）/ 指向已不存在 workflow 的豁免 / 缺 `why` 的豁免 ⇒ 各自判红；把台账清空（`canonical_scripts` 空 / 整份为空对象 / 缺 `_` 自述）⇒ 判红（红证③）。执行点 = test_ledger_shape_is_fail_closed / test_exemption_table_only_shrinks / TestDiscriminatingPower::test_clearing_the_ledger_turns_it_red。"
