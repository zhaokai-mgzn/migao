  # MC-101（issue #6954，P2·★★★·状态写）：入驻审批并发双 approve ⇒ 建出两个租户（不可逆）
  # ==========================================================================
  - id: MC-101
    legacy_id: ""
    title: "**入驻审批并发双 approve ⇒ 租户数恰好 +1、恰好 1 次成功**：CAS 闸必须在副作用之前（issue #6954）"
    domains:
      - misc
      - backend
    tier: edge
    tags:
      - concurrency
      - state-transition
      - cas
      - onboarding
      - backend-contract
      - realdb
      - red-proof
    truths_ref: []
    user_inputs:
      - "同一张 pending 入驻申请单被严格同时审批两次（或 N 次）"
    expectations: []
    data_checks:
      - "**病（根因，`git show origin/main:backend/admin-api/src/main/java/com/migao/admin/service/RegistrationService.java`）**：`#approveApplication` 是 check-then-act **且副作用在判之前** —— 读判 `pending` → **先建租户 + 管理员 + 初始数据** → 最后 `applicationMapper.updateById(application)`（WHERE 仅主键 ⇒ 无谓词）收尾。并发的第二个请求读到同一个 `pending` 并通过判断 ⇒ **两个租户都真的建出来**，后写覆盖前写 ⇒ 一个**无主租户**（不可逆：租户已落库、管理员已建、无人知道该删谁）。`#rejectApplication` 同形态，且与 approve **争同一份审批权**。"
      - "**判据 1（恰好 1 次成功）**：真库并发判据 = backend/admin-api/src/test/java/com/migao/admin/service/TenantApplicationReviewCasRaceRealDbTest.java 的 `concurrentApprovalsCreateExactlyOneTenant`（N=6 线程 + `CountDownLatch` 对齐起跑）。**修后逐字读数**：`各状态码=[200, 409, 409, 409, 409, 409] 成功数=1 失败状态码=[409,409,409,409,409] 租户行=1 管理员行=1 单据终态=approved reviewed_by=ta-6954-reviewer 失败文案=[CONFLICT: 该入驻申请已被审结，当前状态: approved …]`。落败方必须是**显式 4xx**（CAS 落空 409 CONFLICT / 读判 400），不许 5xx。"
      - "**判据 2（租户数恰好 +1，不可逆副作用的独立算式）**：以该企业名建出的 `tenants` 行**恰好 1 行**（改前实测 **6** 行）、该租户下的管理员用户**恰好 1 个**（改前实测 **6** 个）—— 判定用**落库事实**而非响应体。"
      - "**判据 3（终态与赢家一致）**：申请单终态 `approved` 且 `reviewed_by` 落库非空。"
      - "**判据 4（串行正对照·护栏不误杀）**：同文件 `serialApprovalStillSucceeds` —— 无并发时串行 approve 必须成功（谓词非空 ⇒ 正常请求不被 409 误杀）。修后读数 `状态码=200 租户行=1 单据终态=approved`。"
      - "**红证（注入式 · 受控单变量）**：临时把 `TenantApplicationMapper#approveIfPending` / `#rejectIfPending` 的 `AND status = 'pending'` **摘掉**（注入前置自证：对两条 CAS 的 `AND status = 'pending'` 逐字计数由 2 → **0**）⇒ 判据 1/2 当场红，逐字读数 `各状态码=[200,200,200,200,200,200] 成功数=6 租户行=6 管理员行=6`；同时**串行正对照仍绿** ⇒ 红的不是「装置坏了」。撤回注入（复算 `grep -c` 回到 **2**）⇒ 2 passed / 0 failed。"
      - "**为什么不需要窗口探针（与 #6928 的差别）**：窗口在收尾 `updateById` **之前**，而中间跑完整条开租链路（建租户 → 七岗 + 权限目录 → 管理员用户 → 默认商品分类 → 生产种子模板 → 后置条件校验）⇒ 窗口是**毫秒级**且随并发线程数放大 ⇒ `CountDownLatch` 对齐起跑即可稳定命中（本包最省成本的原因）。"
      - "**边界（照实登记）**：① 跑的是**服务层真库并发**而非 HTTP 栈（controller 只是薄转发）；② 装配走裸 MyBatis（`autocommit`）而非 Spring 事务代理 ⇒ 证的是 **CAS 语句本身**的互斥性；③ 审阅人必须是 `users` 里的真行（`reviewed_by` 有外键），夹具自建；④ 探针对象全部自建（企业名前缀 `ta-6954`，随一次性临时集群销毁），不碰任何存量数据。"
    skip_reason: "[backend-contract] 纯后端真库并发判据（真 PG 一次性集群，走 PgCluster.startOrAbort() 收口）：admin-api 单测面，零网络、零 LLM，不进 agent-eval 冒烟"
    merge_log: "2026-10-15 新增（issue #6954，P2·★★★·状态写；族级跟踪单 #6953 的 P2 包）。取号 = main 侧现取 MC-001~100 ⇒ **MC-101**（`python3 scripts/next_case_id.py MC` 现取，全仓 refs 复核 0 命中）。**红→绿（注入式双向对照，真 PG）**：① 摘掉两条 CAS 的 `AND status = 'pending'` ⇒ `成功数=6 租户行=6 管理员行=6`（判据 1/2 红，串行正对照仍绿）；② 修后（CAS 前置 + 判定影响行数）⇒ `成功数=1 租户行=1 管理员行=1 终态=approved`，2 passed / 0 failed。"
    traces:
      tests:
        - "backend/admin-api/src/test/java/com/migao/admin/service/TenantApplicationReviewCasRaceRealDbTest.java"
      ci:
        - pr-check.yml
      verifies: []

