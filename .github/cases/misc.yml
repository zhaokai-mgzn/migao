      - "**判据 2（预设四档算准）**：本月 / 上月 / 近 90 天 / 全部 —— 上月要跨年（1 月的上月是去年 12 月）与闰年 2 月（29 天）都对。判据 = `#区间预设四档的日期都是「当天算出来」的`（注入 today，不靠跑测那天）。"
