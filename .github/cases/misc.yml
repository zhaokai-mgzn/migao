      - "判据 2（台账只许缩短）：存量 40 处 / 13 条按「文件 × 规则」登记，**未登记即红 / 超数即红 / 不再命中即红**（销账）。执行点 = 同类的 ledgerOnlyShrinks（三条注入式红证：未登记、超数、残留）。"
