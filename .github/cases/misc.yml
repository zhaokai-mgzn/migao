    expectations: []
    data_checks:
      - "**判据 1（价格必须 > 0）**：0 元与负数一律拒（0 元成交 = 白送；未定价就不该录）。判据 = `PriceBookServiceTest#priceMustBePositive`。"
      - "**判据 2（阶梯区间合法）**：起订量必须 > 0，上限不得小于起订量。判据 = `#tierRangeMustBeSane`。"
      - "**判据 3（upsert 靠唯一索引）**：协议价 / 等级价 / 阶梯价都走 `ON CONFLICT … DO UPDATE`（同客户同 SKU / 同等级同 SKU / 同 SKU 同门槛只留一条生效价），不靠服务层先查一遍。判据 = `#protocolUpsertUsesConflictClause`。"
      - "**判据 4（软删与类型封闭）**：`kind` 必须是 protocol / vip-level / tier；找不到记录 ⇒ 404 语义（不是静默成功）。判据 = `#removeValidatesKindAndExistence`。"
      - "**判据 5（读面按 SKU）**：读面必须指定 SKU（价格本是按 SKU 维护的），一次给出三层价（缺层 = 没有该层价）。判据 = `#listRequiresSku`。"
      - "**判据 6（零授权 delta）**：读面沿用类级 `order:view`、写面 `product:create`（与商品维护同码，不新造权限码）。判据 = `PricingController`（既有报价端点契约 + 本段新增写面同码）。"
      - "**边界（照实登记）**：**改价审批闸门（低于底价/成本必须审批）未接**（属 P1-3 段 4，要动 `ProductService` 的价格写面）；价格本**页面**未做（接口已就位）；客户分组价 / 币种 / 促销不在范围。"
    precondition: "本用例是 [backend-contract]：前置 = 三张价格本（V179）。零网络、零 LLM。"
    skip_reason: "[backend-contract] 价格本录入校验与 upsert 语义，由 Java 单测验证，非 LLM 行为，不进 agent-eval 冒烟"
    merge_log: "2026-10-21 新增（issue #7375 段 3）。落码 = `PriceBookService`（upsert/读面/软删，冲突条款 + 精度准入）+ `PriceBookView` + `PricingController` 五个新端点。"
