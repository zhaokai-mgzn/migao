  - id: FN-005
    legacy_id: ""
    title: "财务 / 订单日期窗口 = 业务日（+08）整天，不是 UTC 日（issue #6200：北京 00:00–08:00 的数据归错天/月/年）"
    domains:
      - finance
      - api
      - backend
    tier: normal
    persona: ""
    tags:
      - finance
      - time-window
      - admin-api
      - read-surface
    truths_ref:
      - finance.summary
    user_inputs:
      - "用户 2026-10-03 报告（issue #6200）：日期查询窗口按 UTC 日界而不是 +08，北京 00:00–08:00 的数据归到错误的天/月/年"
    expectations:
      - tool: direct_reply
    data_checks:
      - "判据 1·**窗口 = 业务日整天**：`startDate=endDate=2026-10-03` 的两个查询参数必须恰好是 `2026-10-02T16:00Z`（= 北京 10-03 00:00）与 `2026-10-03T16:00Z`（= 北京 10-04 00:00，不含）—— 库列是 `timestamptz`，MyBatis-Plus 参数**惰性绑定** ⇒ 断言前必须先触发 `getSqlSegment()`（否则 `paramNameValuePairs` 恒为空 = 假绿）。执行点 = backend/admin-api/src/test/java/com/migao/admin/time/BusinessDayWindowTest.java 的 financeTxnWindowIsTheBusinessDayItself / financeSummaryWindowIsTheBusinessDayItself / orderListWindowIsTheBusinessDayItself。红证（改前实测）：实际绑成 `2026-10-03T00:00Z` … `2026-10-03T23:59:59Z`（UTC 日）⇒ 该三条判据全红（读数 `Tests run: 8, Failures: 5`）。"
      - "判据 2·**跨端点自洽（同系统内不得自相矛盾）**：同一笔「北京今日凌晨」记录，列表窗口起点必须等于 `BusinessClock.startOfDay(业务日)`（看板 / 订单趋势 / 简报用的同一只钟）。执行点 = 同文件 financeTxnWindowAgreesWithBusinessClock。实证档（只读）= acceptance/2026-10-03/finance-stock-time-sweep/out/C9-cross-endpoint.json：同一笔 `ordAt=2026-10-03 02:00+08` 的订单，看板 dashboardTodayOrders=351 收录而订单列表 listTotal=9 不收录（listHit=false）。"
      - "判据 3·**跨月 / 跨年边界各落对月份**：`2026-10-01 00:00+08` 落 10 月、`2026-09-30 23:59:59+08` 落 9 月、`2026-01-01 00:01+08` 落 2026-01（改前会落进 2025-12-31）。执行点 = 同文件 monthEndToMonthStartFallsInTheRightMonths / yearBoundaryRecordFallsInTheNewYear（两条都带**缺陷形态自证**：同一时刻在 UTC 窗下判红 ⇒ 红的来源是日界本身，不是别的）。"
      - "判据 4·**夹住边界 + 右界语义**：北京 `07:59:59` 与 `08:00:00` **同属当日**（都在业务日窗口内）；`endDate=D` 覆盖 D 当天整日（含 `23:59:59.999999999+08`），右界 = 次日业务日零点（不含）。执行点 = 同文件 boundaryPairIsInsideAndOutsideTheSameDay / windowCoversTheWholeDayNotToTheSecondBefore。红证：`T23:59:59Z` 在 +08 口径下等于「次日 07:59:59」⇒ 既漏掉当天 08:00 之后、又把次日凌晨 8 小时算进来（该自证断言改前为红）。"
      - "判据 5·**类级固化（让同类进不来）**：admin-api/src/main 下出现 `T00:00:00Z` / `T23:59:59Z` 字面量、或日界形态的 `ZoneOffset.UTC` ⇒ 守卫判红（放行口径 = `now(ZoneOffset.UTC)` 这种「打时刻」拼写，闭括号紧邻）。执行点 = backend/admin-api/src/test/java/com/migao/admin/time/BusinessClockSourceGuardTest.java 的 onlyTheClockComponentReadsBusinessTimeFromMain + rulesHaveDiscriminatingPower（每条新禁则必须能命中一个坏样本 ⇒ 不会退化成空断言）。"
    skip_reason: "[backend-contract] 纯后端日期窗口判据（无 LLM 环节 ⇒ 不进 agent-eval 冒烟）：由 admin-api 单测 BusinessDayWindowTest + BusinessClockSourceGuardTest 执行"
    merge_log: "2026-10-03 新增（issue #6200）：财务 / 订单的日期筛选窗口由 UTC 日改为业务日（+08）。根因 = FinanceService.parseDateStart/parseDateEnd 与 OrderService.getOrderPage 用 `date + \"T00:00:00Z\"` / `\"T23:59:59Z\"` 拼窗口；正确单源 = 同仓既有的 BusinessClock.startOfDay（看板 / 简报 / 订单趋势早已在用）⇒ 本单不是新口径，而是把窗口口径收敛到既定单源。"
    traces:
      tests:
        - "backend/admin-api/src/test/java/com/migao/admin/time/BusinessDayWindowTest.java"
        - "backend/admin-api/src/test/java/com/migao/admin/time/BusinessClockSourceGuardTest.java"
      ci:
        - pr-check.yml
      verifies: []
