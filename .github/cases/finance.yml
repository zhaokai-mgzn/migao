# cases/finance.yml — 财务对账域用例（B 端管理后台）
#
# 标准：ershen/design/16-case-contract.md（schema v1.0 草案）
# ★ 格式铁律：只用 block style（与 yaml_light 兼容），禁止 flow style。

schema: "case-contract/1.0"
domain: finance

cases:
  - id: FN-001
    title: "资金流水查询与登记"
    domains:
      - finance
    tier: normal
    tags:
      - finance
      - query
    truths_ref:
      - finance.txn-types
      - finance.auto-record
      - finance.txn-no
    user_inputs:
      - "登记一笔线下收款，金额 88 元，微信支付"
      - "确认"
    expectations:
      - tool: finance_api
        args:
          action: create_transaction
          type: income
    # ── 断言可执行化：堵住「工具失败 100%、用例仍 100% 绿」的假绿（issue #3558 / #3548）──
    # 假绿实证（2026-09-14 云测试环境真实重放，缺陷部署期）：`finance_api.py:202` 用 `json=`
    # 调自研客户端（`AdminApiClient.post` 只收 `json_data`）→ 必抛 TypeError → 线下收支登记
    # **100% 失效**；而本用例照样 score=100%，同一次跑分还打印「工具失败率 100%」。
    # 三处漏点：① expectations 只断言「finance_api 被调用 + args」，不看 tool_result.success；
    #          ② 旧 data_checks「status=success」是自然语义，且不含 runner 计分所需的
    #             字面量 `success=true` → 整条**根本没进评分**；
    #          ③ 本用例没有任何「成功/产出」断言。
    # 修法（不放宽任何既有断言，只加机器判定）：
    #   ① `must_succeed` —— 读 tool_result.success（「调了 ≠ 成了」的直接判定，issue #3361 起
    #      就是仓库的写/关键工具成功断言；闸门口径已由 #3580 按 persona 收窄 → B 端用例可安全声明）；
    #   ② `output_verify` —— 核对**成功返回体**字段（流水号非空 + 类型/金额/状态），
    #      失败关闭：找不到成功调用即判红（`找不到成功调用的结果（无从核对产出）`），不静默跳过。
    # 有效性验证（两个方向都跑过，见 PR body）：
    #   · 缺陷态（线上真实重放 + 把线上失败形状喂给 runner 真实断言函数）→ `must_succeed`/`output_verify` 双红；
    #   · 修复态（#3548 合并部署后真实重放）→ 双绿 100%。
    must_succeed:
      - tool: finance_api
    output_verify:
      - tool: finance_api
        # 多 action 工具必须声明 action（L0 不变式，issue #3544 收口批）：本用例断言的是
        # create_transaction 的**成功返回体**，不限定就会核对到 get_summary/get_transactions
        # 的 payload（字段名不撞=假红、撞上=假绿）。
        action: create_transaction
        expect:
          transactionNo: "__nonempty__"
          type: "income"
          amount: 88
          status: "success"
    data_checks:
      - "流水号 FIN- 前缀由服务端生成、type=income、amount=88、status=success —— 成功返回体由 output_verify 机器核对（「被调用」不等于「登记成功」）"
      - "登记失败时不得声称成功：must_succeed 读 tool_result.success 判红，output_verify 无成功调用即判红"
    skip_reason: ""
    merge_log: "财务对账模块新增；2026-09-09 校准：补金额+支付方式+确认轮——create_transaction 必填 type+amount，原「登记一笔线下收款」缺 amount，agent 正确引导补充（单轮过严）"
    traces:
      tests:
        - "backend/admin-api/src/test/java/com/migao/admin/service/FinanceServiceTest.java"
        - "frontend/admin-web/tests/unit/pages/finance.test.tsx"
      ci:
        - pr-check.yml
      verifies: []

  - id: FN-002
    title: "收支汇总"
    domains:
      - finance
    tier: normal
    tags:
      - finance
      - summary
    truths_ref:
      - finance.summary
    user_inputs:
      - "本月收入退款净额"
    expectations:
      - tool: finance_api
        args:
          action: get_summary
    data_checks:
      - "netIncome = totalIncome - totalRefund"
    skip_reason: ""
    merge_log: "财务对账模块新增"
    traces:
      tests:
        - "backend/admin-api/src/test/java/com/migao/admin/service/FinanceServiceTest.java"
        - "frontend/admin-web/tests/unit/pages/finance.test.tsx"
      ci:
        - pr-check.yml
      verifies: []

  - id: FN-003
    title: "应收对账"
    domains:
      - finance
    tier: normal
    tags:
      - finance
      - reconcile
    truths_ref:
      - finance.reconcile
    user_inputs:
      - "哪些订单没对平"
    expectations:
      - tool: finance_api
        args:
          action: get_reconciliation
    data_checks:
      - "每条 difference = receivedAmount - receivableAmount"
    skip_reason: ""
    merge_log: "财务对账模块新增"
    traces:
      tests:
        - "backend/admin-api/src/test/java/com/migao/admin/service/FinanceServiceTest.java"
        - "frontend/admin-web/tests/unit/pages/finance.test.tsx"
      ci:
        - pr-check.yml
      verifies: []

  - id: FN-004
    title: "收支汇总默认本期（自然月）时间范围"
    domains:
      - finance
    tier: normal
    tags:
      - finance
      - summary
    truths_ref:
      - finance.summary
    user_inputs:
      - "本期收入退款是多少"
    expectations:
      - tool: finance_api
        args:
          action: get_summary
    data_checks:
      - "默认加载时开始/结束日期填充本期（本月1号~今天），getSummary/getTransactions/getReconciliation 均携带该范围"
      - "本期时间范围由工具层兜底（#3288：缺时间参数自动补本月1号~今天）——agent 不显式传时间时服务端默认保证本期语义"
    skip_reason: ""
    merge_log: "本期默认时间范围（本月1号~今天）"
    traces:
      tests:
        - "frontend/admin-web/tests/unit/pages/finance.test.tsx"
      ci:
        - pr-check.yml
      verifies: []
