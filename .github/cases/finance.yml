# cases/finance.yml — 财务对账域用例（B 端管理后台）
#
# 标准：ershen/design/16-case-contract.md（schema v1.0 草案）
# ★ 格式铁律：只用 block style（与 yaml_light 兼容），禁止 flow style。

schema: "case-contract/1.0"
domain: finance

cases:
  - id: FN-001
    title: "资金流水查询与登记"
    domains:
      - finance
    tier: normal
    tags:
      - finance
      - query
    truths_ref:
      - finance.txn-types
      - finance.auto-record
      - finance.txn-no
    user_inputs:
      - "登记一笔线下收款，金额 88 元，微信支付"
      - "确认"
    expectations:
      - tool: finance_api
        args:
          action: create_transaction
          type: income
    # ── 断言可执行化：堵住「工具失败 100%、用例仍 100% 绿」的假绿（issue #3558 / #3548）──
    # 假绿实证（2026-09-14 云测试环境真实重放，缺陷部署期）：`finance_api.py:202` 用 `json=`
    # 调自研客户端（`AdminApiClient.post` 只收 `json_data`）→ 必抛 TypeError → 线下收支登记
    # **100% 失效**；而本用例照样 score=100%，同一次跑分还打印「工具失败率 100%」。
    # 三处漏点：① expectations 只断言「finance_api 被调用 + args」，不看 tool_result.success；
    #          ② 旧 data_checks「status=success」是自然语义，且不含 runner 计分所需的
    #             字面量 `success=true` → 整条**根本没进评分**；
    #          ③ 本用例没有任何「成功/产出」断言。
    # 修法（不放宽任何既有断言，只加机器判定）：`output_verify` 核对**成功返回体**的字段
    #   （流水号非空 + 类型/金额/状态），**失败关闭**：找不到成功调用即判红
    #   （`check_output_verify`: `找不到成功调用的结果（无从核对产出）`），不会静默跳过。
    # ⚠️ 为什么不用 `must_succeed`（同样能堵本缺陷）：仓库守卫
    #   `tests/unit_ci_workflows/test_xiaobu_case_set.py::test_must_succeed_tools_are_customer_capabilities`
    #   目前遍历**全部**用例并要求 must_succeed 工具 ∈ XIAOBU_TOOLS → 本条（B 端 finance_api）
    #   会被判红（闸门口径 bug，已由在飞 PR #3580 按 persona 收窄修复；本包不改他人文件）。
    #   output_verify 对本缺陷是**等价甚至更强**的判定：缺陷态「无成功调用」→ 红；
    #   修复态（#3548 已合并部署）实测 100% 绿。有效性验证见 PR body 的 A/B 证据。
    output_verify:
      - tool: finance_api
        expect:
          transactionNo: "__nonempty__"
          type: "income"
          amount: 88
          status: "success"
    data_checks:
      - "流水号 FIN- 前缀由服务端生成、type=income、amount=88、status=success —— 成功返回体由 output_verify 机器核对（「被调用」不等于「登记成功」）"
      - "登记失败时不得声称成功：无成功调用时 output_verify 直接判红（失败关闭，不静默跳过）"
    skip_reason: ""
    merge_log: "财务对账模块新增；2026-09-09 校准：补金额+支付方式+确认轮——create_transaction 必填 type+amount，原「登记一笔线下收款」缺 amount，agent 正确引导补充（单轮过严）"
    traces:
      tests:
        - "backend/admin-api/src/test/java/com/migao/admin/service/FinanceServiceTest.java"
        - "frontend/admin-web/tests/unit/pages/finance.test.tsx"
      ci:
        - pr-check.yml
      verifies: []

  - id: FN-002
    title: "收支汇总"
    domains:
      - finance
    tier: normal
    tags:
      - finance
      - summary
    truths_ref:
      - finance.summary
    user_inputs:
      - "本月收入退款净额"
    expectations:
      - tool: finance_api
        args:
          action: get_summary
    data_checks:
      - "netIncome = totalIncome - totalRefund"
    skip_reason: ""
    merge_log: "财务对账模块新增"
    traces:
      tests:
        - "backend/admin-api/src/test/java/com/migao/admin/service/FinanceServiceTest.java"
        - "frontend/admin-web/tests/unit/pages/finance.test.tsx"
      ci:
        - pr-check.yml
      verifies: []

  - id: FN-003
    title: "应收对账"
    domains:
      - finance
    tier: normal
    tags:
      - finance
      - reconcile
    truths_ref:
      - finance.reconcile
    user_inputs:
      - "哪些订单没对平"
    expectations:
      - tool: finance_api
        args:
          action: get_reconciliation
    data_checks:
      - "每条 difference = receivedAmount - receivableAmount"
    skip_reason: ""
    merge_log: "财务对账模块新增"
    traces:
      tests:
        - "backend/admin-api/src/test/java/com/migao/admin/service/FinanceServiceTest.java"
        - "frontend/admin-web/tests/unit/pages/finance.test.tsx"
      ci:
        - pr-check.yml
      verifies: []

  - id: FN-004
    title: "收支汇总默认本期（自然月）时间范围"
    domains:
      - finance
    tier: normal
    tags:
      - finance
      - summary
    truths_ref:
      - finance.summary
    user_inputs:
      - "本期收入退款是多少"
    expectations:
      - tool: finance_api
        args:
          action: get_summary
    data_checks:
      - "默认加载时开始/结束日期填充本期（本月1号~今天），getSummary/getTransactions/getReconciliation 均携带该范围"
      - "本期时间范围由工具层兜底（#3288：缺时间参数自动补本月1号~今天）——agent 不显式传时间时服务端默认保证本期语义"
    skip_reason: ""
    merge_log: "本期默认时间范围（本月1号~今天）"
    traces:
      tests:
        - "frontend/admin-web/tests/unit/pages/finance.test.tsx"
      ci:
        - pr-check.yml
      verifies: []
