      - "**不再**写入 user_identities / 不再需要 phoneCode / 不再有 openid 免密路径（原「微信授权手机号匹配员工 + 绑定 openid」整体退场）"
      - "签发的 JWT 含 roles + permissions（与 loginBySms 同源，工具级鉴权可用）"
    skip_reason: "[backend-contract] 纯后端单测契约（AuthService.bminiLogin 的废弃语义 + AuthService.loginByEmployee），非 LLM 行为，不进入 agent-eval 冒烟"
    merge_log: "issue #2977 新增；2026-09-25 改写（issue #5485）：员工登录统一为 用户名@企业编码 + 密码，微信手机号匹配 + openid 免密路径退场"
    traces:
      tests:
        - "backend/admin-api/src/test/java/com/migao/admin/service/BminiLoginServiceTest.java"
      ci:
        - pr-check.yml
      verifies: []
