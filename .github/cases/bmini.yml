# cases/bmini.yml — B 端员工小程序域（issue #2977 登录；#3997 工人扫码报工）
# 来源：B 端 agent 手机版（微信小程序入口）员工绑定登录行为契约 + 工人端扫码报工链路。
# persona 按用例所属端标记：BM-001~005 为 admin-api 纯后端行为（不标记，skip_reason 显式标注）；
# BM-006 为 B 端工人端（persona: mibao）。均不经 agent-eval LLM 冒烟。
# 均为单元测试契约（AuthService.bminiLogin / WechatService bmini 渠道）。

schema: "case-contract/1.0"
domain: bmini

cases:
  - id: BM-001
    legacy_id: ""
    title: "B 端员工小程序登录 - 账号密码（用户名@企业编码）登录，不再走微信手机号匹配"
    domains:
      - bmini
      - auth
    tier: normal
    tags:
      - bmini
      - login
      - employee
    truths_ref:
      - auth.employee-login
      - auth.tenant-local-identity
    user_inputs:
      - "员工在 bmini-app 登录页填 `用户名@企业编码` + 密码 → POST /api/auth/employee/login → 服务端按编码解析租户、按 (tenant_id, username) 定位员工 → 签发含 permissions 的员工 JWT（issue #5485 收口：员工只留用户名+密码）"
    expectations:
      - tool: direct_reply
    data_checks:
      - "登录成功返回 accessToken + user；租户 = 标识里的企业编码解析所得（不由前端传 tenantId）"
      - "**不再**写入 user_identities / 不再需要 phoneCode / 不再有 openid 免密路径（原「微信授权手机号匹配员工 + 绑定 openid」整体退场）"
      - "签发的 JWT 含 roles + permissions（与 loginBySms 同源，工具级鉴权可用）"
    skip_reason: "[backend-contract] 纯后端单测契约（AuthService.bminiLogin 的废弃语义 + AuthService.loginByEmployee），非 LLM 行为，不进入 agent-eval 冒烟"
    merge_log: "issue #2977 新增；2026-09-25 改写（issue #5485）：员工登录统一为 用户名@企业编码 + 密码，微信手机号匹配 + openid 免密路径退场"
    traces:
      tests:
        - "backend/admin-api/src/test/java/com/migao/admin/service/BminiLoginServiceTest.java"
      ci:
        - pr-check.yml
      verifies: []
