    truths_ref: []
    # ⚠️ 真值暂缺（照实登记，不粉饰）：本用例（issue #5642 功能⑤）**不新增 LLM 真值** ——
    # 交付物是「按权限码的米宝唤出授权门」这一组**确定性**判据（服务端单一真值 + 端侧两处消费 +
