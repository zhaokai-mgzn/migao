# cases/bmini.yml — B 端员工小程序登录域（issue #2977）
# 来源：B 端 agent 手机版（微信小程序入口）员工绑定登录行为契约。
# persona 不标记（admin-api 纯后端行为，不经 agent-eval LLM 冒烟，skip_reason 显式标注）。
# 均为单元测试契约（AuthService.bminiLogin / WechatService bmini 渠道）。

schema: "case-contract/1.0"
domain: bmini

cases:
  - id: BM-001
    legacy_id: ""
    title: "B 端员工首次小程序登录 - 微信授权手机号匹配员工并绑定 openid"
    domains:
      - bmini
      - auth
    tier: normal
    tags:
      - bmini
      - login
      - bind
    truths_ref:
      - auth-sms.bypass
    user_inputs:
      - "POST /api/auth/bmini/login {code, phoneCode} 首次登录：code2Session 换 openid 无绑定 → getPhoneNumber 换手机号 → 跨租户匹配员工（role≠customer/agent）→ 绑定 user_identities → 签发含 permissions 的员工 JWT"
    expectations:
      - tool: direct_reply
    data_checks:
      - "首次登录成功返回 accessToken + user（identityType=bmini）"
      - "user_identities 新增记录：identityType=bmini_app + appId=B端appid + openid + userId=员工"
      - "签发的 JWT 含 roles + permissions（与 loginBySms 同源，工具级鉴权可用）"
    skip_reason: "纯后端单测契约（AuthService.bminiLogin），非 LLM 行为，不进入 agent-eval 冒烟"
    merge_log: "issue #2977 B 端手机版登录设计新增"
    traces:
      tests:
        - "backend/admin-api/src/test/java/com/migao/admin/service/BminiLoginServiceTest.java"
      ci:
        - admin-api-test.yml
      verifies: []

  - id: BM-002
    legacy_id: ""
    title: "B 端员工二次登录 - openid 已绑定直接登录（免手机号授权）"
    domains:
      - bmini
      - auth
    tier: normal
    tags:
      - bmini
      - login
      - rebind
    truths_ref:
      - auth-sms.bypass
    user_inputs:
      - "POST /api/auth/bmini/login {code} 二次登录：user_identities 已存在 bmini_app 绑定 → 直接签发员工 JWT，不再要求 phoneCode"
    expectations:
      - tool: direct_reply
    data_checks:
      - "已有绑定时不调用 getPhoneNumber（无需 phoneCode）"
      - "返回同一员工账号的 accessToken + user"
    skip_reason: "纯后端单测契约（AuthService.bminiLogin），非 LLM 行为，不进入 agent-eval 冒烟"
    merge_log: "issue #2977 B 端手机版登录设计新增"
    traces:
      tests:
        - "backend/admin-api/src/test/java/com/migao/admin/service/BminiLoginServiceTest.java"
      ci:
        - admin-api-test.yml
      verifies: []

  - id: BM-003
    legacy_id: ""
    title: "B 端登录手机号未匹配员工 - 明确拒绝且禁止自动建号"
    domains:
      - bmini
      - auth
      - defense
    tier: normal
    tags:
      - bmini
      - login
      - defense
    truths_ref:
      - auth-sms.bypass
    user_inputs:
      - "POST /api/auth/bmini/login {code, phoneCode} 手机号在 users 表无员工匹配（或仅 customer 角色）→ 拒绝登录，不自动创建用户（与 C 端 findOrCreate 语义相反）"
    expectations:
      - tool: direct_reply
    data_checks:
      - "业务错误：手机号未匹配员工账号（不得建号、不得返回 token）"
      - "不向 users / user_identities 写入任何新记录"
      - "仅匹配到 customer 角色账号时同样拒绝（员工专属门禁）"
    skip_reason: "纯后端单测契约（AuthService.bminiLogin），非 LLM 行为，不进入 agent-eval 冒烟"
    merge_log: "issue #2977 B 端手机版登录设计新增"
    traces:
      tests:
        - "backend/admin-api/src/test/java/com/migao/admin/service/BminiLoginServiceTest.java"
      ci:
        - admin-api-test.yml
      verifies: []
  - id: BM-004
    legacy_id: ""
    title: "B 端小程序请求层基建 - Token 注入/401 清理/重试"
    domains:
      - bmini
      - api
    tier: normal
    tags:
      - bmini
      - request
    truths_ref:
      - auth-sms.bypass
    user_inputs:
      - "bmini-app 复用 C 端 request.ts：请求自动带 Authorization Bearer；401 清 Token 跳登录页；网络错误指数退避重试"
    expectations:
      - tool: direct_reply
    data_checks:
      - "非 skipAuth 请求头含 Authorization: Bearer <token>"
      - "401 响应清除本地 Token 并跳转登录页"
      - "timeout/fail 类错误按指数退避重试（MAX_RETRIES 次）"
    skip_reason: "纯前端单元测试（bmini-app tests/request.test.ts），非 LLM 行为，不进入 agent-eval 冒烟"
    merge_log: "issue #2977 B 端手机版基建（复制自 mini-app）"
    traces:
      tests:
        - "frontend/bmini-app/tests/request.test.ts"
      ci:
        - bmini-app.yml
      verifies: []

  - id: BM-005
    legacy_id: ""
    title: "B 端认证 store - 登录状态流转/持久化/登出清理"
    domains:
      - bmini
      - auth
    tier: normal
    tags:
      - bmini
      - store
      - auth
    truths_ref:
      - auth-sms.bypass
    user_inputs:
      - "bmini-app authStore（Zustand+persist）：login 成功写入 token/user；logout 清空；initialize 从本地恢复；token 过期自动登出"
    expectations:
      - tool: direct_reply
    data_checks:
      - "bminiLoginAction 成功 → isLoggedIn=true + token/user 落 storage"
      - "logout 清空 token/user/isLoggedIn（含 storage 持久化清理）"
      - "initialize 有效 token 恢复登录态；过期 token 自动 logout"
    skip_reason: "纯前端单元测试（bmini-app tests/store-auth.test.ts），非 LLM 行为，不进入 agent-eval 冒烟"
    merge_log: "issue #2977 B 端手机版基建（复制自 mini-app）"
    traces:
      tests:
        - "frontend/bmini-app/tests/store-auth.test.ts"
      ci:
        - bmini-app.yml
      verifies: []
