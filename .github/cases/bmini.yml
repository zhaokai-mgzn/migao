# cases/bmini.yml — B 端员工小程序域（issue #2977 登录；#3997 工人扫码报工）
# 来源：B 端 agent 手机版（微信小程序入口）员工绑定登录行为契约 + 工人端扫码报工链路。
# persona 按用例所属端标记：BM-001~005 为 admin-api 纯后端行为（不标记，skip_reason 显式标注）；
# BM-006 为 B 端工人端（persona: mibao）。均不经 agent-eval LLM 冒烟。
# 均为单元测试契约（AuthService.bminiLogin / WechatService bmini 渠道）。

schema: "case-contract/1.0"
domain: bmini

cases:
  - id: BM-001
    legacy_id: ""
    title: "B 端员工小程序登录 - 账号密码（用户名@企业编码）登录，不再走微信手机号匹配"
    domains:
      - bmini
      - auth
    tier: normal
    tags:
      - bmini
      - login
      - employee
    truths_ref:
      - auth.employee-login
      - auth.tenant-local-identity
    user_inputs:
      - "员工在 bmini-app 登录页填 `用户名@企业编码` + 密码 → POST /api/auth/employee/login → 服务端按编码解析租户、按 (tenant_id, username) 定位员工 → 签发含 permissions 的员工 JWT（issue #5485 收口：员工只留用户名+密码）"
