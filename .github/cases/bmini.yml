  - id: BM-030
    legacy_id: ""
    title: "B 端 H5 底部 tabBar 居中：iOS 安全区只补一次 + 图标/文字在可视区垂直居中"
    domains:
      - bmini
    tier: normal
    tags:
      - bmini
      - tabbar
      - layout
      - safe-area
      - responsive
    truths_ref:
      - frontend-fix.no-api-change
    user_inputs:
      - "商家在手机浏览器打开 `https://app.migaozn.com/b/`：底部四个 tab（问黄金策 / 数据 / 坐席 / 我的）在条内垂直居中 —— 图标与文字上下留白对称；在带 home indicator 的 iPhone 上，条覆盖安全区、文字既不被顶到条外、下方也不留大块空白"
    expectations:
      - tool: direct_reply
    data_checks:
      - "判据 1·🔴 **安全区只补一次**（修复前 Taro h5 的 tabBar 把它算了**两遍**：`.taro-tabbar__tabbar-bottom{margin-bottom:env(safe-area-inset-bottom)}` 把整条抬起 + `.weui-tabbar__item{padding-bottom:env(...)}` 条内再垫一次 ⇒ 线上 390×844 实测：图标相对条顶 −12px（溢出条外）、文字下方留 51px 空白）：判据 = frontend/bmini-app/tests/tabbar-layout.test.ts 断言 frontend/bmini-app/src/styles/tabbar.scss 里条 `margin-bottom: 0` 且条高 = `calc(50PX + env(safe-area-inset-bottom))`（**CSS 尺度字面量**）。⚠️ **不许**写成 `var(--taro-tabbar-height)`：构建流水线会把这个名字改写成 `var(--50PX)` ⇒ 声明在计算值阶段失效（`unset`→`auto`）⇒ 条高塌成 26px、标签被挤出屏幕（#5755 发布后实测，同日 follow-up 修）；该形态另有一条类级判据（本仓 scss 出现它即红）。判据 1c 还会现取 Taro 实现包，核对字面量与 `--taro-tabbar-height` **逐值相等**。红证：把该文件移开（= 改前状态）⇒ 同一文件 3 条判据判红（实跑过：3 failed / 2 passed）"
      - "判据 1b·🔴 **陷阱判据**（本次回归的拦网）：`frontend/bmini-app/src/**/*.scss` 里出现 `var(--taro-tabbar-height` ⇒ 判红（探针实测：`var(--my-thing)` / `var(--foo-height)` 原样保留，被特殊处理的**只有这个名字**）"
      - "判据 1c·字面量 == Taro 运行时值（现取 `@tarojs/{components,router}` 的 dist 里的 `--taro-tabbar-height:<n>px`；找不到 ⇒ fail-closed 判红，不许猜一个数补上）—— Taro 升级改了它 ⇒ 判红，逼人同步这一格"
      - "判据 2·🔴 **图标 + 文字在可视区垂直居中**（修复前 item 是 `padding:5px 0` = 上 5 下 0 ⇒ **无安全区时文字直接贴着屏幕底边**，安卓 / 桌面 / 老 iPhone 同样不居中）：`.weui-tabbar__item` 必须是 flex 纵列居中（`display:flex` + `flex-direction:column` + `align-items:center` + `justify-content:center` + `padding-top:0`），且**保留** `padding-bottom: env(safe-area-inset-bottom)` —— 与判据 1 合起来才是「只补一次」（把两处一起删掉 ⇒ 判红）"
      - "判据 3·覆盖样式必须被 frontend/bmini-app/src/app.scss **真的引入**（写在别处但没接线 ⇒ 判红）；类级：`src/styles/*.scss` 里不许出现第二份 `taro-tabbar__` 覆盖（第二份口径会漂）"
      - "判据 4·**几何面**：（a）🔴 **机器判据（issue #5759 起）** = tests/e2e/specs/bmini/bmini-tabbar.spec.ts（配置 tests/playwright.bmini.config.ts；CI = .github/workflows/bmini-app.yml 的 `tabbar-geometry` job）—— 判条贴底（±1px）、每格图标与文字相对本格水平居中（±1px）、**图标上方留白 == 文字下方留白（±2px）且两者都 > 0**、条高 ∈ [49,51]；Chromium 里 `env(safe-area-inset-bottom)` 恒 0 ⇒ 这些数字**跨平台确定**。（b）**iOS 安全区那一侧仍是复测读数**（该腿环境取不到 env()）：安全区 34 ⇒ 条高 84 = 50+34、图标相对条顶 ≈+2.5px、文字底距屏幕底 ≈36.5px（= 34 安全区 + 2.5 居中留白）。⚠️ 本腿**不做像素基线**（darwin/linux 双平台基线本机生成不齐全）⇒ 颜色 / 观感类回归仍无机器判据"
    skip_reason: "[backend-contract] 确定性前端/结构判据（jest: frontend/bmini-app/tests/tabbar-layout.test.ts），非 LLM 行为，不进入 agent-eval 冒烟"
    merge_log: "2026-09-28 新增（issue #5754）：用户反馈「页面底部菜单栏的文字和底部菜单区域未居中，看起来不对」⇒ headless 实测定位两条同族病灶（安全区算两遍：iOS 图标溢出条外 + 文字下 51px 空白；item 上 5 下 0：无安全区时文字贴底边），加 app 级覆盖样式（三条不变量）+ 文本级守卫。边界如实登记：几何是否真居中只能复测（本仓 bmini 无 e2e 腿），本用例不含机器几何判据。 ｜ 2026-09-28 同日 follow-up（PR #5756）：首版（PR #5755）把条高写成 `var(--taro-tabbar-height, 50px)`，发布后线上实测该规则被构建改成 `var(--50PX, 1.25rem)` ⇒ 变量解析不到、声明在计算值阶段失效 ⇒ **条高塌成 26px、标签被挤出视口**（比修复前更糟）⇒ 改用 CSS 尺度字面量 `50PX`，并补两条判据：①b 禁止本仓 scss 引用 `var(--taro-tabbar-height`（探针实验定界：只有这个名字被特殊处理，普通变量不受影响）；①c 字面量必须与 Taro 运行时值逐值相等。**判据一格不放宽**（三条不变量与几何读数口径未变，变的是实现写法；几何读数已按 follow-up 之后的产物复测）。 ｜ 2026-09-28（issue #5759）：本用例的几何面由「只能人工复测」升级为 **e2e 机器判据**（新增 tests/playwright.bmini.config.ts + tests/e2e/specs/bmini/bmini-tabbar.spec.ts + .github/workflows/bmini-app.yml 的 `tabbar-geometry` job）⇒ 判据 4 改写为「(a) 机器判据 / (b) iOS 安全区侧复测读数」；三条不变量的口径与台账读数**一格未动**。"
    traces:
      tests:
        - "frontend/bmini-app/tests/tabbar-layout.test.ts"
      ci:
        - bmini-app.yml
      verifies: []

