    user_inputs:
      - "商家员工/管理员在手机浏览器打开 `https://app.migaozn.com/b/`：员工填「用户名@企业编码 + 密码」；管理员切到「管理员登录」填「手机号 + 验证码」。两条路都能登进去，且字号/触控目标随屏幕宽度合理缩放"
    expectations:
      - tool: direct_reply
    data_checks:
      - "判据 1·🔴 **同源请求不被判成跨域**（修复前线上 403 `Invalid CORS request`、前端只显示 `Load failed`、服务端零日志）：带 `Origin: https://app.migaozn.com` 的同源 POST 必须与不带 Origin 的同一请求同结果。实现 = backend/admin-api/src/main/java/com/migao/admin/security/SameOriginOriginHeaderFilter.java（按浏览器口径逐项比 scheme+host+port，代理不在场时退回本地视角 ⇒ 本地开发的真跨域不受影响）。红证：把 `isSameOrigin` 恒 false ⇒ SameOriginOriginHeaderFilterTest 8 条里 3 条红（实跑过）；还原即复绿"
      - "判据 2·🔴 **H5 产物的 API/AI 基址与落地面同源**（跨域既要多一次预检、又要求白名单里有它；AI 面未配置时会 baked 成 `http://localhost:8001`）：判据 = tests/unit_ci_workflows/test_bmini_h5_delivery_contract.py 的 test_h5_api_base_is_same_origin_as_landing_surface（落地面取自发布后断言 step，不写死常量）。红证：改回 `https://api.migaozn.com` / 删掉 `TARO_APP_AI_API_URL` ⇒ 红（实跑过）"
      - "判据 3·**「字号太小」这一类进不来**：h5 模板必须带响应式 root font-size（Taro rem 方案缺的另一半；修复前 root 从未设置 ⇒ 全端按设计值 40% 渲染、标签实测 5.2 CSS px），且 750 设计尺度字号下限 24px、台账**只许缩短**（现取 **0** —— issue #5769 收口后全库清零）。判据 = tests/unit_ci_workflows/test_bmini_mobile_typography_floor.py + test_bmini_h5_delivery_contract.py；红证：写回 `font-size: 13px` / 删掉根字号脚本 / 下调 `MIN_FONT_SIZE` ⇒ 红（实跑过）"
      - "判据 4·**触控目标与输入字号**：登录页交互件 ≥ 88 设计 px（≈45.8 CSS px，手指最小命中区 44 CSS px）、输入与按钮字号 ≥ 32（≈16.6 CSS px —— 输入框小于 16 CSS px 时 iOS 聚焦会放大整页）。实测 5 个视口（320/360/390/430/1024）全达标"
      - "判据 6·🔴 **前端实际发的自定义头 ⊆ 两个后端的 CORS 逐项白名单**（issue #6479：两个 H5 端**每个**请求都带 `X-Client-Type`，而 admin-api `setAllowedHeaders` 与 ai-agent `allow_headers` 都没有它 ⇒ 预检不放行该头 ⇒ **真实请求根本不发出去**，前端只看到 `net::ERR_FAILED` / CORS 报错、**服务端零日志**；同一形态当年已在 `X-Worker-Session-Id` 上发生过，但**没有判据对账**，换个头名又来一次）。判据 = tests/unit_ci_workflows/test_cors_custom_headers_contract.py（扫 `frontend/*/src/**` **代码里**的 `X-*` 头字面量 ⊆ admin-api 清单 ∧ ⊆ ai-agent 清单，含反空跑金丝雀）。真栈复探：`curl -i -X OPTIONS http://127.0.0.1:8080/api/auth/me -H 'Origin: http://localhost:3000' -H 'Access-Control-Request-Method: GET' -H 'Access-Control-Request-Headers: authorization,x-client-type,content-type'` ⇒ 修前 `Access-Control-Allow-Headers: authorization, content-type`、修后含 `x-client-type`（实测）。红证：把 `X-Client-Type` 从任一侧白名单摘掉 ⇒ 具名报红（实跑过）"
      - "判据 5·**两个入口各自可登、失败方向正确**：管理员短信入口走 `POST /api/auth/sms/send` + `POST /api/auth/sms/login`（角色门禁在服务端，非管理员 401 + 引导文案，端侧不自行判角色）；员工入口失败展示服务端反枚举文案（`账号或密码错误`），**不是** `Load failed` 这类网络层文案"
    skip_reason: "[backend-contract] 确定性前端/结构判据（jest: frontend/bmini-app/tests/login-page.test.tsx；JUnit: SameOriginOriginHeaderFilterTest；pytest: tests/unit_ci_workflows/test_bmini_h5_delivery_contract.py、test_bmini_mobile_typography_floor.py 与 test_cors_custom_headers_contract.py），非 LLM 行为，不进入 agent-eval 冒烟"
    merge_log: "2026-09-27 新增（issue #5721）：商家 H5 线上登录全线失败（跨域 403 → `Load failed`）+ 全端字号只有设计值四成且不响应式 + 管理员在 H5 无入口 —— 三条一并修，并落类级判据（同源基址 / 根字号接线 / 字号下限台账 / 触控目标 / 同源判定）。 2026-10-07 修订（issue #6479）：当年只把「跨域」这条路堵成**同源**，**头白名单本身没修、也没有判据**（原病历逐字写着「也不含前端发的 `X-Client-Type` 头」）⇒ 本地联调与任何分域形态下，两个 H5 的**全部**请求被预检拦掉（浏览器只报 `net::ERR_FAILED`，服务端零日志）。本次补两侧白名单（admin-api + ai-agent）并落「前端实际发的头 ⊆ 后端白名单」的类级判据（含反空跑金丝雀）。"
    traces:
      tests:
        - "frontend/bmini-app/tests/login-page.test.tsx"
        - "backend/admin-api/src/test/java/com/migao/admin/security/SameOriginOriginHeaderFilterTest.java"
        - "tests/unit_ci_workflows/test_bmini_h5_delivery_contract.py"
        - "tests/unit_ci_workflows/test_bmini_mobile_typography_floor.py"
        - "tests/unit_ci_workflows/test_cors_custom_headers_contract.py"
      ci:
        - bmini-app.yml
        - pr-check.yml
      verifies: []

