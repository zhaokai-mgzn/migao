  - id: BM-023
    legacy_id: ""
    title: "补打详情与打印 - 404/410 分开呈现（查无此码 vs 已撤销）+ 打印必留痕且前端不自行计数"
    domains:
      - bmini
      - inbound
    tier: normal
    tags:
      - bmini
      - inbound
      - reprint
      - print
      - audit
    truths_ref:
      - inbound-label-flow.print-count-and-audit
      - inbound-label-flow.worker-detail-read-and-photo-upload
    user_inputs:
      - "工人拍到 / 手输一张入库标签短码 → 页面展示服务端给的**单据详情**（品名 / 色号 / 门幅 / 米数 / 货号 / 缸号 / 批次 / 单号 / 供应商 / 已打印次数）→ 点「打印新标签」补打；短码不存在与已撤销会分别出现"
    expectations:
      - tool: direct_reply
    data_checks:
      - "判据 1·🔴 **404 / 410 分开**：跨租户 / 不存在 ⇒ `not-found`（「查无此码…核对纸面短码」）；已撤销 ⇒ `revoked`（「该标签已撤销…请文员按单据重新补打」）。两者是**两种状态、两句不同的话**，页面上是两个不同的块（`reprint-not-found` / `reprint-revoked`，实测两句文本不相等）；服务端建议（`ApiResponse.suggestion`）原样上屏。红证（变异注入实跑退出码 1）：把 410 也报成 404 ⇒ 判据红。证据：frontend/bmini-app/tests/inbound-reprint-flow.test.ts + tests/worker-reprint-page.test.tsx"
      - "判据 2·**200 但无 data 不算 ready**（不返回空详情、不画假标签）⇒ `error` 态。"
      - "判据 3·🔴 **打印必留痕**：补打的详情走**同一个** `printInboundLabel`（P3/P4 的唯一送打印入口），调用序 `render → recordPrint → transport`；留痕失败 ⇒ **一次都不送数据**；能力不可用 ⇒ 既不调留痕也不连蓝牙。红证（变异注入实跑退出码 1）：把 `recordPrint` 换成「自己造一个计数」 ⇒ 判据与 P3 的 D1 同时红。"
      - "判据 4·**前端不自行计数**：两次不同服务端读数（3 / 9）原样转发，屏上显示服务端那次；源码面判据扫新增文件与页面（`printCount` 算术 ⇒ 红）。红证（变异注入实跑退出码 1）：页面写 `printCount + 1` ⇒ 行为判据与源码面判据同时红。"
      - "判据 5·**字段真值只从服务端来**：屏上字段全部取自 `GET /api/worker/inbound/labels/{短码}` 的响应（端侧不拼第二份），短码以服务端归一化后的值为准。"
      - "判据 6·**零后端改动**：本单只消费已合并的 P1/P2 端点（`INBOUND_ENDPOINTS` 与后端控制器逐值一致由既有守卫钉住），未新增任何端点。"
    skip_reason: "[backend-contract] 确定性详情/留痕判据（jest: frontend/bmini-app/tests/inbound-reprint-flow.test.ts + tests/worker-reprint-page.test.tsx），非 LLM 行为，不进入 agent-eval 冒烟"
    merge_log: "2026-09-27 新增（issue #5640 功能②）：补打的详情面与打印面 —— 撤销（410）与查无（404）是两种处置，打印沿用 P3 的先留痕后送数据。"
    traces:
      tests:
        - "frontend/bmini-app/tests/inbound-reprint-flow.test.ts"
        - "frontend/bmini-app/tests/worker-reprint-page.test.tsx"
      ci:
        - bmini-app.yml
      verifies: []
