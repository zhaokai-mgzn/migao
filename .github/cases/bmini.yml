        - "backend/admin-api/src/test/java/com/migao/admin/security/SameOriginOriginHeaderFilterTest.java"
        - "tests/unit_ci_workflows/test_bmini_h5_delivery_contract.py"
        - "tests/unit_ci_workflows/test_bmini_mobile_typography_floor.py"
      ci:
