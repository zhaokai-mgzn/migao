# cases/bmini.yml — B 端员工小程序域（issue #2977 登录；#3997 工人扫码报工）
# 来源：B 端 agent 手机版（微信小程序入口）员工绑定登录行为契约 + 工人端扫码报工链路。
# persona 按用例所属端标记：BM-001~005 为 admin-api 纯后端行为（不标记，skip_reason 显式标注）；
# BM-006 为 B 端工人端（persona: mibao）。均不经 agent-eval LLM 冒烟。
# 均为单元测试契约（AuthService.bminiLogin / WechatService bmini 渠道）。

schema: "case-contract/1.0"
domain: bmini

cases:
  - id: BM-001
    legacy_id: ""
    title: "B 端员工首次小程序登录 - 微信授权手机号匹配员工并绑定 openid"
    domains:
      - bmini
      - auth
    tier: normal
    tags:
      - bmini
      - login
      - bind
    truths_ref:
      - auth-sms.bypass
    user_inputs:
      - "POST /api/auth/bmini/login {code, phoneCode} 首次登录：code2Session 换 openid 无绑定 → getPhoneNumber 换手机号 → 跨租户匹配员工（role≠customer/agent）→ 绑定 user_identities → 签发含 permissions 的员工 JWT"
    expectations:
      - tool: direct_reply
    data_checks:
      - "首次登录成功返回 accessToken + user（identityType=bmini）"
      - "user_identities 新增记录：identityType=bmini_app + appId=B端appid + openid + userId=员工"
      - "签发的 JWT 含 roles + permissions（与 loginBySms 同源，工具级鉴权可用）"
    skip_reason: "[backend-contract] 纯后端单测契约（AuthService.bminiLogin），非 LLM 行为，不进入 agent-eval 冒烟"
    merge_log: "issue #2977 B 端手机版登录设计新增"
    traces:
      tests:
        - "backend/admin-api/src/test/java/com/migao/admin/service/BminiLoginServiceTest.java"
      ci:
        - pr-check.yml
      verifies: []

