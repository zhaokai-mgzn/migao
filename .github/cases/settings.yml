  - id: ST-003
    legacy_id: "6.3"
    title: "修改密码 —— 能力已下线（settings 域只读）：如实告知 + 引导管理员，不假承诺"
    domains:
      - settings
    tier: normal
    tags:
      - query
      - password
    truths_ref:
      - settings-manage.change-password
    user_inputs:
      - "改密码，旧密码xxx 新密码newpass123"
    # ── 2026-09-25 **退场改造**（issue #5302；承接 #5247「B 端黄金策只读化」）────────────
    # 原断言（`settings_manage(action=change_password)` + 同 action 的 `must_succeed`）
    # **不可满足**：该写 action 已从工具源码删除（`VALID_ACTIONS` 只剩三个只读 action），
    # 且后台自 issue #3006/#3098 起**也没有**自助改密入口 ⇒ 不存在"能改成功"的路径。
    # 用例**保留**（用户仍会说这句话，是高频诉求）⇒ 改判**能力下线后的正确行为** =
    # 如实告知 + 给出下一步（联系管理员），且**不得假承诺**。
    # 「不得调用已删除的写 action」由 L0 结构判据锁定
    # （backend/ai-agent-service/tests/test_settings_domain_readonly.py +
    #  tests/unit_ci_workflows/test_mibao_b_end_readonly.py 判据 6）——
    # 此处**不写** `must_fail: settings_manage(action=change_password)`：那是悬空 action
    # （该取值已不在枚举里，`action_binding_violations` 会判红）。
    expectations:
      - tool: direct_reply
    # forbidden-text-intent: 本用例测的就是「能力已下线 ⇒ 不得假承诺已改密」——禁令即主判据
    forbidden_text:
      - "已修改成功"
      - "密码已修改"
      - "已为您修改密码"
      - "已帮您修改"
      - "修改成功"
    data_checks:
      - "如实告知：黄金策不改密码（本域只读），且后台暂无自助改密入口 ⇒ 引导用户联系管理员处理"
      - "整场不得出现假承诺话术（机器断言见 forbidden_text）"
      - "不得索取/复述密码明文，也不得改用其它工具假装完成（如改配置/发通知）"
      - "settings_manage 只暴露 get_settings/get_ai_config/login_logs（结构性判据：backend/ai-agent-service/tests/test_settings_domain_readonly.py）"
    skip_reason: ""
    merge_log: "verification 6.3 独有；change_password 真值待 truth-miner 补挖；2026-09-23（case-trust burn-down 缴费，metric=entries ⇒ 整条销账；先例 = CU-005 的 #5039 缴费）：补 `must_succeed[settings_manage(action=change_password)]`（效果层：「调用了 ≠ 成了」—— 旧密码校验失败时原断言照样满分）+ `namespaces[account_password:评测管理员]`（弱证据，如实登记：夹具层无密码域复位动作）+ `preconditions`（声明层散文前置；`_PRECONDITION_TYPES` 无此类型 ⇒ 不发明类型）。**如实登记**：该前提在当前评测栈上不成立（种子无 password_hash）⇒ 本用例由「恒绿」变「可失败」，真修见 #5055。 ｜ 2026-09-25（issue #5302，settings 域只读化收口）**退场改造**：原 `expectations[settings_manage(action=change_password)]`、`must_succeed`（同 action，效果层）、`namespaces[account_password:…]`（改密的并行互斥）、`preconditions`（旧密码前提）、data_check「确认后修改成功」**整体移除** —— 写 action 已从工具删除 ⇒ 这些断言永久不可满足（留着就是悬空声明；`action_binding_violations` 会直接判红）。改判新行为 = 如实告知 + 引导管理员 + 不得假承诺（`forbidden_text` 承载禁令面），`tags` 由 `write` 改判 `query`（本域已无写能力）。`truths_ref` 保留 `settings-manage.change-password`（该真值本身已同批改判为「不在 Agent 能力内」）"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_tools_settings_manage.py"
        - "backend/ai-agent-service/tests/test_settings_domain_readonly.py"
      ci:
        - agent-eval.yml
      verifies: []

