  - id: ST-008
    legacy_id: ""
    title: "机器人设置生效 - 自动转人工关键词 + 非营业时间转人工降级"
    domains:
      - settings
      - chat
    tier: normal
    persona: xiaobu
    tags:
      - ai_config
      - handoff
    truths_ref:
      - settings-manage.ai-config
      - settings-manage.immediate-effect
    user_inputs:
      - "商家配置 autoHandoffKeywords=[找老板,我要投诉] 后，用户消息'我要找老板'应触发转人工"
      - "商家配置 afterHoursMode=auto_reply 且非营业时间时，转人工应降级返回 afterHoursMessage"
    expectations:
      - tool: human_handoff
    # 写操作成功断言（issue #3367 覆盖审计）：`human_handoff` 是**写工具** ——
    # 「调了」≠「人工会话真的建出来了」。本条用例的业务价值（工作台可见/可回复、
    # 上下文透传）全部建立在会话真的落库之上；只断言工具名的话，返回
    # success=false（甚至 tool_not_found）也照样判绿（issue #3361 已在 order_create
    # 上实证过这种假绿）。实测本用例链路返回 id/ticketNo/status=pending，断言成立。
    must_succeed:
      - tool: human_handoff
    data_checks:
      - "is_auto_handoff_trigger('我要找老板', config) == true"
      - "is_after_hours(config, 非营业时间) == true"
      - "非营业时间转人工不创建工单，返回 afterHoursMessage"
    # 前置自断言（issue #4085 顺带销账 CASE-TRUST-NO-PRECONDITION-ASSERTION）：
    # 本用例的 premise 是**租户 AI 配置**（autoHandoffKeywords / afterHoursMode / 营业时间），
    # 而 agent-eval 栈无法设置 TenantAiConfig（故 skip_reason 把行为交给 pytest 纯函数单测）。
    # 写成**声明层**字段而不是散文，使「前置是什么、为什么本用例跑不了」机器可见 ——
    # 将来若解除 skip，前置不成立会以「agent 不干活」的形态出现（PG-013/CU-003 的教训），
    # 这里先把前提钉住；**不改变用例语义、不解除 skip**。
    precondition: "租户 AI 配置就位：autoHandoffKeywords=[找老板,我要投诉]、afterHoursMode=auto_reply 且当前为非营业时间（TenantAiConfig；agent-eval 栈无法设置 ⇒ 本用例 skip，行为由 tests/test_tenant_config.py 的 is_auto_handoff_trigger / is_after_hours 纯函数单测覆盖）"
    skip_reason: "纯配置函数行为由 pytest 单测（tests/test_tenant_config.py）验证：is_auto_handoff_trigger / is_after_hours 是纯函数，其入参 config（TenantAiConfig）无法经 agent-eval 设置，非 LLM 行为，不进入 C 端评测（issue #3270 断言层归因：原 user_inputs 是断言描述而非顾客对话）"
    merge_log: "POC 机器人设置集成新增；2026-09-11 标 skip —— 原输入为配置描述、断言为纯函数级，agent-eval 无法设置 config（issue #3270）；2026-09-18（issue #4085）：补 `precondition` 声明层字段（原本前置只活在 skip_reason 散文里 ⇒ CASE-TRUST-NO-PRECONDITION-ASSERTION 存量违规），语义与 skip 状态未变"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_tenant_config.py"
      ci:
        - ai-agent-tests.yml
      verifies: []

  - id: ST-009
    legacy_id: ""
    title: "系统通知总开关 - 租户关闭后自动站内信停止发送（#3003）"
    domains:
      - settings
      - notification
    tier: normal
    tags:
      - notification
      - switch
      - setting
    truths_ref:
      - settings-notification.master-switch
    user_inputs:
      - "企业基础设置里关闭「启用系统通知」后，新订单/新售后/状态变更等自动站内信还发吗？"
    expectations:
      - tool: direct_reply
    data_checks:
      - "tenants.notification_enabled=false 的租户：triggerByEvent（order_created / after_sales_created / order_status_changed / after_sales_status_changed）与 triggerForTenantAdmins 直接跳过，不再产生新的自动站内信；历史通知保留"
      - "开关字段为 null（存量租户）默认视为开启，行为不变；triggerByEvent 命中规则仍正常落库"
      - "前端企业基础设置「启用系统通知」描述与实际一致：控制订单、客服等重要事件站内通知的发送；关闭后不再产生新的站内通知（历史通知保留），不再写「当前为站内通知开关」含糊文案"
    skip_reason: "开关接线为 Java 单测验证（NotificationServiceTest）+ 前端文案 vitest，非 LLM 工具行为，不进入 agent-eval 冒烟"
    merge_log: "2026-09-07 新增：企业基础设置「启用系统通知」从死开关接线为租户级自动站内信总开关（issue #3003）"
    traces:
      tests:
        - "backend/admin-api/src/test/java/com/migao/admin/service/NotificationServiceTest.java"
        - "frontend/admin-web/tests/unit/pages/settings.test.tsx"
      ci:
        - pr-check.yml
      verifies: []

