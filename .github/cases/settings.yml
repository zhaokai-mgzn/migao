  - id: ST-011
    legacy_id: ""
    title: "企业收款二维码（微信/支付宝）C 端支付页展示与平台不经手资金（二清规避）"
    domains:
      - settings
      - finance
      - chat
    tier: normal
    persona: ""
    tags:
      - settings
      - payment
    truths_ref:
      - settings-manage.ai-config
    # ── 覆盖说明（issue #3990，M3-F-2/F-3；2026-09-17 issue #4007 期望放宽；
    #    2026-09-18 issue #4085 第 1 项补发射点）──
    # 用户 2026-09-17 新增要求：企业设置支付宝/微信收款二维码，C 端支付页展示扫码支付。
    # 平台不经手资金（二清规避）：二维码是商家自己的收款码，页面须注明「款项直接支付给商家」。
    # ⚠️ 写路径（PUT /api/admin/settings/payment-qrcodes/{type}，system:manage）由确定性单测覆盖
    #    （SettingsControllerTest MockMvc + TenantPaymentQrcodeMapperTest），本用例承担**展示/合规**行为覆盖。
    # ⚠️ 2026-09-18 修正（issue #4085）：本用例原先声称「C 端…渲染 PaymentCard」，而 #4016 P14
    #    已按「工具层无数据源」**裁掉 C 端 `case 'payment'`** ⇒ 那两条 data_checks 与实现**相反**
    #    （声称会渲染、实际永不渲染）。#4085 按用户裁定**补发射点**（C 端只读工具
    #    `payment_qrcode_query` → `_detect_card_type` 映射 `payment` → 渲染分支恢复），
    #    故两条断言改写成与实现一致的形态（写明载荷来源与空态触发条件）。
    # ⚠️ 本用例**不承担**该工具的机器可判覆盖：其 expectation 含 B 端 order_query ⇒ 不进小布腿
    #    用例集（`select_cases_for_persona`）。工具级正向覆盖由 **ST-012**（persona: xiaobu）承担。
    # ⚠️ 期望为 `direct_reply or order_query`（不是裸 direct_reply）：客人/商家问「我支付这笔订单怎么付款」
    #    时，**先查这笔待付款单再给收款码指引**是真实合理行为（run 35233821582 本用例 mibao 腿
    #    R1 实测即 order_query → 旧期望「无工具调用」判红 = 期望过严/假红）。OR 形态两条路径都放行：
    #    · 直接答（无工具调用 + 有 final_text）；
    #    · 或先 order_query（小布腿由 runner 的 check_expectation 同义映射为 customer_order_query）。
    #    保留计分断言（非空期望），不放宽成空断言。
    user_inputs:
      - "我支付这笔订单，怎么付款"
    expectations:
      - tool: direct_reply or order_query
    data_checks:
      - "C 端收款码卡（卡型 `payment`）的**发射点**：C 端只读工具 `payment_qrcode_query`（无参，按租户取商家自己的收款码）返回的 data 即卡载荷 —— 含 `payment_qrcodes` 键（wechat/alipay 子对象含精简字段 image_url/payee_name），卡片渲染微信/支付宝切换与收款方（#4085 第 1 项）"
      - "「应付金额」**只在载荷带 amount 时**展示（对话内收款码查询无订单上下文 ⇒ 不带 amount，卡片不显示金额行）；金额行由组件测试 frontend/mini-app/tests/payment-card.test.tsx 覆盖"
      - "页面注明「款项直接支付给商家」（平台不经手资金，二清规避）"
      - "商家设置端 PUT /api/admin/settings/payment-qrcodes/{type} upsert（wechat/alipay 各一张，非法类型拒绝）—— 由 SettingsControllerTest MockMvc 覆盖"
      - "无收款码时展示降级提示（PaymentCard 空态「商家暂未设置收款码，请联系客服获取收款方式」）—— 触发条件 = 工具 success=true 且 `payment_qrcodes` 为空对象（空是合法答案，不是失败）"
      - "答付款问题前先定位订单（order_query / C 端 customer_order_query）属合格路径；direct_reply 直答亦合格（OR 形态）"
    skip_reason: ""
    merge_log: "2026-09-17 新增（issue #3990）：M3-F 企业收款二维码——C 端展示行为覆盖（persona 双端）；写路径由 MockMvc 单测覆盖。2026-09-17（issue #4007，run 35233821582 ST-011 reproducible）：期望由裸 `direct_reply` 放宽为 `direct_reply or order_query` —— 实测 mibao 腿 R1 先 order_query（查这笔待付款订单）再答付款指引，行为合理却被「期望无工具调用」判红（期望过严）；OR 形态同时保留直接答分支（小布腿 runner 侧 order_query→customer_order_query 同义映射）。2026-09-18（issue #4085 第 1 项）：修正两条与实现**相反**的 data_checks（「C 端渲染 PaymentCard」在 #4016 P14 裁掉渲染分支后已不成立）—— 改为写明真实发射点（payment_qrcode_query → 卡型 payment）、载荷来源与空态触发条件；机器可判覆盖另立 ST-012（本用例含 B 端 order_query 期望，不进小布腿用例集，无法承担该工具的工具级覆盖）"
    traces:
      tests:
        - "frontend/mini-app/tests/payment-card.test.tsx"
      ci:
        - pr-check.yml
      verifies: []

  - id: ST-012
    legacy_id: ""
    title: "小布答顾客问付款/收款码 —— 收款二维码工具可达 + 支付卡发射点（issue #4085 第 1 项）"
    domains:
      - settings
      - finance
      - chat
    tier: normal
    persona: xiaobu
    tags:
      - xiaobu
      - payment
      - settings
    truths_ref:
      - ai-chat.tool-classes
      - settings-manage.ai-config
    # ── 覆盖说明（issue #4085 第 1 项；用户 2026-09-18 裁定「建触发机制」）──
    # 病根形态（与 production_progress 在 #4016 P14 的裁定同构）：PaymentCard 组件早在
    # #3990 就交付在 main，但**没有任何发射点**（#4016 P14 裁掉 C 端 case 'payment' 后
    # 彻底不可达）⇒「交付物在 main ≠ 能力可达」。本用例是该能力的**工具级正向覆盖**：
    # 断言 C 端收款码工具真的被调用且成功（不是「文本里提了一句收款码」）。
    # ⚠️ 期望工具 payment_qrcode_query 只在小布工具集里 ⇒ 单端用例，必须标 persona
    #    （否则另一条腿必挂；CASE-TRUST-SINGLE-LEG-NO-PERSONA 亦会红）。
    user_inputs:
      - "我想付款，收款码在哪里？"
    expectations:
      - tool: payment_qrcode_query
    must_succeed:
      - tool: payment_qrcode_query
    data_checks:
      - "顾客问付款/收款码 → C 端只读工具 `payment_qrcode_query` 被调用且 success=true（must_succeed 机器断言；只要求「工具名出现过」不算）"
      - "工具 data 即支付卡载荷：含 `payment_qrcodes` 键（子对象字段 image_url / payee_name / payment_type）—— 载荷形状合法即可，**不要求内容非空**"
      - "⚠️ 可满足性真值（本用例刻意不要求非空内容）：评测栈种子 tests/agent_eval/fixtures/xiaobu_eval_seed.sql、mibao_eval_seed.sql 与 docs/deployment/demo-seed.sql 里 `tenant_payment_qrcodes` **零行**（按表名检索实测）⇒ 该租户未配收款码，工具返回 success=true + 空 `payment_qrcodes` 是**合法答案**；要求非空即造恒红。非空内容/空态提示由后端单测 tests/test_payment_card_emission.py 与前端 frontend/mini-app/tests/payment-card.test.tsx 覆盖"
      - "工具失败（admin-api 异常/权限不足）时必须带 suggestion 并如实告知，禁止编造收款码或收款方名称"
      - "卡片发射：工具 success=true 且 data 非空 ⇒ chat.py `_detect_card_type` 下发卡型 `payment`（同一轮 SSE card 事件），前端渲染 PaymentCard（有码→收款码；无码→空态提示）"
    skip_reason: ""
    merge_log: "2026-09-18 新增（issue #4085 第 1 项）：用户 2026-09-18 裁定「建触发机制」——新增 C 端只读工具 payment_qrcode_query（数据源复用 GET /api/admin/agent/payment-qrcodes，不新造数据源）→ _detect_card_type 映射 payment → 恢复 mini-app 渲染分支 → 放行「渲染端 ⊆ 后端可产出」L0 契约守卫。本用例提供该工具的工具级正向覆盖（Case Coverage Gate 的 uncovered/missing_positive 缺口由此关闭）。"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_payment_qrcode_query.py"
        - "backend/ai-agent-service/tests/test_payment_card_emission.py"
        - "frontend/mini-app/tests/payment-card.test.tsx"
      ci:
        - pr-check.yml
      verifies: []
