  - id: ST-008
    legacy_id: ""
    title: "机器人设置生效 - 自动转人工关键词 + 非营业时间转人工降级"
    domains:
      - settings
      - chat
    tier: normal
    persona: xiaobu
    tags:
      - ai_config
      - handoff
    truths_ref:
      - settings-manage.ai-config
      - settings-manage.immediate-effect
    user_inputs:
      - "商家配置 autoHandoffKeywords=[找老板,我要投诉] 后，用户消息'我要找老板'应触发转人工"
      - "商家配置 afterHoursMode=auto_reply 且非营业时间时，转人工应降级返回 afterHoursMessage"
    expectations:
      - tool: human_handoff
    data_checks:
      - "is_auto_handoff_trigger('我要找老板', config) == true"
      - "is_after_hours(config, 非营业时间) == true"
      - "非营业时间转人工不创建工单，返回 afterHoursMessage"
    skip_reason: ""
    merge_log: "POC 机器人设置集成新增"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_tenant_config.py"
      ci:
        - ai-agent-tests.yml
      verifies: []

  - id: ST-009
    legacy_id: ""
    title: "系统通知总开关 - 租户关闭后自动站内信停止发送（#3003）"
    domains:
      - settings
      - notification
    tier: normal
    tags:
      - notification
      - switch
      - setting
    truths_ref:
      - agent-notification.master-switch
    user_inputs:
      - "企业基础设置里关闭「启用系统通知」后，新订单/新售后/状态变更等自动站内信还发吗？"
    expectations:
      - tool: direct_reply
    data_checks:
      - "tenants.notification_enabled=false 的租户：triggerByEvent（order_created / after_sales_created / order_status_changed / after_sales_status_changed）与 triggerForTenantAdmins 直接跳过，不再产生新的自动站内信；历史通知保留"
      - "开关字段为 null（存量租户）默认视为开启，行为不变；triggerByEvent 命中规则仍正常落库"
      - "前端企业基础设置「启用系统通知」描述与实际一致：控制订单、客服等重要事件站内通知的发送；关闭后不再产生新的站内通知（历史通知保留），不再写「当前为站内通知开关」含糊文案"
    skip_reason: "开关接线为 Java 单测验证（NotificationServiceTest）+ 前端文案 vitest，非 LLM 工具行为，不进入 agent-eval 冒烟"
    merge_log: "2026-09-07 新增：企业基础设置「启用系统通知」从死开关接线为租户级自动站内信总开关（issue #3003）"
    traces:
      tests:
        - "backend/admin-api/src/test/java/com/migao/admin/service/NotificationServiceTest.java"
        - "frontend/admin-web/tests/unit/pages/settings.test.tsx"
      ci:
        - pr-check.yml
      verifies: []

  - id: ST-010
    legacy_id: ""
    title: "企业基础信息页 - 隐藏「登录日志」（无记录）与「修改密码」（未来短信码登录）（#3006）"
    domains:
      - settings
      - ui
    tier: normal
    tags:
      - setting
      - ui
      - tab
    truths_ref:
      - frontend-fix.settings-basic-only
    user_inputs:
      - "企业基础信息页还有「登录日志」和「修改密码」入口吗？"
    expectations:
      - tool: direct_reply
    data_checks:
      - "企业基础信息页仅展示基本设置（品牌设置 + 通知设置），移除 tab 切换栏；「修改密码」「登录日志」tab 及区块不再渲染（登录日志无记录、修改密码未来由短信验证码登录取代；后端/Agent 接口保留，待短信码登录落地后再评估移除）"
      - "页面副标题不再提「账号安全与登录审计」"
    skip_reason: "纯前端 UI 隐藏由 vitest 验证（settings.test.tsx ST-010），非 LLM 工具行为，不进入 agent-eval 冒烟"
    merge_log: "2026-09-07 新增：企业基础信息隐藏登录日志/修改密码入口（issue #3006）"
    traces:
      tests:
        - "frontend/admin-web/tests/unit/pages/settings.test.tsx"
      ci:
        - pr-check.yml
      verifies: []
