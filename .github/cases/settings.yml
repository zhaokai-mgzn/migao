schema: "case-contract/1.0"
domain: settings

cases:
  - id: ST-001
    legacy_id: "6.1"
    title: "系统设置 - 读取"
    domains:
      - settings
    tier: normal
    tags:
      - query
    truths_ref:
      - settings-manage.read-write
      - settings-manage.secret-hidden
    user_inputs:
      - "查看系统设置"
    expectations:
      - tool: settings_manage
        args:
          action: get_settings
    data_checks:
      - "返回商户名/行业"
      - "响应不含 accessKeyId/accessKeySecret/apiKey/secret"
    skip_reason: ""
    merge_log: "verification 6.1 独有"
