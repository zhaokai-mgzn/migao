  - id: ST-005
    legacy_id: "6.5"
    title: "通知标记已读 —— 变更已接回（#7040）：标记已读要真做（走确认门禁），不得谎称已读"
    domains:
      - settings
      - notification
    tier: normal
    tags:
      - write
      - notification
    truths_ref:
      - agent-notification.notification-status
    user_inputs:
      # 🔴 2026-10-16（issue #7048 P7）：**两轮**。R1 = 商家提出诉求 ⇒ 写确认门禁拦下、
      # 下发 `interact(component=confirm)` 卡；R2 = 商家**明确确认**（整句命中
      # `base_skill.py::_is_explicit_confirmation` 的 `_CONFIRM_EXACT`；本用例只准用
      # **代码里的字面量**，不猜措辞）⇒ 门禁放行 ⇒ `mark_read` **真的可达**。
      # 为什么必须补 R2（P6 的代码级静态证明，零 LLM 可复算）：
      # `_requires_confirmation` 末尾 `return not _is_explicit_confirmation(last_user_msg)` ——
      # R1 输入既不在 `_CONFIRM_EXACT` 也不以 `_CONFIRM_PREFIX` 开头 ⇒ 返回 True（需确认）
      # ⇒ **写被拦**。故「让 agent 别确认直接改」物理上走不通（会被同一段代码拦住），
      # 「真做」这条合格路径**只能**经 R2 的明确确认到达。
      - "把新订单通知标为已读"
      - "确认"
    # ── 2026-10-16 **重锚**（issue #7048 P1 · 项 A；承接 #7049 把变更接回 B 端）──────────
    # 三次沿革（**每一次都是「前提变了」，不是放开判据**）：
    #   ① #5302（2026-09-25）：`mark_read` / `read_all` 被从工具源码删除 ⇒ 期望收成
    #      `direct_reply`（如实告知「能力已下线」+ 引导通知中心）；
    #   ② #7040/#7049（2026-10-16）：用户「能力边界 终版」裁定 **变更 ✅** ⇒ 两个写 action
    #      **接回**（`backend/ai-agent-service/app/tools/notification_manage.py` 的
    #      `VALID_ACTIONS = {list, unread_count, mark_read, read_all}`，`read_only = False`，
    #      `READ_ONLY_ACTIONS = {list, unread_count}`）⇒ ①的问法**自身编码了被推翻的只读口径**
    #      （「能力已下线（只读域）」），必须按新能力重锚；
    #   ③ 本次（issue #7048）：期望 = **工具调用（真做）或确认类澄清卡（先确认再改）**。
    # 判据边界（写清楚，防被读成"什么都算过"）：
    #   · `notification_manage` 侧：`mark_read` / `read_all` ∈ `WRITE_TOOL_ACTIONS`（#7040 填回）
    #     ⇒ 非只读 action 走 `BaseTool` 的写确认门禁（`react_turn` 的门禁 11/11），
    #     **先确认再改** 与 **本轮直接改** 都是合格落地形态 ⇒ 期望取 OR；
    #   · `interact` 侧：**写确认门禁**产出的 `interact(component=confirm)` 卡（"先确认再改"）
    #     也算合格 —— 与 DF-008 的既有口径同形；
    #   · **不得谎称已读**：`forbidden_text` 为主判据（内容一字未动）；
    #   · **调用失败不得算过**：`must_succeed[notification_manage, only_if_called]` ——
    #     「没去改」不算失败，「**去改了就必须成了**」（先例 = AS-003/AS-005 的条件效果层）。
    # ⚠️ 期望里为什么是**单个** `mark_read`（而**不是** `mark_read or read_all`）：
    # ① 用户输入是**单条**（「把**新订单通知**标为已读」）⇒ 真值就是 `mark_read`
    #    （`read_all` = 「全部标记已读」是另一件事，商家的诉求里没有它）；
    # ② runner 的 `args` 做**值级**匹配（只读查询那套同义集不覆盖写 action）⇒
    #    `"mark_read or read_all"` 这种 OR 串**不是**合法 action 值，会静默匹配不上；
    # ③ 写分类不依赖值：`notification_manage` 在 `WRITE_TOOL_ACTIONS` 里、`mark_read` ∈ 写集合
    #    ⇒ `assertion_taxonomy.is_write_expectation` 判写，`must_succeed` 是它的效果层。
    # ── 2026-10-16 **OR 面收口**（issue #7048 P7）────────────────────────────────
    # 病灶（runner 语义 + P6 复跑实测）：上面的"两次等价的落地形态"原写成**两条并列 entry**
    # `[notification_manage(action=mark_read), direct_reply or interact]`，而 runner
    # **逐条计分**（`score = passed_expectations / total_exp`，见 `run_case`），
    # **每条独立必需** ⇒ 「先确认再改」路径（本轮真值只有 list/unread_count + confirm 卡，
    # `mark_read` 要等商家点确认才发）**恒判 50%**（P6 实测读数：`rounds=1
    # tools=['notification_manage','notification_manage','interact'] score=50%`，
    # 红在 `notification_manage(action=mark_read) → arg 'action' expected mark_read got unread_count`）。
    # 这与 PR-006 的「恒 50%」**同一形态**（该用例注释早已写死"**不能**写成两条独立声明"），
    # 那里走的是同一条出路 —— **一条 OR 文本**：`check_expectation` 原生支持 `A or B`
    # （拆法见 `local_runner.py` 的 `check_expectation`：`parts = split(" or ")`），
    # 且 OR 的每一分支**各自**做 `args` 值级校验 ⇒ 两条路径各认自己的证据、互不顶替。
    # ⚠️ 该 OR **不放大任何面**（三面照旧独立必需）：
    #   · `forbidden_text` **只收窄轮次作用域、五条禁词一字未删**（见下方该字段的注释）；
    #   · `must_succeed[notification_manage, only_if_called]` 一字未动
    #     ⇒「去改了就必须成了」；**本轮不执行**（确认卡路径）时它仍按 `only_if_called` 放过；
    #   · 写分类（`is_write_expectation`）仍判写：`notification_manage` 的 `mark_read` ∈
    #     `WRITE_TOOL_ACTIONS`，**改的只是"同一件事的一次通过条件"，不是"要不要做"**。
    # ⚠️ 为什么**去掉** `direct_reply` 分支（这是本包**收紧**、不是放宽，如实登记）：
    # `direct_reply` 的 runner 语义 = 「本轮无 tool_calls 且有文本」⇒ 接受它就等于接受
    # **一次工具都没调、纯文本**的落地形态 —— 而那条文本既不能证明去改了、也不能证明
    # 给了确认入口（"文本可满足的写用例"= 假绿通道）。本用例的合格形态只有两种：
    # **真去改（成功）** 或 **给出写确认卡**。收紧后「纯文本」变成判红（红证见
    # `tests/unit_ci_workflows/test_eval_expectation_or_group.py`）。
    # ⚠️ **形态必须是「字符串 + 每个分支内联自己的 args」**（与 PR-006 的
    # `"inventory_manage(action=low_stock_alert) or product_search(stock_status=low_stock)"` 同形）：
    # `.github/assertion_taxonomy.py::expectation_tools` 对 **dict 形态**只按 ` or ` 拆 `tool` 字段，
    # 而 `args` 是**整条 entry 共用**的 ⇒ dict 形态下 `"notification_manage(action=mark_read)"`
    # 会被当成**整个工具名**（连括号一起）⇒ 它不在 `WRITE_TOOL_SURFACE` 里 ⇒
    # 「本用例是写用例」与 action 级写方的扫描面**双双失明**（CI 实测：
    # `tests/unit_ci_workflows/test_shared_fixture_write_restore.py::test_scan_surface_covers_the_known_writers`
    # 报 `真实库里解析不到任何 action 级写方 … assert []`）。字符串形态走**逐分支**解析
    # （`_EXP_TOOL_RE` 取工具名 + 正则取该分支的 args）⇒ 写身份与 args 值级校验都正确。
    expectations:
      - "notification_manage(action=mark_read) or interact"
    # forbidden-text-intent: 预测/承诺话术的禁令仍是主判据之一 ——
    # 「不能做」已不再是本用例的真值（能力已接回），真值是「**不得谎称已读**」
    # （说了已读就必须真有 success 的调用；`must_succeed` 是这一半的机器判据）。
    # ── 2026-10-16 **禁令收窄到「写轮之前」**（issue #7048 P7；**五条禁词一字未删**）──────
    # 为什么必须收窄（P6 的代码级静态证明 + 本包逐条复算）：这五条是「能力已下线」时代对
    # **假承诺**的禁令；#7049 把变更接回后，**真调用成功**时「已为您标记为已读」是**如实陈述**
    # ⇒ 若让写真执行（R2 确认后），**一句真话会撞全程禁令**（用例自相矛盾）。
    # 逐条读数（`check_forbidden_text` 直测，零 LLM）：
    #   · 全程语义 + R2 真话「已为您标记为已读」⇒ `forbidden_text: 回复含反模式词「已为您标记」（R2）`（**假红**）
    #   · 轮次作用域(R1) + 同一条真话在 R2 ⇒ 无违规 ✓ ；同一条话在 R1（**先声张**）⇒ 判红 ✓
    # 收窄后的语义 = 「**先声张即违规**」：R1（**做之前**）出现任一禁词即红 —— 这**不削弱**
    # 禁令原意（假承诺派的正是"没做就说做了"），反而更精确；R2 之后的如实陈述不再误伤。
    # ⚠️ 与 PG-013（issue #3833）的修法**同形**：全程禁令把「问答轮如实陈述」与
    # 「写操作轮拒绝执行」判成同一件事 ⇒ 治法是把模糊的全程禁令收紧成「**轮次 + 措辞**」
    # 精确断言，**不是**把禁词删掉（真拒绝 / 真假承诺必须仍红；红证见
    # `tests/unit_ci_workflows/test_eval_expectation_or_group.py`）。
    # 未削弱项：R1 的假承诺面**完整保留**；「不得谎称已读」的另一半（说了已读就必须真有
    # success 的调用）仍由**全程**生效的 `must_succeed` 把守（对 R2 同样有效）。
    forbidden_text:
      - round: 1
        text: "已标记为已读"
      - round: 1
        text: "已标为已读"
      - round: 1
        text: "已全部标记"
      - round: 1
        text: "已经帮您标记"
      - round: 1
        text: "已为您标记"
    # 条件效果层（「调用了 ≠ 成了」，#3778）：声明了写工具就必须证明它成了。
    # `only_if_called` 的理由：本用例合格形态之一是**先出确认卡、本轮不执行**
    # （商家尚未确认）⇒ 无条件声明会把合格行为判红（先例 = AS-003/AS-005 的 `only_if_called`）。
    must_succeed:
      - tool: notification_manage
        only_if_called: true
    # ── 自清理 + 前置自断言（issue #7048 P1 · 项 A）────────────────────────────────
    # 本条重锚回写面后**重新**成为写类用例 ⇒ 规则 b（自清理）/ f（前置自断言）随即到期
    # （#7049 之后 `test_case_trust_gate.py` 的全量对账当场判出
    # `CASE-TRUST-NO-SELF-CLEAN` + `CASE-TRUST-NO-PRECONDITION-ASSERTION`，**未登记即阻塞**）。
    # · `namespaces`：写产物是**本人收件箱里的未读通知** ⇒ 争用面 = 「该收件人存在未读通知」。
    #   声明命名空间与同域用例自动互斥（弱证据形态，与 HR-005 的 `role_code:` 同款用法）。
    # · `preconditions`：**声明层字段**（`declares_precondition()` 认的那种），
    #   与 HR-005 的用法逐字同构；**有意不发明 typed `precondition` 类型** ——
    #   runner 的 `_PRECONDITION_TYPES` 里没有「未读通知存在」这一类（不发明、不拿别的类型冒充）。
    # ⚠️ 复位手段的边界（**2026-10-16 P10 已解除**，如实登记沿革）：P1 写下本段时
    #   **没有** `notification_unread_restore` 这类复位类型（agent 写面只有 `mark_read` /
    #   `read_all`、**没有** `mark_unread` ⇒ 真做一次就不可逆），故本条当时**有意不声明
    #   `pre_clean`**（写不存在的复位类型 = 静默空转 / 假绿，`migao-dev-flow` §19.1）。
    #   ⇒ P10 把那一半补上了（先例 = P9 给 PR-021 补 `_restore_sku_price` 的回读维度）：
    #   runner 侧新增 `notification_unread_restore`（`tests/agent_eval/local_runner.py::
    #   _restore_notification_unread`，DB 直连 + 幂等 + 回读校验 + fail-closed），
    #   本条**改声明 `pre_clean`** ⇒ 「每次尝试的前置」回到 fixture 初始态（未读）。
    #   ⚠️ 为什么这不是"放宽"：判据面（expectations / must_succeed / forbidden_text）
    #   **一字未动**，改的只是**夹具前置**——原来它只靠 `namespaces` 弱证据（并行互斥，
    #   不解决"首跑消费掉唯一那条未读通知 ⇒ 重试/重跑前置不等价"）。
    #   ✅ `namespaces` **保留**（它承担的是另一半：与同域用例的并行互斥，与 `pre_clean`
    #   正交）—— 两者都在 `SELF_CLEAN_FIELDS` 里，规则 b 现在拿到的是**强证据**。
    #   `account_password:` 是**既有**的「本人账号态」登记前缀（#5055 给 ST-003 加的）——
    #   本格复用它而不是新开前缀，理由：**新前缀会落进 `test_case_seed_truth.py` 的分类盲区**
    #   （该判据的 `TestNoSilentSkip` 要求每个空前缀都入表；不入表即红，而入表要改它自己），
    #   且「不触达种子实体」这一语义与 ST-003 完全一致（账号密码 / 未读通知都**不在**
    #   `extract_seed_catalog` 的实体目录里）⇒ 用既有登记位比新增一个同义前缀更少漂移面。
    namespaces:
      - "account_password:notifications_mark_read"
    # ── 夹具前置复位（2026-10-16 P10）────────────────────────────────────────────
    # 病灶（本包两次窄跑的**改前**读数，逐字）：`--case-ids ST-005,PR-108` 同一栈连跑两次，
    # 两次都 `rounds=2 tools=[notification_manage×2/×3] score=0%`，红在
    # `notification_manage(action=mark_read) or interact → arg 'action' expected mark_read got list`，
    # R1 trace = `notification_manage(items=0 total=0 …)`（agent 查到的是"没有未读通知"）。
    # 成因 = 夹具行 `ntf_eval_new_order_0001` 是**一次性**的：本用例的真值动作就是把它标成
    # 已读，而 P1 那版**没有复位手段** ⇒ 首跑之后同一栈上的第二次尝试必然看到已读态
    # （**同一用例自己的产物污染自己的重试**，与 #3833 的 PG-013 / #3751 的 AS-004 同族）。
    # 修法 = 声明本复位（实现体见 runner；口径与 seed 的 Phase 6
    # `ON CONFLICT (id) DO UPDATE SET status='sent', read_at=NULL` **逐字一致**）。
    pre_clean:
      - type: notification_unread_restore
        notification_id: "ntf_eval_new_order_0001"
        recipient_id: "dev_user"
    preconditions:
      - "商家本人的通知中心里存在**至少一条未读通知**（否则 `mark_read` 无对象、agent 无从标记）｜ 变体：目标通知已读 ⇒ agent 合理地答「这条已是已读」，此时本用例的红不构成缺陷（前置面，不是行为面）"
    data_checks:
      - "真值 = 变更（标记已读）已在能力面内，且该调用必须走写确认门禁（非只读 action）"
      - "整场不得出现假承诺话术（机器断言见 forbidden_text）"
      - "标记已读的落库真值由 admin-api 侧承担：PUT /api/admin/notifications/{id}/read（单条）/ PUT /api/admin/notifications/read-all（全部）"
    skip_reason: ""
    merge_log: "verification 6.5 独有 ｜ 2026-09-25（issue #5302，settings 域只读化收口）**退场改造**：原 `expectations[notification_manage(action=mark_read or read_all)]` 与 data_check「status 变为 read」**整体移除**（写 action 已从工具删除 ⇒ 永久不可满足，留着就是悬空声明 + 假红）；改判新行为 = 如实告知 + 引导到「通知中心」+ 不得假承诺（`forbidden_text` 承载禁令面）；`tags` 由 `write` 改判 `query`（本域已无写能力）。 ｜ 2026-10-16（issue #7048 P1 · 项 A，承接 #7049 把变更接回 B 端）**重锚回写面**：`title` 去掉逐字编码旧口径的「能力已下线（只读域）」；`expectations` 由 [`direct_reply`] 改为 [`notification_manage(action=mark_read)`, `direct_reply or interact`]（**工具调用 / 确认卡 / 澄清话术**三种合格落地形态）；新增 `must_succeed[notification_manage, only_if_called=true]`（效果层：去改了就必须成了）；`forbidden_text` 五条**一字未动**（禁令仍是主判据之一）；`tags` 由 `query` 改回 `write`。**红证**：把 `mark_read` 加进工具源码的 `READ_ONLY_ACTIONS`（= 绕过写确认门禁）⇒ `backend/ai-agent-service/tests/test_notification_manage_change_actions.py::test_read_only_actions_are_the_read_ones_only` + `test_confirmation_gate_is_declared` 当场判红（已实测：2 failed）；`tests/unit_ci_workflows/test_mibao_b_end_readonly.py` 判据 8 同向。 ｜ 2026-10-16（issue #7048 P1 · 项 A）**补自清理 + 前置自断言**：重锚回写面后本条**重新**成为写类用例 ⇒ 规则 b/f 到期（#7049 之后 `test_case_trust_gate.py` 的全量对账当场判出 `CASE-TRUST-NO-SELF-CLEAN` + `CASE-TRUST-NO-PRECONDITION-ASSERTION`，**未登记即阻塞**）。修法：① `namespaces[account_password:notifications_mark_read]`（**复用** #5055 给 ST-003 登记的「本人账号态」前缀，而不是新开 `notification:` —— 新前缀会落进 `tests/unit_ci_workflows/test_case_seed_truth.py` 的 `TestNoSilentSkip` 分类盲区，且语义同族：二者都**不触达种子实体**）；② `preconditions`（声明层字段，与 HR-005 同形，**有意不发明 typed precondition 类型**）。**有意不声明 `pre_clean`**：agent 写面只有 `mark_read` / `read_all`、**没有** `mark_unread` ⇒ 真做一次不可逆，写不存在的复位类型 = 静默空转（如实登记在用例注释里）。断言面（expectations / must_succeed / forbidden_text）一字未动。 ｜ 2026-10-16（issue #7048 **P10**）**补夹具复位**（那一半 P1 时**没有手段**）：新增 runner 侧 `notification_unread_restore`（`tests/agent_eval/local_runner.py::_restore_notification_unread`；DB 直连 + 幂等 + 回读校验 + fail-closed，口径与 seed 的 Phase 6 `ON CONFLICT (id) DO UPDATE SET status='sent', read_at=NULL` 逐字一致），本条**改声明 `pre_clean[notification_unread_restore]`**（点名夹具行 `ntf_eval_new_order_0001` / 收件人 `dev_user`）。**病灶读数（本包两次窄跑，改前）**：同一栈连跑两次均 `rounds=2 score=0%`，R1 `notification_manage(items=0 total=0)` = 夹具行已被**上一次尝试**消费（同一用例自己的产物污染自己的重试，同族 = #3833 PG-013 / #3751 AS-004）。**判据面一字未动**（expectations / must_succeed / forbidden_text 照旧），`namespaces` **保留**（承担并行互斥那一半，两字段正交，规则 b 由弱证据升为强证据）。"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_tools_notification_manage.py"
        - "backend/ai-agent-service/tests/test_settings_domain_readonly.py"
      ci:
        - agent-eval.yml
      verifies: []

  - id: ST-008
    legacy_id: ""
    title: "机器人设置生效 - 自动转人工关键词命中后如实告知（无人工通道）+ 非营业时间降级（确定性层）"
