    skip_reason: "[backend-contract] HTTP 契约由 admin-api 单测验证，非 Agent 行为，不进入 agent-eval 冒烟"
    merge_log: "2026-10-31 新增（issue #8295）：页面接入的 API 契约"
    traces:
      tests:
        - "backend/admin-api/src/test/java/com/migao/admin/controller/CustomerImportControllerTest.java"
      ci:
        - pr-check.yml
      verifies: []

  - id: MIG-008
    legacy_id: ""
    title: "AI 映射客户端失败语义：超时/非 2xx/坏 JSON ⇒ null，由确定性兜底"
    domains:
