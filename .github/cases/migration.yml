      - ai-mapping
    truths_ref: []
    user_inputs:
      - "打开 /customers/import，上传任意表头客户 Excel"
    expectations: []
    data_checks:
      - "analyze 返回 success=true 后页面渲染每个源列 + 样本 + 目标字段下拉；AI 建议预选；必填 externalId/displayName 有标记（承载体 = page.test.tsx）"
