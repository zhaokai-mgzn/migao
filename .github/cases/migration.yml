# cases/migration.yml — 客户主数据迁移（issue #8295）
# 来源：用户 2026-10-31 裁定「期初做客户主数据，用 AI 做非固定模板」。
# 本域是 admin-api / admin-web / ai-agent-service 的内部 AI 映射端点，不是 Agent 工具行为面；
# 用例承载体为 Java / pytest / Vitest 单测（skip_reason 已如实登记）。

schema: "case-contract/1.0"
domain: customer

cases:
  - id: MIG-001
    legacy_id: ""
    title: "客户 Excel 任意表头：AI 映射建议（非固定模板）"
    domains:
      - customer
    tier: normal
    tags:
      - ai-mapping
      - backend-contract
    truths_ref: []
    user_inputs:
      - "POST /api/internal/migration/customer-mapping {headers:['购货单位','联系方式','送货地点'], ...}"
    expectations: []
    data_checks:
      - "AI 返回 mappings：source_index 指向正确列，target_field ∈ 请求 fields[].key；未知 target / 越界 index / 重复 target 被过滤（承载体 = tests/test_customer_mapping.py）"
      - "合法映射 confidence ∈ [0,1]；degraded=false 只在 LLM 输出可解析时出现"
    skip_reason: "[backend-contract] 内部 AI 映射端点的 JSON 契约由 pytest 单测验证，非 LLM 行为，不进入 agent-eval 冒烟"
    merge_log: "2026-10-31 新增（issue #8295）：客户主数据迁移 MVP，AI 只给列映射建议，不执行导入"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_customer_mapping.py"
      ci:
        - ai-agent-tests.yml
      verifies: []

  - id: MIG-002
    legacy_id: ""
    title: "客户 Excel 任意表头：AI 输入样本脱敏"
    domains:
      - customer
    tier: edge
    tags:
      - ai-mapping
      - pii
      - backend-contract
    truths_ref: []
    user_inputs:
      - "样本含手机号 13800138000 / 邮箱 a@b.com 时调用映射端点"
    expectations: []
    data_checks:
      - "送给 LLM 的 prompt 不含原始手机号/邮箱；手机号与邮箱已打码（承载体 = tests/test_customer_mapping.py::test_masks_pii_before_prompt）"
      - "日志不含样本原文；端点只返回映射建议，不回传客户样本之外的完整行"
    skip_reason: "[backend-contract] 脱敏判据由 pytest 单测验证，非 LLM 行为，不进入 agent-eval 冒烟"
    merge_log: "2026-10-31 新增（issue #8295）：客户 PII 不送模型的硬约束"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_customer_mapping.py"
      ci:
        - ai-agent-tests.yml
      verifies: []

  - id: MIG-003
    legacy_id: ""
    title: "AI 映射不可用/输出非法 ⇒ 降级但不阻断迁移"
    domains:
      - customer
    tier: edge
    tags:
      - ai-mapping
      - degraded
      - backend-contract
    truths_ref: []
    user_inputs:
      - "LLM 抛异常或返回非 JSON 时调用映射端点"
    expectations: []
    data_checks:
      - "端点仍返回 success=true + degraded=true + mappings=[]，不抛 500（承载体 = tests/test_customer_mapping.py）"
      - "admin-api analyze 在 AI 不可用时用确定性表头别名兜底，aiDegraded=true，页面可手工映射"
    skip_reason: "[backend-contract] 降级契约由 pytest + Java 单测验证，非 LLM 行为，不进入 agent-eval 冒烟"
    merge_log: "2026-10-31 新增（issue #8295）：AI 可用性不得阻断迁移"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_customer_mapping.py"
        - "backend/admin-api/src/test/java/com/migao/admin/service/CustomerImportServiceTest.java"
      ci:
        - ai-agent-tests.yml
        - pr-check.yml
      verifies: []

  - id: MIG-004
    legacy_id: ""
    title: "客户 Excel 解析 + 列映射分析：任意表头、空表头、行数上限"
    domains:
      - customer
    tier: normal
    tags:
      - excel
      - backend-contract
    truths_ref: []
    user_inputs:
      - "POST /api/admin/customers/import/analyze multipart file"
    expectations: []
    data_checks:
      - "任意表头（购货单位/联系方式/送货地点）能解析出 headers + 样本 + 确定性映射建议；不写库"
      - "空表头补「列N」；超过 2000 行 / 5MB 显式 422，不静默截断（承载体 = CustomerImportParserTest）"
    skip_reason: "[backend-contract] Excel 解析/边界由 admin-api 单测验证，非 Agent 行为，不进入 agent-eval 冒烟"
    merge_log: "2026-10-31 新增（issue #8295）：客户导入第一步（只读分析）"
    traces:
      tests:
        - "backend/admin-api/src/test/java/com/migao/admin/service/CustomerImportParserTest.java"
        - "backend/admin-api/src/test/java/com/migao/admin/service/CustomerImportFieldsTest.java"
        - "backend/admin-api/src/test/java/com/migao/admin/service/ParsedCustomerSheetTest.java"
      ci:
        - pr-check.yml
      verifies: []

  - id: MIG-005
    legacy_id: ""
    title: "试运行绝不写库；缺 externalId / 重复 externalId / 手机号冲突 ⇒ 行错误"
    domains:
      - customer
    tier: normal
    tags:
      - preview
      - fail-closed
      - backend-contract
    truths_ref: []
    user_inputs:
      - "POST /api/admin/customers/import/preview multipart file + mapping"
    expectations: []
    data_checks:
      - "preview 期间 mapper 的 insert/update 零调用，客户行数不变（承载体 = CustomerImportServiceTest）"
      - "缺 externalId / displayName、文件内 externalId 重复、手机号撞他人 ⇒ action=ERROR，不写该行"
    skip_reason: "[backend-contract] 试运行只读判据由 admin-api 单测验证，非 Agent 行为，不进入 agent-eval 冒烟"
    merge_log: "2026-10-31 新增（issue #8295）：先试运行、人确认再写"
    traces:
      tests:
        - "backend/admin-api/src/test/java/com/migao/admin/service/CustomerImportServiceTest.java"
        - "backend/admin-api/src/test/java/com/migao/admin/mapper/CustomerProfileMapperTest.java"
      ci:
        - pr-check.yml
      verifies: []

  - id: MIG-006
    legacy_id: ""
    title: "正式导入按 externalId 幂等：重跑不重复建、updateExisting 可控更新"
    domains:
      - customer
    tier: normal
    tags:
      - idempotency
      - backend-contract
    truths_ref: []
    user_inputs:
      - "POST /api/admin/customers/import/commit（同一文件重跑；updateExisting=false/true）"
    expectations: []
    data_checks:
      - "首次创建写 external_id + wechat_nickname + phone + default_receiver_address；同一 (tenant, external_id) 仍 1 行（承载体 = CustomerImportServiceTest）"
      - "重跑 updateExisting=false ⇒ SKIPPED；true ⇒ 调 updateCustomer 且不新建；created/updated/skipped/failed 计数与行一致"
    skip_reason: "[backend-contract] 幂等/重跑由 admin-api 单测验证，非 Agent 行为，不进入 agent-eval 冒烟"
    merge_log: "2026-10-31 新增（issue #8295）：客户主数据迁移的核心安全护栏"
    traces:
      tests:
        - "backend/admin-api/src/test/java/com/migao/admin/service/CustomerImportServiceTest.java"
      ci:
        - pr-check.yml
      verifies: []

  - id: MIG-007
    legacy_id: ""
    title: "客户导入 HTTP 端点：analyze/preview/commit + customer:create 权限"
    domains:
