      - "🔴 判据·**异常优先 + 渐进披露**：「布剩在哪」按余量降序（**纯排序**），12 行默认只渲染 8 行且**余量最大的排第一**（不排序时它会被切掉 ⇒ 红）；点 `saving-batch-groups-toggle` 后最小余量的那行出现。"
      - "🔴 判据·**合计行 = 服务端 total**：逐单省料表新增 `saving-saved-groups-total`，渲染 99 米 / 999 元（服务端合计腿），**不是**逐行求和 77 米 / 88.88 元 —— 判据 1（逐值相等、前端零算术）由此再加一道锁。"
      - "🔴 判据·**新用户 5 问**：整页文本面必须答得出 ①省了多少 ②布还剩在哪、剩多少 ③比上期好还是坏 ④为什么两个指标要一起看 ⑤存量导入为什么单列（缺任一条即红）。"
      - "判据·**两张表的时间轴说明 + 趋势分母警示**：`saving-period-axis-note`（收货月 vs 消耗月不是一回事）、`saving-trend-caveat`（产出面积跨品类不可比、只跟自己的历史比）；`saving-footnotes` 折叠区含「无数据 ≠ 0 / 金额是下界 / 存量导入单列」。"
      - "🔴 判据·**两腿同参（防口径漂移）**：`board` 与 `trend` 收到的 params 必须深相等 —— 只给一条腿加筛选（例如只加 `productId`）会让结论卡①（单商品）与②（全店）分属两个域，而账面上看不出来。"
      - "判据·**向后兼容**：后端未部署（响应无 `comparison` 键）⇒ 页面不崩、且不渲染任何环比块（滚动发布安全）。"
      - "判据·**既有口径一条不放宽**（🔴 2026-10-07 改判后重述）：PR-093 的逐值相等（前端零算术）、PR-094 的「历史导入不进计量腿」、PR-095 的「无数据 ≠ 0 / 档位文案来自服务端」、PR-096 的「不损失客户」与 UI-057 的零内部代号**全部继续绿**；**新增**的是「零服务端分组标签」与「旧形态结构性退场」。⚠️ 一处**定位串**改判（如实登记）：省料明细行 testid 由 `saving-saved-group-<cohort>-<period>` 改为 `saving-saved-group-<period>-<materialKey>` —— 来源组维度已不上屏，行内不再有 cohort 列；**断言强度不变**（仍是「逐行原样渲染服务端值」）。"
