      - "判据 4·**两态语义不变**（反向护栏；🔴 2026-09-21 改判，issue #4939 配套 #4951 去部位化彻底版）：**有价**（`¥x.xx`，真 0 元**照显示** `¥0.00`）/ **未定价**（`unit_price=null`，**不得**显示成 `¥0.00`）两态可区分。**改判要点（判据面缩小、不放宽）**：原第三态「`不做`」（`applicable=false`）随 #4951 **退场** —— 存活价目行的 `applicable` 恒 `TRUE`（V102/V104）且该字段已从读面类型退场 ⇒ `na` **永不可达**，`data-state` 收敛为 `priced` / `unpriced`；判据由「三态可区分」改为「**恰两态** + 『不做』不得出现在任何单价格里」（补了反向断言），载体仍是 `operation-price-<工序>` 的 `data-state`。**「未定价 ≠ ¥0.00」与「真 0 元照显示」两条一字不放宽。** 证据：同文件「反向护栏 B5：两态语义**不变** —— `未定价` ≠ `¥0.00`；`applicable` 退场后**恰两态**（`na` 不可达）」+「⑰-④ 两态可区分：`¥0.00` 是真价（≠「未定价」）、`未定价`；第三态「不做」已随 #4951 退场（反向护栏）」。"
