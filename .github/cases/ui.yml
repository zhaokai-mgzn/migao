    user_inputs:
      - "用户逐字：「我们系统中暴露了大量的这种研发过程产生的文字，适当的文档可以引导和教育用户如何使用我们的产品，但是这类文案明显不是一个好的引导文案」「最好是扫描下全部商家后台页面，目标是提高文案的真实价值和作用，去除这类看不懂的文字」 —— 现场病灶（截图逐字）：库存明细「端点没有关键词参数」「批次读面没有分页参数……本页宁可不查，也不做「一次拉全量」的假方便」；工艺配置「未定价 = 还没定价（≠ ¥0.00…）（issue #4886）」「判定：净窗高 > 超高阈值（oversize_height_threshold）」「判据是客户口径（企业参数，可配），非 ERP 实证」"
