# cases/ui.yml — 前端 UI 织物质感设计 token 用例（issue #2534）
# 来源：issue #2534（经营看板织物质感重设计 · 子任务 A：设计 token 迁移）。
# 纯前端 token 契约（tailwind.config.ts + src/ 默认蓝清理），由 vitest 单测验证，
# 不进入 agent-eval 冒烟（skip_reason 显式标注）。

schema: "case-contract/1.0"
domain: ui

cases:
  - id: UI-001
    legacy_id: ""
    title: "织物质感设计 token - primary/accent/neutral 三阶与默认蓝清理"
    domains:
      - ui
      - frontend
    tier: normal
    tags:
      - ui
      - token
      - tailwind
    truths_ref:
      - frontend-fix.ui-token
    user_inputs:
      - "经营看板织物质感重设计子任务 A：建立设计 token 体系"
    expectations:
      - tool: direct_reply
    data_checks:
      - "tailwind.config.ts theme.extend.colors.primary[500] = '#48618f'"
      - "tailwind.config.ts theme.extend.colors.accent[500] = '#c06a3e'"
      - "tailwind.config.ts theme.extend.colors.neutral[50] = '#faf7f2'"
      - "frontend/admin-web/src/**/*.{ts,tsx} 扫描 '#3b82f6'（大小写不敏感）计数 = 0"
    skip_reason: "纯前端设计 token 由 vitest 单测验证（tests/unit/tailwind.config.test.ts），非 LLM 行为，不进入 agent-eval 冒烟"
    merge_log: "2026-08-25 新增：经营看板织物质感重设计子任务 A（issue #2534）"
    traces:
      tests:
        - "frontend/admin-web/tests/unit/tailwind.config.test.ts"
      ci:
        - pr-check.yml
      verifies: []
  - id: UI-002
    legacy_id: ""
    title: "经营看板密度治理 - 商品销量排行表头不截断 + 订单趋势 x 轴降采样"
    domains:
      - ui
      - frontend
    tier: normal
    tags:
      - ui
      - dashboard
      - density
      - axis-sampling
    truths_ref:
      - frontend-fix.dashboard-no-truncate
      - frontend-fix.axis-sampling
      - frontend-fix.dashboard-no-overflow
    user_inputs:
      - "经营看板织物质感重设计子任务 B：dashboard 密度修复（表格/图表多视口）"
    expectations:
      - tool: direct_reply
    data_checks:
      - "商品销量排行表头「日涨」列渲染 whitespace-nowrap，1440×900 与 1280×800 两视口无截断"
      - "订单趋势图 x 轴刻度按 sampleTickIndices 降采样，1280 宽度下标签数 ≤ 7 且不密集重叠"
      - "dashboard 页面在 1440×900 与 1280×800 两视口无水平/垂直截断或溢出"
    skip_reason: "纯前端密度/布局治理由 vitest 单测验证（axis-sampling.test.ts + dashboard.test.tsx），非 LLM 行为，不进入 agent-eval 冒烟"
    merge_log: "2026-08-25 新增：经营看板织物质感重设计子任务 B（issue #2537）"
    traces:
      tests:
        - "frontend/admin-web/tests/unit/lib/axis-sampling.test.ts"
        - "frontend/admin-web/tests/unit/pages/dashboard.test.tsx"
      ci:
        - pr-check.yml
      verifies: []
