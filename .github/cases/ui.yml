  - id: UI-030
    legacy_id: ""
    title: "黄金策交互组件渲染三态固化 —— interactive（等待用户）/ readonly（已答只读）/ hidden（流式中），渲染决策收敛为纯函数 resolveInteractiveState，FAB 浮窗与 /chat 工作台共用同一 MessageList 链路"
    domains:
      - ui
      - frontend
      - chat
    tier: normal
    tags:
      - ui
      - admin-web
      - chat
      - interactive
      - render-freeze
    truths_ref:
      - frontend-fix.no-api-change
    user_inputs:
      - "黄金策（admin-web）interact 交互组件（choice/confirm/form）渲染不确定：已回复的卡片锁是组件本地 useState(submitted)，FAB 关闭重开/会话切换后组件重挂载 → 锁重置 → 已经确认的卡片重新可点 → 可重复提交（重复建单/下单）"
      - "企业级要求渲染逻辑与效果固定：同一消息任何时候渲染结果一致，不能一会渲染可交互控件、一会渲染只读/消失控件"
    expectations:
      - tool: direct_reply
    data_checks:
      # ── 前置自断言（issue #4616/#4617 的 burn-down 缴费 —— 本用例命中的**唯一**一条存量违规是
      #    CASE-TRUST-NO-PRECONDITION-ASSERTION，metric=entries ⇒ 必须**整条销账**）──
      # 本用例是 `[backend-contract]` 用例（不进 agent-eval），判据全在下面 traces 的两个 vitest
      # 文件里；它们**全部以「纯函数 resolveInteractiveState 存在 + MessageList 已接线」为前提**。
      # 前置不成立（纯函数没落地 / 接线被绕过）时，单测只能报「找不到导出 / 行为不符」——
      # 判红会伪装成「渲染决策写错了」，归因错人（与 PP-006 / PP-007 同一形态、同一修法）。
      # 口径：`assertion_taxonomy.declares_precondition` ② 认「`data_checks` 里含前置关键词
      # **且**是机器计分型」，故本条带 `success=true`（= 计分标记，不新增断言强度）。
      # **断言面（user_inputs / expectations）与其余 data_checks 一字未动、无放宽。**
      - "前置（precondition）：`frontend/admin-web/src/lib/interactive-render.ts` 导出纯函数 `resolveInteractiveState`，且 `MessageList.tsx` 的交互组件渲染确实经它决策（不是各调用点各判一次 `message.isStreaming`）—— 这是下面全部判据与 traces 里两个 vitest 文件的接地对象（success=true）；前置不成立时单测只能报「找不到该导出 / 行为不符」，判红会伪装成「渲染决策写错」"
      - "frontend/admin-web/src/lib/interactive-render.ts（或等价位置）导出纯函数 resolveInteractiveState(msg) → 'interactive' | 'readonly' | 'hidden'：有 interactive 且非流式且未答 → interactive；有 interactive 且 interactiveAnswered → readonly；流式中或无 interactive → hidden"
      - "MessageList.tsx 渲染交互组件时经 resolveInteractiveState 决策，不再直接用 message.isStreaming 作为 disabled：流式中隐藏（hidden），已答（interactiveAnswered=true）渲染同构只读变体（disabled=true，按钮置灰不可点），未答复渲染可交互（disabled=false）"
      - "InteractiveMessage ChoiceCard/ConfirmCard/FormCard 在 disabled=true 时不可点击且视觉置灰（opacity/disabled 属性），点击不触发 sendMessage"
      - "锁的单一事实源为消息级 interactiveAnswered（来自 store 透传/历史回放），非组件本地 useState：FAB 关闭重开（ChatArea 卸载重挂载）后已答卡片仍保持只读不可点"
      - "FAB 浮窗（FloatingAssistant）与 /chat 工作台共用 MessageList/InteractiveMessage 链路，两入口渲染决策一致"
    skip_reason: "[backend-contract] 纯前端渲染决策由 vitest 单测（components-chat.test.tsx + interactive-render 单测）验证，非 LLM 行为，不进入 agent-eval 冒烟"
    merge_log: "2026-09-08 新增：黄金策交互组件渲染三态固化（issue #3036）。2026-09-19（#4616/#4617 的 burn-down 缴费 —— 本用例命中的**唯一**一条存量违规是 CASE-TRUST-NO-PRECONDITION-ASSERTION，metric=entries ⇒ 必须整条销账）：补**机器计分型**前置自断言（纯函数 `resolveInteractiveState` 存在 + `MessageList.tsx` 经它决策），把「前置不成立 ⇒ 找不到导出，判红却伪装成渲染决策写错」挡在门口；user_inputs / expectations 与其余 data_checks 原样未动、无放宽。"
    traces:
      tests:
        - "frontend/admin-web/tests/unit/components/components-chat.test.tsx"
        - "frontend/admin-web/tests/unit/lib/interactive-render.test.ts"
      ci:
        - pr-check.yml
      verifies: []

