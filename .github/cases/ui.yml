  - id: UI-005
    legacy_id: ""
    title: "侧边栏新增「智能客服」大类——人工客服图标修复 + 机器人设置改名归组"
    domains:
      - ui
      - frontend
    tier: normal
    tags:
      - ui
      - sidebar
      - menu
      - icon
    truths_ref:
      - frontend-fix.sidebar-smart-cs-group
      - frontend-fix.cs-menu-icons
      - frontend-fix.cs-menu-rename
      - frontend-fix.cs-menu-permission
    user_inputs:
      - "侧边栏新增「智能客服」一级大类：人工客服耳机图标修复 + 机器人设置更名为 AI 客服配置并归组"
    expectations:
      - tool: direct_reply
    data_checks:
      - "Sidebar.tsx 渲染一级大类「智能客服」，DOM 顺序位于「工作台」之后、「商品管理」之前；「人工客服」从「工作台」分组移除"
      - "「智能客服」下子菜单顺序：「AI 客服配置」在前、「人工客服」在后"
      - "「人工客服」渲染 Headphones 图标（iconMap 已注册，非 BarChart3 回退），与「经营看板」BarChart3 图标明确区分；「AI 客服配置」渲染 Bot 图标；「智能客服」大类渲染 MessageSquare 图标"
      - "原「机器人设置」更名为「AI 客服配置」：侧边栏菜单名、页面 H1、Header 面包屑同步一致，不再出现「机器人设置」残留"
      - "链接路径不变：AI 客服配置 href=/chat/config、人工客服 href=/agent-workspace/human-sessions"
      - "权限过滤不回归：无 agent:session → 隐藏「人工客服」；无 agent:quickreply → 隐藏「AI 客服配置」；两者均无 → 「智能客服」整组隐藏"
    skip_reason: "纯前端侧边栏菜单/图标/文案由 vitest 单测验证（sidebar/chat-config/Header.test），非 LLM 行为，不进入 agent-eval 冒烟"
    merge_log: "2026-08-30 新增：侧边栏智能客服大类分组与菜单图标渲染（issue #2670）"
    traces:
      tests:
        - "frontend/admin-web/tests/unit/components/sidebar.test.tsx"
        - "frontend/admin-web/tests/unit/pages/chat-config.test.tsx"
        - "frontend/admin-web/tests/unit/components/layout/Header.test.tsx"
      ci:
        - pr-check.yml
      verifies: []

  - id: UI-006
    legacy_id: ""
    title: "会话管理工作台 - 单列表（无筛选控件）+ 已结束会话续聊 banner"
    domains:
      - ui
      - frontend
    tier: normal
    tags:
      - ui
      - session-list
      - reopen
    truths_ref:
      - frontend-fix.session-list-single-filter
      - frontend-fix.session-reopen-banner
    user_inputs:
      - "会话管理工作台：去掉「活跃/已关闭」硬 tab 与筛选控件，始终单列表展示全部会话（活跃在前、同组 updated_at 倒序），已结束会话灰化；查看已结束会话显示续聊 banner 可一键重新打开"
    expectations:
      - tool: direct_reply
    data_checks:
      - "SessionList 单列表渲染：全部会话按「活跃在前 + updated_at 倒序」排序；无「活跃/已关闭」双 tab，也无「全部/活跃/已结束」筛选 chips/tab"
      - "已结束会话行保留灰化 + 「已结束」徽标 + 重新打开按钮；活跃会话行保留「结束会话」菜单；空态统一「暂无会话」，搜索空态「没有匹配的会话」"
      - "查看已结束会话时聊天区顶部显示「会话已结束」banner + 「继续此会话」按钮；点击调用 reopenSession 并聚焦输入框，banner 消失"
      - "会话管理工作台统计条文案统一为「活跃/已结束/共」（无「已关闭」残留）"
    skip_reason: "纯前端会话列表/续聊交互由 vitest 单测 + E2E 点击链路验证，非 LLM 行为，不进入 agent-eval 冒烟"
    merge_log: "2026-08-31 新增：会话管理状态 tab 与筛选控件移除，单列表 + 续聊 banner（参考 DSH 会话模型评审结论）"
    traces:
      tests:
        - "frontend/admin-web/tests/unit/components/chat/components-chat.test.tsx"
        - "frontend/admin-web/tests/unit/components/chat/ChatArea.test.tsx"
        - "frontend/admin-web/tests/unit/pages/agent-workspace-sessions.test.tsx"
        - "tests/e2e/specs/chat/agent-workspace-sessions.spec.ts"
      ci:
        - pr-check.yml
      verifies: []
