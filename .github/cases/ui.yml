      - "🔴 **2026-10-07 作废的旧判据（如实登记，不粉饰）**：`saving-headline` 结论条、门道卡因果链（`saving-causal-chain`）、术语词典（`saving-terms`）、`saving-metric-le-0-2` / `saving-metric-purchased` 两张指标卡、「两条指标必须并用」说明条、`saving-cohorts` 来源组对照表、`saving-batch-groups`（含异常优先排序与渐进披露）、`saving-trend` 单位产出表、`saving-period-axis-note` / `saving-trend-caveat` / 两腿同参 —— **全部随本次裁定退场**。它们**不是被藏起来**：`SavingBoardStory.test.tsx` 逐条断言这十个 testid 在整页里**一个都找不到**（把任一块写回页面 ⇒ 当场红）。"
      - "🔴 **内部口径词零上屏（本单的核心新判据）**：`切换后` / `存量导入` / `来源未知`（= 服务端 `SavingMetricViews.cohortLabel` 的三个取值）**一个都不许出现**在整页渲染文本里 —— 夹具**故意**把 `cohortLabel` 设成内部口径（页面拿得到、但不许渲染），红证 = 把来源组对照表写回去 ⇒ 当场红；类级元守卫 = `frontend/admin-web/tests/unit/user-copy-jargon-guard.test.ts` 形态③（扫 `src/app` / `src/components` / `src/lib`，豁免台账为空）。同批按类级固化修掉另一处同族形态 = `src/components/chat/BatchStockCard.tsx` 的「存量导入入库（单列）」（改说「开业时导入的老库存（单列）」）。"
      - "🔴 **少废话（可判据化的那一半）**：首屏常驻文案 = 页头一句规则（`savedRule`）+ 趋势表一句（`batchTrendNote`），两者合计 **≤ 120 字**；折叠区条目 **≤ 7 条**。两条都是 `saving-board.test.ts` 的定点断言 —— 把门道卡那类散文加回来 ⇒ 当场红（红证机具另有一条把服务端分组标签搬回首屏的注入，实测 `1 failed / 27 passed`）。"
      - "🔴 **口径不放宽的对照读数**：趋势**只含采购腿**（服务端 `batchTrend` 由 `batchGroups` 的 `purchase` 腿聚合）—— 真库夹具里存量在 2026-08 ⇒ 该期**整期缺席**（红证：并进全量来源 ⇒ 多一行、合计由 2 变 4）；页面**只调一条读面**（`board`；`trend` 调用次数恒 0）⇒ 旧「两腿不同参」漂移面结构性消失。"
      - "🔴 判据·**门道可视**：门道卡含因果链（`saving-causal-chain`：排料省 ⇒ 剩得更多 ⇒ 只盯一个数会看反）与术语词典（`saving-terms`：公式米数 / 排料米数 / 省料米数 / 省料金额 / 来源组 / 批次余量 + 「占比按**批数**算」）；既有「两条指标必须并用」的措辞一条不放宽。"
      - "🔴 判据·**环比词只来自服务端 verdict**：同一份夹具把 `verdict` 由 `worse` 改成 `better` ⇒ 文案必须跟着改口（写死「变好了」的前端过不了这条）；`le0_2Share.verdict = null` ⇒ 该行**只给两期数值、不给好坏词**（有意不给，#5144）。"
