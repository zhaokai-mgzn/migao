      - "判据 2·**改价寻址 = 收敛后那一行的 `id`**（2026-09-21 改判，issue #4886）：读面**可能仍返回同一逻辑名的多行**（前后端各自上线的过渡期）⇒ 前端按 `logical_name ?? operation` 收敛，并**保留收敛后那一行的 `id`**；断言 = 改 `工序1` 的价时发的是**那一行**的 id（夹具里 `mp-工序1-布帘`，不是 `mp-工序1-帘头` / `-布料`）—— 选错行 = 改了另一个价。证据：同文件「收敛规则」用例的 `toHaveBeenCalledWith('mp-工序1-布帘', { unit_price: 3.5 })`"
