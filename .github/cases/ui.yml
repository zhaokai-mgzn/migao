  - id: UI-067
    legacy_id: ""
    title: "侧边栏「常用（收藏）」：用户自选钉 4~6 项 pin 在顶部（权限优先于偏好 / 无效 key 静默丢弃 / 满额拒绝 / 本机持久化）"
    domains:
