    data_checks:
      - "🔴 判据·**页面副标题标准**（用户 2026-10-08 定）：副标题要说清「这个功能是干什么的」（正例「管理客户信息、标签和互动记录」；「待派订单按料（商品 × 颜色 × 门幅）合并 —— 同料合并领料，减少接头损耗；**加急单不参与合并，立即单独派单**」也行），**关键规则加粗**；不写机制链路（⇒/→）、表达式（`每行 = 一次…`）、本企业数值口径（`0.5 米级` / `0.1 米粒度`）、占位符字母与模式代号（`X 变成 Y` / `A 模式`）。判据 = `SUBTITLE_RULES` S1~S4 + `findSubtitleOffenses`，扫商家后台 `src/app/(dashboard)/**` 的 `h1` 兄弟 `<p>`（官网不在射程）。"
      - "🔴 判据·**全量扫描器 + 判据单一源**：`frontend/admin-web/scripts/user-copy-scan.mjs` 用 TypeScript AST 抽「会上屏」的三类候选（JSX 文本 / 白名单 JSX 属性 / 含中文的字符串与模板串**字面块**，注释与 CSS 模板串天然不在内），并把五条机械规则与「什么算上屏」的口径做成**唯一一份**（守卫 `frontend/admin-web/tests/unit/user-copy-jargon-guard.test.ts` 与命令行共用，不写第二份正则）。复算：`node frontend/admin-web/scripts/user-copy-scan.mjs`（在仓库根跑；退出码 ≠ 0 = 仍有命中）。"
      - "🔴 判据·**五族研发腔零上屏**（修复前实测 78 处 / 25 个文件，逐条具名 file:line）：R1 接口与参数细节（端点/入参/分页参数/拉全量/读面/写面/幂等/落库/数据库/服务端/内核）、R2 内部机制名（组合键/派生值/真值源/单一源/快照/状态机/兜底/插值/落账/静默）、R3 研发过程编号与判据语（`issue #NNNN`/`#NNNN`/`PR #NNNN`/`V1xx`/判据/待查明）、R4 代码标识符上屏（`oversize_height_threshold`/`scan_url`/`PC-yyyyMMdd-NNNN`）、R5 行内代码片里塞标识符（`` `HEM_MARGIN` ``）。**判据面 = 用户可见文案**，不是「源码里有没有这个词」。"
      - "🔴 判据·**类级元守卫不退化（判别力自证）**：坏的九个取样形态各自判红（五族各一 + 既有 L2/池/分组标签三族），好的三条（行业术语 + 商家动作）一条都不红；**只改注释不红**（对照读数：守卫不得被自己的文案喂红）；**真声明面自证**（内存里注入的坏文案确实被抽出来，否则「全绿」是假绿）。"
      - "🔴 判据·**豁免台账只许缩短 + 不空转**：`EXEMPT` 每条必须**仍然**命中某条规则，失效当场判红（逼着删干净）。当前唯一一条 = 岗位编码输入框的 placeholder（`admin、customer_service` 是编码**内容本身**，不是散文里的研发腔）。"
      - "判据·**三条既有规则原样迁入**（不削弱）：R6 `L1/L2/L3` 代号（UI-057）、R7 「池」隐喻（UI-058）、R8 服务端分组标签（UI-092）由行扫描改为同一份 AST 口径后**仍逐条判红**，且各自保留原出口话术。"
      - "判据·**假红清理有实测**：`value=\"pending_review\"` / `fieldKey=\"door_width\"` / `stopColor=\"#6366f1\"` 三个 JSX 属性值曾被误判成文案/issue 号 ⇒ 改为**属性白名单**（只认 label/title/hint/placeholder/…）+ 十六进制颜色排除，命中 91 → 78。"
      - "**不回归**：口径/接口/字段名/权限/算料行为一字未动（`frontend-fix.no-api-change`）；被改写的文案所承载的承诺与边界**逐条保留**（未定价 ≠ ¥0.00、「拼接/接高要手选，系统不推算」+「不触发工序」、算例数字仍由真值渲染）。"
