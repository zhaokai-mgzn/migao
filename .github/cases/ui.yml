    user_inputs:
      - "用户 2026-09-29 裁定：「只做常用（收藏）—— 用户自己钉 4~6 项，pin 在侧边栏顶部」"
    expectations:
      - tool: direct_reply
    data_checks:
      - "判据 1·🔴 **权限优先于偏好**（本用例的安全判据）：钉过的项若当前无权（或企业开关关了「每日简报」）⇒ **必须**从「常用」消失。红证 = 只持 order:list 时 `resolvePinnedItems` 只回 `orders`（反向自证：全权时三项都在）。执行点 = frontend/admin-web/tests/unit/lib/menu-pinned.test.ts 的「钉过但当前无权的项 ⇒ 从「常用」消失」+「企业开关关掉「每日简报」⇒ 即使钉过也不出现」。"
      - "判据 2·**不做死引用**：菜单项被删/改名（key 不再存在）或清单为空 / 钉住项一项都不可见 ⇒ 静默丢弃，且「常用」区**整区不渲染**（返回 null，不留空标题）。执行点 = 同文件的「菜单项被删/改名 ⇒ 静默丢弃」+「钉住的项一项都不可见 ⇒ 返回 null」。"
      - "判据 3·**上限 6 且满额拒绝**（不静默顶掉别人的位置）：`togglePinned` 满额时原样返回；渲染面星标不翻转、计数停在 `6/6`、localStorage 不含第 7 项。执行点 = 同文件的「togglePinned 三态」+ frontend/admin-web/tests/unit/components/Sidebar.test.tsx 的「钉满 6 项后再钉第 7 项 ⇒ 被拒」。"
      - "判据 4·**脏数据清洗 + 静默降级**：非 JSON / 非数组 / 元素非字符串 / 空串 / 重复 / 超长 ⇒ 逐个注入后读回合法子集（不抛错）；`localStorage` 读写抛错（隐私模式 / 配额满）⇒ 读回空表、写静默失败，侧边栏不白屏。执行点 = 同文件的三条持久化用例。"
      - "判据 5·**保留用户的钉序**（不是菜单自身顺序）：先钉 finance 再钉 orders ⇒ 常用区就是 finance 在前；反例自证 = 菜单自身顺序 orders 在前。执行点 = 同文件的「保留用户钉的顺序」。"
      - "判据 6·**渲染面**：未钉任何项时整区不渲染；点星标 ⇒ 该项出现在 `data-group-key=\"pinned\"` 的「常用」区（DOM 最顶部）、计数 `1/6`、落盘 localStorage；再点即取消（区消失、落盘空表）；刷新后从 localStorage 恢复。执行点 = frontend/admin-web/tests/unit/components/Sidebar.test.tsx 的「常用（收藏）」5 条。"
      - "判据 7·**合成 key 不撞车**：`PINNED_GROUP_KEY`（`pinned`）不得是任何真实菜单组的 key（否则 `data-group-key` 撞车）。执行点 = frontend/admin-web/tests/unit/lib/menu-nav.test.ts 的 IA 事实用例 + menu-pinned.test.ts 的「返回的合成组」。"
    skip_reason: "[backend-contract] 纯前端个性化偏好（无 LLM 环节，不进 agent-eval 冒烟）：由 vitest 执行"
    merge_log: "2026-09-29 新增（issue #5778）：用户裁定只做「常用（收藏）」。**边界如实登记**：持久化在 localStorage ⇒ 换浏览器 / 换设备不同步；服务端同步（偏好表 + 迁移 + 端点）本轮有意不做（不是漏做）。不做「按使用频率自动推荐」（无使用数据来源）。"
    traces:
      tests:
        - "frontend/admin-web/tests/unit/lib/menu-pinned.test.ts"
        - "frontend/admin-web/tests/unit/components/Sidebar.test.tsx"
