# cases/ui.yml — 前端 UI 织物质感设计 token 用例（issue #2534）
# 来源：issue #2534（经营看板织物质感重设计 · 子任务 A：设计 token 迁移）。
# 纯前端 token 契约（tailwind.config.ts + src/ 默认蓝清理），由 vitest 单测验证，
# 不进入 agent-eval 冒烟（skip_reason 显式标注）。

schema: "case-contract/1.0"
domain: ui

cases:
  - id: UI-001
    legacy_id: ""
    title: "织物质感设计 token - primary/accent/neutral 三阶与默认蓝清理"
    domains:
      - ui
      - frontend
    tier: normal
    tags:
      - ui
      - token
      - tailwind
    truths_ref:
      - frontend-fix.ui-token
    user_inputs:
      - "经营看板织物质感重设计子任务 A：建立设计 token 体系"
    expectations:
      - tool: direct_reply
    data_checks:
      - "tailwind.config.ts theme.extend.colors.primary[500] = '#48618f'"
      - "tailwind.config.ts theme.extend.colors.accent[500] = '#c06a3e'"
      - "tailwind.config.ts theme.extend.colors.neutral[50] = '#faf7f2'"
      - "frontend/admin-web/src/**/*.{ts,tsx} 扫描 '#3b82f6'（大小写不敏感）计数 = 0"
    skip_reason: "纯前端设计 token 由 vitest 单测验证（tests/unit/tailwind.config.test.ts），非 LLM 行为，不进入 agent-eval 冒烟"
    merge_log: "2026-08-25 新增：经营看板织物质感重设计子任务 A（issue #2534）"
    traces:
      tests:
        - "frontend/admin-web/tests/unit/tailwind.config.test.ts"
      ci:
        - pr-check.yml
      verifies: []

  - id: UI-003
    legacy_id: ""
    title: "米宝「今日经营速览」洞察条 - 订单环比/含加工占比/低库存预警"
    domains:
      - ui
      - frontend
    tier: normal
    tags:
      - ui
      - dashboard
      - insight
      - token
    truths_ref:
      - dashboard-jump.overview
      - dashboard-jump.processing-shipment
      - dashboard-jump.low-stock
      - dashboard-jump.real-data
    user_inputs:
      - "经营看板织物质感重设计子任务 C：米宝「今日经营速览」洞察条置于页面顶部"
    expectations:
      - tool: direct_reply
    data_checks:
      - "frontend/admin-web/src/components/dashboard/TodayOverviewBar.tsx 渲染订单环比/含加工占比/低库存预警三个区块"
      - "含加工占比 = processingCount / pendingCount，pendingCount<=0 时渲染 0% 而非 NaN/Infinity/undefined"
      - "订单环比/低库存预警数值来自 props（由页面 API 返回值派生），组件内无硬编码固定数值"
      - "洞察条置于经营看板顶部（先于待处理区块渲染）"
    skip_reason: "纯前端组件由 vitest 单测验证（TodayOverviewBar.test.tsx + dashboard.test.tsx），非 LLM 行为，不进入 agent-eval 冒烟"
    merge_log: "2026-08-25 新增：经营看板织物质感重设计子任务 C（issue #2538）"
    traces:
      tests:
        - "frontend/admin-web/tests/unit/components/dashboard/TodayOverviewBar.test.tsx"
        - "frontend/admin-web/tests/unit/pages/dashboard.test.tsx"
      ci:
        - pr-check.yml
      verifies: []
