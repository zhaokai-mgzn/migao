  # UI-075（issue #5841）：订单列表查询区第二行横向溢出 —— 「查询/重置/刷新」被挤出卡片
  # ==========================================================================
  - id: UI-075
    legacy_id: ""
    title: "订单列表查询区在窄屏既不横向溢出（issue #5841）也不把筛选框压到不可读（issue #5850）：行必须可换行（flex-wrap）、每个字段格必须有 min-w-[…]；同行控件不得 flex-1 + 固定 min-w"
    domains:
      - ui
      - frontend
    tier: normal
    tags:
      - ui
      - orders
      - layout
      - overflow
    truths_ref: []
    user_inputs:
      - "用户 2026-10-01 报障（附截图）：「是否加工」下拉贴到卡片右边界，同行的「查询 / 重置」按钮被挤出卡片外；同日同会话的第二形态（issue #5850）：溢出修完后**筛选框被压到不可读** —— 集成侧按 main 上的类名与盒模型给出读数（1440 下文本框约 74px、日期框约 80px，只显示得出「2026」），用户当场选定「现在就修」"
    expectations:
      - tool: direct_reply
    data_checks:
      - "判据 1·🔴 **轨道必须可收缩**：查询区任何 `grid-cols-…` 的 `fr` 轨道都要写成 `minmax(0, …)`。CSS 里 `1fr` = `minmax(auto,1fr)` ⇒ 轨道最小尺寸 = 该格内容的 min-content、**不可收缩**。实测归因（真实 Chrome + 真实 Tailwind 编译产物）：改前第二行 `md:grid-cols-[repeat(4,1fr)_auto]` 各格 min-content = 下单时间 380 / 商品货号 251 / 商品标题 251 / 是否加工 141 + 按钮列 228 + 间隙 96 = **1347px**，而 1440 窗口下卡片内容宽只有 1060 ⇒ 溢出 287px。⚠️ 实测这四条 `1fr` 轨道**并非等宽**（380/251/251/141，各自等于本格 min-content）—— 「四条轨道全被撑到同宽」只是各格最小尺寸恰好相同时的特例，不是本缺陷的机制。执行点 = frontend/admin-web/tests/unit/pages/orders-query-area-overflow.test.tsx 的判据 ①。"
      - "判据 2·**同行控件也要能缩**：查询区表单控件不得同时带 `flex-1` 与固定长度 `min-w-[<N>px|rem|em]`（改前两个日期输入是 `min-w-[130px]`）—— 轨道可缩而控件不可缩时，控件会顶穿所在格、同样溢到卡片外。执行点 = 同文件判据 ②。"
      - "判据 3·**fail-closed**：查询区的**行**（≥2）/**字段格**（≥6）/表单控件（≥8 个）必须存在，删光即红 —— 否则各条判据会在空集上假绿。执行点 = 同文件判据 ⑤。"
      - "判据 6·🔴 **行必须可换行**（issue #5850 的核心形态判据）：查询区每一**行**容器必须带 `flex-wrap`，且**不得**再用 `grid-cols-…` 单行布局 —— grid 的单行轨道只会把格压小、**不会换行**，这正是「溢出修完改成压扁」的病根。执行点 = 同文件判据 ①。红证（已实跑）：把第二行改回 `grid grid-cols-1 xl:grid-cols-[minmax(0,1.8fr)_minmax(0,1fr)_minmax(0,1fr)_minmax(0,1fr)_auto]` ⇒ 判据 ① 红并打印该类名。"
      - "判据 7·**每个字段格必须有 `min-w-[…]`**：`flex-1` 的格若没有固定最小宽，窄屏会被压到 0（改前 1440 下文本框 74px 就是这么来的）。执行点 = 同文件判据 ②。红证（已实跑）：去掉商品货号格的 `min-w-[240px]` ⇒ 判据 ② 红并打印该格。"
      - "判据 8·**防 A 类回潮**：查询区若**又出现** `grid-cols-…` 行，其 `fr` 轨道仍必须写成 `minmax(0,…)`（issue #5841 那条判据保留为第二道闸）。执行点 = 同文件判据 ④。"
      - "判据 9·**像素读数（#5850 改后；真 Chrome 153 + 仓库 tailwind CLI 编译的真 CSS）**：1280/1366/1440/1512/1536/1920 六档 —— 日期框 50.4/66.5/80.4/93.9/98.4/170.4 → **114.5/141.5/157.4/110.9/118.1/145.8**；商品货号/标题框 41.1/59/74.4/89.4/94.4/174.4 → **169/185/206.1/169/169/190.8**；六档**横向溢出均为 0**。复算入口 = 最小夹具（真实 tailwind 产物 + Playwright 量 `getBoundingClientRect`）。"
      - "判据 4·**像素读数**（真实浏览器复核，读数表见 PR body）：改前在 375/414/768/900/1024/1200/1279/1280/1366/1440/1512 窗口下页面横向溢出 +48/+9/+649/+517/+633/+457/+378/+377/+291/+217/+145px，「查询/重置/刷新」右边界最多出卡片 **719px**；改后 12 个宽度（375~1920）**溢出 0 / 按钮出界 0**。"
      - "判据 5·**注入式红证**（均已实跑）：把第二行改回 `md:grid-cols-[repeat(4,1fr)_auto]` ⇒ 判据 ① 红并打印类名；把第一行改回 `md:grid-cols-[1fr_1fr_1.5fr]` ⇒ 判据 ① 红（同类缺陷的第二处实例：实测 768~1100 窗口下第一行自身溢出 41~173px）；给日期输入加回 `min-w-[130px]` ⇒ 判据 ② 红。"
    skip_reason: "[backend-contract] 纯前端布局（无 LLM 环节，不进 agent-eval）；jsdom 无布局引擎（`getBoundingClientRect` 恒 0）⇒ 单测钉类名形态，像素读数走真实浏览器"
    merge_log: "2026-10-01 新增（issue #5841）：修订单列表查询区第二行横向溢出（「查询/重置/刷新」被挤出卡片）。归因经实测修订 —— 不是「四条 1fr 轨道被撑到同宽」，而是每条 1fr 轨道的最小尺寸等于本格 min-content、四者之和超出卡片可用宽度。修法 = 查询区两行 grid 的 fr 轨道全部改 `minmax(0,…)` + 两个日期输入 `min-w-[130px]`→`min-w-0` + 第二行 5 列断点 md→xl（768~1279 装不下 4 筛选 + 3 按钮，实测会被压到 26px/格）。"
    traces:
      tests:
