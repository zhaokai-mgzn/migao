      - frontend-fix.dashboard-no-overflow
    user_inputs:
      - "经营看板织物质感重设计子任务 B：dashboard 密度修复（表格/图表多视口）"
    expectations:
      - tool: direct_reply
    data_checks:
      - "商品销量排行表头「日涨」列渲染 whitespace-nowrap，1440×900 与 1280×800 两视口无截断"
      - "订单趋势图 x 轴刻度按 sampleTickIndices 降采样，1280 宽度下标签数 ≤ 7 且不密集重叠"
      - "dashboard 页面在 1440×900 与 1280×800 两视口无水平/垂直截断或溢出"
    skip_reason: "纯前端密度/布局治理由 vitest 单测验证（axis-sampling.test.ts + dashboard.test.tsx），非 LLM 行为，不进入 agent-eval 冒烟"
