    user_inputs:
      - "ai-agent-service 将 Agent 流式输出转换为 SSE，并处理建议反馈/用户昵称"
    expectations:
      - tool: direct_reply
    data_checks:
      - "loading→text/tool_call/tool_result/card/interactive→done 序列；空文本降级兜底文案"
      - "suggestion-feedback 返回 {ok:true}；_infer_intent_from_text 关键词按具体词优先匹配，空/无匹配返回 ''/general"
      - "_get_user_nickname Redis 命中直返、未命中查 DB、异常静默返回 None"
    skip_reason: "SSE 流/助手函数由 pytest 单测验证（tests/test_chat.py），非 LLM 行为，不进入 agent-eval 冒烟"
