# cases/api.yml — AI 客服 API 层用例（api 覆盖率分组，issue #2428）
# 来源：issue #2428 coverage-gap 反推，9 条（chat/sse/internal/upload 四个文件的 L2 真值）。
# 均为单元测试契约（SSE 帧 / 路由守卫 / 纯函数 / 依赖注入 mock 的 async 方法），
# 不进入 agent-eval 冒烟（skip_reason 显式标注）。

schema: "case-contract/1.0"
domain: api

cases:
  - id: API-001
    legacy_id: ""
    title: "chat 会话生命周期 - 租户隔离 + 用户所有权 + 幂等/重开"
    domains:
      - api
      - chat
    tier: normal
    tags:
      - api
      - session_lifecycle
      - tenant_isolation
    truths_ref:
      - api.session-lifecycle
      - api.session-validation
      - api.format-datetime
    user_inputs:
      - "ai-agent-service 处理会话 create/list/close/reopen/delete/history 端点"
    expectations:
      - tool: direct_reply
    data_checks:
      - "close/reopen/delete/history 对不存在会话返回 404 SESSION_NOT_FOUND"
      - "跨租户或非所有者访问返回 403 PERMISSION_DENIED"
      - "close 幂等（已 closed 仍 success 且不调 close_session）；reopen 仅 closed→active"
    skip_reason: "会话端点由 pytest 单测验证（tests/test_chat.py），非 LLM 行为，不进入 agent-eval 冒烟"
    merge_log: "2026-08-25 新增：ai-agent-service api 覆盖率补全（issue #2428）"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_chat.py"
      ci:
        - ai-agent-tests.yml
      verifies: []

