    title: "待确认队列闭环 - 候选读+写路径齐全，采纳转卡片、拒绝记原因（LLM WIKI 板块 #3051 P5）"
    domains:
      - api
      - knowledge
    tier: normal
    tags:
      - api
      - knowledge
      - wiki
      - candidates
    truths_ref: []
    user_inputs:
      - "AI 提炼的候选知识卡片进入待确认队列，商家采纳（或编辑后采纳）后生效，拒绝则不生效"
    expectations: []
    data_checks:
      - "GET /api/admin/knowledge/candidates 分页返回候选（缺省 status=pending，created_at 倒序，租户隔离）；GET /candidates/pending-count 返回待确认数"
      - "POST /{id}/adopt 采纳：候选 → 知识卡片（status=published，sourceType/sourceRef 继承候选来源），候选置 adopted；立即可被检索"
      - "POST /{id}/adopt-edited 编辑后采纳：人工修订标题/回答覆盖（标题回答必填），候选置 edited"
      - "POST /{id}/reject 拒绝：候选置 rejected + status_note 记录原因，不产生卡片；跨租户一律 404"
    skip_reason: "队列读写路径由 MockMvc + Service 单测验证（KnowledgeCandidateControllerTest/KnowledgeCandidateServiceTest），非 LLM 行为，不进入 agent-eval 冒烟"
    merge_log: "2026-09-08 新增（issue #3051 LLM WIKI 板块 P5）：待确认队列闭环——不重复 knowledge_sync_history 零读写事故，读写路径齐全；AI 只产生候选，发布权在商家"
    traces:
      tests:
        - "backend/admin-api/src/test/java/com/migao/admin/controller/KnowledgeCandidateControllerTest.java"
        - "backend/admin-api/src/test/java/com/migao/admin/service/KnowledgeCandidateServiceTest.java"
      ci:
        - pr-check.yml
      verifies: []

  - id: API-012
    legacy_id: ""
    title: "语音转写接口容错 - 空/极小/静音音频返回友好 4xx/5xx，不裸 500（#2984）"
    domains:
      - api
      - chat
    tier: normal
    tags:
      - asr
      - voice
      - error-handling
    truths_ref: []
      # ⚠️ 真值缺口：asr 容错语义暂未写入模板，由 data_checks 承载
    user_inputs:
      - "语音转写接口异常输入容错"
    expectations: []
    data_checks:
      - "空文件 → 400 中文 detail「音频文件为空，未检测到声音」"
      - "极小文件（<1KB）→ 400「未检测到有效音频内容，录音可能过短或麦克风未开启」，不裸 500"
      - "超 10MB / 估算超 60s → 400 中文 detail（音频文件过大 / 音频时长超过上限）"
      - "DashScope 未识别到语音内容（静音）→ 400「未识别到语音内容，请靠近麦克风重新录音」"
      - "ASR 上游不可用 → 503「语音识别服务暂时不可用，请稍后重试」"
      - "正常音频 → 200：text/language/duration_ms 齐全"
    skip_reason: "函数级容错由 ai-agent 单测（test_asr.py TestTranscribeAudioFriendlyErrors）验证，非 LLM 行为，不进入 agent-eval 冒烟"
    merge_log: "2026-09-07 新增：#2984 语音空录音体验优化（生产实证：无声音停止 → 空/极小 webm → 后端裸 500 → 前端 Failed to fetch）"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_asr.py"
      ci:
        - ai-agent-tests.yml
      verifies: []
