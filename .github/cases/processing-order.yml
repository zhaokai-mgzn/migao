      - "**已知缺口（如实登记）**：V54/V56/V58/V59/V60 六个种子迁移仍只种 `tenant_id = 1`（**不改已应用迁移** —— #4235 迁移不可变）；非 1 号租户由本单的**模板套用**补齐（开租自动 + 手动补套端点）。#4316 由本单收口。"
