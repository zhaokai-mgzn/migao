      - "**拒用字段的实测理由（防下一个人再混）**：① **拒用 `sellingMethod`** —— 它是**售卖方式**（真库 11 个取值：`bulk_cut`/`散剪`/`full_roll`/`整卷`/`散剪售卖`/`散剪按米`/`散剪·按米购买`/`散剪(bulk_cut)`/`cut`/`散剪（按米裁剪）`/无），`per_meter` 在其中一次都没出现过；`per_meter` 是**加工项计价方式**（`ProcessingItemService` 的 `per_meter/per_set/fixed/per_area`）的词汇，历史上被误当成售卖方式词表（同族混淆见前端展示表把 `per_meter: '按米'` 放进 `sellingMethod` 的映射表）。② **拒用 `products.pricing_type`** —— 它是**商品**属性，与订单行数量口径不是同一层：实测按它只命中 50/68，**漏 18 条**（11 条商品缺失/软删 + 6 条 `pricing_type=fixed` 而其订单行的加工项仍是 `per_meter`、订单数量仍是米数 + 1）。证据：ProcessingOrderServiceTest「calcInfoDoesNotInventFabricMetersForNonPerMeter」+ 本条的 6 条用例；代码注释见 `ProcessingOrderService.calcInfo` 的 javadoc"
      - "端到端形态（issue #4299 判据 4）：真实栈建一张含 `per_meter` 加工项的 `bulk_cut` 单（数量 3）⇒ 生成加工单后米类工序 `qty=3`、`qty_source != \"fallback\"`。⚠️ **证据来源 = 主会话在真实栈上的端到端跑，本 PR 未执行**；单测层因 `productionOperationQtyClient` 是 **mock** ⇒ 只能证 `calc_info` 是否带 `fabric_meters`，**证不了**「米类 qty == 订单米数」那一环（形态边界见 FINDINGS §④）"
    skip_reason: "[backend-contract] 后端契约用例（`calcInfo` 是服务端生成路径的纯 Java 逻辑，无 LLM 环节，不进 agent-eval 冒烟）：断言全部由 ProcessingOrderServiceTest 的 6 条 PG-025 用例执行（真库取值命中 / 无 sellingMethod / 整卷 / 取值守卫 112 / per_sqm 负例 / 无 pricingMethod 键负例），且其中 5 条在修复前必红"
    merge_log: "2026-09-18 新增（issue #4299，P1）。红证（修复前实测，命令 `cd backend/admin-api && ./mvnw -Dtest=ProcessingOrderServiceTest test`）：`Tests run: 48, Failures: 5`，5 条均为 `[calc_info 必须带 fabric_meters（判据 = 加工项 pricingMethod=per_meter）] Expecting actual: {} to contain key: \"fabric_meters\"`（perMeterProcessingItemMapsOrderQuantityEvenWhenSellingMethodIsBulkCut / perMeterProcessingItemMapsEvenWithoutSellingMethod / perMeterProcessingItemMapsForFullRollToo / fabricMetersComesFromOrderQuantityNotFromProcessingItemQuantity / generateTakesQtyFromCalcEngineNotFromOrderQuantity）；实现后 `Tests run: 48, Failures: 0, Errors: 0` 全绿。同时改掉两处**假绿夹具**（原第 647/692 行的 `sellingMethod = \"per_meter\"` / `\"per_set\"` —— 真库不产生的值）并把判据分支整体替换为 `hasPerMeterPricing(entry)`（读加工项 `pricingMethod`），删除 `PER_METER_METHODS` 常量与 `sellingMethod` 判据分支（不留第二份口径）。**不做/未验证（如实登记）**：真实栈端到端红证（由主会话执行）；共用夹具 `stubQty()` 的米类分支是**与 calc_info 无关的平行真值**（恒 12.3/`fabric_meters`）⇒ 文件内实例级 `qty` 断言对 `calc_info` 不敏感（本单只对 PG-025 的 6 条用例改用镜像端点米轴的局部桩，未改动该共用桩）。"
