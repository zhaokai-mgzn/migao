  - id: PG-015
    legacy_id: ""
    title: "米宝加工单 LLM 行为：查询加工单（生成 → 按订单号回查状态）"
    domains:
      - processing-order
      - order
      - chat
    tier: normal
    tags:
      - processing_order
      - llm_behavior
      - tool_call
      - query
    truths_ref: []
    user_inputs:
      # 为什么不写「查一下加工单」：干净栈上 processing_orders 表为空（**没有任何
      # seed 注入加工单**，已核对 fixtures/*.sql 0 条 INSERT），空表的「查一下」
      # 只会得到空列表 —— 用例会退化成"没事发生"（假绿）。故先对**种子**里
      # 「已确认且含加工项」的订单生成加工单，再按订单号回查
      # （mibao_eval_seed.sql Phase 2：该单 order_items 带 processing_info）。
      # #3658（issue #3658）：目标订单由 0002 改为 **0003**（独立订单竞态修复——
      # 0002/0003/0004 分别归 PG-013/015/016，此前三条共用 0002，并发跑只有一个
      # 能生成成功，run 34820346966 实测 PG-013/016 吃「订单已生产中」假红）。
      - "把订单 EVAL-MB-ORD-0003 生成加工单"
      - repeat_until:
          tool_called: processing_order_generate
          max: 3
        fallback: "确认"
      - "订单 EVAL-MB-ORD-0003 的加工单现在什么状态？"
      - repeat_until:
          tool_called: processing_order_query
          max: 3
        fallback: "确认"
    expectations:
      - tool: processing_order_generate
      - tool: processing_order_query
    must_succeed:
      # 守卫口径已按 persona 收窄（#3580 修 `test_must_succeed_tools_are_customer_capabilities`
      # 的「遍历全库」bug：现在 `case_persona(c) != PERSONA: continue`，B 端/双端用例
      # 由 `test_mibao_case_invariants.py` 负责）→ B 端专属工具可以声明 must_succeed。
      # 这是比 `success=true` **更强**的断言：`must_succeed` 是「调了 ≠ 成了」的机器防线，
      # 会把每次尝试的轮次+错误码写进失败详情（工具层失败与模型层漏调可一行区分）。
      - tool: processing_order_generate
      - tool: processing_order_query
    required_args:
      - tool: processing_order_query
        fields:
          - keyword
    forbidden_text:
      - "暂不支持"
      - "功能不存在"
      - "没有这个功能"
      - "无法查询"
    data_checks:
      # 「调了 ≠ 成了」（issue #3361）：`success=true` 由 local_runner 的 scoring_checks
      # 计入评分；**同时**在 `must_succeed` 里声明工具（更强：把每次尝试的轮次+错误码
      # 写进失败详情）。两条并存不冲突（前者计入 expectations 评分，后者独立核验）。
      - "success=true"
      - "回查结果 grounded 到刚生成的加工单（status ∈ generated/issued/in_processing/completed/cancelled，不得编造）"
    skip_reason: "agent 暂不接入加工单工具（产品决策 2026-09-15，issue #3917）：processing_order_* 已从注册表与 order skill 移除，本用例断言的工具对 agent 不再开放；工具恢复接入后启用（届时由 PG-017 的概念区分用例守护期间行为）"
    merge_log: "2026-09-14 新增（issue #3568 / #3592）：processing_order_query 此前**零用例覆盖**（scripts/mibao_coverage.py --check 在 pristine main 上 exit 2 报出的结构性缺失）。形态 =「先对种子订单生成加工单 → 按订单号回查」（干净栈无加工单 seed，直接「查一下」会假绿）。断言机器可判：must_succeed ×2 + required_args[keyword] + forbidden_text。2026-09-14 首次真重放（run 34820346966，issue #3658）：✅ **通过（score=100%）—— PG-015 的第一次真实执行证据**。目标订单由 0002 改为 0003（独立订单竞态修复，见 user_inputs 注释）。2026-09-15（issue #3917）skip：加工单工具对 agent 不再开放"
    traces:
      tests:
        - "backend/admin-api/src/test/java/com/migao/admin/service/ProcessingOrderServiceTest.java"
      ci:
        - agent-eval.yml
      verifies: []

  - id: PG-016
    legacy_id: ""
    title: "米宝加工单 LLM 行为：更新加工单状态（完成加工，产出核到 completed）"
    domains:
      - processing-order
      - order
      - chat
    tier: normal
    tags:
      - processing_order
      - llm_behavior
      - tool_call
      - update
    truths_ref: []
    user_inputs:
      # 同上：干净栈无加工单 seed → 先对种子订单生成，再推进状态。
      # #3658（issue #3658，run 34820346966 / 34821647043 两轮实证后定稿）：
      #   ① 目标订单 0002 → **0004**（独立订单竞态修复，同 PG-015：三条 PG 用例不再抢同一订单）；
      #   ② 输入走**完整状态机** generated→issued→in_processing→completed
      #      （PG-006：generated→completed 是**非法迁移**，原「生成→直接标记完成」写法必失败
      #      —— 实测 agent 正确回复「已发加工还不能直接标记完成」）；
      #   ③ 每步的确认卡用 `auto_respond`（有卡答卡，§13.5 推荐形态）回答 —— **刻意不用**
      #      `repeat_until{tool_called: processing_order_update}`：runner 的停条件是
      #      **工具级**（该工具成功调用过即停，issue #3430），issue 成功后 start/complete 的
      #      repeat 轮会被整体跳过（run 34821647043 实证：开始加工的确认卡没人答 → 流程卡死，
      #      update 从未以 start/complete 执行）。生成步保留 repeat_until（工具名唯一，无此问题）。
      # `complete` 幂等（重复调用仍为 completed），不污染后续跑（cancel 非幂等且需 reason，
      # 故不用它做正向用例）。
      - "把订单 EVAL-MB-ORD-0004 生成加工单"
      - repeat_until:
          tool_called: processing_order_generate
          max: 3
        fallback: "确认"
      - "这笔加工单发加工，交期下周三"
      - auto_respond:
          fallback: "确认"
      - "开始加工"
      - auto_respond:
          fallback: "确认"
      - "这笔加工单加工完成了，标记完成"
      - auto_respond:
          fallback: "确认"
    expectations:
      - tool: processing_order_update
        args:
          action: complete
    must_succeed:
      # 守卫口径已按 persona 收窄（#3580）→ B 端专属工具可声明，理由同 PG-015。
      - tool: processing_order_update
        action: complete
    required_args:
      - tool: processing_order_update
        fields:
          - id
    # pre_clean（§18.4 前置等价性；同 #3833 给 PG-013 的修法，能力已在 runner 就位）：
    # 本用例是**写**用例且**首跑就改变自己的前置** —— R2 对 `EVAL-MB-ORD-0004` 生成加工单
    # ⇒ 该订单转 producing。而 `_reset_for_retry` 按 `pre_clean` **opt-in** ⇒ 原来没声明 =
    # 重试前不复位 ⇒ 第 2 次尝试的 R1 直接看到「订单已经生成过加工单了，无需重复生成」
    # （判定跑 34908262839 重试块 R1 逐字原文；首跑 R1 则要自己生成）。
    # 两次尝试的前置**不等价** ⇒ 首跑指纹与重试结果不可对比，归因会被引到错误对象上
    # （`PG-013` / `CU-003` 同族，见 `migao-dev-flow` §18.4）。
    # ⚠️ 只复位**本用例点名的这张专用种子订单**及其加工单（`processing_order_reset` 按
    # `order_no` 精确匹配、**不做**子串/模糊匹配；0004 是 #3658 从 0002 拆出来给 PG-016
    # 独占的，seed `mibao_eval_seed.sql` 里存在且为 confirmed）。该类型属**准备型**：
    # 订单查不到 ⇒ `precondition_not_applied` 折叠进结论（fail-closed，不静默放过）。
    pre_clean:
      - type: processing_order_reset
        order_no: "EVAL-MB-ORD-0004"
    output_verify:
      # ⚠️ `action` 必写（本工具多 action：issue/start/complete/cancel）—— 不写限定
      # 时核对器会取**首个成功调用**的 payload，可能核到别的 action 上（假绿/假红）。
      # ⚠️ 只写**扁平顶层键**：runner 的 check_output_verify 按字面 key 查顶层 payload，
      #    **不支持点号路径**（`result.status` 这类键永远核不到 —— run 34822527203 实证
      #    「结果里没有字段 'result.status'」，即使 complete 已成功落库）。
      #    状态到达 completed 已由 must_succeed(action=complete) 机器兜底（服务端状态机
      #    校验，complete 幂等）—— output_verify 这里核对「complete 调用成功且 action
      #    确实是 complete」（防多 action 工具核到别的调用）。
      - tool: processing_order_update
        action: complete
        expect:
          action: complete
    forbidden_text:
      - "暂不支持"
      - "功能不存在"
      - "没有这个功能"
      - "无法更新"
      - "更新失败"
    data_checks:
      # 同 PG-015：`success=true` 计入评分，**并**在 `must_succeed` 声明工具（更强）。
      - "success=true"
      - "结论 grounded 到刚更新的加工单（订单联动状态见加工单设计决策 3：complete 不回退订单）"
    skip_reason: "agent 暂不接入加工单工具（产品决策 2026-09-15，issue #3917）：processing_order_* 已从注册表与 order skill 移除，本用例断言的工具对 agent 不再开放；工具恢复接入后启用（届时由 PG-017 的概念区分用例守护期间行为）"
    merge_log: "2026-09-14 新增（issue #3568 / #3592）：processing_order_update 此前**零用例覆盖**（同 PG-015 的结构性缺失）。断言机器可判：expectations(action=complete) + must_succeed(action=complete) + required_args[id] + output_verify（**显式声明 action**，防多 action 工具核到别的 payload 造成假绿）。2026-09-14 首次真重放（run 34820346966，issue #3658）：❌ 失败 → 归因**用例资产缺陷**（非 agent 能力缺口）：① 与 PG-013/015 抢同一种子订单 EVAL-MB-ORD-0002（并发生成只有一方成功，实测生成被拒「订单已生产中」后 agent 转向 issue 流，complete 期望永不满足）；② 输入跳步（生成后直接「标记完成」违反状态机 generated→completed 非法迁移，PG-006 铁律）。修复：独立订单 0004 + 完整状态机走位。2026-09-14 第二轮验证重放（run 34821647043）：❌ 再失败 → 新发现**用例设计缺陷**：状态机三步全用 `repeat_until{tool_called: processing_order_update}`，而 runner 停条件是**工具级**（issue #3430）——issue 成功（R6）后 start/complete 的 repeat 轮被整体跳过（开始加工确认卡无人答）。修复：每步确认卡改用 `auto_respond`（有卡答卡、无停条件跳过），生成步保留 repeat_until（工具唯一）。2026-09-14 第三轮验证重放（run 34822527203，PG-016-only）：状态机全走位成功（issue→start→complete 各成功，工具 14 调 0 失败），仅剩 output_verify 假红——`expect: result.status: completed` 用了**点号路径**，而 runner 的 check_output_verify 只按字面扁平 key 查顶层 payload（不支持嵌套路径，run 34822527203 实证「结果里没有字段 'result.status'」）。修复：expect 收敛为扁平键 `action: complete`（状态到达 completed 由 must_succeed + 服务端状态机兜底）。2026-09-15 第四轮归因（issue #3856，承接 #3835 的 PG-016 条目）：首跑指纹 `no_success(processing_order_update)` 在 4 个 run 复发（34873715194 / 34865780382 / 34856561459 / 34908262839）⇒ 复核后判**产品侧**：agent 把「加工方」当发加工必填 （34908262839 首跑 R5/R6 两次文本索要、R8/R10 两次 form 卡，`processing_order_update` 一次都没调用）。复核证据：processor/交期在工具 schema（`required=['id','action']`）、`validate_input`（`issue.required=['id']`）、服务端 DTO/Service **四处均为可选**——唯独 LLM 面对的口径 `prompts/order.md` 的「发加工」行把 `processor=加工方` 写进签名且不带「可选」标注（同行 `cancel(reason=必填)` 却标注）⇒ 口径不一致。**反证**：同 run 重试里 agent 未带 processor 直接 issue 成功（服务端接受）。修复 = 该行标注可选 + 禁止为可选字段索要/阻塞/重复发卡（不是静默默认值：缺省即不传该字段）。另一支机制（写落库后同 session 再读仍旧状态，34873715194/34865780382）**证据不足**：能排除「写没落库」（重试 R4 报「不允许从 [加工中] 变更」，证明首跑 issue+start 已落库），但读陈旧 vs 同轮并发竞态分不清 —— 缺 `#3823` 的 tool args/响应体 + DB 时序。本单同时补 `pre_clean: processing_order_reset{order_no: EVAL-MB-ORD-0004}`（§18.4：原先重试前置与首跑不等价，重试块 R1 实测「已经生成过加工单了」）。2026-09-15（issue #3917）skip：加工单工具对 agent 不再开放"
    traces:
      tests:
        - "backend/admin-api/src/test/java/com/migao/admin/service/ProcessingOrderServiceTest.java"
      ci:
        - agent-eval.yml
      verifies: []

  # ==========================================================================
  # PG-017（issue #3917）：加工单工具对 agent 关闭后的**概念区分**守护用例。
  # 产品决策（2026-09-15，#3917）：agent 暂不接入加工单工具，但必须能区分
  # 「加工项」与「加工单」—— 用户问加工单（状态/进度/生成/发加工等）时不得用
  # 加工项查询/加工项目录代替、不得编造加工单数据，应解释两概念区别并引导后台
  # （订单详情-加工单块）。证据会话 sess_f3c0ee0d2cc342a0：用户问「查看加工单
  # 数据」，agent 返回加工项目录（22 项）—— 正是本用例要拦截的缺陷形态。
  # 断言全部机器可判：expectations=[direct_reply]（零工具调用）+ forbidden_tools
  # （加工项查询与加工单三工具全程禁用）+ want_text（含「加工单」+「后台/订单详情」
  # 引导）+ forbidden_text（轮次作用域，禁目录特征词）+ success=true。
  # persona: mibao（B 端专属 —— 概念区分口径只存在于订单域 prompt；不标会触发
  # 另一腿「禁止静默少跑」，#3822）。
  - id: PG-017
    legacy_id: ""
    title: "米宝加工单概念区分：用户问加工单 → 不调加工项/加工单工具，解释概念并引导后台（#3917）"
    domains:
      - processing-order
      - order
      - chat
    persona: mibao
    tier: normal
    tags:
      - processing_order
      - llm_behavior
      - concept_distinction
      - product_decision
    truths_ref: []
    user_inputs:
      - "查看加工单数据"
    expectations:
      # 零工具调用 = 概念区分回复（纯文本解释 + 引导），目录替代形态
      # （调 processing_item_query 返回加工项目录）与加工单形态（调 processing_order_*）
      # 一旦出现即整条期望失败 —— 这是本用例**主判据**的机器表达。
      - direct_reply
    forbidden_tools:
      # 跨轮全程禁用（调用即违规，即使被门禁挡回）：加工项目录/加工项查询不得
      # 用来代替加工单；加工单三工具对 agent 已不开放，恢复接入需先过产品决策。
      - processing_item_query
      - processing_order_generate
      - processing_order_query
      - processing_order_update
    forbidden_text:
      # 轮次作用域（仅 R1）+ any_of：特征词是「把加工项目录当加工单答」的形态指纹；
      # 正确的概念区分回复（加工项 vs 加工单 + 引导后台）不枚举目录项。
      - round: 1
        any_of:
          - "压褶定型"
          - "LG工艺"
          - "窗幔制作"
          - "刺绣工艺"
    want_text:
      # 正向引导：回复必须解释到「加工单」概念本身，并给出后台去向
      # （「后台」或「订单详情」任一命中即可 —— 措辞天然发散，逐词全中会把合格回答判红）。
      - "加工单"
      - any_of:
          - "后台"
          - "订单详情"
    data_checks:
      - "success=true"
      - "agent 不调用加工项查询/加工项目录代替加工单，不编造加工单数据（状态/进度/编号），解释两概念并引导后台订单详情-加工单块（机器断言：direct_reply + forbidden_tools + want_text/forbidden_text）"
    skip_reason: ""
    merge_log: "2026-09-15 新增（issue #3917）：B 端概念区分用例（加工单工具关闭后的行为守护）。断言组合：expectations=[direct_reply]（该轮零工具调用 —— 目录替代形态必调 processing_item_query，加工单形态必调 processing_order_*）+ forbidden_tools（跨轮全程禁用 4 工具，调用即违规）+ want_text（含「加工单」+「后台/订单详情」引导）+ forbidden_text（R1 轮次作用域 any_of，禁目录特征词）+ success=true（计分）。persona: mibao（B 端专属，缺省会触发另一腿「禁止静默少跑」，#3822）。"
    traces:
      tests:
        - "tests/agent_eval/local_runner.py"
      ci:
        - agent-eval.yml
      verifies: []

  # ==========================================================================
  # PG-018（issue #3995，M4-G-2）：生产报工闭环（DB 层 + 报工链路）。
  # 后端契约用例（非 LLM 行为）：工序实例化（含加工单二维码 token）→ 扫码报工推进
