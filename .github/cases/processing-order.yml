  - id: PG-013
    legacy_id: ""
    title: "米宝加工单 LLM 行为：查询含加工项订单 → 生成加工单（真实对话）"
    domains:
      - processing-order
      - order
      - chat
    tier: normal
    tags:
      - processing_order
      - llm_behavior
      - tool_call
    truths_ref: []
    user_inputs:
      - "最近有没有已确认、需要加工的订单？"
      # #3658（issue #3658）：独立订单竞态修复 —— R1 现在会列出 3 笔已确认含加工项订单
      # （0002/0003/0004，见 mibao_eval_seed.sql），「这一个」指代不再确定，改为点名
      # 0002；0003/0004 分别由 PG-015/PG-016 独占，三条用例不再抢同一笔订单。
      - "帮我把订单 EVAL-MB-ORD-0002 生成加工单"
      - "确认"
    expectations:
      - tool: order_query
      - tool: processing_order_generate
    order_before:
      - "order_query before processing_order_generate"
    required_args:
      - tool: processing_order_generate
        fields:
          - "order_ids"
    # pre_clean（issue #3833，#3800 同族的**新实例**）：本用例是写类用例 —— 首跑把
    # `EVAL-MB-ORD-0002` 生成一张加工单行（**订单状态不变**，issue #4305；见下方 data_checks），
    # 而 `_reset_for_retry` 按 `pre_clean` **opt-in** ⇒ 原来没声明 = 重试前不复位
    # ⇒ 第 2 次尝试 R1 只看到 1 笔已确认订单（首跑是 2 笔）、R2 看到「加工单早已生成」
    # ⇒ agent **合理地**不再调 `processing_order_generate` ⇒ 末次必红，且两次成因不同
    # ⇒ 误分类 `unstable`（实测判定跑 34908262839，末次 trace 逐字见 issue #3833）。
    # ⚠️ 复位**只动本用例点名的这张专用种子订单**及其加工单 —— seed 注释明写
    # 「EVAL-MB-ORD-0002 = PG-013 加工单生成用」，且 #3658 已把 0003/0004 分给
    # PG-015/PG-016；本类型按 `order_no` 精确匹配，**不做**任何子串/模糊匹配
    # （避免 #3800 记录的 `product_remove` 连带误删形态）。
    pre_clean:
      - type: processing_order_reset
        order_no: "EVAL-MB-ORD-0002"
    # forbidden_text（issue #3833）：**从全程语义收紧成「轮次 + 措辞」精确断言**。
    # 全程语义的病灶（本 run 首跑**唯一**红点）：R1 是**问答轮**，agent 逐单如实陈述时说
    # 「⚠️ 20260915030240002 未见加工项，无法生成加工单」—— 那是对**另一笔**订单的**事实陈述**
    # （同一轮还说了「✅ 可生成加工单：EVAL-MB-ORD-0002」），却被全程禁令判成"拒绝执行"。
    # 形态与 `want_text` 的 `{round: n, text: …}` / `{round, any_of}` **同构**
    # （裸字符串 = 原有全程语义，向后兼容）。
    # 分档判据（**收紧，不是放宽**）：措辞若在**问答轮有正当语境**（如实披露某单不含加工项 /
    # 引用系统判定），就限定到**写操作轮**（R2 生成请求 / R3 确认）—— 真拒绝仍必红；
    # 措辞若属**能力自我否定 / 编造失败**（#3477 家族），任何一轮出现都是错的 ⇒ 保持全程。
    forbidden_text:
      # 全程：能力自我否定 / 编造失败 —— 本用例的任何一轮都没有正当语境
      - "暂不支持"
      - "功能不存在"
      - "没有这个功能"
      - "生成未成功"
      - "生成失败"
      # 写操作轮（R2 生成请求 / R3 确认）：这三条在 R1 问答轮有**如实陈述**的正当语境
      - round: 2
        any_of:
          - "无加工项"
          - "无法生成加工单"
          - "系统判定为"
      - round: 3
        any_of:
          - "无加工项"
          - "无法生成加工单"
          - "系统判定为"
    # must_succeed（issue #4196 补，**去 skip 后门禁判出的存量缺陷，非新增豁免**）：
    # `CASE-TRUST-NO-EFFECT-ASSERTION`（#3778「调用了 ≠ 成了」）—— 本用例的写期望是
    # `expectations[processing_order_generate]`，但效果层断言**一条都没有**：
    # `order_before` 是时序、`required_args` 只在"工具被调用过"时生效（未调用即 `continue`
    # 全绿，见 assertion_taxonomy.has_behavior_assertion 的口径注释）、`data_checks` 两条
    # 都是**纯散文**（不含机器计分标记 `success=true`）⇒ 工具返回 success=false 照样通过。
    # 该缺陷在 #3917 skip 期间**不可见**（skip 的用例不进对账集），#4196 去 skip 后由
    # `.github/case_trust_gate.py` 全量对账判出 ⇒ 必须当场修掉（#4046 的 fail-closed 口径：
    # 未登记违规一律阻塞，**不得**靠入账基线销声；修法即规则自带的 fix：加 must_succeed）。
    # 形态同 PG-015/PG-016 的既有写法（两条一直有 must_succeed，本用例独缺）。
    # ⚠️ 这是**加强**不是放宽：expectations / required_args / forbidden_text / pre_clean
    # 一字未动（见 merge_log）。
    must_succeed:
      - tool: processing_order_generate
    data_checks:
      - "前置：目标环境至少存在一个「已确认且含加工项」订单（否则 order_query 为空、无法生成）——CI smoke 档不纳入，normal 档需保证前置数据"
      - "生成后 processing_orders 落新行（status=generated）；**订单状态保持 confirmed**（issue #4305：订单进入 producing 的时点已从「生成加工单」挪到「发加工」—— 机器判据 = ProcessingOrderServiceTest 断言生成路径 never updateOrderStatus(producing)）；验收以 GET /api/admin/processing-orders?keyword=<订单号> 复核加工单行"
    skip_reason: ""
    merge_log: "2026-09-12 新增（验收缺口 #3348）：米宝加工单 LLM 行为真实对话用例（替代纯单测覆盖）；2026-09-15（issue #3833）修双重假红：① 补 `pre_clean: processing_order_reset(order_no=EVAL-MB-ORD-0002)` —— 写类用例自清理，重试前置回到 seed 初始态（confirmed + 无加工单），与首跑等价；② `forbidden_text` 从全程语义收紧成「轮次 + 措辞」：R1 问答轮如实陈述（某单未见加工项/引用系统判定）不再判红，写操作轮（R2/R3）真拒绝仍必红；能力自我否定/编造失败类措辞保持全程。expectations / required_args **未改**；2026-09-15（issue #3917）skip：加工单工具对 agent 不再开放；2026-09-18（issue #4196）**去 skip**：加工单工具恢复接入（registry 注册 + order skill 工具/意图 + IntentType/描述/域/工具映射四处 + prompts/order.md 操作指引），**断言面原样保留**（expectations / must_succeed / required_args / forbidden_text / pre_clean 全部未改，未放宽）；去 skip 不空跑的前置 = runner 的 `pre_clean[processing_order_reset]` + 种子 EVAL-MB-ORD-0002/0003/0004（confirmed + paid + 明细带加工项）；**同 PR 补 must_succeed[processing_order_generate]**（去 skip 后 `.github/case_trust_gate.py` 全量对账判出的存量缺陷 `CASE-TRUST-NO-EFFECT-ASSERTION`：#3778「调用了 ≠ 成了」—— 原断言面里 `order_before` 是时序、`required_args` 在工具未调用时 `continue` 全绿、两条 `data_checks` 是纯散文 ⇒ **无任何效果层断言**。按 #4046 的 fail-closed 口径**当场修掉**，不入账基线；这是**加强**不是放宽，expectations / required_args / forbidden_text / pre_clean 一字未动）。2026-09-18（issue #4305，用户裁定「发加工 = 订单进入生产中」）：第 2 条 data_check 里「订单转 producing」**已过时**（那是旧时点）⇒ 改判为「订单**保持 confirmed**」（加工单行照旧落库），其余断言未动。"
    traces:
      tests:
        - "tests/agent_eval/local_runner.py"
      ci:
        - agent-eval.yml
      verifies: []

  - id: PG-014
    legacy_id: ""
    title: "订单加工项不可变（源头约束，决策 C）：创建后无任何修改通道"
    domains:
