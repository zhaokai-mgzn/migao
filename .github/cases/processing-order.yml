    merge_log: "2026-09-18 新增（issue #4205，P1）+ 同批的菜单后端半边（#4203）：计件工资报表从「只有 per-order 汇总」变成按人/按期两级报表，且与 per-order 共用同一份聚合函数（验收判据要求两者对同一张单数值相等）。红证（修复前实测）：ProductionControllerTest 三条报表用例得 `Status expected:<200> but was:<404>`（端点不存在）、period 缺失用例得 `expected:<422> but was:<404>`；MenuControllerTest 得 `$.data.length() expected:<9> but was:<8>` 且 `$.data[?(@.code=='production')]` 无值；AuthServiceTest 得「菜单缺少「生产管理」组：[dashboard, product-center, notifications]」。修复后全绿。实现：ProductionService.pieceworkSummary + aggregate（per-order/报表/工人计件三处共用金额算法）+ parsePeriod（报表必填、工人计件可选，共用一份校验）+ ProductionController.pieceworkSummary（查询参数逐字 worker_name）+ 菜单两处同构。不做（如实登记）：按单下钻的多级联动 UI、工资发放/审批流。2026-09-20（issue #4621）：报表「按工序」档前端改为渲染 `逻辑名 · 部位`（`operation` 变体名不再进界面/`data-testid`），后端 `per_operation` 追加 `logical_name` + `position`；traces 补前端页测试。2026-09-20（issue #4696，用例库补漏）：本报表面此前**完全没登记** #4696 的「未定价 ≠ 0」（`unpriced` 块 / 不进 total / 与定价 0 可区分）⇒ 追加一条 data_check（**只加不改**：既有 7 条与 expectations 一字未动），traces 补 UnpricedNotZeroTest + UnpricedPieceworkReportTest 两个证据面 ｜ 2026-09-21（issue #4440 用例库同步，配套 PR #5068）：**菜单同构格整格改判 + 漂移面收口** —— ① 四子节点组成改为与前端 `config/menu.ts` 逐字同构（工序库 + 工艺路线 ⇒ 单一入口「工艺配置」`/production/routings`；补上此前整格漏登记的「入库单」`/inbound-orders`，权限码 `inbound:view`）；② 门控口径由「无 processing:manage ⇒ 整组不出现」改判为**子节点级门控**（只有 inbound:view 的人仍看到本组，组内只余入库单）；③ 原「同构只靠两侧各自的测试维持、漂移另单登记」**实测已发生**（服务端仍是合并前两节点 ⇒ 岗位权限页与真实侧边栏对不上）⇒ 改为指向两条**机器守卫**并把它们补进 `traces.tests`。**判据一格不放宽**（其余 7 条 data_check 与 `user_inputs`/`expectations`/`skip_reason` 一字未动）。 ｜ 2026-09-23（issue #5271 用例库同步）：**菜单同构格再改判（#4440 那条之后的新真值）** —— 组 key 由 `production` 收口为 `production-center`（三源此前 key 漂移）、组内由「生产看板 / 工艺配置 / 计件工资 / 入库单」改判为「生产看板 / 智能派单 / 工艺配置 / 计件工资」四项同码 `processing:manage`，并**新增** `inventory-center`「仓储与物料」三项（入库单 `inbound:view` + 余料台账 + 省料看板）的同步判据与子节点级门控判据、把守卫从「只比生产管理组」升级为**全树**（组 key + 组名 + 组顺序 + 导航型节点名）—— 原七项在 #5271 前是「生产管理」一个 7 项杂物抽屉，拆的是**语义不是数量**（4 + 3 = 7，一项不少不减）。判据只增不减：新增顶层组 key 序列与三组逐项点名断言。"
