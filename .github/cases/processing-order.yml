      - "**为什么必须有这个端点**：`production_operations` 的唯一写方曾是 V54/V56 种子 SQL（全仓对 `productionOperationMapper` 零写调用）⇒ 商家建不了自己的路线（没有工序可选），非 1 号租户连一道工序都建不出来（#4316）。证据同上 + ProductionControllerTest 的权限断言"
      - "**判据·建完必须可见（issue #4614，P1）**：body 增**可选** `positions`（数组）。给了 ⇒ **同一事务**为每个部位插一行 `production_operation_positions`（`logical_name` = 工序名的**归一逻辑名**，**复用** `ProductionOperationQueryService.normalizeOperationName`（`布帘车被` ⇒ `车被`；「逻辑名 + 部位后缀」那类字符串规则会得到库里没有的 `车被-布`）；`position` = 该部位；`unit_price` = 本次填的计件单价；`applicable=true`；`status='active'`；`deleted=0`；`tenant_id` = 当前租户），并在响应里**如实报数** `{created_positions, skipped_positions}`。**不给 `positions` ⇒ 行为一字不变**（响应不出现这两个键；老调用方/脚本不受影响）。证据：ProductionOperationCommandServiceTest「createWithPositionsInsertsMatrixRows」「createWithoutPositionsKeepsLegacyBehaviour」+ ProductionControllerTest「createOperationWithPositionsBuildsMatrixRows」**2026-09-21 订正（issue #4899 去部位化，不削弱本条判据）**：**省略 `positions` 时同样建那一行价目行**（兜底 `position = 布帘`；active 工序**恒有** `created_positions` / `skipped_positions` 两个响应键；**停用工序**省略 `positions` **不建行**）⇒ 「给了才建」的旧读法作废，下面这条「给了 ⇒」讲的是**显式**传入时的逐行语义（一字未改）。"
      - "**判据·幂等（不覆盖商家改过的价）**：同 `(tenant_id, logical_name, position)` 已有**未软删行** ⇒ **跳过该行**、响应 `skipped_positions` 如实计数，且整条路径**没有任何 update**（覆盖 = 把工价刷回新建时的值，工人工资当场变）。⚠️ 判据用 `deleted=0`（**与部分唯一索引 `uk_production_operation_positions_tenant_name_position … WHERE deleted=0` 同域**）：只比 `status='active'` 会漏掉停用行 ⇒ insert 撞索引 ⇒ 500 而不是可行动错误（同本类重名判据的既有教训）。证据：ProductionOperationCommandServiceTest「createSkipsExistingPositionRowsWithoutOverwritingPrice」"
      - "**判据·值域与前端同口径**：只接受**矩阵里出现的部位 ∪ 基线三部位**（`ProductionOperationQueryService.BASELINE_POSITIONS`，**单一出处**，路线写面的 `DEFAULT_POSITIONS` 引用它）—— **2026-09-21 改判（issue #4886 去部位化）**：前端「新增」对话框的「适用部位」勾选**已退场**（`positionOptions` 的消费点消失），值域口径**仍由服务端单点决定**（与路线写面共用 `BASELINE_POSITIONS` / `DEFAULT_POSITIONS`）；原句「前端勾得出的后端就必须收得下」的**现代形态** = 「**API 客户端传得出的**后端就必须收得下」（第 4 个部位 `布料` 仍合法）。空串 / 未知部位 / 非数组 / 显式空数组 ⇒ **422 + `error.details` 逐条**（`field=positions`），且**校验先于写入**（不先落一行工序库再回滚）。证据：ProductionOperationCommandServiceTest「createAcceptsPositionThatOnlyExistsInTheMatrix」「createRejectsUnknownOrBlankPositions」+ ProductionControllerTest「createOperationRejectsUnknownPosition」**2026-09-21 订正（issue #4899 去部位化，不削弱本条判据）**：显式传 `positions` 时值域/幂等/422 **一字未变**（本条照旧成立）；新增的是**省略 `positions`** 这一支 —— 省略时照样建那一行价目行（兜底 `position = 布帘`；active 工序**恒有** `created_positions` / `skipped_positions` 两个响应键，**停用工序**省略 `positions` **不建行**）；前端「新增工序」弹窗已**不再传** `positions`（见下条）。"
      - "**判据·前端对话框（形态裁定 A）**：`/production/routings` 的「新增」对话框**工序**那一支有「适用部位」多选（勾选项 = `positionOptions`，**不写死第二份**），**默认勾基线三部位**（与「新建路线」默认一致）；**一个都不勾 ⇒ 本地预检拦下、不发请求**，就地逐条理由（`routings-create-op-reasons`）；提交 body 带 `positions`；结果 toast 报**服务端返回的真实数字**（`created_positions`/`skipped_positions`），**缺结果体时显式报错、不假装成功**（照 `applySeedTemplate` 纪律）；新增成功后 `load()` 刷新 ⇒ 该工序**立刻出现在「工艺项」表里**且可就地定价。证据：frontend/admin-web/tests/unit/pages/production-routings.test.tsx 的 ⑳-①~⑥**2026-09-21 改判（issue #4886 去部位化）**：本条原写「对话框**工序**那一支有『适用部位』多选（勾选项 = `positionOptions`）、默认勾基线三部位、一个都不勾就本地拦下、提交 body 带 `positions`」—— 这一整格**已随部位维度退场**：「适用部位」多选、默认勾选、`routings-create-op-reasons` 那条「至少勾一个部位」预检**全部不再存在**，提交 body **不带 `positions`**（省略字段，而不是传空数组 —— 空数组会被读成「显式清空」）。**保留不放宽**：弹窗仍做**本地校验**（工序名 / 单价非数值 ⇒ 就地逐条理由、不发请求），且提交后仍以**服务端真实响应**为准（`created_positions` / `skipped_positions` 两个键恒在 ⇒ 缺结果体时**显式报错**，不假装成功）。证据：frontend/admin-web/tests/unit/pages/production-routings.test.tsx 的「新增工序」对话框用例组（#4886 改判后）"
      - "**判据·存量孤儿接入（issue #4614 范围补口）**：用户实测「工艺项里看不到 `测试22`，但**路线编辑的下拉**能看到」= **存量孤儿**（只有工序库行、没有矩阵行；#4609 把下拉也改成读矩阵后两边都看不到）。「工艺项」页顶部给**孤儿提示**（`matrix-orphan-hint`，仅当有孤儿时出现；判据 = 工序库工序的 id **不在**任何矩阵格的 `variant_operation_id` 里 —— 与后端 `variantNameOf` 同一份反查口径，前端**不写第二份归一**），点开**接入弹窗**（列出 名/分组/单位 + 每道勾适用部位，默认基线三部位）；确认 ⇒ 对每道勾了部位的孤儿发 `PUT /operations/{id}` 带 `positions`（**只补缺失行**：不删已有行、不覆盖已定价的格），toast 报服务端真实数字；接入后 `load()` 刷新 ⇒ **立刻出现在「工艺项」表里**且「路线编辑」下拉（同一份矩阵行键）也能看到它。冻结判据：矩阵行只在 `deleted=0` **AND** `status='active'` 的工序上补（停用工序 ⇒ 422）；新增路径与接入路径**共用同一处** `attachPositions`（`productionOperationPositionMapper.insert` 全仓只有一处调用点）。证据：frontend/admin-web/tests/unit/pages/production-routings.test.tsx ㉑-①~⑥ + ProductionOperationCommandServiceTest「updateAttachesMissingPositionRowsOnly」「updateRejectsPositionsOnDisabledOperation」「updateWithoutPositionsKeepsLegacyBehaviour」「updateRejectsUnknownPositionsWithSameVocabulary」+ ProductionControllerTest「updateOperationAttachesPositionsForOrphan」**2026-09-21 改判（issue #4886 去部位化）**：本条原写「点开**接入弹窗**（列出名/分组/单位 + 每道勾适用部位、默认基线三部位）；确认 ⇒ 对每道孤儿发 `PUT /operations/{id}` 带 `positions`（只补缺失行）」—— **该弹窗已整条退场**（它的**唯一目的**就是按部位补建价目行；一道工序一行 + 新建工序自带价目行后，这个动作不再有意义）。改判后的判据：① 存量孤儿仍**如实可见** —— 顶部只读提示 `matrix-orphan-hint`（仅当有孤儿时出现；判据 = 工序库工序的 id **不在**任何价目行的 `variant_operation_id` 里，与后端 `variantNameOf` **同一份反查口径**，前端**不写第二份归一**），文案如实报数 + `title` 给出路；② **不得**摆死路（不得留下指向已退场弹窗的残留入口）；③ **后端**的按部位写面**仍在**（`PUT /operations/{id}` 带 `positions` 的行为与 422 护栏一字未变，是存量数据的出路）—— 退场的只是**前端**这一个弹窗。证据：同文件「㉕-② 反向护栏：已被矩阵格指向的工序**不算**孤儿（不提示）」（**缺失态**） + ProductionOperationCommandServiceTest 的 `updateAttachesMissingPositionRowsOnly` 一族（后端判据不变）。**2026-09-21 事实订正（issue #4921，随 #4913 的用例库同步；本条判据一字未动）**：原写的「存量孤儿提示**在场/缺失两态**」里的**在场（报数）态**在**当前**前端测试里**不存在**（`matrix-orphan-hint` 在 frontend/admin-web 全仓只有那一条 `queryByTestId(...).toBeNull()`）⇒ 删除幽灵引用、如实登记「孤儿报数」这一格只有**源码级**证据（渲染分支 + 逐字文案），运行期报数未采集；同一处登记见 UI-050 判据 3（避免两处口径不一）。"
