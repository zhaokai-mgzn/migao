  # ==========================================================================
  # PG-017（issue #3917 新增 / **issue #4196 改判据**）：加工单「概念区分」守护用例。
  # 缺陷形态（证据会话 sess_f3c0ee0d2cc342a0）：用户问「加工单数据」，agent 用
  # **加工项目录**（22 项）冒充加工单 —— 靶子是这个形态，不是「调不调工具」本身。
  #   · #3917 下线态：靶子靠「零工具调用（direct_reply）+ 解释概念 + 引导后台」守护；
  #   · #4196 恢复接入后：判据改为「问加工单数据 ⇒ **必须**走 processing_order_query 取真值」。
  #     **这不是放宽**：靶子（不得用加工项冒充、不得编造）一条没删，且新增了「必须真调
  #     真值工具并成功返回」的正向要求 —— 判据面是**换向 + 收紧**，不是删断言；原判据的
  #     「零工具调用」在工具恢复接入后已成**过期处方**（它要求 agent 不查真值，继续留着
  #     就是把模型往错处推，同 #3921 那条已被反转）。
  # persona: mibao（B 端专属；不标会触发另一腿「禁止静默少跑」，#3822）。
  - id: PG-017
    legacy_id: ""
    title: "米宝加工单真值路由：问加工单数据 → 必须走 processing_order_query（不得用加工项目录冒充/编造，#4196）"
    domains:
      - processing-order
      - order
      - chat
    persona: mibao
    tier: normal
    tags:
      - processing_order
      - llm_behavior
      - concept_distinction
      - product_decision
    truths_ref: []
    user_inputs:
      - "查看加工单数据"
    expectations:
      # 正向主判据：问「加工单数据」必须落到 processing_order_query（加工单的**真值工具**）。
      # 加工项冒充形态（processing_item_query 返回目录）与「不查就答」形态都在这里失败。
      - processing_order_query
    must_succeed:
      # 机器可判的「真值」要求：工具必须**成功返回**（success=true）—— 只断言「被调用过」
      # 会放过「调了但失败 / 能力否定」的形态（#3856 的教训）。
      - tool: processing_order_query
    forbidden_tools:
      # 反向面**原样保留**（#3917 的靶子：加工项目录/加工项查询不得代替加工单）；
      # 另两条写工具一并禁：用户只问「查看」⇒ 不得顺手生成/流转加工单（写操作须用户明确
      # 指令 + 确认闸；确认卡未答时工具不会被真正调用，故本禁令不会误伤「先问要不要生成」）。
      - processing_item_query
      - processing_order_generate
      - processing_order_update
    forbidden_text:
      # 轮次作用域（仅 R1）+ any_of：特征词是「把加工项目录当加工单答」的形态指纹；
      # 正确的加工单真值回复（加工单号/状态/「未找到加工单」）不会枚举加工项目录项。
      - round: 1
        any_of:
          - "压褶定型"
          - "LG工艺"
          - "窗幔制作"
          - "刺绣工艺"
    want_text:
      # 回复必须谈到「加工单」本身（措辞天然发散，只钉这一个词 —— 逐词全中会把合格回答判红）
      - "加工单"
    data_checks:
      - "success=true"
      - "agent 用 processing_order_query 取加工单真值（成功返回），不用加工项查询/加工项目录冒充加工单、不编造加工单号/状态（机器断言：expectations + must_succeed + forbidden_tools + forbidden_text）"
    skip_reason: ""
    merge_log: "2026-09-15 新增（issue #3917）：B 端概念区分用例（加工单工具关闭后的行为守护，expectations=[direct_reply] + forbidden_tools 4 工具 + want_text 引导后台 + forbidden_text R1 目录特征词 + success=true）。；2026-09-18（issue #4196）**改判据**（加工单工具恢复接入）：① expectations 由 [direct_reply] 改为 [processing_order_query] —— 问加工单数据必须走真值工具；② 新增 must_succeed[processing_order_query]（工具必须成功返回，防「调了但失败/能力否定」）；③ want_text 去掉「后台/订单详情」（引导后台是下线态处方，接入后正确行为是给数据）；④ **forbidden 面原样保留**：processing_item_query（不得用加工项目录冒充加工单）+ 加工单生成/流转两写工具（只读问句不得顺手写）+ R1 目录特征词 forbidden_text **逐字未改**。**为什么这不是放宽**：(a) 靶子一条没删 —— 冒充形态仍必红（调 processing_item_query 即违规，且真值工具缺席同样必红）；(b) 判据从「不许调」换成「必须调真值且成功」= **换向 + 新增正向要求**（原来只证明「什么都没做」，现在证明「路由到了正确的真值工具并拿到真值」）；(c) persona / tier / domains 均未动。persona: mibao（B 端专属，缺省会触发另一腿「禁止静默少跑」，#3822）。"
    traces:
      tests:
        - "tests/agent_eval/local_runner.py"
      ci:
        - agent-eval.yml
      verifies: []

