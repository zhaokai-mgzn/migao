  - id: PG-013
    legacy_id: ""
    title: "米宝加工单 LLM 行为：查询含加工项订单 → 生成加工单（真实对话）"
    domains:
      - processing-order
      - order
      - chat
    tier: normal
    tags:
      - processing_order
      - llm_behavior
      - tool_call
    truths_ref: []
    user_inputs:
      - "最近有没有已确认、需要加工的订单？"
      - "帮我把这一个生成加工单"
      - "确认"
    expectations:
      - tool: order_query
      - tool: processing_order_generate
    order_before:
      - "order_query before processing_order_generate"
    required_args:
      - tool: processing_order_generate
        fields:
          - "order_ids"
    forbidden_text:
      - "暂不支持"
      - "功能不存在"
      - "没有这个功能"
      - "无加工项"
      - "生成未成功"
      - "生成失败"
      - "无法生成加工单"
      - "系统判定为"
    data_checks:
      - "前置：目标环境至少存在一个「已确认且含加工项」订单（否则 order_query 为空、无法生成）——CI smoke 档不纳入，normal 档需保证前置数据"
      - "生成后 processing_orders 落新行（status=generated），订单转 producing（验收以 GET /api/admin/processing-orders?keyword=<订单号> 复核）"
    skip_reason: ""
    merge_log: "2026-09-12 新增（验收缺口 #3348）：米宝加工单 LLM 行为真实对话用例（替代纯单测覆盖）"
    traces:
