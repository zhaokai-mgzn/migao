  # ==========================================================================
  # PG-022（issue #4208，P1）：应做数量接算料引擎（**Java 半边**）。
  # 真值源 §3「工序实例的应做数量 = 算料引擎输出（褶数/孔数/用料米数/幅数），报工只确认，不手工心算」。
  # 走查实测（2026-09-18，SHA d5bca241）：一张订单数量=3 的加工单，11 道工序的应做数量**全是 3.00**
  # ⇒「韩褶-布」显示 **3 折**。病根 = `positionQty(entry)` 取订单行 quantity（Java 侧无算料引擎）。
  # ai-agent 半边（端点 + `qty_and_source`）由 PR #4215 交付；本条钉 Java 接线。
  # ==========================================================================
  - id: PG-022
    legacy_id: ""
    title: "应做数量接算料引擎（Java 接线）——ProductionOperationQtyClient + buildPositionPayload + qty_source 列"
    domains:
      - processing-order
      - production
    tier: normal
    tags:
      - processing-order
      - production-reporting
      - operation-qty
      - calc-engine
    truths_ref: []
    user_inputs: []
    expectations: []
    data_checks:
      - "success=true"
      - "端到端判据（issue #4208 验收判据 5，**红证形态**）：新生成加工单的工序实例 `qty` = 算料引擎输出（**唯一真相源**）—— 走查实测的红证就是「韩褶-布 显示 3 折」（11 道工序全等于订单数量 3）⇒ **折/幅/套类 `qty` 不得等于订单行数量**；米类则**应当**等于订单行数量（该单的加工项按米计价时，订单行 `quantity` 就是米数 —— #4299 更正，见 PG-025）。逐值断言口径（**以 #4299 更正后的为准**）：米类 = 订单行 `quantity` 映射出的 `fabric_meters`（判据 = 有加工项即米类；存量快照仍按显式 `pricingMethod` 逐项判定，见 PG-025）、孔类 = `fabric_meters × 6`（`fabric_meters_x6`）、**折/幅/套类 = 兜底 1（`qty_source=fallback`）**。⚠️ 本条此前登记的「折类 24（`pleat_count`）」是**单测桩的平行真值**（夹具常量 12.3/24，**端点并不产出** `pleat_count` —— 订单侧从不落库褶数）⇒ 与下方「已知缺口」自相矛盾，2026-09-18 随 #4299 更正。**2026-09-25 随 #4337 更正（第二处平行真值 + 断言形态）**：共用夹具桩 `ProcessingOrderServiceTest` 的 `stubQty()` 米轴**旧形态**同样是与 `calc_info` 无关的平行真值（恒 12.3 / `fabric_meters`）⇒「米类 qty」一族断言对「`fabric_meters` 压根没送出去」不敏感；本单已把它改成 calc_info-aware（读该部位自己的 `fabric_meters`，缺键 ⇒ 兜底 1 + `fallback`），并删掉本节曾用的局部替身 `stubMeterQtyFromCalcInfo`（并存的第二套米轴口径 = 第二份真值）。同批把端到端用例那条 blanket「全部实例 `qty` ≠ 订单数量」**收窄成分轴**（折/幅/套 不得等于；米类应当等于 `calc_info.fabric_meters`）—— 旧 blanket 对米类**在现实中为假**，它当时之所以绿，唯一原因就是那根平行真值桩。证据：ProcessingOrderServiceTest「generateTakesQtyFromCalcEngineNotFromOrderQuantity」（订单数量=2：折/幅/套 断言 `qty` ≠ 2；米类断言 `qty` = `calc_info.fabric_meters` = 2）+「generateInstantiatesOperationsVerbatimFromOperationLibrary」（11 道逐条 + 米类 = 订单行 quantity）+「derivePositionPayloadUsesOperationLibrary」（存量单补工序的派生路径同一份）"
      - "客户端冻结契约（issue #4208 §② 冻结契约逐字）：全路径 `POST /api/internal/production/operation-qty`、鉴权头 `X-Service-Token`（复用**已有**配置键 `ai-agent.base-url` / `ai-agent.service-token`，**未新增配置键**）、请求体 `{positions:[{position_name, operations[], calc_info}]}`、响应外壳 `{success, data, requestId, timestamp}` 且 `data.positions[].{position_name, qty_by_operation, qty_source_by_operation}`。证据：ProductionOperationQtyClientTest「sendsFrozenContractAndParsesQtyVerbatim」（逐字段断言 URL / 头 / 请求体 / 解析值）"
      - "**降级 = fail-closed**（本单要治的缺陷的反面）：算料服务不可达 / 未配置 service-token / 外壳 `success != true` / 响应条数与请求不符 / 端点漏答某道工序 ⇒ 一律 `BusinessException(code=PRODUCTION_OPERATION_QTY_UNAVAILABLE, httpStatus=422, suggestion=可行动)`，且**不落半成品**（加工单行、工序实例、订单状态三者都不动）。**绝不静默回退订单数量** —— 那正是 issue #4208 的病根。证据：ProductionOperationQtyClientTest 3 项（未配置 token 且不发请求 / 不可达 / success=false）+「responseShapeMismatchFailsClosed」+ ProcessingOrderServiceTest「generateFailsClosedWhenQtyServiceUnavailable」（断言 code/suggestion 且 insert/updateOrderStatus 零调用）"
      - "`qty_source` 真落库（口径来源可观测，「兜底不静默」的唯一凭据）：实例表新增列 `processing_position_operations.qty_source`（V57 迁移，`ADD COLUMN IF NOT EXISTS`、**可空** —— 存量行 NULL = 本列引入前的旧实例，与 `fallback` 可区分），三源收敛 = 迁移列 ↔ Java 实体 `ProcessingPositionOperation.qtySource` ↔ 落库语句 `ProductionService.instantiate`（并进幂等签名，防配置漂移检测不到）。判据「米类 `qty_source != 'fallback'`、套类 `== 'fallback'`」由 ProcessingOrderServiceTest 的两条实例断言覆盖。证据：ProductionPositionOperationQtySourceMigrationTest 3 项 + ProductionControllerTest 的派生落库路径"
      - "不落 0（真值源同族红线）：应做 0 ⇒ 报工的 `done_qty ≥ qty` 恒真 ⇒ 假完工。缺键兜底 1 由**端点**负责（客户端不自行补值 —— 防第二份兜底口径）。证据：ProductionOperationQtyClientTest「clientDoesNotInventFallbackValues」+ ProcessingOrderServiceTest 的 `isNotEqualByComparingTo(ZERO)` 断言"
      - "`calc_info` 组装口径（**有仓内依据，不是第二份算料逻辑**）：订单行 `quantity` 的语义由**该单实际选的加工项计价方式**决定（`OrderItem.quantity` javadoc「per_meter=米数、per_set=1、per_area=宽×高」；前端 `deriveProcessingQty` 同口径）⇒ **判据（#4882 后为三段契约，见 PG-025 的 `isMeterBasedLine`）**：快照**显式带** `pricingMethod` 键的存量单按 `per_meter` 逐项判定（非 `per_meter` **不**冒充米数）；一项都不带该键的**新单**（#4882 起下单入口不再写它）⇒ **有加工项即米类**，把**订单行 `quantity`** 映射为 `fabric_meters`；订单侧已存的算料键原样透传。**判据字段的实测依据（#4299，真库可达面 68 条订单行）**：加工项 `pricingMethod` 命中 67/68；**拒用 `sellingMethod`** —— 它是**售卖方式**（真库 11 个取值 `bulk_cut`/`散剪`/`full_roll`/`整卷`/… 里 `per_meter` 一次都没出现过 ⇒ 旧写法永不命中）；**拒用 `products.pricing_type`** —— 它是**商品**属性，与订单行口径不是同一层，实测漏 18/68（11 条商品缺失/软删 + 6 条 `pricing_type=fixed` 而其加工项仍按米）。取值必须用**订单行 `quantity`**、不得用加工项自己的 `quantity`（实测订单行 7e6f2a1c… 订单数量 112.00 而其 per_meter 加工项 quantity=1）。证据：ProcessingOrderServiceTest「calcInfoDoesNotInventFabricMetersForNonPerMeter」+ PG-025 的 6 条用例 + 上面端到端用例里的请求体断言"
      - "**已知缺口（如实登记，非本条缺陷）**：订单侧**从不落库算料输出**（全仓零处写 `fabric_meters`/`pleat_count`）⇒「折 / 幅 / 套」类只能落**显式标注的兜底 1**（`qty_source=fallback`）；「孔」类因传了米数而行使命中端点的「每米 6 孔」估算分支（`fabric_meters_x6`）。因此 issue #4208 原始判据「韩褶-布 要变成真实褶数」**本单达不到**，本单修对的是**米/孔**两列。真正的修法是**下单时把算料输出落库**，跟随项 = #4118（其标题原文即「实际褶倍算了就丢」）"
    skip_reason: "[backend-contract] 后端契约用例（生成加工单是服务端写路径，无 LLM 环节，不进 agent-eval 冒烟）：断言全部由 Java 单测执行 —— ProductionOperationQtyClientTest（客户端冻结契约 + fail-closed 四态）/ ProcessingOrderServiceTest（端到端 qty + calc_info 口径 + fail-closed 不落半成品）/ ProductionPositionOperationQtySourceMigrationTest（V57 迁移 ↔ 实体 ↔ 落库语句三源收敛）/ ProductionControllerTest（存量单补工序的派生路径）"
    merge_log: "2026-09-18 新增（issue #4208，P1，Java 半边；ai-agent 半边 = PR #4215）。红证（修复前实测）：把 `buildPositionPayload` 的 `fillQty` 换回「应做数量 = 订单数量」⇒ ProcessingOrderServiceTest 5 条红（`generateTakesQtyFromCalcEngineNotFromOrderQuantity` 期望 12.3/24 实得 2、`generateInstantiatesOperationsVerbatimFromOperationLibrary`、`derivePositionPayloadUsesOperationLibrary`、`generateFailsClosedWhenQtyServiceUnavailable`、`calcInfoDoesNotInventFabricMetersForNonPerMeter`）；把客户端的不可达分支改回「返回空列表」（静默降级）⇒ ProductionOperationQtyClientTest「unreachableServiceFailsClosed」红；实现前 `ProductionOperationQtyClient` 类不存在 ⇒ 新增测试文件编译失败（找不到符号）。实现：ProductionOperationQtyClient（照抄 BriefingGenerateClient 范式：RestTemplate + SimpleClientHttpRequestFactory 超时 + 复用既有配置键）+ ProcessingOrderService.buildPositionPayload 两段式（先解析路线、再一次性问数回填）+ calcInfo 键名映射 + V57 迁移与实体/落库/幂等签名四处同改 + ProductionService.operationView 透出 qty_source。**不做（如实登记）**：下单时落库算料输出（#4118，跟随项）；订单侧补「部位/帘种」字段（类注释既有登记）。2026-09-18 更正（issue #4299，P1）：本条的两处口径被实测推翻并已就地改写 —— ①「`per_meter` 时映射为 `fabric_meters`」的**判据字段**从 `sellingMethod` 改钉**加工项 `pricingMethod`**（真库 `sellingMethod` 11 个取值里 `per_meter` 一次都没出现过 ⇒ 旧写法永不命中，真实订单上米类 `qty` 恒为兜底 1）；②「折类 24（`pleat_count`）」是**单测桩的平行真值**（夹具常量，端点不产出）⇒ 改为 #4208 更正后的口径「折/幅/套 = 兜底 1 + `fallback`」。本单新增 PG-025 专钉新判据；红证见 PG-025 的 merge_log。2026-09-25 更正（issue #4337，P2·测试可信度）：① 共用夹具桩 `stubQty()` 的**米轴**改为 calc_info-aware（读该部位自己的 `fabric_meters`，缺键 ⇒ 兜底 1 + `fallback`），并删掉 #4299 时加的局部替身 `stubMeterQtyFromCalcInfo`（并存的第二套米轴口径）；② 端到端用例那条 blanket「全部实例 `qty` ≠ 订单数量」**收窄成分轴**（折/幅/套 不得等于、米类应当等于 `calc_info.fabric_meters`），与本条 `data_checks` 的口径逐字一致；③ 同批收窄 4 处只证「有东西」的弱断言（2 处 `isNotNull()` → 时间闭区间、2 处 `isNotEmpty()` → 库路线工序名）。红证读数：改桩**前**收窄版断言实跑 3 红（`Tests run: 3, Failures: 3`，均为 `expected: 2 but was: 12.3`）；另注入 `isMeterBasedLine` 恒 `false`（= `calc_info` 不带 `fabric_meters`）⇒ 米类断言必红。**不做（如实登记）**：折/幅/套 那一轴的桩取值（24 / `fabric_meters_x6`）仍非端点真实行为（端点对折类是 `fallback`）—— 属 #4273 领地，本单只治米轴。"
    traces:
      tests:
        - "backend/admin-api/src/test/java/com/migao/admin/service/ProductionOperationQtyClientTest.java"
        - "backend/admin-api/src/test/java/com/migao/admin/service/ProcessingOrderServiceTest.java"
