      - "判据 2·**冻结映射双向钉死**（漏标/多标都红）：工序 `占位待确认` = V54 的 **30** 道（`op-v54-*`，单价是占位值）；`推算` = V56 的 **5** 道（`op-v56-*`，单价行业推算）。路线 `占位待确认` = V54 的 **6** 条（`rt-v54-*`，**含 布帘×韩褶** —— #4343 已证明它与客户真实加工单 CSO260915-02615 不符）；`推算` = V58 的 **3** 条纱帘（`rt-v58-*`，镜像布帘同工艺推导）。`实证` = **当前空集**（显式断言为空 + 注释说明「客户确认 #4261/#4343 后才会有」）—— 这是**诚实结论，不是遗漏**。证据：ProductionSourceProvenanceMigrationTest「frozenMappingSetsAreExactlyRight」「v62BackfillsOperationSources」「v62BackfillsRoutingSources」+ tests/unit_ci_workflows/test_production_catalog_seed.py「test_template_sources_are_the_frozen_provenance_mapping」"
      - "判据 3·回填按 **id 前缀**认领（`'op-v54-%'` / `'op-v56-%'` / `'rt-v54-%'` / `'rt-v58-%'`），**不是按名字列表**（名字列表会随改名漂移）；只动 `source IS NULL` 的行（幂等 + 不覆盖商家/模板已写的 source）；**其余行保持 NULL**（不落 `ELSE`：未知来源 = 未知，不许冒充「占位待确认」）。证据：ProductionSourceProvenanceMigrationTest 的两条回填用例"
      - "判据 4·存量 `tenants.industry` 自由文本一次性归一为受控 code：别名（布艺/窗帘/布艺窗帘/布艺纺织/布艺\/窗帘）→ `curtain`，其余非空 → `other`，空值不动；幂等（`WHERE industry IS DISTINCT FROM <归一结果>`，只更新尚未归一的那些行）；与 Java `IndustryCodes.normalize` **同口径**（两侧一致性由 IndustryCodesTest「migrationBackfillMatchesJavaNormalization」双向钉）。证据：ProductionSourceProvenanceMigrationTest「v62NormalizesLegacyIndustry」+ IndustryCodesTest"
