  # PG-036~PG-037（issue #4361，P1）：生产种子与行业绑定 —— 受控行业取值 +
  # 生产模板目录 + 开租自动套用 + provenance 标记（收口 #4316）。
  # 病根：生产种子只种 tenant_id = 1（V54/V56/V58/V59 全是字面量 1，四个文件里
  # `FROM tenants` 出现 0 次）⇒ 非 1 号租户工序库/路线库为空、建单 fail-closed（422）。
  # 用户裁定（2026-09-19）：「种子数据尽量和行业绑定」+ #4316 三选一 = 模板复制 + 开租自动套用。
  # 同时裁定 provenance 必须在数据与界面上可见（单价是占位值这件事不许静默）。
  # ==========================================================================
  - id: PG-036
    legacy_id: ""
    title: "生产种子模板：受控行业 code 归一 + 模板目录 + 幂等套用 + 开租自动套用（other 不套用且显式说明）"
    domains:
      - processing-order
      - production
    tier: normal
    tags:
      - processing-order
      - production-seed
      - industry-template
      - tenant-onboarding
    truths_ref: []
    user_inputs: []
    expectations: []
    data_checks:
      - "success=true"
      - "判据 1·受控行业取值（词表 v1 冻结 = curtain / other，不得自创第三值）：`IndustryCodes.normalize(raw)` 的**确切返回值**逐条可判 —— 「布艺」「窗帘」「布艺窗帘」「布艺纺织」「布艺/窗帘」「CURTAIN」→ `curtain`；「家居建材」「电子商务」「」/null/纯空白 → `other`。归一**幂等**（`normalize(normalize(x)) == normalize(x)`，回填/重复写入安全），且结果**恒属词表**（任何输入都不会漏出自由文本）。证据：IndustryCodesTest"
      - "判据 2·归一必须落在**两个**写面（只在注册路径归一 = 受控词表可被绕过）：`RegistrationService.approveApplication`（注册审批建租户）与 `SettingsController.updateSettings`（`PUT /api/admin/settings` 此前接受任意字符串）都调同一个 `IndustryCodes.normalize`。MockMvc：`PUT /api/admin/settings` 传「布艺纺织」⇒ 落库/回读是 `curtain`（**不是原样存**）。无法识别 ⇒ `other` + **显式日志**（不许静默 —— 库里看到 other 时分不清「客户真是其他行业」与「词表没认出来」）。证据：SettingsControllerTest 的 industry 归一用例"
      - "判据 3·模板目录（契约冻结，前端包 #4363 按此消费，不得改名）：`GET /api/admin/production/seed-templates` → `[{templateId, industry, name, version, description}]`；`POST /api/admin/production/seed-templates/{templateId}/apply` → `{created_operations, created_routings, skipped}`；权限统一 `processing:manage`。模板资产 = `resources/production-templates/index.json` + `curtain/seed.json`（**照 knowledge-templates 既有范式**，不另造抽象）。证据：ProductionSeedTemplateControllerTest 7 项（MockMvc **端点级**：目录逐键 = 契约冻结字段 / 套用返回 `created_operations`+`created_routings`+`skipped` / 幂等第二次全 0 + 全 skipped / 未知 templateId ⇒ 404 显式失败 / tenantId 取自 TenantContext 不信任请求体 / 类级声明 `processing:manage` 且方法级无更宽松覆盖）+ ProductionSeedTemplateServiceTest「listTemplates」2 项（服务层语义）。"
      - "判据 4·套用幂等（连续套用两次，工序/路线行数不变）：第二次全 skipped、**零 insert**；部分存在时只补缺的那些。幂等键 = `(tenant_id, name)` / `(tenant_id, curtain_type, craft)`（对齐 V49 部分唯一索引 `... WHERE deleted = 0`），**不是 id**。证据：ProductionSeedTemplateServiceTest「apply_isIdempotentOnSecondCall」「apply_onlyInsertsMissing」"
      - "判据 5·**落库 id 不得沿用模板 id**（模板 id `op-v54-01` 是全局主键、1 号租户已占用 ⇒ 原样插库会撞主键，「第二个租户」必崩）：落库 id 由 `ASSIGN_UUID` 生成（与既有写面 `POST /production/operations` 同款）。证据：ProductionSeedTemplateServiceTest「applyGeneratesFreshIdsForEveryTenant」——对**两个不同 tenantId** 各套用一次，断言两次都成功、各自 `(tenant_id, name)` 集合等于模板、且两租户的 id 集合**不相交**（复用模板 id ⇒ 撞主键 / 复用确定性 id ⇒ 不相交断言红）"
      - "判据 6·`other` 行业或模板缺失 ⇒ **不套用 + 显式原因**（不静默空库）：返回 `applied=false` + `reason`（点名原值，可追查），且**零 mapper 交互**；按 templateId 套用未知模板 ⇒ 404 显式失败。证据：ProductionSeedTemplateServiceTest「otherIndustry_appliesNothingWithReason」「unknownIndustry_namesTheRawValueInReason」「applyById_unknownTemplateFailsLoudly」"
      - "判据 7·开租自动套用：`approveApplication` 建租户后（`TenantContext.setTenantId` 生效期间）按 `industry` 套用模板；**失败不让开租整体回滚**（模板套用异常被捕获 + 记 error + 可经 `POST .../seed-templates/curtain/apply` 补套）。MockMvc：审批通过后该租户 `operations-catalog` / `routings` 非空且逐条等于模板。证据：RegistrationServiceTest 的自动套用用例 + ProductionControllerTest 的开租后读面用例"
      - "**红证（实现前实测）**：① 模板文件缺失 ⇒ `template_json` 夹具 fail-closed 红；② 把模板单价改一个字 ⇒ 五源收敛比对红（注入式自证 `test_template_drift_is_detected`）；③ 把 `op-v54-*` 原样当落库 id ⇒ 第二租户撞主键红（`applyGeneratesFreshIdsForEveryTenant`）。"
    skip_reason: "[backend-contract] 后端契约用例（服务端写路径 + 模板资产，无 LLM 环节，不进 agent-eval 冒烟）：断言由 IndustryCodesTest + ProductionSeedTemplateServiceTest + ProductionControllerTest + SettingsControllerTest 执行"
    merge_log: "2026-09-19 新增（issue #4361，P1，收口 #4316）。用户裁定：模板复制 + 开租自动套用 + provenance 可见。实现：IndustryCodes（受控词表 v1）+ resources/production-templates/{index.json,curtain/seed.json} + ProductionSeedTemplateService（listTemplates/applyTemplate）+ ProductionSeedTemplateController（契约冻结：GET seed-templates / POST {templateId}/apply）+ RegistrationService 开租自动套用 + SettingsController 写面归一。**不做**：不修 #4343 的数据不符（缺 4 道/顺序反 —— 要客户确认，属 #4261 清单）；不发明罗马帘工序/单价。"
    traces:
      tests:
        - "backend/admin-api/src/test/java/com/migao/admin/config/IndustryCodesTest.java"
        - "backend/admin-api/src/test/java/com/migao/admin/service/ProductionSeedTemplateServiceTest.java"
        - "backend/admin-api/src/test/java/com/migao/admin/controller/ProductionSeedTemplateControllerTest.java"
        - "backend/admin-api/src/test/java/com/migao/admin/controller/SettingsControllerTest.java"
        - "tests/unit_ci_workflows/test_production_catalog_seed.py"
      ci:
        - pr-check.yml
      verifies: []

