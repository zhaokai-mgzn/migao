    data_checks:
      - "success=true"
      - "订单携带（issue #4230 §2.1-1/2）：`processingInfo.specialOptions: string[]` 落在**既有 JSONB 内**（无需迁移），`buildSnapshot` 透传一份到加工单快照的 `items_snapshot[].specialOptions`（快照是加工单的固化真相，生成时的条件工序/系数都从快照读）。证据：ProcessingOrderServiceTest「generateSuccess」（快照五要素断言段）+ 判据 1/2 的用例（生成后实例即由快照的选项驱动）"
      - "判据 1·加工序（**红证**）：建单带 `specialOptions:[\"拼1次\"]` ⇒ 工序实例**多出 `拼1次-布`** 且**插在 `布三边` 之后**（seq=3），分组/单位/单价**逐字取工序库**（车位/幅/0.8）；不带该选项时**不出现**。锚点不在该部位路线中时**追加到末尾**（与真值源 `routing.py::_insert_after` 同款，例：纱帘路线无「布帘车被」）。条件工序插入后 **seq 重排为 1..N** —— seq 是报工「越站」防呆（取「seq 最大的前道」）与页面排序的唯一顺序依据，序号重复/断档 = 越站校验错。证据：ProcessingOrderServiceTest「specialOptionInsertsConditionalOperationAfterAnchor」（含不带选项的负例同断言）+「conditionalOperationAppendsWhenAnchorAbsent」"
      - "判据 2·加系数（**红证**）：建单带 `specialOptions:[\"一分二\"]` ⇒ 该部位**每道**工序实例 `factor = 1.7`；不带时为 `1.00`。取用口径与真值源 `routing.py::factor_for` 逐字同口径：单选项内**例外档盖住平摊档**（不是相乘 —— 相乘会把「平摊 ×1.7 + 逐工序 ×2.0」算成 ×3.4，重复计费）；多选项之间**相乘**；未登记选项**不得**悄悄改系数。证据：ProcessingOrderServiceTest「specialOptionFactorAppliesToEveryOperationOfThePosition」（带 1.7 / 不带 1 双向断言）"
      - "判据 3·**系数真的进了钱**（把「写进列」与「进了钱」分开钉死）：同一张单带/不带「一分二」的**计件合计**比值 = 1.7。判据走**真实** `ProductionService.aggregate`（Σ 合格数 × 实例快照单价 × 系数）+ 每条实例一笔「合格 1」的报工，合计比值因逐笔四舍五入到分有 0.01 级偏差 ⇒ 断言用容差（±0.01）而不是等号（等号会假红），并硬断言方向「带系数 > 不带」。证据：ProcessingOrderServiceTest「specialOptionFactorReachesPieceworkAmount」"
      - "判据 4·分类 C 不静默：`余料带回(布)` ⇒ 工序数**不变**、`factor` **仍为 1**，且**不是**因为「没映射到」—— 真值源 `NON_PIECEWORK_OPTIONS` 把它**显式登记为「不计件」**，两张表都**不种**（种进来会把它变成「有映射但系数 1」，两种语义又混成一种）。判别性：同一张单换成有映射的选项（余料做帘头）⇒ 工序数必须变 12。证据：ProcessingOrderServiceTest「nonPieceworkOptionIsExplicitNoop」+ ProductionOptionRoutingMigrationTest「nonPieceworkOptionsAreNotSeeded」"
      - "判据 5·种子防漂移（三源逐行相等）：V59 迁移的种子 ↔ `docs/sql/schema.sql` 的 bootstrap 终态 ↔ ai-agent `routing.py` 的 `SPECIAL_OPTION_ROUTINGS`（16 项，选项/条件工序/锚点/sort_order 逐值相等）与 `OPTION_FACTOR_SCOPES`（v1 只有「一分二 ⇒ ×1.7 / 该部位全部工序」一个**实证**档；§2.4 的逐工序细算档是纯推算 ⇒ 不种，不拿推算值覆盖实证值）。沿用 V54/V56 的既有防漂移范式。证据：ProductionOptionRoutingMigrationTest「seedMatchesTruthSourceAndBootstrap」+「factorScopesMatchTruthSource」"
      - "结构判据：`production_option_factors.operation_name` **可空**（NULL = 该部位全部工序的平摊档；非空 = 逐工序例外档，为「不把路堵死」保留），唯一性必须走 **COALESCE 表达式索引** —— NULL 在普通唯一索引里互不相等，不加 COALESCE 就能插进多行「同选项同平摊档」⇒ 系数取值不确定（静默失真）。证据：ProductionOptionRoutingMigrationTest「tableShapeGuardsNullFlatScope」"
      - "判据 6·不回归：无特殊选项的订单，工序实例的工序名/seq/单价/**factor 恒 1** 与改动前逐值相同。证据：ProcessingOrderServiceTest「noSpecialOptionsKeepsRouteAndFactorUnchanged」+「generateInstantiatesOperationsVerbatimFromOperationLibrary」"
      - "fail-closed：特殊选项引用的条件工序在工序库**无活跃行** ⇒ 中止生成（`PRODUCTION_OPERATION_NOT_FOUND` + 指名补救入口的 suggestion），**不落半成品**（不静默跳过 —— 静默跳过会让「勾了却没加工序」在数据上消失，那正是本单要治的形态）。证据：ProcessingOrderServiceTest「specialOptionReferencingMissingOperationFailsClosed」"
      - "**已知缺口（如实登记）**：加工单详情响应新增 `specialOptions` 字段（`ProcessingOrderItemBrief`）—— 不加会让 Jackson 的未知属性使整份 `items` 静默变 null；**商家后台「特殊选项」配置页（v1b）与下单勾选 UI（v1c）不在本单**（真值源 §2.2 的默认值是行业推算，v1b 才让商家可配）。"
    skip_reason: "[backend-contract] 后端契约用例（生成加工单是服务端写路径，无 LLM 环节，不进 agent-eval 冒烟）：断言全部由 Java 单测执行 —— ProcessingOrderServiceTest（条件工序插入/锚点缺失/seq 重排/系数双向/系数进钱/不计件显式 no-op/fail-closed/不回归）/ ProductionOptionRoutingMigrationTest（V59 ↔ bootstrap ↔ routing.py 三源防漂移 + 结构判据）"
    merge_log: "2026-09-18 新增（issue #4230，P1，Java 侧 v1a；ai-agent 半边 = PR #4234）。红证（修复前实测）：把 `buildPositionPayload` 里「插条件工序 + 落系数」两段整体去掉（= 修复前「订单不携带 specialOptions、factor 恒 1」的形态）⇒ ProcessingOrderServiceTest **6 条红**（specialOptionInsertsConditionalOperationAfterAnchor / conditionalOperationAppendsWhenAnchorAbsent / specialOptionFactorAppliesToEveryOperationOfThePosition / specialOptionFactorReachesPieceworkAmount / nonPieceworkOptionIsExplicitNoop / specialOptionReferencingMissingOperationFailsClosed），还原后全绿（md5 复核还原一致）；实现前两张表/两个实体/两个 Mapper 不存在 ⇒ 新增测试文件编译失败（找不到符号）。实现：V59 迁移（两张表 + 16 行条件工序种子 + 1 行系数种子，**版本号从 V58 让位** —— main 的 #4257 已占用 V58）+ `ProductionOptionRouting`/`ProductionOptionFactor` 实体与 Mapper + `ProductionOperationQueryService` 三处只读方法（optionRoutings/optionFactors/operationsByName，与 findRouting 的 catalogByName 同一份读取口径）+ `ProcessingOrderService` 的 specialOptions 归一化 / insertConditionalOperations / renumberSeq / applyFactors + buildSnapshot 透传 + 详情响应补字段。**不做（如实登记）**：v1b 商家配置页、v1c 下单勾选 UI、§2.4 逐工序细算档（推算值，待客户确认）。"
