  # ==========================================================================
  # LLM 行为正向用例（issue #3568 / #3592）：补 processing_order_query /
  # processing_order_update 的**零覆盖**缺口（门禁 `scripts/mibao_coverage.py --check`
  # 在 pristine main 上 exit 2 报出的结构性缺失）。
  # 断言全部机器可判：expectations + must_succeed + required_args + output_verify（带 action）。
  # ==========================================================================

  - id: PG-015
    legacy_id: ""
    title: "米宝加工单 LLM 行为：查询加工单（生成 → 按订单号回查状态）"
    domains:
      - processing-order
      - order
      - chat
    tier: normal
    tags:
      - processing_order
      - llm_behavior
      - tool_call
      - query
    truths_ref: []
    user_inputs:
      # 为什么不写「查一下加工单」：干净栈上 processing_orders 表为空（**没有任何
      # seed 注入加工单**，已核对 fixtures/*.sql 0 条 INSERT），空表的「查一下」
      # 只会得到空列表 —— 用例会退化成"没事发生"（假绿）。故先对**种子**里
      # 「已确认且含加工项」的订单生成加工单，再按订单号回查
      # （mibao_eval_seed.sql Phase 2：该单 order_items 带 processing_info）。
      # #3658（issue #3658）：目标订单由 0002 改为 **0003**（独立订单竞态修复——
      # 0002/0003/0004 分别归 PG-013/015/016，此前三条共用 0002，并发跑只有一个
      # 能生成成功，run 34820346966 实测 PG-013/016 吃「订单已生产中」假红）。
      - "把订单 EVAL-MB-ORD-0003 生成加工单"
      - repeat_until:
          tool_called: processing_order_generate
          max: 3
        fallback: "确认"
      - "订单 EVAL-MB-ORD-0003 的加工单现在什么状态？"
      - repeat_until:
          tool_called: processing_order_query
          max: 3
        fallback: "确认"
    expectations:
      - tool: processing_order_generate
      - tool: processing_order_query
    must_succeed:
      # 守卫口径已按 persona 收窄（#3580 修 `test_must_succeed_tools_are_customer_capabilities`
      # 的「遍历全库」bug：现在 `case_persona(c) != PERSONA: continue`，B 端/双端用例
      # 由 `test_mibao_case_invariants.py` 负责）→ B 端专属工具可以声明 must_succeed。
      # 这是比 `success=true` **更强**的断言：`must_succeed` 是「调了 ≠ 成了」的机器防线，
      # 会把每次尝试的轮次+错误码写进失败详情（工具层失败与模型层漏调可一行区分）。
      - tool: processing_order_generate
      - tool: processing_order_query
    required_args:
      - tool: processing_order_query
        fields:
          - keyword
    forbidden_text:
      - "暂不支持"
      - "功能不存在"
      - "没有这个功能"
      - "无法查询"
    data_checks:
      # 「调了 ≠ 成了」（issue #3361）：`success=true` 由 local_runner 的 scoring_checks
      # 计入评分；**同时**在 `must_succeed` 里声明工具（更强：把每次尝试的轮次+错误码
      # 写进失败详情）。两条并存不冲突（前者计入 expectations 评分，后者独立核验）。
      - "success=true"
      - "回查结果 grounded 到刚生成的加工单（status ∈ generated/issued/in_processing/completed/cancelled，不得编造）"
    # pre_clean（issue #4196 补，**去 skip 后门禁判出的存量缺陷，非新增豁免**）：
    # `CASE-TRUST-NO-SELF-CLEAN`（#3800 前置等价性）—— 本用例 R1 就是**写**（对
    # `EVAL-MB-ORD-0003` 生成加工单 ⇒ 落一张加工单行（订单状态不变，issue #4305）），却**未声明自清理**；
    # `_reset_for_retry` 按 `pre_clean` opt-in ⇒ 重试前不复位 ⇒ 第 2 次尝试 R1 看到
    # 「订单已生成过加工单」⇒ 与首跑前置不等价（成因不同的两次失败，归因会被引到错误对象）。
    # 该缺陷在 #3917 skip 期间不可见，#4196 去 skip 后由全量对账判出 ⇒ 当场修掉
    # （#4046：未登记违规一律阻塞，不得入账基线销声；修法即规则自带 fix：声明 pre_clean）。
    # 形态与 PG-013（0002）/ PG-016（0004）**完全同构**（三条各自独占一张种子订单，
    # `processing_order_reset` 按 `order_no` 精确匹配、不做子串/模糊匹配；0003 由 #3658
    # 从 0002 拆出给 PG-015 独占）。
    # ⚠️ 这是**加强**不是放宽：expectations / must_succeed / required_args / forbidden_text
    # 一字未动（见 merge_log）。
    pre_clean:
      - type: processing_order_reset
        order_no: "EVAL-MB-ORD-0003"
    # precondition（#4246 的 burn-down 缴费，2026-09-18；形态同 AS-003 / AS-004 的既有先例）：
    # 本用例按**订单号**点名生成加工单（R1），依赖「种子里那张专用订单 EVAL-MB-ORD-0003
    # （李四 / 13900139000）还在」—— 而订单侧没有部位字段，定位全靠这张种子单。
    # `order_count_for_phone` 是这条依赖在 runner 里**唯一**可观测的不可变键（手机号；
    # 种子只给该号码一张单 ⇒ 基线恰为 1）：
    #   · `expect: 1` = 前置本就不成立（残留单 / 别的用例在该号码下造单）时判
    #     「**不可归因于 agent 行为**」（#3835），不再伪装成 `unmatched expectation`
    #     （那看起来像「agent 不干活」—— PG-013/CU-003 的归因陷阱）；
    #   · `max_growth` 缺省 0 = 运行期间该号码的订单数**不得**增长（并行用例污染即判前置不成立）。
    # 证据强度边界（如实登记，不越级）：它钉的是「该号码名下**恰好一张**单」这个代理判据，
    # **不直接**核 order_no / status / 明细 —— 那需要新的 precondition type，本单不新增 runner 能力。
    # 断言只增不减：expectations / must_succeed / required_args / forbidden_text / pre_clean 一字未动。
    precondition:
      - type: order_count_for_phone
        source: "13900139000"
        expect: 1
    skip_reason: ""
    merge_log: "2026-09-14 新增（issue #3568 / #3592）：processing_order_query 此前**零用例覆盖**（scripts/mibao_coverage.py --check 在 pristine main 上 exit 2 报出的结构性缺失）。形态 =「先对种子订单生成加工单 → 按订单号回查」（干净栈无加工单 seed，直接「查一下」会假绿）。断言机器可判：must_succeed ×2 + required_args[keyword] + forbidden_text。2026-09-14 首次真重放（run 34820346966，issue #3658）：✅ **通过（score=100%）—— PG-015 的第一次真实执行证据**。目标订单由 0002 改为 0003（独立订单竞态修复，见 user_inputs 注释）。2026-09-15（issue #3917）skip：加工单工具对 agent 不再开放；2026-09-18（issue #4196）**去 skip**：加工单工具恢复接入（registry 注册 + order skill 工具/意图 + IntentType/描述/域/工具映射四处 + prompts/order.md 操作指引），**断言面原样保留**（expectations / must_succeed / required_args / forbidden_text / pre_clean 全部未改，未放宽）；去 skip 不空跑的前置 = runner 的 `pre_clean[processing_order_reset]` + 种子 EVAL-MB-ORD-0002/0003/0004（confirmed + paid + 明细带加工项）；**同 PR 补 `pre_clean: processing_order_reset(order_no=EVAL-MB-ORD-0003)`**（去 skip 后全量对账判出的存量缺陷 `CASE-TRUST-NO-SELF-CLEAN`：#3800 前置等价性 —— 本用例 R1 就是写（0003 转 producing）却未声明自清理，重试前置与首跑不等价。按 #4046 的 fail-closed 口径**当场修掉**，不入账基线；形态与 PG-013（0002）/ PG-016（0004）完全同构，0003 由 #3658 拆给本用例独占；这是**加强**不是放宽，其余断言一字未动）；2026-09-18（issue #4246 的 burn-down 缴费）：补 `precondition[order_count_for_phone: 13900139000, expect: 1]` —— 本用例按订单号点名生成加工单，依赖种子里那张专用订单 EVAL-MB-ORD-0003（李四/13900139000）还在；手机号是这条依赖在 runner 里唯一可观测的不可变键（种子只给该号码一张单 ⇒ 基线恰为 1）。判据清零 CASE-TRUST-NO-PRECONDITION-ASSERTION（整条销账，burn-down）。**行为层修复**（不是纸面）：runner 真在尝试前后各取一次基线、漂移即记一条 `precondition[order_count_for_phone]` 断言级失败（#3781/#3835 的失败关闭路径），把「前置不成立」与「agent 不干活」在报告里分开。边界如实登记：钉的是「该号码名下恰好一张单」这个代理判据，不直接核 order_no/status/明细（需新 precondition type，本单不新增 runner 能力）。expectations / must_succeed / required_args / forbidden_text / pre_clean 一字未动。"
    traces:
      tests:
        - "backend/admin-api/src/test/java/com/migao/admin/service/ProcessingOrderServiceTest.java"
      ci:
        - agent-eval.yml
      verifies: []

  - id: PG-016
    legacy_id: ""
    title: "米宝加工单 LLM 行为：更新加工单状态（完成加工，产出核到 completed）"
    domains:
      - processing-order
      - order
      - chat
    tier: normal
    tags:
      - processing_order
      - llm_behavior
      - tool_call
      - update
    truths_ref: []
    user_inputs:
      # 同上：干净栈无加工单 seed → 先对种子订单生成，再推进状态。
      # #3658（issue #3658，run 34820346966 / 34821647043 两轮实证后定稿）：
      #   ① 目标订单 0002 → **0004**（独立订单竞态修复，同 PG-015：三条 PG 用例不再抢同一订单）；
      #   ② 输入走**完整状态机** generated→issued→in_processing→completed
      #      （PG-006：generated→completed 是**非法迁移**，原「生成→直接标记完成」写法必失败
      #      —— 实测 agent 正确回复「已发加工还不能直接标记完成」）；
      #   ③ 每步的确认卡用 `auto_respond`（有卡答卡，§13.5 推荐形态）回答 —— **刻意不用**
      #      `repeat_until{tool_called: processing_order_update}`：runner 的停条件是
      #      **工具级**（该工具成功调用过即停，issue #3430），issue 成功后 start/complete 的
      #      repeat 轮会被整体跳过（run 34821647043 实证：开始加工的确认卡没人答 → 流程卡死，
      #      update 从未以 start/complete 执行）。生成步保留 repeat_until（工具名唯一，无此问题）。
      # `complete` 幂等（重复调用仍为 completed），不污染后续跑（cancel 非幂等且需 reason，
      # 故不用它做正向用例）。
      - "把订单 EVAL-MB-ORD-0004 生成加工单"
      - repeat_until:
          tool_called: processing_order_generate
          max: 3
        fallback: "确认"
      - "这笔加工单发加工，交期下周三"
      - auto_respond:
          fallback: "确认"
      - "开始加工"
      - auto_respond:
          fallback: "确认"
      - "这笔加工单加工完成了，标记完成"
      - auto_respond:
          fallback: "确认"
    expectations:
      - tool: processing_order_update
        args:
          action: complete
    must_succeed:
      # 守卫口径已按 persona 收窄（#3580）→ B 端专属工具可声明，理由同 PG-015。
      - tool: processing_order_update
        action: complete
    required_args:
      - tool: processing_order_update
        fields:
          - id
    # pre_clean（§18.4 前置等价性；同 #3833 给 PG-013 的修法，能力已在 runner 就位）：
    # 本用例是**写**用例且**首跑就改变自己的前置** —— R2 对 `EVAL-MB-ORD-0004` 生成加工单
    # ⇒ 落一张加工单行（订单状态不变，issue #4305）。而 `_reset_for_retry` 按 `pre_clean` **opt-in** ⇒ 原来没声明 =
    # 重试前不复位 ⇒ 第 2 次尝试的 R1 直接看到「订单已经生成过加工单了，无需重复生成」
    # （判定跑 34908262839 重试块 R1 逐字原文；首跑 R1 则要自己生成）。
    # 两次尝试的前置**不等价** ⇒ 首跑指纹与重试结果不可对比，归因会被引到错误对象上
    # （`PG-013` / `CU-003` 同族，见 `migao-dev-flow` §18.4）。
    # ⚠️ 只复位**本用例点名的这张专用种子订单**及其加工单（`processing_order_reset` 按
    # `order_no` 精确匹配、**不做**子串/模糊匹配；0004 是 #3658 从 0002 拆出来给 PG-016
    # 独占的，seed `mibao_eval_seed.sql` 里存在且为 confirmed）。该类型属**准备型**：
    # 订单查不到 ⇒ `precondition_not_applied` 折叠进结论（fail-closed，不静默放过）。
    pre_clean:
      - type: processing_order_reset
        order_no: "EVAL-MB-ORD-0004"
    # precondition（2026-09-18 burn-down 缴费，issue #4299）：本用例是**多轮 + 写**用例，
    # 却一直没有**可判定**的前置断言（CASE-TRUST-NO-PRECONDITION-ASSERTION）—— 前置悄悄
    # 不成立时，红的表现是「agent 不干活」（实测同族：PG-013 重试时订单已转 producing ⇒
    # agent **合理地**不再生成 ⇒ 归因全错，见 `migao-dev-flow` §18.4）。
    # 靶子 = 本用例独占的种子订单 `EVAL-MB-ORD-0004`（#3658 从 0002 拆出来给它独占），
    # 定位键用**不可变标识** = 收货人手机号 13700137000（种子 `mibao_eval_seed.sql` 里该号码
    # **只有这一笔**订单，且全仓没有别的用例往该号码名下造单）⇒ 声明层前置 = 「该号码名下
    # 订单数 = 1」。`expect: 1` 判基线（种子单不在库 ⇒ 前置本就不成立，不再伪装成 agent 表现差）；
    # `max_growth` 缺省 0 判运行期漂移（并行用例往同一号码造单 ⇒ 判前置被改写）。
    # 类型 `order_count_for_phone` 是 runner 已实现的前置类型（`local_runner._PRECONDITION_TYPES`），
    # 不是纸面字段：基线在尝试开始前捕获、尝试结束后回读，不一致即折成 `precondition_not_applied`。
    precondition:
      - type: order_count_for_phone
        source: "13700137000"
        expect: 1
    output_verify:
      # ⚠️ `action` 必写（本工具多 action：issue/start/complete/cancel）—— 不写限定
      # 时核对器会取**首个成功调用**的 payload，可能核到别的 action 上（假绿/假红）。
      # ⚠️ 只写**扁平顶层键**：runner 的 check_output_verify 按字面 key 查顶层 payload，
      #    **不支持点号路径**（`result.status` 这类键永远核不到 —— run 34822527203 实证
      #    「结果里没有字段 'result.status'」，即使 complete 已成功落库）。
      #    状态到达 completed 已由 must_succeed(action=complete) 机器兜底（服务端状态机
      #    校验，complete 幂等）—— output_verify 这里核对「complete 调用成功且 action
      #    确实是 complete」（防多 action 工具核到别的调用）。
      - tool: processing_order_update
        action: complete
        expect:
          action: complete
    forbidden_text:
      - "暂不支持"
      - "功能不存在"
      - "没有这个功能"
      - "无法更新"
      - "更新失败"
    data_checks:
      # 同 PG-015：`success=true` 计入评分，**并**在 `must_succeed` 声明工具（更强）。
      - "success=true"
      - "结论 grounded 到刚更新的加工单（订单联动状态见加工单设计决策 3：complete 不回退订单）"
    skip_reason: ""
    merge_log: "2026-09-14 新增（issue #3568 / #3592）：processing_order_update 此前**零用例覆盖**（同 PG-015 的结构性缺失）。断言机器可判：expectations(action=complete) + must_succeed(action=complete) + required_args[id] + output_verify（**显式声明 action**，防多 action 工具核到别的 payload 造成假绿）。2026-09-14 首次真重放（run 34820346966，issue #3658）：❌ 失败 → 归因**用例资产缺陷**（非 agent 能力缺口）：① 与 PG-013/015 抢同一种子订单 EVAL-MB-ORD-0002（并发生成只有一方成功，实测生成被拒「订单已生产中」后 agent 转向 issue 流，complete 期望永不满足）；② 输入跳步（生成后直接「标记完成」违反状态机 generated→completed 非法迁移，PG-006 铁律）。修复：独立订单 0004 + 完整状态机走位。2026-09-14 第二轮验证重放（run 34821647043）：❌ 再失败 → 新发现**用例设计缺陷**：状态机三步全用 `repeat_until{tool_called: processing_order_update}`，而 runner 停条件是**工具级**（issue #3430）——issue 成功（R6）后 start/complete 的 repeat 轮被整体跳过（开始加工确认卡无人答）。修复：每步确认卡改用 `auto_respond`（有卡答卡、无停条件跳过），生成步保留 repeat_until（工具唯一）。2026-09-14 第三轮验证重放（run 34822527203，PG-016-only）：状态机全走位成功（issue→start→complete 各成功，工具 14 调 0 失败），仅剩 output_verify 假红——`expect: result.status: completed` 用了**点号路径**，而 runner 的 check_output_verify 只按字面扁平 key 查顶层 payload（不支持嵌套路径，run 34822527203 实证「结果里没有字段 'result.status'」）。修复：expect 收敛为扁平键 `action: complete`（状态到达 completed 由 must_succeed + 服务端状态机兜底）。2026-09-15 第四轮归因（issue #3856，承接 #3835 的 PG-016 条目）：首跑指纹 `no_success(processing_order_update)` 在 4 个 run 复发（34873715194 / 34865780382 / 34856561459 / 34908262839）⇒ 复核后判**产品侧**：agent 把「加工方」当发加工必填 （34908262839 首跑 R5/R6 两次文本索要、R8/R10 两次 form 卡，`processing_order_update` 一次都没调用）。复核证据：processor/交期在工具 schema（`required=['id','action']`）、`validate_input`（`issue.required=['id']`）、服务端 DTO/Service **四处均为可选**——唯独 LLM 面对的口径 `prompts/order.md` 的「发加工」行把 `processor=加工方` 写进签名且不带「可选」标注（同行 `cancel(reason=必填)` 却标注）⇒ 口径不一致。**反证**：同 run 重试里 agent 未带 processor 直接 issue 成功（服务端接受）。修复 = 该行标注可选 + 禁止为可选字段索要/阻塞/重复发卡（不是静默默认值：缺省即不传该字段）。另一支机制（写落库后同 session 再读仍旧状态，34873715194/34865780382）**证据不足**：能排除「写没落库」（重试 R4 报「不允许从 [加工中] 变更」，证明首跑 issue+start 已落库），但读陈旧 vs 同轮并发竞态分不清 —— 缺 `#3823` 的 tool args/响应体 + DB 时序。本单同时补 `pre_clean: processing_order_reset{order_no: EVAL-MB-ORD-0004}`（§18.4：原先重试前置与首跑不等价，重试块 R1 实测「已经生成过加工单了」）。2026-09-15（issue #3917）skip：加工单工具对 agent 不再开放；2026-09-18（issue #4196）**去 skip**：加工单工具恢复接入（registry 注册 + order skill 工具/意图 + IntentType/描述/域/工具映射四处 + prompts/order.md 操作指引），**断言面原样保留**（expectations / must_succeed / required_args / forbidden_text / pre_clean 全部未改，未放宽）；去 skip 不空跑的前置 = runner 的 `pre_clean[processing_order_reset]` + 种子 EVAL-MB-ORD-0002/0003/0004（confirmed + paid + 明细带加工项）。2026-09-18 burn-down 缴费（issue #4299）：补 `precondition[order_count_for_phone(13700137000)=1]`，修 CASE-TRUST-NO-PRECONDITION-ASSERTION（此前多轮 + 写用例却无可判定前置断言 ⇒ 前置不成立时会伪装成「agent 不干活」）；**这是行为层修复、不是纸面修复**（`skip_reason: \"\"` ⇒ 真会跑；`order_count_for_phone` 是 runner 已实现的前置类型，基线在尝试前捕获、尝试后回读，不一致即折成 `precondition_not_applied`）；定位键用不可变标识（该号码在种子里只有这一笔订单）；断言只增不减（未改 expectations / must_succeed / required_args / forbidden_text / pre_clean / data_checks 任何一条）"
