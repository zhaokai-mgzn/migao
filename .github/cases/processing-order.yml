      # `processing_order_generate`（生成加工单）已从 B 端全部 skill 解绑 ⇒ 期望面按存活的
      # 只读路径改判为仅 order_query（用例条目保留、不删除；退役理由见 skip_reason / merge_log）。
    order_before:
      - "order_query before processing_order_generate"
    required_args: []
    # （#5247 退役）原必填参数断言 = processing_order_generate 的 order_ids —— 载体已从 B 端解绑
    # ⇒ 清空（否则成为永不满足的悬空声明；原值登记在 merge_log）。
    # pre_clean（issue #3833，#3800 同族的**新实例**）：本用例是写类用例 —— 首跑把
    # `EVAL-MB-ORD-0002` 生成一张加工单行（**订单状态不变**，issue #4305；见下方 data_checks），
    # 而 `_reset_for_retry` 按 `pre_clean` **opt-in** ⇒ 原来没声明 = 重试前不复位
    # ⇒ 第 2 次尝试 R1 只看到 1 笔已确认订单（首跑是 2 笔）、R2 看到「加工单早已生成」
    # ⇒ agent **合理地**不再调 `processing_order_generate` ⇒ 末次必红，且两次成因不同
    # ⇒ 误分类 `unstable`（实测判定跑 34908262839，末次 trace 逐字见 issue #3833）。
    # ⚠️ 复位**只动本用例点名的这张专用种子订单**及其加工单 —— seed 注释明写
    # 「EVAL-MB-ORD-0002 = PG-013 加工单生成用」，且 #3658 已把 0003/0004 分给
    # PG-015/PG-016；本类型按 `order_no` 精确匹配，**不做**任何子串/模糊匹配
    # （避免 #3800 记录的 `product_remove` 连带误删形态）。
    pre_clean:
      - type: processing_order_reset
        order_no: "EVAL-MB-ORD-0002"
    # precondition（issue #4361 的 burn-down 缴费，2026-09-19；形态同 AS-004 的既有先例，
    # 与 PG-015/PG-016 同族）：本用例是**多轮 + 写类**用例，R1 的问答结论依赖「该客户名下
    # 的订单集合」，而写步（生成加工单）依赖 EVAL-MB-ORD-0002 这张专用种子单在位。
    # 规则 `CASE-TRUST-NO-PRECONDITION-ASSERTION` 的 `counterexample` 字段**点名的就是本用例**：
    # 「首跑后订单转 producing，重试前置不成立 ⇒ 表现像 agent 不干活」（见上方 pre_clean 注释的
    # 实测 run 34908262839）—— 即**前置不成立时红的表现会被归因到 agent**。
    #
    # ⚠️ **为什么只声明漂移检测、不写 `expect`（与 PG-015/PG-016 的 `expect: 1` 不同）**：
    # PG-015/016 用的是**专用**手机号（13900139000 / 13700137000，种子里各只有 1 笔单 ⇒ `expect: 1`
    # 成立）；而本用例的客户号 `13800138000` 是**共享**评测号 —— 种子里它名下有 **3 笔**单
    # （EVAL-MB-ORD-0001/0002/0005），且它同时是商家冒烟默认登录号、另有多个用例（AS-004 等）
    # 挂在同一号码上。给共享号写死 `expect: N` ⇒ 任何人往该号码造单都会让本用例判「前置不成立」，
    # 形成**永远红 / 永远被豁免的空判据**（`migao-dev-flow` §19.1：基于错误真相模型写出的护栏）。
    # ⇒ 只声明 `source`（不写 `expect`）：runner 在尝试前后各取一次基线，**漂移即记一条
    # `precondition[order_count_for_phone]` 断言级失败**，把「前置被并行用例改写」与
    # 「agent 不干活」在报告里分开 —— 这正是本用例要的语义，且不引入恒定判据。
    # 断言只增不减：expectations / must_succeed / required_args / forbidden_text / pre_clean 一字未动。
    precondition:
      - type: order_count_for_phone
        source: "13800138000"
    # forbidden_text（issue #3833）：**从全程语义收紧成「轮次 + 措辞」精确断言**。
    # 全程语义的病灶（本 run 首跑**唯一**红点）：R1 是**问答轮**，agent 逐单如实陈述时说
    # 「⚠️ 20260915030240002 未见加工项，无法生成加工单」—— 那是对**另一笔**订单的**事实陈述**
    # （同一轮还说了「✅ 可生成加工单：EVAL-MB-ORD-0002」），却被全程禁令判成"拒绝执行"。
    # 形态与 `want_text` 的 `{round: n, text: …}` / `{round, any_of}` **同构**
    # （裸字符串 = 原有全程语义，向后兼容）。
    # 分档判据（**收紧，不是放宽**）：措辞若在**问答轮有正当语境**（如实披露某单不含加工项 /
    # 引用系统判定），就限定到**写操作轮**（R2 生成请求 / R3 确认）—— 真拒绝仍必红；
    # 措辞若属**能力自我否定 / 编造失败**（#3477 家族），任何一轮出现都是错的 ⇒ 保持全程。
    forbidden_text:
      # 全程：能力自我否定 / 编造失败 —— 本用例的任何一轮都没有正当语境
      - "暂不支持"
      - "功能不存在"
      - "没有这个功能"
      - "生成未成功"
      - "生成失败"
      # 写操作轮（R2 生成请求 / R3 确认）：这三条在 R1 问答轮有**如实陈述**的正当语境
      - round: 2
        any_of:
          - "无加工项"
          - "无法生成加工单"
          - "系统判定为"
      - round: 3
        any_of:
          - "无加工项"
          - "无法生成加工单"
          - "系统判定为"
    # must_succeed（issue #4196 补，**去 skip 后门禁判出的存量缺陷，非新增豁免**）：
    # `CASE-TRUST-NO-EFFECT-ASSERTION`（#3778「调用了 ≠ 成了」）—— 本用例的写期望是
    # `expectations[processing_order_generate]`，但效果层断言**一条都没有**：
    # `order_before` 是时序、`required_args` 只在"工具被调用过"时生效（未调用即 `continue`
    # 全绿，见 assertion_taxonomy.has_behavior_assertion 的口径注释）、`data_checks` 两条
    # 都是**纯散文**（不含机器计分标记 `success=true`）⇒ 工具返回 success=false 照样通过。
    # 该缺陷在 #3917 skip 期间**不可见**（skip 的用例不进对账集），#4196 去 skip 后由
    # `.github/case_trust_gate.py` 全量对账判出 ⇒ 必须当场修掉（#4046 的 fail-closed 口径：
    # 未登记违规一律阻塞，**不得**靠入账基线销声；修法即规则自带的 fix：加 must_succeed）。
    # 形态同 PG-015/PG-016 的既有写法（两条一直有 must_succeed，本用例独缺）。
    # ⚠️ 这是**加强**不是放宽：expectations / required_args / forbidden_text / pre_clean
    # 一字未动（见 merge_log）。
    must_succeed: []
    # （#5247 退役）原写成功断言 = processing_order_generate（#4196 补的效果层断言）——
    # 载体已从 B 端解绑 ⇒ 清空（否则成为永不满足的悬空声明；原值登记在 merge_log）。
    data_checks:
      - "前置：目标环境至少存在一个「已确认且含加工项」订单（否则 order_query 为空、无法生成）——CI smoke 档不纳入，normal 档需保证前置数据"
      - "如实说明米宝不做生成加工单（B 端米宝只做数据查询与分析）、引导用户去后台「生产管理」页面生成；不得声称已生成 —— #5247 改判（原断言「生成后 processing_orders 落新行（status=generated）、订单状态保持 confirmed」随 processing_order_generate 从 B 端解绑而失去对象，不是放宽：编造生成/编造落库仍必红）；issue #4305 的时点事实保留在此（订单进入 producing 的时点已从「生成加工单」挪到「发加工」，机器判据 = ProcessingOrderServiceTest 断言生成路径 never updateOrderStatus(producing)）"
    skip_reason: "[backend-contract] [#5247] B 端只读化（用户裁定 2026-09-23：B 端米宝只做数据查询与分析，创建/更新能力与对应 tools 全部从 B 端移除）⇒ 本用例断言的「生成加工单（processing_order_generate）」已从 B 端下线、不再绑定任何 B 端 skill。用例条目与退役理由保留（不删除）；断言面改判为 只读路径 order_query（订单查询）+ 如实说明米宝不做生成加工单 + 引导去后台生产管理页面。"
    merge_log: "2026-09-12 新增（验收缺口 #3348）：米宝加工单 LLM 行为真实对话用例（替代纯单测覆盖）；2026-09-15（issue #3833）修双重假红：① 补 `pre_clean: processing_order_reset(order_no=EVAL-MB-ORD-0002)` —— 写类用例自清理，重试前置回到 seed 初始态（confirmed + 无加工单），与首跑等价；② `forbidden_text` 从全程语义收紧成「轮次 + 措辞」：R1 问答轮如实陈述（某单未见加工项/引用系统判定）不再判红，写操作轮（R2/R3）真拒绝仍必红；能力自我否定/编造失败类措辞保持全程。expectations / required_args **未改**；2026-09-15（issue #3917）skip：加工单工具对 agent 不再开放；2026-09-18（issue #4196）**去 skip**：加工单工具恢复接入（registry 注册 + order skill 工具/意图 + IntentType/描述/域/工具映射四处 + prompts/order.md 操作指引），**断言面原样保留**（expectations / must_succeed / required_args / forbidden_text / pre_clean 全部未改，未放宽）；去 skip 不空跑的前置 = runner 的 `pre_clean[processing_order_reset]` + 种子 EVAL-MB-ORD-0002/0003/0004（confirmed + paid + 明细带加工项）；**同 PR 补 must_succeed[processing_order_generate]**（去 skip 后 `.github/case_trust_gate.py` 全量对账判出的存量缺陷 `CASE-TRUST-NO-EFFECT-ASSERTION`：#3778「调用了 ≠ 成了」—— 原断言面里 `order_before` 是时序、`required_args` 在工具未调用时 `continue` 全绿、两条 `data_checks` 是纯散文 ⇒ **无任何效果层断言**。按 #4046 的 fail-closed 口径**当场修掉**，不入账基线；这是**加强**不是放宽，expectations / required_args / forbidden_text / pre_clean 一字未动）。2026-09-18（issue #4305，用户裁定「发加工 = 订单进入生产中」）：第 2 条 data_check 里「订单转 producing」**已过时**（那是旧时点）⇒ 改判为「订单**保持 confirmed**」（加工单行照旧落库），其余断言未动。2026-09-19（issue #4361 的 burn-down 缴费，整条销账 CASE-TRUST-NO-PRECONDITION-ASSERTION）：补 `precondition[order_count_for_phone: 13800138000]` —— 本用例是**多轮 + 写类**用例（3 轮 + processing_order_generate），R1 问答依赖该客户名下订单集合、写步依赖 EVAL-MB-ORD-0002 在位，而此前**没有任何可判定前置断言** ⇒ 前置不成立时红的表现像「agent 不干活」（本规则 `counterexample` 字段点名的正是本用例，实证 run 34908262839）。**行为层修复、不是纸面修复**：`order_count_for_phone` 是 runner 已实现的前置类型（`local_runner._PRECONDITION_TYPES`），基线在尝试前捕获、尝试后回读，漂移即折成 `precondition_not_applied`。⚠️ **与 PG-015/PG-016 的 `expect: 1` 有意不同**：那两条用**专用**手机号（种子里各只 1 笔单）；本用例的客户号 13800138000 是**共享**评测号（种子里名下 3 笔单：0001/0002/0005，且同时是商家冒烟默认登录号、AS-004 等也挂该号）⇒ 写死 `expect: N` 会让任何人往该号码造单都判「前置不成立」，形成**永远红/永远被豁免的空判据**（§19.1）⇒ 故只声明 `source` 做漂移检测。断言只增不减：expectations / must_succeed / required_args / forbidden_text / pre_clean / data_checks 一字未动。 ｜ 2026-09-24（issue #5247，用户裁定 2026-09-23 B 端只读化）：processing_order_generate 从 B 端解绑 ⇒ 本用例退役（理由写在 skip_reason，条目不删除）；expectations 由 [order_query, processing_order_generate] 改判为 [order_query]，must_succeed(processing_order_generate) / required_args(order_ids) 两条写声明同步移除（否则成为永不满足的悬空声明），data_checks 第 2 条由「生成后 processing_orders 落新行（status=generated）；订单状态保持 confirmed」改判为「如实说明米宝不做生成加工单、引导后台生产管理页面；不得声称已生成」；pre_clean(processing_order_reset EVAL-MB-ORD-0002) 与 precondition(order_count_for_phone 13800138000) 按处置表**保留不动**（夹具/漂移检测，不是工具引用），order_before(order_query before processing_order_generate) 亦保留（runner 语义：B 未调用则不判时序 ⇒ 不构成悬空声明）；forbidden_text（含 R2/R3 轮次限定条目）/ user_inputs 一字未动。"
    traces:
      tests:
        - "tests/agent_eval/local_runner.py"
      ci:
        - agent-eval.yml
      verifies: []

  - id: PG-014
    legacy_id: ""
    title: "订单加工项不可变（源头约束，决策 C）：创建后无任何修改通道"
    domains:
      - processing-order
      - order
    tier: normal
    tags:
