  # ==========================================================================
  # PG-036（issue #4357，P2）：加工单菜单并入生产管理组 + 与生产看板**合并为单一入口**。
  # 病根（IA/重复入口）：同一份加工单有两个菜单入口 —— 订单管理组的「加工单」(/processing-orders)
  # 与生产管理组的「生产看板」(/production) 调**同一个** processingOrderApi.list()，
  # 列高度重叠、共用同一个「生产明细」跳转；而 #4305 已把列表页四个状态流转入口全部移除
  # ⇒ 列表页只剩「台账」价值，重复入口的收益为负。
  # 且分组与权限边界错位：加工单权限码一直是 processing:manage（= 生产管理组四项同码）。
  # 真值源：docs/design/processing-order-design.md「加工单是 producing 阶段的子进度，不是平行单据」；
  # docs/design/domain-model-review-sales-production-finance.md 的「智能销售 / 智能生产 / 智能财务」域划分。
  # 前端 IA 用例（写路径无 LLM 环节，不进 agent-eval 冒烟）。
  # ==========================================================================
  - id: PG-036
    legacy_id: ""
    title: "加工单并入生产管理组 —— 与生产看板合并为单一入口（消除重复入口 + 分组/权限口径对齐）"
    domains:
      - processing-order
      - production
      - menu
    tier: normal
    persona: ""
    tags:
      - processing-order
      - production
      - menu
      - ia
      - admin_web
    truths_ref: []
    user_inputs:
      - "打开侧边栏：订单管理组只有订单列表/售后工单；加工单在产进度去生产管理组的生产看板看"
    expectations: []
    data_checks:
      - "侧边栏 IA（**核心/长期判据，红证在这条**）：① 订单管理组**不含**「加工单」（只剩 订单列表 / 售后工单 两项）；② 生产管理组仍为四项（生产看板 / 工序库 / 工艺路线 / 计件工资，权限码统一 processing:manage）；③ 全站不再存在指向 `/processing-orders` 的菜单项。红证（实现前实测，本机 vitest）：`production-board.test.tsx`「「加工单」不再是独立菜单项」得订单管理组仍渲染该项（`within(tradeGroup).queryByText('加工单')` 非 null）+ `expect(hrefs).not.toContain('/processing-orders')` 得 `expected [ … '/processing-orders' … ] not to contain '/processing-orders'`"
      - "合并 ≠ 丢能力（**合并口径的判据**）：`/production` 必须吸收原列表页的**全部**既有能力 —— 关键词搜索（按加工单号/订单号）、状态筛选、重置、刷新、商品与数量快照摘要、「查看」跳订单详情；且断言必须落到**结果可见**（筛选后被筛掉的行从 DOM 消失、命中的行留下），不得只断言 API 被调用。红证（实现前实测，本机 vitest 6 条红）：合并能力①~⑥ 得 `getByPlaceholderText('请输入加工单号或订单号')` 找不到元素（看板当时无查询区）/ 行内无「查看」按钮 / 无商品摘要列"
      - "旧入口收敛（**不 404**）：`/processing-orders` 不再渲染列表页，改为重定向到 `/production`（旧书签/外部深链可用）；子路由 `/processing-orders/{id}/production`（生产明细）**不随菜单移除**，仍由看板行内「生产明细」进入。红证（实现前实测，本机 vitest）：`processing-orders-list.test.tsx` 得 `expected \"redirect\" to be called with [ \"/production\" ]`（当时该页仍渲染列表、从不重定向）。证据：同文件 + `tests/e2e/specs/orders/processing-orders.spec.ts`「旧入口 /processing-orders 重定向到 /production」"
      - "入口收敛不回归（issue #4305）：合并后的唯一入口**仍不渲染** 发加工/开始加工/加工完成/取消加工单 四个按钮，且仍显示「状态流转请在订单详情操作」。红证（实现前实测）：看板当时无该引导文案 ⇒ 该条红；#4305 的负向断言在本条**一条不放宽**。证据：`production-board.test.tsx`「入口收敛不回归」+ e2e「唯一入口不再提供状态流转入口」（五种状态逐行负向断言）"
      - "时序保护随能力迁移（issue #4303 的长期判据 = 加载竞态）：搜索/筛选/刷新搬到看板后，**请求序号保护必须一起搬** —— 旧的在飞列表响应晚到不得把看板覆盖回旧数据，`loading` 只由最新一次请求收尾。红证（实现前实测）：`production-board.test.tsx`「PG-024 时序保护」得 `getByPlaceholderText(...)` 找不到元素（看板无搜索 ⇒ 竞态无从触发）；留在被合并掉的页面里 = 保护随页面一起消失。"
      - "面包屑与侧边栏一致（§15.2）：`/production` 系列此前**没有任何面包屑条目** ⇒ 落进兜底分支显示「工作台 > 经营看板」；本单补 生产管理×{生产看板, 工序库, 工艺路线, 计件工资}，且 `/processing-orders/{id}/production` 由「订单管理 > 加工单」改判为「生产管理 > 生产明细」。红证（实现前实测，本机 vitest 4 条红）：Header 的 /production、/production/operations、/production/piecework 三条得找不到「生产管理」（当时走兜底面包屑），/processing-orders/{id}/production 得找不到「生产明细」"
      - "权限护栏随入口走（**不得砍既有护栏**）：`/production` 此前**无**前端路由权限守卫，而它承接的原 `/processing-orders` 有 `processing:manage` ⇒ 合并后守卫必须跟着入口走（layout.tsx ROUTE_PERMISSION_MAP 新增 `/production`，前缀覆盖三个子页），否则等于砍掉既有第二道防线。证据：`frontend/admin-web/src/app/(dashboard)/layout.tsx` 的 ROUTE_PERMISSION_MAP（后端 @RequirePermission 仍是唯一硬拦面）"
    skip_reason: "[backend-contract] 前端 IA / 页面结构 / 交互流（admin-web），由 vitest 单测（production-board / processing-orders-list / Header）+ Playwright E2E 旅程（tests/e2e/specs/orders/processing-orders.spec.ts）覆盖，非 LLM 行为，不进入 agent-eval 冒烟（同 PG-024 惯例）"
    merge_log: "2026-09-19 新增（issue #4357，P2）。用户提问「加工单菜单是否放入到加工管理更合适」→ 裁定「是，且合并而非只搬家」，组名保持「生产管理」。红证（实现前实测，本机 vitest：3 文件 13 failed / 44 passed，失败逐条列在 data_checks 内）。实现：menu.ts 移除 trade-center 的 processing-orders 项（生产管理组**不新增项** —— 加工单与生产看板合并为同一入口）；/production 吸收列表页全部能力（关键词/状态筛选、重置、刷新、商品与数量列、查看按钮、筛选空态）+ 请求序号保护（issue #4303 迁移）；/processing-orders 改重定向；Header.tsx 补生产管理组四条面包屑并改判 processing-orders 面包屑；layout.tsx 补 /production 权限守卫。**不做（如实登记）**：① 不移动 /processing-orders/{id}/production 路由（#4345 刚稳定该路径的 e2e，避免同批双重改动；副作用 = 该子页侧边栏无高亮项，另单）；② 不改后端菜单树（MenuController/AuthService 与前端 menu.ts 的漂移、且前端根本不消费服务端菜单，另单）；③ 不涉及 agent 行为 ⇒ 按 #4262 不派发真实 LLM 评测。"
    traces:
      tests:
        - "frontend/admin-web/tests/unit/pages/production-board.test.tsx"
        - "frontend/admin-web/tests/unit/pages/processing-orders-list.test.tsx"
        - "frontend/admin-web/tests/unit/components/Header.test.tsx"
        - "tests/e2e/specs/orders/processing-orders.spec.ts"
      ci:
