      - "§5 防呆（issue #4116 P0-3，逐条对应一次真实误报工的形态，每条各有独立红证；② 越站已于 issue #4694 删除）：① 重复报工幂等——请求头 X-Client-Request-Id 非空时按 (tenant_id, 键) 去重，同键重复**不再执行**、回放首次结果并带 replayed=true（连点/网络重试不得让 done_qty 翻倍；与下单/建工单复用同一套 ClientRequestIdService 与 client_request_keys 表）；② 越站**已删除**（issue #4694，2026-09-20 用户逐字裁定「是否允许跳站？这个不需要管理，因为现实生产过程中工人会自动推进，系统就无需管理生产顺序」）—— 同部位 seq 更小的**立即前道**未完成（done_qty<qty）时**不再 422**，跳站报后续工序按**实际工序**正常记账（落明细 + 推进 done_qty + 按数量×快照单价计件）；既有「越站 ⇒ 422」断言已**改钉**为「越站 ⇒ 放行」（**改钉≠放宽**：判据对象不变，期望按用户裁定变更）。⚠️ 删的是**顺序闸门**，不是**工序确定性**：⑤ 报工必须带明确 operationId（缺失/空白 ⇒ 422 VALIDATION_ERROR，工序未确定不得记账 —— 否则计件会记错工序 ⇒ 发错工资）；③ 数量上限——done_qty+本次合格数 > qty 时 422 + 「本次最多可报 N」suggestion（**拒绝而不 clamp**：报工明细不可变且是计件唯一凭证，clamp 会造成「明细 15 米 / 进度 10 米」的自相矛盾台账），恰好报满（9+1=10）必须放行；④ 非本部位——报工必须落在该加工单**实际存在且活跃**（deleted=0，NULL 亦 fail-closed）的工序实例上，跨租户/软删/跨加工单/凭空工序 id 一律 404 且不落明细。并发（不同键）由 advanceDoneQtyIfUnchanged 的 CAS 谓词关闭丢更新窗口：影响行数 0 ⇒ 409 fail-closed，绝不静默覆盖别人的报工。前端（bmini 扫工页）另有 in-flight 锁 reportInFlightLock + 按钮 disabled，且每次报工带一个新幂等键"
      - "🔴 扫码语义 = **开工 / 领活**（issue #4967，2026-09-21 用户逐字裁定①：「工人都是先扫码报工后再真实进行生产，不是先生产再扫码报工」）—— **记账时点不变**，改的是语义/文案/落码：① `started_at` / `worker_id` / `worker_name` 在**默认路径被写入**（三列 `V92` 已建，本单**不新增迁移**、不碰任何 db/migration/*.sql）；`started_at` 写入形态 = `COALESCE(started_at, #{startedAt})` ⇒ **只有第一次领活落笔**（重扫 / 续报 / 换人再扫都**不改写**已记下的开工时刻），`worker_id` / `worker_name` 则跟**最新一次**领活人（「谁现在在做」——两条口径有意不同，已如实登记）；改前这三列恒 NULL（「C 模式预留，A 模式默认路径不读不写」）⇒ 真库判据改前必红。② 按钮 / 页面文案 = 【开工】/【领活】（改回【完成】⇒ 前端测试必红）。③ 解析响应**追加** `set_overview` = 本套 → 部位 → 工序明细（逻辑名 / 应做数量+单位 / 单价 / 状态 / 已报数量），`POST /api/worker/production/scan/complete` 的回执**原样透传**同一份 ⇒ 工人端（H5 + bmini）扫一次就按套看到工序细节；列**全部**工序（含已领走的道 —— 工人要看出「还剩哪几道」），`unit_price` 为 null = **未定价**（≠ 0 元，issue #4696）读面不折 0；旧码降级形态**没有**这个键（判不出是哪一套 ⇒ 不猜）。**聚合只有这一份**（与推断/进度/卡点同源）——页面不得另拉 `GET /api/worker/production/orders/{orderId}/operations` 再按套重排（第二份口径）。④ **记账时点与拒绝路径一字未变**：仍是一次事务（明细 + CAS 推进 done_qty/status + 计件 + 必完全绿 ⇒ 加工单 completed），未确定工序 / 旧码降级 / 超上限 / CAS 冲突四条拒绝路径仍**零写入**；`report` 端点仍**不改**（设计 §4.2 方案 A）。⑤ ⚠️ **边界（如实登记，不粉饰）**：`done_at` **名不副实**（记的是领活时点）⇒ 设计 §6「卡在哪」判据**降级**为「领了没做」；最后一道必完工序**被领活**时加工单即 `completed` ⇒ 系统「完工」早于真实完工、`完工 → 发货` **提前放行**（用户已知悉并接受）。证据：backend/admin-api/src/test/java/com/migao/admin/service/ProductionScanClaimRealDbTest.java（真 PG：三列真落库 + COALESCE 幂等）+ ProductionScanCompleteServiceTest（set_overview 形状与值 / 领活三列写入面 / 拒绝路径零写入）+ frontend/worker-h5/tests/worker-h5-scan-complete.test.mjs + frontend/bmini-app/tests/production-scan-complete.test.tsx"
      - "🔴 幂等键的边界 + 去重**没有 DB 兜底**（issue #4845，来自 #4814 的源码级核实；**只登记事实，不改行为**）。**键**：请求头 X-Client-Request-Id（ClientRequestIdService.HEADER 是单一事实源，frontend/worker-h5/src/api.mjs 的 CLIENT_REQUEST_ID_HEADER 逐字同名），**由客户端生成**（frontend/worker-h5/src/app.mjs 的 newRequestId = crypto.randomUUID()，回落 req-<ts>-<rand>；服务端从不生成键）⇒ **键会变**：① 同一屏重试（连点【完成】）**不变**（state.view.__requestId 复用）；② 刷新 / 关页重开 / 换标签页 —— 仅当「同一工人 + 同一张码 + 上次提交**没收到服务端答复**」三者同时成立才复用（未确认提交落 localStorage 单槽 PENDING_REQUEST_KEY：发出**之前**写、仅在服务端**答复过**时清），否则**换新键**；③ 换屏（重扫 / 扫另一张码 / 旧码选套选部位）**换新键**；④ **换设备 / 换浏览器换新键**（该槽只在**本设备**）；⑤ 成功后 afterComplete **刻意**丢键（下一道 = 新的一笔，这条是对的）。**键不同 ≠ 重复计件**：同一道工序由**三道业务判据**挡住（ProductionScanService 的 pending 过滤掉 isDone（done_qty ≥ qty）⇒ 409 SET_ALREADY_COMPLETED / 422 NO_PENDING_OPERATION；ProductionScanCompleteService 的 plannedRemaining ≤ 0 ⇒ 409 OPERATION_ALREADY_ADVANCED；ProductionService 的 assertWithinPlannedQty（Σ合格 ≤ 应做）+ advanceDoneQtyIfUnchanged 的 CAS）—— 换键**确实**会多写一行，但那是**下一道**满额（重扫时待做工序已推进），**不是同一道重复**。**DB 侧没有任何兜底**：production_work_logs **全库零 UNIQUE**（backend/admin-api/src/main/resources/db/migration/V49__create_production_operations_and_work_logs.sql 只建了两条**非唯一**索引 idx_work_logs_po / idx_work_logs_worker_date；全库迁移 + docs/sql/schema.sql 零 UNIQUE）—— **有意如此**（分段完成 = 同一工序**合法的多行**，两次合法提交之和 = 应做数量），**不得**为该表加唯一约束。判据落点、复算命令与守卫见 docs/design/set-code-and-scan-loop.md §5.3.2。证据：backend/admin-api/src/test/java/com/migao/admin/service/ProductionScanCompleteServiceTest.java（换键同工序零写入 / 换键落下一道满额 / 同键回放）+ frontend/worker-h5/tests/worker-h5-scan-complete.test.mjs（跨刷新复用同键 + 成功后必须换新键 + 跨工人不复用）"
