  # ==========================================================================
  # PG-039（issue #4384 A1，P0）：工序库「作用域」scope 列 —— 主数据 + 读面 + 写面 + 前端。
  # 病根：真值源 docs/curtain-production-rules.md §8 明写「**外帘**是加工单打印行部位，
  # **不是**路线键」，但 V54/V58 种子里 外帘打卷/外帘装袋/外帘发货 的 position='外帘'
