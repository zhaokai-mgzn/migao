  # ==========================================================================
  # PG-024（issue #4303）：加工单列表页（/processing-orders）**列表请求时序保护**。
  # 缺陷形态（实测，Playwright + 真后端，本地）：点「发加工」→「确认发加工」，后端写成功
  # （PATCH 200、库里 status=issued），但列表行仍显示「已生成」（DOM 在 +0.5s/+1.0s/+1.5s 未变，
  # +2.0s 才变）—— Resource Timing 显示一个 **4174ms 才返回的旧列表 GET** 落在 PATCH（358ms）
  # 之后，把新数据**覆盖回旧值**。
  # 判据的**长期形态** = 「旧的在飞响应晚到不得覆盖更新的列表数据」，与具体触发入口无关
  # （搜索/筛选/刷新/写后刷新皆然）。
  # ⚠️ 双端（persona 空）：前端页面行为，由 admin-web vitest 覆盖，不进 agent-eval 冒烟。
  # ==========================================================================
  - id: PG-024
    legacy_id: ""
    title: "加工单列表请求时序保护——旧的在飞响应晚到不得覆盖更新的列表数据（#4357 后落点为生产看板）"
    domains:
      - processing-order
      - processing
    tier: normal
    persona: ""
    tags:
      - processing-order
      - admin_web
      - request_ordering
      - list_refresh
    truths_ref: []
    user_inputs:
      - "打开生产看板（加工单唯一入口），连续筛选/刷新，列表始终显示最新一次请求的数据"
    expectations: []
    data_checks:
      - "时序保护（**核心/长期判据，红证在这条**）：同一页面并发多个列表请求时，**只认最新一次请求的响应** —— 先发出的慢请求（旧数据快照）晚到 ⇒ 其响应被**丢弃**，列表**不得**回退成旧数据。红证（修复前实测，本机 vitest）：原 `processing-orders-list.test.tsx` 断言①得 `expected '…已生成…' to contain '加工中'`（旧响应把「加工中」覆盖回「已生成」，与 issue #4303 的实测形态同形）。**2026-09-19（issue #4357）落点迁移**：列表页并入生产看板 ⇒ 本判据的断言落在 `production-board.test.tsx`「PG-024 时序保护」（同形：旧响应把「加工完成」覆盖回「加工中」）；保护必须随搜索能力一起搬，留在被合并掉的页面里 = 保护随页面一起消失。"
      - "同一保护覆盖全部触发路径：搜索/筛选（查询）、重置、刷新、写操作后的收敛刷新 —— 共用**同一份**列表加载函数与同一套请求序号，不得各写一套（禁止复制第二份加载逻辑）；且 `loading` 态只由最新一次请求收尾（旧响应被丢弃时不得把 loading 错误地留在 true）"
      - "不回归：加载失败仍给「加载加工单失败，请稍后重试」+ 重试入口；首屏/筛选后的空态文案（「暂无加工单」/「暂无加工单（当前筛选条件下）」）与状态文案（已生成/已发加工/加工中/加工完成/已取消）不变"
    skip_reason: "[backend-contract] 前端行为（admin-web 页面/交互），由 vitest 单测覆盖（frontend/admin-web/tests/unit/pages/production-board.test.tsx），非 LLM 行为，不进入 agent-eval 冒烟（同 PP-011 惯例）"
    merge_log: "2026-09-18 新增（issue #4303）：加工单列表页写操作后行状态不刷新（用户看起来像「点了没反应」）。根因两条：① `loadList()` 无请求时序保护（任何历史请求的响应回来都 `setList`，后到的旧响应覆盖新数据）；② 写操作成功后只 `loadList()`、不用写响应即时更新该行。红证（修复前实测，本机 vitest 2 条红）：断言① `expected '…已生成…' to contain '加工中'`（旧响应覆盖新数据）+ 断言② `expected '…加载中…' to contain '已发加工'`（行未反映写响应）；修复后同两条全绿。实现：`listReqSeq` 请求序号 ref（旧响应一律丢弃、`loading` 只由最新请求收尾）+ 写成功后 `applyUpdated(res.data?.data)` 即时更新该行 + 写后收敛刷新走 `loadList({ silent: true })`。**判据长期形态**按后续 P3（移除列表页写入口、唯一入口改订单详情页）的裁定定为「加载竞态」；断言②属「当前 main 有效」，P3 落地时随实现一并移除并由该单更新测试文件。2026-09-19（issue #4357）：**按本条自己写下的约定执行两件事** —— ① 原「写响应即时反映」data_check **移除**（其写入口已随 #4305 从加工单侧移除，该断言在 main 上早已无对应实现）；② 落点由列表页迁到生产看板（列表页并入看板 ⇒ 断言文件与 traces 改为 production-board.test.tsx），`reqSeq` 保护随代码一并搬入 `production/page.tsx`。判据强度未放宽（时序保护一条一字未改）。"
    traces:
      tests:
        - "frontend/admin-web/tests/unit/pages/production-board.test.tsx"
      ci:
        - pr-check.yml
      verifies: []
