  - id: PG-016
    legacy_id: ""
    title: "米宝加工单 LLM 行为：更新加工单状态（完成加工，产出核到 completed）"
    domains:
      - processing-order
      - order
      - chat
    tier: normal
    tags:
      - processing_order
      - llm_behavior
      - tool_call
      - update
    truths_ref: []
    user_inputs:
      # 同上：干净栈无加工单 seed → 先对种子订单生成，再推进状态。
      # #3658（issue #3658，run 34820346966 / 34821647043 两轮实证后定稿）：
      #   ① 目标订单 0002 → **0004**（独立订单竞态修复，同 PG-015：三条 PG 用例不再抢同一订单）；
      #   ② 输入走**完整状态机** generated→issued→in_processing→completed
      #      （PG-006：generated→completed 是**非法迁移**，原「生成→直接标记完成」写法必失败
      #      —— 实测 agent 正确回复「已发加工还不能直接标记完成」）；
      #   ③ 每步的确认卡用 `auto_respond`（有卡答卡，§13.5 推荐形态）回答 —— **刻意不用**
      #      `repeat_until{tool_called: processing_order_update}`：runner 的停条件是
      #      **工具级**（该工具成功调用过即停，issue #3430），issue 成功后 start/complete 的
      #      repeat 轮会被整体跳过（run 34821647043 实证：开始加工的确认卡没人答 → 流程卡死，
      #      update 从未以 start/complete 执行）。生成步保留 repeat_until（工具名唯一，无此问题）。
      # `complete` 幂等（重复调用仍为 completed），不污染后续跑（cancel 非幂等且需 reason，
      # 故不用它做正向用例）。
      - "把订单 EVAL-MB-ORD-0004 生成加工单"
      - repeat_until:
          tool_called: processing_order_generate
          max: 3
        fallback: "确认"
      - "这笔加工单发加工，交期下周三"
      - auto_respond:
          fallback: "确认"
      - "开始加工"
      - auto_respond:
          fallback: "确认"
      - "这笔加工单加工完成了，标记完成"
      - auto_respond:
          fallback: "确认"
    expectations:
      - tool: processing_order_update
        args:
          action: complete
    must_succeed:
      # 守卫口径已按 persona 收窄（#3580）→ B 端专属工具可声明，理由同 PG-015。
      - tool: processing_order_update
        action: complete
    required_args:
      - tool: processing_order_update
        fields:
          - id
    output_verify:
      # ⚠️ `action` 必写（本工具多 action：issue/start/complete/cancel）—— 不写限定
      # 时核对器会取**首个成功调用**的 payload，可能核到别的 action 上（假绿/假红）。
      # ⚠️ 只写**扁平顶层键**：runner 的 check_output_verify 按字面 key 查顶层 payload，
      #    **不支持点号路径**（`result.status` 这类键永远核不到 —— run 34822527203 实证
      #    「结果里没有字段 'result.status'」，即使 complete 已成功落库）。
      #    状态到达 completed 已由 must_succeed(action=complete) 机器兜底（服务端状态机
      #    校验，complete 幂等）—— output_verify 这里核对「complete 调用成功且 action
      #    确实是 complete」（防多 action 工具核到别的调用）。
      - tool: processing_order_update
        action: complete
        expect:
          action: complete
    forbidden_text:
      - "暂不支持"
      - "功能不存在"
      - "没有这个功能"
      - "无法更新"
      - "更新失败"
    data_checks:
      # 同 PG-015：`success=true` 计入评分，**并**在 `must_succeed` 声明工具（更强）。
      - "success=true"
      - "结论 grounded 到刚更新的加工单（订单联动状态见加工单设计决策 3：complete 不回退订单）"
    skip_reason: ""
    merge_log: "2026-09-14 新增（issue #3568 / #3592）：processing_order_update 此前**零用例覆盖**（同 PG-015 的结构性缺失）。断言机器可判：expectations(action=complete) + must_succeed(action=complete) + required_args[id] + output_verify（**显式声明 action**，防多 action 工具核到别的 payload 造成假绿）。2026-09-14 首次真重放（run 34820346966，issue #3658）：❌ 失败 → 归因**用例资产缺陷**（非 agent 能力缺口）：① 与 PG-013/015 抢同一种子订单 EVAL-MB-ORD-0002（并发生成只有一方成功，实测生成被拒「订单已生产中」后 agent 转向 issue 流，complete 期望永不满足）；② 输入跳步（生成后直接「标记完成」违反状态机 generated→completed 非法迁移，PG-006 铁律）。修复：独立订单 0004 + 完整状态机走位。2026-09-14 第二轮验证重放（run 34821647043）：❌ 再失败 → 新发现**用例设计缺陷**：状态机三步全用 `repeat_until{tool_called: processing_order_update}`，而 runner 停条件是**工具级**（issue #3430）——issue 成功（R6）后 start/complete 的 repeat 轮被整体跳过（开始加工确认卡无人答）。修复：每步确认卡改用 `auto_respond`（有卡答卡、无停条件跳过），生成步保留 repeat_until（工具唯一）。2026-09-14 第三轮验证重放（run 34822527203，PG-016-only）：状态机全走位成功（issue→start→complete 各成功，工具 14 调 0 失败），仅剩 output_verify 假红——`expect: result.status: completed` 用了**点号路径**，而 runner 的 check_output_verify 只按字面扁平 key 查顶层 payload（不支持嵌套路径，run 34822527203 实证「结果里没有字段 'result.status'」）。修复：expect 收敛为扁平键 `action: complete`（状态到达 completed 由 must_succeed + 服务端状态机兜底）。"
    traces:
      tests:
        - "backend/admin-api/src/test/java/com/migao/admin/service/ProcessingOrderServiceTest.java"
      ci:
        - agent-eval.yml
      verifies: []
