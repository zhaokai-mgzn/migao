原先重试前置与首跑不等价，重试块 R1 实测「已经生成过加工单了」）。2026-09-15（issue #3917）skip：加工单工具对 agent 不再开放；2026-09-18（issue #4196）**去 skip**：加工单工具恢复接入（registry 注册 + order skill 工具/意图 + IntentType/描述/域/工具映射四处 + prompts/order.md 操作指引），**断言面原样保留**（expectations / must_succeed / required_args / forbidden_text / pre_clean 全部未改，未放宽）；去 skip 不空跑的前置 = runner 的 `pre_clean[processing_order_reset]` + 种子 EVAL-MB-ORD-0002/0003/0004（confirmed + paid + 明细带加工项）。2026-09-18 burn-down 缴费（issue #4299）：补 `precondition[order_count_for_phone(13700137000)=1]`，修 CASE-TRUST-NO-PRECONDITION-ASSERTION（此前多轮 + 写用例却无可判定前置断言 ⇒ 前置不成立时会伪装成「agent 不干活」）；**这是行为层修复、不是纸面修复**（`skip_reason: \"\"` ⇒ 真会跑；`order_count_for_phone` 是 runner 已实现的前置类型，基线在尝试前捕获、尝试后回读，不一致即折成 `precondition_not_applied`）；定位键用不可变标识（该号码在种子里只有这一笔订单）；断言只增不减（未改 expectations / must_succeed / required_args / forbidden_text / pre_clean / data_checks 任何一条） ｜ 2026-09-24（issue #5247，用户裁定 2026-09-23 B 端只读化）：processing_order_update 从 B 端解绑 ⇒ 本用例退役（理由写在 skip_reason，条目不删除）；title 由「更新加工单状态（完成加工，产出核到 completed）」改判为「查加工单状态（只读；原「更新状态-完成」随 #5247 写能力下线改判）」，expectations 由 [processing_order_update(action=complete)] 改判为 [processing_order_query]，must_succeed 由 [processing_order_update(action=complete)] 改判为 [processing_order_query]，required_args 由 processing_order_update(id) 改判为 processing_order_query(keyword)，output_verify(action=complete 的产出核对) 与 user_inputs 第 2 轮的 repeat_until{tool_called: processing_order_generate} 整块移除（fallback 保留），data_checks 第 2 条由「结论 grounded 到**刚更新的**加工单」改判为「结论 grounded 到库里**实有的**加工单」（不是放宽：编造状态仍必红）；pre_clean / precondition / forbidden_text / data_checks 第 1 条（success=true）一字未动。"
