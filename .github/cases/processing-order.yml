  # 真值源 §2「计件单价（版本化）」/§4「单价 = 工序 × 部位定价，版本化（调价只影响新报工，
  # 历史报工按当时价，逐笔可追溯）」；走查实测：production_operations 唯一写方是 V54 种子 SQL。
  # ==========================================================================
  - id: PG-020
    legacy_id: ""
    title: "工序库写面——PUT /production/operations/{id} + 单价版本表（当前价 = 最新版本行，实例快照冻结）"
    domains:
      - processing-order
      - production
    tags:
      - processing-order
      - production-operations
      - price-versioning
    truths_ref: []
    user_inputs: []
    expectations: []
    data_checks:
      - "success=true"
      - "写面端点（#4204 冻结契约 2）：PUT /api/admin/production/operations/{id}（方法级 processing:manage）body {unit_price?, is_start_marker?, status?, unit?, group_name?, sort_order?, scope?}（🔴 **2026-09-21 改判（issue #4961）**：`is_must_finish` **已从可写字段里去掉** —— 出现即 **422** + `error.details:[{field,message}]` + 可行动 hint，**不静默忽略**（理由：接受它会让调用方以为「设上了必完」，而库里一字未改、判定也不看它）；`scope` **仍可写**且取值校验一字未动（#4960 删的是商家写面，不是后端契约键 —— 见 PG-039 判据 3））—— **部分更新**（只写 body 里出现的字段，未给的列一律不碰，避免把并发改动覆盖回去），返回更新后的工序（形态 = 目录项 operationView，与 GET /operations-catalog 同一份整形）。非法值 fail-closed：负单价 / status ∉ {active,disabled} / 非布尔标记 ⇒ 422 且不落库；工序不存在/跨租户/已软删 ⇒ 404 且不落库。证据：ProductionOperationCommandServiceTest 6 项 + ProductionControllerTest 4 项"
      - "单价版本化（#4204 冻结契约 3）：改价 = 同一事务写两处 —— ① production_operations.unit_price（新生成加工单的实例化取值源）② production_operation_price_versions 追加一行（**当前价 = 最新版本行**）。新表由 V55__create_production_operation_price_versions.sql 建出（版本号从 V55 起，避开 #3813 登记的存量重复版本号 V29/V33 区间），并同步 docs/sql/schema.sql（bootstrap 路径不跑迁移链）；幂等：CREATE TABLE/INDEX IF NOT EXISTS + 回填初始版本按 NOT EXISTS 守卫 + ON CONFLICT (id) DO NOTHING（bootstrap-first 会让迁移在建好终态的库上再跑一遍，无守卫则每次启动追加一行重复版本）。证据：ProductionOperationPriceVersionMapperTest 4 项（实体↔V55↔schema.sql 三源收敛 / 幂等 / 索引按 (operation_id, created_at DESC) 且只索引未软删 / 外键指向 production_operations）"
      - "实例快照冻结（#4204 验收判据 1 后半 + 2）：改价**不影响既有实例**与历史报工 —— processing_position_operations.unit_price 是生成时的快照（V49 注释），PUT 路径物理上没有写实例表的能力（ProductionOperationCommandService 不注入实例表 Mapper，结构判据）。红证：ProductionOperationCommandServiceTest「priceChangeCannotTouchInstanceSnapshots」（结构断言）+ ProductionControllerTest「updateOperationWritesNewPrice」（verify 实例表 insert/update 零调用）"
      - "改价不制造无意义调价账：同价重复提交 ⇒ 幂等空操作（不追加版本行），但仍返回更新后的工序。证据：ProductionOperationCommandServiceTest「samePriceDoesNotAppendVersion」+ ProductionControllerTest「updateOperationWithSamePriceDoesNotAppendVersion」"
      - "权限（#4204 验收判据 3）：写面是方法级 processing:manage（类级 order:list 是读口径，覆盖不了写操作；PermissionInterceptor 方法级优先）。红证：ProductionControllerTest「updateOperationDeclaresManagePermission」逐条断言注解值；非 processing:manage 调用由 PermissionInterceptor 拦为 403（拦截器语义见 PermissionInterceptorTest/DF-007）"
      - "历史口径已作废（防假真值回填）：ProductionOperationQueryService 类注释里「只读边界（本类明确不做）：不提供工序库的增删改端点」在新口径下**仍成立**（该类仍只有 SELECT）—— 写面在 ProductionOperationCommandService；不得把「写面存在」读成「读类越界」。另：V54 种子是**初始价**来源，改价后 production_operations.unit_price 与最新版本行同事务维护，「当前价 = 最新版本行」对存量数据由 V55 回填保证"
    skip_reason: "[backend-contract] 后端契约用例（写路径无 LLM 环节，不进 agent-eval 冒烟）：断言全部由 Java 单测执行 —— ProductionOperationCommandServiceTest（写面语义 + 版本账 + 结构判据）/ ProductionControllerTest（MockMvc 端点契约 + 权限注解）/ ProductionOperationPriceVersionMapperTest（实体 ↔ V55 ↔ docs/sql/schema.sql 三源收敛 + 幂等）"
    merge_log: "2026-09-18 新增（issue #4204，P1）：工序库从「只读 + 唯一写方是 V54 种子 SQL」变成有写面 + 单价版本账。红证（修复前实测）：ProductionControllerTest「updateOperationWritesNewPrice」得 `Status expected:<200> but was:<404>`（PUT 端点不存在），「updateOperationDeclaresManagePermission」得 `NoSuchMethodException: ProductionController.updateOperation(String,Map)`；版本表/实体不存在 ⇒ 新测试文件编译失败（找不到 ProductionOperationPriceVersion / ProductionOperationPriceVersionMapper）。修复后全绿。实现：ProductionOperationCommandService（部分更新 + 改价追加版本行）+ ProductionController.updateOperation + V55 迁移 + 实体/Mapper + docs/sql/schema.sql 镜像（经用户裁定批准；该文件不在原始写路径白名单内，属白名单疏漏）。不做（如实登记）：工序库前端（#4203 承接）、特殊选项系数 factor 接线（另单）。 ｜ 2026-09-19（issue #4416）：**工序库前端页面位置变更** —— 工序库与工艺路线合并为单页「工艺配置」`/production/routings`（工序库 = 该页**左栏**：搜索 + 分组目录 + 行内改单价/必完/作用域 + 「加入路线」），旧 `/production/operations` 改为重定向。本条**后端契约与断言面零变化**（写面端点、版本账、部分更新口径逐字未动）；前端回归锁落在 `frontend/admin-web/tests/unit/pages/production-routings.test.tsx`（case_ids 含 PG-020）。 ｜ 2026-09-21（issue #4961 用例库同步，配套 feat/4960-4961-integration）：写面可写字段清单**改判** —— `is_must_finish` 移出可写字段（带它 ⇒ 422 + 可行动 hint，不静默忽略；证据 `ProductionOperationCommandServiceTest` 的「#4961 写面退场：更新工序带 is_must_finish ⇒ 422 + 可行动 hint」），并把**仍可写**的 `scope` 补进清单（#4960 **只删商家写面**，后端该键与 DB 取值一字未动；前端不再发它 —— 见 PP-014 / PG-039 判据 4）。本条其余判据（部分更新口径 / 版本账 / 实例快照冻结 / 权限 / 历史口径）与 `user_inputs` / `expectations` / `skip_reason` / `traces` **一字未动**，**判据一格不放宽**。"
    traces:
      tests:
        - "backend/admin-api/src/test/java/com/migao/admin/service/ProductionOperationCommandServiceTest.java"
        - "backend/admin-api/src/test/java/com/migao/admin/controller/ProductionControllerTest.java"
        - "backend/admin-api/src/test/java/com/migao/admin/mapper/ProductionOperationPriceVersionMapperTest.java"
      ci:
        - pr-check.yml
      verifies: []

  # ==========================================================================
  # PG-021（issue #4205，P1）：计件工资报表（按人/按期）+ 生产管理菜单同构。
  # 真值源 §4「工资报表 = 报工事件聚合（按人/按期/按单下钻）」；走查实测：只有 per-order 汇总，
  # 老板/财务答不出「这个月每个工人做了多少件、该发多少钱」。
  # ==========================================================================
  - id: PG-021
    legacy_id: ""
    title: "计件工资报表——GET /production/piecework/summary（按人/按期）+ 生产管理菜单同构"
    domains:
      - processing-order
      - production
      - menu
    tier: normal
    tags:
      - processing-order
      - piecework
      - report
      - menu
    truths_ref: []
    user_inputs: []
    expectations: []
    data_checks:
      - "success=true"
      - "报表端点（#4205 冻结契约 4）：GET /api/admin/production/piecework/summary?period=YYYY-MM[&worker_name=]（方法级 processing:manage）→ {period, total, per_worker:[{worker_name, amount, qty}], per_operation:[{operation, amount, qty}]}。聚合源 = production_work_logs（work_date 落在 period 内、work_type=normal）；period 必填且必须 YYYY-MM（缺失/非法 ⇒ 422 可行动错误，不静默返回空报表）；worker_name 是可选下钻维度（查询参数名逐字为 worker_name）。证据：ProductionControllerTest 3 项 + ProductionPieceworkSummaryTest 5 项。2026-09-20（issue #4621）：per_operation 每项**追加** `logical_name` + `position`（**只加不改** —— `operation` 仍是工人端快照名；`position` = 帘种，按 `operationId` 关联工序实例带出，join 不到给 `null`）；**分组口径不变**（仍是「每个工序实例一行」，`精裁 · 布帘` / `精裁 · 纱帘` 各一行）"
      - "口径一致性（#4205 验收判据 2，**红证判据**）：同一批报工下「per-order 合计 == 报表 total」—— 两者共用**同一份**聚合（ProductionService.aggregate：Σ(合格数量 × 实例快照单价 × 系数)，返工/报废排除），禁止复制第二套算法。实例缺失（软删）的报工在两处**同一判据**下都不计价（都取「活跃实例」，否则同一笔报工在两套端点数值不等）。红证：ProductionPieceworkSummaryTest「summaryTotalEqualsPerOrderTotal」（7.40 == 7.40 且 per_worker 金额逐项相等）+「softDeletedInstanceIsNotCountedInEitherEndpoint」"
      - "走查实测单可复现（#4205 验收判据 1）：加工单 JG-20260918-6914 的 1 条报工（「走查工人」精裁-布 3 米 × ¥0.40）⇒ per_worker 含该工人且金额 = 1.20。红证：ProductionPieceworkSummaryTest「walkthroughOrderIsReproducible」（对 dev 库实测数据形态的确定性复现；真实库对账由走查收尾执行）"
      - "返工/报废不计件 + 期间边界（#4205 验收判据 3）：rework/scrap 不进 per_worker/per_operation/total（与既有 per-order 口径同一份逻辑）；period 边界压在 SQL（work_date >= 当月首日 且 <= 当月末日，含端点）。证据：ProductionPieceworkSummaryTest「periodBoundaryAndOptionalWorkerFilter」（捕获 wrapper 断言 SQL 段含 work_date/worker_name 且绑定参数含 2026-09-01/2026-09-30）+「summaryTotalEqualsPerOrderTotal」里的 rework 负例"
      - "🔴 **未定价 ≠ 0**（issue #4696，2026-09-20 补漏；报表与 per-order 计件面**共用同一份聚合**，本条只加不改）：未定价报工（`production_work_logs.unit_price IS NULL` 且 `price_state='unpriced'`）**不进** `total`、**不进** `per_worker[].amount`、**不进** `per_operation[].amount`，且**不得按 0 计入**（改前静默折 0 ⇒ 商家看到的是「有金额」而不是「算不出钱」）；同时响应**新增** `unpriced: {qty, operations:[{operation, logical_name, qty}], hint}` 显式报出「哪几道工序未定价」+ 定价入口（`/production/routings`）。**三态可区分**是硬判据：`unpriced`（NULL ⇒ 不计）≠ `priced` 且价 0（**计入**，金额 0.00）≠ `priced` 且价 > 0（计入）。⚠️ 红线：`production_work_logs.unit_price` / `price_state` 是**报工那一刻固化的快照**，历史值一字不动，重新实例化也改不了它。证据：UnpricedPieceworkReportTest（改前 `unpriced` 键**根本不存在** ⇒ 红）+ UnpricedNotZeroTest「pricedZeroIsDistinguishableFromUnpriced」（注入「把 NULL 折成 0」⇒ 红）"
      - "菜单同构（#4203 验收判据 2 的后端半边，与 #4205 同批；**2026-09-19 issue #4307/#4357 同步修正过期描述**）：MenuController 静态权限树与 AuthService.buildMenusByPermissions 同步新增「生产管理」节点 —— 🔥 **2026-09-21 整格改判（issue #4440，配套 PR #5068）**：**四**子节点、与前端 `config/menu.ts` 的 `production-center` 组**逐字同构** —— 🔴 **2026-09-23 再改判（issue #5271 菜单重设计，按业务动线重排）**：本组（组 key 由 `production` 统一为 **`production-center`**）现为 **生产看板 `/production`、智能派单 `/production/pool`（#5177）、工艺配置 `/production/routings`、计件工资 `/production/piecework`**，**四项权限码统一 `processing:manage`**（🔴 **2026-09-25 改判（issue #5291）**：生产看板 / 工艺配置 / 计件工资 改用**读码 `production:view`**，**智能派单仍是 `processing:manage`**（同组不同权 = 「看得见这一页」与「改得动生产数据」分开）；只持 `processing:manage` 者看不到前三项）；**物料三项随拆组移入 #5271 新组「仓储与物料」（`inventory-center`）** —— 入库单 `/inbound-orders`（issue #5034/V111，权限码**独立**为 `inbound:view`）、余料台账 `/production/remnants`（#5191）、省料看板 `/production/saving-board`（#5159，后两项 `processing:manage`）⇒ 账面 **4 + 3 = 7 一项不少不减**。⚠️ 「入库单权限码独立」的**理由不变、归属改了**：入库是**仓储**动作 ⇒ 它随动线归「仓储与物料」；把它塞进 `processing:manage` 的判定里照样会让「有 inbound:view、没有 processing:manage」的仓管看不到菜单（#4203 点名的同族坑）。🔴 **改前表述已作废**：原写「生产看板 / production、**工序库 /production/operations**、**工艺路线 /production/routings**（#4307 新增第 4 项）、计件工资」—— issue #4416 已把「工序库」+「工艺路线」**合并为单一入口「工艺配置」**（旧路径 `/production/operations` 保留为**重定向**，不再是菜单项），且原表述**整个漏掉入库单**。侧边栏组 key = `production-center`（#5271 起三源统一 —— 重设计前前端 `menu.ts` 与 `MenuController` 用 `production` 而 `AuthService` 用 `production-center`，属守卫当时**看不到**的 key 漂移，本次一并收口；与前端 config/menu.ts 的 MenuGroup.key 对齐），且**新增** `inventory-center` 组的同步判据（组 key / 组名「仓储与物料」/ 三项节点）。🔴 **门控口径同步改判**：不再是「无 processing:manage 权限时**整组不出现**」—— `AuthService.buildMenusByPermissions` 现按**子节点级**门控、整组以求「至少有一个子节点」为在（`if (!productionChildren.isEmpty())`）⇒ **只有 `inbound:view`、没有 `processing:manage`** 的人看到的是「**仓储与物料**」组（组内只余「入库单」一项；#5271 拆组后入库单**已不在**「生产管理」组 ⇒ 旧文案「仍看到『生产管理』组」已作废）；反过来，只有 `processing:manage` 的人看到「生产管理」四项 + 「仓储与物料」的余料台账 / 省料看板两项。证据：`MenuControllerTest`（DOM 真值逐字段断言：**七组 key 序列** `workspace / smart-customer-service / product-center / trade-center / production-center / inventory-center / org-center` + 组 label + 组内节点 label + 组内节点 code —— 生产管理组四项、仓储与物料组三项；⚠️ label 与 code 两个列表是**同一组节点的两个字段，必须同时改**，历史上首轮 CI 实测「只改 labels、漏改 codes」⇒ `expected 5 vs actual 4` 判红）+ `AuthServiceTest`（有权限出现且路径逐条相等 / 无权限不出现「生产管理」节点 / #5271 起「仓储与物料」组的**子节点级门控**各一条：只有 `inbound:view` ⇒ 组内只余入库单，只有 `processing:manage` ⇒ 组内只余余料台账 + 省料看板）。🔴 **漂移面已收口（issue #4440）**：原注写「后端菜单树与前端 menu.ts 的同构**只靠两侧各自的测试维持**（前端真实侧边栏只读 config/menu.ts、不消费服务端菜单）——该漂移面另单登记」，而该漂移**实测已发生**（服务端两处仍是合并前的两个节点，前端「岗位权限」页消费 `GET /api/admin/menus` ⇒ 商家勾选的菜单项与真实侧边栏对不上）；现由**机器守卫**钉死：`tests/unit_ci_workflows/test_menu_three_sources_are_isomorphic.py`（**三份源逐值相等**；#5271 起由「只比生产管理组」升级为比对**全树** —— 组 key + 组名 + 组顺序，以及导航型节点名；红证 = 只改任一源 ⇒ 红）+ `frontend/admin-web/tests/unit/lib/inbound-menu-isomorphic.test.ts`（入库单的 path / 权限码 / 图标三处一致）。"
      - "冻结契约不可改（防回归）：既有 per-order 计件 GET /api/admin/production/orders/{orderId}/piecework 的响应形状不变（{total, per_worker:{工人:金额}, per_operation:[{operation,amount}]}），agent 侧 GET /api/admin/agent/production/piecework 的键集 {worker_name,period,total,details:[{operation,qty,amount}]} 不变 —— 共用聚合的重构不得改这两个形状（PG-018 的既有断言继续守护）。2026-09-20（issue #4621）：agent 侧 `details` 与报表 `per_operation` 各自**追加** `logical_name` + `position`（**只加不改**，既有键集逐字未动、既有断言继续绿）"
