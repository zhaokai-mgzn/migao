# cases/processing-order.yml — 加工单域用例（issue #3340）
# 来源：加工单功能设计（docs/design/processing-order-design.md）
# 均为 Java 服务层契约/状态机/联动测试，非 LLM 行为，不进入 agent-eval 冒烟
# （skip_reason 显式标注；truths_ref 空 = 无 LLM 真值，纯后端契约）。
# 后续米宝加工单工具（processing_order_generate/query/update）的 LLM 行为用例
# 将在工具落地时补充本文件（§14.1 新功能必补）。

schema: "case-contract/1.0"
domain: processing-order

cases:
  - id: PG-001
    legacy_id: ""
    title: "生成加工单 - 已确认含加工项订单 → 加工单生成（**不**推进订单；issue #4305）"
    domains:
      - processing-order
      - order
    tier: normal
    tags:
      - processing-order
      - generate
      - linkage
    truths_ref: []
    user_inputs: []
    expectations: []
    data_checks:
      - "已确认订单含加工项 → 生成 processing_orders(status=generated)，快照五要素齐全（商品/颜色/门幅/宽×高/数量/加工项）"
      - "快照加工项含 options（生成时从加工项目录补齐，下单时未落库）"
      - "快照不含销售价（决策 2：加工单给加工方只看加工费）"
      - "**不**联动订单（issue #4305，用户裁定「发加工 = 订单进入生产中」）：生成加工单后订单状态**保持 confirmed** —— 机器判据 = ProcessingOrderServiceTest 断言 never(orderService).updateOrderStatus(any, 「producing」) 且 never revertProducingToConfirmed（订单联动的唯一时点已挪到「发加工」，见 PG-005）"
      - "生成加工单成功（机器断言：$.data[i].success=true，ProcessingOrderServiceTest.generateSuccess / generateInstantiatesOperationsVerbatimFromOperationLibrary）——工序来源 = 工序库（issue #4116 切库）：生成加工单时按 部位×工艺 派生键读 production_routings 取基准路线、按名读 `production_operations` 取分组/单位/单价/is_start_marker —— 工序/单位/单价/起始标记**逐字取库**（**2026-09-21 改判，issue #4961**：`is_must_finish` **不再带出** —— 概念已退场，实例化 payload 里去掉该键；列保留为历史载体、值恒 false，**不许**由它回落或决定完工）；加工项目录**不再**提供工序；派生键库中无该路线 ⇒ 回落默认路线 布帘×韩褶；默认路线也取不到、或路线引用的工序在库中无活跃行 ⇒ 生成失败（$.data[i].success=false + 错误码 PRODUCTION_ROUTING_NOT_FOUND / PRODUCTION_OPERATION_NOT_FOUND + suggestion 指名补救入口），**不回退加工项目录**且**不落加工单行**（不制造「有加工单、无工序、无 qr_token」的孤儿态）—— 证据：ProcessingOrderServiceTest（逐条一致 1 项 + 负例 2 项 + 取法 3 项 + 幂等重放 1 项）"
    skip_reason: "[backend-contract] 由 ProcessingOrderServiceTest 验证（generate 成功路径 + 快照 options/无价格断言 + 切库后的路线解析 fail-closed 与幂等重放）"
    merge_log: "2026-09-12 新增（issue #3340）。2026-09-18（issue #4116 切库）：新增「工序来源 = 工序库」判据（含失败错误码与 fail-closed 语义）；同日本条补上**机器计分型**断言 —— 此前 4 条 data_check 全是纯散文（CASE-TRUST-EMPTY-ASSERTION，恒绿），case-trust 清单据此整条销账。断言形态 2026-09-18 rebase 时修正：错误码改**散文描述**（PRODUCTION_ROUTING_NOT_FOUND / PRODUCTION_OPERATION_NOT_FOUND 是 admin-api HTTP 层错误码，runner 的 error.code= 只读轮级 SSE error 无法计分 —— 同族能力边界登记见 order.yml #4082），机器断言改为生成成功路径 `success=true`（Java 断言 generateSuccess）。2026-09-18（issue #4305，用户裁定「发加工 = 订单进入生产中」）：原第 4 条判据「联动：订单 confirmed → producing」**已过时**（那是旧时点）⇒ 改判为「生成加工单不推进订单（订单保持 confirmed；never updateOrderStatus / never revert）」，订单联动的唯一时点挪到 issue（PG-005 新增判据）；断言面其余未动。 ｜ 2026-09-21（issue #4961 用例库同步，配套 feat/4960-4961-integration）：第 5 条 data_check 里「按名取 `is_must_finish` ⇒ 工序/单位/单价/**必完标记**逐字取库」**改判**为「取 `is_start_marker`；`is_must_finish` **不再带出**（概念退场、列保留为历史载体、值恒 false）」—— 是**口径迁移不是放宽**：该列已无语义，照旧写「必完标记逐字取库」就是假真值。`user_inputs` / `expectations` / `skip_reason` / `traces` 与其余 data_check **一字未动**，**判据一格不放宽**。"
    traces:
      tests:
        - "backend/admin-api/src/test/java/com/migao/admin/service/ProcessingOrderServiceTest.java"
      ci:
        - pr-check.yml
      verifies: []

