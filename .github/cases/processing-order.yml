      - "`POST /api/admin/production/operations`（body `{name, group_name?, unit?, unit_price, position?, is_start_marker?, sort_order?}`；🔴 **2026-09-21 改判（issue #4961）**：`is_must_finish` **不在可写字段里** —— 出现即 **422** + 可行动 hint，与 PUT 路径**共用** `rejectMustFinishField`，**不静默忽略**）⇒ 落 `production_operations` 行（`status=active`/`deleted=0`，`group_name` 缺省「其他」、`unit` 缺省「米」），**同事务写 `production_operation_price_versions` 首行** —— 使「当前价 = 最新版本行」对新工序同样成立（迁移 V55 的回填正是为消灭这种不一致）。证据：ProductionOperationCommandServiceTest「createWritesOperationAndFirstPriceVersion」+ ProductionControllerTest「createOperationReturnsCatalogShape」"
