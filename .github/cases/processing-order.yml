  # 断言全部机器可判：expectations + must_succeed + required_args + output_verify（带 action）。
  # ==========================================================================

  - id: PG-015
    legacy_id: ""
    title: "米宝加工单 LLM 行为：查询加工单（生成 → 按订单号回查状态）"
    domains:
      - processing-order
      - order
      - chat
    tier: normal
    tags:
      - processing_order
      - llm_behavior
      - tool_call
      - query
    truths_ref: []
    user_inputs:
      # 为什么不写「查一下加工单」：干净栈上 processing_orders 表为空（**没有任何
      # seed 注入加工单**，已核对 fixtures/*.sql 0 条 INSERT），空表的「查一下」
      # 只会得到空列表 —— 用例会退化成"没事发生"（假绿）。故先对**种子**里
      # 「已确认且含加工项」的订单生成加工单，再按订单号回查
      # （mibao_eval_seed.sql Phase 2：该单 order_items 带 processing_info）。
      # #3658（issue #3658）：目标订单由 0002 改为 **0003**（独立订单竞态修复——
      # 0002/0003/0004 分别归 PG-013/015/016，此前三条共用 0002，并发跑只有一个
      # 能生成成功，run 34820346966 实测 PG-013/016 吃「订单已生产中」假红）。
      - "把订单 EVAL-MB-ORD-0003 生成加工单"
      - repeat_until:
          tool_called: processing_order_generate
          max: 3
        fallback: "确认"
      - "订单 EVAL-MB-ORD-0003 的加工单现在什么状态？"
      - repeat_until:
          tool_called: processing_order_query
          max: 3
        fallback: "确认"
    expectations:
      - tool: processing_order_generate
      - tool: processing_order_query
    must_succeed:
      # 守卫口径已按 persona 收窄（#3580 修 `test_must_succeed_tools_are_customer_capabilities`
      # 的「遍历全库」bug：现在 `case_persona(c) != PERSONA: continue`，B 端/双端用例
      # 由 `test_mibao_case_invariants.py` 负责）→ B 端专属工具可以声明 must_succeed。
      # 这是比 `success=true` **更强**的断言：`must_succeed` 是「调了 ≠ 成了」的机器防线，
      # 会把每次尝试的轮次+错误码写进失败详情（工具层失败与模型层漏调可一行区分）。
      - tool: processing_order_generate
      - tool: processing_order_query
    required_args:
      - tool: processing_order_query
        fields:
          - keyword
    forbidden_text:
      - "暂不支持"
      - "功能不存在"
      - "没有这个功能"
      - "无法查询"
    data_checks:
      # 「调了 ≠ 成了」（issue #3361）：`success=true` 由 local_runner 的 scoring_checks
      # 计入评分；**同时**在 `must_succeed` 里声明工具（更强：把每次尝试的轮次+错误码
      # 写进失败详情）。两条并存不冲突（前者计入 expectations 评分，后者独立核验）。
      - "success=true"
      - "回查结果 grounded 到刚生成的加工单（status ∈ generated/issued/in_processing/completed/cancelled，不得编造）"
    skip_reason: ""
