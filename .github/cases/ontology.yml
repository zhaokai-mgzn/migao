# cases/ontology.yml — 领域本体模块用例（issue #2821）
# 来源：issue #2821「领域本体 AI 化」三块实施之一。
# 本体模块（app/ontology/）是纯数据结构契约（YAML 单一事实源 + dataclass 加载与校验），
# 由 pytest 单测验证，不进入 agent-eval 冒烟（skip_reason 显式标注，参照 RG-001 模式）。

schema: "case-contract/1.0"
domain: ontology

cases:
  - id: OB-001
    legacy_id: ""
    title: "本体 schema 加载与状态枚举校验（订单/商品/售后/客户）"
    domains:
      - ontology
      - cross
    tier: normal
    tags:
      - ontology
      - schema
      - enum_alignment
    truths_ref:
      - ai-chat.context-memory
    user_inputs:
      - "加载默认本体 schema，校验四对象（订单/商品SKU/售后单/客户）定义与状态枚举"
    expectations:
      - tool: none
    data_checks:
      - "默认 schema.yaml 存在且可加载，返回 Ontology 含 order/product_sku/aftersales/customer 四对象"
      - "订单状态枚举 == [pending, confirmed, producing, shipped, completed, cancelled]（与 CONTRACT-LEDGER 的 OrderService.java 状态机一致，生产中是 producing 非 processing）"
      - "售后工单状态枚举 == [pending, processing, rejected, resolved, closed]"
      - "商品状态枚举 == [draft, on_sale, off_sale, under_review]"
      - "非法状态值（如 processing 混入订单枚举）加载校验必须拒绝并给出明确错误"
    skip_reason: "本体模块为纯数据结构契约，由 pytest 单测验证（backend/ai-agent-service/tests/test_ontology_schema.py），非 LLM 行为，不进入 agent-eval 冒烟"
    merge_log: "2026-09-04 新增：issue #2821 本体模块切片 1（schema + loader + 校验）"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_ontology_schema.py"
      ci:
        - ai-agent-tests.yml
      verifies: []
