# cases/ontology.yml — 领域本体模块用例（issue #2821）
# 来源：issue #2821「领域本体 AI 化」三块实施之一。
# 本体模块（app/ontology/）是纯数据结构契约（YAML 单一事实源 + dataclass 加载与校验），
# 由 pytest 单测验证，不进入 agent-eval 冒烟（skip_reason 显式标注，参照 RG-001 模式）。

schema: "case-contract/1.0"
domain: ontology

cases:
  - id: ON-001
    legacy_id: ""
    title: "本体 schema 加载与状态枚举校验（核心四对象 + 扩展四对象）"
    domains:
      - ontology
      - cross
    tier: normal
    tags:
      - ontology
      - schema
      - enum_alignment
    truths_ref:
      - ai-chat.context-memory
    user_inputs:
      - "加载默认本体 schema，校验八对象（订单/商品SKU/售后单/客户 + 员工/加工项/分类/知识文档）定义与状态枚举"
    expectations:
      - tool: none
    data_checks:
      - "默认 schema.yaml 存在且可加载，返回 Ontology 八对象：order/product_sku/aftersales/customer + employee/processing_item/category/knowledge_document"
      - "每个对象具备属性/关系/动作/规则四要素"
      - "订单状态枚举 == [pending, confirmed, producing, shipped, completed, cancelled]（与 CONTRACT-LEDGER 的 OrderService.java 状态机一致，生产中是 producing 非 processing）"
      - "售后工单状态枚举 == [pending, processing, rejected, resolved, closed]；商品状态枚举 == [draft, on_sale, off_sale, under_review]"
      - "扩展对象状态枚举与代码真值一致：员工 == [online, offline, busy]（AgentEmployeeService 错误消息）、加工项/分类 == [active, inactive]（DTO 注释）、知识文档 == [processed, processing, failed]（admin-web KnowledgeDocStatus）"
      - "非法状态值（如 processing 混入订单枚举）加载校验必须拒绝并给出明确错误"
    skip_reason: "本体模块为纯数据结构契约，由 pytest 单测验证（backend/ai-agent-service/tests/test_ontology_schema.py），非 LLM 行为，不进入 agent-eval 冒烟"
    merge_log: "2026-09-04 新增：issue #2821 本体模块切片 1（schema + loader + 校验）；延续切片 B 扩展四对象"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_ontology_schema.py"
      ci:
        - ai-agent-tests.yml
      verifies: []
  - id: ON-002
    legacy_id: ""
    title: "vision 分析候选实体写入上下文实体槽（G10 修复）"
    domains:
      - ontology
      - cross
    tier: normal
    tags:
      - ontology
      - vision
      - context_memory
      - grounding
    truths_ref:
      - ai-chat.context-memory
    user_inputs:
      - "用户发图，vision 分析识别出候选商品/订单/客户 → 候选实体写入 context_manager 实体槽 → 后续轮次 build_context 注入"
    expectations:
      - tool: none
    data_checks:
      - "record_vision_candidates 写入后 get_entities 返回包含 source=vision 的候选实体"
      - "build_context 注入的上下文包含 vision 候选实体（图片关联对象有召回保障）"
      - "重复写入同一候选去重；非法 entity_type 拒绝"
      - "实体槽与 _extract_entities 的工具结果提取共存（vision 与工具结果互不覆盖）"
    skip_reason: "上下文记忆为纯数据结构契约，由 pytest 单测验证（backend/ai-agent-service/tests/test_ontology_vision_grounding.py），非 LLM 行为，不进入 agent-eval 冒烟"
    merge_log: "2026-09-04 新增：issue #2821 切片 2（vision 候选实体 → 上下文实体槽）"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_ontology_vision_grounding.py"
      ci:
        - ai-agent-tests.yml
      verifies: []
  - id: ON-003
    legacy_id: ""
    title: "intent 归属表全量登记 + 双端能力视图契约校验（v2 按 agent 核对）"
    domains:
      - ontology
      - cross
    tier: normal
    tags:
      - ontology
      - intent_ownership
      - contract
      - dual_agent
    truths_ref:
      - ai-chat.context-memory
    user_inputs:
      - "schema 全量登记 27 个业务 intent（双端 23 + finance 仅 mibao + knowledge_faq/knowledge_manage/quote 仅 xiaobu）；契约校验与双端真实映射按 agent 分别对比"
    expectations:
      - tool: none
    data_checks:
      - "schema.intent_ownership 全量登记 27 个业务 intent（排除 general 兜底；mibao 因 RAG 禁用不可达 knowledge 域）"
      - "契约校验 v2：schema 声明某 agent 可达的 intent 必须在该 agent 映射中存在（防假声明）；mibao route_key 严格一致（B 端是约定事实源，xiaobu 兜底覆盖不计漂移）；任一 agent 映射有但 schema 未登记 → 违规；声明可达的 route_key 必须在该 agent 真实可达集合中"
      - "xiaobu 专属 intent（quote/knowledge_faq/knowledge_manage）在 mibao 映射缺失是正常的，不得误报"
      - "缺失/漂移返回违规清单（不抛异常，由调用方决定阻断）"
    skip_reason: "契约校验为纯数据结构逻辑，由 pytest 单测验证（backend/ai-agent-service/tests/test_ontology_contract.py），非 LLM 行为，不进入 agent-eval 冒烟"
    merge_log: "2026-09-04 更新：切片 A 全量登记 27 intent + 契约校验 v2（按 agent 核对，get_all_skill_names 口径）"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_ontology_contract.py"
      ci:
        - ai-agent-tests.yml
      verifies: []
