    # 其余下单用例不守 → 评测看不见"文本确认就直接写单"这条路径（验收 C-A1 抓到）。
    order_before:
      - "interact[confirm] before order_create"
    # 能力误宣反模式（issue #3389 同族）：新客路径最容易触发"我做不到"。
    forbidden_text:
      - "没法直接帮您提交"
      - "没法帮您提交订单"
      - "无法代为提交"
      - "无法帮您提交订单"
      - "小程序里点"
      - "无法代为下单"
    amount_verify:
      - tool: order_create
        product_name: "遮光窗帘"
        checks: [unit_price, subtotal, total]
    db_verify:
      - fetch: order_items
        source: order_create
        expect_products: ["遮光窗帘"]
        expect_quantities:
          遮光窗帘: 3
      - fetch: order_phone
        source: order_create
        expect_phone: "13800138000"
    data_checks:
