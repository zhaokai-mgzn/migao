    merge_log: "verification 1.8 独有（smoke 简化版，与 OR-008/OR-009 的细粒度版互补）；2026-08-14 按 EXAMPLES-order.md 例2 校准为多轮（完整收货信息→选1→确认），单轮直下单与设计澄清流程不符；2026-09-02 补价格铁律；2026-09-04 修复 choice 卡片消费协议不匹配（审计 #2818 Agent Eval 失败根因）：原「选1」为自然语言序号，LLM 无法关联 interact(choice) 选项导致反复 product_detail 追问、永不进入 validate_input/order_create；改为显式售卖方式描述（与 OR-008/009 一致），且「2件」与商品按米计价（¥99/米）矛盾改为「2米」，实测全流程通过；2026-09-09 校准：R3「确认下单」改「不添加加工项，确认下单」+ 补第4轮「确认下单」——agent 把加工项询问当强制环节，用户说「确认下单」仍发加工项卡（probe 实证），需明确跳过加工项才推进（与 OR-009 校准一致）；2026-09-17 校准（issue #4014 B3）：补效果层断言 must_succeed[order_create]（简化流程此前只断言 validate_input/order_create 出现过 ⇒「调用了 ≠ 成了」；真实 run 里本用例首跑红指纹含 `no_success(order_create)`，说明失败确实发生过而断言看不见）；user_inputs / expectations / required_args / want_text 原样未动；2026-09-19（burn-down 缴费，随 #4386 的用例面改动）：补 `namespaces[product_name:遮光窗帘]` + `precondition[product_count_for_keyword: 遮光窗帘 expect=1]` —— 一次销掉该条存量违规的 `CASE-TRUST-NO-PRECONDITION-ASSERTION`（按名字选品无可判定前置）与 `CASE-TRUST-NO-SELF-CLEAN`（写用例未声明自清理），整条销账、清单条目随之删除；形态与 OR-009 / OR-011 / PR-007 同一份。断言面（expectations / required_args / must_succeed / data_checks / want_text）一字未动、无放宽。 ｜ 2026-09-24（issue #5247，用户裁定 2026-09-23 B 端只读化）：order_create 从 B 端解绑（validate_input 不再是「写链路前置」的一环，本场景无存活读路径）⇒ 本用例退役（理由写在 skip_reason，条目不删除）；expectations 由 [validate_input, order_create] 改判为 [direct_reply]（如实说明 + 引导后台），must_succeed[order_create] 与 required_args[order_create.customer_phone, items] 同步移除（否则成为永不满足的悬空声明）；`want_text` 由「订单号」改判为「后台」—— 该断言与新事实冲突（B 端不再产出订单号 ⇒ 原子串永不出现）；data_checks 的**价格铁律**（不得向顾客索要单价/金额）不受影响、原样保留；user_inputs / namespaces / precondition / tags / title / truths_ref 均未动。"
