  # ── 冒烟档的下单主链路（用户裁定 2 / issue #4095，F17）──────────────────────
  # 为什么新增：冒烟档 9 条用例全是只读，订单域唯一一条 OR-001 是**列表查询** ⇒
  # 「校验 → 确认卡 → order_create 真实落库」这条主链路在冒烟档**零覆盖**。
  # 设计取舍（冒烟档 = 门禁级、快）：
  #   · persona 固定 mibao：B 端代客下单**免短信验证码**（order_create 的
  #     `_needs_sms_verification` 只对 role==customer 生效）⇒ 链路最短；
  #   · 轮次最少化：**一句话给全**（商品/规格/数量/客户/地址），确认卡与可能的追问
  #     交给 `repeat_until` 协作轮（有卡答卡 / 被问码供码 / 无卡发 fallback），
  #     目标工具成功即跳过余轮 —— 不写静态轮次表（LLM 动态卡序列对不上会卡死，#3483）。
  #   · 断言只留「成了没有」这条主线：must_succeed（写成功）+ db_verify（明细与手机号
  #     落库）+ order_before（确认卡先于写，防 #3976 的"空头承诺"回归）；
  #     金额/加工项细则由 normal 档的 OR-011/OR-014 承担，不在冒烟档重复。
  - id: OR-031
    legacy_id: ""
    title: "下单闭环（冒烟档）- 一句话给定商品/规格/客户 ⇒ 确认卡点击后必须真实落库"
    domains:
      - order
    tier: smoke
    persona: mibao
    tags:
      - order_create
      - smoke
      - write
    truths_ref:
      - order.create-flow
      - order.states
    user_inputs:
      - "给我下单：遮光窗帘，米白｜散剪｜2.8米门幅，3 米；客户张三 13800138000，收货地址浙江省杭州市西湖区文三路1号1幢101室"
      # ── 2026-09-24（issue #5247，用户裁定 2026-09-23 B 端只读化）──
      # `repeat_until{tool_called: order_create, max: 3}` **整块移除**：目标工具已从 B 端
      # 全部 skill 解绑 ⇒ 「协作轮到写单成功为止」的循环永不满足（悬空声明）。同一轮的其它键
      # （`code` / `fallback` / `form_values`）按原样保留、不删（删它们属本包范围外的清理）。
      # B 端免验证码；声明 `code` 是「合作型顾客」兜底（真被索码就供 dev/CI 栈的
      # bypass 码 123456）—— 也是 `test_write_cases_using_repeat_until_supply_code`
      # 守卫的契约要求（断言了 order_create 的 repeat_until 用例必须能供码）。
      # ⚠️ 上述守卫契约随之不再适用（本用例已无 repeat_until、也不再断言任何写工具）。
      - code: "123456"
        fallback: "确认下单"
        form_values:
          customer_name: "张三"
          customer_phone: "13800138000"
          customer_address: "浙江省杭州市西湖区文三路1号1幢101室"
          color: "米白"
          colorName: "米白"
    # 命名空间（#3781）：本用例往**共享商品名**与客户手机号上写（下单消耗库存/建单），
    # 与同名商品的建/删/调价用例、同手机号的订单用例自动互斥（≥2 声明者才进串行道）。
    namespaces:
      - "product_name:遮光窗帘"
      - "customer_phone:13800138000"
    expectations:
      - tool: interact
        args:
          component: confirm
    # ── 2026-09-24（issue #5247，用户裁定 2026-09-23「B 端米宝只读化」）──
    # `order_create` 已从 B 端全部 skill 解绑 ⇒ 本用例断言的写能力（冒烟档下单闭环：
    # 确认卡点击后真实落库）在 B 端不复存在，用例退役（条目不删除，理由见 skip_reason）；
    # 断言面收敛到存活的那一笔（`interact` 交互卡形态），行为面改判为「如实说明 + 引导去
    # 后台订单管理页面」（见 data_checks）。
    # 逐条作废的原声明（原文留档见 merge_log）：`expectations[order_create]`、
    # `must_succeed[order_create]`、`order_before["interact[confirm] before order_create"]`、
    # `required_args[order_create.customer_phone, items]`、
    # `db_verify[order_items / order_phone]（source=order_create）`、
    # `user_inputs[1].repeat_until{tool_called: order_create, max: 3}` —— 全部机器判据都靠
    # order_create 的**成功调用**取数 ⇒ 该工具不在 B 端工具集里时运行时永远取不到
    # （悬空声明），故整块移除，而不是改指向另一个工具（改指向会造出假断言）。
    precondition:
      - type: product_count_for_keyword
        source: "遮光窗帘"
        expect: 1
    pre_clean:
      - type: product_dedupe
        product_keyword: "遮光窗帘"
    data_checks:
      - "（退役，#5247）如实说明米宝只做数据查询与分析、**不提供经对话创建订单**，并引导去后台订单管理页面下单。改判前口径（留档，不再生效）：「确认卡点击后 order_create 必须真实执行并落库（机器断言见 must_succeed + db_verify[order_items/order_phone]：明细「遮光窗帘」×3 + 落库手机号 13800138000）—— 冒烟档只验主链路「成了没有」，金额/加工项细则由 normal 档承担」—— 该断言的全部机器判据（must_succeed / db_verify）都靠 order_create 的成功调用取数，随 order_create 从 B 端解绑而整块失效"
      - "（退役，#5247）同上（如实说明 + 引导后台）。改判前口径（留档，不再生效）：「确认卡必须先于写操作下发（order_before[interact[confirm] before order_create]）：#3976 线上实证的『空头承诺』形态（模型说已发卡/这就提交，实际无卡可点、订单永不落库）在冒烟档即判红」—— 写操作已不存在 ⇒ 该时序判据随 order_create 从 B 端解绑而退场（#3976 的「空头承诺」教训本身不失效，只是不再由本用例承载）"
    skip_reason: "[backend-contract] [#5247] B 端只读化（用户裁定 2026-09-23：B 端米宝只做数据查询与分析，创建/更新能力与对应 tools 全部从 B 端移除）⇒ 本用例断言的「经对话创建订单（冒烟档下单闭环）」（order_create）已从 B 端下线、不再绑定任何 B 端 skill。用例条目与退役理由保留（不删除）；断言面改判为如实说明「米宝不提供经对话创建订单」+ 引导去后台订单管理页面（本场景无存活只读路径；`interact` 交互形态按表保留）。"
    merge_log: "2026-09-18 新增（用户裁定 2 / F17 / issue #4095）：冒烟档补下单用例 —— 此前冒烟档 9 条全只读、订单域唯一 OR-001 是列表查询 ⇒ 主链路零覆盖。persona=mibao（代客下单免验证码，链路最短）；一句话给全 + repeat_until 协作轮（有卡答卡，成功即停）；断言 = must_succeed[order_create] + db_verify[order_items/order_phone] + order_before[interact[confirm] before order_create] + required_args；自清理 product_dedupe + precondition[product_count_for_keyword expect=1] + namespaces（商品名/手机号）。未新增任何自动触发（裁定 2′/4′）。 ｜ 2026-09-24（issue #5247，用户裁定 2026-09-23 B 端只读化）：order_create 从 B 端解绑 ⇒ 本用例退役（理由写在 skip_reason，条目不删除）；expectations 由 [interact(confirm), order_create] 改判为 [interact(confirm)]，must_succeed[order_create] / required_args[order_create.customer_phone, items] / db_verify[order_items, order_phone]（source=order_create）/ order_before[\"interact[confirm] before order_create\"] / user_inputs[1].repeat_until{tool_called: order_create, max: 3} 全部同步移除（否则成为永不满足的悬空声明）；data_checks 两条与新事实冲突（一是确认卡点击后的写单落库、二是写操作前必须下发确认卡的时序）⇒ 逐条改判为「如实说明 + 引导后台」并留档原文。**保留不动**：tier=smoke（本包不改 tier —— 注意 skip_reason 非空后本用例不再进 smoke 可跑集，`EXPECTED_SMOKE` 的登记需由用例面外的包同步）、persona / user_inputs 其余轮 / namespaces / precondition / pre_clean / tags / title / truths_ref。"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_order_create_tool_price_grounding.py"
        - "backend/ai-agent-service/tests/test_order_create_processing_quantity.py"
      ci:
        - xiaobu-acceptance.yml
      verifies: []

  # ── 算料（褶数法）──
  - id: OR-032
    legacy_id: ""
    title: "算料试算端点 - 褶数法（标准档）单一真值 + 后端产出的可读公式串"
    domains:
      - order
      - processing
    tier: normal
    persona: ""
    tags:
      - order
      - craft_calc
      - fabric
      - single_source_of_truth
    truths_ref:
      - fabric-calc.pleat-method
      - fabric-calc.craft-tier
      - fabric-calc.fullness-actual
      - fabric-calc.mixed-color-per-fold
      - fabric-calc.craft-calc-endpoint
    # ── 覆盖说明（issue #4421，后端半边）──
    # 商家手工下单页此前**零算料通路**（数量/米数靠商家手填）。本端点 =
    # `POST /api/internal/production/craft-calc`（ai-agent，Service Token）+ admin-api
    # `CraftCalcClient` / `POST /api/admin/orders/craft-calc`（试算，不落库）。
    # 口径 = 用户 2026-09-19 裁定：褶数法（标准档 2.0）——`褶数 = round((W×N − margin)/0.25)`
    # 再按开数取整；`用料 = 每折吃布 × 褶数 + margin`（单开 0.2 / 多开 0.3）。
    # **每折吃布随款式/拼次变化**（同一次裁定，纸质速查表表头原文「拼色下料 1个折 0.65 / 2个折 1.2」，
    # 是**用料**口径）：单色 0.25 / 拼色·拼1次 0.65 / 拼色·拼2次 1.2 米每折；余量不随拼色变化。
    # 纸表逐值复现（本单的锚）：单开 0.25n+0.2、对开 0.25n+0.3；
    # 抽验 4折=1.2 / 8折=2.3 / 48折=12.3 / 52折=13.3 / 56折=14.3；6.6m 双开标准档 ⇒ 52 折 / 13.3 米；
    # 拼色 52 折双开 ⇒ 拼1次 34.1 米 / 拼2次 62.7 米。
    # ⚠️ 缺口（不猜不插值）：纸表未登记 `拼3次` 的用料系数 ⇒ 端点 fail-closed `MIXED_PER_FOLD_NOT_REGISTERED`。
    # 架构口径：**不新增第二份算料逻辑** —— 端点只调 `curtain_calc.build_quote`，
    # `formula_text` 由后端按同一份数字产出（前端/Java 侧自拼 = 第二份算料逻辑）。
    user_inputs:
      - "商家手工下单页按宽 6.6m / 双开 / 标准档试算用料"
    expectations:
      - tool: direct_reply
    data_checks:
      - "（散文、**不计分**）褶数法纸表逐值复现：单开 0.25n+0.2、对开 0.25n+0.3（4折=1.2/8折=2.3/48折=12.3/52折=13.3/56折=14.3）"
      - "（散文、**不计分**）单一真值：端点返回值 === 直调 curtain_calc.build_quote 逐值相等；formula_text 与数值同源（后端产出）"
      - "（散文、**不计分**）拼色用料系数（用户 2026-09-19 裁定）：拼1次 0.65 / 拼2次 1.2 米每折；52 折双开 ⇒ 34.1 / 62.7 米；拼3次未登记 ⇒ fail-closed 显式报缺口"
      - "（散文、**不计分**）响应算料键 = **snake_case**（设计文档 §4.5 / CALC_INFO_KEYS 同口径）：fabric_meters / pleat_count / per_panel_pleats / per_fold / fullness / fullness_actual / formula_used / formula_text / source / craft_tier / warning —— 前端可原样塞进 processingInfo，零映射"
    skip_reason: "[backend-contract] 内部端点 + Java 客户端由 pytest（tests/test_production/test_craft_calc.py）与 JUnit（CraftCalcClientTest / CraftCalcControllerTest）验证，非 LLM 行为，不进入 agent-eval 冒烟"
    merge_log: "2026-09-19 新增（issue #4421 后端半边）：算料试算端点 + 褶数法单一真值 + 纸表逐值复现。前端（下单页试算接线）由另一会话承担，本用例只锚后端契约。同日追加用户裁定：拼色每折吃布系数（拼1次 0.65 / 拼2次 1.2 米每折，纸表表头原文，是**用料**而非计价）—— 与真值源 §10 旧措辞冲突，已按裁定改正 docs §10；`拼3次` 纸表未登记 ⇒ 显式缺口 fail-closed，不插值。"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_production/test_craft_calc.py"
        - "backend/admin-api/src/test/java/com/migao/admin/service/CraftCalcClientTest.java"
        - "backend/admin-api/src/test/java/com/migao/admin/controller/CraftCalcControllerTest.java"
      ci:
        - ai-agent-tests.yml
        - pr-check.yml
      verifies: []

