    # 断言面（expectations / data_checks / pre_clean / auto_fill）**一字未动**。 2026-09-19（随 #4308 的用例面改动）：补 `persona: xiaobu`（清 `CASE-TRUST-SINGLE-LEG-NO-PERSONA`，burn-down 整条销账）+ 随之**连锁触发**的 `order_before: [interact[confirm] before order_create]`（C 端写用例必须断言 confirm 卡先行，守卫 test_xiaobu_coverage）—— **断言只增不减**，expectations / data_checks / pre_clean / auto_fill / amount_verify 一字未动。
    persona: xiaobu
