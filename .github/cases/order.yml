    # 效果层断言（issue #4014 B3 + 第 2 项）：本用例是**下单闭环**用例，此前只有
    # 「order_create 出现过」+ 散文 data_checks ⇒ 订单**一张都没建成**时照样判 100%
    # （实测同类红在真实 run 里被折成 `no_success(order_create)` 首跑指纹）。
    # ① must_succeed：至少一次 success=true（「调用了 ≠ 成了」，issue #3361）；
    # ② db_verify：**落库层**核对 —— 只有它能证伪「工具说成了、库里没有」
