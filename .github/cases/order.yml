# cases/order.yml — 订单域用例（并源转换示范）
#
# 标准：外部契约标准 16-case-contract（schema v1.0 草案）
# 来源：eval_cases.py 的 O001~O005 + M005/M006/M007(订单段) + C002(订单段)
#       mibao-verification-cases.md 的 1.1~1.8
# 并源结果：14 个源用例 → 10 条，合并 4 条、verification 独有 4 条获新 ID
#
# ★ 格式铁律：只用 block style（与 yaml_light 兼容），禁止 flow style。
#   yaml_light 不支持 [a, b] / {k: v}，会被解析成字符串，静默破坏结构。
#
# ★ truths_ref 引用 templates/*.yml 的真值 ID（真值 ID 化已完成，125 条全部带 [模板名.短名] 前缀）。
#   校验：python3 .github/truths.py check --templates .github/templates --cases .github/cases

schema: "case-contract/1.0"
domain: order

cases:
  # ── 只读查询 ──
  - id: OR-001
    legacy_id: O001
    # 同义合并: verification 1.1
    title: "订单列表查询"
    domains:
      - order
    tier: smoke
    tags:
      - query
      - smoke
    truths_ref:
      - order.states
    user_inputs:
      - "查看最近的订单"
    expectations:
      - tool: order_query
        args:
          action: list
    # 产出侧断言（issue #4014 第 3 项）：原 `data_checks: - "data.orders.length >= 0"`
    # 是**恒真**断言，两重原因叠加 ⇒ 结构上不可能红：
    #   ① 长度不可能 < 0（判据本身的真值与被测行为无关）；
    #   ② 纯散文 `data_checks` **不计分** —— 计分白名单只认 `success=true` /
    #      `error.code=` / `未被调用`（按 `scoring_checks = list(case.expectations or [])`
    #      那段源码检索），所以它连"被读过一眼"都没有：整条断言等于不存在。
    # 语义等价地升级成**可失败**的机器断言：列表查询必须真的返回订单
    # （空列表 / 无成功调用 ⇒ 判红）。**不**改写成散文 `>= 1` —— 那是同一个坑的另一种
    # 写法（仍不计分），只是把"看起来有覆盖"换个字面。
    output_verify:
      - tool: order_query
        # ⚠️ 多 action 工具必须声明 action（L0 不变式）：本工具还有 statistics /
        # follow_status_stats，不限定会核对到**别的 action** 的 payload（假红/假绿双面）。
        action: list
        expect:
          # 独立栈种子（`mibao_eval_seed.sql`）对租户 1 恒有 4 笔订单 ⇒ 可满足；
          # 查询没真返回数据（空列表）或从未成功调用 ⇒ 判红。
          orders: __nonempty__
    skip_reason: ""
    merge_log: "eval O001 + verification 1.1（同义，取 eval 版）；2026-09-17 校准（issue #4014 B4）：`data.orders.length >= 0` 既恒真又不计分（纯散文不进 scoring_checks）→ 升级为 output_verify(order_query(action=list) 的 orders 非空)。同类实例（OR-002 / PR-001 / PR-002 的 `data.*.length >= 0`）不在本包范围，未在本 PR 处理"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_tools_order_query.py"
      ci:
        - agent-eval.yml
      verifies: []

  - id: OR-002
    legacy_id: O002
    # 同义合并: verification 1.2
    title: "订单查询 - 按状态筛选"
    domains:
      - order
    tier: normal
    tags:
      - query
      - filter
    truths_ref:
      - order.states
      - order.flow
    user_inputs:
      - "查看待发货的订单"
    expectations:
      - tool: order_query
        args:
          action: list
          status: confirmed
    # 产出侧断言（issue #4042 下沉）：原 `data_checks: - "data.orders.length >= 0"`
    # 与 OR-001 是**同一形态**（OR-001 的 merge_log 已把本用例登记为"未处理的同类实例"）：
    #   ① 长度不可能 < 0 ⇒ 判据的真值与被测行为**无关**（恒真，结构上不可能红）；
    #   ② 纯散文 `data_checks` **不计分**（计分白名单只认 `success=true` / `error.code=` /
    #      `未被调用` / `not called`）⇒ 连"被读过一眼"都没有。
    # ⇒ 升级成**可失败**的机器断言：带 status=confirmed 的列表查询必须**真的返回订单**
    #    （空列表 / 从未成功调用 ⇒ 判红）。seed 真值可满足：mibao 腿有 3 笔 confirmed 订单
    #    （`tests/agent_eval/fixtures/mibao_eval_seed.sql` 的 EVAL-MB-ORD-0002/0003/0004）。
    output_verify:
      - tool: order_query
        action: list
        expect:
          orders: __nonempty__
    data_checks:
      - "订单列表查询必须真的返回数据（机器断言见 output_verify：orders 非空；空列表 / 未成功调用 ⇒ 判红）—— 原 `data.orders.length >= 0` 恒真且不计分，已弃用"
    skip_reason: ""
    merge_log: "eval O002 + verification 1.2（同义）；2026-09-18 下沉（issue #4042，LLM 红例 run 35243351675 首跑指纹 arg_mismatch(order_query,status)）：原 `data.orders.length >= 0` 恒真且不计分（同 OR-001 形态，OR-001 的 merge_log 已登记本用例为未处理的同类实例）⇒ 升级为 output_verify(order_query(action=list) 的 orders 非空)"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_tools_order_query.py"
      ci:
        - agent-eval.yml
      verifies: []

  - id: OR-003
    legacy_id: "1.3"
    # verification 独有，首次获得 ID
    title: "订单统计"
    domains:
      - order
    tier: normal
    tags:
      - query
      - statistics
    truths_ref:
      - order.statistics
    user_inputs:
      - "订单统计数据"
    expectations:
      - tool: order_query
        args:
          action: statistics
    data_checks:
      - "各状态汇总非空"
    skip_reason: ""
    merge_log: "verification 1.3 独有"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_tools_order_query.py"
      ci:
        - agent-eval.yml
      verifies: []

  - id: OR-004
    legacy_id: "1.4"
    title: "订单跟进统计"
    domains:
      - order
    tier: normal
    tags:
      - query
      - statistics
    truths_ref:
      - order.follow-status-stats
    user_inputs:
      - "订单跟进情况"
    expectations:
      - tool: order_query
        args:
          action: follow_status_stats
    data_checks:
      - "data 非空"
    skip_reason: ""
    merge_log: "verification 1.4 独有"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_tools_order_query.py"
      ci:
        - agent-eval.yml
      verifies: []

  - id: OR-005
    legacy_id: "1.5"
    # M007 第 7 轮沾边，保留独立用例
    title: "物流追踪"
    domains:
      - order
    tier: normal
    tags:
      - query
      - logistics
    truths_ref:
      - order.logistics
    # ── 自包含化（issue #3599，同一缺陷类已在 aftersales.yml 实证两次）──
    # 原 user_inputs/expectations 硬编码 `ORD-20260701-0001` —— 该订单号**任何评测栈都不存在**
    # （AS-005 实测 API `found:0`；OR-006 的 skip_reason 早已写明同一根因）。
    # 后果：agent 反复查不到 → 断言要么假失败、要么白耗澄清轮（"看着像能力缺陷，实为数据缺口"）。
    # 改法（照 AS-005 已验证的手法）：改成**环境无关的自然指代**（"最近的已发货订单"），
    # 并把「解析出的订单号非空」用 required_args 机器守住 —— 断言只加强、不放宽。
    user_inputs:
      - "帮我查一下最近一笔已发货订单的物流"
    expectations:
      - tool: logistics_track
    required_args:
      - tool: logistics_track
        fields:
          - order_id
    data_checks:
      - "快递公司/运单号/轨迹非空"
    skip_reason: ""
    merge_log: "verification 1.5 独有（M007 中物流只是旅程一环，不合并）；2026-09-14 自包含化（issue #3599）：去掉栈上不存在的硬编码订单号 ORD-20260701-0001，改自然指代 + required_args[order_id] 守住解析结果"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_tools_logistics_track.py"
      ci:
        - agent-eval.yml
      verifies: []

  # ── 状态机（合并为一条全流转用例）──
  - id: OR-006
    legacy_id: M006
    # 同义合并: 1.6 + 1.7 的状态更新段 + O004
    title: "订单状态机全流转 - 查询→确认支付→生产→发货→完成"
    domains:
      - order
    tier: normal
    tags:
      - multi_turn
      - order_lifecycle
      - status_flow
    truths_ref:
      - order.states
      - order.flow
      - order.pay-side-effects
      - order.cancel-side-effects
      - order.refund-side-effects
    user_inputs:
      # 自包含化（issue #3599）：去掉硬编码 ORD-20260701-0001（任何评测栈都不存在，
      # API 实测 found:0）。本用例仍 skip（状态机全流转需要一条**完整的测试订单**从
      # pending 走到底，不是改指代就能跑通）—— 但不再留"活引用"误导后来者：
      # 现在写的是环境无关指代，将来解 skip 时不会带着数据缺口。
      - "查一下最近一笔待付款订单的状态"
      - "确认支付，标记为生产中"
      - "发货，物流顺丰 SF1234567890"
      - "客户确认收货了，标记完成"
    # ── 前置自断言 + 自清理 + 效果层（issue #4883 的 case-trust burn-down 缴费）────────────
    # 本用例命中的三条存量违规（`metric=entries` ⇒ 必须**整条销账**，只收窄多码条目不算）：
    #   ① CASE-TRUST-NO-PRECONDITION-ASSERTION  ② CASE-TRUST-NO-SELF-CLEAN
    #   ③ CASE-TRUST-NO-EFFECT-ASSERTION
    # 【真前置是什么】R1「查一下最近一笔待付款订单的状态」用**相对指代**（"最近一笔"）在
    #   **订单集合**里取值 —— 集合为空 ⇒ `order_query` 无从命中 ⇒ 后面三条写动作全部落空，
    #   而报告上只表现为 `unmatched expectation`（看起来像「agent 不会走状态机」，归因全错，
    #   正是本规则 `why` 写的那个形态）。集合的不可变键 = 客户手机号 `13800138000`
    #   （B 端种子里张三名下 EVAL-MB-ORD-0001 / 0002 / 0005）；
    #   取数走 `local_runner._probe_phone_order_count` → `GET /api/admin/orders?receiver=<手机号>`，
    #   与 AS-003 / OR-012 同一部手机号、同一份"怎么数订单"的口径 —— **不另立第二份定义**（§18）。
    # 【为什么这么计数】**刻意不声明 `expect: <N>`**：该基线随栈组成而变（B 端种子 + 同栈并行
    #   建单用例），写死常量 = 依赖栈的恒红判据（反模式 CH-034，AS-003 / OR-012 同款）。
    #   声明层只用 runner 的**结构下界** `min: 1`（`_PRECONDITION_TYPES["order_count_for_phone"]["min"]`）：
    #   靶子被清零时必然触发，且不随栈漂移。类型 `order_count_for_phone` 是**既有已登记**类型
    #   —— 本单**不新增 type、不改探针**（§13.3 的"新 type = 大活"整块不动）。
    # 【自清理为什么只到 `namespaces`】（照实写，不粉饰）：`pre_clean` 的五个已落地类型
    #   （product_remove / product_dedupe / employee_reactivate / aftersales_ticket_prepare /
    #   customer_tag_remove）里**没有"把订单复位"这一档**，而本用例的指代对象**就是订单集合**
    #   （"最近一笔"），同栈并行建单用例（OR-016 / CR-001 / CH-010 / OR-008 / OR-009 / OR-015 /
    #   CR-003 …）实时改写它 ⇒ 声明 `namespaces` 与它们**自动互斥**（AS-003 #3781 / OR-012 先例，
    #   不另立口径）。这是 taxonomy **明确列出的弱证据档**：只保证并行互斥、**不解决重试前置** ——
    #   故如实登记在此，不当成强修复。
    # 【效果层为什么是 `must_succeed`】本用例是**全流转**（confirm_payment → producing →
    #   shipped → completed），每一步都**必须真的成功** —— 「调用了 ≠ 成了」（#3778）在这里
    #   正是关键：`expectations` 只证明 `order_manage` 被调用过，调完返回 success=false 也照样算过。
    #   落库侧 `db_verify` **无可用 fetcher**（现有 fetcher：order_phone / order_items /
    #   processing_order / employee / employee_absent / after_sales_ticket / product_by_name
    #   —— 没有"按单号读 status"这一档），故效果层落在 `must_succeed`。
    # 【断言面一字未放宽】`user_inputs` / `expectations` / `data_checks` / `skip_reason` **全部未动**，
    #   本单只加下面三格声明。
    # ⚠️ **如实登记（不粉饰）**：本条仍是 **skip 用例**（缺"可从 pending 走到底的测试订单"，
    #   理由见 `skip_reason`）⇒ 这三格**当前不进运行期**。它们是把这个用例的**真前置 + 真效果**
    #   在**声明层**钉住（解 skip 的那一刻即生效、且此后不会静默退化），
    #   **不是**运行期行为修复 —— 本单的判定依据是"缺陷本身被修掉"（前置有了可判定断言、
    #   写效果有了 success 断言、并行互斥有了声明），而不是"账面少了一行"。
    namespaces:
      - "customer_phone:13800138000"
    precondition:
      - type: order_count_for_phone
        source: "13800138000"
    must_succeed: []
    expectations:
      # 修正（issue #3702）：原声明 `args.action: detail` 是**该工具不存在的取值** ——
      # `order_query` 的 action 枚举真值 = `list / statistics / follow_status_stats`
      # （`backend/ai-agent-service/app/tools/order_query.py`）。声明的语义在真实链路里
      # 没有对应 action（配置错误，L0 不变式 `test_eval_assertion_action_binding.py` 拦的就是它）。
      #   · 本轮意图 =「查某一笔订单的状态」→ 在本工具里就是 `action: list`
      #     （list 支持 order_id / status 过滤，且是 schema 默认值）；
      #   · **否掉** `statistics` / `follow_status_stats`：两者是"汇总统计"语义、不接收其他
      #     参数，回答不了"这一笔订单现在什么状态"；
      #   · **否掉**「去掉 args.action 只断言工具被调用」：那是**放宽**匹配
      #     （裸工具名=任意 action 都算过），而 list 是真实存在的正确取值，没有放宽的必要。
      # 有意**不**加 `status: pending` 等值级作用域：本轮用户是自然指代（"最近一笔待付款订单"），
      # 由 agent 自行解析，写死筛选值会制造新的假红。
      - tool: order_query
        args:
          action: list
      # ⚠️ 2026-09-24（issue #5247，用户裁定 2026-09-23「B 端米宝只读化」）：原四条
      # `order_manage` 写声明（confirm_payment / update_status(producing) / update_logistics /
      # update_status(completed)）**整批移除** —— `order_manage` 已从 B 端全部 skill 解绑
      # （工具类仍在、C 端绑定未动，但两侧工具集都不可达）⇒ 留着它们是**永不满足的悬空声明**
      # （解 skip 时会把「agent 不做状态流转」误读成能力缺陷）。状态机全流转的**写路径**
      # 断言现在的正确判定层 = 工具层 / admin-api 单测（`traces.tests` 已钉住），本用例只保留
      # 存活的只读半边：R1「查一下最近一笔待付款订单的状态」= `order_query(action=list)`。
      # 原四条声明与其判读说明保留在 git 历史与上方注释里（判据面改判而非放宽：写能力已从
      # B 端整体下线，可验证的只剩只读查询）。
    data_checks:
      - "状态流转: pending → producing → shipped → completed"
      - "每步操作前先确认当前状态"
    skip_reason: "需要一条**从 pending 走到底的完整测试订单**（先 order_create 建单再流转），否则状态机断言不可达——评测栈里没有这样的订单，跑起来是假失败污染基线。2026-09-14（issue #3599）：原 skip 理由里的『硬编码 ORD-20260701-0001（API 实测 found: 0）』已消除（改为自然指代），剩下的唯一缺口是「可全流转的测试订单」。 ｜ 2026-09-24（issue #5247，用户裁定 2026-09-23 B 端只读化）：**该缺口的前提进一步消失** —— 状态机写能力（`order_manage` 的 confirm_payment / update_status / update_logistics）已从 B 端全部 skill 解绑 ⇒ 即使有一条完整测试订单，B 端也走不完这条写链路。用例条目与退役理由保留（不删除）；机器可判字段改判为存活的只读路径 `order_query(action=list)`，四条写声明整批移除（否则成为永不满足的悬空声明）；写路径的判定层 = 工具层 / admin-api 单测（`traces.tests` 已钉住）。"
    merge_log: "eval M006 吸收 verification 1.6（单步 update_status）、1.7 的状态更新段，并吸收 eval O004（标记已发货）；2026-09-14 去掉栈上不存在的硬编码订单号（issue #3599）；2026-09-15 修正 order_query 的声明（issue #3702）：原 `action: detail` 不在该工具枚举内（list/statistics/follow_status_stats），改为真实且语义正确的 `action: list`（查单=按 order_id/status 过滤；statistics/follow_status_stats 是汇总统计，与『查这一笔的状态』意图不符） ｜ 2026-09-24（issue #5247，用户裁定 2026-09-23 B 端只读化）：`order_manage` 从 B 端解绑 ⇒ `expectations` 由 [order_query(action=list) + 四条 order_manage 写声明] 改判为 [order_query(action=list)]、`must_succeed[order_manage]` 整格清空（悬空声明）；`precondition` / `namespaces` / user_inputs / data_checks 与既有注释一字未动（不是放宽：可验证面只剩只读查询，写面判定层移交工具层/admin-api 单测）。"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_mibao_multiturn_order.py"
      ci:
        - agent-eval.yml
      verifies: []

  - id: OR-007
    legacy_id: O005
    # 同义合并: 1.7（取消 + 二次确认）
    title: "取消订单 - 先定位订单再取消（二次确认 + 订单号解析）"
    domains:
      - order
    tier: adversarial
    tags:
      - id_resolve
      - adversarial
      - destructive
    truths_ref:
      - order.states
      - order.flow
      - order.pay-side-effects
      - order.cancel-side-effects
      - order.refund-side-effects
      - order.no-format
    # ── 自包含化（issue #3599）──
    # 原 user_inputs/expectations 硬编码 `ORD-20260701-0001`：评测栈里不存在
    # （AS-005 实测 API `found:0`）→ agent 查不到订单，只能反复澄清；而 expectations
    # 又要求 `order_id="ORD-20260701-0001"` 出现在**工具参数**里 → 断言本身在要求
    # "把不存在的号传下去"，与「先解析真实订单」的契约相矛盾。
    # 改法：先定位（order_query）再取消，用 order_before + required_args 守住
    # 「取消的是**解析出来的真实订单号**」这条契约（断言只加强）。
    # 收尾用答卡轮（§13.5：destructive 写操作收尾发裸文本「确认」= 文字 ≠ 点卡）。
    user_inputs:
      - "帮我查一下最近的订单"
      - "把最近这笔订单取消掉，原因是客户不要了"
      - auto_respond:
          fallback: "确认取消"
      - auto_respond:
          fallback: "确认"
    expectations:
      - tool: order_query
    # ── 2026-09-24（issue #5247，用户裁定 2026-09-23「B 端米宝只读化」）──
    # `order_manage(action=cancel)` **已从 B 端全部 skill 解绑**（工具类仍在、C 端绑定未动）
    # ⇒ 取消订单在 B 端**不再是一条可达能力**，本用例随之退役（条目不删除，理由见 skip_reason）。
    # 断言的改判：能力面 → 存活的只读路径 `order_query`（B 端仍可查订单）；
    #             行为面 → 「如实说明米宝不做取消/改单 + 引导去后台订单管理页面」（见 data_checks）。
    # 逐条作废的原声明（原文留档见 merge_log）：`expectations[order_manage(action=cancel)]`、
    # `required_args[order_manage.order_id]`、`must_succeed[order_manage]`。
    # 刻意**不写** `order_before: order_query before order_manage`：runner 的时序断言
    # 要求后件是**成功**调用（`_first_qualified_round(require_success=True)`），而
    # 「取消能不能成功」取决于那条订单的当前状态（种子栈里最新订单是 shipped，状态机
    # 可能合法拒绝）—— 那会把「取消被状态机拒绝」误判成「没先定位订单」。
    # 本用例守的是**指代解析**（required_args 的 order_id 非空），不守取消结果。
    #
    # ── 三格声明（issue #4966 的 case-trust burn-down 缴费；**断言面一字未放宽**）──
    # 本条命中的三个码（`CASE-TRUST-NO-EFFECT-ASSERTION` / `-NO-PRECONDITION-ASSERTION`
    # / `-NO-SELF-CLEAN`）都是「写用例缺声明」，修法见 `.github/assertion_taxonomy.py`。
    # 【为什么**不**写 `order_before: order_query before order_manage`】（上段已述）：runner 的
    #   时序断言要求后件是**成功**调用 ⇒ 与「取消失败也应如实说明」自相矛盾。
    #   ⚠️ 本块口径在集成时按 **#4969（issue #4966）** 那版收口：先生种子里 `EVAL-MB-ORD-0002`
    #   的状态是 `confirmed`（`tests/agent_eval/fixtures/mibao_eval_seed.sql` 的复位语句逐字可核）
    #   ⇒ 取消**成功**是可判定的期望（旧注释里「最新订单可能是 shipped」是过时真值，已删）。
    # 【效果层 = `must_succeed`】「调用了 ≠ 成了」（#3778）：`expectations` 只证明
    #   `order_manage(action=cancel)` 被调用过，返回 success=false 也照样计分通过。
    #   本用例按「**最近这笔订单**」指代解析（种子栈里 张三 `13800138000` 名下最新的
    #   `EVAL-MB-ORD-0002` 状态 = `confirmed`，状态机**允许**取消）⇒ 成功是可判定的期望；
    #   它失败即说明「指代解析到了一条不可取消的订单」或「工具真的坏了」，两种都该红。
    # 【前置 = `order_count_for_phone`】本用例的靶子是「该手机号名下的最近订单」——
    #   靶子**不存在**时红的表现是 `unmatched expectation`（看起来像「agent 不会取消订单」，
    #   归因全错，同 `product_count_for_keyword` 的理由）。
    # 【自清理 = `order_status_restore`（**真复位**，issue #4992）】本用例**取消**订单 ⇒ 重跑的
    #   前置不再等价（`EVAL-MB-ORD-0002` 首跑后进终态 `cancelled`，`OrderService.STATUS_TRANSITIONS`
    #   里 `cancelled → Set.of()` ⇒ HTTP 面无反向放行）。#4992 前夹具层**没有**订单复位动作，
    #   只能登记 `namespaces`（taxonomy 明列的**弱证据**档：只保证并行互斥、不解决重试前置）。
    #   现补上 `order_status_restore`（`tests/agent_eval/local_runner.py` 的复位族第二批）：
    #   按 `order_no`（不可变键）把状态复位回种子值 ⇒ `pre_clean` 保证**重试前置等价**、
    #   `post_clean` 把世界**归零**（并行用例与后续用例读到的都是种子态）。
    #   ⚠️ 弱证据 `namespaces` 随之**撤掉**（不再需要的声明就是死账）。
    pre_clean:
      - type: order_status_restore
        order_no: "EVAL-MB-ORD-0002"
        status: "confirmed"
    post_clean:
      - type: order_status_restore
        order_no: "EVAL-MB-ORD-0002"
        status: "confirmed"
    precondition:
      - type: order_count_for_phone
        source: "13800138000"
    # ── 效果层断言 `must_succeed[order_manage]`（#4966 的三格声明之一）随 #5247 整块作废 ──
    # 它断言的是「至少一次 order_manage 成功」——该写能力已从 B 端下线 ⇒ 声明永不满足
    # （悬空声明），故移除；原文留档见 merge_log。
    data_checks:
      - "（退役，#5247）如实说明米宝只做数据查询与分析、**不做取消/改单**，并引导去后台订单管理页面处理；不得声称已取消。改判前口径（留档，不再生效）：「取消前必须先定位到真实订单（order_query → order_manage 的 order_id 非空）」与「confirm 卡片先于写操作（destructive 约定，真值在 ai-chat.tool-classes）」—— 两条的前提都是 B 端存在取消写能力，随 order_manage 从 B 端解绑而不成立"
      - "取消失败（订单状态不允许）也应如实说明，不得声称已取消"
    skip_reason: "[backend-contract] [#5247] B 端只读化（用户裁定 2026-09-23：B 端米宝只做数据查询与分析，创建/更新能力与对应 tools 全部从 B 端移除）⇒ 本用例断言的「取消订单」（order_manage）已从 B 端下线、不再绑定任何 B 端 skill。用例条目与退役理由保留（不删除）；断言面改判为只读查询路径（order_query）保留 + 如实说明「米宝不做取消/改单」并引导去后台订单管理页面。"
    merge_log: "eval O005 + verification 1.7（同义，取 eval 的 ORD-xxx 格式版）；2026-09-14 自包含化（issue #3599）：去掉栈上不存在的硬编码订单号，改「先定位再取消」+ order_before/required_args 守住解析契约；2026-09-21（issue #4966 的 case-trust burn-down 缴费，metric=entries ⇒ 整条销账）：补 `namespaces`（弱证据，如实登记：夹具层无订单复位动作）+ `precondition[order_count_for_phone: 13800138000]`（靶子存在性）+ `must_succeed[order_manage]`（效果层，「调用了 ≠ 成了」）—— `user_inputs` / `expectations` / `required_args` / `data_checks` / `skip_reason` 一字未动、断言强度不放宽 ｜ 2026-09-21（issue #4992 的夹具层复位动作）：自清理由**弱证据** `namespaces` 升级为**真复位** `pre_clean` + `post_clean[order_status_restore(EVAL-MB-ORD-0002 → confirmed)]`（按不可变键 `order_no` 复位；实现见 `tests/agent_eval/local_runner.py` 的 `_restore_order_status`），`namespaces` 随之撤掉 —— `user_inputs` / `expectations` / `required_args` / `data_checks` / `skip_reason` / `precondition` / `must_succeed` 一字未动、断言强度不放宽 ｜ 2026-09-24（issue #5247，用户裁定 2026-09-23 B 端只读化）：order_manage 从 B 端解绑 ⇒ 本用例退役（理由写在 skip_reason，条目不删除）；expectations 由 [order_query, order_manage(action=cancel)] 改判为 [order_query]，must_succeed[order_manage] 与 required_args[order_manage.order_id] 同步移除（否则成为永不满足的悬空声明）；data_checks 两条与新事实冲突 ——「取消前必须先定位到真实订单（order_query → order_manage 的 order_id 非空）」断言的是已下线的取消链、「confirm 卡片先于写操作（destructive 约定，真值在 ai-chat.tool-classes）」的前提是 B 端存在写操作 —— 一并改判为「如实说明 + 引导后台订单管理页面」，第三条「取消失败（订单状态不允许）也应如实说明，不得声称已取消」不受影响、原样保留；pre_clean / post_clean / precondition / tags / title / truths_ref 均未动。"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_tools_order_manage.py"
      ci:
        - agent-eval.yml
      verifies: []

  # ── 创建订单（两条流程 + 一条简化）──
  - id: OR-008
    legacy_id: O003
    title: "创建订单 - 先查商品 SKU 再下单"
    domains:
      - order
      - product
    # 端别：与同族 OR-010（同为 B 端代客下单、同用 order_create + confirm 门禁）一致。
    # ⚠️ 判据源 `is_single_leg_by_toolset` 认为「工具集 ⊆ XIAOBU_TOOLS ⇒ 只能跑小布」，
    # 但 order_create / validate_input / product_detail **两端都有**（OR-010 是 mibao 用例
    # 且 must_succeed[order_create] 已在 main）⇒ 该判据对"共享工具"用例是假阳性；
    # 本条按**实际端别**标注，不按该判据反推（判据已于 **#4356** 收紧为
    # 「小布腿跑得动 ∧ 米宝腿跑不动」⇒ 本条不再命中规则 d）。
    # ⚠️ 2026-09-24（issue #5247）：order_create 已从 B 端全部 skill 解绑 ⇒ 本用例退役
    # （条目不删除，理由见 skip_reason）；`persona: mibao` **保持不变**（本场景仍是 B 端
    # 店员代客下单语义，只是写能力已下线）。改判后 expectations 只剩共享只读工具
    # product_detail ⇒ 上面「共享工具 ⇒ 规则 d 假阳性」的论证仍然成立，判据不变。
    persona: mibao
    tier: normal
    tags:
      - create
      - sku_select
      - full_flow
    truths_ref:
      - order.states
      - order.create-flow
      - product-sku-stock.aggregate
    user_inputs:
      - "帮我下个订单，客户张三，手机13800138000"
      - "要遮光窗帘，2件"
      - "选白色的，散剪，2.8米门幅"
      - "不需要加工项"
      - "确认下单"
      # 收尾答卡轮（#3544 §2 同款先例；2026-09-15 结论档 run 34841029062 实测）：
      # B 端写操作受 confirm 门禁约束——文字「确认下单」≠ 点卡，agent 收到后只**发**
      # 确认卡（R5 实测 tools 含 product_search/product_detail/validate_input +
      # interact(confirm:请确认订单信息)），轮次用尽即停在待点卡态 →
      # `order_create` 在预算内**不可能**被调用（失败原文 2 条：`❌ order_create` +
      # `required_args: 未调用 order_create(action=None)`）。留 2 轮余量
      # （有卡答卡 / 无卡发原文）；同形：OR-015（#3544 已修）/ CR-001 / AS-003。
      - auto_respond:
          fallback: "确认下单"
      - auto_respond:
          fallback: "确认"
    # 全局命名空间声明（issue #3781）：与同样争用该全局资源的用例自动互斥，
    # 消除「同栈并行用例互相写同一命名空间」造成的非确定性（真实 run 34856561459）。
    namespaces:
      - "customer_phone:13800138000"

    # 前置：本用例依赖「商品『遮光窗帘』在位且规格可定位」（它先查该商品的 SKU 再下单）。
    # 用**已实现**的类型（`_PRECONDITION_TYPES` 的 product_count_for_keyword，口径与
    # product_remove/product_dedupe 同一份实现）；**有意不给 `expect`** —— 计数随栈而变，
    # 写死基线 = 依赖栈的恒红判据（同 chat.yml 的先例），漂移格仍生效。
    # ⚠️ 不声明 `order_count_for_phone: 13800138000`：**本用例自己就会给该号码建单**，
    # 那是"基于错误的真相模型写出的护栏 = 永远红"（同 chat.yml 里那条「**不**声明
    # order_count_for_phone」的先例判断）。
    precondition:
      - type: product_count_for_keyword
        source: "遮光窗帘"
    expectations:
      - tool: product_detail
        args:
          product_id: 遮光窗帘
    # ── 2026-09-24（issue #5247，用户裁定 2026-09-23「B 端米宝只读化」）──
    # `order_create` 已从 B 端全部 skill 解绑 ⇒ 本条断言的写能力（经对话创建订单）在 B 端
    # 不复存在，用例退役（条目不删除，理由见 skip_reason）；能力面改判到存活的只读路径
    # `product_detail`（商品/SKU 查询仍是 B 端能力），行为面改判为「如实说明 + 引导去
    # 后台订单管理页面」（见 data_checks）。
    # 逐条作废的原声明（原文留档见 merge_log）：`expectations[order_create]`、
    # `required_args[order_create.items[].processing_info.sellingMethod / doorWidth]`、
    # `must_succeed[order_create]`。效果层断言块（issue #4014 B3 口径「调用了 ≠ 成了」）
    # 随之整体作废 —— 它断言的对象 `order_create` 已不在 B 端工具集里，留着就是
    # 永不满足的悬空声明。
    data_checks:
      - "（退役，#5247）如实说明米宝只做数据查询与分析、**不提供经对话创建订单**，并引导去后台订单管理页面下单。改判前口径（留档，不再生效）：「data.order_id.length > 0」—— 该断言断言的是 order_create 的产出订单号，随 order_create 从 B 端解绑而不成立"
    skip_reason: "[backend-contract] [#5247] B 端只读化（用户裁定 2026-09-23：B 端米宝只做数据查询与分析，创建/更新能力与对应 tools 全部从 B 端移除）⇒ 本用例断言的「经对话创建订单」（order_create）已从 B 端下线、不再绑定任何 B 端 skill。用例条目与退役理由保留（不删除）；断言面改判为只读查询路径（product_detail）保留 + 如实说明「米宝不提供经对话创建订单」并引导去后台订单管理页面。"
    merge_log: "eval O003 独有（SKU 先查流程）；verification 1.8 的简化版见 OR-010 ｜ 2026-09-24（issue #5247，用户裁定 2026-09-23 B 端只读化）：order_create 从 B 端解绑 ⇒ 本用例退役（理由写在 skip_reason，条目不删除）；expectations 由 [product_detail, order_create] 改判为 [product_detail]，must_succeed[order_create] 与 required_args[order_create.items[].processing_info.sellingMethod / doorWidth] 同步移除（否则成为永不满足的悬空声明）；data_checks「data.order_id.length > 0」与新事实冲突（B 端不再产出订单号）⇒ 改判为「如实说明 + 引导后台订单管理页面」；user_inputs / precondition / namespaces / tags / title / truths_ref 均未动。"
    traces:
      tests:
        - "backend/ai-agent-service/tests/manual/mibao_scenarios.py"
      ci:
        - agent-eval.yml
      verifies: []

