    # ── 判据（每条都能红；期望值全部**写死**，不得从实现推导）──────────────────
    # ① 加工项派生 + 工艺推导：勾带 `craft_hint` 的加工项 ⇒ `craftFromItems` 派生 `craft`
    #    ⇒ 韩褶 走褶数法（走倍数法 ⇒ 红）；打孔 走倍数法 + 默认 2 倍（走褶数法 ⇒ 红）；
