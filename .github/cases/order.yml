      - tool: order_create
    # 写工具成功断言（issue #3361）：本用例 R4 的 order_create 被 confirm 门禁拦
    # （confirmation_required）后流程结束，订单没建出来 —— 期望含 order_create
    # 只能证明"模型想下单"，证明不了"订单成交"
    must_succeed:
      - tool: order_create
    # confirm 卡先行（issue #4308 的用例面改动连锁触发，守卫 = tests/unit_ci_workflows/
    # test_xiaobu_coverage.py::test_every_xiaobu_write_case_asserts_confirm_card_first）：
    # 本用例是 C 端**写用例**（must_succeed[order_create]）⇒ 必须断言「顾客先看到明细卡、
    # 之后才落库」；缺它时「只发一句『确认下单』就把单建了」这条产品要求无人守
    # （实证 run 34760653981 的验收违规）。`order_before` 的语义 = A 必须出现过且早于 B。
    order_before:
      - "interact[confirm] before order_create"
    # 金额正确性断言（issue #3365）：本用例历史实证"没查商品就报 ¥95.4"（真实 ¥168/米）
    amount_verify:
      - tool: order_create
        product_name: "遮光窗帘"
        checks: [unit_price, subtotal, total]
    data_checks:
      # ⚠️ #4882（用户裁定）：加工项**不再有单价与计价方式** ⇒ 「按计价方式推导数量」这条口径
      #    整体退场，数量恒 = 该订单行面料米数（#3005 行业口径：行业加工费按米计价、辅料含在
      #    加工费中）；加工费也不再由「加工项单价 × 数量」得出（真值源 = 加工费组合）。
      #    本用例的**内核**（数量必须可见、可对账、禁止虚构「每米几个」的密度推导）逐字保留。
      - "加工项数量 = **该订单行面料米数**（issue #4882：计价方式退场后不再派生；#3005 行业口径——行业加工费按米计价、辅料含在加工费中）⇒ 如「打孔 × 3 米」⇒ `quantity=3`；禁止虚构「每米几个」的密度推导"
      - "processing_info.processingItems 逐项含 `{id, name, quantity, unit}` —— `unitPrice` / `pricingMethod` / `subtotal` 三键已随 issue #4882 退场（订单快照不再承载加工项价与计价方式）"
      - "订单确认/回复展示加工项含「名称 + 数量」（如『打孔 3 米』）—— 数量可见可对账"
      - "加工费**不再**由「加工项单价 × 数量」得出：真值源是**加工费组合**（`processing_fee_combinations`，元/米 × 加工费米数）—— 加工项本身已无价（R10 / issue #4882）；把逐项单价 × 数量当加工费 = 口径错（该账已不存在）"
      - "C 端下单是**两步**：确认订单信息后还需手机验证码（order_create 的 sms_code，customer 角色必填）。用例必须提供验证码这一轮，否则 AI 停在第 5 步「请提供验证码」，order_create 永不发生（run 34622425044 实证：R7 顾客回「确认」后无任何工具调用）。dev/CI 栈已设 SMS_BYPASS_CODE=123456，此处用该码走真实校验分支。"
    pre_clean:
      # 去重只按关键词（#3538）：原先的 price 过滤条件（限 100 元）在独立栈
      # （种子遮光窗帘 ¥168 款）恒不匹配 → 等于没去重；同名「遮光窗帘」有副本时
      # agent 会发「哪一件」选择卡，用例无槽位应答 → 目标工具从不执行。
      # 按关键词去重保留最早创建的（= 种子商品，加工项最全），删掉其余副本（同 #3518 先例）。
      - type: product_dedupe
        product_keyword: "遮光窗帘"
    # ── 前置自断言（issue #3835 / `migao-dev-flow` §18.4）────────────────────────
    # 本用例**同时**依赖两件"按名唯一"的前置：① 商品「遮光窗帘」唯一（有 2 件同名时 agent
    # 正确地发「选择要下单的遮光窗帘」choice 卡，而 `auto_respond` 的 choice→首项会把
    # **别人造的副本**（¥100）选成下单目标 —— 判定跑 run 34908262839 的 R2 原文正是
    # 「遮光窗帘 · ¥100.00/米 · 库存 200」，随后 6 轮被岔路吃掉 ⇒ `order_create` 永不执行）；
    # ② `amount_verify` 的接地真值也按该名字取（`_fetch_product_price` 用
    # `GET /api/admin/products?keyword=遮光窗帘&size=1` 的 `items[0]`）⇒ 有副本时接地价在
    # ¥168/¥100 之间**不确定**，金额断言本身可假红/假绿（值级影响，见 issue #3835）。
    # `pre_clean` 只在起跑前去重，挡不住运行中途造出来的副本 ⇒ 交给 runner 运行期观测。
    precondition:
      - type: product_count_for_keyword
        source: "遮光窗帘"
        expect: 1
    skip_reason: ""
    merge_log: "2026-09-07 改写（issue #3005，回滚 #2986）：行业加工费按米计价、辅料（罗马圈/四爪钩等）含在按米加工费中——回滚 per_piece 与「每米数量」密度（数量=ceil(面料米数×密度) 与实际车间工艺不符、数量隐藏导致 B 端无法对账），数量改为按计价方式派生且展示（per_meter=面料米数、per_set/fixed=1）；2026-09-14 校准（#3538）：pre_clean 去 price 过滤（关键词去重，原 price 过滤限 100 元、在种子遮光窗帘 ¥168 的独立栈上恒不匹配 = 没去重）；2026-09-15（issue #3835）补 `precondition[product_count_for_keyword: 遮光窗帘, expect: 1]`：本用例按名定位下单对象、`amount_verify` 也按名取接地真值，故「该名字唯一」是可判定的前置 —— 判定跑 run 34908262839 首跑 R1 `product_search(products=2)` + R2 把 PR-016 造的 ¥100 副本选成目标，6 轮被岔路吃掉。声明前置后这类污染折成 `precondition_not_applied(declared:product_count_for_keyword)`，不再伪装成「agent 不下单」；断言（expectations/must_succeed/amount_verify/data_checks）原样未动；2026-09-15（B 端免验证码产品变更，窄跑 34930597539）：四个「123456」轮去掉 `prefer_text: true` —— 该开关会让 harness 无视待答 confirm 卡、把「点确认」轮硬发成验证码文本，而 B 端代客下单已免短信验证码、落单前必须点击确认卡（order_create 在确认卡未被点击时返回 confirmation_required_card_not_clicked，窄跑 R9~R11 逐字复现）。去掉后按 runner 既有 `resolve_auto_respond` 语义：有待答卡就答卡（confirm→点击 confirmValue / form→回填客户信息），无卡且 C 端 customer 角色被索码时才发 123456 兜底（C 端仍需验证码，见 order_create `_needs_sms_verification` role==customer 分支）；断言（expectations/must_succeed/amount_verify/data_checks/precondition）原样未动；2026-09-18 **假红归因**（issue #4042，LLM 红例 run 35243351675 @67db87ae）：本例在 mibao 腿判红（`amount_verify: 单价 150 ≠ 商品库 168`）而 **xiaobu 腿同一条断言判绿**，差异不在 agent —— 同栈的 PR-021（输入「把遮光窗帘的米白色散剪规格改成 150 元」）把**共享夹具** `prod_eval_blackout` 的米白/散剪 SKU 价改成 150 且**无复位**，而本例 `amount_verify` 的接地真值取的是**商品级价**（168，`_fetch_product_price`）⇒ 按所选规格下单（150 = 该 SKU 库价，工具层接地闸门同样放行）反被判成「凭记忆报价」。两层修法：① 断言语义对齐工具闸门（真值按所选规格取 SKU 价，见本 PR 对 `local_runner.check_amount_verify` 的改动）；② 写方无复位属独立缺陷，另开单跟踪（本 PR 不改夹具写入方）**2026-09-21 改写（issue #4882，用户裁定「彻底删除加工项单价与计价方式」）**：加工项目录与订单快照都不再有 `unitPrice` / `pricingMethod` / `subtotal`（V101 删列 + `ProcessingOrderService.isMeterBasedLine` 判据改写），且 `processing_item_manage(action=calculate_price)` 端点与计价方式枚举一并退场 ⇒ 原 data_checks 里「按计价方式派生数量」「逐项含 pricingMethod」「加工费 = 单价 × 数量」三条口径**失去对象**。按「断言只增不减」原则改写为：数量 = 订单行面料米数；快照键族收缩为 `{id, name, quantity, unit}`；并**新增**一条「加工费真值源 = 加工费组合、不得把逐项单价×数量当加工费」的负向口径。本用例的**内核**（数量可见可对账、禁止虚构每米密度）与 expectations / must_succeed / amount_verify / pre_clean / precondition / user_inputs **一字未动**。 ｜ 2026-09-25（issue #3881 缺陷二 / #4025 F11，用户裁定 A①）：**服务端取价守卫从 fail-open 改 422 fail-closed** —— `OrderService.validateAgentItemUnitPrice` 原在「明细无 SKU 标识」时直接 return（单价零核对落库，#3881 原文的口子），现改为：按商品级唯一权威价核对（唯一 SKU 价，或无 SKU 记录商品的商品级价），权威价无从唯一确定（多规格多价而未声明规格 / 商品查不到 / 无价）即 422 并给可行动话术；顺带让守卫识别工具层声明的首选键 `processingInfo.skuId`（与 `matchSkuId` 同键族）。**本用例断言一字未动**（C 端合法下单链路本就带规格键 / 商品名可唯一解析 ⇒ 逐值为同价核对）；新增判据落在 Java 面：`OrderNoSkuIdentityFailClosedTest`（9 条）与 `OrderNoSkuIdentityRealDbTest`（5 条，真库）。"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_order_create_processing_quantity.py"
      ci:
        - agent-eval.yml
      verifies: []

  - id: OR-015
    legacy_id: ""
    title: "order_create 写操作前置校验必须真正执行（validate_input 规则分层修复，issue #3029 复盘）"
    domains:
      - order
      - chat
    persona: mibao
    tier: normal
    tags:
      - order_create
      - validate_input
      - defense
    truths_ref:
      - order.create-flow
    user_inputs:
      - "创建订单，张三 13800138000 遮光窗帘 3 米"
      - "散剪，2.8米门幅"
      # 颜色应答轮（#3544 / REPORT §2.1）：原 4 轮台词从未回答 agent 反复追问的「颜色」
      # → 轮次用尽停在待确认态（断言本身合理）。agent 取颜色走的是 interact(choice) 卡
      # （run 34807151893 R2 原文：「『遮光窗帘』散剪（2.8 米门幅）有**两个颜色**可选，
      # 请点击选择颜色」`cards=choice`），且「颜色」是商品真实存在的必填 SKU 维度
      # （种子 `tests/agent_eval/fixtures/xiaobu_eval_seed.sql` 的 `prod_eval_blackout` product_colors：米白 sort_order=1 / 浅灰=2）
      # —— 不是 agent 编造的字段，也不是断言过严。
      # 有卡答卡（choice→首项=米白，= 前端点击协议；form→按声明值回填），无卡才发含颜色的
      # 原文（§13.5 陷阱：静态文本答不了卡；同 OR-014 的协作轮形态）。
      - auto_respond:
          fallback: "米白，不添加加工项，确认下单"
      # 收尾答卡轮（§13.5：写操作收尾发裸文本「确认下单」= 文字 ≠ 点卡）：R2 实测 R4 收到
      # 「确认下单」后 agent 只发了 interact(confirm) 卡（validate_input 已真执行），
      # 没有第 5 轮去点它 → order_create 永不发生。留 2 轮余量（有卡答卡 / 无卡发原文）。
      - auto_respond:
          fallback: "确认下单"
      - auto_respond:
          fallback: "确认"
    # 全局命名空间声明（issue #3781）：与同样争用该全局资源的用例自动互斥，
    # 消除「同栈并行用例互相写同一命名空间」造成的非确定性（真实 run 34856561459）。
    namespaces:
      - "customer_phone:13800138000"
      - "product_name:遮光窗帘"

    expectations:
      - tool: direct_reply
    # ── 2026-09-24（issue #5247，用户裁定 2026-09-23「B 端米宝只读化」）──
    # 本用例守护的是 **order_create 的写操作前置校验链**：`order_create` 已从 B 端全部
    # skill 解绑 ⇒ 这条链在 B 端**不存在**（`validate_input` 仍从 general 兜底 skill 可达，
    # 但「为写操作做前置校验」这个场景没有存活读路径）⇒ 用例退役（条目不删除，理由见
    # skip_reason），断言面按仓内既有伪工具形态改判为 `direct_reply`
    # （=「如实说明 + 引导去后台页面」，同 MC-021 / DF-016）。
    # 逐条作废的原声明（原文留档见 merge_log）：`expectations[validate_input]`、
    # `expectations[order_create]`、`order_before["validate_input before order_create"]`
    # （时序断言的后件是已解绑的写工具 ⇒ 永不满足）、
    # `required_args[validate_input.target_tool / target_action]`（写链路校验的定位参数）、
    # `must_succeed[order_create]`。
    # 效果层断言（issue #4014 B3）：本用例守护的是 **order_create 的前置校验链**，
    # 但此前只断言 `validate_input` / `order_create` **出现过** —— 校验跑完、确认卡点下去、
    # `order_create` 却失败（工具报错/校验被拒）时用例照样判过，「链路真的走通」无人证明。
    # 至少一次 success=true 即可（中途被确认门禁拦下属期望内安全行为）。
    # `must_succeed[order_create]`（#4014 B3 的效果层断言）已随 #5247 整块移除 ——
    # 断言对象不在 B 端工具集里，声明永不满足（原文留档见 merge_log）。
    data_checks:
      - "（退役，#5247）如实说明米宝只做数据查询与分析、**不提供经对话创建订单**，其前置校验链（validate_input → order_create）随 order_create 从 B 端解绑而整体退场；引导去后台订单管理页面。改判前口径（留档，不再生效）—— 原四条均以 order_create 为校验目标、在 B 端已无对应写链路：①「validate_input(target_tool=order_create, target_action=create) 必须真正执行必填与类型校验：缺少 customer_name/customer_phone/items 任一 → 校验失败并给出缺失字段列表」②「customer_phone 非 11 位手机号（或不以 1 开头）→ 校验失败提示「请输入 11 位中国大陆手机号」」③「合法参数（customer_name + 11 位 phone + items 非空列表）→ 校验通过 validated=true」④「禁止返回「无需校验（该操作无预定义规则）」跳过（平铺结构 vs 分层读取不匹配的回归防线，sess_7f27137647e14b1e A5 轮实证）」"
    pre_clean:
      # 去重只按关键词（#3538）：原先的 price 过滤条件（限 100 元）在独立栈
      # （种子遮光窗帘 ¥168 款）恒不匹配 → 等于没去重；同名「遮光窗帘」有副本时
      # agent 会发「哪一件」选择卡，用例无槽位应答 → 目标工具从不执行。
      # 按关键词去重保留最早创建的（= 种子商品，加工项最全），删掉其余副本（同 #3518 先例）。
      - type: product_dedupe
        product_keyword: "遮光窗帘"
    # 前置自断言（§18.4，同 OR-014/OR-029 先例）：本用例按名定位下单对象，
    # 故「该名字唯一」是它依赖的可判定前置（`product_dedupe` 先于 capture ⇒ 捕获时恰为 1）。
    # 出副本时折成 `PRECONDITION_NOT_APPLIED`，不再伪装成「agent 不下单」
