        product_keyword: "遮光窗帘"
    # 前置自断言（§18.4，同 OR-014/OR-029 先例）：本用例按名定位下单对象，
    # 故「该名字唯一」是它依赖的可判定前置（`product_dedupe` 先于 capture ⇒ 捕获时恰为 1）。
    # 出副本时折成 `PRECONDITION_NOT_APPLIED`，不再伪装成「agent 不下单」
    # （issue #3835 的形态：PR-016 曾造出同名副本 → 目标工具永不执行）。
    precondition:
      - type: product_count_for_keyword
        source: "遮光窗帘"
        expect: 1
    skip_reason: ""
    merge_log: "2026-09-08 新增（issue #3029 复盘）：_VALIDATION_RULES[order_create] 平铺结构而 execute 按 tool_rules.get(target_action) 分层读取 → 校验永远空转，手机号/必填空转；修复为 {create: {...}} 分层并对齐 product_manage，补 L2 单测；2026-09-09 校准：补「散剪规格→跳过加工项→确认」三轮（遮光窗帘有散剪/整卷需澄清售卖方式，单轮到不了 validate_input；probe 实证 4 轮走通）；2026-09-14 校准（#3538）：pre_clean 去 price 过滤（关键词去重，原 price 过滤限 100 元、在种子遮光窗帘 ¥168 的独立栈上恒不匹配 = 没去重）。2026-09-14 校准（#3544，REPORT §2.1）：补颜色应答轮——原 4 轮台词从未回答 agent 追问的「颜色」（三个 run 行为签名同构：R-verify/R1 四轮全卡颜色、R2 的 R3/R4 卡颜色），轮次用尽即停在待确认态；R3 改协作答卡轮（choice→首项=米白，无卡发含颜色原文），并补 2 轮收尾答卡余量（R2 实测 R4 只发 confirm 卡、无轮去点 → order_create 永不发生）。expectations / order_before / required_args 保持不动（REPORT §2.1 明确「保持不动」，未放宽）；2026-09-17 校准（issue #4014 B3）：补效果层断言 must_succeed[order_create]（本用例守护校验链，此前无人证明链路真的走到了写成功；order_before/required_args 均只覆盖「调用顺序/参数齐全」）；expectations / order_before / required_args / data_checks 保持不动；2026-09-18 补前置自断言（issue #4046 的 OR-* 优先档 burn-down）：precondition[product_count_for_keyword 遮光窗帘 expect=1]（同 OR-014/OR-029；断言原样未动）"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_tools_validate_input.py"
        - "backend/ai-agent-service/tests/test_tools_order_create_validation.py"
      ci:
        - ai-agent-tests.yml
      verifies: []

  - id: OR-016
    legacy_id: ""
    title: "创建订单 confirm 前必须主动询问加工项（商品绑定加工项时）"
    domains:
      - order
      - chat
    tier: normal
    tags:
      - order_create
      - processing_item
      - guided_flow
    truths_ref:
      - order.create-flow
    # ── persona（issue #4093 的 OR-016 条目 → 跟踪单 #4110）──
    # 本条是 **B 端米宝**用例（店员代客下单），此前只在**运行期**被
    # `eval_case_filter.is_customer_facing_case` 的语义过滤（`MIBAO_SEMANTIC_PATTERNS`）
    # 隐式挡在 C 端腿之外 —— 该函数 docstring 原文即点名本用例：
    # 「OR-016 首轮『给赵凯创建一个订单…』是**店员代客下单**语义，小布（C 端自助、
    # 身份固定为本人）无法触发」。种子侧同样只有 B 端腿具备前提：`mibao_eval_seed.sql`
    # 第 1 节标题逐字写着「商品：2699 系列雪尼尔窗帘面料（**OR-016 点名**）」，
    # 而 `xiaobu_eval_seed.sql` 里该名商品 **0 件**。
    # ⇒ 显式声明 persona（case-trust 规则 d）：把隐式的语义过滤换成可静态核对的标注，
    #   同时消除 `CASE-TRUST-SINGLE-LEG-NO-PERSONA`。**选择结果不变**（B 端仍选中、
    #   C 端仍不选中），只是不再依赖"读取输入措辞"的启发式。
    persona: mibao
    user_inputs:
      - "给赵凯创建一个订单，2699系列雪尼尔窗帘面料，10米，散剪2.8米门幅，2699-03暖米色，手机13800138000"
      - "不需要加工项"
      - "确认下单"
      - "确认"
    # 全局命名空间声明（issue #3781）：与同样争用该全局资源的用例自动互斥，
    # 消除「同栈并行用例互相写同一命名空间」造成的非确定性（真实 run 34856561459）。
    namespaces:
      - "customer_phone:13800138000"
      - "product_name:2699系列雪尼尔窗帘面料"

    expectations:
      - tool: product_detail
      - tool: interact
        args:
          component: choice
          multiSelect: true
      - tool: order_create
    # ── 效果层断言（issue #4093 的 OR-016 条目 → 跟踪单 #4110）──
    # 为什么必补：首跑指纹是 `no_success(order_create) || order_before_missing(interact[choice:processing_items])`，
    # 其中**前半（没成功）此前没有任何断言能判红** —— `expectations` 只证明 order_create
    # 「被调用过」（`check_expectation` 不读 `success`），工具返回 `success=false` 照样计分
    # 通过（「调用了 ≠ 成了」，#3778/#3361）。`data_checks` 那三条是**自然语义**、不计分。
    # ⇒ `must_succeed`（fail-closed：一次都没成功即判红）是这条指纹唯一的确定性下沉形态。
    # 可满足性（按 seed 真值核，**不是**"永远红"的空判据）：
    #   · 下单对象齐备 —— `mibao_eval_seed.sql`：prod_eval_2699（¥23.80，has_processing=TRUE）
    #     + 颜色 `2699-03暖米色` + `bulk_cut/2.8` 门幅 SKU（stock=500）+ 3 个加工项关联；
    #   · 该链路**历史真跑通过** —— `docs/design/agent-production-gap-analysis.md`
    #     「验证：**OR-016 3/3 通过**（去重 → 下单流程完整）」（同名商品去重后下单走通）。
    must_succeed:
      - tool: order_create
    data_checks:
      - "product_detail 返回 processing_items 非空时，生成订单确认卡之前必须主动询问加工项（interact(choice, multiSelect=true) 展示，透传 pageMeta 支持翻页；空则如实告知后继续）"
      - "用户选择加工项后，order_create 的 processing_info.processingItems 含 {id, name, unitPrice, quantity, unit, pricingMethod, subtotal}，processingFee 计入 subtotal（金额=面料小计+加工费）"
      - "一次性提交『已选加工项：A、B』→ 解析全部名称，禁止只取第一个；用户说『不需要加工项』才跳过"
    order_before:
      - "interact[choice:processing_items] before interact[confirm]"
      - "interact[choice:processing_items] before order_create"
    pre_clean:
      - type: product_dedupe
        product_keyword: "2699系列雪尼尔窗帘面料"
        price: 23.8
    # 前置自断言（§18.4，同 OR-009/OR-014/OR-015(已由 #4091 补)/OR-021 先例）：本用例按**名字**
    # 定位下单对象（「2699系列雪尼尔窗帘面料」），故「该名字在种子栈里唯一」是可判定的前置 ——
    # 别人造出同名副本时折成 `precondition_not_applied`，不再伪装成「agent 不会下单」。
    # 依据：`pre_clean.product_dedupe` 先于 capture 执行 ⇒ 捕获时恰为 1；OR-021 已声明**同一
    # source + 同一 expect**（同商品），本条声明形状与它逐字一致。
    precondition:
      - type: product_count_for_keyword
        source: "2699系列雪尼尔窗帘面料"
        expect: 1
    skip_reason: ""
    merge_log: "2026-09-08 新增（issue #3033 复盘 sess_7f27137647e14b1e）：A5 confirm 卡在加工项询问前弹出、金额 ¥238 不含加工费，用户质问后才补 A6；order.md 加工项段从被动式改主动式 + EXAMPLES 例 2 补加工项环节；2026-09-18 补前置自断言（#4082 的「改用例 PR」burn-down 硬门禁要求净缩 ≥1 条；先例 = #4091 给 OR-015 补的同款）：precondition[product_count_for_keyword「2699系列雪尼尔窗帘面料」expect=1]（按名定位下单对象，pre_clean 已按同关键词去重 ⇒ 捕获时恰为 1）；expectations/data_checks/order_before/pre_clean **原样未动**（未放宽、未删任何断言）；2026-09-18 下沉补齐（issue #4093 的 OR-016 条目 → 跟踪单 #4110，首跑指纹 `no_success(order_create) || order_before_missing(interact[choice:processing_items])`）：本单只补**效果层断言** `must_succeed[order_create]`（前半指纹此前无任何断言可判红）+ `persona: mibao`（清除 `CASE-TRUST-SINGLE-LEG-NO-PERSONA`；证据 = `eval_case_filter.is_customer_facing_case` docstring 点名本用例为店员代客下单语义 + `mibao_eval_seed.sql` 第 1 节「OR-016 点名」，且 C 端 seed 里该商品 0 件），precondition 系 #4082 批次已加、本次仅按 seed 真值复核 `expect=1`（mibao seed 该名商品恰 1 件）—— **断言只增不减**"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_prompt_snapshots.py"
        - "backend/ai-agent-service/tests/test_order_create_processing_quantity.py"
      ci:
        - agent-eval.yml
      verifies: []

  - id: OR-017
    legacy_id: ""
    title: "C 端自助下单加工项闭环 - 必须查详情→主动询问→加工费落单（不凭列表错报无加工项）"
    domains:
      - order
      - chat
      - product
    tier: normal
    persona: xiaobu
    tags:
      - order_create
      - processing_item
      - guided_flow
      - xiaobu
    truths_ref:
      - order.create-flow
    # ── 交互轮用协议轮（合作型用户：有什么卡就答什么卡）──
    # issue #3361 实证（run 34691137050 分片跑，OR-017）：静态脚本在第 3 轮发「确认」，
    # 而 agent 此时下发的是一张**加工项 choice 卡**（等顾客选加工项）——静态文本答不了卡
    # → agent 第 3 轮原样重发同一张卡 → 第 4 轮的验证码也答不了 → 轮数耗尽、
    # order_create 从未发生（用例判 red，但失败长相像"能力不行"，真因是用例喂不进卡）。
    # auto_select 回第一个选项（= 点首项，与前端点击协议一致）；
    # auto_respond 优先回答上一轮待答卡片（confirm→confirmValue / choice→首项 / form→按声明回填）。
    user_inputs:
      - "我想买夏日清风窗帘，米白色，3米，门幅2.8米散剪"
      - auto_respond:
          fallback: "我是张三，手机13800138000，地址杭州市西湖区文三路1号"
      - auto_select: true          # 答「请选择需要添加的加工项」多选卡：点首项（纳米圈打孔）
      - auto_respond:
          fallback: "确认"          # 点确认卡（confirmValue）／无卡则文本确认
      - auto_respond:
          # 验证码轮：顾客这一刻就是"把收到的码发出去"，不是去点卡 —— 必须显式声明
          # prefer_text，否则此时若有卡在等，harness 会去答题卡、把验证码轮吃掉（issue #3367）
          fallback: "123456"        # 手机验证码（dev/CI 栈 SMS_BYPASS_CODE）
          prefer_text: true
      - auto_respond:
          fallback: "123456"
          # 验证码轮：顾客这一刻就是"把收到的码发出去"，不是去点卡 ——
          # 必须显式声明 prefer_text，否则若此时有卡在等（choice/confirm），
          # harness 会去答题卡、把验证码轮吃掉（issue #3367 实证：CH-010 首跑
          # R6/R7 两轮验证码都被卡吃掉 → order_create!缺少短信验证码 → 订单不落库）
          prefer_text: true
      # 轮数余量（issue #3365，与 CH-010 同源）：模型卡序不固定（先加工项卡还是先收货
      # 表单、是否重发确认卡），实测偶发"轮数用尽仍未 order_create"→ 判红但长相像
      # 能力问题。合作型用户会一直把卡答完，故尾部留 2 轮（答不到卡也无害）。
      - auto_respond:
          fallback: "确认"
      - auto_respond:
          fallback: "确认"
    expectations:
      - tool: product_search
      - tool: product_detail
      - tool: interact
        args:
          component: choice
          multiSelect: true
      - tool: order_create
    # 写工具成功断言（issue #3361）：CI 实证本用例 R7/R8 的 order_create 返回
    # tool_not_found（进了报价 skill，该 skill 工具集里没有 order_create）→ R11 转人工，
    # 订单没建出来而用例判 100%
    must_succeed:
      - tool: order_create
    # 金额正确性断言（issue #3365）：加工项场景总额 = Σ小计 + 加工费，且单价接地
    amount_verify:
      - tool: order_create
        product_name: "夏日清风窗帘"
        checks: [unit_price, subtotal, total]
    data_checks:
      - "product_search 列表数据不含 processing_items/colorId/skus，必须先调 product_detail 取详情；未调详情即断言「无加工项」属能力误宣"
      - "加工项非空时 confirm 之前必须用 interact(choice, multiSelect=true) 主动询问，列出名称与单价（如「纳米圈打孔 ¥8/米」）"
      - "所选加工项写入 order_create 的 processing_info.processingItems（id/name/unitPrice/quantity/unit/pricingMethod/subtotal），合计写入 processingFee 且计入订单金额；按米计价项加工数量=面料米数"
      - "顾客说「不需要加工项」可跳过；加工项确实为空时才告知无可用加工项"
      - "C 端下单是**两步**：确认订单信息后还需手机验证码（order_create 的 sms_code，customer 角色必填）。用例必须提供验证码这一轮，否则 AI 停在第 5 步「请提供验证码」，order_create 永不发生（run 34622425044 实证：R7 顾客回「确认」后无任何工具调用）。dev/CI 栈已设 SMS_BYPASS_CODE=123456，此处用该码走真实校验分支。"
    # 确认卡先行（issue #3414）：C 端下单**必须先发 confirm 卡展示明细**、顾客确认后才写单
    # （prompt 第 4 步：validate_input → interact(confirm)）。此前只有 CH-010 断言了这条，
    # 其余下单用例不守 → 评测看不见"文本确认就直接写单"这条路径（验收 C-A1 抓到）。
    order_before:
      - "interact[choice:processing_items] before interact[confirm]"
      - "interact[choice:processing_items] before order_create"
      - "interact[confirm] before order_create"
    forbidden_text:
      - "暂未查询到可选加工项"
      - "无可用加工项"
      - "该商品无加工项"
    skip_reason: ""
    merge_log: "2026-09-12（issue #3361）交互轮改协议轮（auto_select 答加工项多选卡 + auto_respond 答表单/确认/验证码）：原静态「确认」喂不进加工项 choice 卡 → agent 重发同卡、轮数耗尽、order_create 未发生。2026-09-11 新增（issue #3270 C 端加工项能力补齐）：实测修复前 agent 只调 product_search 未调 product_detail，向顾客断言「这款商品暂未查询到可选加工项」，而该商品实际有 2 个加工项（纳米圈打孔 ¥8/米、韩式波浪折边 ¥12/米）→ 顾客永远选不到加工项、加工费进不了单。修复后实测同输入已主动列出真实加工项与单价。forbidden_text 锁定「凭列表错报无加工项」这一确定性反模式"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_customer_order_processing_item.py"
      ci:
        - xiaobu-acceptance.yml
      verifies: []
  - id: OR-018
    legacy_id: ""
    title: "C 端多商品一次下单 - 两个商品两套加工项，明细与金额逐行都对（能力上限）"
    domains:
      - order
      - chat
      - product
    tier: normal
    persona: xiaobu
    tags:
      - order_create
      - multi_item
      - processing_item
      - ceiling
      - xiaobu
    truths_ref:
      - order.create-flow
    # ── 能力上限用例（issue #3367）──
    # 为什么要它：现有 C 端下单用例都是**单商品**。真实顾客常一次买两款（两个窗户），
    # 而多商品把三件事同时压上来：① order_create 的 items 必须**多行**且每行自己的
    # 数量/单价；② 加工费按各自米数分别算；③ 总额 = Σ小计 + Σ加工费。
    # 单商品用例对这三件事**全无观测**（一行也能过）。判定用三层证据：
    #   must_succeed（调用真的成了）+ amount_verify（单价接地/小计自洽/总额自洽）
    #   + db_verify order_items（明细真的按行落库 —— 本次同时补的评测能力）
    # 期望金额（fixture 真值）：夏日清风 3m×158=474、遮光 2m×168=336、打孔 8/m → 24+16=40
    #   → 小计 810 + 加工费 40 = **850**
    user_inputs:
      - "我要买两款：夏日清风窗帘 米白色 3 米，遮光窗帘 米白 2 米，都要纳米圈打孔加工"
      - auto_respond:
          fallback: "我是张三，手机13800138000，地址杭州市西湖区文三路1号"
      - auto_select: true
      - auto_respond:
          fallback: "确认"
      - auto_respond:
          fallback: "另一款也要打孔加工"
      - auto_respond:
          fallback: "确认下单"
      - auto_respond:
          fallback: "123456"        # 手机验证码（dev/CI 栈 SMS_BYPASS_CODE）
          prefer_text: true
      - auto_respond:
          fallback: "123456"
          prefer_text: true
      # 轮数余量：多商品流程比单品长（两次选品/两套加工项/一次确认），模型卡序不固定
      - auto_respond:
          fallback: "确认"
      - auto_respond:
          fallback: "确认"
    expectations:
      - tool: product_search
      - tool: product_detail
      - tool: interact
      - tool: order_create
    must_succeed:
      - tool: order_create
    # 确认卡先行（issue #3414）：C 端下单**必须先发 confirm 卡展示明细**、顾客确认后才写单
    # （prompt 第 4 步：validate_input → interact(confirm)）。此前只有 CH-010 断言了这条，
    # 其余下单用例不守 → 评测看不见"文本确认就直接写单"这条路径（验收 C-A1 抓到）。
    order_before:
      - "interact[confirm] before order_create"
    amount_verify:
      - tool: order_create
        product_name: "夏日清风窗帘"
        checks: [unit_price, subtotal, total]
      - tool: order_create
        product_name: "遮光窗帘"
        checks: [unit_price]
    db_verify:
      - fetch: order_items
        source: order_create
        expect_products: ["夏日清风窗帘", "遮光窗帘"]
        expect_quantities:
          夏日清风窗帘: 3
          遮光窗帘: 2
    data_checks:
      - "多商品下单必须一次 order_create 带多行 items（每行自己的数量/单价/加工项），不得只落一款"
      - "加工费按各自米数分别计算（3 米→24、2 米→16），总额 = Σ小计 810 + Σ加工费 40 = 850"
      - "两款商品的单价都必须来自商品库（158/168），不得凭记忆报价"
