    # ── 顾客**只说行话**，全程不出现任何内部值 ──────────────────────────────
    # 「韩式褶」= 内部值 `韩褶`、「纳米圈」= 内部值 `打孔`（真值源 §8「工艺 / 安装工艺」行）。
    # 若 AI 直接把原话写进 `craft`，回复里可能完全看不出问题（话术对、字段错）⇒
    # 判据必须落在**落库值**上（见 db_verify 的 expect_craft / forbid_craft）。
    auto_fill:
      customer_name: "张三"
      customer_phone: "13800138000"
      customer_address: "浙江省杭州市西湖区文三路1号1幢101室"
      color: "米白"
      colorName: "米白"
    user_inputs:
      - "我想买遮光窗帘，米白 3 米，要韩式褶的，加工项要纳米圈"
      # 协作轮（范式同 OR-014 / #3646）：有卡答卡（confirm→点确认卡 / choice→首项 /
      # form→回填 auto_fill）→ 被问验证码就供码 → 否则说确认，直到 order_create 成功。
      - repeat_until:
          tool_called: order_create
          max: 8
        code: "123456"
        fallback: "确认下单"
        form_values:
          customer_name: "张三"
          customer_phone: "13800138000"
          customer_address: "浙江省杭州市西湖区文三路1号1幢101室"
          color: "米白"
          colorName: "米白"
    expectations:
      - tool: order_create
    must_succeed:
      - tool: order_create
    # 金额正确性断言（issue #3365）：单价接地（= 商品库价）+ 小计/总额自洽 ——
    # 本用例的「听懂了」不得以牺牲金额正确性为代价（同 OR-014 口径）。
    amount_verify:
      - tool: order_create
        product_name: "遮光窗帘"
        checks: [unit_price, subtotal, total]
    # C 端写用例必须断言「顾客先看到明细卡、之后才落库」（守卫 = tests/unit_ci_workflows/
    # test_xiaobu_coverage.py::test_every_xiaobu_write_case_asserts_confirm_card_first）。
    order_before:
      - "interact[confirm] before order_create"
    # ── 落库值断言（本单的核心判据，能力由本 PR 加到 local_runner 的 db_verify[order_items]）──
    # 读**订单明细的 `processing_info.craft`**（落库回读，不是工具传参）：
    #   · expect_craft  → 必须含内部值（证明「听懂了」并真的译了）
    #   · forbid_craft  → 不得含顾客原话（证明「没有直接落原话」）
    # 为什么读落库而不是只看传参：`OrderLineCraftFields` 只搬运、不做枚举校验 ⇒ 传参面
    # 与落库面同形，但**落库才是加工单侧真正消费的那份**（加工单快照读列）。
    # 为什么不查 `curtainType`：本用例的顾客原话没有部位口语说法（不编造前置）。
    db_verify:
      - fetch: order_items
        source: order_create
        expect_craft: ["韩褶"]
        forbid_craft: ["韩式褶", "纳米圈", "罗马圈", "S钩", "调节钩", "眼环"]
    data_checks:
      - "顾客说「韩式褶」⇒ `processing_info.craft` 落内部值 `韩褶`（真值源 §8 工艺行的内部值），**不是**原话「韩式褶」——原话不是合法工艺值，工序路线按 部位×工艺 索引 ⇒ 取不到就只能靠加工项名猜（V58 实证工序与计件工资全错）。"
      - "顾客说「纳米圈」⇒ 加工项侧照常按店铺目录匹配（`processing_item_query`），工艺侧仍落内部值；「纳米圈」属**打孔**一族的顾客说法，**不得**被当成 `craft` 的取值写库。"
      - "**红证（实现前）**：`prompts/order.md` 与 C 端 `customer_order` 内联 prompt 均**无**「术语映射」段（实测 术语映射段=0 / craft 提及=0）⇒ AI 无依据把口语译成内部值；且 `db_verify[order_items]` 当时**没有** craft 断言能力（只核对 productName/quantity）⇒ 落了原话也不会有任何东西变红。"
      - "**单一真值源**：术语表权威源 = `docs/curtain-production-rules.md` §8「术语表（AI 词汇底座，跨模块统一）」；两条 prompt 的术语映射段与知识卡片条目逐条由它派生，漂移由 `backend/ai-agent-service/tests/test_issue_4454_craft_glossary.py` 拦（双向包含：prompt 不得自创、真值源不得漏抄）。"
    pre_clean:
      - type: product_dedupe
        product_keyword: "遮光窗帘"
    # 命名空间（CASE-TRUST-NO-SELF-CLEAN 的整条销账形态，先例 = OR-014 / CH-010 / CH-019）：
    # 本用例**会建单**（写用例）⇒ 必须声明它与谁争用共享夹具；否则并行用例互相污染时，
    # 红的表现是 `unmatched expectation`（看起来像 agent 不干活，归因全错）。
    namespaces:
      - "product_name:遮光窗帘"
      - "customer_phone:13800138000"
    precondition:
      - type: product_count_for_keyword
        source: "遮光窗帘"
        expect: 1
    skip_reason: ""
    merge_log: "2026-09-19 新增（issue #4454）：用户裁定「如果担心 AI 不理解一些略语，可以在知识卡片中内置行业知识」—— 「AI 听不懂行话」是**知识问题**（理解层），不是后端路线派生问题。本用例把判据挂在**落库值**上：行话 → 内部值（`韩式褶`→`韩褶`、`纳米圈`→`打孔`族）。配套改动：`prompts/order.md`（B 端）+ C 端 `customer_order` 内联 prompt 补「术语映射」段（部位 + 工艺两维度）、真值源 §8 补录工艺词汇两行、知识模板内置行业术语条目、`local_runner` 的 `db_verify[order_items]` 加 `expect_craft`/`forbid_craft` 能力。**不改运行时业务逻辑、不降任何既有断言。**"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_issue_4454_craft_glossary.py"
      ci:
        - xiaobu-acceptance.yml
      verifies: []

  - id: OR-039
    legacy_id: ""
    title: "下单页费用明细 —— 加工项控件无单价文本（价格只在组合上）+ 特殊选项按套逐项行且合计 === 订单金额"
    domains:
      - order
    tier: normal
    persona: ""
    tags:
      - order
      - fee_detail
      - processing_fee
      - special_options
      - display
      - backend_contract
    truths_ref: []
    user_inputs:
      - "（无 LLM 环节：本用例的判据由前端 vitest 单测直接执行，见 traces.tests）"
    expectations: []
    data_checks:
      - "**R10·加工项选择控件不出现任何单价文本**：用户 2026-09-19「订单上的加工项选择控件不要展示加工项单价」—— ERP 的加工项是**组合价目**（特征集合 → 元/米），价格只在**组合**上存在 ⇒ 逐项显示单价必然误导（同一真值两个数）。判据 = 该控件渲染出的文本里不出现 `¥` 金额 / `/ 米` / `/ 套` 形态（红证：修复前渲染 `¥5.00 / 米` 与选中后的 `3米 · ¥15.00`）。"
      - "**R10·选中态仍可对账**：摘掉的是**钱**，不是数量 —— 选中后仍显示「数量 + 单位」（如 `3米`），否则商家无从核对勾了什么。⚠️ **2026-09-21 边界补注（issue #4874，独立复核提请注意）**：R10 约束的是**逐项加工项控件**；同批「加工项」区块**下方新增**了「**加工费组合**」明细块（`processing-fee-combinations`），它**依用户需求**显式展示**组合名 + 单价（元/米）+ 来源**，未定价行还给「改单价」输入（`fee-unit-price-override`）。两者**不是同一处**：组合块的价格是**组合价**（ERP 口径里的那个数，唯一真值），逐项控件仍然**不显示任何单价** ⇒ 本判据不因该块而放宽。"
      - "**R2·费用明细出现特殊选项行**：逐项 `名称 单价/套 × 套数`（数据来自服务端 `processingFeeDetail.special_options[]`，契约见设计 §4.3，已冻结）。空数组 = 没选 ⇒ **不出现该块**（缺值不渲染）。"
      - "**同一真值（判据 5）**：特殊选项行的金额之和 = `special_options_total`；且「加工」行金额 = `processingFeeDetail.amount`（**组合那半**）+ 特殊选项行 = 行金额 `processingFee` ⇒ 费用明细逐行之和 === 订单金额里的那个数（不出现第二份口径、不双算）。"
      - "**未定价显式可见（判据 3 的展示面）**：`priced:false` 的选项必须显式标「未定价（按 0 计）」，不许静默按 0 收。"
      - "**回退面（新增键只加不改）**：服务端尚未返回 `special_options`（键缺席）时，特殊选项块不出现且「加工」行金额回落为整个 `processingFee` —— 显示口径逐字等于改造前，不引入第三个口径。"
    skip_reason: "[backend-contract] 前端展示契约（admin-web 组件 + 纯函数，无 LLM 环节，不进 agent-eval 冒烟）：断言由 frontend/admin-web/tests/unit/pages/orders-new-fee-detail.test.tsx 与 frontend/admin-web/tests/unit/lib/order-fee-display.test.ts 执行"
    merge_log: "2026-09-19 新增（issue #4526 包 B，设计文档 §4.3 / §8 包 B 行 / §9 判据 4·5）：#4450 的加工费计价预览把**服务端组合取价**接进了下单页，但页面只显示一个「加工费」总数 —— 用户 2026-09-19 口径「选择了特殊选项后，也要算入费用明细」与「加工项选择控件不要展示加工项单价」两条都没有落点。本用例把判据挂到真实展示行为上：控件去单价 + 特殊选项按套逐项行 + 合计 === 订单金额。**不改运行时行为、不改断言强度**。"
    traces:
      tests:
        - "frontend/admin-web/tests/unit/pages/orders-new-fee-detail.test.tsx"
        - "frontend/admin-web/tests/unit/lib/order-fee-display.test.ts"
      ci:
        - pr-check.yml
      verifies: []

  - id: OR-040
    legacy_id: ""
    title: "下单页系统识别（②工艺规格 · 只读 + 可裁决）—— 超高/超宽**按企业阈值参数判定**（净窗宽 > oversize_width_threshold ⇒ 超宽；净窗高 > oversize_height_threshold ⇒ 超高；默认 6 / 4 米、随判定请求下发；**与加工类型 / 门幅 / 褶倍都无关**）+ 倒幅由 cuttingMode 唯一推导（无手选项）；正幅不推导（它不在加工项目录里）｜ 🔴 2026-09-22 改判（issue #5130）：原「按加工类型分流 + 与门幅比」判据已退役（#4661 / #4662 / #4877 判定面三条一并退役，改判留档见下）"
    domains:
      - order
      - product
    tier: normal
    persona: ""
    tags:
      - order
      - craft_spec
      - auto_detect
      - dimension
      - display
      - backend_contract
    truths_ref: []
    user_inputs:
      - "（无 LLM 环节：本用例的判据由前端 vitest 单测直接执行，见 traces.tests）"
    expectations: []
    data_checks:
      - "🔴 **2026-09-22 改判（issue #5130，用户裁定 D1 / D2 / D3 / D7 / D10）**：判据由**与门幅比**（几何层）换成**与**企业阈值参数**比** —— `净窗宽 > oversize_width_threshold`（默认 6）⇒ `超宽`；`净窗高 > oversize_height_threshold`（默认 4）⇒ `超高`；`倒幅` **不变**（加工类型 = `定宽买高`）。三条旧判据**一并退役**：① **分流退役（#4661）** —— 加工类型缺失 / 表外时 `超宽` / `超高` **照判**（只有 `倒幅` 缺席）；② **褶倍退役（#4662）** —— 新判据是 `净窗宽 > 阈值`，**不含褶倍**；③ **判定面门幅退役（#4877）** —— 缺门幅**不再**让超高 / 超宽判不了（门幅仍是**几何层**输入：用料 / 加工类型 / 门幅规则面）。判据的唯一实现 = 引擎 `backend/ai-agent-service/app/tools/curtain_calc.py::detect_auto_features`（签名收窄 = `(window_width, window_height, cutting_mode, config)` —— `fabric_width` / `fullness` 已退役）；依据文案逐字 = 「净窗宽 … 米 > 超宽阈值 … 米」/「净窗高 … 米 > 超高阈值 … 米」，**钉在** `backend/ai-agent-service/tests/test_production/test_auto_features.py::test_reason_wording_is_pinned`（**本用例不抄第二份** —— issue #5091 的纪律不变）。两个配置键 = `oversize_width_threshold` / `oversize_height_threshold`（迁移 `backend/admin-api/src/main/resources/db/migration/V114__add_craft_calc_oversize_thresholds.sql`；六处同源守卫 = `tests/unit_ci_workflows/test_craft_calc_config_contract.py`），且**下单页必须随判定请求下发**（不下发 ⇒ 引擎回落默认值 ⇒ 商家改的阈值**静默不生效**；断言见 `frontend/admin-web/tests/unit/pages/orders-new-auto-features.test.tsx` 的「判据 2」）。**红证（每条都能单独判红）**：把判据改回 `窗宽 × 褶倍 > 门幅` / `成品高 + 卷边 > 门幅` ⇒ 引擎侧 `test_auto_features.py` 的阈值断言必红；缺加工类型时短路成 `[]` ⇒ 同文件 `TestCuttingModeDefaultNoLongerShortCircuits` 必红；旧式依据文案复活 ⇒ `test_reason_wording_is_pinned` 必红；不下发 `config` ⇒ 下单页「判据 2」必红。**分层纪律**（不得混淆）：企业阈值只管**特征名**（进加工费组合键 = 工艺分档），**用料米数 / 加工类型一字未动**（见 `docs/design/oversize-threshold-and-enterprise-params.md` §4.4）。**以下为改判前口径（留档，不再生效）**：**D6·系统识别（用户 2026-09-19「超高 / 超宽是和门幅标准比较的……这个要求做到自动识别」；issue #4661 改判为按加工类型分流）**：**两个方向各自被门幅约束，取决于加工类型**（用户 2026-09-20 裁定「这两公式漏了加工类型是定宽买高还是定高买宽的参数 —— **定高买宽的话就不用算超宽，定宽买高就不用算超高**」）—— 判据表（`cuttingMode` 缺失 / 表外取值 ⇒ **两个方向都不判**，保守不猜朝向；`倒幅` 亦不推导）：①`定高买宽`（= 正幅，缺省档）⇒ **只判超高** `(成品高 + HEM_MARGIN) > 门幅`，**不判超宽**、不推倒幅；②`定宽买高` ⇒ **只判超宽** `窗宽 × 褶倍 > 门幅` + **倒幅**，**不判超高**；③缺失/表外 ⇒ 三者都不出现。🔴 **宽方向没有余量**（用户 2026-09-21 裁定，issue #5030：「订单这里的**宽和高是窗户的宽高**」⇒ 订单行 `width` = **净窗宽**、`height` = **净窗高**；**成品宽 = 净窗宽**、**成品高 = 净窗高**，无任何覆盖/离地/轨道换算）：超宽判据 = `窗宽 × 褶倍 > 门幅`（**这才是真正多花钱的地方** —— 分幅），依据文案由**引擎**给出，**逐字钉在** `backend/ai-agent-service/tests/test_production/test_auto_features.py::test_reason_wording_is_pinned` —— 🔴 **本用例不再抄第二份**（issue #5091：抄一份就会漂。实测本句旧文「褶倍 2」与引擎实产「褶倍 2.0」**已差一个 `.0`**；且该文件明文纪律「**不要**断言两端 reason 逐字相等」⇒ 前端 JS 模板给 `2`、引擎给 `2.0` 是**有意不同**的）；常量 `SIDE_MARGIN`、配置键 / DB 列 `side_margin`、概念「左右覆盖余量」**整体退场**（用户逐字「不用考虑左右余量，根据公式算出来的用料就已经包含了，我们是否需要移除左右余量这个概念」⇒ 结论：**移除**；新迁移 `backend/admin-api/src/main/resources/db/migration/V112__drop_craft_calc_side_margin.sql`）。**只有高方向有余量** = 高方向 `HEM_MARGIN`（`# 定宽布：上下卷边合计（脚位+止口）`）—— 超高判据与定宽买高每幅长仍用它；该副本有**同步守卫逐值比对**（`frontend/admin-web/tests/unit/lib/craft-auto-features.test.ts` 的 `pyConst()` + `tests/unit_ci_workflows/test_hem_margin_cross_language_drift.py`），不新造第二个数。门幅 = **SKU 门幅**（窄幅布 1.4；**无缺省值** —— issue #4877 已删除「缺省 2.8 米」，缺门幅 = 判不了）。红证（#4661 改前实测）：改前 `detectAutoFeatures` **不看** `cuttingMode`（两条独立阈值）⇒ 定高买宽下也会推出「超宽」（落库 `['超宽','超高']`）、定宽买高下也会推出「超高」⇒ 分流断言必红；改前宽方向用的是 `HEM_MARGIN` 且模块里没有第二个常量 ⇒ 常量语义断言必红；把阈值改成「固定 3 米」⇒ 必红。**#5030 新判据的红证形态**：把超宽判据改回「只比宽」（`窗宽 > 门幅`）⇒ 1.5 宽 × 褶倍 2 = 3.0 米该分 2 幅却判「不超宽」⇒ 分幅判据必红（漏报）；把宽方向依据改回含余量的形态（「成品宽 6.6 + 左右余量 0.3 = 6.9 米 × 褶倍 2 = 13.8 米」）⇒ 依据文案断言必红。"
      - "🔴 **2026-09-22 改判（issue #5130）**：新判据下**两者可以同时为真**（同一判定里 `超宽` + `超高` 可并存 —— 两个判据彼此独立，都只看净窗宽 / 净窗高与该租户的企业阈值）。原「一次判定里**只有一个方向受门幅约束**」的分流前提**已退役**。⇒ 缺省档 6.6 × 2.6 = `['超宽']`（6.6 > 6；2.6 ≤ 4）；把窗高改成 4.5 ⇒ `['超宽','超高']`（两者同时出现）。「同时为假」= 两个方向都未超阈值（如 1.5 × 1.5）。红证：把分流（缺省 ⇒ 都不判 / 按方向只判一个）加回 ⇒ `backend/ai-agent-service/tests/test_production/test_auto_features.py` 的 `TestCuttingModeDefaultNoLongerShortCircuits` 与 `TestOutputOrderAndReverse` 必红。**以下为改判前口径（留档，不再生效）**：**判定不互斥，但同一次判定里两个方向不可能同时为真**（issue #4661 **改判**；原口径「**两者独立可同时为真**」= **错口径**，已删）：一次判定里**只有一个方向受门幅约束**（定高买宽 ⇒ 只判超高；定宽买高 ⇒ 只判超宽 + 倒幅）。「不互斥」的新含义有两条：①**同一尺寸换加工类型 ⇒ 各自方向都判得出来**（6.6×2.6 对 2.8 门幅、褶倍 2：`定高买宽` ⇒ `超高`（2.6+0.3=2.9 > 2.8）；`定宽买高` ⇒ `超宽 + 倒幅`（6.6×2=13.2 > 2.8））—— 判据不因分流而失效；②两者仍可**同时出现在加工费组合键**里 —— 一个来自**推算**、另一个由商家**强制加**（`auto-feature-add-*`：定高买宽 + 强制加「超宽」⇒ 落库 `['超高','超宽']`），这正是 ERP 组合名 `韩褶+超宽+超高+定型`（设计 §5.2 证据链 ③）的可达路径。**同时为假**（如 1.0 宽 × 1.5 高对 2.8 门幅、褶倍 2：宽 1.0×2 = 2.0 ≤ 2.8、高 1.5+0.3 = 1.8 ≤ 2.8）⇒ 两者都不出现。红证（#4661 改前实测）：改前两条阈值独立 ⇒ 定高买宽下「超宽」照样出现 ⇒ 分流断言必红。"
      - "**倒幅由 `cuttingMode` 唯一推导**（**只有** `定宽买高` → 倒幅；`定高买宽` **不推导任何朝向特征** —— 见下条）；**不设手选项**（手选项 = 与 `cuttingMode` 冲突的第二份口径）。红证：删掉推导（或改成可手选、或让 `定高买宽` 也推倒幅）⇒ 判据必红。"
      - "**`定高买宽`（= 正幅，也是缺省加工类型）的自动推算结果**（issue #4592，P0 + **issue #5130 改判**）：🔴 **改判** —— 缺省档 6.6 × 2.6 推出的特征是 `超宽`（净窗宽 > 企业阈值），**不是** `超高`；「定高买宽 ⇒ 只判超高」的分流已退役（特征与加工类型无关）。落库组合加项 = `['超宽']`，**仍不含 `正幅`**（#4592 的 P0 护栏**一字未动**）。红证：把 `正幅` 加进 `AUTO_FEATURE_NAMES` ⇒ 与 V83 目录逐值对齐断言 + 落库断言**双红**；不再判超宽 ⇒ 落库 `toEqual(['超宽'])` 必红。**以下为改判前口径（留档，不再生效）**：：自动推导出的特征会**进加工费组合键**（`processingDetailsOf` 把它并进 `processingInfo.processingItems[]`，服务端 `ProcessingFeeQueryService.featureNames()` 只读该数组），而 `processing_items` 目录（V83）只种了 **超高 / 超宽 / 倒幅** 三项 —— **没有「正幅」** ⇒ 商家配不出含它的组合 ⇒ 组合键永远匹配不到价 ⇒ `fee_source='unpriced'` ⇒ 加工费恒 ¥0.00（默认档就是定高买宽 ⇒ **每一张默认订单**都中招）。⇒ **判据 = 自动推导特征清单与 V83 目录逐值对齐**（双向、按序，非「清单 ⊆ 目录」），且「默认定高买宽订单落库的组合加项不含 `正幅`」。红证（修复前实测）：`AUTO_FEATURE_NAMES` = `['超高','超宽','倒幅','正幅']` ⇒ 与目录逐值对齐断言 + 落库断言**双红**。**issue #4661 补充**：`定高买宽` 下「超宽」也**不再被推算**（宽按米买、无上限）⇒ 缺省档只剩 `超高`，落库组合加项 = `['超高']`（改前是 `['超宽','超高']` —— 多出的「超宽」正是错口径进组合键 ⇒ 价算错）；「超宽」在缺省档只能被**强制加**。"
