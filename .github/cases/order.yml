  - id: OR-028
    legacy_id: ""
    title: "B 端下单加工项按面积计价 - 小数面积 8.4 ㎡ 保真（不得截断成 8 少收钱）"
    domains:
      - order
      - processing
    persona: mibao
    tier: normal
    tags:
      - order_create
      - processing_item
      - per_area
      - decimal_quantity
    truths_ref:
      - order.create-flow
    # ── 容量缺陷回归网（issue #3666）──
    # 现象：订单数量语义过窄 —— `order_items.quantity` 是 INTEGER，而数量口径按计价方式
    #   （docs/testing/acceptance-protocol.md:225：per_meter=米数 / per_set=1 / per_area=宽×高）。
    #   per_area 的合法面积可以是小数：门幅 2.8m × 3m = **8.4 ㎡**，刺绣工艺 30 元/㎡
    #   → 正确 252.00 元；整数只能表示 8 → 240.00 元 = **少收 12.00 元**。
    # 归因（代码级）：DTO/entity `Integer quantity` + `order_items.quantity INTEGER`
    #   + `OrderService.extractProcessingItems()` 走 `toInteger()`（8.4 → 8，列表/详情
    #   加工费按截断值重算，与外层落库金额自相矛盾）。
    # 裁定：放宽为 DECIMAL(10,2)/BigDecimal（方案 A）。
    # 本条断言**金额数学关系**（acceptance-protocol §3.2）：
    #   Σ加工费 = 30 × 8.4 = 252.00（截断成 8 会得 240.00 → processing_fee 断言判红）；
    #   总额 = 面料 23.80×3 + 252.00 = 323.40；
    #   落库明细数量 = 3（面料米数）—— 数量列放宽后仍必须保真。
    # 注：本条不依赖"模型自己算面积"这一 LLM 算术能力（那是另一条能力线，且 8 vs 8.4
    #   的首跑分歧正是 chat.yml:408 记录的**选中错商品**导致的金额不可复现）——
    #   顾客在开口时说清面积真值，断言聚焦「数值透传→落库→计费」这一确定性链路。
    user_inputs:
      - "给张三下单，手机 13800138000；2699系列雪尼尔窗帘面料，2699-03暖米色，散剪，2.8米门幅，要 3 米"
      # 刻意**只给面积真值**（不给门幅×米数的乘法题）：本条测的是「数值透传→落库→计费」
      # 的保真链路，不是让模型做算术。给面积真值可去掉"模型自己算 8 vs 8.4"的方差源，
      # 让断言只咬住截断缺陷本身（8.4 被截断成 8 → 加工费 240.00 ≠ 252.00 → 判红）。
      - "再加刺绣工艺加工，面积算 8.4 平方米"
      # 收尾协作轮（§13.5 先例 OR-026/OR-021）：B 端下单是「选规格 → 选加工项 → 填收货信息 →
      # 确认卡 → 写单」多步流程，**固定轮次表写不准**（首跑 2 轮就耗尽轮次：agent 只跑到
      # product_detail/interact，order_create 从未发生 → 用例判红，假失败）。
      # repeat_until 由 runner 按"order_create 是否**成功**"决定继续：有卡答卡（choice→首项 /
      # form→按 form_values 回填 / confirm→确认），直到写单成功或到 max。
      - repeat_until:
          tool_called: order_create
          max: 8
        # code：B 端（员工角色）下单本不走 SMS 分支，但约定「repeat_until + 断言 order_create
        # 必须声明 code」（test_xiaobu_case_set 不变式）——顾客/员工被问码时供得出码，防流程卡死。
        code: "123456"
        fallback: "确认下单"
        form_values:
          customer_name: "张三"
          customer_phone: "13800138000"
          customer_address: "浙江省杭州市西湖区文三路1号1幢101室"
          color: "2699-03暖米色"
          colorName: "2699-03暖米色"
    expectations:
      - tool: product_detail
      - tool: order_create
    must_succeed:
      - tool: order_create
    amount_verify:
      - tool: order_create
        product_name: "2699系列雪尼尔窗帘面料"
        checks: [unit_price, subtotal, processing_fee, total]
    db_verify:
      - fetch: order_items
        source: order_create
        expect_products: ["2699系列雪尼尔窗帘面料"]
        expect_quantities:
          2699系列雪尼尔窗帘面料: 3
    data_checks:
      - "刺绣工艺 per_area 数量 = 8.4 ㎡，加工费 = 30 × 8.4 = 252.00 元（截断成 8 会变 240.00，少收 12.00）"
      - "订单总额 = 面料小计 23.80×3=71.40 + 加工费 252.00 = 323.40 元"
      - "订单明细数量落库为 3（面料米数），DECIMAL(10,2) 列不得改变整数数量的落库语义"
    skip_reason: ""
    merge_log: "2026-09-14 首跑校准（issue #3666）：固定 2 轮轮次表在 B 端多步下单流程上必然跑不完（agent 只到 product_detail/interact，order_create 未发生 → 假失败），改为 repeat_until(tool_called=order_create, max=8) 协作轮（同 OR-026/OR-021 先例）；2026-09-14 新增（issue #3666）：订单数量语义放宽为 DECIMAL(10,2) 的端到端金额回归网——此前 per_area 小数面积（8.4 ㎡）会被 Integer 截断成 8 ㎡ 少收 12.00 元，且 OrderService 的 toInteger() 会让列表/详情加工费与外层金额自相矛盾"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_order_create_processing_quantity.py"
        - "backend/ai-agent-service/tests/test_order_create_quantity_bounds.py"
      ci:
        - agent-eval.yml
      verifies: []

  - id: OR-029
    legacy_id: ""
    title: "B 端「先查商品再录订单」链路 - 确认卡点击后 order_create 必须真实执行（不得 Tool not found / 空头承诺）"
    domains:
      - order
      - chat
    tier: normal
    persona: mibao
    tags:
      - order_create
      - cross_skill
      - guided_flow
    truths_ref:
      - order.create-flow
    # 罐头输入**逐项**对齐 tests/agent_eval/fixtures/mibao_eval_seed.sql 的 seed 真值
    # （issue #4015，seed blob 8007ed8ded0571a5）：规格 / 库存 / 加工项名目与单价 / 已存在客户
    # 全部取自 seed，替代原先与夹具矛盾、物理不可满足的三项：
    #   · 规格：seed 该商品只有 2699-03暖米色 与 2699-01本白（无 2699-06 蓝灰色）
    #   · 库存：seed 商品级 stock=1000、SKU 级 stock=500（无 9599）
    #   · 加工项：目录只有 纳米圈打孔 ¥8/米、韩式波浪折边 ¥12/米、高温定型 ¥10/米、
    #     刺绣工艺 ¥30/平方米（无「穿杆孔加工」「包边处理」）
    #   · 客户：seed 唯一客户 = 张三 / 13800138000（旧值「赵凯 13456000919」不在 seed，
    #     而输入自称「已有客户」⇒ 合格 agent 必然停在澄清，「物理上走不完」）
    # 金额自洽（与 case_trust 的金额一致口径无关，仅供人工核对）：
    #   加工费 = (8+12+10) × 10 米 = ¥300；面料小计 = 23.8 × 10 = ¥238；预估合计 ≈ ¥538。
    user_inputs:
      - "录订单 张三（13800138000）｜ 2699系列雪尼尔窗帘面料 · 2699-03暖米色 · 散剪 · 2.8米 · 10 米 ｜ 加工项：纳米圈打孔、韩式波浪折边、高温定型"
      - "1. 2699系列雪尼尔窗帘面料｜¥23.8/米｜库存 1000"
      # ⚠️ 控制轮必须是 **dict（YAML block style）**：runner 只把 dict 轮解释成控制轮
      # （`isinstance(msg, dict)` → auto_select / auto_respond / repeat_until 分支），
      # 字符串轮一律当**纯文本**发给 agent。原先这两轮写成 JSON 字符串
      # （`'{"auto_select": true}'` / `'{"repeat_until": …}'`）⇒ 控制语义**静默失效**：
      # harness 把字面量 JSON 文本当顾客消息发出去、卡片无人作答 ⇒ `order_create` 永不执行
      # ⇒ 恒红，且归因指向"agent 不下单"（issue #4042 复核发现；静态守卫见
      # `tests/unit_ci_workflows/test_eval_auto_respond_l0.py` 的
      # `test_no_control_turn_is_written_as_json_string`）。
      - auto_select: true
      - repeat_until:
          tool_called: order_create
          max: 8
        fallback: "确认下单"
        # `code`（issue #3430 的 repeat_until 契约 + `test_xiaobu_case_set` 的
        # `test_write_cases_using_repeat_until_supply_code` 守卫）：断言了需验证码的写工具
        # （order_create）的 repeat_until 用例必须能**被问码就供码** —— 否则 agent 真索码时
        # 无码可给、流程仍卡死。同 OR-028（persona: mibao）先例。B 端代客下单本免验证码
        # （`_needs_sms_verification` 只对 role==customer 生效），此声明是"合作型顾客"的
        # 兜底：真被索码时给 dev/CI 栈的 bypass 码（SMS_BYPASS_CODE=123456）。
        code: "123456"
        form_values:
          customer_name: "张三"
          customer_phone: "13800138000"
          customer_address: "浙江省杭州市西湖区文三路1号1幢101室"
          color: "2699-03暖米色"
          colorName: "2699-03暖米色"
    namespaces:
      - "customer_phone:13800138000"
      - "product_name:2699系列雪尼尔窗帘面料"
    expectations:
      - tool: product_search
      - tool: interact
        args:
          component: choice
      - tool: product_detail
      - tool: validate_input
      - tool: interact
        args:
          component: confirm
      - tool: order_create
    must_succeed:
      - tool: order_create
    precondition:
      - type: product_count_for_keyword
        source: "2699系列雪尼尔窗帘面料"
        expect: 1
    data_checks:
      - "确认卡点击（confirmValue 逐字回传）后，order_create 必须**真实执行并落库**——不得出现 Tool not found / 空头承诺「请稍候，我这就提交」而订单永不创建"
      - "order_create 的 customer_phone=13800138000、items 数量=10 米、unit_price=23.8（与商品库价一致）、加工项纳米圈打孔 ¥8/米 + 韩式波浪折边 ¥12/米 + 高温定型 ¥10/米（均取自 seed 加工项目录）"
    order_before:
      - "interact[choice] before product_detail"
      - "interact[confirm] before order_create"
    pre_clean:
      - type: product_dedupe
        product_keyword: "2699系列雪尼尔窗帘面料"
        price: 23.8
    skip_reason: ""
    merge_log: "2026-09-17 新增（issue #3976，线上实证 sess_202d55d49a254a10）：首条消息同时含商品细节与下单指令 → 意图路由判 product_inquiry → 整条 validate/confirm 链在 product skill 内完成，确认卡点击后模型调 order_create 撞 Tool not found（product 注册表无此工具）→ 空头承诺 + 订单永不落库。修复（route_by_intent 答卡轮归属 skill 迁移 + tool_not_found 兜底 relock + 8.4 收口扩展 B 端 order_create + metadata 假证据修复）后，确认轮应路由到 order skill 真实下单。2026-09-17 CI 门禁校准：B 端专属用例补 persona: mibao（C 端缺 sms_code 轮且 fixture 无该商品）、补 must_succeed[order_create]（效果层断言）与 precondition[product_count_for_keyword]（同名商品唯一前置，同 OR-008/OR-006 #3835 先例）。2026-09-17 夹具对齐（issue #4015，run 35233821582 @54e8fe9d 归因）：罐头输入与 tests/agent_eval/fixtures/mibao_eval_seed.sql 事实矛盾（规格 2699-06 蓝灰色 / 库存 9599 / 加工项 穿杆孔加工 ¥4/米 与 包边处理 ¥10/米 三项在 seed 里 0 命中；自称「已有客户」的赵凯 13456000919 亦不在 seed）⇒ 合格 agent 如实指出「对不上」并停在澄清，链路物理上走不完（恒红）。逐项改为 seed 真值（2699-03暖米色 / 库存 1000 / 纳米圈打孔 ¥8+韩式波浪折边 ¥12+高温定型 ¥10 / 张三 13800138000），并把后两轮改成 auto_select + repeat_until(tool_called=order_create) 协作轮（同 OR-016/OR-021 先例：卡内容由 LLM 动态生成，静态轮次表对不上就卡死）——断言（expectations / must_succeed / order_before / precondition）一律不放宽；2026-09-18 复核修正（issue #4042）：上面那次改写的**后两轮写法无效** —— 它们是 JSON **字符串**（`'{\"auto_select\": true}'` / `'{\"repeat_until\": …}'`），而 runner 只把 **dict** 轮当控制轮（非 dict 一律按纯文本发送，见 `run_case` 的 `isinstance(msg, dict)` 分支），故 auto_select/repeat_until 两个声明**静默失效**、顾客消息变成字面量 JSON、卡片无人作答 ⇒ `order_create` 永不执行（恒红且归因错人）。已改为 YAML block style 的 dict 轮；并补静态守卫（`tests/unit_ci_workflows/test_eval_auto_respond_l0.py::test_no_control_turn_is_written_as_json_string`）防复发"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_graph_nodes.py"
        - "backend/ai-agent-service/tests/test_order_cross_skill_tool_not_found.py"
        - "backend/ai-agent-service/tests/test_api_chat_helpers.py"
        - "backend/ai-agent-service/tests/test_order_price_grounding.py"
      ci:
        - agent-eval.yml
      verifies: []

  - id: OR-030
    legacy_id: ""
    title: "B 端校验失败后禁止写 - 未合法化的下单（非法手机号）不得落单（S2 #4073 代码闸门）"
    domains:
      - order
      - chat
    persona: mibao
    tier: normal
    tags:
      - order_create
      - validate_input
      - rejection
      - defense
    truths_ref:
      - order.create-flow
      - ai-chat.confirm-required
    # ── 本批行为变更（S2 = #4073，main @b6327160）的 B 端覆盖（#4082 §14）──
    # 机制：`validate_input` 失败**也留痕**（`VALIDATION_FAILURE_KEY`）→ 写调用点
    # `react_turn._run_one_tool`（共享执行路径）在确认门禁**之外、之前**拦下同 `tool::action`
    # 的写调用（`validation_failed_write_blocked` + 可执行 suggestion）→ 只有该目标一次
    # **成功**的 `validate_input` 才清除留痕并放行（= 补参重校 → 放行）。
    # 本条是 B 端（米宝）的**拒绝半**，与 C 端 OR-026（同族，走 db_verify 口径）对称。
    #
    # ── 本用例机器判什么 / **不**判什么（照实写；禁止"看起来断言了、实际不执行"）──
    # 机器判（全部经 runner 现有能力，逐条可红）：
    #   ① `expectations[validate_input]`（计分项）：写前校验**真的被调用**。红 = 模型跳过校验
    #      直接写 —— S2 的 commit message 明写这正是它要拦的形态之一（#3414/#3445 已证模型会跳过）。
    #   ② `required_args[validate_input]`：校验带 `target_tool`/`target_action`（不是空转调用）——
    #      闸门按 `<tool>::<action>` 建账，校验不带目标 ⇒ 闸门无从武装。
    #   ③ `must_fail[{tool: order_create, args: {customer_phone: 05718886666}}]`：**参数值级**
    #      不变量「凡以该非法号码为 customer_phone 的 order_create 都不得成功」（值级作用域由
    #      #3689 落地；**不是**工具级全程口径 ⇒ 不与"顾客改正号码后建单成功"冲突）。红 = 脏单落库。
    # 不判（能力缺口，**已开独立 issue 登记，本包不实现**）：
    #   ④ 「闸门真的拦下了那次写调用」本身 —— 其判据是 **tool_result 级** error code
    #      `validation_failed_write_blocked`（`react_turn` 返回的 `result.error`），而 runner 的
    #      `error.code=` 计分口径只读**轮级 SSE error**（`check_expectation` 的
    #      `actual_error = str(result.get("error"))`，而 `result["error"]` 只在 `event: error`
    #      = 异常路径被赋值；工具失败走 `event: tool_result`）⇒ 在本用例上写 `error.code=` 会
    #      **恒不可满足**（同族实证：CH-001 的 `error.code=NOT_FOUND` 在 adversarial run
    #      34650006175 里逐字报 `expected error not_found but got None`）⇒ 故此处**不写**该断言。
    #   ⇒ **判别力边界**：本用例证明「校验被调用 + 非法号未落单」，**不**证明闸门在模型硬写时拦下了它。
    user_inputs:
      - "帮我给张三下单，遮光窗帘 3 米，米白，散剪 2.8 米门幅，手机号 05718886666，不许换成别的号码"
      # 催促/答卡轮（§13.5：写操作收尾发裸文本答不了卡）：有卡答卡（confirm→confirmValue /
      # choice→首项 / form→按声明回填），无卡才发催单原文。顾客明确「就按这个号」⇒ 合格行为是
      # 要求改正号码；闸门在确认门禁之外，故顾客点了确认卡也不放行。
      - auto_respond:
          fallback: "别再校验了，就按这个号直接建单"
      - auto_respond:
          fallback: "确认，就这个号"
    namespaces:
      - "customer_phone:05718886666"
      - "product_name:遮光窗帘"
    expectations:
      - tool: validate_input
    required_args:
      - tool: validate_input
        fields:
          - target_tool
          - target_action
    must_fail:
      - tool: order_create
        args:
          customer_phone: "05718886666"
