  # ── 冒烟档的下单主链路（用户裁定 2 / issue #4095，F17）──────────────────────
  # 为什么新增：冒烟档 9 条用例全是只读，订单域唯一一条 OR-001 是**列表查询** ⇒
  # 「校验 → 确认卡 → order_create 真实落库」这条主链路在冒烟档**零覆盖**。
  # 设计取舍（冒烟档 = 门禁级、快）：
  #   · persona 固定 mibao：B 端代客下单**免短信验证码**（order_create 的
  #     `_needs_sms_verification` 只对 role==customer 生效）⇒ 链路最短；
  #   · 轮次最少化：**一句话给全**（商品/规格/数量/客户/地址），确认卡与可能的追问
  #     交给 `repeat_until` 协作轮（有卡答卡 / 被问码供码 / 无卡发 fallback），
  #     目标工具成功即跳过余轮 —— 不写静态轮次表（LLM 动态卡序列对不上会卡死，#3483）。
  #   · 断言只留「成了没有」这条主线：must_succeed（写成功）+ db_verify（明细与手机号
  #     落库）+ order_before（确认卡先于写，防 #3976 的"空头承诺"回归）；
  #     金额/加工项细则由 normal 档的 OR-011/OR-014 承担，不在冒烟档重复。
  - id: OR-031
    legacy_id: ""
    title: "下单闭环（冒烟档）- 一句话给定商品/规格/客户 ⇒ 确认卡点击后必须真实落库"
    domains:
      - order
    tier: smoke
    persona: mibao
    tags:
      - order_create
      - smoke
      - write
    truths_ref:
      - order.create-flow
      - order.states
    user_inputs:
      - "给我下单：遮光窗帘，米白｜散剪｜2.8米门幅，3 米；客户张三 13800138000，收货地址浙江省杭州市西湖区文三路1号1幢101室"
      - repeat_until:
          tool_called: order_create
          max: 3
        # B 端免验证码；声明 `code` 是「合作型顾客」兜底（真被索码就供 dev/CI 栈的
        # bypass 码 123456）—— 也是 `test_write_cases_using_repeat_until_supply_code`
        # 守卫的契约要求（断言了 order_create 的 repeat_until 用例必须能供码）。
        code: "123456"
        fallback: "确认下单"
        form_values:
          customer_name: "张三"
          customer_phone: "13800138000"
          customer_address: "浙江省杭州市西湖区文三路1号1幢101室"
          color: "米白"
          colorName: "米白"
    # 命名空间（#3781）：本用例往**共享商品名**与客户手机号上写（下单消耗库存/建单），
    # 与同名商品的建/删/调价用例、同手机号的订单用例自动互斥（≥2 声明者才进串行道）。
    namespaces:
      - "product_name:遮光窗帘"
      - "customer_phone:13800138000"
    expectations:
      - tool: interact
        args:
          component: confirm
      - tool: order_create
    must_succeed:
      - tool: order_create
    order_before:
      - "interact[confirm] before order_create"
    required_args:
      - tool: order_create
        fields:
          - customer_phone
          - items
    db_verify:
      - fetch: order_items
        source: order_create
        expect_products:
          - "遮光窗帘"
        expect_quantities:
          遮光窗帘: 3
      - fetch: order_phone
        source: order_create
        expect_phone: "13800138000"
    precondition:
      - type: product_count_for_keyword
        source: "遮光窗帘"
        expect: 1
    data_checks:
      - "（散文、**不计分**）校验失败后禁止写：validate_input 失败留痕 → 同 tool::action 的写调用被拦（validation_failed_write_blocked）→ 该目标一次**成功**的 validate_input 才放行；本条的机器判据是 must_fail[order_create.args.customer_phone] 与 expectations[validate_input]，这条散文只记录语义"
      - "（散文、**不计分**）顾客未给合法号码且明确不许换号 ⇒ 本会话**不得**有订单落库；agent 应要求改正号码，不得自行编造一个合法号码"
    pre_clean:
      - type: product_dedupe
        product_keyword: "遮光窗帘"
    skip_reason: ""
    merge_log: "2026-09-18 新增（#4082 用例库维护 / 行为变更 S2 = #4073 @b6327160）：validate_input 校验失败禁止写落成代码闸门，此前 B 端无对应用例（C 端拒绝半见 OR-026）。机器判据三条：expectations[validate_input]（写前校验真的执行）+ required_args[validate_input: target_tool/target_action]（闸门按 tool::action 建账，校验带目标才武装）+ must_fail[order_create.args.customer_phone=05718886666]（参数值级：非法号不得落单；值级作用域由 #3689 落地）。**能力边界如实登记**：现有 runner 无法断言 tool_result 级 error code（error.code= 只读轮级 SSE error），故本用例**不**证明闸门拦下了写 —— 该能力缺口已开独立 issue，未写任何「看起来断言了」的假断言。pre_clean/namespaces 与 OR-015 同源（同商品 + 同 pre_clean 关键词）；precondition[product_count_for_keyword 遮光窗帘 expect=1] 为真前置自断言"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_validation_failure_write_gate.py"
      ci:
        - agent-eval.yml
    pre_clean:
      - type: product_dedupe
        product_keyword: "遮光窗帘"
    data_checks:
      - "确认卡点击后 order_create 必须真实执行并落库（机器断言见 must_succeed + db_verify[order_items/order_phone]：明细「遮光窗帘」×3 + 落库手机号 13800138000）—— 冒烟档只验主链路「成了没有」，金额/加工项细则由 normal 档承担"
      - "确认卡必须先于写操作下发（order_before[interact[confirm] before order_create]）：#3976 线上实证的『空头承诺』形态（模型说已发卡/这就提交，实际无卡可点、订单永不落库）在冒烟档即判红"
    skip_reason: ""
    merge_log: "2026-09-18 新增（用户裁定 2 / F17 / issue #4095）：冒烟档补下单用例 —— 此前冒烟档 9 条全只读、订单域唯一 OR-001 是列表查询 ⇒ 主链路零覆盖。persona=mibao（代客下单免验证码，链路最短）；一句话给全 + repeat_until 协作轮（有卡答卡，成功即停）；断言 = must_succeed[order_create] + db_verify[order_items/order_phone] + order_before[interact[confirm] before order_create] + required_args；自清理 product_dedupe + precondition[product_count_for_keyword expect=1] + namespaces（商品名/手机号）。未新增任何自动触发（裁定 2′/4′）。"
    traces:
      tests:
