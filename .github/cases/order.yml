    data_checks:
      # ⚠️ 口径**作用域限定**（2026-09-15，issue #3683 / #3672；旧表述无限定，已实际误导过修法）：
      #   下面这条只适用于 **order_create 路径**（agent 自己把面积算进
      #   `processing_info.processingItems[].quantity`）。
      #   **`processing_item_manage(action=calculate_price)` 端点是另一套契约**：后端自己从
      #   `dimensions` 算 `area=宽×高`，再 `unitPrice × area × quantity`（`ProcessingItemService.java:248-254`
      #   + `:310-318`）⇒ 把「宽×高」写进该端点的 `quantity` 会**必然双计**
      #   （实测：dimensions + quantity=8 → ¥1920.00；正确 payload → ¥240.00）。
      #   该端点请用 `width`/`height` 承载面积、`quantity` 作计件数（见 #3672 / PP-009）。
      - "加工项数量按计价方式确定（**仅 order_create 路径**；`calculate_price` 端点的 per_area 面积由 `dimensions.width/height` 承载、`quantity` 为计件数，见 #3672）：per_meter → 数量=面料米数（如打孔 8 元/米 × 3 米 → quantity=3、subtotal=24）；per_set/fixed → 数量=1；per_area → 宽×高"
      - "processing_info.processingItems 逐项含 {id, name, unitPrice, quantity, unit, pricingMethod, subtotal}，processingFee = 各项 unitPrice × quantity 之和"
      - "订单确认/回复展示加工项含「名称+数量+金额」（如『打孔（罗马圈）3米 ¥24.00』）——数量可见可对账，禁止虚构每米几个的密度推导"
      - "加工费 = 单价 × 数量（打孔 8 元/米 × 3 米 = 24 元），漏算/错算加工费 = 订单金额错误"
      - "C 端下单是**两步**：确认订单信息后还需手机验证码（order_create 的 sms_code，customer 角色必填）。用例必须提供验证码这一轮，否则 AI 停在第 5 步「请提供验证码」，order_create 永不发生（run 34622425044 实证：R7 顾客回「确认」后无任何工具调用）。dev/CI 栈已设 SMS_BYPASS_CODE=123456，此处用该码走真实校验分支。"
    pre_clean:
      # 去重只按关键词（#3538）：原先的 price 过滤条件（限 100 元）在独立栈
      # （种子遮光窗帘 ¥168 款）恒不匹配 → 等于没去重；同名「遮光窗帘」有副本时
