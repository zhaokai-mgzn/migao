      verifies: []

  - id: OR-029
    legacy_id: ""
    title: "B 端「先查商品再录订单」链路 - 确认卡点击后 order_create 必须真实执行（不得 Tool not found / 空头承诺）"
    domains:
      - order
      - chat
    tier: normal
    persona: mibao
    tags:
      - order_create
      - cross_skill
      - guided_flow
    truths_ref:
      - order.create-flow
    # 罐头输入**逐项**对齐 tests/agent_eval/fixtures/mibao_eval_seed.sql 的 seed 真值
    # （issue #4015，seed blob 8007ed8ded0571a5）：规格 / 库存 / 加工项名目与单价 / 已存在客户
    # 全部取自 seed，替代原先与夹具矛盾、物理不可满足的三项：
    #   · 规格：seed 该商品只有 2699-03暖米色 与 2699-01本白（无 2699-06 蓝灰色）
    #   · 库存：seed 商品级 stock=1000、SKU 级 stock=500（无 9599）
    #   · 加工项：目录只有 打孔 ¥8/米、韩褶 ¥12/米、定型 ¥10/米、
    #     刺绣工艺 ¥30/平方米（无「穿杆孔加工」「包边处理」）
    #   · 客户：seed 唯一客户 = 张三 / 13800138000（旧值「赵凯 13456000919」不在 seed，
    #     而输入自称「已有客户」⇒ 合格 agent 必然停在澄清，「物理上走不完」）
    # 金额自洽（与 case_trust 的金额一致口径无关，仅供人工核对）：
    #   加工费 = (8+12+10) × 10 米 = ¥300；面料小计 = 23.8 × 10 = ¥238；预估合计 ≈ ¥538。
    user_inputs:
      - "录订单 张三（13800138000）｜ 2699系列雪尼尔窗帘面料 · 2699-03暖米色 · 散剪 · 2.8米 · 10 米 ｜ 加工项：打孔、韩褶、定型"
      - "1. 2699系列雪尼尔窗帘面料｜¥23.8/米｜库存 1000"
      # ⚠️ 控制轮必须是 **dict（YAML block style）**：runner 只把 dict 轮解释成控制轮
      # （`isinstance(msg, dict)` → auto_select / auto_respond / repeat_until 分支），
      # 字符串轮一律当**纯文本**发给 agent。原先这两轮写成 JSON 字符串
      # （`'{"auto_select": true}'` / `'{"repeat_until": …}'`）⇒ 控制语义**静默失效**：
      # harness 把字面量 JSON 文本当顾客消息发出去、卡片无人作答 ⇒ `order_create` 永不执行
      # ⇒ 恒红，且归因指向"agent 不下单"（issue #4042 复核发现；静态守卫见
      # `tests/unit_ci_workflows/test_eval_auto_respond_l0.py` 的
      # `test_no_control_turn_is_written_as_json_string`）。
      - auto_select: true
      # ── 2026-09-24（issue #5247，用户裁定 2026-09-23 B 端只读化）──
      # `repeat_until{tool_called: order_create, max: 8}` **整块移除**：目标工具已从 B 端
      # 全部 skill 解绑 ⇒ 「协作轮到写单成功为止」的循环永不满足（悬空声明）。同一轮的其它键
      # （`code` / `fallback` / `form_values`）按原样保留、不删（删它们属本包范围外的清理）。
      # ── 该控制轮**整轮退场**（issue #5247，用户裁定 2026-09-23 B 端只读化）──
      # 原为 `- repeat_until: {tool_called: order_create, max: 8}` + 同轮的 `fallback` /
      # `code` / `form_values`。两条原因使其**不能只删 `repeat_until` 而保留其余键**：
      #   ① 循环永不满足：`order_create` 已从 B 端全部 skill 解绑（悬空声明）；
      #   ② **载荷窗口审计会红**：`payload_window_audit` 判的是「声明了载荷键却没有任何
      #      『投递轮』」—— 只删 `repeat_until` 会把 `code` 变成**无投递轮的孤立载荷声明**
      #      ⇒ `deliverable_rounds` 为空 ⇒ 判据 `test_every_declared_payload_covers_last_
      #      answerable_round` 报「OR-029: 载荷窗口在最后一个可作答轮次之前用尽」。
      # 本用例已退役（B 端不再有下单能力，见 `skip_reason`）⇒ 整轮改写为留档注释，
      # 既不留悬空键、也不删历史说明。
    namespaces:
      - "customer_phone:13800138000"
      - "product_name:2699系列雪尼尔窗帘面料"
    expectations:
      - tool: product_search
      - tool: interact
        args:
          component: choice
      - tool: product_detail
    # ── 2026-09-24（issue #5247，用户裁定 2026-09-23「B 端米宝只读化」）──
    # `order_create` 已从 B 端全部 skill 解绑 ⇒ 本用例断言的写链路（先查商品再录订单）
    # 在 B 端不复存在，用例退役（条目不删除，理由见 skip_reason）；能力面改判到存活的
    # 只读三段 `product_search` → `product_detail`（含 `interact(choice)` 卡）——
    # 「查得到商品」仍是 B 端能力，「录订单」不是；行为面改判为「如实说明 + 引导去后台
    # 订单管理页面」（见 data_checks）。逐条作废的原声明（原文留档见 merge_log）：
    # `expectations[validate_input]`、`expectations[interact(confirm)]`（写操作的确认卡；
    # 写链路没了 ⇒ 一并退场）、`expectations[order_create]`、`must_succeed[order_create]`、
    # `order_before["interact[confirm] before order_create"]`、
    # `user_inputs[3].repeat_until{tool_called: order_create, max: 8}`。
    precondition:
      - type: product_count_for_keyword
        source: "2699系列雪尼尔窗帘面料"
        expect: 1
    data_checks:
      - "（退役，#5247）如实说明米宝只做数据查询与分析、**不提供经对话录单/下单**，并引导去后台订单管理页面处理。改判前口径（留档，不再生效）—— 原两条的断言对象都是 order_create 的写单行为，随 order_create 从 B 端解绑而不成立（该工具已不在 B 端工具集里，调用本身不可能发生）：①「确认卡点击（confirmValue 逐字回传）后，order_create 必须**真实执行并落库**——不得出现 Tool not found / 空头承诺「请稍候，我这就提交」而订单永不创建」②「order_create 的 customer_phone=13800138000、items 数量=10 米、unit_price=23.8（与商品库价一致）、加工项打孔 ¥8/米 + 韩褶 ¥12/米 + 定型 ¥10/米（均取自 seed 加工项目录）」"
    order_before:
      - "interact[choice] before product_detail"
    # `order_before["interact[confirm] before order_create"]` 已移除：后件是已从 B 端解绑的
    # 写工具 ⇒ 该时序断言永不满足（原文留档见 merge_log）。
    pre_clean:
      - type: product_dedupe
        product_keyword: "2699系列雪尼尔窗帘面料"
        price: 23.8
    skip_reason: "[backend-contract] [#5247] B 端只读化（用户裁定 2026-09-23：B 端米宝只做数据查询与分析，创建/更新能力与对应 tools 全部从 B 端移除）⇒ 本用例断言的「先查商品再录订单」（order_create）已从 B 端下线、不再绑定任何 B 端 skill。用例条目与退役理由保留（不删除）；断言面改判为只读三段（product_search → product_detail，含 interact(choice) 卡）+ 如实说明「米宝不提供经对话录单/下单」并引导去后台订单管理页面。"
    merge_log: "2026-09-17 新增（issue #3976，线上实证 sess_202d55d49a254a10）：首条消息同时含商品细节与下单指令 → 意图路由判 product_inquiry → 整条 validate/confirm 链在 product skill 内完成，确认卡点击后模型调 order_create 撞 Tool not found（product 注册表无此工具）→ 空头承诺 + 订单永不落库。修复（route_by_intent 答卡轮归属 skill 迁移 + tool_not_found 兜底 relock + 8.4 收口扩展 B 端 order_create + metadata 假证据修复）后，确认轮应路由到 order skill 真实下单。2026-09-17 CI 门禁校准：B 端专属用例补 persona: mibao（C 端缺 sms_code 轮且 fixture 无该商品）、补 must_succeed[order_create]（效果层断言）与 precondition[product_count_for_keyword]（同名商品唯一前置，同 OR-008/OR-006 #3835 先例）。2026-09-17 夹具对齐（issue #4015，run 35233821582 @54e8fe9d 归因）：罐头输入与 tests/agent_eval/fixtures/mibao_eval_seed.sql 事实矛盾（规格 2699-06 蓝灰色 / 库存 9599 / 加工项 穿杆孔加工 ¥4/米 与 包边处理 ¥10/米 三项在 seed 里 0 命中；自称「已有客户」的赵凯 13456000919 亦不在 seed）⇒ 合格 agent 如实指出「对不上」并停在澄清，链路物理上走不完（恒红）。逐项改为 seed 真值（2699-03暖米色 / 库存 1000 / 打孔 ¥8+韩褶 ¥12+定型 ¥10 / 张三 13800138000），并把后两轮改成 auto_select + repeat_until(tool_called=order_create) 协作轮（同 OR-016/OR-021 先例：卡内容由 LLM 动态生成，静态轮次表对不上就卡死）——断言（expectations / must_succeed / order_before / precondition）一律不放宽；2026-09-18 复核修正（issue #4042）：上面那次改写的**后两轮写法无效** —— 它们是 JSON **字符串**（`'{\"auto_select\": true}'` / `'{\"repeat_until\": …}'`），而 runner 只把 **dict** 轮当控制轮（非 dict 一律按纯文本发送，见 `run_case` 的 `isinstance(msg, dict)` 分支），故 auto_select/repeat_until 两个声明**静默失效**、顾客消息变成字面量 JSON、卡片无人作答 ⇒ `order_create` 永不执行（恒红且归因错人）。已改为 YAML block style 的 dict 轮；并补静态守卫（`tests/unit_ci_workflows/test_eval_auto_respond_l0.py::test_no_control_turn_is_written_as_json_string`）防复发 ｜ 2026-09-24（issue #5247，用户裁定 2026-09-23 B 端只读化）：order_create 从 B 端解绑 ⇒ 本用例退役（理由写在 skip_reason，条目不删除）；expectations 由 [product_search, interact(choice), product_detail, validate_input, interact(confirm), order_create] 改判为 [product_search, interact(choice), product_detail]（去重 + 删写链路），must_succeed[order_create] 同步移除；`order_before[\"interact[confirm] before order_create\"]` 一并移除（后件是已解绑的写工具），首条 `interact[choice] before product_detail` 原样保留；`user_inputs[3].repeat_until{tool_called: order_create, max: 8}` 整块移除（目标工具已解绑 ⇒ 永不满足），同轮的 `code` / `fallback` / `form_values` 原样保留；data_checks 两条与新事实冲突（确认卡点击后的写单执行 / order_create 的落参）⇒ 合并改判为一条「如实说明 + 引导后台」并留档原文；persona / namespaces / precondition / pre_clean / tags / title / truths_ref 均未动。"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_graph_nodes.py"
        - "backend/ai-agent-service/tests/test_order_cross_skill_tool_not_found.py"
        - "backend/ai-agent-service/tests/test_api_chat_helpers.py"
        - "backend/ai-agent-service/tests/test_order_price_grounding.py"
      ci:
        - agent-eval.yml
      verifies: []

  - id: OR-030
    legacy_id: ""
    title: "B 端校验失败后禁止写 - 未合法化的下单（非法手机号）不得落单（S2 #4073 代码闸门）"
    domains:
      - order
      - chat
    persona: mibao
    tier: normal
    tags:
      - order_create
      - validate_input
      - rejection
      - defense
    truths_ref:
      - order.create-flow
      - ai-chat.confirm-required
    # ── 本批行为变更（S2 = #4073，main @b6327160）的 B 端覆盖（#4082 §14）──
    # 机制：`validate_input` 失败**也留痕**（`VALIDATION_FAILURE_KEY`）→ 写调用点
    # `react_turn._run_one_tool`（共享执行路径）在确认门禁**之外、之前**拦下同 `tool::action`
    # 的写调用（`validation_failed_write_blocked` + 可执行 suggestion）→ 只有该目标一次
    # **成功**的 `validate_input` 才清除留痕并放行（= 补参重校 → 放行）。
    # 本条是 B 端（米宝）的**拒绝半**，与 C 端 OR-026（同族，走 db_verify 口径）对称。
    #
    # ── 本用例机器判什么 / **不**判什么（照实写；禁止"看起来断言了、实际不执行"）──
    # 机器判（全部经 runner 现有能力，逐条可红）：
    #   ① `expectations[validate_input]`（计分项）：写前校验**真的被调用**。红 = 模型跳过校验
    #      直接写 —— S2 的 commit message 明写这正是它要拦的形态之一（#3414/#3445 已证模型会跳过）。
    #   ② `required_args[validate_input]`：校验带 `target_tool`/`target_action`（不是空转调用）——
    #      闸门按 `<tool>::<action>` 建账，校验不带目标 ⇒ 闸门无从武装。
    #   ③ `must_fail[{tool: order_create, args: {customer_phone: 05718886666}}]`：**参数值级**
    #      不变量「凡以该非法号码为 customer_phone 的 order_create 都不得成功」（值级作用域由
    #      #3689 落地；**不是**工具级全程口径 ⇒ 不与"顾客改正号码后建单成功"冲突）。红 = 脏单落库。
    # **有意不接线**的判据（2026-09-25 重写本段；依据 = issue #4098 落地的新键）：
    #   ④ 「闸门真的拦下了那次写调用」本身 —— 判据 = **工具级** error code
    #      `tool.error.code=validation_failed_write_blocked`（runner 口径见
    #      `tests/agent_eval/local_runner.py` 的 `check_expectation`；码来源 = `react_turn` 的
    #      写调用点 → `event: tool_result` 的 `result.error`）。#4098 **之前**该断言恒不可满足
    #      （`error.code=` 只读轮级 SSE error，工具失败走 tool_result）⇒ 当时本段登记为**能力缺口**；
    #      现在能力已具备（判据 = `backend/ai-agent-service/tests/test_agent_eval_tool_error_code.py`）。
    #      **仍未接线**的理由（如实登记，不是能力限制）：该码只在模型**真的硬写**时才出现，而合格
    #      行为（要求改正号码、不写）取不到它 ⇒ 直接接成计分断言会把"模型守规矩"判成失败；接线需
    #      一次真实评测校准，而本包按 #4262 不派发真实 LLM 评测（§24 判据⑤：证据不在本机可得）⇒
    #      已并入既有台账（#4043 未修清单）。
    #   ⇒ **判别力边界**：本用例证明「校验被调用 + 非法号未落单」；「闸门拦下了硬写」这一格的
    #      能力现**可获得**（见 ④），但需校准后才接线 ⇒ 本用例**当前仍不**证明它。
    user_inputs:
      - "帮我给张三下单，遮光窗帘 3 米，米白，散剪 2.8 米门幅，手机号 05718886666，不许换成别的号码"
      # 催促/答卡轮（§13.5：写操作收尾发裸文本答不了卡）：有卡答卡（confirm→confirmValue /
      # choice→首项 / form→按声明回填），无卡才发催单原文。顾客明确「就按这个号」⇒ 合格行为是
      # 要求改正号码；闸门在确认门禁之外，故顾客点了确认卡也不放行。
      - auto_respond:
          fallback: "别再校验了，就按这个号直接建单"
      - auto_respond:
          fallback: "确认，就这个号"
    namespaces:
      - "customer_phone:05718886666"
      - "product_name:遮光窗帘"
    expectations:
      - tool: validate_input
    required_args:
      - tool: validate_input
        fields:
