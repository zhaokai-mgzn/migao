  - id: OR-019
    legacy_id: ""
    title: "C 端下单中途改数量 - 以最新数量为准，落库数量与金额都得跟着改（能力上限）"
    domains:
      - order
      - chat
      - product
    tier: normal
    persona: xiaobu
    tags:
      - order_create
      - correction
      - multi_turn
      - ceiling
      - xiaobu
    truths_ref:
      - order.create-flow
      - ai-chat.confirm-required
    # ── 能力上限用例（issue #3367）──
    # 为什么要有它：真实顾客**边聊边改**（先说 3 米，看到确认卡又改 4 米）。
    # 这类"状态更新"是流程型 Agent 最容易出错的地方，而现有用例全是"一次说清、不再改"。
    # 判定必须咬住**最新数量**：
    #   · amount_verify 只能证明"传参自洽"（qty=3 时 504=3×168 同样自洽）——**抓不到用旧值**；
    #   · 真正能抓的是 db_verify 的 expect_quantities: 4（落库明细必须是最新数量）。
    # 期望金额（fixture 真值）：168×4 + 8×4(打孔) = 672 + 32 = **704**
    user_inputs:
      - "帮我下单，遮光窗帘 3 米，要打孔加工"
      - auto_respond:
          fallback: "米白"
      - auto_respond:
          fallback: "等等，数量改成 4 米"     # 中途纠错：必须以最新数量为准
          prefer_text: true
      - auto_respond:
          fallback: "确认下单"
      - auto_respond:
          fallback: "确认"
      - auto_respond:
          fallback: "123456"        # 手机验证码（dev/CI 栈 SMS_BYPASS_CODE）
          prefer_text: true
      - auto_respond:
          fallback: "123456"
          prefer_text: true
      # 轮数余量：模型可能因改数量重新查详情/重发确认卡
      - auto_respond:
          fallback: "确认"
      - auto_respond:
          fallback: "确认"
    expectations:
      - tool: product_search
      - tool: product_detail
      - tool: order_create
    must_succeed:
      - tool: order_create
    # 确认卡先行（issue #3414）：C 端下单**必须先发 confirm 卡展示明细**、顾客确认后才写单
    # （prompt 第 4 步：validate_input → interact(confirm)）。此前只有 CH-010 断言了这条，
    # 其余下单用例不守 → 评测看不见"文本确认就直接写单"这条路径（验收 C-A1 抓到）。
    order_before:
      - "interact[confirm] before order_create"
    amount_verify:
      - tool: order_create
        product_name: "遮光窗帘"
        checks: [unit_price, subtotal, total]
    db_verify:
      - fetch: order_items
        source: order_create
        expect_products: ["遮光窗帘"]
        expect_quantities:
          遮光窗帘: 4
    data_checks:
      - "顾客中途改数量后，确认卡与订单明细都必须反映**最新**数量（4 米），不得沿用旧值 3 米"
      - "金额按最新数量重算：168×4 + 打孔 8×4 = 704"
    skip_reason: ""
    merge_log: "2026-09-13 新增（issue #3367）：C 端能力上限用例（多轮纠错/状态更新）"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_acceptance_case_checks.py"
      ci:
        - xiaobu-acceptance.yml
      verifies: []
  - id: OR-020
    legacy_id: ""
    title: "C 端下单中途打岔后回到原流程 - 草稿不丢（数量/加工项必须延续）"
    domains:
      - order
      - chat
      - product
    tier: normal
    persona: xiaobu
    tags:
      - order_create
      - interruption
      - context_retention
      - ceiling
      - xiaobu
    truths_ref:
      - order.create-flow
    # ── 能力上限用例（issue #3379 目标：提高"智力"）──
    # 为什么要有它：真实顾客**边聊边打岔**（下单到一半问"多久发货？"再回来继续）。
    # 这类"草稿保持 + 流程恢复"是流程型 Agent 最容易丢状态的地方，而现有用例
    # 要么一次说清（OR-014/017/018/019），要么打岔后并不回到写流程（C-A2 验收剧本）。
    # 判定必须咬住**打岔前已确认的内容**：
    #   · `db_verify` 明细数量 = 3（草稿里的数量若丢失/被重置，这里就露）；
    #   · `amount_verify` 总额 = 168×3 + 打孔 8×3 = **528**（加工项若丢，总额会变 504）。
    # 即：**打断后恢复的流程必须带着原草稿走完**，否则金额/明细对不上。
    user_inputs:
      - "帮我下单，遮光窗帘 3 米，要打孔加工"
      - auto_respond:
          fallback: "米白"
      - auto_respond:
          fallback: "纳米圈打孔"
      # 打岔轮：必须是**文本**送达（prefer_text），否则会被当时待答的卡片吃掉，
      # 那就测不到"打岔"这件事本身了（issue #3367 的协议轮教训）。
      - auto_respond:
          fallback: "对了，你们一般多久能发货呀？"
          prefer_text: true
      - auto_respond:
          fallback: "好的，那我们继续把刚才那单下了吧"
      - auto_respond:
          fallback: "确认下单"
      - auto_respond:
          fallback: "123456"      # 手机验证码（dev/CI 栈 SMS_BYPASS_CODE）
          prefer_text: true
      - auto_respond:
          fallback: "123456"
          prefer_text: true
      # 轮数余量：打岔后模型可能重新查详情/重发确认卡
      - auto_respond:
          fallback: "确认"
      - auto_respond:
          fallback: "确认"
    expectations:
      - tool: product_search
      - tool: product_detail
      - tool: order_create
    must_succeed:
      - tool: order_create
    # 确认卡先行（issue #3414）：C 端下单**必须先发 confirm 卡展示明细**、顾客确认后才写单
    # （prompt 第 4 步：validate_input → interact(confirm)）。此前只有 CH-010 断言了这条，
    # 其余下单用例不守 → 评测看不见"文本确认就直接写单"这条路径（验收 C-A1 抓到）。
    order_before:
      - "interact[confirm] before order_create"
    amount_verify:
      - tool: order_create
        product_name: "遮光窗帘"
        checks: [unit_price, subtotal, total]
    db_verify:
      - fetch: order_items
        source: order_create
        expect_products: ["遮光窗帘"]
        expect_quantities:
          遮光窗帘: 3
    data_checks:
      - "打岔（问发货时效）后必须能回到原下单流程，且**草稿不丢**：数量 3 米、加工项打孔都延续"
      - "恢复后的订单金额仍为 168×3 + 打孔 8×3 = 528；若加工项丢失会变成 504（金额即证据）"
    skip_reason: ""
    merge_log: "2026-09-13 新增（issue #3379）：能力上限用例（打岔后草稿保持 + 流程恢复）"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_acceptance_case_checks.py"
      ci:
        - xiaobu-acceptance.yml
      verifies: []

  - id: OR-021
    legacy_id: ""
    title: "C 端缺收货信息时不得自我否定能力 - 必须查/问后继续下单（能力下限）"
    domains:
      - order
      - chat
      - product
    tier: normal
    persona: xiaobu
    tags:
      - order_create
      - honesty
      - capability
      - xiaobu
    truths_ref:
      - order.create-flow
      - ai-chat.confirm-required
    # ── 能力下限用例（issue #3389，验收剧本 C-A1 实证）──
    # 实证（run 34743802010）：顾客给齐商品/颜色/门幅/数量/加工项后说「确认下单」，
    # 小布连续 4 轮回「**下单这个操作小布这边没法直接帮您提交呢**，需要您在小程序里点一下"立即购买"」，
    # R9 甚至 `human_handoff(reason="顾客需协助下单（智能客服无法代为提交订单）")`
    # （**该工具已于 2026-09-19 按用户裁定退场/模型不可达**；本行是历史实证留档 ——
    #  当时正是"拒绝能力 + 转人工"的组合把转化路径掐断）
    # —— 整场 9 轮**从未调用 `order_create`**，而它就是这个 skill 自己的写工具。
    # 缺的其实是**收货信息**（姓名/手机号/地址）：正确动作是 `customer_address_query` 查历史地址，
    # 没有再发 form 卡或直接问 —— 而不是宣布"我做不到"并把顾客推去小程序。
    # 本用例顾客只给商品不给收货信息，专门压这条路径。
    user_inputs:
      - "我想买遮光窗帘，米白 3 米，要纳米圈打孔加工"
      - auto_respond:
          fallback: "米白"
      # ⚠️ 这里**刻意不再重报数量**（issue #3395 复盘）：数量已在 R1 给过，
      # 再答一次「3 米」会被模型读成"再加 3 米" → 落库 ×6（实测 run 34750771576）。
      # 真实顾客回答别的问题时也不会重报数量；改数量由 OR-019 专项覆盖。
      # ── 协作型顾客的"统一一轮"（issue #3430）──
      # 旧写法是固定轮次表（答卡 ×2 → 验证码 ×2 → 确认 ×2），但**实际卡片序列随模型而变**：
      # 实测 run 34767204074 的序列是 `form(R3) → choice(R4) → confirm(R7)`，于是验证码轮
      # 落在「加工项多选卡」上 → 顾客答非所问 → 卡没人答、流程不前进 → 轮数耗尽时确认卡
      # 刚发出来就没人答它 → `order_create` 从未发生（0/1，纯空转）。
      # `repeat_until` 把验收剧本里已验证的语义搬进来：**有卡答卡 → 被问验证码就供码 → 否则说确认**，
      # 直到 `order_create` 成功（被门禁挡回不算成功，故不会提前停）。
      - repeat_until:
          tool_called: order_create
          max: 8
        code: "123456"
        fallback: "确认下单"
        form_values:
          customer_name: "张三"
          customer_phone: "13800138000"
          customer_address: "浙江省杭州市西湖区文三路1号1幢101室"
          color: "米白"
          colorName: "米白"
    expectations:
      - tool: product_search
      - tool: product_detail
      - tool: order_create
    must_succeed:
      - tool: order_create
    # 确认卡先行（issue #3414）：C 端下单**必须先发 confirm 卡展示明细**、顾客确认后才写单
    # （prompt 第 4 步：validate_input → interact(confirm)）。此前只有 CH-010 断言了这条，
    # 其余下单用例不守 → 评测看不见"文本确认就直接写单"这条路径（验收 C-A1 抓到）。
    order_before:
      - "interact[confirm] before order_create"
    # 能力误宣反模式词（issue #3389）：命中即判失败 —— 这是"能做却说做不了"，
    # 顾客明明要买却被告知系统不行，比答错更伤（C-A1 原文即此形）。
    forbidden_text:
      - "没法直接帮您提交"
      - "没法帮您提交订单"
      - "无法代为提交"
      # **权限类**能力误宣（issue #3421，验收 C-A1 实证）：`order_create` 就是小布自己的写工具，
      # 以"没权限"为由把顾客推给人工 = 转化路径被自己掐断，比答错更伤。
      - "无下单权限"
      - "没有下单权限"
      - "无法帮您完成下单"
      - "无法帮您完成订单"
      - "无法帮您提交订单"
      - "小程序里点"
      - "小布没法提交"
      - "无法代为下单"
    amount_verify:
      - tool: order_create
        product_name: "遮光窗帘"
        checks: [unit_price, subtotal, total]
    db_verify:
      - fetch: order_items
        source: order_create
        expect_products: ["遮光窗帘"]
        expect_quantities:
          遮光窗帘: 3
      - fetch: order_phone
        source: order_create
        expect_phone: "13800138000"
    data_checks:
      - "缺收货信息时先 customer_address_query 查历史地址，没有再发 form 卡/直接问 —— 不得自我否定能力、不得推去小程序"
      - "任何一轮回复都不得出现「我无法提交订单 / 没法帮您下单」这类能力误宣"
      - "参数补齐后必须真实落单（order_create 成功 + 明细/数量/手机号正确）"
    skip_reason: ""
    merge_log: "2026-09-13 新增（issue #3389）：能力下限用例（缺信息时收集而非拒单 + 能力误宣反模式）"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_acceptance_case_checks.py"
        - "backend/ai-agent-service/tests/test_graph_skills.py"
      ci:
        - xiaobu-acceptance.yml
      verifies: []

  - id: OR-022
    legacy_id: ""
    title: "C 端新客（无历史收货信息）- 必须主动收集后下单，不得拒单"
    domains:
      - order
      - chat
      - product
    tier: normal
    persona: xiaobu
    # 多身份评测（issue #3391）：以**无任何历史订单**的新客身份跑。
    # 为什么必须换身份：debug_customer_1 在种子里有历史订单 → customer_address_query 恒
    # has_address=true →「未命中 → 主动收集收货信息」这条路径**在评测里不可达**，
    # 而验收 C-A1 暴露的问题（agent 既没查也没问，直接宣布"我下不了单"）正出在这里。
    # 服务端仅 DEBUG 模式 + customer 角色 + `debug_` 前缀白名单接受该头（app/utils/auth.py）。
    debug_user: "debug_customer_new"
    tags:
      - order_create
      - new_customer
      - capability
      - xiaobu
    truths_ref:
      - order.create-flow
      - ai-chat.confirm-required
    # 用例级表单载荷（issue #3804）：客户信息原先只声明在 R3/R4 ⇒ agent 发卡晚一轮
    # 即整场不可完成（`__FORM__` 命中 0 → order_create 永不发生 → 红且归因错人）。
    # 声明在用例级 = 载荷**脱离轮次位置**，全场任意轮可用；轮级声明保留（优先级更高）。
    auto_fill:
      customer_name: "张三"
      customer_phone: "13800138000"
      customer_address: "浙江省杭州市西湖区文三路1号1幢101室"
      color: "米白"
      colorName: "米白"
    user_inputs:
      - "我想买遮光窗帘，米白 3 米，要纳米圈打孔加工"
      - auto_respond:
          fallback: "米白"
      # ⚠️ 这里**刻意不再重报数量**（issue #3395 复盘）：数量已在 R1 给过，
      # 再答一次「3 米」会被模型读成"再加 3 米" → 落库 ×6（实测 run 34750771576）。
      # 真实顾客回答别的问题时也不会重报数量；改数量由 OR-019 专项覆盖。
      # 收货信息轮：agent 可能发 form 卡（→ form_values 回填）或**纯文本追问**
      # （→ fallback 文本即"顾客把姓名/手机号/地址一起发过来"），两条都覆盖。
      - auto_respond:
          fallback: "张三 13800138000 浙江省杭州市西湖区文三路1号1幢101室"
          form_values:
            customer_name: "张三"
            customer_phone: "13800138000"
            customer_address: "浙江省杭州市西湖区文三路1号1幢101室"
            color: "米白"
            colorName: "米白"
      - auto_respond:
          fallback: "确认下单"
          form_values:
            customer_name: "张三"
            customer_phone: "13800138000"
            customer_address: "浙江省杭州市西湖区文三路1号1幢101室"
            color: "米白"
            colorName: "米白"
      - auto_respond:
          fallback: "123456"
          prefer_text: true
      - auto_respond:
          fallback: "123456"
          prefer_text: true
      - auto_respond:
          fallback: "确认"
      - auto_respond:
          fallback: "确认"
      - auto_respond:
          fallback: "确认"
    expectations:
      - tool: product_search
      - tool: product_detail
      - tool: order_create
    must_succeed:
      - tool: order_create
    # 确认卡先行（issue #3414）：C 端下单**必须先发 confirm 卡展示明细**、顾客确认后才写单
    # （prompt 第 4 步：validate_input → interact(confirm)）。此前只有 CH-010 断言了这条，
    # 其余下单用例不守 → 评测看不见"文本确认就直接写单"这条路径（验收 C-A1 抓到）。
    order_before:
      - "interact[confirm] before order_create"
    # 能力误宣反模式（issue #3389 同族）：新客路径最容易触发"我做不到"。
    forbidden_text:
      - "没法直接帮您提交"
      - "没法帮您提交订单"
      - "无法代为提交"
      - "无法帮您提交订单"
      - "小程序里点"
      - "无法代为下单"
    amount_verify:
      - tool: order_create
        product_name: "遮光窗帘"
        checks: [unit_price, subtotal, total]
    db_verify:
      - fetch: order_items
        source: order_create
        expect_products: ["遮光窗帘"]
        expect_quantities:
          遮光窗帘: 3
      - fetch: order_phone
        source: order_create
        expect_phone: "13800138000"
    data_checks:
      - "新客无历史收货信息时：必须主动收集（form 卡或文本问姓名/手机号/地址），不得拒单、不得推去小程序"
      - "收集到的收货信息必须真的用于落单（订单手机号/明细与顾客所给一致）"
      - "全程不得出现「我无法提交订单 / 没法帮您下单」这类能力误宣"
    skip_reason: ""
    merge_log: "2026-09-13 新增（issue #3391）：新客路径覆盖（多身份评测 + 无历史地址时的收集能力）"
    traces:
