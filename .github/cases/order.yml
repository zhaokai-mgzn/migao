  - id: OR-016
    legacy_id: ""
    title: "创建订单 confirm 前必须主动询问加工项（店铺加工项目录非空时）"
    domains:
      - order
      - chat
    tier: normal
    tags:
      - order_create
      - processing_item
      - guided_flow
    truths_ref:
      - order.create-flow
    # ── persona（issue #4093 的 OR-016 条目 → 跟踪单 #4110）──
    # 本条是 **B 端米宝**用例（店员代客下单），此前只在**运行期**被
    # `eval_case_filter.is_customer_facing_case` 的语义过滤（`MIBAO_SEMANTIC_PATTERNS`）
    # 隐式挡在 C 端腿之外 —— 该函数 docstring 原文即点名本用例：
    # 「OR-016 首轮『给赵凯创建一个订单…』是**店员代客下单**语义，小布（C 端自助、
    # 身份固定为本人）无法触发」。种子侧同样只有 B 端腿具备前提：`mibao_eval_seed.sql`
    # 第 1 节标题逐字写着「商品：2699 系列雪尼尔窗帘面料（**OR-016 点名**）」，
    # 而 `xiaobu_eval_seed.sql` 里该名商品 **0 件**。
    # ⇒ 显式声明 persona（case-trust 规则 d）：把隐式的语义过滤换成可静态核对的标注，
    #   同时消除 `CASE-TRUST-SINGLE-LEG-NO-PERSONA`。**选择结果不变**（B 端仍选中、
    #   C 端仍不选中），只是不再依赖"读取输入措辞"的启发式。
    persona: mibao
    user_inputs:
      - "给赵凯创建一个订单，2699系列雪尼尔窗帘面料，10米，散剪2.8米门幅，2699-03暖米色，手机13800138000"
      - "不需要加工项"
      - "确认下单"
      - "确认"
    # 全局命名空间声明（issue #3781）：与同样争用该全局资源的用例自动互斥，
    # 消除「同栈并行用例互相写同一命名空间」造成的非确定性（真实 run 34856561459）。
    namespaces:
      - "customer_phone:13800138000"
      - "product_name:2699系列雪尼尔窗帘面料"

    expectations:
      - tool: product_detail
      - tool: interact
        args:
          component: choice
          multiSelect: true
    # ── 2026-09-24（issue #5247，用户裁定 2026-09-23「B 端米宝只读化」）──
    # `order_create` 已从 B 端全部 skill 解绑 ⇒ 本用例断言的「下单 confirm 前主动询问
    # 加工项」是**写链路**的一环，在 B 端不复存在，用例退役（条目不删除，理由见
    # skip_reason）；能力面改判到存活的只读路径 `product_detail` + `interact`（商品查询与
    # 交互卡仍是 B 端能力），行为面改判为「如实说明 + 引导去后台订单管理页面」
    # （见 data_checks）。逐条作废的原声明（原文留档见 merge_log）：
    # `expectations[order_create]`、`must_succeed[order_create]`、
    # `order_before["interact[choice:processing_items] before order_create"]`。
    # ── 效果层断言（issue #4093 的 OR-016 条目 → 跟踪单 #4110）──
    # 为什么必补：首跑指纹是 `no_success(order_create) || order_before_missing(interact[choice:processing_items])`，
    # 其中**前半（没成功）此前没有任何断言能判红** —— `expectations` 只证明 order_create
    # 「被调用过」（`check_expectation` 不读 `success`），工具返回 `success=false` 照样计分
    # 通过（「调用了 ≠ 成了」，#3778/#3361）。`data_checks` 那三条是**自然语义**、不计分。
    # ⇒ `must_succeed`（fail-closed：一次都没成功即判红）是这条指纹唯一的确定性下沉形态。
    # 可满足性（按 seed 真值核，**不是**"永远红"的空判据）：
    #   · 下单对象齐备 —— `mibao_eval_seed.sql`：prod_eval_2699（¥23.80）
    #     + 颜色 `2699-03暖米色` + `bulk_cut/2.8` 门幅 SKU（stock=500）；
    #   · 询问前提 = **店铺加工项目录非空**（#4371 解耦后不再依赖「商品绑了加工项」）：
    #     mibao seed 的 `processing_items` 种子（刺绣工艺 等）即该前提。
    #   · 该链路**历史真跑通过** —— `docs/design/agent-production-gap-analysis.md`
    #     「验证：**OR-016 3/3 通过**（去重 → 下单流程完整）」（同名商品去重后下单走通）。
    # `must_succeed[order_create]`（#4093/#4110 的效果层断言）已随 #5247 整块移除 ——
    # 断言对象不在 B 端工具集里，声明永不满足（原文留档见 merge_log）。
    data_checks:
      - "（退役，#5247）如实说明米宝只做数据查询与分析、**不提供经对话创建订单**，并引导去后台订单管理页面下单（引导语不得谎报能力 —— 能力文案判据见 MC-021）。改判前口径（留档，不再生效）—— 原三条的前提都是 B 端下单写链路：①「店铺加工项目录（processing_item_query）非空时，生成订单确认卡之前必须主动询问加工项（interact(choice, multiSelect=true) 展示，透传 pageMeta 支持翻页；目录为空则如实告知后继续）」②「用户选择加工项后，order_create 的 processing_info.processingItems 含 `{id, name, quantity, unit}`（#4882：`unitPrice` / `pricingMethod` / `subtotal` 三键已退场），加工数量 = 该行面料米数，processingFee 由**加工费组合**口径给出（金额 = 面料小计 + 加工费）」③「一次性提交『已选加工项：A、B』→ 解析全部名称，禁止只取第一个；用户说『不需要加工项』才跳过」"
    order_before:
      - "interact[choice:processing_items] before interact[confirm]"
    # `order_before["interact[choice:processing_items] before order_create"]` 已移除：后件是
    # 已从 B 端解绑的写工具 ⇒ 该时序断言永不满足（原文留档见 merge_log）。
    pre_clean:
      - type: product_dedupe
        product_keyword: "2699系列雪尼尔窗帘面料"
        price: 23.8
    # 前置自断言（§18.4，同 OR-009/OR-014/OR-015(已由 #4091 补)/OR-021 先例）：本用例按**名字**
    # 定位下单对象（「2699系列雪尼尔窗帘面料」），故「该名字在种子栈里唯一」是可判定的前置 ——
    # 别人造出同名副本时折成 `precondition_not_applied`，不再伪装成「agent 不会下单」。
    # 依据：`pre_clean.product_dedupe` 先于 capture 执行 ⇒ 捕获时恰为 1；OR-021 已声明**同一
    # source + 同一 expect**（同商品），本条声明形状与它逐字一致。
    precondition:
      - type: product_count_for_keyword
        source: "2699系列雪尼尔窗帘面料"
        expect: 1
    skip_reason: "[backend-contract] [#5247] B 端只读化（用户裁定 2026-09-23：B 端米宝只做数据查询与分析，创建/更新能力与对应 tools 全部从 B 端移除）⇒ 本用例断言的「下单 confirm 前主动询问加工项」（order_create）已从 B 端下线、不再绑定任何 B 端 skill。用例条目与退役理由保留（不删除）；断言面改判为只读路径（product_detail + interact）保留 + 如实说明「米宝不提供经对话创建订单」并引导去后台订单管理页面。"
    merge_log: "2026-09-08 新增（issue #3033 复盘 sess_7f27137647e14b1e）：A5 confirm 卡在加工项询问前弹出、金额 ¥238 不含加工费，用户质问后才补 A6；order.md 加工项段从被动式改主动式 + EXAMPLES 例 2 补加工项环节；2026-09-18 补前置自断言（#4082 的「改用例 PR」burn-down 硬门禁要求净缩 ≥1 条；先例 = #4091 给 OR-015 补的同款）：precondition[product_count_for_keyword「2699系列雪尼尔窗帘面料」expect=1]（按名定位下单对象，pre_clean 已按同关键词去重 ⇒ 捕获时恰为 1）；expectations/data_checks/order_before/pre_clean **原样未动**（未放宽、未删任何断言）；2026-09-18 下沉补齐（issue #4093 的 OR-016 条目 → 跟踪单 #4110，首跑指纹 `no_success(order_create) || order_before_missing(interact[choice:processing_items])`）：本单只补**效果层断言** `must_succeed[order_create]`（前半指纹此前无任何断言可判红）+ `persona: mibao`（清除 `CASE-TRUST-SINGLE-LEG-NO-PERSONA`；证据 = `eval_case_filter.is_customer_facing_case` docstring 点名本用例为店员代客下单语义 + `mibao_eval_seed.sql` 第 1 节「OR-016 点名」，且 C 端 seed 里该商品 0 件），precondition 系 #4082 批次已加、本次仅按 seed 真值复核 `expect=1`（mibao seed 该名商品恰 1 件）—— **断言只增不减**；2026-09-19（#4371 商品↔加工项解耦）：询问前提由「商品绑定加工项（product_detail 返回 processing_items 非空 / products.has_processing）」改为「**店铺加工项目录非空**」（加工项是店铺级目录，商品不再持有加工项）；同步改标题、`data_checks` 第 1 条、seed 可满足性注释（去掉 has_processing/加工项关联的引用）。`expectations` / `must_succeed` / `order_before` / `pre_clean` / `precondition` / `persona` **原样未动**（`interact[choice:processing_items]` 是 runner 的**卡片语义**判据 —— 卡仍要发，只是来源从商品改成目录）。 ｜ 2026-09-24（issue #5247，用户裁定 2026-09-23 B 端只读化）：order_create 从 B 端解绑 ⇒ 本用例退役（理由写在 skip_reason，条目不删除）；expectations 由 [product_detail, interact(choice,multiSelect), order_create] 改判为 [product_detail, interact(choice,multiSelect)]，must_succeed[order_create]（#4093/#4110 的效果层断言）同步移除（否则成为永不满足的悬空声明）；`order_before[\"interact[choice:processing_items] before order_create\"]` 一并移除（后件是已解绑的写工具），首条 `interact[choice:processing_items] before interact[confirm]` 两端都存活、原样保留；data_checks 三条与新事实冲突（前提都是 B 端下单写链路：确认卡之前的加工项询问 / order_create 的 processingItems 落参 / 加工项解析后跳过）⇒ 合并改判为一条「如实说明 + 引导后台」并逐条留档原文；persona / pre_clean / precondition / user_inputs / tags / title / truths_ref 均未动。"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_prompt_snapshots.py"
        - "backend/ai-agent-service/tests/test_order_create_processing_quantity.py"
      ci:
        - agent-eval.yml
      verifies: []

  - id: OR-017
    legacy_id: ""
    title: "C 端自助下单加工项闭环 - 必须查详情→主动询问→加工费落单（不凭列表错报无加工项）"
    domains:
      - order
      - chat
      - product
    tier: normal
    persona: xiaobu
    tags:
      - order_create
      - processing_item
      - guided_flow
      - xiaobu
    truths_ref:
      - order.create-flow
    # ── 前置自断言 + 自清理（issue #4416 的 burn-down 缴费；metric=entries ⇒ 必须整条销账）──
    # 本用例命中的两条存量违规是 CASE-TRUST-NO-SELF-CLEAN + CASE-TRUST-NO-PRECONDITION-ASSERTION。
    # `precondition[product_count_for_keyword]`：R1 按**商品名**定位下单目标，「该名字唯一」是它
    # 真正依赖且**只读**的前置（同名副本会让 agent 合理地要求澄清 ⇒ order_create 永不发生，
    # 而报告上只表现为 `unmatched expectation` = 看起来像 agent 不干活，归因全错 ——
    # PG-013 / CU-003 的形态）。口径与 `pre_clean` 的商品定位同一份（`_list_products_matching`），
    # 先例 = OR-014 / CH-019 / CR-001。
    # ⚠️ 有意**不**声明 `order_count_for_phone`：本用例自己就会建单 ⇒ 漂移判据（缺省
    # `max_growth: 0`）必然判红，那是「硬写一条注定红的守卫」。商品维只读 ⇒ 漂移恒为 0。
    # `namespaces`：护住该前置的基线/漂移两格，并与同手机号建单用例互斥。
    # 断言（user_inputs / expectations / must_succeed / amount_verify / order_before /
    # data_checks / forbidden_text）**原样未动、无放宽**。
    namespaces:
      - "product_name:夏日清风窗帘"
      - "customer_phone:13800138000"
    precondition:
      - type: product_count_for_keyword
        source: "夏日清风窗帘"
        expect: 1
    # ── 交互轮用协议轮（合作型用户：有什么卡就答什么卡）──
    # issue #3361 实证（run 34691137050 分片跑，OR-017）：静态脚本在第 3 轮发「确认」，
    # 而 agent 此时下发的是一张**加工项 choice 卡**（等顾客选加工项）——静态文本答不了卡
    # → agent 第 3 轮原样重发同一张卡 → 第 4 轮的验证码也答不了 → 轮数耗尽、
    # order_create 从未发生（用例判 red，但失败长相像"能力不行"，真因是用例喂不进卡）。
    # auto_select 回第一个选项（= 点首项，与前端点击协议一致）；
    # auto_respond 优先回答上一轮待答卡片（confirm→confirmValue / choice→首项 / form→按声明回填）。
    user_inputs:
      - "我想买夏日清风窗帘，米白色，3米，门幅2.8米散剪"
      - auto_respond:
          fallback: "我是张三，手机13800138000，地址杭州市西湖区文三路1号"
      - auto_select: true          # 答「请选择需要添加的加工项」多选卡：点首项（打孔）
      - auto_respond:
          fallback: "确认"          # 点确认卡（confirmValue）／无卡则文本确认
      - auto_respond:
          # 验证码轮：顾客这一刻就是"把收到的码发出去"，不是去点卡 —— 必须显式声明
          # prefer_text，否则此时若有卡在等，harness 会去答题卡、把验证码轮吃掉（issue #3367）
          fallback: "123456"        # 手机验证码（dev/CI 栈 SMS_BYPASS_CODE）
          prefer_text: true
      - auto_respond:
          fallback: "123456"
          # 验证码轮：顾客这一刻就是"把收到的码发出去"，不是去点卡 ——
          # 必须显式声明 prefer_text，否则若此时有卡在等（choice/confirm），
          # harness 会去答题卡、把验证码轮吃掉（issue #3367 实证：CH-010 首跑
          # R6/R7 两轮验证码都被卡吃掉 → order_create!缺少短信验证码 → 订单不落库）
          prefer_text: true
      # 轮数余量（issue #3365，与 CH-010 同源）：模型卡序不固定（先加工项卡还是先收货
      # 表单、是否重发确认卡），实测偶发"轮数用尽仍未 order_create"→ 判红但长相像
      # 能力问题。合作型用户会一直把卡答完，故尾部留 2 轮（答不到卡也无害）。
      - auto_respond:
          fallback: "确认"
      - auto_respond:
          fallback: "确认"
    expectations:
      - tool: product_search
      - tool: product_detail
      # ⚠️ 2026-09-19（#4371 商品↔加工项解耦）：**必须**先查店铺加工项目录再发多选卡 ——
      # `product_detail` 不再返回 `processing_items`（商品不持有加工项），
      # 加工项一律来自 `processing_item_query`（店铺级目录，不带商品分类参数）。
      # 补这条断言同时是 C 端覆盖门禁的要求：`processing_item_query` 此前在 C 端腿
      # 只由本用例的 `order_before`（`interact[choice:processing_items]`）间接锚定，
      # 解耦后该卡来源变了，工具本身必须有**显式**期望，否则判「零覆盖」。
      - tool: processing_item_query
      - tool: interact
        args:
          component: choice
          multiSelect: true
      - tool: order_create
    # 写工具成功断言（issue #3361）：CI 实证本用例 R7/R8 的 order_create 返回
    # tool_not_found（进了报价 skill，该 skill 工具集里没有 order_create）→ R11 转人工，
    # 订单没建出来而用例判 100%
    must_succeed:
      - tool: order_create
    # 金额正确性断言（issue #3365）：加工项场景总额 = Σ小计 + 加工费，且单价接地
    amount_verify:
      - tool: order_create
        product_name: "夏日清风窗帘"
        checks: [unit_price, subtotal, total]
    data_checks:
      - "product_search 列表数据不含 colorId/skus，必须先调 product_detail 取详情"
      - "加工项是**店铺级目录**（#4371 解耦：product_detail 不再返回 processing_items）⇒ 必须调 processing_item_query 拿目录，再在 confirm 之前用 interact(choice, multiSelect=true) 主动询问，列出名称与加工数量口径（**#4882 后加工项已无单价**，不得报「打孔 ¥8/米」这类逐项价）"
      - "所选加工项写入 order_create 的 processing_info.processingItems（`{id, name, quantity, unit}`；**#4882 已去掉 `unitPrice` / `pricingMethod` / `subtotal`**），加工数量 = 该行面料米数，加工费按**加工费组合**合计并计入订单金额"
      - "顾客说「不需要加工项」可跳过；加工项确实为空时才告知无可用加工项"
      - "C 端下单是**两步**：确认订单信息后还需手机验证码（order_create 的 sms_code，customer 角色必填）。用例必须提供验证码这一轮，否则 AI 停在第 5 步「请提供验证码」，order_create 永不发生（run 34622425044 实证：R7 顾客回「确认」后无任何工具调用）。dev/CI 栈已设 SMS_BYPASS_CODE=123456，此处用该码走真实校验分支。"
    # 确认卡先行（issue #3414）：C 端下单**必须先发 confirm 卡展示明细**、顾客确认后才写单
    # （prompt 第 4 步：validate_input → interact(confirm)）。此前只有 CH-010 断言了这条，
    # 其余下单用例不守 → 评测看不见"文本确认就直接写单"这条路径（验收 C-A1 抓到）。
    order_before:
      - "interact[choice:processing_items] before interact[confirm]"
      - "interact[choice:processing_items] before order_create"
      - "interact[confirm] before order_create"
    forbidden_text:
      - "暂未查询到可选加工项"
      - "无可用加工项"
      - "该商品无加工项"
    skip_reason: ""
    merge_log: "2026-09-12（issue #3361）交互轮改协议轮（auto_select 答加工项多选卡 + auto_respond 答表单/确认/验证码）：原静态「确认」喂不进加工项 choice 卡 → agent 重发同卡、轮数耗尽、order_create 未发生。2026-09-11 新增（issue #3270 C 端加工项能力补齐）：实测修复前 agent 只调 product_search 未调 product_detail，向顾客断言「这款商品暂未查询到可选加工项」，而该商品实际有 2 个加工项（打孔 ¥8/米、韩褶 ¥12/米）→ 顾客永远选不到加工项、加工费进不了单。修复后实测同输入已主动列出真实加工项与单价。forbidden_text 锁定「凭列表错报无加工项」这一确定性反模式。2026-09-19（#4371 商品↔加工项解耦）：加工项来源由 `product_detail.processing_items` 改为**店铺级目录** `processing_item_query`（商品不再持有加工项）⇒ `expectations` 补 `processing_item_query`（显式期望；同时满足 C 端工具覆盖门禁）、`data_checks` 第 1/2 条同步改判（去掉 processing_items 的引用）；`user_inputs` / `order_before` / `must_succeed` / `amount_verify` / `forbidden_text` 原样未动（卡仍要发，只是来源从商品改成目录）。2026-09-19（issue #4416 的 burn-down 缴费 —— 改用例文件的 PR 须净缩 ≥1 条存量违规，本用例命中的两条是 CASE-TRUST-NO-SELF-CLEAN + CASE-TRUST-NO-PRECONDITION-ASSERTION，metric=entries ⇒ 必须**整条**销账）：补 `namespaces[product_name:夏日清风窗帘, customer_phone:13800138000]` + `precondition[product_count_for_keyword: 夏日清风窗帘, expect: 1]` —— R1 按商品名定位下单目标，「该名字唯一」是它真正依赖且**只读**的前置（先例 = OR-014 / CH-019 / CR-001）。**有意不给 `order_count_for_phone`**：本用例自己会建单 ⇒ 漂移判据（缺省 `max_growth: 0`）必然判红，那是「硬写一条注定红的守卫」。断言（user_inputs / expectations / must_succeed / amount_verify / order_before / data_checks / forbidden_text）原样未动、无放宽。"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_customer_order_processing_item.py"
      ci:
        - xiaobu-acceptance.yml
      verifies: []
  - id: OR-018
    legacy_id: ""
    title: "C 端多商品一次下单 - 两个商品两套加工项，明细与金额逐行都对（能力上限）"
    domains:
      - order
      - chat
      - product
    tier: normal
    persona: xiaobu
    tags:
      - order_create
      - multi_item
      - processing_item
      - ceiling
      - xiaobu
    truths_ref:
      - order.create-flow
    # ── 能力上限用例（issue #3367）──
    # 为什么要它：现有 C 端下单用例都是**单商品**。真实顾客常一次买两款（两个窗户），
    # 而多商品把三件事同时压上来：① order_create 的 items 必须**多行**且每行自己的
    # 数量/单价；② 加工费按各自米数分别算；③ 总额 = Σ小计 + Σ加工费。
    # 单商品用例对这三件事**全无观测**（一行也能过）。判定用三层证据：
    #   must_succeed（调用真的成了）+ amount_verify（单价接地/小计自洽/总额自洽）
    #   + db_verify order_items（明细真的按行落库 —— 本次同时补的评测能力）
    # 期望金额（fixture 真值）：夏日清风 3m×158=474、遮光 2m×168=336、打孔 8/m → 24+16=40
    #   → 小计 810 + 加工费 40 = **850**
    user_inputs:
      - "我要买两款：夏日清风窗帘 米白色 3 米，遮光窗帘 米白 2 米，都要打孔加工"
      - auto_respond:
          fallback: "我是张三，手机13800138000，地址杭州市西湖区文三路1号"
      - auto_select: true
      - auto_respond:
          fallback: "确认"
      - auto_respond:
          fallback: "另一款也要打孔加工"
      - auto_respond:
          fallback: "确认下单"
      - auto_respond:
          fallback: "123456"        # 手机验证码（dev/CI 栈 SMS_BYPASS_CODE）
          prefer_text: true
      - auto_respond:
          fallback: "123456"
          prefer_text: true
      # 轮数余量：多商品流程比单品长（两次选品/两套加工项/一次确认），模型卡序不固定
      - auto_respond:
          fallback: "确认"
      - auto_respond:
          fallback: "确认"
    expectations:
      - tool: product_search
      - tool: product_detail
      - tool: interact
      - tool: order_create
    must_succeed:
      - tool: order_create
    # ── 断言可信度门禁 burn-down（issue #4406 顺带销账）──
    # OR-018 原记 `NO-SELF-CLEAN` + `NO-PRECONDITION-ASSERTION` 两个码：它是写类多轮用例，
    # 却没声明自清理（重试前置与首跑不等价）也没有可判定前置（前置不成立时红的表现像
    # 「agent 不干活」，归因全错）。两条都按既有先例补齐，**口径不新造**：
    #   · `namespaces` = 本用例依赖的**不可变键**（手机号 / 商品名）—— 并行互斥；
    #   · `precondition` = 基线计数（`order_count_for_phone` 先例 = OR-016；
    #     `product_count_for_keyword` 先例 = OR-016 / OR-017）。
    # ⚠️ 值必须**带引号**：不带引号会被 YAML 读成 `{'customer_phone': None}`（字典），
    # 前缀分类守卫（`test_case_seed_truth.py::test_every_namespace_prefix_is_classified`）
    # 会把它判成「未分类前缀」而报红 —— 本文件其余用例一律是 `"键:值"` 字符串形态。
    # 确认卡先行（issue #3414）：C 端下单**必须先发 confirm 卡展示明细**、顾客确认后才写单
    # （prompt 第 4 步：validate_input → interact(confirm)）。此前只有 CH-010 断言了这条，
    # 其余下单用例不守 → 评测看不见"文本确认就直接写单"这条路径（验收 C-A1 抓到）。
    order_before:
      - "interact[confirm] before order_create"
    amount_verify:
      - tool: order_create
        product_name: "夏日清风窗帘"
        checks: [unit_price, subtotal, total]
      - tool: order_create
        product_name: "遮光窗帘"
        checks: [unit_price]
    db_verify:
      - fetch: order_items
        source: order_create
        expect_products: ["夏日清风窗帘", "遮光窗帘"]
        expect_quantities:
          夏日清风窗帘: 3
          遮光窗帘: 2
    # ── 前置自断言 + 自清理（issue #4421 的 burn-down 缴费；metric=entries ⇒ 必须整条销账）──
    # 本用例命中的两条存量违规是 CASE-TRUST-NO-SELF-CLEAN + CASE-TRUST-NO-PRECONDITION-ASSERTION。
    # `precondition[product_count_for_keyword]`：多商品下单按**商品名**定位两行明细，「每个名字唯一」
    # 是它真正依赖且**只读**的前置（同名副本会让 agent 合理地要求澄清 ⇒ order_create 永不发生，
    # 报告上只表现为 `unmatched expectation` = 看起来像 agent 不干活，归因全错 —— PG-013 / CU-003 的形态）。
    # 口径与 `pre_clean` 的商品定位同一份（`_list_products_matching`），先例 = OR-014 / OR-017 / CH-019。
    # ⚠️ 有意**不**声明 `order_count_for_phone`：本用例自己就会建单 ⇒ 漂移判据（缺省 `max_growth: 0`）
    # 必然判红，那是「硬写一条注定红的守卫」。商品维只读 ⇒ 漂移恒为 0。
    # 断言（user_inputs / expectations / must_succeed / amount_verify / db_verify / order_before /
    # data_checks）**原样未动、无放宽**。
    namespaces:
      - "product_name:夏日清风窗帘"
      - "product_name:遮光窗帘"
      - "customer_phone:13800138000"
    precondition:
      - type: product_count_for_keyword
        source: "夏日清风窗帘"
        expect: 1
      - type: product_count_for_keyword
        source: "遮光窗帘"
        expect: 1
    data_checks:
      - "多商品下单必须一次 order_create 带多行 items（每行自己的数量/单价/加工项），不得只落一款"
      - "加工费按各自米数分别计算（3 米→24、2 米→16），总额 = Σ小计 810 + Σ加工费 40 = 850"
      - "两款商品的单价都必须来自商品库（158/168），不得凭记忆报价"
    skip_reason: ""
    merge_log: "2026-09-13 新增（issue #3367）：C 端能力上限用例（多商品/多加工项/逐行金额）。2026-09-19（issue #4421 的 burn-down 缴费 —— 改用例文件的 PR 须净缩 ≥1 条存量违规，本用例命中的两条是 CASE-TRUST-NO-SELF-CLEAN + CASE-TRUST-NO-PRECONDITION-ASSERTION，metric=entries ⇒ 必须**整条**销账）：补 `namespaces[product_name:夏日清风窗帘, product_name:遮光窗帘, customer_phone:13800138000]` + `precondition[product_count_for_keyword × 2, expect: 1]` —— 多商品下单按商品名定位两行明细，「每个名字唯一」是它真正依赖且只读的前置（先例 = OR-014 / OR-017 / CH-019）。**有意不给 `order_count_for_phone`**：本用例自己会建单 ⇒ 漂移判据（缺省 `max_growth: 0`）必然判红。断言（user_inputs / expectations / must_succeed / amount_verify / db_verify / order_before / data_checks）原样未动、无放宽。"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_acceptance_case_checks.py"
      ci:
        - xiaobu-acceptance.yml
      verifies: []
  - id: OR-019
    legacy_id: ""
    title: "C 端下单中途改数量 - 以最新数量为准，落库数量与金额都得跟着改（能力上限）"
    domains:
      - order
      - chat
      - product
    tier: normal
    persona: xiaobu
    tags:
      - order_create
      - correction
      - multi_turn
      - ceiling
      - xiaobu
    truths_ref:
      - order.create-flow
      - ai-chat.confirm-required
    # ── 能力上限用例（issue #3367）──
    # 为什么要有它：真实顾客**边聊边改**（先说 3 米，看到确认卡又改 4 米）。
    # 这类"状态更新"是流程型 Agent 最容易出错的地方，而现有用例全是"一次说清、不再改"。
    # 判定必须咬住**最新数量**：
    #   · amount_verify 只能证明"传参自洽"（qty=3 时 504=3×168 同样自洽）——**抓不到用旧值**；
    #   · 真正能抓的是 db_verify 的 expect_quantities: 4（落库明细必须是最新数量）。
    # 期望金额（fixture 真值）：168×4 + 8×4(打孔) = 672 + 32 = **704**
    user_inputs:
      - "帮我下单，遮光窗帘 3 米，要打孔加工"
      - auto_respond:
          fallback: "米白"
      - auto_respond:
          fallback: "等等，数量改成 4 米"     # 中途纠错：必须以最新数量为准
          prefer_text: true
      - auto_respond:
          fallback: "确认下单"
      - auto_respond:
          fallback: "确认"
      - auto_respond:
          fallback: "123456"        # 手机验证码（dev/CI 栈 SMS_BYPASS_CODE）
          prefer_text: true
      - auto_respond:
          fallback: "123456"
          prefer_text: true
      # 轮数余量：模型可能因改数量重新查详情/重发确认卡
      - auto_respond:
          fallback: "确认"
      - auto_respond:
          fallback: "确认"
    expectations:
      - tool: product_search
      - tool: product_detail
      - tool: order_create
    must_succeed:
      - tool: order_create
    # 确认卡先行（issue #3414）：C 端下单**必须先发 confirm 卡展示明细**、顾客确认后才写单
    # （prompt 第 4 步：validate_input → interact(confirm)）。此前只有 CH-010 断言了这条，
    # 其余下单用例不守 → 评测看不见"文本确认就直接写单"这条路径（验收 C-A1 抓到）。
    order_before:
      - "interact[confirm] before order_create"
    amount_verify:
      - tool: order_create
        product_name: "遮光窗帘"
        checks: [unit_price, subtotal, total]
    db_verify:
      - fetch: order_items
        source: order_create
        expect_products: ["遮光窗帘"]
        expect_quantities:
          遮光窗帘: 4
    # ── 前置自断言 + 自清理（issue #4421 的 burn-down 缴费；metric=entries ⇒ 必须整条销账）──
    # 同 OR-018 口径：`precondition[product_count_for_keyword]` 是本用例真正依赖且**只读**的前置
    # （「遮光窗帘」该名字唯一 —— 同名副本会让 agent 合理地要求澄清 ⇒ order_create 永不发生，
    # 报告上只表现为 `unmatched expectation` = 看起来像 agent 不干活）。先例 = OR-014 / OR-017 / CH-019。
    # ⚠️ 有意**不**声明 `order_count_for_phone`：本用例自己就会建单 ⇒ 漂移判据（缺省 `max_growth: 0`）
    # 必然判红。断言（user_inputs / expectations / must_succeed / amount_verify / db_verify /
    # order_before / data_checks）**原样未动、无放宽**。
    namespaces:
      - "product_name:遮光窗帘"
      - "customer_phone:13800138000"
    precondition:
      - type: product_count_for_keyword
        source: "遮光窗帘"
        expect: 1
    data_checks:
      - "顾客中途改数量后，确认卡与订单明细都必须反映**最新**数量（4 米），不得沿用旧值 3 米"
      - "金额按最新数量重算：168×4 + 打孔 8×4 = 704"
    skip_reason: ""
    merge_log: "2026-09-13 新增（issue #3367）：C 端能力上限用例（多轮纠错/状态更新）。2026-09-19（issue #4421 的 burn-down 缴费 —— 改用例文件的 PR 须净缩 ≥1 条存量违规，本用例命中的两条是 CASE-TRUST-NO-SELF-CLEAN + CASE-TRUST-NO-PRECONDITION-ASSERTION，metric=entries ⇒ 必须**整条**销账）：补 `namespaces[product_name:遮光窗帘, customer_phone:13800138000]` + `precondition[product_count_for_keyword: 遮光窗帘, expect: 1]`（先例 = OR-014 / OR-017 / CH-019）。**有意不给 `order_count_for_phone`**：本用例自己会建单 ⇒ 漂移判据（缺省 `max_growth: 0`）必然判红。断言原样未动、无放宽。"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_acceptance_case_checks.py"
      ci:
        - xiaobu-acceptance.yml
      verifies: []
  - id: OR-020
    legacy_id: ""
    title: "C 端下单中途打岔后回到原流程 - 草稿不丢（数量/加工项必须延续）"
    domains:
      - order
      - chat
      - product
    tier: normal
    persona: xiaobu
    tags:
      - order_create
      - interruption
      - context_retention
      - ceiling
      - xiaobu
    truths_ref:
      - order.create-flow
    # ── 能力上限用例（issue #3379 目标：提高"智力"）──
    # 为什么要有它：真实顾客**边聊边打岔**（下单到一半问"多久发货？"再回来继续）。
    # 这类"草稿保持 + 流程恢复"是流程型 Agent 最容易丢状态的地方，而现有用例
    # 要么一次说清（OR-014/017/018/019），要么打岔后并不回到写流程（C-A2 验收剧本）。
    # 判定必须咬住**打岔前已确认的内容**：
    #   · `db_verify` 明细数量 = 3（草稿里的数量若丢失/被重置，这里就露）；
    #   · `amount_verify` 总额 = 168×3 + 打孔 8×3 = **528**（加工项若丢，总额会变 504）。
    # 即：**打断后恢复的流程必须带着原草稿走完**，否则金额/明细对不上。
    user_inputs:
      - "帮我下单，遮光窗帘 3 米，要打孔加工"
      - auto_respond:
          fallback: "米白"
      - auto_respond:
          fallback: "打孔"
      # 打岔轮：必须是**文本**送达（prefer_text），否则会被当时待答的卡片吃掉，
      # 那就测不到"打岔"这件事本身了（issue #3367 的协议轮教训）。
      - auto_respond:
          fallback: "对了，你们一般多久能发货呀？"
          prefer_text: true
      - auto_respond:
          fallback: "好的，那我们继续把刚才那单下了吧"
      - auto_respond:
          fallback: "确认下单"
      - auto_respond:
          fallback: "123456"      # 手机验证码（dev/CI 栈 SMS_BYPASS_CODE）
          prefer_text: true
      - auto_respond:
          fallback: "123456"
          prefer_text: true
      # 轮数余量：打岔后模型可能重新查详情/重发确认卡
      - auto_respond:
          fallback: "确认"
      - auto_respond:
          fallback: "确认"
    # ── 前置自断言 + 自清理（issue #4406 的 burn-down 缴费；metric=entries ⇒ 必须**整条**销账）──
    # 本用例命中的两条存量违规 = CASE-TRUST-NO-SELF-CLEAN + CASE-TRUST-NO-PRECONDITION-ASSERTION。
    # 口径与 OR-018 / OR-019（#4421/#4435 已落地）**逐字同源**，未新造：
    # 多轮下单用例按**商品名**定位明细行，「该名字在种子栈里唯一」是它真正依赖且**只读**的前置；
    # 同名副本会让 agent 合理地要求澄清 ⇒ order_create 永不发生，报告上只表现为
    # `unmatched expectation` = 看起来像 agent 不干活（PG-013 / CU-003 的形态）。
    # ⚠️ 有意**不**声明 `order_count_for_phone`：本用例自己就会建单 ⇒ 漂移判据（缺省
    # `max_growth: 0`）必然判红（硬写一条注定红的守卫）。商品维只读 ⇒ 漂移恒为 0。
    # 断言（user_inputs / expectations / must_succeed / amount_verify / db_verify / order_before）
    # **原样未动、无放宽**。
    namespaces:
      - "product_name:遮光窗帘"
      - "customer_phone:13800138000"
    precondition:
      - type: product_count_for_keyword
        source: "遮光窗帘"
        expect: 1
    expectations:
      - tool: product_search
      - tool: product_detail
      - tool: order_create
    must_succeed:
      - tool: order_create
    # 确认卡先行（issue #3414）：C 端下单**必须先发 confirm 卡展示明细**、顾客确认后才写单
    # （prompt 第 4 步：validate_input → interact(confirm)）。此前只有 CH-010 断言了这条，
    # 其余下单用例不守 → 评测看不见"文本确认就直接写单"这条路径（验收 C-A1 抓到）。
    order_before:
      - "interact[confirm] before order_create"
    amount_verify:
      - tool: order_create
        product_name: "遮光窗帘"
        checks: [unit_price, subtotal, total]
    db_verify:
      - fetch: order_items
        source: order_create
        expect_products: ["遮光窗帘"]
        expect_quantities:
          遮光窗帘: 3
    data_checks:
      - "打岔（问发货时效）后必须能回到原下单流程，且**草稿不丢**：数量 3 米、加工项打孔都延续"
      - "恢复后的订单金额仍为 168×3 + 打孔 8×3 = 528；若加工项丢失会变成 504（金额即证据）"
    skip_reason: ""
    merge_log: "2026-09-13 新增（issue #3379）：能力上限用例（打岔后草稿保持 + 流程恢复）"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_acceptance_case_checks.py"
      ci:
        - xiaobu-acceptance.yml
      verifies: []

  - id: OR-021
    legacy_id: ""
    title: "C 端缺收货信息时不得自我否定能力 - 必须查/问后继续下单（能力下限）"
    domains:
      - order
      - chat
      - product
    tier: normal
    persona: xiaobu
    tags:
      - order_create
      - honesty
      - capability
      - xiaobu
    truths_ref:
      - order.create-flow
      - ai-chat.confirm-required
    # ── 能力下限用例（issue #3389，验收剧本 C-A1 实证）──
    # 实证（run 34743802010）：顾客给齐商品/颜色/门幅/数量/加工项后说「确认下单」，
    # 小布连续 4 轮回「**下单这个操作小布这边没法直接帮您提交呢**，需要您在小程序里点一下"立即购买"」，
    # R9 甚至 `human_handoff(reason="顾客需协助下单（智能客服无法代为提交订单）")`
    # （**该工具已于 2026-09-19 按用户裁定退场/模型不可达**；本行是历史实证留档 ——
    #  当时正是"拒绝能力 + 转人工"的组合把转化路径掐断）
    # —— 整场 9 轮**从未调用 `order_create`**，而它就是这个 skill 自己的写工具。
    # 缺的其实是**收货信息**（姓名/手机号/地址）：正确动作是 `customer_address_query` 查历史地址，
    # 没有再发 form 卡或直接问 —— 而不是宣布"我做不到"并把顾客推去小程序。
    # 本用例顾客只给商品不给收货信息，专门压这条路径。
    user_inputs:
      - "我想买遮光窗帘，米白 3 米，要打孔加工"
      - auto_respond:
          fallback: "米白"
      # ⚠️ 这里**刻意不再重报数量**（issue #3395 复盘）：数量已在 R1 给过，
      # 再答一次「3 米」会被模型读成"再加 3 米" → 落库 ×6（实测 run 34750771576）。
      # 真实顾客回答别的问题时也不会重报数量；改数量由 OR-019 专项覆盖。
      # ── 协作型顾客的"统一一轮"（issue #3430）──
      # 旧写法是固定轮次表（答卡 ×2 → 验证码 ×2 → 确认 ×2），但**实际卡片序列随模型而变**：
      # 实测 run 34767204074 的序列是 `form(R3) → choice(R4) → confirm(R7)`，于是验证码轮
      # 落在「加工项多选卡」上 → 顾客答非所问 → 卡没人答、流程不前进 → 轮数耗尽时确认卡
      # 刚发出来就没人答它 → `order_create` 从未发生（0/1，纯空转）。
      # `repeat_until` 把验收剧本里已验证的语义搬进来：**有卡答卡 → 被问验证码就供码 → 否则说确认**，
      # 直到 `order_create` 成功（被门禁挡回不算成功，故不会提前停）。
      - repeat_until:
          tool_called: order_create
          max: 8
        code: "123456"
        fallback: "确认下单"
        form_values:
          customer_name: "张三"
          customer_phone: "13800138000"
          customer_address: "浙江省杭州市西湖区文三路1号1幢101室"
          color: "米白"
          colorName: "米白"
    # ── burn-down 缴费（issue #4490，2026-09-19）────────────────────────────────
    # 本 PR 改了 `.github/cases/**` ⇒ 按 `case-trust-baseline.json` 的 `burn_down`
    # （`per_pr_min: 1` / `metric: entries` ⇒ **整条销账**）必须净缩 ≥1 条存量违规。
    # 本条命中的两条存量违规 = `CASE-TRUST-NO-PRECONDITION-ASSERTION` +
    # `CASE-TRUST-NO-SELF-CLEAN`，一次补齐（先例 = OR-012 / CH-019 / CR-001 / C003，同款治法）：
    # · R1「我想买遮光窗帘…」按**商品名**定位下单对象 ⇒「该名字在栈里唯一」是本用例真正依赖、
    #   且**只读**的前置（同名副本 >1 时 agent 会正确地反问要哪一件，而本用例的轮次表会把这条
    #   合理行为判成 `order_create` 从未发生 = 归因全错）；
    # · `namespaces` 护住该前置的基线/漂移两格，并与同手机号的建单用例互斥（自清理的弱证据形态）。
    # ⚠️ 刻意**不**声明 `order_count_for_phone: 13800138000` —— 本用例自己就会给该号码建单，
    # `after - before = +1 > max_growth(0)` ⇒ 漂移判据必然判红（「硬写一条注定红的守卫」）。
    # **断言面（user_inputs / expectations / must_succeed / db_verify / order_before /
    # forbidden_text / data_checks）一字未动、无放宽。**
    namespaces:
      - "product_name:遮光窗帘"
      - "customer_phone:13800138000"
    precondition:
      - type: product_count_for_keyword
        source: "遮光窗帘"
        expect: 1
    expectations:
      - tool: product_search
      - tool: product_detail
      - tool: order_create
    must_succeed:
      - tool: order_create
    # 确认卡先行（issue #3414）：C 端下单**必须先发 confirm 卡展示明细**、顾客确认后才写单
    # （prompt 第 4 步：validate_input → interact(confirm)）。此前只有 CH-010 断言了这条，
    # 其余下单用例不守 → 评测看不见"文本确认就直接写单"这条路径（验收 C-A1 抓到）。
    order_before:
      - "interact[confirm] before order_create"
    # 能力误宣反模式词（issue #3389）：命中即判失败 —— 这是"能做却说做不了"，
    # 顾客明明要买却被告知系统不行，比答错更伤（C-A1 原文即此形）。
    forbidden_text:
      - "没法直接帮您提交"
      - "没法帮您提交订单"
      - "无法代为提交"
      # **权限类**能力误宣（issue #3421，验收 C-A1 实证）：`order_create` 就是小布自己的写工具，
      # 以"没权限"为由把顾客推给人工 = 转化路径被自己掐断，比答错更伤。
      - "无下单权限"
      - "没有下单权限"
      - "无法帮您完成下单"
      - "无法帮您完成订单"
      - "无法帮您提交订单"
      - "小程序里点"
      - "小布没法提交"
      - "无法代为下单"
    amount_verify:
      - tool: order_create
        product_name: "遮光窗帘"
        checks: [unit_price, subtotal, total]
    db_verify:
      - fetch: order_items
        source: order_create
        expect_products: ["遮光窗帘"]
        expect_quantities:
          遮光窗帘: 3
      - fetch: order_phone
        source: order_create
        expect_phone: "13800138000"
    data_checks:
      - "缺收货信息时先 customer_address_query 查历史地址，没有再发 form 卡/直接问 —— 不得自我否定能力、不得推去小程序"
      - "任何一轮回复都不得出现「我无法提交订单 / 没法帮您下单」这类能力误宣"
      - "参数补齐后必须真实落单（order_create 成功 + 明细/数量/手机号正确）"
    skip_reason: ""
    merge_log: "2026-09-13 新增（issue #3389）：能力下限用例（缺信息时收集而非拒单 + 能力误宣反模式）；2026-09-19（issue #4490 的 burn-down 缴费，metric=entries ⇒ 整条销账）：补 precondition[product_count_for_keyword: 遮光窗帘, expect: 1] + namespaces[product_name:遮光窗帘, customer_phone:13800138000]（R1 按商品名下单 ⇒ 名字唯一是本用例真正依赖且只读的前置；刻意不声明 order_count_for_phone —— 本用例自己建单，漂移判据必然判红）。断言面（user_inputs / expectations / must_succeed / db_verify / order_before / forbidden_text / data_checks）原样未动、无放宽。"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_acceptance_case_checks.py"
        - "backend/ai-agent-service/tests/test_graph_skills.py"
      ci:
        - xiaobu-acceptance.yml
      verifies: []

