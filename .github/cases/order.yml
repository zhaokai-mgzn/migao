    truths_ref:
      - order.statistics
    user_inputs:
      - "订单统计数据"
    expectations:
      - tool: order_query
        args:
          action: statistics
    data_checks:
      - "各状态汇总非空"
    skip_reason: ""
    merge_log: "verification 1.3 独有"
    traces:
      tests:
