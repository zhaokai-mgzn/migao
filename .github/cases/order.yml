  - id: OR-037
    legacy_id: ""
    title: "行话下单落内部值 - 顾客说「韩式褶」「纳米圈」⇒ craft 落「韩褶」「打孔」（不是原话）"
    domains:
      - order
      - chat
    tier: normal
    # 单端标注：期望工具 order_create ⊆ 小布工具集 ⇒ 只能跑小布腿（同 OR-014 口径）。
    persona: xiaobu
    tags:
      - order_create
      - craft_spec
      - glossary
      - industry_terms
