    title: "算料公式按加工项派生的工艺推导 - 勾「韩褶」⇒韩褶⇒韩褶公式（褶数法）/ 勾「打孔」⇒倍数法（默认 2 倍）+ 逐片口径（每片×开数）+ 用料向上进位到 0.1"
