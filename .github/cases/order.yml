      - "「挡住」的机器证据：db_verify[order_phone] 取**首个成功的 order_create** 的落库号码 —— 若用非法号建了单，首个成功订单号码就对不上 → 红"
      - "改正后（13800138000）必须继续走完下单闭环：不得因一次校验失败就自我否定、或要求顾客从头再来"
      - "落库收货人/地址与顾客所给一致（预填真值，掩码/改写会静默寄错，issue #3379/#3386）"
