  - id: OR-014
    legacy_id: ""
    title: "下单加工项数量规则 - 按计价方式，无每米数量密度推导"
    domains:
      - order
      - chat
    tier: normal
    tags:
      - order_create
      - processing_item
      - pricing
    truths_ref:
      - order.states
      - order.create-flow
      - processing-manage.crud
    # ── 交互轮用 auto_respond（合作型用户：**有什么卡就答什么卡**）──
    # 为什么不用静态文本：agent 的提问顺序/卡片类型随模型而变（实测第 2 轮先发
    # 「收货信息 & 颜色」表单、第 3 轮才发加工项 choice 卡）。静态脚本对不上就卡死：
    # run 34627856207 第 4–8 轮每轮只重复 customer_address_query，order_create 永不发生。
    # auto_respond 轮优先回答上一轮卡片（confirm→confirmValue / choice→首项 /
    # form→按声明值回填），无卡时用 fallback 文本兜底 → 用例不再依赖特定提问顺序。
    user_inputs:
      - "帮我下单，遮光窗帘 3 米，要打孔加工"
      - auto_respond:
          fallback: "选有打孔的那件"
      - auto_respond:
          fallback: "不需要其他加工项"
      - auto_respond:
          fallback: "确认下单"
          form_values:
            customer_name: "张三"
            customer_phone: "13800138000"
            customer_address: "浙江省杭州市西湖区文三路1号1幢101室"
            color: "米白"
            colorName: "米白"
      - auto_respond:
          fallback: "确认"
          form_values:
            customer_name: "张三"
            customer_phone: "13800138000"
            customer_address: "浙江省杭州市西湖区文三路1号1幢101室"
            color: "米白"
            colorName: "米白"
      - auto_respond:
          fallback: "123456"
      - auto_respond:
          fallback: "确认"
      - auto_respond:
          fallback: "确认"
      - auto_respond:
          fallback: "123456"
      - auto_respond:
          fallback: "123456"
      - auto_respond:
          fallback: "123456"
    # 断言**业务结果**而不是模型调了哪个工具（issue #3365）：
    # 本用例的历史失败形态是"没查商品就凭记忆下单（¥95.4 vs 真实 ¥168/米）"，
    # 而"有没有查商品"只是代理指标 —— 现在接地由**代码保证**（下单接地闸门 +
    # 接地自动驾驶），真正该判的是"订单金额是否接地/自洽"，即下面的 amount_verify。
    expectations:
      - tool: order_create
    # 写工具成功断言（issue #3361）：本用例 R4 的 order_create 被 confirm 门禁拦
    # （confirmation_required）后流程结束，订单没建出来 —— 期望含 order_create
    # 只能证明"模型想下单"，证明不了"订单成交"
    must_succeed:
      - tool: order_create
    # 金额正确性断言（issue #3365）：本用例历史实证"没查商品就报 ¥95.4"（真实 ¥168/米）
    amount_verify:
      - tool: order_create
        product_name: "遮光窗帘"
        checks: [unit_price, subtotal, total]
    data_checks:
