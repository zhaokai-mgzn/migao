      - "**红证（注入式，写在测试类 javadoc）**：① `toSnapshotKeys` 的 `pleat_count` → `pleatCount` ⇒ 判据 3 红；② `materialize` 的 `isShaped` 行删掉 ⇒ 判据 1 红；③ `bool` 的 `\"是\"` 分支补上（凭字面猜中文）⇒ 判据 4 红。"
