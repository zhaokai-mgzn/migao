    title: "取消订单 - 传订单号 ORD-xxx"
    domains:
      - order
    tier: adversarial
    tags:
      - id_resolve
      - adversarial
      - destructive
    truths_ref:
      - order.states
      - order.flow
      - order.pay-side-effects
      - order.cancel-side-effects
      - order.refund-side-effects
      - order.no-format
    user_inputs:
      - "取消订单 ORD-20260701-0001，原因是客户不要了"
    expectations:
      - tool: order_manage
        args:
          action: cancel
          order_id: "ORD-20260701-0001"
    data_checks:
      - "success=true"
      - "confirm 卡片先于写操作（destructive 约定，真值在 ai-chat.tool-classes）"
    skip_reason: ""
    merge_log: "eval O005 + verification 1.7（同义，取 eval 的 ORD-xxx 格式版）"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_tools_order_manage.py"
      ci:
        - agent-eval.yml
      verifies: []

  # ── 创建订单（两条流程 + 一条简化）──
  - id: OR-008
    legacy_id: O003
    title: "创建订单 - 先查商品 SKU 再下单"
    domains:
      - order
      - product
    tier: normal
    tags:
      - create
      - sku_select
      - full_flow
    truths_ref:
      - order.states
      - order.create-flow
      - product-sku-stock.aggregate
    user_inputs:
      - "帮我下个订单，客户张三，手机13800138000"
      - "要遮光窗帘，2件"
      - "选白色的，散剪，2.8米门幅"
      - "确认下单"
    expectations:
      - tool: product_detail
        args:
          product_id: 遮光窗帘
      - tool: order_create
        args:
          items:
            - sellingMethod: bulk_cut
              doorWidth: "2.8米"
    data_checks:
      - "data.order_id.length > 0"
    skip_reason: ""
    merge_log: "eval O003 独有（SKU 先查流程）；verification 1.8 的简化版见 OR-010"
    traces:
      tests:
        - "backend/ai-agent-service/tests/manual/mibao_scenarios.py"
      ci:
        - agent-eval.yml
      verifies: []

  - id: OR-009
    legacy_id: M005
    title: "下单全流程 - 选品→选SKU→确认数量→下单"
    domains:
      - order
      - product
    tier: normal
    tags:
      - multi_turn
      - order_create
      - sku_select
      - full_flow
    truths_ref:
      - order.states
      - order.create-flow
      - product-sku-stock.aggregate
    user_inputs:
      - "我要给张三下单，手机13800138000"
      - "要遮光窗帘"
      - "选白色的，散剪，2.8米门幅"
      - "数量 3 件"
      - "不添加加工项，确认下单"
      - "确认创建订单"
    expectations:
      - tool: product_detail
      - tool: interact
        args:
          component: choice
      - tool: order_create
    required_args:
      - tool: order_create
        action: create
        fields:
          - items[].processing_info.sellingMethod
          - items[].processing_info.doorWidth
          - items[].processing_info.colorName
    data_checks:
      - "order_create items[0].sellingMethod = bulk_cut"
      - "order_create items[0].doorWidth = 2.8米"
      - "order_create items[0].colorName 包含 '白色'"
    skip_reason: ""
    merge_log: "eval M005 独有（多轮引导细节），与 OR-008 互补不合并；2026-09-09 校准：① interact 组件期望 sku_table 全库不存在（agent 从始发 choice），改为 choice；② 补「跳过加工项→点确认卡」两轮（真实流程需 7 轮，原 5 轮预设过严，agent 正确要求点卡不默认跳过）"
    traces:
      tests:
        - "backend/ai-agent-service/tests/manual/mibao_scenarios.py"
      ci:
        - agent-eval.yml
      verifies: []

  - id: OR-010
    legacy_id: "1.8"
    title: "创建订单 - 汇总确认简化流程"
    domains:
      - order
    tier: normal
    tags:
      - create
      - confirm
    truths_ref:
      - order.states
      - order.create-flow
    user_inputs:
      - "创建订单：张三 13812345678，杭州西湖区文三路1号，米白色遮光窗帘 2米"
      - "选散剪售卖，2.8米门幅"
      - "不添加加工项，确认下单"
      - "确认下单"
    expectations:
      - tool: validate_input
      - tool: order_create
    data_checks:
      - "下单全流程不得向顾客索要单价/金额——价格取自商品数据/算料结果（实测反复要价导致下单卡死 + 本用例评估不稳）"
    want_text:
      - "订单号"
    skip_reason: ""
    merge_log: "verification 1.8 独有（smoke 简化版，与 OR-008/OR-009 的细粒度版互补）；2026-08-14 按 EXAMPLES-order.md 例2 校准为多轮（完整收货信息→选1→确认），单轮直下单与设计澄清流程不符；2026-09-02 补价格铁律；2026-09-04 修复 choice 卡片消费协议不匹配（审计 #2818 Agent Eval 失败根因）：原「选1」为自然语言序号，LLM 无法关联 interact(choice) 选项导致反复 product_detail 追问、永不进入 validate_input/order_create；改为显式售卖方式描述（与 OR-008/009 一致），且「2件」与商品按米计价（¥99/米）矛盾改为「2米」，实测全流程通过；2026-09-09 校准：R3「确认下单」改「不添加加工项，确认下单」+ 补第4轮「确认下单」——agent 把加工项询问当强制环节，用户说「确认下单」仍发加工项卡（probe 实证），需明确跳过加工项才推进（与 OR-009 校准一致）"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_tools_order_manage.py"
      ci:
        - agent-eval.yml
      verifies: []

  - id: OR-011
    legacy_id: ""
    title: "AI 下单闭环 - 算料报价→确认→SMS→订单创建"
    domains:
      - order
    tier: normal
    tags:
      - order_create
      - smoke
    truths_ref:
      - order.flow
    user_inputs:
      - "创建订单：张三 13800138000，杭州西湖区，米白色遮光窗帘 2米"
      - "散剪，2.8米门幅"
      - "不添加加工项，确认下单"
      - "确认下单"
    expectations:
      - tool: order_create
    data_checks:
      - "order_create 返回订单号"
      - "订单必须携带有效收件人手机号：agent 路径必填+11位格式校验；表单 API @Pattern 同规则（非法手机号 → 400 拒绝创建）——手机号是客户绑定归属回填与物流查询（顺丰等需尾号）的关键信息，禁止缺失/非法"
    skip_reason: ""
    merge_log: "POC 下单闭环集成测试新增；2026-09-02 补订单手机号完整性约束；2026-09-09 校准：原 user_inputs 为描述性文字「用户算料报价后确认下单…」非用户对话，agent 无法触发下单（tools=[]）；改为真实下单对话（选品→规格→跳过加工项→确认）"
    traces:
      tests:
        - "backend/admin-api/src/test/java/com/migao/admin/controller/OrderControllerTest.java"
      ci:
        - ai-agent-tests.yml
      verifies: []

  - id: OR-012
    legacy_id: ""
    title: "C 端物流查询 - 仅限本人已发货订单 + 拒绝快递单号直查"
    domains:
      - order
      - chat
      - defense
    tier: normal
    persona: xiaobu
    tags:
      - query
      - logistics
      - data_safety
    truths_ref:
      - order.logistics
    user_inputs:
      - "帮我查一下物流"
      - "查一下单号 SF1234567890 的物流"
    expectations:
      - tool: customer_logistics_track
    data_checks:
      - "customer_logistics_track 无 tracking_number 参数；无论 LLM 通过什么参数传快递单号都必须拒绝（引导提供订单）"
      - "只查当前用户已发货(在途)订单的物流：/orders/mine?status=shipped 后端强制按用户过滤，返回每笔订单的运单号/快递公司/轨迹"
      - "传其他用户/非在途订单号 → 拒绝；无在途订单 → 提示暂无"
      - "customer_logistics_track 命中 logistics 卡片（logistics_list 非空）"
    skip_reason: ""
    merge_log: "2026-09-01 新增：C 端查物流入口（转人工→查物流）后端能力，与 B 端 logistics_track 物理隔离"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_tools_customer_logistics_track.py"
        - "backend/ai-agent-service/tests/test_chat.py"
        - "backend/ai-agent-service/tests/test_xiaobu_multi_turn_scenarios.py"
        - "backend/ai-agent-service/tests/test_business_verification.py"
        - "backend/ai-agent-service/tests/e2e/specs/test_tool_coverage.py"
      ci:
        - ai-agent-tests.yml
      verifies: []

  - id: OR-013
    legacy_id: ""
    title: "B 端物流查询 - 仅支持真实订单号，拒绝快递单号直查"
    domains:
      - order
      - defense
    tier: normal
    tags:
      - query
      - logistics
      - data_safety
    truths_ref:
      - order.logistics
    user_inputs:
      - "用快递单号 SF1234567890 查一下物流"
      - "查 ORD-20260701-0001 的物流"
    expectations:
      - tool: logistics_track
    data_checks:
      - "logistics_track 参数仅剩 order_id（required）；传 tracking_number 必须拒绝并引导提供订单号"
      - "快递单号只能由系统从订单详情读取后内部查询轨迹（_track_by_number 为内部链路）"
      - "按真实订单号查询：订单详情→运单号→轨迹（API 失败降级 mock）；显式公司 code 不被 API 识别(203)时去掉 type 自动识别重试一次"
    skip_reason: ""
    merge_log: "2026-09-01 新增：B 端物流查询安全收紧（禁止物流号直查，防用他人运单号刺探）"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_tools_logistics_track.py"
        - "backend/ai-agent-service/tests/test_e2e_full_chain.py"
        - "backend/ai-agent-service/tests/test_e2e_mibao_scenarios.py"
      ci:
        - ai-agent-tests.yml
      verifies: []

  - id: OR-014
    legacy_id: ""
    title: "下单加工项数量规则 - 按计价方式，无每米数量密度推导"
    domains:
      - order
      - chat
    tier: normal
    tags:
      - order_create
      - processing_item
      - pricing
    truths_ref:
      - order.states
      - order.create-flow
      - processing-manage.crud
    user_inputs:
      - "帮我下单，遮光窗帘 3 米，要打孔加工"
    expectations:
      - tool: product_detail
      - tool: order_create
    data_checks:
      - "加工项数量按计价方式确定：per_meter → 数量=面料米数（如打孔 8 元/米 × 3 米 → quantity=3、subtotal=24）；per_set/fixed → 数量=1；per_area → 宽×高"
      - "processing_info.processingItems 逐项含 {id, name, unitPrice, quantity, unit, pricingMethod, subtotal}，processingFee = 各项 unitPrice × quantity 之和"
      - "订单确认/回复展示加工项含「名称+数量+金额」（如『打孔（罗马圈）3米 ¥24.00』）——数量可见可对账，禁止虚构每米几个的密度推导"
      - "加工费 = 单价 × 数量（打孔 8 元/米 × 3 米 = 24 元），漏算/错算加工费 = 订单金额错误"
    skip_reason: ""
    merge_log: "2026-09-07 改写（issue #3005，回滚 #2986）：行业加工费按米计价、辅料（罗马圈/四爪钩等）含在按米加工费中——回滚 per_piece 与「每米数量」密度（数量=ceil(面料米数×密度) 与实际车间工艺不符、数量隐藏导致 B 端无法对账），数量改为按计价方式派生且展示（per_meter=面料米数、per_set/fixed=1）"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_order_create_processing_quantity.py"
      ci:
        - agent-eval.yml
      verifies: []

  - id: OR-015
    legacy_id: ""
    title: "order_create 写操作前置校验必须真正执行（validate_input 规则分层修复，issue #3029 复盘）"
    domains:
      - order
      - chat
    tier: normal
    tags:
      - order_create
      - validate_input
      - defense
    truths_ref:
      - order.create-flow
    user_inputs:
      - "创建订单，张三 13800138000 遮光窗帘 3 米"
      - "散剪，2.8米门幅"
      - "不添加加工项，确认下单"
      - "确认下单"
    expectations:
      - tool: validate_input
      - tool: order_create
    data_checks:
      - "validate_input(target_tool=order_create, target_action=create) 必须真正执行必填与类型校验：缺少 customer_name/customer_phone/items 任一 → 校验失败并给出缺失字段列表"
      - "customer_phone 非 11 位手机号（或不以 1 开头）→ 校验失败提示「请输入 11 位中国大陆手机号」"
      - "合法参数（customer_name + 11 位 phone + items 非空列表）→ 校验通过 validated=true"
