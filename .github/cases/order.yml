      - "**逐条给判定依据 + ①尺寸行就地徽标 + 门幅未维护显式可见**（issue #4658 / #4657；**依据文案 #5130 改判**）：🔴 **2026-09-22 改判（issue #5130）**：依据文案由「… > 门幅 … 米」改为**与企业阈值比** —— 缺省档（6.6 × 2.6）的 `reason` 逐字 = 「净窗宽 6.6 米 > 超宽阈值 6.0 米」（钉在 `backend/ai-agent-service/tests/test_production/test_auto_features.py::test_reason_wording_is_pinned`；本用例**不抄第二份**，issue #5091 纪律不变）；`超高` 的 = 「净窗高 … 米 > 超高阈值 … 米」；`倒幅` 的 = 「加工类型 = 定宽买高」。**旧式依据（含「门幅」「褶倍」「左右余量」的三种写法）整条退场**。**门幅未维护**的口径随之**收窄到几何层**：②`door-width-missing` + ①`size-door-width-missing` 仍显式标出，但文案不得再说「超高 / 超宽都判不了」（新判据不读门幅 ⇒ 那句话是假话）—— 缺门幅时判定面**照判**（6.6 宽 ⇒ 「超宽」）。红证：依据文案写回旧式「… > 门幅 … 米」⇒ 引擎措辞断言 + 下单页依据断言必红；把 `door-width-missing` 的文案改回「超高 / 超宽都判不了」⇒ `frontend/admin-web/tests/unit/pages/orders-new-auto-features.test.tsx` 的「#4877/#5130」用例必红。**反向护栏**：SKU **真的给了**门幅 ⇒ **不谎报**成「未维护」。**以下为改判前口径（留档，不再生效）**：**逐条给判定依据（宽方向无余量 · 高方向「上下卷边」）+ ①尺寸行就地徽标 + 门幅未维护显式可见**（issue #4658 / #4657 / #4661；**余量名判据 #5030 改判**）：系统识别块**逐条**在**正文里**显示 `reason`，且**余量名必须与方向一致** —— 🔴 **改判（用户 2026-09-21 裁定，issue #5030）**：宽方向**没有**余量（订单宽 = 净窗宽 ⇒ 成品宽 = 净窗宽）⇒ **依据里不得出现任何宽方向余量名**（`左右余量` / `左右覆盖余量` / `SIDE_MARGIN` 一律不得出现）；高方向仍是「上下卷边」。文案逐字：缺省档（定高买宽）的 `reason` = 「成品高 2.6 + **上下卷边** 0.3 = 2.9 米 > 门幅 2.8 米」；切到 `定宽买高` ⇒ 「**窗宽 6.6 × 褶倍 2 = 13.2 米 > 门幅 2.8 米**」（**不得**再写成「成品宽 6.6 + **左右余量** 0.3 = 6.9 米 > 门幅 2.8 米」/「… = 6.9 米 × 褶倍 2 = 13.8 米」—— 那是 #5030 之前的错口径，13.8 这个数**整条退场**）—— 旧实现只把依据藏在 `title` 属性里（且两条都写「卷边」），商家**看不见**判定过程；**① 尺寸与数量**行旁给**就地徽标**（`data-testid=\"size-auto-badge-<特征名>\"`，填尺寸时就看得见、不超时消失），①与②读**同一份** `detectAutoFeatures` 推导（**严禁**第二份实现）；门幅**未维护**时**界面显式标出**「无法判定」（issue #4877 **改判：缺省门幅已删除** —— 旧行为「按默认 2.8 米推算」是要替换掉的错误做法）：②`door-width-missing` + ①`size-door-width-missing`，且**两条识别特征都不判**（缺门幅 = 判不了，不许拿默认门幅顶上）。红证（改前实测）：无 `size-auto-badge-*` ⇒ 对应断言必红；依据文案只在 `title` 属性里、或宽方向写成「卷边」⇒ 正文/语义断言必红。**#5030 改判后的红证形态**：宽方向依据里出现任何余量名（「成品宽 6.6 + 左右余量 0.3 = 6.9 米 × 褶倍 2 = 13.8 米」）⇒ 必红；把超宽依据改回「只比宽」⇒ 1.5 宽 × 褶倍 2 = 3.0 米该分幅却判不超宽 ⇒ 必红。**反向护栏**：SKU **真的给了**门幅 ⇒ **不谎报**成「未维护」。"
      - "**门幅选择规则接线（issue #4877，用户 2026-09-21 裁定 C「两者都做：规则驱动默认选中 SKU + 判定提示」）**：候选门幅 = 本行该颜色的 SKU 门幅；**规则解** = 定高买宽取（可行集 `成品高 + HEM_MARGIN ≤ 有效门幅`）里**最小门幅**、定宽买高取**分幅最少**（并列取较小门幅）—— 口径唯一实现在**服务端**（`POST /api/internal/production/door-width-plan` → 引擎 `build_quote(..., fabric_widths=...)` → `resolve_fabric_plan`；四态裁决 = `judge_door_width_choice`）。⚠️ **issue #5043 包 2b 起前端 `frontend/admin-web/src/lib/door-width-plan.ts` 已删除** —— 它与引擎口径**不是同一条规则**（实测：韩褶下门幅 3.2 时引擎 **1 幅** / 前端 **2 幅**，差 0.65 米）⇒ 前端只**展示**服务端结论。三态与界面：①多门幅且规则有唯一解 ⇒ **自动选中**该门幅对应的 SKU（该门幅在本颜色下**唯一**对应一个 SKU 时才选；尺寸齐了补、**客服已选不覆盖**）；②所选门幅**可行但非规则解** ⇒ 提示「可换最优门幅」（`door-width-suboptimal`，**只提示、不替客服改**）；③所选门幅**单幅做不出**（如成品高 2.75 + 卷边 0.3 = 3.05 > 门幅 2.8）⇒ **需接高**强告警（`door-width-needs-splice`，缺口 = 3.05 − 2.8 = 0.25 米 × 片数）；④规则判不了（缺门幅 / 缺尺寸 / 缺褶倍 / 加工类型缺失）⇒ `undecidable`，界面**不显示**最优提示（没有可比对象）。真单锚（亿家纺织 `CSO260918-03182`）：3.0×2.75 双开 —— 门幅 3.2 ⇒ 单幅可做（6.3 米，与报价单逐值一致）；门幅只有 2.8 ⇒ **需接高**（不许静默改判定宽买高/倒幅）。红证：把「取最小可行门幅」改成取最大 ⇒ `backend/ai-agent-service/tests/test_production/test_door_width_plan_endpoint.py` 的规则解断言红；去掉非最优提示 / 把客服手选自动改回 ⇒ `orders-new-auto-features.test.tsx` 的「#4877 门幅规则接线」三条必红；缺门幅回退到任何默认值 ⇒ `tests/unit_ci_workflows/test_fabric_width_truth_source.py` 判据 3（反向守卫）与 `craft-auto-features.test.ts` 的反向断言双红。"
