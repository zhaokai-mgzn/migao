  # OR-041（issue #4527，2026-09-19）：**用料公式按「加工项派生」的工艺推导 + 逐片口径 + 向上进位到 0.1**
  # ══════════════════════════════════════════════════════════════════════════
  # 用户 2026-09-19 裁定（逐字）：「算出来的用料还要根据打开方式*系数，单开系数1，双开系数2，
  # 以此类推，最后用料米数保留一位小数，除了使用韩褶公式还有一种褶倍数计算公式，这都是用料
  # 计算方法，你得根据用户要求选择不同的计算公式，默认用韩折的」；追加裁定「**韩褶用韩褶公式
  # 算布料，打孔按倍数法算布料，默认选择 2 倍**」+「可能得支持每个商家自定义配置」；
  # 澄清三问 → **乙**（公式吃每片宽，总用料 = 每片用料 × 开数）+ 向上进位。
  #
  # **ERP 实证锚点（防口径漂移，本用例的锚）**：加工单 `CSO260915-02615`（#4343 已取证）
  # 宽 5.5m / 双开 / 理论褶倍 2.00 ⇒ 操作记录每道工序 **11.00 米**（= 5.5×2.00）
  # ⇒ **双开不得把总宽再乘 2**（「甲」口径算成 22.00 米，与实证差一倍、直接进订单金额，已被否决）。
