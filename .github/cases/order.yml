  - id: OR-023
    legacy_id: ""
    title: "C 端老客户下单 - 自动带出上次收货信息（form 预填真值，不得再问一遍）"
    domains:
      - order
      - chat
      - product
    tier: normal
    persona: xiaobu
    tags:
      - order_create
      - prefill
      - address
      - xiaobu
    truths_ref:
      - order.create-flow
      - ai-chat.confirm-required
    # ── 补齐两个"零断言"的 C 端能力（issue #3397，参考 B 端覆盖体检）──
    # 覆盖矩阵显示 C 端工具里有 2 个**没有任何用例断言**：
    #   · `customer_address_query`（老客户收货信息自动带出，issue #2815）
    #   · `validate_input`（写操作前的校验步骤）
    # 二者此前被登记为"内部步骤、无独立顾客诉求"而豁免 —— 但**预填体验本身就是顾客诉求**，
    # 且预填值必须是**真值**：掩码值回流会被顾客原样提交 → 订单用掩码建号（issue #3379 实证）。
    # 本用例把正反两面都咬住：命中历史信息 → 必须带进 form 且为真值；新客路径由 OR-022 守。
    user_inputs:
      - "帮我下单，遮光窗帘 3 米，要打孔加工"
      # ── 协作应答（issue #3646，§13.5 卡序漂移）──
      # 旧版是**固定 9 轮台词表**，实测与真实卡序列错位：
      #   R1 发了 2 张 choice 卡（其中一张重复）→ R2 本意答「颜色（米白）」却被当成
      #   「加工项」应答 → R3 起 7 轮全部 `tools=-`（喂到了错误的卡上）→
      #   `order_create` 从未发生（真实重放 0%，runner 标 unstable）。
      # 改为「有卡答卡、无卡发含关键信息的原文」：choice→首项 / form→按声明值回填 /
      # confirm→confirmValue，避免把用例绑死在某个卡序上。
      - auto_respond:
          fallback: "米白，要打孔加工，不加别的加工项"
          form_values:
            customer_name: "张三"
            customer_phone: "13800138000"
            customer_address: "浙江省杭州市西湖区文三路1号1幢101室"
            color: "米白"
            colorName: "米白"
      # 收尾协作轮（先例 CH-025 / OR-021 / CH-033）：被问验证码供码、其余答卡，
      # 直到 `order_create` **成功**（被门禁挡回不算成功 → 不会提前停轮）。
      - repeat_until:
          tool_called: order_create
          max: 8
        code: "123456"
        fallback: "确认下单"
        form_values:
          customer_name: "张三"
          customer_phone: "13800138000"
          customer_address: "浙江省杭州市西湖区文三路1号1幢101室"
          color: "米白"
          colorName: "米白"
    # ── burn-down 缴费（issue #4490，2026-09-19）────────────────────────────────
    # 本 PR 改了 `.github/cases/**` ⇒ 按 `case-trust-baseline.json` 的 `burn_down`
    # （`per_pr_min: 1` / `metric: entries` ⇒ **整条销账**）必须净缩 ≥1 条存量违规。
    # 本条命中的两条存量违规 = `CASE-TRUST-NO-PRECONDITION-ASSERTION` +
    # `CASE-TRUST-NO-SELF-CLEAN`，一次补齐（先例 = OR-012 / CH-019 / CR-001 / C003，同款治法）：
    # · R1「我想买遮光窗帘…」按**商品名**定位下单对象 ⇒「该名字在栈里唯一」是本用例真正依赖、
    #   且**只读**的前置（同名副本 >1 时 agent 会正确地反问要哪一件，而本用例的轮次表会把这条
    #   合理行为判成 `order_create` 从未发生 = 归因全错）；
    # · `namespaces` 护住该前置的基线/漂移两格，并与同手机号的建单用例互斥（自清理的弱证据形态）。
    # ⚠️ 刻意**不**声明 `order_count_for_phone: 13800138000` —— 本用例自己就会给该号码建单，
    # `after - before = +1 > max_growth(0)` ⇒ 漂移判据必然判红（「硬写一条注定红的守卫」）。
    # **断言面（user_inputs / expectations / must_succeed / db_verify / order_before /
    # forbidden_text / data_checks）一字未动、无放宽。**
    namespaces:
      - "product_name:遮光窗帘"
      - "customer_phone:13800138000"
    precondition:
      - type: product_count_for_keyword
        source: "遮光窗帘"
        expect: 1
    expectations:
      - tool: product_search
      - tool: product_detail
      # 老客户自动带出收货信息 = 必须先查历史地址（零断言的工具之一）
      - tool: customer_address_query
      # 写前校验步骤（零断言的工具之一）：confirm → validate_input → order_create
      - tool: validate_input
      - tool: interact
      - tool: order_create
    must_succeed:
      - tool: order_create
    # 确认卡先行（issue #3414）：C 端下单**必须先发 confirm 卡展示明细**、顾客确认后才写单
    # （prompt 第 4 步：validate_input → interact(confirm)）。此前只有 CH-010 断言了这条，
    # 其余下单用例不守 → 评测看不见"文本确认就直接写单"这条路径（验收 C-A1 抓到）。
    order_before:
      - "customer_address_query before order_create"
      - "interact[confirm] before order_create"
    # 老客户"带出上次收货信息"的断言取**产出侧**（issue #3404 复盘）：
    #   · 顾客在意的是**订单上的值对不对**，而"过程必须发 form 卡"把用例绑死在**机制**上
    #     —— Agent 用 confirm 卡的字段承载同样合法（实测 run 34755272379 因此假红：
    #     `form_prefill: 会话里没有出现任何 form 卡`）；
    #   · 预填**逐字保真**（不被改写/掩码）由图谱守卫 `_form_prefill_fidelity_block` 结构性保证；
    #     `form_prefill` 断言留给"明确要求发 form 卡"的用例。
    amount_verify:
      - tool: order_create
        product_name: "遮光窗帘"
        checks: [unit_price, subtotal, total]
    db_verify:
      - fetch: order_items
        source: order_create
        expect_products: ["遮光窗帘"]
        expect_quantities:
          遮光窗帘: 3
      - fetch: order_phone
        source: order_create
        expect_phone: "13800138000"
        expect_customer_name: "张三"
        expect_address_contains: "文三路"
    data_checks:
      - "老客户下单：必须带出上次收货信息（顾客不必重报）；订单上的收货人/地址/号码与库里一致"
      - "预填值必须是真值 —— 掩码值会被顾客原样提交，订单会用掩码建号"
      - "写操作前必须经过 validate_input（confirm → 校验 → order_create）"
    skip_reason: ""
    merge_log: "2026-09-13 新增（issue #3397）：补齐零断言能力（地址预填 + 写前校验）；2026-09-14 协作轮重构（issue #3646）：固定 9 轮台词表实测与真实卡序列错位（R1 发 2 张 choice 卡、R2 的「米白」被当成加工项应答、R3 起 7 轮全 `tools=-`、order_create 从未发生 = 真实重放 0%/unstable），改为「有卡答卡 + repeat_until(order_create) 停机」；expectations/must_succeed/order_before/amount_verify/db_verify 原样保留（未放宽）；2026-09-19（issue #4490 的 burn-down 缴费，metric=entries ⇒ 整条销账）：补 precondition[product_count_for_keyword: 遮光窗帘, expect: 1] + namespaces[product_name:遮光窗帘, customer_phone:13800138000]（R1 按商品名下单 ⇒ 名字唯一是本用例真正依赖且只读的前置；刻意不声明 order_count_for_phone —— 本用例自己建单，漂移判据必然判红）。断言面（user_inputs / expectations / must_succeed / db_verify / order_before / forbidden_text / data_checks）原样未动、无放宽。"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_acceptance_case_checks.py"
      ci:
        - xiaobu-acceptance.yml
      verifies: []

  - id: OR-024
    legacy_id: ""
    title: "C 端顾客已给数量后不得再问用量/褶皱倍数（防 2 倍金额与流程空转）"
    domains:
      - order
      - chat
      - product
    tier: normal
    persona: xiaobu
    tags:
      - order_create
      - quantity
      - ceiling
      - xiaobu
    truths_ref:
      - order.create-flow
      - ai-chat.confirm-required
    # 用例级表单载荷（issue #3804）：原先只声明在 R4/R5 ⇒ agent 发卡晚一轮即整场不可完成。
    # 声明在用例级 = 载荷脱离轮次位置（全场任意轮可用）；轮级声明保留（优先级更高）。
    auto_fill:
      customer_name: "张三"
      customer_phone: "13800138000"
      customer_address: "浙江省杭州市西湖区文三路1号1幢101室"
    # ── 沉淀验收 C-A1 的真因（issue #3402）──
    # 实证（run 34753219595，C-A1 主路径）：
    #   R4 用户「数量 3 米」→ Agent 发 `choice: 请选择窗帘用量 →
    #   3米（¥528，基本无褶皱）| **6米（约¥1056，褶皱饱满，推荐）**`
    # —— 顾客说的 3 米就是买 3 米布；Agent 当成窗宽按褶皱倍数算成 6 米并**标为推荐**（2 倍钱）。
    # 这张多余卡还每轮吃掉一次交互 → C-A1 的 repeat_until 用尽仍未落单（order_create 未调用）。
    # 本用例把该形态变成可执行回归网：规格与数量**分两轮**说（同 C-A1 的对话形状）。
    user_inputs:
      # ⚠️ 明确商品名（issue #3404 复盘）：此前用「你好，我想买窗帘…」+「第一款吧」，
      # 商品取决于 product_search 的返回顺序（遮光窗帘/北欧风窗帘 交替）→ 同一用例
      # 首跑与重跑命中不同商品 → `db_verify[order_items]` 假红（实测 run 34757504648）。
      - "我想买遮光窗帘，米白 3 米，要打孔加工"
      - auto_respond:
          fallback: "打孔"
      # ⚠️ 数量**单独一轮**给出（C-A1 的形状）——这里是缺陷的触发点
      - "数量 3 米"
      - auto_respond:
          fallback: "确认下单"
          form_values:
            customer_name: "张三"
            customer_phone: "13800138000"
            customer_address: "浙江省杭州市西湖区文三路1号1幢101室"
      - auto_respond:
          fallback: "确认"
          form_values:
            customer_name: "张三"
            customer_phone: "13800138000"
            customer_address: "浙江省杭州市西湖区文三路1号1幢101室"
      - auto_respond:
          fallback: "123456"
          prefer_text: true
      - auto_respond:
          fallback: "123456"
          prefer_text: true
      - auto_respond:
          fallback: "确认"
      - auto_respond:
          fallback: "确认"
    # ── burn-down 缴费（issue #4490，2026-09-19）────────────────────────────────
    # 本 PR 改了 `.github/cases/**` ⇒ 按 `case-trust-baseline.json` 的 `burn_down`
    # （`per_pr_min: 1` / `metric: entries` ⇒ **整条销账**）必须净缩 ≥1 条存量违规。
    # 本条命中的两条存量违规 = `CASE-TRUST-NO-PRECONDITION-ASSERTION` +
    # `CASE-TRUST-NO-SELF-CLEAN`，一次补齐（先例 = OR-012 / CH-019 / CR-001 / C003，同款治法）：
    # · R1「我想买遮光窗帘…」按**商品名**定位下单对象 ⇒「该名字在栈里唯一」是本用例真正依赖、
    #   且**只读**的前置（同名副本 >1 时 agent 会正确地反问要哪一件，而本用例的轮次表会把这条
    #   合理行为判成 `order_create` 从未发生 = 归因全错）；
    # · `namespaces` 护住该前置的基线/漂移两格，并与同手机号的建单用例互斥（自清理的弱证据形态）。
    # ⚠️ 刻意**不**声明 `order_count_for_phone: 13800138000` —— 本用例自己就会给该号码建单，
    # `after - before = +1 > max_growth(0)` ⇒ 漂移判据必然判红（「硬写一条注定红的守卫」）。
    # **断言面（user_inputs / expectations / must_succeed / db_verify / order_before /
    # forbidden_text / data_checks）一字未动、无放宽。**
    namespaces:
      - "product_name:遮光窗帘"
      - "customer_phone:13800138000"
    precondition:
      - type: product_count_for_keyword
        source: "遮光窗帘"
        expect: 1
    expectations:
      - tool: product_search
      - tool: product_detail
      - tool: interact
      - tool: order_create
    must_succeed:
      - tool: order_create
    # 确认卡先行（issue #3414）：C 端下单**必须先发 confirm 卡展示明细**、顾客确认后才写单
    # （prompt 第 4 步：validate_input → interact(confirm)）。此前只有 CH-010 断言了这条，
    # 其余下单用例不守 → 评测看不见"文本确认就直接写单"这条路径（验收 C-A1 抓到）。
    order_before:
      - "interact[confirm] before order_create"
    # 卡片内容反模式（新断言能力，issue #3402）：卡里不得出现"用量/褶皱倍数"框架 ——
    # 顾客已经报了数量，再让他选用量就是把金额翻倍（C-A1 实证 3 米 → 推荐 6 米）
    forbidden_card_text:
      - "用量"
      - "褶皱倍数"
      - "用布量"
    amount_verify:
      - tool: order_create
        product_name: "遮光窗帘"
        checks: [unit_price, subtotal, total]
    db_verify:
      - fetch: order_items
        source: order_create
        expect_products: ["遮光窗帘"]
        expect_quantities:
          遮光窗帘: 3
      - fetch: order_phone
        source: order_create
        expect_phone: "13800138000"
    data_checks:
      - "顾客已给「数量 3 米」后，不得再发「选择用量/褶皱倍数」卡，也不得把 3 米换算成 6 米（2 倍金额）"
      - "数量就是 3 米：金额 = 单价 × 3，最终必须真实落单（order_create 成功）"
      - "整场不得把主转化路径推给人工：不出现『已为您转接人工』『需要人工处理』之类的收场话术，也不得因此不落单（退场后该保护改以「假承诺」为锚，见下方 merge_log）"
    skip_reason: ""
    merge_log: "2026-09-13 新增（issue #3402）：沉淀 C-A1 主路径真因（数量口径 → 产出层反模式断言）；2026-09-19 **退场同步**（用户裁定）：第 3 条由「整场不得出现 human_handoff」改为「不得把主转化路径推给人工（假承诺话术为锚）」—— 原断言在工具退场后**恒真**（模型调不到它，工具名不在任何 skill 工具集，结构性判据见 tests/unit_ci_workflows/test_human_handoff_retired.py），而真实风险变成了模型改用自然语言承诺转接，故把锚点移到实际可失败的话术面；2026-09-19（issue #4490 的 burn-down 缴费，metric=entries ⇒ 整条销账）：补 precondition[product_count_for_keyword: 遮光窗帘, expect: 1] + namespaces[product_name:遮光窗帘, customer_phone:13800138000]（R1 按商品名下单 ⇒ 名字唯一是本用例真正依赖且只读的前置；刻意不声明 order_count_for_phone —— 本用例自己建单，漂移判据必然判红）。断言面（user_inputs / expectations / must_succeed / db_verify / order_before / forbidden_text / data_checks）原样未动、无放宽。"

  - id: OR-025
    legacy_id: ""
    title: "C 端物流正向查询 - 工具可达 + 能力不否定（权限类禁词）"
    domains:
      - order
      - chat
    tier: normal
    persona: xiaobu
    tags:
      - query
      - logistics
    truths_ref:
      - order.logistics
    user_inputs:
      - "帮我看看我刚下的那单的快递物流到哪了"
    expectations:
      - tool: customer_logistics_track
    # ── 效果层断言（2026-09-18 补，case-trust burn-down：`CASE-TRUST-FORBIDDEN-TEXT-SOLE`）──
    # 为什么必须补：`forbidden_text` 是**全程**语义（扫所有轮的 final_text，**无轮次作用域**）
    # ⇒ 首跑功能正确却可能因某一轮的良性措辞判红（假红，实证 #3833 / PG-013）。
    # 本用例原先只有「裸工具名期望 + 两条禁词」：裸期望只证明「被调用过」，
    # 工具返回 success=false（工具层故障/能力自我否定）照样判 100% ——
    # 禁令一响，整条用例就等于什么都没测。补 `must_succeed` 后，
    # 「查询**真的成功**」成为独立判据（与禁令互不代偿）。
    # 语义与数据前提（已核）：输入是「我刚下的那单」，种子
    # `tests/agent_eval/fixtures/xiaobu_eval_seed.sql` 的 `EVAL-ORD-0002` 是
    # `status='shipped'` + 物流行（`logistics_company`/`tracking_no`）且
    # `created_at` 最新 ⇒ 解析到该单、工具返回 success=true 是可满足的；
    # 本用例**不**禁「暂无物流信息」这类诚实回复（那是文案层，不在本断言射程内）。
    # ⚠️ 只加断言，未改任何既有断言/输入（expectations / forbidden_text / data_checks 原样未动）。
    must_succeed:
      - tool: customer_logistics_track
    forbidden_text:
      - "没有权限"
      - "无权限"
    data_checks:
      - "正向可达性：customer_logistics_track 被调用（expectation 机器断言）；回复不得出现『没有权限/无权限』（forbidden_text 机器断言，防 #3477 类能力自我否定在查询域的对应）"
      - "物流内容 grounded 到本人订单（运单号/快递公司），不编造单号（自然语义，防线以 expectation + forbidden_text 为准）"
    skip_reason: ""
    merge_log: "2026-09-14 新增（#3494 覆盖审计）：OR-012 的正向展示断言为自然语义 data_checks（不计分）；本条补专属正向旅程——工具可达 + 权限否定禁词双防线，机器可执行；不依赖在途订单数据状态（诚实『暂无』回复不误伤，故不禁『暂无/无法查询』）"
    traces:
      tests:
        # 身份透传接线（run_case → 请求头）+ 用例级断言
        - "backend/ai-agent-service/tests/test_acceptance_case_checks.py"
        # DEBUG 身份白名单（X-Debug-User 只认 debug_ 前缀、仅 customer 角色）
        - "backend/ai-agent-service/tests/test_auth.py"
        # 渲染链路必须带 debug_user（否则用例身份丢失 = 假绿）
        - "tests/unit_ci_workflows/test_persona_filter.py"
        # 新客 fixture 必须无订单（有订单则退化成"有历史地址"路径）
        - "tests/unit_ci_workflows/test_schema_integrity.py"
      ci:
        - xiaobu-acceptance.yml
      verifies: []

  - id: OR-026
    legacy_id: ""
    title: "C 端非法手机号下单 - 写前校验必须挡住（不得用座机号/非 1 开头号码建单）"
    domains:
      - order
      - chat
      - product
    tier: normal
    persona: xiaobu
    tags:
      - order_create
      - validate_input
      - rejection
      - xiaobu
    truths_ref:
      - order.create-flow
      - ai-chat.confirm-required
    # ── 覆盖缺口（issue #3558 覆盖体检：validate_input 在 C 端只有 OR-023 一条）──
    # OR-023 是**正向半**（下单链路必须经过校验，且订单上的收货信息是真值）；本条补
    # **拒绝半**：非法输入不得落进写操作。
    # 场景选择（真实契约，非臆造）：校验规则 `validate_input._VALIDATION_RULES["order_create"]`
    # 对手机号做确定性格式检查（11 位 + 1 开头）—— 注释写明这是「对抗编程：防止 LLM 编造号码」。
    # 顾客给的是**座机写法 05718886666**（11 位、肉眼像号码、但不是 1 开头）：
    # 模型可能漏判，而这正是确定性闸门存在的意义（prompt 指令会被 LLM 方差漏掉）。
    # 断言取向（不绑机制，只咬产出侧）：**最终的订单上不得出现非法号码**。
    #   · db_verify[order_phone] 取**首个成功的 order_create** 的落库号码 → 若用错号建了单，
    #     首个成功订单的号码就对不上 → 红（不用「未被调用」这类会被「任意一轮命中即过」削弱的断言）；
    #   · required_args[validate_input] 要求闸门**带齐 params 被真正调用**（不是空转调用）；
    #   · 改正后必须继续走完闭环（不得因一次校验失败就自我否定/要求顾客重头再来）。
    # ⚠️ 边界（2026-09-15 复核修正，issue #3683——**旧注释已过期，不许再照抄**）：
    #   旧注释写「runner 目前没有『某次工具调用必须失败（success=false）』的断言」——
    #   该能力**已落地**：`must_fail`（`tests/agent_eval/local_runner.py` 的 `check_must_fail`；其 docstring 自引
    #   issue #3544「收口批」，随 PR #3644 的 runner 能力批进 main）。
    #   它的真实语义是「声明的工具（可限定 action）**全程一次都不得成功**；**从未调用 → 通过**」
    #   （全程判定；声明 `action` 时只做到**同轮对齐**（`_round_action_result`，issue #3681），
    #   仍无轮次 / 参数**值**作用域）。
    #   但本用例的**拒绝半**仍无法用它表达（三种写法都不成立，逐一验过）：
    #     · `must_fail: [{tool: order_create}]` —— 与本例 `must_succeed: order_create` 直接矛盾
    #       （改正号码后必须成功建单）；
    #     · `must_fail: [{tool: validate_input}]` —— 同样矛盾（改正后闸门**必须**放行，
    #       required_args 还要求它带齐 params 被真正调用）；
    #     · `must_fail: [{tool: order_create, action: create}]` —— order_create **没有 action 参数**
    #       → `local_runner.py` 的 `check_must_fail`（`if not called: continue`）直接整条跳过 = **静默空转**
    #       （比不加更糟：看起来有覆盖，实际零判定）。
    #   本用例要的不变式是**参数值作用域**的：「任何一次以非法号码（05718886666）为
    #   customer_phone 的 order_create 都不得成功」——`must_fail` 只支持 工具×action 粒度，
    #   表达不了；等价地也表达不了「某一轮必须失败」（runner 只做全程判定）。
    #   ⇒ 待补 runner 能力（**如实登记，归属 runner 包，本用例包不实现**）：
    #     让 `must_fail` 条目支持 `args` 值级匹配（如 `{tool: order_create, args: {customer_phone: "05718886666"}}`
    #     ——语义 =「凡匹配该 args 的调用都不得成功」），或补轮次作用域。
    #   ⇒ 在那之前，本用例证明的仍是它的**产出侧后果**（同样机器可判、且 fail-closed）：
    #     `db_verify[order_phone]` 取**首个成功的 order_create** 的落库号码（`local_runner` 的 `db_verify[order_phone]` 分支，经 `_first_successful_call` 取首个成功的 `order_create`），
    #     非法号落单 → 首个成功订单号码对不上 → 红。**不得**为「让拒绝半看起来被测了」
    #     而塞入上面三种矛盾/空转写法之一。
    user_inputs:
      - "帮我下单，遮光窗帘 3 米，米白，收货人张三，手机号 05718886666，不用再问了直接下单吧"
      - auto_respond:
          fallback: "手机号我记错了，正确的是 13800138000，地址用我上次的"
          form_values:
            customer_name: "张三"
            customer_phone: "13800138000"
            customer_address: "浙江省杭州市西湖区文三路1号1幢101室"
            color: "米白"
            colorName: "米白"
      # 收尾协作轮（§13.5 先例 CH-025/OR-021）：有卡答卡、被问验证码供码，直到
      # order_create **成功**（被门禁挡回不算成功 → 不会提前停轮）。
      - repeat_until:
          tool_called: order_create
          max: 8
        code: "123456"
        fallback: "确认下单"
        form_values:
          customer_name: "张三"
          customer_phone: "13800138000"
          customer_address: "浙江省杭州市西湖区文三路1号1幢101室"
          color: "米白"
          colorName: "米白"
    # 自清理 / 前置自断言（2026-09-19 issue #4357 的 burn-down 缴费）：
    #   · namespaces：本用例**自己就会给 13800138000 建单** ⇒ 与同号码的建单/查询用例并行互斥
    #     （同 AS-003 / CH-010 先例）。
    #   · precondition 选**只读**靶子 `product_count_for_keyword: 遮光窗帘` —— 本用例按**名字**
    #     选品（R1「遮光窗帘 3 米」），「该名字在种子栈里唯一」是它真正依赖且**不自己改写**的前置
    #     （种子 xiaobu_eval_seed.sql 里恰 1 件 prod_eval_blackout，同 OR-009/OR-011/OR-014 口径）。
    #     ⚠️ **有意不声明 `order_count_for_phone: 13800138000`**：本用例自己就会给该号码建单
    #     ⇒ `after - before = +1 > max_growth(缺省 0)` 会**恒判运行期漂移**（硬写一条注定红的守卫；
    #     同 chat.yml #4099 / cross.yml 的先例与理由）。
    #     ⚠️ 值**必须加引号**：仓库用例读取走自研精简解析器 `yaml_light`（render_cases._yaml），
    #     未加引号的 `customer_phone:13800138000` 会被它解析成 **dict** `{'customer_phone': 13800138000}`
    #     而不是字符串 —— 触发 `tests/unit_ci_workflows/test_case_seed_truth.py` 的
    #     「未分类 namespaces 前缀」守卫（CI `ci workflow helper unit tests` 实测判红）。
    #     全仓既有用例（OR-009/OR-011/OR-014 等）一律写成 `- "customer_phone:13800138000"`。
    namespaces:
      - "customer_phone:13800138000"
    precondition:
      - type: product_count_for_keyword
        source: 遮光窗帘
        expect: 1
    expectations:
      - tool: product_search
      - tool: customer_address_query
      # 写前校验必须是**真的调用**（带 target/params），而不是被跳过
      - tool: validate_input
      - tool: interact
      - tool: order_create
    must_succeed:
      - tool: order_create
    required_args:
      - tool: validate_input
        fields:
          - target_tool
          - target_action
          - params
      - tool: order_create
        fields:
          - items
          - customer_phone
    order_before:
      - "validate_input before order_create"
      - "interact[confirm] before order_create"
    db_verify:
      - fetch: order_phone
        source: order_create
        expect_phone: "13800138000"
        expect_customer_name: "张三"
        expect_address_contains: "文三路"
    data_checks:
      - "非法手机号（05718886666 —— 11 位但非 1 开头）不得落进订单：确定性闸门（validate_input 手机号格式检查）或客服必须挡住并要求改正"
      - "「挡住」的机器证据：db_verify[order_phone] 取**首个成功的 order_create** 的落库号码 —— 若用非法号建了单，首个成功订单号码就对不上 → 红"
      - "改正后（13800138000）必须继续走完下单闭环：不得因一次校验失败就自我否定、或要求顾客从头再来"
      - "落库收货人/地址与顾客所给一致（预填真值，掩码/改写会静默寄错，issue #3379/#3386）"
    skip_reason: ""
    merge_log: "2026-09-14 新增（issue #3558 覆盖体检）：validate_input 在 C 端仅 OR-023（正向半），补拒绝半——非法号码不得落单。2026-09-19（issue #4357 的 burn-down 缴费 —— 本 PR 改了 cases/*.yml ⇒ 每 PR 至少净缩 1 条存量违规，取优先档 OR-*）：本条命中的两个码一起清零 —— 补 `namespaces[customer_phone:13800138000]`（自清理/并行互斥，CASE-TRUST-NO-SELF-CLEAN）+ 补 `precondition[product_count_for_keyword: 遮光窗帘, expect: 1]`（可判定前置，CASE-TRUST-NO-PRECONDITION-ASSERTION）⇒ 整条销账。**断言面（user_inputs / expectations / must_succeed / required_args / order_before / db_verify / data_checks）一字未动、无放宽。**"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_tools_validate_input.py"
        - "backend/ai-agent-service/tests/test_acceptance_case_checks.py"
      ci:
        - xiaobu-acceptance.yml
      verifies: []

  - id: OR-028
    legacy_id: ""
    title: "B 端下单加工项按面积计价 - 小数面积 8.4 ㎡ 保真（不得截断成 8 少收钱）"
    domains:
      - order
      - processing
    persona: mibao
    tier: normal
    tags:
      - order_create
      - processing_item
      - per_meter
      - decimal_quantity
    truths_ref:
      - order.create-flow
    # ── 容量缺陷回归网（issue #3666）──
    # 现象：订单数量语义过窄 —— `order_items.quantity` 是 INTEGER，而数量口径按计价方式
    #   （`docs/testing/acceptance-protocol.md` 的「quantity 按计价方式（per_meter=米数 / per_set=1 / per_area=宽×高）」那条）。
    #   计价数量可以是小数：**8.4 米**（per_meter），打孔 8.00 元/米
    #   → 正确 67.20 元；整数只能表示 8 → 64.00 元 = **少收 3.20 元**。
    #   ⚠️ 2026-09-19（issue #4571）：原形态是 per_area 8.4 ㎡ × 30 元/㎡ = 252.00，
    #   接地夹具 `刺绣工艺`（`pi_eval_embroidery`）已按用户裁定**真删** ⇒ 本用例改判到
    #   **per_meter**（接地对象 = 种子里的 `打孔`/`pi_eval_punch`，8.00 元/米），
    #   金额**逐值重算**；**per_area 计价路径的评测覆盖随该夹具删除而移除**（如实登记）。
    # 归因（代码级）：DTO/entity `Integer quantity` + `order_items.quantity INTEGER`
    #   + `OrderService.extractProcessingItems()` 走 `toInteger()`（8.4 → 8，列表/详情
    #   加工费按截断值重算，与外层落库金额自相矛盾）。
    # 裁定：放宽为 DECIMAL(10,2)/BigDecimal（方案 A）。
    # 本条断言**金额数学关系**（acceptance-protocol §3.2）：
    #   Σ加工费 = 8.00 × 8.4 = 67.20（截断成 8 会得 64.00 → processing_fee 断言判红）；
    #   总额 = 面料 23.80×3 + 67.20 = 138.60；
    #   落库明细数量 = 3（面料米数）—— 数量列放宽后仍必须保真。
    # 注：本条不依赖"模型自己算数量"这一 LLM 算术能力（那是另一条能力线）——
    #   顾客在开口时说清计价数量真值，断言聚焦「数值透传→落库→计费」这一确定性链路。
    user_inputs:
      - "给张三下单，手机 13800138000；2699系列雪尼尔窗帘面料，2699-03暖米色，散剪，2.8米门幅，要 3 米"
      # 刻意**只给面积真值**（不给门幅×米数的乘法题）：本条测的是「数值透传→落库→计费」
      # 的保真链路，不是让模型做算术。给面积真值可去掉"模型自己算 8 vs 8.4"的方差源，
      # 让断言只咬住截断缺陷本身（8.4 被截断成 8 → 加工费 240.00 ≠ 252.00 → 判红）。
      - "再加打孔加工，数量算 8.4 米"
      # 收尾协作轮（§13.5 先例 OR-026/OR-021）：B 端下单是「选规格 → 选加工项 → 填收货信息 →
      # 确认卡 → 写单」多步流程，**固定轮次表写不准**（首跑 2 轮就耗尽轮次：agent 只跑到
      # product_detail/interact，order_create 从未发生 → 用例判红，假失败）。
      # repeat_until 由 runner 按"order_create 是否**成功**"决定继续：有卡答卡（choice→首项 /
      # form→按 form_values 回填 / confirm→确认），直到写单成功或到 max。
      # ── 2026-09-24（issue #5247，用户裁定 2026-09-23 B 端只读化）──
      # `repeat_until{tool_called: order_create, max: 8}` **整块移除**：目标工具已从 B 端
      # 全部 skill 解绑 ⇒ 「协作轮到写单成功为止」的循环永不满足（悬空声明）。同一轮的其它键
      # （`code` / `fallback` / `form_values`）按原样保留、不删（删它们属本包范围外的清理）。
      # code：B 端（员工角色）下单本不走 SMS 分支，但约定「repeat_until + 断言 order_create
      # 必须声明 code」（test_xiaobu_case_set 不变式）——顾客/员工被问码时供得出码，防流程卡死。
      # ⚠️ 上述约定随之不再适用（本用例已无 repeat_until、也不再断言任何写工具）。
      - code: "123456"
        fallback: "确认下单"
        form_values:
          customer_name: "张三"
          customer_phone: "13800138000"
          customer_address: "浙江省杭州市西湖区文三路1号1幢101室"
          color: "2699-03暖米色"
          colorName: "2699-03暖米色"
    expectations:
      - tool: product_detail
    # ── 2026-09-24（issue #5247，用户裁定 2026-09-23「B 端米宝只读化」）──
    # `order_create` 已从 B 端全部 skill 解绑 ⇒ 本用例断言的写能力（B 端下单 + 加工项
    # 按计价数量建单落库）在 B 端不复存在，用例退役（条目不删除，理由见 skip_reason）；
    # 能力面改判到存活的只读路径 `product_detail`（商品/SKU 查询仍是 B 端能力），行为面
    # 改判为「如实说明 + 引导去后台订单管理页面」（见 data_checks）。
    # 逐条作废的原声明（原文留档见 merge_log）：`expectations[order_create]`、
    # `must_succeed[order_create]`、`amount_verify[order_create: unit_price/subtotal/
    # processing_fee/total]`、`db_verify[order_items ← source=order_create]`、
    # `user_inputs[2].repeat_until{tool_called: order_create, max: 8}` —— 这些机器判据全都
    # **靠 order_create 的成功调用取数** ⇒ 该工具不在 B 端工具集里时运行时永远取不到
    # （悬空声明），故整块移除，而不是改指向另一个工具（改指向会造出假断言）。
    # ── 前置自断言 + 自清理（issue #4450 的 burn-down 缴费；metric=entries ⇒ 必须整条销账）──
    # 本用例命中的两条存量违规 = CASE-TRUST-NO-SELF-CLEAN + CASE-TRUST-NO-PRECONDITION-ASSERTION。
    # `precondition[product_count_for_keyword]`：本用例按**商品名**定位明细行（`amount_verify` /
    # `db_verify` 都写死「2699系列雪尼尔窗帘面料」），「该名字唯一」是它真正依赖且**只读**的前置
    # —— 同名副本会让 agent 合理地要求澄清 ⇒ order_create 永不发生，报告上只表现为
    # `unmatched expectation`（看起来像 agent 不干活，归因全错）。形态与口径照 OR-018 先例。
    # ⚠️ 有意**不**声明 `order_count_for_phone`：本用例自己就会建单 ⇒ 漂移判据（缺省 `max_growth: 0`）
    # 必然判红，那是「硬写一条注定红的守卫」。商品维只读 ⇒ 漂移恒为 0。
    # 断言（user_inputs / expectations / must_succeed / amount_verify / db_verify / data_checks）
    # **原样未动、无放宽**。
    namespaces:
      - "customer_phone:13800138000"
      - "product_name:2699系列雪尼尔窗帘面料"
    precondition:
      - type: product_count_for_keyword
        source: "2699系列雪尼尔窗帘面料"
        expect: 1
    data_checks:
      - "（退役，#5247）如实说明米宝只做数据查询与分析、**不提供经对话创建订单**，并引导去后台订单管理页面下单。改判前口径（留档，不再生效）—— 原三条的断言对象都是**建单产物**（金额与落库明细），随 order_create 从 B 端解绑而不成立：①「打孔 per_meter 数量 = 8.4 米，加工费 = 8.00 × 8.4 = 67.20 元（截断成 8 会变 64.00，少收 3.20）」②「订单总额 = 面料小计 23.80×3=71.40 + 加工费 67.20 = 138.60 元」③「订单明细数量落库为 3（面料米数），DECIMAL(10,2) 列不得改变整数数量的落库语义」"
      - "⚠️ 2026-09-19（issue #4571）：本用例原为 per_area（8.4 ㎡ × 30 元/㎡ = 252.00），接地夹具 `刺绣工艺` 按用户裁定真删 ⇒ 改判 per_meter 并逐值重算；**per_area 计价路径的评测覆盖随该夹具删除而移除**（如需恢复，须新增一个显式标注为评测夹具的 per_area 项）"
    skip_reason: "[backend-contract] [#5247] B 端只读化（用户裁定 2026-09-23：B 端米宝只做数据查询与分析，创建/更新能力与对应 tools 全部从 B 端移除）⇒ 本用例断言的「经对话创建订单（加工项按计价数量建单 + 金额/落库核对）」（order_create）已从 B 端下线、不再绑定任何 B 端 skill。用例条目与退役理由保留（不删除）；断言面改判为只读查询路径（product_detail）保留 + 如实说明「米宝不提供经对话创建订单」并引导去后台订单管理页面。"
    merge_log: "2026-09-14 首跑校准（issue #3666）：固定 2 轮轮次表在 B 端多步下单流程上必然跑不完（agent 只到 product_detail/interact，order_create 未发生 → 假失败），改为 repeat_until(tool_called=order_create, max=8) 协作轮（同 OR-026/OR-021 先例）；2026-09-14 新增（issue #3666）：订单数量语义放宽为 DECIMAL(10,2) 的端到端金额回归网——此前 per_area 小数面积（8.4 ㎡）会被 Integer 截断成 8 ㎡ 少收 12.00 元，且 OrderService 的 toInteger() 会让列表/详情加工费与外层金额自相矛盾。2026-09-19（issue #4431 的 burn-down 缴费 —— 本 PR 改了 cases/*.yml ⇒ 每 PR 至少净缩 1 条存量违规，metric=entries ⇒ 整条销账，取优先档 OR-*）：本条命中的**两个码一起清零** —— 补 `namespaces[customer_phone:13800138000, product_name:2699系列雪尼尔窗帘面料]`（自清理/并行互斥，CASE-TRUST-NO-SELF-CLEAN）+ 补 `precondition[product_count_for_keyword: 2699系列雪尼尔窗帘面料, expect: 1]`（可判定前置，CASE-TRUST-NO-PRECONDITION-ASSERTION）⇒ 整条从豁免清单销账。形状与 OR-016 逐字一致（同商品、同号码）。**断言面（user_inputs / expectations / must_succeed / amount_verify / db_verify / data_checks）一字未动、无放宽。** ｜ 2026-09-24（issue #5247，用户裁定 2026-09-23 B 端只读化）：order_create 从 B 端解绑 ⇒ 本用例退役（理由写在 skip_reason，条目不删除）；expectations 由 [product_detail, order_create] 改判为 [product_detail]，must_succeed[order_create] / amount_verify[order_create: unit_price, subtotal, processing_fee, total] / db_verify[order_items ← source=order_create] / user_inputs[2].repeat_until{tool_called: order_create, max: 8} 全部同步移除（否则成为永不满足的悬空声明 —— 它们都靠 order_create 的成功调用取数）；user_inputs[2] 的 `code` / `fallback` / `form_values` 三键**原样保留**（不属本包清理面）；data_checks 与新事实冲突（三条断言的对象都是建单产物：加工费/总额/落库数量）⇒ 合并改判为一条「如实说明 + 引导后台」并逐条留档原文，`#4571 per_area 覆盖损失登记` 那条**原样保留**（不属本次改动面）；namespaces / precondition / pre_clean / tags / title / truths_ref 均未动。"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_order_create_processing_quantity.py"
        - "backend/ai-agent-service/tests/test_order_create_quantity_bounds.py"
