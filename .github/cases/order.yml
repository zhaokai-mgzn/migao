          # 双端语义（2026-09-15 窄跑 34930597539 实证）：B 端代客下单**免短信验证码**、
          # 落单前必须**点击确认卡**（order_create 在确认卡未被点击时返回
          # confirmation_required_card_not_clicked）。旧声明 prefer_text=true 会无视待答
