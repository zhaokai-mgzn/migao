  # ── 状态机（合并为一条全流转用例）──
  - id: OR-006
    legacy_id: M006
    # 同义合并: 1.6 + 1.7 的状态更新段 + O004
    title: "订单状态机全流转 - 查询→确认支付→生产→发货→完成"
    domains:
      - order
    tier: normal
    tags:
      - multi_turn
      - order_lifecycle
      - status_flow
    truths_ref:
      - order.states
      - order.flow
      - order.pay-side-effects
      - order.cancel-side-effects
      - order.refund-side-effects
    user_inputs:
      - "查一下 ORD-20260701-0001 的状态"
      - "确认支付，标记为生产中"
      - "发货，物流顺丰 SF1234567890"
      - "客户确认收货了，标记完成"
    expectations:
      - tool: order_query
        args:
          action: detail
      - tool: order_manage
        args:
          action: confirm_payment
      - tool: order_manage
        args:
          action: update_status
          status: producing
      - tool: order_manage
        args:
          action: update_logistics
          company: 顺丰
      - tool: order_manage
        args:
          action: update_status
          status: completed
    data_checks:
      - "状态流转: pending → producing → shipped → completed"
      - "每步操作前先确认当前状态"
    skip_reason: "依赖生产不存在的固定测试订单 ORD-20260701-0001（API 实测 found: 0），评测数据脱节——待重构为自包含（先 order_create 建测试单再流转），否则持续假失败污染基线"
    merge_log: "eval M006 吸收 verification 1.6（单步 update_status）、1.7 的状态更新段，并吸收 eval O004（标记已发货）"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_mibao_advanced_multiturn.py"
      ci:
        - agent-eval.yml
      verifies: []

  - id: OR-007
    legacy_id: O005
