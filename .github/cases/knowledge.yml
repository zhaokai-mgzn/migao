  - id: KN-009
    legacy_id: ""
    title: "C 端知识问答**活栈**冒烟（元元）：多轮上下文 + 复合 Tool 的 SSE 事件 + 异常输入 + 快捷操作菜单"
    domains:
      - knowledge
      - chat
    tier: normal
    tags:
      - knowledge
      - smoke
      - live-stack
    truths_ref: []
    user_inputs:
      - "对**已部署**的 C 端客服（元元）跑知识库与高级 AI 对话冒烟：多轮上下文关联 / 复合 Tool 调用的 SSE 事件 / 空消息·超长消息·并发会话 / 快捷操作菜单"
    expectations:
      - tool: direct_reply
    data_checks:
      - "判据 1·活栈链路（HTTP / SSE 契约）：多轮对话上下文关联、复合 Tool 调用能产出 SSE 事件、快捷操作菜单接口返回非空列表。执行点 = tests/smoke/test_11_knowledge_ai_advanced.py"
      - "判据 2·异常输入不炸链路：空消息 / 超长消息 / 并发会话下返回结构化错误或降级，**不得 5xx 裸崩**。执行点 = 同文件的三组 `Test...SSE...`"
      - "⚠️ 真值缺口（照实登记）：活栈冒烟依赖部署环境与卡片是否已发布 ⇒ `truths_ref: []`（同 KN-001~003 的既有口径，只告警不阻塞）"
    skip_reason: "[backend-contract] **活栈冒烟**（pytest 直连已部署环境，nightly-verification 腿）：判定在 HTTP / SSE 契约与工具链路层 —— 它**不是** agent-eval 的可重放用例（评测栈无法重放活环境），故不进 agent-eval 冒烟"
    precondition: "前置 = 目标环境可达（`tests/smoke/config.py` 的 base url + 租户凭据）且该环境 C 端渠道可用；不可达时 pytest fixture 直接报错（不会伪装成「知识问答不会答」）"
    merge_log: "2026-10-08 新增（issue #6525，品牌改名）：该测试文件此前**未声明 case_ids**，本单改动它（称呼换新）后按 Growth Gate 口径补声明；用例内容如实对应该文件既有的四组冒烟，**未新增 / 未放宽**。"
    traces:
      tests:
        - "tests/smoke/test_11_knowledge_ai_advanced.py"
      ci:
        - nightly-verification.yml
      verifies: []
