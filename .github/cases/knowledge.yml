# 知识问答评测用例（LLM WIKI 板块，issue #3051/#3059）
#
# 覆盖双端知识卡片检索（词条优先）：
# - 元元（C 端消费者）：knowledge_faq → customer_knowledge skill → knowledge_search
# - 黄金策（B 端员工）：knowledge_faq → knowledge skill → knowledge_search（issue #3059 启用）
#
# 断言设计（环境无关、防 LLM 波动误报）：
# - expectations 用 tool(args) 关键字段形态：CJK 值仅校验 key 存在（query 必填）
# - 命中内容断言不做 smoke（依赖部署环境是否已发布卡片），进 normal 语义 data_check
# - persona 字段：xiaobu / mibao 各自归属，local_runner 按 persona 过滤

cases:
  - id: KN-001
    legacy_id: ""
    title: "元元知识问答 - 面料问题先检索本店知识卡片（query 必填）"
    domains:
      - knowledge
      - chat
    tier: smoke
    tags:
      - knowledge
      - wiki
      - smoke
      - xiaobu
    truths_ref: []
    persona: xiaobu
    user_inputs:
      - "雪尼尔面料会不会起球"
    expectations:
      - tool: knowledge_search
        args:
          query: 雪尼尔
    data_checks:
      - "knowledge_search 返回后会话正常结束（无报错）；命中则基于卡片回答并注明「来自本店知识库」，未命中用通用行业建议兜底，不得编造本店事实"
    skip_reason: ""
    merge_log: "2026-09-08 新增（issue #3059 知识问答评测闭环）：C 端元元知识卡片优先回归——此前知识域零 LLM 级冒烟覆盖"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_tools_knowledge_search.py"
        - "backend/ai-agent-service/tests/test_customer_knowledge_simplified.py"
      ci:
        - pr-check.yml
      verifies: []

  - id: KN-002
    legacy_id: ""
    title: "元元知识问答 - 清洗保养类问题走知识卡片检索"
    domains:
      - knowledge
      - chat
    tier: normal
    tags:
      - knowledge
      - wiki
      - xiaobu
    truths_ref: []
    persona: xiaobu
    user_inputs:
      - "窗帘多久洗一次？"
    expectations:
      - tool: knowledge_search
        args:
          query: 清洗
      - "success=true"
    data_checks:
      - "知识卡片命中时回答基于卡片内容并注明来源；未命中时如实告知知识库暂无收录，用通用行业建议谨慎回答"
    skip_reason: ""
    merge_log: "2026-09-08 新增（issue #3059）：元元知识问答日常回归（清洗保养子域）"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_tools_knowledge_search.py"
      ci:
        - agent-eval.yml
      verifies: []

  - id: KN-003
    legacy_id: ""
    title: "黄金策知识问答 - 本店售后政策先检索知识卡片（B 端接线回归，issue #3059）"
    domains:
      - knowledge
      - chat
    tier: smoke
