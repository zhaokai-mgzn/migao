    user_inputs:
      - "我们店的退换货政策是什么？"
    expectations:
      - tool: knowledge_search
        args:
          query: 退换货
    data_checks:
      - "黄金策知识问答走知识卡片检索（B 端 skill 接线不可回退）；命中基于卡片回答，未命中通用兜底不编造本店事实"
    skip_reason: ""
    merge_log: "2026-09-08 新增（issue #3059）：黄金策启用 knowledge skill 后的接线回归——防止 future 再次注释禁用导致 B 端知识问答静默退化"
    traces:
      tests:
        - "backend/ai-agent-service/tests/test_tools_knowledge_search.py"
        - "backend/ai-agent-service/tests/test_graph_skills.py"
      ci:
        - pr-check.yml
      verifies: []

  - id: KN-006
    legacy_id: ""
    title: "文档提炼 - 有效售后文本必须产出候选进待确认队列（P1-1 回归，issue #3063）"
    domains:
