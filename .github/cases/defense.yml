      - "旧 bucket-name（OSS_BUCKET_NAME）为空时 delete/generatePresignedUrl 回退使用永久 Bucket（OSS_PERMANENT_BUCKET）"
    skip_reason: "启动契约由 Java 单测验证（OssConfigFailFastTest/OssConfigTest/OssServiceTest），非 LLM 行为，不进入 agent-eval 冒烟"
    merge_log: "2026-08-27 新增：文件存储固定使用阿里云 OSS，移除本地磁盘降级路径，配置缺失启动失败"
    traces:
