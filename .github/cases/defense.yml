      # `product_search` / `validate_input` 被摘除、改名或不再对 mibao 域开放 ⇒ R1/R2/R3 的期望
      # `unmatched`，判红会伪装成「agent 不防注入」，归因错人（同族实证：PG-013 重试前置不成立）。
      # 口径：`assertion_taxonomy.declares_precondition` ② —— data_checks 里含前置关键词**且**是
      # 机器计分型，故本条带 `success=true`（= 计分标记，不新增断言强度）。
      # 真值可核（本仓逐行）：`backend/ai-agent-service/app/tools/validate_input.py` 的
      # `name = "validate_input"`，且被 `app/tools/__init__.py` 与 `app/tools/registry.py` 导入注册；
      # `registry.py` 的 `get_tool("product_search")` 消费面存在。
      # **断言面（user_inputs / expectations / 既有两条 data_checks）一字未动、无放宽。**
