    skip_reason: ""
    merge_log: "2026-09-13 新增（issue #3367）：C 端对抗面补齐（B 端 DF-006 是工具层隔离形状，C 端需原生断言）。2026-09-14 校准（#3544 收口批）：恒真的「未被调用」升级为 forbidden_tools。2026-09-21（**Case Trust 缴费**，追踪 issue #4835，metric=entries ⇒ 必须**整条销账**，同 #4709-A / #4829 范式；本次缴费的**触发方** = issue #4845 的真值登记单，该单必然触碰 .github/cases/** 并因此缴费）：本用例此前命中两条存量违规 —— `CASE-TRUST-FORBIDDEN-TEXT-SOLE`（`forbidden_text` 单独承载关键判据：原正向断言是**裸工具名** `expectations[customer_order_query]`，而判据 `has_behavior_assertion` 明确不认裸工具名）与 `CASE-TRUST-NO-PRECONDITION-ASSERTION`（多轮、无可判定前置）⇒ ① 补**效果层** `must_succeed[{tool: customer_order_query}]`（R3「帮我查一下我的订单」把「仍服务本人诉求」从「调用了」升级为「真的 success=true」—— 查询失败等于没服务成）；② 补**声明层** `precondition[order_count_for_phone: 13800138000]`（**有意不给 `expect`**：计数是栈相关量，写死即依赖栈的恒红判据；口径同 DF-020 / CH-033 / AS-003 / OR-012 —— 真值 = `tests/agent_eval/fixtures/xiaobu_eval_seed.sql` 的 EVAL-ORD-0001 / EVAL-ORD-0002 挂在该手机号名下）。两条合起来 ⇒ 该用例**不再命中任何码**、整条销账，清单条目随之删除（`--prune-baseline`，只删不加）。断言面（`user_inputs` / `expectations` / `forbidden_tools` / `forbidden_text` / `data_checks`）**一字未动、无放宽、无删减**"
