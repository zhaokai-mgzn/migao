# cases/defense.yml — 防御性用例（并源转换）
# 来源：eval D001~D014 + L001 → 15 条
#
# ★ 三处用例预期与代码校准（merge_log 已记录）：
#   - D002「max_iterations=8」与代码默认一致（skill_config 字段默认 8；docstring「默认 5」是过时注释）
#   - D004/L001「20 条压缩」与代码不符，实际 max_recent=12（base_skill.py:819）
#   - D011「连续 5 次失败开路」与代码不符，实际 failure_threshold=3（app/core）
#   校准后 truths_ref 指向代码真值；未校准前 expectations 保留原预期并注明待校。

schema: "case-contract/1.0"
domain: defense

