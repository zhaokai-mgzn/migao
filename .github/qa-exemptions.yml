# QA Growth Gate 豁免列表
# 格式: pattern: "glob"
# 匹配的文件在 QA gate 扫描时跳过测试覆盖检查
#
# 豁免原则：
# - 纯文案修正 / 字段名对齐 / 类型定义修正（不改变交互逻辑）
# - 已有其他测试覆盖的存量页面微调
# - CI/配置/文档变更不在此列表（QA gate 不扫描这些路径）
#
# ⚠️ **条目必须"在做实事"**（2026-09-17 收紧，守卫见
# `tests/unit_ci_workflows/test_qa_exemptions_liveness.py`）：一条 pattern 只有在
# 「它盖住的文件**本来会**被判缺测」时才允许留在表里。两类死条目一律删除且不得再进：
#   · **僵尸**：pattern 匹配不到任何现存文件（文件/目录已删）—— 留着等于给同名文件的
#     未来重建预埋一张免检券；
#   · **冗余**：盖住的文件走 `tech-stack.yml` 规则本来就是 `pass` / `auto_pass` ——
#     该条**零作用**，只会在配套测试被删/改名后**静默**把缺测门禁重新撑开。
# 本轮据此清掉 24 条（2 僵尸 + 22 冗余），53 → 29；复算命令：
#   python3 -m pytest tests/unit_ci_workflows/test_qa_exemptions_liveness.py -q
# **减少能免检的面才是收紧**：不要用"加一条豁免"来让门禁变绿；也不要靠新增字段/子表
# 把判定做成"更复杂的白名单"。

exemptions:
  - pattern: "frontend/admin-web/src/types/*"
    reason: "类型定义变更不包含运行时逻辑，由 tsc 编译检查保障"

  - pattern: "backend/admin-api/src/main/resources/*.yml"
    reason: "Spring Boot 配置文件变更，纯配置无 Java 逻辑，无需单测"

  - pattern: "frontend/admin-web/src/components/ai-assistant/FloatingAssistant.tsx"
    reason: "会话管理重构：已有 tests/unit/floating-assistant.test.tsx（4 tests PASS），新增 validateAndLoad 逻辑在现有测试框架下覆盖"

  - pattern: "backend/ai-agent-service/app/tools/__init__.py"
    reason: "Tool 模块 re-export（纯 import + __all__，无运行时逻辑）；新增 CustomerOrderQueryTool 由 tests/test_tools_customer_order_query.py 直接覆盖"

  - pattern: "backend/admin-api/src/main/java/com/migao/admin/dto/agent/*"
    reason: "Agent DTO 定义 — 纯数据结构无运行时逻辑，由编译检查保障"

  # #1482 — ApiResponse/BusinessException 加 suggestion 字段（纯增强）
  - pattern: "backend/admin-api/src/main/java/com/migao/admin/exception/BusinessException.java"
    reason: "#1482 纯字段新增（suggestion + 4-arg 构造函数），已有 BusinessExceptionTest (8 tests) 覆盖全行为"
  - pattern: "backend/admin-api/src/main/java/com/migao/admin/config/GlobalExceptionHandler.java"
    reason: "#1482 纯透传 suggestion 到 ApiResponse，已有 GlobalExceptionHandlerTest 覆盖"

  # #1483 — Agent BFF 端点（Service 在主干已有方法，仅新增 Controller）
  - pattern: "backend/admin-api/src/main/java/com/migao/admin/controller/agent/*.java"
    reason: "#1483 纯新增 Agent BFF Controller，Service 端方法已合并在 main，单测覆盖 Service 层方法（AgentProductServiceTest 14 tests / AgentOrderServiceTest 5 tests），Controller 仅是薄包装"

  # #1720/#1723 — 米宝语音输入 ASR + 前端录音交互
  # ⚠️ 本条原为 `app/llm/router.py` 的**冗余豁免**（issue #5353 落地时删）：成因 = 规则侧只能
  # 猜 `tests/test_llm_router.py`（不存在），而它的真实覆盖名叫 `test_vision_integration.py`。
  # #5353 在 `.github/tech-stack.yml` 为该文件逐条登记后规则侧判 **pass** ⇒ 豁免变成死条目，删除。
  # 附带订正原 reason 的一半证据：`tests/test_llm_pipeline.py` 在 `pytest.ini` 的 `addopts --ignore=`
  # 里（**永不收集**）⇒ 它不能充当任何映射目标（同 #5353 的第三形态）。

  - pattern: "frontend/admin-web/src/hooks/useVoiceRecorder.ts"
    reason: "#1720 语音录音 hook，浏览器 API 封装，依赖运行时环境"

  # WebM→opus 格式映射修复

  # ── 三大模块自洽性修复（fix/eval-case-role-compat #2575）──
  # ⚠️ 本条原为 `app/suggestions/follow_up.py` 的**冗余豁免**（issue #5353 落地时删）：
  # 它的配套测试名 `tests/test_follow_up_suggestions.py` 不符合任何模板 ⇒ 只能靠豁免绕开。
  # #5353 为该文件逐条登记规则后规则侧判 **pass** ⇒ 豁免变成死条目，删除。

  # ── #3081 快捷回复功能下线：移除 quick_reply 兜底文案/意图标签（gate 模板命名不符，已有测试覆盖）──
  # ⚠️ 本条原为 `app/core/fallback.py` 的**冗余豁免**（issue #5353 落地时删）：成因 = `app/core/`
  # 没有显式规则，兜底产出 `tests/test_core/fallback.py`（**不带 test_ 前缀 ⇒ pytest 永不收集**）。
  # #5353 为 `app/core/` 补上显式规则（模板 `tests/unit/test_{1}.py`，命中既有的
  # `tests/unit/test_fallback.py`）⇒ 规则侧判 **pass** ⇒ 豁免变成死条目，删除。
  # ⚠️ 同一行历史上还替 `app/suggestions/preference_tracker.py` 挡过（issue #5329 删除），
  # 两处的成因**同源**：都是「门禁看不见既有测试」，而不是「没有测试」。
  # 另：`app/core/{circuit_breaker,admin_api_cache}.py` 也随 #5353 从 BLOCK 转 **pass**
  # （它们此前**连豁免都没有**，改动即被要求去建 `tests/test_core/<name>.py`）。

  # ── 历史分支 UI 重设计组件 break-glass（#2575）——2026-09-18 用户裁定：**整块 19 条删除** ──
  # 被删范围（reason 统一为「#2575 随分支部署，本次未改其逻辑」）：chat 9 / dashboard 3 / ui 5 /
  # providers 1 / ops 1。一次性授权从未过期 = 永久门票，不许留 —— 这些组件此后**按正常规则受检**：
  # 改动即需配套 `frontend/admin-web/tests/unit/components/<Name>.test.ts(x)`，否则 QA Growth Gate 阻塞。
  # （session-insight.ts 豁免随 main 的 24 条清理一并删除，本行仅保留裁定说明）
