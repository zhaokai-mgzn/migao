name: processing-manage
description: 加工项/加工分类管理
red_flags: []
business_truths:
  - [processing-manage.crud] 加工项支持 CRUD
  - [processing-manage.scan-position-detail-keys] 扫码读面（`GET /api/admin/production/scan` 与 `GET /api/worker/production/scan`，两处**同一份实现**）的 `positions[]` 追加 9 个**部位明细键**：`width` / `height` / `craft` / `curtain_type` / `open_count` / `cutting_mode` / `fullness` / `is_shaped` / `fabric_meters`（用料 = 算料快照）。**只加不改**：既有 `order_item_id` / `position_kind` / `position_name` / `remark` 与它们的值**一字未动**；新键**逐字取库/取快照**、**不在 Java 侧重算**；缺失 ⇒ 键恒在且 `null`（**不造 0**）。⚠️ **不新增 `position_remark` 别名** —— 部位备注的既有键是 `remark`（同一事实不得有两个键名；`remark` 见 issue #5685）
  - [processing-manage.worker-cutting-height-terminal] 一体机（机台模式，母单 #5161）：`GET /api/worker/production/cutting-height?token=…`（工人 session 准入、**零商家权限码**、无 session ⇒ 401）按码定位订单 ⇒ 逐部位回 `base`（成品高）/ `cutting_height` / `rounding` / `hits[]` / `misses[]` / `missing[]`；命中与取整**复用** `CuttingHeightConfigService.preview`（不写第二份口径），命中而**未配置取值**的项（如「画线」）显式进 `missing` 且**不计入、不按 0 算**；页面（`frontend/worker-h5/machine.html`）常驻扫码枪输入**不依赖 focus**、兼容 `CR+LF`/双 Enter、输入法兜底，【完成】= 报工走**既有** `POST /api/worker/production/scan/complete`（**只发 token + 幂等键**；工序/数量/身份由服务端定）。🔴 **只算不写机器**：任何路径都不开串口 / 不发 Modbus（下发归上游裁剪机接入设计单）
  - [processing-manage.worker-page-config] 工人端**页面开关**（租户级，母单 #5161）：表 `worker_page_configs`（迁移 V141，单行/租户）；`GET/PUT /api/admin/worker-page-config`（读挂 `production:view`、写挂 `processing:manage`；PUT **全量替换**，缺键/未知键/非法页名 ⇒ 422 逐条理由，缺行 ⇒ 读面回**默认四页全开** + `source='default'`，变更进租户参数审计）；工人侧 `GET /api/worker/me` 下发 `pages[]`。🔴 **工人零商家权限**：session/JWT 的 `permissions` 恒 `[]`、`/api/admin/**` 对 `worker` 仍 403。🔴 工人 session 闲置超时**全局默认 = 一周（10080 分钟）**（用户 2026-09-29 裁定「改全局默认值，手机端同长」）—— ⚠️ 闲置保护因此**基本不再生效**，共用设备上防「上一个人的活记到上一个人头上」的**唯一护栏 = 手动「切换工人」**（切换/换人仍**立即**失效旧会话）
  - [processing-manage.cutting-height-config] 裁高（定高）配置：`裁剪高度(部位) = 成品高 + Σ(命中且启用的增量项)`，按取整规则输出；增量项是**租户级档案**（key / 名称 / 取值 / 方向 add|subtract / 是否接高 / 命中口径 / 启停 / 顺序）；命中口径**复用** `production_route_rules` 的 `trigger_kind`（option 特殊选项 / craft 工艺 / processing_item 加工项 / shaped 定型）+ `trigger_value`（**逐字**）+ `position`（部位限定，null = 不限），**不另写第二份匹配**；**命中而未配置取值**的项（壁达的「画线」即此形态）显式进 `misses(reason=unresolved)` 且**不计入合计、不按 0 算**；缺行 ⇒ 读面回默认种子（壁达现场 7 项，画线留空）+ `source='default'`；PUT 全量替换，缺键 / 未知键 / 非法值 ⇒ 422 逐条理由（不静默回退默认值）；默认取整 = 保留三位小数（机器支持三位小数）；**本版只算不写机器**（不下发）。端点：`GET/PUT /api/admin/production/cutting-height-config`、`POST /api/admin/production/cutting-height-config/preview`。设计单：docs/design/cutting-height-config-and-terminal.md
  - [processing-manage.order-judge] 含加工订单判定逻辑
  - [processing-manage.category-sort] 加工分类支持排序
  - [processing-manage.pricing-methods] 加工项计价方式仅 per_meter/per_set/fixed/per_area（行业加工费按米计价、辅料含在加工费中）；无 per_piece 与「每米数量」密度（issue #3005 回滚 #2986）

# ── 已否证真值（issue #4430 / B3）──────────────────────────────────────────────
# 原条目 `[processing-manage.product-link] 加工项关联商品` 已被后续 issue **否证**：
# 「商品 ↔ 加工项」绑定彻底解耦（加工项是**店铺级目录**，与商品无关），关联表
# `product_processing_items` 已由迁移 DROP。此处**不是**「删掉就完事」—— 删掉是静默的：
# ① 用例侧若还留着 truths_ref 只会得到「真值 ID 不存在」（分不清「否证」与「打错字」）；
# ② 模板里留着未标注的过期条目则**永远不红**（`truths.py check` 只看引用完整性、不看真值内容）。
# ⇒ 用 `retired_truths` 显式登记否证依据，由 `truths.py check` 判红：
# 被登记的 ID 不得再被 `.github/cases/**` 引用，也不得仍留在 `business_truths`。
retired_truths:
  processing-manage.product-link:
    retired_by: 4371
    reason: "「商品 ↔ 加工项」绑定已彻底解耦（issue #4371）：加工项为**店铺级目录**、与商品无关，关联表 product_processing_items 已 DROP；加工项改由店铺级目录（processing_item_query，不带商品分类参数）取"

primary_specs:
  - tests/e2e/specs/catalog/processing.spec.ts
  - backend/admin-api/src/test/java/com/migao/admin/controller/ProcessingItemControllerTest.java

reviewer_asserts:
  - API: GET /api/admin/processing-items?page=1&size=10
    expect: items 非空 AND total >= 0
  - API: GET /api/admin/processing-categories
    expect: data 非空
  - API: POST /api/admin/processing-items
    expect: status = 200 OR status = 201
  - 含加工判定: GET /api/admin/orders?category=含加工订单
    expect: items 中每条 has_processing=true

confidence_required: 80%
common_pitfalls:
  # 「加工项关联商品未级联更新」已随 issue #4371 解耦删除（关联表已 DROP，不存在级联更新）
  - 含加工订单误判
