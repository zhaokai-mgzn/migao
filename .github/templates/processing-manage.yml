name: processing-manage
description: 加工项/加工分类管理
red_flags: []
business_truths:
  - [processing-manage.crud] 加工项支持 CRUD
  - [processing-manage.scan-position-detail-keys] 扫码读面（`GET /api/admin/production/scan` 与 `GET /api/worker/production/scan`，两处**同一份实现**）的 `positions[]` 追加 9 个**部位明细键**：`width` / `height` / `craft` / `curtain_type` / `open_count` / `cutting_mode` / `fullness` / `is_shaped` / `fabric_meters`（用料 = 算料快照）。**只加不改**：既有 `order_item_id` / `position_kind` / `position_name` / `remark` 与它们的值**一字未动**；新键**逐字取库/取快照**、**不在 Java 侧重算**；缺失 ⇒ 键恒在且 `null`（**不造 0**）。⚠️ **不新增 `position_remark` 别名** —— 部位备注的既有键是 `remark`（同一事实不得有两个键名；`remark` 见 issue #5685）
  - [processing-manage.worker-cutting-height-terminal] 一体机（机台模式，母单 #5161）：`GET /api/worker/production/cutting-height?token=…`（工人 session 准入、**零商家权限码**、无 session ⇒ 401）按码定位订单 ⇒ 逐部位回 `base`（成品高）/ `cutting_height` / `rounding` / `hits[]` / `misses[]` / `missing[]`；命中与取整**复用** `CuttingHeightConfigService.preview`（不写第二份口径），命中而**未配置取值**的项（如「画线」）显式进 `missing` 且**不计入、不按 0 算**；页面（`frontend/worker-h5/machine.html`）常驻扫码枪输入**不依赖 focus**、兼容 `CR+LF`/双 Enter、输入法兜底，【完成】= 报工走**既有** `POST /api/worker/production/scan/complete`（**只发 token + 幂等键**；工序/数量/身份由服务端定）。🔴 **只算不写机器**：任何路径都不开串口 / 不发 Modbus（下发归上游裁剪机接入设计单）。🔴 **空值容忍**（issue #6219）：`order_items.product_id` **可为空**（存量明细）⇒ 该行的 `brand` 如实回 `null`，**不得**让整个读面 500 —— 品牌索引表在空集时也必须是**可索引**的表（`Map.of()` 是 `ImmutableCollections`，`get(null)` **抛 NPE**；`LinkedHashMap` / `Collections.emptyMap()` 的 `get(null)` 返 `null`）
  - [processing-manage.worker-page-config] 工人端**页面开关**（租户级，母单 #5161）：表 `worker_page_configs`（迁移 V141，单行/租户）；`GET/PUT /api/admin/worker-page-config`（读挂 `production:view`、写挂 `processing:manage`；PUT **全量替换**，缺键/未知键/非法页名 ⇒ 422 逐条理由，缺行 ⇒ 读面回**默认四页全开** + `source='default'`，变更进租户参数审计）；工人侧 `GET /api/worker/me` 下发 `pages[]`。🔴 **工人零商家权限**：session/JWT 的 `permissions` 恒 `[]`、`/api/admin/**` 对 `worker` 仍 403。🔴 工人 session 闲置超时**全局默认 = 30 天（43200 分钟）**（用户 2026-10-07 裁定「延长到 1 个月」；上一版 = 一周 10080，2026-09-29 裁定「改全局默认值，手机端同长」）—— ⚠️ 闲置保护因此**不再生效**，共用设备上防「上一个人的活记到上一个人头上」的**唯一护栏 = 手动「切换工人」**（切换/换人仍**立即**失效旧会话）
  - [processing-manage.cutting-height-config] 裁高（定高）配置：`裁剪高度(部位) = 成品高 + Σ(命中且启用的增量项)`，按取整规则输出；增量项是**租户级档案**（key / 名称 / 取值 / 方向 add|subtract / 是否接高 / 命中口径 / 启停 / 顺序）；命中口径**复用** `production_route_rules` 的 `trigger_kind`（option 特殊选项 / craft 工艺 / processing_item 加工项 / shaped 定型）+ `trigger_value`（**逐字**）+ `position`（部位限定，null = 不限），**不另写第二份匹配**；**命中而未配置取值**的项（壁达的「画线」即此形态）显式进 `misses(reason=unresolved)` 且**不计入合计、不按 0 算**；缺行 ⇒ 读面回默认种子（壁达现场 7 项，画线留空）+ `source='default'`；PUT 全量替换，缺键 / 未知键 / 非法值 ⇒ 422 逐条理由（不静默回退默认值）；默认取整 = 保留三位小数（机器支持三位小数）；**本版只算不写机器**（不下发）。端点：`GET/PUT /api/admin/production/cutting-height-config`、`POST /api/admin/production/cutting-height-config/preview`。设计单：docs/design/cutting-height-config-and-terminal.md
  - [processing-manage.craft-config-routing-gaps] **工艺路线缺口**（`GET /api/admin/production/routing-gaps`，issue #4923 的 Agent 读面）：两部分 —— ① `unrouted_operations[]` = **有活跃工序但没进任何活跃路线**的工序（读时归一后的 `name` + 库里的 `library_name` / `group_name` / `unit` / `unit_price`）；判据 = 工序的**归一逻辑名**是否被某条路线模板的 `mainline` 消费（不是比库里的变体名）。⚠️ **「有意挂起」不是缺口**：等客户输入的工序（`pending_confirmation=true`，issue #4261 的提问清单）单列计数 `pending_confirmation_total`，其 `note` 逐字说明「有意挂起、等客户输入，不是系统漏了；客户回复前不要替它编工序/单价」。② `signal_keys_without_route[]` = **库里连路线模板都没有**的部位×工艺信号组合（`route_key` = `部位×工艺`）；判据 = 该部位取不到专属模板**且**也没有默认模板兜底（默认模板能兜 ⇒ 不算缺口）。响应另带 `unrouted_operation_total`。
  - [processing-manage.craft-config-route-signals] **路线信号映射（存量单兜底表）**（`GET /api/admin/production/route-signals`）：返回 `total` + `signals[]`（`signal` / `curtain_type` / `craft` / `priority` / `status`）。🔴 自 issue #4452 起该表**降级为存量单兜底**：部位改走 `componentRole` 受控枚举、工艺改走加工项的显式声明 `processing_items.craft_hint`；**三个写面（POST/PUT/DELETE）已删除（404）**，读面留存只为排查历史单的派生来源。⇒ 它不是「新增映射的入口」。
  - [processing-manage.craft-config-routing-anomalies] **路线来源异常订单清单**（`GET /api/admin/production/orders/routing-anomalies`，issue #4452 交付物 ④）：逐条列出 `route_source ∈ {default, partial}` 的加工单（`processing_order_no` / `order_id` / `route_key` / `route_requested_key` / `route_source` / `suggestion`）—— `default` = 部位与工艺都没填、系统取了默认路线；`partial` = 只填了一维（另一维取默认）。**为什么要有这个面**：信号映射退场后，「部位/工艺是猜的或没填」必须可观测，否则退场只是把静默错配从「猜错」换成「悄悄落默认」。⚠️ 库里**缺路线**（`missing_route`）**不在**本清单，由 `GET /routing-gaps` 承担。
  - [processing-manage.craft-config-fee-combinations] **加工费组合定价表**（`GET /api/admin/production/processing-fee-combinations`，V68 / issue #4386）：用户裁定（2026-09-19）「不是每个加工项收取一个费用，而且通常是组合」⇒ 商家在配置阶段自行组合并定价。返回 `combinations[]` + `total`，每行 = `composition_key`（归一化键，与书写顺序无关）+ `items[]`（由 key 按 `+` 拆出的有序特征名，**不维护第二份口径**）+ `unit_price` + `unit`（恒 `元/米`）+ `status` / `sort_order` / `source` / `updated_at`。写面（POST 新建 / PUT 改价 / DELETE 停用）同族但**只读面**由 Agent 消费。
  - [processing-manage.craft-config-fee-gaps] **加工费缺口**（`GET /api/admin/production/processing-fee-gaps`）：**订单里实际出现过、但「加工费组合」里查不到价的选配组合**（把「只会在顾客下单后才发现漏配价」变成配置阶段就能看见的待办）。返回 `unpriced_combinations[]`（`composition_key` / `items[]` / `order_count` / `note`）+ `unpriced_combination_total` + `scanned_order_items` + `scanned_truncated`。排序 = 成交热度降序、同热度按键稳定排序（顺序不得随机）。🔴 **不发明任何默认价** —— 缺口就是缺口；`scanned_truncated=true` ⇒ 只扫了最近的一批订单（不得当全量）。
  - [processing-manage.craft-config-stuck-points] **生产卡点报表（A 模式）**（`GET /api/admin/production/stuck-points`，可选 `processing_order_id`，issue #4776）：A 模式**只查「没开工」那一种**卡点（用户裁定②-3）；判据 = 该工序实例未开工 + **立即前道已完成** + 等待超过阈值。返回 `mode` / `threshold_hours` / `threshold_source`（「阈值从哪来」必须可解释；默认取全局常量 `migao.production.stuck-point.wait-threshold-hours`）/ `scope` / `states`（not_started / in_progress / completed 三态计数）/ `stuck_total` / `stuck[]`（`kind` / `set_no` / `position` / `operation` / `predecessor` / `stalled_hours` / `threshold_hours` / `threshold_source`，按 `stalled_hours` 降序）。🔴 「卡了多久」取**前道 `done_at`**，**绝不用 `updated_at`**（会被任何更新污染 ⇒ 静默给错数）。B/C 模式（「开了没完」）不在本片。
  - [processing-manage.order-judge] 含加工订单判定逻辑
  - [processing-manage.category-sort] 加工分类支持排序
  - [processing-manage.pricing-methods] 加工项计价方式仅 per_meter/per_set/fixed/per_area（行业加工费按米计价、辅料含在加工费中）；无 per_piece 与「每米数量」密度（issue #3005 回滚 #2986）

# ── 已否证真值（issue #4430 / B3）──────────────────────────────────────────────
# 原条目 `[processing-manage.product-link] 加工项关联商品` 已被后续 issue **否证**：
# 「商品 ↔ 加工项」绑定彻底解耦（加工项是**店铺级目录**，与商品无关），关联表
# `product_processing_items` 已由迁移 DROP。此处**不是**「删掉就完事」—— 删掉是静默的：
# ① 用例侧若还留着 truths_ref 只会得到「真值 ID 不存在」（分不清「否证」与「打错字」）；
# ② 模板里留着未标注的过期条目则**永远不红**（`truths.py check` 只看引用完整性、不看真值内容）。
# ⇒ 用 `retired_truths` 显式登记否证依据，由 `truths.py check` 判红：
# 被登记的 ID 不得再被 `.github/cases/**` 引用，也不得仍留在 `business_truths`。
retired_truths:
  processing-manage.product-link:
    retired_by: 4371
    reason: "「商品 ↔ 加工项」绑定已彻底解耦（issue #4371）：加工项为**店铺级目录**、与商品无关，关联表 product_processing_items 已 DROP；加工项改由店铺级目录（processing_item_query，不带商品分类参数）取"

