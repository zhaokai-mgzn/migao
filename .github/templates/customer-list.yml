name: customer-list
description: 客户列表/详情类需求（含客户标签管理）
red_flags: []

business_truths:
  - [customer-list.search-fields] 客户列表 GET /api/admin/customers 支持 keyword 搜索，对**三列**做 LIKE 子串匹配：微信昵称(wechatNickname)、账户手机号(phone)、**默认收货电话**(default_receiver_phone，issue #4436 —— 发货页按订单收货电话反查客户档案时，收货电话可以≠账户手机号)；不存在"姓名/name"字段
  - [customer-list.filters] 客户列表支持 sourceChannel、vipLevel 精确(=)筛选，多条件为 AND 关系
  - [customer-list.sort-page] 客户列表按 createdAt 倒序排序；分页 page 默认1、size 默认10，单页上限500
  - [customer-list.detail-shape] 客户详情 GET /api/admin/customers/{id} 返回 data={id, profile, tags, orders, sessions} 四部分；profile 里的 totalOrders/totalConsumption 统计字段与 RFM 分(rScore/fScore/mScore/rfmTotalScore) **仍然存在（key 不删）但一律是 null** —— 它们**没有计算逻辑**（issue #5362 的字段级真值声明），读面不得把 DB 列默认值 0 / 30 当真值（口径见 customer-list.field-truth）；有真值的字段（vipLevel/customerStatus/sourceChannel/registeredAt/lastActiveAt/phone/wechatNickname/tags/craftMode 等）照常返回
  - [customer-list.detail-joins] 详情 orders 按 customer_phone=profile.phone 关联最近10条(createdAt 倒序)；sessions 按 customer_id 关联最近10条；不存在客户返回 404
  - [customer-list.enums] 客户档案状态枚举：vipLevel ∈ normal/vip1/vip2/vip3；customerStatus ∈ active/silent/churn_warning/churned；lifecycleStage ∈ new/growing/mature/declining/churned；gender ∈ male/female/unknown
  - [customer-list.no-create-api] 无 POST /api/admin/customers 创建接口；建档由 createFromSession / createFromOrder 触发，首次下单自动建档 totalOrders=1、sourceChannel=order
  - [customer-list.partial-update] 客户档案更新(PUT)为部分更新：仅更新请求体中的非空字段，未传字段保持不变；不存在的 id 返回 404
  - [customer-list.physical-delete] 删除客户(DELETE)为物理删除(removeById)，删除后再次 GET 返回 404
  - [customer-list.phone-unique] 手机号唯一性：createCustomer 按 phone+tenantId 查重，重复抛 422 "该手机号已存在客户档案"
  - [customer-list.tenant-isolation] 租户隔离由 MyBatis-Plus TenantLineInnerInterceptor 在 SQL 层自动注入 tenant_id 列（忽略 tenants/tenant_applications/platform_admins），不同租户看不到彼此客户/标签/订单/会话；tenantId=-1 或 super_admin 跳过过滤
  - [customer-list.tags] 客户标签：GET /api/admin/customer-tags 返回租户下全部标签(createdAt 倒序)；创建标签按 name+tenantId 查重，tagType 默认 manual、hitCount 默认 0
  - [customer-list.tag-todo] 给客户添加/移除标签接口(POST/DELETE /api/admin/customers/{customerId}/tags/{tagId})为真实落库实现：addTagToCustomer 校验客户/标签存在后写入 customer_profiles.tags JSONB，重复标签幂等跳过；removeTagFromCustomer 反向删除（2026-09-09 校准：原 truth 记「TODO 空实现」已过时，代码自 #94 起即有真实实现）
  - [customer-list.api-auth] 接口权限：/api/admin/** 仅 ADMIN/SUPER_ADMIN/SERVICE 角色可访问，未认证 401、权限不足 403
  - [customer-list.ai-masking] AI 工具 customer_manage 的 list 对手机号脱敏(前3位+****+后4位)且 name 恒为 null；admin-api 原始列表接口返回明文手机号
  - [customer-list.field-truth] 客户画像**字段级真值声明**（issue #5362）：customer_profiles 的 RFM 分(r_score/f_score/m_score/rfm_total_score)、统计(total_orders/total_consumption/total_refund_amount/avg_order_value/repurchase_rate)、生命周期(lifecycle_stage/churn_risk_score/next_purchase_prediction_days)、时间(first_order_at/last_order_at) 与 wechat_unionid/avatar_url **全仓零计算逻辑**（逐字段核实；声明在 Java 侧 com.migao.admin.support.fieldtruth 的 CustomerProfileFieldTruth，注册表 = FieldTruthRegistry）⇒ **API 读面（GET 列表 / GET 详情 / PUT 更新）一律回 null（未知）**，不得把 DB 列默认值（0 / 0.00 / 30）或建档种子常量当成真值（口径同 product_skus.avg_cost 的「NULL = 未知，不猜 0」/「不得用 0 冒充成本为零」）。**同表并存有真值字段**：vip_level / customer_status / source_channel / registered_at / last_active_at / wechat_openid / phone / wechat_nickname / gender / region_* / tags / custom_fields / craft_mode / craft_profile / default_logistics_* / default_receiver_* / agent_notes（建档或 updateCustomer 非空拷贝真值级写入）**照常返回**，不得被遮蔽。机械判据 = FieldTruthSourceScan 静态扫描（声明有真值 ⇒ 源码里必须存在真值级写入点：setter / builder / SQL SET / @TableId 等框架生成；声明无真值 ⇒ 必须进读面遮蔽清单 CustomerProfileTruthMask），元守卫对全仓「列有常量默认值 ∧ 源码零写入」的病征逐条对账（未登记即红 / 台账只许缩短）。**边界**：① 不补计算（RFM/消费额/客单价的计算属产品功能，另立单且以本声明为前置）；② DB 列默认值与存量行仍是 0，列默认值/回填口径属补计算那一单；③ 建档路径（createFromSession / createFromOrder）的种子写入语义**一字未改**。

  - [customer-list.profile-view] 客户画像视图（具名跨域视图 `customer_profile` 的**按需消费**形态，issue #5456 / 族 3 · 包 3）：入口 = `GET /api/admin/customers/profile-view?limit=N`（权限码 `customer:view`，与客户列表/详情**同码** —— 客户档案含 PII，故**不**并入 `dashboard:view` 的简报表快照；路径是**字面量**，优先于 `/api/admin/customers/{id}` 这个模式，不会把 detail 请求抢过来）。返回**跨域视图内核同一形状**的确定性快照：`row_fields`（自描述：`customer_profiles` 的字段集 ≡ #5362 声明的字段集）＋ `row_meta`（`limit` / `count` / `truncated`）＋ `field_truth`（真值声明的**运输**：由 `FieldTruthRegistry.customerProfile()` **现取** —— 装配与消费两侧都不持有第二份真值判断）＋ `customer_profiles` 行数组（显式租户过滤 + `createdAt` 倒序；行键集 ≡ 声明字段集、含**线上 JSON 形态** —— 直接交给 Jackson 会把 `getRScore` 折叠成 `rscore` 而与声明对不上）。**有界 + 截断显式**：多取一行只用于判定截断，上限收敛到 `DailyBriefingService.SNAPSHOT_ROW_LIMIT`（500），Agent 侧请求 `limit` = `MAX_VIEW_ROWS`（50）。视图侧（`app/briefing/customer_profile.py`）**逐字段**输出三态 `wired` / `not_wired` / `incomplete`，不变式 **`reason is None` ⟺ `status == wired`**，且**「未知」≠「0」**：声明「无真值」的字段在行的值域里**只可能是 `null`**（不得回填 0 / DB 列默认值 0.00 / 30 / 建档种子常量），声明「有真值」的字段**照实返回**（值就是 0 / 空照原样保留 —— 那是真结论）；两侧**逐字段区分**，**不得整表一刀切**。**fail-closed**：快照未携带 `field_truth.customer_profiles` ⇒ **一个字段都不产出**（`declaration.status = not_wired` + 原因），也不得退化成「都当有真值」或「都当无真值」。**截断 ⇒ 每个「有真值」字段落 `incomplete`**（有界不许变成静默少报）。租户由调用方传入并**原样回显**（隔离关口在装配层，不由行数据反推）；同一快照 ⇒ 逐字相同输出（纯函数、不联网、不读挂钟），行序 = 装配层 SQL 口径（视图不改行序）。字段总数与两侧归属**由声明现取**（当前读数：42 字段 = 26 有真值 / 16 无真值；口径见 `customer-list.field-truth`）
  - [customer-list.profile-view-disclosure] 客户画像 action 的**披露纪律**（工具 `customer_manage(action=profile_view)`，issue #5456）：消息是模型的**唯一**输入源（消息里没有的兜底模型编不出来）⇒ 四个必须逐条点名的披露面：① 声明「无真值」的字段逐条点名，并说清它们一律是**未知** —— **不是 0、不是「从未发生」、不是默认值**；② 声明「有真值」但**本次未接线**的字段单独点名（与① **分开说、不合并** —— 一个是系统没有这项能力、一个是装配层本次没给数据）；③ **本次不完整**的字段点名 + 原因（不许读成「没问题」）；④ 输出被上限截断时点出「视图只列前 N 位，共 M 位」。全部 `wired` 时**不得**出现未接线措辞（披露不能因为总是出现而失去信息量）。端点契约：`GET /api/admin/customers/profile-view` 的**字面量留在调用点**（静态归属机具只认调用点字符串），参数恒为 `limit = MAX_VIEW_ROWS`；action 属**只读**（`read_only_actions` 含 `profile_view` ⇒ 免确认拦截、不弹确认卡）；失败走可归因的 `admin_api_failure`（error + message + 可行动 suggestion）

  - [customer-list.profile-creation] C 端登录自动建档（#3011）：小程序登录后调用 CustomerService.createFromSession(tenantId, openid, nickname, wechat_mini) 幂等上写 customer_profiles——openid+tenantId 已存在则仅刷新 lastActiveAt 返回既有档案，不存在则新建档案（vipLevel=normal/customerStatus=active/lifecycleStage=new/totalOrders=0/totalConsumption=0）；建档失败不阻断登录
  - [customer-crm.profile] 客户工艺画像与常用物流（issue #3984，M2-D）：customer_profiles.craft_mode ∈ {standard 跟随企业固定工艺算料 / economy 主动省料 / self_quoted 自报用料}；craft_profile 为工艺偏好 JSON（开数/定型/档位等默认）；default_logistics_type ∈ {express 快递 / logistics 物流专线}；default_logistics_company 为常用承运商（四季安等）。由米宝 customer_manage(update) 写入（字段白名单 + 跨端字段契约），客户详情 GET /api/admin/customers/{id} 返回，供报价协商（M3-F）读取；order_logistics.logistics_type 记录每单物流类型（V47 迁移）
  - [customer-crm.receiver-address] 客户默认收货信息（issue #4419，V70）：customer_profiles 新增 default_receiver_name VARCHAR(100) / default_receiver_phone VARCHAR(20) / default_receiver_address TEXT（**单字段文本地址**，与 orders.customer_address 同口径；单个默认地址，不做多地址簿）。写路径 = PUT /api/admin/customers/{id} 的**非空拷贝**（空白/缺省不覆盖既有值，无「清空」语义）或米宝 customer_manage(update)（3 列在工具白名单与 CustomerService 拷贝白名单同集合）；读路径 = 客户详情 GET /api/admin/customers/{id} 的 profile。消费侧：新增订单页选客户时**逐字带出**（优先于 region* 省市区拼接），发货页按订单 customerPhone **精确**命中客户带出 default_logistics_type/default_logistics_company 写入 order_logistics
primary_specs:
  - tests/e2e/specs/customers/customer-list.spec.ts
  - tests/e2e/specs/customers/customer-detail.spec.ts
  - backend/admin-api/src/test/java/com/migao/admin/controller/CustomerControllerTest.java

reviewer_asserts:
  - API: GET /api/admin/customers?keyword=<已存在手机号>
    expect: success=true 且 items 中每条 phone 或 wechatNickname 包含该关键词(子串匹配)
  - API: GET /api/admin/customers?keyword=<某客户档案的 default_receiver_phone>
    expect: success=true 且 items 含该客户（默认收货电话可被搜到 —— 发货页按订单收货电话反查的前提；issue #4436）
  - API: GET /api/admin/customers?sourceChannel=wechat_mini
    expect: success=true 且 items 每条 sourceChannel == "wechat_mini"
  - API: GET /api/admin/customers?vipLevel=vip1
    expect: success=true 且 items 每条 vipLevel == "vip1"
  - API: GET /api/admin/customers?page=1&size=1
    expect: success=true 且 data.size==1、items.length<=1，items 按 createdAt 倒序
  - API: GET /api/admin/customers/{存在id}
    expect: success=true 且 data 含 profile/tags/orders/sessions 四键；data.profile.totalOrders 与 data.profile.totalConsumption 为数值；orders.length<=10 且 sessions.length<=10
  - API: GET /api/admin/customers/{不存在id}
    expect: success=false 且 error.code=="NOT_FOUND"、HTTP 404
  - API: PUT /api/admin/customers/{id}（body 仅含 phone）
    expect: success=true 且仅 phone 被更新，未传字段(如 vipLevel/wechatNickname)保持原值
  - API: DELETE /api/admin/customers/{id}
    expect: success=true 且随后 GET 该 id 返回 404（物理删除）
  - API: POST /api/admin/customer-tags（body 含已存在 name）
    expect: success=false 且 error.code=="VALIDATION_ERROR"、HTTP 422
  - API: POST /api/admin/customers/{cid}/tags/{tagId}
    expect: success=true 但该标签关联不落库（TODO 空实现，无副作用）
  - API: GET /api/admin/customers?page=1&size=100（使用租户A token）
    expect: 所有 items.tenantId == 租户A 的 tenantId（跨租户泄露检查，SQL 层 tenant_id 注入保证）

confidence_required: 90%

common_pitfalls:
  - 用 data.orderCount / data.totalSpent 断言详情统计——实际字段在 data.profile.totalOrders / data.profile.totalConsumption
  - 用 snake_case tenant_id 断言列表项租户——Jackson 输出 camelCase tenantId
  - 把 keyword 搜索当成"姓名"搜索——代码只 LIKE 微信昵称与手机号，无 name 字段
  - 详情返回的 tags 是租户下全部标签库，不是该客户已绑定标签
  - 详情 orders 按 phone 关联，同手机号跨客户可能串单
  - 添加/移除客户标签接口恒返回成功但不落库，勿断言标签真的生效
  - admin-api 列表返回明文手机号，脱敏只发生在 AI 工具(customer_manage)层

