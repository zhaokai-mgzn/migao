name: kf
description: 微信客服通道层真值域（issue #9171）—— 加解密、回调入站、服务端 API 客户端

business_truths:
  - [kf.secret-cipher] SecretCipher 用 AES-256-GCM 加密凭据明文；密文格式 v1:<keyId>:base64(iv|ct|tag)；同一主密钥可往返，篡改密文或换主密钥必失败；空主密钥构造即失败
  - [kf.callback-crypto] 企业微信回调用 msg_signature = sha1(sort(token,timestamp,nonce,encrypt)) 校验；AES-256-CBC/PKCS7 解密后按 16 字节随机数 + 4 字节 msg_len + msg + receiveid 解析；receiveid 不匹配必失败
  - [kf.client] WechatKfClient 封装 gettoken/sync_msg/send_msg/service_state；errcode!=0 抛 KfApiException；connect 2s / read 8s；msgid 由调用方生成并原样返回
  - [kf.card-renderer] 米宝卡片在微信客服降级：业务卡→标题/摘要/链接；支付→扫码 URL；按钮→编号选项；表单→直接回复文字
  - [kf.end-human] 人工结束：trans(4) + kf_session_remote.closed_at；下条客户消息建新 epoch 会话
  - [kf.decision] 判定短路：state 非 0/1 → SILENT；人工/投诉退款等 → ESCALATE_HUMAN；默认 AI_REPLY
  - [kf.transfer] 转人工先建 agent_sessions(waiting) 再 trans(2)；trans 失败回滚工作台会话、不更新 remote
  - [kf.decision-controller] /api/internal/kf/decide|transfer 返回 decision/agent_session_id
  - [kf.send] 回复入队：校验 wechat_kf 会话 → 48h/5 条预算原子扣减 → 写 kf_outbox；预算耗尽抛异常
  - [kf.outbox-sender] sender claim pending/sending 超时 → sendText（同 msgid）→ accepted/failed；失败落 fail_type
  - [kf.outbox-mapper] outbox claim 用 FOR UPDATE SKIP LOCKED，parts 从 jsonb 转 text
  - [kf.budget] kf_send_budget 单行原子扣减：48h 窗口重置 + used<5
  - [kf.reply-controller] /api/internal/kf/reply 返回 msgid；预算耗尽 429
  - [kf.ingest] sync_msg 的 origin=3 客户消息落 sessions/session_messages；msgid 幂等；origin=5 回显忽略
  - [kf.sync-worker] dirty 游标 claim（SKIP LOCKED）→ sync_msg 循环（has_more 空列表也推进）→ ingest → 清 dirty；失败只释放 claim
  - [kf.session-remote-mapper] 同一 (open_kfid, external_userid) 当前段唯一，并发建会话用部分索引冲突静默忽略
  - [kf.token-service] 渠道 secret 解密后换 access_token，进程内缓存 7000s；secret 缺失/解不开返回 null
  - [kf.scheduler] kfScheduler 独立线程池（2 线程，kf-scheduler- 前缀），不共用默认单线程池
  - [kf.client-config] wechat.kf.enabled=true 时装配 WechatKfClient + SecretCipher
  - [kf.mapper-contract] KF Mapper 的注解 SQL 必须含目标表、幂等冲突键，并显式 tenantLine 豁免（回调无租户上下文）
  - [kf.callback-controller] 回调控制器未配置时 503（fail-closed）；GET 返回 echostr 明文；POST 回 200 空串并转交 service
  - [kf.callback-inbox] 合法回调落 kf_inbox（msg_signature 唯一）并置 kf_sync_cursor.dirty_at；重复回调仍置 dirty；坏签名拒绝；未登记渠道 200 受理但不落库

reviewer_asserts:
  - mvn: cd backend/admin-api && ./mvnw -Dtest=SecretCipherTest,WeChatKfCryptoTest,WechatKfClientTest,KfCallbackServiceTest test
    expect: 全部通过（9 条单测）

confidence_required: 100%

common_pitfalls:
  - 用空主密钥加密 → 看似加密、实则无保护
  - 只验签不解密 receiveid → 跨套件伪造回调
  - 重复回调不置 dirty → 消息丢失且无人知晓
  - 未登记渠道直接 500 → 企业微信重试风暴
