name: ai-chat
description: AI 客服对话域（意图路由 + 工具调用 + 双 Agent + confirm + SSE）

business_truths:
  - [ai-chat.intent-domains] 意图分 9 领域分组：common(问候/告别/能力/通用) / order / product / crm / hr / settings / analytics / knowledge
  - [ai-chat.intent-tool-map] 意图→工具映射：order_query→order_query、product_inquiry→product_search/detail、complaint→human_handoff、dashboard→dashboard_stats 等（INTENT_TOOL_MAP）
  - [ai-chat.handoff-offer] AI 主动引导转人工（xiaobu，handoff_judge/handoff_offer）：三类触发——D1 显式请求（"转人工/找人工…"→intent_router 短路直转 complaint，source=explicit_handoff）/ D2 商家关键词（autoHandoffKeywords→complaint）/ D3 AI 建议（judge_handoff 纯规则信号：S1 单轮负面情绪仅 general 意图 offer、S2 近 3 条用户消息 ≥2 负面 offer、S3 能力外词 offer；意图白名单 {general, after_sales} 防打断业务流；冷却 offer_count≥1 或用户拒绝后不再建议）。D3 offer 路由到 handoff_offer 确定性节点：产安抚文案 + interact choice 卡片（value"转人工客服"/"继续咨询小布"），用户确认后才走 human_handoff；显式/商家触发不经卡片直转
  - [ai-chat.route-actions] 路由 action 4 类：direct_reply（直接答）/ route_with_hint（带工具提示）/ full_agent（全 Agent）/ human_handoff（转人工）
  - [ai-chat.tool-classes] 工具分类：read_only（纯查询，无需确认）/ destructive（不可逆删除，必须弹 confirm 卡片）/ idempotent（可安全重试）
  - [ai-chat.confirm-required] 写操作（read_only=False）必须先弹 confirm 卡片，用户确认后才执行
  - [ai-chat.suggestion-on-fail] 工具失败必须返回 suggestion 字段（告诉 LLM 如何引导用户修复）
  - [ai-chat.permission-layers] 权限两层：角色检查（allowed_roles）+ 细粒度权限（required_permissions）
  - [ai-chat.context-memory] 多轮对话保持上下文（session 记忆，跨 graph 调用 state 不丢）

  - [ai-chat.escape-hatch] pending skill 会话连续性：存在 pending skill 时默认回到原 skill；仅当用户消息包含非当前域的显式触发词（查订单/物流/发货/订单/售后/退货/退款/换货/投诉/查商品/搜商品/创建商品/商品管理/客户/会员/员工/角色/权限/设置/配置/通知/快捷回复）才允许切换。不用字符数判断（中文确认消息可超 10 字，nodes.py 注释明确此点）
  - [ai-chat.validate-input] 写操作缺必填信息时 validate_input 校验并引导补全，禁止猜值
  - [ai-chat.compression] 长对话压缩：默认保留最近 12 条消息（max_recent=12），更早消息生成结构化摘要（base_skill → context_manager.compress_conversation）
  - [ai-chat.source-annotation] 当前实现无「[工具返回]」来源标注机制：SSE text 事件 data 仅 {"content"}，回复不标注数据来源（用例 8.5 的期望与实现脱节）

  - [ai-chat.agent-response] AgentResponse dataclass：content 必填；type 默认 "text"（枚举 text/tool_call/tool_result/suggestions/error）；tool_calls/metadata 默认 None
  - [ai-chat.extract-msg-content] _extract_msg_content：content 为 list 时仅拼接 type=="text" 的 text 块；re.sub(r"<think>[\s\S]*?</think>", "", content).strip() 移除 think 块（含多行 think）
  - [ai-chat.agent-context] AgentContext.to_dict 返回 6 字段（user_id/tenant_id/session_id/role/identity_type/user_name）；to_tool_context 透传 tenant_id/user_id/session_id/role 构造 ToolContext
  - [ai-chat.base-agent-init] BaseAgent.__init__：get_agent_config(agent_type)+build_agent_graph(agent_type) 组装 config/graph；tool_registry=None→create_default_registry()，非 None→用传入实例（覆盖 else 分支）
  - [ai-chat.convert-history] _convert_history：user 普通→HumanMessage(content)；content_type=="mixed" 且 images 非空→多模态 content list（text + 逐图 image_url）；assistant→AIMessage；其他 role 忽略
  - [ai-chat.initial-state-plan] _build_initial_state：plan state 最高优先（get_plan_state→json.loads→skill_name 非空即作 pending_skill），否则读 get_pending_skill；SessionMemory 异常→warning 且 pending_skill=""（不向上抛）
  - [ai-chat.initial-state-18keys] _build_initial_state 返回完整 18 键 state dict：pending_interact_skill 透传 pending_skill，agent_type/tenant_id/user_id/user_name/session_id/role 来自 self/context
  - [ai-chat.achat] achat 非流式：_convert_history+HumanMessage+set_tool_context+_build_initial_state+graph.ainvoke 后返回 AgentResponse(content=final_answer, type="text")；异常→type="error" 友好兜底（content 含"稍后重试或联系人工客服"）
  - [ai-chat.astream-tool-calls] astream_chat 工具调用：AIMessage.tool_calls 先流式 tool_calls 前文本（_extract_msg_content 提取，text_streamed 锁防重复），再逐条 yield type="tool_call"
  - [ai-chat.astream-tool-result] astream_chat 工具结果：ToolMessage→json.loads 解析（JSONDecodeError/TypeError 降级 {"data": str(content)}），积压 tool_results_queue，图执行完毕统一 yield type="tool_result"
  - [ai-chat.astream-text-suggestion] astream_chat 文本/建议/异常：final_answer 有新内容且 != 已流式文本→yield type="text"；suggestions 非空→yield type="suggestions"；异常→traceback 记录后 yield type="error"（content 含 type(e).__name__）
  - [ai-chat.agent-factory] get_greeting/get_agent/reset_agent/兼容别名：get_greeting 优先 get_direct_reply("greeting") 回退 config.greeting；get_agent 按 agent_type 单例缓存；reset_agent 清空缓存并调 reset_agent_intents_cache（ImportError/AttributeError 忽略）；CustomerServiceAgent/WorkAssistantAgent 别名映射 xiaobu/mibao
reviewer_asserts:
  - API: POST /api/ai/chat {"message":"查我的订单"}
    expect: 路由到订单域工具 AND 返回订单相关数据
  - API: POST /api/ai/chat {"message":"你好"}
    expect: 返回问候回复（greeting 意图，direct_reply）
  - API: POST /api/ai/chat {"message":"删除商品"}（destructive 工具场景）
    expect: 返回 confirm 卡片（不直接执行删除）
  - 工具调用失败场景
    expect: 返回 suggestion 字段非空 AND 提示用户如何修复
  - 多轮：第 1 轮问"查我的订单"，第 2 轮问"第 3 个呢"
    expect: 保持订单查询上下文（state 在轮次间保持）

common_pitfalls:
  - 写操作未弹 confirm 就执行（破坏性操作越权）
  - 工具失败未返回 suggestion（LLM 不知道如何修复）
  - 意图误路由（订单查询误判为商品咨询、投诉误判为普通售后）
  - 多轮对话丢失上下文（第 2 轮忘记第 1 轮的话题）
  - 越权调用：customer 角色调用 admin 工具未拦截

confidence_required: 100%
