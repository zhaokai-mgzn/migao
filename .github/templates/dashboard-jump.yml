name: dashboard-jump
description: 看板跳转类需求（#387 红牌）
red_flags: [387, 388, 389]

business_truths:
  - [dashboard-jump.processing-shipment] 含加工待发货 = 状态为待发货 且 含加工项
  - [dashboard-jump.low-stock] 待补库存 = 库存 ≤ 100 的 SKU 数
  - [dashboard-jump.real-data] 卡片数字 = 真实数据
  - [dashboard-jump.jump-url] 跳转 URL = /orders?category=含加工订单&status=待发货

  - [dashboard-jump.overview] dashboard_stats(action=overview)：经营概览（订单数/销售额）
  - [dashboard-jump.order-trend] dashboard_stats(action=order_trend)：订单趋势
  - [dashboard-jump.recent-orders] dashboard_stats(action=recent_orders)：最近订单

  # 主动发现（族 1 · 包 1，issue #5322）—— 日报的异常条目由**确定性规则**产生，不由 LLM 自由发挥
  - [dashboard-jump.proactive-deterministic] 同一数据快照 ⇒ 逐字可复现的命中集合（规则具名、阈值可复算）
  - [dashboard-jump.proactive-action-required] 无处置入口的条目不进日报（只报问题不给出口＝制造焦虑）
  - [dashboard-jump.proactive-today-only] 日报只放当天成立的异常，历史异常留给全量视图按需查询
primary_specs:
  - tests/e2e/specs/dashboard/dashboard.spec.ts
  - tests/e2e/specs/orders/order-list.spec.ts
  - frontend/admin-web/tests/unit/pages/dashboard.test.tsx

# Gate 模式 — QA Growth Gate 检查这些文件变更时，必须有对应的测试文件
reviewer_asserts:
  # 待发货订单数
  - API: GET /api/admin/dashboard/pending-shipment-count
    expect: data > 0
  # 含加工待发货订单数
  - API: GET /api/admin/dashboard/processing-shipment-count
    expect: data <= pending-shipment-count
  # 低库存 SKU
  - API: GET /api/admin/products/low-stock-by-color?threshold=100&limit=200
    expect: 每个 item.stock <= 100
  # 跳转 URL 验证
  - 跳转URL: 解析 dashboard.spec.ts 中跳转链接
    expect: 含加工待发货卡片 href = "/orders?category=含加工订单&status=待发货"

confidence_required: 100%

common_pitfalls:
  - 用 mock 数据测试（必须真实 API）
  - 跳转 URL 参数顺序错（先 status 后 category）
  - 含加工订单数与待发货数混淆
  - 卡片数字来自 mock 而非真实 DB 查询
