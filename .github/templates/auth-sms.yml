reviewer_asserts:
  - API: POST /api/auth/sms/send
    expect: HTTP 200 且 response.success=true
  - API: POST /api/auth/sms/send（60 秒内重复）
    expect: HTTP 400，message 含"发送过于频繁"
  - API: POST /api/auth/sms/login
    expect: HTTP 200，response.data.accessToken 非空 AND response.data.refreshToken 非空 AND response.data.user 含 id/nickname/role/roles/tenantId
  - API: POST /api/auth/sms/login（错误/过期验证码）
    expect: HTTP 401，response.error.code=AUTH_FAILED
  - API: POST /api/auth/admin/login
    expect: HTTP 401，response.error.code=AUTH_FAILED，message 含"密码登录已禁用"
  - API: POST /api/auth/register
    expect: HTTP 200，response.data.applicationId 非空 AND response.data.status ∈ {approved, rejected, pending}（不返回 token；AI 自动甄别，非人工待审）
  - API: POST /api/auth/register（同手机号已有 pending 或 approved）
    expect: HTTP 422，response.error.code=VALIDATION_ERROR

confidence_required: 100%

common_pitfalls:
  - 验证码未失效（应校验通过即删除，一次性使用）
  - 密码登录入口没禁用（应返回 401 而非放行）
  - token 字段名写错（是 accessToken 不是 token；user 无 name/phone）
  - 把注册写成"手机号+密码"，实际是"企业入驻申请"（companyName/contactName/phone/smsCode，无密码）
  - 忘记 60 秒防刷与每日 10 次上限
