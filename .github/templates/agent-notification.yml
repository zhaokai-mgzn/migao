name: agent-notification
description: 坐席通知域（客服会话 + 通知管理；#3081 快捷回复已随功能下线移除）
red_flags: []
business_truths:
  - [agent-notification.notification-status] 通知（notifications）状态声明 pending/sent/failed/read，但代码创建时硬编码 status="sent"，实际仅产生 sent/read 两种状态
  - [agent-notification.notification-filter] 通知列表与未读数只按 recipient_id（当前用户）过滤、不按 tenant_id；markAsRead/delete 才校验 tenantId+recipientId（非本人或跨租户返回 403 PERMISSION_DENIED）
  - [agent-notification.notification-no-api] 通知规则/模板无管理 API：NotificationRule/NotificationTemplate 无 Controller，仅 NotificationService 内部 triggerByEvent/createFromTemplate 使用
  - [agent-notification.template-vars] 通知模板变量用 {{key}} 替换，仅在 createFromTemplate/triggerByEvent 内部生效；POST /api/admin/notifications 的 variables 字段被忽略
  - [agent-notification.session-status] 客服会话（agent_sessions）状态值 waiting/active/ended/transferred（实体注释误写 closed）；实际流转仅产生 waiting→active、waiting/active→ended，transferred 无产生入口
  - [agent-notification.session-assign] 会话分配仅 waiting 可执行；目标员工必须非 offline 且其 active 会话数 < maxConcurrent（默认 5）；成功后 status=active、写 startedAt 并插入 system 消息
  - [agent-notification.session-end] 会话结束仅 active/waiting 可执行；成功后 status=ended、写 endedAt 并插入 system 消息
  - [agent-notification.session-isolation] 会话租户隔离：列表按 tenant_id 过滤；详情/分配/结束跨租户返回 404 NOT_FOUND（非 403）
  - [agent-notification.monitor] 监控面板：在线员工=status in (online,busy)，含 active/waiting 会话数与今日会话数（今日0点+8时区起）
  - [settings-notification.master-switch] 企业基础设置「启用系统通知」= tenants.notification_enabled 租户级总开关：false 时 triggerByEvent（order_created/after_sales_created/order_status_changed/after_sales_status_changed）与 triggerForTenantAdmins 跳过，不再产生新的自动站内信（历史通知保留）；null（存量租户）默认视为开启，行为不变（NotificationService#isNotificationEnabled）
  - [agent-notification.scheduled-task-trio] 定时任务（scheduled_tasks）的「三件套」criterion（为什么推）/ action_label（处置入口文案）/ action_url（处置入口地址）在库中**全为 NOT NULL** ⇒ 缺任一者不建单（服务端当场拒绝）——系统里不存在「没有处置入口的待办」。到点投递**只写站内通知**并把该行置 fired，**不执行任何业务写**（不下单 / 不改价 / 不发货）。理由：主动引擎的「没有处置入口的不发」在这里前移为「建单期不建」——运行期丢弃会让「为什么这条没发」变成不可见的静默面。
  - [agent-notification.scheduled-task-idempotent] 定时任务幂等：同租户 + 同 dedup_key 至多一条（部分唯一索引 uk_scheduled_tasks_tenant_dedup，WHERE deleted = 0 ⇒ 软删行不占位）；重复创建**返回既有那条而不报错**（重复建单是调用方的正常重试，不是业务错误）。缺省派生键 = 收件人 + 任务类型 + 触发时刻（秒）——语义「同一个人、同一类事、同一个时刻 ⇒ 只提醒一次」。
  - [agent-notification.scheduled-task-lifecycle] 定时任务状态机 pending / fired / cancelled / failed / dismissed：**只有 pending 会被扫描腿投递**；fired 后**不重投**（疲劳控制）；pending 可取消，fired / cancelled 取消无效；单轮每租户投递有条数上限（超出的仍是 pending ⇒ 下轮继续，**不丢只延后**）；单条投递失败置 failed 且不拖垮同轮其它条。

primary_specs:
  - backend/admin-api/src/test/java/com/migao/admin/controller/NotificationControllerTest.java
  - backend/admin-api/src/test/java/com/migao/admin/controller/AgentSessionControllerTest.java
  - tests/e2e/specs/settings/notifications.spec.ts

reviewer_asserts:
  - API: GET /api/admin/notifications?page=1&size=20
    expect: HTTP 200 且 $.success=true 且 $.data.total>=0 且 $.data.items 为数组
  - API: GET /api/admin/notifications/unread-count
    expect: HTTP 200 且 $.data.count>=0
  - API: POST /api/admin/notifications
    expect: 带 recipientId/recipientType/title/content 时 HTTP 200 且 $.data.status=sent；缺 recipientId 时 HTTP 422 且 $.error.code=VALIDATION_ERROR
  - API: PUT /api/admin/notifications/{id}/read
    expect: 本人通知 HTTP 200（标已读后 unread-count 减少）
  - API: PUT /api/admin/notifications/read-all
    expect: HTTP 200（read-all 后 unread-count=0）
  - API: DELETE /api/admin/notifications/{id}
    expect: 本人通知 HTTP 200；非本人/跨租户 HTTP 403 且 $.error.code=PERMISSION_DENIED
  - API: GET /api/admin/agent-sessions?page=1&size=20
    expect: HTTP 200 且 $.data.total>=0 且 $.data.items 为数组
  - API: GET /api/admin/agent-sessions/monitor
    expect: HTTP 200 且 $.data.onlineEmployeeCount>=0
  - API: GET /api/admin/agent-sessions/{id}
    expect: HTTP 200 且 $.data.messages 为数组；跨租户 HTTP 404
  - API: POST /api/admin/agent-sessions/{id}/assign
    expect: waiting 会话 HTTP 200 且详情 status=active；非 waiting HTTP 422
  - API: POST /api/admin/agent-sessions/{id}/end
    expect: active/waiting 会话 HTTP 200 且详情 status=ended；ended 会话 HTTP 422

common_pitfalls:
  - 通知列表/未读数不按 tenant_id 过滤，租户隔离仅依赖 recipientId 全局唯一
  - 通知规则/模板无 HTTP 管理端点，无法通过 API 创建/编辑规则
  - 通知创建即 sent，无 pending/failed 中间态；POST 的 variables 参数不生效
  - agent_sessions 实体注释状态写 "closed"，代码实际用 "ended"，以代码为准
  - 会话跨租户访问返回 404 而非 403，勿误判为权限校验缺失

confidence_required: 100%
