name: order
description: 订单域（状态机 + 副作用 + 含加工筛选 + 原子流转）

business_truths:
  - [order.states] 6 状态：pending(待确认) / confirmed(已确认) / producing(生产中) / shipped(已发货) / completed(已完成) / cancelled(已取消)
  - [order.flow] 状态流转：pending→{confirmed,cancelled}；confirmed→{producing,shipped,cancelled}；producing→{shipped,cancelled}；shipped→{completed}；completed/cancelled 为终态
  - [order.pay-side-effects] 确认支付(pending→confirmed)：扣减库存 + 增加销量（原子，防并发重复扣减）
  - [order.cancel-side-effects] 取消订单(pending/confirmed/producing→cancelled)：confirmed/producing 取消时恢复库存 + 减少销量
  - [order.refund-side-effects] 退款：仅 confirmed/producing/shipped/completed 可退款，恢复库存和销量
  - [order.has-processing] 含加工筛选 = hasProcessing 参数（true=只含加工，false=不含，null=不过滤）
  - [order.cancel-reason-limit] 关闭原因 ≤ 500 字符
  - [order.flow-guard] 非法状态流转 → 报错拒绝（不允许跳级，如 pending 直接到 shipped）

  - [order.statistics] order_query(action=statistics)：订单统计汇总，不接收其他参数（适用「订单统计数据」「各状态订单汇总」场景）
  - [order.follow-status-stats] order_query(action=follow_status_stats)：订单跟进状态统计，不接收其他参数
  - [order.logistics] 物流查询仅支持真实订单号：B 端 logistics_track 按 order_id 查询（订单详情→运单号→轨迹）；C 端 customer_logistics_track 仅查顾客本人已发货(在途)订单的物流（/orders/mine?status=shipped 后端强制按用户过滤）。**两端一律拒绝用户直接提供快递单号查询**（快递单号只能由系统从订单详情读取后内部查询）。用户只说「查物流」未给订单号时先询问，不得空查（READONLY）
  # ⚠️ 缺口: 订单号生成规则（ORD-yyyyMMdd-XXXX 仅来自用例示例，生成代码未确认；解析侧见 order.no-format）
  - [order.no-format] 订单号以 ORD- 前缀标识；服务端接口支持 ORD-xxx 与 UUID 双格式自动解析（AgentOrderController / AfterSalesTicketService）
  # 制单人（issue #5835，2026-09-30 用户逐字裁定）：列表「制单人」= **建单操作者**
  - [order.creator-snapshot] 订单「制单人」= 建单操作者的**员工账号**：新增 `orders.created_by`（员工 users.id）+ `orders.created_by_name`（昵称**快照**，缺失回落 username）—— **不复用** `orders.user_id`（那是下单用户 ID / C 端数据隔离依据）。B 端建单时**单点落库**；取不到（内部服务占位 internal-service / 匿名 / C 端自助下单）⇒ 两列 NULL ⇒ 列表显示「—」且**不参与**按人筛选（存量单同样 NULL，**不回填** —— 「当时是谁建的」是历史事实）。列表查询参数 `creator` 按 `created_by_name` **模糊**匹配。**订单详情不加该字段**（用户裁定）。
  - [order.create-flow] 创建订单前置：必须先调 product_detail 查 SKU；多 SKU 必须让用户选规格（颜色/售卖方式/门幅），单 SKU 直接用；禁止跳过 SKU 选择直接下单（order_create.py）
  # 发货链真值（issue #5651 收口时登记）：销售单（三联纸）与桌面纸面消费的「实发」
  - [order.shipment-actual-quantity-owner] 实发数量（这一单**实际**发了多少）的唯一真值载体 = `order_shipment_items`（shipped_quantity / unit / set_count / roll_count），与 `order_items.quantity`（**下单**数量）是两个真值；消费入口 = `OrderShipmentService.readShipment`，任何消费方（工人 H5 / 桌面纸面）不得另建第二份投影；缺值一律 null（**不填 0** —— 0 是「一件都没发」的另一个意思）
  - [order.processing-item-name-canonical] 加工项目录名与**加工费组合成员名**统一写作「韩褶」（该项的工艺声明亦为「韩褶」）；ERP 附件里写作「韩折」⇒ 与 ERP 做名称导入/核对时需要「韩折 → 韩褶」对照（2026-09-28 用户裁定「把加工项和加工费组合里面叫韩折的都改成韩褶」；存量库由 `backend/admin-api/src/main/resources/db/migration/V139__rename_hanzhe_item_and_fee_keys.sql` 改名 + 组合键重算，新建库由 `db/init/schema.sql` 基线直接种「韩褶」）
  - [order.admin-new-order-input-surface] 管理端「新增订单」页的**输入面** = 商品（含颜色）+ **净窗宽 / 净窗高**（#5202「三项输入收敛」）；门幅 / 用料米数 / 单价 / 加工类型 / 自动识别特征一律**系统推导**、常态只读展示（各自可就地「改」）；加工项区给出**系统推荐组合**（目录里的「韩褶」= 工艺默认 + 布帘的「定型」，真值源 §10；目录名见 order.processing-item-name-canonical）供**采纳 / 全不采纳**；特殊选项与部位备注收在第三步「其他」；「拍照 / 上传识别」入口挂在**商品信息**卡（2026-09-28 用户裁定）
  - [order.shipment-read-faces] 该真值有**两个读面**且共用同一份读实现 `OrderShipmentService.readShipment`：工人面 `GET /api/worker/shipment/orders/{orderId}`（工人 session 准入，零商家权限码）与管理面 `GET /api/admin/orders/{id}/shipments`（商家 session，权限码 `order:list`）；两面响应形状逐字同源；跨租户统一 404（与「订单不存在」**逐字同形**，不是 403 —— 403 等于承认该 id 存在）
