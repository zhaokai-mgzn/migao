  - [batch-ledger.dispatch-deduct] 生成加工单时由**文员指定批次**（系统给候选 + 建议值，人工确认、可改；阶段 1 建议值 = 入库日期先进先出；阶段 2a（issue #5167）起可**显式切换** best-fit，缺省仍是 FIFO）：指定批次与加工单生成**同一事务**扣减该批次余量，扣减米数 = 该订单行米数（向上进位到 0.1，与销售账扣减同一函数）；**不指派 ⇒ 不扣、不落台账、行为与今天逐字相同**；批次不存在 / 不属于该商品或 SKU / 余量不足 ⇒ **显式拒绝 + 可行动建议**（fail-closed，不得静默少扣、不得落半成品）
  - [batch-ledger.remaining-derived] 批次余量 = `stock_batches.quantity + Σ(stock_batch_consumptions.delta)`（**派生**，不原地改 `stock_batches.quantity` —— V111：批次行不可改、冲销走新单据）；消耗台账一行 = 一次批次余量变更（负 = 派工扣减、正 = 作废回补），按**批次 / 加工单 / 订单**都能查回来；加工单作废（含订单取消自动作废）⇒ 同事务**逐值对称**回补（回补量 = 原扣减量的相反数；幂等、可重跑）
  - [batch-ledger.reconcile] 路线 A 的两本账（SKU 账 = 销售账，支付时扣、**本功能不动**；批次账 = 实物账，派工扣）差额必须**读得出、可解释**：`diff = Σ批次余量 − product_skus.stock`，恒等式 `diff = (销售已扣 − 派工已扣 − 其它台账净额) − 台账之外形成的存量` 即 `reconciled` 判据（不成立也要读得出，不得静默）；剩余量分布按 `≤0.2m / 0.2~0.5m / 0.5~1m / >1m` 四档统计批次数与占比
  - [remnant-recovery.non-asset-ledger] **余料台账不是资产**（V122 / issue #5146；用户裁定逐字「这个废布不算在企业资产了」）：`fabric_remnants` 一行 = 一块实物余料，只记**实物可用性**（尺寸 / 来源订单 / 来源批次 / 缸号 / 状态），**不计价、不进库存金额** —— 表里**没有任何**「余料值多少钱」的列（迁移的终态对账与静态守卫双向钉住）。状态机四态：`customer_taken` 客户带走（特殊选项 `余料带回-布` / `余料带回-纱`，**不进可用池、不参与匹配、不计回收**，也不可报废）/ `available` 可用（匹配只在它里面找）/ `used` 已用（回收记账落在这里）/ `scrapped` 已报废（留痕，与回收**互斥**）。余料 = **门幅余料**（`piece_kind='width'`，行内没占满门幅剩下的竖带）+ **端部余料**（`'end'`，行内短块尾部剩下的横带），随排料/派工结果**自动产生**（不需要人手工登记）；尺寸取整**向下**到 2 位（向上取整会把「其实装不下」报成装得下 = 判据「不凭空推荐」要防的形态）。判据：加余料登记前后 `Σ product_skus.cost_amount` 与 `Σ product_skus.stock` **逐值不变**，且余料两表**不出现在任何库存/资产读面里**
  - [remnant-recovery.small-item-specs-configurable] **小件用料尺寸表 = 企业可配参数**（V122 / issue #5146；用户裁定逐字「小件用料尺寸表，可以整个参数配置，未来让企业自定义」）：配置形态 = `remnant_small_item_specs` **一行一小件**（列为 `length_m` / `width_m`，整数）、**键 = 该小件对应的工序名**（逐字同 `production_operations.name` 与真值源 `backend/ai-agent-service/app/production/routing.py` 的 `SPECIAL_OPTION_ROUTINGS[opt]["operation"]` —— 不另造「小件名」= 不造第二份会漂移的口径），写面**校验键在工序库里真的存在**（打错一个字 ⇒ 该行永远不会被命中 ⇒ 当场拒绝，把「配了不生效」变成「配的时候就告诉你」）。🔴 **缺行 = 未配置 = 未启用**（本仓「缺行 = 用默认值」口径下，本参数的默认值**就是空**，不编业务数值）；**全量替换**（空数组 = 清空 = 回到未配置）。配置入口在**既有企业参数中心**的「余料回收」域**页内**（§22 P1「一处入口」：不为它另开配置页或第二个 settings 段），带 §22 的 P2 三件套（`label` + `hint` + `impact`）、**P3 默认值可见**（未配置 ⇒ 显式徽标 + 服务端说明原样上屏）、**P5 术语就地查**（独立锚点命名空间，术语条目渲染在同一面板内）；文案里**不出现数字**（§22 基线 ①，有守卫）
  - [remnant-recovery.match-and-recovery] **小件优先匹配 + 回收记账**（V122 / issue #5146）：订单行勾了「余料做绑带」/「余料做帘头」/「抱枕」等特殊选项 ⇒ 该行有小件需求（选项 → 工序的解析**复用既有唯一真值源** `production_option_routings`，与工序实例化读同一张表）；匹配**只扫可用池**，排序 = ①**同缸号** → ②同色（同 skuCode）→ ③长度升序（先用小块）→ ④id 升序（确定性），**硬底线 = 候选必须「同缸号 或 同色」**（两者都不满足 ⇒ 淘汰，防色差不得放宽；不同缸号但同色 ⇒ 允许并在读面用 `sameDyeLot=false` 标出色差风险）；**不跨商品匹配**。🔴 **不静默**：未配置尺寸 ⇒ **不产生任何推荐**且读面**显式说明**（「没配」与「配了没匹配上」必须能分开读）；**尺寸不足 ⇒ 不推荐**（`fits` 两条边都不小于需求，不旋转、不放宽，读面与写面同一判据）。🔴 **找到了就不新领料**：余料被用掉 ⇒ 状态转 `used` + 记回收，**不写任何** `stock_batch_consumptions` 行（判据「该小件不产生新的批次消耗（批次数不变）」）；**回收额 = 用掉米数 × 该余料来源批次当时均价**（均价在回收那一刻从 `stock_batches.unit_cost` 取一次并**快照**到余料行 ⇒ 事后改价**不改历史读数**；金额由 DB 约束逐值钉住 `recovered_amount = recovered_meters × recovered_unit_cost`）；**冲减的是使用它的那张单**（`used_by_order_no`）的**内部**面料成本，**对客售价 / 加工费 / 成品尺寸逐值不变**（判据「不损失客户」）；来源批次没记均价 ⇒ **拒绝回收**（宁可为失败，不许估一个价）；报废必须留痕（谁 / 何时 / 为什么）且只有「可用」的余料能报废（客户带走的归客户，企业无权处置）
  - [product-sku-stock.create-flow] 创建商品：用户提供分类名时当轮立即调 category_manage 查分类树匹配 ID，不留到「确认创建」阶段；未提供时 interact(choice) 渲染分类选择器（product_skill.py）
  - [product-sku-stock.create-confirm] 创建商品写操作前 validate_input 汇总确认（confirm 约定见 ai-chat.confirm-required）
