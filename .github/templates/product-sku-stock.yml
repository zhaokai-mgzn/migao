reviewer_asserts:
  # ⚠️ 断言**一条一列**（`expect:` 是列表，不是同键重复 —— issue #4291）：
  # 同一 mapping 里写多个 `expect:` 只会装载最后一个（PyYAML 与 yaml_light 同款行为），
  # 其余真值断言**静默消失**；判据 = `tests/unit_ci_workflows/test_cases_yaml_strictness.py`。
  # ── 商品列表与筛选 ──
  - API: GET /api/admin/products?page=1&size=5
    expect:
      - data.records 非空
      - 每项 status != deleted
      - 每项 status NOT IN (in_warehouse)
  - API: GET /api/admin/products?page=1&size=50
    expect: 所有 item.status NOT IN (in_warehouse)

  # ── 商品详情与状态 ──
  - API: GET /api/admin/products/{id}
    expect:
      - data.status NOT IN (in_warehouse)
      - data.status IN (on_sale, off_sale, draft, under_review)

  # ── 状态流转：正向 ──
  - API: PUT /api/admin/products/{id}/status
    expect:
      - 允许 draft → on_sale
      - 允许 draft → under_review
      - 允许 on_sale → off_sale
      - 允许 off_sale → on_sale

  # ── 状态流转：禁止废弃状态 ──
  - API: PUT /api/admin/products/{id}/status?target=in_warehouse
    expect:
      - status >= 400
      - error.message 包含 in_warehouse 或 IllegalStatus

  # ── 编辑表单：按钮校验 ──
  - API: GET /api/admin/products/{id}
    expect: data 不含 submit_to_warehouse 按钮配置

  # ── 库存聚合 ──
  - API: GET /api/admin/products/{id}
    expect: data.stock = SUM(data.skus[].stock)
  - API: GET /api/admin/products/low-stock-by-color?threshold=100
    expect: 每项 stock <= 100


  # ── 租户隔离 ──
  - API: GET /api/admin/products?page=1&size=5
    expect: 所有 item.tenantId = {当前租户}

confidence_required: 90%

common_pitfalls:
  - 商品状态枚举包含已废弃的 in_warehouse
  - 状态流转遗漏 in_warehouse 禁止规则
  - 筛选下拉仍含「仓库中」选项
  - 库存聚合按商品而非 SKU 汇总
  - 默认阈值 100 写死
  - 跨 SKU 库存重复计算
  - V4 migration 未做幂等（重复执行不报错）——DB 内部事实，由 admin-api 启动迁移日志保证，verify 不直连库校验
  - TypeScript ProductStatus 联合类型未移除 in_warehouse
