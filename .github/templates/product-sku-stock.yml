name: product-sku-stock
description: 商品状态/库存/编辑类需求 — 覆盖状态机、SKU 库存、列表筛选、编辑表单、数据迁移
red_flags: [382]

business_truths:
  - [product-sku-stock.aggregate] 商品库存 = 所有 SKU 库存求和（products.stock 常为 0，以 SKU 汇总为准）
  - [product-sku-stock.low-stock] 低库存 = 库存 ≤ 阈值（默认 100），且仅 on_sale 商品（SKU 级 EXISTS 子查询 #1396）
  - [product-sku-stock.realtime] 库存数字 = 实时数据
  - [product-sku-stock.status-flow] 商品状态流转必须合法（不允许废弃状态 in_warehouse）
  - [product-sku-stock.decimal-1dp] 库存/数量列 = NUMERIC(12,1)（0.1 米粒度，V115/#5063）：库存类**输入**（入库数量 / 库存调整量 / 商品建改的 stock）最多 1 位小数，**超过即显式拒绝**（fail-closed，文案可行动；服务端**不做**静默取整/截断）；订单侧（`order_items.quantity`，DECIMAL(10,2)）按真实米数落库存与台账（`stock_ledger_entries.delta = after_qty - before_qty`，相邻两行首尾相接，比较用 compareTo）；整数场景**逐值不变**
  - [batch-stock-plan.deduction-by-cutting-plan] 派工扣批次的**米数口径 = 排料结果**（A 类完整布并排，V119 / issue #5158）：生成加工单时对「**同批次 × 同加工类型**」的订单行成组调 `CuttingPlanCalculator`，组的应领米数（Σ 行长，行长 = 行内最大沿卷长）按各行公式米数占比分摊回行、经 `StockQuantity.toStockScaleByCeiling` **归一到 0.1 米**后作为实际扣减 —— 省下的米数**留在批次余量上**。🔴 不得跨批次成组（两块料裁自不同卷时各自都要单独占一段卷长 ⇒ 跨批次成组是虚报）；🔴 排料口径**不得大于**公式口径（DB 约束 `ck_batch_consumption_plan_meters`：`planned_meters <= formula_meters` 且两列同号）；🔴 不可并排 / 工艺未知 / 缺窗高或幅数 / 门幅没记 / 取不到上下卷边 / 排料报错 ⇒ **逐值退回公式口径**（saved = 0，宁可为 0 不许估），且绝不因优化失败让加工单生成不了
  - [batch-stock-plan.two-meters-and-cost-snapshot] **两个米数 + 当时均价必须落库**（V119 / issue #5158，硬要求来自 #5159 L1）：批次消耗台账每行带 `formula_meters`（行业公式口径 = 改前的扣减口径，与销售账扣减同源同函数）/ `planned_meters`（排料口径 = 改后的扣减口径，恒等于 −delta）/ `unit_cost`（**当时**该批次均价快照，源 `stock_batches.unit_cost`）⇒ `saved_meters = formula − planned`、`saved_amount = saved_meters × unit_cost` 在**读面派生**（不落第三个数）。🔴 **落库不重算**（事后重算会随算料配置/排料器迭代而漂移）；🔴 **换价后历史单的 `saved_amount` 不得变**（均价随行快照，不是查询时 join 批次）；历史行 `formula = planned = −delta`（saved = 0）、均价 NULL = 未知（不回填不猜）；加工单快照另带同一组米数（逐单审计与按批次汇总两条路都可读）
  - [batch-stock-plan.reconcile-splits-two-items] 批次账对账的差额**拆成两项且分别可读**（V119 / issue #5158）：`soldUnbatched = soldDeducted − formulaDeducted − otherLedgerDelta − unbatched`（**已售未派**）与 `planSaved = formulaDeducted − dispatched`（**排料节省**），`explainedDiff = soldUnbatched + planSaved`，`reconciled` 判据仍是 `diff == explainedDiff`。🔴 **不许一项冒充另一项**；两项之和**逐值等于**拆之前的总解释项（`formulaDeducted` 一加一减）⇒ 拆分**不放宽** `reconciled`（改前判 true 的仍 true）
  - [product-sku-stock.bulk-import] 商品 + SKU 批量导入（issue #5154，迁移/批次建账的前置：SKU 不存在 ⇒ 批次挂不上）：**幂等键 = 租户 + 货号**（`products.sku_code`）——命中即**原地更新**（保留商品与 SKU 主键，订单/批次里存的旧引用不断链），同一文件重复导入不产生重复商品/SKU；货号因此是必填列。行语义 = **一个数据行一个 SKU 行**（同一货号多行 = 一个商品的多 SKU），颜色与门幅**成对填写**，SKU 组合只有颜色 × 门幅（售卖方式是商品级属性，不进组合）；**逐行校验报告，不静默跳过**：每个数据行必落在「成功 / 失败 / 空白」三桶之一（`total == successCount + failCount + blankRows`），失败行带**行号 + 货号 + 可行动原因**；库存入参复用 `StockQuantity` 的 1 位小数准入（超位显式拒绝且该行**零落库副作用**，不静默取整/截断）；导入**只增改不删**（文件里没有的既有 SKU 不删 —— 商家在导入页看不到库里已有的 SKU，按缺失删会静默断掉批次引用）；行级原子（非法行不阻塞同文件合法行），不是整包回滚
  - [product-sku-stock.decimal-1dp-migration] V115 把 `product_skus.stock` / `products.stock` / `stock_ledger_entries.{delta,before_qty,after_qty}` / `inbound_order_items.quantity` / `stock_batches.quantity` / `sales_count`（两处）由 INTEGER 改 NUMERIC(12,1)；显式 BEGIN/COMMIT、幂等（已是终态则 0 次 ALTER）、前置表列 fail-closed、文末 DO 块终态对账；`docs/sql/schema.sql`（bootstrap 路径）同步终态

  - [batch-ledger.assignment-rule-switchable] 批次指派**策略可切换**（issue #5167，阶段 2a；🔴 **默认仍是 FIFO**）：`fifo`（**缺省**，入库日期早者优先，同日按 id）/ `best_fit`（在**能满足需求**的候选里挑**余量最小**者 —— 让批次被用尽；余量打平则取先入库者）。🔴 **缺省一字不改**：不传规则时候选顺序与建议值与阶段 1 **逐值相同**（#5145 记录期的定义特征 = 行为与现状一致 ⇒ 指派规则一变基线就不成立，故本单交付「可切换」，不改缺省值）；🔴 **未知取值显式拒绝**（400 + `ASSIGNMENT_RULE_UNKNOWN` + 可选值清单，**不得静默回落 fifo** —— 静默回落 = 商家以为开了却没开）；🔴 规则只决定**挑哪个批次**，不改米数口径（扣减仍按排料结果）、不改对客金额与售价；读面 `suggestionRule` 回口径（`FIFO_RECEIVED_DATE` / `BEST_FIT_REMAINING`）；无可满足批次 ⇒ 两策略同结论（**无建议** + 候选列表完整，不退回「挑个最大的」）。写入面（`POST /api/admin/processing-orders/generate` 的 `assignmentRule`）只在**显式传了**规则时才把「系统建议值」升级为「直接采用」，且只对**没有**指定 `batchNo` 的行补位（显式指定永远优先 = 人工最终选择 &gt; 规则）；**没传** ⇒ 未指定批次的行仍逐字显式拒绝（缺省=不自动指派）；该行无候选满足 ⇒ 显式拒绝（不静默跳过 = 不静默少扣）
  - [batch-ledger.pooled-batch-dispatch] **池化成批派单**（issue #5169，阶段 2b-1；🔴 **缺省关**）：把「一次派一张单」升级为「**按池成批派**」—— 一次动作**批量生成多张各自独立**的加工单（🔴 **不改**「一单一加工单」的既有约束 `uk_processing_orders_active`），但**排料与批次分配在池级求解**：把池内**多张单**的订单行合成一份入参、**只调一次** `StockBatchConsumptionService.plan`，于是「两张单各一扇可并排的矮窗」从 **2 行 6 米**变成 **1 行 3 米**（候选块来自池内多张单 = 池化的全部意义）。🔴 **成组键仍是「批次 × 加工类型」**（#5158 口径，跨批次不得成组 —— 两块料裁自不同卷时各自都要占一段卷长，跨批次并排是虚报）。🔴 **默认关（记录期基线的硬要求）**：开关缺省值只有一处（`POOLED_DEFAULT_ENABLED = false`），不传 / 传 false ⇒ **逐单派**，与今天**逐值相同**（`plan` 每单各调一次、结果顺序 = 入参顺序、错误文案不变）；只有显式 `pooled=true` 才走池级求解。失败面：逐单失败仍**逐单**记失败且不影响其余单；**池级**累计余量不足（池化新出现的失败面：两张单各要 3 米而批次只剩 5 米，逐单看各自都够）⇒ **整批显式拒绝**（fail-closed，不静默少扣、也不静默少派一张）。指派规则 / 非法值 fail-closed / 缺省不补位（#5167）与两个米数口径（#5158）**一字不动**；对客金额、售价、成品口径与销售账（`product_skus.stock` / `stock_ledger_entries`）**不碰**
  - [batch-ledger.dispatch-pool-visibility] **待派池可见 + 兜底不静默压单**（issue #5169）：池的定义 = **已确认支付**（`orders.status='confirmed'`）**且无活跃加工单**的订单（排除口径与 `uk_processing_orders_active` 逐字相同），按**物料**（商品 × 颜色 × 门幅 = `productId × skuCode`，`skuCode` 即 `processing_info.sku`）分组可见，逐行给单号 / 物料 / **需求米数**（公式口径，与销售账与台账 `formula_meters` 同函数）/ **等待时长**。🔴 **等待时长口径 = `now − orders.created_at`**（系统未记录支付时刻 ⇒ 用下单时刻作**上界**，只会算得更久、不假装刚进池；「不得静默压单」要的是**早**告警，故取保守方向）。🔴 **滞留上限可配**（请求参数 `maxWaitHours`，缺省 24 小时）且**非正数显式拒绝**（不静默回落缺省值）；超上限 ⇒ 必须给出**带对象名字**的可行动告警（哪张单、等了多久、该做什么），**不得**只有一个数不清对象的计数。🔴 **成批预览不说谎**：预览的 `savedMeters = formulaMeters − pooledPlannedMeters` 与实际落账的 `Σ saved_meters`（= `Σ(formula_meters − planned_meters)`）**逐值相等**（同一个求解器、同一份入参，不是两套口径）；另分开回 `perOrderPlannedMeters`（逐单派应领，对照）与 `poolingGainMeters`（池化**新增**收益）—— 不把 #5158 已有的单订单内并排算成池化的功劳；预览**只读**（不建加工单、不落台账）且同样 fail-closed
  - [inbound-order-flow.draft-then-post] 入库单：建单是**草稿**（不动库存）；**过账**才一次性地自动生成批次号（PC-yyyyMMdd-NNNN）+ 加 SKU 库存 + 落 stock_ledger_entries(reason=inbound) + 按移动加权平均重算 product_skus.avg_cost；已过账不得重复过账、不得作废（V111，issue #5034）
  - [inbound-order-flow.batch-granularity] 批次粒度 = **入库单行**（一个 SKU 行 = 一个批次，用户裁定 2026-09-23）；系统批次号 batch_no 与供应商缸号 dye_lot 是**两列**，dye_lot 可空且不得用 batch_no 冒充（docs/curtain-selling-method-industry-research.md §1/§8.2）
  - [inbound-order-flow.cost-null-semantics] 成本 NULL = 未知：存量 SKU 的 avg_cost/cost_amount 一律不回填、不猜 0；入库行未记单价时只加数量、均价保持原值（V111）
  - [batch-ledger.dispatch-deduct] 生成加工单时由**文员指定批次**（系统给候选 + 建议值，人工确认、可改；阶段 1 建议值 = 入库日期先进先出；阶段 2a（issue #5167）起可**显式切换** best-fit，缺省仍是 FIFO）：指定批次与加工单生成**同一事务**扣减该批次余量，扣减米数 = 该订单行米数（向上进位到 0.1，与销售账扣减同一函数）；**不指派 ⇒ 不扣、不落台账、行为与今天逐字相同**；批次不存在 / 不属于该商品或 SKU / 余量不足 ⇒ **显式拒绝 + 可行动建议**（fail-closed，不得静默少扣、不得落半成品）
  - [batch-ledger.remaining-derived] 批次余量 = `stock_batches.quantity + Σ(stock_batch_consumptions.delta)`（**派生**，不原地改 `stock_batches.quantity` —— V111：批次行不可改、冲销走新单据）；消耗台账一行 = 一次批次余量变更（负 = 派工扣减、正 = 作废回补），按**批次 / 加工单 / 订单**都能查回来；加工单作废（含订单取消自动作废）⇒ 同事务**逐值对称**回补（回补量 = 原扣减量的相反数；幂等、可重跑）
  - [batch-ledger.reconcile] 路线 A 的两本账（SKU 账 = 销售账，支付时扣、**本功能不动**；批次账 = 实物账，派工扣）差额必须**读得出、可解释**：`diff = Σ批次余量 − product_skus.stock`，恒等式 `diff = (销售已扣 − 派工已扣 − 其它台账净额) − 台账之外形成的存量` 即 `reconciled` 判据（不成立也要读得出，不得静默）；剩余量分布按 `≤0.2m / 0.2~0.5m / 0.5~1m / >1m` 四档统计批次数与占比
  - [product-sku-stock.create-flow] 创建商品：用户提供分类名时当轮立即调 category_manage 查分类树匹配 ID，不留到「确认创建」阶段；未提供时 interact(choice) 渲染分类选择器（product_skill.py）
  - [product-sku-stock.create-confirm] 创建商品写操作前 validate_input 汇总确认（confirm 约定见 ai-chat.confirm-required）
primary_specs:
  - tests/e2e/specs/products/product-list.spec.ts
  - tests/e2e/specs/products/edit-render.spec.ts
  - backend/admin-api/src/test/java/com/migao/admin/controller/ProductControllerTest.java
  - frontend/admin-web/tests/unit/pages/products

reviewer_asserts:
  # ── 商品列表与筛选 ──
  - API: GET /api/admin/products?page=1&size=5
    expect: data.records 非空
    expect: 每项 status != deleted
    expect: 每项 status NOT IN (in_warehouse)
  - API: GET /api/admin/products?page=1&size=50
    expect: 所有 item.status NOT IN (in_warehouse)

  # ── 商品详情与状态 ──
  - API: GET /api/admin/products/{id}
    expect: data.status NOT IN (in_warehouse)
    expect: data.status IN (on_sale, off_sale, draft, under_review)

  # ── 状态流转：正向 ──
  - API: PUT /api/admin/products/{id}/status
    expect: 允许 draft → on_sale
    expect: 允许 draft → under_review
    expect: 允许 on_sale → off_sale
    expect: 允许 off_sale → on_sale

  # ── 状态流转：禁止废弃状态 ──
  - API: PUT /api/admin/products/{id}/status?target=in_warehouse
    expect: status >= 400
    expect: error.message 包含 in_warehouse 或 IllegalStatus

  # ── 编辑表单：按钮校验 ──
  - API: GET /api/admin/products/{id}
    expect: data 不含 submit_to_warehouse 按钮配置

  # ── 库存聚合 ──
  - API: GET /api/admin/products/{id}
    expect: data.stock = SUM(data.skus[].stock)
  - API: GET /api/admin/products/low-stock-by-color?threshold=100
    expect: 每项 stock <= 100


  # ── 租户隔离 ──
  - API: GET /api/admin/products?page=1&size=5
    expect: 所有 item.tenantId = {当前租户}

confidence_required: 90%

common_pitfalls:
  - 商品状态枚举包含已废弃的 in_warehouse
  - 状态流转遗漏 in_warehouse 禁止规则
  - 筛选下拉仍含「仓库中」选项
  - 库存聚合按商品而非 SKU 汇总
  - 默认阈值 100 写死
  - 跨 SKU 库存重复计算
  - V4 migration 未做幂等（重复执行不报错）——DB 内部事实，由 admin-api 启动迁移日志保证，verify 不直连库校验
  - TypeScript ProductStatus 联合类型未移除 in_warehouse
