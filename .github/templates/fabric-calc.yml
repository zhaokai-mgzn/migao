name: fabric-calc
description: 窗帘算料报价 — 用布量公式、褶皱倍数、计价规则（POC 小布增强）
red_flags: []

business_truths:
  - [fabric-calc.fullness-default] 褶皱倍数默认值：打孔帘(eyelet)=2、韩式褶(s_hook)=2、四爪钩(hook)=2、罗马帘(roman)=1
  - [fabric-calc.fixed-height] 定高布买宽公式：M = (W + 0.3) × N（W=窗宽，N=褶皱倍数，0.3=左右各15cm覆盖余量）
  - [fabric-calc.fixed-width] 定宽布买高公式：P = ceil((W+0.3)×N/G)，M = P × (H + 0.3)（G=门幅，H=窗高）；窗高+0.3 > 门幅时触发并告警
  - [fabric-calc.pattern-loss] 对花损耗：每幅加 1 个花距（30~60cm）
  - [fabric-calc.roman] 罗马帘公式：M = (W + 0.2) × (H + 0.3)，无褶皱倍率
  - [fabric-calc.quote-total] 报价总价 = 面料费 + 加工费 + 辅料费 + 安装费（**拼色款另加**拼色加价 `mixed_color_surcharge`，见 `fabric-calc.mixed-color-surcharge`）；打孔加工费默认8元/米（按面料米数打包，**已含罗马圈等辅料**，issue #3005）
  - [fabric-calc.accessory-explicit-only] 辅料（罗马圈等按个辅料）**只走显式入参** `accessories=[{name,quantity,unit_price}]`，数量由顾客明说；**禁止**由面料米数推导（无「每米 N 个」密度，罗马圈不随打孔帘默认单列，issue #3005/#4118）
  - [fabric-calc.doc-example] 真值源 docs/curtain-fabric-quote-rules.md §7 算例可被代码逐值复现：3m×2.7m、3.0m 定高布、2 倍褶、打孔、30 元/米 → 面料 6.6m/198 元、加工 52.8 元、辅料 152.8 元、安装 61.2 元、**总价 464.8 元**；显式单独买 40 个罗马圈（1.5 元/个）→ 524.8 元
  - [fabric-calc.pleat-method] 韩褶褶数法（`mounting=s_hook` 且显式传 `pleat_count` 或 `craft_tier`）：用料 = 0.25×褶数 + 余量（单开 0.2 / 多开 0.3）；褶数须被开数整除，否则取最近可行褶数并告警（行业实证：6.6m 窗双开 48 折 → 12.3 米，issue #3982）
  - [fabric-calc.craft-tier] 工艺档位 = 名义倍数（standard 2.0 / economy 1.8）→ 褶数 → 用料；**仅** s_hook 且显式传 `craft_tier`/`pleat_count` 时走褶数法，两者都缺 ⇒ 回落倍数法并**显式告警**（issue #4118 ⑤-B 已治静默；数值一字不变）——「报价默认展示标准档」的接线口径**待裁定**（issue #4118 ⑤-A）
  - [fabric-calc.fullness-red-line] 褶皱倍数低于 1.5（行业美学下限）必须**拒绝**：工具 fail-closed 返回「参数不合法」，不得静默按 1.5 兜底（docs §1）
  - [fabric-calc.mixed-color-per-fold] **拼色每折吃布系数**（用户 2026-09-19 裁定；纸质「韩折下料速查表」表头原文「拼色下料 1个折 0.65 / 2个折 1.2」，是**用料**口径而非计价）：`款式=拼色` 且部位级特殊选项含 `拼1次`/`拼2次` ⇒ 每折 0.65/1.2 米（单色 0.25）；**余量不随拼色变化**（单开 0.2 / 多开 0.3）。52 折双开 ⇒ 单色 13.3 / 拼1次 34.1 / 拼2次 62.7 米。⚠️ 纸表**未登记**的拼次（`拼3次`）⇒ 算料试算端点 fail-closed `MIXED_PER_FOLD_NOT_REGISTERED`，**不插值、不静默退回单色**。⚠️ 本条只覆盖**用料**（米/折）；**拼色计价**是另一条真值（用户 2026-09-21 裁定，见 `fabric-calc.mixed-color-surcharge`）—— 旧措辞「拼色计价 = 0.65/1.2 元/折」错在**单位/形态**，不是「拼色计价不存在」
  - [fabric-calc.mixed-color-surcharge] **拼色报价加价**（用户 2026-09-21 裁定，逐字「拼色计价规则就是拼色款另加 2.4 元/米 先按这个算吧」，经 issue #4848；关联 #4341 第 1 项由此回答：计价是**元/米**、不是元/折）：`款式=拼色` ⇒ 报价**另加** `MIXED_COLOR_SURCHARGE_PER_METER`（真值源 §0，= 2.4 元/米）× **该款面料米数**，在 `breakdown` 里**另立一行**（`mixed_color_surcharge`，单色款 = 0.0 且不出行）—— 不改面料/加工/辅料任一单价（改单价 = 双算）。「按褶数折算」= 元/折 0.6 按**单色每折吃布**（0.25 米/折）折算成元/米的形态。算例（§10）：52 折双开 拼1次 34.1 米 ⇒ 81.84 元（总价 1571.84）；拼2次 62.7 米 ⇒ 150.48 元（总价 2784.48）。⚠️ **单色款不受影响**（§7 算例 6.6 米 / 464.8 元逐值不变）；⚠️ **不追溯**（只由显式 `style=拼色` 触发 ⇒ 不传 style 的既有调用逐值不变；`production_work_logs.unit_price` / `factor` 是冻结契约，不回算历史）；⚠️ **定型**报价加价**未裁定、未落码**（本裁定只覆盖拼色计价）。落码 = **两侧同源同价**：报价侧 `curtain_calc.build_quote` + 订单侧 `ProcessingFeeCalculator`（`拼1次`/`拼2次` 撤掉元/套计费、改按元/米 × 该款面料米数；跨语言同源判据 = `tests/unit_ci_workflows/test_mixed_color_surcharge_cross_side.py`）；订单侧只动这两项、其余选项元/套价一字未动（issue #4855）
  - [fabric-calc.fullness-actual] 褶数法响应**同时**给理论倍数 `fullness`（档位/款式名义值）与**实际**倍数 `fullness_actual`（= 用料 ÷ 窗宽）；两者语义不同、不得互相替代（48 折双开 → 12.3÷6.6 = **1.86** 实际 vs 2.0 理论），报价卡必须展示实际值（issue #4118 ④）
  - [fabric-calc.aggregate-by-fabric] 多部位报价按货号-色号汇总用料 = Σ 各部位米数（采购/套裁视图，`calculate_multi_position` 的 `by_fabric`）
  - [fabric-calc.formula-selection] **两种用料计算方法可选**（issue #4527，用户 2026-09-19 裁定「根据用户要求选择不同的计算公式，**默认用韩折的**」）：`formula='pleat'`（韩褶公式＝褶数法，**默认**）｜`formula='fullness'`（褶倍数公式＝倍数法）；缺省走褶数法，未知取值 ⇒ 显式报错（不静默回退）。**逐片口径**：每片宽 = 成品宽 ÷ 开数，总用料 = 每片用料 × 开数。ERP 实证锚点（加工单 `CSO260915-02615`，#4343 取证）：宽 5.5m / 双开 / 理论褶倍 2.00 ⇒ 每道工序 **11.00 米**（= 5.5×2.00）⇒ **双开不得把总宽再乘 2**（那会算成 22.00 米，差一倍、直接进订单金额，已被用户否决）。`formula_text` 串首必须写明所用公式（`韩褶公式：` / `褶倍数公式：`）
  - [fabric-calc.meters-ceiling] **用料米数一律向上进位到 0.1**（issue #4527 用户裁定「最后用料米数保留一位小数」＋澄清「向上进位」）：`ceil(x*10)/10` —— 截断 / 四舍五入即违约；进位只在**总用料**上做一次（先对每片进位再乘开数会多算 ≤0.2 米）。只改用料米数本身，金额/单价相关量**不跟着改口径**
  - [fabric-calc.craft-calc-config] 算料公式参数一律从**配置对象**读（issue #4527 用户追加裁定「可能得支持每个商家自定义配置」）：`build_quote(..., config=None)` ⇒ 模块级只读常量 `DEFAULT_CRAFT_CALC_CONFIG`（默认值 = 既有常量逐值不变）；键 = `per_fold_single` / `per_fold_mixed_times` / `margin_single` / `margin_multi` / `min_fullness` / `tiers` / `default_formula` / `side_margin` / `meters_rounding_step`。**护栏不因可配而消失**（配置来自商家 = 不可信输入 ⇒ 非法即显式报错，不静默回退默认值）；配置沿调用链显式传递，**不得**读进模块级可变全局（并发互相污染）。持久化与商家配置界面属后续包，本包不做
  - [fabric-calc.craft-calc-endpoint] 算料试算单一真值（issue #4421）：商家手工下单页试算走 ai-agent `POST /api/internal/production/craft-calc`（Service Token），admin-api `CraftCalcClient` + `POST /api/admin/orders/craft-calc`（**不落库**）只做「问 + 取」——**Java / TS 侧不复制第二份算料逻辑**；可读公式串 `formula_text`（如 `韩褶公式：(6.6+0.3)×2 → 52折 → 0.25×52+0.3 = 13.3米`）由**后端**按同一份数字产出，前端不得自拼；`mounting != s_hook` ⇒ 400 拒绝，**不静默回落**倍数法（`formula='fullness'` 是合法的另一种计算方法，不受该守卫限制）
  # 未落码 ⇒ **不登记为真值**（登记 = 承诺代码能做到，属「文档承诺、代码不读」的静默失效）：
  #   拼色**主布 / 配布边分列**用料；**定型**报价加价 —— 见 docs/curtain-fabric-quote-rules.md §10 / §11 的【背·未落码】登记。
  #   （拼色**计价**已随用户 2026-09-21 裁定落码 ⇒ 已登记为真值 `fabric-calc.mixed-color-surcharge`。）
  - [fabric-calc.fabric-widths-candidate] **候选门幅集由模型从商品 SKU 去重得来**（issue #5016，用户 2026-09-21 裁定「顾客给出窗宽窗高后，系统自动选门幅（2.8/3.2）」）：顾客**没指定**门幅时，模型必须把 `product_detail` 返回的 SKU 列表里的 `door_width` **去重**后作为 `fabric_widths` 传给 `curtain_calc`（如 `[2.8, 3.2]`）——**由引擎**在候选集内自动选门幅、并自动决定用「定高买宽」还是「定宽买高」；顾客**明确指定**了门幅时才传单值 `fabric_width`（两者同时传 ⇒ `fabric_width` 被忽略）。⚠️ 边界两条：① `fabric_widths` 是**可选**入参 ⇒ 不传时既有单一门幅口径**逐值不变**（#5016 的红线）；② 「模型会不会填这个参数」是**纯 LLM 行为**，确定性单测**测不到** ⇒ 该行为的评测覆盖 = CH-043（引擎侧「候选集内怎么选」由单测覆盖，登记在 CH-042）
  - [fabric-calc.no-fabrication] 不编造报价数据，必须通过 curtain_calc 工具计算

primary_specs:
  - backend/ai-agent-service/tests/test_curtain_calc.py

reviewer_asserts:
  - 工具: curtain_calc
    expect: 定高布 3m×2.5m×2倍×2.8m门幅 → fabric_meters=6.6
    expect: 定宽布 3m×2.7m×2倍×2.8m门幅 → fabric_meters=9.0 且 warning 非空
    expect: 打孔帘 3m×2.7m×2倍×3.0m门幅×30元/米 → accessory_cost=152.8（明细无「罗马圈」）、total=464.8
    expect: 同上 + accessories=[{罗马圈,40,1.5}] → accessory_cost=212.8、total=524.8（数量原样、不推导）
    expect: 报价 total = fabric_cost + processing_cost + accessory_cost + install_cost + mixed_color_surcharge（单色款 mixed_color_surcharge = 0.0；拼色款 = 面料米数 × 2.4）
  - 工具: curtain_calc
    expect: 韩褶 6.6m×2.6m 双开 + 客户自报 48 折 → fabric_meters=12.3、fullness=2.0（档位理论值）、fullness_actual=1.86（实际值，二者不得互相替代）
