name: frontend-fix
description: 纯前端 UI 修复/Bug — 不涉及后端 API/SQL/状态机变更。skip_template 直接进 Phase 2。
red_flags: []
skip_template: true

business_truths:
  - [frontend-fix.no-api-change] 前端 UI 变更不影响后端 API 契约
  - [frontend-fix.vitest] 变更后 vitest 全部通过
  - [frontend-fix.tsc] 变更后 tsc --noEmit 通过
  - [frontend-fix.e2e] E2E 测试覆盖变更路径
  - [frontend-fix.layout] 涉及尺寸/长宽比/对齐/间距/溢出的 UI 变更，E2E 必须有几何断言（boundingBox/getComputedStyle），仅「元素存在/不存在」不算覆盖
  - [frontend-fix.ui-token] 织物质感设计 token：primary.500=#48618f（靛蓝主色）、accent.500=#c06a3e（陶土点缀）、neutral.50=#faf7f2（暖中性米白底）；primary/accent/neutral 三组各为完整 50-900 阶；src/ 下 .tsx/.ts 不再出现默认蓝 #3b82f6 十六进制字面量
  - [frontend-fix.dashboard-no-truncate] 商品销量排行表头「日涨」列在 1440×900 与 1280×800 两视口均无截断
  - [frontend-fix.axis-sampling] 订单趋势图 x 轴刻度在 1280 宽度下自动降采样，刻度不密集重叠
  - [frontend-fix.dashboard-no-overflow] dashboard 页面在 1440×900 与 1280×800 两视口无水平/垂直截断或溢出

primary_specs:
  - tests/e2e/specs/
  - frontend/admin-web/tests/unit/

reviewer_asserts:
  - vitest: npx vitest run 全部通过
  - tsc: npx tsc --noEmit 通过
  - E2E: 变更页面 DOM 断言（存在/不存在，按 CONTRACT_JSON 逐条）
  - E2E: 交互流程不退化（已有 spec 全部通过）
  - E2E: 尺寸/长宽比/对齐/溢出变更 → 有 boundingBox/getComputedStyle 几何断言（如米宝最小化浮窗 560×480 横向）

confidence_required: 80%

common_pitfalls:
  - onClick handler 丢失: 删了代码但没删绑定 → 运行时空白点击
  - 只改文案未改测试: 更新了 UI 文字但 vitest snapshot/E2E text match 未更新
  - CSS 重构断选择器: 改了 className 但 E2E getByTestId/getByRole 仍用旧选择器
  - TS 类型变更扩散: 改了类型定义导致其他页面 tsc 失败
  - 误触后端: 前端改动中意外包含了 API path 或 SQL 变更
  - 条件渲染遗漏: 删了组件但 wrapper 的条件判断还在
