name: settings-manage
description: 系统设置/租户配置管理
red_flags: []
business_truths:
  - [settings-manage.read-write] 系统设置支持读取和更新
  - [settings-manage.ai-config] 租户 AI 配置支持独立配置（botName/greetingTemplate/channelConfigs）
  - [settings-manage.immediate-effect] 配置变更后立即生效
  - [settings-manage.secret-hidden] 敏感配置（密钥/token）不在 API 响应中明文返回

  - [settings-manage.change-password] change_password 必填 old_password + new_password；标注 WRITE|DESTRUCTIVE，执行前需确认（settings_manage.py）
  - [settings-page.basic-only] 企业基础信息页（admin-web）隐藏「登录日志」与「修改密码」入口（#3006）：登录日志无记录、修改密码为未来短信码登录预留；页面不提供该两项入口
primary_specs:
  - tests/e2e/specs/settings/settings.spec.ts
  - backend/admin-api/src/test/java/com/migao/admin/controller/SettingsControllerTest.java

reviewer_asserts:
  - API: GET /api/admin/settings
    expect: data 非空
  - API: PUT /api/admin/settings
    expect: status = 200
  - API: GET /api/admin/tenant/ai-config
    expect: data 非空 AND data.botName 非空
  - 敏感字段: 响应中不包含 accessKeyId, accessKeySecret, apiKey, secret

confidence_required: 80%
common_pitfalls:
  - 密钥明文泄露
  - 配置更新不生效
