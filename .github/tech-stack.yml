# tech-stack.yml — migao 结构配置（第一个客户示例）
# QA Growth Gate 引擎通过本文件了解目标项目的技术栈，实现「换客户换技术栈不改代码」。

version: 1

# ── 服务拓扑（dashboard / patrol 的端口与健康检查）──
services:
  - name: admin-api
    kind: java-maven
    source_root: backend/admin-api
    port: 8080
    health_path: /actuator/health
    deploy_workflow: deploy-admin-api.yml
  - name: admin-web
    kind: node-vitest
    source_root: frontend/admin-web
    port: 3001
    health_path: /
    deploy_workflow: deploy-frontend.yml
  - name: ai-agent-service
    kind: python-pytest
    source_root: backend/ai-agent-service
    port: 8001
    health_path: /health
    deploy_workflow: deploy-ai-agent-service.yml

# ── 测试命令 + 覆盖率（diff_to_test / coverage_weekly 消费）──
# coverage_scope: unit=仅单元/组件测试 | full=含集成/E2E（产品原则 #5：口径必须一致）
test_commands:
  python:
    run_cmd: 'python3 -m pytest {tests} -v --tb=short -q'
    cwd: backend/ai-agent-service
    coverage_type: coverage
    coverage_path: .coverage
    coverage_cmd: 'cd backend/ai-agent-service && .venv/bin/pytest tests/ --cov=app --cov-report=json:coverage.json -q'
    coverage_scope: full
  java:
    run_cmd: './mvnw test -Dtest={tests} -pl . -q'
    cwd: backend/admin-api
    coverage_type: jacoco
    coverage_path: target/site/jacoco/jacoco.xml
    coverage_cmd: 'cd backend/admin-api && ./mvnw test jacoco:report -q'
    coverage_scope: unit
  typescript:
    run_cmd: 'npx vitest run {tests} --reporter=verbose'
    cwd: frontend/admin-web
    coverage_type: vitest
    coverage_path: coverage/coverage-summary.json
    coverage_cmd: 'cd frontend/admin-web && npm run test:coverage -- --silent'
    coverage_scope: unit

# ── 模块拓扑：文件 → 测试映射（diff_to_test 消费）──
# {1}/{2} 对应 pattern 正则的捕获组；不含占位符的字符串为固定值。
modules:
  - service: ai-agent-service
    language: python
    patterns:
      - pattern: 'backend/ai-agent-service/app/tools/(.+)\.py'
        tests:
          - 'tests/test_tools_{1}.py'
          - 'tests/test_{1}.py'
      # 子目录（graph/skills/**，issue #5353）：父规则 `(.+)` **会跨 `/` 捕获子目录** ⇒ 对
      # app/graph/skills/x.py 产出 tests/test_graph_skills/x.py（子目录 + 无 test_ 前缀）
      # ⇒ 不匹配 pytest.ini 的 python_files ⇒ 不可被收集（且门禁会指示人去建它）。
      # 故为嵌套层显式登记**全部可收集**的模板。
      - pattern: 'backend/ai-agent-service/app/graph/skills/(?:.+/)?(\w+)\.py'
        tests:
          - 'tests/test_graph_skills.py'
          - 'tests/test_skill_skills/test_{1}.py'
          - 'tests/test_skill_config_registry.py'
      - pattern: 'backend/ai-agent-service/app/graph/(.+)\.py'
        tests:
          - 'tests/test_graph_{1}.py'
          - 'tests/test_skill_{1}.py'
          # skill 配置（tool_names/intents/route_keys）统一由 test_skill_config_registry 覆盖
          - 'tests/test_skill_config_registry.py'
      # 子目录（agents/agents/**，issue #5353）：同 graph/skills —— 父规则的 `(.+)` 跨 `/` 捕获
      # ⇒ 产出 tests/test_agent_agents/x.py（不可收集）。嵌套层显式登记可收集模板。
      - pattern: 'backend/ai-agent-service/app/agents/agents/(\w+)\.py'
        tests:
          - 'tests/test_xiaobu.py'
          - 'tests/test_tenant_config.py'
      - pattern: 'backend/ai-agent-service/app/agents/(.+)\.py'
        tests:
          - 'tests/test_agent_{1}.py'
          - 'tests/test_intent_{1}.py'
          # 小布配置/欢迎语 + 租户 AI 配置的既有测试
          - 'tests/test_xiaobu.py'
          - 'tests/test_tenant_config.py'
      - pattern: 'backend/ai-agent-service/app/utils/(.+)\.py'
        tests:
          - 'tests/test_utils_{1}.py'
          - 'tests/test_{1}.py'
      - pattern: 'backend/ai-agent-service/app/router/(.+)\.py'
        tests:
          - 'tests/test_{1}.py'
          - 'tests/test_intent_router.py'
      - pattern: 'backend/ai-agent-service/app/memory/(.+)\.py'
        tests:
          - 'tests/test_{1}.py'
          - 'tests/test_context_manager.py'
      - pattern: 'backend/ai-agent-service/app/api/(.+)\.py'
        tests:
          - 'tests/test_{1}.py'
          - 'tests/test_api_coverage.py'
      # 核心稳定性基础设施（熔断 / 降级 / 缓存，issue #5353）：既有测试在 tests/unit/
      # （tests/unit/test_circuit_breaker.py · test_fallback.py · test_admin_api_cache.py）
      - pattern: 'backend/ai-agent-service/app/core/(.+)\.py'
        tests:
          - 'tests/unit/test_{1}.py'
          - 'tests/test_{1}.py'
      # 页面上下文（issue #5371 族 4，新目录 app/context/）：登记表（route→真值源）、
      # **默认拒绝**、按角色裁剪、跨语言形态同源的判据全在 `tests/test_page_context.py`
      # —— 故**逐文件**映射到同一个可收集文件（`(.+)` 会把 `__init__.py` 也捕获进来，
      # 这正是想要的：`__init__.py` 只是再导出公开 API，没有独立行为）。
      # 为什么不靠兜底：兜底会产出 `tests/test_page_registry.py` / `tests/test___init__.py`
      # 这类**要新建**的路径，而判据其实已经集中在一个文件里（照 `app/core/` 的写法显式登记）。
      - pattern: 'backend/ai-agent-service/app/context/(.+)\.py'
        tests:
          - 'tests/test_page_context.py'
      # LLM 模型路由（issue #2546 / #5353）：select_model 由 test_vision_integration 的
      # TestSelectModelWithVision 覆盖，故逐文件显式登记。
      # ⚠️ **不得**写 tests/test_llm_pipeline.py —— 它在 pytest.ini 的 addopts `--ignore=` 里
      # （永不收集），映射过去就是「门禁绿 + 测试从不运行」。
      - pattern: 'backend/ai-agent-service/app/llm/router\.py'
        tests:
          - 'tests/test_vision_integration.py'
      - pattern: 'backend/ai-agent-service/app/llm/(.+)\.py'
        tests:
          - 'tests/test_llm_{1}.py'
          - 'tests/test_{1}.py'
      # 领域本体模块（issue #2821）：schema/loader/models 由 test_ontology_schema 统一覆盖
      - pattern: 'backend/ai-agent-service/app/ontology/(.+)\.py'
        tests:
          - 'tests/test_ontology_schema.py'
      # 知识提炼模块（issue #3051 P5b）：distill 由 test_knowledge_distill 覆盖
      - pattern: 'backend/ai-agent-service/app/knowledge/(.+)\.py'
        tests:
          - 'tests/test_knowledge_{1}.py'
          - 'tests/test_{1}.py'
      # 智能每日经营简报（issue #3468）：briefing 由 test_briefing_generator 覆盖
      - pattern: 'backend/ai-agent-service/app/briefing/(.+)\.py'
        tests:
          - 'tests/test_briefing_{1}.py'
          - 'tests/test_{1}.py'
      # 生产模块（issue #3993，M4-G）：测试放 tests/test_production/test_<模块>.py
      # （pytest.ini 只收 test_*.py，故镜像目录内保留 test_ 前缀；通用规则会要求
      #  tests/test_production/<源文件名>.py —— 那样不可被 pytest 收集，故显式登记本规则）
      # ⚠️ 原来的第二条模板 tests/test_production/{1}.py 已按 issue #5353 删除：
      # 它对任何源文件都展开成不带 test_ 前缀的路径（pytest 永不收集），而对
      # app/production/__init__.py 更会命中 tests/test_production/__init__.py（磁盘上有、
      # pytest 也不收集）⇒ **假的 pass**。现在 production 的配套测试必须带 test_ 前缀。
      - pattern: 'backend/ai-agent-service/app/production/(.+)\.py'
        tests:
          - 'tests/test_production/test_{1}.py'
      # 澄清清单模块（issue #4362，S1）：测试放 tests/test_clarification/test_<模块>.py
      # （与上面 production 同因：pytest.ini 只收 test_*.py，通用规则会要求
      #  tests/test_clarification/<源文件名>.py —— 那样不可被 pytest 收集，
      #  门禁会「绿」而测试从不运行 = 本仓库最忌的静默失效，故显式登记本规则）
      # ⚠️ 第二条模板 tests/test_clarification/{1}.py 已按 issue #5353 删除（同 production：
      # 展开出 pytest 永不收集的路径，对 __init__.py 还会命中同名的 __init__.py 形成假 pass）。
      - pattern: 'backend/ai-agent-service/app/clarification/(.+)\.py'
        tests:
          - 'tests/test_clarification/test_{1}.py'
      # 图片识别内核（issue #5321 包 1）：测试放 tests/test_vision/test_<模块>.py
      # （与上面 production / clarification **同因**：pytest.ini 只收 test_*.py，
      #  通用规则会要求 tests/test_vision/<源文件名>.py —— 那样不可被 pytest 收集，
      #  门禁会「绿」而测试从不运行 = 本仓库最忌的静默失效，故显式登记本规则）
      # ⚠️ 第二条模板 tests/test_vision/{1}.py 已按 issue #5353 删除（同 production /
      # clarification：展开出 pytest 永不收集的路径，对 __init__.py 形成假 pass）。
      - pattern: 'backend/ai-agent-service/app/vision/(.+)\.py'
        tests:
          - 'tests/test_vision/test_{1}.py'
      # 提问引导模块（issue #5329）：模糊输入的「可点击猜测」投影
      # （通用规则会要求 tests/test_suggestions/<源文件名>.py —— 不带 test_ 前缀 ⇒
      #  pytest.ini 只收 test_*.py ⇒ **不可被收集**，门禁会「绿」而测试从不运行；
      #  同 production / clarification 两处，故显式登记本规则，模板保持扁平可收集）
      # 后续问题建议（issue #2575 / #5353）：既有测试名是 tests/test_follow_up_suggestions.py，
      # 任何模板都命中不了它 —— 这正是该文件长期靠 .github/qa-exemptions.yml 豁免的原因
      # ⇒ 逐文件显式登记，让门禁自己看得见（该豁免随之删除）。
      - pattern: 'backend/ai-agent-service/app/suggestions/follow_up\.py'
        tests:
          - 'tests/test_follow_up_suggestions.py'
      - pattern: 'backend/ai-agent-service/app/suggestions/(.+)\.py'
        tests:
          - 'tests/test_suggestions_{1}.py'
          - 'tests/test_{1}.py'
      # ── 兜底规则（未显式登记目录里的源文件，issue #5353）──
      # 🔴 只取 **basename**：`pytest.ini` 的 `python_files = test_*.py` ⇒ 本模板必须展开成
      # `test_*.py`。旧写法 `app/(.+)\.py → tests/test_{1}.py` 的 `(.+)` **会捕获子目录**
      # ⇒ 对 `app/core/x.py` 产出 `tests/test_core/x.py`（子目录 + 无 `test_` 前缀）
      # ⇒ **永不收集**；而门禁判 `BLOCKED` 时还会**指示你去建它** ——
      # 照着建就得到「门禁绿 + 测试永不运行」，建的人以为自己在修问题（本仓已独立踩中 ≥4 次）。
      # 兜底压平后同名不同目录会指向同一测试名 ⇒ 「靠兜底」必须是一次**有意的**选择：
      # 新目录请在 `.github/tech-stack.yml` 补显式规则（照 `app/core/` 的写法）。
      # 守卫（含恢复旧兜底必红的注入式红证）：
      # tests/unit_ci_workflows/test_diff_to_test_collectable.py
      - pattern: 'backend/ai-agent-service/app/(?:.+/)?(\w+)\.py'
        tests:
          - 'tests/test_{1}.py'
  - service: admin-api
    language: java
    java_package: 'com/migao/admin'
    patterns:
      - pattern: 'backend/admin-api/src/main/java/.*/controller/(\w+)\.java'
        tests:
          - '**/test/**/{1}Test.java'
          - '**/test/**/{1}ControllerTest.java'
      - pattern: 'backend/admin-api/src/main/java/.*/service/(\w+)\.java'
        tests:
          - '{1}Test'
      - pattern: 'backend/admin-api/src/main/java/.*/mapper/(\w+)\.java'
        tests:
          - '{1}Test'
      - pattern: 'backend/admin-api/src/main/java/.*/security/(\w+)\.java'
        tests:
          - 'SecurityConfigTest'
          - 'JwtTokenProviderTest'
  - service: admin-web
    language: typescript
    patterns:
      - pattern: 'frontend/admin-web/src/components/(.+/)?(\w+)\.tsx'
        tests:
          - 'tests/unit/components/{2}.test.ts'
      - pattern: 'frontend/admin-web/src/app/(.+/)?(\w+)\.tsx'
        tests:
          - 'tests/e2e/specs/'
      - pattern: 'frontend/admin-web/src/(lib|store)/(.+)\.ts'
        tests:
          - 'tests/unit/{1}/{2}.test.ts'

# ── 响应信封（check_assert 消费）──
envelope:
  payload_path: data
  list_paths:
    - data.items
    - items
    - data
  success_field: success
  error_field_prefix: error

# ── 认证 / DB / 运行时（verify-poll 消费）──
auth:
  token_env: SERVICE_TOKEN
  header: X-Service-Token
database:
  type: postgresql
  host_env: RDS_HOST
  user_env: RDS_USER
  name_env: RDS_DB
  password_env: RDS_PASSWORD
java_home: /usr/lib/jvm/java-21
env_prefixes:
  - RDS_
  - REDIS_
  - DATABASE_
