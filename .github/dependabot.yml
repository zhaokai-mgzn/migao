# Dependabot 配置 — 依赖自动更新
# 每周一检查依赖更新；合并前需通过 PR 门禁（pr-check / ai-agent-tests）
# 更多：https://docs.github.com/code-security/dependabot
version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/backend/admin-api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "type/chore"
      - "role/backend"
    # mybatis-plus 3.5.9+ 破坏性：extension 拆独立模块，单包升级必现类冲突（曾关闭 #2620）。
    # 升级路径：starter+extension 整组升，作为一次工程级 PR。
    ignore:
      - dependency-name: "com.baomidou:mybatis-plus-*"
        versions: [">=3.5.9"]

  - package-ecosystem: "pip"
    directory: "/backend/ai-agent-service"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "type/chore"
      - "role/backend"
    # langchain 全家桶必须整组同步升级：langchain-openai 1.6.x 要求 langchain-core 1.6.x，
    # 而仓库钉住 langchain-core==1.4.8（audit-2026-09 实测冲突组合），单包升级必现
    # pip ResolutionImpossible（曾关闭 langchain-openai 1.6 冲突 PR）。
    # 升级路径：core+openai+deepseek+graph+checkpoint+prebuilt+sd 整组升，作为一次工程级 PR。
    ignore:
      - dependency-name: "langchain-core"
      - dependency-name: "langchain-openai"
      - dependency-name: "langchain-deepseek"
      - dependency-name: "langgraph"
      - dependency-name: "langgraph-checkpoint"
      - dependency-name: "langgraph-prebuilt"
      # pytest-asyncio 1.x 与 pytest==8.3.4 不共存（曾关闭 #2624）；redis 5→8 跨 3 个大版本，
      # 连接池/响应类型 API 破坏面大，需工程级评估（曾关闭 #2833）。两者大版本升级统一走工程级 PR。
      - dependency-name: "pytest-asyncio"
        versions: [">=1.0.0"]
      - dependency-name: "redis"
        versions: [">=8.0.0"]

  - package-ecosystem: "npm"
    directory: "/frontend/admin-web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "type/chore"
      - "role/frontend"
    # 半套升级/大版本破坏（曾关闭 #2631/#2639/#2718/#2839）：
    # - vitest 4 需 @vitest/coverage-v8 4 配套，单升必 peer 冲突
    # - tailwindcss 4 拆分 @tailwindcss/postcss 插件，工程级迁移
    # - typescript 5→7 大版本跳变，需工程级评估
    ignore:
      - dependency-name: "vitest"
        versions: [">=4.0.0"]
      - dependency-name: "@vitest/coverage-v8"
        versions: [">=4.0.0"]
      - dependency-name: "tailwindcss"
        versions: [">=4.0.0"]
      - dependency-name: "typescript"
        versions: [">=6.0.0"]

  - package-ecosystem: "npm"
    directory: "/frontend/mini-app"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "type/chore"
      - "role/frontend"
    # Taro 全家桶（@tarojs/* + babel-preset-taro + eslint-config-taro）必须整组同版本升级：
    # 各包 peer 依赖互指精确版本（如 @tarojs/plugin-platform-* peer @tarojs/service@x.y.z），
    # 单包升级必现 peer 冲突（曾关闭 #2644/#2645/#2634 等「半套升级」PR）。
    # 升级路径：整组升版本 + 跑 mini-app CI 与视觉回归，作为一次工程级 PR 提交。
    ignore:
      - dependency-name: "@tarojs/*"
      - dependency-name: "babel-preset-taro"
      - dependency-name: "eslint-config-taro"
      # Babel 8 与现有 Babel 7 工具链（babel-jest/预设）不兼容（曾关闭 #2642/#2838）；
      # eslint-plugin-react-hooks 7 与当前 eslint 8 不兼容（曾关闭 #2831）。均需工程级整组升级。
      - dependency-name: "@babel/core"
        versions: [">=8.0.0"]
      - dependency-name: "@babel/runtime"
        versions: [">=8.0.0"]
      - dependency-name: "eslint-plugin-react-hooks"
        versions: [">=7.0.0"]

  - package-ecosystem: "npm"
    directory: "/tests"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "type/chore"
      - "role/qa"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "type/chore"
      - "role/qa"
