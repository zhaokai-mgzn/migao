# Dependabot 配置 — 依赖自动更新
# 每周一检查依赖更新；合并前需通过 PR 门禁（pr-check / ai-agent-tests）
# 更多：https://docs.github.com/code-security/dependabot
version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/backend/admin-api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "type/chore"
      - "role/backend"
    # mybatis-plus 3.5.9+ 破坏性：extension 拆独立模块，单包升级必现类冲突（曾关闭 #2620）。
    # 升级路径：starter+extension 整组升，作为一次工程级 PR。
    ignore:
      - dependency-name: "com.baomidou:mybatis-plus-*"
        versions: [">=3.5.9"]
      # Spring Boot 4 是一次大版本迁移：一批 starter 从 spring-boot-dependencies 的版本管理里
      # 移出/改名（#8221 实撞：'dependencies.dependency.version' for spring-boot-starter-aop is
      # missing），且自动配置类路径整体迁移（boot.autoconfigure.* → boot.*.autoconfigure）。
      # 升级路径：独立专项单 —— 逐条核对 starter、修类名迁移、跑真库族回归。
      - dependency-name: "org.springframework.boot:spring-boot-starter-parent"
        update-types: ["version-update:semver-major"]
      # springdoc 3.x 按 Spring Boot 4 编译（#8215 实撞：JacksonAutoConfiguration 在两个包路径下
      # 同名 bean 冲突，overriding 默认关闭 ⇒ 应用起不来）⇒ 必须等 Boot 4 专项落地后再升。
      - dependency-name: "org.springdoc:springdoc-openapi-starter-*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "pip"
    directory: "/backend/ai-agent-service"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "type/chore"
      - "role/backend"
    # langchain 全家桶必须整组同步升级：langchain-openai 1.6.x 要求 langchain-core 1.6.x，
    # 而仓库钉住 langchain-core==1.4.8（audit-2026-09 实测冲突组合），单包升级必现
    # pip ResolutionImpossible（曾关闭 langchain-openai 1.6 冲突 PR）。
    # 升级路径：core+openai+deepseek+graph+checkpoint+prebuilt+sd 整组升，作为一次工程级 PR。
    ignore:
      - dependency-name: "langchain-core"
      - dependency-name: "langchain-openai"
      - dependency-name: "langchain-deepseek"
      # pytest 9 与 requirements.txt 里部分包冲突（#8216 实撞：pip 直接
      # ResolutionImpossible ⇒ 整条 ai-agent-service unit tests 腿红）。等那些包发布
      # 支持 pytest 9 的版本后再升，不硬推。
      - dependency-name: "pytest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "langgraph"
      - dependency-name: "langgraph-checkpoint"
      - dependency-name: "langgraph-prebuilt"
      # pytest-asyncio 1.x 与 pytest==8.3.4 不共存（曾关闭 #2624）；redis 5→8 跨 3 个大版本，
      # 连接池/响应类型 API 破坏面大，需工程级评估（曾关闭 #2833）。两者大版本升级统一走工程级 PR。
      - dependency-name: "pytest-asyncio"
        versions: [">=1.0.0"]
      - dependency-name: "redis"
        versions: [">=8.0.0"]

  - package-ecosystem: "npm"
    directory: "/frontend/admin-web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "type/chore"
      - "role/frontend"
    # 半套升级/大版本破坏（曾关闭 #2631/#2639/#2718/#2839）：
    # - vitest 4 需 @vitest/coverage-v8 4 配套，单升必 peer 冲突
    # - tailwindcss 4 拆分 @tailwindcss/postcss 插件，工程级迁移
    # - typescript 5→7 大版本跳变，需工程级评估
    ignore:
      - dependency-name: "vitest"
        versions: [">=4.0.0"]
      - dependency-name: "@vitest/coverage-v8"
        versions: [">=4.0.0"]
      - dependency-name: "tailwindcss"
        versions: [">=4.0.0"]
      - dependency-name: "typescript"
        versions: [">=6.0.0"]

  - package-ecosystem: "npm"
    directory: "/frontend/mini-app"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "type/chore"
      - "role/frontend"
    # Taro 全家桶（@tarojs/* + babel-preset-taro + eslint-config-taro）必须整组同版本升级：
    # 各包 peer 依赖互指精确版本（如 @tarojs/plugin-platform-* peer @tarojs/service@x.y.z），
    # 单包升级必现 peer 冲突（曾关闭 #2644/#2645/#2634 等「半套升级」PR）。
    # 升级路径：整组升版本 + 跑 mini-app CI 与视觉回归，作为一次工程级 PR 提交。
    ignore:
      - dependency-name: "@tarojs/*"
      - dependency-name: "babel-preset-taro"
      - dependency-name: "eslint-config-taro"
      # Babel 8 与现有 Babel 7 工具链（babel-jest/预设）不兼容（曾关闭 #2642/#2838）；
      # eslint-plugin-react-hooks 7 与当前 eslint 8 不兼容（曾关闭 #2831）。均需工程级整组升级。
      - dependency-name: "@babel/core"
        versions: [">=8.0.0"]
      - dependency-name: "@babel/runtime"
        versions: [">=8.0.0"]
      - dependency-name: "eslint-plugin-react-hooks"
        versions: [">=7.0.0"]
      # Taro 4.2.1 的 @tarojs/react peer 写死 `react: ^18`（现取：npm view @tarojs/react@4.2.1
      # peerDependencies ⇒ { react: '^18' }）⇒ react-dom 19 在依赖层面就不成立（#8225 曾关闭，
      # CI 报 Conflicting peer dependency: react@19.3.1）。而且 dependabot 只升 react-dom、
      # 不升 react，「半套升级」必现 peer 冲突。
      # 升级路径：先升 Taro 到支持 React 19 的版本（整组升，见上面 @tarojs/* 那条），
      # 再同步升 react + react-dom，作为一次工程级 PR。
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/tests"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "type/chore"
      - "role/qa"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "type/chore"
      - "role/qa"
