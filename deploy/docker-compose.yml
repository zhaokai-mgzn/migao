version: '3.8'

# 注意：此 docker-compose.yml 用于本地开发环境
# 生产环境使用阿里云 RDS/Redis，见 deploy/terraform/

x-env: &db-env
  RDS_HOST: postgres
  RDS_PORT: "5432"
  RDS_DB: ai_customer_service
  RDS_USER: app_user
  RDS_PASSWORD: ${DEV_DB_PASSWORD:-dev_password_123}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${DEV_REDIS_PASSWORD:-dev_redis_456}

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:15-alpine
    container_name: aikf-postgres
    environment:
      # 统一时区 UTC+8
      TZ: Asia/Shanghai
      POSTGRES_DB: ai_customer_service
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: ${DEV_DB_PASSWORD:-dev_password_123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../docs/sql/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql
    healthcheck:
      # 必须显式指定 -d 目标库：`pg_isready -U app_user` 会以「用户名」为库名连接，
      # 而本实例只有 POSTGRES_DB=ai_customer_service，并无名为 app_user 的库 →
      # 报 `FATAL: database "app_user" does not exist` → 容器永远 unhealthy
      # → `docker compose up --wait` 判定 postgres 未就绪 → 整个栈起不来。
      # （issue #3270 实测：schema 初始化其实已成功，卡点就在这条健康检查。）
      test: ["CMD-SHELL", "pg_isready -U app_user -d ai_customer_service"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存（开发环境仍需密码）
  redis:
    image: redis:7-alpine
    container_name: aikf-redis
    command: redis-server --requirepass ${DEV_REDIS_PASSWORD:-dev_redis_456}
    environment:
      # 统一时区 UTC+8
      TZ: Asia/Shanghai
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${DEV_REDIS_PASSWORD:-dev_redis_456}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Java Admin API
  admin-api:
    build:
      context: ../backend/admin-api
      dockerfile: Dockerfile
    container_name: aikf-admin-api
    environment:
      <<: *db-env
      # 统一时区 UTC+8（业务时间均为北京时间）
      TZ: Asia/Shanghai
      # ⚠️ 审计 07 P0-3: 移除可猜测默认值（dev-service-token-secret 曾公开可猜）。
      # 本地启动前必须显式 export DEV_SERVICE_TOKEN=<强随机值>，否则服务间鉴权 fail-closed。
      SERVICE_TOKEN_SECRET: ${DEV_SERVICE_TOKEN:?请先 export DEV_SERVICE_TOKEN（服务间共享令牌，强随机值）}
      # 审计 07 P0-1: sms.bypass-code 默认已改空（生产 fail-closed）。
      # dev compose 在此显式注入万能码，保持测试环境 123456 登录可用（仅 dev 生效）。
      SMS_BYPASS_CODE: ${SMS_BYPASS_CODE:-123456}
      # ── RS256 密钥（issue #3270）──
      # 生产用 JWT_PRIVATE_KEY/JWT_PUBLIC_KEY 指向密钥文件；但本仓库
      # `.gitignore:79 **/rsa/private.pem` **刻意排除** src/main/resources/rsa/private.pem
      # （安全设计：私钥不入库）→ CI/全新 clone 的镜像里没有该文件 →
      # JwtTokenProvider.init() fail-fast 抛「JWT RSA 密钥加载失败」→ admin-api 起不来。
      # 解法：走 **PEM 内容注入**（优先级高于文件路径，JwtTokenProvider 已支持），
      # 内容取自仓库中**已入库的测试密钥对** `src/test/resources/rsa/*.pem`
      # （.gitignore:81 显式白名单）——仅用于本地/CI dev 栈，不涉及生产密钥。
      JWT_PRIVATE_KEY_PEM: ${JWT_PRIVATE_KEY_PEM:-}
      JWT_PUBLIC_KEY_PEM: ${JWT_PUBLIC_KEY_PEM:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Python AI Agent Service
  ai-agent-service:
    build:
      context: ../backend/ai-agent-service
      dockerfile: Dockerfile
    container_name: aikf-ai-agent
    environment:
      # 统一时区 UTC+8（业务时间均为北京时间）
      TZ: Asia/Shanghai
      DATABASE_URL: postgresql+asyncpg://app_user:${DEV_DB_PASSWORD:-dev_password_123}@postgres:5432/ai_customer_service
      REDIS_URL: redis://:${DEV_REDIS_PASSWORD:-dev_redis_456}@redis:6379/0
      ADMIN_API_BASE_URL: http://admin-api:8080
      SERVICE_TOKEN: ${DEV_SERVICE_TOKEN:?请先 export DEV_SERVICE_TOKEN（与 admin-api 保持一致）}
      # 审计 07 P0-1: 与 admin-api 对齐，dev 显式注入万能码（order_create 客户下单验证）
      SMS_BYPASS_CODE: ${SMS_BYPASS_CODE:-123456}
      # ⚠️ DEBUG 必须透传（issue #3270）：ai-agent 的 X-Debug-Role 调试身份注入
      # 只在 DEBUG=true 时生效（app/utils/auth.py fail-closed）。此前 compose 未传
      # DEBUG → 容器内 DEBUG=False、Environment=production → 评测带
      # `X-Debug-Role: customer` 请求被 401 AUTH_REQUIRED 拒绝 → C 端评测 100% 失败。
      # 本地栈评测必需；生产 compose 不设该变量（保持 fail-closed）。
      DEBUG: ${DEBUG:-false}
      PRIMARY_API_KEY: ${PRIMARY_API_KEY:-}
      PRIMARY_MODEL: ${PRIMARY_MODEL:-deepseek-flash}
      DASHVECTOR_API_KEY: ${DASHVECTOR_API_KEY:-}
      DASHVECTOR_ENDPOINT: ${DASHVECTOR_ENDPOINT:-}
      # ── 以下 6 项在 app/config.py 里是**无默认值的必填字段**（Settings 直接
      #    声明 `X: str`，缺一个则 pydantic 校验失败、服务起不来）——
      #    2026-09-11 实测 aikf-ai-agent 报 6 validation errors 即此因（issue #3270）。
      #    dev 栈给可用默认值；生产由 main.tf locals 注入。
      # JWT 公钥（用于校验 admin-api 签发的 RS256 token）：dev 用仓库内 public.pem 内容
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      LOGISTICS_API_URL: ${LOGISTICS_API_URL:-}
      LOGISTICS_APPCODE: ${LOGISTICS_APPCODE:-}
      SSE_TIMEOUT: ${SSE_TIMEOUT:-300}
      SSE_PING_INTERVAL: ${SSE_PING_INTERVAL:-15}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3001,http://localhost:8080}
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      admin-api:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
