# SWAS 生产 docker-compose（canonical，由 deploy.sh 从 repo 同步到服务器）
#
# 快速部署：CI 构建镜像推送到 ACR，服务器只 pull + up（不做源码构建）。
# 环境变量（.env.admin-api/.env.ai-agent/.env.admin-web）与 TLS 证书在服务器侧，不入仓。
# 镜像 tag 由 IMAGE_TAG 控制（默认 latest）；deploy.sh 通过环境注入。

# ── 容器日志上限（issue #8197 P1-02，2026-10-31 上线审计）────────────────────────────
# 病：改前四个服务**都没有 `logging:` 段** ⇒ docker 默认的 json-file 驱动**无上限**。
#     单机 SWAS 上日志单调增长 ⇒ 磁盘打满 ⇒ 四个服务同时 502（`restart: unless-stopped`
#     救不了「写不进去」），而且**没有任何读数会先变红**。
# 修：每个容器 `max-size: 50m` + `max-file: 3` ⇒ 单容器上界 **150MB**，四个服务合计 600MB。
#     ⚠️ 这两条是**上界**，不是目标值：`deploy.sh` 的「2.8 磁盘与容器日志水位读数」每次部署
#     把实测占用打进日志，**超过上界总和**即意味着轮转没生效（`logging:` 被删 / docker 不认）
#     —— 那件事改前同样是静默的（**只读读数，不新增任何定时删除**）。
# ⚠️ 判据（会红）：tests/unit_ci_workflows/test_swas_container_runtime.py 逐服务比对 `logging:`
#    与 `deploy.sh` 的 `LOG_CAP_MB` / `LOG_MAX_FILES`（同一份口径，两处不许各写各的）。
x-logging: &migao-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  admin-api:
    image: ${ACR_REGISTRY:-crpi-qdcgkzwx9p9zckga.cn-hangzhou.personal.cr.aliyuncs.com}/ai-customer-service/admin-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env.admin-api
    environment:
      # 统一时区 UTC+8（业务时间均为北京时间）
      TZ: Asia/Shanghai
      # AI 自动甄别：admin-api 调用 ai-agent-service 内部端点（同 compose 网络）
      # 注意：AI_AGENT_SERVICE_TOKEN 只经 env_file(.env.admin-api) 注入——
      # compose environment 的 ${VAR:-} 插值读不到 .env.admin-api，会覆盖为空导致
      # ai-agent 401 校验失败（入驻 fail-closed 系统繁忙）。deploy.sh 自愈补齐该值。
      AI_AGENT_BASE_URL: http://ai-agent:8000
      # B 端小程序（bmini）凭据（issue #8196 ①）：WECHAT_BMINI_APPID / WECHAT_BMINI_SECRET
      # —— **只经 env_file(.env.admin-api) 注入**，这里**故意不放** `environment:` 透传：
      # 理由与上面 AI_AGENT_SERVICE_TOKEN 逐字相同 —— compose 的 environment 优先级高于 env_file，
      # 而 `${VAR:-}` 插值读不到 .env.admin-api ⇒ 服务器没在 shell 里 export 时会把真值**覆盖成空串**
      # （2026-08-30 已在那个 key 上踩过，commit 988e490f0 删掉了那行）。
      # 缺失时 admin-api 启动期打一条 WARN（WechatService 的 @PostConstruct），不阻止启动。
      # 判据 = tests/unit_ci_workflows/test_wechat_bmini_env_wiring.py
    ports:
      - "127.0.0.1:8080:8080"
    # ── 宿主挂载（issue #8969，2026-11-21 生产 `api.cytda.com` 502 约 3min 的事故）────────────
    # 这两条**不是可选优化**：删掉任何一条 = 容器起来即崩 / 用户上传数据丢。
    # ① `/opt/migao-deploy/jwt`：`.env.admin-api` 用的是**文件式**私钥
    #    `JWT_PRIVATE_KEY=file:/opt/migao-deploy/jwt/private.pem`（PEM 内容型 `JWT_PRIVATE_KEY_PEM`
    #    只在本地/CI 用）⇒ 容器里没有这个路径时，`JwtTokenProvider` 的 RS256 fail-closed 分支
    #    直接抛 `IllegalStateException`（「JWT RSA 密钥加载失败，无法启用 RS256 签名」）⇒ 重启循环。
    #    🔴 生产旧容器**看起来有**这两个挂载（`docker inspect` 可见 `/opt/migao-deploy/jwt`、
    #    `/opt/migao-deploy/uploads`），但它们来自**历史手工创建** —— 仓库 compose 从来没有
    #    ⇒ 只要「按仓库 compose 重建容器」就必然炸（实测：手工 `docker run` 补上挂载 ⇒ healthy）。
    # ② `/app/uploads`：`LocalFileStorageService.UPLOAD_DIR = "uploads"` 是**相对路径**
    #    （`WebConfig` 也以 `file:uploads/` 暴露静态面），而 Dockerfile 的 `WORKDIR /app`
    #    ⇒ 实际落盘 `/app/uploads`。不挂宿主卷 ⇒ 容器一重建，用户上传的图片**全丢**，且没有读数为红。
    # ⚠️ 判据（会红）：tests/unit_ci_workflows/test_swas_deploy_blue_green.py（green 与正式服务
    #    volumes 逐字一致）与 tests/unit_ci_workflows/test_swas_container_runtime.py（这两条卷在位 +
    #    `.env.*` 里所有 `file:` 路径都被某个卷的容器目标覆盖；取不到 env ⇒ SKIPPED 不可判定）。
    volumes:
      - /opt/migao-deploy/jwt:/opt/migao-deploy/jwt:ro
      - /opt/migao-deploy/uploads:/app/uploads
    mem_limit: 1536m
    cpus: 1.0
    logging: *migao-logging
    # 健康检查（issue #8197 P1-12「假活」）：进程僵死（线程池耗尽 / 死锁）时容器仍 `Up`，
    # 而 `restart: unless-stopped` 不会重启它 —— 改前**只有 ai-agent** 有健康检查。
    # 🔴 与 `deploy/swas/deploy.sh::wait_healthy` **同源**：同一个容器端口（8080）+ 同一个路径
    #    （`/actuator/health`，即该脚本 `svc_port` / `svc_health_path` 的取值）⇒ 判据不可能漂移。
    #    ⚠️ 本段会**覆盖**镜像 Dockerfile 里的 HEALTHCHECK —— 两处必须同口径（判据钉住）。
    # ⚠️ 它只做**观测**（docker 不会因 unhealthy 自动重启，除非另接 autoheal）：价值在于
    #    `docker compose ps` / `docker inspect` 上「假活」不再长得像健康。
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  ai-agent:
    image: ${ACR_REGISTRY:-crpi-qdcgkzwx9p9zckga.cn-hangzhou.personal.cr.aliyuncs.com}/ai-customer-service/ai-agent-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env.ai-agent
    environment:
      # #7340：共享云建会话必须落到已 seed 的 tenant 1；environment 覆盖 .env.ai-agent
      # 里可能残留的旧 EVAL_TENANT_ID=25（compose 的 environment 优先于 env_file）。
      EVAL_TENANT_ID: "1"
      # 统一时区 UTC+8（业务时间均为北京时间）
      TZ: Asia/Shanghai
      # ── 验签公钥与 admin-api 的**签名密钥**同源（issue #8976；2026-11-21 生产 AI 接口全 401）──────
      # 改前这里是**硬编码的 PEM**，而 admin-api 用 `.env.admin-api` 的 `JWT_*`
      # （`file:/opt/migao-deploy/jwt/*.pem`）签发 ⇒ 同一个 token 配了两把钥匙 ⇒ 生产 AI 接口**全部 401**
      # （`TOKEN_INVALID: Signature verification failed`；实测公钥指纹 ai-agent=ba01a29f… vs
      #  admin-api=c58e54d6…），而且**两侧都不报错、永远不会自己好**。
      # 现在只给**路径**、不给内容：内容就是 admin-api 私钥那一对的 public 半份（服务器同一份文件）
      # ⇒ 「换钥匙」只换那一份，两处同时跟上（单一来源）。**本行故意放在 `environment:`**（优先级高于
      # `env_file`）：`.env.ai-agent` 里若残留旧 PEM，被这里覆盖掉，不会再悄悄回到两把钥匙。
      # ⚠️ 文件缺失 ⇒ ai-agent **起不来**（fail-closed）：宁可这次部署失败，也不许它拿错钥匙继续全 401。
      JWT_PUBLIC_KEY: file:/opt/migao-deploy/jwt/public.pem
    ports:
      - "127.0.0.1:8000:8000"
    # 宿主挂载（issue #8976）：`JWT_PUBLIC_KEY` 是**文件式**取值 ⇒ 容器里必须真有这个路径。
    # 与 admin-api **同一份**卷源（同目录、同样 `:ro`）—— 这就是「单一来源」的唯一实体面。
    # ⚠️ 判据（会红）：tests/unit_ci_workflows/test_swas_jwt_same_source.py（值 = file: + 卷在位）；
    # 同目录 test_swas_container_runtime.py 的类级判据另扫 `environment:` 里的 `file:` 路径。
    volumes:
      - /opt/migao-deploy/jwt:/opt/migao-deploy/jwt:ro
    mem_limit: 1024m
    cpus: 1.0
    logging: *migao-logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  admin-web:
    image: ${ACR_REGISTRY:-crpi-qdcgkzwx9p9zckga.cn-hangzhou.personal.cr.aliyuncs.com}/ai-customer-service/admin-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env.admin-web
    environment:
      # 统一时区 UTC+8（业务时间均为北京时间）
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:3001:3001"
    mem_limit: 512m
    cpus: 0.5
    logging: *migao-logging
    # 健康检查（issue #8197 P1-12）：与 `deploy.sh::wait_healthy` **同源** —— 同一个端口（3001）、
    # 同一个路径（`/`），且**照抄它的状态码集合**（200/301/302 都算活：admin-web 的 `/` 可能是
    # 一条跳转）。image 是 `node:20-alpine`（没有 curl）⇒ 用 node 的 fetch 表达同一份判据，
    # 不引入第二套语义（例如「只认 200」会让健康检查比部署判据更严 ⇒ 回滚抖动）。
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/').then(r=>process.exit([200,301,302].includes(r.status)?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    environment:
      # 统一时区 UTC+8（所有系统/agent 业务时间均为北京时间）
      TZ: Asia/Shanghai
    ports:
      - "80:80"
      - "443:443"
    mem_limit: 256m
    cpus: 0.25
    logging: *migao-logging
    # 健康检查（issue #8197 P1-12）：nginx 没有「上游」可探 —— 探一个**只表达「nginx 进程还在
    # 按配置应答」**的本地面：`deploy/swas/nginx.conf` 的 `location = /healthz`（:80，回一行 200，
    # `access_log off`，不碰磁盘 / 不代理 / 不碰证书）。
    # ⚠️ 刻意**不**探 https 的静态面：那要 `--no-check-certificate` 且依赖某个已发布文件存在，
    #    会把「健康」绑到发布状态上（没发布 ⇒ nginx 被判死）。
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --tries=1 http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./certbot-www:/var/www/certbot
      # C 端 H5 静态文件（app.migaozn.com）
      - ./h5:/opt/migao-deploy/h5:ro
