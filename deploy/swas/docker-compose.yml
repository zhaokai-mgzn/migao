# SWAS 生产 docker-compose（canonical，由 deploy.sh 从 repo 同步到服务器）
#
# 快速部署：CI 构建镜像推送到 ACR，服务器只 pull + up（不做源码构建）。
# 环境变量（.env.admin-api/.env.ai-agent/.env.admin-web）与 TLS 证书在服务器侧，不入仓。
# 镜像 tag 由 IMAGE_TAG 控制（默认 latest）；deploy.sh 通过环境注入。

services:
  admin-api:
    image: ${ACR_REGISTRY:-crpi-qdcgkzwx9p9zckga.cn-hangzhou.personal.cr.aliyuncs.com}/ai-customer-service/admin-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env.admin-api
    ports:
      - "8080:8080"

  ai-agent:
    image: ${ACR_REGISTRY:-crpi-qdcgkzwx9p9zckga.cn-hangzhou.personal.cr.aliyuncs.com}/ai-customer-service/ai-agent-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env.ai-agent
    environment:
      # 校验 admin-api 签发的 JWT 所需的公开密钥（非敏感，可入仓）
      JWT_PUBLIC_KEY: |
        -----BEGIN PUBLIC KEY-----
        MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAyDkix6IDMt3wkCAY1Phk
        O56ihiAu9deWNU/kfRn0dnc/iKC3sqmjlE7Te854xOuy1EjvIbDAXDFbaKHMOM76
        itKKIvSpOzGsSaEuerNsQH6+il9KgnO2rk4z9fDEoX9ZYnzIjr3n/oM6mv3Nfh+x
        17QMdMo9n29cHlznQAVc4kAJ1ACu4eYJVxiH6WZNtXLu6PkiU+YqsaPOGchvp1Xy
        PmZXyJJl0r+xDEVCgfXLsStFTau/9B5YxMv28N5gg1JbwpZNBpBYZ00J90lQkT+5
        Lpl0Tto5k/R08bFvAn8uf0PcbpOQ70Ibs9R7T/MHfK0NKyBrwZnzEdcIEQ6Pdn9g
        RwIDAQAB
        -----END PUBLIC KEY-----
    ports:
      - "8000:8000"

  admin-web:
    image: ${ACR_REGISTRY:-crpi-qdcgkzwx9p9zckga.cn-hangzhou.personal.cr.aliyuncs.com}/ai-customer-service/admin-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env.admin-web
    ports:
      - "3001:3001"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./certbot-www:/var/www/certbot
      # C 端 H5 静态文件（app.migaozn.com）
      - ./h5:/opt/migao-deploy/h5:ro
