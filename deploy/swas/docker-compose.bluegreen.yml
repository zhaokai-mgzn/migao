# SWAS 蓝绿部署 override（issue #4785）—— **只新增服务**，不改 docker-compose.yml 的既有服务定义。
#
# 用法（只在 deploy.sh 的蓝绿预验证段用）：
#   docker compose -f docker-compose.yml -f docker-compose.bluegreen.yml up -d --no-deps admin-api-green
#   docker compose -f docker-compose.yml -f docker-compose.bluegreen.yml rm -sf admin-api-green
# 正式部署仍走不带本文件的 `docker compose up -d --no-deps <服务>`（正式服务定义一字未动）。
#
# 语义：green = 「与正式服务**同镜像、同 env_file、同资源限制**，但**新容器名 + 第二端口**」的
# **探针容器**。它存在的唯一目的：在**不动旧容器**的前提下，证明「新镜像能起、能应答健康检查」。
#
# 三条刻意的差异（逐条说明，issue #4785 要求）：
#   ① `restart: "no"` —— 探针崩了**不许自愈复活**：`unless-stopped` 会让 green 在 docker 重启后
#      被拉起来，占着第二端口并让下一次部署撞名字/端口（推演项「restart 让旧容器复活」的同族）；
#   ② **不发布正式端口**（8080/8000/3001）—— 发布就与旧容器抢宿主端口，green 必然起不来，
#      而「旧容器不动」正是蓝绿的前提；
#   ③ 第二端口绑 `127.0.0.1`（仅本机健康检查用），不对外暴露（不对公网新增入口）。
#
# 健康检查判据不在这里：由 deploy.sh 的 `wait_healthy()` **统一给出**，与正式容器**同一份函数**
# ⇒ 判据不可能漂移（「两套判据 / 判据过严导致回滚抖动」由此排除）。
#
# ⚠️ 抗漂移红线：本文件里每个 green 的 image / env_file / environment / mem_limit / cpus / healthcheck
#    必须与 docker-compose.yml 里对应服务**逐字一致**（green 跑的就是同一份配置）。
#    守卫 = tests/unit_ci_workflows/test_swas_deploy_blue_green.py（不一致即判红，含注入式自证）。
#    第二端口的默认值必须与 deploy.sh 的 `BG_*_PORT` 默认值一致（同一守卫钉住）。
#
# 为什么不写 `extends: file: docker-compose.yml`（更省重复）—— compose 的 `extends` 对
# `ports` 这类**序列**是合并还是替换，各版本口径不一；若为「合并」则 green 会连 8080 一起绑定
# ⇒ 与旧容器抢端口 ⇒ **每次部署都必然失败**。无 docker 环境无法当场证伪 ⇒ 不拿部署链赌它，
# 改为**显式重复 + 静态守卫**（守卫能判红，语义不确定的魔法不能）。

services:
  admin-api-green:
    image: ${ACR_REGISTRY:-crpi-qdcgkzwx9p9zckga.cn-hangzhou.personal.cr.aliyuncs.com}/ai-customer-service/admin-api:${IMAGE_TAG:-latest}
    restart: "no"
    env_file: .env.admin-api
    environment:
      TZ: Asia/Shanghai
      AI_AGENT_BASE_URL: http://ai-agent:8000
    ports:
      - "127.0.0.1:${BG_ADMIN_API_PORT:-18080}:8080"
    mem_limit: 1536m
    cpus: 1.0

  ai-agent-green:
    image: ${ACR_REGISTRY:-crpi-qdcgkzwx9p9zckga.cn-hangzhou.personal.cr.aliyuncs.com}/ai-customer-service/ai-agent-service:${IMAGE_TAG:-latest}
    restart: "no"
    env_file: .env.ai-agent
    environment:
      TZ: Asia/Shanghai
      JWT_PUBLIC_KEY: |
        -----BEGIN PUBLIC KEY-----
        MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAyDkix6IDMt3wkCAY1Phk
        O56ihiAu9deWNU/kfRn0dnc/iKC3sqmjlE7Te854xOuy1EjvIbDAXDFbaKHMOM76
        itKKIvSpOzGsSaEuerNsQH6+il9KgnO2rk4z9fDEoX9ZYnzIjr3n/oM6mv3Nfh+x
        17QMdMo9n29cHlznQAVc4kAJ1ACu4eYJVxiH6WZNtXLu6PkiU+YqsaPOGchvp1Xy
        PmZXyJJl0r+xDEVCgfXLsStFTau/9B5YxMv28N5gg1JbwpZNBpBYZ00J90lQkT+5
        Lpl0Tto5k/R08bFvAn8uf0PcbpOQ70Ibs9R7T/MHfK0NKyBrwZnzEdcIEQ6Pdn9g
        RwIDAQAB
        -----END PUBLIC KEY-----
    ports:
      - "127.0.0.1:${BG_AI_AGENT_PORT:-18000}:8000"
    mem_limit: 1024m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)"]
