# migao 域名反向代理 (2026-08-14 整理)
# 后端:  api.migaozn.com -> admin-api:8080
#        ai-api.migaozn.com -> ai-agent:8000
# 前端:  migaozn.com / www / merchant -> admin-web:3001（ops.migaozn.com 已废弃：
#        商家入驻 2026-08-30 起由 AI 自动甄别，无人工审批页面）

# ===================== 限流防刷（上线清单项，关联 #20 第 3 项；2026-09-26 实装）=====================
# ⚠️ 本文件是 `./nginx/nginx.conf:/etc/nginx/conf.d/default.conf` 的**单文件挂载**
#    ⇒ 下面这些指令处在 **http 上下文**（nginx:alpine 的 nginx.conf 里 `include conf.d/*.conf`）。
#    `limit_req_zone` / `map` / `limit_req_status` 只允许在该上下文 —— 位置写错 nginx 直接起不来。
#
# 口径：**粗粒度防刷护栏，不是精确配额**。它只拦「脚本 / 爬虫 / 被刷」的量级洪峰；
# 精确配额仍在应用层（短信：每手机号 1 次/60s + 10 次/日；注册：每手机号 3 次/日 + 每 IP 5 次/时）。
#
# 【阈值推导 —— 不是拍的数】
# 一次正常「最重的 admin-web 页面」加载 = **9** 个动态请求：
#   · 6 = `production/routings` 首屏那波并发（getRoutings / getOperationsCatalog / getSeedTemplates /
#         getOperationPositions / getRouteRules / getRouteRuleOptions）
#   · +1 = 同页「算料配置」tab 懒加载（getCraftCalcConfig）
#   · +1 = `/api/auth/me` 引导（store/auth.initialize → authApi.getUserInfo）
#   · +1 = 未读通知数（NotificationBell 加载即拉一次，其后每 30s 一次 ⇒ 每个标签页 2 r/m）
#   ⇒ 这个 9 **不是注释里的死数**：tests/unit_ci_workflows/test_swas_nginx_rate_limit.py
#     每次都从 admin-web 源码**重算**（`Promise.all` 最大并发 + 三个单例的现场锚点），
#     并对每个 zone 断言 `burst ≥ 10 × 实测值` —— 页面长大了判据会红，逼着重新推导而不是让注释过期。
#
# 【工人端（app.migaozn.com 的 `/w/` 报工页 + `/s/` 短链）—— 本档刻意最宽】
#   页面加载 = 1 个动态请求（`/api/worker/production/current-worker`）；
#   扫一次码 = 2 个（`/api/worker/production/scan` + `…/scan/complete`）；`/s/<码>` = 1 个。
#   🔴 车间的手机/PAD 通常**共用一个公网 IP**（车间 WiFi）⇒ 对工人面**不设**小额的 per-IP 额度：
#      改用「**会话**（X-Worker-Session-Id）+ 一个很宽的 per-IP 兜底」两个 key。
#
# 【静态面一律不限流】`/w/`、C 端 H5、admin-web 的 JS/CSS 都走各自的静态/前端 `location /`
#   —— 一次页面加载要取几十个静态文件，套限流必然误伤 ⇒ 那几个 location 里**没有** limit_req（有意）。

# 取 key 的 map：**命中才非空**。nginx 文档（ngx_http_limit_req_module）：
#   “Requests with an empty key value are not accounted.”
# ⇒ 用 map 让「只该算某类请求」的 zone 与其它请求天然隔离，而不必新开 location（少改一处 = 少一处风险）。
map $request_uri $api_perip_key {
    default          $binary_remote_addr;
    # 工人面不吃通用 per-IP 额度（车间 NAT 会把一个班次压成"一个来源"）⇒ 改用下面 worker 的两档
    ~^/api/worker/   "";
}
# 登录面：正常一次登录 = 1 个请求。给到 burst 60 = 60×（够一次交接班 60 台设备同 IP 同时登录）。
# 只收**密码 / PIN 类**登录（可被暴力猜解的）；C 端的微信 / SMS 登录**有意不收进来**：
# 它们天然在运营商 NAT / CGNAT 之后（一个出口 IP 一分钟能来几十上百次 App 启动），紧档会误伤，
# 而它们本身是「微信 code / 验证码」换取，且应用层已有护栏（验证码错 5 次锁 5 分钟）——
# 那类请求走通用档（api_perip，burst 200）。
map $request_uri $auth_login_key {
    default "";
    ~^/api/auth/(admin/login|employee/login)(\?|$)  $binary_remote_addr;
    ~^/api/worker/login(\?|$)                       $binary_remote_addr;
}
# 花钱 / 可被刷的面（短信下发、商家注册提交）：正常一次操作 = 1 个请求，单独更紧一档
map $request_uri $abuse_key {
    default "";
    ~^/api/auth/(sms/send|register)(\?|$)  $binary_remote_addr;
}
# 工人入口面（`/s/` 短链 + `/api/worker/`）的 per-IP 兜底：只挡洪峰，不挡一个班次
map $request_uri $worker_entry_key {
    default "";
    ~^/(s/|api/worker/)  $binary_remote_addr;
}
# 工人会话 key：**只接受形如服务端签发的那类 id**（admin-api 侧是 UUID 去掉连字符的 32 位）。
# 其余（缺头 / 畸形 / 超长）⇒ key 空 ⇒ 不计入该 zone —— 既不让伪造的畸形头撑爆共享内存，
# 也不影响它们被 worker_entry（per-IP）计数。
map $http_x_worker_session_id $worker_sess_key {
    default                     "";
    "~^[0-9A-Za-z_-]{8,64}$"    $http_x_worker_session_id;
}

# ① 通用动态面（per-IP）：burst 200 = 22× 上面实测的 9；rate 10 r/s = 600 r/m
#    ≈ 每分钟 66 次「最重的页面加载」。够扛一个办公室/一个 CGNAT 出口的正常并发。
limit_req_zone $api_perip_key     zone=api_perip:10m    rate=10r/s;
# ② 登录面（per-IP）：rate 1 r/s（暴力破解的量级上限），burst 60 = 60× 正常值
limit_req_zone $auth_login_key    zone=auth_perip:10m   rate=1r/s;
# ③ 花钱/可被刷面（per-IP）：rate 6 r/m（10 秒 1 次），burst 10 = 10× 正常值
limit_req_zone $abuse_key         zone=abuse_perip:10m  rate=6r/m;
# ④ 工人**会话**面：一次扫码 2 个请求 ⇒ burst 60 够连扫 30 件；rate 2 r/s = 60 次扫码/分。
#    key = 服务端签发的会话 id，仅作**内存**计数键（不落日志、不落盘）。一机一会话 ⇒ 与 NAT 无关。
limit_req_zone $worker_sess_key   zone=worker_sess:10m  rate=2r/s;
# ⑤ 工人入口面（per-IP 兜底）：一次扫码 1 个请求 ⇒ burst 1000 极宽；rate 50 r/s
#    ⇒ 车间整层共用一个公网 IP 也拦不到（即便 100 台设备同时在线，人均仍有 0.5 r/s 以上）。
limit_req_zone $worker_entry_key  zone=worker_entry:10m rate=50r/s;

# 超限统一 429（默认是 503「服务不可用」—— 那个码会把人引向错误的排查方向），并让被拦请求在日志里可见
limit_req_status 429;
limit_req_log_level warn;

# HTTP -> HTTPS
server {
    listen 80;
    server_name api.migaozn.com ai-api.migaozn.com
                migaozn.com www.migaozn.com merchant.migaozn.com;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- 后端 API ----
server {
    listen 443 ssl;
    http2 on;
    server_name api.migaozn.com;
    ssl_certificate     /etc/letsencrypt/live/migao/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/migao/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 100m;

    # 屏蔽管理端敏感端点公网访问（actuator 详情/OpenAPI 文档/Swagger UI）
    location ~ ^/(actuator|v3/api-docs|swagger-ui)(/|$) {
        return 404;
    }

    # 本域**整域都是动态面**（没有静态文件）⇒ 五个 zone 全挂上（各自按 map 的 key 只算自己那类请求）
    location / {
        limit_req zone=api_perip    burst=200 nodelay;
        limit_req zone=auth_perip   burst=60  nodelay;
        limit_req zone=abuse_perip  burst=10  nodelay;
        limit_req zone=worker_sess  burst=60  nodelay;
        limit_req zone=worker_entry burst=1000 nodelay;
        proxy_pass http://admin-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;  # 覆盖为真实客户端 IP，防伪造（Issue #2661）
        # 注：$proxy_add_x_forwarded_for 会把客户端自带头置于首位，攻击者可伪造绕过 IP 限流
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ai-api.migaozn.com;
    ssl_certificate     /etc/letsencrypt/live/migao/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/migao/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 100m;

    # 屏蔽 FastAPI 默认文档端点公网访问（/docs /redoc /openapi.json）；/health /ready 保留
    location ~ ^/(docs|redoc|openapi\.json)$ {
        return 404;
    }

    # ai-agent 域：没有登录/注册/工人端点 ⇒ 只挂通用档（LLM 调用很贵，洪峰必须挡在最外面）
    location / {
        limit_req zone=api_perip burst=200 nodelay;
        proxy_pass http://ai-agent:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;  # 覆盖为真实客户端 IP，防伪造（Issue #2661）
        # 注：$proxy_add_x_forwarded_for 会把客户端自带头置于首位，攻击者可伪造绕过 IP 限流
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# ---- 前端 (admin-web) ----
server {
    listen 443 ssl;
    http2 on;
    server_name migaozn.com www.migaozn.com merchant.migaozn.com;
    ssl_certificate     /etc/letsencrypt/live/migao/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/migao/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 100m;

    # 🔴 **不挂限流**（有意）：这里既发页面（RSC/HTML）又发 JS/CSS/字体等静态资源，
    # 一次正常页面加载要取几十个静态文件 —— 在静态面上限流必然误伤正常用户。
    # 本域的动态面（admin-web 调用的 `/api/**`）走 api.migaozn.com，那边有限流。
    location / {
        proxy_pass http://admin-web:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;  # 覆盖为真实客户端 IP，防伪造（Issue #2661）
        # 注：$proxy_add_x_forwarded_for 会把客户端自带头置于首位，攻击者可伪造绕过 IP 限流
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# ---- C 端 H5（app.migaozn.com，消费者入口）----
server {
    listen 80;
    server_name app.migaozn.com;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name app.migaozn.com;
    ssl_certificate     /etc/letsencrypt/live/migao/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/migao/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 100m;

    # C 端 H5 静态文件（Taro build:h5 产物）
    root /opt/migao-deploy/h5;
    index index.html;

    # H5 SPA fallback —— **同时承载工人端 `/w/`**（同一 root 下的子目录）
    # 🔴 **不挂限流**（有意）：一次页面加载要取 `/w/index.html` + `/w/src/*.mjs` + `/w/src/styles.css`
    # 等一串静态文件，工人手机弱网还会重试 —— 在这个 location 上限流 = 直接打断报工。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # B 端商家端 h5（`frontend/bmini-app` 的 `build:h5` 产物，issue #5668）：`https://app.migaozn.com/b/`
    # 🔴 **必须带自己的 fallback `/b/index.html`** —— 这是本段最容易出、也最难发现的一种坏：
    #    bmini h5 是**带前端路由的 SPA**；若沿用 `location /` 的 `try_files $uri $uri/ /index.html`，
    #    访问 `/b/<子路由>`（目录不存在）就会**静默回落到根 index.html = C 端小布** ⇒
    #    URL 是 `/b/…`、页面却是 C 端（**HTTP 200**，监控不红、人也只当"打开慢"）。跨应用串端**比 404 危险**。
    # ⚠️ `/b/` 的资源**必须**由发布腿按 `/b/` 前缀构建（bmini `config/index.ts` 的
    #    `h5.publicPath` 读 `TARO_APP_H5_PUBLIC_PATH`）—— 否则 index.html 会引用根级
    #    `/js/app.js`，那是 **C 端的包**，同一个坑的另一半（判据见
    #    tests/unit_ci_workflows/test_bmini_h5_hosting.py 与 deploy/swas/bmini-h5-publish-remote.sh）。
    # ⚠️ 与 `location /` 是**前缀匹配取最长者**（与书写顺序无关）：`/b/…` 比 `/` 长 ⇒ 命中本块，
    #    所以本块**不会**劫持根（根仍由上面的 `location /` 承担，判据钉住这一点）。
    # 不挂限流：与 `location /` 同因（一次页面加载要取一串静态文件，限流必然误伤）。
    location /b/ {
        try_files $uri $uri/ /b/index.html;
    }

    # 工人端稳定短链（issue #4802，设计 #4716 §1.3）：`https://app.migaozn.com/s/<短码>`
    # 必须由**服务端** 302 到报工页（`/w/?t=<token>`）。短码 ⇒ token 要**查库** ⇒
    # 静态面做不到；且部分扫码工具**只认服务端跳转**（前端 JS 跳转对它们是白屏）⇒
    # 这里只承担「转发的半边」，302 由 admin-api 出（WorkerShortLinkController）。
    # ⚠️ 与 `location /` 是**前缀匹配取最长者**（与书写顺序无关）；紧跟其后便于对照。
    # 限流：**只用 worker_entry（per-IP 50 r/s，burst 1000）**，刻意不挂通用档（10 r/s）——
    # 一个班次几十台设备同 IP 连扫时，通用档才是会误伤的那一档；本端点每次扫码只 1 个请求。
    location /s/ {
        limit_req zone=worker_entry burst=1000 nodelay;
        proxy_pass http://admin-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;  # 覆盖为真实客户端 IP，防伪造（Issue #2661）
        # 注：$proxy_add_x_forwarded_for 会把客户端自带头置于首位，攻击者可伪造绕过 IP 限流
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # ai-agent（SSE 流式，需关 buffering）—— /api/chat 前缀优先于 /api
    location /api/chat/ {
        limit_req zone=api_perip burst=200 nodelay;
        proxy_pass http://ai-agent:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;  # 覆盖为真实客户端 IP，防伪造（Issue #2661）
        # 注：$proxy_add_x_forwarded_for 会把客户端自带头置于首位，攻击者可伪造绕过 IP 限流
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # admin-api（auth / admin / customer / **worker** 等）
    # 工人端 `/api/worker/**` 也走这里：它在 api_perip 里 key 为空（map 里豁免）⇒ 只由
    # worker_sess（会话）+ worker_entry（per-IP 兜底）计数，不会被同域其它流量挤掉。
    location /api/ {
        limit_req zone=api_perip    burst=200 nodelay;
        limit_req zone=auth_perip   burst=60  nodelay;
        limit_req zone=abuse_perip  burst=10  nodelay;
        limit_req zone=worker_sess  burst=60  nodelay;
        limit_req zone=worker_entry burst=1000 nodelay;
        proxy_pass http://admin-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;  # 覆盖为真实客户端 IP，防伪造（Issue #2661）
        # 注：$proxy_add_x_forwarded_for 会把客户端自带头置于首位，攻击者可伪造绕过 IP 限流
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
