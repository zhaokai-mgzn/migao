# migao 域名反向代理 (2026-08-14 整理)
# 后端:  api.migaozn.com -> admin-api:8080
#        ai-api.migaozn.com -> ai-agent:8000
# 前端:  admin / migaozn.com / www / merchant / ops -> admin-web:3001

# HTTP -> HTTPS
server {
    listen 80;
    server_name api.migaozn.com ai-api.migaozn.com
                migaozn.com www.migaozn.com merchant.migaozn.com ops.migaozn.com;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- 后端 API ----
server {
    listen 443 ssl;
    http2 on;
    server_name api.migaozn.com;
    ssl_certificate     /etc/letsencrypt/live/migao/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/migao/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 100m;

    location / {
        proxy_pass http://admin-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ai-api.migaozn.com;
    ssl_certificate     /etc/letsencrypt/live/migao/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/migao/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 100m;

    location / {
        proxy_pass http://ai-agent:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# ---- 前端 (admin-web) ----
server {
    listen 443 ssl;
    http2 on;
    server_name migaozn.com www.migaozn.com merchant.migaozn.com ops.migaozn.com;
    ssl_certificate     /etc/letsencrypt/live/migao/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/migao/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 100m;

    location / {
        proxy_pass http://admin-web:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
