# migao 域名反向代理 (2026-08-14 整理)
# 后端:  api.migaozn.com -> admin-api:8080
#        ai-api.migaozn.com -> ai-agent:8000
# 前端:  migaozn.com / www / merchant -> admin-web:3001（ops.migaozn.com 已废弃：
#        商家入驻 2026-08-30 起由 AI 自动甄别，无人工审批页面）

# ── 上游（issue #4828）────────────────────────────────────────────────────────
# 每个后端一个 `upstream` 块，块内**恰好一行** `server <容器名>:<端口>;`。
# `deploy/swas/deploy.sh` 部署时只把这**一行**在「正式色 ⇄ green 色」之间**就地改写**
# （候选先过 `nginx -t` 校验才落盘，落盘后再校验一次才 `nginx -s reload`）⇒ 替换正式容器的那
# 几十秒里流量走在**已通过健康检查**的 green 容器上 ⇒ **成功路径零 502**（#4785 如实登记的那段）。
# ⚠️ 改这里 = 改**全站所有域名**的上游（写坏 = 全站同时挂）⇒ 只许改 `server` 行，且必须保持
#    「每个服务恰好一行」（部署脚本的切换判据按这一点算；守卫 = tests/unit_ci_workflows/
#    test_swas_deploy_blue_green.py 的 judge_upstream_indirection）。
# ⚠️ 正式色的容器名 = compose 服务名，端口 = 容器内端口（与 docker-compose.yml 一致）；
#    green 色 = `<服务>-green`（docker-compose.bluegreen.yml，同镜像 + 第二宿主端口）。
upstream migao_admin_api {
    server admin-api:8080;
}
upstream migao_ai_agent {
    server ai-agent:8000;
}
upstream migao_admin_web {
    server admin-web:3001;
}

# HTTP -> HTTPS
server {
    listen 80;
    server_name api.migaozn.com ai-api.migaozn.com
                migaozn.com www.migaozn.com merchant.migaozn.com;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- 后端 API ----
server {
    listen 443 ssl;
    http2 on;
    server_name api.migaozn.com;
    ssl_certificate     /etc/letsencrypt/live/migao/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/migao/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 100m;

    # 屏蔽管理端敏感端点公网访问（actuator 详情/OpenAPI 文档/Swagger UI）
    location ~ ^/(actuator|v3/api-docs|swagger-ui)(/|$) {
        return 404;
    }

    location / {
        proxy_pass http://migao_admin_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;  # 覆盖为真实客户端 IP，防伪造（Issue #2661）
        # 注：$proxy_add_x_forwarded_for 会把客户端自带头置于首位，攻击者可伪造绕过 IP 限流
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ai-api.migaozn.com;
    ssl_certificate     /etc/letsencrypt/live/migao/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/migao/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 100m;

    # 屏蔽 FastAPI 默认文档端点公网访问（/docs /redoc /openapi.json）；/health /ready 保留
    location ~ ^/(docs|redoc|openapi\.json)$ {
        return 404;
    }

    location / {
        proxy_pass http://migao_ai_agent;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;  # 覆盖为真实客户端 IP，防伪造（Issue #2661）
        # 注：$proxy_add_x_forwarded_for 会把客户端自带头置于首位，攻击者可伪造绕过 IP 限流
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# ---- 前端 (admin-web) ----
server {
    listen 443 ssl;
    http2 on;
    server_name migaozn.com www.migaozn.com merchant.migaozn.com;
    ssl_certificate     /etc/letsencrypt/live/migao/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/migao/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 100m;

    location / {
        proxy_pass http://migao_admin_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;  # 覆盖为真实客户端 IP，防伪造（Issue #2661）
        # 注：$proxy_add_x_forwarded_for 会把客户端自带头置于首位，攻击者可伪造绕过 IP 限流
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# ---- C 端 H5（app.migaozn.com，消费者入口）----
server {
    listen 80;
    server_name app.migaozn.com;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name app.migaozn.com;
    ssl_certificate     /etc/letsencrypt/live/migao/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/migao/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 100m;

    # C 端 H5 静态文件（Taro build:h5 产物）
    root /opt/migao-deploy/h5;
    index index.html;

    # H5 SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 工人端稳定短链（issue #4802，设计 #4716 §1.3）：`https://app.migaozn.com/s/<短码>`
    # 必须由**服务端** 302 到报工页（`/w/?t=<token>`）。短码 ⇒ token 要**查库** ⇒
    # 静态面做不到；且部分扫码工具**只认服务端跳转**（前端 JS 跳转对它们是白屏）⇒
    # 这里只承担「转发的半边」，302 由 admin-api 出（WorkerShortLinkController）。
    # ⚠️ 与 `location /` 是**前缀匹配取最长者**（与书写顺序无关）；紧跟其后便于对照。
    location /s/ {
        proxy_pass http://migao_admin_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;  # 覆盖为真实客户端 IP，防伪造（Issue #2661）
        # 注：$proxy_add_x_forwarded_for 会把客户端自带头置于首位，攻击者可伪造绕过 IP 限流
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # ai-agent（SSE 流式，需关 buffering）—— /api/chat 前缀优先于 /api
    location /api/chat/ {
        proxy_pass http://migao_ai_agent;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;  # 覆盖为真实客户端 IP，防伪造（Issue #2661）
        # 注：$proxy_add_x_forwarded_for 会把客户端自带头置于首位，攻击者可伪造绕过 IP 限流
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # admin-api（auth / admin / customer 等）
    location /api/ {
        proxy_pass http://migao_admin_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;  # 覆盖为真实客户端 IP，防伪造（Issue #2661）
        # 注：$proxy_add_x_forwarded_for 会把客户端自带头置于首位，攻击者可伪造绕过 IP 限流
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
