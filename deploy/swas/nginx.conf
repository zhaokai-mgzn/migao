# migao 域名反向代理 (2026-08-14 整理)
# 后端:  api.migaozn.com -> admin-api:8080
#        ai-api.migaozn.com -> ai-agent:8000
# 前端:  admin / migaozn.com / www / merchant / ops -> admin-web:3001

# HTTP -> HTTPS
server {
    listen 80;
    server_name api.migaozn.com ai-api.migaozn.com
                migaozn.com www.migaozn.com merchant.migaozn.com ops.migaozn.com;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- 后端 API ----
server {
    listen 443 ssl;
    http2 on;
    server_name api.migaozn.com;
    ssl_certificate     /etc/letsencrypt/live/migao/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/migao/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 100m;

    # 屏蔽管理端敏感端点公网访问（actuator 详情/OpenAPI 文档/Swagger UI）
    location ~ ^/(actuator|v3/api-docs|swagger-ui)(/|$) {
        return 404;
    }

    location / {
        proxy_pass http://admin-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ai-api.migaozn.com;
    ssl_certificate     /etc/letsencrypt/live/migao/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/migao/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 100m;

    # 屏蔽 FastAPI 默认文档端点公网访问（/docs /redoc /openapi.json）；/health /ready 保留
    location ~ ^/(docs|redoc|openapi\.json)$ {
        return 404;
    }

    location / {
        proxy_pass http://ai-agent:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# ---- 前端 (admin-web) ----
server {
    listen 443 ssl;
    http2 on;
    server_name migaozn.com www.migaozn.com merchant.migaozn.com ops.migaozn.com;
    ssl_certificate     /etc/letsencrypt/live/migao/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/migao/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 100m;

    location / {
        proxy_pass http://admin-web:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# ---- C 端 H5（app.migaozn.com，消费者入口）----
server {
    listen 80;
    server_name app.migaozn.com;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name app.migaozn.com;
    ssl_certificate     /etc/letsencrypt/live/migao/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/migao/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 100m;

    # C 端 H5 静态文件（Taro build:h5 产物）
    root /opt/migao-deploy/h5;
    index index.html;

    # H5 SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ai-agent（SSE 流式，需关 buffering）—— /api/chat 前缀优先于 /api
    location /api/chat/ {
        proxy_pass http://ai-agent:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # admin-api（auth / admin / customer 等）
    location /api/ {
        proxy_pass http://admin-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
