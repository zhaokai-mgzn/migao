<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="h.css"></head>
<body style="margin:0;padding:24px;background:#fff">
<div id="after" style="width:764px" class="space-y-4">
<section class="rounded-lg border border-neutral-200 bg-neutral-50/50 p-4 ">
  <h4 class="text-sm font-semibold text-neutral-900">用布与余量</h4>
  <p class="mt-1 text-xs leading-5 text-neutral-500">这几个数直接决定米数：每折用料 × 褶数 + 余量。</p>
  <div class="mt-3 grid grid-cols-2 gap-3 sm:grid-cols-3"><div class="min-w-0">
  <label class="mb-1 block text-xs text-neutral-500">单色每折用料</label>
  <div class="relative"><input class="w-full h-9 rounded-lg border border-neutral-300 bg-white px-3 text-sm placeholder:text-neutral-400 focus:outline-none focus:border-primary-500 focus:ring-2 focus:ring-primary-500/15 pr-9" value="0.25"><span class="pointer-events-none absolute right-2 top-1/2 -translate-y-1/2 text-xs text-neutral-500">米</span></div>
  <p class="mt-1 text-xs leading-5 text-neutral-500">单色帘按褶数算料时，每个褶用掉的布量</p>
</div><div class="min-w-0">
  <label class="mb-1 block text-xs text-neutral-500">单开余量</label>
  <div class="relative"><input class="w-full h-9 rounded-lg border border-neutral-300 bg-white px-3 text-sm placeholder:text-neutral-400 focus:outline-none focus:border-primary-500 focus:ring-2 focus:ring-primary-500/15 pr-9" value="0.1"><span class="pointer-events-none absolute right-2 top-1/2 -translate-y-1/2 text-xs text-neutral-500">米</span></div>
  <p class="mt-1 text-xs leading-5 text-neutral-500">整幅一幅做（单开）时，两边包边留出的布</p>
</div><div class="min-w-0">
  <label class="mb-1 block text-xs text-neutral-500">多开余量</label>
  <div class="relative"><input class="w-full h-9 rounded-lg border border-neutral-300 bg-white px-3 text-sm placeholder:text-neutral-400 focus:outline-none focus:border-primary-500 focus:ring-2 focus:ring-primary-500/15 pr-9" value="0.2"><span class="pointer-events-none absolute right-2 top-1/2 -translate-y-1/2 text-xs text-neutral-500">米</span></div>
  <p class="mt-1 text-xs leading-5 text-neutral-500">一幅裁成双开 / 四开时，包边 + 内侧对缝留出的布</p>
</div><div class="min-w-0">
  <label class="mb-1 block text-xs text-neutral-500">上下卷边</label>
  <div class="relative"><input class="w-full h-9 rounded-lg border border-neutral-300 bg-white px-3 text-sm placeholder:text-neutral-400 focus:outline-none focus:border-primary-500 focus:ring-2 focus:ring-primary-500/15 pr-9" value="0.3"><span class="pointer-events-none absolute right-2 top-1/2 -translate-y-1/2 text-xs text-neutral-500">米</span></div>
  <p class="mt-1 text-xs leading-5 text-neutral-500">高方向的上下卷边（脚位 + 止口）</p>
</div></div>
</section>
<div class="grid gap-4 sm:grid-cols-2"><section class="rounded-lg border border-neutral-200 bg-neutral-50/50 p-4 ">
  <h4 class="text-sm font-semibold text-neutral-900">工艺档位</h4>
  <p class="mt-1 text-xs leading-5 text-neutral-500">打孔一类工艺按档取褶倍时用（每档一个标准褶倍）。</p>
  <div class="mt-3 grid grid-cols-2 gap-3 sm:grid-cols-2"><div class="min-w-0">
  <label class="mb-1 block text-xs text-neutral-500">经济档 显示名</label>
  <div class="relative"><input class="w-full h-9 rounded-lg border border-neutral-300 bg-white px-3 text-sm placeholder:text-neutral-400 focus:outline-none focus:border-primary-500 focus:ring-2 focus:ring-primary-500/15" value="经济工艺"></div>
  
</div><div class="min-w-0">
  <label class="mb-1 block text-xs text-neutral-500">经济档 褶倍</label>
  <div class="relative"><input class="w-full h-9 rounded-lg border border-neutral-300 bg-white px-3 text-sm placeholder:text-neutral-400 focus:outline-none focus:border-primary-500 focus:ring-2 focus:ring-primary-500/15" value="1.9"></div>
  
</div><div class="min-w-0">
  <label class="mb-1 block text-xs text-neutral-500">标准档 显示名</label>
  <div class="relative"><input class="w-full h-9 rounded-lg border border-neutral-300 bg-white px-3 text-sm placeholder:text-neutral-400 focus:outline-none focus:border-primary-500 focus:ring-2 focus:ring-primary-500/15" value="标准工艺"></div>
  
</div><div class="min-w-0">
  <label class="mb-1 block text-xs text-neutral-500">标准档 褶倍</label>
  <div class="relative"><input class="w-full h-9 rounded-lg border border-neutral-300 bg-white px-3 text-sm placeholder:text-neutral-400 focus:outline-none focus:border-primary-500 focus:ring-2 focus:ring-primary-500/15" value="2.1"></div>
  
</div></div>
</section><section class="rounded-lg border border-neutral-200 bg-neutral-50/50 p-4 ">
  <h4 class="text-sm font-semibold text-neutral-900">拼色每折用料</h4>
  <p class="mt-1 text-xs leading-5 text-neutral-500">拼色帘按拼的次数各取一档，每个褶用掉的布量。</p>
  <div class="mt-3 grid grid-cols-2 gap-3 sm:grid-cols-2"><div class="min-w-0">
  <label class="mb-1 block text-xs text-neutral-500">拼1次</label>
  <div class="relative"><input class="w-full h-9 rounded-lg border border-neutral-300 bg-white px-3 text-sm placeholder:text-neutral-400 focus:outline-none focus:border-primary-500 focus:ring-2 focus:ring-primary-500/15 pr-9" value="0.66"><span class="pointer-events-none absolute right-2 top-1/2 -translate-y-1/2 text-xs text-neutral-500">米</span></div>
  
</div><div class="min-w-0">
  <label class="mb-1 block text-xs text-neutral-500">拼2次</label>
  <div class="relative"><input class="w-full h-9 rounded-lg border border-neutral-300 bg-white px-3 text-sm placeholder:text-neutral-400 focus:outline-none focus:border-primary-500 focus:ring-2 focus:ring-primary-500/15 pr-9" value="1.21"><span class="pointer-events-none absolute right-2 top-1/2 -translate-y-1/2 text-xs text-neutral-500">米</span></div>
  
</div></div>
</section></div>
<section class="rounded-lg border border-neutral-200 bg-neutral-50/50 p-4 mt-4">
  <h4 class="text-sm font-semibold text-neutral-900">备用用料公式</h4>
  <p class="mt-1 text-xs leading-5 text-neutral-500">韩褶 / 打孔按工艺自动定公式；定不出来时才用这条。</p>
  <div class="mt-3 max-w-xs"><select class="w-full h-9 rounded-lg border border-neutral-300 bg-white px-3 text-sm placeholder:text-neutral-400 focus:outline-none focus:border-primary-500 focus:ring-2 focus:ring-primary-500/15"><option>韩褶公式（褶数法）</option></select></div>
</section>
<section class="rounded-lg border border-neutral-200 bg-neutral-50/50 p-4 mt-4">
  <h4 class="text-sm font-semibold text-neutral-900">阈值试算</h4>
  <p class="mt-1 text-xs leading-5 text-neutral-500">超高 / 超宽会影响加工费按哪一档计价…**这里只试算**。</p>
  <div class="mt-3 grid grid-cols-2 gap-3 sm:grid-cols-4"><div class="min-w-0">
  <label class="mb-1 block text-xs text-neutral-500">试算窗宽</label>
  <div class="relative"><input class="w-full h-9 rounded-lg border border-neutral-300 bg-white px-3 text-sm placeholder:text-neutral-400 focus:outline-none focus:border-primary-500 focus:ring-2 focus:ring-primary-500/15 pr-9" value="5.5"><span class="pointer-events-none absolute right-2 top-1/2 -translate-y-1/2 text-xs text-neutral-500">米</span></div>
  
</div><div class="min-w-0">
  <label class="mb-1 block text-xs text-neutral-500">试算窗高</label>
  <div class="relative"><input class="w-full h-9 rounded-lg border border-neutral-300 bg-white px-3 text-sm placeholder:text-neutral-400 focus:outline-none focus:border-primary-500 focus:ring-2 focus:ring-primary-500/15 pr-9" value="3.2"><span class="pointer-events-none absolute right-2 top-1/2 -translate-y-1/2 text-xs text-neutral-500">米</span></div>
  
</div><div class="min-w-0">
  <label class="mb-1 block text-xs text-neutral-500">试算用超宽阈值</label>
  <div class="relative"><input class="w-full h-9 rounded-lg border border-neutral-300 bg-white px-3 text-sm placeholder:text-neutral-400 focus:outline-none focus:border-primary-500 focus:ring-2 focus:ring-primary-500/15 pr-9" value="5.8"><span class="pointer-events-none absolute right-2 top-1/2 -translate-y-1/2 text-xs text-neutral-500">米</span></div>
  
</div><div class="min-w-0">
  <label class="mb-1 block text-xs text-neutral-500">试算用超高阈值</label>
  <div class="relative"><input class="w-full h-9 rounded-lg border border-neutral-300 bg-white px-3 text-sm placeholder:text-neutral-400 focus:outline-none focus:border-primary-500 focus:ring-2 focus:ring-primary-500/15 pr-9" value="3.9"><span class="pointer-events-none absolute right-2 top-1/2 -translate-y-1/2 text-xs text-neutral-500">米</span></div>
  
</div></div>
</section>
</div>
</body></html>
