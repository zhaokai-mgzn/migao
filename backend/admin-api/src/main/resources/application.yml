server:
  port: 8080
  # 反向代理后的「真实协议」还原（issue #8197 P1-08，2026-10-31 上线审计）
  # 病（线上实测）：`curl -sI https://api.migaozn.com/api/version | grep -i strict-transport` **无输出** ——
  #   而 `SecurityConfig` 里明明白白声明了 HSTS（maxAge 31536000 + includeSubDomains）。
  #   机制：nginx 终止 TLS 后以 **http** 回源（真实协议放在 `X-Forwarded-Proto: https`），
  #   应用默认**不看**这个头 ⇒ `request.isSecure()` 为假 ⇒ Spring Security 的 HSTS **一个字都不发**。
  #
  # 取值为什么是 `native`（Tomcat `RemoteIpValve`）而**不是** `framework`（Boot 的 ForwardedHeaderFilter）：
  #   · `framework` 会**剥离** `X-Forwarded-Proto/Host/Port` 这几个**请求头**，而
  #     `com.migao.admin.security.SameOriginOriginHeaderFilter` 是**直接读这些头**的
  #     （它的 `X_FORWARDED_*` 常量）—— 头被剥离后它退到 `request.getServerPort()`
  #     （反代后面是 **8080**，不是 443）⇒ 同源判定翻成「跨域」⇒ app 域页面（`/w/` `/b/`）
  #     对 `/api/**` 的写请求会被 CORS 拦掉（403）。那是**行为改动**，本单不拿它换一个安全头。
  #   · `native` 让容器按同一批头把 `isSecure()` / `getRemoteAddr()` 还原，**头保留** ⇒
  #     既有读头逻辑一字不改；对外可观察的变化只有「HSTS 真的发出去了」。
  #   ⚠️ `native` 只信任 `internalProxies`（默认含 172.16/12 等私网段）：nginx 容器在 docker 网络上
  #     ⇒ 命中默认值。若反代将来换到公网 IP 段，需显式配 `server.tomcat.remoteip.internal-proxies`；
  #     而「线上没带 HSTS」由 `deploy/scripts/prod-security-headers.sh` 判红（不会静默失效）。
  #   ⚠️ 与 `deploy/swas/nginx.conf` 的分工：**api 域**的 HSTS 由此发出，nginx 不许再加一条
  #     （重复的 STS 头按 RFC 6797 会被浏览器整条忽略）；静态域（app / merchant / ai-api）由 nginx 发。
  # 判据（会红）：tests/unit_ci_workflows/test_prod_security_headers.py（本行 + 线上探针脚本的接线）。
  forward-headers-strategy: native
  servlet:
    context-path: /
  tomcat:
    threads:
      max: 200
    accept-count: 100
  # ── 优雅退出（M1-b，issue #9098）────────────────────────────────────────────
  # 病：Spring Boot 默认 `shutdown: immediate` ⇒ SIGTERM 时**当场关连接**，在途请求被硬切
  # （用户侧看到 5xx / 半个响应）。发布期这正好撞在「容器重建」那一刻。
  # 现在：先停接入（不再接新请求），把**已经在跑的请求做完**再退出。
  # ⚠️ 「配了」≠「生效了」：docker 的 `stop` 默认 10s 后 SIGKILL ⇒ compose 侧必须同时给
  #    `stop_grace_period: 45s`（见 deploy/swas/docker-compose.yml），否则这里配多少都被砍在 10s。
  # 判据（会红）：tests/unit_ci_workflows/test_zero_downtime_m1_cutover.py
  shutdown: graceful

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: admin-api

  # 优雅退出的**时间预算**（M1-b，issue #9098）—— 取值理由（不是拍的数）：
  #   · 本服务最慢的**常规**请求（报表 / 导出 / 批量查询）现网长尾在数秒级 ⇒ 30s 有 ~10× 余量；
  #   · 最长的那种请求（SSE 流，最长 180s）**不走这里** —— 它们由 ai-agent 的
  #     `--timeout-graceful-shutdown 200` 承载，本服务只是转发（代理连接），不必按 180s 取；
  #   · 预算必须 **< compose 的 `stop_grace_period`**（45s）：docker 从 SIGTERM 起算等到
  #     stop_grace_period 就 SIGKILL ⇒ 应用预算留 15s 给 JVM/连接池收尾与 docker 的观测误差。
  lifecycle:
    timeout-per-shutdown-phase: 30s
  
  # 404 异常抛出配置
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  
  # PostgreSQL 数据库配置
  datasource:
    # stringtype=unspecified 使 PostgreSQL JDBC 驱动允许 String 参数隐式转换为 JSONB，
    # 修复 MyBatis-Plus + JacksonTypeHandler 更新 JSONB 字段时报错 "column is of type jsonb but expression is of type character varying"
    url: jdbc:postgresql://${RDS_HOST:localhost}:${RDS_PORT:5432}/${RDS_DB:ai_customer_service}?stringtype=unspecified
    username: ${RDS_USER:app_user}
    password: ${RDS_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 30000
      max-lifetime: 1800000

  # Redis 配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      client-name: admin-api
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5

  # Jackson 配置
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB

# AI 智能甄别服务（ai-agent-service）内部调用配置
# 服务不可达 / 未配置 token 时，入驻申请按 fail-closed 驳回（系统繁忙，可稍后重试）
ai-agent:
  base-url: ${AI_AGENT_BASE_URL:http://localhost:8000}
  service-token: ${AI_AGENT_SERVICE_TOKEN:}

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.migao.admin.entity
  configuration:
    map-underscore-to-camel-case: true
    # log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 开发调试时可开启，生产环境不输出 SQL
  global-config:
    db-config:
      id-type: ASSIGN_UUID
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置
jwt:
  # RSA 私钥（用于 RS256 签名）
  private-key: ${JWT_PRIVATE_KEY:classpath:rsa/private.pem}
  # RSA 公钥（用于验证）
  public-key: ${JWT_PUBLIC_KEY:classpath:rsa/public.pem}
  # Token 过期时间（秒）
  access-token-expiration: 7200  # 2 小时
  # 刷新令牌 = 7 天（用户 2026-11-24 裁定「小程序和PC端的登录有效期都改为7天」；此前 #7249 为 30 天）：
  # access token 仍是 2 小时（短凭据面不延长），靠 refresh 续；refresh 每次轮换并重新下发 7 天 cookie。
  refresh-token-expiration: 604800  # 7 天
  # 扫码登录票据 = 120 秒（issue #7825）：PC 已登录时给「手机端」二维码签发的**一次性**持有凭证，
  # 手机 H5 兑换后拿到的是上面那套 7 天会话；票据本身越短越安全（兑换即吊销，单次有效）。
  qr-login-ticket-expiration: 120
  # Cookie 配置
  cookie:
    name: access_token
    domain: ${COOKIE_DOMAIN:}
    path: /
    secure: true
    http-only: true
    same-site: strict

# 多租户配置
tenant:
  # 租户 ID 请求头名称
  request-header: X-Tenant-Id
  # 是否启用 RLS
  rls-enabled: true

# Service Token 配置
service:
  token:
    # Service Token 请求头名称
    header: X-Service-Token
    # Service Secret（用于验证服务间调用）
    secret: ${SERVICE_TOKEN_SECRET:${SERVICE_TOKEN:}}

# 阿里云 OSS 配置
# 入库标签（issue #5052 P2；设计 docs/design/inbound-photo-and-label.md §7.1）
# `GET /i/{短码}` 302 到落地页的**相对路径**（单一配置：换前端路由 / 换域名只改这一处，
# 已打印的码 `https://app.migaozn.com/i/<短码>` 那一跳一个字都不能变）。
# ⚠️ 用**相对路径**而不是绝对 URL：请求 Host 可伪造，拼绝对 URL = 开放重定向面。
# `/b/` 的发布腿（B 端 h5 落位）见 issue #5668；本包只保证地址**可配**。
migao:
  inbound-label:
    landing-path: ${INBOUND_LABEL_LANDING_PATH:/b/}

aliyun:
  oss:
    endpoint: ${OSS_ENDPOINT:}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    bucket-name: ${OSS_BUCKET_NAME:}
    url-prefix: ${OSS_URL_PREFIX:}
    # 双 Bucket 路由：永久存储（商品图片等）和临时存储（聊天图片等）
    permanent-bucket-name: ${OSS_PERMANENT_BUCKET:}
    temporary-bucket-name: ${OSS_TEMPORARY_BUCKET:}
  sms:
    access-key-id: ${ALIYUN_SMS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_SMS_ACCESS_KEY_SECRET:}
    sign-name: ${ALIYUN_SMS_SIGN_NAME:}
    template-code: ${ALIYUN_SMS_TEMPLATE_CODE:}
    # ⚠️ 万能验证码（POC 模式）：默认空 = 生产 fail-closed 禁用。
    # 仅 dev/CI 测试环境通过环境变量 SMS_BYPASS_CODE=123456 显式启用（如 backend/admin-api/.env）。
    # 生产环境严禁配置该变量；接入真实短信服务后整体移除（技术债 Issue #2616）。
    bypass-code: ${SMS_BYPASS_CODE:}

# 微信小程序配置
wechat:
  mini:
    appid: ${WECHAT_MINI_APPID:}
    secret: ${WECHAT_MINI_SECRET:}
  # B 端员工小程序（bmini，issue #2977）：注册后填 WECHAT_BMINI_APPID/SECRET；
  # 未填且 mock-enabled 时按 Mock 模式联调（同 C 端行为）
  bmini:
    appid: ${WECHAT_BMINI_APPID:}
    secret: ${WECHAT_BMINI_SECRET:}
  # Mock 模式（审计 07 P1-1）：默认 false = 生产 fail-closed。
  # 仅 dev/CI 显式设置 WECHAT_MOCK_ENABLED=true；生产未配 appid/secret 时 mini 登录直接拒绝。
  mock-enabled: ${WECHAT_MOCK_ENABLED:false}
  # 微信客服（qyapi kf）回调：第三方应用为 suite 级 Token/AESKey；receive-id = suiteid。
  # 未配置 ⇒ 回调端点 503（fail-closed），不影响其他功能。
  kf:
    enabled: ${WECHAT_KF_ENABLED:false}
    token: ${WECHAT_KF_TOKEN:}
    encoding-aes-key: ${WECHAT_KF_ENCODING_AES_KEY:}
    receive-id: ${WECHAT_KF_RECEIVE_ID:}
    # 凭据信封加密主密钥（SecretCipher；必填，未配置则启用时启动失败 = fail-closed）
    secret-master-key: ${WECHAT_KF_SECRET_MASTER_KEY:}
    # 接入页展示给客户复制（客户在企微后台「API 接收事件」/「企业可信IP」里手动填）
    callback-url: ${WECHAT_KF_CALLBACK_URL:https://api.migaozn.com/api/kf/callback}
    trusted-ips: ${WECHAT_KF_TRUSTED_IPS:}
    sync:
      claim-stale-seconds: ${WECHAT_KF_CLAIM_STALE_SECONDS:300}
    sync-interval-ms: ${WECHAT_KF_SYNC_INTERVAL_MS:30000}

# 日志配置
logging:
  level:
    com.migao.admin: INFO
    com.migao.admin.mapper: DEBUG
  pattern:
    # %X{requestId:-} = 每请求追踪 id（issue #6957）：有请求时**每一行**日志都带 ⇒
    # `grep <编号> 日志` 就能捞到这次失败及其 incident 上下文；无请求（定时任务）打空串。
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - [%X{requestId:-}] %msg%n"

# SpringDoc / OpenAPI 配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  default-produces-media-type: application/json
  default-consumes-media-type: application/json

# Actuator 配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
