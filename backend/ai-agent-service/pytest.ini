[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# ignore 清单单一来源（2026-08-29 收敛）：
#   tests/e2e/real/          真实环境，由 e2e-real.yml 单独调度
#   test_llm_pipeline / test_multimodal_content_handling  需要真实 LLM/env
#   test_e2e_chat_flow        自带 16 个 env 测试，但被 e2e/specs/test_tool_coverage.py import 作基础设施，勿删
#   test_post_deploy_verify / manual_test_pe_flow  手动脚本（由 deploy 后/人工运行）
addopts = -s --cov=app --cov-report=term-missing --strict-markers --ignore=tests/e2e/real/ --ignore=tests/test_llm_pipeline.py --ignore=tests/test_e2e_chat_flow.py --ignore=tests/test_multimodal_content_handling.py --ignore=tests/test_post_deploy_verify.py --ignore=tests/manual_test_pe_flow.py
markers =
    asyncio: marks tests as async
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    registry: tool registry completeness verification
    api: api endpoint integration tests
    scenario: business scenario tests
    enum_alignment: tool enum value alignment with admin-api
    permission: role-based permission control tests
    error_handling: error handling and graceful degradation tests
    sse: sse stream response format tests
    e2e: end-to-end full chain tests
