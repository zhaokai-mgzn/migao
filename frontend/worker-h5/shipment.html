<!DOCTYPE html>
<!-- 工人端 H5「发货」（issue #7761）—— 手机 / PAD 上的发货现场面：
     ① **全完工待发货列表**：订单内的多套窗帘**全部完工**（服务端判定）的才算数；
     ② 点一单 ⇒ **发货标签**预览（50mm × 70mm，DP235S 卷纸）⇒「打印标签」走浏览器打印。
     🔴 三条纪律（都落在代码里，不靠约定）：
        ① **筛选不在前端**：列表内容 = `GET /api/worker/shipment/orders` 给的行，本页不筛不排不补算；
        ② **标签行清单只有一个来源**（`shipment.mjs` 的 `buildShipLabelRows`）：预览与打印同一份；
        ③ **身份只由会话解**：请求里不带 worker_id / worker_name（`X-Worker-Session-Id` 由 api.mjs 统一带）。
     零依赖：不引框架；页面与 /api 同源 ⇒ 无跨域；纸型样式单独一份 `ship-label.css`
     （`@page` 只在本页声明 —— 放进 styles.css 会让报工页也被印成 50×70）。 -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="format-detection" content="telephone=no" />
  <title>发货</title>
  <link rel="stylesheet" href="./src/styles.css" />
  <link rel="stylesheet" href="./src/ship-label.css" />
</head>
<body>
  <main id="shipment-root" class="wh5-root"></main>
  <script type="module" src="./src/shipment-app.mjs"></script>
</body>
</html>
